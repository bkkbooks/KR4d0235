  text: 梅溪先生後集卷第十四
  hash: sha256:4bb4f4c41091dbe25ed75b95aa6050aaa7054ad22796faa747cd1cc7b89312f6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_014-1a}
body:
  text: 詩至日寄二弟雲物書何處山城白帝旁鬢絲驚漸短日線喜𥘉長江冷魚思復陽回堆戀行小舟吾已具命下即還鄉懷二叔二叔年髙甚天涯姪未歸一陽雲物動三峽夢魂飛丈室懷明慶巍樓上靜暉皇恩許歸去行矣叩林扉連日鵲喜東歸之祥也詩寄二弟烏鵲枝頭竟日喧皇恩應許返丘園荒蕪賦就同元亮歡喜詩成異審言定有好音來象闕愧無遺愛在夔門寄書預報梅溪弟灑掃吾廬辦酒尊白雲樓赴周漕飯追念行可不到西臺久傷心憶舊遊水流猶故沼行可嘗引水植蓮子池雲散只空樓丹荔誰祠柳今夏嘗同食新荔于池邊清亝不對周徘徊賦詩處淚下莫能收哭陳阜卿槐市聲名早儒林行藝尊麟經無絶學烏府有危言半歲甘泉槖頻年刺史幡凄涼道山舊今日幾人存識面登瀛日論心去國時孟軻非好辨每淂公書有楊墨塞路語羊祜有先知公在道山臧否人物有先見之明手筆今文伯神明古吏師老成嗟不見㳅淚讀招詞公嘗作招徐孺子詞我守番君國公時帥豫章詩筒續元白治境接龔黃㳅落來夔子傳聞侍玉皇北門方卧護帝忽遣巫陽邸報知凶訃傷心不忍言啚猶對徐孺人已喪陳蕃公前贈徐孺子啚杖屨欲三徑衣冠俄九原數行嬴博淚瞑目有餘痕公近喪長子蘿人贈范文正公集平生敬慕范文正遺像向來祠楚東蘿裏何人贈文集見公端似見周公食筍篔簹又復長纎纎頭角猶藏味已甜吾友子修三載别不知稚子幾根添著庭食筍記當年屈指交遊半鬼山昔與阜卿員仲諸公食筍于著庭謹護籜龍無恙否淂時張主想參天豫昔在著庭嘗禁取筍程太之有詩云著庭謹護籜龍兒飬就堅髙抗雪姿夔門雪裏竹萌抽味占盤飱第一流深憶江西陳仲舉如今無復寄貓頭江西貓頭笋極佳往在楚東阜卿每以見寄寇萊公取韋蘇州野渡無人舟自橫之句增為十字見于曽南豐所作公傳則知前輩作詩一言一句皆有來歷豫用其説為巴東詞記有新進士作詩云語當人意為佳句何與韋郎野渡舟用其以解嘲野水再經吟咏手一般景象兩般舟萊公相業韋郎句付與詩人子細搜夔硯有以硯來售者曰歙石璞稍巨色青而文細光潤而發墨兒曺買之或曰非歙硯乃忠万石耳豫莫能辨淂之于夔目曰夔硯因讀少陵平公淂硯詩則知三峽古亦出硯也詩以記之一片夔州硯千年禹鑿痕平公見爾祖王子淂其孫銅雀今安有羅文世所尊聊同玄頴輩文字與吾論聞韶美侍郎易任廣漢帝眷甘泉舊綸恩換虎符神應馳北闕眼已見西湖漢有西湖霖雨思賢甚仙槎到漢無書梁形蘿寐大厦待公扶閲報之夕蘿韶美大書兄字于梁間書𣣔臨卭去公俄廣漢行湖欣遇房相詩擬和劉兄為郡人生貴還鄉晝錦榮無從陪杖屨老我𣣔歸耕臘日與同官小集八陳臺觀武侯新祠伏幾何時臘又逢天涯尊酒記遊從未於山下祠黃石且向江濆謁卧龍青眼共看官舍桞白頭相對雪天峯虎符碩逐桃符換万里歸心一片濃梅雪同僚文字三杯酒臘日江山八陳臺冷有人嫌吾似雪清無塵染客如梅十八日迓虞參政于西城竹亭去歲亦以此日送之兩年此日此江濱賔迓向來歸去賔兀坐茅亭竹應笑林間不著送迎人讀東坡詩學江西詩者謂蘇不如黃又言韓歐二公詩乃押韻文耳豫雖不䁱詩不敢以其説為然因讀坡詩感而有作東坡文章冠天下日月爭光薄風雅誰分宗派故謗傷蚍蜉撼樹不自量堂堂天人歐陽子引鞭遜避門下士天昌斯文大才出先生弟子俱第一天人詩如李謫仙此論最公誰不然詞無艱深非淺近章成韻盡意不盡味長何止飛鳥驚臆説紛紛幾元稹有言歐公詩味短者王介南云行人舉頭飛鳥驚之句味亦甚長渾然天成無斧鑿二百年來無此作誰與爭先惟大蘇謫仙退之非過呼胸中万卷古今有筆下一點塵埃無武庫森然冨摛掞利鈍一從人點檢莫年海上詩更高和陶之詩又過陶地闢天開含万彚少陵相逢亦應避北斗以南能幾人大江之西有異議日光玉潔一退之亦言能文不能詩碑淮頌聖十琴操生民清廟離騷詞㫪容大篇騁豪怪韻到窘束尤瑰竒韓子於詩蓋餘事詩至韓子將何譏文章定價如金玉口為輕重専門學向來學者尊西昆詩無老杜文無韓淨掃書亝拂塵几瓣香敬為三夫子除日蝸舍三年别夔門兩歲除盆雖具肴簌儺不是鄉閭櫪馬喧新集桃符換舊書何如杜陵老守歲阿咸居元日元日年年見天涯意故長詩篇示宗武春色酌瞿唐白髮又新歲黃甘非故鄉弟兄團拜處歸去碩成行酒名瞿唐春趙果州送黃柑金泉酒元日書來自果州甘三百顆酒新芻賢於齊下六從事好似平陽千戶侯老矣惟思醉鄊去歸歟且種木奴休使君厚意吾先辱愧乏瓊瑶報所投四日雪坐間有江梅水仙花因目曰三白孤標相對楚天涯寒不能威意自佳消淂廣平公援筆此花真是鐵心花右梅花葉抽書帶秀文房玉表黃中耐雪霜淂水成仙最風味與梅為弟各芬香右水仙花不來平地只山巔端為民貧故見憐未到立春猶臘月忽成三白定豐年右雪人日遊磧好遨蜀風俗夔人貧亦遨今日日為人傾城出江臯遨頭老病守呼賔酌春醪歸來及𥘉鼓繁燈照霜毛榖日立春榖日逢春日江天弄佳氣𬞞盆雜蒿韭一箸異鄉味西疇農事動問我歸何未豈無二頃奚用五馬貴雙鵲雙鵲喳喳首向束似將喜報主人公主人只欲東歸去歸作左原田舍翁王撫幹蒙贈蘇黃真迹酬以建茶蘇黃文章外翰墨亦莫加蘇淂魯公法黃自成一家肥無塵俗點瘦或風雨斜可愛如其人敬之無邇遐真迹落人間蔀屋生光華我無一字藏天遣來三巴吾宗東州秀文翰俱可嘉袖中出至寶雙眸洗昏花歸槖今不貧持柱東南誇何以報嘉貺龍團建溪芽豫雪詩云不來平地只山巔朱鈐幹和云不能下乞俗人憐志在潔已陳知録云只可在山如去年志在恤民王撫幹云散作人間大有年志在潤物三子之志雖不同皆可嘉也各用其句作三絶以贈之又以一絶自貺無喧室對山頭雪雪照無喧室湛然高潔似人人亦似不能下乞俗人憐右贈鈴幹不道世人貧可憐亂飄宇宙􅊜厨煙居高潤下澤自普只可在山如去年右贈知録時哉臘後立春前散作人間大有年會合風雲灑天外不須只在蜀山川撫幹未嘗出蜀故勉之右贈撫幹在地在山無不可去年今年同不同銀杯縞帶逐車馬何似蓑笠隨漁翁右自况春雪禁體物立春三日餘霏霏下人間胡不瑞嘉平天於此偏慳忽從何處來頃刻堆塵寰投隙妙能入遇圓巧成環侵凌到肌骨點綴生容顔凝積遽如許掃除良亦艱牧羊念大窖擁馬愁藍關我時巴峽觀眩晃迷江山認峯失白鹽問俗非烏蠻豈無興可乘扁舟正冝還十四日登真武山山中松柏幾經春壁上龜蛇妙入神羽士相看笑相語使君老似去年人白鹽卓立群峯外真武山頭平視之試上白鹽峯頂望未知真武孰高卑瑩煌燈火如星斗夜夜人間望此山來向元宵試燈火却移星斗下人間秃筆管城人已老後輩頗相侵問汝中書否猶言欲盡心二月朔日詣學講堂前杏花正開呈教授孔壇昔栽杏魯人呼東家當時三千株化工無等差雩風長其實教雨濯其葩木與聖化俱芬芳無邇遐數株能白紅開向天之涯况於芹藻間相看意殊嘉對之懷哲人甘棠何以加不比曲江春秪名及第花又異仙家桃徒爾蒸紅霞碩言廣封殖夔魯同光華泮宫杏花乃閻𬗋微為教官時所殖復用前韻同年𬗋微公昔遊帝王家穿楊百步間妙不毫釐差桂窟擢高枝杏園賞仙葩手移曲江根不憚川塗遐翺翔夫子壇栽植泮水涯花好實亦成諸公欣拜嘉我耒節中和數樹紅交加不見𬗋微郎如對𬗋微花滿堂爛銀𫀆賦詩麗綺霞大勝瓜李桃欲報無瓊華甘露堂前有杏花一株在修竹之外殊有風味用昌黎韻桃李未吐梅英空杏花嫣然作小紅孤城絶塞也不惡一株綽有仙家風高枝半出修竹外醉臉略與江梅同夔州花木不多有封殖嘉樹知誰功春光忽到刺史宅天氣正在中和中不同浪蘃落瘴霧自有甘露滋芳叢我來歲律驚兩換歸興遙指吳江楓曲江往事何足蘿願為老圃安吾窮明年花開我何處小園數畝蕭臺東蒼蒼煙雨記巫峽酣酣詩句吟梅翁梅聖俞詩杏花酣酣春正明送王撫幹行甫之子來夔子春江又緑波分符慚政拙贊畫賴才多翰墨妙揮染詞章工琢磨扁舟先吾去送别奈愁何郡圃無海棠買數根殖之少陵詩史有遺闕海棠名花輒湮沒孤芳千載逢蘇仙竹籬一笑嫣然發我從蜀錦亭邊來范文正公守番昜種海棠于郡圃名亭曰蜀錦遙入蒼蒼煙雨窟綺霞曉抹神女肌香醪春醉明妃骨鮮鮮絲蘃垂更嫋點點燕脂勻未歇半含𣣔吐不勝情沐露梳風睡明月為開酒尊苦多病欲插一枝羞白髮照眼千株未觀蜀回首十年深憶越往在會稽訪諸名園海棠最盛何人好事呼名友姚魏不容矜閥閲曾端伯十花詞目海棠日名友牡丹不與凝香有地胡不植負郭無園何處謁不煩飛鵠䘖子來自買芳根帶花掘明年髙堂來燕子想見繁紅映林樾栽花老守在何許堆蕩山中采薇蕨慿誰為問花消息有蘿遙驚山突兀自慙不是召伯棠那淂詩人歌勿伐哭純老永嘉僧住福州夀山豫表叔也有名行忽淂潛澗書驚聞壽山死開書未終讀老淚灑盈𥿄夀山僧中傑蕭灑如晉人識高行孤潔胸無一點塵少年赱江湖叢林參大士莫年住甌閩道價高逺邇桑下不晉戀急流猛抽身我欲挂衣冠歸歟逺公親遽聞新塔成巳葬堅固子無由訪圓澤空對瞿唐水次韻喻叔竒松竹啚只應王子猷相愛未許秦皇帝可秦畫我同年作三友歲寒節操宰官身寄巫山圖與林致一喻叔竒啚畫巫山十二峯緘題遙寄舊遊從煩君子細看山色不似老夫歸意濃數千里外共明月十二峯頭望故鄊我對此山無蘿寐蘿魂只在堆山傍夔路十賢屈大夫大夫楚忠臣哀哉以讒逐遺廟大江濆醒清今古獨嚴刺史顔將軍頭可斷詎肯以城降斯可為忠矣至今名此邦諸葛武侯卧龍起南陽不為鼎一足託名蜀丞相相漢非相蜀少陵先生子美稷卨志空抱竟無用夔州三百篇高配風雅頌陸宣公敬輿避讒謗閉門不著書活人集名方炳然仁誼餘韋丞相處厚韋侯守盛山賦詩十二首能以堯事君遂令詩不朽白文公賦詠窮三峽樂天在忠州苟不以直道亦如元與劉柳文公柳公本書生忠勇著嶽鄂盛山戮姦吏餘威震夷落寇萊公萊公經濟業志在巴東詩斯人不復見亭上秋風悲唐質肅公子方筮仕𥘉牛刀割魚復一朝峩豸冠風采百僚肅續訪淂七人宋大夫玉述志哀正則陳詞諷靈修讀君九辨章悲楚非悲秋源丞相乾矅傑人掾夔子相業光開元故宅半赤甲荒涼今不存事見李貽孫夔州斤壁記李左相適之罷相避同列銜杯樂聖人那知偃月堂中有丞相瞋李丞相吉甫公在忠州日人高長者風忮心無後段寧愧贊皇公溫御史造誰坐繡衣石曽落金吾膽不戮擁靴人至今有餘憾程伊川軻伋誠明學弟兄傳以心易微於九師閉門自鈎深黃太史豫章官逸逺直筆非謗史天遣來黔涪詩鳴配子美柏架青銅柯葉勝杉松帶淂清凬下卧龍日莫微涼起高架移床却扇坐從容次韻林江州題高逺亭眼明廬阜翠橫空疑是雲頭屹夏峯遺迹君應懷聖治聖治峯在太平興國宫故家我亦念歸宗山南歸宗寺乃逸少舊隱遙瞻瀑水三千尺猶隔巫山十二重亭上主人高更逺天然丘壑在心胸登制勝樓梁棟翬飛百尺樓江山滿目壯夔州鳥穿雲過白鹽去魚透浪來清瀼遊控扼地臨三峽險朝宗水會百川流古今制勝人何勝天下竒才忠武侯再用前韻下視瞿唐縹渺樓規模雄壓十三州良籌合向暇時運緩帶冝來高處遊列障四時環坐好大江千古抱城流後山植木成隂日誰識十年前故侯送宋山甫知縣君住眉山我永嘉老來邂逅楚天涯無詩不和已成杜有酒相呼如在家官聀未高名滿蜀人才如許邑為巴且將異日作霖手潤澤河陽一縣花六月一日天涯逢六月深憶别家時甲申六月一日離家行也亦云逺歸歟何太遲殊方最炎熱多病想扶持天遣西來意端令啖荔枝是日食新荔枝食荔枝荔枝𥘉熟飣金盆手擘輕紅子細看凬味由來太竒絶不教容易到長安妃子園中荔子竒莫因名號起猜疑清時入坐非尤物一洗煙塵賴好詩詩史堂種幾時輕紅曽入少陵詩殊方競續櫻桃獻万樹爭先爾獨遲拾荔枝核欲種之戲成一首海味正思瑶柱美夔門又見荔枝紅炎方入貢自妃子郡圃欲栽如白公樂天種荔枝于忠州有詩官滿猶為十年計實成須待二星終不須更論何時喫前種後收人我同樂天戲楊万州種荔支詩云聞説万州方𣣔種愁君淂喫是何年幼女生日林鍾蓂四莢吾女此時生日向炎天永月從前夜明提携仰慈毋教誨賴諸兄碩汝康而夀人如少藴清詩史堂荔枝歌君不見詩人以來一子美莫年流落來夔子賦詩三百六十篇西瀼東屯客愁裏何人作堂畫遺像收拾光芒榜詩史堂前何有有荔枝樹猶未老熟獨遲世人貴早不貴晚倘非我輩誰賞之涪陵昔遭妃子汚万顆包羞莫能訴瀘戎一經少陵擘至今傳誦輕紅句少陵傷時淚成血一點丹心不磨滅散成朱實滿炎方凬味如詩兩竒絶樂天曽畫忠州啚自言香味人間無樂天詩云爵疑天上味嗅異世間香君謨亦作閩中譜陳𬗋聲名重南土何如詩史堂前株正是一飯孤忠餘人為世重物亦重端如丈人屋上烏巴啚閩譜合避路奚用品第分錙銖攙先熟者如楊盧但可與之作前驅閩娘十八婢妾爾將軍大樹真傭奴我生四百餘年後來作先生遊處守登堂三嘆荔正丹聊效栁人祠子厚安淂先生今復生添賦夔州歌一首少陵有夔州歌十首要使荔枝之名長不朽周行可挽詩我始來夔子公先在計臺江山同吊古文字共銜杯馬運言尤力天高聽未回懷人蘿不見西望肺肝摧大事同生日佳城近故丘空留丹灶藥忍望白雲樓偃折恩誰繼澄清志未酬傷哉􅌾元伯執紼竟無由過客談梁彭州之政不容口聞為虗額所困欲引去豫碩其少晉以福千里輒寄惡詩籍甚吾年友彭州譽正馳那因困虛額遽欲丐真祠勿謂徒勞耳終須曰教之家傳治稱最自有九重知食薏苡粥夔州再見夏炎瘴侵我肌兩股忽浮腫百藥竟未治或言薏苡良可以作粥麋恐坐伏波謗腹中有珠璣十賢堂栽竹六月修篁帶雨移丁寧護取歲寒枝十賢清節髙千古不是此君誰與冝詩史堂荔枝晚熟而佳預約同官共賞偶成參差摘實分餉因誦廬陵先生詩云人生此事尚難必况𣣔功名書鼎彛復用前韻以歌之詩史堂前荔支晚尤美髙壓瀘戎與妃子姓名猶未聞峽中風味惟應自皮裏試將逺况江瑶柱正似騷人擬良史我來嘆息頥屢支殊方爭獻惟恐遲汝今已晚何用好不是少陵誰眼之貴妃遊魂遭血汚五坐悲懷何以訴惟有雲安再拜人悶解夔州兩絶句少陵夔州解悶十一絶及荔枝若二遺像空存食不血滿目煙霞明自滅何人種此星幾終一樹團團味竒絶君不見南賔木蓮有華何足圖樂夫過慮重看無樂天在忠州畫荔支木蓮二啚水蓮詩云山中風雨無時節明日重看得在無又不見洛陽牡丹妖艷何必譜六一區區記風土天生此果更此株夏日之時見子餘趙襄子書疑炎方張火傘夕訝庭樹栖赤烏雙頭瑩若玉一瑴細骨輕於錢五銖陳江閥閲如崔盧兹産於閩必爭驅甜無中邉大勝蜜醖釀不假蜂為奴永安宫西郡掌後折簡呼賔老太守時方炎熱會苦稀事好乖違意徒厚手摘髙枝贈丹實歌和前篇搔白首嗟一餉之樂兮天亦慳於老朽伏日與同僚遊三友亭炎天過小雨伏日生微涼新亭會僚友故事開壷觴用番陽四望亭去年瑞白堂故事泉汲卧龍乳茶烹團鳯香緬懷去年今跳珠出詩章分韻得炎字兩載夔子國尤苦夏日炎稚金又云伏老夫猶未潛呼賔江上亭風雄雨纎纎仰知九重心勃欎念閭閻上在潛底作明遠樓詩云閭閻多勃欎有愧此間身制勝樓有元豐間太守王延禧及計臺郡僚過客唱和詩大書于版歲久事漫命筆吏再書之記以𢾗語周室禾黍過者傷漢宫威儀見之喜神州久沒餘楚蜀太平聲詩存有幾制勝樓頭詩數版仍是元豐舊臣子體尤猶存前輩風氣象如樓頗竒偉人雖不見典刑在事尚能言文獻是歲月侵尋自漫滅愛禮存羊那忍毀百年陳迹一旦新不問升沉與工鄙一洗向來官職眼獨刋無盡張居士張無盡詩獨刋石雷聲雷已先聲雷隱隱雨宜灑道即紛終為言風伯不須怒天下蒼生正望雲某二年于夔竊食而已無德於民尤無功於學校泮宫諸生相與肖其象而祠之意固厚矣然非所宜得呈蘇校授一麾出守喜來夔日與諸生泳聖涯竊取於城勉忠孝來能如衮進文詞從公于邁誤成頌爾貌不揚何足祠為語廣文休作記粗沙大石定磨碑聞得吳興莫年身似杜陵翁㳅落烏蠻白帝中聖主哀憐不終棄乞祠却得水晶宫七夕呈同官今夕何夕夕云七天孫有巧不碩乞舉杯遙指河漢頭但碩歸耕學牽牛我無腹中書可晒亦不曬衣隨俗輩緱山未訪仙祖遊夔門聊與嘉賔會星河動搖三峽流人間天上同新秋鵲巳成橋動歸翮我亦一枝栖可得時聞昜任浙西遂可還鄉矣别夔州三絶朅來夔子兩經年恰是忠州白樂天種柳栽花一般意愧無名德比前賢夔峽民淳獄訟稀使君無事只吟詩才踈政拙形容陋深愧邦人為立祠陳圖入眼渾如夢回首江山又夢間万里白雲遮望眼贈牟童子牟家六歲好男兒誦得夔州太守詩好把五車書盡讀早成頭角上天池别同官兩年竊祿古夔州邂逅諸君亦宦逰為郡不才真下下同僚多助却優優及瓜便合扁舟去行李聊為一飯晉摻别相期可無語君親恩重各冝酬梅溪先生後集卷第十四梅溪先生文集卷第十四䇿問問朝廷之患莫甚乎朋黨人臣之罪莫大乎植黨為人君者常惡朋黨而鋭意𣣔去之矣方其上塞下聾之時曽莫悟其為朋黨雖𣣔去之而不可得及一旦悟而盡去之可為朝廷賀矣而一黨去一黨生雖能去其前日巳然之黨終莫能絶其後來將成之黨夫如是則朋黨為朝廷患迄不可去𣣔望天下之治其可得乎漢唐明黨之禍言之可以痛心固不必論也我國家纍世以來亦不免兹患賴祖宗神聖能分别邪正雖間有牛李之交攻而不蹈蹈漢唐之覆轍亦社稷之幸也當時聖主賢臣固嘗講論之矣謂方以類聚物以群分邪正各為一黨者范文正公仲淹告仁宗之言也謂君子無黨譬諸草木稠繆相附者必蔓草非松柏者滕公甫告神宗之言也謂小人無朋惟君子有之者歐陽文忠公之論也三人之論其不同如此未知其孰然而孰否耶豈時異黨異其言各有旨耶方今朝廷清明固無朋黨之患矣然士君子私憂過計猶或及之彼范滕歐陽二公之論朋黨世以為名言而一以為君子無黨一以小人無朋一以為君子小人各有願辨其不同者而折以至公之論將以獻于朝問信聖人之為聖人不若知聖人之為聖人學者皆謂夫子大聖人也是特因前人之言而信之爾實不知夫子之所以聖也讀其書考其言觀其行事合於吾心者信之不合於吾心者疑之合於吾心而信之知聖人矣因其疑而求之遂得其為人是亦知聖人也苟徒信其為聖而不敢詰其疑謂之知聖人可乎謂之善學可乎夫子之始末莫詳于世家抑嘗讀之矣而未免乎疑庸可以不辨子嘗適周矣及其施也老子以言送之曰聰明深察而近於死者好議人者也博辨廣大而危其身者好發人之惡者也老子之言似不徒發必有以針夫子之失使夫子果有此失豈足為聖人乎此不免乎疑也子嘗用於魯矣𣣔墮三都以張公室墮費而費人畔墮成而成不受墮孰謂真儒之謀謨措慮乃若是之踈乎此不免乎疑也及季孫受女樂而怠於政子路勸夫子可以行矣夫子猶待乎膰肉之至魯不致膰夫子遂行受女樂而不朝罪之大者也膰肉不至過之小者也忍其大而不忍其小真儒之去就果如是乎此又不免乎疑也衛靈公問陳夫子答以爼豆及羅蒲人之難乃勸靈公伐蒲夫子豈致私憾於蒲而忘爼豆之言邪豈不害夫子之仁心耶此又不得不疑也夫子萬世之所取法者也苟信其可疑之迹而施諸行事不免乎惑矣諸君皆學孔子者也豈徒信之云乎碩質其疑而究其用心處問唐人劉禹錫嘗序栁宗元之文其言有曰文章與時髙下三代之文至戰國而病涉秦漢復起漢之文至列國而病唐興復起果如禹錫言則文之髙下實係乎時也及先翰林蘇軾記韓文公之廟其言則曰自漢以來道衰文敝歷唐正觀開元之盛佐以房杜姚宋而不能救公起布衣談笑而麾之天下靡然復歸于正果如軾言則文之興衰又左乎人也嘗因二子之論而驗其時與人必劉子之言是信耶則吐辭為經如孟荀二子實戰國人也戰國之分裂能病天下之文曷為不能病二子乎必蘇子之言是信耶則戰國二儒賢過韓愈愈能起八代之衰而二儒乃不能起戰國之病何也我國朝四葉文章最盛議者皆歸功於仁祖文德之治與大宗伯歐陽公救弊之力沉浸至今文益粹美逺出乎正元元和之上而進乎成周之郁郁矣是果時耶人耶二者若兼有之與劉蘇二子之説又皆不同何也碩與諸君辨之問儒者法周孔攻異端自謂能舉天下於仁義觀其言於未試之前人皆周孔也驗其事於巳試之後反有愧於異端者多矣請借漢以論之髙帝之得天下與其所以治之者皆山東刀筆吏也當時儒者獨一叔孫博士然其器業鄙陋君子不取焉其不逮簫曾逺矣孰謂儒者學周孔道反刀筆吏之不如耶文景致治比周成康二君未嘗用儒顧其所尚者黃老之術也逮孝武好儒公孫洪之徒用事課其治效不逮文景逺甚孰謂儒者之道反不若黃老之淸淨耶宣帝中興侔德啇宗周宣亦未嘗喜儒顧其所用多刑名法理之士也逮元帝用儒貢薛韋康迭為宰相而帝牽於文義優遊不斷孝宣之業衰焉孰謂儒者之道反不若申韓刑名之學耶儒平昔鄙刀筆吏而不齒絀黃老申韓而不談一旦設施反出其下寧不愧哉或謂漢所用者類皆俗儒使得真儒如周孔者用之當無敵於天下矣嗚呼語儒必曰周孔是無儒也自周孔而下豈無可用之人哉諸君皆業儒者也群居暇日自尊其教者良不淺敢問漢朝諸君不用儒者曷為而不失乎治好用儒者曷為而未免乎説是果儒者之罪耶抑用之不得其術耶將所用者非君子儒耶願詳辨之勿使學異端者得以藉口而病儒也問宰相之職所以代天秩物也自非才德之全渠可膺是選耶昔舜舉十六相其相與致無為之治者才五人周家最號多士其可稱者九人而已信乎其才難也三代而下莫盛於漢唐宰相為不少矣獨簫曺為開基之冠丙魏有聲於中興房杜稱於前姚宋稱於後他皆不足以預是列也切意八人者必才全德備之君子及考二史乃或不然簫何止於定畫一之法曺參止於守清淨之冶魏相尚威嚴丙吉務寬大房玄齡善謀杜如晦能斷姚崇長於應變宋璟長於守文各以偏長而致相位卒能處才難之極選為天下之名臣使萬世想慕其風采常若不可及者何耶我宋二百年間大臣輩出殊勳盛烈皆逺誇漢唐數子而與虞周之臣相揖於千載之上一何盛也主上自中興以來斯然不惟群議之惑專任一相以致治虛右揆以待賢者幾數年矣豈非遴代天之選必求才德兼全之人而後用不容碌碌輩伴食於其間耶然舜得五而武王得九漢唐創業中興之主亦各得其二主上聖德之盛文治之美不在舜武之下其得人之多反漢唐不及何耶漢唐八人非全才不害其為致治主上必𣣔擇兼全之士而遴選如是抑又何耶願與諸君論之將獻其説于上問人主之職莫大於論相論相之術尤古人之所難也古人有以是得之者將襲其迹而用之其失或在於是古人有以是失之者將矯其弊而革之其得或在於是將取之於人望歟晉室之謝安李唐之房琯其為人望一也將取之於治績歟曺參之治齊黃霸之治郡其為治績一也將取之於相門歟伊尹之後有陟孔明之後有瞻其為相門一也將取之於薦舉歟房元齡之於杜如晦崔祐甫之於楊炎其為薦舉一也此四途者皆人君取相之要術世之獻議者亦必援是以為言然古人有以是而得之者有以是而失之者其事之相反如此庸可不求其故歟問刺史者政教之首民之師帥也一州得才刺史則十萬户蒙其福得不才刺史則十萬户受其困國之興衰民之治亂實係焉此其為任也顧不重歟漢宣帝唐太宗古之善治者也皆重刺史之選宣帝嘗曰庶民所以安於田里而忘歎息愁恨之心者政平頌理也與我共此者其惟良二千石乎故有治理效者輒以璽書勞勉增秩賜金公卿缺則選而用之唐太宗嘗曰朕思天下事丙夜不安枕永惟治平之本莫重刺史故録姓名於屏風卧興對之得才否狀輒疏之下方以擬廢置若二君者可謂知致治之要矣故神雀五鳳之間吏稱民安而正觀之治庶幾成康職此之由也我國家致治之美逺邁漢唐二千石以循吏稱者逮不可以一二數主上中興以來尤重承宣之寄邇者臺章劾罷守臣之不才者無慮數輩州郡肅然將見共理之效凛凛乎宣帝太宗之上矣諸君皆學以入政者也其履歷當自州縣始敢問宣帝時選公卿于刺史者有幾太宗時得才否狀而廢置之者有幾當時以循吏稱者凡幾輩其治效最優者果何人漢唐得人之盛與今日孰優劣碩併陳之將獻其言于不諱之朝問昔劉項之爭天下也項以氣力自任屢窘劉于掌握間卒之劉興而項滅者漢屈郡䇿而楚憝之也嘗觀劉氏之窘莫甚於鴻門之會與榮陽之圍非樊噲以巵酒譙羽紀信以黃屋誑羽陳平以隂謀疽范增則當時天下不漢而楚矣然髙帝論得天下乃人傑簫張韓三子而不及噲輩豈忘之耶丁公嘗窘帝矣帝以一言祈哀而丁公舍之及天下既定乃戮丁公以為不忠於所事議者以帝為公殊不知使項失天下者乃項伯爾項莊之劍不得逞亞父之計不得施由項伯翼蔽之也是豈忠於所事耶戮丁公而封項伯一定以示公矣窘巳而舍之帝以為使項氏失天下者在彼脫已而生之則帝之所以得天下者寧不在此耶鴻門榮陽之急楚漢得失之機會也帝折髙起王陵之言謂知其一而不知其二且謂所以得天下者在三人傑三傑固有大功于漢然取此而舍彼似亦不知其二者帝之戮施於丁公冝矣而失之項伯得天下之論施於三傑當矣而遺彼三人然則帝之一封一戮或取或舍其必有深意乎碩與諸君辨之問漢之文宣唐之太宗在三宗七制之中尤為傑然者非中才之主可得而擬議也班固嘗贊文帝矣則曰專務以德化民崔實嘗論宣帝矣則曰算功計效優於孝文歐陽文忠公嘗贊太宗矣則曰功德兼隆由漢以來未知有果如三子之言則文帝以德優而宣帝以功顯太宗功德兩全又在文宣之上矣今讀漢唐二史而求三君之事業文帝所以化民者果何德宣帝所以優孝文者果何功太宗功德兼隆過漢諸君者果何事三子之言果公於品藻歟其出於臆見之私歟抑亦一時之議論務在推崇而未足以盡三君之優劣歟願聞折衷之説問東漢之為國也其風俗與西京不同其過之者一而不建者二西京之文章最為近古東都雖溫雅如班孟堅巳不及楊馬輩况崔蔡而下氣象委靡邪其文章之不建有如此者西京建功立名之士咸有可觀東都雖大臣如陳蕃竇武手握重權而不能去奄寺之禍况才踈意廣如孔文舉輩冝其迄無成功其功名之不逮又有如此者然其所以逺過之者凛乎節義之風爾議者咸謂光武能崇尚名節而髙帝好慢罵儒生此節義所以有無於東西都也然東都之學校非不盛於西京其投戈息馬以激勸之者非不過於無用詩書之世有意於斯文乃反不逮之何耶光武身濟大業若無愧於髙帝而一時依乘風雲者又非無髙勳鴻烈以為之唱而後世建功立名之士又皆西京之不若何也夫所謂風俗者一而巳矣上以是而率下以是而應蓋理之必然者光武能作成其一而不能其二是未免有可疑者焉豈三者身雖兼長其所以化民成俗者乃有能不能歟豈上之所以化者雖出於一而下之所以應者自有不同歟抑數者各繫乎人之能否而不在乎時之作成歟願辨其所以過之與不逮之由以教問萬物盈天地之間而其用最大者曰五行其名首見於大禹謨其次見於淇範又其次見於月令至其次序則互有不同大禹謨則先金而後木洪範則木三而金四至於月令則以木為首火次之土次之金水又次之五行一也而其序不同如此其必有説乎夫禹箕子吕氏三人者意殊而言異容或有説至於洪範出於一箕子之言而五行五事之序乃相背戾五事屬五行其序亦當如之彼一水二火則此一聽二視可也彼三木四金則此三貌四言可也而乃先後不令何耶五者流行乎天地無所不在非他物可擬而六之至於五榖之類亦出於土而巳故洪範曰士爰稼穡而禹乃以榖配五者抑又何耶箕子之洪範即禹之九疇也禹餋民之政即天之所錫者是也禹曰六府而箕子五之其數巳不齊矣則其他八類又烏知其必然耶禹箕子所陳之序雖不能無少差至於土也則皆列於苐五蓋合於易天五之數矣而月令乃置土于中央火金二物之間是豈合於天地生成之數禹箕子所陳之敘耶學者論五行皆本於三家之書而其次與數乖刺如此又庸可不究耶合三者之異而一之必有至當之説問世之語治者必曰堯舜二帝之事業備見於典謨粲若日星千載之所同仰也然後世有斷簡出於枯冡異論起於弄筆生誣盛德而惑信書庸可以不辨堯授舜舜授禹遜位傳賢最為帝王之美事而瑣語有舜放堯之説大戾於孔氏之書論者遂援囚堯之地疑重華之不臣因蒼梧之巡疑文命之異志果如其言則將遜于位遜德弗嗣稽首固辝皆當時之飾偽乎帝王之聖莫大於知人堯舜俱以聰明稱者蓋在於此然佐氏載季文子之言謂堯有元愷不能舉有四凶不能去語稱舜舉臯陶不仁者逺説者遂謂君子小人比肩同列于堯世臯陶未舉之前而不仁者甚多果如其言則克明俊德與夫明目逹聰又皆虗語乎不持此也夫子嘗稱堯舜垂衣裳而天下治及其序書則不見其無為之迹於堯典則載其親九族和萬邦於其始命羲和授人時於其中咨四嶽治洪水於其終於舜典又載其齊七政類上帝命九官五載一巡守於受命之後堯舜之時亦多事矣垂衣而治果如是乎書經聖人之手而言迹猶不同况責後世之異論乎以堯舜之聖斷無可疑之實如汲書之誣唐人之疑者然不可無説以破之至如繫辭之稱與書矛盾必有深辭奧旨又不可以不究也問自古天下治亂常分於君子小人進退之間而人君之患每在於君子小人之難辨昔周公大聖人也猶困於管蔡之流言不能以忠自明至狼跋於周非天動威以彰其德則成王幾負公矣魯大夫少正卯行偽而堅言偽而辨魯國之人皆以為大賢獨吾夫子察見其肺肝之隱以七日司冦而行兩觀之誅夫君子小人之難辨正在乎心迹疑似之間使成王非天魯無孔子則周公少正卯之為人孰有能辨之者然世之大忠大姦如二人之疑似者類多有之不幸遇中材之主如成王不知人之明如魯國上天又不能諄諄然動威以告之而大聖人如吾夫子者且不世出則舉朝謂之姦者安知非忠舉朝謂之忠者安知非姦如之何其辨之邪至若漢昭年才十四能覺上官之詐而悟大將軍之忠此蓋千載一人而巳後世莫知其何術而知之也唐德宗以強明自任反見欺於盧杞天下皆知其姦而帝獨不知夫姦臣之為人必有以盜名欺世動移人主之聽如杞不學無文容貌言語皆不足以動人而德宗獨信任之堅人莫能搖此又何也嗚呼人君孰不𣣔興治而除亂崇君子而黜小人然擯斥誅夷常及於君子而穹位濃祿每加於小人者豈不由知人不明無術以辨之耶夫𣣔使人君不待天威之動而辨大忠於讒言交亂之時不待將聖之生而辨大姦於欺世盜名之日有孝昭獨見之明而無德宗偏任之蔽將有術以傳之耶將無術以傳之耶願講明其説以獻于朝問洙泗大儒既沒褒貶之筆失傳龍門太史公不生實録之筆遂絶嗟乎世衰道微非獨聖人不得而見至良史之才亦不世出也國朝四葉人文最盛歐陽宋二公以巨儒修史號為得人唐五代二書法度森嚴議論至到真可與馬遷爭衡使班范北面奴僕命陳夀以下也然讀二史者亦不能無疑於其間唐太宗固不世英主然慙德在父子兄弟間史贊不少加貶反捃托其好大喜功與復立浮圗二事赦大罪而貶小惡豈春秋褒貶法良史直録筆耶陳子昻乃一代儒宗其勸武后興明堂太學實盛典也史乃謂其言甚髙殊可怪笑比之薦圭壁於房闥苟謂武后不足以王道勤則孟子以仁義勸戰國之君又寧逃怪笑之域耶肅宗復兩京李泌之謀居多論者謂功大於魯連范蠡史贊泌乃略不假借方且異其為人謂近髙近智近立功立名者何薄泌之甚也劉蕡廷對過漢朝董最布衣之所難言亦忠臣義士所當言者史乃譏其太踈直謂蕡不先以忠結上而後為帝言之蕡草茅士何階可結上耶五代本紀區區求合於春秋之法又從而釋之曰此春秋意也以史擬經吾恐後世以僣竊之罪歸之矣嗚呼良史不難得也才學識如二公其議論去取之際必不苟碩求其用心處問昔虞舜之時有苗弗率禹奉帝命誓將士以征之而苗民逆命帝乃誕敷文德舞干羽于兩階七旬有苗格夫禹能治滔天之洪水而不能服逆命之三苗濟濟之衆反不如兩階之舞信乎服夷狄之道在文而不在武也我國家靖康之𥘉運厄百六蠢爾戎醜以隂干陽主上體逹孝之資痛父兄之難固嘗親御鞍馬興漢文發憤之師遣將命帥效宣王六月之伐矣然卒未能得犬羊之腰領以快天地神人之心邇者用事大臣知中外厭兵思𣣔休息力排群議屈志和戎遂收諸將之權罷沿邉之戍凡所以自治之道一切以文從事於是興太學以養多士行鄉飲以明人倫學士大夫又倡道德性命之説以風後進至前古治亂興亡之迹與夫當今要務兵機武略則置而不談意者朝廷之上𣣔逺慕虞舜服有苗謂是可以壓腥羶之氣服強獷之俗豈徒修文具事虗談而巳耶然所未知者今賢關既興矣鄉飲且行矣道德性命之説幾滿天下矣是果可使戎狄慕義而來屈膝請命變鴟鶚為好音尊中國如天上否耶虞舜之事不可誣矣然後世説者又謂干戚之舞不可解平城之圍不識文德既可用於古胡為不可用於今碩與諸君講明其事亦畎畝愛君憂國之心幸詳言之母隱問韓愈論大道其言有曰堯以是傳之舜舜以是傳之禹禹傳之湯湯傳之文武周公文武周公傳之孔子孔子傳之孟軻軻死不得其傳焉夫道在天下亘萬世常自若也自堯未傳之前其道如何自軻失傳之後其道又如何韓愈何以知其自堯而始傳至軻而失傳也荀况楊雄皆學仁義皆尊孔子今其書具存非無輔於名教又胡為不能繼軻而傳道也愈在唐號大儒其自待良不淺史氏亦稱過况䧸又不知能繼軻軻而傳道否斯道也自軻之後以失傳而遂亡耶雖曰失傳而固自存耶諸君學以明道久矣碩詳以教問聖人以無難而畏賢君以無災而懼國無難而天有災是天心之愛人君以有災而警其無難也國家用魏絳胡戎之䇿法文王樂天之事五年于兹矣干戈既戢禮樂鼎興是冝和氣充塞子下三辰順行于上可也邇者有星孛于東方莫測彼蒼垂譴之意豈非𣣔扶持我宋而水其箕翼之夀示以變異而警告於未然之前者歟主上仰思天戒嚴恭寅畏雖周宣遇災而懼殆亡以加尚慮州縣之間吏治刻深而小大之獄或不能察聲冤囹圄者有以干天象而致妖氣也前日青災肆赦之文咸與滌除固冝德之動天不俟終日矣然議者猶謂天人相與之際甚可畏恐懼修省之道不止乎一事間昔成湯遇早以六事自責景公泣彗晏子亦以四事為言今日朝廷亦有如成湯自責晏子所言之事否耶諸君當攄畎畝愛君之忠禆聖主應天以實之意考古驗今歷陳其所以然無若公孫子曲學以阿世也問三嵗取士之法國朝行之舊矣名公巨儒建勳立業相與光二百年之宋者咸出自此塗不可謂不得人也崇寧用事之臣好竒而慕古謂選不自里成不自學決得失於一夫之目計工拙於寸晷之下不足以盡人於是作而新之命分舍而選月有書季有考邑有升郡有貢謂能兼得文行之士而有合於賔興之制冝其致治之效邁漢唐而追成周可也卒乎日漸月漬飬成靖康之禍伏節死義排難解紛者絶無一人識者咸謂舍法壞之然自宣和廢罷閲二星終矣今朝廷方𣣔廣育才之路復命邑學養士議者謂將復行三舍考舉之法聖君賢相恩德至渥然未知何以革崇觀積習之弊俾無愧於成周道藝之書無使後人議今日如議崇觀必有至當之説梅溪先生文集卷第十四
