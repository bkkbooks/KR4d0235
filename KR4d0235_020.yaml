  text: 梅溪先生後集卷第二十
  hash: sha256:e3fa7120a60a32656e4c2e2beb2cb3274044963bd6abd7727ce55d8007993a47
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_020-1a}
body:
  text: 詩李伯時贈英石英石來從並玉堂鈴亝几案聳鋒鋩平生性有好山癖袖得兩峯歸故鄊送潛老赴東禪駐錫清源十五年月明臺靜忽飄然禪心莫為東禪起南北東西總是禪難弟難兄漢二龔袈裟縫棭各清風淵明巳遂歸田願蓮社行將訪逺公陳提刑挽詞我守桐城公奉祠登堂猶恨識公遲心勞撫字陽司業獄喜平反雋不疑頭白不忘文字樂室清冝作子孫規棣華玉潤皆文傑潛德幽光發妙詞送陳元龍赴封州教官溫陵尊酒偶相逢記得同年舊日容書讀短檠遊太學經傳絳帳適臨封清新得句腸生錦瘦硬通神筆吐鋒莫向炎州嘆官冷行看湖海起元龍提舶生日正陽之月慝不作氣候清和滿寥廓階餘嘉瑞十莢蓂墻出新梢半含籜正是生才好時莭化日舒長暑猶薄遙遙華胄馬服君世有功勳上臺閣漢云臺唐凌煙皆有馬氏象耳孫挺秀生東蜀骨相堂堂人磊落絳帳心潛南郡風銅柱家傳伏波略致身朝列二稷官銜命江東訪民瘼雍容敷奏天顔喜小試舶臺良不惡北風航海南風回逺物來輸啇賈樂日邊知巳皆逹官行矣歸持𬗋荷槖平生德性不好飲今日夀觴冝滿酌爛柯仙侶年自長不用西山一圓藥得葉飛卿書因寄貢院碑大字雄文照眼明親題一軸寄松􅈦千間廣厦能宣力何止區區不負丞貢院之役飛卿與陳節推董之萬桂堂佛國新開選佛埸蟾宫分桂十千章邦人種德家家熟仙籍題名葉葉香地占清光一輪滿門傳盛事五枝芳東堂万万髙攀手莫負君恩與義方表弟万大年宿郡亝為鼠蚊蚤所苦夜不安寢目為三害某輒申造物之意諭之以詩萬子遊清源頗愛風物好胡為官舍中害有蚊鼠蚤嚙衣恣掀翻聒耳倦揮掃跳蟲從何來出沒席與藁中夜不安寢披衣起呼皂禽鼠磔其尸驅蚊熏以草熾炭烘衾禱蟣虱亦俱薧三害稍稍除髙眠起忘早我時寢凝香清夢到穹昊仙官為我言必大有家寶乃翁多隱德子籍在蓬島天將成就之故以此相惱要令坐逹旦万卷飽探討毋如老外兄不學首空皓彼蟲類最多生育自洪造盡殺則傷仁兼容幸寬抱萬子聞我言往往笑絶倒燔廬相參元失馬福塞老宴安生鴆毒疾患資壽考三害不必除君言近乎道薦新荔支晚年遊宦到夔閩四見輕紅荔子新不似蒲萄桔羊棗向來猶及遺慈親大言獨步郡圃即事有作次韻厭聽桐城雨頻瞻雁蕩雲它鄊見子面好句張吾軍草木心知敬大年每稱賞郡圃花木枽榆景未曛淹留不須嘆雞鶴偶同群早起老欲投間尚未成膠膠優優厭餘生方成枕上遊仙夢忽聽窗前喚起聲刺桐花𥘉見枝頭万緑濃忽驚火傘欲燒空花先花後年俱熟莫遣時人不愛紅丁謂詩只愛青青不愛紅大年遊延福寺去歲曽逰九日山忽匆不睱盡躋攀煩君訪我不到處好把詩篇載取還提舶贈玉友六言詩次韻以酬重見異鄊佳節又成終日清亝兩歲重午病不飲酒忽捧晉堂雙玉引觴澆破愁懷兢渡爭飛畫舫賜衣紛集丹墀舉筆不忘規諌玉堂誰進歐詩歐陽公端午帖子詩云楚國因讒逐屈原終身無復入君門願因角黍詢遺俗可鑒前王惑巧言也仁宗日舉筆不忘規諫真侍從臣覓百葉榴花玉友雙瓶不惡錦囊六字尤清更覓榴花百葉要令老眼增明寄陳大諌良翰公居言路望非輕天下人皆側耳聽方欲携書責陽子忽聞有疏論延齡危言巳落姦邪膽正色潛消魍魎形天聽未回須力爭從兹受責亦芬馨天申節放生夫子釣不綱仁心戒盡物君子逺庖厨孟軻論仁術生魚舍子産獸網祝天乙于牣文王沼靈德壽周室唐置放生池天下八十一至今湖州碑輝耀魯公筆我宋仁如天神武而不殺華夏及蠻貊卵胎暨化􅊜皆歸好生德惟恐一物失清源號佛國此典胡獨缺耽耽舉子場馥馥荷華隰誕節逢千秋錫宴遍郡邑何以壽吾君故事修遺逸魚鱉族至微端賴尺水活况兹十畝池中含千里闊郭索行草泥玄夫巢蓮葉長鬚及衆鱗巨細各儔匹圉圉復洋洋生意俱可必永逃數罟憂咸𬒳中孚吉中有六六魚聊兹友蚓蛭一朝得雲雨龍門變凡質歲早當作霖莫忘池中日送知宗奉祠還越堂堂人物宋宗英來主金枝玉葉盟麟趾化成公族厚棣華詩作爭心平金尊對客吟篇逸貝葉談空世味輕五月仙舟鑑湖去芰荷香裏奏新聲緑水芙蕖泛鎮東一觴一詠辱陪公轉頭十載巳陳迹會面二山俱秃翁舊隱重尋賀監宅歸帆遙借若邪風九重側席待宗老願展惓惓劉向忠愛松堂納涼鈴亝苦炎熱松竹生晚涼颯然清我襟兀坐興味長我無桑下戀愛此獨不忘願言勿翦伐清隂常滿堂郡亝夜坐聞水車聲風伯吹雲不成雨稼穡如焚誰守土鈴亝夜聞水車聲遙想田間老農苦汗流氣喘飢眼花厭聞窟中鼉打衙妻兒相勞勿愁嘆多少髙田無水車天二欲警老刺史車聲夜入凝香耳四郊苗稿農民悲万壑水乾魚鱉死守臣失聀政事荒誰遣連年坐黃堂自慚不及假文昌聖世豈有枽洪羊末利花日莫園人獻寶珠化成千億小芙蕖使君燕寢無沉麝疑此清香自有餘次韻傅教授景仁馬緑荔支玉座竒包未與頒伏波家果忽堆盤冝書蔡譜均稱緑不比韓詩止詠丹薦李徒誇碧實脆嚼瓜未覺水晶寒羡君衫鬢巧相似我坐郡􅈦慚素餐泉州斤事號荔枝廳再次韻兩載閩南白盡頒驚看異品上杯盤發緘𥘉訝囊非絳孹實猶疑頰未丹較美冝同法石白攙先欲占麥秋黃荔支詞云五嶺麥秋寒荔子𥘉丹馬緑比諸荔稍早廣文詩句篇篇好咀嚼令人欲廢餐三次韻荔子新詩屢見頒端同玉局賦金盤坡詞玉座金盤不貢竒包四百年香包盡帶賜𫀆緑孰顆半含仙灶丹西蜀稍多應喜逺瀘戎多緑荔支東嘉可種似冝寒東加無荔支有種而生者疑其不熟久而自脫乃緑荔支微酸好入鹽梅鼎莫作尋常果餐四次韻蔡譜黃詩久巳頒不同馬乳堆盆色因不惡故名酒食可成仙何用丹追逐故江相上下比方魁𬗋稍孤寒殷勤百顆分甘意端為詩情合得餐五次韻涪陵妃子謾名園豈似閩南緑一盆最喜色同青玉案不妨功並𬗋金丹晝看紅𬗋品流俗詩嚼氷霜牙頰寒吟罷間觀右軍帖來禽青李可同餐六次韻年少題詩入否園橫空硬語勝郊盆新吟陳𬗋并江緑深逼蕉黃與荔丹官舍聊淹廣文冷雁行髙並玉峯寒黃堂病守相將去秋菊落英誰共餐七次韻平生雅意在丘園行矣歸尋隱者盆此日詩盟共君結明年荔子為誰丹欲移仙種栽中土只恐天資不耐寒定向家鄊想風味江瑶斫桂謾加飱得雨復用聞水車韻蛻骨木龍憂不雨更喚兩牛眠下土農家以架車者為眠牛水從地底飛上田不減在天行雨苦庭中忽見天雨花白衣真人遊郡衙但願為霖莫為潦免使泥陷羸牛車元旱踰時如魯史一雨已遲淹爾耳農猶滿望苗返魂車亦收聲魚免死我持酒戒不敢荒急呼一杯飲松堂不憂猖獗有巢昌只恐沈猶朝飲羊吳宗教惠西施舌戲成三絶吳王無處可招魂惟有西施舌尚存曽共君王醉長夜至今猶得奉芳尊慱物延陵有令孫不因官冷作儒酸珍庖自有西施舌風味堪陪北海尊長記還家屢擊鮮南來歸興日飄然不緣樽爼逢西子始泛江湖范蠡船貢院食新荔觀雙蓮因成六言兩郡兩逢新荔豫在夔泉二州皆兩食新荔三年三結雙蓮貢院池雙蓮三年三開酒盞莫辝在手異時同把無緣分韻得兩字官舍苦炎熱貢闈快虛敞急呼玉友生間共同僚賞堂成桂植万堤就池分兩蓮開花並蒂荔擘珠在掌詩句聽細論塵襟發清爽行矣北歸翁山林起遙想雲榭納涼人間正炎熱雲榭獨清涼如欲慰黎庶諸君冝奉揚分韻得冝字榭向雲間築風從天半吹談方以清飽襟更為涼披雄入蘭臺賦微生殿閣詩倚欄觀出岫吾去亦誠冝罷官迷懷去矣清源守皤然雪滿顚居官無善政排悶有詩篇朋盍三杯酒公餘一覺眠泉人豈思我我意自思泉出州宅閏五月二十日官居到處郵傳歲月驚人電飛惆悵同來德耀故鄉不與同歸寓清源驛兩年繆作清源守不到清源洞裏遊天恐孤豫逺來意驛中聊許少遲留諸公餞别分韻得人字清源古名郡守土冝擇人胡為不才者兩載乘朱輪政拙歲多旱民愁眉日顰賴兹淳厚俗容我老病身乞祠竟不允易郡俄得鄰雅懷上冢願偶有還鄉因賓僚共呼酒肴䔩嘉且新展餞選士場語離庚伏辰清風屢吹衣暑雨微灑塵􅌐駒沸盈門鸚鵡飛入唇我亦重惜别不辝勸酬頻諸君如神魚行奮六六鱗學士倍登瀛郡符同治秦我如倦蜚鳥野性難籠馴舊巢尋故山一枝老荆榛官居類郵傳誰能久相親但願各勉力相期作純臣枕上聞雨聲枕上微聞點滴聲皇天有意救蒼坐雖然未作啇家雨巳覺炎方暑氣清聞角聲角聲巳作送行聲更向蕭蕭雨後聽明日出郊聞更逺回頭忍見二山青復安靜堂舊額端明之孫字子強銀鈎鐵畫傳遺芳昔年作郡古平海大筆親書安靜堂自從宣和至乾道字與輪奐爭光芒一朝忽遭俗眼白毁滅名姓深埋藏我來搜訪久乃獲老兵據為寢處牀滌除五載塵土靣字向堂上增激昻祖為第一孫是似書有家法稱莆陽體具万安頗雄壯榜與忠獻同翶翔因知文字乃至寶一時之厄庸何傷石鼓文有鬼神護淮西碑並日月光豈容泯滅暴秦火誰肻檜炙假文昌書生作郡太迂闊理財聽訟俱非長吾君若問何以治堂復韓蔡祠秦薑今才五日京兆耳眷此陳迹猶未忘但願茲堂日安靜名與國夀俱無疆次蔣元肅韻酒杯三十六人䘖勸我殷勤不止三長記白蘋離浙石忍看丹荔别泉南自慚政似陽城拙那得棠如召伯甘見説廣文尤惜别好詩千里送歸驂贈李冝之運幹誼謫仙苗裔自非凡家學端能嗣大參一見便知空兾北三年長嘆滯周南冝之家食甚久絶畦翰墨僕騷可請試言詞倚馬堪莫道南來橐無寶一編傳得小雲龕記風閏五月二十六日泉南固多風兹風大為最𥘉驚月有暈忽聽天鳴籟蓬蓬從何來烈烈不可奈万竅爭怒號三光變冥昧掀翻敗墻壁摧折到松檜瓦飄上天半芧捲灑郊外稻吹垂實花果墮未熟蒂山川失故容草木遭厄會飛同鷁過宋悲異兒歌沛孰云楚臺雄未覺周郊大雖然不終朝無乃巳𬒳害嗟豫垂素髮濫此張皂蓋方憂西疇禾未問南海貝時蕃舶將回以風為憂心如韓值颶卜效蘇命蔡焚香叩穹吳防患問耆艾稍稍雲色定徐徐雨聲霈漸停箕簸揚會見氣交泰居民理破屋老守戒征斾五絃歌舜琴一絲詠嚴瀨去矣不待瓜歸歟及鱸鱠蔡端明祠堂公昔自禁從再來臨此邦河梁一何壯筆力獨能扛政績留南紀祠堂枕大江山川與人物今古兩無雙别傅教授景仁鼻祖調羔佐有啇耳孫家業踵前芳万言書有鹽梅味千首詩開錦繡腸絳帳詎容淹久次制科端欲待非常歸囊剩有君佳句更獲珠璣四十章贈陳教授正仲讜益友平生所願親南來深喜得斯人淵源師杜真知體正仲贈豫詩云淵源師老杜體制陋西崑而正仲詩殊有杜體人物如平豈久貧絳帳可能淹教育掖垣便合掌絲綸臨行贈我五百字楚壁陏珠未足珍挽令人糟粳情味飽相諳我事耕耘爾力蠶誤走迷途半天下忽驚魂夢斷泉南二年旅櫬悲無奈千里途車涕不堪預卜黃華晚秋節佳城歸祔白岩庵贈陳體仁我來守清源德星識二陳大陳如金玉一室清無塵厭世不肯留至今里稱仁儒先賀州守才氣超等倫胸中包古今筆下真有神唾手取甲科齒髮方青春聲名滿天下文字驚縉紳勞人暫州縣平步當要津蹉跎忽至今此志猶未伸真人奉香火蕭寺含悲辛講席延諸生黃卷訶古人異端斥佛老吾道鳴孟荀聊籍束修禮少資囊橐貧我忝二千石二年牧斯民不能助玉川恥與韓公均贈我詩與文字字皆可珍寵褒恨太過感激難具論願公少自愛行矣當致身門下有髙第廟堂手經綸房魏方得君詎肻忘河汾贈林尉致約紅顔白靣神仙吏好學苦吟真我徒政事文章有家法它年呼作小龍啚臨行至貢院觀桂贈致約竊祿清源愧不才貢闈臨去尚徘徊青青万本新移桂盡是梅仙手為栽宿寂光院青山環繞如盤谷中有清幽佛子家人昔共來今不見數行老淚􅊜煙霞陳德溥以百韻詩送别因贈一絶蓮幕遊從一二年送行越境繼前賢陳季常陳後山皆越境送東坡筆頭皆有珠千顆端以少陵夔府篇越境送别者七人蔣元肅黃少度鹿伯可趙元序陳德溥葉飛卿林致約少酌驛舍同僚送我楓庭驛共酌臨分酒一杯我念泉人仍惜别此身雖去首頻回别蔣元肅符竹南來識廣文經橫講席見淵源凌雲詞賦勝三賦醫國忠言壓万言元肅嘗作二賦十議陳迹互將文字記交情更向别離論君方騰踏吾衰矣名節相期百世存題莆田林氏雙闕唐室遙遙孝義門屹然雙闕至今存當時泣盡思親血化作恩波遺子孫過頭陀九嶺宿天玉樓林二招提因成三絶凌晨飽飰渡秦溪飯溪一名秦樓要上青山九級梯不使甌閩隔人世頭陀力與五丁齊千里歸塗險更長眼中深喜見天王從今漸入平安境舊路艱辛未敢忘我如倦鳥欲栖林喜見禪僧棲處深家在梅花小溪上一枝聊慰北歸心宿五峯院万法由來揔是空五峯名在本無峯我來遙作廬山想隱約夕陽開處遲饒州芝山有五峯亭望見廬山峯也范文正公詩云五老夕陽開贈亮首坐雪頂厖眉八十餘五峯深處結精廬閲人老眼能青白贈我嚴公一軸書王成之太慱寄詩病中未能和謾書二十字以酬老病欲納祿君恩許奉祠已為三徑計誤辱廣文詩司理叔文和過万橋詩復用前韻少年一夕九起嗟家貧親老無生涯河東先生獨青眼慨然許我修通家三十年間同轉首王謝依然作甥舅時人咸笑孺子貧杜老惟蒙丈人厚罷官閩嶠𥘉歸來登堂又荷傾金罍詩誦白圭感前事情鍾我輩䘖餘哀定向清朝力求退呼賓剩設嚴冬鱠從公杖屨鹿岩前明月清風趙歐會挽令人知汝莫如我傷心不盡談忍貧猶好施見得可曽貪水陸同艱險糟粳共苦甘和鳴三十載一夢斷閩南之子有賢叔鯫生誤受知恩蒙夫子妻事類白圭詩黃巷悲吟夜青燈照績時竟孤偕隱願徒切悼亡思我欲志諸墓有言何敢私如賔最相敬無妬似知詩孝合從姑葬賢冝舉郡悲明朝是重九忍看菊花枝梅溪草堂新闢缺少花木效少陵故事覓之以詩小小園中十八香主人遊宦遂荒涼名園草木多竒品分我餘根種草堂間中那得買花錢孤負桃紅李白天拈出向來花疏目招邀春色上詩篇夢齡弟生日十一月二十二日周正猶餘八莢蓂昴星下應一陽生貌和冬嶺松俱秀神與梅花溪共清定享百齡如衛武預開三徑學淵明弟兄此去皆華髮無惜更相薦夀觥可公禪老住泉之九日山二十年矣豫臨罷官求去甚力復為後政所留寄詩酬以一絶泉山好處稱延福白髮禪僧去復回且與晉松為隱侣莫同英石便飛來可以英石見寄號飛來峯黃伯厚得蒲墨折而為三以書來易戲成二絶不謂一子墨忽成三客卿君家好兄弟鼎立並馳名好去文房寶堅剛冝自持吾家藏有盡黃子玩無時姚宰行可和詩索墨酬以元韻武城民事暇著述似虞卿手握陳玄輩磨成不朽名人生幾丸墨老病厭操持好與賢明宰研磨共救時松筆我有文房寶莫如毛頴清來從丹桂窟封以五夫城輩行惟􅊮管宗盟是墨卿湘東謾三品無此歲寒名題淨名院二絶淨名却見老維磨謂長老顔公道眼相看語不多我待衣冠挂神武杖藜來此老岩阿谷中有月露蛾眉水織珠簾更絶竒滿目峯巒觀未盡有僧携紙覓題詩梅溪先生後集卷第二十梅溪先生文集卷第二十行狀東平萬府君行狀君諱世延字叔永世為溫之樂清人曽大父惟監大父周父鴻皆晦德不仕君幼警悟敏記誦𥘉屬文思捷而佳為師友所竒年十四而孤奉母謹甚處家事若成人舍法中遊郡庠業修行飾蔚為善士宣和間邑大夫興鄉校以鄉先生鄭君邦彥主之鄭學術淵粹為時名儒從之遊者以百數君一日謁同志會其課諸生戲即其題涉筆而就鄭見之撫几歎曰之人詞藻如是一第唾手取爾然君以兄弟終解志顓甘旨訖不事進取抱才不試鄉人惜之性寬慱與物無忤尤善宗族每先其急難遇長幼慈愛均一無纎芥嫌隙族衆多間有違言君周旋其間開釋以理衆皆愧服協比如𥘉由是闔族內外咸欽而愛之稱為長者善治生蓄而能散親故有不振者每綱紀其家其弟子有美質困不能自業給飲食師資費以教之處女貧無以歸躬為擇配奩而遣者凡數人居之左右細民寠族資衣食埋􅌾者數十家緇素叩門隨所謁而獲者叵計歲凶廪飢每為冨室倡敕具以館賔席無虛日也篤於教子嘗葺屋數楹諸書其間厚禮以致名師訓督點竄之勞率分其半長子庚最美才始冠遊太學君勉之以詩曰莫放山虧簣終教井及泉庚益自勵果優中考選連預薦書屢為多士先聲譽籍籍用上舍免省登進士科次子庠亦以妙齡預鄉貢萬氏以絃誦先里閈歷四世儒冠益盛業賢關舉進士者數人登科第自庚始樂清自舍法罷閲二十年無舉於鄉者里巷靳之邑人復取鄉貢自庠始先是監察御史睢陽李君藹扈駕南巡聞君有鄉譽訪其居名其軒曰必大且賦詩極言之至是二子俱有成人以為榮咸謂君種德樂教之報且嘉李之先知君夙有喘疾晚歲彌劇瀕死語不亂巍坐正色而卒實紹興甲戌十月二十有三日也年五十有八鄉里聞訃無不傷嗟𥘉娶孫氏先君二十四年而卒繼室以趙氏子六人庚左迪功郎處州縉雲尉次曰庠曰􅘙曰廓曰庶曰唐孫男三女二庚與庠既以儒學名家餘皆服義方其進未量鄉人以君有隂德且多男子比之燕山竇氏恨其不足於夀不獲盡見云君仁而好施志於濟衆者未艾也嘗割膏腴三十畒儲其入以濟親戚之貧者死之歲語諸子曰吾為是恨未廣自是而後冝資其人歲一易之庶幾悉周且枚舉其所當與者家之西距大江實為要津勢湍而惡涉者病之君叔祖東平先生始傾家資跨江為橋濟人於險垂六十年往來蒙其利俄一夕燼于火東平子主簿君𣣔新之未遂而卒君毅然以橋為任然事艱役巨既捐巳資以半其費又經營其餘於鄉黨間以佐之橋成有日矣而君卧病彌嵗屬纊語不及他顧謂諸子吾以橋纍若等矣諸子涕泣請繼志頷而瞑君雖早厭埸屋未嘗廢書每開卷意有所會必標識以謹不忘所為詩文雖不多皆平淡造理峻潔可愛尤屬意於簡翰雖貽子弟不率然作也卒之又明年諸孤卜以春正月十有九日􅌾于岐山之隂泣血相謂曰吾父以善人君子稱于鄉其潛德有足書者將乞銘于薦紳先生以永厥垂冝得之其詳者狀而授之庶乎其不誣以屬某某萬出也每登門辱顧為厚且與庚同舍上庠又獲與諸子遊蓋知其詳而不誣者雖蕪陋其何敢辭謹狀張府君行伏君諱端弼字廷直姓張氏溫之樂清人曽祖迪祖孜父瑀世蓄潛德不慕祿仕君資俊邁好學問慷慨喜議論敦尚氣節偉然男子也舍法行肄業泮宫月書歲考纍成優校以行藝職學事領袖諸生曄曄有聲侵尋於仕塗矣會更科學子解散君歎曰仕與飬不能兩全浩然懷歸奉偏親以孝聞𥘉先業夫廣重以兵火業寖微君通材經畫有條未幾生事大振冨甲鄉邑然雅重義槩耻為俗子冨務周旋宗族親舊有以窘告濟之無難色邑學再建與出財力居多仍率先割膏腴以養士每歲之春發廪以賑窮民質貸踰年不取其息有負責者多折劵不復問性樂善里人有登第者喜如已得閔其貧每資給之雖萬金不吝也好賔客坐席常滿極飲不倦杯行健語笑年雖及而鋭氣不衰所居地為邑之屬鎮間有不逞曹聚歡譟君凡諭以理有不肅者張目掀髯厲聲叱之咸股栗畏避威不以勢人尤難之喜教子姪命師友必以賢答以殊禮闢廬舍規模宏壯或謂君有令名何室之美曰吾非以自奉也為他日子孫容車馬會食客之地爾其心期如此飬髙閭閈足不及州縣未嘗以姓名干典謁汙訟牒士論韙之聞有巧造請捷奔走無日不數於公門者心鄙薄之常舉為後生戒晚景益曠逹不以財利經心見為善者喜見顔間譽而勉之以親志好佛二弟俱從空門學為飯萬僧開義井以侑善云疇昔少有疾預知死期一夕牡丹冬開人以為祥君謂花非其時對之悵然賦詩見意既而感疾朋舊問之談笑如平時俄盥手正衣冠偃卧而逝實紹興二十四年十二月五日也享年六十有六子二人攄挺皆業儒女三人長歸進士宋翰餘未嫁君挾所負氣蓋一時俯首田園非其志也每觸事感槩興懷學有經術尤邃於易少以事進取既蓄而不施行所學於家處利害得喪之際𥙿如也識者謂其詣幾深之理好商榷文史工詩童語逸意新有作者風君於鄉黨為前輩某𥘉稔其名未之識也一日過桞川遇焉不以後進見鄙欣然命舟同泛而歸既登堂獲奉文字飲於顧遇不薄矣君沒之明年諸孤卜以十二月十一日葬于里之桂峯祖瑩之側長子攄以書來告曰子於吾先君有一日之雅宜狀其行吾將乞銘於立言君子以藏諸幽以垂諸不朽其謝非人至于三不獲命遂采諸鄉評編而次之謹狀賈府君行狀公諱如訥字元辨其先福州長溪人五世祖徙溫之樂清曽祖皓祖靖父奭皆有潛德不仕公溫雅愷悌持重寡言為兒時嶷若成人十二歲而孤事後母至孝撫育弟娣恩意均一毋病涕泣嘗藥及卒執喪如禮伯母錢性嚴子姪有過必痛繩之公善承順未嘗忤意在諸子中最以謹厚稱𥘉伯父奕以絃誦先里閈從兄弟愚如晦俱美才有聲庠序間公尤嗜學每謂弟如石如規曰吾二兄才名如許若等可不自勉耶以身率之故二弟皆力學能自立如規既冠學益進公勉其遊太學且躬任其家事厚資給之務成其志及舉進士捷音至時兄如晦同戰藝公意其俱中喜甚既而聞其不利鬱鬱不樂賀者方集公郤之曰吾兄親老方籍此以尉其意今見黜何賀我為人服其不私如規今尉建昌軍廣昌縣以德譽取重縉紳公之教也公善治家井井有法不務兼并而生産日肥性仁慈尤睦宗族見貧者心憫之常發廪以濟每言彼吾宗也吾忍獨溫飽也有尤窘者四族人以膏腴三十畒賑之仍給榖暨牛資其播殖又百畝飲僧徒之往來者及分惠里人之窶者凡割田二項餘而金榖之惠叵計謁丐踵門必周恤之至解衣以贈其敦宗好施蓋天性也鄉人燕其宗耻以貧賤者與公曰是豈兩姓耶每家宴合踈近長幼貧冨均禮舅氏家不振悉力瞻之歲時登其門省事如父母去必感泣舅卒厚禮以􅌾公素友愛兄弟異居非其志當析財命宗人區處未嘗顧視務推遜以化偷俗季感其德復義聚至今樂教于弟屢延致名儒厚其禮終始周旋之喜賔客館無虛日雅不好飲遇賔醉則為之極歡敦尚禮法遇人無厚薄必盡恭泛愛鄉黨至所交必擇長者寡嗜欲不好殺喜與釋子遊談無生之理務忘身世不幸嬰痼疾仁而不夀享年才四十有二以建炎三年五月九日卒遺言有私負者悉棄之逺近聞訃無不涕泣娶同邑陳氏處士景芳之女姿婉淑奉姑以孝謹稱始奩具頗厚公喜周急而夫人不吝故公得以私田活其宗數百指隂德在人為多蓋夫人之助云後公六年而卒年四十有九男一人曰循以業進士克守家訓與季父同居幾三十年服勞不憚鄉里難之女一人歸表姪王某孫二人公與夫人喪久在殯弟縣尉君嘗言吾兄嫂事吾毋盡孝吾當擇地改􅌾吾母以兄嫂祔焉屢以卜後得邑之左原其岡維吉躬治墳塋以奉窀夕絽興癸酉秋循似泣謂某曰吾將以冬十一月十有七日合葬吾父母𣣔丐銘大手筆以發其幽光子盍狀之某不侫獲以通家于自幼登公門荷知遇不淺及公殁又辱為子壻知隱德為詳嘗訪遺事於故老咸曰公仁者也今無是人矣某遂撰次所聞俟賢而有文者書之謹狀周府君行狀公諱瑜字公寶先世姑蘇人也髙祖避五代亂徙居于剡曽祖荀祖惟父過皆不仕公為人純厚質直介然能自立以孝友聞于鄉治家有法遇長幼以禮閨門之內肅如也宣和中魔冦犯邑人倉遽奔匿公獨擁親柩噭號聲徹閭里冒兵刃扶護以畢窀穸朝夕悲涕不忍去墓側凶徒相戒曰無驚周孝子賊平卒無恙公喜儒學嘗闢家孰數十楹延四方名士以淑諸孫又製夫子暨十哲坐象畫七十二子於一堂俾崇奉之大書其側曰爾其親師友之淵源就功名之烜赫浹日必設具以集之親究其能否有勵業者喜見顔間面加獎諭兾其成就稍怠墯則諄諄戒敕俾之自勉由是咸自力于學紹興庚申秋孫汝士預薦書乙丑歲世修肄籍大學丁邜秋汝士汝能世則聮名鄉薦明年汝士登進士弟鄉人榮之公喜周急視飢渴者如巳每盛夏分命皂隸當往來之衝烹泉以救暍窮冬集境內飢民施以金榖遇歲歉發廪賑貸命諸子悉寬逋負剡之南有巨溪實為要津行者病涉公首創浮梁以濟其子繼之至今蒙其利𥘉先君嗜佛公嗣志彌篤凌晨焚香端坐披閲藏經歷四十寒暑手録因緣幾百卷每以所得語諸子借示勸戒剡有名剎遭兵冦燔毀兼餘公割巳資一新其棟宇時私第猶未築家人以為言公曰兹邑人植福之所渠可後耶僧徒德之祠公于佛舍旁欽事以報公又闢别館飯貧士及緇黃之流滋久不厭其樂善好施出於至誠𥘉不求人知而稱道者不容口其見重於人如此公狀貌魁偉見者以為異人自中年鰥居不再娶屏嗜欲務飬精神平生未嘗服藥既老顔如嬰兒視聽不衰好事者爭𣣔求見以叩飬生之術晚苦足疾諸于和藥以進公郤之曰死生命也何以藥為兒女涕泣以請恝然弗顧會孫壻髙世絪以赴調告違公曰吾某月日行矣至期沐浴易衣而坐神色如平時謂諸子曰吾即行若輩冝自勉言畢奄然而逝實紹興二十一年十一月十有六日也享年八十有八公薄於世利𥘉以勤儉自守不廣資産自諸子既壯悉以家事付之積數年冨甲一邑公視之恬然不以經意晚景門闌益盛身夀康寧每歲旦暨誕辰宴坐髙堂子孫詵詵環列戲綵甥壻無慮數十人爭先為夀剡中以周氏為慶門言五福者以公為備公娶里人孫氏先公三十二年卒男三人長仁承節郎次侁承信郎婺州永康縣監酒稅後公一年卒季億先公七年卒女四人長適同邑吳宗次適劉升次適房先厚次適過諤其夫皆早死諸女孀居終不改志男孫九人世光汝賢汝士左從政郎汝弼早卒世修汝能世則汝礪世南皆業儒女孫六人長適同邑進士盛卞次適泰州助教過焌次適成忠郎通州支鹽髙世絪次適進士商汝霖次適右迪功郎徐與夔次適右修職郎潭州醴陵縣尉姚實曽男孫十有二人曰之元之純之文之綱之彥之茂之竒之翰之才之望之邵之美曽女孫十有二人長適進士史之才次適左迪功郎明州慈溪縣主簿陳嘉善餘尚幼某無似獲與公之孫世修同舍上庠道出剡溪嘗登公堂獲承謦咳之餘他日再至而公逝矣癸酉秋公長子仁移書謂某曰吾將以十二月十八日葬吾父于邑之方山鄉馬鞍山之原祔先夫人之隴也子辱與吾兒遊之其平生之詳願狀其行吾將乞銘於士大夫以藏諸幽某辭鄙陋不獲謹撰次所聞如右謹狀潛澗嚴闍梨塔銘師諱處嚴字伯威姓賈氏溫州樂清人也父靖居鄉以長者稱毋萬方娠一夕夢黑龍自天躍而下俄化為道人入其家及産師有異相幼警悟不凡經史過目輒成誦舅東平先生規邑之名儒也試以對隨口應答大竒之少長忽不茹葷毋強之卒不從一日遊精舍歸白其毋曰兒𬞞食居俗非所冝願出家學佛惟夫人割愛遂往里之明慶院禮僧知性為師既落髮受具遊歷郡剎𥘉學律未幾習天台教觀慨然歎曰吾邦僻在海隅見聞不廣遂之錢塘依南屏臻公聽天台大部明法華諸經時學者尚編録務相詰難師聽法罷端然默坐同輩問之發明師説了無遺誤因謂之曰文字分别馳騁法相吾不能為遂逺遊禪林訪先輩老宿叩擊玄旨師志節髙學識超邁杖錫所至道眼相契為多會有以座首命之者師曰吾宅心名利外兾逍遙自適詎能為人役耶於是西遊帝都觀伊洛南周旋江淮間凡名山水叢林巨剎靡不至時道潛思聰二僧與東坡居士遊聲名籍甚咸與師善數以篇章往來師博學詩文尤典重且工書有晉宋法或勸以所作謁縉紳求知已師笑曰古之桑門上首與士大夫遊非求之也道自合焉爾故終身不以一字干謁識者髙之元祐間還永嘉寓淨光大雲開元諸寺其徒翕然歸之扣門請益者屨相躡也師訓以本業外復以詩書子史導之凡經指授者咸見頭角時開元建護國天王殿命師作記文辭雄偉太守范公見之稱歎良久命刻石行于世元符𥘉歸故山誅茅結廬循除蓄流自號潛澗賦詩鼓琴以自娛有古人林下風師有辭辨長於講釋鄉里巨室𣣔屈師講經莫能致因具法筵集廣衆預設巍座俟師至與衆迫之師匆遽就席闡楊奧旨緣飾以文音吐鴻亮聰者驚恱明慶自創業幾七百年無文迹可考師首為撰記并書之時稱二絶郡守張公平聞其名以禮致之躬受楞嚴大義𥘉以僧正命師又命主禪席皆力辭之每詣府手提一笠未嘗肩輿人以師為府座所厚因屬以事師正色峻拒府政有不便於民者委曲以告守改容聽之瑞安令吕公勤自號湖海道人邂逅師喜甚與俱還邑築庵於􅈦治後園命師居之為留三宿而去邑令丁公湛每訪師談道終日忘返晚景絶人事惟精修淨業喜諷誦楞嚴圓覺維摩光明法華等經精熟如流靜夜孤坐焚香暗誦琅琅之聲出于林表嘗手書法華光明二經以報母德又書華嚴經八十卷首末不懈字法益工弟子宗要遊學姑蘇俄以書督其歸未幾師得疾遽終政和壬辰正月二十日也享年五十四僧臘三十九至三月闍維得舍利數百顆明瑩如珠明年九月植塔於故廬之後以遺骨并舍利􅌾焉師於佛學無不通曉尤深於禪而接物以教故以闍梨著名平生製述甚多藁隨毀失圓寂後弟子收拾遺文編成二卷人有得其片紙皆寶藏之其文翰見重於人如此弟子宗要師號寶印傳天台教住永嘉之妙果克世其業法孫德純亦傳法于郡之龍翔某大毋氏師之同母娣也寶印師蓋某之叔父師殁之歲而某始生自兒時稔聞德名恨不逮見今四十餘載矣始獲以叔父之命銘師之塔不敢以鄙陋辭銘曰師之道儒律禪教咸臻其要師之技歌詩文翰咸極其致師之節公卿大夫不屈而謁師之訓子傳教觀孫傳心印師之廬左琴右書山髙澗迃師之塔明珠遺骨千古不滅梅溪先生文集卷第二十
