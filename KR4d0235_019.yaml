  text: 梅溪先生後集卷第十九
  hash: sha256:3baecaec9207e7ccc7d567136c70195c94c7ba49417d0418d6cdcf9f7a343dda
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_019-1a}
body:
  text: 詩乞祠不允三十韻微臣守清源一歲三乞祠俞音竟未拜感荷聖主慈臣家素賤貧仰祿救啼飢區區六年間手把四郡麾道途厭奔走囊橐無餘資清源乃佳郡風俗不待移民淳簡獄訟士盛敦書詩地逺可藏拙䘵厚足自資今歲又豐登千里人熙熙臣豈不願仕求間欲奚為自憐螻蟻生福薄命最竒入境身即病到官日呼醫痰每上攻旋暈勢甚危藥試何止百灼艾無全肌臂疼如子美齒落如退之腳患桞州腫髮垂孟郊絲飲食日減少跬步須扶持殘喘雖尚延定非久逺期况臣糟粳妻蓋棺將及期旅櫬猶未還兒女晝夜悲臣今官滿考臣去有二冝孰謂九重逺天高而聽卑吾君不之告肝膽將誰披廟堂二三公誤辱平日知今不憐向隅恩復何時施願于黼扆前敷奏迫切詞天日臨在上臣言非敢欺解官食祠祿曲遂臣之私幽明俱受賜感極涕泗垂溝壑倘未填報國猶有時次韻陳賀州題薑秦二公祠薑丞相姓名端合上麒麟當世那知相是真遺冢尚餘封馬鬛孤忠曾記犯龍鱗三巴流落知音士謂陸宣公九日追陪避世人精爽不迷祠宇復􅌂然唐室舊冠巾秦隱君去剡遊閩避世喧清風寥邈典刑存峯前鳥宿無名樹祠下僧𫾣有月門髙尚端如上九蠱含章更類六三坤偏師勝後詩無敵正要公來與共論耒詩云安得斯人與共論薛士昭寄新柑分贈知宗提舶知宗有詩次韻書後誰題字鄊人逺寄柑薦新思起孝知味戒生貪羅帕分猶未金門獻正堪命名聊别偽溫柑號真柑在果獨稱甘它果非無甘者惟柑子以甘得名言最甘也白雲𥘉盈樹黃金忽滿籃霜天欣始孰茅舍飽相諳客重開須請兒癡食更婪桞詩吟不厭謝賦讀常耽若蜜萍難比如拳栗有慙公家安定法想見日酣酣知宗柑詩用韻頗險豫既和之復取所未用之韻續賦一首三十韻書閲楊州貢功觀禹化覃香苞分橘柚秋色動江潭李德裕桔賦動江潭之秋色破暑花凝雪凌寒葉染藍金衣愛子照唐宰相賀甘子表云緑蒂含煙金衣爛日珠實碧波涵栁子厚詩何人摘實見垂未上諸侯計曽聞四浩談顔歡陸績毋業世李衡男送客愈吟桂韓退之送桂州嚴大夫詩云家自種黃甘記時坡詠儋東坡在儋耳詩一年好景君須記正是橙黃桔緑時洞庭夸浙右溫郡冠江南節物清霜重家山緑蒂含青黃出籬落朱緑耀林嵐栁子厚詩密林耀朱緑坡詩竹籬茅舍出青黃昔貢千金顆遙馳万里函宣政間溫州貢甘每顆有一二千新冝薦寢廟香可供瞿曇夔子那能比羅浮未許參豫往在夔府食黃甘味頗佳然不及溫甘逺甚去冬至泉州始食羅浮甘又逺下及夔子何人傳黃陸端類列非𥅆在品寧為四季直方第果實名甘子第四蒙恩或賜三李德𥙿賦序上賜宰臣等朱桔各三枚鄊情寄𥘉孰旅况憶幽棎嘉拜親開合珍藏淨洗甔甔瓦器也新甘貯以瓦器則久而不爛行將解印綬歸種當田蠶根向橫陽覔溫甘以平陽縣泥山為最泥尋斥鹵簷種甘冝醎地荒蕪耘徑草封植伴溪相不用千頭冨聊資一餉湛茅亝闢杜甫仙井汲蘇耽神仙蘇耽鑿井種桔佳境妙餐蔗間庭勝蒔苷苷甘草也醫家謂之國老桞子厚詩蒔藥間庭延國老堆行三峽荔奴視四明蚶欲繼花為譜歐公作牡丹譜應同桞駐驂歐公柳詩攀條莫惜駐征驂禦偷籬著棘愁凍灌添泔泔米汁也鄊人冬月用以灌甘掩映青雲葉光華碧玉篸釀成浮甕蟻蒸辟蠧書蟫甘桔花蒸以為香可辟衣書之蠧護蒂期存乳甘欲致逺必以蠟塗其帶晉皮欲去痰皮能下氣醫家用以治痰恨無親可遺松慘白岩庵林主簿明仲挽詞齒德尊鄉黨胸中有古今箕裘傳藴藻臧否判崔林呼佛知仁政名軒見道心扁舟欲訪戴仙去不容尋一箭雙雕手青衫已白頭硯幾磨鐵盡官止及瓜休漏斷鄞江夢風含曲水愁以上巳日亡鈞天記白玉塵世冷西樓假館城西日清談屢獲陪江湖倦遊宦文字阻銜杯方嘆鵉栖棘俄驚鳯去臺公與孺人相繼而化雪梅開舊嶼無復寄詩來擬賦江南寄梅花詩蔚宗居壠首陸凱在江南手折梅花寄人逢驛使堪吳都尋半吐楚岸摘新含雪裏開才一樓頭弄未三情深殊折桞意重勝題柑溪上千株玉歸歟待自探十月二十日買菊一株頗佳置于郡齋松竹之間目為歲寒三友三百青錢一株菊移置窗前伴松竹鮮鮮正色傲霜性不逐重陽上醽醁誰云既晚何用好端似高人事幽獨南來何以慰凄涼有此歲寒三友足重修北樓十一月望日與郡僚同登因書十二䪨我昔未作南諸侯雄丈嘗閲龍虎歐泉山風物得大略夢寐先巳登兹樓到官正要訪遺迹忽見破屋城牆陬欲修不敢遽土木經歲此志方能酬貢闈之餘材可辦農事之隙工乃鳩月逢建子飛破鏡酒呼從事來青州匆匆未暇衆賔集草草且與同僚遊山川城郭壯哉郡清源𬗋帽明雙眸却驚雲榭在地底坐見日轂經簷頭西山端可柱頰視南海未用乘桴浮東瞻歸路興元亮北望魏闕心子牟揮毫欲續仲宣賦假日聊以銷吾憂諸公和詩復用前韻欹眠聽詩韓喜矦鋒難與爭劔鑄歐鈐齋淺陋無處著挂在縹眇之飛樓兹樓久欠詩酒味天遣我輩來遐陬塵埃聊用文字洗瓦䃯遂獲瓊瑶酬賔朋未賞合開燕老病欲登冝杖鳩清風酌别記霅水胡州有清風樓制勝領客思夔州夔州有制勝樓一江明月楚東醉饒州有番陽樓楚東閣范文正公詩云一江明月夜歸遲全家終日蓬萊逰會稽有蓬萊閣豫為幕客嘗挈家以遊元微之詩云全家終日在樓臺南來不謂有此境四顧亦足窮吾眸朝看日出閩海嶠夜望斗插泉山頭端如虢郡風月送退之虢州北樓詩不比巴嶽乾坤浮登臨懷古甫白適賦詠聮珠産鞏牟私心竊慕范文正後天下樂先其憂哭萬先之太學時名重吾鄊德譽崇才華盍天祿官聀止儒宫相國方知愈諸公兢薦雄天涯忽聞訃老淚灑西風胡邦衡以集英殿修撰知漳州正人起廢有識相賀詩以志喜左右同時兩舍人隆興𥘉某與邦衡同立螭莫年得郡偶為鄰泉山久著癡頑老漳浦新除正冝人熱撰可能酬壯莭炎州聊復屈朱輪拾遺輔過須公輩汲黯行歸侍𬗋宸馮貟仲復元官與致仕恩澤謗豔久自熄果然天聽回孤忠昭聖代遺恨釋泉臺伏節同元帥符離師潰貟仲與張魏公父子在旴昭不肯去相約以死知音有上台貟仲與今左相同在魏公幕中員仲𬒳謗左相力為辨之三軍氣應壯一洗向時哀貟仲以論列罷三軍嘆息有流涕者次韻提舶見招江梅𥘉破一陽天詩句清新欲閗妍呼我同來飲文字定扶衰病到尊前令人生日哭以小詩二十七日生日今重見細君嗟不回竟孤偕老願忍看舊時梅去歲一杯酒遽然生死分兒孫為夀地慟哭不堪聞知宗生日二十九日昔年遊越絶首識南枝梅一麾守清源再見梅英開顔色宛如故風霜不能摧玉質長仙葩芳姿醖詩才其侣乃蟠桃其根出蓬萊花開三十年壽薦三千杯喻叔竒采坡詩一聮云今誰主文字公合把旌旄為韻作十詩見寄某懼不敢和酬以四十韻斯文韓歐蘇千載三大老蘇門六君子如籍湜郊島大匠具明眼一一經選孜豐曰文乎哉蓋深于斯道諸公既九原氣象日衰稿山不見泰華水但識行潦詞人巧駢灑義理失探討書生蔽時文習義未易藻著述豈無人紛紛謾華藻有如分裂時僣偽各城堡同年廣文君所作非小好高吟薄風雅古學窮渾灝讀史正豕亥觀詩辨形夭千篇氷玉清萬字波瀾浩心慕大手筆所恨生不早鄊令門及韓不類端可保賞識遇歐坡當為篋中寶聲名終不掩光豔姑自葆嗟我最不才兀兀首空皓半生槐踏黃晚景蓋張早出守婁及瓜還家僅嘗稻去六月還家九月赴泉山田園荒淵明江梅客張鎬塵埃未能脕憂患苦相惱愁儧卧蠶眉相者謂豫仍如卧蠶主多愁苦痛徹伏犀腦近苦頭疼何當歸故山巳書下下考鍾筆况久閣盧經徒獨抱古文如金城偏師詎容搗小詩時自遣句法未知造廣文賢關舊聲氣同􅊜燥食共朝韲辛案對夜螢薧䇿杖遊西湖尋梅插晴昊番有九十日呼酒羅脯棗潯陽三年别心若風中纛書來問安溫仍效世俗禱手寫十新詩價重百磲瑙情意何勤勤許與太草草那能把旌旄但可供灑掃胡為以西子國色沉嫫媪前言蓋戲耳細讀笑絶倒却將寄來詩録附雅戲藁叔竒嘗作雅戲集題徐致政菊坡啚名夀仁字子由南方有高士仁義偃王裔家山闢幽坡手取香草蓻秋至有黃華采采滿衣𬒮客來酒盈尊詩出語驚世無心學淵明偶與淵明契靜者年自長頽齡不須制髙懷恥獨樂地逺人罕詣丹青寫佳境有目皆可睨吾家鮮鮮徑荒蕪屢經歲儒冠誤此身挂之公得計次韻吳明可見寄閩楚相望天一涯思公不見見公詩遙知人在凝香處正是梅逢馹使時𬗋帽清源遊巳倦落霞孤鶩看無期它年杖屨天台去采藥尋桃薦夀巵沈敦謨和詩見寄復用元韻天使吾儕復會同笑談聲落酒筵中語離江北秋正秒回首閩南歲又窮春草池邊來好句木奴皮裏隱仙翁寄謨敦甘相將再上觀潮閣我巳三章乞道宮曺夢良教授寄柑一百顆報以乾荔支戲成二絶故人書自許峯來領得黃柑手自開未滿洞庭三百顆更看馹使一枝梅絶品知君尚未嘗三山絳帳喜相將冷官豈是淹賢地尤物聊觀十八娘懷夢齡昌齡弟久别思吾弟它鄉歲又除日吟棠棣句目斷雁行書老去情尤惡懷歸語似虛祠章巳三上試為掃茅廬臘月二十八日與知宗提舉分歲郡中啜茶于北樓賞梅于忠獻堂知宗即席有詩次韻并簡提舶老病踰年卧晉江耽詩性癖未能降園林牢落梅經眼歲月峥嶸酒滿缸堂上焚香敬勳德樓頭回首念家鄊黃甘未拜蕭嵩賜鄊味分珍謾一雙時得溫甘各分二顆曾潮州到郡未幾首修韓文公廟次建貢闈可謂知化本矣某因讀韓公别趙子詩用韻以寄韓公學孔子不陋九夷居詆佛譏君王道大忠有餘南遷八千里文墨以自娛至今潮陽人比屋皆詩書蓬茨得趙子如獲滄海珠臨行贈以言恨不與之俱德云昌黎公聖人之徒與比周孔孟軻不道迂相如韓公不可見趙子今亦無潮人敬愛公百世祀不渝英姿入山骨凛凛蒼眉鬚彼哉逢吉鏄金章裹猿狙使君藝且賢所至政續殊下車首風教廟修庭草除又聞新棘闈輪奐歸畫啚繼坡當有作大筆文辝驅惡詩碩勿刻人方笑其愚潮州書云欲刋某和韓詩送柯教授赴官四明士論鄉評總見欽古猶難得况于今恥干一介將行李慨為孤甥罄橐金晉水生徒懷絳帳賢關故舊仰同襟冷官豈是淹徊地未到鄞江有召音教授赴官不以一事千州郡一借一兵罄囊槖寄崔肅之懷州别駕生賢丁盤谷先生有外甥暫屈才能居管庫會看騰踏繼家聲燭花郡舍擁爐坐燭開連夜花主人無喜事應是報還家次韻表叔賈元範見寄二首華表飛來鶴姓丁鹿岩依舊故山青正緣松菊留仙隱興國司理聞至不赴肻為弓車到郡􅈦王參政守永嘉招之不來德者能言書有力仁人自夀藥非靈公平日不服藥壽考康寧坐看世事公應笑落水楊花万點萍記得公歸自汴京暸然目為小生青行能致逺由推轂到即成渠荷建瓴松柏歲寒知節操芝蘭室邇化芬馨白圭三復成陳迹感德傷懷涕泗零某受知于公妻以兄文今有悼亡之戚故去人日喜晴元日至人日幸無隂晦詩因思董勛問却異少陵詩遙想水披凍坐看梅滿枝明朝如得雨正與谷相冝元宵貢院張燈會客知宗即席賦詩次韻欲送群英入帝鄉預燒燈燭趣仙裝銀花𥘉合万枝火金榜巳含千佛光出海靈鼇駕蓬島逐人明月散天香笙歌鼎沸吟篇出元白于詩愧未昌是夕無即席和者故云送丁惠安某假守溫陵獲觀七邑之政治行可稱者三四人然未有出惠安之若者以嚴明為治而濟以廉平以撫字為心催科不優而辦每至郡必講論民間利病田落海而稅不除官鬻鹽而民受害凡此類郡皆行之民無訟牒犴獄屢空是冝邑人懷德繪像而祠之也于其行也詩以送之把麾平海看操刀惟我鄊人治最髙但見武城人易使不同梁竦聀徒勞民懷其愛祠生立吏必如公責始逃聞説朝廷考臧否僉言卓茂德冝褒知宗示提舶贈新茶詩某未及和偶建守送到小春分四餅因次其韻建安分送建溪春驚起松堂午夢人盧老書中才見靣范公碾畔忽飛塵十篇北苑詩無敵兩腋凊風思有神日鑄卧龍非不美賢如張禹想非真坡詩其間絶吳非不佳張禹縱賢非骨鯁謂茶草也知宗贈驢肉以膰肉酬之不駿于乘合見享韓文不駿于乘謂驢也鈐亝指動荷分羔區區膰肉非相報正恐公為孔子行次韻贈新筍候屇中和日漸長籜龍忽到愛松堂便驚詩句含𬞞味更覺庖厨有細香未學坡公參玉板且同韓子賦篔簹荀來茶往非為禮端為詩情故得嘗曽潮州萬頃增闢貢院以元夕落成寄詩次韻韓公來自九重天再見潮陽吏部賢万頃嘗為天官郎唾手渠渠蜚夏屋揮毫混混寫源泉丹霄有月逢三五聖世生才協半千太守落成應有語立朝名節看儒先謂王尚書元龜題並玉堂同年李伯時教授居泉之北門需次家食奉親有堂前對朋山名曰並玉索詩為賦十韻仙李門闌秀氣鍾二山朋盍玉為容晉人瀟灑坐連壁杜老風流吟兩峯崑府煙霞浮几席藍田丘壑藴心胸俯容列岫葭相倚遙許它山石可攻光徹郡城翔白鷺白鷺城影搖江水照黃龍黃龍江價髙難把連城易官冷聊將一榖供疑是璣衡臨處落端如日月合時逢主賔對靣成三友伯仲摩雲拱九重李有難弟堂靣北山雁蕩浪跨鵉有侣雁蕩山有雙鵉峯庾樓徒詫劍相從廬山有雙劍峯庾樓對之綵衣戲罷看山色不似慈顔喜氣濃出郊勸農飯𬞞于法石僧舍時方閔雨有無麥之憂因成八絶清源太守鬢如蓬未遂歸農又勸農農事正興天不雨誰能喚起老黃龍郡城之西有黃龍江二麥青黃雨失時老農相顧但嗟吹使君徒用虛文勸稼穡艱難未必知我昔躬耕隴畒間也知農事最艱難才踈政拙心勞甚無輔于民合挂冠賣刀買犢慕龔遂重穀務農思魯僖僚友共懷憂國碩守臣非皺聀田眉丘濬詩皺却眉頭憂旱潦一心只在聀田中無術能銷旱魃災吁嗟求雨只空回鯫生豈是為霖手明日真人出洞來晉江請蔡真人万歲名山兩度來精廬瀟灑絶塵埃禪師妙得兵家䇿杖屨飄然去不回謂長老勤師荔子今亡法石白法石白見君謨譜今無之江山長帶佛頭青老僧能説陳王事遺冢猶傳女子靈陳王女葬法石僧云時出靈響一徑通幽亭靣墻鳥啼林靜木蒼蒼礙人眼界冝斤斧放出山光接海光食筍蕨葉飛卿見贈作羔甚美因成是詩犢角兒拳共作羔大勝五鼎八珍亨要須歸陟南山采更看新移小竹生先人嘗作蕨詩有陟彼南山采句嚴伯威詩云新移小竹巳生筍皆家鄉故事悼陳提刑耆舊嗟零落南來識太丘有年兼有德無怨亦無求公為監司郡守未嘗按史居鄉不以事于州郡漬室遺風在新橋雅志酬誰知燈火散身世隔明幽元夕貢院張燈公為上客後十日而折聞胡邦衡改知泉州復用前韻上念溫陵為擇人知公名節世無鄰犯顔合在論思地起廢聊為嶽牧臣繆政居前誚粳秕剛腸别久轉車輪天教我輩簮重盍只恐留中拱帝宸次韻何興化德揚閔雨熒惑照南紀千里生塵埃守臣失其聀閔雨腸空摧奔走佞佛老吁嗟禱風雷爍石勢愈熾望霓心可哀民情有愁恨天意那能回緬懷端明公豈薄德與才乞雨問山神胡為亦遲徊鄰邦賢使君道妙藏靈臺不待雨催詩却以詩篇催佇聽鴈糟牀遙期銜賀杯政理隂陽和誠加金石開餘波必及我飄灑桐城隈兩郡桐青青年豐廩崔嵬普天望作霖公盍歸乎來喜雨再用前韻南國久無雨渴心欲生埃麥既枯且死木亦黃而摧方春雲巳火未夏蚊成雷刺使固有罪斯民自冝哀真人及大士久出應思回閉陽縱諸隂愧無董生才林鳩厭呼喚石燕徒低徊有日上扶桑無雲起陽臺方修九淵祀𥘉九日欲祭龍遽聞尺木催想驚阿香夢疑噀欒巴杯夜中簷溜響枕上愁顔開願遍普天下不止泉山隈莫作鼎湖浪因風下崔嵬明朝賀雨詩定自莆中來唐人賦仙都詩黃帝旌幢去不回片雲孤石獨崔嵬有時風擊鼎湖浪散作晴天雨點來次韻龔實之正言見寄堂堂人物冠清流不減當年宋廣州持節分符聊爾耳直尋枉尺斷還不𥘉開宣室漢思賈欲復侵疆魯召丘整頓乾坤趂頭黑早須歸伴赤松逰諫坡烏府迹相望眼底何曽識六郎去國雅欽龔勝節得州欣近鄭公鄊尺書逺荷鴻傳至好句惟憂電取將未見𬗋芝人已説天庭喜氣十分黃出郊迓客至石塔院憩劉公亭觀石筍橋東望郡城南瞻𬗋帽即事有作春日西郊外江亭眼界嘉青桐映樓閣𬗋帽沒煙霞雨過牛耕野潮回鷺立沙河梁阻携手空起逝川嗟用喜雨韻呈龔實之請雨遍群望優優衝塵埃際天麥浪空刺水秧針摧已近尺五天未動滿盈雷地欲赤晉國年將飢魯哀寄箋叩天門好音清夜回似傳上帝意頗亦憐不才披衣起視月在畢方徘徊忽聞蕭蕭聲髙灑熙熙臺郡圃舊有熙熙臺見清原志或云即雲榭也雲陳潑墨暗電光搖幟倠燈前落簷花欣銜少陵杯緑波滿四澤花桞村材開知有一尺霖來從傅岩隈徽廟書啇霖一尺四字賜張無盡正吉到郡之夕雷雨大作不作天寶詞淋零悲馬嵬定有元和詩中䘖諌書來石筍橋清源郡城之西有渡名石筍溪與江會險而深涉者病之𥘉浮為梁屢修屢壞議更以石費重而後艱時提刑陳慨然為之倡弟賀州叶其謀今樞密梁公力助之經始于紹興庚辰訖工于乾道巳丑提刑屢約豫觀未果明年春三月辛酉迓客出郊過而壯之因記以詩刺桐為城石為筍万壑西來流不盡黃龍窟宅占上遊呼吸風濤勢湍緊怒潮拍岸鳴霹靂淫潦滔天沒畦畛行人欲渡無翼飛魚腹蛟涎吁可閔二三大士為時出目覩狂瀾心不忍小試間居濟川手逺水孤舟寇忠愍亦有山僧碩力深僧文繪等董其役解使邦人指倉囷五丁挽石投浩渺万指硺山登嶾嶙辛勤填海效精衛突兀橫空飛海蜃趾千千尺鮫人室護以兩旁獅子楯南通百粵比三吳簷負輿肩走騋牝論功不減啇舟楫遺利冝書漢平凖莫將風月比楊州二十四橋真蠢蠢我時出郊春雨後鷺點沙汀揚鷹凖江亭矯首獨遐觀有客南來杯共引是日邊實之少亭欲詠河梁擬蘇李頗類鑑湖逢稹江山不逢賢太守袖手沉吟覺才窘况無鐵筆擬端明徒使時人笑蚯蚓繡衣屢約吾來逰未遂堪嗟德星隕鄊來嘗以記屬我固避牢辝慙不敏傳聞江欲飛棟𥘉異論紛紛互矛盾世無剛者橋豈成名與萬安同不泯林黃中少卿出守吳興芮國器司業以詩送之有今日桐城王刺史異時遺愛在吾州句用韻寄二公出處平時正且嚴猶于瓜李謹疑嫌兩溪水照新明月郡有明月樓六客堂逢舊𬗋髯孫莘老美須髯嘗守吳興東坡寄以詩云好在紫帽翁黃中亦美髯故云安定化應孚學校謝公思巳結閭閻湖山清逺使君好想見邦人慰所瞻賢關今日陽司業家在白蘋溪上州筆下波瀾含震澤胸中意氣屬清流辨山疊拜南金贈泉嶺逺蒙明月投老矣惟公獨青眼一言褒借勝封矦題蔣元肅藴仁堂人孰無文毋圖報良亦難忽興風樹悲莫盡菽水歡君羔不易嘗而况榮以官向來蔣令君堂乃宰德化時作慶具顔方丹手折東堂桂口詠南陔蘭生封拜君命戲彩慈顔溫教之由義方藴之在仁端仁熟椿亦老親榮心始安堂在人事非思親誠益殫巳足廣文飯方彈貢公冠願移前日孝要作忠臣看梅溪先生後集卷第十九梅溪先生文集卷第十九雜著井光辨豫家之東南有井覆以屋其水清而甘冬溫而夏寒雖大旱水僅盈尺而泉脈不枯井方不及丈然比他井為差巨當先祖之世鄉人目吾居為大井頭王家則是井也固見大於鄉人矣豫闢家孰于井之南紹興庚午季夏之夕僕夫汲而歸以井有光告豫往視之隱隱熒熒如燈如螢如光芒之星不知其果何物也意者魚鱉之族其鱗甲文理晦于晝而粲于夜耶或螺蚌之腹産明珠以自照耶其在物理或之有也惑者好語怪匪妖之則祥之矣豫故以物理辨之二十五夜會趣堂書四友録語曰君子以文會友豫文會梅溪有友四人焉皆佳士也然各有少疵羅文性堅剛而貪墨毛頴工文詞動如人意而不耐久楮先生為人潔白而輕薄子墨客鄉有漸磨之功而好變白為黑也四友與豫文會久矣豫常取其能而不議其疵數年間客上庠陪俊遊果賴四友之力然豫老矣四友方進未休他日竹帛間慎毋相忘子當掩豫疵如豫今日之不廢子也庚午六月丙寅書讀婁師德傳婁師德教弟耐事弟曰人有唾面潔之乃巳師德曰未也潔之是違其怒正使自乾耳豫嘗詠史作師德詩云忤意由來勿校難誰能唾面自令乾直須事過心平後方服婁公度量寬豫性𥚹急常𣣔書婁公傳于座古效古人佩韋之戒偶閥書遂録其事昆弟朋友間有坐豫失者冝書紳焉則事雖大於唾面心自然清涼矣題卓吾貧好作文苦於無書可閲好寫字苦於無紙可書遂於貧中撰出一術以卓為紙以肺腑為書淨几無塵日書數百字吾之無盡藏紙也心之精微日出數百言吾之無盡藏書也從豫遊者有童子數人勞之以研墨之職授之以所書之言日從吾為無盡藏遊也顧謂童子曰吾老矣無盡者有時無盡汝能記吾言使不如几上字而滅沒否乎童子曰唯庚午季夏二十八日書論文説有客與王子論文謂王子曰子以今文况昔文亦加進否乎子應之曰新文之進豫則不知也但每閲舊文背必汗焉耳客曰見舊文而汗背進莫驗於斯也使天假子之言將不一進而巳他日見今之文汗又浹背矣子不見君家名勃者乎滕王閣序最膾炙人口落霞與孤鶩齊飛秋水共長天一色之句當時以為神殊不知此乃少年粗豪之氣俳優之雄者以勃之天資英秀不使早死其文之進殆未可量他日見所謂神句者寧不汗背耶韓退之文章之古者後世莫德而疵之然感二鳥賦乃少年所作學識未逮故有二鳥不如之歎李漢序其文為篇什之首非深知退之者也豫善其説遂退而記之讀蘇文唐宋文章未可優劣唐之韓桞宋之歐蘇使四子並駕而爭馳未知孰後而孰先必有能辨之者不學文則巳學文而不韓桞歐蘇是觀誦讀雖博著述雖多未有不陋者也韓歐之文粹然一出於正桞與蘇好竒而失之駁至論其文之工才之美是冝韓公𣣔推遜于厚歐陽子欲避路放子瞻出一頭地也紹興庚午七月上浣日讀東坡大全集於會趣堂因題于早雜説為善易能不言難過人所不免文之則小人也孟子言仁者如射以其發而不中不怨勝巳也孔子曰君子無所爭必也射乎射有勝負爭之端也君子獨能以揖遜終之遂至於無爭冝怨而不怨當爭而不爭此孟子謂之仁而孔子謂之君子也彼有無爭而爭自起無怨而怨自生真小人之不仁者哉名之所在人所必爭而同忌也能避人之所爭樂人之所同忌斯可謂之君子掩惡揚善朋友之道語曰尺有所短寸有所長豫所短多矣然於交友中常道其善不道其惡是亦寸中之長者昔薑渭叟能言之薑死矣無知我者渭叟負逸才豪氣者也而不修細行惡有所不掩亦朋友之罪薑之念豫蓋有所激云人有毀已已亦毀之何其不長者也豫雖未嘗揚交友之惡然性𥚹躁不耐事聞人毁巳則氣形肝鬲往往亦斥其過於稠人廣衆中言既出口悔心遂生然駟不及舌矣因思韓安國對愧其武侯之言自知其非長者遂書以為戒靈烏説烏之為禽性靈而意忠每預知吉凶而啞啞以告小人聞其鳴則唾罵之烏不以唾罵而廢嗚可調忠矣范文正公謂人有言兮是然人無言兮是然者也君子聞烏鳴則恐懼修省潛銷禍患於未萌人遂以烏鳴為無驗忽之為不靈也殊不知烏能警於未然之前君子能戒之於未形之際是烏之忠計既行而智名不可得而聞矣告之不戒而凶著於形迹則烏之鳴驗是吳之子胥也告之能戒而禍銷於兆朕則烏之智隱是漢之張子房也烏之告豈有二哉所聽有不同耳書院之東隅有烏連曰群噪若有所告者此君子恐懼修省時也作靈烏説夜虹見紹興庚午七月十六夜山月𥘉吐有長虹見于西厥光白踰時而滅人以為白虹異之豫謂是虹之異在時不在色虹見于晝蓋影日而盛色冝青紅或白則為異其見于夜也影月而成白乃其宜耳然虹多現于朝莫間在乎欲雨𣣔晹之際未有影月而現子夜者兹其所以為異與姑志之以俟能言災異者辨待士説有言邑大夫不待士者豫曰子何從知之曰有訟于庭者箠楚之辱及焉豫曰此士之不自待非大夫不待士也為士者服詩書精業履聖賢之是師臭味之與遊謹門户時租稅忍焉以省訟慎焉以逺禍俾足迹不及於公門而官吏稀識其面目雖使柳下惠之弟為邑大夫焉能辱儒冠而陷之虎口耶彼冠焉而士行焉而市旁午里巷而惡少與曹爭競非分而獄訟以興朝投刺以識面莫求判以欺愚雖使周成王之叔父為邑大夫詎可望其施吐握之禮耶大夫非能重士也士實自重非能輕士也士實自輕顧其自待者如何邑大夫何責焉既以答告者遂書為吾黨之戒雜説孟子曰生我所欲義重於生舍生而取義可也嗚呼人之所甚畏者死也義之所生死有不足畏者惟不畏死之人可以成天下之大義立天下之大莭享天下之大名名與謗常相隨因名獲謗因謗獲名雖韓退之猶是也原毀曰事修而謗興德髙而毀來非因名獲謗歟進學解曰動而得謗名亦隨之非因謗獲名歟有名而有謗不若無謗而無名古之哲士必避名非避名也乃避謗也君子小人不難見即其報施之間而觀之則肺腑之隱洞然不可逃矣陳平受賞則不忘魏無知白敏中得志而擠李德𥙿君子小人之用心其厚薄如此賈誼過秦論班固公孫洪贊韓退之進學解真文中之傑也豫少時誦之至熟今為昏忘所奪心能記之口不能道聰明不及於前時冝古人之興歎也賈誼賦過相如楊子雲不知也桞子厚平淮西雅過韓退之子厚自能知之子厚之文溫雅過班固退之之文雄健過司馬子長歐陽公得退之之純粹而乏子厚之竒東坡馳聘過諸公簡嚴不及也唐宋之文可法者四法古於韓法竒於栁法純粹於歐陽法汗漫於東坡餘文可以博觀而無事乎取法也讀進學解韓退之進學解蓋楊子雲解嘲班孟堅賔戲之流也然文詞雄偉過班楊逺矣豫無退之文章學識而一二事與之合公不見信於人私不見助於友與冬暖而兒號寒年豐而妻啼飢是也自志學之始喜誦是文太山北斗仰亦勞矣二十年間跋前疐後無其職而有其窮每𣣔效顰作文以送之又無怪怪竒竒之筆也紹興庚午七月二十二日書三不能戒不善文者冝祕不善書者冝楷不善言者冝省豫不善文而不能祕不善書而不能楷不善言而不能省此其所以獲誚之多者歟今焉知過而能通戒之矣然有時乎不能祕不能楷不能省者文能祕於窗几著述之私而不能祕於埸屋進取之公書能楷於優遊學習之時而不能楷於匆匆應答之頃言能省於心平無事之日而不能省於氣形肝鬲之際烏能使文無愧於不祕書無愧於不楷言無愧於不省書歐陽公贈王介甫詩翰林風月三千首吏部文章二百年老去自憐心尚在後來誰與子爭先此歐公贈介甫詩也介甫不肯為退之故答歐公詩云他日略曽窺孟子終身何敢望韓公由今日觀之介甫之所成就與退之孰優孰劣必有能辨之者豫謂歐公此詩可移贈東坡贈者不失言當者無愧色大舜善與人同説大舜善與人同非與人同為善也蓋能與人同而不立異耳古之獨行之士皆好立異而不與人同如申徒狄之介於陵仲子之廉尾生之信屈原之清皆能為人所不能為然非可傳可繼之法君子不取焉彼以立異為有過於人而不知適所以自小也舜取諸人以為善盡事親之理以為孝由孝悌之道以為仁義是皆人之所可為者舜亦從而為之人之所不可為舜亦不為之矣此所謂善與人同然舜善與人同而衆人卒不能自同乎舜者何耶舜其即同乎人者而行之不息此所以為大聖人衆人一作焉一息焉甚者一暴而十寒焉𥘉與舜同而卒與舜異非舜之不同乎人人自不同之耳子貢贖人而不受金是子貢之不與人同也魯人獵較孔子亦獵較是孔子善與人同也賢人好與人異而聖人常與人同舜孔子為大聖人者非由乎異而大者同焉而巳矣故曰大舜有大焉又曰大哉孔子語曰晏平仲善與人交孟子曰大舜善與人同善者能也語意正相類論語三説孔門弟子有顔回者聖人許之以仁者也有有若者其見道似聖人者也有曽參者悟聖人一貫之道者也於是作三月不違仁説以賢顔子作有若似聖人説以辨其似聖人者非貌作以貫之説以辨其所以告門人之意上智性仁其次修仁其次假仁性之者無心於為仁而所為無非仁者得之於不思不勉之間而從容於顛沛造次之際猶水之不噓而自寒火之不呵而自熱也寒也熱也仁也非水火與聖人之性也哉噓而寒呵而熱修而仁則出乎人者矣惟賢者能修之於終身之久其至也與性之者同衆人假之於日月之暫及其久也則真偽之情見矣顔回雖孔門之髙弟然於仁也非性之者也克巳復禮而為之也孔門弟子孰不𣣔為仁也哉然假之於日月之暫而不能好之於終身之久聖人觀人亦必久而試之使偽為者不能欺於倉卒不備慮之間而真修者亦足以發明於倉卒不備慮之際三月久矣天時變矣而回心不違是終不變矣嗚呼回三月之仁是近而一日之仁也逺而終身之仁也回豈偽為而暫假者哉豈噓呵於頃刻之間也哉説者謂顔子三月不違仁賢於日月至焉者耳未能以之終身也作三月不違仁説以辨顔子論語何以子有子耶桞宗元固辨之矣雖然未知有子也孟子稱孔子既沒弟子子夏子遊子張以有若似聖人𣣔以事孔子事之所謂似聖人者蓋必有子之學識於群弟子中有一日之長其見道有似吾夫子焉如孟施舍似曽子北宫黝似子夏之似也世儒以謂貌似孔子其説陋矣且有子之似夫子而曽子有不逮焉者曾子嘗以喪欲速貧死𣣔速杇為夫子之言而有子不然之曽子質諸子遊子遊曰甚哉有子之言似夫子也子遊之徒知有子似夫子素矣所謂似者必有如辨曾子之言之類豈以貌似之故虛𣣔師事之耶雖然直似之耳𣣔以事孔子事之則不可故曽子不許之而有子未嘗居師之位也説者謂不能答弟子之問遂見叱而退蓋好事者為之辭以誣有子耳然世皆之顔子之後有曽子而不知有子者亦回參之亞匹也序論語者知之故首記夫子之言次記有子之言又次記曽子之言未必言之次第如是也其必寓拍尊之意焉以謂夫子既沒之後其道可尊其人可子其言可法者莫先乎有子曽子也或曰子以有子為回參亞匹夫子曷不以好學稱之如稱顔子又曷不以一貫之説告之如告曽子且不與四科之列何耶曰夫子何特不稱有子亦曷嘗有一言以稱曽子也何特不以一貫告有子亦曷嘗以是告顔子也稱之告之當時有未必盡記後世有未必盡知者焉有子曽子在孔門年皆最少其不預四科之列者未必從夫子於陳蔡故也曽子之後有孟子故曾子之道益尊有子之後無門人故有子之道不顯然孟子嘗稱其智足以知聖人又記其似聖人與群弟子𣣔以孔子之事事之子遊稱之於戴經弟子尊之於論語亦足以發明有子之謂人矣而學者未之知也作有若似聖人之説以辨有子闕書冨家翁逸事後萬序明之手録雜文一卷其首篇乃馮當可所記冨家翁逸事也冨家翁兄甲者未必知書觀其處昆弟之間雖知書者所不能為進之孔門其閔子之徒歟馮記其事而逸其姓第曰兄甲而巳他日史官作宋孝友傳書其事而闕其人當與齊魯大儒同發楊子雲之歎也豫忝知書且為人兄有愧於不知書之甲多矣然心實慕之願學焉吾家他日或無乙之婦庶幾遂其所慕之心未可知也顧謂萬于曰汝東平先生嫡長孫且其家世業儒非冨家翁比豈不能為甲所為耶子為人子弟固非以是責子也然既録其事必有意於為甲者甲不難學少損好利之習則人皆甲矣豫之書是命表弟余壁全之研墨因以其事語之二子從豫遊皆妙齡而秀者其家皆知書過於冨家翁者豫故以是勉之紹興庚午季夏二十五日不孝子王某書記蛙豫有鞋布體而麻質其弊甚十趾不能以自藏有蛙乘罅而入蟄于鞋頰間豫不知也會昏暮如厠而蛙忽鳴俯而視地無所見既行而又鳴豫始疑之既就几席而坐足每動則閣閣然有聲以指摸之有蠢而動者豫愕然未能物色其類呼童子燈之脫鞋而微露一爪乃蛙也命童子出之躍而去東郭先生衣弊履穿貧甚矣然未聞有蛙乘罅而蟄者以是知豫之貧又過東郭一等然鞋非可蟄之所蛙託身誤矣使其不能自鳴幾死于足間豫去歲嘗和韓退之答桞桞州食蝦蟆詩以戒同舍果能止殺是蛙也豈以豫不殘其類故奮身而來託將以脫蟲蛇吞噉之禍於一時耶豫亦幸而不踐之不然幾乎避禍而得禍也感而至蟄而免自鳴以求全蛙亦有知矣勿以其蠢焉而愚之人能持無害人之心而物以其類至能持無害人之心人其有不至者耶時紹興庚午孟秋七月十四夜書記人説前生事豫少時有鄉僧每見豫必謂曰此郎嚴伯威後身也豫不曉所謂既而訪諸叔父寶印大師叔父曰嚴闍梨字伯威汝祖母賈之兄吾之舅氏且法門之師也博學工詩文戒行修飾有聲江浙間為士俗所推重汝父母萱以無子為憂禱求甚力至正和壬辰之正月吾師卒汝祖一夕夢吾師至其家手集衆花結成一大毬字汝祖而遺之曰孝祖君家求此久矣吾是以來匆不見是月汝母有娠至十月而汝生吾師眉濃黑而垂目深而神藏兒時能誦千言喜作詩人以汝眉目及趣好類之且符所夢又謂吾師死之月而汝受胎也故云豫幼從學鹿巖人有指豫眉垂目藏而靳之者表丈賈元逹曰此子眉目類吾伯嚴闍梨他日能文未可知也然嚴闍梨智慧名德卓卓如許縱未脫輪回當復生人間世為大善知識胡為於滅度之後鍾成迂愚魯鈍之性現此窮薄困苦相耶豫嘗寫字作文詒寶印叔父叔父曰人言汝吾師也文僅似之字乃爾不同耶嚴闍梨尤工筆札豫最不善書故也紹興庚午七月二十日因作文寫字兩俱不佳愧而曰嚴闍梨汝前生食𬞞何多智今生食肉何許愚也用記之梅溪先生文集卷第十九
