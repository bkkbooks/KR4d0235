  text: 梅溪先生奏議卷第二
  hash: sha256:aed04a757fe7572fb5001dd86ea30adfb8b5d5b2e0a5cdff13330c86d8e7c553
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_002-1a}
body:
  text: 輪對劄子三首臣一介小臣不識忌諱不知朝廷事體愛君憂國出于天性妄懷婺不恤緯之心竊聞道路胸胸咸謂虜情巨測有南下牧馬巢穴汴都窺伺江準之意廟堂之上惟幄之臣必有料敵制勝之䇿臣不可得而知然議者以謂邉奏有警則群臣失色相顧傳聞稍息則恬然便以為安且謂敵有內難勢必不來夫不恃我之有備而幸敵之有難其謀國之術亦踈且殆矣自建炎至今虜未嘗不內相殘賊也然一酋斃一酋出其勢愈熾曷嘗為中國利哉要在所以自備者如何爾我有先備敵雖強而不足憂我苟無備敵雖有難幸之何益彼或不以有難為畏乘我稍怠長驅而來其將何以禦之耶臣謂今日禦戎之䇿莫急于用人用人之要莫先乎人望蓋知人之術自古所難蕭何不生孰人識韓信于未知名之日孟軻復出亦必取士于國人皆曰賢晉悼公以民譽而用六卿遂成復霸之業東晉以人心而起謝安遂成破敵之計國家寶元慶曆間西夏叛命仁宗以經略安撫之任付之韓琦范仲淹二人雅有時望軍中有一韓一范西賊破膽之謡兵不大用而元昊臣服皇祐中用文彥博冨弼為相朝士相賀仁宗曰古之用人或以夢卜苟不知人當從人望夢卜豈足慿耶元祐𥘉相司馬光遼人夏人相戒曰中國相司馬矣謹無生事人望之能服人如此今若內若外士夫軍民口無異辭咸謂有天資忠義材兼文武可為將相者有長于用兵士卒樂為之用可為大帥者今乃投間置散無地自效或老于藩郡以泯沒其材內為説邪之所􅎱忌外為夷狄之所竊笑天下輿情憤悶抑鬱臣碩陛下斷然為社稷計起而用之以從人望可以作士氣可以慰人心可以寢敵人之謀可以圖恢復之大計陛下縱未大用之亦冝付以江淮重任使自當一面為國長城亦可無西顧憂矣臣又聞范仲淹𥘉以言事得罪尤為宰相吕夷簡所惡斥逐于外及西方用兵仁宗思用仲淹夷簡薦之亦力仲淹果能成功夷簡不失為賢相陛下當以仁宗之心為心大臣當以夷蕳之事為法相與任用天下之賢才以為排難解紛計天下幸甚社稷幸甚其次有舊宰執侍從及嘗言事之臣名莭素著者或守逺藩或食祠祿或已休致或在謫籍並冝起廢置諸朝列其聲名風采亦足以聳動一時謀謨措畫必有大過人者諸將有以驍勇善戰稱者悉冝列置分布于荆襄江淮間以為瓜牙藩屏用賈誼衆建諸矦而小其力之法以駕馭之如是則異人輩出可以供任使矣猛虎在山藜藿不採國有人焉難當自消臣以為禦戎之䇿莫大于此右一臣聞惟辟作福惟辟作威者蓋人主攬權之術得之於此失之于彼者又人主攬權之弊臣請借唐以論唐自髙宗中宗以來權移房闥明皇親平內難懲孽后驕主之禍挈大柄而掌握之可謂能收之於此矣承平既久怠于聽斷內則移于姦臣外則移於藩將是又失之于彼也肅宗再造王室代宗平亂守文而權稍歸朝廷亦可謂能收之于此矣然君臣苟安瓜分土壤以授叛將繼以德宗之姑息自是而後權歸藩鎮矣是又失之於彼也憲宗剛明果斷削平僣叛而權復歸朝廷可謂能收之于此矣晚莭任用非人禍生所忽自是而後權歸閹寺矣是又失之於彼也陛下比懲大臣之盜權收還威福之柄朝廷清明皆謂陛下為不丗出之英主邇者衆口籍藉謂權雖歸於陛下政復出於多門是一秦檜死百秦生也其間最甚者如三衙管軍輩與北司深文固結盜陛下之大權養成跋扈之勢不可制遏昔漢之禍起於恭顯王氏之相為終始唐之禍起于北軍藩鎮之相為表裏今禍胎於內而亂形於外臣竊為陛下憂之夫權之犬者莫如名器與財與兵今以管軍而位居三公是盜名器之極矣古之時無有也祖宗之時無有也又天下之利源財路皆人其門掊克聚斂不知紀極國用日蹙而私室愈冨三家擅魯田氏擅齊殆不過此且身捴禁旅久而不代隂結諸將以為之黨深忌元功宿將之功名者不容其進自恃兵柄在手有輕視朝廷心夫樞蜜者號本兵之地號令節制天下之諸將者也今殿廷立班管軍傲然居前樞密甘心其後而不自以為恥事勢倒置如此不奉行其意旨者幾希其能莭制號令之耶又其子弟親戚咸盜清要之職臺諌有論列之者朝廷必委曲庇護俾其言卒不得行昔唐大將管崇嗣背闕語笑李勉劾其不恭肅宗謂吾有勉乃知朝廷之尊李祐有入蔡縛吳元濟之功違詔進馬溫造正衙抨劾祐自謂膽落於溫御史今臺諌言及侍從大臣隨即罷斥而風憲獨不行於管軍之門其何以為國耶不獨此也至若清資橫加於噲伍髙爵濫及于醫門諸軍置承受福威自恣甚於唐之監軍皇城置邏卒旁午察事甚於周之監謗內外將帥剝下賂上結怨於三軍道路之間捕人為卒結于怨百姓皆非治丗事也陛下自捴攬以來聖政不可勝紀如前日竄逐􅠕閹天下尤服陛下之英斷惟此𢾗事臣所謂得於此而失於彼者可不深懲而痛革之耶臣願陛下慨然彂憤斷自宸衷杜邪枉之門塞僥幸之路鑒漢唐之禍而斥近習懲齊魯之患而抑強臣不惟尊嚴朝廷亦所以保全此類不然臣恐大阿倒持日甚一日天下之憂不特在夷狄而巳此臣所以不避斧鉞之誅為陛下痛哭流涕言之也右二臣聞民為邦本本固邦寧自古人君未嘗不以得民心固邦本為急而尤欲撫綏固結之於動搖疑二之時我國家有天下二百年矣中遭厄運而宗社復興者良繇四海民心戴宋惟舊陛下即位于今三紀深仁厚澤尤著在天下之心然邇年以來監司守令多不得人為國斂怨民心稍離一曰不宣詔條二曰不恤刑獄三曰不先撫字何謂不宣詔條臣伏覩比年寬恤之詔屢下然而實惠未孚于民皆繇州縣不能奉行之敝昔人謂徒挂墻壁今則𥘉未嘗挂凡遇詔下事有便于民而不便於吏者或宣畢而遂匿或略挂而遽收故上雖有良法美意下不得而知者多矣况欲𬒳其澤耶何謂不恤刑獄臣伏覩陛下慎刑恤獄之意雖堯舜成湯亡以加然措刑之效未逮于古者蓋由師帥之任鮮或循良昧者以胥吏為耳目怠者以胥吏為精神貪者以胥吏為鷹犬案牘滿前漫不加省獄情出入動由此曺故富民納賂以買直貧者不能自伸強者劫持以求勝弱者不能自免所望以直其冤者監司也今監司按部動以胥吏數十自隨所至州縣唯務誅求苟滿其欲則獄事一切不問而望其有所平反可乎何謂不先撫字國家張官置吏本以為民要當以撫字為先催科次之昔之循吏勞心撫字而民皆樂輸不待催科而常賦自登夫催科自有常法豈在先期而取辦官以未及期為辦事民當未及期而𬒳虐故常賦未入于官府而橫費已歸于蠧吏矣悍吏持尺牒走鄊閭噭呼墮突雞犬不寧而欲民安其業可乎臣又聞邇者邉奏稍警所在以防秋為名拘集舟船團結保伍措置無術州縣騷然至有鬻田宅以充糧草之賦殺耕牛以供筋角之輸斬山林以為兵器撤室廬以營寨柵吏緣為姦民情大擾苟不有以安恤之切恐民逃其上散為盜賊矣况今夷狄外侮國威不振人心搖動正冝撫綏固結時也臣願陛下推溥博之仁下惻怛之詔勤恤民隱動之以誠官吏有害民者必罰無赦仍命宰相慎擇諸道監司以寄休戚以宣明詔條慎恤刑獄撫字黎元為先務如是則四方萬姓罔不感泣人心既恱寧患天意之不我助耶臣以謂固本以寧邦者莫大乎此右三上殿劄子三首壬午十月臣聞舜受堯之天下序者美之曰重華協于帝武王繼文王而有天下記禮者美之曰善繼人之志善述人之事説者謂堯之所為如是而舜亦如是故謂之協帝文王之所為如是而武王亦如是故謂之繼述臣嘗考其行事乃不然堯之時有八元八凱者天下謂之才子堯不能用至舜乃舉而用之號十六相有共工歡兜伯鯀三苗者天下謂之四凶並在堯朝堯不能去至舜乃流放竄殛之而天下咸服文王在啇之末三分天下有其二而終身執臣禮以事紂至武王嗣位之𥘉乃會八百諸侯興仁義之師以伐之天下遂一統于周舜之所以協堯武王之所以繼文者如斯而已矣曷嘗泥其行事之迹哉此堯所以得知人之名而武王為達孝也與恭惟太上皇帝至仁至聖內不謀之宫外不謀之卿士斷自宸衷以天下大器付之陛下丗皆以堯舜擬之臣獨謂堯舜之遜固美矣然出于耄期倦勤豈若太上皇春秋猶盛而遽為是曠丗絶無之舉哉真可謂賢於堯舜逺矣陛下思所以仰副太上皇之付託者當如何今社稷之大安危生民之大休戚人才之大進退朝廷之大刑賞非有所矯拂更張則無以慰天下之望必矯拂而更張之則必有以不改父之臣與父之政之説而惑聖聽者陛下於此有若難處者焉臣謂太上皇之與陛下可謂父堯而子舜矣以聖繼聖推誠無間豈區區形迹之所可拘臣下常情之所能測哉太上皇既以不疑而待陛下陛下亦冝以不疑而報太上皇三紀聖政可遵而行之者非一也至若因時救弊有所矯拂有所更張冝若舜之所以協堯武王之所以繼文者斷然行之以彰太上皇知子之明以盡陛下繼述之道毋若魯陪臣孟莊子之孝而已則社稷幸甚天下幸甚右一臣聞國猶身也強國與身者氣也醫者觀身之氣而知其人之夀夭識者觀國之氣而知其丗之興衰自古帝王圖回天下雖謀以智辦之以才必以氣為之主然後大業乃濟劉項之爭雄也項自謂力拔山氣蓋丗非也要之項之失天下也蓋以力而劉之得天下也蓋以氣夫百戰百勝一不勝而自謂天亡者氣何在哉婁戰婁敗而不為之屈卒之易敗為勝轉弱為強者氣也蜀先主英姿大度有髙帝凨兵雖婁挫而終不為曺操屈吳孫權聞周瑜之言拔刁斫案遂成赤壁之雋功吳蜀之勢非魏敵也然而能霸有一方鼎足而立者氣使之然也臣來自草茅得之道路謂廟堂之上謀議之臣和守戰之議閧然未決兹理固洞然易曉議者何不思之耶臣謂養今日之氣莫如守伸今日之氣莫如戰挫今日之氣莫如和今我兵寡力弱國威未振固未能與之決雌雄於一戰以伸天下之氣也正須養之使壯俟時而動冝於荆襄江淮要害之地如人身之可以禦風寒者𢾗處命大將屯重兵以固守之縱未能得志于中原亦足以據長江之險都帝王之宅保吳蜀萬里之故疆何故屈已買蹈前日之覆轍耶大抵天下之勢強弱均而和則彼此受其利晉與諸戎和我與契丹和是也強弱不均而和則強者得其利弱者𬒳其害六國與秦和契丹與女真和是也虜以和議譎契丹而滅契丹矣又以和議譎中國而困中國矣耿南仲主和議而致靖康之禍秦檜主和議而弱國家之勢太上皇知虜之無厭而和之不可保也去歲下親征之詔而天下二十年湮鬱之氣亦少舒矣雖淮上之師不利而虜之𬒳毒亦甚矣陛下應天受禪天下罔不歡欣鼓舞咸謂真主既出恢復指日可期也陛下冝親御鞍馬如漢文帝慨然發憤如唐憲宗撫巡六師以作將士之氣以圖進取之計况陛下之聖德可以動天陛下之莭儉可以豐財陛下之英武可以定亂江淮有重臣以為長城川陜有良將以為瓜牙亦何患事之不濟耶不然冝因天設之險以為城池與民守之可也苟或復用和議則軍民解體雖苟一時之安而氣已為之索矣百萬之歲幣固有所不惜也至尊之名分其可自貶損于嗣登大寶之𥘉乎諸將用命血戰新復數路其可復捐而與之乎西北之民襁負來歸者不知其幾又可復委之虎狼而使之甘心乎况講和之復舉天下惟虜之命是聽無厭之求難塞之請當不止此陛下將何以應之乎臣謂今日之計戰固未可輕和決不可議守以養氣俟時而伸乘機而投而巳右二臣聞人主之職莫大於論相尤冝遴選于嗣位之𥘉論相得人則可以相與大有為遴選於嗣位之𥘉斯可以慰天下惟新之望昔舜之受命也選於衆而首舉皋陶湯之革命也選於衆而首舉伊尹髙宗中興也首求諸野而爰立傅説成王訪洛也首以師保而並處周召漢髙祖首相蕭何而成創業之功唐太宗首相房杜而致貞觀之治明皇首相姚崇憲宗首相杜黃裳武宗首相李德𥙿我太祖之有天下也宰相雖因周舊其自圖任也則首用趙普仁宗即位之始則相王曽又以李迪張知白魯宗道為宰執皆正人也英宗因舊相韓琦曽公亮而委任之又起冨弼為元樞用歐陽修為參政治平之治最號得人神宗又因治平宰相而委任之及韓琦既去則代以冨弼元祐乘簾之際首用司馬光又起文彥博於已老平章軍國重事又相吕公著又並相吕大防范純仁元祐人才於兹為盛歷代帝王與我祖宗任用大臣皆極一時之選又皆遴擇於新政之𥘉足以厭伏天下人心君臣相與有為各成一代之勳業人主之職其有大於此乎共惟太上皇授陛下以大寶位又以一相遺之虛右揆以待陛下自擇天下莫不拭目以觀此舉臣碩陛下擇諸內外千官百辟之中孰有清德雅望負王佐才者孰有兼資文武可以救時活國者必諸大夫國人皆曰賢天下蒼生望其起者然後用之可也苟惟不然寧虛位以俟之不可使庸人鄙夫僥幸而得以失天下之望非特此也人主之聀雖在於論相至若侍從臺諌亦不可不親自識擢宰相得人則內可以尊安宗社外可以鎮服四夷又得賢侍從以論思獻納真諌官以拾遺補過才御史以糾肅官邪如是則內之百執事外之監司郡縣皆可以得人陛下端拱一堂之上群天下人才如意而任使之內修外攘中興之功不日可兾矣右三應詔陳弊事厥今天下之敝安在哉在乎中外小大之臣各居其官而不知其聀也居其官食其祿因循苟且曠聀不修𣣔望敝事之革治道之興可乎臣請言其大者夫進退百官者大臣之聀也獻納論思者侍從之職也為天子之耳目正朝廷之紀綱者臺諌之聀也內之卿監百執事外之監司守令莫不各有其職焉比年以來為大臣者果能盡進退百官之職乎臣見其進百官不見其退百官也今日召某人赴行在明日除某人為某官是固能進百官矣其所進者未必皆賢才率一二歲或半歲或踰月類皆遷之𥘉不問其職事之修與否也其或有罪必待臺諌論列然後從而出之或人主之意有所不恱則諭之使去而大臣未嘗自退百官居進賢退不肖之職而所進者未必皆賢其不肖者又不能自退之臣知其故矣是巳欲收恩而不敢任怨也先正王曽有言曰恩欲歸巳怨使誰當為大臣而不敢退不肖寧不愧王曽之言乎此大臣失職也為侍從者又果能盡獻納論思之職乎臣見其各司其局而未聞獻納論思也熙寧𥘉司馬光以論新法不從力辭副樞之命神宗曰樞密兵事也不當以他事辭光曰臣未受命猶侍從也於事無不可言者是則居侍從者事皆可言是謂獻納掌內外制者不止於代言為給事中者不止於封駁為尚書侍郎者又不止於各董六官之屬也今之居是官以各司其局為了官事以獻納論為越職寧不愧司馬光之言乎此侍從之失職也為臺諌者又果能盡其所以為耳目正紀綱之職乎臣聞歐陽修有言曰天子曰是諌官曰非立殿陛之前與天子爭是非者諌官也又聞蘇軾之言曰言及乘輿則天子改容事關廊廟則宰相待罪今之為臺諌者果能爭是非於殿陛之前如修之言否乎又果能批人主逆鱗而使之改容如軾之言否乎臣往歲備貟館職竊聞臺諌有論事不行者而同列不為之助乃曰我自有躰又有緘默不言者聞侍從百官言時事則怒而逐之臺諌之職果如是乎祖宗時臺諌論事或一章不從至于十餘章而未嘗但巳言茍不行則繼之以去趙抃為御史言陳升之不當除樞副凡十有六章於是乞郡而得虔司馬光為諌臣論刺義勇及乞降黜凡十有三章今之論事者或一再不從遂不敢復言寧不愧光抃等乎此臺諌之失職也至若內之卿監百執事外之監司守令其失職之敝有不勝言者臣竊謂欲盡革今日之敝冝首䛇大臣修進賢退不肖之職內之侍從卿監百執事孰為賢為才拔其尤者一二人而進用之孰為愚為不肖亦取其尤者一二而人而斥退之外之監司郡守孰為賢才而稱職者拔其尤者一二人而進之於朝孰為愚不肖而為民害者亦取其尤之一二而置之於罪詔下旬日之間必責大臣以進賢退不肖而必欲其當如是則進一二人而中外莫不勸退一二人而中外莫不懼是則大臣之職舉矣于是又䛇侍從冝修獻納論思之職凡朝廷闕失知無不言而不止於各司其局又䛇為臺諌者冝盡所以為耳目正紀綱之職拾遺輔過紏肅官邪凡有論列不可但巳冝以祖宗臺諌為法而痛革前日緘默不言之敝雖然此特人臣之職也而人主有大職事陛下不可以不知一曰任賢二曰納諌三曰賞罰臣聞詩人美宣王曰任賢使能周室中興焉任賢乃人主之職而尤急於興衰撥亂之時陛下邇日召元老正人或置之政府或置之臺諌或置之侍從天下翕然稱為治表臣碩陛下既來之則冝力留之既留之則冝推誠委任之勿貴以繁文勿待以虛禮勿二之以小人延之歲月可以責治效矣又陛下既以強埸之事委之重臣良將冝若憲宗之任裴度斷然勿疑無惑乎紛紛之議而事從中制以失其機會臣竊聞張浚欲守淮而議者欲其守江吳璘屯兵德順而議者欲其退保夫守淮乃所以守江也舍淮而守江則長江之險與虜共之矣江其可守乎唐韋陟欲李光弼退保潼關光弼曰兩軍相攻尺地必爭今委五百里而守潼關賊得地勢益張矣力破其説而成戰功三路之地陷沒久矣今幸力戰而復之乃欲無故而棄之可乎陛下冝䛇之曰閫外之事將軍制之可進則進可退則退如是則事不中制而機會不失矣臣聞傳説告髙宗曰木從繩則正后從諌則聖髙宗命之朝夕納誨而中興有啇聽諌乃人主之職而尤急於興衰撥亂之時陛下自即位以來雖擢用正人以為臺諌然聽納之美猶未彰聞臣竊聞近有以酤榷之利而持使命於浙東西者諌官論列不聽陛下又親批聖語以諭之有識咸以為疑易曰開國承家小人勿用陛下嗣位之始何急於用言利之臣又何以知此曺之名至於咈諌而用之乎又聞諌官有以盡言而去職御史有以振職而出臺此必姦臣有以誤陛下者不可不察陛下比嘗下䛇求直言矣未聞賞一敢言之臣以勸言者乃聞交結左右者得官迎合時事者免解賞諌如此其何以勸夫聽諌之道在乎博詢廣覽不可昵於偏聽而蔽其四達之聰明臣碩陛下親君子逺小人推誠聽納養成聖德則納誨者皆傳説而髙宗不獨聖矣臣嘗聞漢史贊宣帝曰綜核名實信賞必罰明賞罰者乃人主之職尤急於興衰撥亂之時臣竊見邇年以來有姑息之政無懲戒之罰去歲逆亮之死蓋上皇聖德所感天假手其徒以誅之諸將非唯無毫髮之功虜未退則逗留觀望已退則乘勢虜椋既不干斧鉞之誅而又受無名之賞有盜莭鉞者有為兩府者有為三公者傅呼道路取笑閭閻名器之濫未有甚於今日又有爵位巳崇而遷猶未巳官曺已冗而員又復增政或出於多門命從或於中降是皆為新政之纍不可不革也至若有罪者不誅而惡無以懲又今日之大弊秦檜敷權誤國二十年而乃生極寵榮死封王爵天下莫不切齒扼腕縱不剖棺戮尸其可不行追貶之誅乎又前日閹寺有弄權納賄紊亂朝綱者大將有聚斂交結敗壞軍政者大臣有進不由正迷誤國家者臺諌有朋姦罔上惡直醜正者或依城社以自安或盤根錯莭以自固或以去位而幸免典刑不正非大舜所以去四凶而服天下者臣聞太上皇即位之𥘉任用賢相追貶元惡竄殛姦邪天下稱快所以能中興我宋致治三紀者由其能大明刑賞於躰元居正之𥘉也陛下冝奮乾剛之斷法虞舜之明繼述太上皇故事先正首惡之罪而追貶之餘則次苐施行如是則可以攬威福之權而陛下之職舉矣夫欲救今日之敝非至誠任賢納諌大明賞罰以勸懲之雖啇髙宗周宣王漢宣帝復出不可以致中興之治故臣碩陛下先舉其職以率百僚如是則中外大小之職罔有不舉而敝寧有不革者耶敝事既去內治既修則夷狄有不足攘祖宗之境土指日可復矣論左右史四事與起居郎胡銓同上臣等誤蒙親擢承乏左右史自供職以來檢討故事竊見今之史職廢壞者非一其尤甚者有四焉一曰進史不當二曰立非其地三曰前殿不立四曰奏不直前何謂進史不當臣聞唐楮遂良知起居注太宗問人君得觀之否對曰史記善惡以為戒庶幾人君不為非法不聞帝王躬自觀史魏謨為起居舍人文宗遣中使取記注欲觀之謨謂史官書事以為鑒戒陛下所為善無畏不書不善天下之人亦有以記之帝乃止遂良與謨可謂能守官矣至國朝梁周翰李宗諤為左右史乃建言每月起居注碩先奏御付史館國史書之曰進起居注自周翰等始豈不愧唐二子哉慶曆中歐陽修為起居注嘗論其失曰自古人君皆不自閲史今撰述既成必録本進呈則事有諱避史官雖欲書而不敢乞自今起居注皆不進本仁宗從之厥後佞臣執筆乃復進史沿襲不革遂至于今臣愚欲望陛下遵仁宗之訓革周翰之失自今起居注皆不進呈庶使人主不觀史之美不敷在于李唐二君也何謂立非其地臣案唐制每皇帝御殿則左右史夾香案而立善惡必書其後許敬宗李義府動必懷姦懼為史官所記遂廢左右侍立之職凡謀議皆不預聞文宗復正觀故事每入閣命左右史執筆立于螭頭之下由是宰相奏事得以備録故開成之政詳於史書國朝故事天子坐朝則記注臣立於御坐之後歐陽修以謂起居者當視人君言色舉動而書若立於後則無以盡見乃徙立于御坐之前至修罷職乃復立於後今乃逺立於殿之東南隅言動禾嘗或聞可謂立非其地有愧於修多矣臣又聞元豐三年修起居注王存奏欲追正觀故事使左右史得盡聞天子德音儻以二府自有時政記即乞自餘臣僚登對許記注侍立神宗曰人君與臣下言必關政理所言公公言之自非軍機何必祕密蓋人臣奏對或有頗僻或肆讒慝若史官書之則無所肆其姦矣大哉王言然未及施行至今議者惜之今史徒有左右之名而不知天子言動之實群臣奏對並以無所得聖語關報職記注者但不過録諸司供報公文而巳何名曰史耶臣愚欲乞陛下復歐陽修侍立故事庶幾言色舉動皆得以書如宰執造膝之言自有時政記亦乞如王存所請凡餘臣奏對許令侍立亦足伸祖宗之志也何謂前殿不立臣歷觀自古左右史未嘗不侍於天子之側亦未嘗有前後殿之分唐制但云左右史分立於殿下螭頭之側和墨濡翰皆就螭之拗處有命則臨陛俯聽對而書之不聞後殿立螭而前殿不立也又聞歐陽修奏請自今前後殿上殿臣僚退合少留殿門俟修注出面録聖語以此知國朝舊制前後殿皆侍立矣夫人主言動不獨後殿有之而前殿無也宰執奏事百官進對之言不獨後殿有之而前殿無也今獨後殿侍立而前殿不與義安在耶夫後殿侍立雖非其地然猶立焉亦愛禮存羊之意前殿不立是餼羊亦去而禮意俱亡矣今左右史分日而立無言動之異臣愚欲乞於前後殿皆分日侍立庶幾一言一動皆得以書以備一朝之典謨光千載之史册非細事也何謂奏不直前臣聞唐文宗謂魏謨曰事有不當毋嫌論奏謨對曰臣頃為諫官故得有所陳今則記言動不敢侵官帝曰兩省屬皆可論朝廷事而母辭也故國朝左右史皆許直前奏事雖以奏史事為名而朝廷事亦可議焉蓋亦文宗命魏謨之意也熙寧中修起居注張琥奏曰近日緣例須牒閣門然後上殿竊見樞密都承旨每於侍立處尚得奏事起居注既得侍立或有敷奏乞便面陳詔從之臣等自領職之後𥘉欲直前奏事閣門以臣不預牒却之臣又嘗預牒之矣又謂今日無班次臣每見閣門奏事未嘗以班次為拘左右史職言動當日有敷奏乃必欲預牒閣門又必欲有班次則事有當奏而不得奏其為失職多矣臣又聞景祐中御史唐介論宰相文彥博仁宗怒之時蔡襄為起居注直前論救事出一時又曷嘗預牒閣門與必俟班次耶况今來後殿奏對未嘗無兩班如是則記注之臣雖有直前之名而無可奏之時矣臣愚欲乞自今左右史奏事當令直前不必預牒閣門及以有無班次為拘臣等所陳四事皆近日記注失職之大者臣等濫居是職敢不盡言伏望陛下考古驗今循名責實斷而行之不勝幸甚梅溪先生奏議卷第二梅溪先生後集卷第二詩丁丑二月二十一日集英殿賜第太平天子崇儒術寒賤書生苛作成槐市育才叨舍選楓宸唱第冠時英聖恩寬大容愚直御墨褒嘉偑寵榮却笑劉蕡不遭際徒令紙上有虛名遊天竺贈同年雅會清時不易逢吾儕今日此遊從逼人英氣湖光瑩照眼恩𫀆草色濃文盛一時俱俊傑名先千佛愧踈庸致身許國冝相勉莫學平津但取容贈閻同年安中飄飄吳蜀兩衰翁尊酒論文偶會同名在儒科雖後我言關國體豈如公休嗟世路多巇嶮共報君恩有朴忠此日遊從足可惜行將渭北與江東閻和詩敘别再用前韻我本東嘉田舍翁登科偶與蜀龍同盍簮經月欽高誼分𬒮令人念此公幕府可能淹俊傑宸襟應亦記精忠他年欖轡遊吳越訪我茅廬浙水東贈梁同年介君家錦水邉我居浙江東各在天一涯芳尊偶相同君方富青春徑氣吐長虹我老志亦衰倚麻愧蒿蓬會合已踰月周旋見高風久客思故鄉歸心各匆匆贈君無别言相期盡孤忠次韻陳大監掞見贈中興天子尤崇儒衆賢彚進如聮珠鄒枚待詔萃金馬臯夔接武相俞都䇿士𥘉期異人出不尚虛文與聲律况當盛世多賈生朝錯豈容為第一自慙俗學非名家遺經獨抱居東嘉韲鹽太學浪十載豈有文許時人夸芻言旅奏宸庭䇿狂妄誤蒙明主擇生夭偶在千佛先材劣名浮有餘責頴川丈人詩絶竒長篇勉我母趍時𣣔報君恩答知巳胸中耿耿何當施次韻劉長方司户見贈楓宸昔羡君登第蓮幕今慙我效官相見可嗟頭井白老來自合量俱寬不嫌此日成名晚最喜平生取友端待報君恩知死所却同神武挂衣冠陳大監用賞梅韻以贈依韻酬之頴川丈人賢矣哉青眼喜為清流開詩章翰墨兩竒絶筆下一字無塵埃品題人物奬後進搢紳樂善公為魁東嘉賤子生太晚猶幸識此真人才朅來西遊也不惡錦囊所得俱瓊瑰區區科第何足道此行似為詩篇來客中拜貺更重復丙穴魚及郫筒杯大監近以魚水見貺寒鄉故舊問歸橐首言帶得公詩回大監復贈詩𥿄尾有留飰語再用韻以謝平生漫學乎歟哉心茅胸棘鋤不開得公新詩一再讀便覺胸宇清無埃銀鈎妙畫發光艷照眼有如參與魁鯫生肺腑非太白公似工部尤憐才旅中屢獲錦繡假但愧𣣔報無瓊瑰豫章一榻不妄下賢非徐儒安敢來荷公此意最敦篤一笑當奉論文杯鄉心如飛不可遏更為長者遲遲回謝榮帥薿贈御書孝經用陳大監韻輦轂之下先彈壓兹言雖佳未足法丈人身居彈壓地撫字心勞民自洽神聖當天萬物春王畿共理嘉得人雲漢昭回賜優渥不特為公端為民聖經一章公獨得黃堂蔥鬱生春色賢哉名卿才大夫匪懈事君端可則石刻分餘猶及我榮耀驚聞浙江左從今蔀屋光屬天更有寵褒雲八朵某前日廷對蒙宸翰八字之褒願公勉為不朽傳長如治吳與治川要令列郡法青白了無一吏橫索錢陳大監餞别用前詩珠字韻以謝宸廷僥冒先諸儒寵褒况獲驪龍珠謂宸翰也青衫黃牒拜君賜紅蓮緑水官留都明日扁舟𣣔東出訪别長憂礙新律丈人呼酒如韓公賤子愧非張十一酒闌未放客還家活火煎泉亨葉嘉西來頻下豫章榻盛事當作還鄉夸始終尚賴公鞭䇿邪正途中知所擇捐軀誓報明主恩青史庶逃千古責况公自是人中竒境鄰吕望逢明時行持從橐奉清問美惡願分嫫與施用陳大監韻謝王國録季羔見贈吾宗神秀時名儒贈我三百隋侯珠野人不識希世寶但見照眼清而都我昔遙從鴈山出旅食賢關淹歲律雅欽陸子常患多更歎張融可無一長淮久絶誰起家青箱有君殊可嘉祠科得雋誚子厚何止文許後生夸我拙慚無濟時䇿老境𥘉官尚何擇江南蓮幕君故鄉竊芘聊逃簡書責寒賤誤蒙君見竒祖别贈言榮一時明日東歸詫閭里五絶首稱虞伯施陳郎中公説贈韓子蒼集唐宋詩人六七作李杜韓桞歐蘇黃近來江西立宗派妙句更推韓子蒼非坡非谷自一家鼎中一臠曽已嘗丈人珍重贈全集開卷爛然光熖長詩如此公固足貴賜者仁出尤難忘兼金白璧不足道願寶兹集為家藏鯫生幸脫埸屋纍老境𣣔入詩門墻古詩三百未能學句法且學今陵陽章季子贈端硯有客贈端紫剛方如正人裔傳家万石力助筆千鈞磨鐡嗟吾老著書欣爾新何當與毛穎相約侍嚴宸次韻陳大監赴天申節宴聖主仁心等南北燧息邉庭兵不宿兩階干羽來逺人大度端能包濮祝萬歲三呼誕彌月四海千秋太平曲宴開文德賜群臣喜溢天顔明四目向來獻夀人誰在元凱重登共鯀逐武夷戎監老風騷去國十年官始復捧觴首賦天保章遙指南山祝君福更獻曲江金鑑録不但能歌連理木賤臣逄時最僥幸歸美寧辭𬋩城秃願同韓愈頌元和兼美武公歌緑竹謝李侍郎琳贈銜書君不見西京孝武稱材雄致治𣣔與唐虞同詔求賢良論闕政翻取曲學公孫洪又不見文宗在唐號儒雅制詔勤勤䇿群下劉蕡切直棄不枚卒使太阿歸宦者吾皇䇿士親臨軒不為故事求空言猶疑有司效馮宿或恐前列登公孫九天賜下飛奎翰照眼昭回倬雲漢抑尚忠諛有訓詞品題髙下由宸斷儒宗𬒳命持文衡銀鈎拜賜恩非輕歸將樂石刋聖語分貺下及狂愚生畎畝惓倦蓄忠憤射䇿自慙言不盡它日倘陪鴛鷺行願效魏公攄底藴塗中得寶印叔二詩次韻十年行役厭間關一第𥘉收鬢已斑重念此生難報處君親恩德重丘山雙親不見不勝悲銜恨何曽有住時二叔尚存俱白首歸來猶足慰衰遲次韻寶印叔題璧二絶風掃園林萬木殘道人眼界却宜看北窗跌坐對松柏人物青青俱歲寒早已心潛不二門猶將土苴與人論未須隻履西歸去隱居髙躅已茫然潛德如公亦足賢早見鄉評稱孝子晚聞詩史記凶年事殊伯道兒宜有行過王圭廟已先滿腹玄談共誰語九原歸去訪伊川宿羅漢三絶𣑽舍十八所道埸皆矩羅兹獨號羅漢想應無漏多雁蕩屢經眼箇中方再遊何時脫塵鞅來此飽清幽故鄉從此去借問幾時還先去聲自思兄弟那堪宿雁山遊大龍湫和前韻十年重到大龍湫千尺新流勝舊流會見四方霖雨足老龍還向此藏頭遊靈岩輝老索詩至靈峯寄數語雁蕩冠天下靈岩尤絶竒煙霞列屏障煙霞障日月明旌旗屏旗峯岩前有卓筆卓筆峯可以書雄詞天聰况非遙天聰洞􅚡然聽無疑願起靈湫龍霖雨行何為願用真柱石天柱峯永支廊廟危願煽造化爐煽韛爐四海歸淳熙願招鵉鳯友雙鵉峯朝廷相羽儀何人夢石室石室屬靈峯妄誕夸一時那能了世緣未免貪嗔癡名山誤見汗公議安可欺願借靈湫水一洗了堂碑詩以寄老禪狂言勿吾嗤題瑞岩雁蕩看不足瑞岩遊更貪鬪竒雖有愧藴秀了無慙澗古水鳴玉寺幽山染藍匆匆一宿去未暇問三三題天台國清寺十里松聲接澗泉清音入耳夜無眠寺有清音亭宜於四絶中稱絶四絶事見寺碑誰向三賢後更賢豐干寒山恰得寺就已無陳日月寺建於陳而成於隋時清長是宋山川𥘉智者云此寺成國即清矣故號國清真廟時賜號景德國清明朝杖屨尋劉阮不待桃花入洞天題大慈寺巍嶺迢迢入翠微𣑽宫佛隴鎖煙霏斷碑古寺曽經眼剛笑陳隋往事非題石橋二絶路隔山凡意可通石橋容我踏長虹橋旁方廣人遊久不在登臨杖屨中石橋未到已先知入眼端如入夢時舊嘗夢遊僧喚我為嚴首坐前生曽寫此橋碑天合石橋記乃求嘉僧嚴伯威書菴僧有説前生事者戲及之萬年贈鄉僧賁老夢魂驚斷石橋邉身帶煙霞入萬年賓主相逢意良厚永嘉縫掖永嘉禪學通儒釋浩無邉江浙聲名二十年見説胸中有論語𣣔從師向此參禪賁能談論語過鑑湖翔風吹水鑑湖寒千里扁舟赴幕官路入蓬萊天尺五眼中見日與長安民事堂某誤蒙親擢贊幕會稽天語丁寧俾知民事聞命驚懼愧不克堪因榜所寓𪠘舍曰民事堂庶幾朝夕不忘聖訓仍書五十六字以自警時紹興丁丑十有二月也親擢深蒙聖主恩宜知民事訓詞溫仰惟睿意思邦本要使書生識治原不憚勤勞駝禹會敢忘精白奉堯言它時上問蒼生事願竭孤忠慷慨論臘月望日出郊探春遊告成觀謁大禹祠酌菲飲泉遂至龍瑞宫觀禹穴薄暮而還禹􅌾稽山不記年丹青落盡廟依然神文祕在藏書穴儉德流為菲飲泉龍瑞峯巒高近日鑑湖煙水澗浮天東州佳處略經眼自笑好竒如馬遷采蕺采蕺思越王也越有山名蕺蕺𬞞類也王所嗜焉豫嘗登是山故作是詩以思之陟彼越山言采其蕺我思古人中心悒悒維國有耻吳弗遑粒膽于坐偶霸勳以集陟彼越山言采其茗越有卧龍山勾踐舊治山有竒茗故次章及之我思古人中心炳炳維國有耻夕弗遑瞑焦心以思沼吳之境厥草匪甘厥𬞞匪香維其味之豈曰嗜之心焉孔焦膽焉亟嘗唯其苦之是以取之我陟高岡瞻望東越訪王之祀曠古有闕宜廟于山世享不絶何以薦之蕺茗是擷秦望秦望哀秦之過弔兹山之不幸也瞻彼秦望崇于會稽曷云其崇登焉而紫孰登是山西方之人兮瞻彼秦望輕于會稽曷崇而輕名之以嬴孰名是山東方之人兮我登稽山思禹之績吾儕不魚繄帝之力我瞻秦望哀秦之過雪彼黔首其誰之禍禹駕而遊夏民以休有翼其行稷卨是謀政轍而狩嬴隨以仆孰稔其惡斯高左右孤竹兄弟殍于首陽山與其人嘉名孔章溪辱以愚泉汚以盜物之不幸名惡而暴浙濤如銀鑑流如紳濯彼崔嵬勿汚以秦迎春遇雪飛雪送殘臘帶花迎早春西疇農事及愧是不耕人元日冒雪赴天慶觀朝拜既趍府拜表還舍飲屠蘇酒因思去年元日亦不在家感而有作幕府𥘉官愧不才琳宫朝拜獲參陪藍輿去踏攙先雪蓬鬢歸銜最後杯禹穴地幽寒未歇堯天日近暖先回年年元日身為客孤負吾廬溪上梅賀何正言用蔡君謨韻御筆親除真諌官翕然輿論巳騰歡正人得路言無諱聖主虛懷聽不難莫厭封章針衮闕要令姦膽落毫端鯫生雅服陽公德時把昌黎諌論看寓小能仁寺即事書懷小園青徑梅溪老緑水紅蓮越幕賓藥褁隨身多半夏花枝照眼只常春時若痰嗽多服半夏𪠘舍唯有常春一根郡樓鼓角聽殊逺僧舍鍾魚聞巳頻窗外清風數竿竹淡然相對淨無塵同莫教授朱縣丞朱司理遊西園黎明出城郭偶作西園遊春淺花未都池寒緑𥘉抽湖山𣣔縱目煙靄浮不牧𥘉來興非淺心賞殊未酬賴有三君子清談洗牢愁更期春色濃携樽泛仙舟次韻濮十太尉賞梅春向群芳頂上來可人風味亦竒哉未於茅舍踈籬見先為金枝玉葉開竹外橫斜才數點笛中搖落已千堆因公撩我惜花意深憶去年湖上杯題夀樂堂用東坡韻贈楊元賓僉判蓬萊閣下蒼龍古萬壑千岩擁仙府夀樂堂西靣卧龍壑月岩風滿窗户蒼松溜雨大十圍緑水浮荷深一股作堂主人久黃壤仁智風猶似鄒魯詩仙騎龍已上天妙句光芒照寰宇青山偃蹇只如昔高處去天無尺五楊侯淮泗老儒學文字撑腸筆風雨朅來贊幕古東州要與青山作盟主虛堂宴坐飽風月此外一毫端不取它日從公物外遊貝闕珠宫酌瓊乳元賓贈紅梅數枝江梅孤潔太絶俗紅杏酣酣風味簿梅花精神杏花色春入蓮洲𥘉破蕚花在夀樂堂前蓮者中膽瓶分贈兩三枝醒我沉痾不須藥時某以􅍚在告願公及早辦芳樽酒暈氷飢昜銷落𪠘舍有修竹數竿瀟灑可愛誰栽窗外碧琅玕瀟灑尤宜老眼看寄語後人母翦伐更須時為報平安龍瑞道士贈蘭有客贈芳友曽端伯目蘭曰芳友滿堂聞國香清含道流氣輕帶羽衣黃綴佩風光别橫琴旨趣長重須尋禹穴一曲聽揚揚道士善琴吳秀才克家以夀樂蓮洲中千葉梅花為贈酬以詩東君次第染群芳更與南枝別樣粧水漲春洲浮鴨緑日烘花臉帶鵝黃雪中瓊蘂不多辦酒後玉飢無此香謂紅梅也玉潤氷清總佳士驛筒相繼贈春光吳君乃楊簽判胥上丁釋奠備數獻官書十二韻呈莫子齊教授趙可大察推魯人呼東家陳蔡不火食當時雖高第往往亦愠色孰知夢奠後廟祀亘無極嵬然衮冕尊王侯靣俱北武成祭上戊龍棄配杜稷隆殺良不同論功豈如德去載遊上庠觀禮杏壇側備樂閲九奏銀𫀆爛千億兹焉客蓮幕濫與爼豆職登階瞻睿容炳睟若親識壯哉芹藻宫不減魯矦國歸賡泮水頌才劣慙史克會稽三賢祠詩并序越有三賢祠曰吳先生曰唐候曰蔡孝子吳先生名孜嘗事安定胡先生瑗以文行稱捨所居為府學有功於風教為多賢於許詢賀知章輩一等矣唐侯名琦建炎間越師叛命以城􅑙虜侯奮自行伍憤然袖甎擊虜酋至死罵不絶口有靖康李忠愍風非古刺客比也蔡孝子名定以死贖父罪自沉于河與孝女曺娥相望於千載間異世而同烈某比因上丁至學見西廡吳先生有祠堂詢之莫教授而知其事因語莫君宜有以記之異日坐幕府吏具郡祠歲所常祀者中有旌忠愍孝二廟某命吏訪其詳因得舊越守傅公嵩卿祭唐侯之文及蔡孝子所親撰銘志與越人題跋奏狀等嘉難者纍日因作三賢詩以記其大略庶幾好事君子相繼有作以發揚其幽光亦所以助吾君旌遺賢奬忠孝激勸風俗之一端也吳先生祠安定先生賢矣哉一時高第俱英材詵然逹者播廊廟貧賤亦足光蓬萊會稽吳君更超絶至今士子猶能説講堂鳴鼓規使君可使清風聳朝烈越中士人言者府學𥘉成太守張公伯玉至學以便服坐堂下先生鳴鼓行學規太守欣然受其罰求田問舍遺子孫錢愚地僻何紛紛不惜池塘種芹藥一段竒事前無聞君不見唐室蓬山稱賀老乞得鑑湖歸去好却將儒服變流沙更遣門闌亦歸道又不見晉朝名士高陽公許詢捨宅為寺今大能仁是也才名上下王謝中乃心𣣔出三界外山隂宅化瞿曇宫先生識見高流俗不作二公緣禍福寄語多才鄭廣文乞與毫端記高躅旌忠廟國家往往艱難中搢紳節義掃地空靖康有一忠愍公建炎獨有唐侯忠唐侯爵位何曽隆身居行伍儕羆熊平生經史漫不通嚴霜烈日藴在衷憤然一奮不顧躬太尉奪笏嗟匆匆子房鐵椎計已窮張巡就縳氣尚雄杲卿鋸解罵未終忠血義肉塗地紅烈氣英魂簿蒼穹事驚朝野聞帝聰立廟旌忠浙江東睢陽雙廟同高風名書青史等岱嵩當時開門誰納戎貽臭千古如蛆蟲愍孝廟我昔嘗讀黃絹碑長歎越國無男兒孰知種山山下水千載有此一假竒嗚呼哀哉蔡孝子風烈逺過恢與羈乃翁白首困縲絏半年不脫兒心悲請身荷械代父罪或甘黥涅居軍麾况遇兵興擊叛卒身先矢石死不辭當時非無賢太守時越守翟公孝子抱志終不施人間無路可赴訴投命河伯祈天知自為銘志及訟牒𣣔訴以魂贖以尸精哀意切語不怨孝與忠厚俱天資臨河更效結纓死顛沛於禮曽無虧父脫纍囚子願畢身在九泉甘若飴名聞九重獲旌表賜廟愍孝風華夷胡為祠宇乃如許一間破屋河之湄未聞設誅有度尚絶妙更欠邯鄲祠我來贊幕欽孝烈顧瞻廟貌成吁嘻他年太史作佳傳願於𥿄尾書吾詩梅溪先生後集卷第二梅溪先生文集卷第二詩送表叔賈元範赴省試賈公西赴大試鄉人於其行也咸祝之曰公昔不逺千里徒步京師遊太學戰藝術之場登賢能之書矣不幸見黜于禮部今日之行焚舟之舉也又祝曰吾邑士風委靡不振自舍法罷四閲科舉群試有司無占名者公此行雪寒鄊纍年之恥矣又祝曰國步方艱聖君側席下詔求士非止修故事而己公平昔議論挺挺激昻士類今試藝南宫發䇿帝庭固宜一攄素藴直言救世非為取一第資也某采輿人之祝作詩以送之河東先生才行髙昔遊太學聮蒸髦雄文偉論萬人敵粳秕歆向奴劉曹搏風自許九萬里肯作斥鷃遊蓬蒿禮闈一戰果得雋妙割不折庖丁刀禮部無端抑韓子至今士論猶嗷嗷霜蹄暫蹶志益鋭不學郊島徒悲號聖君圗治方側席兹復下詔求賢豪壯懷思雪會稽耻廣埸猛效蘭皋鏖焚舟決勝在此舉鄉閭屬望心焦勞天庭射䇿決素藴忠言為國驅腥臊區區一第溷君耳要將事業窺伊臯瓊林宴罷躍歸騎薰風拂靣吹恩𫀆答季仲宜名誼我昔從君伯氏遊短素長箋日唱酬凌雲健筆驅山丘𣣔追李杜參曹劉子今又復振風流可人一氣真吾儔明珠白璧蒙暗投自揣無堪但增羞君家棠棣才俱優吾知徐公百不憂更能勉力追前修俯捨青紫何須求夜聽雙瀑同劉方叔毛虞卿聮句夜靜雙瀑喧遙聞疑雨來澗壑生清風襟宇捐纎埃龜䶖飛鳴撼半空暗想飄瓊瑰前觀阻步屧側耳成徘徊虞卿蕭然山館間此興何悠哉子晉不復見月白空蕭臺方叔對月同方叔聮句與君坐階除遙望海上月方叔試舉太白杯借問幾圎缺龜齡人生易分散動作隔年别方叔今宵對嬋姢莫放酣歌絶龜齡遊簫峯蠟屐穿雲去山深喜路人家煙色褁古寺水聲中金濺星猶在丹成竈已空吹簫人不見臺下想仙風題雙瀑瀑水簫峯下靈源不可尋倚天雙寶劒點石萬星金勢合鯨鯢鬪聲聮虎豹吟我來遊勝境洗耳聽清音送劉方叔兼簡全之相見無多日依前又素居斷魂梅的皪過眼栁蕭踈匹馬來時路征鴻别後書君歸見溫叟為我問何如送陳商霖相逢猶未欵作别太匆匆日落江東莫人歸冀北空音塵應暫隔談笑更誰同回首簫峰外明朝我亦東晝卧書懷書齋終日無人過閉户便便事髙卧炎蒸爍體汗流珠蚊蚋費拍蠅勞驅南窗清風可供客一枕萬錢無計得夢魂未到鄉無何起來搔首空吟哦用前韻贈劉全之一聲啼鳥簷間過喚起幽人午窗卧甕頭一滴價如珠窮愁衮衮慿誰驅溪畔相逢盡詩客豪邁獨輸劉夢得篇章自有神誰何詎白元白參吟哦有客贈酒同舍終夕盡歡復用前韻濁醪不向墻頭過吏部方思甕間卧書齋得酒勝得珠萬事盡向杯中驅坐中俱是髙陽客一笑相逢寧易得明朝酒醒奈愁何勸君莫惜同吟哦復用前韻歲月侵尋等間過草廬尚作南陽卧報國未為蛇吐珠許身定與誰齊驅謾比凌雲詞賦客意氣飄飄真自得金溪風月價幾何要須買斷共吟哦戲酬毛虞卿見和杜門不碩髙軒過聊學東山謝公卧傷時淚泣鮫人珠揮毫寫悶風雨驅友生笑我為狂客齊楚未須論失得他年功業定如何醉中細把君詩哦懷歸預别同舍長念雙親垂素髮不奉甘旨今數月溪山雖好何如歸吾心巳逐秋雲飛𣣔别良朋重鳴咽催人啼鳥聲何切明日琴書隨我東何如尊酒重相逢寄僧覺無象我昔居鹿巖時來潛澗遊西坡訪覺老終日為遲留髙談窮古今滿坐風生秋令我名利心一聽渾𣣔休論詩出古律有唱無不酬篇章溢縑素錦繡爛然浮此老豈易得當于前輩求吾生限太晚見師巳白頭儒釋道不同相從苦無由三年遊金溪兀坐顔常愀出門無遊從獨賦臨清流金溪可無僧孰是西坡儔深房鎖花木妙供羅珍羞益作潛澗思剛腸如轉輈魂夢不自禁夜夜飛山陬前日遇諸塗一笑忘百憂相視未及語歸袖風颼颼别來能幾時不覺歲月遒聞師結蓮社旦莫事真修我狂似靈運此志那能投覺無象和少年詞賦客昔與山翁遊暫抑驊騮姿聊伴鹽車留幽坡賞春色明月同髙秋君才如鮑昭顧我非湯休木桃時一投瓊瑶三四酬可憐橫海鱗尺水難沉浮飄然拂袖去形影那容求早莫哦君詩書空復搔頭邇來三年餘擬君荐經由長萹忽見遺頓覺驅煩愀君馬何大駛追蹤謫倦流錦繡滿腸胃詞人孰能儔故將西子容來貽嫫姆羞行看復坐吟終日如軥輈安得君書齋移來近前陬論文與談笑一釋老者憂春禽晝聒聒窗風夜颼颼懷君不成寐頻驚節物遒君文巳造妙君德當慎修謁帝明光宫隋珠那暗投秋日山林即事次叔父寶印師韻蕭蕭頻末生秋聲登臨遐想蘭臺英天髙氣清水碧色明月相映光如瓊脫葉翩翻下深樾蓮社髙人詩興發講外吟餘心更間白雲滿袖眠禪窟竹徑通幽人不來鳥鳴山靜獨徘徊應笑世間名利客生優優徒悲哀清涼滌煩襟塵慮脫心境山城過踈雨水國生新景蟲鳴月滿林雁度雲橫嶺感物夜九起謀身日三省平生功名心鬱鬱猶未逞深美白雲人身間時自永和懷孫子尚二絶澤國蕭蕭晚吹涼東籬黃菊為誰香故人一别路千里夜雨何時更對床記得年時訪我遊壁間文字數行留溪山風月依然好不對芳尊又一秋季令生日八月十四佳氣光芒藹劒池慶門呈瑞應㷱羆人間秋色平分際天上冰輪𣣔滿時何處楚丘占季子自應無忌似牢之何郡王甥姮娥預把蟾宫桂歲歲飄香薦夀巵徐丞生日九月𥘉八日月俱陽莭物新先期誰應菊花辰未于嵩嶽生賢佐且向柯山出異人月吐霜天鍾氣象江涵秋水聚精神華堂獻夀人多少盡是明朝落帽賔思友夜雨暗點滴窗風冷掀翻藜牀卧幽獨好夢俄驚殘過人在何處逺隔煙水村欹枕不復見傷心涕汍瀾縣學落成百韻新學告成祀事既畢賢大夫與邑之多士講鄉飲酒禮無愧魯泮風真一時偉觀也某非史克雖不能作為歌頌以揄楊盛德萬一輒不揆課成律詩一百韻炎正中微後皇家再造年斯文天未喪吾道聖相傳黼扆端周冕巖廊拱舜絃宸章麗朝日奎畫煥中天賈馬朝舟闕皇夔捧御筵雲龍慶相遇星鳳快爭先金馬𫀆披錦戎亭帳禠氊崇儒符漢武復古慕周宣方議成均制仍增博士員佇觀旗茷茷行賁帛戔戔詞賦揚群彥賢良䇿萬全國橋漢億萬鼓篋魯三千狂客休歌鳳騷人肯釣鯿文風暢蠻貊士氣壓腥羶王化誠無外吾邦素自偏魚鹽人競習刀筆世相沿甘學樊遲稼紛求許汜田揶􅮈戲縫掖膜㖵奉真詮來振寒鄉陋那經殺氣纒閭閻森白刃庠序燎寒煙斷簡嗟何考青襟痛自憐詩存傷瓠葉禮廢憶豚肩磬碎交州石弓焚矍相弦水流空渙渙草碧自芊芊有識思興起無知分棄捐桑弧誰復射城闕孰思還弟子貧原憲先生冷鄭虔嗣音幾泯滅素業遂迍邅婁應三年詔曽微萬選錢龍門無幾到虎榜不多聮愈賦徒傷感郊腸厭炒煎儒冠空嘆誤鐡硯莫知研白日非偏照寒灰自不然百年嗟委靡今日幸寅緣令尹真人傑同僚命世賢崔丞老文文學梅尉舊神仙樂善誠何篤承流志更專下車傷弊俗修泮慕遺編浮議疇能奪良謀斷不愆商財方萃聚卜日肯遷延役命諸生董基謀爽塏遷鄧林搜蓊鬱淇竹翦嬋娟祕殿雄千尺修廊跨百㕓虹梁挂天宇雲棟軼星躔縹縹飛鴛瓦沉沉耀采椽沚茂春色早壇杏午隂圓方沼分寒溜明窗瞰碧漣前山昻馬首勝地奪龍眠瀑水靈源近簘峯秀色妍規模何廓廓氣象更綿綿先聖風流逺新宫象貌鮮森羅龍衮列肅穆雁行連劍珮星辰上丹青日月邉衣裳明黼黻冠冕飾絃綖祀事修崇報心齋務至蠲新儀仍再習吉日巳重涓漏箭催庭燎鸞刀待餼牽充庭端辨服夾道擁車駢秉笏趍帷幄升階省豆籩馨香登黍稷肥腯薦牲牷𬞞擷羅芹藻魚羞備薧鮮犧尊澄玉液寶篆噴龍涎薦祼仍更貌觀瞻競曲拳禮文稽戴鄭樂舞奏韶卷設禮筵𥘉秩登門屨巳填盍簮聮桂玉紉佩雜蘭全飾喜捐絲竹論文具管箋獻酬咸僂傴進退各周旋揮塵談飛屑濡毫思湧泉妙詞歌邪客醉墨灑張顛共喜從于邁俱忘詠式遄武紛堂上接衣擁坐隅褰父鄙金籝滿師誇腹笥便雩風開性桞教雨長材楩鼓瑟求曽點攀鱗至閔騫水平翻振鷺天闊戾飛鳶鶯思友遷木驊群盡著鞭草空收七壁雀過墮三鱣道也將行矣辰乎盍勉旃搜尋羅簡札點勘費丹鉛潔淨窮爻象溫柔考注箋典謨稽古學倉制究殘編異教排韓子遺經抱玉川壯夫羞篆刻童子悟幽玄道德勤鑽仰文章變􅓻駢科名真溷爾輸墨蓋遊焉雪耻終興越成功必霸燕真成兩闕里别是一陶甄化出文翁表功居范寧前聲華終不杇琬琰豈須鐫未學成鳩拙窮居類兔跧腸枯無錦繡門冷乏貂蟬簞食雖云樂藜牀巳厭穿室空司馬壁食窘魯公饘誤拜殽陵賜長懷渭水畋斷絃音寂寞抱玉涕潺湲覽鏡時猶在焚舟志益堅燕歸欣遇厦魚得敢忘筌碩赴功名會終歸造化權唯憑大爐火早晚鑄顔淵送劉方叔季文遊鴈山二客騷腸不耐秋飄然蠟屐去尋幽蕩中若要窮靑眼巖下先須問白頭詩社不容添異姓名山應豈遇清流會須乘興天台去澗水桃花訪舊遊季文嘗有詩云醉鄉須待我詩社莫添人遊西岑遇雨西岑風物秋更嘉杖藜出郭歡無涯深村有酒隔煙渚共乘小艇穿蘆花羅裙綽約越溪女茅舍迫窄吳儂家牀頭新釀喜正熟千金倒甕傾流霞天公妬我一日樂俄然雨腳來如麻醉歸扶路泥沒股冠巾不整頭鬖髿人生貴在適意耳安能局縮身如蝸杖頭有錢即相覔明日更泛仙源槎幽居三詠修竹我得家傳好此君剩栽干挺拂青雲塵埃不掃自然去風月有餘誰可分萬籜蒼龍春後見滿軒鳴玉夜深聞時時助我毫端興冝與江山共䇿勳黃楊兵火回頭二十年吾家此樹實青氊兒時尚及見封植亂後那知獨保全雖荷生成能蓊􅓹不輕剪拂豈團圓主翁不忍加斤斧舊物於人最可憐丁香花玄冬萬木落如掃苦恨江梅開不早誰言菊後便無花更有丁香尉枯稿雨膏碧葉剪琉璃風薦幽葩噴龍腦小軒深院夜凄清月白霜寒天色好素面含情宋玉愁仙䏎帶􅊜真妃澡何人為取藥中名端為花能除病惱我時獨步瓊枝邉相向無言意傾倒臨風三嗅更徘徊研墨為花加品藻鄭丞生日九日九日人間氣象新鄭公家誕少康成玉山肌骨侵人瑩秋水精神照坐明奕世簮纓真烜赫沖天頭角正峥嶸碩公此日身長健醉把茱茰泛夀觥賢關當日厠英遊意氣軒軒壓輩流心授廣丈真翰墨家傳北海舊春秋棠隂惠愛留三邑蓮幕聲名重一州賔客盈門望推轂藍田松竹可能留縣學别同舍蕭瑟秋聲起桂枝登臨誰賦送將歸伴人燈火情猶在過眼煙雲事已非記取虀鹽同冷落忍教襟𬒮遽分違明朝一笑江山隔望斷日邉鴻雁飛次韻曽尉易任青田留别曽名汪字萬頃梅仙樂教意尤勤絳帳煎膏至夜分心學盡傳隋董薛詞章高壓漢卿雲誰知有力能攘我不許諸生久借君駟馬重來定何日好看雙桂散清芬曽嘗于縣學植雙桂淫雨春雨無端苦浸淫滿天飛霧日光沉出門蒸潤濡衣重歸路泥塗沒股深𣣔與陽烏開烈豔試呼風伯掃煩隂明朝會見佳天氣只恐春歸無處尋仰先生挽詞文蔚字國華黃公度榜登科授政和簿未赴而卒諸生衮衮登科第造物苦公深可憐身到蟾宫都幾日名書鬼録巳經年數同子厚無如命才似韓公合在天慎水諸生哭相向築埸無計愧前賢寄潘先生先生聚徒明慶兩歲三遷近得懴院諸生粗安迹先生猶無託宿之地寓榻于僧房院有一室頗佳主僧扄鎖以待官客因作是詩蕭踈鬢髮老安仁才出人頭未免貧書劒一生長骯髒虀鹽到處只酸辛招提夜永眠無室絳帳春寒坐乏茵莫怪暗梨不具眼先生未見宰官身次韻潘先生莫春感懷見寄緬想長安覺夜長先生投老困文埸幾吟白雪眠蕭寺誰薦凌雲逹未央鼠目麞頭多冨貴兔葵燕麥自悲傷感春情思如雲亂排悶提詩寄草堂至樂齋讀書權門迹不到顔巷自安貧獨與聖賢對更于燈火親夜觀常及子晝諷直從寅莫恨成名晚詩書不負人用前韻酬昌齡弟原憲曽非病陳平豈久貧路遙騏驥困原近鶺鴒親窗几坐窮夕更籌聽報寅田園勞爾輩愧是素飱人豫拙于治生每以田園勞二弟昌齡詩云詩書滿腸腹應笑帶經人豫愧其言故云懷孫子尚孫郎何事久無書又見青春桞怫渠千里阻山仍阻水三年無鴈亦無魚弟兄官况寧多好囊槖年來莫久虗海角天涯兩形影别時長記涕漣如懷薑渭叟兼簡謝守中用前韻渭叟名大吕守中名起薑郎何事久無書今君青春最憶渠别後又孤詩與酒怪來都斷雁并魚守株身世俱非巧畫餅聲名揔是虗隔壁惠連無恙否池塘春草句何如懷劉方叔兼簡全之用前韻劉郎何事久無書夢裏頻頻却見渠往事真同塞翁馬此身何異蠧書魚嚴親白髮皆如許吾輩青春度莫虛意氣飄飄羡溫叟凌雲詞賦壓相如全之得漕薦子尚之往浙西也有别豫詩云中原回首尚胡塵世事徒驚日月新羇旅不堪頻作别壯懷雖在已甘貧南來求友傳三益西去論心有幾人别後夢魂何處是秖應來往慎江濵一别八年不通書巳三載聞在姑蘇甚無聊故思之渭叟嘗有懷僕詩云左原消息杳無聞令我愁懷似亂雲多病廢詩兼廢酒青春孤我亦孤君要同學問文章樂無奈東西南北分况是一簷殘雨後落花飛絮兩紛又與渭叟别又經年矣故有孤詩酒之句庚申秋豫敗舉𣣔廢經而用賦方叔以詩見寄云須知失馬事莫廢獲麟書往事真同塞翁馬蓋用方叔詩也三子皆邁有文采能歌詩豫辱與之交甚厚今俱不在眼故各以詩見意時辛酉季春也壬戌二月八日因録舊藁遂跋于后述懷吾年三十百無堪世事如麻揔未諳楊子家貧那嗜酒盧同丁白更添男回頭埸屋心幾折混迹泥塗分固甘賴有東臯遺業在剩栽桑柘教妻蠶劉方叔昔書一絶于後云山北山南春雨足漠漠柔桑秀如沃儂家荆婦幾時歸西疇獨自驅黃犢薑渭叟見之謂二詩貧冨氣象不同今二十三年矣豫貧乃甚于方叔也隆興改元十月書夜雨述懷夜深風雨撼庭芭喚起新愁似亂麻夢覺尚疑身是蝶病蘇方悟影非蛇澆腸竹葉頻生翬照眼銀缸自結花我在故鄊非逆旅不煩杜宇喚歸家梅溪先生文集卷第二梅溪先生文集後序余少時讀尚書觀王十朋先生注釋輯五瑞昭德之致于異姓之邦諸篇而知先生之學邃于經及讀丹墀獨對諸書觀先生之論五帝名號位次等事而知先生之學長于策又閲氏族大全姓氏觀先生自警之詩曰室明室暗兩奚疑方寸須存不可欺莫問天髙鬼神惡直須先要自家知而知先生之學嚴于治已時欲求先生之文全集一觀用發志意市無鬻者常以為恨宣德庚戌歲余由憲臺出守溫郡溫郡乃先生所居之鄊也余于先生玄孫孟明處求得先生文集共十帙而缺注釋經傳之言意其言之附諸經傳者書坊板行而先生不録于家故也然余之所得又多破損脫落而有不可讀者于是給紙筆付與永嘉儒士王宜嘉補其缺略更加圈點而欲重為刋刻越數月值今上皇帝嗣登寶位召余入為秋官侍郎于先生文集未及刋行而心常怏怏幸吾從姪何㶇子方選除溫州府學教授將行余以兹事屬之子方曰敢不如命溫州又得監察御史浚儀劉公自牧而為郡守暨諸同僚皆好文字各出月俸以資工費刋刻完成吾少保黃先生既為首序子方又請余而為後序夫日月之光華星辰之炫耀天之文也川嶽之流峙草木之秀育地之文也吟咏為詩歌發言為經傳人之文也先生之文光耀之若日星雄健之如川嶽發揮仁義道德而無餘藴真當時之傑然者也其可傳示天下後世的矣太守劉公發身賢科持已廉潔為郡數年教化大行政治修舉而無事之可為矣乃專用力于斯文其出于尋常者萬萬矣又得郡庠分教廣信張君受永嘉徐君參婁君昕福建柳君廣而協心考校皆可敬也正統庚申臘月朔後五日賜進士嘉議大夫行在刑部右侍郎前溫州府守廣昌何文淵序
