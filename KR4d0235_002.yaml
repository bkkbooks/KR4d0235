  text: 梅溪先生奏議卷第二
  hash: sha256:aed04a757fe7572fb5001dd86ea30adfb8b5d5b2e0a5cdff13330c86d8e7c553
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_002-1a}
body:
  text: 輪對劄子三首臣一介小臣不識忌諱不知朝廷事体爱君憂國出扵天性妄懐婺不恤緯之心竊聞道路匈匈咸謂虜情巨測有南下牧馬巢穴汴都窺伺江准之意廟堂之上惟幄之臣必有料敵制勝之䇿臣不可得而知然議者以謂邉奏有警則群臣失色相顧傳聞稍息則恬然便以為安且謂敵有内難勢必不来夫不恃我之有備而幸敵之有難其謀國之術亦踈且殆矣自建炎至今虜未嘗不内相殘賊也然一酋斃一酋出其勢愈熾曷嘗為中國利㢤要在所以自備者如何爾我有先俻敵雖强而不足憂我苟無備敵雖有難幸之何益彼或不以有難爲畏乗我稍怠長驅而来其将何以禦之耶臣謂今日禦戎之䇿莫急扵用人用人之要莫先乎人望盖知人之術自古所難蕭何不生孰人識韓信扵未知名之日孟軻復出亦必取士扵國人皆曰賢晉悼公以民譽而用六卿遂成復覇之業東晉以人心而起謝安遂成破敵之計國家寳元慶暦間西夏叛命仁宗以經略安撫之任付之韓琦范仲淹二人雅有時望軍中有一韓一范西賊破膽之謡兵不大用而元昊臣服皇祐中用文彦愽冨弼爲相朝士相賀仁宗曰古之用人或以夣卜苟不知人當從人望夢卜豈足慿耶元祐𥘉相司馬光遼人夏人相戒曰中囯相司馬矣謹無生事人望之能服人如此今若内若外士夫軍民口無異辤咸謂有天資忠義材兼文武可為将相者有長扵用兵士卒楽為之用可為大帥者今乃投閑置散無地自效或老扵藩郡以泯沒其材内為說邪之所􅎱忌外為夷狄之所竊咲天下輿情憤悶抑欝臣碩陛下断然為社稷計起而用之以從人望可以作士氣可以慰人心可以寝敵人之謀可以圖恢復之大計陛下縦未大用之亦冝付以江淮重任使自當一面為國長城亦可無西頋憂矣臣又聞范仲淹𥘉以言事得罪尤為宰相吕夷簡所悪斥逐扵外及西方用兵仁宗思用仲淹夷簡薦之亦力仲淹果䏻成功夷簡不失為賢相陛下當以仁宗之心為心大臣當以夷蕳之事為法相與任用天下之賢才以為排難觧紛計天下幸甚社稷幸甚其次有舊宰執侍從及嘗言事之臣名莭素著者或守逺藩㦯食祠禄或已休致㦯在謫籍並冝起廢置諸朝列其声名風采亦足以聳動一時謀謨措畫必有大過人者諸将有以驍勇善戦稱者悉冝列置分布扵荆㐮江淮間以為瓜牙藩屏用賈誼衆建諸矦而小其力之法以駕馭之如是則異人輩出可以供任使矣猛虎在山藜藿不採囯有人焉難當自消臣以為禦戎之䇿莫大扵此右一臣聞惟辟作福惟辟作威者盖人主攬權之術得之於此失之扵彼者又人主攬權之弊臣請借唐以論唐自髙宗中宗以来權移房闥明皇親平内難懲孽后驕主之禍挈大柄而掌握之可謂能收之於此矣承平既乆怠扵聴断内則移扵奸臣外則移於藩将是又失之扵彼也肅宗再造王室代宗平亂守文而權稍㱕朝廷亦可謂䏻收之扵此矣然君臣苟安瓜分土壌以授叛将継以徳宗之姑息自是而後權㱕藩鎮矣是又失之於彼也憲宗剛明果断削平僣叛而權復㱕朝廷可謂䏻收之扵此矣晚莭任用非人禍生所忽自是而後權帰閹寺矣是又失之於彼也陛下比懲大臣之盗權收還威福之柄朝廷清明皆謂陛下為不丗出之英主邇者衆口籍藉謂權雖帰於陛下政復出於多門是一秦檜死百秦生也其間㝡甚者如三衙管軍軰與北司深文固結盗陛下之大權養成䟦扈之勢不可制遏昔漢之禍起於恭顯王氏之相為終始唐之禍起扵北軍藩鎮之相為表裏今禍胎於内而亂形於外臣竊為陛下憂之夫權之犬者莫如名器與財與兵今以管軍而位居三公是盗名噐之極矣古之時無有也祖宗之時無有也又天下之利源財路皆人其門掊克聚歛不知紀極國用日蹙而私室愈冨三家擅魯田氏擅齊殆不過此且身捴禁旅乆而不代隂結諸将以為之黨深忌元功宿将之功名者不容其進自恃兵柄在手有䡖視朝廷心夫樞蜜者號本兵之地號令節制天下之諸将者也今殿廷立班管軍傲然居前樞宻甘心其後而不自以為恥事勢倒置如此不奉行其意㫖者㡬希其䏻莭制號令之耶又其子弟親戚咸盗清要之職䑓諌有論列之者朝廷必委曲庇護俾其言卒不得行昔唐大将管崇嗣背闕語咲李勉劾其不恭肅宗謂吾有勉乃知朝廷之尊李祐有入蔡縛吴元濟之功違詔進馬温造正衙抨劾祐自謂膽落於温御史今䑓諌言及侍從大臣随即罷斥而風憲獨不行於管軍之門其何以為國耶不獨此也至若清資横加於噲伍髙爵濫及扵醫門諸軍置承受福威自恣甚於唐之監軍皇城置邏卒旁午察事甚於周之監謗内外将帥剥下賂上結怨於三軍道路之間捕人為卒結扵怨百姓皆非治丗事也陛下自捴攬以来聖政不可勝紀如前日竄逐􅠕閹天下尤服陛下之英断惟此𢾗事臣所謂得於此而失於彼者可不深懲而痛革之耶臣願陛下慨然彂憤断自宸衷杜邪枉之門塞僥倖之路鍳漢唐之禍而斥近習懲齊魯之患而抑强臣不惟尊嚴朝廷亦所以保全此類不然臣恐大阿倒持日甚一日天下之憂不特在夷狄而巳此臣所以不避斧鉞之誅為陛下痛哭流涕言之也右二臣聞民為邦本本固邦寍自古人君未甞不以得民心固邦本為急而尤欲撫綏固結之於動揺疑貳之時我國家有天下二百年矣中遭厄運而宗社復興者良繇四海民心戴宋惟舊陛下即位于今三紀深仁厚澤尤著在天下之心然邇年以来監司守令多不得人為國歛怨民心稍離一曰不宣詔條二曰不䘏刑獄三曰不先撫字何謂不宣詔條臣伏覩比年寛䘏之詔屡下然而實恵未孚于民皆繇州縣不䏻奉行之敝昔人謂徒掛墻壁今則𥘉未甞掛凡遇詔下事有便扵民而不便於吏者或宣畢而遂匿或略掛而遽收故上雖有良法羙意下不得而知者多矣况欲𬒳其澤耶何謂不䘏刑獄臣伏覩陛下慎刑䘏獄之意雖堯舜成湯亡以加然措刑之效未逮扵古者盖由師帥之任鮮或循良昧者以胥吏為耳目怠者以胥吏為精神貪者以胥吏為鷹犬案牘滿前漫不加省獄情出入動由此曺故富民納賂以買直貧者不䏻自伸强者刼持以求勝弱者不能自免所望以直其冤者監司也今監司按部動以胥吏数十自随所至州縣唯務誅求苟滿其欲則獄事一切不問而望其有所平反可乎何謂不先撫字國家張官置吏本以為民要當以撫字為先催科次之昔之循吏勞心撫字而民皆樂輸不待催科而常賦自登夫催科自有常法豈在先期而取辦官以未及期為辦事民當未及期而𬒳虐故常賦未入扵官府而横費已帰扵蠧吏矣悍吏持尺牒走鄊閭噭呼墮突雞犬不寜而欲民安其業可乎臣又聞邇者邉奏稍警所在以防秋為名拘集舟船團結保伍措置無術州縣騷然至有鬻田宅以充糧草之賦殺耕牛以供䈥角之輸斬山林以為兵器撤室廬以营寨柵吏縁為奸民情大擾苟不有以安恤之切恐民迯其上散為盗賊矣况今夷狄外侮國威不振人心揺動正冝撫綏固結時也臣願陛下推溥博之仁下惻怛之詔勤䘏民隠動之以誠官吏有害民者必罰無赦仍命宰相慎擇諸道監司以寄休戚以宣明詔條慎恤刑獄撫字黎元為先務如是則四方萬姓罔不感泣人心既恱寧患天意之不我助耶臣以謂固本以寧邦者莫大乎此右三上殿劄子三首壬午十月臣聞舜受堯之天下序者羙之曰重華恊于帝武王継文王而有天下記禮者羙之曰善継人之志善述人之事說者謂堯之所為如是而舜亦如是故謂之恊帝文王之所為如是而武王亦如是故謂之継述臣甞考其行事乃不然尭之時有八元八凱者天下謂之才子尭不䏻用至舜乃舉而用之號十六相有共工驩兠伯鯀三苗者天下謂之四㐫並在尭朝尭不䏻去至舜乃流放竄殛之而天下咸服文王在啇之末三分天下有其二而終身執臣禮以事紂至武王嗣位之𥘉乃㑹八百諸侯興仁義之師以伐之天下遂一綂于周舜之所以恊堯武王之所以継文者如斯而已矣曷甞泥其行事之迹㢤此堯所以得知人之名而武王為達孝也與恭惟太上皇帝至仁至聖内不謀之宫外不謀之卿士断自宸衷以天下大器付之陛下丗皆以堯舜擬之臣獨謂堯舜之遜固羙矣然出扵耄期倦勤豈若太上皇春秋猶盛而遽為是曠丗絶無之舉㢤真可謂賢於堯舜逺矣陛下思所以仰副太上皇之付託者當如何今社稷之大安危生民之大休戚人才之大進退朝廷之大刑賞非有所矯拂更張則無以慰天下之望必矯拂而更張之則必有以不改父之臣與父之政之說而惑聖聴者陛下於此有若難䖏者焉臣謂太上皇之與陛下可謂父堯而子舜矣以聖継聖推誠無間豈區區形迹之所可拘臣下常情之所䏻測哉太上皇既以不疑而待陛下陛下亦冝以不疑而報太上皇三紀聖政可遵而行之者非一也至若因時救弊有所矯拂有所更張冝若舜之所以恊堯武王之所以継文者断然行之以彰太上皇知子之明以盡陛下継述之道毋若魯陪臣孟荘子之孝而已則社稷幸甚天下幸甚右一臣聞國猶身也强國與身者氣也醫者觀身之氣而知其人之夀夭識者觀國之氣而知其丗之興衰自古帝王圖囘天下雖謀以智辦之以才必以氣為之主然後大業乃濟劉項之争雄也項自謂力㧞山氣盖丗非也要之項之失天下也盖以力而劉之得天下也盖以氣夫百戦百勝一不勝而自謂天亡者氣何在㢤娄戦婁敗而不為之屈卒之易敗為勝轉弱為强者氣也蜀先主英姿大度有髙帝凨兵雖娄挫而終不為曺操屈吴孫權聞周瑜之言㧞刁斫案遂成赤壁之雋功吴蜀之勢非魏敵也然而䏻覇有一方鼎足而立者氣使之然也臣来自草茅得之道路謂廟堂之上謀議之臣和守戦之議閧然未决兹理固洞然易曉議者何不思之耶臣謂養今日之氣莫如守伸今日之氣莫如戦挫今日之氣莫如和今我兵寡力弱國威未振固未䏻與之决雌雄於一戦以伸天下之氣也正須養之使壮俟時而動冝於荆㐮江淮要害之地如人身之可以禦風寒者𢾗䖏命大将屯重兵以固守之縱未䏻得志扵中原亦足以㩀長江之險都帝王之宅保吴蜀萬里之故疆何故屈已買蹈前日之覆轍耶大抵天下之勢强弱均而和則彼此受其利晋與諸戎和我與契丹和是也强弱不均而和則强者得其利弱者𬒳其害六國與秦和契丹與女真和是也虜以和議譎契丹而㓕契丹矣又以和議譎中國而困中國矣耿南仲主和議而致靖康之禍秦檜主和議而弱國家之勢太上皇知虜之無厭而和之不可保也去歲下親征之詔而天下二十年湮欝之氣亦少舒矣雖淮上之師不利而虜之𬒳毒亦甚矣陛下應天受禅天下罔不歡欣鼓舞咸謂真主既出恢復指日可期也陛下冝親御鞍馬如漢文帝慨然發憤如唐憲宗撫巡六師以作将士之氣以圖進取之計况陛下之聖徳可以動天陛下之莭儉可以豊財陛下之英武可以定亂江淮有重臣以爲長城川陜有良将以爲瓜牙亦何患事之不濟耶不然冝因天設之險以爲城池與民守之可也苟㦯復用和議則軍民觧體雖苟一時之安而氣已爲之索矣百萬之歲幣固有所不惜也至尊之名分其可自貶損扵嗣登大寳之𥘉乎諸将用命血戦新復数路其可復捐而與之乎西北之民襁負来㱕者不知其㡬又可復委之虎狼而使之甘心乎况講和之復舉天下惟虜之命是聴無厭之求難塞之請當不止此陛下将何以應之乎臣謂今日之計戦固未可輕和决不可議守以養氣俟時而伸乗機而投而巳右二臣聞人主之職莫大於論相尤冝遴選扵嗣位之𥘉論相得人則可以相與大有為遴選於嗣位之𥘉斯可以慰天下惟新之望昔舜之受命也選於衆而首舉皐陶湯之革命也選於衆而首舉伊尹髙宗中興也首求諸野而爰立傅說成王訪洛也首以師保而並䖏周召漢髙祖首相蕭何而成創業之功唐太宗首相房杜而致貞觀之治明皇首相姚崇憲宗首相杜黄裳武宗首相李徳𥙿我太祖之有天下也宰相雖因周舊其自圖任也則首用趙普仁宗即位之始則相王曽又以李迪張知白魯宗道為宰執皆正人也英宗因舊相韓琦曽公亮而委任之又起冨弼為元樞用歐陽脩為叅政治平之治㝡號得人神宗又因治平宰相而委任之及韓琦既去則代以冨弼元祐乗簾之際首用司馬光又起文彦博於已老平章軍國重事又相吕公著又並相吕大防范純仁元祐人才於兹為盛歴代帝王與我祖宗任用大臣皆極一時之選又皆遴擇於新政之𥘉足以厭伏天下人心君臣相與有為各成一代之勲業人主之職其有大於此乎共惟太上皇授陛下以大寳位又以一相遺之虚右揆以待陛下自擇天下莫不拭目以觀此舉臣碩陛下擇諸内外千官百辟之中孰有清徳雅望負王佐才者孰有兼資文武可以救時活囯者必諸大夫囯人皆曰賢天下蒼生望其起者然後用之可也苟惟不然寕虚位以俟之不可使庸人鄙夫僥倖而得以失天下之望非特此也人主之聀雖在於論相至若侍從䑓諌亦不可不親自識擢宰相得人則内可以尊安宗社外可以鎮服四夷又得賢侍從以論思献納真諌官以拾遺補過才御史以糾肅官邪如是則内之百執事外之監司郡縣皆可以得人陛下端拱一堂之上群天下人才如意而任使之内修外攘中興之功不日可兾矣右三應詔陳弊事厥今天下之敝安在哉在乎中外小大之臣各居其官而不知其聀也居其官食其禄因循苟且曠聀不修𣣔望敝事之革治道之興可乎臣請言其大者夫進退百官者大臣之聀也献納論思者侍從之職也爲天子之耳目正朝廷之紀綱者臺諌之聀也内之卿監百執事外之監司守令莫不各有其職焉比年以来爲大臣者果能盡進退百官之職乎臣見其進百官不見其退百官也今日召某人赴行在明日除某人爲某官是固能進百官矣其所進者未必皆賢才率一二歲或半歲或踰月類皆迁之𥘉不問其職事之修與否也其或有罪必待臺諌論列然後從而出之或人主之意有所不恱則諭之使去而大臣未嘗自退百官居進賢退不肖之職而所進者未必皆賢其不肖者又不䏻自退之臣知其故矣是巳欲收㤙而不敢任怨也先正王曽有言曰恩欲歸巳怨使誰當為大臣而不敢退不肖寜不愧王曽之言乎此大臣失職也為侍從者又果䏻盡獻納論思之職乎臣見其各司其局而未聞献納論思也熈寜𥘉司馬光以論新法不從力辭副樞之命神宗曰樞宻兵事也不當以他事辞光曰臣未受命猶侍從也於事無不可言者是則居侍從者事皆可言是謂献納掌内外制者不止於代言為給事中者不止於封駁為尚書侍郎者又不止於各董六官之属也今之居是官以各司其局為了官事以献納論為越職寜不媿司馬光之言乎此侍從之失職也為䑓諌者又果䏻盡其所以為耳目正紀綱之職乎臣聞歐陽修有言曰天子曰是諌官曰非立殿陛之前與天子争是非者諌官也又聞蘇軾之言曰言及乗輿則天子改容事関廊廟則宰相待罪今之為䑓諌者果䏻争是非於殿陛之前如脩之言否乎又果能批人主逆鱗而使之改容如軾之言否乎臣徃歲備貟舘職竊聞䑓諌有論事不行者而同列不為之助乃曰我自有躰又有緘黙不言者聞侍從百官言時事則怒而逐之䑓諌之職果如是乎祖宗時䑓諌論事或一章不從至于十餘章而未嘗但巳言茍不行則継之以去趙抃為御史言陳升之不當除樞副凡十有六章於是乞郡而得䖍司馬光為諌臣論刺義勇及乞降黜凡十有三章今之論事者或一再不從遂不敢復言寕不媿光抃䓁乎此䑓諌之失職也至若内之卿監百執事外之監司守令其失職之敝有不勝言者臣竊謂欲盡革今日之敝冝首䛇大臣修進賢退不肖之職内之侍從卿監百執事孰為賢為才㧞其尤者一二人而進用之孰為愚為不肖亦取其尤者一二而人而斥退之外之監司郡守孰為賢才而稱職者㧞其尤者一二人而進之於朝孰為愚不肖而為民害者亦取其尤之一二而寘之於罪詔下旬日之間必責大臣以進賢退不肖而必欲其當如是則進一二人而中外莫不勸退一二人而中外莫不惧是則大臣之職舉矣扵是又䛇侍從冝修献納論思之職凡朝廷闕失知無不言而不止於各司其局又䛇為䑓諌者冝盡所以為耳目正紀綱之職拾遺𥙷過紏肅官邪凡有論列不可但巳冝以祖宗䑓諌為法而痛革前日緘黙不言之敝雖然此特人臣之職也而人主有大職事陛下不可以不知一曰任賢二曰納諌三曰賞罰臣聞詩人羙宣王曰任賢使䏻周室中興焉任賢乃人主之職而尤急於興衰撥亂之時陛下迩日召元老正人或寘之政府或寘之䑓諌或寘之侍從天下翕然稱為治表臣碩陛下既来之則冝力留之既留之則冝推誠委任之勿貴以繁文勿待以虚礼勿貳之以小人延之歲月可以責治效矣又陛下既以彊埸之事委之重臣良将冝若憲宗之任裴度断然勿疑無惑乎紛紛之議而事從中制以失其機㑹臣竊聞張浚欲守淮而議者欲其守江吴璘屯兵徳順而議者欲其退保夫守淮乃所以守江也舍淮而守江則長江之險與虜共之矣江其可守乎唐韋陟欲李光弼退保潼關光弼曰兩軍相攻尺地必争今委五百里而守潼關賊得地勢益張矣力破其說而成戦功三路之地䧟沒乆矣今幸力戦而復之乃欲無故而棄之可乎陛下冝䛇之曰閫外之事将軍制之可進則進可退則退如是則事不中制而機㑹不失矣臣聞傳說告髙宗曰木從繩則正后從諌則聖髙宗命之朝夕納誨而中興有啇聴諌乃人主之職而尤急於興衰撥亂之時陛下自即位以来雖擢用正人以爲䑓諌然聴納之羙猶未彰聞臣竊聞近有以酤榷之利而持使命於浙東西者諌官論列不聴陛下又親批聖語以諭之有識咸以爲疑易曰開國承家小人勿用陛下嗣位之始何急於用言利之臣又何以知此曺之名至於咈諌而用之乎又聞諌官有以盡言而去職御史有以振職而出䑓此必姦臣有以誤陛下者不可不察陛下比嘗下䛇求直言矣未聞賞一敢言之臣以勸言者乃聞交結左右者得官迎合時事者免觧賞諌如此其何以勸夫聴諌之道在乎愽詢廣覧不可昵於偏聴而蔽其四達之聦明臣碩陛下親君子逺小人推誠聴納養成聖徳則納誨者皆傳說而髙宗不獨聖矣臣嘗聞漢史賛宣帝曰綜核名實信賞必罰明賞罰者乃人主之職尤急於興衰撥亂之時臣竊見邇年以来有姑息之政無懲戒之罰去歲逆亮之死盖上皇聖徳所感天假手其徒以誅之諸将非唯無毫髪之功虜未退則逗留觀望已退則乗勢虜椋既不干斧鉞之誅而又受無名之賞有盗莭鉞者有為兩府者有為三公者傅呼道路取笑閭閻名器之濫未有甚於今日又有爵位巳崇而遷猶未巳官曺已冗而員又復増政或出於多門命從或於中降是皆為新政之累不可不革也至若有罪者不誅而悪無以懲又今日之大弊秦檜尃權誤國二十年而乃生極寵榮死封王爵天下莫不切齒扼腕縦不剖棺戮尸其可不行追貶之誅乎又前日閹寺有弄權納賄紊亂朝綱者大将有聚歛交結敗壊軍政者大臣有進不由正迷誤國家者䑓諌有朋奸罔上悪直醜正者或依城社以自安或盤根錯莭以自固或以去位而幸免典刑不正非大舜所以去四凶而服天下者臣聞太上皇即位之𥘉任用賢相追貶元悪竄殛奸邪天下稱快所以能中興我宋致治三紀者由其䏻大明刑賞於躰元居正之𥘉也陛下冝奮乹剛之断法虞舜之明継述太上皇故事先正首悪之罪而追貶之餘則次苐施行如是則可以攬威福之權而陛下之職舉矣夫欲救今日之敝非至誠任賢納諌大明賞罰以勸懲之雖啇髙宗周宣王漢宣帝復出不可以致中興之治故臣碩陛下先舉其職以率百僚如是則中外大小之職罔有不舉而敝寕有不革者耶敝事既去内治既脩則夷狄有不足攘祖宗之境土指日可復矣論左右史四事與起居郎胡銓同上臣等誤蒙親擢承乏左右史自供職以来檢討故事竊見今之史職廢壊者非一其尤甚者有四焉一曰進史不當二曰立非其地三曰前殿不立四曰奏不直前何謂進史不當臣聞唐楮遂良知起居注太宗問人君得觀之否對曰史記善悪以為戒庻㡬人君不為非法不聞帝王躬自觀史魏謩為起居舎人文宗遣中使取記注欲觀之謩謂史官書事以為鍳戒陛下所為善無畏不書不善天下之人亦有以記之帝乃止遂良與謩可謂能守官矣至國朝梁周翰李宗諤為左右史乃建言每月起居注碩先奏御付史館國史書之曰進起居注自周翰䓁始豈不媿唐二子㢤慶暦中歐陽脩為起居注甞論其失曰自古人君皆不自閱史今譔述既成必録本進呈則事有諱避史官雖欲書而不敢乞自今起居注皆不進本仁宗從之厥後佞臣執筆乃復進史㳂襲不革遂至于今臣愚欲望陛下遵仁宗之訓革周翰之失自今起居注皆不進呈庻使人主不觀史之羙不尃在扵李唐二君也何謂立非其地臣案唐制每皇帝御殿則左右史夾香案而立善悪必書其後許敬宗李義府動必懐姦惧為史官所記遂廢左右侍立之職凡謀議皆不預聞文宗復正觀故事每入閤命左右史執筆立于螭頭之下由是宰相奏事得以備録故開成之政詳於史書國朝故事天子坐朝則記注臣立於御坐之後歐陽脩以謂起居者當視人君言色舉動而書若立於後則無以盡見乃徙立扵御坐之前至脩罷職乃復立於後今乃逺立於殿之東南隅言動禾嘗或聞可謂立非其地有媿於脩多矣臣又聞元豊三年脩起居注王存奏欲追正觀故事使左右史得尽聞天子徳音儻以二府自有時政記即乞自餘臣僚登對許記注侍立神宗曰人君與臣下言必関政理所言公公言之自非軍機何必秘宻盖人臣奏對或有頗僻或肆䜛慝若史官書之則無所肆其奸矣大哉王言然未及施行至今議者惜之今史徒有左右之名而不知天子言動之實群臣奏對並以無所得聖語闗報職記注者但不過録諸司供報公文而巳何名曰史耶臣愚欲乞陛下復歐陽脩侍立故事庻㡬言色舉動皆得以書如宰執造膝之言自有時政記亦乞如王存所請凢餘臣奏對許令侍立亦足伸祖宗之志也何謂前殿不立臣歴觀自古左右史未嘗不侍於天子之側亦未嘗有前後殿之分唐制但云左右史分立於殿下螭頭之側和墨濡翰皆就螭之抝䖏有命則臨陛俯听對而書之不聞後殿立螭而前殿不立也又聞歐陽脩奏請自今前後殿上殿臣僚退合少留殿門俟脩注出面録聖語以此知國朝舊制前後殿皆侍立矣夫人主言動不獨後殿有之而前殿無也宰執奏事百官進對之言不獨後殿有之而前殿無也今獨後殿侍立而前殿不與義安在耶夫後殿侍立雖非其地然猶立焉亦愛礼存羊之意前殿不立是餼羊亦去而禮意俱亡矣今左右史分日而立無言動之異臣愚欲乞於前後殿皆分日侍立庻㡬一言一動皆得以書以備一朝之典謨光千載之史冊非細事也何謂奏不直前臣聞唐文宗謂魏謩曰事有不當毋嫌論奏謩對曰臣頃為諫官故得有所陳今則記言動不敢侵官帝曰兩省属皆可論朝廷事而母辭也故國朝左右史皆許直前奏事雖以奏史事為名而朝廷事亦可議焉盖亦文宗命魏謩之意也熈寜中脩起居注張琥奏曰近日縁例須牒閤門然後上殿竊見樞宻都承㫖每於侍立䖏尚得奏事起居注既得侍立或有敷奏乞便面陳詔從之臣等自領職之後𥘉欲直前奏事閤門以臣不預牒却之臣又嘗預牒之矣又謂今日無班次臣每見閤門奏事未嘗以班次為拘左右史職言動當日有敷奏乃必欲預牒閤門又必欲有班次則事有當奏而不得奏其為失職多矣臣又聞景祐中御史唐介論宰相文彦博仁宗怒之時蔡㐮為起居注直前論救事出一時又曷嘗預牒閤門與必俟班次耶况今来後殿奏對未甞無兩班如是則記注之臣雖有直前之名而無可奏之時矣臣愚欲乞自今左右史奏事當令直前不必預牒閤門及以有無班次爲拘臣䓁所陳四事皆近日記注失職之大者臣等濫居是職敢不盡言伏望陛下考古驗今循名責實断而行之不勝幸甚梅溪先生奏議卷第二梅溪先生後集卷第二詩丁丑二月二十一日集英殿賜第太平天子崇儒術寒賤書生苛作成槐市育才叨舎選楓宸唱第冠時英聖恩寛大容愚直御墨褒嘉偑寵榮却笑劉蕡不遭際徒令紙上有虚名游天竺贈同年雅㑹清時不易逢吾儕今日此游從逼人英氣湖光瑩照眼恩𫀆草色濃文盛一時俱俊傑名先千佛媿踈庸致身許囯冝相勉莫斈平津但取容贈閻同年安中飄飄吴蜀两衰翁尊酒論文偶㑹同名在儒科雖後我言関囯体豈如公休嗟世路多巇嶮共報君恩有樸忠此日游從足可惜行将渭北與江東閻和詩叙别再用前韵我本東嘉田舎翁登科偶與蜀龍同盍簮經月欽高誼分𬒮令人念此公幕府可能淹俊傑宸襟應亦記精忠他年㰖轡游吴越訪我茅廬浙水東贈梁同年介君家錦水邉我居浙江東各在天一涯芳尊偶相同君方富青春勁氣吐長虹我老志亦衰倚麻媿蒿蓬㑹合已踰月周旋見高風乆客思故鄉帰心各怱怱贈君無别言相期尽孤忠次韻陳大監掞見贈中興天子尤崇儒衆賢彚進如聮珠鄒枚待詔萃金馬臯䕫接武相俞都䇿士𥘉期異人出不尚虚文與声律况當盛世多賈生晁錯豈容為第一自慙俗學非名家遺經獨抱居東嘉韲塩太學浪十載豈有文許時人夸芻言旅奏宸庭䇿狂妄誤蒙明主擇生夭偶在千佛先材劣名浮有餘責頴川丈人詩絶竒長篇勉我母趍時𣣔報君恩答知巳胷中耿耿何當施次韻劉長方司户見贈楓宸昔羡君登第蓮幕今慙我効官相見可嗟頭井白老来自合量俱寛不嫌此日成名晩最喜平生取友端待報君恩知死所却同神武掛衣冠陳大監用賞梅韻以贈依韵酬之頴川丈人賢矣哉青眼喜為清流開詩章翰墨两竒絶筆下一字無塵埃品題人物奨後進搢紳樂善公為魁東嘉賤子生太晚猶幸識此真人才朅来西游也不惡錦囊所得俱瓊瑰區區科第何足道此行似為詩篇来客中拜貺更重複丙穴魚及郫筒杯大監近以魚水見貺寒鄉故舊問帰橐首言帶得公詩回大監復贈詩𥿄尾有留飰語再用韵以謝平生漫學乎歟哉心茅胷棘鋤不開得公新詩一再讀便覺胷宇清無埃銀鈎妙畫發光艶照眼有如參與魁鯫生肺腑非太白公似工部尤怜才旅中屢獲錦綉叚但媿𣣔報無瓊瑰豫章一榻不妄下賢非徐儒安敢来荷公此意最敦篤一笑當奉論文杯鄉心如飛不可遏更為長者遟遟回謝榮帥薿贈御書孝經用陳大監韵輦轂之下先弹壓兹言雖佳未足法丈人身居弹壓地撫字心勞民自洽神聖當天萬物春王畿共理嘉得人雲漢昭回賜優渥不特為公端為民聖經一章公獨得黄堂葱欝生春色賢哉名卿才大夫匪懈事君端可則石刻分餘猶及我榮耀驚聞浙江左從今蔀屋光属天更有寵褒雲八朶某前日廷對䝉宸翰八字之褒願公勉為不朽傳長如治吴與治川要令列郡法青白了無一吏横索錢陳大監餞别用前詩珠字韵以謝宸廷僥冐先諸儒寵褒况獲驪龍珠謂宸翰也青衫黄牒拜君賜紅蓮緑水官留都明日扁舟𣣔東出訪别長憂礙新律丈人呼酒如韓公賤子媿非張十一酒䦨未放客還家活火煎泉亨葉嘉西来頻下豫章榻盛事當作還鄉夸始終尚頼公鞭䇿邪正途中知所擇捐軀誓報明主恩青史庻逃千古責况公自是人中竒境鄰吕望逢明時行持從橐奉清問羙悪願分嫫與施用陳大監韵謝王囯録季羔見贈吾宗神秀時名儒贈我三百隋侯珠野人不識希世寳但見照眼清而都我昔遥從鴈山出旅食賢関淹歲律雅欽陸子常患多更歎張融可無一長淮乆絶誰起家青箱有君殊可嘉祠科得雋誚子厚何止文許後生夸我拙慚無濟時䇿老境𥘉官尚何擇江南蓮幕君故鄉竊芘聊逃簡書責寒賤誤蒙君見竒祖别贈言榮一時明日東帰詫閭里五絶首称虞伯施陳郎中公說贈韓子蒼集唐宋詩人六七作李杜韓桞歐蘇黄近来江西立宗派妙句更推韓子蒼非坡非谷自一家鼎中一臠曽已甞丈人珍重贈全集開卷爛然光熖長詩如此公固足貴賜者仁出尤難忘兼金白璧不足道願宝兹集為家藏鲰生幸脫埸屋累老境𣣔入詩門墻古詩三百未能斈句法且學今陵陽章季子贈端硯有客贈端紫剛方如正人裔傳家万石力助筆千鈞磨鐡嗟吾老著書欣爾新何當與毛穎相約侍嚴宸次韵陳大監赴天申節宴聖主仁心等南北燧息邉庭兵不宿两階干羽来逺人大度端能包濮祝萬歲三呼誕彌月四海千秋太平曲宴開文徳賜群臣喜溢天顔明四目向来獻夀人誰在元凱重登共鯀逐武夷戎監老風騷去囯十年官始復捧觴首賦天保章遥指南山祝君福更献曲江金鑑録不但能歌連理木賤臣逄時最僥倖帰羙寕辞𬋩城秃願同韓愈頌元和兼羙武公歌緑竹謝李侍郎琳贈衘書君不見西京孝武称材雄致治𣣔與唐虞同詔求賢良論闕政翻取曲學公孫洪又不見文宗在唐號儒雅制詔勤勤䇿群下劉蕡切直棄不枚卒使太阿帰䆠者吾皇䇿士親臨軒不為故事求空言猶疑有司効馮宿或恐前列登公孫九天賜下飛奎翰照眼昭回倬雲漢抑尚忠䛕有訓詞品題髙下由宸断儒宗𬒳命持文衡銀鈎拜賜恩非䡖帰将樂石刋聖語分貺下及狂愚生畎畆惓倦蓄忠憤射䇿自慙言不尽它日倘陪鴛鷺行願効魏公攄底藴塗中得寳印叔二詩次韵十年行役厭間関一第𥘉收鬂已斑重念此生難報處君親恩徳重丘山双親不見不勝悲銜恨何曽有住時二叔尚存俱白首帰来猶足慰衰遟次韵寳印叔題璧二絶風掃園林萬木殘道人眼界却宜看北窓跌坐對松柏人物青青俱歲寒早已心潜不二門猶将土苴與人論未湏隻履西帰去隱居髙躅已茫然潜徳如公亦足賢早見鄉評称孝子晚聞詩史記凶年事殊伯道児宜有行過王珪庙已先滿腹玄談共誰語九原帰去訪伊川宿羅漢三絶𣑽舎十八所道埸皆矩羅兹獨號羅漢想應無漏多雁蕩屡經眼箇中方再游何時脫塵鞅来此飽清幽故鄉從此去借問㡬時還先去声自思兄弟那堪宿雁山游大龍湫和前韵十年重到大龍湫千尺新流勝舊流㑹見四方霖雨足老龍還向此蔵頭游灵岩輝老索詩至灵峯寄数語雁蕩冠天下灵岩尤絶竒烟霞列屏障烟霞障日月明旌旗屏旗峯岩前有卓筆卓筆峯可以書雄詞天聦况非遥天聦洞􅚡然聽無疑願起灵湫龍霖雨行何為願用真柱石天柱峯永支廊庙危願煽造化炉煽韛炉四海帰淳熈願招鵉鳯友双鵉峯朝廷相羽儀何人夣石室石室属灵峯妄誕夸一時那能了世縁未免貪嗔癡名山誤見汗公議安可欺願借灵湫水一洗了堂碑詩以寄老禅狂言勿吾嗤題瑞岩雁蕩看不足瑞岩游更貪闘竒雖有媿藴秀了無慙澗古水鳴玉寺幽山染藍怱怱一宿去未暇問三三題天台囯清寺十里松声接澗泉清音入耳夜無眠寺有清音亭宜於四絶中稱絶四絶事見寺碑誰向三賢後更賢豊干寒山恰得寺就已無陳日月寺建於陳而成於隋時清長是宋山川𥘉智者云此寺成囯即清矣故号囯清真庙時賜号景德囯清明朝杖屨㝷劉阮不待桃花入洞天題大慈寺巍嶺迢迢入翠㣲𣑽宫佛隴鎻烟霏断碑古寺曽經眼剛笑陳隋徃事非題石橋二絶路隔山凢意可通石橋容我踏長虹橋旁方廣人游乆不在登臨杖屨中石橋未到已先知入眼端如入夣時旧甞夣㳺僧喚我爲嚴首坐前生曽寫此橋碑天合石橋記乃求嘉僧嚴伯威書菴僧有說前生事者戯及之萬年贈鄉僧賁老夣魂驚断石橋邉身帶烟霞入萬年賓主相逢意良厚永嘉縫掖永嘉禅學通儒釋浩無邉江浙声名二十年見說胷中有論語𣣔從師向此參禅賁能談論語過鑑湖翔風吹水鑑湖寒千里扁舟赴幕官路入蓬萊天尺五眼中見日與長安民事堂某誤蒙親擢賛幕㑹稽天語丁寕俾知民事聞命驚惧媿不克堪因榜所寓𪠘舎曰民事堂庶㡬朝夕不忘聖訓仍書五十六字以自警時紹興丁丑十有二月也親擢深蒙聖主恩宜知民事訓詞温仰惟睿意思邦本要使書生識治原不惮勤劳駞禹㑹敢忘精白奉尭言它時上問蒼生事願竭孤忠慷慨論臘月望日出郊探春游告成觀謁大禹祠酌菲飲泉遂至龍瑞宫觀禹穴薄暮而還禹􅌾稽山不記年丹青落尽庙依然神文秘在蔵書穴儉徳流為菲飲泉龍瑞峯峦高近日鑑湖烟水澗浮天東州佳處畧經眼自笑好竒如馬迁采蕺采蕺思越王也越有山名蕺蕺𬞞類也王所嗜焉予甞登是山故作是詩以思之陟彼越山言采其蕺我思古人中心悒悒維囯有耻吴弗遑粒膽于坐偶霸勲以集陟彼越山言采其茗越有卧龍山勾踐旧治山有竒茗故次章及之我思古人中心炳炳維囯有耻夕弗遑瞑焦心以思沼吴之境厥草匪甘厥𬞞匪香維其味之豈曰嗜之心焉孔焦膽焉亟甞唯其苦之是以取之我陟高崗瞻望東越訪王之祀曠古有闕宜庙于山世享不絶何以薦之蕺茗是擷秦望秦望哀秦之過弔兹山之不幸也瞻彼秦望崇于㑹稽曷云其崇登焉而紫孰登是山西方之人兮瞻彼秦望䡖于㑹稽曷崇而䡖名之以嬴孰名是山東方之人兮我登稽山思禹之績吾儕不魚繄帝之力我瞻秦望哀秦之過雪彼黔首其誰之禍禹駕而游夏民以休有翼其行稷卨是謀政轍而狩嬴随以仆孰稔其悪斯高左右孤竹兄弟殍于首陽山與其人嘉名孔章谿辱以愚泉汚以盗物之不幸名惡而暴浙濤如銀鑑流如紳濯彼崔嵬勿汚以秦迎春遇雪飛雪送殘臘帶花迎早春西疇農事及媿是不耕人元日冐雪赴天慶觀朝拜旣趍府拜表還舎飲屠蘇酒因思去年元日亦不在家感而有作幕府𥘉官媿不才琳宫朝拜獲參陪藍輿去踏搀先雪蓬鬂帰銜㝡後杯禹穴地幽寒未歇尭天日近暖先回年年元日身爲客孤負吾廬溪上梅賀何正言用蔡君謨韵御筆親除真諌官翕然輿論巳騰歡正人得路言無諱聖主虚懷听不難莫厭封章箴衮闕要令奸膽落毫端鯫生雅服陽公徳時把昌黎諌論看寓小能仁寺即事書懷小園青徑梅溪老緑水紅蓮越幕賓藥褁随身多半夏花枝照眼只常春時若痰嗽多服半夏𪠘舎唯有常春一根郡楼鼓角听殊逺僧舎鍾魚聞巳頻窓外清風數竿竹澹然相對浄無塵同莫教授朱縣丞朱司理游西園黎明出城郭偶作西園游春淺花未都池寒緑𥘉抽湖山𣣔縦目烟靄浮不牧𥘉来興非淺心賞殊未酬頼有三君子清談洗牢愁更期春色濃携樽泛仙舟次韵濮十太尉賞梅春向群芳頂上来可人風味亦竒哉未於茅舎踈籬見先為金枝玉葉開竹外横斜纔数點笛中摇落已千堆因公撩我惜花意深憶去年湖上杯題夀樂堂用東坡韵贈楊元賓僉判蓬萊閣下蒼龍古萬壑千岩擁仙府夀楽堂西靣卧龍壑月岩風滿窓户蒼松溜雨大十圍緑水浮荷深一股作堂主人乆黄壌仁智風猶似鄒魯詩仙騎龍已上天妙句光芒照寰宇青山偃蹇只如昔高䖏去天無尺五楊侯淮泗老儒斈文字撑腸筆風雨朅来賛幕古東州要與青山作盟主虚堂宴坐飽風月此外一毫端不取它日從公物外游貝闕珠宫酌瓊乳元賓贈紅梅數枝江梅孤㓗太絶俗紅杏酣酣風味簿梅花精神杏花色春入蓮洲𥘉破蕚花在夀楽堂前蓮者中膽瓶分贈两三枝醒我沉痾不湏藥時某以􅍚在告願公及早辦芳樽酒暈氷飢昜銷落𪠘舎有脩竹数竿瀟洒可愛誰栽窓外碧琅玕瀟洒尤宜老眼看寄語後人母翦伐更湏時為報平安龍瑞道士贈蘭有客贈芳友曽端伯目蘭曰芳友滿堂聞囯香清含道流氣䡖帶羽衣黄綴佩風光别横琴旨趣長重湏㝷禹穴一曲听揚揚道士善琴吴秀才克家以夀樂蓮洲中千葉梅花為贈酬以詩東君次第染群芳更與南枝別様粧水漲春洲浮鴨緑日烘花臉帶鵝黄雪中瓊蘂不多辦酒後玉飢無此香謂紅梅也玉潤氷清搃佳士驛筒相継贈春光吴君乃楊簽判胥上丁釋奠俻数献官書十二韵呈莫子齊教授趙可大察推魯人呼東家陳蔡不火食當時雖高第徃徃亦愠色孰知夣奠後庙祀亘無極嵬然衮冕尊王侯靣俱北武成祭上戊龍棄配杜稷隆殺良不同論功豈如徳去載㳺上庠觀禮杏壇側俻樂閱九奏銀𫀆爛千億兹焉客蓮幕濫與爼豆職登階瞻睿容炳睟若親識壮㢤芹藻宫不减魯矦囯帰賡泮水頌才劣慙史克㑹稽三賢祠詩并序越有三賢祠曰吴先生曰唐候曰蔡孝子吴先生名孜甞事安定胡先生瑗以文行稱捨所居爲府學有功於風教爲多賢於許詢賀知章軰一等矣唐侯名琦建炎間越師叛命以城􅑙虜侯奮自行伍憤然䄂甎擊虜酋至死罵不絶口有靖康李忠愍風非古刺客比也蔡孝子名定以死贖父罪自沉于河與孝女曺娥相望於千載間異世而同烈某比因上丁至學見西廡吴先生有祠堂詢之莫教授而知其事因語莫君宜有以記之異日坐幕府吏具郡祠歲所常祀者中有旌忠愍孝二庙某命吏訪其詳因得舊越守傅公崧卿祭唐侯之文及蔡孝子所親撰銘誌與越人題䟦奏状等嘉難者累日因作三賢詩以記其大畧庶㡬好事君子相継有作以發揚其幽光亦所以助吾君旌遺賢奨忠孝激勸風俗之一端也吴先生祠安定先生賢矣哉一時高第俱英材詵然逹者播廊庙貧賤亦足光蓬萊㑹稽吴君更超絶至今士子猶䏻說講堂鳴鼓䂓使君可使清風聳朝烈越中士人言者府斈𥘉成太守張公伯玉至斈以便服坐堂下先生鳴鼓行斈規太守欣然受其罰求田問舎遺子孫錢愚地僻何紛紛不惜池塘種芹藥一段竒事前無聞君不見唐室蓬山称賀老乞得鑑湖帰去好却将儒服変流沙更遣門䦨亦帰道又不見晋朝名士高陽公許詢捨宅為寺今大䏻仁是也才名上下王謝中乃心𣣔出三界外山隂宅化瞿曇宫先生識見高流俗不作二公縁禍福寄語多才鄭廣文乞與毫端記高躅旌忠廟囯家徃徃艱難中搢紳節義掃地空靖康有一忠愍公建炎獨有唐侯忠唐侯爵位何曽隆身居行伍儕羆熊平生經史漫不通嚴霜烈日藴在衷憤然一奮不顧躬太尉奪笏嗟怱怱子房鉄椎計已窮張廵就縳氣尚雄杲卿鋸觧罵未終忠血義肉塗地紅烈氣英魂簿蒼穹事驚朝野聞帝聦立廟旌忠浙江東睢陽双庙同高風名書青史等岱崧當時開門誰納戎貽臭千古如蛆蟲愍孝廟我昔甞讀黄絹碑長歎越囯無男兒孰知種山山下水千載有此一叚竒嗚呼哀哉蔡孝子風烈逺過恢與覊乃翁白首困縲絏半年不脫兒心悲請身荷械代父罪或甘黥涅居軍麾况遇兵興擊叛卒身先矢石死不辭當時非無賢太守時越守翟公孝子抱志終不施人間無路可赴訴投命河伯祈天知自爲銘誌及訟牒𣣔愬以魂贖以屍精哀意切語不怨孝與忠厚俱天資臨河更効結纓死㒹沛於礼曽無虧父脫纍囚子願畢身在九泉甘若飴名聞九重獲旌表賜庙愍孝風華夷胡爲祠宇乃如許一間破屋河之湄未聞設誅有度尚絶妙更欠邯郸祠我来賛幕欽孝烈顧瞻庙貌成吁嘻他年太史作佳傳願於𥿄尾書吾詩梅溪先生後集卷第二梅溪先生文集卷第二詩送表叔賈元範赴省試賈公西赴大試郷人於其行也咸祝之曰公昔不逺千里徒歩京師游太學戰藝術之場登賢能之書矣不幸見黜扵禮部今日之行焚舟之舉也又祝曰吾邑士風委靡不振自舎法罷四閱科舉群試有司無占名者公此行雪寒鄊累年之恥矣又祝曰國歩方艱聖君側席下詔求士非止修故亊而己公平昔議論挺挺激昻士類今試藝南宫發䇿帝庭固宜一攄素藴直言救世非為取一第資也某采輿人之祝作詩以送之河東先生才行髙昔游太學聮烝髦雄文偉論萬人敵糠秕歆向奴劉曹搏風自許九萬里肯作斥鷃游蓬蒿禮闈一戰果得雋妙割不折庖丁刀禮部無端抑韓子至今士論猶嗷嗷霜蹄暫蹶志益銳不學郊島徒悲號聖君圗治方側席兹復下詔求賢豪壮懷思雪㑹稽耻廣埸猛效蘭皐鏖焚舟决勝在此舉郷閭屬望心焦勞天庭射䇿决素藴忠言為國驅腥臊區區一第溷君耳要将亊業窺伊臯瓊林宴罷躍歸騎薫風拂靣吹恩𫀆荅季仲宜名誼我昔從君伯氏游短素長牋日唱酬凌雲徤筆驅山丘𣣔追李杜叅曹劉子今又復振風流可人一氣真吾儔明珠白璧蒙暗投自揣無堪但增羞君家棠棣才俱優吾知徐公百不憂更能勉力追前修俯捨青紫何湏求夜聴双瀑同劉方叔毛虞卿聮句夜静双瀑喧遥聞疑雨来澗壑生清風襟宇捐纎埃亀䶖飛鳴撼半空暗想飄瓊瑰前觀阻歩屧側耳成徘徊虞卿蕭然山舘間此興何悠㢤子晉不復見月白空蕭䑓方叔對月同方叔聮句與君坐階除遥望海上月方叔試㪯太白盃借問幾圎缺亀齡人生易分散動作隔年别方叔今宵對嬋姢莫放酣歌絶亀齡游簫峯蠟屐穿雲去山深喜路人家煙色褁古寺水聲中金濺星猶在丹成竈已空吹簫人不見臺下想仙風題双瀑瀑水簫峯下靈源不可尋倚天雙宝劒點石萬星金勢合鯨鯢鬪聲聮虎豹吟我来游勝境洗耳聴清音送劉方叔兼簡全之相見無多日依前又素居断魂梅的皪過眼栁蕭踈疋馬来時路征鴻别後書君帰見温叟為我問何如送陳商霖相逢猶未欵作别太匆匆日落江東莫人歸冀北空音塵應暫隔談笑更誰同回首簫峰外明朝我亦東晝卧書懐書齋終日無人過閉户便便事髙卧炎蒸爍體汗流珠蚊蚋費拍蠅勞驅南䆫清風可供客一枕萬錢無計得夢魂未到郷無何起来搔首空吟哦用前韻贈劉全之一聲啼鳥簷間過喚起幽人午䆫卧甕頭一滴價如珠窮愁衮衮慿誰驅溪畔相逢盡詩客豪邁獨輸劉夢得篇章自有神誰何詎白元白參吟哦有客贈酒同舎終夕盡歡復用前韻濁醪不向墻頭過吏部方思甕間卧書齋得酒勝得珠萬事盡向杯中驅坐中俱是髙陽客一笑相逢寜易得明朝酒醒柰愁何勸君莫惜同吟哦復用前韻歲月侵尋等閑過草廬尚作南陽卧報國未爲蛇吐珠許身定與誰齊驅謾比凌雲詞賦客意氣飄飄真自得金溪風月價幾何要湏買断共吟哦戯酬毛虞卿見和杜門不碩髙軒過聊斈東山謝公卧傷時淚泣鮫人珠揮毫冩懣風雨驅友生笑我爲狂客齊楚未須論失得他年功業定如何醉中細把君詩哦懐歸預别同舎長念雙親垂素髪不奉甘旨今数月溪山雖好何如歸吾心巳逐秋雲飛𣣔别良朋重鳴咽催人啼鳥聲何切明日琹書隨我東何如尊酒重相逢寄僧覺無象我昔居鹿巖時来潜澗游西坡訪覺老終日為遅留髙談窮古今滿坐風生秋令我名利心一聴渾𣣔休論詩出古律有唱無不酬篇章溢縑素錦綉爛然浮此老豈易得當扵前輩求吾生限太晚見師巳白頭儒釋道不同相從苦無由三年游金溪兀坐顔常愀出門無游從獨賦臨清流金溪可無僧孰是西坡儔深房鎻花木妙供羅珍羞益作潜澗思剛腸如轉輈魂夢不自禁夜夜飛山陬前日遇諸塗一笑忘百憂相視未及語歸䄂風颼颼别来能幾時不覺歲月遒聞師結蓮社旦莫亊真修我狂似靈運此志那䏻投覺無象和少年詞賦客昔與山翁游暫抑驊騮姿聊伴鹽車留幽坡賞春色明月同髙秋君才如鮑昭顧我非湯休木桃時一投瓊瑶三四酬可憐横海鱗尺水難沉浮飄然拂䄂去形影那容求早莫哦君詩書空復搔頭迩来三年餘擬君荐經由長萹忽見遺頓覺驅煩愀君馬何大駛追蹤謫倦流錦綉滿腸胃詞人孰能儔故将西子容来貽嫫姆羞行看復坐吟終日如軥輈安得君書齋移来近前陬論文與談笑一釋老者憂春禽晝聒聒䆫風夜颼颼懐君不成寐頻驚節物遒君文巳造妙君徳當慎修謁帝明光宫隋珠那暗投秋日山林即亊次叔父寳印師韻蕭蕭頻末生秋聲登臨遐想蘭䑓英天髙氣清水碧色明月相映光如瓊脫葉翩翻下深樾蓮社髙人詩興發講外吟餘心更閑白雲滿䄂眠禪窟竹徑通幽人不來鳥鳴山静獨徘徊應笑世間名利客生優優徒悲哀清凉滌煩襟塵慮脫心境山城過踈雨水國生新景蟲鳴月滿林雁度雲横嶺感物夜九起謀身日三省平生功名心欝欝猶未逞深美白雲人身閑時自永和懐孫子尚二絶澤囯蕭蕭晚吹凉東籬黄菊爲誰香故人一别路千里夜雨何時更對床記得年時訪我游壁間文字數行留溪山風月依然好不對芳尊又一秋季令生日八月十四佳氣光芒藹劒池慶門呈瑞應㷱羆人間秋色平分際天上冰輪𣣔滿時何䖏楚丘占季子自應無忌似牢之何郡王甥姮娥預把蟾宫桂歳歲飄香薦夀巵徐丞生日九月𥘉八日月俱陽莭物新先期誰應菊花辰未扵崧嶽生賢佐且向柯山出異人月吐霜天鍾氣象江涵秋水聚精神華堂獻夀人多少盡是明朝落㡌賔思友夜雨暗點滴䆫風冷掀翻藜牀卧幽獨好夣俄驚殘過人在何䖏逺隔烟水村欹枕不復見傷心涕汍瀾縣學落成百韻新學告成祀事旣畢賢大夫與邑之多士講鄉飲酒禮無媿魯泮風真一時偉觀也某非史克雖不䏻作為歌頌以揄楊盛徳萬一輙不揆課成律詩一百韻炎正中㣲後皇家再造年斯文天未䘮吾道聖相傳黼扆端周冕巖廊拱舜絃宸章麗朝日奎畫煥中天賈馬朝舟闕皇䕫捧御筵雲龍慶相遇星鳳快争先金馬𫀆披錦戎亭帳禠氊崇儒符漢武復古慕周宣方議成均制仍増博士員佇觀旂茷茷行賁帛戔戔詞賦揚群彦賢良䇿萬全國橋漢億萬鼓箧魯三千狂客休歌鳳騷人肯釣鯿文風暢蠻貊士氣壓腥羶王化誠無外吾邦素自偏魚鹽人競習刀筆世相沿甘學樊遲稼紛求許汜田捓􅮈戯縫掖膜㖵奉真詮来振寒郷陋那經殺氣纒閭閻森白刃庠序燎寒煙断簡嗟何考青衿痛自憐詩存傷瓠葉禮廢憶豚肩磬碎交州石弓焚矍相弦水流空渙渙草碧自芊芊有識思興起無知分棄捐桑弧誰復射城闕孰思還弟子貧原憲先生冷鄭䖍嗣音幾泯㓕素業遂迍邅婁應三年詔曽㣲萬選錢龍門無幾到虎榜不多聮愈賦徒傷感郊腸厭炒煎儒冠空嘆誤鐡硯莫知研白日非偏照寒灰自不然百年嗟委靡今日幸寅縁令尹真人傑同僚命世賢崔丞老文文學梅尉舊神仙樂善誠何篤承流志更專下車傷弊俗修泮慕遺編浮議疇䏻奪良謀断不愆商財方萃聚卜日肯遷延役命諸生董基謀爽塏遷鄧林捜蓊欝淇竹翦嬋娟祕殿雄千尺脩廊跨百㕓虹梁掛天宇雲棟軼星躔縹縹飛鴛瓦沉沉耀采椽沚茂春色早壇杏午隂圓方沼分寒溜明窓瞰碧漣前山昻馬首勝地奪龍眠瀑水靈源近簘峯秀色妍規模何廓廓氣象更綿綿先聖風流逺新宫象貌鮮森羅龍衮列肅穆雁行連劍珮星辰上丹青日月邉衣裳明黼黻冠冕飾絃綖祀事脩崇報心齋務至蠲新儀仍再習吉日巳重㳙漏箭催庭燎鸞刀待餼牽充庭端弁服夹道擁車駢秉笏趍帷幄升階省豆籩馨香登黍稷肥腯薦牲牷𬞞擷羅芹藻魚羞備薧鱻犧尊澄玉液寳篆噴龍涎薦祼仍更貌觀瞻競曲拳禮文稽戴鄭楽舞奏韶卷設禮筵𥘉秩登門屨巳填盍簮聮桂玉紉佩雜蘭全飾喜捐絲竹論文具管牋獻酬咸僂傴進退各周旋揮塵談飛屑濡毫思湧泉妙詞歌邪客醉墨灑張顛共喜從于邁俱忘詠式遄武紛堂上接衣擁坐隅褰父鄙金籝滿師誇腹笥便雩風開性桞教雨長材楩鼓瑟求曽點攀鱗至閔騫水平翻振鷺天闊戾飛鳶鸎思友遷木驊群盡着鞭草空收七壁雀過墮三鱣道也将行矣辰乎盍勉旃捜尋羅簡札點勘費丹鉛㓗浄窮爻象温柔考注箋典謨稽古學倉制究殘編異教排韓子遺經抱玉川壯夫羞篆刻童子悟幽玄道徳勤鑚仰文章變􅓻駢科名真溷爾輸墨葢游焉雪耻終興越成功必覇燕真成兩闕里别是一陶甄化出文翁表功居范寗前聲華終不杇琬琰豈湏鐫未學成鳩拙窮居類兎跧腸枯無錦綉門冷乏貂蟬簞食雖云樂藜牀巳厭穿室空司馬壁食窘魯公饘誤拜殽陵賜長懐渭水畋断絃音寂寞抱玉涕潺湲覽鏡時猶在焚舟志益堅燕帰欣遇厦魚得敢忘筌碩赴功名㑹終歸造化權唯憑大爐火早晚鑄顔渊送劉方叔季文游鴈山二客騷腸不耐秋飄然蠟屐去尋幽蕩中若要窮靑眼巖下先須問白頭詩社不容添異姓名山應豈遇清流㑹須乗興天台去澗水桃花訪舊游季文嘗有詩云醉鄉湏待我詩社莫添人游西岑遇雨西岑風物秋更嘉杖藜出郭歡無涯深村有酒隔烟渚共乗小艇穿蘆花羅裙綽約越溪女茅舎迫窄吴儂家牀頭新醸喜正熟千金倒甕傾流霞天公妬我一日樂俄然雨脚来如麻醉歸扶路泥没股冠巾不整頭鬖髿人生貴在適意耳安能局縮身如蝸杖頭有錢即相覔明日更泛仙源槎幽居三詠脩竹我得家傳好此君剰栽干挺拂青雲塵埃不掃自然去風月有餘誰可分萬籜蒼龍春後見滿軒鳴玉夜深聞時時助我毫端興冝與江山共䇿勲黄楊兵火回頭二十年吾家此樹實青氊児時尚及見封植亂後那知獨保全雖荷生成䏻蓊􅓹不輕剪拂豈團圓主翁不忍加斤斧舊物於人最可憐丁香花玄冬萬木落如掃苦恨江梅開不早誰言菊後便無花更有丁香尉枯槁雨膏碧葉剪琉璃風薦幽葩噴龍腦小軒深院夜凄清月白霜寒天色好素面含情宋玉愁仙䏎帯􅊜真妃澡何人為取藥中名端為花能除病惱我時獨歩瓊枝邉相向無言意傾倒臨風三嗅更徘徊研墨為花加品藻鄭丞生日九日九日人間氣象新鄭公家誕少康成玉山肌骨侵人瑩秋水精神照坐明奕世簮纓真烜赫冲天頭角正峥嶸碩公此日身長徤醉把茱茰泛夀觥賢關當日厠英㳺意氣軒軒壓軰流心授廣丈真翰墨家傳北海舊春秋棠隂惠愛留三邑蓮幕聲名重一州賔客盈門望推轂藍田松竹可䏻留縣學别同舎蕭瑟秋聲起桂枝登臨誰賦送将歸伴人燈火情猶在過眼烟雲事已非記取虀塩同冷落忍教襟𬒮遽分違明朝一咲江山隔望断日邉鴻雁飛次韻曽尉易任青田留别曽名汪字萬頃梅僊楽教意尤勤絳帳煎膏至夜分心學盡傳隋董薛詞章高壓漢卿雲誰知有力能攘我不許諸生乆借君駟馬重来定何日好㸔雙桂散清芬曽嘗扵縣學植双桂淫雨春雨無端苦浸淫滿天飛霧日光沉出門蒸潤濡衣重歸路泥塗没股深𣣔與陽烏開烈豔試呼風伯掃煩隂明朝㑹見佳天氣只恐春歸無䖏尋仰先生挽詞文蔚字國華黄公度榜登科授政和簿未赴而卒諸生衮衮登科第造物苦公深可憐身到蟾宫都幾日名書鬼録巳經年数同子厚無如命才似韓公合在天慎水諸生哭相向築埸無計媿前賢寄潘先生先生聚徒明慶兩歲三遷近得懴院諸生粗安迹先生猶無託宿之地寓榻扵僧房院有一室頗佳主僧扄鎻以待官客因作是詩䔥踈鬢髪老安仁才出人頭未免貧書劒一生長骯髒虀塩到䖏只酸辛招提夜永眠無室絳帳春寒坐乏茵莫怪闇梨不具眼先生未見宰官身次韻潘先生莫春感懷見寄緬想長安覺夜長先生投老困文埸幾吟白雪眠䔥寺誰薦凌雲逹未央䑕目麞頭多冨貴兎葵燕麥自悲傷感春情思如雲亂排悶提詩寄草堂至樂齋讀書權門跡不到顔巷自安貧獨與聖賢對更扵燈火親夜觀常及子晝諷直從寅莫恨成名晚詩書不負人用前韻酬昌齡弟原憲曽非病陳平豈乆貧路遥騏驥困原近鶺鴒親䆫几坐窮夕更籌聴報寅田園勞爾軰媿是素飱人予拙扵治生每以田園勞二弟昌齡詩云詩書滿膓腹應笑帶經人予愧其言故云懷孫子尚孫郎何事乆無書又見青春桞怫渠千里阻山仍阻水三年無鴈亦無魚弟兄官况寜多好嚢槖年来莫乆虗海角天涯两形影别時長記涕漣如懐姜渭叟兼簡謝守中用前韻渭叟名大吕守中名起姜郎何亊乆無書今君青春最憶渠别後又孤詩與酒怪来都断雁并魚守株身世俱非巧畫餅聲名揔是虗隔壁恵連無恙否池塘春草句何如懐劉方叔兼簡全之用前韻劉郎何亊乆無書夣裏頻頻却見渠徃事真同塞翁馬此身何異蠧書魚嚴親白髪皆如許吾軰青春度莫虚意氣飄飄羡温叟凌雲詞賦壓相如全之得漕薦子尚之往浙西也有别予詩云中原回首尚胡塵世事徒驚日月新覉旅不堪頻作别壮懐雖在已甘貧南来求友傳三益西去論心有幾人别後夣魂何䖏是秖應来徃慎江濵一别八年不通書巳三載聞在姑蘇甚無聊故思之渭叟嘗有懷僕詩云左原消息杳無聞令我愁懐似亂雲多病廢詩兼廢酒青春孤我亦孤君要同學問文章楽無柰東西南北分况是一簷殘雨後落花飛絮兩紛又與渭叟别又經年矣故有孤詩酒之句庚申秋予敗舉𣣔廢經而用賦方叔以詩見寄云湏知失馬事莫廢獲麟書往亊真同塞翁馬盖用方叔詩也三子皆邁有文采能歌詩予辱與之交甚厚今俱不在眼故各以詩見意時辛酉季春也壬戌二月八日因録舊藁遂䟦于后述懐吾年三十百無堪世亊如麻揔未諳楊子家貧那嗜酒盧仝丁白更添男回頭埸屋心幾折混迹泥塗分固甘頼有東臯遺業在剰栽桑柘教妻蠶劉方叔昔書一絶于後云山北山南春雨足漠漠柔桑秀如沃儂家荆婦幾時歸西疇獨自驅黄犢姜渭叟見之謂二詩貧冨氣象不同今二十三年矣予貧乃甚扵方叔也隆興改元十月書夜雨述懷夜深風雨撼庭芭喚起新愁似乱麻夣覺尚疑身是蝶病蘇方悟影非蛇澆膓竹葉頻生翬照眼銀缸自結花我在故鄊非逆旅不煩杜宇喚歸家梅溪先生文集卷第二梅溪先生文集後序余少時讀尚書觀王十朋先生註釋輯五瑞昭徳之致于異姓之邦諸篇而知先生之學邃于經及讀丹墀獨對諸書觀先生之論五帝名號位次等事而知先生之學長扵策又閱氏族大全姓氏觀先生自警之詩曰室明室暗兩奚疑方寸湏存不可欺莫問天髙鬼神惡直湏先要自家知而知先生之學嚴扵治已時欲求先生之文全集一觀用發志意市無鬻者常以為恨宣徳庚戌歲余由憲㙜出守温郡温郡廼先生所居之鄊也余扵先生玄孫孟明䖏求得先生文集共十帙而缺註釋經傳之言意其言之附諸經傳者書坊板行而先生不錄于家故也然余之所得又多破損脫落而有不可讀者扵是給紙筆付與永嘉儒士王宜嘉補其缺略更加圈點而欲重為刋刻越數月值今上皇帝嗣登寶位召余入為秋官侍郎扵先生文集未及刋行而心常怏怏幸吾從姪何㶇子方選除温州府學教授将行余以兹事屬之子方曰敢不如命温州又得監察御史浚儀劉公自牧而為郡守暨諸同僚皆好文字各出月俸以資工費刋刻完成吾少保黄先生既為首序子方又請余而為後序夫日月之光華星辰之炫耀天之文也川嶽之流峙草木之秀毓地之文也吟咏為詩歌發言為經傳人之文也先生之文光耀之若日星雄健之如川嶽發揮仁義道徳而無餘藴真當時之傑然者也其可傳示天下後世的矣太守劉公發身賢科持已㢘潔為郡數年教化大行政治修舉而無事之可為矣乃專用力扵斯文其出扵㝷常者萬萬矣又得郡庠分教廣信張君受永嘉徐君參婁君昕福建柳君廣而協心考校皆可敬也正統庚申臘月朔後五日賜進士嘉議大夫行在刑部右侍郎前温州府守廣昌何文淵序
