front:
  text: 梅溪先生後集卷第二十一
  hash: sha256:4a5fb160c177f1f42e2cb39596bb7bd60590e8cfd532c72922130f911e56f491
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_021-1a}
body:
  text: 表狀笏記疏文附饒州到任謝表時遇主協五百世之昌期共理分符叨二千石之重寄試之民事簡在帝心中謝伏念臣奮身諸生隸業太學上皇親䇿擢居多士之先陛下誤知眷出群臣之右方御天之十日卑近地之一麾旋蒙召還屢辱賜對魏證之藴幾展盡賈誼之言略施行曽未閲于三時巳遍更于數聀遽從憲府擢二天官人言遭際之非常臣懼寵榮之過分力辝成命果獲俞音榮聮書殿之名假守便藩之郡身獲全於進退恩不替于𥘉終况此楚東之故邦實為江左之奧壤顔真卿英風如在范仲淹遺愛猶存仁實何人可預茲選兹蓋伏遇皇帝陛下法舜受禪體堯宅天廣收衆正而首及滯淹樂聽讜言而不罪狂直遴選朝廷之七疇咨嶽牧之臣雖地分內外之殊而心蔑輕重之異知臣本出乎白屋謂臣可牧夫細民札命十行憂分千里臣敢不仰奉德意刀宣教條雖才非太公不能五月報政然忠猶杜甫未嘗一飰忘君夔州到任謝表地易夔門難敢辭於蜀道心傾堯日遠尤甚於長安祗拜訓詞惟深感涕中謝臣煩由御史出守番昜任甫及於期年報蔑聞于五月慕言言之烈于顔魯國學優優之治于范仲淹優切戒于庸人第務近民之易罪或得于巨室方知為政之難比因有疾而丐祠不謂誤恩而分閫况魚復素稱岩邑在坤維實為要衝茍非文武之長才曷副蕃宣之重寄豈臣庸繆可稱使令兹蓋伏遇皇帝陛下德方日新仁若天覆憫鳥道烏蠻之險有刀耕火種之勞非善治不可以懷柔謂微臣或勤于撫字録其寸效畀以雄藩臣敢不究疾苦于閭閻布教條于州郡觀武侯八陳居安未免于憂邊誦杜甫百篇有志不忘于愛主除敷文閣待制謝表官自外遷既濫中權之寄恩由上出復叨次對之除抗章弗俞拜命增惕中謝竊念臣才惟摴檪業本韲鹽偶逢神聖之作興妄意風雲之際會立螭簮筆方近清光冠豸乘􅔕遽違丹闕俯悵忠懷之莫盡仰知天眷之未衰繇列郡而擢居帥垣自集英而超躋華閣易任誤蒙于增秩撫躬深愧于罔功清議靡容牢辝不獲兹蓋伏遇皇帝陛下至仁接下大度包荒謂臣如汲長孺之愚言多妄發知臣有蘇世長之短心不敢邪榮卑重藩許連從橐臣敢不益堅素守誓竭孤忠共理分符何以副西清之選拾遺輔過可能無北闕之書湖州到任謝表逺障承流乏循良之善政近藩改命仰覆載之隆私祗服訓詞彌增感涕伏念臣五年去國兩地分符饒俗浩穰有難調之巨室夔疆瘠鹵介絶險之烏蠻但思治己以先人豈忍奪民而生事故田里安其不優而獄訟由之稍稀敢曰懷歸實緣多病輒控祠庭之請屢干旒扆之嚴既寬斧鉞之重誅復卑股肱之佳郡瞻清光于便殿展素藴之忠言謂能恤民蒙天語之見奬徙以自近佩聖恩其敢忘豈期衰遲有此遭際兹蓋伏遇皇帝陛下至仁兼𬒳大智難名憐臣守志弗欺共理猶知于惠養憫臣奉躬匪懈事君或盡于勤勞故此異除華于朽質臣敢不持循憲度效法京師詠靈沼于真卿深體好生之德恢儒宫于安定益陶善教之風泉州到任謝表五年三郡蔑酬天覆之恩一扎十行又拜春溫之詔方奉祠而竊祿遽共理以分符隆眷不忘孤忠益勵中謝竊念臣少不學古晚方入官論事則意廣而才踈為郡則心勞而政拙惟民是恤雖誤蒙金口之褒其毁乃來終莫奪簧言之巧松菊方尋於三徑江湖復把于一麾非神聖素察其裏豈臣下可得而薦辝避不獲顛躋是憂况閩為負山帶海遐僻之鄉而泉乃冨啇大賈往來之會詎容庸繆可備使令兹蓋伏遇皇帝陛下堯仁宅天舜智察物知臣無剝下益上之罪恕臣有抑強扶弱之偏悟即墨之浮言卑清源之善地臣敢不清白奉巳循良牧民冨而可求第守不貪之實老之將至尚懷有犯之忠除敷文閣直學士謝表任南國守臣之寄治效蔑聞綴西清學士之班聖恩誤及牢辝弗獲下拜有慙中謝竊念臣學術空踈性􅓵愚蠢蚤躬耕飬妄懷干祿之心晚竊科名誓竭事君之莭許身自比于稷契得時况過于唐虞上皇親擢之於布韋陛下又置之于臺省徒屢膺于任使竟莫報於涓埃去國八年分符四郡覺年齡之云暮致疾病之交攻藥百試而莫痊祠三乞而不允心勞政拙僅同下考之陽城金賜秩增有愧能名之黃霸揣分冝黜蒙恩若驚兹蓋伏遇皇帝陛下仁覆邇遐賞從忠厚與人不求其備嘉善而矝不能謂臣雖不逹於時冝知臣或稍諳於民事厖廾侯藩之重超升庭閣之榮臣敢不仰務分憂俯當盡瘁拾遺輔過雖良臣之碩莫酬宣化承流庶循吏之風可繼除太子詹事賜衣帶謝表歸依故里首叨宫尹之除趍對便朝猥𬒳身章之錫省循何幸俯僂難勝伏念臣有不移之忠無適用之器襲布韋而自薦繡鞶帨以奚為分三服之珍方曵𥚑而自愧拜九環之重覺委佩之有光夫何衰病之軀仰冒便蕃之寵兹蓋伏遇皇帝陛下教子以義方之訓好賢如緇衣之詩借以光華欲其贊翼惟少成若往但知斂袵之恭而非禮勿言敢後書紳之戒誓殫綿力少答殊私慰皇后上仙表坤元資万物之生贊成乾道慈毋棄敷天之養痛摧子心仙馭益遐宸裏尤切恭以大行安恭皇后樛木逮下葛覃儉躬嬪外邸以稱賢位中宫而配聖數豈有定年胡不長恭惟皇帝陛下道盡人倫治贊隂教諒聖情之攸繫眷懿範以難忘功配九人迹可稽于􅊮管神遊八極燕永阻于瑶池然而上奉兩宮下臨九有碩上寬於悲悼庶無爽于和寧賀皇太子箋廷揚大號位正前星肆赦以重承祧臨軒而備典禮慶延宗社歡洽華夷恭惟皇太子殿下挺岐嶷之姿藴寬大之德佩禮樂詩書之丕訓明君臣父子之大綱孝友行乎宫中仁智聞乎天下睿主義方而能教法不抏於伯禽嗣君嫡長而又賢護奚煩於四皓某官守巴徼神馳帝鄊仰日月山海之攸重喜七鬯粢盛之有守愚裏敢獻碩日近於正人聖學益修當愈明於上性慰皇太子表人心所繫方聞出震之音天道難知遽隕前星之耀訃聞率土痛切輿情恭以皇太子殿下挺岐嶷之姿秉溫恭之德喜愠不形於色其心有容仁誼以飭其躬有儀可象護不煩於四皓斷自出於一人福善難慿降年何促恭惟皇帝陛下愛鍾子聖仁篤父慈澤雖沛於金雞藥不靈於扁鵲諒旰食宵衣之際興問安視膳之思然修短皆繫乎天雖聖賢莫逃于數昭明有學冝為梁室之儲子晉巳仙碩釋周王之念辝起居舍人狀竊以起居之聀言動是司君無舉而不書事有聞而必奏於清光為最近在直筆而尤難非得名儒曷稱妙選臣學術淺陋性資狂愚上皇䇿之於布衣誤𬒳親擢陛下識之於潛邸首膺召除方居列宿之聮輒二司成之教紬書史館進説經筵皆學者之至榮豈臣愚之敢望蔑有寸效遽叨峻遷必致可畏之言以速不才之咎仰祈睿眷追寢異恩俾愚分之獲安庶輿論之惟允所有恩命未敢祗受謹録奏聞伏候敕旨辝免兼侍講臣伏準敕旨除臣兼侍講者臣聞命驚震罔知所措竊以歲輒屢遷者古人之所深戒身兼數聀者通才猶不克堪臣近𬒳召還濫官執秩與史館編摩之選叨露門講説之聮每拜命而若驚嘗力辝而不獲辰未再浹而遽二左學朔才五易而躐升右螭懼弗稱於一官可更兼於兩聀况講讀方執經而入侍而記注常執筆而在旁各有攸司若何可攝將物議之不免謂聖恩之或私敢望睿慈追寢成命遴選碩學講聖人所親作之經庶俾愚臣專天子不自觀之史辝免侍御史狀亡辝免第二狀亡辝免權吏部侍郎狀臣今月十二日伏準省劄奉聖旨除臣權吏部侍郎日下供聀者臣緣今早上殿自劾不合力贊陛下恢復及委任張浚事乞罷臣侍御史之聀仍賜竄謫今來得旨除臣上件聀是求罪而得遷何以塞群議臣不敢供聀所是省劄巳繳納尚書省臣今居家待罪欲乞睿斷降出臣自劾之章使中外曉然咸知臣罪速正典刑以為臣子之戒辝免第二狀亡辝免除集英殿修撰狀亡饒州乞祠狀亡辝免知夔州狀亡
