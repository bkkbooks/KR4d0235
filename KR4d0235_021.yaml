front:
  text: 梅溪先生後集卷第二十一
  hash: sha256:4a5fb160c177f1f42e2cb39596bb7bd60590e8cfd532c72922130f911e56f491
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_021-1a}
body:
  text: 表状笏記䟽文附饒州到任謝表時遇主恊五百世之昌期共理分符叨二千石之重寄試之民事簡在帝心中謝伏念臣奮身諸生隷業太斈上皇親䇿擢居多士之先陛下誤知眷出群臣之右方御天之十日卑近地之一麾旋䝉召還屡辱賜對魏證之藴㡬展尽賈誼之言畧施行曽未閱扵三時巳徧更扵数聀遽從憲府擢貳天官人言遭際之非常臣惧寵荣之過分力辝成命果獲俞音荣聮書殿之名假守便藩之郡身獲全於進退㤙不替扵𥘉終况此楚東之故邦實爲江左之奥壌顔真卿英風如在范仲淹遺爱猶存仁實何人可預茲選兹盖伏遇皇帝陛下法舜受禅体尭宅天廣收衆正而首及滯淹楽聴讜言而不罪狂直遴選朝廷之七疇咨岳牧之臣雖地分内外之殊而心蔑䡖重之異知臣本出乎白屋謂臣可牧夫細民札命十行憂分千里臣敢不仰奉德意刀宣教條雖才非太公不能五月報政然忠猶杜甫未嘗一飰忘君䕫州到任謝表地易夔門難敢辭於蜀道心傾尭日遠尤甚於長安祗拜訓詞惟深感涕中謝臣煩由御史岀守番昜任甫及於期年報蔑聞扵五月慕言言之烈扵顔魯囯斈優優之治扵范仲淹優切戒扵庸人第務近民之易罪或得扵巨室方知為政之难比因有疾而丐祠不謂誤㤙而分閫况魚復素称岩邑在坤維實為要衝茍非文武之長才曷副蕃宣之重寄豈臣庸繆可称使令兹盖伏遇皇帝陛下徳方日新仁若天覆憫鳥道烏蛮之險有刀耕火種之劳非善治不可以懐柔謂㣲臣或勤扵撫字録其寸效畀以雄藩臣敢不究疾苦扵閭閻布教條扵州郡觀武侯八陣居安未免扵憂邊誦杜甫百篇有志不忘扵爱主除敷文閣待制謝表官自外迁既濫中權之寄恩由上出復叨次對之除抗章弗俞拜命増惕中謝竊念臣才惟摴檪業本韲塩偶逢神聖之作興妄意風雲之際㑹立螭簮筆方近清光冠豸乗􅔕遽違丹闕俯悵忠懷之莫尽仰知天眷之未衰繇列郡而擢居帥垣自集英而超躋華閣易任誤蒙扵増秩撫躬深愧扵罔功清議靡容牢辝不獲兹盖伏遇皇帝陛下至仁接下大度包荒謂臣如汲長孺之愚言多妄發知臣有蘇世長之短心不敢邪榮卑重藩許連從橐臣敢不益堅素守誓竭孤忠共理分符何以副西清之選拾遺𥙷過可能無北闕之書湖州到任謝表逺障承流乏循良之善政近藩改命仰覆載之隆私祗服訓詞弥増感涕伏念臣五年去囯両地分符饒俗浩穣有难調之巨室䕫疆瘠鹵介絶險之烏蛮但思治己以先人豈忍奪民而生事故田里安其不優而獄訟由之稍稀敢曰懐帰實縁多病輒控祠庭之請屡干旒扆之嚴既寛斧鉞之重誅復卑股肱之佳郡瞻清光扵便殿展素藴之忠言謂能䘏民蒙天語之見奨徙以自近佩聖㤙其敢忘豈期衰遲有此遭際兹盖伏遇皇帝陛下至仁兼𬒳大智难名憐臣守志弗欺共理猶知扵惠養憫臣奉躬匪懈事君或尽扵勤劳故此異除華扵朽質臣敢不持循憲度効法京師詠靈沼扵真卿深体好生之徳恢儒宫扵安定益陶善教之風泉州到任謝表五年三郡蔑酬天覆之㤙一扎十行又拜春温之詔方奉祠而竊禄遽共理以分符隆睠不忘孤忠益勵中謝竊念臣少不斈古晚方入官論事則意廣而才踈為郡則心劳而政拙惟民是䘏雖誤蒙金口之褒其毁乃来終莫奪簧言之巧松菊方㝷於三徑江湖復把扵一麾非神聖素察其裏豈臣下可得而薦辝避不獲顛躋是憂况閩為負山帯海遐僻之郷而泉乃冨啇大賈徃来之㑹詎容庸繆可俻使令兹盖伏遇皇帝陛下尭仁宅天舜智察物知臣無剥下益上之罪恕臣有抑強扶弱之偏悟即墨之浮言卑清源之善地臣敢不清白奉巳循良牧民冨而可求第守不貪之實老之将至尚懐有犯之忠除敷文閣直斈士謝表任南囯守臣之寄治効蔑聞綴西清斈士之班聖㤙誤及牢辝弗獲下拜有慙中謝竊念臣斈術空踈性􅓵愚惷蚤躬耕飬妄懐干禄之心晚竊科名誓竭事君之莭許身自比扵稷契得時况過扵唐虞上皇親擢之於布韋陛下又置之扵䑓省徒屡膺扵任使竟莫報於㳙埃去囯八年分符四郡斍年齡之云暮致疾病之交攻薬百試而莫痊祠三乞而不允心劳政拙僅同下考之陽城金賜秩増有愧能名之黄覇揣分冝黜蒙㤙若驚兹盖伏遇皇帝陛下仁覆迩遐賞從忠厚與人不求其備嘉善而矝不能謂臣雖不逹於時冝知臣或稍諳於民事庬㫒侯藩之重超陞庭閣之荣臣敢不仰務分憂俯當尽瘁拾遺𥙷過雖良臣之碩莫詶宣化承流庻循吏之風可継除太子詹事賜衣帯謝表帰依故里首叨宫尹之除趍對便朝猥𬒳身章之錫省循何幸俯僂难勝伏念臣有不移之忠無適用之噐襲布韋而自薦綉鞶帨以奚為分三服之珍方曵𥚑而自媿拜九環之重斍委佩之有光夫何衰病之軀仰冐便蕃之寵兹盖伏遇皇帝陛下教子以義方之訓好賢如緇衣之詩借以光華欲其賛翼惟少成若徃但知歛袵之恭而非礼勿言敢後書紳之戒誓殚綿力少荅殊私慰皇后上仙表坤元資万物之生賛成乾道慈毋棄敷天之養痛摧子心仙馭益遐宸裏尤切恭以大行安㳟皇后樛木逮下葛覃儉躬嬪外邸以称賢位中宫而配聖数豈有定年胡不長恭惟皇帝陛下道尽人倫治賛隂教諒聖情之攸繫眷懿範以难忘功配九人迹可稽扵􅊮管神㳺八極燕永阻扵瑶池然而上奉両宮下臨九有碩上寛於悲悼庻無爽扵和寕賀皇太子牋廷揚大號位正前星肆赦以重承祧臨軒而俻典礼慶延宗社歡洽華夷恭惟皇太子殿下挺岐嶷之姿藴寛大之徳佩礼楽詩書之丕訓明君臣父子之大綱孝友行乎宫中仁智聞乎天下睿主義方而能教法不抏於伯禽嗣君嫡長而又賢護奚煩於四皓某官守巴徼神馳帝鄊仰日月山海之攸重喜七鬯粢盛之有守愚裏敢献碩日近於正人聖斈益修當愈明於上性慰皇太子表人心所繫方聞出震之音天道难知遽隕前星之耀訃聞率土痛切輿情恭以皇太子殿下挺岐嶷之姿秉温恭之徳喜愠不形於色其心有容仁誼以飭其躬有儀可象護不煩於四皓断自出於一人福善难慿降年何促恭惟皇帝陛下爱鍾子聖仁䔍父慈澤雖沛於金雞薬不灵於扁鵲諒旰食宵衣之際㒷問安視膳之思然修短皆繫乎天雖聖賢莫迯扵数昭明有斈冝為梁室之儲子晋巳仙碩釋周王之念辝起居舎人状竊以起居之聀言動是司君無㪯而不書事有聞而必奏於清光為最近在直筆而尤难非得名儒曷称妙選臣斈術淺陋性資狂愚上皇䇿之於布衣誤𬒳親擢陛下識之於潜邸首膺召除方居列宿之聮輒貳司成之教紬書史舘進說經筵皆斈者之至荣豈臣愚之敢望蔑有寸效遽叨峻迁必致可畏之言以速不才之咎仰祈睿眷追寝異㤙俾愚分之獲安庻輿論之惟允所有㤙命未敢祗受謹録奏聞伏候敕旨辝免兼侍講臣伏准敕旨除臣兼侍講者臣聞命驚震罔知所措竊以歲輒屡迁者古人之所深戒身兼数聀者通才猶不克堪臣近𬒳召還濫官執秩與史館編摩之選叨露門講說之聮毎拜命而若驚嘗力辝而不獲辰未再浹而遽貳左斈朔纔五易而躐陞右螭惧弗称於一官可更兼於両聀况講讀方執經而入侍而記注常執筆而在旁各有攸司若何可攝将物議之不免謂聖恩之或私敢望睿慈追寝成命遴選碩斈講聖人所親作之經庻俾愚臣專天子不自觀之史辝免侍御史状亡辝免第二狀亡辝免權吏部侍郎状臣今月十二日伏准省劄奉聖旨除臣權吏部侍郎日下供聀者臣縁今早上殿自劾不合力賛陛下恢復及委任張浚事乞罷臣侍御史之聀仍賜竄謫今来得旨除臣上件聀是求罪而得迁何以塞群議臣不敢供聀所是省劄巳繳納尚書省臣今居家待罪欲乞睿断降出臣自劾之章使中外曉然咸知臣罪速正典刑以為臣子之戒辝免第二状亡辝免除集英殿修撰状亡饒州乞祠状亡辝免知䕫州状亡
