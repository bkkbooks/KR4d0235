body:
  text: 墓誌銘周承奉墓誌銘予㳺太學與周君懋為同舍生明年同擢進士苐又明年予為東諸侯客周自婺女来訪焉不見盖五年矣予再仕再去國周官㳺㱕故鄊赱書数百里以先承奉公之訃来吿又以三山林君㞯之状丐予銘予流涕讀之不敢辭公諱某字純臣婺州義烏人曽大父某大父某父某皆晦迹不仕公孩提䘮母少長聞之哀慕如成人事父及継母以孝稱撫㓜弟教而室之身任家事不私有其財同居五十年無間言人以為難教子姪尤力子懋業上庠歲一往必戒之曰母怠而修懋遵誨敕不懈益厪丁丑春射䇿遂登甲科妷憲踵與薦書郷人榮之懋教授邵武侍公以行公諄諄然以職事勉之教授君温􅌋長者待諸生以誠寓教誨扵色笑間不嚴而勸秩滿咸惜其去義方力也紹興天子上長樂宫夀官及髙年公授右承務郎致仕今天子嗣位轉承奉郎人謂積善之報隆興元年六月庚申卒享年七十有一以十月乙酉葬于邑之鳳林鄊長塘原娶劉氏與公同年生賢㳤稱之今無恙男一人即教授也女二人㱕進士樓世南楊巽孫男四人伯奮仲堪叔獻仲熊孫女一人長許嫁何次尚㓜公姿魁碩為人質直通曉世務衍扵財而好施急親戚故舊之貧者與鄊黨鄰里歲歉而艱食者棄逋負廣津梁崇釋氏以植福爲尤多勞扵治生而䏻自佚扵谿山杖屨賔客㳺從壼觴博奕間性友愛㑹弟先卒病遂劇有唾壼常以自隨一夕命家人亟去之曰吾行矣奚用此爲巳而果然嗚呼宇宙一壼也形骸涕唾耳寓形扵宇宙之壼而自與窮逹榮悴利害是非毁譽之境接真邪妄邪吾扵公不怛化之際竊有取焉銘曰周出扵姬實爲著姓烏傷一門蔚有餘慶公扵孝友匪習而性必謂之學是亦爲政天報以子且及其身子蜚令名身亦逢辰化不吾怛㱕復其真斵石銘幽以詔後人何提刑墓誌銘永嘉自元祐以来七風浸盛淵源自得之學胷臆不蹈襲之文儒先數公著述具存不􅏜不迂詞醇味長鄊令及門孔氏未必後㳺夏徒也涵養停蓄波瀾日肆至建炎紹興間異才輩出往往甲扵東南若舍人何公又其卓然者歟公諱逢原字希深世為温人曽祖某祖某皆濳徳不耀父某累贈奉直大夫妣王氏封太宜人公姿頴異眉宇秀整頎而長身兒時強記覧落筆語驚人嘗賦松柏後彫志趣不凡識者期以逺到擢進士乙科調秀州司戸㕘軍未赴召對敷奏進止剴切詳雅除敕令所刪㝎官書成改承奉郎遷秘書省正字時秘閣初建登􅌡皆極選公翶翔其間讀異書見聞益愽丁母憂服除復舊職以言罷通判池州歲飢公攝郡事發廪以濟有以專輙諌者公曰以此獲譴所甘心焉爲粥以待于路病者藥之人由是免流移飢而不害秩滿除樞密院編修官兼權左司郎中起居舍人中書舍人初奏氏盗權以國事讎殺大将竄忠良鉗天下口神怒人怨公爲書生時嘗客其舘授其子以經扵是間見以物議洶洶告秦氏曰吾所與語者天也豈復與人校是非公曰天之心即人之心也豈有異㢤秦氏大銜之㙜諫承風捃以他故至是再黜乆之除添差通判䖏州公以才進譽藉甚自樞屬攝從班兼數職光顯于朝去不以罪且下佐小州士論屈之公以近鄊自賀無㡬微愠色君子謂其得大雅之明哲太守某聞其賢以郡事諉之公既深厥職剔蠧鋤梗郡遂大治俗生子多不舉公重賞嚴禁飾保伍諭以天性所活叵計除浙東㕘議官改提舉湖北常平茶監事湖北産茶病私鬻江西悪少越境群至數以千百相挻為盗材落間户閉白晝公憂之乃與憲司謀以戍兵三千隷盗賊司分布要衝以遏之盗販者息民賴以安徙知嘉州嘉逺王都吏横而肆訟諜紛委率出入其手公至立訟者于庭俾自供曉以曲直悔過者随遣之不悛則懲以笞罰訟由是簡犴獄屢空罷行估不一毫市扵民去之日闔境交送携扶填擁至不得有然香于臂以祝者且曰自有漢嘉無此賢使君祠于佛舍至今奉之除成都路轉運判官四川類省試有請託暗記傳義之弊朝廷擇清徳重望士以董之差公充監試官公措畫有方内外嚴密纎分不通前弊盡革時號公選明年廷對蜀士果多巍科廟學歲乆而壊像貌􅉳剥易而新之植嘉木増養士貟頌之者以比文翁除知䕫州未至改潼川路提點刑獄行部至合州有重囚衣鮮潔而械有塵垢公親鞠之情得乃縣吏受賕釋其械遂竟其奸且申明縣吏行常禄雖枉法而罪不重故獄多冤濫乞自縣吏掌獄者亦重禄朝廷從之大足尉利盗贓殺匿者以滅口而以病死聞公疑而詰之尉色動捽赴獄果自伏人以為神明監司歲薦舉刼扵有力不得如已志公獨記姓名壁間䟽臧否于下有状不待請而舉由是孤寒皆蒙識㧞奔競少衰就差轉運副使再監類試院乾道二年召赴行在除金部郎中公乆患臂弱至是䆮劇力丐祠除福建提點刑獄事以四年三月某日卒于官舍享年六十有三階朝散大夫公為人謙恭樂易持心近􅌋不為崖異行善諧謔然未嘗忤物儉扵自奉澣衣菲食以終其身通守两州不按臨属邑五持使節所過州縣止數軰人不知其為使者毎謝卻厨傳吏以例冊言公曰吾知奉法而巳何以例為專以愛民爲心治尚不擾故所至可紀有古循吏風故相趙公鼎㕘政孫公近皆􅌋遇之尚書呉公表臣端明張公闡樞使汪公澈皆舉以自代然公既忤權臣迹踈遠十年楚蜀晚方還朝以疾補外遂致不起才不克究中外惜之長扵理學尤精論語覃思二十年毎見學者必與講論有集觧十卷簡嚴明白超詣䖏諸儒所不到且自序其書曰古之學者爲巳今之學者爲人爲巳則䏻爲人爲人則两失之矣凡平日臨政遇物一以所得扵書者從事盖非苟知之也善属文清峻遒麗雖倉猝應用必自已出不剽竊前人語尤長扵詩有晉宋味有文集二十卷外制二卷初育扵楊氏既登第復今姓嫁楊氏女立其後擇師以教之買田以贍其家娶丘氏故左司鐸之妺子三人長端木将仕郎孝而䏻文先公三年卒次東里次少連女一人孫男二人曰鏞曰某東里鏞皆将仕郎以五年十二月某日葬于吹㙜鄊西山瑞鹿院之右公漕成都與大資王公之望善及憲閩五適爲帥後事卒頼之既而移鎮鄊邦又經紀其家某與公同鄊爲晚進慕其名乆矣恨未之識及守䕫子始通書自蜀召還迓于江滸公驚曰吾以子爲尚年少乃爯老邪一見如故首及論語且授以集觧某傳之䕫學酌酒郡齋講酬酢公舉觴曰吾不爲世俗祝願子得詞早還故鄊某感其言餞于白帝詩以送之公䘮自閩某弔于其家諸孤以墓銘見属明年冬興化簿葉仲堪以行状来其受公一日知不敢辭銘曰賢㢤何公邦之傑博通六藝窮舘鎋為已為人皆自出致身事君恥容恱忠告善道乃見黜施于有政果藝逹學道愛人治可述栖栖萬里赱輗軏君命召還巳白髮陳力下就四七列歲寒不凋出持節命也歟㢤遽嬰疾死生晝夜貫以一没世名稱不磨滅贈少保王公墓誌紹興丙寅春某初肄業太學今資政殿大學士叅政王公為博士學者咸敬而仰之師道之尊如陽司業衡鑑之精如陸宣公慨然痛革時文之弊一㱕扵正如昌黎歐陽二先生士有經指授蒙品題者咸見頭角為時聞人某最不才且晚進亦以舉子之業誤被賞識遇稠人必誦而夸之卒繇舍選竊科苐先生奨借成就之力也乾道戊子冬十月某懐清源郡章過三山拜先生于黄堂賜之酒既半出示所述先少保公世次行實且曰吾欲求有道䏻言者属之碑子其人也某懼而避席曰先生誤矣某不摳衣趍隅二紀于兹矣道固未之聞也而言尤不工先生門人弟子滿天下而以是属謏學小生烏䏻發揚遺懿之萬一邪力辭至五六卒不獲命明年秋八月書至自永嘉督益嚴廼即先生之所述而系之公諱綱字振仲先世閩人徙錢唐開元中旅㳺漢沔間至㐮州榖城樂其風土遂家焉六世祖公逹生居䏻居䏻生崇遇崇遇生公之曽祖考諱允中有子諱迁扵公為皇祖考生皇考諱文自皇考而上皆隠䖏不仕皇考以公登朝絫贈朝奉郎今天子即位之三年求治甚切思用異人得公之子喜甚擢左諌議大夫宣諭江淮入㕘大政扵是襃其三世贈公之祖考太子太保妣向氏琅邪郡夫人彤氏博平郡夫人贈皇考太子太傅妣黄氏㝎㐮郡夫人贈公少保配張氏㐮國夫人王氏世有隂徳扵鄊閭至宫保尤號長者見其容温然知其為徳人也平生無忿恚未嘗笞詈人嘗使㒒曝麥扵場㒒㳺博舍去雨俄至漂且盡杖之三終身以為恨仲兄役扵郷主郡驛僕盗用官米絫之宫保自誣曰使㒒者我也兄不與知官吏皆知其不然以宫保執不可奪姑緩其獄一日将致刑忽大赦遂得釋一郡歡呼曰天果不䧟善人鄊人有負逋無以償鬻其小女扵市頗有姿色宫保見之不商其直而售且曰翌日以女来作劵果如期而至宫保笑曰吾焉用汝女聊爲君償逋耳卒㱕之所居去杜母鎮十餘里有僧與鎮将邢氏有怨發怒投張海爲賊䆃之自均房来𣣔復仇宫保聞賊至曰我若去必殘吾鄊因具牛酒以待賊見其状貌兇暴之氣頓銷且素聞其賢甚敬之約其徒秋毫無犯僧感舊恩見則拜曰此来專欲謝公而報邢也力觧之不可遂醉而閉之亟遣吿邢舉族遁去賊既退乃徐出僧至鎮追其徒不及竟無所肆其毒猶于京豪侠任氣使酒而好闘市有一無頼少年惡之嘗切齒宫保呼無頼子與錢十萬使市布扵房陵衆皆争曰吾㒒使不乏何至用此人必不来矣不答無頼子得錢醉酒蒲博數日而盡遂遁去争者咎之宫保曰吾非不知顧吾姪深悪其人常恐杯酒之後一與之遇事有不測吾以百千去之所以两全之也常曰家貲非我獨有當三分之一以給家用一以奉官輸一以待賔客賑貧窮故四方之士皆奔赱其門有所求随其意而飽滿之飢者分之食寒者遺之衣婚嫁不給者助之貧而死者為之辦棺槨具衣衾士大夫罷官赴調流落不能㱕者資其費假以僕馬逺者数千里不計也扵是逺近翕然不以姓氏稱皆呼曰無怨公議者以比漢伏不闘云臨終戒其子曰欲服人母蓄賄欲睦族無議財尊師友以教子孫蔵經籍以待豪俊好甘者飴以蜜好安者設以席果守吾言必将有後言畢而逝琅邪夫人生二子宫傳其季也為人魁梧寛􅌋行義著扵邦族遵宫保之業世其徳而不變好學有才華詩筆清麗所與㳺皆鄊之賢士及時之名卿大夫盛公次仲帥南陽卒于官其子章卜葬于漢南貧不䏻集事造門哀告曰聞公髙義且多山林願得尋常地以為先人宅兆慨然許之曰惟君所擇章既得卜凡葬所湏皆仰給焉又舘榖其家數百指㡬歲而不厭其好義皆此類與從兄髙相敬如賔三世聚居門内百口每食必同席甘苦惟均上下無異財鄊人服之取以為法㝎㐮亦嚴明有賢行事皇姑至孝年五十餘抱孫矣猶日親盥饋性無妬忌愛庶孽過扵巳出宫傳篤學喜客不屑治生業一切委夫人小大斬斬皆有條理宫傳篤扵教子夫人佐之其義方慶善乃鍾扵公公㓜謹孝有立及長克家力學有功名大志時余公幹鄒公浩皆當世名士相繼教授郡學公往從之勤苦絶人其業日進鄒公尤留心教誘諸生課程其工拙美惡必題数語為品藻公毎蒙賞激遂為髙苐舉進士中元符三年丙科授将仕郎延安府法曹㕘軍宫傳遺之詩有利名埸裏持清謹冠盖叢中寢是非之戒公敬佩焉丁外艱執䘮哀毀過甚跣而尋山以葬足為跰裂服除調慶州司法㕘軍帥錢公昻髙其才而委任之以進築香柏㙜神堂九羊堡應副有勞及該八寳赦恩絫循儒林郎有禁卒五人夜踰甕城刼門者衲衣門者凍以死而復活案具當斬公白帥曰一衲直数百錢且變主不死而殺五人情有可矜錢公曰公欲云何曰此軍人也若送經畧司則死生在公特筆耳錢公忻然從之獄官怒曰公𣣔以國法市隂徳邪公不為動卒皆活之以乆去親闈自陳合入支掌資序罷㱕授江陵府觀察推官分曹建掾改為司兵曹事属貳車虚席公攝事歲餘一府仰辦江陵太府諸司皆在争以事諉公目為府中一俊常平司檄主管其司事時湖北行方田法主扵是司前使者去憲攝之又按獄湖南獨僉㕔行其事公知其法之弊委曲調護利則伸之害則違之又選擇所差官而授以方畧扵是方八州而無訟公不自言既去官後使者白其功于上特循承直郎丁㝎㐮夫人憂扶護北㱕哀感行路服除授開封府扶溝縣建雄鎮權府學博士改奉議郎知金刑漢隂縣在京西極境治所去利路界十餘里梁雍之民錯襍其間公臨以簡易人甚宜之范公致虚以前執政鎮南陽聞其政聲辟知穣縣辭不行終更屢轉朝散郎賜六品服擬通判濟州未赴以建炎元年十月十一日薨于家享年五十有五公為人淳質任真不事表襮遇人以一誠喜稱其善有過則面告戒之退無後言平生恬退不妄干進入仕二十八年在官纔十考其除内艱而造朝也盛章為開封尹權勢震赫以皇考舊恩欲報之公公固不附又嘗欲以妻黨張氏女㱕公公拒不受積以為怨因不被薦巳而章敗其客皆坐逺謫公獨不汚承祖父之風好施予不蓄資財居官尤㢘潔先世雖􅌋所産至公益貧自漢隂代㱕糧食不継范公宗尹有詩曰丈人古君子清徳肖冰玉仕宦三十載一飽猶仰祿驅車向金闕此行何太速家山豈不恋陶令瓶無粟知者以為實錄其調濟州通判州有田隷西城所巨閹李彦主其事兇熖熾然人曰公必往見之不然且有禍公曰吾寜不調不䏻屈扵此巳而果見奪其得倅徽州未出都而金人再犯闕公在圍中官索金銀甚急人多匿不肎輸公刼掠之餘嚢有数金悉以送官人勸公少留以為㱕資公曰國家如此吾尚忍有所隠耶二聖既入虜營集百官扵秘書省聮名以立張楚公驚涕而出曰始以為立皇太子若爾吾非所敢知卒不書見者皆為驚悚篤扵風義其釋楬也同時鄊貢之士苐與不苐数十人多依公以食貧不䏻㱕者資遣之有風鍳好奨借人物所許予後多顯逹范公宗尹為布衣時年甫及冠公一見期以逺到奨成之其訓子弟造次必以逺大老猶自力觀書以誘迪之聮案共檠夜分不倦㐮國夫人聰明修整好讀書聞古今賢人才士之事業則聳然慕之常舉以勉公且以誨其子先公十七年薨公念其賢誓不再醮初公既葬皇考而不宜其地欲改卜未遑也大資政知荆門軍以紹興癸酉正月十四日奉皇考及公之䘮葬扵故居之東北一里龜山之原各以其夫人祔五子之深之美之珎皆未仕而卒之望即大資政也今知温州之彦右承直郎一女適秉義郎歐陽价早卒孫男十人鏞右從事郎銖右宣義郎鐸右迪功郎錞右修職郎欽右承務郎鑄鑰錫鉞鈆未仕孫女六人一適右從事郎錢慶祖一適右通直郎魏欽弼曽孫淙濩自靖康之亂㐮漢被禍尤酷獲免者千一往往無噍類獨王氏㡬絶而復滋大資政又以儒術文章奮結知明主致身執政爲時重臣初宫保贈制曰清塵美行肩于古人重義輕財化貪息訟州閭以無怨公稱之我宋造邦榖城以進士起家自其孫始迨兹萬機流澤燾後信可取必君子曰王氏之有後也宜㢤徳􅌋者流光天道不可誣也銘曰王氏之先自閩徙杭有唐開元始家于襄至無怨公植徳好誼善積名成如漢伏氏宫傳遵之不懈有加慶鍾少保進士起家小試墨曹活人惟死攝官大府政聲有偉匪人不附偽命不汚凛然節義可激懦夫天嗇其年志不克究不在其身以昌厥後果生人傑早蜚大聲模範太學作新諸生勤勞于外治最荆蜀帝曰来㱕資尓啓沃進司言責入賛政機密䟽輸忠而人不知惟帝知之大藩是卑不令而行徳威惟畏帝念老成行将相之先世之襃奚止扵斯龜山之原小黄之口紀徳豐碑有同峴首杜殿院墓誌杜陵先生以詩鳴于唐忠不忘君自比稷卨卒窮以死君子知其必有後先生之子曰宗文宗武宗文之子居蜀之青神號東山翁東山翁生禮僖宗時為諌官禮生詳詳生晏景福中為侍御史公侍御史八世孫也又以諌顯為宋名臣扵少陵有光矣公諱莘老字起莘曽祖某祖某父某皆潜徳不仕而以儒名家父贈右奉議郎母氏贈恭人公㓜不好戯稍長知力學時學者宗臨川禁蘇氏文公獨誦習有識器重之宕渠守石翼以師禮致之遂自眉徙焉家恭之江津苐進士以地逺親老不赴廷對賜同進士出身授梁山軍教授從之㳺者益衆秦檜死魏公良臣㕘大政公䟽天下利病上之良臣薦于上主管禮兵部架閣文字明年秋七月有星彗于東方公指陳時政之弊時應詔者衆上命後省擇而苐之以公為首進秩一階制曰言尤鯁亮士榮其襃迁敕令所刪㝎官修書無慮十数至刑部断例尤盡心有疑則反覆奏請同列服其精當迁太常寺簿尋除博士時虜𣣔敗􅉀疆埸無僃公因輪對言状且曰勿恃其不来恃吾有以待之上稱善再三曰朕知卿忠由是有用公意顯仁皇后崩自南渡後典秩多失至凶禮尤不知有疑議吏皆拱手公輙引古誼從容裁度大歛前一日宰相遽召赴堂曰有旨問含玉之制公曰禮院故實所不載以周禮典瑞鄭元所注製之其可因立具奏上覧之曰真禮官也虞祭或謂上哀勞欲以宰相行事主議者力甚公曰古今無是比卒正之今上立為建王討論典禮尤備丞秘書面對論江淮守備上曰卿言及此憂國深矣權吏部貟外郎主右選小使臣舊不出闕吏取而鬻之在選数百人無所訢公始命出㮄闕以次就注擢監察御史遷殿中侍御史上曰以卿忠直不畏强禦故有此授逆亮将寒􅉀遣使致慢書傳欽宗凶訃請准漢地索大臣上决䇿親征公奏䟽賛其决謂虜欺天背􅉀政宜待以不懼因上四事一不限早莫延見大臣侍從謀議國事二申敕侍從㙜諌監同守臣速舉可用之才三虜情雖叵測然宜以時遣使示曲在彼四車駕既謀順動而留鑰宜擇重臣此下缺文劉知縣墓志銘永嘉號多士甲扵東南劉公全之以重􅌋長者稱徳成行尊而年與位不稱歛恵一同有藴莫施君子惜之公諱銓其先閩人避五代亂徙温之樂清曽祖某祖某咸有潜徳父某贈右承事郎劉在邑為著姓世衍扵財至承事公易以詩書所交皆一時聞人篤扵教子公姿秀整力學䏻文未冠有雋聲鄊先生仰公文蔚孫公仲鼇師友也每見所業必稱嘆許其逺到叔父奉議祖向授徒于家公與從弟鎮從學以文行為稱首識者謂劉氏有子知必大其門公果與叔父偕薦計㙜明年同擢進士苐後六年鎮亦登科鄊人榮之目曰三劉公初調台州臨海尉秩滿丞越之􅌘未及考丁父憂終䘮注奉州如皋今改宣教郎知秀州海塩縣今天子即位覃恩轉奉議郎賜銀緋至官未朞年丁母太孺人憂㱕葬于鄊㑹海溢沾濡感疾遂致仕轉承議郎卒年五十六實乾道二年十一月二十二日也公性愷悌為政務循良飾以儒雅不求赫赫譽然所至咸有可觀台城之東数里有泉可醸筩水致諸務歲婁易民病竹木輸公易以石官私便之初公如浙西道繇􅌘遇惡少為儕務奪掠比至嚴下令皆讋伏事有便于民力賛令行之不自以為功􅌘人至今徳之如皋土曠少耕者膏腴故壌弥望皆葦茅公躬阡陌喻民力農墾田餘数萬畝流亡復集初之官太孺人以老不行公念切謁吿迎侍邑人惧其不来状于郡及諸司以留公得請于省郆行李即塗老稚駢擁委曲諭之乃得去及聞其還驩然相賀簿攝邑事有誣吿強刼者輙逮捕繋獄連坐以十数公至得其情悉縦之按誣者頃之憲㙜来詰公不咎攝者或勸直之不從人益義之進士丁時發者嘗客其舘公過闕謂友人王某曰丁有美才文不俗必髙第巳而果然海塩水害稼被檄檢傷放秋苗数萬斛計貧不䏻輸者猶十一請于朝得旨倚閣春饑勸豪右發廪以濟全活者衆民無資以耕貸于郡給之且欲身任其責境内樂業歲遂有秋學久廢輟圭租二百斛以倡士感而恱争輸財以助之棟宇一新其務敦教化如此故一時諸公咸称薦之侍郎劉公岑以先達髙自標置少許可其帥淮也将薦公于朝㑹罷乃巳公美湏髯風度尤不淺自謂平生未嘗知憂與賔客飲必盡􅌚衆方紛然有所譏議公若不䏻言者喜愠不形人莫得而親踈有忤巳者怡然不與校人有善則稱不容口輕財好義務周人之急觧衣指囷色無靳遇人有禮雖至賤貧者見之無慢容尤敦宗好每相過必敕具即事唱酬日以為常工文詞典而有致賦詩句法清劲自成一家字畫端謹如其為人母瞿氏以太后八帙恩封太孺人娶瞿氏再娶汪氏皆贈孺人又娶葉氏封孺人皆先卒男二人儼价儀咸習舉子業女五人長適郷貢進士林燾次許嫁國學進士賈俁餘㓜孫男一人女一人儼等将以四年二月丙申奉公之䘮與孺人汪氏葉氏合葬于真如之原求某誌其墓某少與公爲筆硯交辱知最厚公既筮仕某猶困場屋公遇人必借譽然未甞自言歲戊辰某下第棄舍選不就遇公于武林同渡浙江語其故公曰子有進身路何乃自棄邪力勉之自越還學卒田舍法進公之力也某赴番昜公餞别于道逮至䕫書問不絶且約㑹老于鄊明年東㱕道聞公訃嗚呼痛㢤銘曰有美君子温其如玉醖藉而文琢磨以學施于有政不猛而循愛遺四邑活及萬人婁郝以来世稀長者吾鄊有評公其人也天􅌋其徳胡嗇其言志不克究有子以傳真如之原㱕從先子陵谷有遷徳名不圯令人壙誌令人姓賈氏温州樂清人曽祖某祖奭父如訥皆有隠徳王賈同邑且世姻故令人㱕于我逮事舅姑以孝稱從其夫某宦㳺于越入仕于朝出守饒䕫湖泉四州賢而有助初封恭人再封令人乾道四年十二月十日卒于泉之郡舍享年五十五六年九月乙酉葬于左原白岩祔姑令人萬氏之右男二人聞詩聞禮皆國學生孟丙蚤死女二人長嫁國學進士錢萬全次許嫁賈梓男孫二人阿䕫阿閩女孫二人國娘晉娘敷文閣直學士左朝奉郎新知台州軍州事王某誌梅溪先生後集卷第二十九
