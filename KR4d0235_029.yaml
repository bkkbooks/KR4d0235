  text: 梅溪先生後集卷第二十九
  hash: sha256:9a5b83d712f4a06df7ee3178e7542cfdf281a27c4a18056bf341221cf4062785
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_029-1a}
body:
  text: 墓志銘周承奉墓志銘豫遊太學與周君懋為同舍生明年同擢進士苐又明年豫為東諸侯客周自婺女來訪焉不見蓋五年矣豫再仕再去國周官遊歸故鄊赱書數百里以先承奉公之訃來告又以三山林君屺之狀丐豫銘豫流涕讀之不敢辭公諱某字純臣婺州義烏人曽大父某大父某父某皆晦迹不仕公孩提喪母少長聞之哀慕如成人事父及繼母以孝稱撫幼弟教而室之身任家事不私有其財同居五十年無間言人以為難教子姪尤力子懋業上庠歲一往必戒之曰母怠而修懋遵誨敕不懈益厪丁丑春射䇿遂登甲科姪憲踵與薦書鄉人榮之懋教授邵武侍公以行公諄諄然以職事勉之教授君溫􅌋長者待諸生以誠寓教誨于色笑間不嚴而勸秩滿咸惜其去義方力也紹興天子上長樂宫夀官及髙年公授右承務郎致仕今天子嗣位轉承奉郎人謂積善之報隆興元年六月庚申卒享年七十有一以十月乙酉葬于邑之鳳林鄊長塘原娶劉氏與公同年生賢淑稱之今無恙男一人即教授也女二人歸進士樓世南楊巽孫男四人伯奮仲堪叔獻仲熊孫女一人長許嫁何次尚幼公姿魁碩為人質直通曉世務衍于財而好施急親戚故舊之貧者與鄊黨鄰里歲歉而艱食者棄逋負廣津梁崇釋氏以植福為尤多勞于治生而能自佚于溪山杖屨賔客遊從壼觴博奕間性友愛會弟先卒病遂劇有唾壼常以自隨一夕命家人亟去之曰吾行矣奚用此為巳而果然嗚呼宇宙一壼也形骸涕唾耳寓形于宇宙之壼而自與窮逹榮悴利害是非毁譽之境接真邪妄邪吾于公不怛化之際竊有取焉銘曰周出于姬實為著姓烏傷一門蔚有餘慶公于孝友匪習而性必謂之學是亦為政天報以子且及其身子蜚令名身亦逢辰化不吾怛歸復其真斫石銘幽以詔後人何提刑墓志銘永嘉自元祐以來七風浸盛淵源自得之學胸臆不蹈襲之文儒先數公著述具存不􅏜不迂詞醇味長鄊令及門孔氏未必後遊夏徒也涵養停蓄波瀾日肆至建炎紹興間異才輩出往往甲于東南若舍人何公又其卓然者歟公諱逢原字希深世為溫人曽祖某祖某皆濳德不耀父某纍贈奉直大夫妣王氏封太宜人公姿頴異眉宇秀整頎而長身兒時強記覽落筆語驚人嘗賦松柏後雕志趣不凡識者期以逺到擢進士乙科調秀州司戶參軍未赴召對敷奏進止剴切詳雅除敕令所刪㝎官書成改承奉郎遷祕書省正字時祕閣初建登􅌡皆極選公翶翔其間讀異書見聞益博丁母憂服除復舊職以言罷通判池州歲飢公攝郡事發廪以濟有以專輒諌者公曰以此獲譴所甘心焉為粥以待于路病者藥之人由是免流移飢而不害秩滿除樞密院編修官兼權左司郎中起居舍人中書舍人初奏氏盜權以國事讎殺大將竄忠良鉗天下口神怒人怨公為書生時嘗客其館授其子以經于是間見以物議洶洶告秦氏曰吾所與語者天也豈復與人校是非公曰天之心即人之心也豈有異哉秦氏大銜之臺諫承風捃以他故至是再黜久之除添差通判處州公以才進譽藉甚自樞屬攝從班兼數職光顯于朝去不以罪且下佐小州士論屈之公以近鄊自賀無幾微愠色君子謂其得大雅之明哲太守某聞其賢以郡事諉之公既深厥職剔蠧鋤梗郡遂大治俗生子多不舉公重賞嚴禁飾保伍諭以天性所活叵計除浙東參議官改提舉湖北常平茶監事湖北産茶病私鬻江西惡少越境群至數以千百相挻為盜材落間户閉白晝公憂之乃與憲司謀以戍兵三千隸盜賊司分布要衝以遏之盜販者息民賴以安徙知嘉州嘉逺王都吏橫而肆訟諜紛委率出入其手公至立訟者于庭俾自供曉以曲直悔過者隨遣之不悛則懲以笞罰訟由是簡犴獄屢空罷行估不一毫市于民去之日闔境交送携扶填擁至不得有然香于臂以祝者且曰自有漢嘉無此賢使君祠于佛舍至今奉之除成都路轉運判官四川類省試有請託暗記傳義之弊朝廷擇清德重望士以董之差公充監試官公措畫有方內外嚴密纎分不通前弊盡革時號公選明年廷對蜀士果多巍科廟學歲久而壞像貌􅉳剝易而新之植嘉木增養士貟頌之者以比文翁除知夔州未至改潼川路提點刑獄行部至合州有重囚衣鮮潔而械有塵垢公親鞠之情得乃縣吏受賕釋其械遂竟其姦且申明縣吏行常祿雖枉法而罪不重故獄多冤濫乞自縣吏掌獄者亦重祿朝廷從之大足尉利盜贓殺匿者以滅口而以病死聞公疑而詰之尉色動捽赴獄果自伏人以為神明監司歲薦舉劫于有力不得如已志公獨記姓名壁間疏臧否于下有狀不待請而舉由是孤寒皆蒙識拔奔競少衰就差轉運副使再監類試院乾道二年召赴行在除金部郎中公久患臂弱至是䆮劇力丐祠除福建提點刑獄事以四年三月某日卒于官舍享年六十有三階朝散大夫公為人謙恭樂易持心近􅌋不為崖異行善諧謔然未嘗忤物儉于自奉浣衣菲食以終其身通守兩州不按臨屬邑五持使節所過州縣止數輩人不知其為使者每謝卻厨傳吏以例册言公曰吾知奉法而巳何以例為專以愛民為心治尚不擾故所至可紀有古循吏風故相趙公鼎參政孫公近皆􅌋遇之尚書吳公表臣端明張公闡樞使汪公徹皆舉以自代然公既忤權臣迹踈遠十年楚蜀晚方還朝以疾補外遂致不起才不克究中外惜之長于理學尤精論語覃思二十年每見學者必與講論有集解十卷簡嚴明白超詣處諸儒所不到且自序其書曰古之學者為巳今之學者為人為巳則能為人為人則兩失之矣凡平日臨政遇物一以所得于書者從事蓋非苟知之也善屬文清峻遒麗雖倉猝應用必自已出不剽竊前人語尤長于詩有晉宋味有文集二十卷外制二卷初育于楊氏既登第復今姓嫁楊氏女立其後擇師以教之買田以贍其家娶丘氏故左司鐸之妹子三人長端木將仕郎孝而能文先公三年卒次東里次少連女一人孫男二人曰鏞曰某東里鏞皆將仕郎以五年十二月某日葬于吹臺鄊西山瑞鹿院之右公漕成都與大資王公之望善及憲閩五適為帥後事卒賴之既而移鎮鄊邦又經紀其家某與公同鄊為晚進慕其名久矣恨未之識及守夔子始通書自蜀召還迓于江滸公驚曰吾以子為尚年少乃爯老邪一見如故首及論語且授以集解某傳之夔學酌酒郡齋講酬酢公舉觴曰吾不為世俗祝願子得詞早還故鄊某感其言餞于白帝詩以送之公喪自閩某弔于其家諸孤以墓銘見屬明年冬興化簿葉仲堪以行狀來其受公一日知不敢辭銘曰賢哉何公邦之傑博通六藝窮館轄為已為人皆自出致身事君恥容恱忠告善道乃見黜施于有政果藝逹學道愛人治可述栖栖萬里赱輗軏君命召還巳白髮陳力下就四七列歲寒不凋出持節命也歟哉遽嬰疾死生晝夜貫以一沒世名稱不磨滅贈少保王公墓志紹興丙寅春某初肄業太學今資政殿大學士參政王公為博士學者咸敬而仰之師道之尊如陽司業衡鑑之精如陸宣公慨然痛革時文之弊一歸于正如昌黎歐陽二先生士有經指授蒙品題者咸見頭角為時聞人某最不才且晚進亦以舉子之業誤被賞識遇稠人必誦而夸之卒繇舍選竊科苐先生奬借成就之力也乾道戊子冬十月某懷清源郡章過三山拜先生于黃堂賜之酒既半出示所述先少保公世次行實且曰吾欲求有道能言者屬之碑子其人也某懼而避席曰先生誤矣某不摳衣趍隅二紀于兹矣道固未之聞也而言尤不工先生門人弟子滿天下而以是屬謏學小生烏能發揚遺懿之萬一邪力辭至五六卒不獲命明年秋八月書至自永嘉督益嚴乃即先生之所述而系之公諱綱字振仲先世閩人徙錢唐開元中旅遊漢沔間至襄州榖城樂其風土遂家焉六世祖公逹生居能居能生崇遇崇遇生公之曽祖考諱允中有子諱遷于公為皇祖考生皇考諱文自皇考而上皆隱處不仕皇考以公登朝絫贈朝奉郎今天子即位之三年求治甚切思用異人得公之子喜甚擢左諌議大夫宣諭江淮入參大政于是褒其三世贈公之祖考太子太保妣向氏琅邪郡夫人彤氏博平郡夫人贈皇考太子太傅妣黃氏㝎襄郡夫人贈公少保配張氏襄國夫人王氏世有隂德于鄊閭至宫保尤號長者見其容溫然知其為德人也平生無忿恚未嘗笞詈人嘗使㒒曝麥于場㒒遊博舍去雨俄至漂且盡杖之三終身以為恨仲兄役于鄉主郡驛僕盜用官米絫之宫保自誣曰使㒒者我也兄不與知官吏皆知其不然以宫保執不可奪姑緩其獄一日將致刑忽大赦遂得釋一郡歡呼曰天果不陷善人鄊人有負逋無以償鬻其小女于市頗有姿色宫保見之不商其直而售且曰翌日以女來作劵果如期而至宫保笑曰吾焉用汝女聊為君償逋耳卒歸之所居去杜母鎮十餘里有僧與鎮將邢氏有怨發怒投張海為賊䆃之自均房來𣣔復仇宫保聞賊至曰我若去必殘吾鄊因具牛酒以待賊見其狀貌凶暴之氣頓銷且素聞其賢甚敬之約其徒秋毫無犯僧感舊恩見則拜曰此來專欲謝公而報邢也力解之不可遂醉而閉之亟遣告邢舉族遁去賊既退乃徐出僧至鎮追其徒不及竟無所肆其毒猶于京豪俠任氣使酒而好鬪市有一無賴少年惡之嘗切齒宫保呼無賴子與錢十萬使市布于房陵衆皆爭曰吾㒒使不乏何至用此人必不來矣不答無賴子得錢醉酒蒲博數日而盡遂遁去爭者咎之宫保曰吾非不知顧吾姪深惡其人常恐杯酒之後一與之遇事有不測吾以百千去之所以兩全之也常曰家資非我獨有當三分之一以給家用一以奉官輸一以待賔客賑貧窮故四方之士皆奔赱其門有所求隨其意而飽滿之飢者分之食寒者遺之衣婚嫁不給者助之貧而死者為之辦棺槨具衣衾士大夫罷官赴調流落不能歸者資其費假以僕馬逺者數千里不計也于是逺近翕然不以姓氏稱皆呼曰無怨公議者以比漢伏不鬪云臨終戒其子曰欲服人母蓄賄欲睦族無議財尊師友以教子孫藏經籍以待豪俊好甘者飴以蜜好安者設以席果守吾言必將有後言畢而逝琅邪夫人生二子宫傳其季也為人魁梧寬􅌋行義著于邦族遵宫保之業世其德而不變好學有才華詩筆清麗所與遊皆鄊之賢士及時之名卿大夫盛公次仲帥南陽卒于官其子章卜葬于漢南貧不能集事造門哀告曰聞公髙義且多山林願得尋常地以為先人宅兆慨然許之曰惟君所擇章既得卜凡葬所須皆仰給焉又館榖其家數百指幾歲而不厭其好義皆此類與從兄髙相敬如賔三世聚居門內百口每食必同席甘苦惟均上下無異財鄊人服之取以為法㝎襄亦嚴明有賢行事皇姑至孝年五十餘抱孫矣猶日親盥饋性無妬忌愛庶孽過于巳出宫傳篤學喜客不屑治生業一切委夫人小大斬斬皆有條理宫傳篤于教子夫人佐之其義方慶善乃鍾于公公幼謹孝有立及長克家力學有功名大志時余公幹鄒公浩皆當世名士相繼教授郡學公往從之勤苦絶人其業日進鄒公尤留心教誘諸生課程其工拙美惡必題數語為品藻公每蒙賞激遂為髙苐舉進士中元符三年丙科授將仕郎延安府法曹參軍宫傳遺之詩有利名埸裏持清謹冠蓋叢中寢是非之戒公敬佩焉丁外艱執喪哀毀過甚跣而尋山以葬足為跰裂服除調慶州司法參軍帥錢公昻髙其才而委任之以進築香柏臺神堂九羊堡應副有勞及該八寶赦恩絫循儒林郎有禁卒五人夜踰甕城劫門者衲衣門者凍以死而復活案具當斬公白帥曰一衲直數百錢且變主不死而殺五人情有可矜錢公曰公欲云何曰此軍人也若送經略司則死生在公特筆耳錢公欣然從之獄官怒曰公𣣔以國法市隂德邪公不為動卒皆活之以久去親闈自陳合入支掌資序罷歸授江陵府觀察推官分曹建掾改為司兵曹事屬二車虛席公攝事歲餘一府仰辦江陵太府諸司皆在爭以事諉公目為府中一俊常平司檄主管其司事時湖北行方田法主于是司前使者去憲攝之又按獄湖南獨僉廳行其事公知其法之弊委曲調護利則伸之害則違之又選擇所差官而授以方略于是方八州而無訟公不自言既去官後使者白其功于上特循承直郎丁㝎襄夫人憂扶護北歸哀感行路服除授開封府扶溝縣建雄鎮權府學博士改奉議郎知金刑漢隂縣在京西極境治所去利路界十餘里梁雍之民錯雜其間公臨以簡易人甚宜之范公致虛以前執政鎮南陽聞其政聲辟知穰縣辭不行終更屢轉朝散郎賜六品服擬通判濟州未赴以建炎元年十月十一日薨于家享年五十有五公為人淳質任真不事表襮遇人以一誠喜稱其善有過則面告戒之退無後言平生恬退不妄干進入仕二十八年在官才十考其除內艱而造朝也盛章為開封尹權勢震赫以皇考舊恩欲報之公公固不附又嘗欲以妻黨張氏女歸公公拒不受積以為怨因不被薦巳而章敗其客皆坐逺謫公獨不汚承祖父之風好施豫不蓄資財居官尤廉潔先世雖􅌋所産至公益貧自漢隂代歸糧食不繼范公宗尹有詩曰丈人古君子清德肖冰玉仕宦三十載一飽猶仰祿驅車向金闕此行何太速家山豈不戀陶令瓶無粟知者以為實録其調濟州通判州有田隸西城所巨閹李彥主其事凶熖熾然人曰公必往見之不然且有禍公曰吾寧不調不能屈于此巳而果見奪其得倅徽州未出都而金人再犯闕公在圍中官索金銀甚急人多匿不肯輸公劫掠之餘囊有數金悉以送官人勸公少留以為歸資公曰國家如此吾尚忍有所隱耶二聖既入虜營集百官于祕書省聮名以立張楚公驚涕而出曰始以為立皇太子若爾吾非所敢知卒不書見者皆為驚悚篤于風義其釋楬也同時鄊貢之士苐與不苐數十人多依公以食貧不能歸者資遣之有風鑒好奬借人物所許豫後多顯逹范公宗尹為布衣時年甫及冠公一見期以逺到奬成之其訓子弟造次必以逺大老猶自力觀書以誘迪之聮案共檠夜分不倦襄國夫人聰明修整好讀書聞古今賢人才士之事業則聳然慕之常舉以勉公且以誨其子先公十七年薨公念其賢誓不再醮初公既葬皇考而不宜其地欲改卜未遑也大資政知荆門軍以紹興癸酉正月十四日奉皇考及公之喪葬于故居之東北一里龜山之原各以其夫人祔五子之深之美之珍皆未仕而卒之望即大資政也今知溫州之彥右承直郎一女適秉義郎歐陽價早卒孫男十人鏞右從事郎銖右宣義郎鐸右迪功郎錞右修職郎欽右承務郎鑄鑰錫鉞鉛未仕孫女六人一適右從事郎錢慶祖一適右通直郎魏欽弼曽孫淙濩自靖康之亂襄漢被禍尤酷獲免者千一往往無噍類獨王氏幾絶而復滋大資政又以儒術文章奮結知明主致身執政為時重臣初宫保贈制曰清塵美行肩于古人重義輕財化貪息訟州閭以無怨公稱之我宋造邦榖城以進士起家自其孫始逮兹萬機流澤燾後信可取必君子曰王氏之有後也宜哉德􅌋者流光天道不可誣也銘曰王氏之先自閩徙杭有唐開元始家于襄至無怨公植德好誼善積名成如漢伏氏宫傳遵之不懈有加慶鍾少保進士起家小試墨曹活人惟死攝官大府政聲有偉匪人不附偽命不汚凛然節義可激懦夫天嗇其年志不克究不在其身以昌厥後果生人傑早蜚大聲模範太學作新諸生勤勞于外治最荆蜀帝曰來歸資尓啓沃進司言責入贊政機密疏輸忠而人不知惟帝知之大藩是卑不令而行德威惟畏帝念老成行將相之先世之褒奚止于斯龜山之原小黃之口紀德豐碑有同峴首杜殿院墓志杜陵先生以詩鳴于唐忠不忘君自比稷卨卒窮以死君子知其必有後先生之子曰宗文宗武宗文之子居蜀之青神號東山翁東山翁生禮僖宗時為諌官禮生詳詳生晏景福中為侍御史公侍御史八世孫也又以諌顯為宋名臣于少陵有光矣公諱莘老字起莘曽祖某祖某父某皆潛德不仕而以儒名家父贈右奉議郎母氏贈恭人公幼不好戲稍長知力學時學者宗臨川禁蘇氏文公獨誦習有識器重之宕渠守石翼以師禮致之遂自眉徙焉家恭之江津苐進士以地逺親老不赴廷對賜同進士出身授梁山軍教授從之遊者益衆秦檜死魏公良臣參大政公疏天下利病上之良臣薦于上主管禮兵部架閣文字明年秋七月有星彗于東方公指陳時政之弊時應詔者衆上命後省擇而苐之以公為首進秩一階制曰言尤鯁亮士榮其褒遷敕令所刪㝎官修書無慮十數至刑部斷例尤盡心有疑則反覆奏請同列服其精當遷太常寺簿尋除博士時虜𣣔敗􅉀疆埸無僃公因輪對言狀且曰勿恃其不來恃吾有以待之上稱善再三曰朕知卿忠由是有用公意顯仁皇后崩自南渡後典秩多失至凶禮尤不知有疑議吏皆拱手公輒引古誼從容裁度大斂前一日宰相遽召赴堂曰有旨問含玉之制公曰禮院故實所不載以周禮典瑞鄭元所注製之其可因立具奏上覽之曰真禮官也虞祭或謂上哀勞欲以宰相行事主議者力甚公曰古今無是比卒正之今上立為建王討論典禮尤備丞祕書面對論江淮守備上曰卿言及此憂國深矣權吏部貟外郎主右選小使臣舊不出闕吏取而鬻之在選數百人無所欣公始命出榜闕以次就注擢監察御史遷殿中侍御史上曰以卿忠直不畏強禦故有此授逆亮將寒􅉀遣使致慢書傳欽宗凶訃請準漢地索大臣上決䇿親征公奏疏贊其決謂虜欺天背􅉀政宜待以不懼因上四事一不限早莫延見大臣侍從謀議國事二申敕侍從臺諌監同守臣速舉可用之才三虜情雖叵測然宜以時遣使示曲在彼四車駕既謀順動而留鑰宜擇重臣此下缺文劉知縣墓志銘永嘉號多士甲于東南劉公全之以重􅌋長者稱德成行尊而年與位不稱斂惠一同有藴莫施君子惜之公諱銓其先閩人避五代亂徙溫之樂清曽祖某祖某咸有潛德父某贈右承事郎劉在邑為著姓世衍于財至承事公易以詩書所交皆一時聞人篤于教子公姿秀整力學能文未冠有雋聲鄊先生仰公文蔚孫公仲鼇師友也每見所業必稱嘆許其逺到叔父奉議祖向授徒于家公與從弟鎮從學以文行為稱首識者謂劉氏有子知必大其門公果與叔父偕薦計臺明年同擢進士苐後六年鎮亦登科鄊人榮之目曰三劉公初調台州臨海尉秩滿丞越之􅌘未及考丁父憂終喪注奉州如皋今改宣教郎知秀州海鹽縣今天子即位覃恩轉奉議郎賜銀緋至官未期年丁母太孺人憂歸葬于鄊會海溢沾濡感疾遂致仕轉承議郎卒年五十六實乾道二年十一月二十二日也公性愷悌為政務循良飾以儒雅不求赫赫譽然所至咸有可觀台城之東數里有泉可釀筒水致諸務歲婁易民病竹木輸公易以石官私便之初公如浙西道繇􅌘遇惡少為儕務奪掠比至嚴下令皆讋伏事有便于民力贊令行之不自以為功􅌘人至今德之如皋土曠少耕者膏腴故壤彌望皆葦茅公躬阡陌喻民力農墾田餘數萬畝流亡復集初之官太孺人以老不行公念切謁告迎侍邑人懼其不來狀于郡及諸司以留公得請于省郆行李即塗老稚駢擁委曲諭之乃得去及聞其還歡然相賀簿攝邑事有誣告強劫者輒逮捕繫獄連坐以十數公至得其情悉縱之按誣者頃之憲臺來詰公不咎攝者或勸直之不從人益義之進士丁時發者嘗客其館公過闕謂友人王某曰丁有美才文不俗必髙第巳而果然海鹽水害稼被檄檢傷放秋苗數萬斛計貧不能輸者猶十一請于朝得旨倚閣春飢勸豪右發廪以濟全活者衆民無資以耕貸于郡給之且欲身任其責境內樂業歲遂有秋學久廢輟圭租二百斛以倡士感而恱爭輸財以助之棟宇一新其務敦教化如此故一時諸公咸稱薦之侍郎劉公岑以先達髙自標置少許可其帥淮也將薦公于朝會罷乃巳公美須髯風度尤不淺自謂平生未嘗知憂與賔客飲必盡􅌚衆方紛然有所譏議公若不能言者喜愠不形人莫得而親踈有忤巳者怡然不與校人有善則稱不容口輕財好義務周人之急解衣指囷色無靳遇人有禮雖至賤貧者見之無慢容尤敦宗好每相過必敕具即事唱酬日以為常工文詞典而有致賦詩句法清徑自成一家字畫端謹如其為人母瞿氏以太后八帙恩封太孺人娶瞿氏再娶汪氏皆贈孺人又娶葉氏封孺人皆先卒男二人儼價儀咸習舉子業女五人長適鄉貢進士林燾次許嫁國學進士賈俁餘幼孫男一人女一人儼等將以四年二月丙申奉公之喪與孺人汪氏葉氏合葬于真如之原求某志其墓某少與公為筆硯交辱知最厚公既筮仕某猶困場屋公遇人必借譽然未嘗自言歲戊辰某下第棄舍選不就遇公于武林同渡浙江語其故公曰子有進身路何乃自棄邪力勉之自越還學卒田舍法進公之力也某赴番昜公餞别于道逮至夔書問不絶且約會老于鄊明年東歸道聞公訃嗚呼痛哉銘曰有美君子溫其如玉醖藉而文琢磨以學施于有政不猛而循愛遺四邑活及萬人婁郝以來世稀長者吾鄊有評公其人也天􅌋其德胡嗇其言志不克究有子以傳真如之原歸從先子陵谷有遷德名不圯令人壙志令人姓賈氏溫州樂清人曽祖某祖奭父如訥皆有隱德王賈同邑且世姻故令人歸于我逮事舅姑以孝稱從其夫某宦遊于越入仕于朝出守饒夔湖泉四州賢而有助初封恭人再封令人乾道四年十二月十日卒于泉之郡舍享年五十五六年九月乙酉葬于左原白岩祔姑令人萬氏之右男二人聞詩聞禮皆國學生孟丙蚤死女二人長嫁國學進士錢萬全次許嫁賈梓男孫二人阿夔阿閩女孫二人國娘晉娘敷文閣直學士左朝奉郎新知台州軍州事王某志梅溪先生後集卷第二十九
