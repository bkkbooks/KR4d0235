body:
  text: 七月三日至鄱陽我来鄱君山水州山水入眼常遟㽞絶境遥通雲錦洞安仁縣有絶境亭雲錦水清音下瞰琵琶洲餘干縣有清音堂琵琶洲于越亭前晚風起湖入鄱陽三百里曉来一雨洗新秋身在江東畫啚裏次韻何憲子應喜雨亢陽誰謂不為灾飢饉連年甑有埃旱魃忽隨冤獄散雨師遥逐使車来平反盡欲歸中典調爕端冝位上台更喜詩如杜陵老江流坐穏興悠哉某至郡而雨何憲詩云人間正作雲霓望天半忽驚霖雨来登綺霞亭用喜雨韻六月西征遇旱灾脩途千里踏塵埃雷公俄喚阿香去霖雨便隨流火来天入滄浪㳺楚越雲翻䆉稏憶温台綺霞亭上一回首滿目湖山壮矣哉追和范文正公鄱陽詩郡齋即事理郡端如理乱絲范公往矣欲誰師典刑猶有堂中像光豔長存壁上詩未報囯恩嗟老去不逢人傑恨生遟一尊坐對鄱江月耿耿忠懐秪自知㳺芝山寺出郭上崔嵬山川亦壮哉三芝誰采去五老欲飛来懐古情無盡思鄉首屡回論文一尊酒天色爲吾開登綺霞亭用碧雲軒韻郡亭臨大澤霞障截塵紛有色秖因日無心元是雲滄浪隨郭轉欵乃隔江聞文正巳仙去佳名千載芬亭乃文正公名降聖莭詣天慶觀因謁顔魯公范文正公祠堂用贈御賜名道士韻顔范遥同異代心琳宫香火道縁深詩家凬味今誰在定訪弥明與共吟觀文正像用贈傳神道士韻天然形貌冩何難難淂靈䑓上筆端朋黨論興三出日不知誰作正人看移竹植郡齋之東用懐慶朔堂韻手移修竹傍墻栽老眼青青為竹開獨坐書亝誰是伴清風時作故人来十月望日同官㑹飯薦福送酒鄱水同僚㧾不群公餘相與共論文逺公蓮社恐無酒輒効江州王使君生日示聞詩聞禮哀哀父母生我劳生日不見徒悲號今年偶然夣三刀二千石向鄱陽叨身雖五馬巳二毛烹羊撃鮮斫蠏螯殷勤為夀劳尔曺碩尔它年著綵𫀆二親無恙年俱髙更与諸孫持夀醪滿堂賔客来英豪㑹看醉瞼如仙桃木藴之即席和文字韻詩酬以二絶少年才氣巳超群埸屋䏻摛錦綉文糠粃在前真有愧春凬淂意豈如君回頭遥念蕩中羣把酒欣論坐上文臭味聊将比兄弟大馮君与小馮君觀郡守題名再書一絶濫與江湖岳牧群於中最慕范希文人才相逺心相似均是憂時與爱君項服善知縣和詩酬以三絶并簡林致一教授膽落庭中㕍䳱群寕容摘紙舞㣲文鄱陽賢令知多少惟有鄱君与項君牧飬功成鲜敗群絃歌声裏出詩文只愁桃李春風近卧轍無由駐令君無錢令尹陶彭澤有道先生鄭廣文預約它年還故里共騎白鹿效文君楽清乃張文君騎白鹿飛仙之地題薦福寺莫莫堂休休有室冝帰早莫莫名堂去恨遟禅老相逢應咲我休休莫莫定何時家有休休室哭馮員仲一代竒男子哀哉􅒛止斯共天終不忍蹈海亦何辝下恵巳三出照鄰俄五悲煩言何足辨公論不容欺身為多才誤朝無一日安寕為獨醒鬼不作附炎宫萝断吳江冷䰟帰蜀道难郡齋揮老淚重取近書看近淂貟仲過江州書陸居士挽詩撫州人有子六人子九齡在太斈槐市訪同舎麟經推阿戎傳家知有子種徳本由公遺訓皆新語多男類陸終佳城在何処楚尾白雲中洪帥陳阜卿寄荀均是蓬山逸逺官萝中猶問竹平安籜龍寄我知君意要使剛腸飽歲寒次韻何子應題不欺室公如憂囯房玄齡我如鄭公思批鱗隆興天下同正觀碩為賢相為良臣我去公来不同日各展忠懐對宣室江湖邂逅論赤心更約聮翩書史筆坤爻敬義誠君子可惜作銘人巳死八十四字騰光芒便是千年不欺史張魏公作銘郡亝對雪平生為雪牽詩興今日無詩柰雪何净几翻書擁炉讀冷亝呵硯帯氷磨寒江獨釣句思栁銀海光揺人憶坡欲兩三杯賀豐歳却憂疆埸正干戈子應和詩再用前韻江東臈雪為誰多清逼官梅興動何堂坐玉芝劳想像州宅有王芝堂句工氷柱老研磨賡酬往事思蓬島辛巳春綰中唱和㝡盛灾異狂言忤諌坡是歳上元雷雪併作某甞論灾異諌坡不恱聽取金華新號令要須白戦不持戈祠顔范二公鄱江善政九賢人文正文忠更絶倫桃李舊邦千里愛丹青遺像兩朝臣不同赤土祠刘阮端勝睢陽廟逺廵安淂神仙返䰟薬九原喚起静邉塵題何子應金華書院啚君不見杜陵野客老更狂浣花溪上結草堂又不見謫仙丗人皆欲殺匡山讀書頭如雪二公同時鳴有唐文章万丈光艶長鈞天無人帝呼去草堂書舘今荒凉太平宰相張居士外甥似旧金華子胸中万卷杜陵翁筆下千篇謫仙李向来衣冠拜偽楚我乃宋臣惟有死何曽着眼癡宰相况肯低顔騘御史天邉卿月落九疑口誦離騷吊湘水誅茅築室小東山天下蒼生望公起種梅志欲調啇鼎持斧夣刀聊爾耳公生長安我東嘉天遣邂逅鄱江涯筆頭一語真戯劇却将鉄面擬金華子應和顔范祠堂詩云鉄面金華誰氏子要湏相与嗣前塵金華自是金閨彦金口褒揚兩朝眷未須帰去金華山行将入侍金華殿閏月三白三首閏月生明後𥘉四日雪作江天未臈時風翻禹門浪花糁月宮枝桂花一秋三放照夜皎珠樹秀庭祥玉枝定知年大有何止麥相冝迎臈雪三白未春花万株神山森玉府天象粲台符詞吐水流峡鼎成凬撃湖鬢邉絲可織四皓盍添吾占盡一陽月分為六出時自𥘉四雪𥘉八又雪二十五又雪韋編照清夜塞管落南枝献中􅍮山玉開成廟柱芝杜詩瑞芝産庙柱註云肃宗時庙柱産三玉芝人間瑞巳定過此却非冝又和項服善三首凬雲頻慘淡草木屡蒼顔詩裏報瓊玖宫中帰玉環楊妃凡三入官帝庭侯帛至佛殿宝珠還更有人清白鄱陽似魯山梅蘃開仍落同雲合未離添為五大老真是四無私天女来成粲氷蚕老𣣔絲梨花一枝雨冷艶可能欺又用時字韻黄竹成章日陽春衆和時玉階談戦陳瓊燕賜花枝陶徑還飛絮啇山欠採芝西疇農事及帰去正吾冝和洪景盧用三白韻作四白詩大似佛世界端如玉烛時穆家兄弟味楊氏于孫枝楊震四丗為公以清白名家鄞海明瑶柱四明出光瑶柱鄱亭望秀芝鄱江有四望亭北望芝山州宅有芝秀閣祁寒繇政拙去倍二誠宜楚士照干乗韓梨夸数株舜門紛執玉堯岳衒分符宝結文房友鑑明狂客湖郊圻正多壘兵㑹憶夷吾兵車之㑹四臈盡日又雪洪復作五白詩再和天地俱同數嘉平欲盡時柳飄彭澤絮松壓大夫枝越絶山飛洩越有瀑布名五洩文登石産芝登州海上五島皆生石芝濫騎為郡馬深碩榖相冝日掩雲間色李嶠詩云間五色滿榆栽天上株芳聮仙桂籍窮送舊桃符逺岫明庐阜澄江接帶湖宣麻開晋囯入蔡憶金吾裴晋公五拜相金吾謂李祐也次韻何子應淂宣城筆金華手握管城子端類睢陽太守鬚鬚筆有神人不識怒時真可氣吞胡聞捷報用何韻淮甸流離唐赤子将軍竒特魏黄鬚碩将銀管書忠誼糞土東京趙与胡不欺室三字參政張公書也筆力勁健如端人正士儼然人望而敬之因成古詩八韻雲山老人囯大老歴代遺編飫探討餘事㳺神翰墨間乗興濡毫快揮掃嚴霜烈日如魯公抉石奔泉陋徐浩囯朝君謨書第一大字劣於行与草雲山心畫无不長筆力縦時書更好我来求字盖求人不為有官縁有道𬗋岩之銘雲山筆不欺室中双至宝玉簫峯下梅花溪碩學雲山帰去早出郊遇雪小隊出郊聊習戦朔風吹雪似催詩皇天有意誅驕虜正類元戎破蔡時何子應以蜀中文房四宝分贈洪景盧王嘉叟某與焉因成一絶江左風流属憲䑓筆端妙語出瓊瑰濫居益友三人列誤辱文房四宝来送翁東叟教授鄱陽江上五見雪鄱江樓上風栗烈廣文先生不畏冷弭棹登樓興清絶筆端妙語出離騷酒後剛腸吐名節芝堂假守老鄉人明日仙舟那忍别三十年間舊友生眼青頭白見交情官於湖北况尤冷詩不江西語自清行李少㽞吳苪囯萝魂先到謝公城扁舟便合相隨去薄有田園正可耕和宝印叔見寄官舎䔥條怯莫冬衰顔淂酒暈生紅遥思蘭若堂中老非柏非松自耐風濫乗五馬二毛侵雪滿鄱江坐擁衾二叔年髙兄弟逺帰期當不待秋砧用韻寄二弟六月離家忽莫冬郡亝清夜擁炉紅細看慶朔堂前雪正似梅花溪上風甚矣今年老見侵玉芝堂冷敝衣衾萝魂夜夜㝷兄弟率飲亭前坐石砧送蔡卒白首論文得蔡侯江東尊酒半年㳺龍頭家世髙千佛驥足声名重一州方喜同僚吳苪囯不堪回首仲宣樓送君撩我思鄉意薄有田園帰去休齒落五十行将四浮生已向殘齒踈方咄柳牙落遽驚韓猶訝年𥘉齓翻疑頰未丹定知從此去梨栗怯堆盤次韻李懐安贈何憲五絶元老登朝首剡章危言凛凛動明光掉頭却向江湖去不肯伊優上北堂伊洛横渠造道深誰傳衣缽見眞心儒宗頼有金華子後學寍憂不嗣音萝魂聞說到无何曽共神官壮者哦妙墨雄文滿天下士衡應亦患才多炙手權門盡好官雲山髙卧老江干相期晚景全名莭冨貴何湏着眼看元白詩筒数往還小生閣筆媿言艱異時應起鄱江念公在金華我㕍山李懐安擁麾入蜀道出鄱江見贈二詩依韻奉酬不肯随群慕鶴軒慨然丹陛吐危言坐看蜀道平如地可見忠臣勇似尊駟馬橋邉駆弩矢杜䳌声裏擁旂旛要湏入境詢凬俗首訪嚴遵李仲元一麾出守楚東城邂逅論交媿孔程元礼仙舟行色好子猷雪棹去心䡖虎符稔服君家丗㕍蕩行逃我姓名酒盞詩篇話時事江湖何日更㝷盟囯娘生日正月二日往歲王司業𥘉生嫡女孫命名聊志喜曰囯不忘㤙日在元正次身居軰行尊囯娘在軰行中為長碩如班与孟賢淑振吾門陳阜卿書云聞詩筒甚盛可使流傳江西否戯用竹萌韻以寄江西大帥本仙官餘事篇章過定安欲遣詩筒寄詩伯恐嫌白俗孟郊寒次何憲韻毛頴神明更好鬚飛騰入月跨蟾蜍誰将銀管為封邑端為金華妙簡書鳯翥龍蟠文未称逸少止以字畫名世日光玉潔字還踈退之自謂不善書何如今代何平叔筆陣詞源㧾莫如金華先生有竒石名碧逺携来自蜀陳洪州以詩覔之金華輟所嗜以贈亦一段竒事也予家㕍蕩群峯錯峙皆几案間物因和二公詩頗起鄉思寓意断章二公心古貌清癯趣在林泉世味踈寸碧来從錦江逺九疑分向錫山居碧逺峯本自九疑山淂之山形聮翩具九疑之狀陳錫山人也山中丘壑奴金谷筆下波瀾陋石渠我有千峯蔵㕍蕩擎天一柱挿空虚天柱峯在㕍蕩最為竒絶嘉叟宗丞淂郡喜成一絶邸報𥘉聞見姓名甘棠家世旧專城伯魚詩礼趋庭処五馬旌旗夾道迎人日雨次何憲韻元正作佳天渉七弄春氣好雨亦知時緑波行何濟新詩如蜀州句有梅柳味七升年定豊一石公當醉子應贈蜀中石刻十卷詩以謝之金華石刻滿西州不惜明珠輒暗投詩泣鬼神追雅頌義深君父妙春秋公有答春秋書深取左氏義深君父随身連軫崔評事挿架懸籖李鄴侯掃室焚香讀終卷光芒万丈照螺洲次韻嘉叟讀和韓詩孔孟乆不作况雄莫䏻和韓公生有唐力欲極頽挫文興八代衰斈捄諸子過佛老蔓中華㣲公祍其左餘事以詩鳴語險鬼膽破汗瀾髙駕天捷敏劇飛笴騎龍歸帝旁玉日人間堕汗流籍湜軰圭璧分半箇柳和詞擬騷郊聮語成些咸知太山仰誰継北窓卧我本虀塩生乆供筆硯課幽香摘天葩光艶拾珠唾後公三百年杖屨无從荷丗无六一翁孰知珍古貨巴詞擬陽春僣竊罪冝坐神交有吾宗渉丗同坎軻斈継青箱玉詩髙碧紗播勉令添和篇才薄知何柰謬同赤効白深媿愈知賀世事置勿論蚊睫蟲容麽元夕次何憲韻火樹銀花遍九衢天移星斗下空虚心憂機婦寒窓士詩句分明似諌書鄱陽灯火類殘星風雨那堪更滿城為郡何如在家好長檠不似短檠明送何憲行部趣其早還九郡飢民望使軺陽春有脚不辝遥更湏速返鄱君囯莫遣詩筒乆寂寥種金沙花戯呈景盧春光駘蕩楚天涯李白桃红次第花未向名園看鉄樹聊於郡圃種金沙郡圃栽花公餘吏隱不相賖杖屨園林賞物華五柳宅邉誰種柳百花樓畔謾栽花郡圃有百花樓池塘有萝吟春草永嘉有萝􅋄堂屏障無心恋綺霞綺霞亭来歳㳺人應話我㕍山深処老桑麻二月朔日同嘉叟藴之訪景盧别墅用郡圃栽花韻即席唱和鄱水芝山四望賖雨餘風物陪光華名園種果仍修果妙手栽花似判花行見晋公開緑野聊從子美酌流霞坐間賔主皆人傑我質如蓬頼倚麻野処名園境界賖夷堅愽物似張華景盧作夷堅志參天先種柳州柳园中新植柳照眼兼看花縣花园与縣圃為鄰即席賦詩𫀆奪錦論文對酒臉生霞自慚衰病陪行楽策杖登城脚欲麻還舎𣸪用前韻以寄負郭園林路不賖杖蔾徐歩賞韶華芹宫地近分㳅水园近日州斈芝嶺風髙送落花园在芝山門范文正芝山詩花落入城東􅉉外梨枝春帶雨梨花堂城頭桃樹晚䒱霞城上皆種桃行看共掌絲綸美寕復丘中詠有麻舎人兄弟皆掌絲綸和詩有醉傍西岡斈種麻景盧嘉叟各和詩五首復用前韻草堂相去不多賖雨後登臨喚革華心喜渊明尊有酒眼驚太白筆生花来看四澤滿時水帰見九光披処霞是早隂雨至晩見日淂兩使君詩十首郡亝傳冩費川麻用韻懐何卿送别鄱江日未賖詩人相問憶金華烏衣巷口見帰燕何如金陵万里橋西思浣花持莭要先蘇赤子攝身未用踏蒼霞何頗喜仙行將歸侍玉皇案不比少陵鞋用麻嘉叟和詩至七篇有何時五畆成帰計来作鄰翁伴藝麻之句某郷心方切復用韻斈継𥘉寮事業賖閉門寕悔讀南華符分㒷化日烘荔室寓維摩天雨花宗丞寓居僧舍故里君應懐北岳帰心我巳到飛霞永嘉有飛霞洞天休休莫莫冝閑処耕有添丁婦織麻梅溪先生後集卷第八梅溪先生文集卷第八詩左原紀異樂清之東地名左原中有古井深数丈時冬旱水枯泉僅盈掬有女子数人提罌而汲綆絶罌堕俄有男子銳然觧衣入井取之既而石䧟声震山谷井深而石重咸謂壓者必虀粉矣越三日事聞于邑尉周公以職事来環井而視惻然嗟悼命役夫具畚鍤抉石取骸将以􅌾焉自旦逮午猶未及尸俄而役者驚相告曰井底有聲其鬼物乎公曰此䧟者不死湏吾以生扵是捐巳資募能出之者衆力争奮頭顱稍露而語可辨矣土石撼動势将復壓救者驚潰公乃整衣焚香叩井而拜命工植板以捍石危而不堕益以緍錢㗖役夫俾蹈死以救公未飯吏以進郤之曰必活人而後食日沒井昏継之以燭用長綆繋衾挽而出而觀者数百人讙呼震動嗟異其事且以手加額曰公真仁人也䏻活人如此某家左原去井所為近獲終日從公于井旁目擊其事作詩一篇以紀之時紹興乙亥仲冬四日也公名邵字嘉成婺州永康人君不見温公年方髫齔時奮然撃甕活小児至今遺事在圖畫活人手段良可竒又不見耿恭昔年困䟽勒孤城鑿井踰千尺整衣一拜精誠通俄頃枯泉飛為液樂清有地名左原地幽井古知㡬年一朝䧟溺誰氏子萬石壓腦沉黄泉路隔幽冥生望絶三宿沉魂豈䏻活鬼神莫救功莫施天遣仁人為之出彩捧来臨驅五丁抉石求屍俄有聲頭顱半露語未辯人疑鬼物相視驚拯溺辛勤功未果土圯石欹紛欲堕争言䧟者不復生救者徒遭頺壓禍梅仙惻然臨井旁焚香再拜祈彼蒼散金募衆蹈死救手植板幹加隄防土石相衘危不倒韲粉餘生僅䏻保湏臾奪命鬼窟中萬口讙呼喜填道翕然輿論咸竒公異事行将逹帝聦感物誠居耿恭上活人手與温公同况公才學俱超絶吏隠那䏻乆淹屈使君前日飛鶚章莅事詳明巳㢘潔鯫生枽梓居此間具書目見非妄傳太史採詩儻見取願付銀筆書青編将見大書特書屡書不止此史筆芬香此其始法燈俊上人恵杜䳌花杜䳌嘉樹状非常乆向緇林壓衆芳春去尚疑啼蜀魄客来還錯認丁香比與諸公同㳺法灯有錯認比花為丁香者髙人好事栽蓮社野叟移根植草堂習氣未除端自笑賞花衘恵意難忘法燈聞上人和杜䳌詩酬以前韻道眼相看頗異常遥遥蓮社有遺芳两篇詩好無𬞞氣四季花然帶佛香杖錫何時離竹徑㝷山莫惜訪槐堂小園花䟽煩題注詩徃花来未可忘孫先覺母夫人正月四日生時年八十丙子􅕴開四筴瑞新春瓦弄幽閨應此辰蛇虺夢中祥女子鳳凰占裏吉佳人平生不負三從義老去兼全五福身他日竒兒亦黄髮捧觴猶得夀慈親明慶懴院上方地爽而幽盖精籃之勝也予因㑹友託迹扵其間一日探囊中得石刻詩一本乃王瞻叔國愽先生題台人秀野堂也摹冩景物頗類扵此因置之壁間意有感觸遂借其韻二月二十五日下惟精舎逺塵繁境静心清事不関案上忘機有黄卷眼中得趣是青山林泉欲共髙僧老事業未容吾軰閑凖擬他年掛冠後飄然杖履白雲間懴院種蘭次寳印叔韻偶向緇林植子芳光風入院泛幽香他時倘免芟鋤患餘馥猶堪供道塲不放凢花染道塲故栽芳友伴友郎一盤喜遇髙人賞却勝家園十八香次濟上人韻老来未厭短檠光又集青衿就故鄉却荷道人䏻具眼不同時軰有他腸心傳潜澗源流别首出新詩意味長我亦筆頭爲佛事未應中國異西方元鳥至昆虫方啓户元鳥亦知辰去自盲風候来逢化日春深條炯雨􅊜廣厦羽毛新故壘尋遺迹雕梁拂舊塵早鶯宜結友秋雁不同賔嘉尓䏻知義無忘舊主人陳希仲贈山茶都勝名花入小園群芳無復敢争妍童童翠盖蔵春色艶艶繁燈照雪天青蘂似開吾軰眼髙標不染俗流錢此花端有歲寒意好賦甘棠蔽芾篇酴醿次賈元節韻春山杜宇喚人帰㱕見酴醿滿架垂葉底半開千顆白鬂邉斜挿一枝竒園林緑樹成隂後亭院青春欲老時把酒對花歌数闋濡毫更和鹿岩詩覔海松贈僧希月海石真冝植海松青青不改四時容道人妙得栽培力乞與書齋待化龍浴佛無雨俗言浴佛天必雨今年浴佛天愈晴招提鍾磬集𣑽侣世尊塵埃思一清紛然膜拜口誦偈舉頭看天紅日明或云天意與佛拗老行者云天與佛打拗不放雨師龍伯行天雖不雨佛亦浴誤此億萬蒼生情廟堂何人職調爕勸天與佛無使争沛然一雨四方足億萬蒼生俱沐浴喜雨用前韻去年春夏人苦雨今年春夏人厭晴水枯秧老農務急霈然膏澤来太清小民易怨亦易喜不知天意常分明何湏頻禱應上公但起夏禹陳五行五風十雨堯舜世自古天意縁人情今兹一雨荷帝力龍神社鬼無妄争南畆有餘人意足蠶已三眠更三浴雨止復用前韻水枯秧老農欲雨麦黄桑緑蠶欲晴一朝大霈滿四澤雲收霧掃天還清曰暘曰雨豈人力聖徳仰荷吾君明廟堂况無癡宰相不怕泥濘妨牛行布榖催耕最知務鳴鳩呼婦殊有情平原出水雲吐日隂陽得所無戦争明日陽光照臨足今日陽烏已先浴孟夏十有一日時雨𥘉霽晨登髙閣極目四望烟銷日出氣象一新復用前韻蝶夣驚囬聴殘雨鳥聲喚起欣𥘉晴𣑽宫烟火帯餘􅊜􅓺舍几席生微清披衣登閣忽四顧頓覺逺目増雙明樵漁欵乃霧中出舟楫蕩漾田間行清和節物滿眼界栁垂暗緑花含情窓明几净日漸永天開地廓隂不争俯視滄浪堪濯足遥看扶桑觀日浴再用前韻勉諸友蠶婦欲晴農欲雨書生事業無雨晴况兹長日足可惜薫風入户精神清虚窓文字遮眼暗短檠燈火通宵明𥿄爲良田力耕穫一㕓稼穡嗤許行太山北斗仰韓子千態萬状窮周情群居涵養務渾厚藩籬剖破銷紛争拭目天衢􅋮驥足下視汙池雀児浴潁師贈榧栽自從児時食火榧思欲移根向鄊里年来花木浪經心品色徒多真戯耳道人贈我方外根不比㝷常桃與李枝柯宛類秦大夫功効端如使君子殷勤栽植同因果衆目紛紛等奴婢他年摘實薦新時杖屦相從蓮社裏月上人以拳石植海松蒔菖陽扵四際蒼姿秀色鍾清氣于几案間以為梅溪之野人贈兼惠詩章因與酬唱凢四首蒼蒼千尺大夫松不似湖嵌植小龍枕水一拳形崒嵂凌雲三幹色尨茸玉衡星化姿兼茂蓮社詩髙席可重乞與書窓端不悪蕭然如對徳人容䖏士何湏種七松䞉栽海上緑髯龍靈根頻灌蒼如王黛色𥘉抽軟似茸蘸水小山形鑿鑿引年昌歜節重重道人兮得歲寒種一洗梅溪憔悴容禅杖西㳺覩萬松歸栽九莭伴蒼龍何湏偃盖蔵龜甲自可延年勝鹿茸賛老房幽看更好晝公詩險和難重為師旦旦加澆濯不遣塵埃上緑容澗毛纎細䕃青松㑹見成仙與化龍孤嶼两峯多臭味孤嶼多海松一莖九莭異香茸羡師得句侵澄觀顧我談經媿叔重明日還家帶滄海園林小小可能容懴院種紅蕉用寳印叔韻新植靈根續蕙蘭緇林佳䖏占清閑深紅應費化工染濃緑疑從帝所頒正色可曽娱俗眼晚英猶足慰衰顔它年觧組帰三徑多種青青滿故山題佛閣三絶佛閣閱人乆儒官渉世踈伽藍真長者容我半年居桒下不三宿閣中經半年青山滿庭户雖好莫留連靈運本狂客偶来蓮社遊鍾魚聽巳厭帰去故園体題郭荘路南山有井名黄花我卜别業臨其涯酌泉欶石思徃事天遺景與名俱嘉東籬採菊隠君子悠然凝望南山賖兹人髙躅巳千古三徑蕪没堪咨嗟我生本抱丘壑尚誤渉塵世争浮蝸十年太學志未遂帰来隴畆躬桒麻草荘新築亦不惡青山逺近光交加㑹湏移住効杜老終賦歸去師陶家新凉入郊九日近西風漸欲吹烏紗龍山風俗有故事撩我清興凌烟霞率飲亭二十絶吾門非北海安得客滿坐有亭名率飲鄰里日相過蒼頭稍知耕赤脚頗䏻醸有田俱種秫我日坐亭上幽亭闊方丈脩竹種千百有時人不来影月為吾客富貴有天命安貧士之常聊為真率飲未用利名忙老去識交情興来懐酒伴山林車馬稀風月壷觴滿文舉客滿坐淵明酒盈尊雖無古髙躅妙意亦常存文字粗䏻飲聖賢時復中林間十二子賔主自清風冨飲不觧文翁意非在酒三盃聊遣興一醉豈縁口我㳺醉鄊中常在軟飽後誰脩醉鄊記添我姓名不吾家数兄弟薄有古人風生計何曽足酒盃無日空右十絶書于左墙以坐上客常滿尊中酒不空為韻我性野而率山林謾求安有酒固可樂無酒亦自寛亭上可率飲林間宜率吟毎扵詩酒裏寓我率然心結交雖不泛絶物亦何曽莫問親踈客過門無不應交㳺聚散中身世浮沉裏觀書悟昨非把酒知今是有酒或無客有客或無酒何時此亭中客酒两常有是非何足論詩酒謾消遣但把無它腸聊為在家善燈火散交㳺園林寄幽興万事付無心随縁不求勝心向靜中求身宜閑䖏著閤巳號便便亭冝名莫莫吾家老兄弟杖屦日相過對酒􅌚無限論詩味更多有口但飲酒無悰亦作詩它年䆠南北還憶在家持右十絶書于右墙以寛心應是酒遣興莫過詩為韻横山連氏妻方奉姑甚謹姑死刻木像事之越十年不怠郡守張公子韶下車命諸邑訪孝義予披牒至其家獲觀木像感嘆不已囙書四十字時紹興丙子七月十四日也純孝世稀有事亡人所難堪嘉里曽子况有婦丁蘭守令方尊禮鄊閭競聳觀名将聞帝闕旌表及門䦨登姚奥嶺望家山有感昔年度兹嶺囬首念慈親如今望雲䖏惟有淚沾巾題驛奥張店思周光宗憶昔同行宿此村重来堪嘆止吾存芙蓉雁蕩重經眼舊亊無人與共論度雁山雁山五經眼兹行尤可觀𥘉冬天氣佳雁歸山未寒有日照幽谷無雲翳層峦入境見祥雲祥雲峯振衣登馬鞍馬鞍嶺瀑水飛玉龍两龍湫羽旗導翔鵉展旗峯翔鵉峯石柱屹天外天柱峯卓筆書雲端卓筆峯靈峯觀石室杖屦穿㠝岏山禽知我来好音若相歡登羅漢洞有禽鳴絶頂声極可愛群峯列春笋丹青状尤難灵峯新創丹青閣行色媿匆匆更約它時看度謝公嶺十年九行役屡經此山中愛山不厭觀毎媿行匆匆大士瞻矩羅騷人思謝公一生㸔不足語如白頭翁臘日與守約同舍賞梅西湖西湖䖏士安在㢤湖山如舊梅花開見花如見䖏士面神清骨冷無纎埃不将時節較早晚凮味自是花中魁暗香和月入佳句壓尽今古無詩才武林深䖏景益勝十里眼界多瓊瑰北枝貪睡南枝醒杖屦得得搀出来旅中兹㳺殊不惡况有佳友銜清杯手折林間一枝雪頭上帯得新春囬同舍再約賞梅用前韻梅溪野人真野㢤老眼長為寒梅開朅来西湖探春色濡毫一洗匈襟埃却将梅花比和靖花與人物俱竒魁同行二十五佳客一一尽是離騷才新詩一出花價長穅秕桃李奴玟瑰湖山已槁䖏士骨風月未厭吾儕来欣聞好亊約重賞凖擬飡玉甞春盃預辦長牋収白雪載取十里清香囬前日探梅李元翁以疾不徃和詩有玉華野人多病惱獨守寒炉煨芋魁句復用前韻約同賞西湖十里真佳㢤百花未放梅先開吾儕好亊頗成癖探春不惮衝風埃李生不岀苦病惱書閱肘後占河魁膽瓶相對数點雪錦腸寫出飄然才人如西湖有涵養句與和靖爭竒瑰重㝷勝㳺有新約湖山凖擬詩仙来寒炉蹲鴟不必煨爲花痛飲拚千盃碩君及早晚理杖屦莫令立馬頭頻囬送王司業元亀守永嘉中興天子𥘉龍翔臨軒䇿士當維揚艰难果見異人出龍虎甲乙俱非常先生大對過晁董指切時務言激昻麟經絶筆二千載収拾帋上生光芒自從曲江到今日勁氣獨得南方強權門用亊手可炙申棖亦减平生剛先生閉門玩爻象簸弄日月潮之陽帝憂南國命共理袁連二政俱循良公道方行正人用詔起韓愈師虞庠先生不作進學觧直言慷慨投封章一麾出守山水郡十行詔墨加恩光東嘉得賢類京兆前政有張今有王前守張子韶張公到官席未煖猶有遺愛如甘棠先生况是儒宗師歛此大恵施一方入境願問民疾苦下車宜誅吏奸賍首延璆孺坐賢榻無使楊墨登門墙河内借恂豈容乆宸衷念賈殊未忘鯫生摳衣恨太晚執經未獲時登堂私心竊喜父母國聖恩特許来龔黄願同何堅首率化歸見頴川鳴鳳凰春日㳺西湖丁丑山色緑如染湖光青似磨峯髙捧日乆波闊浸天多瑞氣浮城闕春光醉綺羅能将比西子妙句有東坡梅溪先生文集卷第八
