body:
  text: 七月三日至鄱陽我來鄱君山水州山水入眼常遲留絶境遙通雲錦洞安仁縣有絶境亭雲錦水清音下瞰琵琶洲餘干縣有清音堂琵琶洲于越亭前晚風起湖入鄱陽三百里曉來一雨洗新秋身在江東畫啚裏次韻何憲子應喜雨亢陽誰謂不為災飢饉連年甑有埃旱魃忽隨冤獄散雨師遙逐使車來平反盡欲歸中典調燮端冝位上台更喜詩如杜陵老江流坐穩興悠哉某至郡而雨何憲詩云人間正作雲霓望天半忽驚霖雨來登綺霞亭用喜雨韻六月西征遇旱災修途千里踏塵埃雷公俄喚阿香去霖雨便隨流火來天入滄浪遊楚越雲翻䆉稏憶溫台綺霞亭上一回首滿目湖山壯矣哉追和范文正公鄱陽詩郡齋即事理郡端如理亂絲范公往矣欲誰師典刑猶有堂中像光豔長存壁上詩未報國恩嗟老去不逢人傑恨生遲一尊坐對鄱江月耿耿忠懷秪自知遊芝山寺出郭上崔嵬山川亦壯哉三芝誰采去五老欲飛來懷古情無盡思鄉首屢回論文一尊酒天色為吾開登綺霞亭用碧雲軒韻郡亭臨大澤霞障截塵紛有色秖因日無心元是雲滄浪隨郭轉欵乃隔江聞文正巳仙去佳名千載芬亭乃文正公名降聖莭詣天慶觀因謁顔魯公范文正公祠堂用贈御賜名道士韻顔范遙同異代心琳宫香火道緣深詩家凬味今誰在定訪彌明與共吟觀文正像用贈傳神道士韻天然形貌寫何難難淂靈臺上筆端朋黨論興三出日不知誰作正人看移竹植郡齋之東用懷慶朔堂韻手移修竹傍墻栽老眼青青為竹開獨坐書亝誰是伴清風時作故人來十月望日同官會飯薦福送酒鄱水同僚㧾不群公餘相與共論文逺公蓮社恐無酒輒效江州王使君生日示聞詩聞禮哀哀父母生我勞生日不見徒悲號今年偶然夢三刀二千石向鄱陽叨身雖五馬巳二毛烹羊擊鮮斫蟹螯殷勤為夀勞爾曺碩爾它年著綵𫀆二親無恙年俱髙更與諸孫持夀醪滿堂賔客來英豪會看醉瞼如仙桃木藴之即席和文字韻詩酬以二絶少年才氣巳超群埸屋能摛錦繡文粳粃在前真有愧春凬淂意豈如君回頭遙念蕩中羣把酒欣論坐上文臭味聊將比兄弟大馮君與小馮君觀郡守題名再書一絶濫與江湖嶽牧群於中最慕范希文人才相逺心相似均是憂時與愛君項服善知縣和詩酬以三絶并簡林致一教授膽落庭中堆鶩群寧容摘紙舞微文鄱陽賢令知多少惟有鄱君與項君牧飬功成鮮敗群絃歌聲裏出詩文只愁桃李春風近卧轍無由駐令君無錢令尹陶彭澤有道先生鄭廣文預約它年還故里共騎白鹿效文君樂清乃張文君騎白鹿飛仙之地題薦福寺莫莫堂休休有室冝歸早莫莫名堂去恨遲禪老相逢應笑我休休莫莫定何時家有休休室哭馮員仲一代竒男子哀哉􅒛止斯共天終不忍蹈海亦何辝下惠巳三出照鄰俄五悲煩言何足辨公論不容欺身為多才誤朝無一日安寧為獨醒鬼不作附炎宫蘿斷吳江冷魂歸蜀道難郡齋揮老淚重取近書看近淂貟仲過江州書陸居士挽詩撫州人有子六人子九齡在太學槐市訪同舍麟經推阿戎傳家知有子種德本由公遺訓皆新語多男類陸終佳城在何處楚尾白雲中洪帥陳阜卿寄荀均是蓬山逸逺官蘿中猶問竹平安籜龍寄我知君意要使剛腸飽歲寒次韻何子應題不欺室公如憂國房玄齡我如鄭公思批鱗隆興天下同正觀碩為賢相為良臣我去公來不同日各展忠懷對宣室江湖邂逅論赤心更約聮翩書史筆坤爻敬義誠君子可惜作銘人巳死八十四字騰光芒便是千年不欺史張魏公作銘郡亝對雪平生為雪牽詩興今日無詩奈雪何淨几翻書擁爐讀冷亝呵硯帶氷磨寒江獨釣句思栁銀海光搖人憶坡欲兩三杯賀豐歲却憂疆埸正干戈子應和詩再用前韻江東臘雪為誰多清逼官梅興動何堂坐玉芝勞想像州宅有王芝堂句工氷柱老研磨賡酬往事思蓬島辛巳春綰中唱和最盛災異狂言忤諌坡是歲上元雷雪併作某嘗論災異諌坡不恱聽取金華新號令要須白戰不持戈祠顔范二公鄱江善政九賢人文正文忠更絶倫桃李舊邦千里愛丹青遺像兩朝臣不同赤土祠劉阮端勝睢陽廟逺巡安淂神仙返魂藥九原喚起靜邉塵題何子應金華書院啚君不見杜陵野客老更狂浣花溪上結草堂又不見謫仙丗人皆欲殺匡山讀書頭如雪二公同時鳴有唐文章万丈光艷長鈞天無人帝呼去草堂書館今荒涼太平宰相張居士外甥似舊金華子胸中万卷杜陵翁筆下千篇謫仙李向來衣冠拜偽楚我乃宋臣惟有死何曽著眼癡宰相况肯低顔驄御史天邉卿月落九疑口誦離騷吊湘水誅茅築室小東山天下蒼生望公起種梅志欲調啇鼎持斧夢刀聊爾耳公生長安我東嘉天遣邂逅鄱江涯筆頭一語真戲劇却將鐵面擬金華子應和顔范祠堂詩云鐵面金華誰氏子要須相與嗣前塵金華自是金閨彥金口褒揚兩朝眷未須歸去金華山行將入侍金華殿閏月三白三首閏月生明後𥘉四日雪作江天未臘時風翻禹門浪花糝月宮枝桂花一秋三放照夜皎珠樹秀庭祥玉枝定知年大有何止麥相冝迎臘雪三白未春花万株神山森玉府天象粲台符詞吐水流峽鼎成凬擊湖鬢邉絲可織四皓盍添吾占盡一陽月分為六出時自𥘉四雪𥘉八又雪二十五又雪韋編照清夜塞管落南枝獻中􅍮山玉開成廟柱芝杜詩瑞芝産廟柱注云肅宗時廟柱産三玉芝人間瑞巳定過此却非冝又和項服善三首凬雲頻慘淡草木屢蒼顔詩裏報瓊玖宫中歸玉環楊妃凡三入官帝庭侯帛至佛殿寶珠還更有人清白鄱陽似魯山梅蘃開仍落同雲合未離添為五大老真是四無私天女來成粲氷蠶老𣣔絲梨花一枝雨冷艷可能欺又用時字韻黃竹成章日陽春衆和時玉階談戰陳瓊燕賜花枝陶徑還飛絮啇山欠採芝西疇農事及歸去正吾冝和洪景盧用三白韻作四白詩大似佛世界端如玉燭時穆家兄弟味楊氏于孫枝楊震四丗為公以清白名家鄞海明瑶柱四明出光瑶柱鄱亭望秀芝鄱江有四望亭北望芝山州宅有芝秀閣祁寒繇政拙去倍二誠宜楚士照干乘韓梨夸數株舜門紛執玉堯嶽衒分符寶結文房友鑑明狂客湖郊圻正多壘兵會憶夷吾兵車之會四臘盡日又雪洪復作五白詩再和天地俱同數嘉平欲盡時柳飄彭澤絮松壓大夫枝越絶山飛泄越有瀑布名五泄文登石産芝登州海上五島皆生石芝濫騎為郡馬深碩榖相冝日掩雲間色李嶠詩云間五色滿榆栽天上株芳聮仙桂籍窮送舊桃符逺岫明廬阜澄江接帶湖宣麻開晉國入蔡憶金吾裴晉公五拜相金吾謂李祐也次韻何子應淂宣城筆金華手握管城子端類睢陽太守鬚鬚筆有神人不識怒時真可氣吞胡聞捷報用何韻淮甸流離唐赤子將軍竒特魏黃鬚碩將銀管書忠誼糞土東京趙與胡不欺室三字參政張公書也筆力徑健如端人正士儼然人望而敬之因成古詩八韻雲山老人國大老歷代遺編飫探討餘事遊神翰墨間乘興濡毫快揮掃嚴霜烈日如魯公抉石奔泉陋徐浩國朝君謨書第一大字劣於行與草雲山心畫無不長筆力縱時書更好我來求字蓋求人不為有官緣有道𬗋岩之銘雲山筆不欺室中雙至寶玉簫峯下梅花溪碩學雲山歸去早出郊遇雪小隊出郊聊習戰朔風吹雪似催詩皇天有意誅驕虜正類元戎破蔡時何子應以蜀中文房四寶分贈洪景盧王嘉叟某與焉因成一絶江左風流屬憲臺筆端妙語出瓊瑰濫居益友三人列誤辱文房四寶來送翁東叟教授鄱陽江上五見雪鄱江樓上風栗烈廣文先生不畏冷弭棹登樓興清絶筆端妙語出離騷酒後剛腸吐名節芝堂假守老鄉人明日仙舟那忍别三十年間舊友生眼青頭白見交情官於湖北况尤冷詩不江西語自清行李少留吳苪國蘿魂先到謝公城扁舟便合相隨去薄有田園正可耕和寶印叔見寄官舍蕭條怯莫冬衰顔淂酒暈生紅遙思蘭若堂中老非柏非松自耐風濫乘五馬二毛侵雪滿鄱江坐擁衾二叔年髙兄弟逺歸期當不待秋砧用韻寄二弟六月離家忽莫冬郡亝清夜擁爐紅細看慶朔堂前雪正似梅花溪上風甚矣今年老見侵玉芝堂冷敝衣衾蘿魂夜夜尋兄弟率飲亭前坐石砧送蔡卒白首論文得蔡侯江東尊酒半年遊龍頭家世髙千佛驥足聲名重一州方喜同僚吳苪國不堪回首仲宣樓送君撩我思鄉意薄有田園歸去休齒落五十行將四浮生已向殘齒踈方咄柳牙落遽驚韓猶訝年𥘉齓翻疑頰未丹定知從此去梨栗怯堆盤次韻李懷安贈何憲五絶元老登朝首剡章危言凛凛動明光掉頭却向江湖去不肯伊優上北堂伊洛橫渠造道深誰傳衣鉢見真心儒宗賴有金華子後學寧憂不嗣音蘿魂聞説到無何曽共神官壯者哦妙墨雄文滿天下士衡應亦患才多炙手權門盡好官雲山髙卧老江干相期晚景全名莭冨貴何須著眼看元白詩筒數往還小生閣筆愧言艱異時應起鄱江念公在金華我堆山李懷安擁麾入蜀道出鄱江見贈二詩依韻奉酬不肯隨群慕鶴軒慨然丹陛吐危言坐看蜀道平如地可見忠臣勇似尊駟馬橋邉驅弩矢杜鵑聲裏擁旗幡要須入境詢凬俗首訪嚴遵李仲元一麾出守楚東城邂逅論交愧孔程元禮仙舟行色好子猷雪棹去心輕虎符稔服君家丗堆蕩行逃我姓名酒盞詩篇話時事江湖何日更尋盟國娘生日正月二日往歲王司業𥘉生嫡女孫命名聊志喜曰國不忘恩日在元正次身居輩行尊國娘在輩行中為長碩如班與孟賢淑振吾門陳阜卿書云聞詩筒甚盛可使流傳江西否戲用竹萌韻以寄江西大帥本仙官餘事篇章過定安欲遣詩筒寄詩伯恐嫌白俗孟郊寒次何憲韻毛頴神明更好鬚飛騰入月跨蟾蜍誰將銀管為封邑端為金華妙簡書鳯翥龍蟠文未稱逸少止以字畫名世日光玉潔字還踈退之自謂不善書何如今代何平叔筆陳詞源㧾莫如金華先生有竒石名碧逺携來自蜀陳洪州以詩覔之金華輟所嗜以贈亦一段竒事也豫家堆蕩群峯錯峙皆几案間物因和二公詩頗起鄉思寓意斷章二公心古貌清癯趣在林泉世味踈寸碧來從錦江逺九疑分向錫山居碧逺峯本自九疑山淂之山形聮翩具九疑之狀陳錫山人也山中丘壑奴金谷筆下波瀾陋石渠我有千峯藏堆蕩擎天一柱插空虛天柱峯在堆蕩最為竒絶嘉叟宗丞淂郡喜成一絶邸報𥘉聞見姓名甘棠家世舊專城伯魚詩禮趨庭處五馬旌旗夾道迎人日雨次何憲韻元正作佳天涉七弄春氣好雨亦知時緑波行何濟新詩如蜀州句有梅柳味七升年定豐一石公當醉子應贈蜀中石刻十卷詩以謝之金華石刻滿西州不惜明珠輒暗投詩泣鬼神追雅頌義深君父妙春秋公有答春秋書深取左氏義深君父隨身連軫崔評事插架懸籖李鄴侯掃室焚香讀終卷光芒万丈照螺洲次韻嘉叟讀和韓詩孔孟久不作况雄莫能和韓公生有唐力欲極頽挫文興八代衰學救諸子過佛老蔓中華微公祍其左餘事以詩鳴語險鬼膽破汗瀾髙駕天捷敏劇飛笴騎龍歸帝旁玉日人間墮汗流籍湜輩圭璧分半箇柳和詞擬騷郊聮語成些咸知太山仰誰繼北窗卧我本虀鹽生久供筆硯課幽香摘天葩光艷拾珠唾後公三百年杖屨無從荷丗無六一翁孰知珍古貨巴詞擬陽春僣竊罪冝坐神交有吾宗涉丗同坎軻學繼青箱玉詩髙碧紗播勉令添和篇才薄知何奈謬同赤效白深愧愈知賀世事置勿論蚊睫蟲容麼元夕次何憲韻火樹銀花遍九衢天移星斗下空虛心憂機婦寒窗士詩句分明似諌書鄱陽燈火類殘星風雨那堪更滿城為郡何如在家好長檠不似短檠明送何憲行部趣其早還九郡飢民望使軺陽春有腳不辝遙更須速返鄱君國莫遣詩筒久寂寥種金沙花戲呈景盧春光駘蕩楚天涯李白桃紅次第花未向名園看鐵樹聊於郡圃種金沙郡圃栽花公餘吏隱不相賖杖屨園林賞物華五柳宅邉誰種柳百花樓畔謾栽花郡圃有百花樓池塘有蘿吟春草永嘉有蘿􅋄堂屏障無心戀綺霞綺霞亭來歲遊人應話我堆山深處老桑麻二月朔日同嘉叟藴之訪景盧别墅用郡圃栽花韻即席唱和鄱水芝山四望賖雨餘風物陪光華名園種果仍修果妙手栽花似判花行見晉公開緑野聊從子美酌流霞坐間賔主皆人傑我質如蓬賴倚麻野處名園境界賖夷堅博物似張華景盧作夷堅志參天先種柳州柳園中新植柳照眼兼看花縣花園與縣圃為鄰即席賦詩𫀆奪錦論文對酒臉生霞自慚衰病陪行樂策杖登城腳欲麻還舍𣸪用前韻以寄負郭園林路不賖杖藜徐步賞韶華芹宫地近分㳅水園近日州學芝嶺風髙送落花園在芝山門范文正芝山詩花落入城東􅉉外梨枝春帶雨梨花堂城頭桃樹晚蒸霞城上皆種桃行看共掌絲綸美寧復丘中詠有麻舍人兄弟皆掌絲綸和詩有醉傍西岡學種麻景盧嘉叟各和詩五首復用前韻草堂相去不多賖雨後登臨喚革華心喜淵明尊有酒眼驚太白筆生花來看四澤滿時水歸見九光披處霞是早隂雨至晚見日淂兩使君詩十首郡亝傳寫費川麻用韻懷何卿送别鄱江日未賖詩人相問憶金華烏衣巷口見歸燕何如金陵万里橋西思浣花持莭要先蘇赤子攝身未用踏蒼霞何頗喜仙行將歸侍玉皇案不比少陵鞋用麻嘉叟和詩至七篇有何時五畝成歸計來作鄰翁伴藝麻之句某鄉心方切復用韻學繼𥘉寮事業賖閉門寧悔讀南華符分興化日烘荔室寓維摩天雨花宗丞寓居僧舍故里君應懷北嶽歸心我巳到飛霞永嘉有飛霞洞天休休莫莫冝間處耕有添丁婦織麻梅溪先生後集卷第八梅溪先生文集卷第八詩左原紀異樂清之東地名左原中有古井深數丈時冬旱水枯泉僅盈掬有女子數人提罌而汲綆絶罌墮俄有男子鋭然解衣入井取之既而石陷聲震山谷井深而石重咸謂壓者必虀粉矣越三日事聞于邑尉周公以職事來環井而視惻然嗟悼命役夫具畚鍤抉石取骸將以􅌾焉自旦逮午猶未及尸俄而役者驚相告曰井底有聲其鬼物乎公曰此陷者不死須吾以生于是捐巳資募能出之者衆力爭奮頭顱稍露而語可辨矣土石撼動勢將復壓救者驚潰公乃整衣焚香叩井而拜命工植板以捍石危而不墮益以緍錢啖役夫俾蹈死以救公未飯吏以進郤之曰必活人而後食日沒井昏繼之以燭用長綆繫衾挽而出而觀者數百人歡呼震動嗟異其事且以手加額曰公真仁人也能活人如此某家左原去井所為近獲終日從公于井旁目擊其事作詩一篇以紀之時紹興乙亥仲冬四日也公名邵字嘉成婺州永康人君不見溫公年方髫齔時奮然擊甕活小兒至今遺事在圖畫活人手段良可竒又不見耿恭昔年困疏勒孤城鑿井踰千尺整衣一拜精誠通俄頃枯泉飛為液樂清有地名左原地幽井古知幾年一朝陷溺誰氏子萬石壓腦沉黃泉路隔幽冥生望絶三宿沉魂豈能活鬼神莫救功莫施天遣仁人為之出彩捧來臨驅五丁抉石求尸俄有聲頭顱半露語未辨人疑鬼物相視驚拯溺辛勤功未果土圯石欹紛欲墮爭言陷者不復生救者徒遭頺壓禍梅仙惻然臨井旁焚香再拜祈彼蒼散金募衆蹈死救手植板幹加隄防土石相銜危不倒韲粉餘生僅能保須臾奪命鬼窟中萬口歡呼喜填道翕然輿論咸竒公異事行將逹帝聰感物誠居耿恭上活人手與溫公同况公才學俱超絶吏隱那能久淹屈使君前日飛鶚章蒞事詳明巳廉潔鯫生枽梓居此間具書目見非妄傳太史採詩儻見取願付銀筆書青編將見大書特書屢書不止此史筆芬香此其始法燈俊上人惠杜鵑花杜鵑嘉樹狀非常久向緇林壓衆芳春去尚疑啼蜀魄客來還錯認丁香比與諸公同遊法燈有錯認比花為丁香者髙人好事栽蓮社野叟移根植草堂習氣未除端自笑賞花銜惠意難忘法燈聞上人和杜鵑詩酬以前韻道眼相看頗異常遙遙蓮社有遺芳兩篇詩好無𬞞氣四季花然帶佛香杖錫何時離竹徑尋山莫惜訪槐堂小園花疏煩題注詩往花來未可忘孫先覺母夫人正月四日生時年八十丙子􅕴開四策瑞新春瓦弄幽閨應此辰蛇虺夢中祥女子鳳凰占裏吉佳人平生不負三從義老去兼全五福身他日竒兒亦黃髮捧觴猶得夀慈親明慶懴院上方地爽而幽蓋精籃之勝也豫因會友託迹于其間一日探囊中得石刻詩一本乃王瞻叔國博先生題台人秀野堂也摹寫景物頗類于此因置之壁間意有感觸遂借其韻二月二十五日下惟精舍逺塵繁境靜心清事不關案上忘機有黃卷眼中得趣是青山林泉欲共髙僧老事業未容吾輩間凖擬他年挂冠後飄然杖履白雲間懴院種蘭次寶印叔韻偶向緇林植子芳光風入院泛幽香他時倘免芟鋤患餘馥猶堪供道場不放凡花染道場故栽芳友伴友郎一盤喜遇髙人賞却勝家園十八香次濟上人韻老來未厭短檠光又集青襟就故鄉却荷道人能具眼不同時輩有他腸心傳潛澗源流别首出新詩意味長我亦筆頭為佛事未應中國異西方元鳥至昆蟲方啓户元鳥亦知辰去自盲風候來逢化日春深條炯雨􅊜廣厦羽毛新故壘尋遺迹雕梁拂舊塵早鶯宜結友秋雁不同賔嘉尓能知義無忘舊主人陳希仲贈山茶都勝名花入小園群芳無復敢爭妍童童翠蓋藏春色艷艷繁燈照雪天青蘂似開吾輩眼髙標不染俗流錢此花端有歲寒意好賦甘棠蔽芾篇酴醿次賈元節韻春山杜宇喚人歸歸見酴醿滿架垂葉底半開千顆白鬢邉斜插一枝竒園林緑樹成隂後亭院青春欲老時把酒對花歌數闋濡毫更和鹿岩詩覔海松贈僧希月海石真冝植海松青青不改四時容道人妙得栽培力乞與書齋待化龍浴佛無雨俗言浴佛天必雨今年浴佛天愈晴招提鍾磬集𣑽侣世尊塵埃思一清紛然膜拜口誦偈舉頭看天紅日明或云天意與佛拗老行者云天與佛打拗不放雨師龍伯行天雖不雨佛亦浴誤此億萬蒼生情廟堂何人職調燮勸天與佛無使爭沛然一雨四方足億萬蒼生俱沐浴喜雨用前韻去年春夏人苦雨今年春夏人厭晴水枯秧老農務急霈然膏澤來太清小民易怨亦易喜不知天意常分明何須頻禱應上公但起夏禹陳五行五風十雨堯舜世自古天意緣人情今兹一雨荷帝力龍神社鬼無妄爭南畝有餘人意足蠶已三眠更三浴雨止復用前韻水枯秧老農欲雨麥黃桑緑蠶欲晴一朝大霈滿四澤雲收霧掃天還清曰暘曰雨豈人力聖德仰荷吾君明廟堂况無癡宰相不怕泥濘妨牛行布榖催耕最知務鳴鳩呼婦殊有情平原出水雲吐日隂陽得所無戰爭明日陽光照臨足今日陽烏已先浴孟夏十有一日時雨𥘉霽晨登髙閣極目四望煙銷日出氣象一新復用前韻蝶夢驚回聽殘雨鳥聲喚起欣𥘉晴𣑽宫煙火帶餘􅊜􅓺舍几席生微清披衣登閣忽四顧頓覺逺目增雙明樵漁欵乃霧中出舟楫蕩漾田間行清和節物滿眼界栁垂暗緑花含情窗明几淨日漸永天開地廓隂不爭俯視滄浪堪濯足遙看扶桑觀日浴再用前韻勉諸友蠶婦欲晴農欲雨書生事業無雨晴况兹長日足可惜薰風入户精神清虛窗文字遮眼暗短檠燈火通宵明𥿄為良田力耕穫一㕓稼穡嗤許行太山北斗仰韓子千態萬狀窮周情群居涵養務渾厚藩籬剖破銷紛爭拭目天衢􅋮驥足下視汙池雀兒浴潁師贈棐栽自從兒時食火棐思欲移根向鄊里年來花木浪經心品色徒多真戲耳道人贈我方外根不比尋常桃與李枝柯宛類秦大夫功效端如使君子殷勤栽植同因果衆目紛紛等奴婢他年摘實薦新時杖屨相從蓮社裏月上人以拳石植海松蒔菖陽于四際蒼姿秀色鍾清氣于几案間以為梅溪之野人贈兼惠詩章因與酬唱凡四首蒼蒼千尺大夫松不似湖嵌植小龍枕水一拳形崒嵂凌雲三幹色尨茸玉衡星化姿兼茂蓮社詩髙席可重乞與書窗端不惡蕭然如對德人容處士何須種七松賸栽海上緑髯龍靈根頻灌蒼如王黛色𥘉抽軟似茸蘸水小山形鑿鑿引年昌歜節重重道人兮得歲寒種一洗梅溪憔悴容禪杖西遊覩萬松歸栽九莭伴蒼龍何須偃蓋藏龜甲自可延年勝鹿茸贊老房幽看更好晝公詩險和難重為師旦旦加澆濯不遣塵埃上緑容澗毛纎細蔭青松會見成仙與化龍孤嶼兩峯多臭味孤嶼多海松一莖九莭異香茸羡師得句侵澄觀顧我談經愧叔重明日還家帶滄海園林小小可能容懴院種紅蕉用寶印叔韻新植靈根續蕙蘭緇林佳處占清間深紅應費化工染濃緑疑從帝所頒正色可曽娛俗眼晚英猶足慰衰顔它年解組歸三徑多種青青滿故山題佛閣三絶佛閣閲人久儒官涉世踈伽藍真長者容我半年居桑下不三宿閣中經半年青山滿庭户雖好莫留連靈運本狂客偶來蓮社遊鍾魚聽巳厭歸去故園體題郭莊路南山有井名黃花我卜别業臨其涯酌泉欶石思往事天遺景與名俱嘉東籬採菊隱君子悠然凝望南山賖兹人髙躅巳千古三徑蕪沒堪咨嗟我生本抱丘壑尚誤涉塵世爭浮蝸十年太學志未遂歸來隴畝躬桑麻草莊新築亦不惡青山逺近光交加會須移住效杜老終賦歸去師陶家新涼入郊九日近西風漸欲吹烏紗龍山風俗有故事撩我清興凌煙霞率飲亭二十絶吾門非北海安得客滿坐有亭名率飲鄰里日相過蒼頭稍知耕赤腳頗能釀有田俱種秫我日坐亭上幽亭闊方丈修竹種千百有時人不來影月為吾客富貴有天命安貧士之常聊為真率飲未用利名忙老去識交情興來懷酒伴山林車馬稀風月壷觴滿文舉客滿坐淵明酒盈尊雖無古髙躅妙意亦常存文字粗能飲聖賢時復中林間十二子賔主自清風冨飲不解文翁意非在酒三杯聊遣興一醉豈緣口我遊醉鄊中常在軟飽後誰修醉鄊記添我姓名不吾家數兄弟薄有古人風生計何曽足酒杯無日空右十絶書于左墻以坐上客常滿尊中酒不空為韻我性野而率山林謾求安有酒固可樂無酒亦自寬亭上可率飲林間宜率吟每于詩酒裏寓我率然心結交雖不泛絶物亦何曽莫問親踈客過門無不應交遊聚散中身世浮沉裏觀書悟昨非把酒知今是有酒或無客有客或無酒何時此亭中客酒兩常有是非何足論詩酒謾消遣但把無它腸聊為在家善燈火散交遊園林寄幽興万事付無心隨緣不求勝心向靜中求身宜間處著閣巳號便便亭冝名莫莫吾家老兄弟杖屨日相過對酒􅌚無限論詩味更多有口但飲酒無悰亦作詩它年宦南北還憶在家持右十絶書于右墻以寬心應是酒遣興莫過詩為韻橫山連氏妻方奉姑甚謹姑死刻木像事之越十年不怠郡守張公子韶下車命諸邑訪孝義豫披牒至其家獲觀木像感嘆不已因書四十字時紹興丙子七月十四日也純孝世稀有事亡人所難堪嘉里曽子况有婦丁蘭守令方尊禮鄊閭競聳觀名將聞帝闕旌表及門闌登姚奧嶺望家山有感昔年度兹嶺回首念慈親如今望雲處惟有淚沾巾題驛奧張店思周光宗憶昔同行宿此村重來堪嘆止吾存芙蓉雁蕩重經眼舊事無人與共論度雁山雁山五經眼兹行尤可觀𥘉冬天氣佳雁歸山未寒有日照幽谷無雲翳層巒入境見祥雲祥雲峯振衣登馬鞍馬鞍嶺瀑水飛玉龍兩龍湫羽旗導翔鵉展旗峯翔鵉峯石柱屹天外天柱峯卓筆書雲端卓筆峯靈峯觀石室杖屨穿巑岏山禽知我來好音若相歡登羅漢洞有禽鳴絶頂聲極可愛群峯列春笋丹青狀尤難靈峯新創丹青閣行色愧匆匆更約它時看度謝公嶺十年九行役屢經此山中愛山不厭觀每愧行匆匆大士瞻矩羅騷人思謝公一生看不足語如白頭翁臘日與守約同舍賞梅西湖西湖處士安在哉湖山如舊梅花開見花如見處士面神清骨冷無纎埃不將時節較早晚凮味自是花中魁暗香和月入佳句壓盡今古無詩才武林深處景益勝十里眼界多瓊瑰北枝貪睡南枝醒杖屨得得攙出來旅中兹遊殊不惡况有佳友銜清杯手折林間一枝雪頭上帶得新春回同舍再約賞梅用前韻梅溪野人真野哉老眼長為寒梅開朅來西湖探春色濡毫一洗胸襟埃却將梅花比和靖花與人物俱竒魁同行二十五佳客一一盡是離騷才新詩一出花價長粳秕桃李奴玫瑰湖山已稿處士骨風月未厭吾儕來欣聞好事約重賞凖擬餐玉嘗春杯預辦長箋收白雪載取十里清香回前日探梅李元翁以疾不往和詩有玉華野人多病惱獨守寒爐煨芋魁句復用前韻約同賞西湖十里真佳哉百花未放梅先開吾儕好事頗成癖探春不憚衝風埃李生不出苦病惱書閲肘後占河魁膽瓶相對數點雪錦腸寫出飄然才人如西湖有涵養句與和靖爭竒瑰重尋勝遊有新約湖山凖擬詩仙來寒爐蹲鴟不必煨為花痛飲拚千杯碩君及早晚理杖屨莫令立馬頭頻回送王司業元龜守永嘉中興天子𥘉龍翔臨軒䇿士當維揚艱難果見異人出龍虎甲乙俱非常先生大對過朝董指切時務言激昻麟經絶筆二千載收拾紙上生光芒自從曲江到今日徑氣獨得南方強權門用事手可炙申棖亦減平生剛先生閉門玩爻象簸弄日月潮之陽帝憂南國命共理袁連二政俱循良公道方行正人用詔起韓愈師虞庠先生不作進學解直言慷慨投封章一麾出守山水郡十行詔墨加恩光東嘉得賢類京兆前政有張今有王前守張子韶張公到官席未暖猶有遺愛如甘棠先生况是儒宗師斂此大惠施一方入境願問民疾苦下車宜誅吏姦贓首延璆孺坐賢榻無使楊墨登門墻河內借恂豈容久宸衷念賈殊未忘鯫生摳衣恨太晚執經未獲時登堂私心竊喜父母國聖恩特許來龔黃願同何堅首率化歸見頴川鳴鳳凰春日遊西湖丁丑山色緑如染湖光青似磨峯髙捧日久波闊浸天多瑞氣浮城闕春光醉綺羅能將比西子妙句有東坡梅溪先生文集卷第八
