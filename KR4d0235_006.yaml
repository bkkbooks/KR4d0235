  text: 梅溪先生後集卷第六
  hash: sha256:76380472fc164ea301cd898450ba0d550a2958cef4f377393bdb982fffd21b79
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_006-1a}
body:
  text: 詩次韵昌齡至樂齋讀書端慕顔回樂真同陋巷居息心容膝地得趣滿牀書檠短燈宵永窓明日晷舒相看有脩竹心為主人虗寳印叔示詩且索碑刻以南明山六大字為献紫芝岩隐岳岩仍次韵不才詎可登䑓省早問君王覔閑冷聊㝷商嶺綺与園未羡雲䑓冦并耿掛碑滿屋寕療飢来詩云滿屋掛碑光耿耿嗜好與叔真相宜試寄南明六大字想像年少西游時寳印叔辯上人各贈瑞香花小小園林意自憐全用刘汝一書送行詩一句名花十八擬唐賢瑞香一種来潜澗學士新添两少年曺夣良自許峯来訪留山間數日賦詩数十章復出四絶見贈次韵徑荒猶有淵明菊嚢澁寕求季子金老矣此身何處著入山惟恐未能深謾有忠懷徒耿耿恨無長䇿捄元元張儀舌在知何用莫莫休休且勿言平生風義慕相如筆硯從游二絶餘直許交情定金石肯同餘耳但光𥘉與君連夕燈前語勝讀千年窓下書八斗文章千里足未應低首掾桐廬先人舊題東山墓亭三絶入堂無復見雙親建此字元犯御名故昜之此来寕似在神天地深恩難以報含悲唯有淚霑巾門枕青山户傍谿青山流水助悽悽双親旣逺神何在對此追思獨怨啼新築茅廬澗􅊤圍山光水色共依依野人不為閑中趣誰㑹朝来與暮歸某辛巳秌帰自武林省先隴遂修亭宇濬溪流因思先人舊詩巳随屋璧壞矣尚能記憶遂追和殘生無計可榮親一見松楸一損神惟有青山知此意晨昏長戴白雲巾先隴在家之東山山最髙白雲常抹其頂重葺山亭濬舊溪杖藜来徃獨悲悽追思四十年間事風為哀號鳥為啼丘木森森巳十圍滿林清䕃可捿依毎憂樵牧傷松柏游宦三年两度帰送萬先之赴清湘教官早歲声名滿上庠青衫今始赴淸湘得官巳晩豈宜冷行路正難那更長平昔心期良不淺異時官業可能量鵬程九萬從今日行見飛飛到帝旁送曺夣良赴桐廬户掾年少論交老愈堅交情尽在和韓萹短檠業共賢関舎淡墨名同桂籍年筮仕暫為三語掾摛詞行踐八花塼許峯佳䜟亦聊耳何止蓬萊山上仙瑞安有許峯㘭断秘丞帰之䜟鷄黍相㝷豈偶然論文尊酒荷留連秋風初送雁群至喬木喜聞鶯友迁勸我鑑湖行甚力送君釣瀬去無縁頭将清白師韓范從此高堂有四賢需次家鄉五載遟便便腹笥愈添圍才如子建豈論斗性類西門能佩韋車馬戒塗君欲去田園迷徑我初帰男兒所尚惟名莭莫墮人間富貴機十月朔日偶書去年此日對清光聖徳能容一介狂言畧施行非不遇身雖踈外亦何妨剪拂花木戯成二絶洒掃衡茅端欲老剪裁花木自為春權門炙手非吾事秪合丘園作散人蔓􅋄芟夷莫許侵好花封植待成隂毎於小小園林裏長抱惓惓甽畒心小小園十月杜䳌花盛開有共蔕双頭之異因以数語記之一声杜宇啼春風明朝緋掛千山叢歲寒此色豈昜得那更朶朶双頭紅共蔕聮芳友于愛一吐一含分次第造物私我小園林此花大勝金腰帶牡丹中有名金腰帶者題月師桂堂道人以月名身以桂名堂胷中負所有志在丹霄旁冠巾倘可加唾手得天香惜㢤已世外此志終莫償山中作堂侔月窟禅定吟餘思清越要令坐上生清風湏使心中似明月十一月二日自金谿訪錢用章于白石覧山川景物之竒以東道之姓為韵朝離文君故宅邉莫㝷謝守舊行田黄羊先示神仙迹湖上奥有黄羊岩白石俄開洞府天两派峥鳴玉澗一声欵乃釣魚舡王孫占得湖山勝明月清風不計錢同錢用明用章游白石岩謝公好山水得郡古東甌造物惜佳境雅志多不酬松蘿蔽雁蕩烟靄埋龍湫行田徑白石不到仙山頭寥寥数百年天付黄冠流巍然萬仞崖璧立東南州誰将𥙷天手化出白玉楼两龕蔵洞府中有群仙游上通赤五天下接三神洲飛泉落岩腰碧澗鳴山陬群峯真培塿滄海為渠溝隘視人間世萬象同蜉蝣我家雁山陽﨑嶇厭經丘翩翩錢公子呼我㝷岩幽𥘉驚小雨宻忽掃群隂浮杖屨窮㠝岏一洗塵埃眸山林有真樂富貴何足求但願乞二山不願萬户侯二山白石雁蕩又書岩上十里湖山翠黛横两溪寒玉闘琮琤路從飛鳥上頭過人在白雲高䖏行岩下行田謝康樂洞中辟榖李先生凭欄不瞰人間世轉覺此心名利䡖屑玉泉白石岩腰屑玉泉佳名初自長官傳渾疑齒頰氷霜論終日霏霏落半天周開祖名是泉曰屑玉東坡有贈周詩云詩成錦綉開腸胃論極氷霜繞齒牙李少和像少和辛苦學飛仙遺像今猶在洞天都似先生䏻辟榖何湏太守爲行田游東際白石三峯下懸崖七際流穿雲來汨汨朝海去悠悠石是誰家婦有两石峭立俗呼石新婦龍居第㡬湫俗云舊有龍平生不行險到此即回頭上有六際畏險不登次韵寳印叔觀海三絶載地浮天浩莫窮氣營楼閣聳虚空道人妙得觀瀾術萬里滄溟碧眼中榴屿何年改玉環木榴屿一名木橊屿俗傳避錢玉諱故改名王環望中猶是舊青山遺民不記當時事惟有湖声日徃還誤入蓬萊朝未央至今魂夣記㣲茫扁舟欲効鴟夷子遥望滄波興已狂李鎮夫闢圃築堂効孟氏之飬吾表兄杖屨其間得日渉之趣其来游名堂曰雙植因書三絶不到君家㡬換春眼中風物一畨新吾園小小知何用不似兹園可飬親琴書得趣有真樂軒冕倘来何足干種徳種花兼着力要湏留與子孫看繞堂花木随宜種堆案文書取次翻我待衣冠掛林下杖藜時復到君園劉長方自豫章寄書稱砮焦蠣房之羙恨未知味書一絶以寄之珠嶼小蠣圎帶石砮焦巨房深若盃吾鄉此味亦不惡故人游宦盍帰来砮焦在沙角海中本日奴焦予易之曰砮珠屿在大芙蓉小蠣絶佳寳印叔得小假山以長萹模寫進士欽逢辰和之某次韵并簡欽越絶天台温雁蕩萬􅊤千岩各形狀錢塘風物更竒絶杖屨年時記曽訪帰来戯闢小園林十里西湖蔵甕盎予甞以甕植蓮有詞云一盤池地十里西湖是悠然入眼皆吾山羅列軒窓一何壮止菴道人真有道種竹蒔花近丘壙何人好事贈假山潜澗新添小屏嶂却疑遷徙從平泉更恐飛来自秦望秦望有飛来山飛来石世間贗物何止此沙佛儒衣龍亦象道人於物意豈留異日從教散天壌花木篇章两游戯林下高風真可尚来游蓮社有詩人句比昌黎更豪放我休說假復論真真假通同帰一相次韵昌齡西園十詠黄楊予帰自武林黄楊梢枯命工去藤蔓台蘚復有生意黄楊庚甲與吾同樹已蕭踈我亦翁藤蔓稍除苔蘚去歲寒猶觧傲霜風莆萄滿架龍鬚卷復伸堆盤馬乳醸青春潑陪一斗宜延客莫慱凉州學漢人脩竹至樂齋西碧玉竿清隂時過酒杯寒明年看長纎纎筍觧籜當為漢帝冠梅拂雲脩竹遶吾家竹裏仍栽第一花好句更同林處士月黄昏後影横斜桃欲留王毋盤中核兼採秦人洞裏薪此事渺茫花笑我不如聊賞故園春李長念詩人詠子嗟圑欒繞樹日欹斜氷盤行薦炎天實不用東門學種瓜杉記得先人手自栽森然千尺盡成材翠絲結作思人樹它日兒孫豈忍摧桂丹霄休歎路難通學取燕山種桂叢異日天香滿亭院吾廬當似廣寒宫桞何幸先人有弊廬不妨同種桞千株埀隂覆地寕無日作雪漫天肯似榆菊百花春放菊秋榮霜裏鮮鮮照眼明歲晩不妨開自好何湏三嗅泣繁英題如存亭壁十二月五日同二弟省墳不見慈親已一星佳城松柏慘然青此生難報劬勞徳空對銘碑涕泗零年来游宦逺松楸越雪吴霜帶滿頭乞得祠宫飬衰病白岩香火共僧修劉義夫欲與先隴植蘭寄数根思親何忍陟南陔采得幽蘭秪自哀寄與東山劉孝子佳城側畔好親栽義夫許贈丁香蠟梅劉郎不獨種桃花蠟蘂柔香更可嘉臭味相同林下友從今花木亦通家予植十八香丁香曰柔香取杜詩丁香体柔弱義夫以趙清献諌垣集易桞文次其韵文集何湏較少多有無相易共漸磨憲䑓清献桞州桞唐宋人才未易過雁山僧景暹求文記本覺殿歸来欲効老夫潜喜見游方舊杜暹本覺殿成功徳滿媿無筆力助荘嚴又六言筆下何曽有口嚢中更媿無錢聊把一言讃嘆助成此叚因縁書不欺室室明室暗两何疑方寸長存不可欺勿謂天高鬼神逺要湏先畏自家知人日有雪竹間種蘭人日又飛雪去年人日臨安大雪竹林仍種蘭舊甞於竹間種蘭陽浮屑瓊乆風泛馥檀栾花點黄金勝叢依碧玉竿世間桃李眼肯向此中看張思豫主簿送丹桂蠟梅通家天上張公子桂種遥分月窟香三徑慇懃自栽植異時㑹見五枝芳蓮幕何人送此花不容一蘂汚貧家帰来自覔清河種馨徳如人最可嘉予在越幕有送蠟梅者卻之同僚有蓮幕風清不受梅句余全之贈菊栽十二品并示三十絶走筆二絶酧之老覺山林興味長帰来三徑嘆荒凉分君嘉菊二十品増我東園十八香余郎蕭洒似何郎事業它年未易量寄我新詩三十絶筆頭直與菊争芳二月二日焚黄天色開霽賓游並集存沒有光悲痛之餘因成鄙語三釡深悲不逮親九天命下賁雙墳痛将淚雜香醪奠忍見衣随告墨焚漠漠濃隂初閣雨暉暉煖日旋披雲餘生難報劬勞徳猶有孤忠可報君送陳元佐游剡杖屨昔游剡夣魂猶至今欣聞戒行李遥訪舊同襟斆學功相半淵源力可㝷池中神鯉足時為寄鄉音雙桂先人於井之两旁植雙桂不知其㡬年矣木隂茂盛香聞逺近某偶得一石立為墻角書雙桂二字以識之因成小詩以懷遺徳并示子弟壬午閏月十六日先人植雙桂馨徳滿吾廬不老兒孫長聮芳合似渠東籬我豈􅒑彭澤兹籬偶在東悠然見山處仍向菊花叢左原詩三十二首并序樂清之東三十有五里群山環繞地名左原以其居邑之左也中有左嶺左湖左口皆以左名之予七世祖自杭徙温家于是原地雖荒僻有山水足以自娱予丐祠得請日與兄弟隣里有杖屨登臨之適原中景物可資賦詠者各識以詩凢三十二首壬午三月東高山左原有四高山在乙辛丁癸之位術者目為四貴人東山最高上有五峯其一曰宋家尖也峯頭日出已停午山半雲横疑在天要使名如越山重直湏人似謝公賢越之上虞有東山乃謝安石髙卧処西高山西高山者数峯稠疊前山如几俗謂西山平㝡高䖏謂之杜䳌花尖西山峯峦最多術者謂之旌莭山壓頂花枝紅欲燎導前旌莭閙如訶倚窓拄頰時時好何止朝来爽氣多南高山山在縣治東北俗呼縣後山夜聞更鼓声問有地名小雁蕩山後風来聞縣鼓蕩中秋至集賓鴻我帰種菊東籬下長在悠然眼界中北高山予家之後山也左原之山惟此山最竒秀翼然如翔舞状上有尖峯群山如囿秀回環秀㧞群山是北山我恐山中猿鶴怨移文未至巳先還龜山俗呼横屿術者謂真得亀形衆山環遶一山横形似真亀勢欲行不向九江資納錫臨溪曵尾自全生卧虎山在原之氷口形如卧虎舊有淫祠俗呼庙山昂然虎踞一原東回首耽耽氣象雄不放衆山随逝水溪頭高卧自威風梅溪在北高山之陽去孝感井二十歩溪至小以井為原予家其北溪之南有水如帶通謂之梅溪溪名舊矣莫知所自予植梅以實之我向梅花溪上家㡬看清淺浸横斜手栽木已如人老雪鬂蕭踈對雪花楊谿梅溪東流四十五歩合原中数水而為楊溪溪稍大楊氏世居焉故以姓得名一澗泓澄㑹衆流肱分俄類婺溪頭辛已秋水分為二臨溪更種青青木故事端同桞桞州戯綵岩原之西山有岩如屏上有尖峯俗曰白岩然岩色闌班如施五采故以戯采易之烟霞屏障列西岑戯綵標名自始今我過岩前毎流涕班衣空有老萊心杜䳌岩有戯采岩之東岩頂稍平上多杜䳌花故以花得名予家寒食九日必登是岩游宦三年樂事違岩花笑我鳥催帰帰来又𬒳岩花笑笑我登岩何太稀杜䳌花一名岩笑予還家将一載竟未登岩碁盤岩杜䳌岩之比杜䳌岩北一拳石石面平平堪弈棊路僻山深罕人到爛柯仙客未應知撒水岩在戯采岩之比龍卧靈湫志未伸時時噴水撒行人雖然未捄蒼生旱聊欲澄清世上塵松羅岩在原之西北有山隔之四面璧立可梯而登上平北有水可汲能容數百人産松羅木因以得名建炎間有謀避难是岩者予嘗徃觀之非活路也挿天萬仞絶攀躋岩頂松羅不是栽廊庙湏材作梁棟人間斤斧可能来障岩在戯采岩之北璧立如障其色青黒有石方而直聳而有稜長者數尺可植庭宇間岩如法吏面清冷石似端人真直方誰觧移兹障邉境犬羊安敢肆猖狂人面岩在原之西看尽人間古與今蒼顔一任蘚苔侵豈惟有靣如人靣更喜無心似獸心天柱岩有二一在三井之北一在松羅岩之側雁山一柱挿雲霄三井松羅柱亦高蓬蓽深懷𣏌人念擎天端頼柱堅牢幞頭岩在原之西北地名鳥石頭田間閙處身宜及早抽山林遟我掛冠游不湏花裏㝷腰帶且向田間置幞頭宋家尖在東高山皇恩西𬒳復東斬四海蒼生尽仰瞻畎畆㣲臣尤戴宋結廬長向此峯尖小雁蕩在原之南山以雁得名曰小者以别大㕍蕩歸雁行飛集澗阿不貪江海稻梁多峯頭一蕩雖然小飲啄猶堪避網羅左嶺在原之南山北望吾廬山最好南通蕭寺境逾幽嶺之東南有明慶院白雲夜向原中宿㡬度随人過嶺頭左湖在原之東又東日湖邉漁樵欵乃日相呼舟楫生涯在畫圖我與漁樵同隠逸不湏乞作自家湖蓴湖在揚溪之南吾鄉無蓴莱獨此有之此詩乃舊日作水晶銀線滿湖中先人詩云莖抽銀線細根結水晶寒遥與吴江氣象同我軰他年厭游宦思帰應不待秋風南瀑布在南山之下上接小雁蕩飛瀑来從小雁蕩靈源頗類大龍湫矩羅尊者不湏占乞與山翁取次游北瀑布在原之西北山腰間俗名主潭兹潭誰主復誰賓清世寕容有隠淪獨我山休飬衰病不妨来作主潭人嘶水澗原之南有左嶺水比流入于原中水善嘶晴而嘶則雨雨嘶則腰水怱鳴忽上曰嘶嶺頭寒澗逺無聲夜静風恬忽自鳴山水有靈人不識老農常用卜隂晴雁潭原之西南三井山之下吾先人九日甞集賓朋于此因命是名九日登臨澗水濱蕩中征雁亦来賓如今雁至應相感不見名潭舊主人三井原之西南山路崖險人迹罕到予宣和辛丑春從先祖先人避冦是山凢三宿見溪潭多游魚俗傳井舊有龍源泉高似銀河落石井泓然鼎足分聞說井中魚已化定從三級上青雲孝感井予家有井稍大俗称大井王家宣和壬寅秋先祖有􅍚思鯽魚時暑不可致先人鈎于井而得之井素無魚盖孝感也張大猷秘書挽先人詩云玄鯽随鈎誠飬親張後為工部尚書綸竿臨井重欷歔誠感幽潜遂獲魚鮮道随鈎得玄鯽秘書好句實堪書白岩庵在白岩之東吾祖捨山帰明慶院而立是菴四山環合形如蟠龍前到南高山形如舞鳯飛鳯吹帰思竹實庵山多竹蟠龍高卧恋山泉吾家松檟今三世僧舎鍾魚已百年吾髙祖母葬庵之虎山腰曽祖􅌾于青龍首曽祖母塟于庵前平地先妣塟于菴後山賈公庵在南高山之下司理賈公塟其母兄嫂于此築菴命僧守之賈公名如規字元範賈公名徳重吾鄉慈母難兄窆此崗手種松楸及因果青山流水共高長如在亭先人塟大父母于東山立亭以亭之有詩云入堂無復見双親建此来寕似在神先人附􅌾其側某名其亭曰在采詩中語也東山一到一霑巾記得先人昔念親強把兹亭號如在松悲柏慘見無因如在亭先妣墳亭在白岩菴北堂猶緑舊時萱寒暑無繇復清温戯綵岩邉白雲下慈顔彷彿尚如存小小園納凉屏迹丘園世事輕澹然滋味似孤僧平生願學昌黎伯宰相三書獨不能贈甥萬膺詩書為田筆硯耕着意治此清白生它年門户大可必東平有孫吾有甥萬孝傑用韵見寄酬之堂有慈親飬且耕游從毛頴楮先生新詩寄我尤清絶深喜牢之有外甥孝傑刘氏甥也題從姪御名荘風雨漂我廬無地寄食宿小阮知所敦舎我道旁屋震凌得帡幪幸免泥塗辱明白帰舊巢鷦鷯一枝足壬午秋七月戊申大風飛屋枝木予先人弊庐两廡摧壓来寓是荘凢两旬以八月已已還舎書于荘璧萬孝全恵小龍團貢餘龍餅非常品絶勝盧仝得月團豈有詩情可甞北荷君分貺及麄官梅溪先生後集卷第六梅溪先生文集卷第六詩癸酉三月二十五日至剡溪旅舎觀曺夢良題壁有撩我思家第一篇之句僕離家半月亦未嘗作詩因次其韻客舍那堪聞杜䳌夣魂驚断竟無眠定知此境撩郷思我亦曽非第二篇剡之市人以崇奉東嶽為名設盗跖以戯先聖所不忍觀因書一絶里巷無端戯大儒恨無司馬為行誅不知陳蔡當時厄還似如今􅌘縣無周徳逺植瑞香扵窓前戯成一絶主人貪睡為貪香花植窓前意味長見說有時魂夣裡化為蝴蝶遶花旁㳺明心院精舍傍脩嶺道心随眼明泉餘偃公迹偃公泉山接剡溪城無雨竹亦净有風松更清誰名上方閣撩我欲帰情歸鴻閣㳺圎超院登挾溪亭次盧公天驥韻路入剡山腰風生玉川腋孤亭物外髙雙溪眼中碧山僧作亭知㡬春賞音端怕逢詩人自從妙語發丘􅊤遂使絶境多蹄輪我来首訪維摩詰問訊双溪自何出發源應與婺溪同賦物慙無沈郎筆凭欄欲洗名利塵入眼翻驚客恨新山城重重水如帯可䏻挽住思鄉人寄夣齡昌齡弟老去生涯集百憂一身萍泛剡溪頭釣魚温水同侯喜旅食新豊類馬周長鋏有時思海味短檠終夜照離愁也知四海皆兄弟能似天生羽翼不髙和叔生日髙標綽有魯王風天為勲門慶誕公揮麈咲談傾坐上傳家韜畧藴匈中暫從剡水髙人隠行継澶渊盖世功長碩紅顔似今日夀尊鯨吸百川空天子始絺盛徳方居火天王始服絺薰風生殿早畏日到官遲瑩雪羅𥘉疊含風葛乍披汗寕濡玉体暑不近天肌表飾遵尼父恩榮𬒳拾遺中宫同儉徳無媿葛覃詩淵源堂十二詩淵源堂像貌崇賢聖名言訓子孫日親師與友力學探渊源細論堂不飲紅裙酒秪将文字論江東渭北客日日對芳尊冝桂軒主人端不俗景物亦相冝手種軒前桂聮芳共㡬枝藴秀軒剡溪藴秀異乆欝少陵詩今向軒前看人如晋宋時同襟舘安道家何䖏溪山深更深扁舟不憚逺得得訪同㩒冨學齋金玉本非冨詩書元不貧平生無盡學問在吾身輝声齋功名就烜赫遺訓可能忘待獻明光賦蜚声滿四方集彦齋獨學恐孤陋要湏親友朋虚齋集郡彦共對短燈檠擢秀齋好似東山謝滿庭芝與蘭義方能不倦擢秀固非難恢義齋憶昔杜陵老恨無千萬間君能恢大義吾黨悉歡顔蘭馨室一室雖方丈㳺從必舜徒芬馨不自覺身化與之俱足鯉池堂上論文客異時還索居池中鯉魚足好寄别来書書院雜詠牡丹今古㡬池館人人栽牡丹主翁兼種徳要與子孫看芍藥巳過花王候纔聞近侍香来逰禁酒地免作退之狂岩桂岩桂何時種遥聞月窟香君家似燕竇㑹見五枝芳江梅園林盡揺落水雪獨相冝預報春消息花中第一枝酴醿日烘香倍逺雨浥韻尤清誰把玉錢比恐花羞此名紅梅桃李莫相妬天姿元不同猶餘雪霜態未肯十分紅海棠欲與春争媚嫣然一笑芳雨中如有恨疑是為無香瑞香曽入江南夣故冝名瑞香何人好談論雅目誤更張菊花不恨開時晩自知䏻傲霜慎母同瑣細采擷上君堂蠟梅非蠟復非梅梅将蠟染腮㳺蜂見還訝疑自蜜中来榴花客舘􅑮重午石橊花正芳吾廬開亦好歸去嚼天漿簷蔔禅友何時到逺從毘舎園妙香通鼻觀應悟佛根源千葉黄梅菊以黄為正梅惟白最佳徒劳梁千葉不似雪中花千葉紅桃在䖏飄紅雨臨窓照夕陽何時清禁裏一笑伴仙郎千葉白桃豈有夭桃艶淡然群卉中全身是清白那肯媚春風佛見笑學得酴醿白更能相継芳金仙粲然笑鼻觀不多香荷花十里西湖上紅雲照緑波何如吾净友臭味不湏多蓼花秋色在何許蓼花含淺紅客情禁不得歸興逐西風萱花有客看萱草終身悔逺㳺向人空自緑無復觧忘憂斑竹蒼梧廵不返斑竹至今存今日稽山下㡬枝忠孝痕燕竹問記東墻竹佳名今始知龍孫𥘉迸日燕子却来時西河栁瀟洒西河種誰移向浙東青枝太纎細莫近楚王宫葡萄珠帳臨􅉉掛龍鬚滿架抽也知堪醸酒不要博凉州芭蕉草木一般雨芭蕉声獨多主人栽未足其柰客愁何石菖蒲天上玉衡散結根泉石間要湏生九莭長為駐紅顔慎火草禁殿安蚩尾騷人逐畢方何如栽此草有火自䏻妨盆中新荷首夏盤池裏新荷點数圎主人行中選故為作青錢假山君有好山僻疊山亭院間不遮山外眼又得見真山盆池不比兒童戯埋盆作小池要令盆底水長滿不傾欹書架君冨端不俗有錢長買書家蔵三万軸不怕腹空虚鶴雅志在冲霄長思振羽毛風前忽相和声徹九天髙鵝善鳴聊自適不碩遇知音深恐山隂嫗誤猜君子心花鴨毛羽不多異浪扵花得名深疑杜陵誤黒白未分明鸂鶒文采真為累飛鳴不自由小池新水漲相對謾沉浮剡溪雜詠千古剡溪水無窮名利舟閒乗雪中興惟有一王猷千古剡溪水無窮名利舟閒乗雪中興惟有一王猷了溪禹迹始壼口禹功終了溪餘粮散幽谷帰去錫玄圭挾溪亭逺水從台婺同歸古􅌘州巍亭壓山頂千古挾雙流龍宫碑曽到龍宫寺拂塵觀古碑何時無短李肉眼可能知戴顒墓曠野冡纍纍子孫猶不知千年戴顒墓三字道旁碑阮仙翁宅再入山中去烟霞鎖翠㣲故郷遺宅在何日更来㱕戴溪亭剡水照人碧剡山随眼青我来非雪興慙上戴溪亭偃公泉泉自何時有得名從偃公誰能継張陸為戴水經中書院掛額展筵雅㑹也戯集諸堂軒齋名作詩􅓺舘名𥘉掛銀鈎勢欲翻人才藴秀異學業扣淵源俊彦方群集文章可細論輝声邁前軰擢秀藹諸孫心友居蘭室天香滿桂軒兹為學者富難與俗流言恢義髙風倡同襟舊好敦池中神鯉足一一上龍門别周徳逺諸友山城過踈雨客舘生新秋鄉心雜病思浩蕩不可留憶昨𥘉来時園花弄春柔俯仰節變木秒風颼颼旅食百日餘故人情已周論文有深味惜别添牢愁槐花物色老琹書散交㳺暖律囬南枝相期泛仙舟宿石佛七月二十三日囬自剡中宿石佛摩雲閣時與謝圖南童文卿沈齊卿黄庭甫子楊同行周徳逺徳貽徳廣陳少曽史岩起携且餞别脩徑入幽壑𣑽宫摩碧霄仰頭驚突兀跬歩怯岧嶤寳相石間湧鍾聲雲外飄明朝路南北身世各塵囂白若遇水以小舟従石門渡勢危甚因書数語示圖南文卿時八月二日也歸途阻秋潦溪漲不可渉迂從石門渡未見心已怯壯㢤龍伯宫幽據鴈山脇岩如峙城壁南北本相接衆流欲朝宗天為開岌業泓澄潭百尺臲卼舟一葉吾生何自䡖内顧無可挾所賴二友生千里同負笈忠信儻可仗免作飛鳥帖来帰從剡溪山水頗渉獵石齧天台舟浪拍臨海楫可曽如此境令我䰟震懾連年作行客川塗但取捷不因風雨暴誰瞰逺歩屧兹渡雖云悪觀覧意亦愜謾賦石門篇添入剡㳺篋孟甲生日記汝𥘉生際燈花逹旦然門䦨增喜慶翁嫗最矜憐巳過周天歲行臨志學年勉修愚魯質詩禮稱家傳孟甲孟乙好蓄古錢因示以詩世人多好錢今汝獨好古書中閱平凖壁上按圖譜廣拾漢五銖逺及周九府惜㢤生我家此物罕曽覩百中時得一喜笑見眉宇所蓄雖不多其志頗可取閭閻冨家子繞床堆阿堵一字不識丁碌碌何足数更冝移此力典墳讀三五縱未到聖賢定可過乃父周光宗贈蠣房報以溪蓴珠嶼蠣房魁海錯左原􅐜線冠溪毛韓公南食可曽見張翰東帰徒自髙鼎爼珎庖輸肉食江湖佳味属吾曺有無相易通家事僮僕往来母惮勞劉府君挽詞全之父歆向詵然萃一門過庭詩礼盡公恩竒児不負義方教舊治至今遺愛存心境欲明憑貝葉夀蔵預卜傍祗園髯郎行燭青藜杖定見榮光逹九泉賤子無天釁早鍾記觀先友涕亡從士林方喜榮三桂丞舎俄驚慘二松剡水凄凉囬棹速丹丘慟哭過車凶發揚門户勝他族深羡公家有蔡邕賈府君挽詞予妻父鹿岩重見鹿門翁襟宇渾然太古風負郭良田全種徳起家難弟巳收功花間麟冡經年就木杪龜跌指日豊門婿自慚非李漢鄙文何足状韓公陳夫人挽詞予妻母偉節聲名盖一時夫人淑徳最相冝便甘布素從髙隠不惜花鈿拯衆飢萱草未乾堂下土楊花巳應夣中詩如今多少王孫餓進食哀憐復有誰賈公夣中嘗得詩云洞房人不見相望摘楊花納凉偶成架松却煩暑梳竹来清風頑然七尺軀寄此微凉中髙枕傲有道深杯醉無功山林有餘樂此興誰吾同悼演述二老僧疊石峯前二老僧相逢一笑見真情社中對酒日𥘉永林下圍碁秋始清尚擬維摩眠丈室遽驚圓澤厭浮生通幽亭冷西楼古過客傷心涕淚横黄楊黄楊紀孝義也家有黄楊根一榦百枝葉森然木之有義者也故作是詩以記之嘉彼黄楊欝焉其蒼匪甕而圓匪盖而張百榦同根森如弟昆千枝其子萬葉其孫惟此黄楊先子所植草木有義先子之徳碩言我家兄弟子孫如此嘉樹永為義門梅溪先生文集卷第六
