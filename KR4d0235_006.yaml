  text: 梅溪先生後集卷第六
  hash: sha256:76380472fc164ea301cd898450ba0d550a2958cef4f377393bdb982fffd21b79
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_006-1a}
body:
  text: 詩次韻昌齡至樂齋讀書端慕顔回樂真同陋巷居息心容膝地得趣滿牀書檠短燈宵永窗明日晷舒相看有修竹心為主人虗寶印叔示詩且索碑刻以南明山六大字為獻紫芝岩隱嶽岩仍次韻不才詎可登臺省早問君王覔間冷聊尋商嶺綺與園未羡雲臺冦并耿挂碑滿屋寧療飢來詩云滿屋挂碑光耿耿嗜好與叔真相宜試寄南明六大字想像年少西遊時寶印叔辨上人各贈瑞香花小小園林意自憐全用劉汝一書送行詩一句名花十八擬唐賢瑞香一種來潛澗學士新添兩少年曺夢良自許峯來訪留山間數日賦詩數十章復出四絶見贈次韻徑荒猶有淵明菊囊澀寧求季子金老矣此身何處著入山惟恐未能深謾有忠懷徒耿耿恨無長䇿救元元張儀舌在知何用莫莫休休且勿言平生風義慕相如筆硯從遊二絶餘直許交情定金石肯同餘耳但光𥘉與君連夕燈前語勝讀千年窗下書八斗文章千里足未應低首掾桐廬先人舊題東山墓亭三絶入堂無復見雙親建此字元犯御名故昜之此來寧似在神天地深恩難以報含悲唯有淚霑巾門枕青山户傍溪青山流水助悽悽雙親既逺神何在對此追思獨怨啼新築茅廬澗􅊤圍山光水色共依依野人不為間中趣誰會朝來與暮歸某辛巳秋歸自武林省先隴遂修亭宇濬溪流因思先人舊詩巳隨屋璧壞矣尚能記憶遂追和殘生無計可榮親一見松楸一損神惟有青山知此意晨昏長戴白雲巾先隴在家之東山山最髙白雲常抹其頂重葺山亭濬舊溪杖藜來往獨悲悽追思四十年間事風為哀號鳥為啼丘木森森巳十圍滿林清蔭可捿依每憂樵牧傷松柏遊宦三年兩度歸送萬先之赴清湘教官早歲聲名滿上庠青衫今始赴淸湘得官巳晚豈宜冷行路正難那更長平昔心期良不淺異時官業可能量鵬程九萬從今日行見飛飛到帝旁送曺夢良赴桐廬户掾年少論交老愈堅交情盡在和韓萹短檠業共賢關舍淡墨名同桂籍年筮仕暫為三語掾摛詞行踐八花磚許峯佳讖亦聊耳何止蓬萊山上仙瑞安有許峯坳斷祕丞歸之讖雞黍相尋豈偶然論文尊酒荷留連秋風初送雁群至喬木喜聞鶯友遷勸我鑑湖行甚力送君釣瀨去無緣頭將清白師韓范從此高堂有四賢需次家鄉五載遲便便腹笥愈添圍才如子建豈論斗性類西門能佩韋車馬戒塗君欲去田園迷徑我初歸男兒所尚惟名莭莫墮人間富貴機十月朔日偶書去年此日對清光聖德能容一介狂言略施行非不遇身雖踈外亦何妨剪拂花木戲成二絶灑掃衡茅端欲老剪裁花木自為春權門炙手非吾事秪合丘園作散人蔓􅋄芟夷莫許侵好花封植待成隂每於小小園林裏長抱惓惓甽畒心小小園十月杜鵑花盛開有共蒂雙頭之異因以數語記之一聲杜宇啼春風明朝緋挂千山叢歲寒此色豈昜得那更朵朵雙頭紅共蒂聮芳友于愛一吐一含分次第造物私我小園林此花大勝金腰帶牡丹中有名金腰帶者題月師桂堂道人以月名身以桂名堂胸中負所有志在丹霄旁冠巾倘可加唾手得天香惜哉已世外此志終莫償山中作堂侔月窟禪定吟餘思清越要令坐上生清風須使心中似明月十一月二日自金溪訪錢用章于白石覽山川景物之竒以東道之姓為韻朝離文君故宅邉莫尋謝守舊行田黃羊先示神仙迹湖上奧有黃羊岩白石俄開洞府天兩派峥鳴玉澗一聲欵乃釣魚船王孫占得湖山勝明月清風不計錢同錢用明用章遊白石岩謝公好山水得郡古東甌造物惜佳境雅志多不酬松蘿蔽雁蕩煙靄埋龍湫行田徑白石不到仙山頭寥寥數百年天付黃冠流巍然萬仞崖璧立東南州誰將輔天手化出白玉樓兩龕藏洞府中有群仙遊上通赤五天下接三神洲飛泉落岩腰碧澗鳴山陬群峯真培塿滄海為渠溝隘視人間世萬象同蜉蝣我家雁山陽﨑嶇厭經丘翩翩錢公子呼我尋岩幽𥘉驚小雨密忽掃群隂浮杖屨窮巑岏一洗塵埃眸山林有真樂富貴何足求但願乞二山不願萬户侯二山白石雁蕩又書岩上十里湖山翠黛橫兩溪寒玉鬪琮琤路從飛鳥上頭過人在白雲高處行岩下行田謝康樂洞中辟榖李先生憑欄不瞰人間世轉覺此心名利輕屑玉泉白石岩腰屑玉泉佳名初自長官傳渾疑齒頰氷霜論終日霏霏落半天周開祖名是泉曰屑玉東坡有贈周詩云詩成錦繡開腸胃論極氷霜繞齒牙李少和像少和辛苦學飛仙遺像今猶在洞天都似先生能辟榖何須太守為行田遊東際白石三峯下懸崖七際流穿雲來汨汨朝海去悠悠石是誰家婦有兩石峭立俗呼石新婦龍居第幾湫俗云舊有龍平生不行險到此即回頭上有六際畏險不登次韻寶印叔觀海三絶載地浮天浩莫窮氣營樓閣聳虛空道人妙得觀瀾術萬里滄溟碧眼中榴嶼何年改玉環木榴嶼一名木榴嶼俗傳避錢玉諱故改名王環望中猶是舊青山遺民不記當時事惟有湖聲日往還誤入蓬萊朝未央至今魂夢記微茫扁舟欲效鴟夷子遙望滄波興已狂李鎮夫闢圃築堂效孟氏之飬吾表兄杖屨其間得日涉之趣其來遊名堂曰雙植因書三絶不到君家幾換春眼中風物一畨新吾園小小知何用不似兹園可飬親琴書得趣有真樂軒冕倘來何足干種德種花兼著力要須留與子孫看繞堂花木隨宜種堆案文書取次翻我待衣冠挂林下杖藜時復到君園劉長方自豫章寄書稱砮焦蠣房之美恨未知味書一絶以寄之珠嶼小蠣圎帶石砮焦巨房深若杯吾鄉此味亦不惡故人遊宦盍歸來砮焦在沙角海中本日奴焦豫易之曰砮珠嶼在大芙蓉小蠣絶佳寶印叔得小假山以長萹模寫進士欽逢辰和之某次韻并簡欽越絶天台溫雁蕩萬􅊤千岩各形狀錢塘風物更竒絶杖屨年時記曽訪歸來戲闢小園林十里西湖藏甕盎豫嘗以甕植蓮有詞云一盤池地十里西湖是悠然入眼皆吾山羅列軒窗一何壯止菴道人真有道種竹蒔花近丘壙何人好事贈假山潛澗新添小屏嶂却疑遷徙從平泉更恐飛來自秦望秦望有飛來山飛來石世間贋物何止此沙佛儒衣龍亦象道人於物意豈留異日從教散天壤花木篇章兩遊戲林下高風真可尚來遊蓮社有詩人句比昌黎更豪放我休説假復論真真假通同歸一相次韻昌齡西園十詠黃楊豫歸自武林黃楊梢枯命工去藤蔓台蘚復有生意黃楊庚甲與吾同樹已蕭踈我亦翁藤蔓稍除苔蘚去歲寒猶解傲霜風莆萄滿架龍鬚卷復伸堆盤馬乳釀青春潑陪一斗宜延客莫慱涼州學漢人修竹至樂齋西碧玉竿清隂時過酒杯寒明年看長纎纎筍解籜當為漢帝冠梅拂雲修竹繞吾家竹裏仍栽第一花好句更同林處士月黃昏後影橫斜桃欲留王毋盤中核兼採秦人洞裏薪此事渺茫花笑我不如聊賞故園春李長念詩人詠子嗟圑欒繞樹日欹斜氷盤行薦炎天實不用東門學種瓜杉記得先人手自栽森然千尺盡成材翠絲結作思人樹它日兒孫豈忍摧桂丹霄休歎路難通學取燕山種桂叢異日天香滿亭院吾廬當似廣寒宫桞何幸先人有弊廬不妨同種桞千株埀隂覆地寧無日作雪漫天肯似榆菊百花春放菊秋榮霜裏鮮鮮照眼明歲晚不妨開自好何須三嗅泣繁英題如存亭壁十二月五日同二弟省墳不見慈親已一星佳城松柏慘然青此生難報劬勞德空對銘碑涕泗零年來遊宦逺松楸越雪吳霜帶滿頭乞得祠宫飬衰病白岩香火共僧修劉義夫欲與先隴植蘭寄數根思親何忍陟南陔采得幽蘭秪自哀寄與東山劉孝子佳城側畔好親栽義夫許贈丁香蠟梅劉郎不獨種桃花蠟蘂柔香更可嘉臭味相同林下友從今花木亦通家豫植十八香丁香曰柔香取杜詩丁香體柔弱義夫以趙清獻諌垣集易桞文次其韻文集何須較少多有無相易共漸磨憲臺清獻桞州桞唐宋人才未易過雁山僧景暹求文記本覺殿歸來欲效老夫潛喜見遊方舊杜暹本覺殿成功德滿愧無筆力助莊嚴又六言筆下何曽有口囊中更愧無錢聊把一言讃嘆助成此假因緣書不欺室室明室暗兩何疑方寸長存不可欺勿謂天高鬼神逺要須先畏自家知人日有雪竹間種蘭人日又飛雪去年人日臨安大雪竹林仍種蘭舊嘗於竹間種蘭陽浮屑瓊久風泛馥檀欒花點黃金勝叢依碧玉竿世間桃李眼肯向此中看張思豫主簿送丹桂蠟梅通家天上張公子桂種遙分月窟香三徑殷勤自栽植異時會見五枝芳蓮幕何人送此花不容一蘂汚貧家歸來自覔清河種馨德如人最可嘉豫在越幕有送蠟梅者卻之同僚有蓮幕風清不受梅句余全之贈菊栽十二品并示三十絶走筆二絶酬之老覺山林興味長歸來三徑嘆荒涼分君嘉菊二十品增我東園十八香余郎蕭灑似何郎事業它年未易量寄我新詩三十絶筆頭直與菊爭芳二月二日焚黃天色開霽賓遊並集存沒有光悲痛之餘因成鄙語三釡深悲不逮親九天命下賁雙墳痛將淚雜香醪奠忍見衣隨告墨焚漠漠濃隂初閣雨暉暉暖日旋披雲餘生難報劬勞德猶有孤忠可報君送陳元佐遊剡杖屨昔遊剡夢魂猶至今欣聞戒行李遙訪舊同襟斆學功相半淵源力可尋池中神鯉足時為寄鄉音雙桂先人於井之兩旁植雙桂不知其幾年矣木隂茂盛香聞逺近某偶得一石立為墻角書雙桂二字以識之因成小詩以懷遺德并示子弟壬午閏月十六日先人植雙桂馨德滿吾廬不老兒孫長聮芳合似渠東籬我豈􅒑彭澤兹籬偶在東悠然見山處仍向菊花叢左原詩三十二首并序樂清之東三十有五里群山環繞地名左原以其居邑之左也中有左嶺左湖左口皆以左名之豫七世祖自杭徙溫家于是原地雖荒僻有山水足以自娛豫丐祠得請日與兄弟鄰里有杖屨登臨之適原中景物可資賦詠者各識以詩凡三十二首壬午三月東高山左原有四高山在乙辛丁癸之位術者目為四貴人東山最高上有五峯其一曰宋家尖也峯頭日出已停午山半雲橫疑在天要使名如越山重直須人似謝公賢越之上虞有東山乃謝安石髙卧處西高山西高山者數峯稠疊前山如几俗謂西山平最高處謂之杜鵑花尖西山峯巒最多術者謂之旌莭山壓頂花枝紅欲燎導前旌莭閙如訶倚窗拄頰時時好何止朝來爽氣多南高山山在縣治東北俗呼縣後山夜聞更鼓聲問有地名小雁蕩山後風來聞縣鼓蕩中秋至集賓鴻我歸種菊東籬下長在悠然眼界中北高山豫家之後山也左原之山惟此山最竒秀翼然如翔舞狀上有尖峯群山如囿秀回環秀拔群山是北山我恐山中猿鶴怨移文未至巳先還龜山俗呼橫嶼術者謂真得龜形衆山環繞一山橫形似真龜勢欲行不向九江資納錫臨溪曵尾自全生卧虎山在原之氷口形如卧虎舊有淫祠俗呼廟山昂然虎踞一原東回首耽耽氣象雄不放衆山隨逝水溪頭高卧自威風梅溪在北高山之陽去孝感井二十步溪至小以井為原豫家其北溪之南有水如帶通謂之梅溪溪名舊矣莫知所自豫植梅以實之我向梅花溪上家幾看清淺浸橫斜手栽木已如人老雪鬢蕭踈對雪花楊溪梅溪東流四十五步合原中數水而為楊溪溪稍大楊氏世居焉故以姓得名一澗泓澄會衆流肱分俄類婺溪頭辛已秋水分為二臨溪更種青青木故事端同桞桞州戲綵岩原之西山有岩如屏上有尖峯俗曰白岩然岩色闌班如施五采故以戲采易之煙霞屏障列西岑戲綵標名自始今我過岩前每流涕班衣空有老萊心杜鵑岩有戲采岩之東岩頂稍平上多杜鵑花故以花得名豫家寒食九日必登是岩遊宦三年樂事違岩花笑我鳥催歸歸來又𬒳岩花笑笑我登岩何太稀杜鵑花一名岩笑豫還家將一載竟未登岩碁盤岩杜鵑岩之比杜鵑岩北一拳石石面平平堪奕棊路僻山深罕人到爛柯仙客未應知撒水岩在戲采岩之比龍卧靈湫志未伸時時噴水撒行人雖然未救蒼生旱聊欲澄清世上塵松羅岩在原之西北有山隔之四面璧立可梯而登上平北有水可汲能容數百人産松羅木因以得名建炎間有謀避難是岩者豫嘗往觀之非活路也插天萬仞絶攀躋岩頂松羅不是栽廊廟須材作梁棟人間斤斧可能來障岩在戲采岩之北璧立如障其色青黑有石方而直聳而有稜長者數尺可植庭宇間岩如法吏面清冷石似端人真直方誰解移兹障邉境犬羊安敢肆猖狂人面岩在原之西看盡人間古與今蒼顔一任蘚苔侵豈惟有靣如人靣更喜無心似獸心天柱岩有二一在三井之北一在松羅岩之側雁山一柱插雲霄三井松羅柱亦高蓬蓽深懷𣏌人念擎天端賴柱堅牢幞頭岩在原之西北地名鳥石頭田間閙處身宜及早抽山林遲我挂冠遊不須花裏尋腰帶且向田間置幞頭宋家尖在東高山皇恩西𬒳復東斬四海蒼生盡仰瞻畎畝微臣尤戴宋結廬長向此峯尖小雁蕩在原之南山以雁得名曰小者以别大堆蕩歸雁行飛集澗阿不貪江海稻梁多峯頭一蕩雖然小飲啄猶堪避網羅左嶺在原之南山北望吾廬山最好南通蕭寺境逾幽嶺之東南有明慶院白雲夜向原中宿幾度隨人過嶺頭左湖在原之東又東日湖邉漁樵欵乃日相呼舟楫生涯在畫圖我與漁樵同隱逸不須乞作自家湖蓴湖在揚溪之南吾鄉無蓴萊獨此有之此詩乃舊日作水晶銀線滿湖中先人詩云莖抽銀線細根結水晶寒遙與吳江氣象同我輩他年厭遊宦思歸應不待秋風南瀑布在南山之下上接小雁蕩飛瀑來從小雁蕩靈源頗類大龍湫矩羅尊者不須占乞與山翁取次遊北瀑布在原之西北山腰間俗名主潭兹潭誰主復誰賓清世寧容有隱淪獨我山休飬衰病不妨來作主潭人嘶水澗原之南有左嶺水比流入于原中水善嘶晴而嘶則雨雨嘶則腰水匆鳴忽上曰嘶嶺頭寒澗逺無聲夜靜風恬忽自鳴山水有靈人不識老農常用卜隂晴雁潭原之西南三井山之下吾先人九日嘗集賓朋于此因命是名九日登臨澗水濱蕩中征雁亦來賓如今雁至應相感不見名潭舊主人三井原之西南山路崖險人迹罕到豫宣和辛丑春從先祖先人避冦是山凡三宿見溪潭多遊魚俗傳井舊有龍源泉高似銀河落石井泓然鼎足分聞説井中魚已化定從三級上青雲孝感井豫家有井稍大俗稱大井王家宣和壬寅秋先祖有􅍚思鯽魚時暑不可致先人鈎于井而得之井素無魚蓋孝感也張大猷祕書挽先人詩云玄鯽隨鈎誠飬親張後為工部尚書綸竿臨井重欷歔誠感幽潛遂獲魚鮮道隨鈎得玄鯽祕書好句實堪書白岩庵在白岩之東吾祖捨山歸明慶院而立是菴四山環合形如蟠龍前到南高山形如舞鳯飛鳯吹歸思竹實庵山多竹蟠龍高卧戀山泉吾家松檟今三世僧舍鍾魚已百年吾髙祖母葬庵之虎山腰曽祖􅌾于青龍首曽祖母葬于庵前平地先妣葬于菴後山賈公庵在南高山之下司理賈公葬其母兄嫂于此築菴命僧守之賈公名如規字元範賈公名德重吾鄉慈母難兄窆此岡手種松楸及因果青山流水共高長如在亭先人葬大父母于東山立亭以亭之有詩云入堂無復見雙親建此來寧似在神先人附􅌾其側某名其亭曰在采詩中語也東山一到一霑巾記得先人昔念親強把兹亭號如在松悲柏慘見無因如在亭先妣墳亭在白岩菴北堂猶緑舊時萱寒暑無繇復清溫戲綵岩邉白雲下慈顔倣佛尚如存小小園納涼屏迹丘園世事輕淡然滋味似孤僧平生願學昌黎伯宰相三書獨不能贈甥萬膺詩書為田筆硯耕著意治此清白生它年門户大可必東平有孫吾有甥萬孝傑用韻見寄酬之堂有慈親飬且耕遊從毛頴楮先生新詩寄我尤清絶深喜牢之有外甥孝傑劉氏甥也題從姪御名莊風雨漂我廬無地寄食宿小阮知所敦舍我道旁屋震凌得帡幪幸免泥塗辱明白歸舊巢鷦鷯一枝足壬午秋七月戊申大風飛屋枝木豫先人弊廬兩廡摧壓來寓是莊凡兩旬以八月已已還舍書于莊璧萬孝全惠小龍團貢餘龍餅非常品絶勝盧同得月團豈有詩情可嘗北荷君分貺及粗官梅溪先生後集卷第六梅溪先生文集卷第六詩癸酉三月二十五日至剡溪旅舍觀曺夢良題壁有撩我思家第一篇之句僕離家半月亦未嘗作詩因次其韻客舍那堪聞杜鵑夢魂驚斷竟無眠定知此境撩鄉思我亦曽非第二篇剡之市人以崇奉東嶽為名設盜跖以戲先聖所不忍觀因書一絶里巷無端戲大儒恨無司馬為行誅不知陳蔡當時厄還似如今􅌘縣無周德逺植瑞香于窗前戲成一絶主人貪睡為貪香花植窗前意味長見説有時魂夢裡化為蝴蝶繞花旁遊明心院精舍傍修嶺道心隨眼明泉餘偃公迹偃公泉山接剡溪城無雨竹亦淨有風松更清誰名上方閣撩我欲歸情歸鴻閣遊圎超院登挾溪亭次盧公天驥韻路入剡山腰風生玉川腋孤亭物外髙雙溪眼中碧山僧作亭知幾春賞音端怕逢詩人自從妙語發丘􅊤遂使絶境多蹄輪我來首訪維摩詰問訊雙溪自何出發源應與婺溪同賦物慙無沈郎筆憑欄欲洗名利塵入眼翻驚客恨新山城重重水如帶可能挽住思鄉人寄夢齡昌齡弟老去生涯集百憂一身萍泛剡溪頭釣魚溫水同侯喜旅食新豐類馬周長鋏有時思海味短檠終夜照離愁也知四海皆兄弟能似天生羽翼不髙和叔生日髙標綽有魯王風天為勳門慶誕公揮麈笑談傾坐上傳家韜略藴胸中暫從剡水髙人隱行繼澶淵蓋世功長碩紅顔似今日夀尊鯨吸百川空天子始絺盛德方居火天王始服絺薰風生殿早畏日到官遲瑩雪羅𥘉疊含風葛乍披汗寧濡玉體暑不近天肌表飾遵尼父恩榮𬒳拾遺中宫同儉德無愧葛覃詩淵源堂十二詩淵源堂像貌崇賢聖名言訓子孫日親師與友力學探淵源細論堂不飲紅裙酒秪將文字論江東渭北客日日對芳尊冝桂軒主人端不俗景物亦相冝手種軒前桂聮芳共幾枝藴秀軒剡溪藴秀異久鬱少陵詩今向軒前看人如晉宋時同襟館安道家何處溪山深更深扁舟不憚逺得得訪同擒冨學齋金玉本非冨詩書元不貧平生無盡學問在吾身輝聲齋功名就烜赫遺訓可能忘待獻明光賦蜚聲滿四方集彥齋獨學恐孤陋要須親友朋虛齋集郡彥共對短燈檠擢秀齋好似東山謝滿庭芝與蘭義方能不倦擢秀固非難恢義齋憶昔杜陵老恨無千萬間君能恢大義吾黨悉歡顔蘭馨室一室雖方丈遊從必舜徒芬馨不自覺身化與之俱足鯉池堂上論文客異時還索居池中鯉魚足好寄别來書書院雜詠牡丹今古幾池館人人栽牡丹主翁兼種德要與子孫看芍藥巳過花王候才聞近侍香來逰禁酒地免作退之狂岩桂岩桂何時種遙聞月窟香君家似燕竇會見五枝芳江梅園林盡搖落水雪獨相冝預報春消息花中第一枝酴醿日烘香倍逺雨浥韻尤清誰把玉錢比恐花羞此名紅梅桃李莫相妬天姿元不同猶餘雪霜態未肯十分紅海棠欲與春爭媚嫣然一笑芳雨中如有恨疑是為無香瑞香曽入江南夢故冝名瑞香何人好談論雅目誤更張菊花不恨開時晚自知能傲霜慎母同瑣細采擷上君堂蠟梅非蠟復非梅梅將蠟染腮遊蜂見還訝疑自蜜中來榴花客館􅑮重午石榴花正芳吾廬開亦好歸去嚼天漿簷蔔禪友何時到逺從毗舍園妙香通鼻觀應悟佛根源千葉黃梅菊以黃為正梅惟白最佳徒勞梁千葉不似雪中花千葉紅桃在處飄紅雨臨窗照夕陽何時清禁裏一笑伴仙郎千葉白桃豈有夭桃艷淡然群卉中全身是清白那肯媚春風佛見笑學得酴醿白更能相繼芳金仙粲然笑鼻觀不多香荷花十里西湖上紅雲照緑波何如吾淨友臭味不須多蓼花秋色在何許蓼花含淺紅客情禁不得歸興逐西風萱花有客看萱草終身悔逺遊向人空自緑無復解忘憂斑竹蒼梧巡不返斑竹至今存今日稽山下幾枝忠孝痕燕竹問記東墻竹佳名今始知龍孫𥘉迸日燕子却來時西河栁瀟灑西河種誰移向浙東青枝太纎細莫近楚王宫葡萄珠帳臨􅉉挂龍鬚滿架抽也知堪釀酒不要博涼州芭蕉草木一般雨芭蕉聲獨多主人栽未足其奈客愁何石菖蒲天上玉衡散結根泉石間要須生九莭長為駐紅顔慎火草禁殿安蚩尾騷人逐畢方何如栽此草有火自能妨盆中新荷首夏盤池裏新荷點數圎主人行中選故為作青錢假山君有好山僻疊山亭院間不遮山外眼又得見真山盆池不比兒童戲埋盆作小池要令盆底水長滿不傾欹書架君冨端不俗有錢長買書家藏三万軸不怕腹空虛鶴雅志在沖霄長思振羽毛風前忽相和聲徹九天髙鵝善鳴聊自適不碩遇知音深恐山隂嫗誤猜君子心花鴨毛羽不多異浪于花得名深疑杜陵誤黑白未分明鸂鶒文采真為纍飛鳴不自由小池新水漲相對謾沉浮剡溪雜詠千古剡溪水無窮名利舟間乘雪中興惟有一王猷千古剡溪水無窮名利舟間乘雪中興惟有一王猷了溪禹迹始壼口禹功終了溪餘糧散幽谷歸去錫玄圭挾溪亭逺水從台婺同歸古􅌘州巍亭壓山頂千古挾雙流龍宫碑曽到龍宫寺拂塵觀古碑何時無短李肉眼可能知戴顒墓曠野冡纍纍子孫猶不知千年戴顒墓三字道旁碑阮仙翁宅再入山中去煙霞鎖翠微故鄉遺宅在何日更來歸戴溪亭剡水照人碧剡山隨眼青我來非雪興慙上戴溪亭偃公泉泉自何時有得名從偃公誰能繼張陸為戴水經中書院挂額展筵雅會也戲集諸堂軒齋名作詩􅓺館名𥘉挂銀鈎勢欲翻人才藴秀異學業扣淵源俊彥方群集文章可細論輝聲邁前輩擢秀藹諸孫心友居蘭室天香滿桂軒兹為學者富難與俗流言恢義髙風倡同襟舊好敦池中神鯉足一一上龍門别周德逺諸友山城過踈雨客館生新秋鄉心雜病思浩蕩不可留憶昨𥘉來時園花弄春柔俯仰節變木秒風颼颼旅食百日餘故人情已周論文有深味惜别添牢愁槐花物色老琴書散交遊暖律回南枝相期泛仙舟宿石佛七月二十三日回自剡中宿石佛摩雲閣時與謝圖南童文卿沈齊卿黃庭甫子楊同行周德逺德貽德廣陳少曽史岩起携且餞别修徑入幽壑𣑽宫摩碧霄仰頭驚突兀跬步怯岧嶤寶相石間湧鍾聲雲外飄明朝路南北身世各塵囂白若遇水以小舟從石門渡勢危甚因書數語示圖南文卿時八月二日也歸途阻秋潦溪漲不可涉迂從石門渡未見心已怯壯哉龍伯宫幽據鴈山脅岩如峙城壁南北本相接衆流欲朝宗天為開岌業泓澄潭百尺臲卼舟一葉吾生何自輕內顧無可挾所賴二友生千里同負笈忠信儻可仗免作飛鳥帖來歸從剡溪山水頗涉獵石齧天台舟浪拍臨海楫可曽如此境令我魂震懾連年作行客川塗但取捷不因風雨暴誰瞰逺步屧兹渡雖云惡觀覽意亦愜謾賦石門篇添入剡遊篋孟甲生日記汝𥘉生際燈花逹旦然門闌增喜慶翁嫗最矜憐巳過周天歲行臨志學年勉修愚魯質詩禮稱家傳孟甲孟乙好蓄古錢因示以詩世人多好錢今汝獨好古書中閲平凖壁上按圖譜廣拾漢五銖逺及周九府惜哉生我家此物罕曽覩百中時得一喜笑見眉宇所蓄雖不多其志頗可取閭閻冨家子繞床堆阿堵一字不識丁碌碌何足數更冝移此力典墳讀三五縱未到聖賢定可過乃父周光宗贈蠣房報以溪蓴珠嶼蠣房魁海錯左原􅐜線冠溪毛韓公南食可曽見張翰東歸徒自髙鼎爼珍庖輸肉食江湖佳味屬吾曺有無相易通家事僮僕往來母憚勞劉府君挽詞全之父歆向詵然萃一門過庭詩禮盡公恩竒兒不負義方教舊治至今遺愛存心境欲明憑貝葉夀藏預卜傍祗園髯郎行燭青藜杖定見榮光逹九泉賤子無天釁早鍾記觀先友涕亡從士林方喜榮三桂丞舍俄驚慘二松剡水凄涼回棹速丹丘慟哭過車凶發揚門户勝他族深羡公家有蔡雍賈府君挽詞豫妻父鹿岩重見鹿門翁襟宇渾然太古風負郭良田全種德起家難弟巳收功花間麟冡經年就木杪龜跌指日豐門壻自慚非李漢鄙文何足狀韓公陳夫人挽詞豫妻母偉節聲名蓋一時夫人淑德最相冝便甘布素從髙隱不惜花鈿拯衆飢萱草未乾堂下土楊花巳應夢中詩如今多少王孫餓進食哀憐復有誰賈公夢中嘗得詩云洞房人不見相望摘楊花納涼偶成架松却煩暑梳竹來清風頑然七尺軀寄此微涼中髙枕傲有道深杯醉無功山林有餘樂此興誰吾同悼演述二老僧疊石峯前二老僧相逢一笑見真情社中對酒日𥘉永林下圍碁秋始清尚擬維摩眠丈室遽驚圓澤厭浮生通幽亭冷西樓古過客傷心涕淚橫黃楊黃楊紀孝義也家有黃楊根一幹百枝葉森然木之有義者也故作是詩以記之嘉彼黃楊鬱焉其蒼匪甕而圓匪蓋而張百幹同根森如弟昆千枝其子萬葉其孫惟此黃楊先子所植草木有義先子之德碩言我家兄弟子孫如此嘉樹永為義門梅溪先生文集卷第六
