body:
  text: 手劄與陸㑹稽修曹娥旌忠廟比以忠孝二廟曺娥旌忠爲懇巳蒙重諾忠孝臣子大節人所難䏻二人遺躅皆属㑹稽可謂千古盛事修廟崇祀以勸風俗正賢師帥之職俗吏苐以科催爲急簿書獄訟爲先自非吾儒孰肎留意扵此聞曹娥廟巳命工矣旌忠之修費亦無㡬不可復留以遺後人切望分念某嘗題曹娥廟及近撰㑹稽三賢詩併寫上呈與江山隂修愍孝廟比以修愍孝廟爲懇特荷不外旌忠之修巳委陸㑹稽矣忠孝臣子大節死者人之所難蔡孝子以布衣䏻爲人所難䏻之事有足嘉者而廟貌不稱深可嘆息修廟崇祀以勸風俗正賢師帥之職切望留念某近撰㑹稽三賢詩愍孝廟居其一焉併録上呈與趙安撫乞降祝版祀上虞舜廟據上虞縣尉陳迪功劄子稱本縣有帝舜廟一所父老相傳自置縣以来即有此廟兼縣有舜井象田百官等䖏古跡至多而一方水旱疾苦有請扵廟無不響應合在祀興欲望台慈詳酌許令本縣每歲春秋僃辦牢醴從使府給降祝版遣官致祭少爲大功明徳之報本縣近巳具状申府欲乞施行與邵提刑某兹者伏遇提刑郎中親乗使軺按察列郡某輙有巳見畫一具聞仰助澄清乞賜台覧一伏覩主上躬断以来寬恤之詔下無虚日然而實恵未孚于民者盖由守令不䏻奉行之弊昔人謂徒掛墻壁今則初未嘗掛凡遇詔下事有便扵民而不便扵吏者或宣畢而遂匿或畧掛而遽收故上雖有良法美意下不得而知者多矣况欲被其恵邪今欲乞軺車所至盡録比年寬恤詔條㮄示通衢使有目者咸得而覩其郡縣官吏有不張掛與徒掛而不奉行者首加案劾庶使朝廷實徳下及元元一伏覩主上慎刑恤獄之意雖堯舜成康無以加然而措刑之效未逮扵古者盖由郡縣無循吏而囹圄多冤民切見州縣間常置禁曆二一曰正禁二曰寄禁每遇監司入境止将所鞠重囚書正禁曆其他囚悉附寄禁仍将所禁之人拘置僻所使不得声冤又多令吏䘚防其親戚使不得吿訴俟監司既去囚禁如初今欲乞所至州縣㮄示道路如有蔵匿罪囚許人以吿及搜索二曆備閱所禁之事取一二件親賜按問庶絶冤枉之弊一伏覩國家張官置吏本以為民要當以撫字為先催科次之今之所謂守令者專務催科殊無撫字之意盖催科自有常法豈在以速辦為能官以未及期為辦事民當未及期而被擾輸納之稅未入扵官府勾呼之費巳㱕扵蠹吏則知以催科取辦者初無益扵國而有害扵民然此亦非特守令之罪盖縁曩日監司多以催科責郡縣而不以撫字為先今欲乞所至郡縣訪問士民如守令善撫字者雖拙扵催科必舉不能撫字者雖健扵催科而必劾如是則郡縣皆循良之吏天下無凍餒之民矣一某每見州縣間凡遇監司經由多有士民率衆投牒舉留守令者兹非出扵民之本意也盖由時官自知其無善治恐見劾扵監司遂密遣胥吏喻鄊邑之豪族與士人之職于學校者唱率舉留士民亦欲以此交結時官求芘門戸遂粉飾虚詞指無爲有監司初不知覺乃以不賢爲賢從而舉之爲害非細今欲乞扵入境之初觀風問俗考其治迹賢否可知如有士民妄有舉留者稍加懲治以革欺㒺之弊一伏覩主上躬示敦朴爲天下先近日尤嚴銷金之禁以聞逺方弊尤未革盖有以装佛爲名而州縣不䏻禁止又有以銷鍮爲名而亦莫辨真偽今欲乞申明金翠服色之禁并装佛銷鍮之弊革之以賛一人之躬行以􅌋天下之風俗一切見瀕海郡縣塩爲民害最者昔州縣科塩自有定額其後有掊克聚歛之臣提煑海之職者倍増数目以為民患縣令兼塩場之任者又從而増之以僥倖功賞胥吏因縁為奸與鋪戸相見為弊扵所増額外多𢾗以科民間累經㙜部監司投牒陳理而郡縣多端壅隔其弊草去今𣣔乞委賢明郡守清强官属根治胥吏痛革多科之弊一每見監司按察州縣官吏逺出迎送所帯人從非一多為保甲寺觀之害今𣣔乞禁約官吏逺出迎送之弊一每見監司按察隨行人吏所至騷然誅求之害甚於狼虎今𣣔乞嚴行約束以絶騷擾之弊右州縣之弊非一某姑陳其大畧盖久䖏閭閻目見其事所陳八弊亦皆利害之大者儻有可采願賜施行與安撫論張侍郎論魯六傷犬契勘張侍郎論魯六等傷犬事蒙判魯六勘杖八十某切見魯六傷犬事渉不明廂界供証出扵符合張侍郎官居侍從心明法律必不肎以一犬之故誣害平民今来若将魯六断罪事属無辜深恐議者謂府属觀望輕人重犬不獨某坐誤断之罪其扵張侍郎名徳亦有所損所有魯六勘案尚未敢書伏候台旨與安撫監司論灾傷兹者伏見火灾流行大風淫雨継以怒濤漲為害害兹甚今據上虞縣供申有渰死者一百六十八人飄蕩屋宇者四百五十三家逃移者一百二十七戸禾苗腐爛顆粒不收人民困餓號泣待盡兼聞其他諸縣皆有灾傷除上虞縣供申外其餘並不見申到深恐邑官坐視不以恤民為意欲乞行下諸縣令各具灾傷申聞仍與措置賑䘏及乞以上虞等状申聞朝廷以廣聖主畏天灾䘏民隠之意某備貟幕職不敢不聞言渉狂妄皇恐死罪與都提舉論灾傷賑濟某伏覩今歲風水灾傷浙江之東越為最甚上貽宸念特加賑䘏某今有巳見輙條具如後乞賜詳酌施行一本府有紹興二十七年以前積欠稅租等数目非一今歲既不登民方艱食一年常賦猶無以輸積嵅逋負何從而出𣣔乞敷奏朝廷将積欠稅租權行倚閣俟来歲有秋仍舊輸納庶俾一郡生灵均被大恵一切見本府訟牒私債居多往往其間不實者半盖縁受理之門既啓虚妄之訢遂興至有増数目以求判賂胥吏以買直所負無㡬所廢不貲今歲方凶荒救死不贍若加以私債訟牒之擾則民之流亡餓踣者必多𣣔乞敷奏朝廷應新舊私債不問多寡並權放一年官司不得受理俟来秋豊稔依数盡償庶使貧民不致重困一灾傷去䖏蒙聖旨将義倉米賑濟仁恩廣大萬姓鼓舞某猶慮諸邑人戸有逃移扵未獲旨之前不知今日有賑濟之恩者或賣為奴婢或流為乞丐或匿為䑕竊殊可矜憫𣣔乞台慈委諸今佐廣行告諭招誘復業如家計物業悉巳破壊仍重加拯救無致失所以廣一聖主勤恤之意一風潮所壊海塘如前日上虞縣陳請之類依法合以食利人戸修築今濵海之民既被灾傷富者困貧者飢况工役廣大必難取辦扵食利之所不免役他鄊之民然又不䏻無怨𣣔乞台慈委自令佐或以官来或勸誘富民随多寡出榖或米日給升斗以顧之仍諭食利之戸時加犒勞方艱食之秋民幸扵得食而不惮扵出力雖非食利之民亦必欣然就役而不辭如是則修築之功不日可就定奪餘姚縣和買轉運司判下餘姚縣百姓魏皋等状理本縣和買不均之弊某等索到八縣所具和買利害一一看詳其餘姚縣所有不均屢興詞訢者盖縁本縣以苐一等止第四等科和買而苐五等不科物力及三十八貫五百文者為苐四等三十八貫四百九十九文者為苐五等由是狡猾人戸與鄊胥相見詭名隠寄减下等苐自經界至今方及十年物力赱弄巳及一半目今所𬋩物力比經界之後物力其上四等戸减退八萬餘貫流入苐五等戸其上戸所科和買比舊毎匹増八尺以上上户加少而和買日増下戸加多而和買不及非緣昔日人戸多富今日人户頓貧其弊實起扵規免科敷多端隠稅法今雖嚴不䏻禁遏詞訢之興盖生扵此切覩紹興十三年指揮比年上戸規迯物力往往折為下戸髙者既降下者遂升今後自第一等至第五等均敷以絶增减之弊又覩十五年戸部劄子欲且從苐一等至苐四等科敷以優恤下戸又云州縣逐䖏事体不同有以物力及百貫以上為苐五等者有以十貫以下為苐五䓁者如止令苐四䓁以上科敷物力少䖏實受其利物力多䖏又却併在四䓁以上却成偏重欲下轉運司今州縣相度随宜措置科折某䓁切見本府八縣其㑹稽山隂諸暨餘姚四縣和買遵十五年指揮止科及四䓁而下戸不科其􅌘縣新昌蕭山上虞四縣和買遵十三年指揮並科及下戸亦各無詞訢内新昌􅌘縣以物力十五貫以下上虞以二十貫以上蕭山以三十貫以上今餘姚縣百娃所理㑹和買不均及詭名减戸之弊除欲以田畞科不可施行外𣣔乞准十五年指揮随宜措置可扵新昌􅌘縣蕭山上虞四縣中斟酌髙下用二十貫以上和買庶得其中既有外縣巳行之例又合相度随宜之法物力三十八貫五百以下實多詭戸其弊可革二十貫以下者實係貧民不害優恤更合取自指揮施行定奪阿何訟陳友直契勘阿何訟陳友直不孝事陳友直状稻阿何係其父盛之妾其事已具案牘中阿何與陳盛以不正合係妾分明然在禮法中有嫡母庶母所生母乳母妾母阿何雖非陳盛之妻然在陳氏之家巳两有所出其陳盛當溺愛之時亦嘗以妻禮遇之某按春秋之法其父有以妾爲妻者先儒論之曰以妾爲妻之罪其父當尸之然父以爲妻其子不得不以爲母又按禮記内則父母有婢子父母没没身敬之不衰父母所愛雖父母没不衰今何氏雖爲陳盛之妾其陳友直當以妾母之禮待之有敬而不衰之義又按春秋婦人有三從在家制扵父既嫁制扵夫夫死從長子婦人不專行必有從也以嫡母之尊猶有制扵長子之義今阿何係陳友直妾母其家事不得自專出入當有所制今欲乞台旨押阿何㱕陳氏之家守孝俟其服滿如𣣔改嫁則従其便其所生子當育扵陳氏俟其長成依公分析陳友直當以妾母之禮敬待阿何不得故有凌辱其家事當由陳友直𬋩掌阿何不得自専庶扵經扵律皆無違礙定奪梁謙理分按梁綵有子八人内将一子與後弟縓為後是為梁謙綵死之後七子均分巳及十有七年今據梁謙状稱其所養父縓既死其所生父綵尚存之時所養母尹氏曽遣㱕宗合作八分析産其兄孝廉䓁供稱謙不曽扵父在日㱕宗兼巳受所養之家物産不當分所生兄弟之財今梁綵與尹氏皆巳身死謙㱕宗與不曽㱕無所慿據按禮經為人後者為之子又按律諸養子所養父母無子而捨去者徒二年若自生子及本生無子者聴又按紹興今諸為人後而還本生者聽注謂自𣣔還或所養父母遣還者今許自𣣔還盖謂本生無子或所養之家巳有子也許所養父母遣還者義亦如之今梁縓既無别子况綵所出甚衆謙義合継絶不當㱕宗尹氏既無所生亦不得遣謙還綵以絶夫後謙既不當㱕宗則亦不合受所生父母之産向来提刑司簽􅈦所定扵律巳當然律設大法禮順人情謙継叔父之後固不當㱕家至若分産則當䖏之以情可也縁梁縓死時謙年尚㓜尹氏典賣其夫物産從而改嫁破縓之家非謙之罪今謙所生兄弟皆富所飬之家巳貧謙既失所無㱕兄弟義當憐恤又按今諸分財産而衆議碩多與同分之人者聽此盖聖人縁情制法以開遜義之門今謙與孝廉䓁本係同父之親而有貧富不䓁之患雖謙出継叔之後不預同分孝㢘䓁合念父恩義當碩與今𣣔乞送縣告示孝㢘䓁七人将原分到産業毎人若干比並謙見管所養之家産業若干七人中各出産業揍謙見管産業如七人元分之数均退與謙其七人浮財恐係分後増置即不許分退孝㢘係是長兄身仍鬻爵合倡率諸弟遵碩與之今濟同氣之親謙仍舊継所生之後不得㱕宗以絶縓祀庶令梁氏一門稍知孝弟之義少息争競之風與趙安撫辞定奪切見近日下状之人多扵状後乞送某䖏定奪者以两争未决務在依公非下状人可得指定切慮其人與某䖏人吏預有計弊妄意指乞今後如出自台旨送下定奪者某當勉強理㑹不敢以不敏辝如下状人妄有指定即乞判送他所庶絶情弊與王安撫蒙台諭令撰二劄子不敢以鄙陋辞勉強承命乞賜斧削乃幸􅑼宫頻年興修震驚陵寝幽明不安公私受弊盖緣奉行者外以崇奉陵寝廟為名内有僥倖恩賞之意遂将巳成之宇撤而更造不損之器毀而更置不枯之木拔而再植其害非一端也去歲大修本府官吏頗有起貪功望賞之心妄生事端者某目撃其事而不敢言每思若一日獲迩清光當首論之雖死不避也尚書受主上之深知奉陛辞之玉音為越人之師帥者無惜為上言之干冐台嚴皇恐死罪與橋道頓逓使董侍郎萃某竊聞往歲徽宗皇帝梓宫御舟所至凡津梁堰閘並不毁壊今来伏聞大行皇太后梓宫御舟比舊加大城門橋堰之類勢不免毁某親見奉使侍郎言日者奉請以梓宫行甲方為利然毀民居多皇帝惻然曰兹豈求利耶特命行乙方主上仁孝之徳愛民之心如此臣庶感激至扵流涕某妄意欲乞侍郎申奏朝廷今来祗備梓宫御舟其丈尺之数乞依往歲徽宗皇帝御舟之例庶免毁壊以承主上皇帝仁孝之徳以遵大行皇太后慈儉之訓不勝幸甚某郡幕下僚妄議大事罪不容誅俯伏以待與直講史侍郎某輙有少禀皇子初建天下拭目以觀盛徳郎中直講以正人端士居師友之職宜以經術正其心以古今治亂興亡之迹為之勸戒養成器業以副一人付託之意如作詩一事乃書生氣習扵道徳亡𥙷姑可置之舊日篇章尤不宜播之扵外恐為人所議凡百要湏慎重庶無悔吝其蒙建王顧遇不淺且辱郎中厚知輙獻區區幸恕狂妄冒瀆之罪與宰相乞外任某仰沐陶鎔備貟中秘雖妻孥相随竊食而二弟皆在鄊閭累重家貧難以提挈扵某私計實為不便𣣔乞在外差遣以敦手足之愛伏望鈞慈特賜敷奏再與湯右相某前日面投劄子以私計不便欲乞陶鑄在外差遣未蒙敷奏切念某所乞實非得巳今主聖臣賢朝廷清明多士弹冠咸謂時不可失况舘職最為清選某以不才竊食其間豈所碩去實緣私計有所不便兼賤軀自八月間得肺疾至今痰嗽不除亦𣣔就外以便醫藥伏乞鈞慈早賜敷奏得一外任或岳祠差遣不敢有擇庶俾一門俱受保全之賜干冒鈞嚴某下情亡任激切戰懼之至辭建王某比蒙誤恩備貟小學教授曵居半載仰沐王慈顧遇有加感激無地苐媿不才殊無毫髮之補今朝廷擇賢而代輿論咸稱得人三觀察天資俱粹美佩服義方學問日進兹復得賢模範顧未易量劇爲賛喜某比屢求去未獲今復濫遷聞命驚懼方力辭免無繇躬詣王屏禀違下情無任依戀之至辭三觀察某獲與㳺從巳違半載自媿不才畧無所補遽成違逺劇用瞻依教授劉國博老成醇厚盖佳士也師友得人尤爲助喜某濫遷小著方此力辭面别無從敢兾仰体王慈力學自愛勉修忠孝上報君親某不勝區區之檮與陳左相辭免除著作佐郎某伏准省劄除某為著作佐郎仰沐鈞陶感激亡地某比縁私計不便屢入劄子乞外差遣未蒙敷奏今求去得迁聞命驚惧不䏻自巳𣣔乞鈞慈曲賜矜恤特與奏聞以寝新命庶使愚分稍安獲迯罪戾不勝萬幸與陳左相辞免除命乞外任某昨曽冐瀆鈞嚴辞免除命實縁求去未獲驟得美迁心不遑安非敢矯激雖小官不當辭職在前軰亦有故事伏望鈞慈特賜敷奏仍乞檢照某十月内乞外任劄子併賜施行再與陳左相某昨再瀆鈞嚴辞免除命伏蒙鈞旨以某官不當辞不與敷奏某有懐未盡湏至再陳竊謂小官雖不當辞在前軰亦有故事至和嘉祐間王荆公召除館職及命修起居注皆力辞不受當時非獨在下者䏻辞在上者亦容其辞荆公雖立朝事業不滿人意至辭受之際君子不以為非世謂王荆公辞小不辞大司馬温公辞大不辭小荆公辭小固無可議不辞大則為可罪温公不辞小者但謂小不必辞不謂小不當辞紹興初張侍郎子韶為著作亦以求去得遷辞至五六遂得外任惟秦太師當國不容士大夫辞職及求去習以成風遂至今日有辞免者則以為立異有求去者則以為沽名但云官不當辞不問事之可辞殊不知古人進退辞受惟問義理如何前軰故事不問官職髙下某今来所辞實縁求去未獲驟得美迁心不遑安非敢矯激伏帷僕射相公以道義事君以忠恕待下念某以私計不便而求去以求去得迁而力辞曲賜矜憐特與敷奏仍乞撿照某十月内節次乞外任劄子併賜施行與宰相論灾異某謹按春秋隠公九年三月癸酉大雨震電庚辰大雨雪周之三月即今之正月也榖梁曰八日之間再有大变隂陽錯行故謹而日之劉向曰雷未可以出電未可以見雷電既已見則雪不當復降皆失節也雷電陽也雨雪隂也雷出非其時者是陽不䏻閉隂氣縱逸而將為害也今月十五日戊子大雨雪而雷聲継作識者憂之春秋之時八日有變而聖人書之以為異今一日之間雷雪併作其為灾異比春秋為尤甚雷作而雪止是陽䏻勝隂也雷作而雪益甚是陽不勝隂之明驗也恭惟主上仰畏天変俯恤民隠放房錢以寛細民遣郎官以决滯獄固宜徳之動天不俟終日然而積雪不消止而復作逮今且十日矣豈應天當以實而小恵不足以弥灾耶某竊謂春秋所書必有事應先儒陽不䏻閉隂氣縱逸而将為害之語不可不察夫隂為夷狄為小人為宦官女子為群邪壅蔽上塞下聾之患天心仁愛吾君出灾異以警戒之者其在乎此僕射相公居爕調之任當任賢退不肖之責碩以春秋灾異之說為上力言之進君子退小人内修闕政外備強虜開闢言路以通下情閉隂縦陽以弥天變勿以天道為逺聖人之言為悠悠而不之畏也某比因輪對狂妄日虞罪戾固宜鉗口結舌不言時事而猶敢及此者盖區區憂國之心不能自巳以無路而告吾君不可以不告吾相雖由此獲罪固所不辭千冐鈞嚴下情無任皇惧之至與汪侍御某竊聞虜人千乘萬騎南牧中原迁都汴京窺伺淮甸中外洶洶咸以靖康覆轍為憂况侍御長風憲任言責其憂國之心當如之何某采之輿論咸謂禦敵之䇿莫如用人而人才可爲今日用者莫如張和公劉太尉劉巳易鎮京口亦可以當一面矣和公雖放令自便而猶未起廢伏聞侍御前日嘗扵榻前論薦人才而属意和公士夫傳聞莫不相慶第不知果䏻上囘天聴否亦嘗指其姓名而力言之否如天聴猶未囘侍御或未指其姓名當率諸公再對極力薦之如古人之進賢不進不巳主上好謀䏻聴侍御言聴諌行苐恐不言不患不受萬一不從則去就當自此决不可㣲啓其端而遽然中輟也某竊謂今日急難之際人主正當棄瑕用才人臣亦當棄平日之所悪而薦可用之才今之人才固有可用者矣然往往不能無過朝廷以其常經則後㙜諌論列而不敢用某區區之意欲侍御首以棄瑕用才之說上吿吾君且云雖經㙜諌論列而才可用者仰大臣侍從薦之不以過而廢才侍御既以身率之諸公必従而和之明天子必從而聴之如是則人才軰出可以制千里之難虜雖強且逼有不足憂者矣今日可言者無如侍御當言者無如侍御某誤受侍御之知是以敢進蒭蕘之說以爲開陳獻納之助伏望采而用之以幸天下與汪侍郎某昨晚與馮貟仲同詣台屏不獲瞻望苐深景仰即日伏惟台候萬福某迫切之懇仰沐台念前巳蒙廟堂相許朝夕俟命昨得薛季益報又稍遅似聞左揆之意謂王嘉叟方去不𣣔又将某文字上嘉叟以上書而出某以私計丐祠事体不同兼自去冬屢請至今未遂丞相愛惜士類意固甚善然君子愛人以徳與其留之以竊禄不如使其善去以保全之况某晚進不才在稠人中最為碌碌進退去留不足以為多寡今諸公求去皆遂其𣣔何苦扵某乃獨作難某扵要路諸公無一可告者惟侍郎又矜憐有素故不免喋喋以告切望早賜一言以賛其决庶今寒賤免致顛隮戴徳之誠寧有窮巳與二相乞祠某自去冬以私計不便及苦痰嗽之疾𣣔乞嶽祠以便醫藥節次入劄子及屢嘗面禀雖巳蒙鈞諾至今猶未獲命當聖賢相逢群才並進之日某備貟佐著事蕳職清豈不碩留以苟寸禄實縁久苦賤疾有妨職事私心迫切不䏻自巳欲乞鈞慈速賜敷奏陶鑄岳祠差遣一任感戴無窮某下情無任激切懇禱之至與張佐司比聞盗竊樞柄甚扵陽虎取寳玉大弓公首摧其奸與先正忠獻公斬范瓊曲端等何異天下無賢愚逺迩莫不称快知大賢之有後况我軰耶不有君子其䏻國乎真可為社稷賀也某卧病半年曰與死迫忽被誤恩巳力辭免更望力賜一言俾遂所請甚幸甚幸與虞丞相某抱病卧家久廢朝謁懵然不知時事昨晚忽聞左司張栻差知袁州不覺驚駭朝廷除授固自有意非某所得知苐以栻之學問操履舉皆過人在今朝列少見其比使之密侍經幄必䏻以直道啓迪聖君使之治劇剸煩亦䏻䖏紛擾而不乱况其直声巳著中外称賢一旦外除有識無不短氣朝廷舉内修外攘之政正當愛惜人才相公以道事君尤宜留賢自助敢乞扵榻前力賜主張令栻且留舊職庶㡬釋中外之疑伸善類之氣某素蒙相公知遇常碩少効㳙埃屬以疾病侵陵亡從躬伸賤悃區區之心不䏻自已輙此禀布萬一伏乞鈞察梅溪先生後集卷苐二十五
