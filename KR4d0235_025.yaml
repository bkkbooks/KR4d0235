body:
  text: 手劄與陸會稽修曹娥旌忠廟比以忠孝二廟曺娥旌忠為懇巳蒙重諾忠孝臣子大節人所難能二人遺躅皆屬會稽可謂千古盛事修廟崇祀以勸風俗正賢師帥之職俗吏苐以科催為急簿書獄訟為先自非吾儒孰肯留意于此聞曹娥廟巳命工矣旌忠之修費亦無幾不可復留以遺後人切望分念某嘗題曹娥廟及近撰會稽三賢詩併寫上呈與江山隂修愍孝廟比以修愍孝廟為懇特荷不外旌忠之修巳委陸會稽矣忠孝臣子大節死者人之所難蔡孝子以布衣能為人所難能之事有足嘉者而廟貌不稱深可嘆息修廟崇祀以勸風俗正賢師帥之職切望留念某近撰會稽三賢詩愍孝廟居其一焉併録上呈與趙安撫乞降祝版祀上虞舜廟據上虞縣尉陳迪功劄子稱本縣有帝舜廟一所父老相傳自置縣以來即有此廟兼縣有舜井象田百官等處古迹至多而一方水旱疾苦有請于廟無不響應合在祀興欲望台慈詳酌許令本縣每歲春秋僃辦牢醴從使府給降祝版遣官致祭少為大功明德之報本縣近巳具狀申府欲乞施行與邵提刑某兹者伏遇提刑郎中親乘使軺按察列郡某輒有巳見畫一具聞仰助澄清乞賜台覽一伏覩主上躬斷以來寬恤之詔下無虛日然而實惠未孚于民者蓋由守令不能奉行之弊昔人謂徒挂墻壁今則初未嘗挂凡遇詔下事有便于民而不便于吏者或宣畢而遂匿或略挂而遽收故上雖有良法美意下不得而知者多矣况欲被其惠邪今欲乞軺車所至盡録比年寬恤詔條榜示通衢使有目者咸得而覩其郡縣官吏有不張挂與徒挂而不奉行者首加案劾庶使朝廷實德下及元元一伏覩主上慎刑恤獄之意雖堯舜成康無以加然而措刑之效未逮于古者蓋由郡縣無循吏而囹圄多冤民切見州縣間常置禁曆二一曰正禁二曰寄禁每遇監司入境止將所鞠重囚書正禁曆其他囚悉附寄禁仍將所禁之人拘置僻所使不得聲冤又多令吏卒防其親戚使不得告訴俟監司既去囚禁如初今欲乞所至州縣榜示道路如有藏匿罪囚許人以告及搜索二曆備閲所禁之事取一二件親賜按問庶絶冤枉之弊一伏覩國家張官置吏本以為民要當以撫字為先催科次之今之所謂守令者專務催科殊無撫字之意蓋催科自有常法豈在以速辦為能官以未及期為辦事民當未及期而被擾輸納之稅未入于官府勾呼之費巳歸于蠹吏則知以催科取辦者初無益于國而有害于民然此亦非特守令之罪蓋緣曩日監司多以催科責郡縣而不以撫字為先今欲乞所至郡縣訪問士民如守令善撫字者雖拙于催科必舉不能撫字者雖健于催科而必劾如是則郡縣皆循良之吏天下無凍餒之民矣一某每見州縣間凡遇監司經由多有士民率衆投牒舉留守令者兹非出于民之本意也蓋由時官自知其無善治恐見劾于監司遂密遣胥吏喻鄊邑之豪族與士人之職于學校者唱率舉留士民亦欲以此交結時官求芘門戶遂粉飾虛詞指無為有監司初不知覺乃以不賢為賢從而舉之為害非細今欲乞于入境之初觀風問俗考其治迹賢否可知如有士民妄有舉留者稍加懲治以革欺罔之弊一伏覩主上躬示敦朴為天下先近日尤嚴銷金之禁以聞逺方弊尤未革蓋有以裝佛為名而州縣不能禁止又有以銷鍮為名而亦莫辨真偽今欲乞申明金翠服色之禁并裝佛銷鍮之弊革之以贊一人之躬行以􅌋天下之風俗一切見瀕海郡縣鹽為民害最者昔州縣科鹽自有定額其後有掊克聚斂之臣提煮海之職者倍增數目以為民患縣令兼鹽場之任者又從而增之以僥幸功賞胥吏因緣為姦與鋪戶相見為弊于所增額外多𢾗以科民間纍經臺部監司投牒陳理而郡縣多端壅隔其弊草去今𣣔乞委賢明郡守清強官屬根治胥吏痛革多科之弊一每見監司按察州縣官吏逺出迎送所帶人從非一多為保甲寺觀之害今𣣔乞禁約官吏逺出迎送之弊一每見監司按察隨行人吏所至騷然誅求之害甚於狼虎今𣣔乞嚴行約束以絶騷擾之弊右州縣之弊非一某姑陳其大略蓋久處閭閻目見其事所陳八弊亦皆利害之大者儻有可采願賜施行與安撫論張侍郎論魯六傷犬契勘張侍郎論魯六等傷犬事蒙判魯六勘杖八十某切見魯六傷犬事涉不明廂界供證出于符合張侍郎官居侍從心明法律必不肯以一犬之故誣害平民今來若將魯六斷罪事屬無辜深恐議者謂府屬觀望輕人重犬不獨某坐誤斷之罪其于張侍郎名德亦有所損所有魯六勘案尚未敢書伏候台旨與安撫監司論災傷兹者伏見火災流行大風淫雨繼以怒濤漲為害害兹甚今據上虞縣供申有淹死者一百六十八人飄蕩屋宇者四百五十三家逃移者一百二十七戶禾苗腐爛顆粒不收人民困餓號泣待盡兼聞其他諸縣皆有災傷除上虞縣供申外其餘並不見申到深恐邑官坐視不以恤民為意欲乞行下諸縣令各具災傷申聞仍與措置賑恤及乞以上虞等狀申聞朝廷以廣聖主畏天災恤民隱之意某備貟幕職不敢不聞言涉狂妄皇恐死罪與都提舉論災傷賑濟某伏覩今歲風水災傷浙江之東越為最甚上貽宸念特加賑恤某今有巳見輒條具如後乞賜詳酌施行一本府有紹興二十七年以前積欠稅租等數目非一今歲既不登民方艱食一年常賦猶無以輸積嵅逋負何從而出𣣔乞敷奏朝廷將積欠稅租權行倚閣俟來歲有秋仍舊輸納庶俾一郡生靈均被大惠一切見本府訟牒私債居多往往其間不實者半蓋緣受理之門既啓虛妄之欣遂興至有增數目以求判賂胥吏以買直所負無幾所廢不資今歲方凶荒救死不贍若加以私債訟牒之擾則民之流亡餓踣者必多𣣔乞敷奏朝廷應新舊私債不問多寡並權放一年官司不得受理俟來秋豐稔依數盡償庶使貧民不致重困一災傷去處蒙聖旨將義倉米賑濟仁恩廣大萬姓鼓舞某猶慮諸邑人戶有逃移于未獲旨之前不知今日有賑濟之恩者或賣為奴婢或流為乞丐或匿為鼠竊殊可矜憫𣣔乞台慈委諸今佐廣行告諭招誘復業如家計物業悉巳破壞仍重加拯救無致失所以廣一聖主勤恤之意一風潮所壞海塘如前日上虞縣陳請之類依法合以食利人戶修築今濵海之民既被災傷富者困貧者飢况工役廣大必難取辦于食利之所不免役他鄊之民然又不能無怨𣣔乞台慈委自令佐或以官來或勸誘富民隨多寡出榖或米日給升斗以顧之仍諭食利之戶時加犒勞方艱食之秋民幸于得食而不憚于出力雖非食利之民亦必欣然就役而不辭如是則修築之功不日可就定奪餘姚縣和買轉運司判下餘姚縣百姓魏皋等狀理本縣和買不均之弊某等索到八縣所具和買利害一一看詳其餘姚縣所有不均屢興詞欣者蓋緣本縣以苐一等止第四等科和買而苐五等不科物力及三十八貫五百文者為苐四等三十八貫四百九十九文者為苐五等由是狡猾人戶與鄊胥相見詭名隱寄減下等苐自經界至今方及十年物力赱弄巳及一半目今所𬋩物力比經界之後物力其上四等戶減退八萬餘貫流入苐五等戶其上戶所科和買比舊每匹增八尺以上上户加少而和買日增下戶加多而和買不及非緣昔日人戶多富今日人户頓貧其弊實起于規免科敷多端隱稅法今雖嚴不能禁遏詞欣之興蓋生于此切覩紹興十三年指揮比年上戶規逃物力往往折為下戶髙者既降下者遂升今後自第一等至第五等均敷以絶增減之弊又覩十五年戶部劄子欲且從苐一等至苐四等科敷以優恤下戶又云州縣逐處事體不同有以物力及百貫以上為苐五等者有以十貫以下為苐五等者如止令苐四等以上科敷物力少處實受其利物力多處又却併在四等以上却成偏重欲下轉運司今州縣相度隨宜措置科折某等切見本府八縣其會稽山隂諸暨餘姚四縣和買遵十五年指揮止科及四等而下戶不科其􅌘縣新昌蕭山上虞四縣和買遵十三年指揮並科及下戶亦各無詞欣內新昌􅌘縣以物力十五貫以下上虞以二十貫以上蕭山以三十貫以上今餘姚縣百娃所理會和買不均及詭名減戶之弊除欲以田畞科不可施行外𣣔乞準十五年指揮隨宜措置可于新昌􅌘縣蕭山上虞四縣中斟酌髙下用二十貫以上和買庶得其中既有外縣巳行之例又合相度隨宜之法物力三十八貫五百以下實多詭戶其弊可革二十貫以下者實係貧民不害優恤更合取自指揮施行定奪阿何訟陳友直契勘阿何訟陳友直不孝事陳友直狀稻阿何係其父盛之妾其事已具案牘中阿何與陳盛以不正合係妾分明然在禮法中有嫡母庶母所生母乳母妾母阿何雖非陳盛之妻然在陳氏之家巳兩有所出其陳盛當溺愛之時亦嘗以妻禮遇之某按春秋之法其父有以妾為妻者先儒論之曰以妾為妻之罪其父當尸之然父以為妻其子不得不以為母又按禮記內則父母有婢子父母沒沒身敬之不衰父母所愛雖父母沒不衰今何氏雖為陳盛之妾其陳友直當以妾母之禮待之有敬而不衰之義又按春秋婦人有三從在家制于父既嫁制于夫夫死從長子婦人不專行必有從也以嫡母之尊猶有制于長子之義今阿何係陳友直妾母其家事不得自專出入當有所制今欲乞台旨押阿何歸陳氏之家守孝俟其服滿如𣣔改嫁則從其便其所生子當育于陳氏俟其長成依公分析陳友直當以妾母之禮敬待阿何不得故有凌辱其家事當由陳友直𬋩掌阿何不得自専庶于經于律皆無違礙定奪梁謙理分按梁綵有子八人內將一子與後弟縓為後是為梁謙綵死之後七子均分巳及十有七年今據梁謙狀稱其所養父縓既死其所生父綵尚存之時所養母尹氏曽遣歸宗合作八分析産其兄孝廉等供稱謙不曽于父在日歸宗兼巳受所養之家物産不當分所生兄弟之財今梁綵與尹氏皆巳身死謙歸宗與不曽歸無所慿據按禮經為人後者為之子又按律諸養子所養父母無子而捨去者徒二年若自生子及本生無子者聽又按紹興今諸為人後而還本生者聽注謂自𣣔還或所養父母遣還者今許自𣣔還蓋謂本生無子或所養之家巳有子也許所養父母遣還者義亦如之今梁縓既無别子况綵所出甚衆謙義合繼絶不當歸宗尹氏既無所生亦不得遣謙還綵以絶夫後謙既不當歸宗則亦不合受所生父母之産向來提刑司簽􅈦所定于律巳當然律設大法禮順人情謙繼叔父之後固不當歸家至若分産則當處之以情可也緣梁縓死時謙年尚幼尹氏典賣其夫物産從而改嫁破縓之家非謙之罪今謙所生兄弟皆富所飬之家巳貧謙既失所無歸兄弟義當憐恤又按今諸分財産而衆議碩多與同分之人者聽此蓋聖人緣情制法以開遜義之門今謙與孝廉等本係同父之親而有貧富不等之患雖謙出繼叔之後不預同分孝廉等合念父恩義當碩與今𣣔乞送縣告示孝廉等七人將原分到産業每人若干比並謙見管所養之家産業若干七人中各出産業揍謙見管産業如七人元分之數均退與謙其七人浮財恐係分後增置即不許分退孝廉係是長兄身仍鬻爵合倡率諸弟遵碩與之今濟同氣之親謙仍舊繼所生之後不得歸宗以絶縓祀庶令梁氏一門稍知孝弟之義少息爭競之風與趙安撫辭定奪切見近日下狀之人多于狀後乞送某處定奪者以兩爭未決務在依公非下狀人可得指定切慮其人與某處人吏預有計弊妄意指乞今後如出自台旨送下定奪者某當勉強理會不敢以不敏辝如下狀人妄有指定即乞判送他所庶絶情弊與王安撫蒙台諭令撰二劄子不敢以鄙陋辭勉強承命乞賜斧削乃幸􅑼宫頻年興修震驚陵寢幽明不安公私受弊蓋緣奉行者外以崇奉陵寢廟為名內有僥幸恩賞之意遂將巳成之宇撤而更造不損之器毀而更置不枯之木拔而再植其害非一端也去歲大修本府官吏頗有起貪功望賞之心妄生事端者某目擊其事而不敢言每思若一日獲邇清光當首論之雖死不避也尚書受主上之深知奉陛辭之玉音為越人之師帥者無惜為上言之干冒台嚴皇恐死罪與橋道頓遞使董侍郎萃某竊聞往歲徽宗皇帝梓宫御舟所至凡津梁堰閘並不毁壞今來伏聞大行皇太后梓宫御舟比舊加大城門橋堰之類勢不免毁某親見奉使侍郎言日者奉請以梓宫行甲方為利然毀民居多皇帝惻然曰兹豈求利耶特命行乙方主上仁孝之德愛民之心如此臣庶感激至于流涕某妄意欲乞侍郎申奏朝廷今來祗備梓宫御舟其丈尺之數乞依往歲徽宗皇帝御舟之例庶免毁壞以承主上皇帝仁孝之德以遵大行皇太后慈儉之訓不勝幸甚某郡幕下僚妄議大事罪不容誅俯伏以待與直講史侍郎某輒有少稟皇子初建天下拭目以觀盛德郎中直講以正人端士居師友之職宜以經術正其心以古今治亂興亡之迹為之勸戒養成器業以副一人付託之意如作詩一事乃書生氣習于道德亡輔姑可置之舊日篇章尤不宜播之于外恐為人所議凡百要須慎重庶無悔吝其蒙建王顧遇不淺且辱郎中厚知輒獻區區幸恕狂妄冒瀆之罪與宰相乞外任某仰沐陶鎔備貟中祕雖妻孥相隨竊食而二弟皆在鄊閭纍重家貧難以提挈于某私計實為不便𣣔乞在外差遣以敦手足之愛伏望鈞慈特賜敷奏再與湯右相某前日面投劄子以私計不便欲乞陶鑄在外差遣未蒙敷奏切念某所乞實非得巳今主聖臣賢朝廷清明多士彈冠咸謂時不可失况館職最為清選某以不才竊食其間豈所碩去實緣私計有所不便兼賤軀自八月間得肺疾至今痰嗽不除亦𣣔就外以便醫藥伏乞鈞慈早賜敷奏得一外任或嶽祠差遣不敢有擇庶俾一門俱受保全之賜干冒鈞嚴某下情亡任激切戰懼之至辭建王某比蒙誤恩備貟小學教授曵居半載仰沐王慈顧遇有加感激無地苐愧不才殊無毫髮之補今朝廷擇賢而代輿論咸稱得人三觀察天資俱粹美佩服義方學問日進兹復得賢模範顧未易量劇為贊喜某比屢求去未獲今復濫遷聞命驚懼方力辭免無繇躬詣王屏稟違下情無任依戀之至辭三觀察某獲與遊從巳違半載自愧不才略無所補遽成違逺劇用瞻依教授劉國博老成醇厚蓋佳士也師友得人尤為助喜某濫遷小著方此力辭面别無從敢兾仰體王慈力學自愛勉修忠孝上報君親某不勝區區之檮與陳左相辭免除著作佐郎某伏準省劄除某為著作佐郎仰沐鈞陶感激亡地某比緣私計不便屢入劄子乞外差遣未蒙敷奏今求去得遷聞命驚懼不能自巳𣣔乞鈞慈曲賜矜恤特與奏聞以寢新命庶使愚分稍安獲逃罪戾不勝萬幸與陳左相辭免除命乞外任某昨曽冒瀆鈞嚴辭免除命實緣求去未獲驟得美遷心不遑安非敢矯激雖小官不當辭職在前輩亦有故事伏望鈞慈特賜敷奏仍乞檢照某十月內乞外任劄子併賜施行再與陳左相某昨再瀆鈞嚴辭免除命伏蒙鈞旨以某官不當辭不與敷奏某有懷未盡須至再陳竊謂小官雖不當辭在前輩亦有故事至和嘉祐間王荆公召除館職及命修起居注皆力辭不受當時非獨在下者能辭在上者亦容其辭荆公雖立朝事業不滿人意至辭受之際君子不以為非世謂王荆公辭小不辭大司馬溫公辭大不辭小荆公辭小固無可議不辭大則為可罪溫公不辭小者但謂小不必辭不謂小不當辭紹興初張侍郎子韶為著作亦以求去得遷辭至五六遂得外任惟秦太師當國不容士大夫辭職及求去習以成風遂至今日有辭免者則以為立異有求去者則以為沽名但云官不當辭不問事之可辭殊不知古人進退辭受惟問義理如何前輩故事不問官職髙下某今來所辭實緣求去未獲驟得美遷心不遑安非敢矯激伏帷僕射相公以道義事君以忠恕待下念某以私計不便而求去以求去得遷而力辭曲賜矜憐特與敷奏仍乞撿照某十月內節次乞外任劄子併賜施行與宰相論災異某謹按春秋隱公九年三月癸酉大雨震電庚辰大雨雪周之三月即今之正月也榖梁曰八日之間再有大變隂陽錯行故謹而日之劉向曰雷未可以出電未可以見雷電既已見則雪不當復降皆失節也雷電陽也雨雪隂也雷出非其時者是陽不能閉隂氣縱逸而將為害也今月十五日戊子大雨雪而雷聲繼作識者憂之春秋之時八日有變而聖人書之以為異今一日之間雷雪併作其為災異比春秋為尤甚雷作而雪止是陽能勝隂也雷作而雪益甚是陽不勝隂之明驗也恭惟主上仰畏天變俯恤民隱放房錢以寬細民遣郎官以決滯獄固宜德之動天不俟終日然而積雪不消止而復作逮今且十日矣豈應天當以實而小惠不足以彌災耶某竊謂春秋所書必有事應先儒陽不能閉隂氣縱逸而將為害之語不可不察夫隂為夷狄為小人為宦官女子為群邪壅蔽上塞下聾之患天心仁愛吾君出災異以警戒之者其在乎此僕射相公居燮調之任當任賢退不肖之責碩以春秋災異之説為上力言之進君子退小人內修闕政外備強虜開闢言路以通下情閉隂縱陽以彌天變勿以天道為逺聖人之言為悠悠而不之畏也某比因輪對狂妄日虞罪戾固宜鉗口結舌不言時事而猶敢及此者蓋區區憂國之心不能自巳以無路而告吾君不可以不告吾相雖由此獲罪固所不辭千冒鈞嚴下情無任皇懼之至與汪侍御某竊聞虜人千乘萬騎南牧中原遷都汴京窺伺淮甸中外洶洶咸以靖康覆轍為憂况侍御長風憲任言責其憂國之心當如之何某采之輿論咸謂禦敵之䇿莫如用人而人才可為今日用者莫如張和公劉太尉劉巳易鎮京口亦可以當一面矣和公雖放令自便而猶未起廢伏聞侍御前日嘗于榻前論薦人才而屬意和公士夫傳聞莫不相慶第不知果能上回天聽否亦嘗指其姓名而力言之否如天聽猶未回侍御或未指其姓名當率諸公再對極力薦之如古人之進賢不進不巳主上好謀能聽侍御言聽諌行苐恐不言不患不受萬一不從則去就當自此決不可微啓其端而遽然中輟也某竊謂今日急難之際人主正當棄瑕用才人臣亦當棄平日之所惡而薦可用之才今之人才固有可用者矣然往往不能無過朝廷以其常經則後臺諌論列而不敢用某區區之意欲侍御首以棄瑕用才之説上告吾君且云雖經臺諌論列而才可用者仰大臣侍從薦之不以過而廢才侍御既以身率之諸公必從而和之明天子必從而聽之如是則人才輩出可以制千里之難虜雖強且逼有不足憂者矣今日可言者無如侍御當言者無如侍御某誤受侍御之知是以敢進芻蕘之説以為開陳獻納之助伏望采而用之以幸天下與汪侍郎某昨晚與馮貟仲同詣台屏不獲瞻望苐深景仰即日伏惟台候萬福某迫切之懇仰沐台念前巳蒙廟堂相許朝夕俟命昨得薛季益報又稍遲似聞左揆之意謂王嘉叟方去不𣣔又將某文字上嘉叟以上書而出某以私計丐祠事體不同兼自去冬屢請至今未遂丞相愛惜士類意固甚善然君子愛人以德與其留之以竊祿不如使其善去以保全之况某晚進不才在稠人中最為碌碌進退去留不足以為多寡今諸公求去皆遂其𣣔何苦于某乃獨作難某于要路諸公無一可告者惟侍郎又矜憐有素故不免喋喋以告切望早賜一言以贊其決庶今寒賤免致顛隮戴德之誠寧有窮巳與二相乞祠某自去冬以私計不便及苦痰嗽之疾𣣔乞嶽祠以便醫藥節次入劄子及屢嘗面稟雖巳蒙鈞諾至今猶未獲命當聖賢相逢群才並進之日某備貟佐著事蕳職清豈不碩留以苟寸祿實緣久苦賤疾有妨職事私心迫切不能自巳欲乞鈞慈速賜敷奏陶鑄嶽祠差遣一任感戴無窮某下情無任激切懇禱之至與張佐司比聞盜竊樞柄甚于陽虎取寶玉大弓公首摧其姦與先正忠獻公斬范瓊曲端等何異天下無賢愚逺邇莫不稱快知大賢之有後况我輩耶不有君子其能國乎真可為社稷賀也某卧病半年曰與死迫忽被誤恩巳力辭免更望力賜一言俾遂所請甚幸甚幸與虞丞相某抱病卧家久廢朝謁懵然不知時事昨晚忽聞左司張栻差知袁州不覺驚駭朝廷除授固自有意非某所得知苐以栻之學問操履舉皆過人在今朝列少見其比使之密侍經幄必能以直道啓迪聖君使之治劇剸煩亦能處紛擾而不亂况其直聲巳著中外稱賢一旦外除有識無不短氣朝廷舉內修外攘之政正當愛惜人才相公以道事君尤宜留賢自助敢乞于榻前力賜主張令栻且留舊職庶幾釋中外之疑伸善類之氣某素蒙相公知遇常碩少效涓埃屬以疾病侵陵亡從躬伸賤悃區區之心不能自已輒此稟布萬一伏乞鈞察梅溪先生後集卷苐二十五
