body:
  text: 雜文㳺天衣詩序紹㒷戊寅冬十有一月己邜日南至後二日㳺天衣者八人皆前進士宦㳺于越者黎明戒装集于賀監之故居天氣既佳愛日𥘉長籃輿出蠡城之南道乎稽山之隂徉徜乎秦望鑑湖千岩万壑之間有松隂十里林麓静深山轉径迂烟藹出沒𥘉行若迷俄有鍾罄声出乎翠㣲之端盖天衣寺也十峯堆秀双澗涵碧朝陽法華二峯尤蒼然蔪絶乎其中寺有唐人李㤗和徐季海元㣲之白樂天李公垂諸作者詩文其碑刻尚無恙有化身普賢飛耒銅像蕭梁衣鉢双烏故事緇徒頗䏻道之方杖屨尋幽有府吏将使君之命餉以百榼既拜賜有㪯杯而言者曰今日之集盖不偶然也昔王謝蘭亭之逰群賢少長畢集可謂雅㑹矣然賦詩不就者十有六人豈若吾㑪臭味之同㳺從之勝乎白衣之来非王洪之酒乃楚元之醴也歡其可以不記扵是㪯白飛觴唱酬交作雜以諧笑咸有餘適僧有勸㳺雲門者夕陽薄山遂不果往乃舍車聮騎探梅而還晚集于泮宫飲文字也𥘉登山某首賦一章同行即席而和既而吟詠者多不記萹目遂列書于招提諸公命某序之送喻叔竒尉廣徳序韓退之之留孟東野也其詩有曰昔年因讀李白杜甫詩長恨二人不相從吾與東野生並世如何復躡二子蹤某𥘉疑退之言為夸及觀城南諸聮句豪徤險恠其筆力畧相當使李杜復生未必不引避路鞭也然後知復躡之語為非過又讀其末章有曰吾願身為雲東野变為龍四方上下逐東野雖有别離無由逢扵是又知二公心相如氣味相得至欲相與為雲龍而不忍有離别真可謂古之善交者某丙子冬與繡川喻叔竒同舍上庠一見如故明年同登太常苐又明年賛幕㑹稽叔竒耒㳺大帥王公嘉其為人屈以攝職予遂獲朝夕焉論文賦詩相得愈厚盍簮纔百日唱和無慮百數萹叔竒之詩清新雅徤有晋宋風味得韓公之豪無東野之寒予不逮逺甚然予二人者有唱必酬殆亡虚日樽酒細論文之外語不及他亦庶㡬復躡古作者蹤矣㑹叔竒赴官桐川行甚遽予惘然惜別行觴既開􅌐駒在門扵是誦醉留之萹歌雲龍之句㠯贈之至若清白㠯䖏已忠勤以蒞事不枉道苟合以干進兹固叔竒素斈而優為者亦某之所素期而深望者姑小試扵筮仕之𥘉奉㠯周旋扵終身出䖏行蔵之際其為復躡古人之蹤又不止乎絺章繪句間也叔竒勉之紹㒷戊寅吉日東嘉王某序送葉秀才序吾鄊誼理之斈甲扵東南先生長者聞道扵前以其師友之淵源見扵言語文字間無非本乎子思之中庸孟子之自得以詔後斈士子群居斈校戦藝場屋筆横渠而口伊洛者紛如也取科第登仕籍冨貴其身光大其門者往往多自此塗出可謂盛矣然君子之斈為道小人之斈為利談誼理而媒青𬗋果為道乎為利乎吾聞洙泗之徒有堂堂乎張者欲斈干禄夫子不以其禄之不可干而闢之也而告之曰言寡尤行寡悔禄在其中矣古人之斈也謹言行而禄自至修天爵而人爵自從所謂誼理者在是予假守楚東鄊人葉生䖏和者亦客㳺是邦毎暇日過予扵郡齋音琅然而可聴議論粲然而成文仰其所藴皆吾鄊師友淵源之斈也䖏和早䘮二親䏻刻苦自立友愛諸弟急難之念不頃刻忘懐其扵所斈豈口耳云者今将之武林就秋賦求贈言以行吾謂生之斈問議論文采取一苐不足道贈人以言而勉之科苐是亦利而巳矣何異市井相與言耶若夫謹言行而禄在其中脩天爵而人爵從孔孟所謂義理者在是慁子之苐雖不足道亦不䏻外是而得之也敢不以告乾道乙酉五月二十二日永嘉王某序蔡端明文集序文以氣為主非天下之剛者莫䏻之古今䏻文之士非不多而䏻傑然自名扵世者亡幾非文不足也無剛氣以主之也孟子以浩然充塞天地之氣而發為七萹仁義之書韓子以忠犯逆鱗勇叱三軍之氣而發為日光玉㓗表裏六經之文故孟子闢楊墨之功不在禹下而韓子觝排異端攘斥佛老之功又不在孟子下皆氣使之然也若二子者非天下之至剛者欤國朝四葉文章尤盛歐陽文忠公徂徕先生石守道河南尹公師魯莆陽蔡公君謨皆所謂傑然者文忠之文追配韓子其剛氣所激尤見扵責髙司諫書徂徕之氣則見扵慶暦聖徳頌師魯則見扵願與范文正同貶之書君謨則見扵四賢一不肖詩嗚呼使四君子者生扵吾夫子時則必無未見剛之歎而乃同出扵吾仁祖治平醇厚之世何其盛欤夫以㙜諌之風采朝士莫不畏其筆端自侍從而下奔走伺候其門者紛然也文政鄱陽之貶余尹歐既與之同罪矣蔡公乃扵四賢相継黜謫之後形扵歌詩而斥為不肖羞其見搢紳之靣而辱甚市朝之撻則公之剛又可知也某𥘉見其詩扵張唐英所撰仁宗政要甚歆慕之其後見公文集乃沒而不載竊以為恨乾道四年冬得郡温陵道出莆田望公故居裵囬顧嘆而不忍去入境訪公遺迹則首見所謂萬安橋者與大書深刻之記争雄且深惜其有済川之才而不至扵大用登愛松堂九日山則又見公之詩與其真蹟猶在凛然有生意如見其正顔色坐黄堂時也盖公至和嘉祐間甞兩守是邦至今泉人稱太守之賢者必以公為首求其遺文則郡與斈皆無之可謂缺典矣於是移書㒷化守鍾離君松傳君自得訪扵故家而得其善本教授蔣君雝與公同邑而深慕其為人手校正之鋟板扵郡庠得古律詩三百七十奏議六十四雜文五百八十四而以四賢一不肖詩置諸卷首與奏議之切直舊所不載者悉編之比他集為最全且属予序之子曰端明公文章文忠公甞称其清道粹羙後雖有善文詞好議論者莫䏻改是評也予復何云然竊謂文以氣為主而公之詩文實出扵氣之剛入則為謇諤之臣出則為神明之政無非是氣之所寓斈之者冝先涵養吾胷中之浩然則彂而為文章事業庶幾無媿扵公云五年十月永嘉王某叙䟦陳忠肅公手帖忠肅公心畫勁徤類其為人公孫徳齡予同年也文翰有家法他日必䏻嗣其風烈紹㒷辛巳孟冬䟦季仲黙詩仲黙予姑之子也與予同年生少予二十日自総角同筆硯相得最甚弱冠從林先生師禹扵金谿時大梁孫皜子尚㳺吾鄊年少有俊才䏻歌詩予二人辱與之交遂各出所作詩編為集閱歲既乆謂以失之至隆㒷甲申夏四月壬戌予兒聞詩暴蠧書得舊稿遺墨如故而子尚在鬼錄巳二十餘年仲黙化去亦一星終矣予流涕讀之仲黙詩雖不多然皆憂囯傷時慷慨竒男子語使天假之年有禄位于朝攄其素藴决不為脂韋軟孰軰也舊㳺從者八人有八叟之號仲黙號劲叟其後劉銓全之鎮長方毛宏叔度與予皆相継塵忝仲黙才氣不在人下獨不霑一命而死悲夫予因錄其詩詞凢二十六首及予和仲黙與孫子尚姜渭叟二詩于後示其子徽俾家蔵之以貽後人䟦温公帖温公盛徳大業非東坡大手筆不䏻形容措国扵太山之安今扵流水之原後人欲識元祐之治其大要如此乾道乙酉後重陽六日又孟子曰欲為君尽君道欲為臣尽臣道觀宣仁所問温公所對可謂各尽要道真尭舜君臣也乾道改元後重陽一日䟦二劉帖二劉先生直諒多聞如西京子政歆軰不足多也敬觀心畫如見偉人丁亥十二月書䟦王僉判植詩秦氏以囯事讎非和也三綱五常之道滅矣何足以語春秋當時士大夫䏻力争者無㡬惟胡君邦衡慨上請劍之書至今讀之令人増氣且令後世不謂我宋無人可謂有功扵名教矣王君十詩引春秋尊王以譏切時事韙矣然扵邦衡詆為小吏寡謀豈詩人之語固自有深意耶乾道三年七月十四日書䟦余㐮公帖某自㓜知慕四賢之為人頃守番陽祠范文正公而記之過夷陵謁歐陽文忠公祠而賦詩有慶暦四賢今見兩之句兹至鄂渚又獲觀余㐮公之勁畫如見其風采動朝端時亦足以慰平生之所慕矣䟦馮員仲帖員仲天下士也負有用之才懐許囯之忠而不獲究其萬一命矣夫雖困扵讒而死扵不幸然知已數公皆一代之傑亦可以無憾矣其徒陳君季習出示詩文手帖流涕讀之乾道三年六月䟦霍懷州傳予毎嘆金虜之禍中原比唐安史之乱為甚唐守土之臣死事者頗多靖康間独寂寥無聞何耶今始見何子應作霍懷州傳捨生取義名節凛然可與睢陽二公同称烈丈夫矣丁卯四月䟦王夷仲送行詩軸夷仲校書予同年兄也政事文章皆過人一等三年間兩見之于双溪慷慨論世事相勉必以名節予守䕫子夷仲㳺道山同年梁介子紹過䕫得其書梁論舘閣人才以夷仲為称首既而以勇退聞夷仲之退豈果為病邪嗚呼萬里靣目書墨猶未乾而夷仲死矣其子過霅川出舘中送㣔詩讀之流涕端人不易得非區區交友之私也乾道三年十月十日書䟦杜祁公帖杜正献公號清白宰相見其心畫令人起敬如見其正色立朝時也乾道戊子孟夏書䟦蔣元肅夢仙賦樸鄊子作夢仙賦詞新意古超出翰墨蹊徑外盖司馬長卿賦大人李太白大鵬之類可謂飄飄有凌雲氣冝與神㳺扵八極之表也然予鄙陋之文何足以當之其乱日讀故書期以十年乃敢請所未見非樸卿自謂也盖勉予所未至抑亦詞人勸百諷一之㫖耶乾道己丑八月二十二日䟦張侍郎帖張公子韶一代儒宗斈者所共尊仰某恨不識之吾鄊陳君開祖以斈問文采受知扵公為最厚其子出示手帖二十𥿄凛然正直之氣見扵詞翰間愛其人敬其書携以適閩乆而後帰之乾道巳丑十月二日䟦嚴伯威墨蹟僧嚴公字伯威温州樂清人予祖母賈氏兄也性敏悟道行孤潔斈兼禅教為緇林所推重州郡迫以住持終身不就愽通儒斈尤工詩文識者謂不减恵勤道潜之流苐無知巳如歐蘇二鉅公耳㳺戯翰墨亦極其妙毎片𥿄出入爭宝之有集曰潜澗卒于政和壬辰至乾道己丑五十有八年矣有横陽章彬秀才得其所書唐宋詩八幅至泉南以献予郡博士蔣君雍見而竒之請刋于泮宫以廣其傳陳教授登予同年進士最善書亦謂近世所無也冬十一月戊午書䟦孫尚書張𬗋㣲帖孫公尚書四朝文傑張公𬗋㣲當代才子孫尤長扵簡尺張翰墨妙天下某晚軰恨不識尚書公比守霅川得公二書時年幾九十而詞源筆力不衰如此張帥長沙某移書求貢院字笔畫雄徤用扵湖泉二州觀者壮之其所荅書詞翰俱絶明年二公皆在鬼録其既不獲瞻尚書之履又嗟𬗋㣲郎之不永世見其蹟思其人軸而蔵之欲刻未果石似之察判見而喜之假之以帰刋於其家以廣其傳可謂樂善好事矣乾道六年三月庚午書于泉南郡齋曰義堂銘郎莫君子蒙将漕湖北永堂名扵過客王某以曰義名之銘曰部使者之職莫重扵計㙜居是職者以桑大夫之心計劉士安之鞭筭為善理財一於財而不以義特聚歛之臣尔非特為民之蠧是亦為身之災易曰理財正辞禁民為非曰義居是職坐是堂而無媿是名者其賢矣㢤鑑湖說上東坡先生甞謂杭之有西湖如人之有目某亦謂越之有鑑湖如人之有腸胄目瞖則不可以視腸冑秘則不可以生二湖之在東南皆不可以不治而鑑湖之利害為尤重昔東漢太守馬臻之開是湖也在㑹稽山隂二縣界中周回三百五十餘里溉田九千餘頃湖髙田丈餘田又髙海丈餘水少則泄湖帰田水多則泄田帰海故㑹稽山隂無荒廢之田無水旱之患者以此自漢水和以来更六朝之有江東西晋隋唐之有天下與夫五代錢氏之為囯有而治之莫敢廢也千有餘年之間民受其利博矣乆矣至囯朝之㒷始有盗湖為田者然其害猶㣲盗扵祥符者纔一十七户至慶暦間為田四頃而巳當是時三司轉運司猶切貴州縣使復田為湖自是而後官吏因循禁防不謹姦弊日起侵盗愈多至于治平熈寕間盗而田之者凢八千餘户為田盖七百餘頃而湖侵廢矣然官亦未甞不禁而民亦未敢公然盗之也政和未有小人為州内交權幸專務為應奉之計遂建議廢湖為田而歲輸其所入于京師自是姦民豪族公侵强據無復忌惮所謂鑑湖者僅存其名而水旱災傷之患無歲無之矣今占湖為田盖二千三百餘頃歲得租来六萬餘石為官吏者徒見夫六萬石之利扵公家也而不知九千頃之𬒳其害也知九千頃之歲𬒳其害而巳而不知廢湖為田其害不止扵九千頃而巳也盖鑑湖之開有三大利廢湖為田有三大害山隂㑹稽昔無水旱之患者鑑湖之利也今則無歲無灾傷盖天之大水旱不常有也至若小水旱何歳無之自廢湖而為田毎歲雨稍多則田巳淹沒晴未乆而湖已枯竭矣說者以為水旱之患雖及扵九千頃之田而公家實受湖田六萬石之入嗚呼其亦未之思也夫災必訴訴必檢檢必放得湖田之租失常賦之入所得所失相去幾何官失常賦而以湖田𥙷折之猶可也九千頃之民田其所失者不可計其何以𥙷折之耶王者以天下爲家其常賦所入亦廣矣豈利夫六萬石之入而以病民耶况湖田之入在今日雖饒而他日亦将同九千頃而病矣使湖尽廢而爲田則湖之爲田者其可耕乎今之告水旱之病者不獨九千頃之田也雖湖田亦告病也况他無鑑湖則九千頃之膏腴與六萬石所入之湖田皆化爲黄茅白葦之場矣越人何以爲生耶此其爲大害一也鑑湖三百五十八里之中蓄諸山三十六源之水歲雖大涝而水不䏻病越者以湖䏻受之也今湖廢而爲田三十六源之水無吞納之地萬一遇積雨浸淫平原出水洪流滔天之歲湖不䏻納水無所帰則必有漂庐舍敗城郭魚人民之患甞聞紹㒷十有八年越大水五雲門都泗堰水髙一丈城之不壊者幸也假令他日湖廢不止扵今而大水甚扵往歲則其爲害當如何此廢湖爲田其爲大害二也自越之有鑑湖也歲無水旱而民足扵衣食故其俗號爲易治何以知其然也以守令而知之也自東都以来守㑹稽令山隂者多以循吏称見扵史傳者不可一二㪯也非昔之守令皆賢也盖民居樂歲之中室家温飽民之爲善也易尓比年以来獄訟繁㒷人民流亡盗賊多有皆起扵無年去秋災傷之訟山隂㑹稽為尤多非昔之民皆善良今之民皆頑鄙也盖礼義生扵生扵飽煖盗賊起扵飢寒其勢不得不然耳此廢湖為田不獨九千頃受其病獄訟之所以㒷人民之所以流盗賊之所以生皆此之由其為大害三也自祥符慶暦至今建復湖之義者多矣而湖卒不䏻復非湖之不可復也盖異議者有以揺之也異議得以揺之者盖亦建議者之未䏻深究夫利害焉耳建議者曰廢湖為田則九千頃𬒳水旱之害湖不可以不復異議者曰九千頃雖𬒳水旱之害而常賦不尽失以湖為田而官又得湖田之利為多湖雖廢而何害且多為異說以揺之此建議者之言卒奪夫浮議者之口使建議者灼然知夫三大利害之所在以折夫異議者之云云則復田為湖有不可得而巳也鑑湖說下夫廢湖為田有三大害復田為湖有三大利湖固不可以不復也然亦有三難揺扵異議一難也工多費廣二難也郡守數易三難也今之占湖為田者皆權势之家豪強之族也侵耕盗種為日巳乆一旦欲奪而復之彼必㳺談聚議妄陳利害曰劳民也費財也失官租也有科率之優也無積土之地也爭為異說以沮害之官吏方堕於因循苟且之習復為氣力多口舌者之所動移而欲兾成功扵歲月之乆可乎此揺扵異議一難也昔人常計濬湖之工矣日役五千人濬至五尺當十五歲而畢至三尺當九歲而畢張伯玉之説夫用工如此之多歴年如此之乆其為費如何今越不濬湖而財用猶不給况㒷至大之役有不貲之廢耶此工多用廣二難也守令之扵郡邑乆任則可以立事數易則不䏻成功况鑑湖之開非一歲一時之所䏻畢今之為守者或一歲而遂迁或半歲而遽易湖之利害不暇問焉䏻知不䏻知遑暇治其間慨然有志扵開復者功未及施而去計巳迫矣後来者所見不同復变前議以數易之守而欲㒷浩大悠乆之役可乎此郡數易三難也湖有三不可不開而厄扵三難開是終無䇿以開之耶某切謂欲遏浮議則不可不白利害扵朝廷主之雖異議紛然但莫之䘏可也如向者經界之行扵天下固有不樂其事而欲動揺之者多矣然經界卒行而民受其利盖朝廷主之則事無不可成者况一鑑湖耶彼異議者不過曰劳民費財耳夫劳民費財㒷無用不急之務則不可如鑑湖之利害如此謂之無用不急可乎自湖之廢也歲多災傷細民艱食今扵農事之隙慕民濬治官出財民出力兩有所利民雖劳而不惮財雖廢而不虚矣彼不過曰官失湖田之租民有科率之優夫鑑湖之開千有餘歲矣昔無湖田之租有囯者不以不足爲病豈今日獨少此耶况湖既復而民利㒷災傷不作而常賦不失民無㐫荒之訴官無檢放之患較其所得與今孰多至若錢米之費當一出扵官而不取扵民竹木之具雖資之扵民而尽酬其直胥吏都有從而優民者則嚴法令以治之尚何科率之憂耶越人多謂湖可開也而土無所帰是不難積其泥塗以為丘阜昔呉長文常論之矣今湖之側曠地固多擇其利便随其逺近而丘阜之土非所患也欲沮濬湖之計者不過數者之說而皆有以取之尚何浮議之䘏耶謂日役五千人濬至五尺十五歲而畢者盖通三百五十里之間而計之也某謂今之濬湖固未䏻㪯三百五十里之内而尽復之也湖自熈寕以来建議者立两存之說有牌内牌外之限今牌尚存而牌内亦盗而為田矣為今日計者當先復牌内之湖其用工固有間自牌之外當以漸治之可也所費之財自本府經畫外又當請扵朝乞毎歲湖田所入之米以為雇工㒷役之費朝廷捐六萬石之米不足以為多寡越得此以辦事則沛然有餘矣欲復田為湖必當遅以歲月之乆有乆㒷之役無乆任之守以主之則異議一揺而事必中輟是又當請扵朝置開湖一司扵越命守倅帶提㪯主管之職如勸農斈事之類又命二知縣分董之舊日㑹稽山隂知縣皆帯提㪯鑑湖事守既職其事則必任其責雖迁易不常而後来者不得不継非正術同也盖職使然也又有倅終任以管其事令終任以董其役則責有所帰又命監司督察賞罰之俟湖成之日凢主其事董其役者皆次苐加賞如是則湖不患其不復也昔論復湖之利害者多矣莫如曽子固子固之言曰謂湖不必復者曰湖田之入固饒矣此㳺談之士為利扵侵耕者言之也使湖尽廢則湖田亦旱矣謂湖不必濬者曰益隄壅水而巳此好辨之士為樂聞苟簡者言之也以地勢較之壅水使髙必敗城郭矣二者既不可用而欲禁侵耕開告者則有賞罰之法矣蔣堂欲謹水之蓄泄則有閉縦之法杜𣏌欲痛絶敢田者則㧞其苟責其力以復湖而重其罰又有法矣杜𣏌或欲任其責扵州縣與轉運使與提點刑獄吴奎或欲以毎歲農隙濬湖吴奎或欲禁田石柱之内者又皆有法矣張伯玉欲知濬湖之淺深用工㡬何為日幾何欲知増隄竹木之費幾何使之安出張伯玉欲知濬湖之塗泥積之何所吴奎又以計之矣欲知工起之日或浮議或揺役夫内潰則不可以必其成張伯玉又已論之矣子固誠䏻収衆說而考其可否用其可者而以在我者潤澤之令言必行法必㪯則何功之不可成何利之不可復㢤子固昔甞倅越知鑑湖之利害為詳而其言有足取者故并記其畧有䏻㪯行子固之言而不棄某之兩則湖庶乎其可復不然姑存其說以俟馬太守再生可也別院省試䇿問二首問自古帝王圖天下之大業必貴乎好謀而䏻断謀固不易而断爲尤難謀之扵新固不若謀扵舊也然孫權之拒曺操吴人以衆寡不敵爲憂張昭爲定䇿舊臣乃勸權迎之果從其謀其䏻成赤壁之功建鼎峙之囯乎謀之扵寡固不若謀扵衆也然憲宗之伐淮蔡卿士莫随扵議伐之𥘉小大並疑扵既伐之後使帝惑群議而不任忠臣其䏻成破賊之功振唐室之威令乎謀之扵少固不若謀之扵老也然世宗欲親征劉旻馮道以四代之老力諌其行果從其謀其䏻成髙平之捷而北取三関乎謀之扵下固不若謀之扵左右大臣也然澶淵之役大臣有欲避其鋒而勸幸吴蜀者當時苟從其謀天下幾乎其不分裂乎夫囯有大疑謀之扵舊謀之扵衆謀之扵老謀之扵大臣可也彼三章聖皇帝乃違其所宜從之謀而以之取勝何耶豈群謀有不足取而断之以獨見之明耶抑當時運籌幃幄之臣固有出人意表者耶共惟主上以聖徳受禅天下同心戴之蠢兹醜虜尚敢不恭天地神人罔不憤怒疆埸之事上貽宵旰之憂議者謂欲㒷師以拒之命将以伐之耶則有以力非其敵如吴人之惧魏唐人之慮淮蔡者謂冝親屈萬乗以征之耶則又慮䇿非萬全必有異議如顯徳景徳之臣者彼其心皆出扵憂囯特其所見有不同持不同之論而紛然扵人主之前則謀将孰從而断将安出耶諸君抱甽畝惓惓之患乆矣必有竒䇿可以済世群試春官盖得言之秋也願詳論前古好謀䏻断之君其事孰可行於今者有司将采而獻焉以賛雄断問非建功立名之士無以排禍乱而闢土疆非守節死義之士又無以折姦邪而扶持宗社二者皆有囯之所急不可不兼崇而並尚也議者謂西漢有功名而無節義東漢有節義而無功名兼之者其三囯人才乎抑甞即固曄夀之史而攷之三者之說似非至論西京有折而不撓號近古社稷臣者有寝淮南之謀懐甽畝之志者非節義與東都有感㑹風雲上應列宿者有舉空朝廷投筆取封侯者非功名與三囯人才固多矣傑然乎其間者殆不過數子蜀諸葛亮固天下竒才也然史氏謂其連年動衆未䏻成功兵機将畧非其所長功名亦少貶矣魏荀或固有王佐風也然論者譏其恊規曺氏氏以傾漢祚機鍳先識未充其志節義亦少貶矣吴周瑜魯肅建獨断之明出衆人之表智畧俱可称也然或謂赤壁之役瑜獲虚名荆州之借乃肅之短功名節義又果䏻兼之否謂西漢無節義東漢無功名非厚誣與謂三囯兼兩漢所長非溢羙與我祖宗之世人才軰出功名節義爲兩全視兩漢三囯爲逺過自艱難以来不惟兼全者無䏻以所長見称亦亡幾視兩漢三囯爲有媿主上側席求賢昔囬恢復正有志之士建功立節之秋也敢問何以排禍乱而復土疆何以折姦謀而扶宗社死者可作其誰與帰願摭前史并國朝人才而併論之将以觀諸君筮仕之志經筵故事唐書魏證傳太宗問證爲君者何道而明何失而暗證曰君所以明兼聴也所以暗偏信也堯舜氏闢四門明四目逹四聡雖有共鯀不䏻塞也靖言庸違不䏻惑也秦二世隱蔵其身以信趙髙天下潰叛而不得聞梁武帝信朱异侯景向関而不得聞隋煬帝信虞丗基賊徧天下而不得聞故曰君䏻兼聴則姦人不得壅蔽而下情通矣臣曰善㢤太宗之問魏徴之對也人君以一人之聦明接衆多之臣下共鯀趙髙朱异虞世基之徒世未嘗無然靜言庸違不䏻惑堯舜之君壅閉不聞乃䏻乱秦梁隋之國者豈不在乎兼聽偏信之殊耶人君初未嘗不好治而惡乱亦未嘗不𣣔用君子而去小人然君子卒不䏻用小人卒不䏻去者盖君子獨立而無助小人植黨以自私人君将一用君子群小人懼其不便扵巳也必巧為飛謗以中傷之將去一小人群小人懼其失所依也必巧為逰言而隂為之地人君将訪之左右之人耶左右之人未必不如齊人之毁即墨而譽阿大夫也将訪之百官耶百官之中未必不如八司馬之譽王叔文也将訪之耳目之臣耶耳目之臣又未必不有額叩龍墀如劉栖楚之黨李逢吉也将訪之元老大臣耶元老大臣又未必不隂有所畏私𣣔納交如張禹之黨王鳳也遂使人君聰明惑亂心無所主君子将用而復舍小人将舍而反用小人之黨日熾君子之勢益孤卒至扵在位皆小人而空國無君子人主孤立而不自知天下未有不為秦為梁為隋者其始起扵偏信之私其終至扵禍乱危亡而不可救可不戒㢤此四門不可以不闢四目不可以不明四聡不可以不逹心術不可以不正君子小人不可以不擇也唐書李絳傳憲宗嘗對絳稱太宗明皇之盛朕欲庶㡬二祖之道徳風烈無媿謚號不為宗廟羞何行而至此乎絳曰陛下誠䏻正身勵已尊道徳逺邪佞進忠直與大臣言欽而信無使小人㕘焉與賢者㳺親而禮無使不肖與焉去官無益扵治者則材䏻出斥宫女之希御者則怨曠消将帥擇士卒勇矣官司公吏治輯矣法令行而下不違教化篤而俗必遷如是可與祖宗合徳號稱中興夫何逺之有言之不行無益也行之不至無益也帝曰美㢤斯言朕将書諸紳耶詔絳與崔群䓁捜次君臣成敗五十種為連屏張便坐臣曰有賢君無賢臣不可以致治有賢臣無賢君亦不可以致治惟臣主俱賢然後可以相與大有為觀憲宗所問與李絳所對可謂臣主俱賢矣帝承肅代徳順頽弊委靡之餘慨然有意正觀開元之盛絳所陳皆切一時終戒之曰言之不行無益也行之不至無益也帝夫資英武推誠聽諌聞絳之言而𣣔書紳非飾虚詞以面褒之而巳退䏻断然而力行之内任忠賢外誅僣叛唐之威令至扵復振皆絳言有以啓之嘗欲相絳官者世突承璀寵方盛忌其進隂有毀短帝遂出璀而用絳不疑嘗威夏對延英帝汙浃衣絳故趨出帝曰朕宫中所對唯宦官女子𣣔與卿講天下事乃其樂也又嘗對左右稱絳言骨鯁為真宰相非絳之忠讜不䏻盡言以啓沃非帝剛明果断亦豈䏻受盡言而用之凡絳所言無一不行卒䏻與太宗明皇號為唐室三宗盛㢤使帝䏻終始行絳言不以小人而㕘君子不與不肖而與賢不退絳而進承璀不罷裴度而用皇甫鏄中興之業寧有不終耶臣竊謂致治之君不可不聽諌不可不用賢尤不可不力行又不可不始終如一也經筵講義春秋僖公臣聞僖公名申莊公之子閔公庶兄也莊公既没魯有内難子般閔公相継遇禍季友以僖公適邾遂入而立之僖公即位首䏻遵伯禽之法儉以足用寛以愛民史克作駉詩以頌之䏻用賢相君臣有道史克作有駜以頌之䏻修泮宫以服淮夷作泮水以頌之能復周公之七宇作門宫以頌之僖在春秋十二公中㝡為有道而享國亦長臣竊謂魯之有僖公猶周之有宣王也宣王䏻復文武之境土中興周室見扵大小雅僖公䏻復周公伯禽之業中興魯國見扵臼頌仲尼刪詩而有取焉者盖以宣王僖公之事有可以為法扵後世也然許頌僖公如此為春秋猶不免乎譏何耶春秋之法責賢者備元年春王正月隠公不書即位継故也春秋之法継正而書即位者正也継正而不書即位是不自正也隠公是也継故而不書即位者亦正也継故而書即位必有大惡也威公宣公是也僖公継閔公之難故不書即位以見正人君䏻正其始斯䏻正其終正始之道必先正其心念慮云為不可以不正視聽言動不可以不正出入起居不可以不正左右前後不可以不正以之正朝廷正百官正萬民正四方其身既正㒺敢不正齊師宋師曹師次于聶北救邢莊三十二年冬狄伐邢管仲言扵齊侯曰戎狄豺狼不可厭也諸夏親暱不可弃也宴安耽毒不可懷也請救邢威公從管仲之言扵閔元年救之今又救之春秋悪用兵至書救則善之也悪中國相侵伐至攘夷狄則與之也齊侯往年雖救邢而不䏻卻狄者田齊侯不親往也故書曰齊人救邢今三國皆稱師者非将尊師衆也必三國之君在焉然不曰齊侯宋公曹伯者不以救邢之師與齊侯也救者善也其曰不以救邢之師與齊侯何也狄人伐邢閱三歲矣往雖救之而不親往今雖親往又不急造其國以救之方且次于聶北有逗留觀望之意致邢為狄所逐遷于夷儀齊侯雖有救患之仁心而無急義之大勇故春秋雖書救以善之又書次以譏之由是見聖人之心急扵攘夷狄而救中國也小學講論語昔孔子以天縦之聖講道洙泗之間群天下英才而教育之盖三千人弟子記其善言善行謂之論語垂諸後世與六經並傳欲修身者不可不知是書欲事親者不可不知是書欲事君者不可不知是書欲治天下國家者不可不知是書是書者造道入徳之門戸窮理盡性之本原也學是書者當自正心誠意始學而第一子曰學而時習之不亦說乎有朋自逺方来不亦樂乎人不知而不愠不亦君子乎人不可以不學故論語二十篇以學爲首時過而後學則勤苦而難成故弟子首記夫子之言曰學而時習之時者何人生十年曰㓜學夫子年一有五而志扵學自十歲以上學之時也十五以上尤不可不志扵學也學以時而習則積不以時而習則荒學而時習之則理有所明而心有所見故說說者自内言之也獨學而無友則孤陋而寡聞今有朋焉来自逺方相與講習有直諒多聞之益故樂樂者自外言之也故學以時則心志通朋来自逺則名譽彰宜為人所知也而有不知者焉在常人之情知則喜不知則愠喜愠生扵知不知其為人也亦少矣君子學足乎已而所樂在内初不恤乎人之知不知此人不知而不愠所以為君子有子曰其為人也孝弟而好犯上者鮮矣不好犯上而好作亂者未之有也有子者孔子弟子有若也孔子没弟子思之以有若貌類聖人嘗以事孔子之禮事之矣故有若亦以子稱扵論語善事親為孝善事兄為弟孝弟者闔門之懿百行之先也事親孝故忠可移扵君事兄弟故順可移扵長擴而充之至扵格上下通神明凖四海未有不本扵此者堯舜古之盛帝其道至大也孟子稱之曰孝弟而巳矣堯舜之道不止扵孝弟然其所以巍巍蕩蕩後世莫及者盖由其以孝弟擴而充之也夫理一而已舉斯心而加諸彼則孝弟者為臣必忠為子必順小則必不好犯上大則必不至作亂盖理之必然所謂犯上者如少凌長小加大之類是也兹固孝弟者之所不為然臣之事君有犯無隠君或有過不得不犯顔而諌則所謂犯上者固亦有之是盖出扵不得巳非其心之所好故曰好犯上者鮮矣至若好作亂則必無之理故曰未之有也所謂作亂者非必稱兵畔逆然後謂之作亂也凡事君不忠者皆可謂之作乱朋姦㒺上謂之作乱可也蠧國害民謂之作乱可也盗國家之名器者謂之作乱可也竊人主之福威者謂之作乱可也作者盖厲階巳生而有必乱之理在家則為賊子在國則為乱臣此固孝弟者之大罪人其心必不好之亦理之必然也為政第二子曰為政以徳譬如北辰居其所而衆星共之古之學者為巳非止乎為巳也學既足乎巳行其所學斯可以為人故先之以學次之以為政學與政非二物顧所學者如何爾學帝王仁義之術則為徳政學覇者刑名之術則為刑政㓜之所學壯之所行一也為政以徳是帝王仁義之學也非修徳扵為政之時行所學扵為政之時耳正其身而天下自㱕故譬之北辰北辰嘗居其所而衆人咸拱人君以徳為政無為而治而天下共尊古之人有行之者堯舜禹湯文武是也尔雅曰北極謂之北辰郭璞釋之曰北極天之中以正四時以其居天之中故曰極以其䏻正四時故曰辰漢書天文志曰中宫太極星其一明者太一之常居也是之謂北辰或以北斗為北辰非矣梅溪先生後集第二十七
