body:
  text: 雜文遊天衣詩序紹興戊寅冬十有一月己邜日南至後二日遊天衣者八人皆前進士宦遊于越者黎明戒裝集于賀監之故居天氣既佳愛日𥘉長籃輿出蠡城之南道乎稽山之隂徉徜乎秦望鑑湖千岩万壑之間有松隂十里林麓靜深山轉徑迂煙藹出沒𥘉行若迷俄有鍾罄聲出乎翠微之端蓋天衣寺也十峯堆秀雙澗涵碧朝陽法華二峯尤蒼然蔪絶乎其中寺有唐人李泰和徐季海元微之白樂天李公垂諸作者詩文其碑刻尚無恙有化身普賢飛耒銅像蕭梁衣鉢雙烏故事緇徒頗能道之方杖屨尋幽有府吏將使君之命餉以百榼既拜賜有舉杯而言者曰今日之集蓋不偶然也昔王謝蘭亭之逰群賢少長畢集可謂雅會矣然賦詩不就者十有六人豈若吾㑪臭味之同遊從之勝乎白衣之來非王洪之酒乃楚元之醴也歡其可以不記于是舉白飛觴唱酬交作雜以諧笑咸有餘適僧有勸遊雲門者夕陽薄山遂不果往乃舍車聮騎探梅而還晚集于泮宫飲文字也𥘉登山某首賦一章同行即席而和既而吟詠者多不記萹目遂列書于招提諸公命某序之送喻叔竒尉廣德序韓退之之留孟東野也其詩有曰昔年因讀李白杜甫詩長恨二人不相從吾與東野生並世如何復躡二子蹤某𥘉疑退之言為夸及觀城南諸聮句豪健險怪其筆力略相當使李杜復生未必不引避路鞭也然後知復躡之語為非過又讀其末章有曰吾願身為雲東野變為龍四方上下逐東野雖有别離無由逢于是又知二公心相如氣味相得至欲相與為雲龍而不忍有離别真可謂古之善交者某丙子冬與繡川喻叔竒同舍上庠一見如故明年同登太常苐又明年贊幕會稽叔竒耒遊大帥王公嘉其為人屈以攝職豫遂獲朝夕焉論文賦詩相得愈厚盍簮才百日唱和無慮百數萹叔竒之詩清新雅健有晉宋風味得韓公之豪無東野之寒豫不逮逺甚然豫二人者有唱必酬殆亡虛日樽酒細論文之外語不及他亦庶幾復躡古作者蹤矣會叔竒赴官桐川行甚遽豫惘然惜別行觴既開􅌐駒在門于是誦醉留之萹歌雲龍之句以贈之至若清白以處已忠勤以蒞事不枉道苟合以干進兹固叔竒素學而優為者亦某之所素期而深望者姑小試于筮仕之𥘉奉以周旋于終身出處行藏之際其為復躡古人之蹤又不止乎絺章繪句間也叔竒勉之紹興戊寅吉日東嘉王某序送葉秀才序吾鄊誼理之學甲于東南先生長者聞道于前以其師友之淵源見于言語文字間無非本乎子思之中庸孟子之自得以詔後學士子群居學校戰藝場屋筆橫渠而口伊洛者紛如也取科第登仕籍冨貴其身光大其門者往往多自此塗出可謂盛矣然君子之學為道小人之學為利談誼理而媒青𬗋果為道乎為利乎吾聞洙泗之徒有堂堂乎張者欲學干祿夫子不以其祿之不可干而闢之也而告之曰言寡尤行寡悔祿在其中矣古人之學也謹言行而祿自至修天爵而人爵自從所謂誼理者在是豫假守楚東鄊人葉生處和者亦客遊是邦每暇日過豫于郡齋音琅然而可聽議論粲然而成文仰其所藴皆吾鄊師友淵源之學也處和早喪二親能刻苦自立友愛諸弟急難之念不頃刻忘懷其于所學豈口耳云者今將之武林就秋賦求贈言以行吾謂生之學問議論文采取一苐不足道贈人以言而勉之科苐是亦利而巳矣何異市井相與言耶若夫謹言行而祿在其中修天爵而人爵從孔孟所謂義理者在是慁子之苐雖不足道亦不能外是而得之也敢不以告乾道乙酉五月二十二日永嘉王某序蔡端明文集序文以氣為主非天下之剛者莫能之古今能文之士非不多而能傑然自名于世者亡幾非文不足也無剛氣以主之也孟子以浩然充塞天地之氣而發為七萹仁義之書韓子以忠犯逆鱗勇叱三軍之氣而發為日光玉潔表裏六經之文故孟子闢楊墨之功不在禹下而韓子抵排異端攘斥佛老之功又不在孟子下皆氣使之然也若二子者非天下之至剛者歟國朝四葉文章尤盛歐陽文忠公徂徠先生石守道河南尹公師魯莆陽蔡公君謨皆所謂傑然者文忠之文追配韓子其剛氣所激尤見于責髙司諫書徂徠之氣則見于慶曆聖德頌師魯則見于願與范文正同貶之書君謨則見于四賢一不肖詩嗚呼使四君子者生于吾夫子時則必無未見剛之歎而乃同出于吾仁祖治平醇厚之世何其盛歟夫以臺諌之風采朝士莫不畏其筆端自侍從而下奔走伺候其門者紛然也文政鄱陽之貶余尹歐既與之同罪矣蔡公乃于四賢相繼黜謫之後形于歌詩而斥為不肖羞其見搢紳之靣而辱甚市朝之撻則公之剛又可知也某𥘉見其詩于張唐英所撰仁宗政要甚歆慕之其後見公文集乃沒而不載竊以為恨乾道四年冬得郡溫陵道出莆田望公故居裴回顧嘆而不忍去入境訪公遺迹則首見所謂萬安橋者與大書深刻之記爭雄且深惜其有濟川之才而不至于大用登愛松堂九日山則又見公之詩與其真迹猶在凛然有生意如見其正顔色坐黃堂時也蓋公至和嘉祐間嘗兩守是邦至今泉人稱太守之賢者必以公為首求其遺文則郡與學皆無之可謂缺典矣於是移書興化守鍾離君松傳君自得訪于故家而得其善本教授蔣君雍與公同邑而深慕其為人手校正之鋟板于郡庠得古律詩三百七十奏議六十四雜文五百八十四而以四賢一不肖詩置諸卷首與奏議之切直舊所不載者悉編之比他集為最全且屬豫序之子曰端明公文章文忠公嘗稱其清道粹美後雖有善文詞好議論者莫能改是評也豫復何云然竊謂文以氣為主而公之詩文實出于氣之剛入則為謇諤之臣出則為神明之政無非是氣之所寓學之者冝先涵養吾胸中之浩然則彂而為文章事業庶幾無愧于公云五年十月永嘉王某敘跋陳忠肅公手帖忠肅公心畫徑健類其為人公孫德齡豫同年也文翰有家法他日必能嗣其風烈紹興辛巳孟冬跋季仲默詩仲默豫姑之子也與豫同年生少豫二十日自總角同筆硯相得最甚弱冠從林先生師禹于金溪時大梁孫皓子尚遊吾鄊年少有俊才能歌詩豫二人辱與之交遂各出所作詩編為集閲歲既久謂以失之至隆興甲申夏四月壬戌豫兒聞詩暴蠧書得舊稿遺墨如故而子尚在鬼録巳二十餘年仲默化去亦一星終矣豫流涕讀之仲默詩雖不多然皆憂國傷時慷慨竒男子語使天假之年有祿位于朝攄其素藴決不為脂韋軟孰輩也舊遊從者八人有八叟之號仲默號徑叟其後劉銓全之鎮長方毛宏叔度與豫皆相繼塵忝仲默才氣不在人下獨不霑一命而死悲夫豫因録其詩詞凡二十六首及豫和仲默與孫子尚薑渭叟二詩于後示其子徽俾家藏之以貽後人跋溫公帖溫公盛德大業非東坡大手筆不能形容措國于太山之安今于流水之原後人欲識元祐之治其大要如此乾道乙酉後重陽六日又孟子曰欲為君盡君道欲為臣盡臣道觀宣仁所問溫公所對可謂各盡要道真堯舜君臣也乾道改元後重陽一日跋二劉帖二劉先生直諒多聞如西京子政歆輩不足多也敬觀心畫如見偉人丁亥十二月書跋王僉判植詩秦氏以國事讎非和也三綱五常之道滅矣何足以語春秋當時士大夫能力爭者無幾惟胡君邦衡慨上請劍之書至今讀之令人增氣且令後世不謂我宋無人可謂有功于名教矣王君十詩引春秋尊王以譏切時事韙矣然于邦衡詆為小吏寡謀豈詩人之語固自有深意耶乾道三年七月十四日書跋余襄公帖某自幼知慕四賢之為人頃守番陽祠范文正公而記之過夷陵謁歐陽文忠公祠而賦詩有慶曆四賢今見兩之句兹至鄂渚又獲觀余襄公之徑畫如見其風采動朝端時亦足以慰平生之所慕矣跋馮員仲帖員仲天下士也負有用之才懷許國之忠而不獲究其萬一命矣夫雖困于讒而死于不幸然知已數公皆一代之傑亦可以無憾矣其徒陳君季習出示詩文手帖流涕讀之乾道三年六月跋霍懷州傳豫每嘆金虜之禍中原比唐安史之亂為甚唐守土之臣死事者頗多靖康間獨寂寥無聞何耶今始見何子應作霍懷州傳捨生取義名節凛然可與睢陽二公同稱烈丈夫矣丁卯四月跋王夷仲送行詩軸夷仲校書豫同年兄也政事文章皆過人一等三年間兩見之于雙溪慷慨論世事相勉必以名節豫守夔子夷仲遊道山同年梁介子紹過夔得其書梁論館閣人才以夷仲為稱首既而以勇退聞夷仲之退豈果為病邪嗚呼萬里靣目書墨猶未乾而夷仲死矣其子過霅川出館中送㣔詩讀之流涕端人不易得非區區交友之私也乾道三年十月十日書跋杜祁公帖杜正獻公號清白宰相見其心畫令人起敬如見其正色立朝時也乾道戊子孟夏書跋蔣元肅夢仙賦朴鄊子作夢仙賦詞新意古超出翰墨蹊徑外蓋司馬長卿賦大人李太白大鵬之類可謂飄飄有凌雲氣冝與神遊于八極之表也然豫鄙陋之文何足以當之其亂日讀故書期以十年乃敢請所未見非朴卿自謂也蓋勉豫所未至抑亦詞人勸百諷一之旨耶乾道己丑八月二十二日跋張侍郎帖張公子韶一代儒宗學者所共尊仰某恨不識之吾鄊陳君開祖以學問文采受知于公為最厚其子出示手帖二十𥿄凛然正直之氣見于詞翰間愛其人敬其書携以適閩久而後歸之乾道巳丑十月二日跋嚴伯威墨迹僧嚴公字伯威溫州樂清人豫祖母賈氏兄也性敏悟道行孤潔學兼禪教為緇林所推重州郡迫以住持終身不就博通儒學尤工詩文識者謂不減惠勤道潛之流苐無知巳如歐蘇二巨公耳遊戲翰墨亦極其妙每片𥿄出入爭寶之有集曰潛澗卒于政和壬辰至乾道己丑五十有八年矣有橫陽章彬秀才得其所書唐宋詩八幅至泉南以獻豫郡博士蔣君雍見而竒之請刋于泮宫以廣其傳陳教授登豫同年進士最善書亦謂近世所無也冬十一月戊午書跋孫尚書張𬗋微帖孫公尚書四朝文傑張公𬗋微當代才子孫尤長于簡尺張翰墨妙天下某晚輩恨不識尚書公比守霅川得公二書時年幾九十而詞源筆力不衰如此張帥長沙某移書求貢院字筆畫雄健用于湖泉二州觀者壯之其所答書詞翰俱絶明年二公皆在鬼録其既不獲瞻尚書之履又嗟𬗋微郎之不永世見其迹思其人軸而藏之欲刻未果石似之察判見而喜之假之以歸刋於其家以廣其傳可謂樂善好事矣乾道六年三月庚午書于泉南郡齋曰義堂銘郎莫君子蒙將漕湖北永堂名于過客王某以曰義名之銘曰部使者之職莫重于計臺居是職者以桑大夫之心計劉士安之鞭算為善理財一於財而不以義特聚斂之臣爾非特為民之蠧是亦為身之災易曰理財正辭禁民為非曰義居是職坐是堂而無愧是名者其賢矣哉鑑湖説上東坡先生嘗謂杭之有西湖如人之有目某亦謂越之有鑑湖如人之有腸胄目翳則不可以視腸胄祕則不可以生二湖之在東南皆不可以不治而鑑湖之利害為尤重昔東漢太守馬臻之開是湖也在會稽山隂二縣界中周回三百五十餘里溉田九千餘頃湖髙田丈餘田又髙海丈餘水少則泄湖歸田水多則泄田歸海故會稽山隂無荒廢之田無水旱之患者以此自漢水和以來更六朝之有江東西晉隋唐之有天下與夫五代錢氏之為國有而治之莫敢廢也千有餘年之間民受其利博矣久矣至國朝之興始有盜湖為田者然其害猶微盜于祥符者才一十七户至慶曆間為田四頃而巳當是時三司轉運司猶切貴州縣使復田為湖自是而後官吏因循禁防不謹姦弊日起侵盜愈多至于治平熙寧間盜而田之者凡八千餘户為田蓋七百餘頃而湖侵廢矣然官亦未嘗不禁而民亦未敢公然盜之也政和未有小人為州內交權幸專務為應奉之計遂建議廢湖為田而歲輸其所入于京師自是姦民豪族公侵強據無復忌憚所謂鑑湖者僅存其名而水旱災傷之患無歲無之矣今占湖為田蓋二千三百餘頃歲得租來六萬餘石為官吏者徒見夫六萬石之利于公家也而不知九千頃之𬒳其害也知九千頃之歲𬒳其害而巳而不知廢湖為田其害不止于九千頃而巳也蓋鑑湖之開有三大利廢湖為田有三大害山隂會稽昔無水旱之患者鑑湖之利也今則無歲無災傷蓋天之大水旱不常有也至若小水旱何歲無之自廢湖而為田每歲雨稍多則田巳淹沒晴未久而湖已枯竭矣説者以為水旱之患雖及于九千頃之田而公家實受湖田六萬石之入嗚呼其亦未之思也夫災必訴訴必檢檢必放得湖田之租失常賦之入所得所失相去幾何官失常賦而以湖田輔折之猶可也九千頃之民田其所失者不可計其何以輔折之耶王者以天下為家其常賦所入亦廣矣豈利夫六萬石之入而以病民耶况湖田之入在今日雖饒而他日亦將同九千頃而病矣使湖盡廢而為田則湖之為田者其可耕乎今之告水旱之病者不獨九千頃之田也雖湖田亦告病也况他無鑑湖則九千頃之膏腴與六萬石所入之湖田皆化為黃茅白葦之場矣越人何以為生耶此其為大害一也鑑湖三百五十八里之中蓄諸山三十六源之水歲雖大潦而水不能病越者以湖能受之也今湖廢而為田三十六源之水無吞納之地萬一遇積雨浸淫平原出水洪流滔天之歲湖不能納水無所歸則必有漂廬舍敗城郭魚人民之患嘗聞紹興十有八年越大水五雲門都泗堰水髙一丈城之不壞者幸也假令他日湖廢不止于今而大水甚于往歲則其為害當如何此廢湖為田其為大害二也自越之有鑑湖也歲無水旱而民足于衣食故其俗號為易治何以知其然也以守令而知之也自東都以來守會稽令山隂者多以循吏稱見于史傳者不可一二舉也非昔之守令皆賢也蓋民居樂歲之中室家溫飽民之為善也易尓比年以來獄訟繁興人民流亡盜賊多有皆起于無年去秋災傷之訟山隂會稽為尤多非昔之民皆善良今之民皆頑鄙也蓋禮義生于生于飽暖盜賊起于飢寒其勢不得不然耳此廢湖為田不獨九千頃受其病獄訟之所以興人民之所以流盜賊之所以生皆此之由其為大害三也自祥符慶曆至今建復湖之義者多矣而湖卒不能復非湖之不可復也蓋異議者有以搖之也異議得以搖之者蓋亦建議者之未能深究夫利害焉耳建議者曰廢湖為田則九千頃𬒳水旱之害湖不可以不復異議者曰九千頃雖𬒳水旱之害而常賦不盡失以湖為田而官又得湖田之利為多湖雖廢而何害且多為異説以搖之此建議者之言卒奪夫浮議者之口使建議者灼然知夫三大利害之所在以折夫異議者之云云則復田為湖有不可得而巳也鑑湖説下夫廢湖為田有三大害復田為湖有三大利湖固不可以不復也然亦有三難搖于異議一難也工多費廣二難也郡守數易三難也今之占湖為田者皆權勢之家豪強之族也侵耕盜種為日巳久一旦欲奪而復之彼必遊談聚議妄陳利害曰勞民也費財也失官租也有科率之優也無積土之地也爭為異説以沮害之官吏方墮於因循苟且之習復為氣力多口舌者之所動移而欲兾成功于歲月之久可乎此搖于異議一難也昔人常計濬湖之工矣日役五千人濬至五尺當十五歲而畢至三尺當九歲而畢張伯玉之説夫用工如此之多歷年如此之久其為費如何今越不濬湖而財用猶不給况興至大之役有不資之廢耶此工多用廣二難也守令之于郡邑久任則可以立事數易則不能成功况鑑湖之開非一歲一時之所能畢今之為守者或一歲而遂遷或半歲而遽易湖之利害不暇問焉能知不能知遑暇治其間慨然有志于開復者功未及施而去計巳迫矣後來者所見不同復變前議以數易之守而欲興浩大悠久之役可乎此郡數易三難也湖有三不可不開而厄于三難開是終無䇿以開之耶某切謂欲遏浮議則不可不白利害于朝廷主之雖異議紛然但莫之恤可也如向者經界之行于天下固有不樂其事而欲動搖之者多矣然經界卒行而民受其利蓋朝廷主之則事無不可成者况一鑑湖耶彼異議者不過曰勞民費財耳夫勞民費財興無用不急之務則不可如鑑湖之利害如此謂之無用不急可乎自湖之廢也歲多災傷細民艱食今于農事之隙慕民濬治官出財民出力兩有所利民雖勞而不憚財雖廢而不虛矣彼不過曰官失湖田之租民有科率之優夫鑑湖之開千有餘歲矣昔無湖田之租有國者不以不足為病豈今日獨少此耶况湖既復而民利興災傷不作而常賦不失民無凶荒之訴官無檢放之患較其所得與今孰多至若錢米之費當一出于官而不取于民竹木之具雖資之于民而盡酬其直胥吏都有從而優民者則嚴法令以治之尚何科率之憂耶越人多謂湖可開也而土無所歸是不難積其泥塗以為丘阜昔吳長文常論之矣今湖之側曠地固多擇其利便隨其逺近而丘阜之土非所患也欲沮濬湖之計者不過數者之説而皆有以取之尚何浮議之恤耶謂日役五千人濬至五尺十五歲而畢者蓋通三百五十里之間而計之也某謂今之濬湖固未能舉三百五十里之內而盡復之也湖自熙寧以來建議者立兩存之説有牌內牌外之限今牌尚存而牌內亦盜而為田矣為今日計者當先復牌內之湖其用工固有間自牌之外當以漸治之可也所費之財自本府經畫外又當請于朝乞每歲湖田所入之米以為雇工興役之費朝廷捐六萬石之米不足以為多寡越得此以辦事則沛然有餘矣欲復田為湖必當遲以歲月之久有久興之役無久任之守以主之則異議一搖而事必中輟是又當請于朝置開湖一司于越命守倅帶提舉主管之職如勸農學事之類又命二知縣分董之舊日會稽山隂知縣皆帶提舉鑑湖事守既職其事則必任其責雖遷易不常而後來者不得不繼非正術同也蓋職使然也又有倅終任以管其事令終任以董其役則責有所歸又命監司督察賞罰之俟湖成之日凡主其事董其役者皆次苐加賞如是則湖不患其不復也昔論復湖之利害者多矣莫如曽子固子固之言曰謂湖不必復者曰湖田之入固饒矣此遊談之士為利于侵耕者言之也使湖盡廢則湖田亦旱矣謂湖不必濬者曰益隄壅水而巳此好辨之士為樂聞苟簡者言之也以地勢較之壅水使髙必敗城郭矣二者既不可用而欲禁侵耕開告者則有賞罰之法矣蔣堂欲謹水之蓄泄則有閉縱之法杜𣏌欲痛絶敢田者則拔其苟責其力以復湖而重其罰又有法矣杜𣏌或欲任其責于州縣與轉運使與提點刑獄吳奎或欲以每歲農隙濬湖吳奎或欲禁田石柱之內者又皆有法矣張伯玉欲知濬湖之淺深用工幾何為日幾何欲知增隄竹木之費幾何使之安出張伯玉欲知濬湖之塗泥積之何所吳奎又以計之矣欲知工起之日或浮議或搖役夫內潰則不可以必其成張伯玉又已論之矣子固誠能收衆説而考其可否用其可者而以在我者潤澤之令言必行法必舉則何功之不可成何利之不可復哉子固昔嘗倅越知鑑湖之利害為詳而其言有足取者故并記其略有能舉行子固之言而不棄某之兩則湖庶乎其可復不然姑存其説以俟馬太守再生可也別院省試䇿問二首問自古帝王圖天下之大業必貴乎好謀而能斷謀固不易而斷為尤難謀之于新固不若謀于舊也然孫權之拒曺操吳人以衆寡不敵為憂張昭為定䇿舊臣乃勸權迎之果從其謀其能成赤壁之功建鼎峙之國乎謀之于寡固不若謀于衆也然憲宗之伐淮蔡卿士莫隨于議伐之𥘉小大並疑于既伐之後使帝惑群議而不任忠臣其能成破賊之功振唐室之威令乎謀之于少固不若謀之于老也然世宗欲親征劉旻馮道以四代之老力諌其行果從其謀其能成髙平之捷而北取三關乎謀之于下固不若謀之于左右大臣也然澶淵之役大臣有欲避其鋒而勸幸吳蜀者當時苟從其謀天下幾乎其不分裂乎夫國有大疑謀之于舊謀之于衆謀之于老謀之于大臣可也彼三章聖皇帝乃違其所宜從之謀而以之取勝何耶豈群謀有不足取而斷之以獨見之明耶抑當時運籌幃幄之臣固有出人意表者耶共惟主上以聖德受禪天下同心戴之蠢兹醜虜尚敢不恭天地神人罔不憤怒疆埸之事上貽宵旰之憂議者謂欲興師以拒之命將以伐之耶則有以力非其敵如吳人之懼魏唐人之慮淮蔡者謂冝親屈萬乘以征之耶則又慮䇿非萬全必有異議如顯德景德之臣者彼其心皆出于憂國特其所見有不同持不同之論而紛然于人主之前則謀將孰從而斷將安出耶諸君抱甽畝惓惓之患久矣必有竒䇿可以濟世群試春官蓋得言之秋也願詳論前古好謀能斷之君其事孰可行於今者有司將采而獻焉以贊雄斷問非建功立名之士無以排禍亂而闢土疆非守節死義之士又無以折姦邪而扶持宗社二者皆有國之所急不可不兼崇而並尚也議者謂西漢有功名而無節義東漢有節義而無功名兼之者其三國人才乎抑嘗即固曄夀之史而考之三者之説似非至論西京有折而不撓號近古社稷臣者有寢淮南之謀懷甽畝之志者非節義與東都有感會風雲上應列宿者有舉空朝廷投筆取封侯者非功名與三國人才固多矣傑然乎其間者殆不過數子蜀諸葛亮固天下竒才也然史氏謂其連年動衆未能成功兵機將略非其所長功名亦少貶矣魏荀或固有王佐風也然論者譏其協規曺氏氏以傾漢祚機鑒先識未充其志節義亦少貶矣吳周瑜魯肅建獨斷之明出衆人之表智略俱可稱也然或謂赤壁之役瑜獲虛名荆州之借乃肅之短功名節義又果能兼之否謂西漢無節義東漢無功名非厚誣與謂三國兼兩漢所長非溢美與我祖宗之世人才輩出功名節義為兩全視兩漢三國為逺過自艱難以來不惟兼全者無能以所長見稱亦亡幾視兩漢三國為有愧主上側席求賢昔回恢復正有志之士建功立節之秋也敢問何以排禍亂而復土疆何以折姦謀而扶宗社死者可作其誰與歸願托前史并國朝人才而併論之將以觀諸君筮仕之志經筵故事唐書魏證傳太宗問證為君者何道而明何失而暗證曰君所以明兼聽也所以暗偏信也堯舜氏闢四門明四目逹四聰雖有共鯀不能塞也靖言庸違不能惑也秦二世隱藏其身以信趙髙天下潰叛而不得聞梁武帝信朱異侯景向關而不得聞隋煬帝信虞丗基賊遍天下而不得聞故曰君能兼聽則姦人不得壅蔽而下情通矣臣曰善哉太宗之問魏徴之對也人君以一人之聰明接衆多之臣下共鯀趙髙朱異虞世基之徒世未嘗無然靜言庸違不能惑堯舜之君壅閉不聞乃能亂秦梁隋之國者豈不在乎兼聽偏信之殊耶人君初未嘗不好治而惡亂亦未嘗不𣣔用君子而去小人然君子卒不能用小人卒不能去者蓋君子獨立而無助小人植黨以自私人君將一用君子群小人懼其不便于巳也必巧為飛謗以中傷之將去一小人群小人懼其失所依也必巧為逰言而隂為之地人君將訪之左右之人耶左右之人未必不如齊人之毁即墨而譽阿大夫也將訪之百官耶百官之中未必不如八司馬之譽王叔文也將訪之耳目之臣耶耳目之臣又未必不有額叩龍墀如劉栖楚之黨李逢吉也將訪之元老大臣耶元老大臣又未必不隂有所畏私𣣔納交如張禹之黨王鳳也遂使人君聰明惑亂心無所主君子將用而復舍小人將舍而反用小人之黨日熾君子之勢益孤卒至于在位皆小人而空國無君子人主孤立而不自知天下未有不為秦為梁為隋者其始起于偏信之私其終至于禍亂危亡而不可救可不戒哉此四門不可以不闢四目不可以不明四聰不可以不逹心術不可以不正君子小人不可以不擇也唐書李絳傳憲宗嘗對絳稱太宗明皇之盛朕欲庶幾二祖之道德風烈無愧諡號不為宗廟羞何行而至此乎絳曰陛下誠能正身勵已尊道德逺邪佞進忠直與大臣言欽而信無使小人參焉與賢者遊親而禮無使不肖與焉去官無益于治者則材能出斥宫女之希御者則怨曠消將帥擇士卒勇矣官司公吏治輯矣法令行而下不違教化篤而俗必遷如是可與祖宗合德號稱中興夫何逺之有言之不行無益也行之不至無益也帝曰美哉斯言朕將書諸紳耶詔絳與崔群等搜次君臣成敗五十種為連屏張便坐臣曰有賢君無賢臣不可以致治有賢臣無賢君亦不可以致治惟臣主俱賢然後可以相與大有為觀憲宗所問與李絳所對可謂臣主俱賢矣帝承肅代德順頽弊委靡之餘慨然有意正觀開元之盛絳所陳皆切一時終戒之曰言之不行無益也行之不至無益也帝夫資英武推誠聽諌聞絳之言而𣣔書紳非飾虛詞以面褒之而巳退能斷然而力行之內任忠賢外誅僣叛唐之威令至于復振皆絳言有以啓之嘗欲相絳官者世突承璀寵方盛忌其進隂有毀短帝遂出璀而用絳不疑嘗威夏對延英帝汙浹衣絳故趨出帝曰朕宫中所對唯宦官女子𣣔與卿講天下事乃其樂也又嘗對左右稱絳言骨鯁為真宰相非絳之忠讜不能盡言以啓沃非帝剛明果斷亦豈能受盡言而用之凡絳所言無一不行卒能與太宗明皇號為唐室三宗盛哉使帝能終始行絳言不以小人而參君子不與不肖而與賢不退絳而進承璀不罷裴度而用皇甫鏄中興之業寧有不終耶臣竊謂致治之君不可不聽諌不可不用賢尤不可不力行又不可不始終如一也經筵講義春秋僖公臣聞僖公名申莊公之子閔公庶兄也莊公既沒魯有內難子般閔公相繼遇禍季友以僖公適邾遂入而立之僖公即位首能遵伯禽之法儉以足用寬以愛民史克作駉詩以頌之能用賢相君臣有道史克作有駜以頌之能修泮宫以服淮夷作泮水以頌之能復周公之七宇作門宫以頌之僖在春秋十二公中最為有道而享國亦長臣竊謂魯之有僖公猶周之有宣王也宣王能復文武之境土中興周室見于大小雅僖公能復周公伯禽之業中興魯國見于臼頌仲尼刪詩而有取焉者蓋以宣王僖公之事有可以為法于後世也然許頌僖公如此為春秋猶不免乎譏何耶春秋之法責賢者備元年春王正月隱公不書即位繼故也春秋之法繼正而書即位者正也繼正而不書即位是不自正也隱公是也繼故而不書即位者亦正也繼故而書即位必有大惡也威公宣公是也僖公繼閔公之難故不書即位以見正人君能正其始斯能正其終正始之道必先正其心念慮云為不可以不正視聽言動不可以不正出入起居不可以不正左右前後不可以不正以之正朝廷正百官正萬民正四方其身既正罔敢不正齊師宋師曹師次于聶北救邢莊三十二年冬狄伐邢管仲言于齊侯曰戎狄豺狼不可厭也諸夏親昵不可棄也宴安耽毒不可懷也請救邢威公從管仲之言于閔元年救之今又救之春秋惡用兵至書救則善之也惡中國相侵伐至攘夷狄則與之也齊侯往年雖救邢而不能卻狄者田齊侯不親往也故書曰齊人救邢今三國皆稱師者非將尊師衆也必三國之君在焉然不曰齊侯宋公曹伯者不以救邢之師與齊侯也救者善也其曰不以救邢之師與齊侯何也狄人伐邢閲三歲矣往雖救之而不親往今雖親往又不急造其國以救之方且次于聶北有逗留觀望之意致邢為狄所逐遷于夷儀齊侯雖有救患之仁心而無急義之大勇故春秋雖書救以善之又書次以譏之由是見聖人之心急于攘夷狄而救中國也小學講論語昔孔子以天縱之聖講道洙泗之間群天下英才而教育之蓋三千人弟子記其善言善行謂之論語垂諸後世與六經並傳欲修身者不可不知是書欲事親者不可不知是書欲事君者不可不知是書欲治天下國家者不可不知是書是書者造道入德之門戶窮理盡性之本原也學是書者當自正心誠意始學而第一子曰學而時習之不亦説乎有朋自逺方來不亦樂乎人不知而不愠不亦君子乎人不可以不學故論語二十篇以學為首時過而後學則勤苦而難成故弟子首記夫子之言曰學而時習之時者何人生十年曰幼學夫子年一有五而志于學自十歲以上學之時也十五以上尤不可不志于學也學以時而習則積不以時而習則荒學而時習之則理有所明而心有所見故説説者自內言之也獨學而無友則孤陋而寡聞今有朋焉來自逺方相與講習有直諒多聞之益故樂樂者自外言之也故學以時則心志通朋來自逺則名譽彰宜為人所知也而有不知者焉在常人之情知則喜不知則愠喜愠生于知不知其為人也亦少矣君子學足乎已而所樂在內初不恤乎人之知不知此人不知而不愠所以為君子有子曰其為人也孝弟而好犯上者鮮矣不好犯上而好作亂者未之有也有子者孔子弟子有若也孔子沒弟子思之以有若貌類聖人嘗以事孔子之禮事之矣故有若亦以子稱于論語善事親為孝善事兄為弟孝弟者闔門之懿百行之先也事親孝故忠可移于君事兄弟故順可移于長擴而充之至于格上下通神明凖四海未有不本于此者堯舜古之盛帝其道至大也孟子稱之曰孝弟而巳矣堯舜之道不止于孝弟然其所以巍巍蕩蕩後世莫及者蓋由其以孝弟擴而充之也夫理一而已舉斯心而加諸彼則孝弟者為臣必忠為子必順小則必不好犯上大則必不至作亂蓋理之必然所謂犯上者如少凌長小加大之類是也兹固孝弟者之所不為然臣之事君有犯無隱君或有過不得不犯顔而諌則所謂犯上者固亦有之是蓋出于不得巳非其心之所好故曰好犯上者鮮矣至若好作亂則必無之理故曰未之有也所謂作亂者非必稱兵畔逆然後謂之作亂也凡事君不忠者皆可謂之作亂朋姦罔上謂之作亂可也蠧國害民謂之作亂可也盜國家之名器者謂之作亂可也竊人主之福威者謂之作亂可也作者蓋厲階巳生而有必亂之理在家則為賊子在國則為亂臣此固孝弟者之大罪人其心必不好之亦理之必然也為政第二子曰為政以德譬如北辰居其所而衆星共之古之學者為巳非止乎為巳也學既足乎巳行其所學斯可以為人故先之以學次之以為政學與政非二物顧所學者如何爾學帝王仁義之術則為德政學霸者刑名之術則為刑政幼之所學壯之所行一也為政以德是帝王仁義之學也非修德于為政之時行所學于為政之時耳正其身而天下自歸故譬之北辰北辰嘗居其所而衆人咸拱人君以德為政無為而治而天下共尊古之人有行之者堯舜禹湯文武是也爾雅曰北極謂之北辰郭璞釋之曰北極天之中以正四時以其居天之中故曰極以其能正四時故曰辰漢書天文志曰中宫太極星其一明者太一之常居也是之謂北辰或以北斗為北辰非矣梅溪先生後集第二十七
