  text: 梅溪先生奏議卷第四
  hash: sha256:6120b5ef341e581b37739de7a9a7c06045b45a3c2a3323f73aa4af2faed441b7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_004-1a}
body:
  text: 論用兵事冝劄子臣切以今日之事有不可䡖改者曰用人有不可不决䇿者曰進蹕有不可不深慮者曰荆㐮有不可不急治者曰兵賦自古人君相與圖進取之計必有一定不易之規模知一勝一負爲兵家常勢故少勝不爲之喜小敗不爲之沮秦穆用孟明三敗而後覇西戎漢髙爭天下婁敗而後禽項羽諸葛亮才兼文武而有馬謖街亭之敗至於上表自劾蜀主不廢之卒能與吴魏抗衡而功盖三分之國國朝范仲淹韓琦皆一代名臣俱有材畧其經畧西夏也而亦有任福三川之敗仁祖不廢之卒能臣元昊而安中國此皆規模素定於匈次故能收異日之大功臣聞前日淮甸之師一月三捷宿州不利盖亦兵家勝負常勢也異議者遂從而揺撼将帥之臣且謂大将不還以貽聖慮今李顯忠邵宏淵及諸統制軍馬巳囘濠泗矣亦足見小人幸災樂禍扇為浮言務在中傷不可不察也恭聞陛下遣中使給御札慰安張浚撫勞将士仍放顯忠䓁罪憫其血戦之勞而赦其一眚之愆真得前古帝王御将之道矣然外議詾詾謂陛下宣召楊存中欲用為主帥臣切料聖意必不然然常人情紛優之際不䏻無市虎之惑既而聞之𥘉欲除荆㐮宣撫又改御營使及聞邉報稍寕其招遂寝疑者雖稍息而不䏻無慮焉存中為将罔功天下皆知之黷貨無厭交結中外爵位巳極而求進不巳彼其心但幸國家之有禍遂欲投隙而進亦何求而不得耶御營使不已必将有大於此者命令一出必失軍民之心使江淮荆㐮隴蜀将士聞之必致觧躰且謂朝廷因王師小衂而遽欲變易大帥非所以安人情威戎虜也臣所謂不能無患者在此建炎紹興間太上皇巡幸止用宰相樞宻為御營使李綱朱勝非䓁嘗為之陛下将為視師之舉冝遵用故事以两府大臣兼之足矣朝廷雖乏才其可以此䡖䖏存中軰耶此事尤在聖心素定不可變易於倉卒之間此臣所謂不可䡖改者曰用人也臣聞天下之勢不在國之强弱而在氣之如何氣振則轉弱而爲强氣沮則變强而爲弱股至强而惧則慄氣餒之也髪至弱而怒則衝氣激之也景徳間契丹舉國南冦王欽若請幸金陵陳堯叟請幸蜀以避其銳真宗以問冦凖凖曰誰爲陛下畫此䇿者罪可斬也今胡虜近迫四方危心當勵衆禦敵以衛社稷惟當進尺不可退寸柰何欲委棄宗廟逺之椘蜀鑾輿囬轉一歩則萬衆雲散四方瓦觧椘蜀尚可至耶真宗善其計乃幸澶淵将士鼔勇射殺撻覧虜衆遂退此作氣以破敵轉弱而爲强之尤大者也前年太上皇下親征之詔爲建康之幸作士氣以走胡騎蓋得䇿矣惜議乎議者不建逺大之計而遽囬安臨也陛下前日下詔視師中外鼓舞秋凉進發或者猶以爲遅今王師退保濠泗督府逺在盱眙陛下冝速進蹕以幸建康居六朝帝王之宅據東南形勢之勝可以援吴蜀可以控四方可以逺海道之虞可以壮淮甸之勢四方聞之孰不增氣至若百司之衆在今冝省犒之費比舊冝莭庻㡬萬騎易動如聖訓所謂當如創業時此臣所謂不可不决䇿者曰進蹕也臣聞荆㐮居天下形勢之中乃古今必争之地萬一虜人乗虛而入使川陜隔絶則東南之勢孤矣近聞朝廷既罷汪澈命張浚兼都督之使令出扵一固已得䇿又用王彦知㐮陽議者以爲得人又聞以彦莭制趙撙則或以為不可撙乆在荆㐮得士卒心彦自外来遽令受其莭制恐武臣氣不相下或生釁端兼張浚在淮去荆㐮逺甚或有機㑹恐関報失期臣謂冝於前兩府侍從中擇一重臣威名稍著者以為宣撫既以浚督之文以重臣制之使彦與撙軰各當一面則荆㐮可以無虞矣今朝廷知備淮甸而逺荆㐮此臣所謂不可不深慮者此也今國家大則為進取之圖次則為守禦之計然議論及兵則其言必怯者以其所乏者兵與財也則兵不可以不招財不可以不理切聞西北歸附之民有可以為兵者衆督府及諸将不敢多募之者惧國家有飬之之費也然今日之勢有不得不宜命張浚諭江淮荆㐮諸将招其可用者而籍之汏其無用者而民之縦未至多亦可𥙷填折傷之額又東南之民亦有可用者如江西福建及台之仙居婺之東陽諸䖏其人皆徤而善闘往往曹聚於茶啇塩賈間可令守帥之臣重其直以招之必有應募者廣海諸冦有就招安者可從而藉之州縣有犯茶塩禁者貸其罪而兵之亦可以少補軍籍也至如財者臣以為生之不如莭之今國家比天下全盛太平無事時非不莭約比祖宗創業艱難時則可省非一也軋徳開寳間宫人不滿二百猶以為多左右内臣止有五十餘員止令掌宫掖未嘗干預政事宫殿内惟掛青市縁簾緋絹帳紫紬褥今宫人之数内臣之員豈能盡如藝祖時乎臣前日曾奏欲聖躬親率之者盖欲以藝祖為法也近日䑓諌所議裁减雖日計不足而歲計有餘亦不為無𥙷然奏巳上而未行者豈以衆怨所在而朝廷不敢當耶今彊埸未靜上下同憂權冝裁减以紓國用䑓諌既以身任怨大臣何避之有至如理財之術莫如遴選板曺臣前日與諌臣共留趙子潚者誠恐今日理財之臣未必賢於子潚也似聞海冦稍息不若别擇代者而還子潚不唯可以理財如旦夕車駕進發輦發輦轂之下謀議之寄議者謂非子潚不可也此臣所謂不可不急治者此也臣所陳四事碩陛下付大臣議之如有可採乞賜施行乞審核李顯忠䓁功罪劄子臣聞宿州之師不利而反議者皆歸咎李顯忠顯忠身為上将不能於勝敵之後撫存将士以保垂成之功遂致潰散而歸固不能無罪也然前日匈匈之議謂顯忠心懐南北鼓惑中外上貽聖憂今顯中既還上章請罪亦足以見䜛說之無驗矣說者又謂顯忠貪戀金帛欲為已有不分将士遂致離心理或有之恐亦未實兼顯忠亦劾奏統制官周宏等数人無故領兵自囬遂致失利欲正宏䓁罪臣亦未敢以為然昔慶暦間趙元昊叛大将劉平遇賊于延州力戦而死都監黄徳和遁走誣平降賊朝廷信其言遽欲戮平之家頼仁宗聖明遣御史出理其事既得其實遂褒平死事之莭而斬誣告之人今正虚實未辨之時臣以為不可不審朝廷不如姑兩存之以安反側却令都督張浚審核虛實聞奏如功可贖過則許其自新責其後效如罪多功少實誤大事則不可不正典刑但審而後行庻使聖朝不致濫罰不勝幸甚論龍大淵撫諭兩淮劄子臣切聞有㫖令龍大淵往兩淮撫諭者仰見聖心憂念将士故遣左右心腹之臣為勞来旋歸之使或出於大淵不惮勞苦慨然請行亦可嘉也然命令𥘉下議者囂然咸謂自古遣使或巡行天下㦯撫諭軍民皆於士大夫中遴選人才如漢之八使用張綱䓁唐之十一使用庾何䓁是也太上皇建炎紹興間亦嘗遣使撫諭矣或用䑓察或用郎官出於遴選時號得人今大淵雖爲潜藩舊臣議者謂非出扵朝廷遴選之公䘖命撫師有䡖國躰又慮大淵之出聞者謂是陛下所親信之人州縣必希意而将迎諸軍或望風而交結萬一復致人言如前日䑓諌給舎之論列豈不重貽聖憂亦非所以保全大淵也臣以謂王師之還陛下巳降詔尉撫之矣今只委張浚劳来安集之不必更遣撫諭之使切恐将士以宿州不利而還未測朝廷之意怱聞使命之出心必懐疑不如寝而勿行以安反側不然乞命宰相於朝列中擇其忠實通曉者敦遣之以重光華之使以塞中外之議不勝幸甚自劾劄子臣天資愚戇不逹時冝獨抱孤忠每懐憂憤自從捴角身在草苑聞醜虜亂華中原䧟沒未嘗不痛心疾首與虜有不共戴天之讎及聞秦檜用事辱國議和臣常思食其肉以快天地神人之憤臣素不識張浚聞浚天姿忠義誓不與賊俱生天下聞浚之名必以手加額盖忠義人心所同臣實敬慕之前年俻員館職嘗因輪對首言虜必敗盟乞用浚等太上皇不以為罪臣既去國虜果南牧太上皇親征起浚知建康府陛下嗣位因以江淮都督之任委之天下皆以為當惟史浩之徒不恱臣去年十一月𬒳召至闕首以恢復太計仰賛聖㫁又乞陛下不惑群議委浚以圖成功陛下不以臣言為非每蒙聴納浚前日入覲議進取之計雖非臣所與聞至於勸陛下破群議而用浚臣不為無力浚遣二将取靈壁虹縣及取宿州降三大将一月三捷議者皆服陛下英㫁任浚為難及聞王師不利而幸災樂禍者横議蠭起臣與一二諌臣常奏一勝一負兵家常勢之說勸陛下以剛大為心毋以驚憂自沮臣又謂陛下用兵為祖宗陵寝暴露而舉為徽宗欽宗復讎而舉為二百年境土而舉為中原弔民伐罪而舉與古帝王好大喜功𨳩邉生事者不同投機而進知難而退益當内脩俟時而動陛下剛明果㫁規模素㝎固不以一衂爲群議所揺然異論紛紛不肯置浚浚嘗上表自劾朝廷尚未施行臣聞諸葛亮街亭之敗亦有自劾之表國朝范仲淹韓琦西夏䘮師亦嘗降官但仁祖始終任之卒收後效臣謂陛下亦冝從浚之請薄示懲戒使浚得以號令将士以爲後圖如臣狂愚不合妄賛恢復又不合乞委任張浚今王師不利浚與其属待罪臣其可尚居凨憲之職使朝廷失刑欲乞陛下正臣妄言之罪罷御史職事仍賜竄殛以塞群議䕫州論馬綱状准樞宻院劄子樞宻院奏知䕫州張震申所有四川宣撫司措置川蜀馬綱改移水路事件委有未便去䖏申乞詳酌施行奉聖㫖除打造舟船外其餘事件並令吴璘𬋩辦其舟船令王某疾速應副臣契勘馬綱利害前知䕫州張震及諸司論列已詳其中利害之大者莫過於財與力二者皆出於民臣自入境以来切見䕫峽之間土狹民貧面皆菜色衣不蔽躰非江淛荆湖諸路之比為監司守令者儻䏻皆勞心撫字無一毫之優猶恐不䏻活之况今馬綱之害極重財力必當大困臣濫居牧民之任不敢不以實聞今来茶馬司及宣撫司所買馬每歲計一萬八百餘匹約計二百一十六綱本州若循環起發合用船三十餘隻每隻打造約費八百餘千馬舡易壊勢須一年一易計一歲之費為錢二萬六千緍自䕫至歸水路二百四十里每綱梢工水手約九十人較一歲之終為工一萬八千人每人口食雇錢約五百文上下水約一十五日通一歲計之當費錢十二萬貫草料批劵亦不下二萬餘緍較一歲之間費於馬綱者盖十五六萬貫矣本州三縣所𬋩梢工水手不滿四五百人若循環不替所少猶半必當役農民而為之而䕫之民力既困如此若又從而役之必有流離轉徙之患本州每年財賦之入不滿二十萬合起上供折估經捴制及官兵請給皆在其内今馬綱之費侔於所入之賦雖曰令吴璘𬋩辦豈䏻償所費十之一二財非天降地出又必取之於民而䕫之民貧如此財何自而出耶以一州推之則一路諸路之困又可知矣况水路正行瞿唐灔澦之險又有悪灘二十餘莭水勢湍急濆漩頗多馬性善驚聞灘聲洶湧必致跳躍不可控馭撼動舟船必有覆溺之患臣昨在饒州親見馬綱經過渉咫尺之渡中流遇風十死八九况千里之至險耶若舍舟用陸則自䕫至峽皆重崗複嶺上倚絶壁下臨㫁崖行人攀縁鼓慄汗下遇雨泥滑尤不可行非特有害扵人兼亦非馬之利若欲削平險阻便馬之行非惟重困民力又恐有害控扼之險非所以保護全蜀也臣所論利害皆是目見苟坐視一路生靈之困不以奏聞則上孤陛下任使之意将負不忠之罪矣伏乞聖慈特降睿㫖令馬綱復行舊路以安逺人不勝大幸再論馬綱状臣伏蒙聖恩頒賜御札謂軍機之務馬政爲先臣仰見陛下居安慮危不忘武事脩車馬而備器械盖欲如周宣復古之時又謂撁駕之役並用廂禁軍貼以吴璘正兵皆不科優於民臣又仰見陛下仁心愛民如武王之不忘逺也又謂囬船泝流頗費程限湏多作畨次免致稽滯又令臣身率以先共圖成效又足以見陛下雖居九重之深洞見四方萬里之逺閭閻疾苦無不備知不以臣為愚不肖不足以備使令戒敕丁寜俾輸犬馬之效况臣蒙誤恩擢居帥閫固當身先卒伍不惮勤勞然臣蝼蟻之誠不敢隠黙馬綱改行水路為巴蜀之病臣前已具奏及監司帥臣皆已力言之不敢再瀆天聴若夫撁駕之役易民以兵道路皆知陛下之仁心以臣愚見参以輿議則亦有未便者蜀江號天下之至險與其他水路大不相侔瞿唐灔澦及諸悪灘宻如竹莭巴峽之民生長於水者以舟楫為家捎濆撇旋欹桅側柂於波濤洶湧之間習知水道之曲折操舟若神猶不免時有覆溺之患彼卒伍軰自少長黥涅坐食軍門與水性素不相諳一旦强以牽捝必至觸石破碎人馬俱斃無疑矣又三峽束江断崖絶壁挽舟者無所寘足攀縁而過如猿猱然兵卒豈䏻為之况宣司正兵皆西人尤不善操舟雖貼無益馬綱之来急若星火州縣既無可以牽駕之卒官吏以獲罪為懼其篙工水手必不免役民以充之雖聖㫖不欲科優於民其勢不得不至於科擾又䕫峽為四川門戸長江上㳺正賴此曺守禦控扼以壮天險之勢然土狹人希廂禁軍類多缺額諸州每以招填不足為憂重以出戍於夷陵防秋於諸䖏者非一所存無㡬若又役以撁駕疲於往来以無㡬之卒伍應無窮之馬綱非惟耗費錢糧妨廢教閱正恐州郡空虗因致意外之患非細事也况茶馬司歲發馬一百六十綱而宣司不與焉除自五月至八月江流泛溢瞿唐不可上下舟航當戒謂之住夏一歲之間可發歲額之馬者凡八月每月計三十綱每綱用三船每船用十五人十綱為一畨則用四百五十人上下二畨則倍之為三畨更替則又倍之臣所論者一州乃馬綱巳經過而目親覩者爾馬綱過䕫府一路者凡六州通而計之則每畨計二千七百人上下畨計五千四百人三番更替計八千一百人若更欲多作番次非惟兵不足用而舟艦亦無臣所治者䕫州也䕫為帥府係屯兵之地而数猶不足其他如涪忠萬等州廂禁軍多者不過四五百人少者二三百人歸州所𬋩止百餘人其間又有剰員半分癃老疾病者居其半若盡駈而為梢工水手為一畨且猶不足况欲多作畨次耶臣愚以為不若且行舊路舎危就安㦯以山險馬瘏為慮冝於鄂渚漢陽諸䖏置監以休息之壮者發至行在病者留以牧養水草既便馬必藩育亦可以為江淮荆㐮警急之俻固亦無害其為馬政之脩也臣非不欲率先奉行以荅知遇實以馬綱行水利少害多他日㦯致生事上貽陛下西顧之憂則臣誤國欺君之罪不容誅矣况此事干数路所擊非䡖伏望聖慈出臣此奏令兩府大臣議之參酌施行不勝大幸除知湖州上殿劄子三首臣聞聖人以無難而畏賢君以無灾而懼國多難而天有灾此天心仁愛人君以灾異而警惧之欲其恐惧脩省舉天下而措之安也昔堯有九年之水湯有七年之旱周宣王外有四夷之交侵内有太甚之旱魃天灾國難有若不易支持者然堯以帝湯以王宣王以中興者豈非天以灾難啓之一三帝王䏻修徳以應之耶共惟陛下即位以来六年于兹矣躬攬權綱厲精政事雖漢宣帝光武無以加然天灾流行無歲無有旱于夏涝于秋饑饉荐臻􅍚疫継作去八月海溢于温死者以数萬計今歲川蜀荆南赤地千里迩者天作淫雨害于粢盛江淛之間𬒳害尤甚陛下遇灾而惧遣官分禱䟽决滯獄减放房緡詔荅大臣歸過於巳可謂能恐惧修省矣臣来自逺不知左右前後論思獻納之臣亦嘗有以脩徳之說献忠于陛下否乎書曰惟徳動天無逺弗屇詩曰皇天親有徳享有道堯湯宣王之所以應天者盖在乎是臣竊謂陛下冝法堯之盡道湯之自責宣王之側身修行早夜孜孜惕然自念曰天道不逺灾異胡為而来哉豈吾心有所未正意有所未誠欲明明徳於天下者有所未至乎忠直者未用謟䛕者未去有以害吾之治乎聚歛之臣未斥奸賍之利未除有以蠧吾之民乎議法㦯失之深用刑㦯失之過有以傷吾之仁乎㫖酒之嗜聲色之邇毬馬馳騁之娱有以累吾脩身之徳乎責已以誠應天以實而無事乎虚文孔子曰丘之禱乆矣盖言出入起居之間罔不欽顛沛造次之際必於是不在乎區區禱祈祭祀也如是不惟可以弭災難於一時古先帝王之治效功業當復見於今日孰謂灾異非天所以𨳩陛下耶學識淺陋惟陛下採擇右一臣嘗聞先儒孟軻称周武王曰不泄邇不忘逺是言非止為一武王設盖為後世帝王治天下之訓國家全有吴蜀之地蜀去行在萬里逺而易忘臣昨蒙恩出師䕫府二年之間有所聞見姑言其大者三事一曰監司二曰虗額三曰馬綱今朝廷但知蜀之重權在宣撫制置二大帥臣尓而不知四路監司事權之不䡖也彼去朝廷既逺威福得以自恣傲視僚属有同皂隷動揺州縣人不聊生監司之中漕臣尤重一路銓選咸出其手非若他路上掌金榖之事苟非其人則州縣受害無所赴訴地逺之害如此其可忽耶臣碩陛下戒敕宰相冝於四川監司尤加精擇務得循良愷悌之吏為之以安逺方不必尃取其能辦事也臣在䕫門每見蜀之士夫往来咸言西州諸郡困於虗額盖是積年拖欠催科不行雖屡經赦恩有司不與放免又昔之監司好聚歛者取諸州積年酒稅諸色無名科歛之数以一年最多者立為定額其後酒稅諸色之数不登而有名無實之額常存為捴司者以有名無實之数督漕司而不得其實漕司亦以有名無實之数督州郡州郡迫捴漕之威而無錢以輸遂預借民間常賦以充之後之郡守到官欲催常賦聞已預借矣於預借之外又借焉有借及二三年者如卭彭諸州困乏尤甚朝廷知其弊亦嘗有㫖减放捴漕之臣不䏻奉行徳意而催科如故州縣不堪凋瘵日甚今之為宣制二帥及捴領者皆一時重臣名士必能以撫字為心臣願陛下親賜御扎俾條陳虚額之弊而速降詔罷之庻使逺方之民復有生意臣至䕫州而馬適行水大為䕫峽諸路之害其端起於吴璘小人從而迎合之以行水為便欺罔朝廷以求官聀臣嘗兩奉御扎非不欲率先奉行盖知陛下愛民甚於愛馬而䕫峽之民貧尤甚故不避罪誅力陳其害今茶司之馬自五十綱後雖不經由然朝廷未有明文罷之有一二提舉之臣猶以奉行為名㳂江州縣治廐造船之役猶未已臣碩速降聖㫖令復行舊路罷提舉焉綱之名諸州所差牽挽之兵各還其所槽廐舟船不必脩治乃見聖治之不忘逺也臣又謂朝廷於蜀非特以逺而不可忘今日之所以立國者正賴蜀以為重昔三國之時吴蜀為二家故不䏻進取中原尺寸地今天以吴蜀全付陛下正是經营天下恢復境土之資今傅聞虜人積糧宿兵於境上有窺蜀意蜀天險也非虜可得而窺正恐民心或離釁由内起為可憂尓撫綏固結在今日為尤急臣故敢献其狂言右二臣嘗謂君子小人常相為消長人君未嘗不欲進君子而退小人也然小人常見用君子每見䟽者盖君子小人之難知雖堯舜猶以為病君子目小人為小人小人亦指君子為小人當孔顔桀跖相閧于前左右佩劒彼此相笑之際人君以一人之聦明誠有不易辨者况君子直而踈小人巧而侫直則動多忤意踈則不能無過故人主反疑君子為小人巧則䏻以智術自将侫則䏻能迎合上意故人主反以小人為君子自古所以治少而亂多盖由君子小人之不辨也共惟陛下禀聦明絶人之資行帝王正大之道歴古興亡治亂之迹皆洞然在聖學中君子小人之情状固已備知之矣然天下所謂君子者㦯未䏻盡用或暫用而卒棄之所謂小人者或未能盡去㦯暫去而復合得非知人之哲亦猶堯舜之難乎夫君子小人雖不易知而亦有可知之理君子孤立如松栢小人附麗如蘿蔓君子進必繇直道小人進必繇邪徑徃者藩二使令之臣竊弄陛下之威福士大夫無耻而好進者莫不犇走其門陛下赫然震怒奮自英断斥而逺之天下莫不鼓舞聖徳然附麗而進者猶未正典刑唐憲宗既誅王叔文并斥八司馬之徒終身不用元和威令復振號稱中興盖由此舉仐之附麗者𥘉無八司馬之才而悪則過之附叔文者官止爲未有若今之竊髙位達官者小人朋比之迹固不逃聖鍳冝擇其一二之尤者薄正其罪又取其能自卓立不附炎於炙手可熱之時與嘗言其罪悪者稍進用之如是則君子小人知所勸懲矣語曰君子喻於義小人喻於利君子之進必以道誼自奮小人之進未有不以利求合者前日朝廷以財賦不足爲憂小人遂獻羡餘以求進朝廷不惜名器以羙官要職䖏之諸路監司郡守翕然胥效爲剥下益上計州縣騷然民不聊生近者臣僚論列陛下嘗罷一監司固足以爲後来之戒然其尤者方進用未巳全其大而治其細又何足以懲耶臣所謂君子小人有可辨者陛下第觀其自何門而来以何術而進因可以灼知其為人矣宰執大臣天下之選固不可使小人雜䖏其間侍從之臣以論思獻納為職即異日之宰執大臣也又其可使小人居之耶治道在知邪正然邪正難於盡知陛下冝於宰執侍從䑓諌之臣精加識擇自卿監而下與外之監司帥守責之宰相可也臣言狂妄惟陛下察之右三除太子詹事上殿劄子三首臣恭聞陛下断自宸衷首建國本天下相賀以為社稷無疆之福臣𥘉至闕下聞太子有尹京之議臣竊以為未然臣聞三王之教世子也不過教之以禮樂樂以治内禮以治外俾知父子君臣之義而巳成王之為太子也召公為保周公為傅太公為師保保其身躰傅傅之徳義師導之教訓未聞其尹京也國朝雖有真宗故事至仁宗為太子則不然當時左右前後罔匪正人養成仁厚之性四十二年之治雖堯舜亡以加𥘉不由尹京然也况今天府事繁其所委任之臣未必有如畢士安者使太子裁决事事皆善亦不足以為太子之聦明增太于之盛徳萬一少有過差十手所指小人易得浮議傅聞四方所損非細非所以愛太子也太抵太子之聀在於問安視膳而巳至於撫軍監國皆非得巳事也陛下伹與之遴擇師友僚属俾日與端人正士㳺養成徳性相與講論古今治亂之理他日民情吏事不患不知臣願陛下與一二大臣議之寝尹京之議以安國本社稷之福天下之幸也右一臣嘗謂官冗之患莫如今日漢唐之時部刺史之聀於今為甚蕳而事無有不舉者今之監司有漕有憲常平茶塩則有提舉坑治鑄錢則有提點其聀甚備而治不加於昔何也監司之聀愈多而州縣之擾愈甚於治無益也邇者提點刑獄增置武臣臣竊以為贅矣且是官之說臣不知其所為者何事也以詳刑之任耶則一道之使固有其職未見其廢事曰訓練士卒則捴管鈐轄路分都監者即武臣之監司也置之而無用廢之而不為闕是官之設豈不為冗㢤一監司之建增州縣之大優也臣竊攷之祖宗雖嘗有武臣同提點刑獄矣至嘉祐則罷之其詔之大略以謂武臣或出将閥或由軍功文墨期會未必深究監司項背適以為煩夫既置之矣而繼罷之知其無益也昔罷之今復置之在朝廷則冗於官在州縣則優於民則其置之也甚無謂矣臣愚欲望聖慈㫁然察其無用罷去勿置庻㡬官不虗設事得其當而人各安其職矣臣不勝至碩右二臣嘗謂人心險於山川難於知天謂其不可測也况狼子野心之人烏能保其乆而無患也㢤唐太宗教射於殿廷群臣諌之曰律不可以兵刃至御在所今以卑碎之人張弓挾矢於殿陛之側萬一狂夫竊發出於不意非所以重社稷誠哉憂國愛君之言親衛将卒且猶不可而謂㱕附之人信其終無害也難矣近者㱕明歸正之将陛下旌其忠義壮其勇略擢而用之日與之親使効其力所謂推赤心置人腹中者固足以見大有為之志矣然天下之人凡有愛君之心者莫不疑焉謂自古以来莫難於用斯人而用之者罕見其乆而不為吾患其棄彼歸我心巳二矣今乃使之朝夕以侍左右設或不飽其欲其謀之深計之乆而心之不䏻保則将若之何至於斯時雖悔無及臣請擇其灼然忠誠可以任用陛下素所知者属之以事權厚之以爵禄勉之以功名亦足以示無疑之意而激其圖報之心矣何必日親之而後為待遇之至㢤臣碩陛下攷之於往古慮之於将来特加宸念毋憚一時之難從而置乆逺於無害不勝社稷生靈之願右三應詔舉官状准尚書省劄子奉聖㫖令侍從䑓諌两省官薦舉堪充刑獄錢榖及有智畧吏能各二人並依保舉法仍限半月者右承議郎林仁厚學問該通議論近正婁更任使俱有可觀付以决獄理財必能詳刑莭用左奉議郎新監登聞鼓院丁康臣嘗知䖏州青田泉州恵安二縣獄訟詳明民無冤訴催科不優辦居衆先付以繁難必可倚仗以上保舉可充刑獄錢榖之任左宣教郎新知福州長溪縣劉鎮婁更州縣任使所至皆有治績明敏之政吏不能欺左宣教郎新知福州候官縣林思誠為饒州教官嘗挕郡幕賛畫居多耿介有守不附權貴左從事郎添差温州教授王信素有文學尤通世務嘗挕郡丞時適荒旱留心賑濟不惮勤勞一郡之民遂免流離之患以上保舉知畧吏䏻可備委任舉張栻自代状准令莭文諸侍從官授訖三月内舉官一員自代右伏覩右承務郎試尚書左司員外郎兼侍講張栻學術精深氣禀剛正乆居經幄冝賛青宫舉以代臣寔允公議梅溪先生奏議卷第四梅溪先生後集卷第四詩州宅鑑水稽山擁卧龍黄堂人似坐仙宫風流惟有兀才子終日賦詩屏障中蓬萊閣祖龍車轍遍塵寰只道蓬萊在海間空上望秦山上望不知此處是神山清白堂堂與泉皆范文正公名之錢清地古思劉寵錢清地名父老送刘寵処泉白堂虚憶笵公印綬紛紛㑹稽守誰能無愧一賢風清白泉聖人逹節猶憎盗志士清心肯飲貪試向卧龍山下酌世間無似此泉甘觀風堂簿俗澆風有萬端欲将眼力見應難但令心境無塵垢端坐斯堂便可觀望月䑓明珠遥吐卧龍頭漸覺清光萬里浮人望使君如望月要湏如境莫如鈎秦望閣𥿄上觀秦尚過秦那堪山作眼中塵為言髙閣登臨者莫作秦人視越人望海亭踏雪遥登望海亭扶枽日上卧龍醒㣲臣望處非滄海只望尭天萬里青卧龍山鑑水連天僅可容稽山照眼五雲濃只憂旱歲無霖雨誰識東州有卧龍種山决䇿平吴覇業成青山長占大夫名子胥忠義無生死怒氣随潮到越城競秀閣憲䑓高閣偶躋攀萬壑千岩指顧間山色元来本無競人心自是錯看山蕺山十九年間膽厭甞盤羞野菜當含香春風又長新芽甲好擷青青薦越王八松瀟洒荀家好弟兄秦封不汚有餘清鍾成一種棟梁氣散作八方風雨聲右軍祠堂欲弔右軍千載魂祠堂荆棘断碑存老僧相見話前事問我蘭亭㡬世孫鵝池鶂鶂能鳴異衆禽池邉墨客最知音世間多是山隂嫗應恐悮猜君子心硯池鳯翥龍蟠字字竒陶泓湯冰向斯池波心雨後一魚躍猶似青年吞墨時題扇橋右軍一畫千金重妙意寕容市嫗知明日重来堪一笑管城那肯更臨池雷門吴越興亡事若何譙門遺迹枕山阿大声曽作雷霆震應笑人間布鼓多曲水閣太守蔣堂所建今号飛盖堂王謝蘭亭乆寂寥茂林脩竹自蕭騷蔣侯近代風流守曲水流觴意亦高西園西園風物冠東州飛盖紛紛爛熳游惟有紅蓮幕中客倚欄纔得片時留望湖亭杖屨登臨望鑑湖湖中一半已湮蕪誰能更継東郡守長使山隂水旱無吴先生祠右軍宅化空王寺祕監家為羽士宫惟有先生舊池舘春風帰在杏壇中賀知章祠賀老祠堂枕鑑湖霓裳羽化宅荒蕪無人更問君王覔轉使髙風千載孤鑑湖胷中萬頃元才子方外孤標賀季真鑑水縈回三百里風流何止两唐人禹廟越囯遺民念帝功稽山庙貌勝卑宫少陵莫歎丹青落𥿄上丹青自不窮菲泉𣑽王宫近夏王宫一水清含節儉風越俗不知王好惡泉名却在酒名中禹穴好古貪竒司馬迁胷中史記越山川如今禹穴無㝷處洞鎻陽明石一拳禹冗道家謂之陽明洞天馬太守廟㑹稽䟽鑿自東都太守功從禹後無能使越人懷舊徳至今庙食賀家湖吴越王廟一劒功成三節还尽将錦秀褁江山斗牛氣㓕英灵泯廟比昭王屋一間望秦山洛思昔有人思洛秦望今無客望秦回首長安在何處誰能念彼下泉人少㣲山出郭舟行十里間少㣲山近若蕡山山中處士已長徃一點客星雲外閑梅梁結實㡬調商鼎味成材宜作禹祠梁世間何歲無風雨鉄鎻無端誤見殃窆石越俗流傳素可疑退之詩云越俗不好古流傳失其真禹陵窆石果何時只應便是專車骨未可呼爲沒字碑窆石形真有数字磨滅不可曉或以爲古碑和昌齡弟見寄經年游官思家鄉枕間魂夣長飛揚甌越相望數百里魚雁来徃安能常水緑蓮紅王儉幕我愧才踈筆常閣居官不事羡長卿執一無權猶子莫昔年姜𬒳今獨眠何時更作三珠連左原風物亦不惡溪蓴抽絲蕨吐拳阿連春艸詩篇好勸我帰来宜及早代笠亭前烟雨中共把鋤犁寕待老懷喻叔竒巳邜結得賢関雁塔因東州相遇益相親凌雲三賦我慚馬清唱百篇君勝秦冀北郡空殊昔别江東日暮倍傷神同年四百二十六莫逆論交能㡬人次韵周尭夫贈睡香長向春前臘後開要将風味闘梅魁名從廬阜夣中得根自鄮山嘉處来風拆錦嚢香不断日烘寳盖翠成堆定湏移向梅谿去栽伴吾廬桂與槐送陳元佐游四明鑑水悠悠接鄮川宦情客况两凄然扁舟乘興梅花月樽酒送行燈火天我似鄭䖍官舎冷君如馮子主人賢虞庠春榜無多日行看香名動日邉聞禮生日二月二桃水仲春月蓂階雙莢生添丁慰盧老小子慶徐卿禀得中和氣看成逺大名青春已如許勉力継家声次韵趙觀使鴛鴦梅奴視紛紛晳與休芳心那肯貯離愁結成氷玉岳湛侣開伴紵羅施鄭流影照婵姢如並卧枝横清淺似双浮不知他日調金鼎勝得櫻桃氣味不亡友孫子尚藁塟㑹稽山大禹寺之側某至官八日出郊訪其墓不獲明年春𬒳命祀禹訪而得之又明年春再徃酹酒因植栢十根哭之以詩疇昔相知似弟昆那知半世死生分無縁更飲盃中物想見能修地下文有媿乘車􅌾元伯僅同觧劒弔徐君他年黛色参天處是子㑹稽山下墳子尚墓種栢子尚乃如許牡年墳巳荒我来親種柏含淚待蒼蒼鄭夫人挽詞好谿太守非常好慈母端如孟母賢熊膽調成真噐業魚軒游徧舊山川顔間日有平反喜方外時修香火縁身世九齡家萬石定應含咲向重泉錢夫人挽詞忠孝之家女亦良教傳彤管有遺芳藁砧舊擢儒林秀桂子新飄月窟香方擬魚軒霑寵渥遽驚風樹変凄凉稽山鑑水青春暮薤露声中恨更長連月不雨農事失時府帥决獄廪飢徳政動天霈然而雨某吟成律詩一章以賀旱魃為灾罕似今霈然一雨慰群心非関菩薩觧為澤自是使君能作霖躬慮滯囚冤尽釋廣開義廪恵尤深佇公帰囯調元氣散尽愆陽與伏隂次韵濮十太尉喜雨去歲秋大水民食方苦艱丁壮尚流離而况白與班今春又不雨事與安危関使符下列郡呼雩舞童鬟投文責老龍貪睡何癡頑我聞救灾術廼在人事間興師古有衞决獄唐称顔年因弔伐有雨送軺車還嗟此旱魃虐和氣知誰干半歲幸一雨人心寕不歡麥秀禾可植田里庶少安上紓當宁憂吏責亦稍寛我家蕭峯下山長路漫漫東臯有先業頗亦知艱難帰耕願及早免起将蕪嘆叔父寳印師徃永嘉妙果院未年而退弟子徳純住龍翔一日帰省其師亦退居林下緇素挽留之乃遁扵異郡不踰月間師弟子相継退休識者高之目為僧中二踈某竊禄将一考矣有媿二高僧因書一絶庶㡬他日或蹈其高躅云掛冠林下近来無誰謂僧中有二踈應笑紅蓮幕中客故園三經已荒蕪寄黄簿文昌六一移書責司諌聱隅間命避徂徕兹風不作己乆矣吾子所為何壮㢤在列諸公顔有媿附炎群小瞻應摧要湏終始全名節莫遣心随利禄回次韵濮十太尉題禹穴寰瀛三十六名郡越在東南雄四鎮宛委周回三百里屮木山川有光潤秦山鑑水藴秀異人物風流夸漢晋傳聞禹穴自太史好古無人若為問韓退之詩云越俗不好古㳅傳失其真杖屨飄然㝷洞天照眼千岩若攅刃細看盤石心愈疑遐想丹書氣猶振禹貢無傳豈其闕遁甲所書何足訓彛倫叙自九畴錫水土平繇五行順洛書六十有五字王業巍巍此途進八卷飛沉天與泉兹說荒唐理難信吾儕去古恨大逺企首難窺禹牆仞穴傍有井清且甘一酌端䏻洗驕吝薛師約撫幹召飯于圎通寺主僧瀹茗索詩緑暗梅欲雨風薫麥初秋官舎厭卑􅊜僧廬訪清幽儒餐慣𬞞飯道話便茶甌鑑湖倘容覔杖屨時来游潘知縣甸弟撫幹畤和詩復用前韵堂堂𬗋㣲公氣節横清秋風流属猶子胷􅊤羅竒幽詩篇粲華蕚名字宜金甌州縣聊爾耳行矣天池游酬冨陽張叔清縣尉尺素遥傳到越城入懷珠玉照人明登科雅服才名早筮仕喜聞官業清空把交情對山色采詩有吴山空對越山明之句要令音問讀潮声怱怱作荅無他語莫羡人間勢利榮周徳貽得子以錢果為貺僕不獲為湯餅客賀之以詩双鯉来從古􅌘州喜聞英物誕東州清和時節緑隂滿秀異谿山佳氣浮分貺金錢意殊厚欲為湯餅客無由乃翁指日身龍虎况有竒兒氣食牛喻叔竒迎侍赴桐川榜其堂曰戯綵書来求詩寄題一絶桐州綵捧蹔宣威首闢萱堂上夀巵堂上慈顔笑還語老莱文采媿吾兒女子生日五月十二日吾女何時見薫風欲半時年齡今稍長礼法要湏知好讀班姬誡休吟謝女詩萱堂有慈母淑徳可為師范文正公祠堂詩并序寳元間文正范公自潤徙越治先風化一日獲廢井于州治之西澄而新之易舊堂築新亭俱名曰清白規官師也閱歲浸久舊刻弗存紹興戊寅秋吏部尚書王公来師是邦暇日㑹僚属于兹堂酌泉煑茗修范公故事慨然歎曰自漢迄今守兹土者亡慮数百人莫賢於范堂與泉盡其甘棠也記其可以不刋又謂公自筮仕掾桐川典郡帥邉所至立祠獨越無有於典爲缺於是求公遺像得之於其家比它本爲真乃命工繪之即其堂而祠焉明年閏六月庾申躬帥幕僚祀之某作詩以紀盛事堂堂范公真天人配我仁祖爲元臣材兼文武懷經綸先憂後樂不爲身上與䕫卨相等倫正色朝端批逆鱗三黜愈光名愈聞一麾東游禹所廵作詩懷蠡祠季真卧龍山麓井乆湮綆而汲之清且新堂于其旁記厥因名標清白埀不泯規爾官師意諄諄洗貪濯盗思還淳人亡迹在嗟己陳断碑徃徃埋荆榛後人不識真天人但能日飲堂中春越以清白堂名酒使君好事賢且仁治民律已惟公遵登堂感㮣懷斯文刻石繪像揚清芬丹青炳燿如麒麟凛然如生見如親躬修祀事率幕賓手酌寒泉羞澗蘋一酌清我僚吏民再酌為囯清簮紳要将清白風無垠庶俾范公遺志伸公乎為仙為明神為澤為瑞為星辰當宁焦劳思若人九原喚起清邉塵次韵梁尉秦碑古凨㑹稽秦頌徳碑丞相李斯篆世傳在秦望山莫知所在教授莫君好竒嗜古搜訪尤力有言碑在何山者莫以語某何山見於圖經在秦望東南疑其真秦望也某欣然欲徃職有所拘以告㑹稽尉梁君梁慨然而行登山果見之碑石僅存字磨㓕巳尽墨片𥿄而還作古風長韵具記始末因次其韵且記吾三人好事之癖亦以示後人也姬嬴遺迹存者希世傳石鼓稽山碑石鼓榆楊得韓子文與二雅争驅馳秦碑夸大頌功徳埋沒草莾無人知或言出頂石猶在上有虎豹龍蛇螭神蔵鬼護荆棘蔽崖懸磴絶登無岐廣文好竒穴探禹梅仙喜事僧㝷支攴遁昔㳺越中好山水梁仙宿雲門訪古迹扵曽我賛其行要親覩勿受世俗流傳欺望秦望秦两嶄絶何山壁立東南涯豊碑屹植最高處不知磨㓕從何時剔苔掃墨了無有模糊片𥿄亦足竒濃雲䨢䨴黯將雨古木槎牙蟠老枝帰来走筆出險語訶政叱斯同小兒詩成得得冩寄我詞嚴意偉法退之我聞秦人㓕六囯酷若犬磔臨江麋先王法爲秦所負負秦况有秦有司五經灰飛儒濺血尭舜周孔何能爲上蔡獵師妙小篆奴視俗体徒肥皮東封太山南入越大書深刻光陸離沙丘風腥人事変鬼飢族赤誰嗟咨漢興萬事一掃去惟有篆刻餘刑儀磨崖𣣔作不杇計其如暦数不及期蚩尤五兵紂􅃮噐人物羙惡寕相庇我雖過秦愛遺畫南山入望頻支頥不湏嶧陽訪棗刻不用迁史觀雄辭虚堂黙坐對此𥿄閉眼暗想君勿嗤要知秦碑沒字本却類周雅無辭詩府師王公中秋宴客蓬萊閣分茶賞月于清白亭某以幕尞與焉坐上成二絶使君開宴小蓬瀛幕客参陪亦與荣茗煑寒泉飲清白酒斟佳月賞分明白髪青衫老幕官蓬莱秋月两年看興来端欲乘風去不怕瓊楼玉宇寒又和趙仲永撫幹二首氷輪飛出暮雲端更向蓬莱頂上看端似虹橋翫金餅絶勝華屋見銀盤光浮酒靣杯尤滑清入詩腸句不寒又與鑑湖添勝事一時賓主尽鴛鵉千岩競秀越王州地勝錢塘與虎丘龍卧半天頭吐月鑑湖千里影涵楼宴開秋色平分際人在蓬壷最上頭不負良天更輸我此中此夜两年游去歲中秋與同僚賞月蓬莱閣今復與府㑹旧㳺諸公皆不在焉再和峥嵘髙閣聳雲端萬􅊤千岩坐上看八百里湖寒鑑莹二千年囯卧龍盤金風吹靣掃殘暑明月入懷生嫩寒見說神山正相偶醉中端欲駕仙鵉家在東嘉山水州玉簫丹竈古仙丘两年秋月登蓬閣千里鄉心繞謝楼作賦端同北窓裏思帰長詠大刀頭與君何日脫塵鞅杖屨逍遥物外游又用看字韵酬趙仲永紅蓮分幕忝同官秋月揚揮並席看句好湖山添秀氣談清齒頰帶㣲寒故参政李公挽詩三首光字太發一代高明學三朝骨鯁臣淮南惮長孺楚囯忌靈均死尚憂王室生寕問大鈞姜山同峴首千古淚行人某比見畨撫幹言公在謫所及埀死之際所言皆天下大事潘乃公之壻也方靣功尤著朝端氣最剛身能縳元濟城不䧟睢陽思奮少連笏耻同袁盎堂永嘉瞻五馬遺愛可能忘公在南荒日迹危名愈尊芝蘭坐竒禍瓜葛醖讒言斥去權臣力生还聖主㤙衞公精爽在何用些招魂九日與同官㳺戒珠寺用去年韵九日重登古蕺山劳生又得片時閑菊花今歲殊不惡蓬鬂去年猶未班藍水楚山詩興裏鑑湖秦望酒盃間醉中同訪右軍迹題扇橋邉踏月還顯仁皇后挽詞三首代安撫王尚書媯汭嬪天子塗山毓聖人聦明配昭献慈儉継宣仁湯沐寕私已園陵不病民鴻休耀彤管無復数娀㜪八帙年無憾三仁謚有輝囯朝仁宗皇帝宣仁皇后大行皇太后皆謚日瑶池燕仙侣窆石􅌾遺衣忽覩龍輴去猶疑騩馭帰聖情哀不尽淚向禹陵揮代邸迎帰日炎啚喜中興觧将天下飬惟有聖人能方慶朝長樂俄驚望献陵寢園祗奉處擁紼淚埀膺胡氏挽詩婺女人嫁陳氏王尚書弟婦也王作墓志婺女生賢女端宜配徳星登堂飲姑乳調膽教兒經子舎春猶盛孫枝葉已青韓碑紀遺懿彤管継芳馨次韵喻叔竒追感去冬天衣之游去年同會類高陽蠟屐登臨雅興長可但山光向人好更欣天氣為吾良路經禹穴深懷白目對秦峯逺憶黄天衣在秦望山下按朱育對四皓黄公者乃越人也日線又添人正逺尺書千里尉相望次韵劉判官大辨見贈篋蔵詩墨尚澄鮮長記東嘉共綺筵游宦俱為蓮幕客異鄉重見菊花天謝池一別真成夣鑑水相逢似有縁小小園林吾欲老看君功業上凌烟刘丁丑在永嘉同郡燕卽席作詞有凌烟多少功業之句趙仲永以御茗宻雲龍薫衣香見贈仍恵小詩次韵天上人回餅賜龍香沾衣䄂十分濃明珠照室光生豔三絶全勝萬石封仲永再和三絶復和以酬間世宗英學海龍交情尤爲野人濃天香御茗分竒紀盡是慇懃手自封手汲寒泉碾小龍天香一炷滿衣濃與君慷慨論時事欲吐丹心上實封長記中秋踏卧龍尚餘詩興至今濃羡君豪邁如韓子聮句猶容李正封寄題周尭夫碧梧軒鳯凰梧棲竹實食胡爲使之在枳棘開軒種梧髙㡬尺鳯兮凰兮聊爾息莫羡風㣲燕雀髙一飛定展冲天翼覧輝瑞世鳴朝陽此梧長向人間碧留别民事堂二年宦東州民事了無𥙷俯仰媿斯堂何以報明主故家簫峯下帰耕及春雨平生甽畆心感槩聊自許題雙峯資深堂書生𥿄上誦糟粕釋子舌端談葛藤道在湛然方寸地不知深造有誰能我到雙峯㝷寳月為晋一宿話資深但能造得儒宗語使是能傳佛隴心雁山門户此中入南北两峯相對尖我與林泉有盟約問師覔取一峯潜千峯巳見見雙峯甌越山川在眼中吾祖吹簫定何所㑹湏乘鶴訪遺風双峯之西南亦有吹簘峯堂名石刻两俱存令我深懷舊長官學道資深更深處居安能使庶民安周開祖昔令楽清有遺愛堂名乃開祖所命宿靈岩贈長老敏行藍輿謝公嶺杖屨矩羅室净名訪維摩一菴僅容膝㝷僧畫屏中徃徃多八十平生看不足靈岩最竒絶老禅蜀中来心印傳佛日脚力窮天下稱此為第一兹山昔未開蔵閉最深宻倘不遇熈朝造物肯容出孫公賦天台勝地尚遺俟我欲續金声願借山中筆梅溪先生後集卷第四梅溪先生文集卷第四詩次韻寳印叔題止庵三絶鑿石依山作小庵花香入座月侵簷雖然眼界無多地觧使人天競聳瞻容膝茅庵不妄開𣣔令人悟止由来箇中妙意知誰觧多作休休莫莫猜晚學無由識道真前賢未許継芳塵道從何進從何止敢叩無為絶學人翁府君挽詞子萬春壻劉鎮皆登科埸屋牧功不在身蘭馨玉潤揔竒人過庭詩禮家風変坦腹門䦨喜氣新華屋産芝雖羙瑞白頭生齒誤青春籃輿方起南㳺興無柰今年歲在辰十月十九日雷二十一日雪前日始驚雷失令今朝忽見雪漫天寒窓夜擁黄紬坐閑讀春秋隠九年次韻表叔余叔成示児余名䑾子璧從予㳺父子乃天性鍾情誰不然教之以義方先賢有名言日嚴在所尚私念冝舎旃君子不自教遣隨師友肩青紫乃餘事要當知聖賢居家務孝弟立行防悔愆窮當慕顔回逹勿為公孫庶幾㓜所學終身可行焉不見不邳丈秀彂從妙年束書入賢関日與英雋聮忽作何蕃歸甘旨奉晨昏丘園事髙尚腹笥常便便過庭有竒児詩禮得家傳勉㢤尊所聞愼勿學鄊原表叔陳景韶挽詞問舎求田事元龍意本䡖功名孤壮志詩酒送平生李密傷爲弟劉牢喜有甥毛叔度其甥也詩書巳三世二子盍升卿先友嗟無㡬公今亦古人平門散車轍蕃榻鎻埃塵甚媿韋公厚深知管子貧平生談笑地感激涙沾巾詠述師葡萄柱杖拈餘戯挿泥草龍珠帳掛簷西荔枝體物差勝棗畢竟俱非善品題十一月七日東山省墳因思先子昔年題壁有山光水色两依依之句舊屋巳壊墨迹不留山水依然感歎不巳因成一絶松楸一見一傷心亭院凄凉慘樹隂記得先君舊題壁水光山色恨難禁寄萬大年九萬程遥共退飛江南竹葉後先歸儒冠到底輸紈袴関吏還應笑布衣雖欠姓名聮桂籍不妨歡笑奉親闈殷勤尊酒論文約却恨還鄊與願違戊辰春與大年俱下第同歸全㑹稽予復還學追補至秋還家萬季梁和詩留别再用前韻三年燕雁不同飛一笑相逢尉逺歸搜我肺腸茶著令予帰與諸友講茶令每㑹茶指一物為題各㪯故事不通者罰命季梁掌之飲君文字酒淋衣詩方唱和如仙舘予昔招仙舘与同舎結詩社近諸友亦多唱和人遽飄零似省闈畢竟此心元不别秪應形影暫相違将過萬橋用前䪨寄大年先之三年在阜不鳴飛側翅俱從舊路帰師徳量寛真耐事謂先之沈郎詩瘦不勝衣謂大年都縁有職供甘㫖可是無心恋闕闈酒發葡萄螯斫雪定知此碩不吾違種蘭有感芝友産岩壑無人花自芳苗分鄭七穆秀彂謝諸郎世競憐春色人誰賞國香自全幽静操不采亦何傷再用前韵誰櫂深林秀遥分奕葉芳秉殊溱上客握擬殿中郎眼净見幽韻心清聞逺香當門不及種踐履恐成傷三月晦日與同舍送春扵梅溪因誦賈閬仙詩云三月更當三十日風光别我苦吟身共君今夜不湏睡未到曉鍾猶是春時有二十八人遂以齒序分韻記得来時手自探預知今日思難堪樹頭緑暗鶯如訴地上紅多蝶尚貪此夜鍾聲那忍聴明朝酒盞可䏻酣却因送别還驚我老境如蠶已食三為麥祈實陽律臨姑洗宸心念歲飢時羞方廟献麥實為民祈日煖輕花吐風和翠浪㣲敢言因鮪薦碩勿作蛾飛㑹續来牟頌寕聞吿糴譏崆峒今歲熟登薦定無違次韻萬先之讀荘子荘生蔽扵天先儒巳能言六經有真味奚用食馬肝王何佐其髙遺害今猶存夫君高明士寄趣名理間恐蹈賢者過因詩與君論巳巳梅溪同舍三十人其九人者游從之舊也酌别之夕獨五人在焉謝子與能猶在予舘而四人者且去矣遂各以其姓賦詩送之周仲翔梅溪闢家塾辱與英俊㳺回首五年舊子獨終始周善交固耐乆厚徳堪鎮浮異時行所藴無媿祖絳侯李大鼎賢㢤予外兄厚徳著鄉里積善有天報鍾秀在吾子學問如馳馬著鞭殊未巳西㳺不負盟早早戒行李許輝先子昔從予㳺方讀𥿄上語磨礲出圭角翦拂就規矩不為中道廢當振大嶽許行将拭老眼看子驚人舉謝鵬之子方妙齡耻為聾俗化三年㳺梅溪燈火讀深夜男児四方志万里思高跨願如芝與蘭母媿古諸謝别宋孝先楚䑓風騷客遥遥有竒孫去歲始識面未遑叩淵源但見眉宇間一點陽春温琴書忽来游文字獲細論經術有根蔕詞章冨波澗時時戯翰墨動輙千萬言子固予所畏語蒙子推尊予嘗語所學文當氣為先氣治古可到何止科第間子賢且樂善服膺每拳拳臨行出新詩殷勤記諸篇好學見雅志予言未應然惜㢤有離别後㑹何寅縁男兒各自勉事業無窮年送黄巖三友聚散本常理未應輕感傷秪因三益友故断九回膓子少才俱羙予窮老更忙相将亦行客後㑹恐参啇又各贈一絶余如晦遥遥華胃自由余識量深沉豈淺夫半載從㳺殊半面臨行一語可䏻無鄭遜志燈火相親臭味同来何太晚去匆匆未曽箴我膏肓失堪嘆康成道巳東施良臣學傳士丐舊家声詩法肩吾句巳成尊酒論文两經歲却因送别倍鍾情别余諧我昔自緫角識君先大夫閨門脩子聀郷里號名儒仁者偶不夀善人冝有孤肯堂䏻自勉泉下尉榛蕪别余壁之子有家學妙齡殊衆児参平冝語孝鯉也早聞詩謾習雕虫技終絺吐鳯詞五車書讀盡定有起家期别周濬莫恨知書失太遲妙齡聦子本非竒好因推魯加鞭策㑹見火然泉逹時後七夕二夜同夢齡宿湖邉荘無用乾坤一腐儒年来蹤跡轉﨑嶇身名未就耕桑廢何日投閑老此湖弟兄身事各茫然頼有先人二頃田他日青山映黄髪長如今夜對牀眠次夜予宿湖南夣齡猶在别業再和前韻寄之家世衣冠誤襲儒年幾四十尚嶔嶇營營世事何時了乞取湖邉作鑑湖一襟秋色巳凄然雲水𥘉空眼界田那更蕭䔥風雨夜弟兄分影隔湖眠宿靈山院靈山未是别鄉山回首吾廬咫尺間明日出山家漸逺郷心從此上愁顔登姚奥嶺望家山有感巳作一宿客漸為千里人吾親白雲下回首一沾巾與萬先之登丹芳嶺路人有手持桂花者戯覔之慨然相贈且言𣣔施此花乆矣又言花名秋香一名十里香遂與先之分之記以一絶携手丹梯語話長不知身到碧雲鄊行人相見如相識贈得岩花十里郷香題石梁蕩中天柱見巳乆山外石梁今始觀尊者力䏻回造化㑹湏移向柱頭安過雁山清秋天氣過山中征雁行人路不同從此又勞千里翼傳書来往浙西東次先之過雁山䪨雲山繚繞幾千重撩我秋来逸興濃𣣔向靈岩移卓茟與君同掃万人鋒張施二生自黄岩拏舟送别于台城贈以二絶不放離人獨觧舟片㠶相逐到丹丘客情郷思從今日更有思君一叚愁行役那堪八月時膓非宋玉也應悲煩君為寄梅溪信少尉吾親别後思施生将過梅溪從吾弟夢齡㳺過仙人渡此去神仙路不迷直從洞口到桃溪仙人心境無名利笑我頻年渡此溪過百度嶺嶺下有大惡小惡灘乗舟剛怕两灘惡度嶺俄驚百歩高僮僕相看話良苦縱教輕檐亦疲勞諺云百歩無䡖擔因借其語関嶺旅邸觀林同季野去秋題壁去歲還家秋正杪今年行役暑𥘉殘同行壁上留題處特下籃輿子細看望天台赤城山感而有作神仙境界無戦争奚用􅃮此巍巍城吾聞秦皇昔多慾冨貴巳極貪長生蓬莱方丈𣣔親到車轍馬迹無時停萬騎南巡適呉越天台咫尺行將登仙山不容肉眼見天為設險蔵神靈山中采薬使未返鮑魚向巳沙丘腥秦為防胡築紫塞連年不恤生靈害天亦防秦甚防胡赤城髙峙烟霞外神仙要非求可得祖龍可笑徒勞役當時劉阮本無心花笑水迎山自闢我向丹丘数往来群仙杖舄未容陪揮毫𣣔續孫公賦愧無擲地金声才目極蒼崖千万丈世無仙骨那能上直湏内外两丹成駕鶴驂鵉如指掌柘溪道傍有班竹百餘挺蕭洒可愛與先之賞翫移時因念郷間無是種約異日移其根予戯誦君看江上千竿竹不是男児淚點班之句遂彂一笑既而作数語解異世婦人之嘲且志不必移根也男児有淚不染竹當作包胥賈生哭湘源遺種雖可愛莭目尚餘児女態誰䏻千里移此根出門又恐添啼㾗不如還家種慈竹不厭千竿万竿綠代婦人荅君勿題詩訾湘竹君勿笑他児女哭人為鍾情故生愛夫婦相思乃常態為君飄蕩太無根两臉盡是思君㾗安得相依似双竹長保千秋万秋緑題劉阮祠用過仙人渡韵澗水桃花路易迷不同人世下成蹊自從重入山中去烟雨深深鎖舊溪至剡溪寄夣齡昌齡歉歲爲行客清秋别故園自從離雁蕩長是念鴒原世路疲来往親闈廢清温緘書付歸僕銷盡旅中魂剡溪舟中有感又作游呉客重登入越舡西風桑葉岸細雨菊花天旅思秋偏惡鄊心夜不眠錢塘江上月行見十分圎前中秋一日舟過山隂晚稲方熟怱動郷思呈先之西風吹白蘋㳺子千里征扁舟入鑑湖水月相􅉼明山隂晚稲熟万頃黄雲平憑湖属逺目動我郷曲情豈不有一飽胡爲苦營營五年倦来徃争此蝸角名未知得失間奚辱亦奚榮何當畢所碩同歸及春耕夜泊蕭山酒醒夣覺月色滿舡感而有作候屇星虗午夜凉更堪停棹水中央短蓬破處漏明月歸夣断時思故郷客裏未忘詩酒趣老来厭逐利名埸明朝又向錢塘去十里西風桂子香十月二十八日母氏劬勞之日也哀痛中書二十八字懸孤謾喜生良月看鏡堪嗟巳二毛不見双親空泣血此生無計報劬勞次韻昌齡㳺白石二詩道岩東際白石二佳境也予未之見昌齡弟比嘗登覧作二詩以寄模冩景物之竒葢吾家摩詰二幅山水圖也秋凉一訪之當按詩以㳺不必假圖經矣因次䪨見意飛流噴沬下烟嵐肯使名同盗與貪莫訝来時多汩汩定知止䖏却潭潭遥通雁蕩靈湫两巍壓龍門巨浪三好景不煩摩詰畫盡帰詩客句中含右東際未窮脚力上層霄想象名山興亦高物外游人身挿羽洞中仙客泍生毛利名犇赱嗟吾老杖屨徜徉羡子豪鳬舄共㳺端有日預期木葉下亭皐右道岩再和二首佛國飛来百尺嵐要将法水嗔洗貪仙人錯認蓬莱島騷客羞談鈷鉧潭觀盡豈湏窮莫四悟来𥘉不異前三水有七際諸方始登其三以日莫而回莫将七際觀東際法界三千際際含少和丹就巳登霄岩與仙風两並髙甚𣣔此身參鶴馭尚嫌多事類牛毛雲間雞犬年猶永世上英雄意謾豪堪羡北山山下客不縁射雉亦如皐贈萬序弦誦先閭里東平典則存殘膏沾後學餘慶在重孫事業年方少功名志可吞時人貪擇臠慎勿為財婚過萬橋哭潘先生投老西㳺志不成死生貧賤見交情江頭昨夜潮声怒却為先生氣不平先生有題伍子胥廟詩云大江今古潮声怒長為将軍氣不平夏伯虎贈双鯉知我山間乆食𬞞遥分七十二鱗魚不妨時遣長鬚主要得頻看尺素書貧家連歲蚕荒今年尤甚妻孥有號寒之患每欲以酒自寛酒惡竟不能醉拙扵生事殊可咲也表弟万大年家蚕熟酒醇有足樂者因思舊詩有剰栽桑柘教妻蚕句遂和以寄之年踰四十尚何堪愈老生涯愈不諳何以代耕猶未仕𥘉無可樂誤為男號寒兒訝桑條沃飲酒賔嫌蜜汁甘堪羡通家万公子細君善醸更能蚕大年和詩再用韻年少如君種種堪文場世事两俱諳何憂晁錯不髙苐未怕杜陵無好男大年詩有未禄無男之歎况有田園足耕飬好窮水陸奉肥甘更湏猛割閨房愛来與荀郷共賦蚕李梗和詩復用前韵維摩老病思何堪薬性從今却漸諳掩卷正思眠丈室論文俄喜遇竒男共嗟世路羊腸險剛怕人情䑕口甘聳壑昻霄君未晚吾衰巳是食三蚕用前韻寄周光宗炎凉世態可能堪肺腑唯蒙長者諳耐乆敢忘三世好同庚况有两家男孟甲與光宗子同庚我嗟風樹徒悲苦君奉庭闈備旨甘他日相看两黄髪碩為隣舎話田蚕送李楰梅始花時送子帰梅黄雨細又分離不堪旅食見飛燕那更催帰聞子規太白讀書容有趣少卿惜别可無詩霜䑓清峭家風在努力功名少牡時梅溪先生文集卷苐四
