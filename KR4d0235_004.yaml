  text: 梅溪先生奏議卷第四
  hash: sha256:6120b5ef341e581b37739de7a9a7c06045b45a3c2a3323f73aa4af2faed441b7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_004-1a}
body:
  text: 論用兵事冝劄子臣切以今日之事有不可輕改者曰用人有不可不決䇿者曰進蹕有不可不深慮者曰荆襄有不可不急治者曰兵賦自古人君相與圖進取之計必有一定不易之規模知一勝一負為兵家常勢故少勝不為之喜小敗不為之沮秦穆用孟明三敗而後霸西戎漢髙爭天下婁敗而後禽項羽諸葛亮才兼文武而有馬謖街亭之敗至於上表自劾蜀主不廢之卒能與吳魏抗衡而功蓋三分之國國朝范仲淹韓琦皆一代名臣俱有材略其經略西夏也而亦有任福三川之敗仁祖不廢之卒能臣元昊而安中國此皆規模素定於胸次故能收異日之大功臣聞前日淮甸之師一月三捷宿州不利蓋亦兵家勝負常勢也異議者遂從而搖撼將帥之臣且謂大將不還以貽聖慮今李顯忠邵宏淵及諸統制軍馬巳回濠泗矣亦足見小人幸災樂禍扇為浮言務在中傷不可不察也恭聞陛下遣中使給御札慰安張浚撫勞將士仍放顯忠等罪憫其血戰之勞而赦其一眚之愆真得前古帝王御將之道矣然外議訩訩謂陛下宣召楊存中欲用為主帥臣切料聖意必不然然常人情紛優之際不能無市虎之惑既而聞之𥘉欲除荆襄宣撫又改御營使及聞邉報稍寧其招遂寢疑者雖稍息而不能無慮焉存中為將罔功天下皆知之黷貨無厭交結中外爵位巳極而求進不巳彼其心但幸國家之有禍遂欲投隙而進亦何求而不得耶御營使不已必將有大於此者命令一出必失軍民之心使江淮荆襄隴蜀將士聞之必致解躰且謂朝廷因王師小衄而遽欲變易大帥非所以安人情威戎虜也臣所謂不能無患者在此建炎紹興間太上皇巡幸止用宰相樞密為御營使李綱朱勝非等嘗為之陛下將為視師之舉冝遵用故事以兩府大臣兼之足矣朝廷雖乏才其可以此輕處存中輩耶此事尤在聖心素定不可變易於倉卒之間此臣所謂不可輕改者曰用人也臣聞天下之勢不在國之強弱而在氣之如何氣振則轉弱而為強氣沮則變強而為弱股至強而懼則栗氣餒之也髮至弱而怒則衝氣激之也景德間契丹舉國南冦王欽若請幸金陵陳堯叟請幸蜀以避其鋭真宗以問冦凖凖曰誰為陛下畫此䇿者罪可斬也今胡虜近迫四方危心當勵衆禦敵以衛社稷惟當進尺不可退寸奈何欲委棄宗廟逺之椘蜀鑾輿回轉一步則萬衆雲散四方瓦解椘蜀尚可至耶真宗善其計乃幸澶淵將士鼓勇射殺撻覽虜衆遂退此作氣以破敵轉弱而為強之尤大者也前年太上皇下親征之詔為建康之幸作士氣以走胡騎蓋得䇿矣惜議乎議者不建逺大之計而遽回安臨也陛下前日下詔視師中外鼓舞秋涼進發或者猶以為遲今王師退保濠泗督府逺在盱眙陛下冝速進蹕以幸建康居六朝帝王之宅據東南形勢之勝可以援吳蜀可以控四方可以逺海道之虞可以壯淮甸之勢四方聞之孰不增氣至若百司之衆在今冝省犒之費比舊冝莭庶幾萬騎易動如聖訓所謂當如創業時此臣所謂不可不決䇿者曰進蹕也臣聞荆襄居天下形勢之中乃古今必爭之地萬一虜人乘虛而入使川陜隔絶則東南之勢孤矣近聞朝廷既罷汪徹命張浚兼都督之使令出于一固已得䇿又用王彥知襄陽議者以為得人又聞以彥莭制趙撙則或以為不可撙久在荆襄得士卒心彥自外來遽令受其莭制恐武臣氣不相下或生釁端兼張浚在淮去荆襄逺甚或有機會恐關報失期臣謂冝於前兩府侍從中擇一重臣威名稍著者以為宣撫既以浚督之文以重臣制之使彥與撙輩各當一面則荆襄可以無虞矣今朝廷知備淮甸而逺荆襄此臣所謂不可不深慮者此也今國家大則為進取之圖次則為守禦之計然議論及兵則其言必怯者以其所乏者兵與財也則兵不可以不招財不可以不理切聞西北歸附之民有可以為兵者衆督府及諸將不敢多募之者懼國家有飬之之費也然今日之勢有不得不宜命張浚諭江淮荆襄諸將招其可用者而籍之汏其無用者而民之縱未至多亦可輔填折傷之額又東南之民亦有可用者如江西福建及台之仙居婺之東陽諸處其人皆健而善鬪往往曹聚於茶啇鹽賈間可令守帥之臣重其直以招之必有應募者廣海諸冦有就招安者可從而藉之州縣有犯茶鹽禁者貸其罪而兵之亦可以少補軍籍也至如財者臣以為生之不如莭之今國家比天下全盛太平無事時非不莭約比祖宗創業艱難時則可省非一也軋德開寶間宫人不滿二百猶以為多左右內臣止有五十餘員止令掌宫掖未嘗干預政事宫殿內惟挂青市緣簾緋絹帳紫紬褥今宫人之數內臣之員豈能盡如藝祖時乎臣前日曾奏欲聖躬親率之者蓋欲以藝祖為法也近日臺諌所議裁減雖日計不足而歲計有餘亦不為無輔然奏巳上而未行者豈以衆怨所在而朝廷不敢當耶今強埸未靜上下同憂權冝裁減以紓國用臺諌既以身任怨大臣何避之有至如理財之術莫如遴選板曺臣前日與諌臣共留趙子潚者誠恐今日理財之臣未必賢於子潚也似聞海冦稍息不若别擇代者而還子潚不唯可以理財如旦夕車駕進發輦發輦轂之下謀議之寄議者謂非子潚不可也此臣所謂不可不急治者此也臣所陳四事碩陛下付大臣議之如有可採乞賜施行乞審核李顯忠等功罪劄子臣聞宿州之師不利而反議者皆歸咎李顯忠顯忠身為上將不能於勝敵之後撫存將士以保垂成之功遂致潰散而歸固不能無罪也然前日胸胸之議謂顯忠心懷南北鼓惑中外上貽聖憂今顯中既還上章請罪亦足以見讒説之無驗矣説者又謂顯忠貪戀金帛欲為已有不分將士遂致離心理或有之恐亦未實兼顯忠亦劾奏統制官周宏等數人無故領兵自回遂致失利欲正宏等罪臣亦未敢以為然昔慶曆間趙元昊叛大將劉平遇賊于延州力戰而死都監黃德和遁走誣平降賊朝廷信其言遽欲戮平之家賴仁宗聖明遣御史出理其事既得其實遂褒平死事之莭而斬誣告之人今正虛實未辨之時臣以為不可不審朝廷不如姑兩存之以安反側却令都督張浚審核虛實聞奏如功可贖過則許其自新責其後效如罪多功少實誤大事則不可不正典刑但審而後行庶使聖朝不致濫罰不勝幸甚論龍大淵撫諭兩淮劄子臣切聞有旨令龍大淵往兩淮撫諭者仰見聖心憂念將士故遣左右心腹之臣為勞來旋歸之使或出於大淵不憚勞苦慨然請行亦可嘉也然命令𥘉下議者囂然咸謂自古遣使或巡行天下或撫諭軍民皆於士大夫中遴選人才如漢之八使用張綱等唐之十一使用庾何等是也太上皇建炎紹興間亦嘗遣使撫諭矣或用臺察或用郎官出於遴選時號得人今大淵雖為潛藩舊臣議者謂非出于朝廷遴選之公䘖命撫師有輕國躰又慮大淵之出聞者謂是陛下所親信之人州縣必希意而將迎諸軍或望風而交結萬一復致人言如前日臺諌給舍之論列豈不重貽聖憂亦非所以保全大淵也臣以謂王師之還陛下巳降詔尉撫之矣今只委張浚勞來安集之不必更遣撫諭之使切恐將士以宿州不利而還未測朝廷之意匆聞使命之出心必懷疑不如寢而勿行以安反側不然乞命宰相於朝列中擇其忠實通曉者敦遣之以重光華之使以塞中外之議不勝幸甚自劾劄子臣天資愚戇不逹時冝獨抱孤忠每懷憂憤自從捴角身在草苑聞醜虜亂華中原陷沒未嘗不痛心疾首與虜有不共戴天之讎及聞秦檜用事辱國議和臣常思食其肉以快天地神人之憤臣素不識張浚聞浚天姿忠義誓不與賊俱生天下聞浚之名必以手加額蓋忠義人心所同臣實敬慕之前年備員館職嘗因輪對首言虜必敗盟乞用浚等太上皇不以為罪臣既去國虜果南牧太上皇親征起浚知建康府陛下嗣位因以江淮都督之任委之天下皆以為當惟史浩之徒不恱臣去年十一月𬒳召至闕首以恢復太計仰贊聖斷又乞陛下不惑群議委浚以圖成功陛下不以臣言為非每蒙聽納浚前日入覲議進取之計雖非臣所與聞至於勸陛下破群議而用浚臣不為無力浚遣二將取靈壁虹縣及取宿州降三大將一月三捷議者皆服陛下英斷任浚為難及聞王師不利而幸災樂禍者橫議蜂起臣與一二諌臣常奏一勝一負兵家常勢之説勸陛下以剛大為心毋以驚憂自沮臣又謂陛下用兵為祖宗陵寢暴露而舉為徽宗欽宗復讎而舉為二百年境土而舉為中原弔民伐罪而舉與古帝王好大喜功開邉生事者不同投機而進知難而退益當內修俟時而動陛下剛明果斷規模素㝎固不以一衄為群議所搖然異論紛紛不肯置浚浚嘗上表自劾朝廷尚未施行臣聞諸葛亮街亭之敗亦有自劾之表國朝范仲淹韓琦西夏喪師亦嘗降官但仁祖始終任之卒收後效臣謂陛下亦冝從浚之請薄示懲戒使浚得以號令將士以為後圖如臣狂愚不合妄贊恢復又不合乞委任張浚今王師不利浚與其屬待罪臣其可尚居凨憲之職使朝廷失刑欲乞陛下正臣妄言之罪罷御史職事仍賜竄殛以塞群議夔州論馬綱狀準樞密院劄子樞密院奏知夔州張震申所有四川宣撫司措置川蜀馬綱改移水路事件委有未便去處申乞詳酌施行奉聖旨除打造舟船外其餘事件並令吳璘𬋩辦其舟船令王某疾速應副臣契勘馬綱利害前知夔州張震及諸司論列已詳其中利害之大者莫過於財與力二者皆出於民臣自入境以來切見夔峽之間土狹民貧面皆菜色衣不蔽躰非江浙荆湖諸路之比為監司守令者儻能皆勞心撫字無一毫之優猶恐不能活之况今馬綱之害極重財力必當大困臣濫居牧民之任不敢不以實聞今來茶馬司及宣撫司所買馬每歲計一萬八百餘匹約計二百一十六綱本州若循環起發合用船三十餘隻每隻打造約費八百餘千馬船易壞勢須一年一易計一歲之費為錢二萬六千緍自夔至歸水路二百四十里每綱梢工水手約九十人較一歲之終為工一萬八千人每人口食雇錢約五百文上下水約一十五日通一歲計之當費錢十二萬貫草料批劵亦不下二萬餘緍較一歲之間費於馬綱者蓋十五六萬貫矣本州三縣所𬋩梢工水手不滿四五百人若循環不替所少猶半必當役農民而為之而夔之民力既困如此若又從而役之必有流離轉徙之患本州每年財賦之入不滿二十萬合起上供折估經捴制及官兵請給皆在其內今馬綱之費侔於所入之賦雖曰令吳璘𬋩辦豈能償所費十之一二財非天降地出又必取之於民而夔之民貧如此財何自而出耶以一州推之則一路諸路之困又可知矣况水路正行瞿唐灔澦之險又有惡灘二十餘莭水勢湍急濆漩頗多馬性善驚聞灘聲洶湧必致跳躍不可控馭撼動舟船必有覆溺之患臣昨在饒州親見馬綱經過涉咫尺之渡中流遇風十死八九况千里之至險耶若舍舟用陸則自夔至峽皆重岡復嶺上倚絶壁下臨斷崖行人攀緣鼓栗汗下遇雨泥滑尤不可行非特有害于人兼亦非馬之利若欲削平險阻便馬之行非惟重困民力又恐有害控扼之險非所以保護全蜀也臣所論利害皆是目見苟坐視一路生靈之困不以奏聞則上孤陛下任使之意將負不忠之罪矣伏乞聖慈特降睿旨令馬綱復行舊路以安逺人不勝大幸再論馬綱狀臣伏蒙聖恩頒賜御札謂軍機之務馬政為先臣仰見陛下居安慮危不忘武事修車馬而備器械蓋欲如周宣復古之時又謂撁駕之役並用廂禁軍貼以吳璘正兵皆不科優於民臣又仰見陛下仁心愛民如武王之不忘逺也又謂回船泝流頗費程限須多作畨次免致稽滯又令臣身率以先共圖成效又足以見陛下雖居九重之深洞見四方萬里之逺閭閻疾苦無不備知不以臣為愚不肖不足以備使令戒敕丁寧俾輸犬馬之效况臣蒙誤恩擢居帥閫固當身先卒伍不憚勤勞然臣螻蟻之誠不敢隱默馬綱改行水路為巴蜀之病臣前已具奏及監司帥臣皆已力言之不敢再瀆天聽若夫撁駕之役易民以兵道路皆知陛下之仁心以臣愚見參以輿議則亦有未便者蜀江號天下之至險與其他水路大不相侔瞿唐灔澦及諸惡灘密如竹莭巴峽之民生長於水者以舟楫為家捎濆撇旋欹桅側柂於波濤洶湧之間習知水道之曲折操舟若神猶不免時有覆溺之患彼卒伍輩自少長黥涅坐食軍門與水性素不相諳一旦強以牽捝必至觸石破碎人馬俱斃無疑矣又三峽束江斷崖絶壁挽舟者無所置足攀緣而過如猿猱然兵卒豈能為之况宣司正兵皆西人尤不善操舟雖貼無益馬綱之來急若星火州縣既無可以牽駕之卒官吏以獲罪為懼其篙工水手必不免役民以充之雖聖旨不欲科優於民其勢不得不至於科擾又夔峽為四川門戶長江上遊正賴此曺守禦控扼以壯天險之勢然土狹人希廂禁軍類多缺額諸州每以招填不足為憂重以出戍於夷陵防秋於諸處者非一所存無幾若又役以撁駕疲於往來以無幾之卒伍應無窮之馬綱非惟耗費錢糧妨廢教閲正恐州郡空虗因致意外之患非細事也况茶馬司歲發馬一百六十綱而宣司不與焉除自五月至八月江流泛溢瞿唐不可上下舟航當戒謂之住夏一歲之間可發歲額之馬者凡八月每月計三十綱每綱用三船每船用十五人十綱為一畨則用四百五十人上下二畨則倍之為三畨更替則又倍之臣所論者一州乃馬綱巳經過而目親覩者爾馬綱過夔府一路者凡六州通而計之則每畨計二千七百人上下畨計五千四百人三番更替計八千一百人若更欲多作番次非惟兵不足用而舟艦亦無臣所治者夔州也夔為帥府係屯兵之地而數猶不足其他如涪忠萬等州廂禁軍多者不過四五百人少者二三百人歸州所𬋩止百餘人其間又有剩員半分癃老疾病者居其半若盡驅而為梢工水手為一畨且猶不足况欲多作畨次耶臣愚以為不若且行舊路舍危就安或以山險馬瘏為慮冝於鄂渚漢陽諸處置監以休息之壯者發至行在病者留以牧養水草既便馬必藩育亦可以為江淮荆襄警急之備固亦無害其為馬政之修也臣非不欲率先奉行以答知遇實以馬綱行水利少害多他日或致生事上貽陛下西顧之憂則臣誤國欺君之罪不容誅矣况此事干數路所擊非輕伏望聖慈出臣此奏令兩府大臣議之參酌施行不勝大幸除知湖州上殿劄子三首臣聞聖人以無難而畏賢君以無災而懼國多難而天有災此天心仁愛人君以災異而警懼之欲其恐懼修省舉天下而措之安也昔堯有九年之水湯有七年之旱周宣王外有四夷之交侵內有太甚之旱魃天災國難有若不易支持者然堯以帝湯以王宣王以中興者豈非天以災難啓之一三帝王能修德以應之耶共惟陛下即位以來六年于兹矣躬攬權綱厲精政事雖漢宣帝光武無以加然天災流行無歲無有旱于夏潦于秋飢饉荐臻􅍚疫繼作去八月海溢于溫死者以數萬計今歲川蜀荆南赤地千里邇者天作淫雨害于粢盛江浙之間𬒳害尤甚陛下遇災而懼遣官分禱疏決滯獄減放房緡詔答大臣歸過於巳可謂能恐懼修省矣臣來自逺不知左右前後論思獻納之臣亦嘗有以修德之説獻忠于陛下否乎書曰惟德動天無逺弗屇詩曰皇天親有德享有道堯湯宣王之所以應天者蓋在乎是臣竊謂陛下冝法堯之盡道湯之自責宣王之側身修行早夜孜孜惕然自念曰天道不逺災異胡為而來哉豈吾心有所未正意有所未誠欲明明德於天下者有所未至乎忠直者未用諂諛者未去有以害吾之治乎聚斂之臣未斥姦贓之利未除有以蠧吾之民乎議法或失之深用刑或失之過有以傷吾之仁乎旨酒之嗜聲色之邇毬馬馳騁之娛有以纍吾修身之德乎責已以誠應天以實而無事乎虛文孔子曰丘之禱久矣蓋言出入起居之間罔不欽顛沛造次之際必於是不在乎區區禱祈祭祀也如是不惟可以弭災難於一時古先帝王之治效功業當復見於今日孰謂災異非天所以開陛下耶學識淺陋惟陛下採擇右一臣嘗聞先儒孟軻稱周武王曰不泄邇不忘逺是言非止為一武王設蓋為後世帝王治天下之訓國家全有吳蜀之地蜀去行在萬里逺而易忘臣昨蒙恩出師夔府二年之間有所聞見姑言其大者三事一曰監司二曰虗額三曰馬綱今朝廷但知蜀之重權在宣撫制置二大帥臣尓而不知四路監司事權之不輕也彼去朝廷既逺威福得以自恣傲視僚屬有同皂隸動搖州縣人不聊生監司之中漕臣尤重一路銓選咸出其手非若他路上掌金榖之事苟非其人則州縣受害無所赴訴地逺之害如此其可忽耶臣碩陛下戒敕宰相冝於四川監司尤加精擇務得循良愷悌之吏為之以安逺方不必敷取其能辦事也臣在夔門每見蜀之士夫往來咸言西州諸郡困於虗額蓋是積年拖欠催科不行雖屢經赦恩有司不與放免又昔之監司好聚斂者取諸州積年酒稅諸色無名科斂之數以一年最多者立為定額其後酒稅諸色之數不登而有名無實之額常存為捴司者以有名無實之數督漕司而不得其實漕司亦以有名無實之數督州郡州郡迫捴漕之威而無錢以輸遂預借民間常賦以充之後之郡守到官欲催常賦聞已預借矣於預借之外又借焉有借及二三年者如卭彭諸州困乏尤甚朝廷知其弊亦嘗有旨減放捴漕之臣不能奉行德意而催科如故州縣不堪凋瘵日甚今之為宣制二帥及捴領者皆一時重臣名士必能以撫字為心臣願陛下親賜御扎俾條陳虛額之弊而速降詔罷之庶使逺方之民復有生意臣至夔州而馬適行水大為夔峽諸路之害其端起於吳璘小人從而迎合之以行水為便欺罔朝廷以求官聀臣嘗兩奉御扎非不欲率先奉行蓋知陛下愛民甚於愛馬而夔峽之民貧尤甚故不避罪誅力陳其害今茶司之馬自五十綱後雖不經由然朝廷未有明文罷之有一二提舉之臣猶以奉行為名沿江州縣治廄造船之役猶未已臣碩速降聖旨令復行舊路罷提舉焉綱之名諸州所差牽挽之兵各還其所槽廄舟船不必修治乃見聖治之不忘逺也臣又謂朝廷於蜀非特以逺而不可忘今日之所以立國者正賴蜀以為重昔三國之時吳蜀為二家故不能進取中原尺寸地今天以吳蜀全付陛下正是經營天下恢復境土之資今傅聞虜人積糧宿兵於境上有窺蜀意蜀天險也非虜可得而窺正恐民心或離釁由內起為可憂尓撫綏固結在今日為尤急臣故敢獻其狂言右二臣嘗謂君子小人常相為消長人君未嘗不欲進君子而退小人也然小人常見用君子每見疏者蓋君子小人之難知雖堯舜猶以為病君子目小人為小人小人亦指君子為小人當孔顔桀跖相閧于前左右佩劒彼此相笑之際人君以一人之聰明誠有不易辨者况君子直而踈小人巧而侫直則動多忤意踈則不能無過故人主反疑君子為小人巧則能以智術自將侫則能能迎合上意故人主反以小人為君子自古所以治少而亂多蓋由君子小人之不辨也共惟陛下稟聰明絶人之資行帝王正大之道歷古興亡治亂之迹皆洞然在聖學中君子小人之情狀固已備知之矣然天下所謂君子者或未能盡用或暫用而卒棄之所謂小人者或未能盡去或暫去而復合得非知人之哲亦猶堯舜之難乎夫君子小人雖不易知而亦有可知之理君子孤立如松柏小人附麗如蘿蔓君子進必繇直道小人進必繇邪徑往者藩二使令之臣竊弄陛下之威福士大夫無耻而好進者莫不奔走其門陛下赫然震怒奮自英斷斥而逺之天下莫不鼓舞聖德然附麗而進者猶未正典刑唐憲宗既誅王叔文并斥八司馬之徒終身不用元和威令復振號稱中興蓋由此舉仐之附麗者𥘉無八司馬之才而惡則過之附叔文者官止為未有若今之竊髙位達官者小人朋比之迹固不逃聖鑒冝擇其一二之尤者薄正其罪又取其能自卓立不附炎於炙手可熱之時與嘗言其罪惡者稍進用之如是則君子小人知所勸懲矣語曰君子喻於義小人喻於利君子之進必以道誼自奮小人之進未有不以利求合者前日朝廷以財賦不足為憂小人遂獻羡餘以求進朝廷不惜名器以美官要職處之諸路監司郡守翕然胥效為剝下益上計州縣騷然民不聊生近者臣僚論列陛下嘗罷一監司固足以為後來之戒然其尤者方進用未巳全其大而治其細又何足以懲耶臣所謂君子小人有可辨者陛下第觀其自何門而來以何術而進因可以灼知其為人矣宰執大臣天下之選固不可使小人雜處其間侍從之臣以論思獻納為職即異日之宰執大臣也又其可使小人居之耶治道在知邪正然邪正難於盡知陛下冝於宰執侍從臺諌之臣精加識擇自卿監而下與外之監司帥守責之宰相可也臣言狂妄惟陛下察之右三除太子詹事上殿劄子三首臣恭聞陛下斷自宸衷首建國本天下相賀以為社稷無疆之福臣𥘉至闕下聞太子有尹京之議臣竊以為未然臣聞三王之教世子也不過教之以禮樂樂以治內禮以治外俾知父子君臣之義而巳成王之為太子也召公為保周公為傅太公為師保保其身躰傅傅之德義師導之教訓未聞其尹京也國朝雖有真宗故事至仁宗為太子則不然當時左右前後罔匪正人養成仁厚之性四十二年之治雖堯舜亡以加𥘉不由尹京然也况今天府事繁其所委任之臣未必有如畢士安者使太子裁決事事皆善亦不足以為太子之聰明增太于之盛德萬一少有過差十手所指小人易得浮議傅聞四方所損非細非所以愛太子也太抵太子之聀在於問安視膳而巳至於撫軍監國皆非得巳事也陛下伹與之遴擇師友僚屬俾日與端人正士遊養成德性相與講論古今治亂之理他日民情吏事不患不知臣願陛下與一二大臣議之寢尹京之議以安國本社稷之福天下之幸也右一臣嘗謂官冗之患莫如今日漢唐之時部刺史之聀於今為甚蕳而事無有不舉者今之監司有漕有憲常平茶鹽則有提舉坑治鑄錢則有提點其聀甚備而治不加於昔何也監司之聀愈多而州縣之擾愈甚於治無益也邇者提點刑獄增置武臣臣竊以為贅矣且是官之説臣不知其所為者何事也以詳刑之任耶則一道之使固有其職未見其廢事曰訓練士卒則捴管鈐轄路分都監者即武臣之監司也置之而無用廢之而不為闕是官之設豈不為冗哉一監司之建增州縣之大優也臣竊考之祖宗雖嘗有武臣同提點刑獄矣至嘉祐則罷之其詔之大略以謂武臣或出將閥或由軍功文墨期會未必深究監司項背適以為煩夫既置之矣而繼罷之知其無益也昔罷之今復置之在朝廷則冗於官在州縣則優於民則其置之也甚無謂矣臣愚欲望聖慈斷然察其無用罷去勿置庶幾官不虗設事得其當而人各安其職矣臣不勝至碩右二臣嘗謂人心險於山川難於知天謂其不可測也况狼子野心之人烏能保其久而無患也哉唐太宗教射於殿廷群臣諌之曰律不可以兵刃至御在所今以卑碎之人張弓挾矢於殿陛之側萬一狂夫竊發出於不意非所以重社稷誠哉憂國愛君之言親衛將卒且猶不可而謂歸附之人信其終無害也難矣近者歸明歸正之將陛下旌其忠義壯其勇略擢而用之日與之親使效其力所謂推赤心置人腹中者固足以見大有為之志矣然天下之人凡有愛君之心者莫不疑焉謂自古以來莫難於用斯人而用之者罕見其久而不為吾患其棄彼歸我心巳二矣今乃使之朝夕以侍左右設或不飽其欲其謀之深計之久而心之不能保則將若之何至於斯時雖悔無及臣請擇其灼然忠誠可以任用陛下素所知者屬之以事權厚之以爵祿勉之以功名亦足以示無疑之意而激其圖報之心矣何必日親之而後為待遇之至哉臣碩陛下考之於往古慮之於將來特加宸念毋憚一時之難從而置久逺於無害不勝社稷生靈之願右三應詔舉官狀準尚書省劄子奉聖旨令侍從臺諌兩省官薦舉堪充刑獄錢榖及有智略吏能各二人並依保舉法仍限半月者右承議郎林仁厚學問該通議論近正婁更任使俱有可觀付以決獄理財必能詳刑莭用左奉議郎新監登聞鼓院丁康臣嘗知處州青田泉州惠安二縣獄訟詳明民無冤訴催科不優辦居衆先付以繁難必可倚仗以上保舉可充刑獄錢榖之任左宣教郎新知福州長溪縣劉鎮婁更州縣任使所至皆有治績明敏之政吏不能欺左宣教郎新知福州候官縣林思誠為饒州教官嘗挕郡幕贊畫居多耿介有守不附權貴左從事郎添差溫州教授王信素有文學尤通世務嘗挕郡丞時適荒旱留心賑濟不憚勤勞一郡之民遂免流離之患以上保舉知略吏能可備委任舉張栻自代狀準令莭文諸侍從官授訖三月內舉官一員自代右伏覩右承務郎試尚書左司員外郎兼侍講張栻學術精深氣稟剛正久居經幄冝贊青宫舉以代臣實允公議梅溪先生奏議卷第四梅溪先生後集卷第四詩州宅鑑水稽山擁卧龍黃堂人似坐仙宫風流惟有兀才子終日賦詩屏障中蓬萊閣祖龍車轍遍塵寰只道蓬萊在海間空上望秦山上望不知此處是神山清白堂堂與泉皆范文正公名之錢清地古思劉寵錢清地名父老送劉寵處泉白堂虛憶笵公印綬紛紛會稽守誰能無愧一賢風清白泉聖人逹節猶憎盜志士清心肯飲貪試向卧龍山下酌世間無似此泉甘觀風堂簿俗澆風有萬端欲將眼力見應難但令心境無塵垢端坐斯堂便可觀望月臺明珠遙吐卧龍頭漸覺清光萬里浮人望使君如望月要須如境莫如鈎秦望閣𥿄上觀秦尚過秦那堪山作眼中塵為言髙閣登臨者莫作秦人視越人望海亭踏雪遙登望海亭扶枽日上卧龍醒微臣望處非滄海只望堯天萬里青卧龍山鑑水連天僅可容稽山照眼五雲濃只憂旱歲無霖雨誰識東州有卧龍種山決䇿平吳霸業成青山長占大夫名子胥忠義無生死怒氣隨潮到越城競秀閣憲臺高閣偶躋攀萬壑千岩指顧間山色元來本無競人心自是錯看山蕺山十九年間膽厭嘗盤羞野菜當含香春風又長新芽甲好擷青青薦越王八松瀟灑荀家好弟兄秦封不汚有餘清鍾成一種棟梁氣散作八方風雨聲右軍祠堂欲弔右軍千載魂祠堂荆棘斷碑存老僧相見話前事問我蘭亭幾世孫鵝池鶂鶂能鳴異衆禽池邉墨客最知音世間多是山隂嫗應恐悮猜君子心硯池鳯翥龍蟠字字竒陶泓湯冰向斯池波心雨後一魚躍猶似青年吞墨時題扇橋右軍一畫千金重妙意寧容市嫗知明日重來堪一笑管城那肯更臨池雷門吳越興亡事若何譙門遺迹枕山阿大聲曽作雷霆震應笑人間布鼓多曲水閣太守蔣堂所建今號飛蓋堂王謝蘭亭久寂寥茂林修竹自蕭騷蔣侯近代風流守曲水流觴意亦高西園西園風物冠東州飛蓋紛紛爛熳遊惟有紅蓮幕中客倚欄才得片時留望湖亭杖屨登臨望鑑湖湖中一半已湮蕪誰能更繼東郡守長使山隂水旱無吳先生祠右軍宅化空王寺祕監家為羽士宫惟有先生舊池館春風歸在杏壇中賀知章祠賀老祠堂枕鑑湖霓裳羽化宅荒蕪無人更問君王覔轉使髙風千載孤鑑湖胸中萬頃元才子方外孤標賀季真鑑水縈回三百里風流何止兩唐人禹廟越國遺民念帝功稽山廟貌勝卑宫少陵莫歎丹青落𥿄上丹青自不窮菲泉𣑽王宫近夏王宫一水清含節儉風越俗不知王好惡泉名却在酒名中禹穴好古貪竒司馬遷胸中史記越山川如今禹穴無尋處洞鎖陽明石一拳禹冗道家謂之陽明洞天馬太守廟會稽疏鑿自東都太守功從禹後無能使越人懷舊德至今廟食賀家湖吳越王廟一劒功成三節還盡將錦秀褁江山斗牛氣滅英靈泯廟比昭王屋一間望秦山洛思昔有人思洛秦望今無客望秦回首長安在何處誰能念彼下泉人少微山出郭舟行十里間少微山近若蕡山山中處士已長往一點客星雲外間梅梁結實幾調商鼎味成材宜作禹祠梁世間何歲無風雨鐵鎖無端誤見殃窆石越俗流傳素可疑退之詩云越俗不好古流傳失其真禹陵窆石果何時只應便是專車骨未可呼為沒字碑窆石形真有數字磨滅不可曉或以為古碑和昌齡弟見寄經年遊官思家鄉枕間魂夢長飛揚甌越相望數百里魚雁來往安能常水緑蓮紅王儉幕我愧才踈筆常閣居官不事羡長卿執一無權猶子莫昔年薑𬒳今獨眠何時更作三珠連左原風物亦不惡溪蓴抽絲蕨吐拳阿連春草詩篇好勸我歸來宜及早代笠亭前煙雨中共把鋤犁寧待老懷喻叔竒巳邜結得賢關雁塔因東州相遇益相親凌雲三賦我慚馬清唱百篇君勝秦冀北郡空殊昔别江東日暮倍傷神同年四百二十六莫逆論交能幾人次韻周堯夫贈睡香長向春前臘後開要將風味鬪梅魁名從廬阜夢中得根自鄮山嘉處來風拆錦囊香不斷日烘寶蓋翠成堆定須移向梅溪去栽伴吾廬桂與槐送陳元佐遊四明鑑水悠悠接鄮川宦情客况兩凄然扁舟乘興梅花月樽酒送行燈火天我似鄭虔官舍冷君如馮子主人賢虞庠春榜無多日行看香名動日邉聞禮生日二月二桃水仲春月蓂階雙莢生添丁慰盧老小子慶徐卿稟得中和氣看成逺大名青春已如許勉力繼家聲次韻趙觀使鴛鴦梅奴視紛紛晳與休芳心那肯貯離愁結成氷玉嶽湛侣開伴紵羅施鄭流影照嬋姢如並卧枝橫清淺似雙浮不知他日調金鼎勝得櫻桃氣味不亡友孫子尚藁葬會稽山大禹寺之側某至官八日出郊訪其墓不獲明年春𬒳命祀禹訪而得之又明年春再往酹酒因植柏十根哭之以詩疇昔相知似弟昆那知半世死生分無緣更飲杯中物想見能修地下文有愧乘車􅌾元伯僅同解劒弔徐君他年黛色參天處是子會稽山下墳子尚墓種柏子尚乃如許牡年墳巳荒我來親種柏含淚待蒼蒼鄭夫人挽詞好溪太守非常好慈母端如孟母賢熊膽調成真器業魚軒遊遍舊山川顔間日有平反喜方外時修香火緣身世九齡家萬石定應含笑向重泉錢夫人挽詞忠孝之家女亦良教傳彤管有遺芳藁砧舊擢儒林秀桂子新飄月窟香方擬魚軒霑寵渥遽驚風樹變凄涼稽山鑑水青春暮薤露聲中恨更長連月不雨農事失時府帥決獄廪飢德政動天霈然而雨某吟成律詩一章以賀旱魃為災罕似今霈然一雨慰群心非關菩薩解為澤自是使君能作霖躬慮滯囚冤盡釋廣開義廪惠尤深佇公歸國調元氣散盡愆陽與伏隂次韻濮十太尉喜雨去歲秋大水民食方苦艱丁壯尚流離而况白與班今春又不雨事與安危關使符下列郡呼雩舞童鬟投文責老龍貪睡何癡頑我聞救災術乃在人事間興師古有衛決獄唐稱顔年因弔伐有雨送軺車還嗟此旱魃虐和氣知誰干半歲幸一雨人心寧不歡麥秀禾可植田里庶少安上紓當寧憂吏責亦稍寬我家蕭峯下山長路漫漫東臯有先業頗亦知艱難歸耕願及早免起將蕪嘆叔父寶印師往永嘉妙果院未年而退弟子德純住龍翔一日歸省其師亦退居林下緇素挽留之乃遁于異郡不踰月間師弟子相繼退休識者高之目為僧中二踈某竊祿將一考矣有愧二高僧因書一絶庶幾他日或蹈其高躅云挂冠林下近來無誰謂僧中有二踈應笑紅蓮幕中客故園三經已荒蕪寄黃簿文昌六一移書責司諌聱隅間命避徂徠兹風不作己久矣吾子所為何壯哉在列諸公顔有愧附炎群小瞻應摧要須終始全名節莫遣心隨利祿回次韻濮十太尉題禹穴寰瀛三十六名郡越在東南雄四鎮宛委周回三百里屮木山川有光潤秦山鑑水藴秀異人物風流夸漢晉傳聞禹穴自太史好古無人若為問韓退之詩云越俗不好古㳅傳失其真杖屨飄然尋洞天照眼千岩若攢刃細看盤石心愈疑遐想丹書氣猶振禹貢無傳豈其闕遁甲所書何足訓彛倫敘自九疇錫水土平繇五行順洛書六十有五字王業巍巍此途進八卷飛沉天與泉兹説荒唐理難信吾儕去古恨大逺企首難窺禹牆仞穴傍有井清且甘一酌端能洗驕吝薛師約撫幹召飯于圎通寺主僧瀹茗索詩緑暗梅欲雨風薰麥初秋官舍厭卑􅊜僧廬訪清幽儒餐慣𬞞飯道話便茶甌鑑湖倘容覔杖屨時來遊潘知縣甸弟撫幹畤和詩復用前韻堂堂𬗋微公氣節橫清秋風流屬猶子胸􅊤羅竒幽詩篇粲華蕚名字宜金甌州縣聊爾耳行矣天池遊酬冨陽張叔清縣尉尺素遙傳到越城入懷珠玉照人明登科雅服才名早筮仕喜聞官業清空把交情對山色采詩有吳山空對越山明之句要令音問讀潮聲匆匆作答無他語莫羡人間勢利榮周德貽得子以錢果為貺僕不獲為湯餅客賀之以詩雙鯉來從古􅌘州喜聞英物誕東州清和時節緑隂滿秀異溪山佳氣浮分貺金錢意殊厚欲為湯餅客無由乃翁指日身龍虎况有竒兒氣食牛喻叔竒迎侍赴桐川榜其堂曰戲綵書來求詩寄題一絶桐州綵捧暫宣威首闢萱堂上夀巵堂上慈顔笑還語老萊文采愧吾兒女子生日五月十二日吾女何時見薰風欲半時年齡今稍長禮法要須知好讀班姬誡休吟謝女詩萱堂有慈母淑德可為師范文正公祠堂詩并序寶元間文正范公自潤徙越治先風化一日獲廢井于州治之西澄而新之易舊堂築新亭俱名曰清白規官師也閲歲浸久舊刻弗存紹興戊寅秋吏部尚書王公來師是邦暇日會僚屬于兹堂酌泉煮茗修范公故事慨然歎曰自漢迄今守兹土者亡慮數百人莫賢於范堂與泉盡其甘棠也記其可以不刋又謂公自筮仕掾桐川典郡帥邉所至立祠獨越無有於典為缺於是求公遺像得之於其家比它本為真乃命工繪之即其堂而祠焉明年閏六月庾申躬帥幕僚祀之某作詩以紀盛事堂堂范公真天人配我仁祖為元臣材兼文武懷經綸先憂後樂不為身上與夔卨相等倫正色朝端批逆鱗三黜愈光名愈聞一麾東遊禹所巡作詩懷蠡祠季真卧龍山麓井久湮綆而汲之清且新堂于其旁記厥因名標清白埀不泯規爾官師意諄諄洗貪濯盜思還淳人亡迹在嗟己陳斷碑往往埋荆榛後人不識真天人但能日飲堂中春越以清白堂名酒使君好事賢且仁治民律已惟公遵登堂感概懷斯文刻石繪像揚清芬丹青炳耀如麒麟凛然如生見如親躬修祀事率幕賓手酌寒泉羞澗蘋一酌清我僚吏民再酌為國清簮紳要將清白風無垠庶俾范公遺志伸公乎為仙為明神為澤為瑞為星辰當寧焦勞思若人九原喚起清邉塵次韻梁尉秦碑古凨會稽秦頌德碑丞相李斯篆世傳在秦望山莫知所在教授莫君好竒嗜古搜訪尤力有言碑在何山者莫以語某何山見於圖經在秦望東南疑其真秦望也某欣然欲往職有所拘以告會稽尉梁君梁慨然而行登山果見之碑石僅存字磨滅巳盡墨片𥿄而還作古風長韻具記始末因次其韻且記吾三人好事之癖亦以示後人也姬嬴遺迹存者希世傳石鼓稽山碑石鼓榆楊得韓子文與二雅爭驅馳秦碑夸大頌功德埋沒草莾無人知或言出頂石猶在上有虎豹龍蛇螭神藏鬼護荆棘蔽崖懸磴絶登無岐廣文好竒穴探禹梅仙喜事僧尋支攴遁昔遊越中好山水梁仙宿雲門訪古迹于曽我贊其行要親覩勿受世俗流傳欺望秦望秦兩嶄絶何山壁立東南涯豐碑屹植最高處不知磨滅從何時剔苔掃墨了無有模糊片𥿄亦足竒濃雲霮䨴黯將雨古木槎牙蟠老枝歸來走筆出險語訶政叱斯同小兒詩成得得寫寄我詞嚴意偉法退之我聞秦人滅六國酷若犬磔臨江麋先王法為秦所負負秦况有秦有司五經灰飛儒濺血堯舜周孔何能為上蔡獵師妙小篆奴視俗體徒肥皮東封太山南入越大書深刻光陸離沙丘風腥人事變鬼飢族赤誰嗟咨漢興萬事一掃去惟有篆刻餘刑儀磨崖𣣔作不杇計其如曆數不及期蚩尤五兵紂􅃮器人物美惡寧相庇我雖過秦愛遺畫南山入望頻支頥不須嶧陽訪棗刻不用遷史觀雄辭虛堂默坐對此𥿄閉眼暗想君勿嗤要知秦碑沒字本却類周雅無辭詩府師王公中秋宴客蓬萊閣分茶賞月于清白亭某以幕尞與焉坐上成二絶使君開宴小蓬瀛幕客參陪亦與榮茗煮寒泉飲清白酒斟佳月賞分明白髮青衫老幕官蓬萊秋月兩年看興來端欲乘風去不怕瓊樓玉宇寒又和趙仲永撫幹二首氷輪飛出暮雲端更向蓬萊頂上看端似虹橋玩金餅絶勝華屋見銀盤光浮酒靣杯尤滑清入詩腸句不寒又與鑑湖添勝事一時賓主盡鴛鵉千岩競秀越王州地勝錢塘與虎丘龍卧半天頭吐月鑑湖千里影涵樓宴開秋色平分際人在蓬壷最上頭不負良天更輸我此中此夜兩年遊去歲中秋與同僚賞月蓬萊閣今復與府會舊遊諸公皆不在焉再和峥嶸髙閣聳雲端萬􅊤千岩坐上看八百里湖寒鑑瑩二千年國卧龍盤金風吹靣掃殘暑明月入懷生嫩寒見説神山正相偶醉中端欲駕仙鵉家在東嘉山水州玉簫丹竈古仙丘兩年秋月登蓬閣千里鄉心繞謝樓作賦端同北窗裏思歸長詠大刀頭與君何日脫塵鞅杖屨逍遙物外遊又用看字韻酬趙仲永紅蓮分幕忝同官秋月揚揮並席看句好湖山添秀氣談清齒頰帶微寒故參政李公挽詩三首光字太發一代高明學三朝骨鯁臣淮南憚長孺楚國忌靈均死尚憂王室生寧問大鈞薑山同峴首千古淚行人某比見畨撫幹言公在謫所及埀死之際所言皆天下大事潘乃公之壻也方靣功尤著朝端氣最剛身能縳元濟城不陷睢陽思奮少連笏耻同袁盎堂永嘉瞻五馬遺愛可能忘公在南荒日迹危名愈尊芝蘭坐竒禍瓜葛醖讒言斥去權臣力生還聖主恩衛公精爽在何用些招魂九日與同官遊戒珠寺用去年韻九日重登古蕺山勞生又得片時間菊花今歲殊不惡蓬鬢去年猶未班藍水楚山詩興裏鑑湖秦望酒杯間醉中同訪右軍迹題扇橋邉踏月還顯仁皇后挽詞三首代安撫王尚書媯汭嬪天子塗山育聖人聰明配昭獻慈儉繼宣仁湯沐寧私已園陵不病民鴻休耀彤管無復數娀姺八帙年無憾三仁諡有輝國朝仁宗皇帝宣仁皇后大行皇太后皆諡日瑶池燕仙侣窆石􅌾遺衣忽覩龍輴去猶疑騩馭歸聖情哀不盡淚向禹陵揮代邸迎歸日炎啚喜中興解將天下飬惟有聖人能方慶朝長樂俄驚望獻陵寢園祗奉處擁紼淚埀膺胡氏挽詩婺女人嫁陳氏王尚書弟婦也王作墓志婺女生賢女端宜配德星登堂飲姑乳調膽教兒經子舍春猶盛孫枝葉已青韓碑紀遺懿彤管繼芳馨次韻喻叔竒追感去冬天衣之遊去年同會類高陽蠟屐登臨雅興長可但山光向人好更欣天氣為吾良路經禹穴深懷白目對秦峯逺憶黃天衣在秦望山下按朱育對四皓黃公者乃越人也日線又添人正逺尺書千里尉相望次韻劉判官大辨見贈篋藏詩墨尚澄鮮長記東嘉共綺筵遊宦俱為蓮幕客異鄉重見菊花天謝池一別真成夢鑑水相逢似有緣小小園林吾欲老看君功業上凌煙劉丁丑在永嘉同郡燕即席作詞有凌煙多少功業之句趙仲永以御茗密雲龍薰衣香見贈仍惠小詩次韻天上人回餅賜龍香沾衣袖十分濃明珠照室光生豔三絶全勝萬石封仲永再和三絶復和以酬間世宗英學海龍交情尤為野人濃天香御茗分竒紀盡是殷勤手自封手汲寒泉碾小龍天香一炷滿衣濃與君慷慨論時事欲吐丹心上實封長記中秋踏卧龍尚餘詩興至今濃羡君豪邁如韓子聮句猶容李正封寄題周堯夫碧梧軒鳯凰梧棲竹實食胡為使之在枳棘開軒種梧髙幾尺鳯兮凰兮聊爾息莫羡風微燕雀髙一飛定展沖天翼覽輝瑞世鳴朝陽此梧長向人間碧留别民事堂二年宦東州民事了無輔俯仰愧斯堂何以報明主故家簫峯下歸耕及春雨平生甽畝心感槩聊自許題雙峯資深堂書生𥿄上誦糟粕釋子舌端談葛藤道在湛然方寸地不知深造有誰能我到雙峯尋寶月為晉一宿話資深但能造得儒宗語使是能傳佛隴心雁山門户此中入南北兩峯相對尖我與林泉有盟約問師覔取一峯潛千峯巳見見雙峯甌越山川在眼中吾祖吹簫定何所會須乘鶴訪遺風雙峯之西南亦有吹簘峯堂名石刻兩俱存令我深懷舊長官學道資深更深處居安能使庶民安周開祖昔令樂清有遺愛堂名乃開祖所命宿靈岩贈長老敏行藍輿謝公嶺杖屨矩羅室淨名訪維摩一菴僅容膝尋僧畫屏中往往多八十平生看不足靈岩最竒絶老禪蜀中來心印傳佛日腳力窮天下稱此為第一兹山昔未開藏閉最深密倘不遇熙朝造物肯容出孫公賦天台勝地尚遺俟我欲續金聲願借山中筆梅溪先生後集卷第四梅溪先生文集卷第四詩次韻寶印叔題止庵三絶鑿石依山作小庵花香入座月侵簷雖然眼界無多地解使人天競聳瞻容膝茅庵不妄開𣣔令人悟止由來箇中妙意知誰解多作休休莫莫猜晚學無由識道真前賢未許繼芳塵道從何進從何止敢叩無為絶學人翁府君挽詞子萬春壻劉鎮皆登科埸屋牧功不在身蘭馨玉潤揔竒人過庭詩禮家風變坦腹門闌喜氣新華屋産芝雖美瑞白頭生齒誤青春籃輿方起南遊興無奈今年歲在辰十月十九日雷二十一日雪前日始驚雷失令今朝忽見雪漫天寒窗夜擁黃紬坐間讀春秋隱九年次韻表叔余叔成示兒余名䑾子璧從豫遊父子乃天性鍾情誰不然教之以義方先賢有名言日嚴在所尚私念冝舍旃君子不自教遣隨師友肩青紫乃餘事要當知聖賢居家務孝弟立行防悔愆窮當慕顔回逹勿為公孫庶幾幼所學終身可行焉不見不邳丈秀彂從妙年束書入賢關日與英雋聮忽作何蕃歸甘旨奉晨昏丘園事髙尚腹笥常便便過庭有竒兒詩禮得家傳勉哉尊所聞愼勿學鄊原表叔陳景韶挽詞問舍求田事元龍意本輕功名孤壯志詩酒送平生李密傷為弟劉牢喜有甥毛叔度其甥也詩書巳三世二子盍升卿先友嗟無幾公今亦古人平門散車轍蕃榻鎖埃塵甚愧韋公厚深知管子貧平生談笑地感激淚沾巾詠述師葡萄柱杖拈餘戲插泥草龍珠帳挂簷西荔枝體物差勝棗畢竟俱非善品題十一月七日東山省墳因思先子昔年題壁有山光水色兩依依之句舊屋巳壞墨迹不留山水依然感歎不巳因成一絶松楸一見一傷心亭院凄涼慘樹隂記得先君舊題壁水光山色恨難禁寄萬大年九萬程遙共退飛江南竹葉後先歸儒冠到底輸紈袴關吏還應笑布衣雖欠姓名聮桂籍不妨歡笑奉親闈殷勤尊酒論文約却恨還鄊與願違戊辰春與大年俱下第同歸全會稽豫復還學追補至秋還家萬季梁和詩留别再用前韻三年燕雁不同飛一笑相逢尉逺歸搜我肺腸茶著令豫歸與諸友講茶令每會茶指一物為題各舉故事不通者罰命季梁掌之飲君文字酒淋衣詩方唱和如仙館豫昔招仙館與同舍結詩社近諸友亦多唱和人遽飄零似省闈畢竟此心元不别秪應形影暫相違將過萬橋用前䪨寄大年先之三年在阜不鳴飛側翅俱從舊路歸師德量寬真耐事謂先之沈郎詩瘦不勝衣謂大年都緣有職供甘旨可是無心戀闕闈酒發葡萄螯斫雪定知此碩不吾違種蘭有感芝友産岩壑無人花自芳苗分鄭七穆秀彂謝諸郎世競憐春色人誰賞國香自全幽靜操不采亦何傷再用前韻誰棹深林秀遙分奕葉芳秉殊溱上客握擬殿中郎眼淨見幽韻心清聞逺香當門不及種踐履恐成傷三月晦日與同舍送春于梅溪因誦賈閬仙詩云三月更當三十日風光别我苦吟身共君今夜不須睡未到曉鍾猶是春時有二十八人遂以齒序分韻記得來時手自探預知今日思難堪樹頭緑暗鶯如訴地上紅多蝶尚貪此夜鍾聲那忍聽明朝酒盞可能酣却因送别還驚我老境如蠶已食三為麥祈實陽律臨姑洗宸心念歲飢時羞方廟獻麥實為民祈日暖輕花吐風和翠浪微敢言因鮪薦碩勿作蛾飛會續來牟頌寧聞告糴譏崆洞今歲熟登薦定無違次韻萬先之讀莊子莊生蔽于天先儒巳能言六經有真味奚用食馬肝王何佐其髙遺害今猶存夫君高明士寄趣名理間恐蹈賢者過因詩與君論巳巳梅溪同舍三十人其九人者遊從之舊也酌别之夕獨五人在焉謝子與能猶在豫館而四人者且去矣遂各以其姓賦詩送之周仲翔梅溪闢家孰辱與英俊遊回首五年舊子獨終始周善交固耐久厚德堪鎮浮異時行所藴無愧祖絳侯李大鼎賢哉豫外兄厚德著鄉里積善有天報鍾秀在吾子學問如馳馬著鞭殊未巳西遊不負盟早早戒行李許輝先子昔從豫遊方讀𥿄上語磨礲出圭角翦拂就規矩不為中道廢當振大嶽許行將拭老眼看子驚人舉謝鵬之子方妙齡耻為聾俗化三年遊梅溪燈火讀深夜男兒四方志万里思高跨願如芝與蘭母愧古諸謝别宋孝先楚臺風騷客遙遙有竒孫去歲始識面未遑叩淵源但見眉宇間一點陽春溫琴書忽來遊文字獲細論經術有根蒂詞章冨波澗時時戲翰墨動輒千萬言子固豫所畏語蒙子推尊豫嘗語所學文當氣為先氣治古可到何止科第間子賢且樂善服膺每拳拳臨行出新詩殷勤記諸篇好學見雅志豫言未應然惜哉有離别後會何寅緣男兒各自勉事業無窮年送黃巖三友聚散本常理未應輕感傷秪因三益友故斷九回腸子少才俱美豫窮老更忙相將亦行客後會恐參啇又各贈一絶余如晦遙遙華胃自由余識量深沉豈淺夫半載從遊殊半面臨行一語可能無鄭遜志燈火相親臭味同來何太晚去匆匆未曽針我膏肓失堪嘆康成道巳東施良臣學傳士丐舊家聲詩法肩吾句巳成尊酒論文兩經歲却因送别倍鍾情别余諧我昔自總角識君先大夫閨門修子聀鄉里號名儒仁者偶不夀善人冝有孤肯堂能自勉泉下尉榛蕪别余壁之子有家學妙齡殊衆兒參平冝語孝鯉也早聞詩謾習雕蟲技終絺吐鳯詞五車書讀盡定有起家期别周濬莫恨知書失太遲妙齡聰子本非竒好因推魯加鞭策會見火然泉逹時後七夕二夜同夢齡宿湖邉莊無用乾坤一腐儒年來蹤迹轉﨑嶇身名未就耕桑廢何日投間老此湖弟兄身事各茫然賴有先人二頃田他日青山映黃髮長如今夜對牀眠次夜豫宿湖南夢齡猶在别業再和前韻寄之家世衣冠誤襲儒年幾四十尚嶔嶇營營世事何時了乞取湖邉作鑑湖一襟秋色巳凄然雲水𥘉空眼界田那更蕭蕭風雨夜弟兄分影隔湖眠宿靈山院靈山未是别鄉山回首吾廬咫尺間明日出山家漸逺鄉心從此上愁顔登姚奧嶺望家山有感巳作一宿客漸為千里人吾親白雲下回首一沾巾與萬先之登丹芳嶺路人有手持桂花者戲覔之慨然相贈且言𣣔施此花久矣又言花名秋香一名十里香遂與先之分之記以一絶携手丹梯語話長不知身到碧雲鄊行人相見如相識贈得岩花十里鄉香題石梁蕩中天柱見巳久山外石梁今始觀尊者力能回造化會須移向柱頭安過雁山清秋天氣過山中征雁行人路不同從此又勞千里翼傳書來往浙西東次先之過雁山䪨雲山繚繞幾千重撩我秋來逸興濃𣣔向靈岩移卓茟與君同掃万人鋒張施二生自黃岩拏舟送别于台城贈以二絶不放離人獨解舟片帆相逐到丹丘客情鄉思從今日更有思君一假愁行役那堪八月時腸非宋玉也應悲煩君為寄梅溪信少尉吾親别後思施生將過梅溪從吾弟夢齡遊過仙人渡此去神仙路不迷直從洞口到桃溪仙人心境無名利笑我頻年渡此溪過百度嶺嶺下有大惡小惡灘乘舟剛怕兩灘惡度嶺俄驚百步高僮僕相看話良苦縱教輕簷亦疲勞諺云百步無輕擔因借其語關嶺旅邸觀林同季野去秋題壁去歲還家秋正杪今年行役暑𥘉殘同行壁上留題處特下籃輿子細看望天台赤城山感而有作神仙境界無戰爭奚用􅃮此巍巍城吾聞秦皇昔多欲冨貴巳極貪長生蓬萊方丈𣣔親到車轍馬迹無時停萬騎南巡適吳越天台咫尺行將登仙山不容肉眼見天為設險藏神靈山中采藥使未返鮑魚向巳沙丘腥秦為防胡築紫塞連年不恤生靈害天亦防秦甚防胡赤城髙峙煙霞外神仙要非求可得祖龍可笑徒勞役當時劉阮本無心花笑水迎山自闢我向丹丘數往來群仙杖舄未容陪揮毫𣣔續孫公賦愧無擲地金聲才目極蒼崖千万丈世無仙骨那能上直須內外兩丹成駕鶴驂鵉如指掌柘溪道傍有班竹百餘挺蕭灑可愛與先之賞玩移時因念鄉間無是種約異日移其根豫戲誦君看江上千竿竹不是男兒淚點班之句遂彂一笑既而作數語解異世婦人之嘲且志不必移根也男兒有淚不染竹當作包胥賈生哭湘源遺種雖可愛莭目尚餘兒女態誰能千里移此根出門又恐添啼䀶不如還家種慈竹不厭千竿万竿緑代婦人答君勿題詩訾湘竹君勿笑他兒女哭人為鍾情故生愛夫婦相思乃常態為君飄蕩太無根兩臉盡是思君䀶安得相依似雙竹長保千秋万秋緑題劉阮祠用過仙人渡韻澗水桃花路易迷不同人世下成蹊自從重入山中去煙雨深深鎖舊溪至剡溪寄夢齡昌齡歉歲為行客清秋别故園自從離雁蕩長是念鴒原世路疲來往親闈廢清溫緘書付歸僕銷盡旅中魂剡溪舟中有感又作遊吳客重登入越船西風桑葉岸細雨菊花天旅思秋偏惡鄊心夜不眠錢塘江上月行見十分圎前中秋一日舟過山隂晚稻方熟匆動鄉思呈先之西風吹白蘋遊子千里征扁舟入鑑湖水月相􅉼明山隂晚稻熟万頃黃雲平憑湖屬逺目動我鄉曲情豈不有一飽胡為苦營營五年倦來往爭此蝸角名未知得失間奚辱亦奚榮何當畢所碩同歸及春耕夜泊蕭山酒醒夢覺月色滿船感而有作候屇星虗午夜涼更堪停棹水中央短蓬破處漏明月歸夢斷時思故鄉客裏未忘詩酒趣老來厭逐利名埸明朝又向錢塘去十里西風桂子香十月二十八日母氏劬勞之日也哀痛中書二十八字懸孤謾喜生良月看鏡堪嗟巳二毛不見雙親空泣血此生無計報劬勞次韻昌齡遊白石二詩道岩東際白石二佳境也豫未之見昌齡弟比嘗登覽作二詩以寄模寫景物之竒蓋吾家摩詰二幅山水圖也秋涼一訪之當按詩以遊不必假圖經矣因次䪨見意飛流噴沫下煙嵐肯使名同盜與貪莫訝來時多汩汩定知止處却潭潭遙通雁蕩靈湫兩巍壓龍門巨浪三好景不煩摩詰畫盡歸詩客句中含右東際未窮腳力上層霄想象名山興亦高物外遊人身插羽洞中仙客泍生毛利名奔赱嗟吾老杖屨徜徉羡子豪鳬舄共遊端有日預期木葉下亭皋右道岩再和二首佛國飛來百尺嵐要將法水嗔洗貪仙人錯認蓬萊島騷客羞談鈷鉧潭觀盡豈須窮莫四悟來𥘉不異前三水有七際諸方始登其三以日莫而回莫將七際觀東際法界三千際際含少和丹就巳登霄岩與仙風兩並髙甚𣣔此身參鶴馭尚嫌多事類牛毛雲間雞犬年猶永世上英雄意謾豪堪羡北山山下客不緣射雉亦如皋贈萬序弦誦先閭里東平典則存殘膏沾後學餘慶在重孫事業年方少功名志可吞時人貪擇臠慎勿為財婚過萬橋哭潘先生投老西遊志不成死生貧賤見交情江頭昨夜潮聲怒却為先生氣不平先生有題伍子胥廟詩云大江今古潮聲怒長為將軍氣不平夏伯虎贈雙鯉知我山間久食𬞞遙分七十二鱗魚不妨時遣長鬚主要得頻看尺素書貧家連歲蠶荒今年尤甚妻孥有號寒之患每欲以酒自寬酒惡竟不能醉拙于生事殊可笑也表弟万大年家蠶熟酒醇有足樂者因思舊詩有剩栽桑柘教妻蠶句遂和以寄之年踰四十尚何堪愈老生涯愈不諳何以代耕猶未仕𥘉無可樂誤為男號寒兒訝桑條沃飲酒賔嫌蜜汁甘堪羡通家万公子細君善釀更能蠶大年和詩再用韻年少如君種種堪文場世事兩俱諳何憂朝錯不髙苐未怕杜陵無好男大年詩有未祿無男之歎况有田園足耕飬好窮水陸奉肥甘更須猛割閨房愛來與荀鄉共賦蠶李梗和詩復用前韻維摩老病思何堪藥性從今却漸諳掩卷正思眠丈室論文俄喜遇竒男共嗟世路羊腸險剛怕人情鼠口甘聳壑昻霄君未晚吾衰巳是食三蠶用前韻寄周光宗炎涼世態可能堪肺腑唯蒙長者諳耐久敢忘三世好同庚况有兩家男孟甲與光宗子同庚我嗟風樹徒悲苦君奉庭闈備旨甘他日相看兩黃髮碩為鄰舍話田蠶送李楰梅始花時送子歸梅黃雨細又分離不堪旅食見飛燕那更催歸聞子規太白讀書容有趣少卿惜别可無詩霜臺清峭家風在努力功名少牡時梅溪先生文集卷苐四
