front:
  text: 梅溪先生奏議卷第五
  hash: sha256:6e36bfb40ca55ea350dd8183e39c44d17c5a3b5113c173868ae6f59954d8e41f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_005-1a}
body:
  text: 代越帥王尚書待罪狀臣聞為臣莫重於守官治獄莫先於奉法苟用法之際或有所失則曠官之罪將何以逃臣伏蒙聖恩出守會稽未到任間有盜發某官王佐母冡亂其骨殖非特王氏一門痛徹心骨臣忝係守臣心實憤之在律發冡見尸者死兹盜之死冝矣有司議法以按問減二等又以其妄引平人加徒役流當時固疑其情重罪輕有司第知守法而臣失不敷奏既巳斷罪佐弟公衮以冤憤不雪誓不共天手斬讎人自投于府臣與官吏咸義其舉已具始末奏聞且謂公衮奮不顧死以報母讎斬首申冤詣府請罪雖在法有所不許其孝莭實為可嘉蓋欲朝廷敦奬其孝而特貸其罪也今來給舍奏議以臣本府官吏故縱失刑尚荷寬恩止以失出議罪臣與官吏相與守法者也今乃法失於有司而志行於臣子臣等之罪誠不可容伏乞聖慈重行朝典謹具奏聞伏候勑旨又代上郊祀天晴劄子臣兹者恭惟皇帝陛下遵祖宗三載故事復行郊祀之禮並見天地配以祖考甚盛舉也然前期三日風雨晦冥中外憂之及陛下御大慶殿齋宿群臣在庭雲隂忽開天色澄霽用事之夕月星潔明禮畢賀旋愛日掦輝六軍萬姓罔不歡喜郊焉而假廟焉而享昔聞其語今見其事臣官居侍從聀在近藩咫尺堯天目若親覩其為慶抃實倍於常情萬萬也然天下皆知陛下孝德精誠能感應之速如此臣獨謂陛下孝弟通神明至誠格萬物固不止一日也然往歲郊祀載暘載隂未有天地廓氛日月呈祥如今日之事者兹蓋由陛下比年以來捴欖權綱福威自巳正塗開闢朝廷清明故德之動天不俟終日天人相與之際其昭昭然如此臣伏望陛下兢兢業業益加勵精新而又新終始如一則天地交泰三辰著明長如郊祀之日誠宗廟之福天下之幸也臣不勝至碩又代上劄子臣比者伏蒙聖恩出守于越陛辭之日親奉王音以東州災傷令臣檢放賑恤者臣仰體陛下惻怛之誠不敢少怠入境之𥘉延見吏民訪問疾苦視事之日首遣僚屬分詣諸邑與縣令躬行阡陌同共檢視咸得其實遂以所傷輕重等級減放其間有保甲𥘉以熟申及揫斂之際實無所有者與檢視有不盡之處有致詞訴者臣續巳覆實復與減放既而又得聖旨蠲免租稅以內帑代償百姓歡呼鼓舞莫不以手加額咸謂陛下仁恩德澤亘古所無雖天地父母有所不能及臣又上躰聖意將本府所有逋負積年公租私債貧不能償者榜諭人户照應指揮令至來年蠶麥成熟然後理還用是細民稍安流離復業庶幾少副陛下畏災恤民之意無任惶懼取進止又代上劄子臣誤蒙聖恩出典藩府適承去秋災傷之後上貽陛下東顧之憂臣自到官夙夜惶懼每以催科為後撫字為先比緣米價湧騰越人艱食除得旨賑濟及乞糶常平義倉外臣又令八縣官吏躬行勸諭凡有榖米之家不問官户編民但以等第髙下積蓄多寡並令發廩減價與官米並糶遂獲廣濟免致失所又自新春以米彌月不雨播種失時民心嗷嗷朝不遑夕臣退思厥咎實由臣荒政所致因思古人致雨之術每求之於人事間深慮刑獄有冤致傷和氣遂於今月𥘉六日親至囹圄踈決滯囚仍分遣官僚遍決縣獄又集僧道輩就府治焚修凡山川廟貌靡不祈禱臣亦晝夜齋𬞞不敢少懈神明鑒臨果若有感忽於𥘉八日得雨連夕雱霈農事復興民情大恱夫曰雨曰暘皆陛下聖德所致其膏澤所及固不止一方而臣喜雨之心獨倍常情者蓋緣臣所領州連年水旱民不聊生儻更數日不雨則事有大可憂者今一雨三日有年可期臣與闔境吏民不勝歡欣鼓舞感戴聖恩之至又劄子臣去秋陛辭之日親奉玉音諭臣以永祐陵昭慈宫崇奉事件臣仰見聖心篤孝著於羹牆雖堯舜之德何以加此臣至越之𥘉首朝陵廟瞻望松柏不勝悲涕凡薦祭之物崇奉之具修造之費臣仰躰聖懷罔不盡力臣輒有區區愚忠敢不冒死以聞切見􅑼宫修造每年一小修三年一大修率以為常此固陛下奉先罔極之心臣子所冝奉行而不懈也然臣切謂陵寢所在神靈是依神道貴幽理冝安靜若頻歲倄造不無震驚故古不修墓聖人非薄於其親意謂寧親莫如寧神是乃孝之大者今􅑼宫棟宇巳固器用巳備松柏巳茂陛下崇奉之心亦可謂至矣臣欲乞自今以後不必以三年大修每年小修為拘但令本府常預備瓦木工匠之類以俟不時之須凡遇棟宇或損則更之器用或舊則新之松柏或枯則輔之如是則工役不繁而丹䑾常新歲月寢久而陵廟愈安以昭先帝儉德之恭以稱陛下寧神之孝不勝幸甚又代上五劄臣聞唐社牧論兵謂上䇿莫如自治夫內修政事蓋自治之䇿也任賢使能又自治之要者昔漢以汲黯寢淮南之謀晉以謝安破符堅之衆唐以陸贄濟奉天之難我國家寶元慶曆西夏叛命仁宗皇帝以經略安撫之任付之范仲淹韓琦軍中有一韓一范西賊破膽之謡兵不大用而元昊巳服今我與虜強弱不敵惟當以人才勝之苟得伏莭死義如汲黯輩則謀當自寢風流雅望如謝安輩則敵當自退忠謀讜論如陸贄之徒則難當自解兼資文武宏材偉略如韓范二臣則虜當自服所謂一士止百萬之師一賢制千里之難者也臣又聞范仲淹𥘉以言事得罪仁宗尤為宰相吕夷簡所惡斥逐于外及西方用事仁宗思用仲淹夷簡亦力薦之仲淹果能成功夷簡不失為賢相今邉境未寧正是側席求賢之日臣碩陛下以仁宗之心為心大臣以吕夷簡之事為法相與任用天下之賢才以為排難解紛之計仍詔侍從臺諌監司郡守各舉人才勿遺踈賤朝奏暮召如恐不及如是則異人輩出可以供陛下之任矣夫猛虎在山藜藿不采國有人焉難當自消自治之術莫大於此臣恭惟陛下屈巳便民和戎福國真帝王盛德之事然虜情多詐殊不可測愈和愈驕情態巳露夫未至而言常以為虗及其巳至則又不及臣切謂備敵之術莫若通下情開言路昔建炎維揚之難起于以下壅蔽虜壓境而不知倉卒渡江禍幾不救今外議胸胸謂虜人有窺伺之心深恐中外壅蔽不以實聞維揚覆轍不可不戒欲乞陛下廣視聽通群情俾沿邉帥守中外臣子凡有所聞並以實奏勿以張皇為罪切直為諱如是則虜之動靜可以備知事之未至可以預備社稷之福天下之幸也臣聞財用不足最為今日之患議者歸咎生財無術思得𬋩蕭劉晏之徒用之臣以謂財有限而用無窮生財不如莭財省用斯能足用昔漢文帝時有玉帛和親之費然而貫杇粟陳海內冨庶者由文帝以敦朴先之宫室苑囿車騎服御無所增益故也我仁宗皇帝慶曆間西方用兵北虜增幣天下亦多情事矣而斂不及民用度不乏者亦由仁宗以儉德化下故于多事之間內不失治民到于今稱之朝廷自和議以來權臣務為苟安之計凡百用度悉如太平全盛之日中外化之競為侈靡府庫匱乏實此之由往歲陛下焚金翠近又以損名齋親為之記帥下以躬蓋無愧於文帝仁宗矣然財用猶不足臣妄意切謂奢侈之風或未痛革無益之作無名之費或未盡除至若內降之恩未能盡絶名器之假未能無濫宫禁近習使令之𢾗不無過多軍容教坊伶倫俳優之徒不能無非時之橫賜凡此之類可省者省之可罷者罷之最節財之要術當今之急務臣又聞唐德宗納裴延齡之姦謀有天子私藏之財號瓊林大盈二庫陸贄諌之甚力謂冝散其小儲而成其大儲損其小寶而成其大寶臣碩陛下以文帝仁宗之險德為法以德宗之私心為戒凡天下財賦之入悉歸之戶部仍擇知取豫之臣以司出納之柄如是則將見粟腐大倉錢流地上上下皆足公私並濟矣臣聞天下安注意相天下危注意將又聞四夷不恭拔卒為將今夷狄外侮正是注意將帥拔擢行伍之時臣切觀朝廷宿將固亦有人顧所用何如耳賢而有重望者可用為大帥以捴天下之兵權如唐用李郭之徒賴之以為安危輕重不可止令為一藩帥以泯沒其才其次驍勇善戰者可使當一面如漢黥彭之類亦可責其捍禦之功不可置之間處至于駕馭之術尤不可驕之爵賞所加必俟有功而後可若任用之𥘉先為之極它日立功其將何爵以加昔藝祖皇帝許曺彬莭度使而不遽與其後彬再立大功方加莭鉞卒保冨貴為國勳臣臣近蒙宰執傳聖旨除某人為浙東捴𬋩令臣待之加厚者如某人亦當今之名將可備急難之用所謂冝當一面者也陛下固已得之矣其它如某人比者尚或有之咸冝拔擢以為閫外之寄至于駕馭之術更乞如臣所陳如漢髙之馭黥彭量才而任使藝祖之待曺彬冨貴以俟異日庶可以望其立大功亦所以保全之也臣聞居家者必謹藩籬置皂隸以為冦盜之防建國者必保山海之險選嶽牧之臣以禦外敵慿陵之患今朝廷以江淮為蔽障以守帥為長城江淮守臣比它處為尤重冝于文武臣中擇其才勇智略可為爪牙者付之陛下親加敦遣勉以忠義資之以糧假之以兵俾其守死勿去則我有所恃而不恐敵有所憚而不敢窺苟非其人則必為敵所輕誤事非少除授之際尤不可不謹又川蜀之地去朝廷最逺尤為虜所窺伺緩急之際勢必不能相應在兵法有攻東南僃西北者虜情難測深恐虗聲在此而屬意在彼臣以為冝增重四川帥臣之權俾其便冝從事遇臨機應敵之際不必請而後行仍選大將屯重兵于外以為急難之援如是則陛下可以寬西顧之憂矣􅌳劄臣違逺清光殆將一歲待罪近甸竊祿無輔至若乃心惓惓王室顧雖食息不敢少忘兹者恭聞敦遣大臣出疆道路風傳有如上貽聖慮者陛下焦勞宵旰僃見詔音宣誦之餘軍民感泣况臣忝居獻納論思之聀其可以中外為拘喑默不言乎輒以管見條陳五事一曰求人才二曰通下情三曰省浮費四曰擇將帥五曰選江淮之守增蜀帥之權狂妄猥陋冒瀆天聰政猶爝火不足禆日月之光然愚忠所激有不能自巳者伏望陛下采愚者一得之慮赦微臣萬死之罪略賜施行不勝幸甚代王尚書辟陸宰狀臣叨膺聖寄待罪近甸其所領州號為浙東帥府屬邑有八山隂負郭而最大近知縣許某到官方及旬浹而遽死其後任某亦巳物故緣山隂係是緊切不可缺官去處臣竊見前會稽知縣左奉議郎陸之望為治寬平持巳廉潔長於撫字蔚有政聲會稽士民僧道等前後屢經本府及監司舉留狀牘其存某人今方罷官適會山隂缺宰臣遂令暫攝聀事邑人咸喜臣今欲依條令辟舉陸之望充山隂知縣以慰一邑士庶之心臣如妄舉甘伏朝典伏乞聖慈特賜俞允又代上劄子臣恭聞太行皇太后靈駕發引有日陛下遵奉遺誥凡營奉之費悉出慈寧不以一毫病民以彰皇太后仁儉之德四方聞之罔不欽歎臣待罪近甸祗奉寢園雖欲竭犬馬之奉效蟻螻之誠而不可得至若邦境所管河道橋梁宿食頓次及一行事務臣已分遣官屬一一幹治臣亦身督其役無敢怠惰者約至十一月𥘉旬悉皆辦集將來梓宫渡江決不誤事庶幾少效臣子報稱之聀上寬陛下哀戚憂念之情臣無任又臣竊聞往歲徽宗皇帝梓宮御舟進發之日凡津梁堰閘並不拆毀今來伏準橋道頓遞使報大行皇太后梓宫御舟八尺五寸比舊加太其所過之處城門橋堰勢不免毀臣伏聞行朝臣庶稱頌聖德謂日者奏請􅎚宫發引利行甲方然毀民居稍多陛下惻然曰兹豈未利耶乃改行乙方仰見聖心仁孝愛民如此臣庶感激至于流涕臣今欲乞依往歲徽宗皇帝梓宫御舟丈尺之數津梁堰閘免致拆毀庶獲仰承陛下仁孝之德遵奉大行皇太后慈儉之訓不勝幸甚如蒙俞允伏乞睿旨速賜施行取進止梅溪先生奏議卷第五梅溪先生後集卷第五詩已卯臘月七日解官離越十九日至家明年正月二日𬒳命除祕書省校書郎卜以八日行書二十字梅花照歸眼春色戒行裝君命不俟駕安敢懷故鄉次韻馮員仲正字湖上有作甌蜀異鄉客西湖同日看浪花隨去棹風絮逐歸鞍水浸吳天濶山涵佛界寬春光無限好共愧縳微官次韻趙仲永悠然閣越絶山川深更深不須登覽自來臨胸中丘􅊤忽相遇眼底塵埃無復侵得趣早同彭澤徑把杯時赴廣文襟知君指日歸天祿莫負平生閣上心次韻皇子建王題明逺樓百尺崇珠邸恩隆地更親壯侔巢鳯閣危切飲牛津眼淨全無礙心明自不塵登高宜暇日為善及良辰炳煥瞻宸畫沉潛味道真樓中藏所賜御書書中端得趣筆下已如神語帶江山好名隨棟宇新應憐天下士蝸舍不容身劉韶美辭試館職學問稱博洽向後無此劉太一然青藜遲君天祿遊給札試玉堂故事久不修遴選先實才聞之輒掉頭我乃行祕書肯隨鉛槧流三日掃虛室佇想心悠悠張羅君不顧竊食吾懷羞西風吹兼葭倚玉嗟無由再用前韻贈韶美平生少相識摸索能記劉東南小蓬萊二年同官遊濯纓鑑湖水佩蘭以潔修自倚􅺛髒門不撼冨貴頭西泛吳江瀾委身謾乘流回首望故鄉天高路遐悠慷慨君自喜伊優吾亦羞乘桴倘有志願言呼仲由次韻韶美送劉夷叔二詩時夷叔巳死蜀山高岩岩英物世非少青藜卯金子高步絶雲抄思苦鳴輒悲詞深誼難曉知音有古人𥿄上自傾倒我昔賢關遊相逄粲衣表東歸拜言贈篋笥至今好重來已鬼録魂魄蜀天渺蓬山訪高躅空舍不停繞㝎尋窮孟郊相酬類雙鳥莫作人間來世路轉難拗右悼夷叔西南有佳士岷峨秀胸中標高語更妙寫出岷峨容青天道路難冥冥慕蜚鴻翩然下人間海濶洪濤舂尋幽入禹穴杖屨誰相從萬卷蟠腹笥一榻眠禪叢時來訪豫語自愧賢非戎世態冷處簿交情淡中濃去歲鑑湖别分甘老岩松行藏果誰使離合情無窮田園有深約耘耔當自充異時甌蜀間林下見兩翁右贈韶美皇子建王生日十月二十二日黃花過後梅花前雲披愛日烘青天月良隂剝陽欲旋蓂餘八莢時半千鬱蔥佳氣燭星躔帝子來從天日邉淑質岐嶷貌端然少親師傳學問專六籍奧旨能心傳百家諸司咸窮研餘事翰墨工詩篇平居為善心拳拳君親忠孝尤兩全放逺聲色塵管絃明窗自結賢聖緣吾皇知子能擇賢斷自宸衷愛不牽九重一日丹詔宣歡聲喜氣溢幅貟願王自愛思無愆仰佩天眷奉周旋保持王體如臨淵日親端士逺侫便𥿄上興衰鑒古先誕宸未邸錫玳筵鼎來福祿方綿綿不須丹竈求神仙不用具葉慕真詮誠存性盡萬善圓身與國夀俱千年寄新曆日與夢齡昌齡弟老去驚看曆日新宦情尢憶故園春吾鄉親舊如相問為道明年已五旬送查元章二首聖主德寬大小臣言激昂虜情殊未側準甸可無防直氣思開日寒威誤隕霜芳姿等蘭蕙摧折更芬香肝腦不自愛精忠為上殫危言犯顔昜直道立身難去國名逾重還家迹始安相將吾亦去林下挂衣冠祕書省後園修竹可愛胡正字憲有詩次韻不俗更嫌俗風枝時拂墻青青映藜燭細細雜藝香徑節老方見清隂寒欲藏蕭悚似吾輩味向靜中長魏邦式通判挽詞挺挺魏公後重聞别乘賢有時同正觀無地上凌煙雨足嘉禾穗風清婺女蓮吟魂招不返遺恨越江邉耆舊嗟零落公年又不長雙旌空入夢半刺橫罹殃子舍三珠秀吾鄉一鑑亡平生可書字椽筆有星郎張郎中大猷作行狀次韻程泰之正宇雪中五絶幻玉蜚花濕帝城蓬萊燈火冷中清人間草木舊相識傾刻還驚靣目生栖烏驚起天無月化鶴歸來頂不朱錯認湖山作西子眩人疑是玉飢膚點綴工夫巧更竒崑崙玉果半藏㽔嗅梅咀雪欲腸斷况讀高生人日詩人日雪預知禾麥定登埸六出攙先瑞衆芳更喜江梅自蕭灑不緣摧壓減清香卧聞征雁作回音遙想吾廬玉滿林乘興扁舟㝎歸去草堂深處伴猿吟泰之用歐蘇頴中故事再作五絶勉強繼韻君詩雅勝五言城白雪篇章分外淸不許同僚持寸鐵筆尖戰退老書生寒侵睡思那成夢酒著襄顔誤抹朱待詔先生應怯冷餐氊使者可稱膚穀精蜚處人為日氷鑑頒時律應㽔照耀元宵更盈尺不容燈火占新詩煮海神功不計埸逼真冷熖奪春芳東君深恐成堆積急遣雷公喚阿香夜靜微聞折竹音驚禽何處更投林寒生習氣無繇掃遙對湖山忍凍吟趙仲永和東坡汝隂雪詩并舉趙德麟賑濟故事見示遂次其韻不作秦人視越人深憐里舍甑生塵恨無廣厦容寒士安得洪爐暖曲身屮木照人俱有艷珠璣滿地不憂貧慿誰扶取浮雲破莫待功成始放春介甫詩功成終欲放春回次韻洪景盧編修省中紅梅不為怕寒貪睡遲東君妙意端可知雪英零落䀼界寂放此孤瘦紅南枝蓬萊更向逸逺地園在著廷後屮木寧有夭饒姿氷容戲作桃杏色醉臉雅與神仙宜江兄蠟友已前輩黃生後出非同時丹心獨與徑節侣踈影共浸清漣漪騷人相顧最不惡何用車馬紛雖蚩典衣莫昔共携酒對華一展思鄉眉李德逺寺簿敢言勇退今之古人也東嘉王某賦詩以高其行吳山蒼蒼煙靄橫皇都日日春風生利塗徢徑走輪轂古道荆棘惟君行吳江洪濤拍天泑萬楫千帆日相踵六鰲入釣猶不歸急流知退惟君勇斜川勝事今臨川錦抱風月追謪仙芋魁豆飯吾亦有脫屣有愧君翩然我輩情鍾惜離索為國惜賢情更惡江頭送别春尚寒回首冥鴻已寥廓省中黃梅盛開同舍命豫賦詩戲成四韻照眼非梅亦非菊千葉繁英刻琮玉色含天苑鵝兒黃影蘸瀛波鴨頭緑日烘喜氣光燭鬚雨洗道裝鮮映肉此梅開後更無梅莫惜攀條飲醽醁送王嘉叟編修上書薦張和公請外得洪倅上書請劒人未復胡邦行昔亦以密院編修上書開口薦賢君又行堂上伊優笑絶倒紛紛去國皆狂生搢紳敢言似慶曆風俗漸美如東京手揩老眼看除目一遷一去知誰榮南昌别駕亦不惡三王高閣尋宗盟吳江漫漫楚天闊羡君一葉春舟輕送陳阜卿出守吳興自察院遷郎未幾得外臺閣輟名士符竹分帝憂搢紳有清議欲為朝端留才名四十年骯髒成白頭方開公道口遽中讒人鈎觸邪孤壯志斂惠施一州命義二大戒能言亦能由阜卿嘗作命義天下之大戒論學者至今傳誦去矣霅水清孰障天下流願言如季路乘桴共公浮次韻程泰之酴醾青春果作堂堂去啼鳥喚春春不住明珠萬顆玉為錢欲買風光嗟巳莫蓬山地冷花木稀秪有寒梅已先雨誰遣虬枝上高架稍覺雲隂覆行路雨餘景物猶未佳葉底精神不多露鼻觀疑聞班馬香姿比何郎更風度平生惜春如惜别老眼待花如待哺幽亭相對止三人草草杯盤為花具時同舍考試惟泰之貟仲某任館送胡正字憲分韻得來字胡上書言事得祠還鄉同賦者七人以先生早賦歸去來為韻武夷之山高崔嵬武夷先生賢矣哉山中高卧似孤竹顔蒼節徑清無埃吾君飬老過西伯不逺千里歸乎來胸中萬卷可醫國首薦廊廟真人才胡上書薦張和公人言朝奏暮必逐天顔獨為忠言開崇文三館不浪闢端為天下收竒瓌平時論議即涵飬富貴豈以三緘媒西京老儒作符命蒼黃投閣良可哀何如皇朝有甌范開口不憚干霆雷文忠文正二公皆以館聀言事先生學力到前輩一時盛事光麟臺宸衷宵旰急忠讜佇觀前席延鄒枚先生掉頭竟不住扁舟自載高風回道山遊從盡英雋顧我晚進寧容倍梅花滿枝桞弄色賦詩送别同銜杯吾廬三徑亦荒草松菊怪我何遲徊四月四日祀赤帝于慈雲嶺淨名寺祀畢遊易安齋至江次送黃子升通判還鄉祀罷燈花喜山遊曉色新江頭送歸客我亦是行人送太學生徐易歸天台天台古仙山藥物固非一采之言可延厥品惟參术兹誠籠中物不可亡一日良醫苟能用可治天下疾章季子教授惠顧渚茶報以宣城筆戲成三絶春回顧渚雪芽生香味尤宜祕水亭搜我枯腸欠書卷飲君清德賴詩情白齒新芽不出山青囊誰遣到人間午窗驚覺還鄉夢紗帽籠頭捧兔班季子以青囊紗盛二兩云乃真顧渚零陵佩不出山絶品也霅水書來寄葉嘉中山人去代瓊華定將綘帳鑄人手散出毫端千種花趙仲永和胡正字竹詩見贈用韻以酬憶昔遊蓮幕獲登君子墻蓬萊醉秋月龍鳯啜天香臺閣子將集山林豫欲藏新詩似修竹風味更高長張閣學挽詞宗元南渡巳三紀衣冠今幾存傷心失遺老回首慨中原去國權臣力全軀聖主恩致君堯舜術妙意託空言公嘗解二典公在南昌日含沙禍最竒語蜚無限謗獄具不過詩天道何嘗逺人心自太危蓋棺公論定盛德合豐碑寶月師刻豫舊題以寄因書二絶資深堂上偶留題多謝髙僧不掃泥更與殷勤琢山骨惡詩傳到浙江西册府經年已倦遊夢魂隨雁到峯頭山中老宿如相問為道歸期不待秋五月十八日去國明日宿富陽廟山懷館中同舍去國懷明主離群念舊遊翻令到家夢終夜繞瀛洲寄馮員仲相見惟言去吾今去已成著鞭先幾日不及送君行釣臺漢高嫚罵四皓隱周武干戈伯夷餓南陽故人幸無失先生胡為亦高卧清風却在夷皓上千古真能激貪儒客星夜向釣灘明想像年時臨帝座嚴州龍門院滿散天申莭棹弭龍門下誠馳天闕邉平生甽畝意祝聖更惓倦宿永康縣黃塘店觀稼有感路入黃塘喜更疑地名雖是里閭非豫家之東十里地名亦日黃塘眼中禾稼已如許薄有田園宜早歸永康有嶺名花錦𬒳要將山水替埃塵六月還家不憚辛炎暑厭聞花錦𬒳清涼宜近竹夫人舟中偶題緑水客星瀨薰風婺女溪來尋處士隱歸向斗中棲遊石門洞雁山飽見兩龍湫洗眼新觀石洞流欲向故鄉尋白鹿先來仙隱訪青牛青牛道士隱于石門破荒喜誦劉郎句躋險思從謝容遊天下林泉看未足分將身世早休休林明仲自梅嶼拏舟招丁道濟道揆張思豫及豫同飲索詩坐間成六絶七月朔日君家梅嶼我梅溪一笑相逢郡治西明仲别館在城西豫假之踰月要使衆山同對酒芰荷香裏具親携右贈明仲塘餘春草遙思謝樓靣蒼陂重憶劉時泊舟思逺樓下楊播詩云吳興劉孝叔樓此靣蒼陂人昔共遊今孰在蘆花飛雪上吾頭豫昔遊洋宫與同舍泛舟有共乘小艇穿蘆花句今二記矣訪舊多在鬼録而豫已老慨然傷懷右懷舊遊五人二百六十五尊酒相逢非偶然把手共為他日約莫緣富貴負林泉時仲明五十六道濟五十四道揆五十三思豫五十二豫五十右贈諸公遙岑出碧明雙目境入韓詩巳飽參湖上軒窗對遙碧新詩寫出舊城南地環碧玉軒窗瑩舟入紅雲笑語香下筆慚無少陵句老懷徒愛宋公莊宋侍郎别業廳思逺樓之南有軒名遙碧右題宋莊西岑風物冠吾鄉十里煙波興味長不用扁舟鑑湖去餘生甘向此徜徉右題西岑梅溪先生後集卷第五梅溪先生文集卷第五詩壬申中秋交朋解散不期而會者鄭生遜志夏生伯虎因小飲玩月二子各以詩贈依韻酬之鄭生襟宇絶纎埃夏子心希好學回誰遣吾人來破願可能良夜不銜杯從來月罕中秋見那更尊無俗子陪遙指桂枝因賀客文星近歲屬溫台術士言文星近歲正臨溫台鄭台人夏溫人猶勝太白號三人又免韓公誚聚蚊薄有壼觴非獨酌共將文字作淸醺天髙雲散懸金餅風峭溪涼皺縠文却恨鍾情未能遣愁腸終夜轉車輪書小成室万言柸水北窗裏慷慨悲歌五夜長骨肉未知蘇季子鄉閭誰敬馬賔王為人心盡同毛頴與世交踈類孔方晦迹溪山可無恨蕭然一室任凄涼哭孟丙幼兒孟丙年四歲從謝任之發蒙六歲從周誠叔能誦蒙求孝經論及五言詩書院遊從近百人類能道其姓第名字或能優劣品藻之于所親之前豫每説書則與二兄侍立其側會茶與舉故事在群兒中粗為了了者年才七歲而死紹興壬申實五月二十四日也我輩鍾情痛不自巳為𢾗詩以哭之三嵗甜酸學語兒能來壁下看題詩當時戲發十年問添我無窮今日悲豫戊辰年題西軒壁令甲乙二子研墨捧硯孟丙兒戲于則始三歲豫問之曰汝十年復能詩乎應曰能二子顧豫而笑因記之壬申六月二十四日觀舊題時孟丙死巳一月矣豫舊有和韓詩云學語二歲兒笑味生甜酸蓋謂孟丙也蕭瑟楊雄宅一區不堪老境失童烏數莖鬚似經霜葉為汝鍾情一夜枯簾外飛飛燕哺雛道傍兒戲聚遊魚老人含淚坐書几不見吾兒巳月餘偃蹇衰翁四十餘梅花溪上結苑廬窗明几淨還如舊不見兒來覔𥿄書偶作吾兒真夢寐暫來人世誤婁羅雖然修短由天命致汝無辜我罪多七年嬌姹尉衰翁回首追思一夢中與汝夙緣如未斷重來當似顧非熊家童拾栗因念亡兒作數語以寫鍾情之悲去年覔栗嫌汝癡責汝曽賦淵明詩今年栗熟不汝見凄然白骨埋荒陂西風簌簌黃葉飛家僮拾栗門前歸汝兄汝妹爭來取汝父傷心淚如雨林知常惠白酒六尊仍示酒法作十韻謝之老去生涯付杯酒種秫辛勤三百畝東臯遺法嗟失傳蜜汁虀漿不通口邇來軟飽經月無豈有清歡對朋友百錢強就村媪醉終夜𬞞腸作雷吼先生秪把文字耕妙意能施杜康手憐我新愁餘萬斛那更澆腸無五斗分惠青州六從事祕法兼蒙傳肘後便同北海歌不空免似東坡歎烏有嗟豫偃蹇老更叨感激故人情意厚會須續遣白衣來籬畔黃花欲重九九日飲酒會趣堂者十九人老者與焉既醒念不可以無詩因用贈林知常韻示諸友我似楊雄貧嗜酒筆作耕犂𥿄為畝辛勤耕植三十年往往糟醨罕濡口今年九日甕盎空誰饌先生荷諸友衰顔迎醉生嫩紅饞腹隨餐失飢吼菊花不上老人頭酒盞聊傳此時手文字飲韓嘉數子禮法拘髠惟一斗衰翁興盡輒先歸不待杯盤狼籍後坐客髙歌驚四鄰吾鄉巳在無何有明朝黃花亦不惡俗眼無端自踈厚酒醒聊記坐中人有似平原凡十九陳元佐和詩贈以前韻無功懶仕由堪酒故向東皋事田畝自慚耕稼非老農歲入何曽給糊口通功易事愧無術謾闢書齋會鄉友出技慙如鼯鼠窮説法強為師子吼交遊漸覺不在眼老拙自知當縮手陳生慷慨真可人文似良金瞻如斗論交何止十年前耐久遙期十年後把酒殷勤問黃菊十年故舊寧多有士窮要使莭義敦不見韓公稱子厚北窗捉筆書惡詩醉中戲贈陳三九周仲翔和詩贈以前韻與子十年同把酒貧賤未能離隴畝今年依舊對黃花會意何由笑開口老來鍾愛有三兒邇歲從師得吾友祝螟方擬為螺飛舐犢俄驚作牛吼幼兒巳作一覺夢大匠徒施兩年手乙子沉痾賴營牧再生豈止由南斗嗟豫屯厄世所棄急難誰肯相先後論交最喜子善終報德深慚我無有猶憐甲乙二孺子莫景于渠意加厚煩君為我嚴誨之母惜鞭笞九十九陳獻可宋孝先萬孝傑夏伯虎和詩復用前韻凖擬重陽會詩酒手種菊花凡數畝佳莭相逢俱可人一一篇章堪適口掦庭醖籍更清新陳晉宋間人顔謝友舜卿詞源浩萬斛宋下筆驚人風雨吼季梁蕭灑詩如人飄然自是風騷手萬用之年少冨文墨夏日出珠璣不論斗誠叔思深希仲逸齊驅未識誰先後老杇那能敵年少胸中空洞嗟無有張我三軍得數子造物遺子非不厚明年秋戰豈無人雲夢定須吞八九九日把酒十九人和詩者數人而巳今巳後期不復追索許以來年九日還用前韻發一笑勸君須飲文字酒勸君耕耨心中畝飲非文字猶聚蚊心田不耕棘生口登髙佳節豈易得况此相逄皆勝友談傾坐上氷玉清興生筆下波濤吼我亦逢埸聊戲劇韻語殊非三眛手試投瓦礫巳成堆辱報驪珠未盈斗和之者寡豈陽春髙才料耻居王後嗟我窮愁無以遣酒債詩篇行處有與兹飲會類平原逃我詩盟幾髙厚如今並許隔年還直須日月逢重九宋孝先示讀自寬集復用前韻老去悲秋強自寬少陵九日詩也豫老境失幼子逢秋益悲凡所以強自寬者一寓於詩也録自中秋以前古律詩數十篇目曰自寬集淵明酷愛尊中酒季子貧無負郭畝我生薄與二子同俯仰人間亦緣口一室蕭然僅容膝毛頴陶泓自相友會心終日雌聲讀排悶有時粗氣吼感秋詩集名自寬雕琢更慙非妙手篇章不工如子固聲名敢望星之斗宋生輒作過情語十韻殷勤為跋後譽之韓栁誰敢當意古語竒吾豈有何如操矛時入室針我膏盲乃相厚床頭周易深且神母惜往來論六九再用前韻述懷并蕳諸友太白徉狂喜杯酒元龍豪氣恥求畝揮毫爛吐風月篇濟世髙談霸王口古人可作誰與歸白也吾師登可友萬言窗下杯水冷百尺樓頭鼻聲吼丈夫未遇聊爾耳肯向權門思炙手淨掃一室安吾貧晝閲詩書夜星斗休論生天與作佛靈運甘居丈人後吾儕慎分慕冨貴鳴鼓定須攻冉有但願相從文字樂交情合向窮中厚倚看前席坐間人平步登􅌡參二九鄭遜志胡叔成謝鵬劉敦信萬廓塢一唯和詩復用前韻前日中秋一壼酒交朋解散歸南畝把杯邀月止三人中有客來從谷口鄭首登詩壇出險語張我孤軍真畏友重陽佳句更竒絶西風猛向松關吼中庸伯始遙遙胄胡頴然作賦吟詩手謝客篇章似春草分得家傳才一斗謝句法天然自圓熟長慶詩豪今有後劉妙齡能作老成語必大竒兒亦希有萬塢郡太守司馬孫文與其人兩溫厚塢我與數子無薰蕕文相字從十常九九日會飲豫為唱首自和凡數萹皆因事敘情爾未作重九詩也今再和一篇每句用事而不見姓名末聮外餘皆略存對偶必有能和之者獨坐東籬嘆無酒種秫西疇謾盈畝菊花叢畔來白衣桑落杯中付饞口汝南風俗有故事龍山宴集多佳友靜聞彭澤三徑香遙想藍田雙澗吼順時習射馬嘶風隨俗登山囊繫手慈恩塔冷舊衣冠戲馬臺空古刀斗三嗅馨香感槩中細看茱茰酩酊後應制賦詩人孰在坐湖聯句今還有明朝見花心已别此日登髙意冝後日月並應莭物嘉獨恨今年無閠九九日寄昌齡弟九日嘉莭也豫坐無聊中不能自遣又念昌齡弟不在家為之悵然因誦唐王縉詩云遙知兄弟登髙處遍插茱茰少一人遂用其字為韻作十四絶并茱茰酒以寄之憶昔逢重九登臨不憚遙弟兄同把酒行樂興飄飄去歲重九日吾親窀穸期東籬自黃菊淚眼可曽知此日黃花酒深期酌弟兄誰知有離别西望不勝情我有茱茰沜遙同輞川底登髙少一人又是王家弟嘉莭苦難遇故山隨俗登未能如鄭谷一榻對髙僧白石登山客新詩句必豪寧容杜陵老獨步玉山髙我思鴈潭遊欲與鴈行去羽翼本天生誰令分兩處樂事苦無多良辰豈長見明年綴席時要使茱茰遍庭前有晚菊青蘂未堪插開日即重陽歸來酒同呷載酒觴黃菊登山臂紫茱重修汝南事災厄自今無老去悲秋甚興來聊自娛明年知健否子紬看茱茰窮途嗟我衰中歲傷兒夭兄弟止三人尊前豈冝少嗅菊謾勞三賜安得茰一聊分故園枝不負重陽日莭物豈不好吾家何太貧一尊聊爾寄重意愧先人萬叔永誕日在孟秋乃以重九開燕俟佳莭也豫不獲與稱觴之列作詩以賀種德尢勝竇十郎靈椿未老桂先芳一門此去無疑大五福他年未易量鳳穴生雛梧正碧龍山開宴菊𥘉黃吾鄉此會從來少恨不登堂舉夀觴九月十二夜獨步梅溪玩月人迹悄然秋色滿眼微風不動岩桂自香𥘉不勞思偶得四句蓋心境中靜時語也歸小成室對短燈檠索𥿄書之獨步溪頭夜𥘉寂掃空塵念心清涼月明眼底見秋色境靜鼻根聞桂香前日寓邑偶值乍寒陳劉二生濟我以衣童生濟我以衾既别為二詩以贈肌體生鱗鬚颯毛衰年怯冷欲兒號無人來綻韓公襖有友能施范叔𫀆入手乍驚儒袖濶披身尢喜義襟髙書生忍凍誰相顧共弊輕裘賴我曺右贈陳元佐劉士宗凛冽霜風夜薄人誰能暖我曲勾身寒欺三幅范衾陋睡美一宵薑𬒳新體粟不愁生旅舍鼻雷想見撼比鄰夢回却念君兄弟苦磈無眠痛慕親右贈童偉侃萬先之生兩男作洗兒歌賀之君不見徐卿二子生絶竒㷱羆入夢非同時徒煩孔子與釋氏兩回抱送麒麟兒又不見昔日梁嬴亦雙乳生止一男仍一女過期畢竟非其人未免終身亦妾圉欎蔥佳氣充門閭龍穴盛事從來無􅕴階良月吐三策蚌腹甲夜生雙珠相對抱持翁嫗喜眉目分明巧相似慈顔戲語綵衣郎汝子他年勝我子郎君拜舞笑答翁翁生六兒年豈同何如今日一巵酒手抱兩孫頭未童二雖慶誕相先後未省如何分長幼啇家尚質周尚文喚取何休細推究慶門蘭玉行滿庭伯仲叔季雙命名他時四乳類周士森森八桂同敷榮我忝通家同筆硯聞君得子歡無間殷勤為作洗兒歌覔取金錢三百萬黃府君挽詞不雜啇山綺與園生涯占得小桃源平生隱德知多少跨竈詵詵巳六孫紛然紾臂巳成風一㸑誰能再世同野史他年書逸事定須記此富家翁揚州别駕知名士肝膽崔嵬百錬剛誰謂公家有蘭玉解令髙選繼東床劉默識道泝州人令樂清有政聲後得揚卒以二女妻白石錢氏黃氏齒髮如公自古稀定應含笑九原歸春風白石岩前路忍見楊花作雪飛豫自乙丑冬如臨安赴輔逮今凡五往矣是行也痛慈親之不見傷幼兒之蚤死登途泫然因成是詩八歲五行役兹行最感傷思親啼血淚憶子斷剛腸遊逺有遺恨鍾情難遽忘離家兩夜夢長繞白岩旁𥘉擬過雁山既而取道烏石寄夢齡昌齡不度丹芳七七盤非緣杖屨厭間關要留來歲髙風便兄弟成行過此山過白溪朝離黃塘憩烏石莫宿青江過白溪嶺上回頭觀赤水山川五色望中迷過盤山宿旅邸一嶺迢迢十里賖行人半日踏煙霞青山遮莫盤千匝歸夢何曽不到家登皇華亭不是四方銜命士偶來亭上賦皇華憑欄回首三百里煙水茫茫思故家宿浮橋落日丹丘下西江十里西浮橋通古道逆旅傍清溪夜靜水聲細曉隂山色迷吾鄉在何處天逺白雲低與鄭時敏登樓把酒書二絶十里青山接郡城危樓四望眼添明海冥天濶鄉心切更聽飛飛鴻雁聲登樓能賦非王粲沽酒忘形有鄭虔千里相從文字飲不辭費盡杖頭錢途中見早梅山行𥘉逢建子月始見寒梅第一枝遙想吾廬亦如此誰能千里贈相思梅花發後思家切竹間水際出橫枝暗香踈影和新月自是離情禁不得觸物那堪此時節春前臘後定歸來要看溪上千株雪乙丑冬西遊觀南明石像作詩一絶至壬申十月四日復往觀焉和前韻并書于佛閣兒戲團沙欲象真誰將碩力歷三塵八年來往蕭峰客兩度來瞻百尺身西征紹興建元二十二良月壬午時丁未王家辭弟遊帝都出門滿眼思親淚鶺鴒送我過原隰朋友携尊宿蕭寺朝離黃塘惜分别莫宿青山嗟獨自𥘉心滿擬遊雁山行止非人輒乖異黃岩晉連越三宿故舊過從日沉醉鄭生伴我千里行近世人無此風義皇華亭上一回首陡覺眉頭起鄉思西江十里浮橋邉把酒登樓吟擁鼻山行𥘉逢建子月入眼梅花巳春意前觀三渡覺非舊下視兩灘真可畏渡頭仙人還笑我髭鬚如棘猶名利欲入天台觀石橋行來匆匆未能遂途中邂逅張老丞廷玉十五年前樂清尉自嗟吾非沈謝輩面目從來苦難記飛泉枕上夢成魔逹旦思家何曽睡細雨濛濛入關嶺旅邸重尋舊題字雨腳微收過天姥洗出峯巒疊蒼翠劉厄祠荒土猶赤溪山真是神仙地道旁石現小金仙傅舍荒涼誰廢置柘溪竹染兒女䀶石嶺松含棟梁器路入南明觀石佛樓閣岧嶤更深邃八年行役兩來遊岩上題詩記前事乘興剡溪尋故人久别相逢雜悲喜義風吹水送行舟越國江山滿瞻視十四歲娥孝且烈三百里湖明更媚千巖競秀􅊤爭流終日貪看趣遙寄西興渡口聲如雷銀浪崔嵬魄驚悸江神為我風色平天闕煌煌瞻象魏賢關訪舊話酸辛更食韲鹽舊滋味學官欲以職事留自愧非才力辭避觀臺雲物端可書宫線𥘉長日南至龍山僦舍觀大禮儀仗森然典文備人臣貴盛古今無秦公父子俱為使景靈告謝樂聲回鵷鷺花枝侈君賜西遊連日覩天顔和氣氤氲散憔悴歲云莫矣却歸來捉筆書為于役志梅溪先生文集卷第五
