front:
  text: 梅溪先生奏議卷第五
  hash: sha256:6e36bfb40ca55ea350dd8183e39c44d17c5a3b5113c173868ae6f59954d8e41f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_005-1a}
body:
  text: 代越帥王尚書待罪状臣聞爲臣莫重於守官治獄莫先於奉法苟用法之際㦯有所失則曠官之罪将何以逃臣伏蒙聖恩出守㑹稽未到任間有盗發某官王佐母冡亂其骨殖非特王氏一門痛徹心骨臣忝係守臣心實憤之在律發冡見尸者死兹盗之死冝矣有司議法以按問减二䓁又以其妄引平人加徒役流當時固疑其情重罪輕有司第知守法而臣失不敷奏既巳㫁罪佐弟公衮以冤憤不雪誓不共天手斬讎人自投于府臣與官吏咸義其舉已具始末奏聞且謂公衮奮不顧死以報母讎斬首申冤詣府請罪雖在法有所不許其孝莭實為可嘉盖欲朝廷敦奨其孝而特貸其罪也今来給舎奏議以臣本府官吏故縱失刑尚荷寛恩止以失出議罪臣與官吏相與守法者也今乃法失於有司而志行於臣子臣䓁之罪誠不可容伏乞聖慈重行朝典謹具奏聞伏候勑㫖又代上郊祀天晴劄子臣兹者恭惟皇帝陛下遵祖宗三載故事復行郊祀之禮並見天地配以祖考甚盛舉也然前期三日風雨晦㝠中外憂之及陛下御大慶殿齋宿群臣在庭雲隂忽𨳩天色澄霽用事之夕月星㓗明禮畢賀旋愛日掦輝六軍萬姓罔不歡喜郊焉而假廟焉而享昔聞其語今見其事臣官居侍從聀在近藩咫尺堯天目若親覩其為慶抃實倍於常情萬萬也然天下皆知陛下孝徳精誠能感應之速如此臣獨謂陛下孝弟通神明至誠格萬物固不止一日也然往歲郊祀載暘載隂未有天地廓氛日月呈祥如今日之事者兹盖由陛下比年以来捴㰖權綱福威自巳正塗開闢朝廷清明故徳之動天不俟終日天人相與之際其昭昭然如此臣伏望陛下兢兢業業益加勵精新而又新終始如一則天地交泰三辰著明長如郊祀之日誠宗廟之福天下之幸也臣不勝至碩又代上劄子臣比者伏蒙聖恩出守于越陛辭之日親奉王音以東州災傷令臣檢放賑恤者臣仰体陛下惻怛之誠不敢少怠入境之𥘉延見吏民訪問疾苦視事之日首遣僚属分詣諸邑與縣令躬行阡陌同共檢視咸得其實遂以所傷䡖重等級减放其間有保甲𥘉以熟申及揫歛之際實無所有者與檢視有不盡之䖏有致詞訴者臣續巳覆實復與减放既而又得聖㫖蠲免租税以内帑代償百姓歡呼鼓舞莫不以手加額咸謂陛下仁恩徳澤亘古所無雖天地父母有所不能及臣又上躰聖意将本府所有逋負積年公租私債貧不能償者榜諭人户照應指揮令至来年蠶麦成熟然後理還用是細民稍安流離復業庻㡬少副陛下畏灾恤民之意無任惶惧取進止又代上劄子臣誤蒙聖恩出典藩府適承去秋灾傷之後上貽陛下東顧之憂臣自到官夙夜惶惧每以催科為後撫字為先比縁米價湧騰越人艱食除得㫖賑濟及乞糶常平義倉外臣又令八縣官吏躬行勸諭凡有榖米之家不問官户編民但以䓁第髙下積蓄多寡並令發廩减價與官米並糶遂獲廣濟免致失所又自新春以米彌月不雨播種失時民心嗷嗷朝不遑夕臣退思厥咎實由臣荒政所致因思古人致雨之術每求之於人事間深慮刑獄有冤致傷和氣遂於今月𥘉六日親至囹圄踈决滯囚仍分遣官僚徧决縣獄又集僧道軰就府治焚脩凢山川廟貌靡不祈禱臣亦晝夜齋𬞞不敢少懈神明鍳臨果若有感忽於𥘉八日得雨連夕霶霈農事復興民情大恱夫曰雨曰暘皆陛下聖徳所致其膏澤所及固不止一方而臣喜雨之心獨倍常情者盖縁臣所領州連年水旱民不聊生儻更数日不雨則事有大可憂者今一雨三日有年可期臣與闔境吏民不勝歡欣鼓舞感戴聖恩之至又劄子臣去秋陛辭之日親奉玉音諭臣以永祐陵昭慈宫崇奉事件臣仰見聖心䔍孝著於羹牆雖堯舜之徳何以加此臣至越之𥘉首朝陵廟瞻望松柏不勝悲涕凢薦祭之物崇奉之具脩造之費臣仰躰聖懐罔不盡力臣輒有區區愚忠敢不冐死以聞切見􅑼宫脩造每年一小脩三年一大脩率以爲常此固陛下奉先罔極之心臣子所冝奉行而不懈也然臣切謂陵寝所在神靈是依神道貴幽理冝安靜若頻歲倄造不無震驚故古不修墓聖人非薄於其親意謂寜親莫如寕神是乃孝之大者今􅑼宫棟宇巳固器用巳備松柏巳茂陛下崇奉之心亦可謂至矣臣欲乞自今以後不必以三年大脩每年小脩為拘但令本府常預備瓦木工匠之類以俟不時之湏凢遇棟宇或損則更之器用㦯舊則新之松柏㦯枯則𥙷之如是則工役不繁而丹䑾常新歲月寝乆而陵廟愈安以昭先帝儉徳之恭以稱陛下寜神之孝不勝幸甚又代上五劄臣聞唐社牧論兵謂上䇿莫如自治夫内脩政事盖自治之䇿也任賢使能又自治之要者昔漢以汲黯寝淮南之謀晉以謝安破符堅之衆唐以陸贄濟奉天之難我國家寳元慶暦西夏叛命仁宗皇帝以經略安撫之任付之范仲淹韓琦軍中有一韓一范西賊破膽之謡兵不大用而元昊巳服今我與虜强弱不敵惟當以人才勝之苟得伏莭死義如汲黯軰則謀當自寝風流雅望如謝安軰則敵當自退忠謀讜論如陸贄之徒則難當自觧兼資文武宏材偉畧如韓范二臣則虜當自服所謂一士止百萬之師一賢制千里之難者也臣又聞范仲淹𥘉以言事得罪仁宗尤爲宰相吕夷簡所悪斥逐于外及西方用事仁宗思用仲淹夷簡亦力薦之仲淹果䏻成功夷簡不失爲賢相今邉境未寜正是側席求賢之日臣碩陛下以仁宗之心爲心大臣以吕夷簡之事爲法相與任用天下之賢才以爲排難觧紛之計仍詔侍從䑓諌監司郡守各舉人才勿遺踈賤朝奏暮召如恐不及如是則異人軰出可以供陛下之任矣夫猛虎在山藜藿不采國有人焉難當自消自治之術莫大於此臣恭惟陛下屈巳便民和戎福國真帝王盛徳之事然虜情多詐殊不可測愈和愈驕情態巳露夫未至而言常以為虗及其巳至則又不及臣切謂俻敵之術莫若通下情開言路昔建炎維揚之難起扵以下壅蔽虜壓境而不知倉卒渡江禍㡬不救今外議匈匈謂虜人有窺伺之心深恐中外壅蔽不以實聞維揚覆轍不可不戒欲乞陛下廣視听通群情俾㳂邉帥守中外臣子凢有所聞並以實奏勿以張皇為罪切直為諱如是則虜之動靜可以備知事之未至可以預備社稷之福天下之幸也臣聞財用不足最為今日之患議者㱕咎生財無術思得𬋩蕭劉晏之徒用之臣以謂財有限而用無窮生財不如莭財省用斯䏻足用昔漢文帝時有玉帛和親之費然而貫杇粟陳海内冨庻者由文帝以敦朴先之宫室苑囿車騎服御無所増益故也我仁宗皇帝慶暦間西方用兵北虜増幣天下亦多情事矣而歛不及民用度不乏者亦由仁宗以儉徳化下故扵多事之間内不失治民到于今稱之朝廷自和議以来權臣務為苟安之計凢百用度悉如太平全盛之日中外化之競為侈靡府庫匱乏實此之由往歲陛下焚金翠近又以損名齋親為之記帥下以躬盖無愧於文帝仁宗矣然財用猶不足臣妄意切謂奢侈之風㦯未痛革無益之作無名之費或未盡除至若内降之恩未䏻盡絶名器之假未䏻無濫宫禁近習使令之𢾗不無過多軍容教坊伶倫俳優之徒不䏻無非時之横賜凢此之類可省者省之可罷者罷之㝡節財之要術當今之急務臣又聞唐徳宗納裴延齡之奸謀有天子私蔵之財號瓊林大盈二庫陸贄諌之甚力謂冝散其小儲而成其大儲損其小寳而成其大寳臣碩陛下以文帝仁宗之險徳為法以徳宗之私心為戒凢天下財賦之入悉㱕之戸部仍擇知取予之臣以司出納之柄如是則将見粟腐大倉錢流地上上下皆足公私並濟矣臣聞天下安注意相天下危注意将又聞四夷不恭抜卒為将今夷狄外侮正是注意将帥㧞擢行伍之時臣切觀朝廷宿将固亦有人顧所用何如耳賢而有重望者可用為大帥以捴天下之兵權如唐用李郭之徒賴之以為安危䡖重不可止令為一藩帥以泯沒其才其次驍勇善戦者可使當一面如漢黥彭之類亦可責其捍禦之功不可置之閒䖏至扵駕馭之術尤不可驕之爵賞所加必俟有功而後可若任用之𥘉先為之極它日立功其将何爵以加昔藝祖皇帝許曺彬莭度使而不遽與其後彬再立大功方加莭鉞卒保冨貴為國勲臣臣近蒙宰執傳聖㫖除某人為淛東捴𬋩令臣待之加厚者如某人亦當今之名将可備急難之用所謂冝當一面者也陛下固已得之矣其它如某人比者尚或有之咸冝㧞擢以為閫外之寄至扵駕馭之術更乞如臣所陳如漢髙之馭黥彭量才而任使藝祖之待曺彬冨貴以俟異日庻可以望其立大功亦所以保全之也臣聞居家者必謹藩籬置皂隷以為冦盗之防建國者必保山海之險選岳牧之臣以禦外敵慿陵之患今朝廷以江淮為蔽障以守帥為長城江淮守臣比它䖏為尤重冝扵文武臣中擇其才勇智畧可為爪牙者付之陛下親加敦遣勉以忠義資之以粮假之以兵俾其守死勿去則我有所恃而不恐敵有所惮而不敢窺苟非其人則必為敵所輕誤事非少除授之際尤不可不謹又川蜀之地去朝廷最逺尤為虜所窺伺緩急之際勢必不能相應在兵法有攻東南僃西北者虜情難測深恐虗聲在此而屬意在彼臣以為冝増重四川帥臣之權俾其便冝從事遇臨機應敵之際不必請而後行仍選大将屯重兵于外以為急難之援如是則陛下可以寛西顧之憂矣􅌳劄臣違逺清光殆将一歲待罪近甸竊祿無𥙷至若乃心惓惓王室顧雖食息不敢少忘兹者恭聞敦遣大臣出疆道路風傳有如上貽聖慮者陛下焦勞宵旰僃見詔音宣誦之餘軍民感泣况臣忝居献納論思之聀其可以中外為拘喑黙不言乎輙以管見條陳五事一曰求人才二曰通下情三曰省浮費四曰擇将帥五曰選江淮之守増蜀帥之權狂妄猥陋冐瀆天聦政猶爝火不足禆日月之光然愚忠所激有不能自巳者伏望陛下采愚者一得之慮赦微臣萬死之罪略賜施行不勝幸甚代王尚書辟陸宰状臣叨膺聖寄待罪近甸其所領州號為浙東帥府属邑有八山隂負郭而最大近知縣許某到官方及旬浹而遽死其後任某亦巳物故縁山隂係是緊切不可缺官去䖏臣竊見前㑹稽知縣左奉議郎陸之望為治寛平持巳㢘㓗長於撫字蔚有政聲㑹稽士民僧道䓁前後屡經本府及監司舉留状牘其存某人今方罷官適㑹山隂缺宰臣遂令暫攝聀事邑人咸喜臣今欲依條令辟舉陸之望充山隂知縣以慰一邑士庻之心臣如妄舉甘伏朝典伏乞聖慈特賜俞允又代上劄子臣恭聞太行皇太后靈駕發引有日陛下遵奉遺誥凢營奉之費悉出慈寕不以一毫病民以彰皇太后仁儉之徳四方聞之罔不欽歎臣待罪近甸祗奉寝園雖欲竭犬馬之奉効蟻蝼之誠而不可得至若邦境所管河道橋梁宿食頓次及一行事務臣已分遣官属一一幹治臣亦身督其役無敢怠惰者約至十一月𥘉旬悉皆辦集将来梓宫渡江决不誤事庻㡬少效臣子報稱之聀上寛陛下哀戚憂念之情臣無任又臣竊聞往歲徽宗皇帝梓宮御舟進發之日凢津梁堰閘並不拆毀今来伏准橋道頓遞使報大行皇太后梓宫御舟八尺五寸比舊加太其所過之䖏城門橋堰勢不免毀臣伏聞行朝臣庻稱頌聖徳謂日者奏請􅎚宫發引利行甲方然毀民居稍多陛下惻然曰兹豈未利耶乃改行乙方仰見聖心仁孝愛民如此臣庻感激至扵流涕臣今欲乞依徃歲徽宗皇帝梓宫御舟丈尺之数津梁堰閘免致拆毀庻獲仰承陛下仁孝之徳遵奉大行皇太后慈儉之訓不勝幸甚如蒙俞允伏乞睿㫖速賜施行取進止梅溪先生奏議卷第五梅溪先生後集卷第五詩已夘臘月七日觧官離越十九日至家明年正月二日𬒳命除秘書省校書郎卜以八日行書二十字梅花照歸眼春色戒行裝君命不俟駕安敢懷故鄉次韵馮員仲正字湖上有作甌蜀異鄉客西湖同日看浪花随去棹風絮逐帰鞍水浸吴天濶山涵佛界寛春光無限好共媿縳㣲官次韵趙仲永悠然閣越絶山川深更深不湏登覽自来臨胷中丘􅊤忽相遇眼底塵埃無復侵得趣早同彭澤徑把杯時赴廣文襟知君指日帰天禄莫負平生閣上心次韵皇子建王題明逺樓百尺崇珠邸恩隆地更親壯侔巢鳯閣危切飲牛津眼净全無礙心明自不塵登高宜暇日爲善及良辰炳煥瞻宸畫沉潜味道真楼中藏所賜御書書中端得趣筆下已如神語帶江山好名随棟宇新應憐天下士蝸舎不容身劉韶羙辞試館職學問称博洽向後無此劉太一然青藜遟君天禄游給札試玉堂故事乆不修遴選先實才聞之輙掉頭我廼行祕書肯随鈆槧流三日掃虚室佇想心悠悠張羅君不顧竊食吾懷羞西風吹兼葭倚玉嗟無由再用前韵贈韶羙平生少相識摸索䏻記劉東南小蓬莱二年同官㳺濯纓鑑湖水佩蘭以㓗修自倚􅺛髒門不撼冨貴頭西泛吴江瀾委身謾乗流回首望故鄉天高路遐悠慷慨君自喜伊優吾亦羞乘桴倘有志願言呼仲由次韵韶羙送刘夷叔二詩時夷叔巳死蜀山高岩岩英物世非少青藜夘金子高歩絶雲抄思苦鳴輒悲詞深誼难暁知音有古人𥿄上自傾倒我昔賢関游相逄粲衣表東帰拜言贈篋笥至今好重来已鬼録魂魄蜀天渺蓬山訪高躅空舎不停繞㝎㝷窮孟郊相酬類双鳥莫作人間来世路轉难拗右悼夷叔西南有佳士岷峨秀匈中標高語更妙寫出岷峨容青天道路难㝠㝠慕蜚鴻翩然下人間海濶洪濤舂㝷幽入禹穴杖屦誰相從萬卷蟠腹笥一榻眠禅叢時来訪予語自媿賢非戎世態冷處簿交情淡中濃去歲鑑湖别分甘老岩松行蔵果誰使離合情無窮田園有深約耘耔當自充異時甌蜀間林下見两翁右贈韶羙皇子建王生日十月二十二日黄花過後梅花前雲披愛日烘青天月良隂剥陽欲旋蓂餘八莢時半千欝葱佳氣燭星躔帝子来從天日邉淑質岐嶷貌端然少親師傳學問專六籍奥旨能心傳百家諸司咸窮研餘事翰墨工詩篇平居為善心拳拳君親忠孝尤两全放逺声色塵管絃明窓自結賢聖縁吾皇知子能擇賢断自宸衷愛不牽九重一日丹詔宣歡声喜氣溢幅貟願王自愛思無愆仰佩天眷奉周旋保持王体如臨淵日親端士逺侫便𥿄上興衰鍳古先誕宸未邸錫玳筵鼎来福禄方綿綿不湏丹竈求神仙不用具葉慕真詮誠存性盡萬善圓身與囯夀俱千年寄新暦日與夣齡昌齡弟老去驚看暦日新宦情尢憶故園春吾鄉親旧如相問為道明年已五旬送查元章二首聖主徳寛大小臣言激昂虜情殊未側准甸可無防直氣思開日寒威誤隕霜芳姿等蘭蕙摧折更芬香肝腦不自愛精忠為上殚危言犯顔昜直道立身难去囯名逾重還家迹始安相将吾亦去林下掛衣冠祕書省後園脩竹可愛胡正字憲有詩次韵不俗更嫌俗風枝時拂墻青青映藜燭細細雜芸香勁節老方見清隂寒欲蔵䔥悚似吾軰味向静中長魏邦式通判挽詞挺挺魏公後重聞别乘賢有時同正觀無地上凌烟雨足嘉禾穂風清婺女蓮吟魂招不返遺恨越江邉耆舊嗟零落公年又不長雙旌空入夣半刺横罹殃子舎三珠秀吾郷一鑑亡平生可書字椽筆有星郎張郎中大猷作行狀次韵程㤗之正宇雪中五絶幻玉蜚花濕帝城蓬萊燈火冷中清人間草木舊相識傾刻還驚靣目生栖烏驚起天無月化鶴帰来頂不朱錯認湖山作西子眩人疑是玉飢膚點綴工夫巧更竒崑崙玉果半蔵㽔嗅梅咀雪欲腸断况讀高生人日詩人日雪預知禾麥定登埸六出搀先瑞衆芳更喜江梅自蕭洒不縁摧壓减清香卧聞征雁作回音遥想吾廬玉滿林乘興扁舟㝎帰去草堂深處伴猿吟㤗之用歐蘇頴中故事再作五絶勉強継韵君詩雅勝五言城白雪篇章分外淸不許同僚持寸鉄筆尖戦退老書生寒侵睡思那成夣酒著㐮顔誤抺朱待詔先生應怯冷餐氊使者可稱膚穀精蜚處人為日氷鑑頒時律應㽔照耀元宵更盈尺不容燈火占新詩煑海神功不計埸逼真冷熖奪春芳東君深恐成堆積急遣雷公喚阿香夜静㣲聞折竹音驚禽何處更投林寒生習氣無繇掃遥對湖山忍凍吟趙仲永和東坡汝隂雪詩并舉趙徳麟賑濟故事見示遂次其韵不作秦人視越人深憐里舎甑生塵恨無廣厦容寒士安得洪爐煖曲身屮木照人俱有艶珠璣滿地不憂貧慿誰扶取浮雲破莫待功成始放春介甫詩功成終欲放春回次韵洪景盧編修省中紅梅不為怕寒貪睡遟東君妙意端可知雪英零落䀼界寂放此孤瘦紅南枝蓬萊更向逸逺地園在著廷後屮木寕有夭饒姿氷容戯作桃杏色醉臉雅與神仙宜江兄蠟友已前軰黄生後出非同時丹心獨與勁節侣踈影共浸清漣漪騷人相顧最不惡何用車馬紛虽蚩典衣莫昔共携酒對華一展思鄉眉李徳逺寺簿敢言勇退今之古人也東嘉王某賦詩以高其行吴山蒼蒼烟靄横皇都日日春風生利塗徢徑走輪轂古道荆棘惟君行吴江洪濤拍天泑萬楫千㠶日相踵六鰲入釣猶不帰急流知退惟君勇斜川勝事今臨川錦抱風月追謪仙芋魁豆飯吾亦有脫屣有媿君翩然我軰情鍾惜離索爲囯惜賢情更惡江頭送别春尚寒回首㝠鴻已寥廓省中黄梅盛開同舎命予賦詩戯成四韵照眼非梅亦非菊千葉繁英刻琮玉色含天苑鵝兒黄影蘸瀛波鴨頭緑日烘喜氣光燭鬚雨洗道裝鮮映肉此梅開後更無梅莫惜攀條飲醽醁送王嘉叟編修上書薦張和公請外得洪倅上書請劒人未復胡邦行昔亦以宻院編修上書開口薦賢君又行堂上伊優笑絶倒紛紛去囯皆狂生搢紳敢言似慶暦風俗漸羙如東京手揩老眼看除目一遷一去知誰榮南昌别駕亦不惡三王高閣㝷宗盟吴江漫漫楚天闊羡君一葉春舟䡖送陳阜卿出守吴興自察院迁郎未㡬得外䑓閣輟名士符竹分帝憂搢紳有清議欲為朝端留才名四十年骯髒成白頭方開公道口遽中讒人鈎觸邪孤壮志歛恵施一州命義二大戒能言亦能由阜卿甞作命義天下之大戒論斈者至今傳誦去矣霅水清孰障天下流願言如季路乘桴共公浮次韵程㤗之酴醾青春果作堂堂去啼鳥喚春春不住明珠萬顆玉為錢欲買風光嗟巳莫蓬山地冷花木稀秪有寒梅已先雨誰遣虬枝上高架稍覺雲隂覆行路雨餘景物猶未佳葉底精神不多露鼻觀疑聞班馬香姿比何郎更風度平生惜春如惜别老眼待花如待哺幽亭相對止三人草草杯盤為花具時同舎考試惟㤗之貟仲某任館送胡正字憲分韵得来字胡上書言事得祠還鄉同賦者七人以先生早賦帰去来為韵武夷之山高崔嵬武夷先生賢矣㢤山中高卧似孤竹顔蒼節勁清無埃吾君飬老過西伯不逺千里帰乎来胷中萬卷可醫囯首薦廊庙真人才胡上書薦張和公人言朝奏暮必逐天顔獨為忠言開崇文三館不浪闢端為天下收竒瓌平時論議即涵飬富貴豈以三緘媒西京老儒作符命蒼黄投閣良可哀何如皇朝有甌范開口不惮干霆雷文忠文正二公皆以館聀言事先生學力到前軰一時盛事光麟䑓宸衷宵旰急忠讜佇觀前席延鄒枚先生掉頭竟不住扁舟自載高風囬道山游從尽英雋顧我晚進寕容倍梅花滿枝桞弄色賦詩送别同銜杯吾庐三徑亦荒草松菊恠我何遟徊四月四日祀赤帝于慈雲嶺净名寺祀畢游易安齋至江次送黄子升通判還鄉祀罷燈花喜山游暁色新江頭送帰客我亦是行人送太學生徐易帰天台天台古仙山藥物固非一采之言可延厥品惟參术兹誠籠中物不可亡一日良醫苟能用可治天下疾章季子教授恵顧渚茶報以宣城筆戯成三絶春回顧渚雪芽生香味尤宜祕水亭搜我枯腸欠書卷飲君清徳頼詩情白齒新芽不出山青嚢誰遣到人間午窓驚覺還鄉夣紗帽籠頭捧兔班季子以青嚢紗盛二两云乃真顧渚零陵佩不出山絶品也霅水書来寄葉嘉中山人去代瓊華定将綘帳鑄人手散出毫端千種花趙仲永和胡正字竹詩見贈用韵以酬憶昔游蓮幕獲登君子墻蓬萊醉秋月龍鳯啜天香䑓閣子将集山林予欲蔵新詩似脩竹風味更高長張閣學挽詞宗元南渡巳三紀衣冠今㡬存傷心失遺老回首慨中原去囯權臣力全軀聖主恩致君尭舜術妙意託空言公甞觧二典公在南昌日含沙禍㝡竒語蜚無限謗獄具不過詩天道何甞逺人心自太危盖棺公論定盛徳合豐碑寳月師刻予舊題以寄因書二絶資深堂上偶留題多謝髙僧不掃泥更與慇懃琢山骨惡詩傳到浙江西冊府經年已倦游夣魂随雁到峯頭山中老宿如相問為道帰期不待秋五月十八日去囯明日宿富陽庙山懷舘中同舎去囯懷明主離群念舊游翻令到家夣終夜繞瀛洲寄馮員仲相見惟言去吾今去已成著鞭先㡬日不及送君行釣䑓漢高嫚罵四皓隠周武干戈伯夷餓南陽故人幸無失先生胡為亦高卧清風却在夷皓上千古真能激貪儒客星夜向釣灘明想像年時臨帝座嚴州龍門院滿散天申莭棹弭龍門下誠馳天闕邉平生甽畆意祝聖更惓倦宿永康縣黄塘店觀稼有感路入黄塘喜更疑地名雖是里閭非予家之東十里地名亦日黄塘眼中禾稼已如許薄有田園宜早帰永康有嶺名花錦𬒳要将山水替埃塵六月還家不惮辛炎暑厭聞花錦𬒳清凉宜近竹夫人舟中偶題緑水客星瀬薫風婺女谿来㝷處士隠帰向斗中棲游石門洞雁山飽見两龍湫洗眼新觀石洞流欲向故鄉㝷白鹿先来仙隠訪青牛青牛道士隠于石門破荒喜誦劉郎句躋險思從謝容游天下林泉看未足分将身世早休休林明仲自梅嶼拏舟招丁道濟道揆張思豫及予同飲索詩坐間成六絶七月朔日君家梅屿我梅溪一笑相逢郡治西明仲别館在城西予假之踰月要使衆山同對酒芰荷香裏具親携右贈明仲塘餘春草遥思謝楼靣蒼陂重憶劉時泊舟思逺楼下楊播詩云吴㒷刘孝叔楼此靣蒼陂人昔共游今孰在蘆花飛雪上吾頭予昔游洋宫与同舎泛舟有共乘小艇穿芦花句今二記矣訪舊多在鬼録而予已老慨然傷懷右懷舊游五人二百六十五尊酒相逢非偶然把手共為他日約莫縁富貴負林泉時仲明五十六道濟五十四道揆五十三思豫五十二予五十右贈諸公遥岑出碧明雙目境入韓詩巳飽參湖上軒窓對遥碧新詩寫出舊城南地環碧玉軒窓瑩舟入紅雲笑語香下筆慚無少陵句老懷徒愛宋公荘宋侍郎别業庁思逺楼之南有軒名遥碧右題宋荘西岑風物冠吾鄉十里烟波興味長不用扁舟鑑湖去餘生甘向此徜徉右題西岑梅溪先生後集卷第五梅溪先生文集卷第五詩壬申中秋交朋觧散不期而㑹者鄭生遜志夏生伯虎因小飲翫月二子各以詩贈依韻酬之鄭生襟宇絶纎埃夏子心希好學囬誰遣吾人来破願可䏻良夜不銜杯從来月罕中秋見那更尊無俗子陪遥指桂枝因賀客文星近歲属温台術士言文星近歲正臨温台鄭台人夏温人猶勝太白號三人又免韓公誚聚蚊薄有壼觴非獨酌共将文字作淸醺天髙雲散懸金餅風峭溪凉皺縠文却恨鍾情未能遣愁腸終夜轉車輪書小成室万言柸水北窓裏慷慨悲歌五夜長骨肉未知蘇季子郷閭誰敬馬賔王爲人心盡同毛頴與世交踈類孔方晦迹溪山可無恨蕭然一室任凄凉哭孟丙㓜児孟丙年四歲從謝任之發蒙六歲從周誠叔䏻誦蒙求孝經論及五言詩書院㳺從近百人類䏻道其姓第名字或能優劣品藻之扵所親之前予毎說書則與二兄侍立其側㑹茶與舉故事在群兒中粗爲了了者年才七歲而死紹興壬申實五月二十四日也我軰鍾情痛不自巳爲𢾗詩以哭之三嵗甜酸學語児䏻来壁下看題詩當時戯發十年問添我無窮今日悲予戊辰年題西軒壁令甲乙二子研墨捧硯孟丙児戯于則始三歲予問之曰汝十年復䏻詩乎應曰能二子顧予而笑因記之壬申六月二十四日觀舊題時孟丙死巳一月矣予舊有和韓詩云學語二歲児笑味生甜酸盖謂孟丙也蕭瑟楊䧺宅一區不堪老境失童烏数莖鬚似經霜葉為汝鍾情一夜枯簾外飛飛燕哺雛道傍児戯聚㳺魚老人含淚坐書几不見吾児巳月餘偃蹇衰翁四十餘梅花溪上結苑廬窓明几净還如舊不見児来覔𥿄書偶作吾児真夣寐暫来人世誤婁羅雖然修短由天命致汝無辜我罪多七年嬌姹尉衰翁囬首追思一夣中與汝夙縁如未断重来當似顧非熊家童拾栗因念亡兒作数語以冩鍾情之悲去年覔栗嫌汝痴責汝曽賦淵明詩今年栗熟不汝見凄然白骨埋荒陂西風簌簌黄葉飛家僮拾栗門前歸汝兄汝妹争来取汝父傷心淚如雨林知常恵白酒六尊仍示酒法作十韻謝之老去生涯付盃酒種秫辛勤三百畆東臯遺法嗟失傳蜜汁虀漿不通口邇来軟飽經月無豈有清歡對朋友百錢強就村媪醉終夜𬞞膓作雷吼先生秪把文字耕妙意能施杜康手憐我新愁餘萬斛那更澆腸無五斗分恵青州六從事祕法兼䝉傳肘後便同北海歌不空免似東坡歎烏有嗟予偃蹇老更饕感激故人情意厚㑹湏續遣白衣来籬畔黄花欲重九九日飲酒㑹趣堂者十九人老者與焉既醒念不可以無詩因用贈林知常韻示諸友我似楊䧺貧嗜酒筆作耕犂𥿄為畆辛勤耕植三十年徃徃糟醨罕濡口今年九日甕盎空誰饌先生荷諸友衰顔迎醉生嫰紅饞腹随飡失飢吼菊花不上老人頭酒盞聊傳此時手文字飲韓嘉数子禮法拘髠惟一斗衰翁興盡輒先歸不待盃盤狼籍後坐客髙歌驚四隣吾郷巳在無何有明朝黄花亦不悪俗眼無端自踈厚酒醒聊記坐中人有似平原凢十九陳元佐和詩贈以前韻無功懶仕由堪酒故向東皐事田畆自慚耕稼非老農歲入何曽給糊口通功易事媿無術謾闢書齋㑹郷友出技慙如鼯䑕窮說法強為師子吼交㳺漸覺不在眼老拙自知當縮手陳生慷慨真可人文似良金瞻如斗論交何止十年前耐乆遥期十年後把酒殷勤問黄菊十年故舊寕多有士窮要使莭義敦不見韓公稱子厚北窓捉筆書悪詩醉中戯贈陳三九周仲翔和詩贈以前韻與子十年同把酒貧賤未䏻離隴畆今年依舊對黄花㑹意何由咲開口老来鍾愛有三兒邇歲從師得吾友祝螟方擬為蠃飛䑛犢俄驚作牛吼㓜兒巳作一覺夣大匠徒施两年手乙子沉痾頼營牧再生豈止由南斗嗟予屯厄世所棄急難誰肯相先後論交最喜子善終報徳深慚我無有猶憐甲乙二孺子莫景扵渠意加厚煩君為我嚴誨之母惜鞭笞九十九陳獻可宋孝先萬孝傑夏伯虎和詩復用前韻凖擬重陽㑹詩酒手種菊花凢数畆佳莭相逢俱可人一一篇章堪適口掦庭醖籍更清新陳晋宋間人顔謝友舜卿詞源浩萬斛宋下筆驚人風雨吼季梁蕭洒詩如人飄然自是風騷手萬用之年少冨文墨夏日出珠璣不論斗誠叔思深希仲逸齊驅未識誰先後老杇那䏻敵年少胸中空洞嗟無有張我三軍得数子造物遺子非不厚明年秋戦豈無人雲夣定湏吞八九九日把酒十九人和詩者数人而巳今巳後期不復追索許以来年九日還用前韻發一咲勸君湏飲文字酒勸君耕耨心中畆飲非文字猶聚蚊心田不耕棘生口登髙佳節豈易得况此相逄皆勝友談傾坐上氷玉清興生筆下波濤吼我亦逢埸聊戯劇韻語殊非三眛手試投瓦礫巳成堆辱報驪珠未盈斗和之者寡豈陽春髙才料耻居王後嗟我窮愁無以遣酒債詩篇行䖏有與兹飲㑹類平原逃我詩盟㡬髙厚如今並許隔年還直湏日月逢重九宋孝先示讀自寛集復用前韻老去悲秋強自寛少陵九日詩也予老境失㓜子逢秋益悲凡所以強自寛者一寓於詩也録自中秋以前古律詩数十篇目曰自寛集淵明酷愛尊中酒季子貧無負郭畆我生薄與二子同俯仰人間亦縁口一室蕭然僅容膝毛頴陶泓自相友㑹心終日雌聲讀排悶有時麄氣吼感秋詩集名自寛雕琢更慙非妙手篇章不工如子固聲名敢望星之斗宋生輙作過情語十韻殷勤爲跋後譽之韓栁誰敢當意古語竒吾豈有何如操矛時入室鍼我膏盲乃相厚床頭周易深且神母惜徃来論六九再用前韻述懐并蕳諸友太白徉狂喜盃酒元龍豪氣恥求畆揮毫爛吐風月篇濟世髙談覇王口古人可作誰與歸白也吾師登可友萬言窓下盃水冷百尺楼頭鼻聲吼丈夫未遇聊爾耳肯向權門思炙手凈掃一室安吾貧晝閱詩書夜星斗休論生天與作佛靈運甘居丈人後吾儕慎分慕冨貴鳴鼓定湏攻冉有但願相從文字樂交情合向窮中厚倚看前席坐間人平歩登􅌡叅二九鄭遜志胡叔成謝鵬劉敦信萬廓鄔一唯和詩復用前韻前日中秋一壼酒交朋觧散歸南畆把盃邀月止三人中有客来從谷口鄭首登詩壇出險語張我孤軍真畏友重陽佳句更竒絶西風猛向松関吼中庸伯始遥遥胄胡頴然作賦吟詩手謝客篇章似春草分得家傳才一斗謝句法天然自圓熟長慶詩豪今有後劉妙齡䏻作老成語必大竒兒亦希有萬鄔郡太守司馬孫文與其人两温厚鄔我與数子無薰蕕文相字從十常九九日㑹飲予為唱首自和凢数萹皆因事叙情爾未作重九詩也今再和一篇毎句用事而不見姓名末聮外餘皆略存對偶必有能和之者獨坐東籬嘆無酒種秫西疇謾盈畆菊花叢畔来白衣桑落杯中付饞口汝南風俗有故事龍山宴集多佳友静聞彭澤三徑香遥想藍田雙澗吼順時習射馬嘶風随俗登山囊繋手慈恩塔冷舊衣冠戯馬䑓空古刀斗三嗅馨香感槩中細看茱茰酩酊後應制賦詩人孰在坐湖聯句今還有明朝見花心已别此日登髙意冝後日月並應莭物嘉獨恨今年無閠九九日寄昌齡弟九日嘉莭也予坐無聊中不䏻自遣又念昌齡弟不在家為之悵然因誦唐王縉詩云遥知兄弟登髙䖏徧挿茱茰少一人遂用其字為韻作十四絶并茱茰酒以寄之憶昔逢重九登臨不惮遥弟兄同把酒行樂興飄飄去歲重九日吾親窀穸期東籬自黄菊淚眼可曽知此日黄花酒深期酌弟兄誰知有離别西望不勝情我有茱茰沜遥同輞川底登髙少一人又是王家弟嘉莭苦難遇故山随俗登未䏻如鄭谷一榻對髙僧白石登山客新詩句必豪寕容杜陵老獨歩玉山髙我思鴈潭㳺欲與鴈行去羽翼本天生誰令分两䖏樂事苦無多良辰豈長見明年綴席時要使茱茰徧庭前有晚菊青蘂未堪挿開日即重陽歸来酒同呷載酒觴黄菊登山臂紫茱重修汝南事災厄自今無老去悲秋甚興来聊自娱明年知徤否子紬看茱茰窮途嗟我衰中歲傷児夭兄弟止三人尊前豈冝少嗅菊謾勞三賜安得茰一聊分故園枝不負重陽日莭物豈不好吾家何太貧一尊聊爾寄重意媿先人萬叔永誕日在孟秋乃以重九開燕俟佳莭也予不獲與稱觴之列作詩以賀種徳尢勝竇十郎靈椿未老桂先芳一門此去無疑大五福他年未易量鳳穴生雛梧正碧龍山開宴菊𥘉黄吾郷此㑹從来少恨不登堂舉夀觴九月十二夜獨歩梅溪翫月人迹悄然秋色滿眼㣲風不動岩桂自香𥘉不勞思偶得四句盖心境中静時語也㱕小成室對短燈檠索𥿄書之獨歩溪頭夜𥘉寂掃空塵念心清凉月明眼底見秋色境静鼻根聞桂香前日寓邑偶值乍寒陳劉二生濟我以衣童生濟我以衾既别爲二詩以贈肌体生鱗鬚颯毛衰年怯冷欲兒號無人来綻韓公襖有友䏻施范叔𫀆入手乍驚儒袖濶披身尢喜義襟髙書生忍凍誰相顧共弊䡖裘賴我曺右贈陳元佐劉士宗凛冽霜風夜薄人誰䏻煖我曲勾身寒欺三幅范衾陋睡羙一宵姜𬒳新体粟不愁生旅舎鼻雷想見撼比隣夢囬却念君兄弟苦磈無眠痛慕親右贈童偉侃萬先之生两男作洗児歌賀之君不見徐卿二子生絶竒㷱羆入夣非同時徒煩孔子與釋氏两囬抱送麒麟兒又不見昔日梁嬴亦雙乳生止一男仍一女過期畢竟非其人未免終身亦妾圉欎葱佳氣充門閭龍穴盛事從来無􅕴階良月吐三筴蚌腹甲夜生雙珠相對抱持翁嫗喜眉目分明巧相似慈顔戯語綵衣郎汝子他年勝我子郎君拜舞咲荅翁翁生六児年豈同何如今日一巵酒手抱两孫頭未童二雖慶誕相先後未省如何分長㓜啇家尚質周尚文喚取何休細推䆒慶門蘭玉行滿庭伯仲叔季雙命名他時四乳類周士森森八桂同敷榮我忝通家同筆硯聞君得子歡無間殷勤為作洗兒歌覔取金錢三百萬黄府君挽詞不雜啇山綺與園生涯占得小桃源平生隠徳知多少跨竈詵詵巳六孫紛然紾臂巳成風一㸑誰能再世同野史他年書逸事定湏記此富家翁揚州别駕知名士肝膽崔嵬百錬剛誰謂公家有蘭玉觧令髙選継東床劉黙識道泝州人令樂清有政声後得揚卒以二女妻白石錢氏黄氏齒髮如公自古稀定應含笑九原帰春風白石岩前路忍見楊花作雪飛予自乙丑冬如臨安赴𥙷逮今凢五徃矣是行也痛慈親之不見傷㓜児之蚤死登途泫然因成是詩八歲五行役兹行最感傷思親啼血淚憶子断剛膓㳺逺有遺恨鍾情難遽忘離家两夜夣長遶白岩旁𥘉擬過雁山既而取道烏石寄夣齡昌齡不度丹芳七七盤非縁杖屦厭間関要留来歲髙風便兄弟成行過此山過白溪朝離黄塘憇烏石莫宿青江過白溪嶺上囬頭觀赤水山川五色望中迷過盤山宿旅邸一嶺迢迢十里賖行人半日踏烟霞青山遮莫盤千匝歸夢何曽不到家登皇華亭不是四方銜命士偶来亭上賦皇華凭欄囬首三百里烟水茫茫思故家宿浮橋落日丹丘下西江十里西浮橋通古道逆旅傍清溪夜静水声細曉隂山色迷吾郷在何䖏天逺白雲低與鄭時敏登楼把酒書二絶十里青山接郡城危楼四望眼添明海冥天濶郷心切更聴飛飛鴻雁声登楼䏻賦非王粲沽酒忘形有鄭䖍千里相從文字飲不辤費盡杖頭錢途中見早梅山行𥘉逢建子月始見寒梅第一枝遥想吾廬亦如此誰䏻千里贈相思梅花發後思家切竹間水際出横枝暗香踈影和新月自是離情禁不得觸物那堪此時節春前臘後定帰来要看溪上千株雪乙丑冬西㳺觀南明石像作詩一絶至壬申十月四日復徃觀焉和前韻并書于佛閣児戯團沙欲象真誰将碩力歴三塵八年来徃蕭峰客两度来瞻百尺身西征紹興建元二十二良月壬午時丁未王家辭弟㳺帝都出門滿眼思親淚鶺鴒送我過原隰朋友携尊宿䔥寺朝離黄塘惜分别莫宿青山嗟獨自𥘉心滿擬㳺雁山行止非人輒乖異黄岩晋連越三宿故舊過從日沉醉鄭生伴我千里行近世人無此風義皇華亭上一囬首陡覺眉頭起郷思西江十里浮橋邉把酒登楼吟擁鼻山行𥘉逢建子月入眼梅花巳春意前觀三渡覺非舊下視两灘真可畏渡頭仙人還咲我髭鬚如棘猶名利欲入天台觀石橋行来匆匆未䏻遂途中邂逅張老丞廷玉十五年前樂清尉自嗟吾非沈謝軰面目從来苦難記飛泉枕上夣成魔逹旦思家何曽睡細雨濛濛入関嶺旅邸重㝷舊題字雨脚㣲收過天姥洗出峯巒疊蒼翠劉阨祠荒土猶赤溪山真是神仙地道旁石現小金仙傅舍荒凉誰廢置柘溪竹染兒女㾗石嶺松含棟梁噐路入南明觀石佛楼閣岧嶤更深䆳八年行役两来㳺岩上題詩記前事乗興剡溪尋故人乆别相逢雜悲喜義風吹水送行舟越國江山滿瞻視十四歲娥孝且烈三百里湖明更媚千巖競秀􅊤争流終日貪看趣遥寄西興渡口声如雷銀浪崔嵬魄驚悸江神為我風色平天闕煌煌瞻象魏賢関訪舊話酸辛更食韲塩舊滋味學官欲以軄事留自媿非才力辤避觀䑓雲物端可書宫線𥘉長日南至龍山僦舎觀大禮儀仗森然典文俻人臣貴盛古今無秦公父子俱為使景靈告謝樂声囬鵷鷺花枝侈君賜西㳺連日覩天顔和氣氤氲散憔悴歲云莫矣却歸来捉筆書為于役志梅溪先生文集卷第五
