  text: 梅溪先生後集卷第十
  hash: sha256:af9985a1342f72f2d268f8b6029e7e595644547f7107af3a102bd28154fad16f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_010-1a}
body:
  text: 詩豫自饒易夔以七月九日行饒人遮道挽留易轎由間道而去提點何德獻相追不及以詩見寄云斷橋截鐙亦堪憐始信林間别有天微見兵機第一義朱􅙲暫席廣文氊因次其韻誤辱番昜士庶憐閉門不許出朝天門名間行雖乏相如璧淂句全勝子敬氊同官酌别無德於民愧冦恂斷橋留我荷番人同僚送别四十里滿酌不辭三𢾗巡途中寄何德獻邂逅江湖兩白頭公方東駕我西遊韓張呼酒情雖重孔李通家好未修慶朔詩高魏提點秋香賦愧范饒州驛筒從此相來往别後何妨却倡酬范文正公守饒時魏郎中蕪作提點二公甚相淂文正改知潤州魏作慶朔堂栽花詩寄之文公嘗為魏作秋香亭賦宿何山孫氏竹軒觀張安國題壁因用其韻往來真箇及瓜期去來皆七月見竹還思種竹時郡亝種竹今日賦詩添舊集明朝不是楚東詩望廬山懷番昜同官五峯亭上同登日遙望廬山在杳冥今日廬山真滿眼回頭却望五峯亭蘿觀八陳圖是夜宿章田易任夔子國身猶在重湖蘿魂輒先往臨江觀陳圖竒才蓋三國壯志吞兩都惜哉功不遂英雄為欷歔胡為恍惚間微茫見規模清時耻談兵武侯其戲豫讀喻叔竒送行六詩番昜同事九十日尊酒相呼恨不多送别六詩詩似杜絶勝劉子竹枝歌都昌道中望廬山思故鄉肩輿終日在山間忽見廬山憶堆山我亦無心入蓮社碩隨征堆及秋還過五柳灣出守江湖日念還又扶衰病入巴山不能早作歸田計愧過淵明五柳灣宿栖真寺林間古剎號栖真髙躅難尋晉宋人我正迷途倦奔走何繇來向此栖身懷番昜士民來去番昜各有因却疑行止亦由人此心可鑒惟天日公論難欺有士民觀淵畫像蕭灑風姿太絶塵寓形宇內任天真絃歌只用八十日便作田園歸去人題翠軒淵明舊隱名棲真中有栖真間道人廬山咫尺腳不到開軒種竹清且新我到山中越三宿似與道人緣分熟皇恩若許歸故鄉拭眼重來看修竹寓栖真四宿時二兒寓上庠未知去留又祠命未下頗以為懷白帝知何處黃山且少留地名上黃山心慙陶靜莭政愧范饒州桑下越三宿江邉將半秋家書及祠命何日解吾憂望大孤山湖口羅家渡中流見大孤山丗俗以孤為姑以澎浪為彭郎遂有小姑嫁彭郎之語東坡戲見于詩番昜有童子渡渡頭有小山如冡丗傳為九女冢見于啚經其事甚怪蓋亦丗俗流傳之訛遂以二渡所見戲成一詩番昜古渡留遺冡湖口煙鬟露淡粧九女何由從童子兩姑那肯嫁彭郎題湖口驛蘆花洲渚江人邦我來把酒臨西窗五祖六祖山照眼清流濁流水同江孤山大小各嶄絶鍾石上下相㫪撞千帆出沒煙雨裏何如鷗鷺飛雙雙至江州遙與齊侯會江人故國存夷吾嗟不見北望是中原和叔竒見寄荔子黃甘豈不香二物夔州所出路經九折歎王陽羡君松竹吟哦處橘在懷中母在堂讀趙果州詩名不拙時為江州添倅眉宇胸襟兩不塵唾成珠玉更清新惜哉不使蘇仙見題品寧先趙德麟讀王文正遺事太平宰相王文正盛德真冝有子孫舊國今餘幾喬木三槐隂滿宋乾坤題庾樓呈唐守立夫遙望香爐氣欲煙坐觀湓浦浪㫪天山川滿目古今迹雲水千帆名利船万點白鷗家浩渺一聲赤壁酹嬋姢唐命妓歌赤壁詞詩篇細讀張耘叟倚遍闌干思黯然宿太平興國宫此來端不為行春未至宫七里有地名行春亭欲向廬山訪隱淪聖主如容食祠祿碩為主管太平人九天使者號真王聖治峯前古道埸五百年間聖君出太平治效過明皇自開元至今蓋五百年宿東林贈然老儒服方𫀆兩秃翁兩家元是一家風歸田我欲效元亮結社師真如逺公堆蕩此生看未足虎溪一笑偶然同清凮明月處處共寧間江西與浙東白公草堂廬阜雙林寺爐峯幾瓣香日烘煙嫋𬗋敬為白公堂蓮社淵明修靜不談禪孔老門中各自賢送别虎溪三笑後白蓮流水兩淒然題東林聰明泉逺公白蓮社旁有聰明泉飲此誰聰明社中十八賢堯舜不曽飲聰明本諸天我輩雖飲之聰明不加前為愛此水清一酌滌塵緣却恐愚此水愚名自今傳遊圓通夾徑森森鬱老松煙霞深處忽聞鍾虎溪水隔侯溪水馬耳峯聮石耳峯遺像人猶思後主李後主功德院有祠堂開山僧不畏先鋒僧言曺先鋒翰下江州至圓通主僧跌坐不懼明朝杖屨山南去噴沫飛流看玉龍贈訥老路入侯溪無故侯𣑽王祠宇占清幽語言文字真吾病喜共維摩大士遊題至樂亭雙閣壯緇林一亭餘古屋庭垂祖師柏風動禪房竹山禽語畫寂岩花吐秋馥此樂本來無行人慕幽獨石散山形在舊有假山石巳散失有三巨石猶存池乾水意存遊心山水外至樂不容言勝書記蜀僧也和豫遊玄通一詩用贈訥老韻酬未向夔門訪武侯禪房杖屨謾通幽題詩况有詩僧和深喜廬山淂勝遊次韻唐立夫以日者命狀見寄天下名山欲遍看未能高卧愧陳摶山人誤説潛夫命只慕冥鴻不慕官唐詩云試把流年子細看休將蠖屈比鵬摶渠家大有回天力不為區區作好官趙果州致羊酒走筆戲酬十日廬山遊𬞞腸作雷鳴對食有長鋏論文無麴生清淨似齋戒遲留欲修行翩翩佳公子憐我厭黎羔魚酒致逺意詩篇慰西征薑新微帶糟鮓美香流􅎆今宵羊踏園魂蘿定須驚回首白蓮社姑作陶淵明題訥菴圎通訥老以訥名菴題是菴者多用禪語豫以儒説證之休論摩詰與文殊試把菴名扣大儒君子於言端欲訥賢人終日只如愚樂山自昔稱仁者利口由來惡嗇夫聽法雙峯空聳耳老禪惟要一言無石耳馬耳圓通二高峯也題康王觀趣在煙霞丗味輕天將廬阜尉西征且須細看康王谷未用遙尋白帝城星子地分天上宿谷簾泉占酒中名凌雲仙客知多少肯向風波丗路行有凌雲峯湯泉占淂乾坤造化爐地中沸出巧工夫泉猶自作炎涼態休説衆生垢有無宿歸宗寺好山無數不知名路入禪林氣更清岩石有時開鏡面石鏡溪流入夜作鵉聲鵉溪臨池墨客餘風韻寺本王右軍宅有墨池存拭眼高僧避寵榮安淂清風生兩腋𬗋霄峰頂望寰瀛簡寂觀陸修靜道場縈迃草徑少人行忽有黃冠洞口迎自笑荒蕪陶靜莭更尋簡􅓦陸先生朝真惟有壇前石流水猶餘絃上聲欲聽全雞上金闕𬗋霄峰際白雲橫陸先生善鼓琴觀有朝真石金雞𬗋霄皆山名遊開先寺觀香爐瀑布諸峯讀李蘇二仙詩知廬阜之勝在是記以十韻廬山何處好勝地有開先瀑水潄寒玉潄玉亭香爐生𬗋煙香爐峯𬗋霄長近日𬗋霄峯黃石不知年黃石岩堆蕩靈湫合有兩瀑布鄷城寶劍連雙劍峯龜行似朝斗行龜峯鶴唳欲沖天鳴鶴峯馬尾只自洗馬尾泉牛頭奚用穿牛頭岩雄詞惟大白妙句更蘇仙寺占星流處星子縣橋飛月出邉碑方閲華藏山谷作開先華藏院記蘿巳到栖賢明日遊三峽歸心定決然豫易任夔子方力丐祠聞三峽之名愈起歸心遊万杉院誰栽沙苑千株栁爭似廬山万本杉如欲歲寒長不改更栽松柏滿幽岩廬山三百六十所長有神光照万杉借問山中有何寶仁宗飛白字非凡一水遙分瀑布餘万杉深處散明珠不知散却珠多少能買人間冨貴無散珠亭飛橋讀東坡漱玉亭詩至月出飛橋東句想像佳境有跳入清冷中之興豫至開先新橋適成因書一絶蘇仙詩裏見飛橋欲看虹霓踏玉腰我到山中虹始見揚輝有月印青霄三峽橋三峽橋邉杖屨遊此身疑巳到夔州題詩欲比真三峽深愧詞源不倒流灔澦瞿塘在眼前便應從此上青天秋風脫葉隨流下疑是十帆出峽船五老峯投老山林興已濃廬山欣與老人逢定須容我來同老五老峯邉更有峰玉淵誰決銀河落半天飛流濺沫五峯前山中􅋄木皆光澗知有含輝玉在淵宿栖賢瀑水聲中夜不眠星河影動半秋天誰云灔澦瞿唐逺只在洋瀾左蠡邉師子吼成方外法師子山石人參淂定中禪石人峯住山五老知今古借問曽栖幾箇賢遊楞伽涉水穿雲一徑迃朱砂峯下訪僧居鳥鳴蟬噪更幽處中有人藏万卷書李公擇藏書之所老僧元不服朱砂境靜心灰夀自遐廬阜招提三百所只餘折桂與楞伽有僧年八十一言廬山諸剎惟楞伽折桂不遭焚毁藏書閣在已無書山色依然滿舊居留淂婦人三墨竹金鍾聲裏尚扶踈鍾樓有李夫人墨竹公擇女兄山谷母也遊南山入康谷以不觀谷簾泉為恨南康李守致上尊乃此泉名也戲成一絶不飲谷簾山下水徒觀瀑布下長川使君破我遊山恨酒寄人間第一泉石鏡溪山中有鏡石為臺雲霧深藏木肯開别有一溪清似鏡不須人為拂塵埃廬山紀遊四十韻我性好山水思向廬山廬五老招我遊有約芝山𥘉茲行適所碩孰曰非天與入眼庾公樓興巳先籃輿雲開聖治峯石扣仙人居太平興國宫有聖治峯劉仙石香爐望煙靄淨社觀芙蕖虎溪聊自笑天池步冝紓天池最高不及遊半月圓通晉幽亭樂有餘寺有至樂亭趣如六一翁境似山環滁侯溪煮月泉石耳供岩𬞞峯以生石耳淂名破戒戲魚酒踏園蘿羊豬賢關淂家音二兒時在太學一日淂兩書天恩拜新除抗章復辭免前辭夔州今辭穴對行色仍躊躇遂作南山遊首過荆林虛凌雲入康谷臨流清可漁𣣔飲第一水山深足趑趄湯泉本何來忽從龍口噓鵉溪尋故家歸宗寺本王右軍宅墨沼波猶瀦石鏡不可見懸崖照誰梳尋真到簡寂入觀驚丘墟𬗟懷黃與陸何處飄霞𥚑簡寂觀乃陸修靜道埸有黃石公岩觀今荒廢眼明見飛瀑澗壑鳴瓊琚何落句思李練飛詩陋儒新橋跨虹霓出月明蟾蜍兩州勞五馬同日傳雙魚至開先淂唐江州李南康書神光照万杉飛白晉天書遙瞻星子城青山點㫪鉏我行未及西三峽知何如登橋閲天險奮地轟雷車壯哉五丁力鑿此千尺渠群峯列耆老深淵蓄璠璵五老諸峯及三峽玉淵並在栖賢古剎依朱砂穿林駭猿狙楞伽在朱砂峯下自栖賢子路穿荆棘而行万卷巳空閣三竹猶扶踈肩輿足繭卒傳詩手疲胥佳境尚無窮雅興良巳攄身隨禽往還興逐雲卷舒重尋訥菴老細論無言豫節物變炎涼遲晉費居諸在路何悠悠歸蘿頻蘧蘧秋風堆還蕩緘封寄鄉閭歸宗樅老言廬山有對云簡寂觀中甜苦笋歸宗寺裏淡鹹韲豫因以湯泉石鏡戲成一絶參禪淂味鹹韲淡學道忘憂苦笋甜石鏡與時為顯晦湯泉涉丗有涼炎開先僧贈石菖蒲結根拳石伴孤僧對我還同道眼青莫遣塵埃侵九節會須重作玉衡星别廬山山北山南巳遍遊又移行李向西州身如孟子論行止心愧淵明任去晉峯頂今宵應好月人間明日是中秋天池一塔遙相送深喜浮雲為我收題天華院遊遍廬山寺兹山亦自佳數宵緣石耳一飯為天華中秋宿瀼溪驛瑞昌縣半月遊廬阜中秋宿瀼溪祠尋元子隱元次山舊隱樹認赤烏栖吳赤烏所見之地坐待雲開月行愁雨作泥番人應話我身在九江西浪士舊遊處旅人今兩宵赤烏曽紀瑞銀杏敢興妖驛故簿斤有銀否木甚古能為妖伐之遂息照眼水名瀼回頭山憶堯番昜有堯山男兒四方志寧憚蜀天遙瑞昌李宰贈元次山集蒼然山色冷然聲次山之文讀可驚令君贈我有深意𣣔以漫浪更吾名我雖有官真漫耳誰遣夔門稱刺史門卷欣逢子元子尤愛清泠瀼溪水中秋思鄉用瀼溪韻今夜中秋月還應滿故溪遙知千里共深羡一枝栖歲月飄如蘿年時醉似泥可憐佳節裏兄弟各東西宿多福院古剎名多福𥘉來宿上方蜂窠懸敗壁燕壘滿空梁蝙蝠沸盈室塵埃堆滿床香燒數炷柏移下小僧房昨日飯金城觀今日飯石田驛城縱是金非碩淂田雖有石尚堪耕欲隨秋堆蕩中去却向杜鵑啼處行瑞昌永興道中作瑞昌屬江州永興屬興國蜀道青天手未摩肩輿從此上危坡過瑞昌縣數里有亭子嶺頗高自番昜三山方有嶺永城朝過路方永永城驛名在兩邑之界多福夜眠僧不多岡畔泥深愁欲雨渡頭舟小喜無波黃岡橋為