主一啓金縢即悟公宣王北伐南征萬國臣中興周室賴賢人嵩髙千古英靈在何獨當時降甫申幽王文武基圖木易量可憐中葉壞幽王神龍流沫生尤物赫赫宗周一笑亡秦始皇鯨吞六國帝人寰遣使遙尋海上山仙藥未來身巳死鑾輿空載鮑魚還二世始皇一怒逐扶蘇天欲亡秦果在胡翻𬒳四方黔首笑不分鹿馬是誰愚漢髙帝百戰功成漢業新咸陽置酒問群臣區區髙起王陵輩豈識龍顔善用人仗劍﨑嶇起沛豐祗將嫚罵馭英雄雖然能用三人傑巳失啇山四老翁文帝文帝興王自代來百金不費亦仁哉後人不務師恭儉萬户干門幾露臺武帝武帝英雄類始皇甘心黷武國幾亡晚年賴有知人術解把嬰兒付霍光宣帝道雜霸王非美事治先刑法少仁恩蓋楊韓趙猶誅死誰謂當時獄不冤元帝德化欲遵周軌轍刑名思革漢規模更生踈斥蕭生戮元帝何曽善用儒光武大命由來自有真子輿徒號漢家親須知炎祚中興主元是南陽謹厚人鬱鬱蔥蔥瑞氣浮南陽兵起再興劉將軍大敵非常勇文叔平生本好柔明帝萬乘臨雍事老更橋門億萬會諸生永平大子真儒雅只恨容人度未宏章帝民苦繁苛厭永平科除慘獄慰群情不窮竇憲欺君罪翻𬒳寬柔壞典刑魏武帝董吕裘劉電掃空阿瞞獨步騁姦雄豈知權備皆人傑未肯全將鼎付公吳大帝拔刀斫案氣如虹獨倚周即立雋功一戰果摧曹孟德不妨髙枕霸江東蜀先主曹公姦黠世無雙元德雄才肯見容誰把荆公資霸業一朝雲雨起蛟龍晉宣帝四朝天子寄安危寡婦孤兒豈忍欺見説五湖扛鼎日又勝三馬食槽時晉武帝早歲膺圖帝業光睌年何事政多荒算來不用平吳好畢竟吳平速晉亡元帝金陵王氣為誰鍾五馬南浮一化龍四海民心共晉思江東何事却從容宋武帝宋武英雄世莫加長驅千里定中華衆機不據金湯險自剖乾坤作兩家齊太祖天厭金刀水德終一時人望屬蕭公能論魏武周文事獨有區區謝侍中梁武帝不法先王治用儒捨身傾國事浮屠堪嗟餓病臺城日曽得空王救死無簡文帝青絲白馬渡江來宫殿酣酣盡委灰不解開門納挑捧空悲明鏡不安臺陳武帝一旦權臣外召君巳知天帝欲興陳江準若道無神物誰報齊兵至夀春後主臨春閣上醉流霞狎客酣歌興未涯江左半無陳日月君臣猶聽後庭花魏道武火舉南征破弱燕拓開中土奠山川功成若更能修德自可延年度厄年北齊神武浮圖入海天已魏鸚鵡興謡運啓齊鄴下兵興黃蟻死營中星隕衆驢嘶齊後主峩冠食祿雞開府搖尾承恩大郡君將士焉能死征戰盍驅爾輩赴三軍周文帝傳檄東征賀六渾親迎天子入長安剩栽沙苑千株栁長使齊軍破膽寒隋文帝孽后邪臣造釁端房陵幽閉抱深冤一朝變起宫闈內方信當時用婦言煬帝汴水東流岸栁春龍舟南下錦帆新鳥聲勸酒梅花笑笑殺隋亡亦似陳唐太宗仁義誰云不可行文皇親見治功成德彛可惜身先死豈信人間有太平髙宗正觀基圖極盛隆誰將神器付昏童倒持利柄歸房闥仙李枝柯一剪空明皇天寶君臣玩太平梨園弟子奏新聲貴妃一笑天顔喜不覺胡塵暗兩京肅宗張后宫中巧弄權上皇西內老誰憐杜陵獨念君臣義長向雲安拜杜鵑德宗虜箭侵陵御幄時君臣相顧不勝悲難平猶自推天命盧𣏌奻邪竟不知憲宗叛將連頭就典刑元和功業九成晚年誤信妖人術禍自丹砂藥裏生文宗輦路青青春草多憑髙無語涕滂沱禁中夜召詞臣語受制家奴可奈何梁太祖天下人心共惡梁祇應無奈虎狼強可鄰千尺黃河水投盡清流始滅唐唐莊宗十年征戰不知勞三矢功成意氣豪自吒身為李天下焉知禍起郭門髙晉髙祖玉帛和蕃辱巳深那堪割地侈戎心關南一陷腥膻後遺患寥寥直至仐漢高祖石氏君臣盡播遷晉陽兵起據中原早知只有三年漢何似捐軀報晉恩周太祖出鎮雄藩勢已危擁兵乘釁襲京師誰知一代生靈主元是雕青郭崔兒周世宗髙平決戰破劉旻北取三關速若神大業未成天命改殿前點撿是真人許由肥遁箕山不可尋髙名不朽到于今尚留昔日洗耳水為洗世人爭兢心后稷洪水橫流四海飢教民稼穡務三時後王欲識艱難業讀取豳風匕月詩伊尹窮居樂道自躬耕那肯要君用割烹湯后不加三聘禮未應改志為蒼生箕子諌君不聽念君深𬒳髮徉狂自鼓琴千古共傳箕子操一時難悟狡童心比干諌君不聽盍亡身豈忍求生却害仁不向天庭剖心死安知心異世間人伯夷避紂窮居北海濵歸來端為有仁人武王不聽車前諌餓死西山志亦伸太伯太伯髙風不可追鴈行接羽共南蜚莫言斷髮便無用猶有􅍮蠻慕義歸太公隱迹蟠溪七十餘釣灘清淺鬢蕭踈滿懷韜略為香餌只釣文王不釣魚周公明堂攝政朝群后四海流言孺子疑何事召公猶不説丹心惟有鬼神知召公鼠牙雀角豈能欺召伯聰明聽不疑南國政成公巳去甘棠長結後人思齊威公諸侯九合霸圖成晉宋江黃盡會盟惟有召陵功最直包茅不貢故來征晉文公逆旅栖栖十九年五蛇夾負遂升天却慙不及齊威正卿相由無管仲賢宋襄公小國爭盟禍莫逃託名仁義直徒勞殺人祭鬼寧非忍猶自臨戎惜二毛秦穆公秦穆平生善用兵孟明三敗始功成後人不識兵家勢異議紛從勝負生楚莊王周衰夷狄最跳梁楚入春秋勢更強能用一言存滅國賢哉猶有一莊王魯隱公唐堯授舜由天命太伯奔吳避聖人魯隱效顰端可笑遜威不正自巳身威公菟裘有意身將老社圃無端釁巳萌篡魯由來因羽父過齊爭奈遇彭生莊公先君出會不生還魯弱無由可報冤禰廟豈冝薑氏見莊同何忍與讎婚閏公慶父衰薑産禍芽齗齗魯道可勝嗟武闈難起無人救季子來歸未足嘉僖公僖公能繼伯禽凮盛德揄楊魯頌中惟有春秋用王法不輕一字曲褒公文公年時無閏月那成嵗廟有先君豈上賢魯國從來秉周禮文公何事獨無天宣公東門無道敢欺天過市哀薑語可憐和氣致祥乖致異如公自合大無年成公周室孤危若旅人諸侯誰復肯來臣成公不朝是天子假道京師會伐秦襄公侯伯誰修二霸公大夫專政自襄公堂堂魯國車千乘翻在三家掌握中昭公昭公失國寓乾侯方伯無人肯見憂如晉適齊徒取辱祗緣不用子家謀定公春秋疆埸事紛然齊魯干戈幾載連若使真儒長見用來歸何止汶陽田哀公諸侯失政倍臣僣中國無君左袵專欲問哀公後來事春秋書止獲麟年鄭莊公天地深恩詎可忌寐生忠孝兩俱巳身從何出翻囚毋國是誰封敢射王齊襄王諸兒惟薄可曽修敝笱詩包兩國羞何事春秋九諱惡祗緣能報祖宗讎齊項公敵國行人詎可輕等間戲笑禍胎成胥閭竟日知何語回首齊郊巳𬒳兵鄧祁侯舅甥柸酒結綢繆豈忍隂懷盜賊謀不聽三臣言亦是未須深罪鄧祁侯晉獻公齒髮衰殘志慮昏讒興婦口可心寒不知尤物能為禍却為驪姬寢食安楚靈王章華臺就國𬒳繇徴會諸俠意氣驕楚衆巳離猶不悟近臣徒為頌祁招楚懷王懷王誤與虎狼親身死咸陽一旅人見説國人懷舊德楚雖三户亦巳秦吳王夫差西施未必解巳吳祗為讒臣害霸圖早使夫差誅宰嚭不應麋鹿到姑蘇越王勾踐機會由來貴速投姑蘇事與會稽侔謀臣不早麾兵進嘗膽徒勞二十秋頴考叔衣冠肉食謾紛紛誰解柸羔感悟君頴谷封人雖賤士却能純孝至今聞石碏人情誰忍棄天倫公獨能將義滅親何惜一時誅賊子不妨千古作純臣孔父春秋死難止三人皆欲求仁未得仁莭義可書惟孔父勝如仇牧勝如荀仇牧春秋死難止三人皆欲求仁未得仁仇牧捐軀為君父不如孔氏勝如荀荀息春秋死難止三人皆欲求仁未得仁荀息捐軀為私昵也勝賊子與姦臣祭仲庶子雖賢寧奪嫡人臣惟聖可行權區區祭仲何為者賣國容身豈足賢管仲小莭區區豈足羞功名未顯分纍囚平生自有真知巳寧患威公怨射鈎大夫種狩罷吳郊鳥兔空果烹獵犬廢良弓大夫自為知幾晚豈是陶朱計不忠范蠡久與君王共苦辛功成身退肯逡巡五湖渺渺煙波闊誰是扁舟第二人李廣李廣才名漢世稀孝文猶自未深知輟飱長歎無頗牧翻惜將軍不遇時隴右英豪真有種將軍才氣更無雙功髙不得封侯賞祗為當時殺巳降婁師德忤意由來勿校難誰能唾面自令乾直須事過心平後方服婁公度量寬狄仁傑武火方炎李欲灰忠良何力可能回斗南人有擎天手為向虞淵取日來徐有功獄興羅織陷忠良公亦幾遭虎口傷蹈死救人人免死論功何止漢于張梅溪先生文集卷第十
