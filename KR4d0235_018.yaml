  text: 梅溪先生後集卷第十八
  hash: sha256:394ed8a855720569d0bdcdab2c6bcf3ba500c181f990daa42a64d7394c87ef2d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_018-1a}
body:
  text: 詩修戒石曩在夔府修戒石作柏梁體今郡庭戒石痺陋葺而新之貢院會同官以夔府前四句分韻得爾字君以民脂膏祿爾大夫士脂膏飽其腹曾不念赤子貪暴以自誅誅求不知恥指呼有鷹犬嗜欲肆蛇豕但言民至愚孰謂天在邇昭然甚可畏殃必反乎爾聖訓十有六簡嚴具天理大字刻山骨朝夕臨坐起一念苟或違方寸寧不愧清源庭中石整頓自今始何敢警同僚兢兢惟勑巳知宗送玉友酒鈴齋晝寢夢𥘉醒忽見雙􆁬眼欲驚誰送甕頭新玉友人言天上老宗英林漕世傳贈莆中荔子名狀元紅分送陸倅陸有詩次韻林名孝澤譜中不見見屏中州宅荔支屏風中有此名蔡譜無之正與花王雅目同牡丹亦有此名别駕破荒吟好句少陵詩裏擘輕紅提舶送荔支借用前韻舶臺丹荔新秋熟風味如人自不同名字未安真缺典從今呼作馬家紅舊已有名馬家緑者州治有忠獻堂以韓魏公始生得名廢于俗吏更以清暑今復之相出相州生此州巍巍勳業宋伊周後人莫要輕更改别有堂名勝此不六月二十五日會同官于貢院用前一絶分韻得相字天作元聖配東坡祭公文天生元聖必作之配公非淺夫相荆公詩骨相知非淺丈夫乘風來帝旁捧日到天上兵戎在呼吸端委見力量三朝社禝臣勳業誰輩行堂堂國伊周勃輩安敢望慶曆聖德詩可屬大事重厚如勃清源始生地風土至今王釋氏從何得抱送真不妄事具行狀好事榜其堂嘉名無以尚何人輒更改有識為悽愴端同聖削迹又類元覆醬思賢舊觀復聞風懦夫壯堂上生輝光如公名始唱公唱名時日有五色姦骨死猶寒如公昔為將畫象出貂蟬疑公尚亡恙平生蓼莪心眷此應不忘嗟豫生太晚不識天人狀版啚猶未復晝錦無由訪維揚金繫腰歎息為誰放一麾忽南來遺迹增慕嚮當于異夢處祠堂為公創公生時毋有異夢新第先歸者五人燕子黃堂故事也酒半啜茶于忠獻堂持杯以勸即席贈詩四海英才入網羅清源龍虎姓名多經魁蘭省得人傑䇿射楓庭收甲科奎宿呈祥前未見緯星還舍首相過一杯忠獻堂中酒名節相期要不磨寫真自題顔蒼髮白少精神傳得泉南老病身莫著金章著蓑笠丹青寫出更須真士昭贈寸金魚子三印子魚猶未食寸金魚子輒先嘗鄉人得得分鄊味轉使鄊心念故鄉贈第二人石察判起宗䇿冠諸儒巳奏聞不妨居次避平津坐看万石門闌大居万石坊轉覺朋山氣象新黃卷更窮稽古力青雲莫負致君身試觀忠獻堂中像亦是當時第二人荔支七絶陳紫端明品第首推陳花裏姚黃是等倫郡圃一株稱小𬗋故家風味自宜珍興化所送及郡圃所生者皆小紫也江緑枝頭已熟疑非熟蔡譜江家緑荔支真與泉南人物稱果中猶作亞魁推泉州自龍虎榜以耒多出第二人江緑在譜中為第二皺玉莆中皺玉價傾城品第吾何敢妄評只恐此非真皺玉果然是玉亦虛名大將軍荔支名字大紛紛所見多應不逮聞别有深紅霸群品郡人呼作大將軍郡圃荔支以大將軍為冠玉堂紅天教尤物産閩中名字深竒日不同顧我素稱田舍子如何敢啖玉堂紅奪先紅林國正虙見贈因以酬之林嘗魁別頭閩中荔子説莆中闕下竒包又不同正向鈐齋想風味奪先人送奪先紅七夕紅宅堂荔子無名字自我呼為七夕紅記得去冬𥘉到日家人指樹語衰翁貢院垂成雙蓮呈瑞因成鄙語勉士子大厦垂垂就嘉蓮得得開雙雙戴千物兩兩應三台泉南雙蓮凡三開矣歡意重重合香風比比來人人冝自勉舉舉有廷魁梁魁登第灃宫有雙蓮之瑞陳賀州賦雙蓮詩不言祥瑞次韻以酬紅蕖明鏡兩鮮鮮中有雙頭更頴然天産人才兼産物公祥和氣不祥蓮耻談子厚表中瑞肯詠章安橋畔篇何日相呼登泰華來華食實藕如船楊公濟水嘉雙蓮橋詩云昨日采蓮者雙雙橋畔新舊花今不見喜見似花人楊集號章安郡圃有荔支名白蜜者孰最晚戲成一絶紛紛蜂采百花歸蜜在枝頭竟不知造物要令甜在後時人莫訝孰何遲送王提幹渷昔年王儉容今共阿戎遊嘗藥子當去請祠豫欲休過從都幾日離别况逢秋歸上雙親夀塗中莫逗留觀貢院畫春景圖梁棟翬飛氣象新畫工妙思亦通神要令寒士皆春色四景之中獨畫春韓魏公生于泉南州宅故未有祠于典為闕郡圃有庵名大隱即之以祠八月戊子率同僚祀之天開我宋太平基𬗋府真人下應期河朔魁梧出真相泉南蔥鬱産竒兒夢符蚌腹生珠夜事應台躔捧日時𬗋帽清源發光采郡園深處立新祠陳提刑永仲以清名室志先德也詩以美之名孝則龐公嘗有言我獨遺以清賢者于子孫所遺良不輕頴川老龍公落落前朝英帝命作南伯清德如廣平宸翰一字褒不啻華兖榮是以自賢孫持節蜚英聲結蘆桐城隅室以清為名仰不黍厥祖俯能規後生我來聚星地喜見此老成公清不自言藹然著鄉評時焉訪其室鄙吝不敢萌如覿任棠水似濯滄浪纓碩移清室風于以清寰瀛朴鄊釣隱圖蔣元叔名所居之地日林鄊畫啚見示為作是詩君不見少陵先生詩有説淳朴之處山川别廣文示我朴鄊啚山水髙長景竒絶嚴坂疑為子陵隱昆溪想自崑崙決漁人欵乃山水間抱璞含淳釣清潔九仙高舉留遺躅三徑名家出人傑早將朴直取巍科行展朴忠立竒節鳴琴百里邑既以朴化民橫經泮水宫又以朴誨人他年致君堯舜上坐使風俗俱還淳功成名遂却歸去漁釣重尋舊隱淪廣文笑我言公朴甚我朴聞公家左原四面擁山嶽回隱如愚溪窈深若盤谷人皆朴其貌公又朴其學君子以為古先進于禮樂公鄉真朴鄊胡為不自覺碩公著隱眼歸尋舊盤旋酌酒梅溪上把釣蓴湖邊更畫左原山水圖與此朴鄊圖並傳天下大朴散巳久二鄊猶在羲皇前八月十五日貢院落成賔僚咸集斥世俗之樂不用飲文字也把杯邀月誦香滿一輪中句即席賦詩以勉多士揚輝秋月懸青天今夕何夕光更圎瓊為樓臺玉為宇廣寒境界移清泉月斧雲斤天上手萬間突兀摩星斗白頭郡守呼衆賔共飲落成文字酒龍虎群仙上界還手移桂種栽泉山千枝万枝香不斷人人有分行當攀姮娥殷勤寄消息科第要從勤苦得丹桂在君書卷中不須遙向蟾宫覔送薛士昭相逢一笑慰衰遲問政論交兩不疑直諒多聞三益友清新俊逸百篇詩瓜猶未及去何速橘已成懷喜可知一薛居州非易得危言行見造朝時記得祥符識面時回頭二十二年非羡君學似川方至顧我身如鳥倦飛老境天教重會合異鄉心最惜分違雁山親舊如相問征雁歸時我亦歸愛松堂前有緑竹一叢可愛旁有鷹爪花頗礙眼移去之忩前栽植不冝繁松竹相依妙意存不許間花放鷹瓜要看高節迸龍孫提舶送菊酒有詩次韻入日鈴齋午睡夢魂驚僮僕歡呼洗破觥酒是爛柯山下法詩如藍水坐間成謾同陶令浮黃菊也勝蘇仙嗅落英蓬鬢蕭踈對佳節因公撩起故鄊情九日登雲榭九日無悰懶出關強登雲榭望泉山傷心不忍看茱菊蓬鬢蕭踈淚點班十日同知宗提舶遊九日山延福寺十日同遊九日山山中好處略躋攀桑田改變松猶在車馬往來心自間昨日風應吹𬗋帽今朝菊已帶衰顔登臨稱愜南來意好逐飛飛倦鳥還御書閣黃龍溪上祥雲覆𬗋帽山頭瑞氣蒙俗眼驚傳佛光現不知宸翰在山中思古堂孤嶼遊人思謝公天台禪客亦思豐國淸有思豐堂黃花境界誰思古堂在煙霞縹眇中善利王廟有德于民廟貌崇我來端為謝年豐曰暘曰雨皆神力不止南風與北風晉時松孤山陳伯巳物化九日晉松猶後生欲問東南兩朝事風枝瀟灑侣談清秦君亭山中髙隱欲逃名不謂名隨隱處成鑿石一泓詩𢾗首也曾攻破五言城薑相峯相國忠如宋廣平危言流落晉江城天資自直無心賣何事青山亦得名明皇謂宋璟德宗謂薑相皆有賣直取名之語無名木一木蒼然老更竒肻將名與世人知我來不具知名眼深愧平生不學詩薑秦峯舊在延福寺中後易之立前守生祠而遷其像于西山石佛之下前守乃改忠獻堂額者郡矦不識國元勳釋子那知薑與秦隱士有靈應撫掌相公死亦不容身陳公祠名稱字君舉九年地主百年祠民自元豐結去思善政在人冝有後堂堂忠肅見公兒蔡端明詩賢矦去久迹猶遺乞雨詩竒字更竒世俗妄論公政猛愛民心有彼蒼知石佛卧草埋雲不記秋忽然成佛坐岩幽紛紛香火來求福不悟前時是石頭聚秀閣清源山逺水流長九日溪山更異常髙閣摩雲聚秀氣禪僧秀氣聚中藏提舶送岩桂晉堂岩桂晚秋芳濃緑枝頭萬粟黃堂上主人分贈我要令燕寢有天香寄南安鹿宰何字伯竒豫比至延福訪薑祠則遷于他所問薑相墓則曰不知也以語南安宰鹿君越數日南安見訪云祠巳復舊墓亦得之且修治矣惟秦君亭未葺蔡端明詩將與壁俱圯而不知護因寄南安春秋重復古二賢還舊祠直道不終廢髙風冝見思古墓出荆榛孤亭起頺墮更將碧紗籠覆護端明詩貢院圖節推陳德溥董貢院之後既成畫啚見示因作是詩陳君少年登甲科紅蓮首泛清源波清源貢宇髙嵳峩同僚宣力陳君多鞭朴不施成不日首夏上梁秋半畢一點靈臺輪奐飛十幅生綃畫圖出蒼蒼嘉木森千株新堤步步穿芙蕖移下蟾宫古丹桂種桂飛來海上真蓬壷他年君來作地主記得親曾視斤斧雁過山中寄我書要知多少新龍虎去年去年今日别吾家我鬢蒼然爾未華日似去年人不見鬢毛白盡眼添花不求人一名如意牙為指爪木為身撓癢工夫似有神老病不能親把握不求人又却求人興化簿葉思文吾鄊老先生也比沿檄見訪既别寄詩二十八韻次韻以酬莫年初仕塗暇日但書䇿儒生餘氣習筆端事揮斥政學兩踈繆篇章稍沉溺楚東會詩豪酬唱奏金石逢埸爭出竒遇險或遭厄忽泝三峽流遙經數州驛廬山看末足巫峯過尤惜西郊祠卧龍東屯弔詩伯飛飛猶倦鳥秋風送歸翮同行得嘉友鏖戰交鋒鏑弛簷白蘋洲天日去咫尺忠誼懷魯公霸業悲頃籍湖州設􅈦舊祠項羽奉詔還故鄊齒落肌瘦瘠涕泗拜松楸荒蕪翦荆棘心期樂田里誓不綰銅墨橐雖無陸金歸幸全趙璧陛下忽誤恩泉南又分職入閩如入蜀枯腸復冥索腰緣病減圍髮為悲添白風仰秦君髙節慕薑相直惡語誰流傳同僚誤刋刻吾鄊老先生吏事以儒飾新篇似庭燎逺寄針我癖把酒欲細論何時再沿檄陽春七十首老豔萬丈射招邀屈原魂收召子厚魄驚開老病眼喜見墨妙迹碩公倡斯文用夏變蠻貊近世作詩文者多溺于異端之學正賴鄉先生痛革其弊送陸通判劇郡元非老手便庶民安我二車賢二年不肻足到邑千里寧容吏索錢坐變池塘成貢宇平分風月上吟篇弟兄不減雲間陸拭目看君日九遷我十年前遊會稽堂名民事寓招提去尋神禹藏書穴歸泝子猷乘興溪萬壑千岩形夢寐十峯雙澗記留題鑑湖倘許知章乞首訪故人尊共携觀郡守題名春秋美惡不嫌同老子韓非一傳中壁上題名二百輩卓然名世兩三公龍眼絶品輕紅掃地無紛紛萬木以龍呼實如益智本非藥未比荔支真是奴金橘黃柑緑桔未分珍瑣碎登盤輒獻新正可呼為木奴子不知誰是鑄金人清源夫人趙氏挽詞全節忠臣配崇寧宰相家哀能變國俗貴不御鉛華學佛窮三昧然松教五車遺芳載􅊮管名夀兩俱遐我竊清源祿欽聞孟母慈符分三子舍桂棹兩孫枝方戲黃堂綵俄豐𬗋帽碑神州嗟未復長抱望夫悲食薑辣皺人眉性最良藥中功效不尋常吾儕自是生無智夫子何曾食徹薑食芋我與瓜𬞞味最冝南來喜見大蹲鴟歸與傳耴東坡法糝玉為羔且療飢夢二叔二叔年皆八十餘經年不見久無書江山不隔還鄊夢昨夜迢迢到佛廬懷胡侍郎邦衡今世汲長孺廬陵胡侍郎孤忠一封事千載兩剛腸晚節逢明主丹心契上蒼群兒巧相中直道亦何傷悼汪舍人飬源撲被周廬日夤緣識偉人庚辰同考殿試節因辝辟著志向得言伸伯仲同持橐聲名壓縉紳人仁邦國瘁可贖百其身悼張舍人安國天上張才子少年觀國光髙名一枝桂遺愛六州棠出世才成佛修文遽作郎長沙屈賈誼宣室竟凄涼黃花溫陵地雖溫十月𥘉黃花天然傲霜性炎威莫能加不趂重陽摘自愛晚節嘉宦遊胡不歸三徑荒吾家飛蚊九月不肅霜十月猶飛蚊不知從何來乘昏動成群觜利巧能嘬類多非熏青蠅與白鳥自古常紛紛夫子泉君不見水經品第天下水康王谷中泉第一但知耴水不取人品第未容無得夫又不見武昌山中清冷淵名因人重逢蘇仙至今人呼作菩薩淪入異教非吾泉刺桐城中泮宫裏大成殿下新泉水不須更以品第論混混源流自夫子諸生遊泳芹藻間日飲一瓢心慕顔聰明不𢾗逺公社廬山蓮社有聰明泉清白大勝卧龍山越州卧龍山下有清白泉范文正公名聖育尼丘家闕里泉脈胡為今在是周流天下皆美泉浚井得之泉更美我來酌泉仍叩頭遐想洙泗三千遊世間何處有此水此州無愧名泉州立髙桂坊書生未折桂短檠事然膏一朝桂入手不記燈窗勞回視𥿄上語棄置等棄髦曲學如公孫髙第何足褒溫陵號多士􅊯􅊯食蘋蒿臚唱十年間魁亜出二豪向來此坊中一門五夢刀月中仙子歸天香滿藍𫀆大對壓􅏯董同登盡劉曺嘉名換扁榜鐵畫新揮毫我欲成其美逺大期伊皋桂髙固可喜更看名莭髙洛陽橋北望中原万里遙南來喜見洛陽橋人行跨海金鼇背亭壓橫空玉虹腰功不自成因砥柱中流有岩石患冝預備有風潮紹興戊午嘗為颶風暴雨所壞蔡公力量真剛者遺愛勝于鄭國僑移庖貢院知宗即席賦詩次韻預讀嘉賔小雅章銀𫀆行見鷺成行彬彬周室士升俊濟濟禹庭言拜昌落筆詞源俱倒水何人觜距獨專場退之詩子府專場夸觜距清源欲志新人物定有英才副所望知宗贈金桔報以香橙桔以金為重橙因香見竒拜嘉欣孰早報貺愧來遲好處君須記良天我正思魏野詩云南應思桔抽天聊修往來好更誦木瓜詩梅溪先生後集卷第十八梅溪先生文集卷之十八青詞還醮荷洪造之無私微生有托痛雙親之不見遺願猶存德思報于難忱情尤深于罔極輒殫悃愊仰叩髙明竊念臣昔在先臣時為大觀當年齡之及壯念嗣續之未生虔發精衷哀投大道諾列宿真官之醮繪九天仙使之容誠果逹于杳冥應幾同于影嚮躬生三子目見諸孫嗟聖恩之未酬俄人事之已變先人奄棄母氏繼亡由微臣罪逆之深致先致因循之久凡歲星之屢易猶心碩之未償兹集羽流欽修醮式薄奉蘋蘩之薦聊伸豺獺之誠仰祈上帝之是臨俯兾衆真之咸集釋亡者九泉之纍碩遂超升宥臣門百指之愆永資覆育代道士薦師稽顙投誠仰黷髙明之聽刳肝瀝血俯陳哀痛之詞恭慿三界之妙香上徹九霄之仙路庶通悃愊曲賜憫憐伏念臣須以先師遽捐浮世莫救巳亡之命徒懷罔極之恩嗟日月之不居痛神魂之何在追念平生之出處恐貽造物之譴誅雖占籍為羽流尚宅身為塵網粗植膏腴之業妄為金榖之謀寄口腹于羶葷有傷物命留情性于麯蘖致喪天真不能辟榖于山林况復結廬于田里稔茲禍釁夭爾年齡焉非一念之知不墮三塗之苦臣忝承道業夙荷慈恩無伸報謝之門薄示薦羞之意虔遵科式爰舉醮章仰祈大道之慈悲曲宥幽魂之罪戾借冷風而滌濯灑甘露以清涼聽大法而入寶珠歌洞章而朝金闕雖形骸杇腐生前無羽化之功庶神識逍遙死後遂仙逰之樂代道士薦母非天何戴久資覆育之恩無母烏生曷報劬勞之德仰黷蓋髙之聽俯陳罔極之恩儻賜憫憐庶通悃愊伏念臣頃緣母氏偶遇厄年百藥不靈莫救沉痾之虐九霄雖逺不違疾痛之呼輒懷請儔之私果獲更生之賜尚擬親年之永稍稽心諾之償屢易寒暑兼懷喜懼日月逝矣嗟桑隂之不留人夀幾何恨河清之難俟未遂蘋蘩之報俄興風樹之悲罪逆所延噭號何及爰自重泉之隔遽驚百日之臨愧殘喘之尚存痛神魂之何在恭命羽士虔修醮科用酬昔日之鴻恩載助兹晨之哀薦兾資道蔭薄報母慈仰祈上帝之哀矝曲宥幽魂之罪戾渡仙橋而瞻玉像永脫九幽聽大法而入寶珠遐超三界代萬叔夏孫先覺二首居髙聽邇不遺疾痛之呼施厚報輕薄致苾芬之薦輒殫哀悃仰叩大鈞庶慿三界之妙香上逹九霄之雲路竊念臣頃以糟粳之偶適罹拆副之災裂肺肝幾痛受蝮蛇之禍誤形夢寐竟非㷱虺之祥事不止于驚薑罪深憂于訟酈賴噭號之有應信蒼昊之非遙遂于困踣之餘輒沐保全之賜雖𣑽音數誦冤未息于三生而大道垂休經靡勞于八説顧蒙恩之有日思報本之無門恭致羽流虔修醮式奉蘋蘩之至潔獻螻蟻之微誠仰祈上帝之是臨俯兾百神之咸集恩施幽隱敢期七祖之飛升福及賤微永庇百年之伉儷大道難名孰識盈虛之有微臣有感默垂覆宥之仁輒殫悃愊之私仰黷髙明之聽伏念人生以得男為喜孝子以無後為憂嗟冷族之不蕃痛私門之薄祐伯氏早亡而竟無嗣續微臣不肖而獨守宗祧爰從合姓而來深負傳家之念瓦巳三弄孤才一懸方居襁褓之中屢致憂危之患曽伸懇禱曲荷保全敢忘禳謝之佟少答生成之賜恭慿羽士式舉醮科用陳螻蟻之誠肅奉蘋蘩之薦允賴洪鈎之庇永延孺子之年頭角有成箕裘不遂坐消餘釁母煩命百藥之名克嗣先盟尚兾有二雖之慶代周元授非蘋蘩蕰藻之至潔雖君子不能薦神儻齋戒沐浴之或修而惡人而可祀帝遙望九霄之雲路恭焚三界之妙香願伸悃愊之私仰報穹隆之德伏念臣某有生匪宜為德最涼善不積以致殃動輒成于得咎世人𣣔殺隂幸其災造物見憐屢赦其罪頃緣闔族咸遇厄年屬土木之頻興懼隂陽之有犯妄懷請禱果致蒙休逮蒲栁之既衰覺門闌之多釁殘生薄祐存遭橫逆之憂孀女來歸復染沉痾之虐幾縲絏之不兑分溝壑之是填訴衰痛于查微荷恩私于影響念呼天于前日𢾗至于三思反本于此時心宜克一恭延羽士虔舉醮章寓禮意于庶羞逹精誠于有昊百神咸集列宿來臨居髙之聽甚明臣既蒙恩于疇昔禍淫之理不昧臣當改過于將來代萬叔永疾痛倦辱則呼天幸延殘喘齋戒沐浴以祀帝用酬大殫輒恩悃愊之私仰黷高明之聽伏念臣比緣暮景頻遇厄年病侵犬馬之軀殃及箕帚之妾雖肘後之方屢閲而竈中之藥不靈蒲栁非堅憂風霜之莫保糟粳至賤懼溝壑之是填窮故懷反本之心病斯有請禱之事自伸丹悃果荷洪休命咸獲于更生喜旋臻于勿藥不特脫負薪之慮又將舒就木之期顧茲感戴之誠敢怠苾芬之報恭臨仙宇光啓道場仰期上帝之是臨俯兾百神之咸集俾萬靈之蒙福碩七祖之超生赦臣無窮之罪愆寬臣有限日月洪惟有昊顧常居髙而聽之卑庶使餘生尚可耕前而耘後又代黃詞肖茲形質既蒙持載之恩禱爾神祗又荷生全之賜敢伸愚悃恭叩地靈伏念臣蒲栁之姿易凋桑榆之景多患頃與糟粳之偶咸罹屯蹇之災深疑獲戾于幽明將恐併命于朝夕心妄懷于請禱躰咸脫于沉痾顧茲螻蟻之誠敢忘豺獺之報壠耕而登黍稷澗采以奉蘋蘩倘蒙后帝以見歆庶俾百神之不吐頭童齒豁尚貪須臾之生山髙水長難報博厚之德代劉仁叟痛則呼天意不忘于反本病斯請禱情蓋迫于為親輒殫悃愊之私仰黷髙明之聽切念臣某兹者伏緣父某齒當遲暮躰卧沉疴屢費醫巫未去韓公之瘧徒勞祝史莫禳齊景之痁職雖勤于問安效未收于嘗藥深懼枽榆之暮遽凋蒲栁之姿靜念厥愆孰貽伊戚豈私門之多釁故隂譴之莫逃或因丘壠之營有戾隂陽之理塹山谷而下傷地脈冒刑禁而上犯天星積邪氣以姦和致衰年之在疚臣忝居子職忍視父憂退思請命于百神孰若祈衰于上帝恭慿羽士虔醮設科少伸螻蟻之誠薄致蘋蘩之薦仰祈洪造默覆湛恩赦臣門巳往之愆賜臣父更生之命居髙聽邇誠倘逹于彼蒼禍散殃消喜佇看于勿藥疏文雙蓮潭請水疏旱魃為虐千里起望雲之心精誠所加匹夫有動天之道輒殫哀悃仰叩靈潭切以歲丁六甲之窮夏有四旬之旱嘉榖垂成而一旦俱稿蒼生失望而寸心𣣔焦曩憑三寶之威神逺詣雙蓮之靈宅求一勺于淵潭之內謁百神于廟貌之間雖旬浹之已踰曽禱祈之莫應甘雨彌閣亢陽益驕豈斯民積釁之所招抑上帝至誠而難感人無為命惟填壑之是憂龍亦何心乃在淵而弗救志未伸于一請理必至于再求伏碩走雷霆于俄頃之間興雲霧于呼吸之際亟下霈然之澤坐消太甚之災霖此稿苗尚有勃興之望救茲黔首免為轉死之徒倘副微誠敢忘大賜明慶教院請講疏釋迦説法祗樹一朝地闢天開智者起教于台山乃千古風清月白自鶴林之􅓦滅暨佛壠之凄涼孰知覺路之歸罔識真心之在有資上德為發微言共惟某人大講師脫迹儒門潛心釋典躬服名師之訓屢從哲匠之遊大明止觀之淵源深悟法門之旨趣緇林駐錫聳頭角于東靈法座橫經振聲名于西掖久握元珠而自照碩施甘露以旁霑况潛澗之道場實慧光之古剎念久虗于蓮席思大振于潮音光我家風還他作者翕爾群情咸快如披雲霧以觀天咄哉小子何知可笑蚍蜉之撼樹因道心之無爭見慈德之有容幸副衆緣一佛事惠政橋施水疏人惟惠政之懷度橋者有如歸市道多暍死之患得水者勝如救焚創隙地之𢾗椽汲甘泉之萬斛有資好事共結善因分金溪不涸之流為樂邑無窮之施利霑居室奚煩鑿井而得泉澤及路人不必望梅而止渴館頭甃官路疏樂邑江山素號東南之勝館頭驛道實為來往之衝積水潦以傷隄致官私之病涉𣣔救泥塗之辱輒興畚鍤之工有資槖金以伐山骨共植無窮之利寧計不資之財將使濘不陷車遂無六十里之患庶幾岸弗為谷何止三千年之長小小園覓花疏伏以名利區區何足為樂園林小小聊以自娛彭澤之徑方開草堂之花殊少廣求異品遍扣名園輒效栁州因談笑而為故事無忘宣子碩封植以比甘棠淵源堂上牌文伏以黨有庠而家有孰幸逢教化之興伏其几而升其堂敢負淵源之學况剡溪藴秀之地有汝南家訓之存詵詵子弟之趨庭亹亹父兄之樂教堂軒並建齋室宏開集群彥以論文館同襟而恢義富而能教事實可書遂廣采于篇章用一新其標榜伏碩上牌以後益須富學佇看輝聲襲謝客之風流猗蘭擢秀種竇家之隂德丹桂聯芳凡屬遊從共增歡慶祭文祭孫子尚文昭皓開封人紹興乙丑卒于會稽年三十二嗟嗟子尚君亡矣夫千里風傳真乎偽乎謂果然耶君氣如長虹貌如明珠才如錦繡語如瓊琚躰有四乳之竒目無再閲之書意造物者不偶然而生之必將冨貴其形軀豈青春之方壯不霑一命而云殂謂果不然耶鄉人西還訃音不虗謂君𥘉諧和鳯之鳴日更晦朔之餘死于鵬告賈生之月而地于勾踐之故都嗚呼悲乎吾平生道義之故人果為異鄉之新鬼乎自聞訃兮十日晝痛哭而夜欷歔豈無友朋知心巳無白雪陽春歌誰和子流水髙山彈誰聽豫君歸不留孰為我徒長記與君從容聮席于金溪之日涕泣分𬒮于白沙之𥘉付悲歡聚散于一夢閲十年如過隙之駒我匏繫于簫臺君萍飄于太湖渺天涯與海角歎影隻而形孤前年仲春書傳鯉魚謂將從伯氏于天白必命駕而尋吾念君不負于一諾固嘗辨雞黍而掃吾廬望車音兮杳杳鬱吾懷兮不舒豈千里之期不可審而行止有非人所能為者歟吾亦謂二人齒髮未衰而後會必有豈知一别而死生殊途天乎痛哉天乎痛哉某罪逆殘生縗絰未除不獲效巨卿之執紼訪元伯之輀車慶招提明君嘗寓居意神魂之或在奠一束之生芻祭姑丈季公佐鳴呼吾鄉老成日就凋零尚餘幾翁踈若晨星𢾗點光芒旋覺微滅天不慦遺公又奄忽耆年舊德孰在鄉評紛紛後生無復典刑嗚呼哀哉仁者宜夀公夀未足六十四而公在化為促善人有後公後必興佩詩服書蘭玉滿庭人皆謂公德如燕竇五桂未芳公弗及候我獨謂公死目可瞑含笑九原少遲子榮人或謂公死有遺恨仲婦且歸公弗及見我謂不然仲子最賢必全孝道以終三年嗚呼哀哉昔我先姑獲配君子云胡不淑壯年而死我從稚髮出入公門誨我撫我如姑尚存公今既亡我寧不涕前人風味傷哉孰繼念公永歸無復還期公神在天思莫見之公魄在棺愛莫起之奠以永訣疇堪此悲族人祭十四伯母文嗟吾宗之薄祐兮綿七葉而未昌保先業而不墜兮猶不滿乎數房念伯父之在昔兮能勤儉以自將獲夫人以內助兮措生涯于小康家克成而莫享兮痛嗣續之早亡化門户而為異姓兮咎往慮之匪良鬼求食而卒餒兮嘆後祀之凄涼幸孤女之僅存兮歸躰魄于故岡羅棺前而設拜兮酸子姪之腑腸悼吾宗之不幸兮抱無窮之痛傷又代女壻嗚呼生女不生男古人不幸而發此憂愁無聊之語也何吾先丈人之積善有夫人為之配而亦罹此苦也先王制禮大宗無後必繼之以小宗之子也何後世之甘心滅絶而莫知乎此也舉千金之産而卑之異姓此猶未足訛也忍使祖宗求食而餒同乎若敖之鬼也夫人腹生五女某幸娶其季也平昔登門曲荷恩私念啚報之無地也矧使折其囊槖取其膏腴以為巳利也今焉曲盡送終之禮而不敢辭亦固其義也劈踴哭泣哀而送之者乃二孤女與吾僚壻也靈輿前邁道路感傷不見孝子慈孫為夫人二涕也祭毛叔度主簿文嗟嗟叔度誰謂子乎死也哀哀蒼天禍何至乎至也以子之聰明俊邁軒昻磊落固宜致逺大而躋顯仕也豈青春方盛一分官况遽為新鬼也昔顔回生不遇時而短命賈生處非其地而傷生王楊盧駱之徒器識不足以逺到死固其理也子有回之善而時非東周有誼之才而地非長沙有王楊盧駱之文而器識過之奈何年亦不多乎顔賈而命僅同乎四子也而今而後吾知造物者之無情有才者之無命富貴夀夭多不在此而在彼也昔吾年未冠而子方志學黃卷同彼短檠共照相期以古人相待以國士也童子雕蟲我拙子工子果凌雲我終不能繼風騷之靡也事業麟經我踈子明子果得泉我終不能探謹嚴之旨也招仙賦詩瀑水聯句子歌陽春我必和之以巴詞之鄙也我愚我𥚹動多忤物子慧而寬容能我失我嘗自目曰狂而命子以逹子不以有餘者自多我常懷不及之愧也賢關行藝蘭省聲名子先著鞭我猶未能攀逸軌也邇年以來出處稍異我因贏糧子棲枳棘偶家難之各丁幸殘生之未滅方期握手以更弔誰謂訃音之驚耳也子有親喪在殯慈母在堂兒糿而孤婦少而孀意子目不及瞑而􅋦恨無巳也然子讀古人之書逹死生之理窮逹夀夭等一夢耳假令彭𣆀其年伊呂其位大都不過𢾗十寒暑亦無此身矣子固宜安其不幸從先大夫于萬里也又代周元授嗚呼悲夫子胡為乎而止于斯也人孰不為子悲莫甚乎老人之私也我昔識子于年少期子之不凡知子之貴不疑也巳有息女年猶未笄命執子之箕帚奉子沃盥之匜也子方蜚妙譽于賢關馳大名于省闈人爭貪于擇臠子不慕于牽絲也一諾千金斷然不移子之風誼非古人其誰為吾鄉不振賴子以光輝吾門薄祐賴于以扶持也婦翁女壻義同半子而我于子情實倍之去也歲仲春赴官丹丘吾嘗遣吾兒以隨也瓜期未半坐席未暖遽罹家艱而零丁以歸也人皆謂子年方少壯志方逺大佇俟祥琴千里奮飛也豈期一疾奄然長逝而莫追也子病之革念𣣔見豫而豫不知也及扣門而子巳絶心懷不見之恨涕有無從之揮也豫髮種種豫鬢星星死灰其心稿木其形今又失子生亦胡為也吾當忍死畢子後事勉吾女以共薑之節勿奪其志庶無恨于柏舟之詩也子之孤始三歲俟其免水火脫襁褓教之育之會有成人時也亦有天地鬼神臨在上質在旁吾言不欺也祭潘先生文紈袴不餓儒冠誤身吁嗟先生乃爾邅迍何負于心何罪于人何命之不淑何天之不仁何才之豐而命之嗇何氣之壯而志之湮先生之文也浩乎如韓愈之無涯先生之才也飄然如謫仙之不群弄翰染墨也季義山之險怪絺章繪句也廋開府之清新蕭瑟乎東野之寒􅓦寞乎原憲之貧鬱鬱乎鄭廣文之坎軻栖栖乎杜陵老之酸􅉝北窗萬言曽不直一柸之水豈非命壓人頭蓋不許其伸也耶二十餘年淹徊海濱孰學道而不先生是師孰擇善而不先生是鄰主盟吾鄉之綘帳作成吾黨之斯文紛紛後生頭角璘珣夫豈自賢非教曷因施厚報輕痛何可陳投老西行備嘗險勤小戰輒衄大期遽臻戲侮有揶􅮈之鬼除禳無鬱壘之神酒柸多握手之交蓋棺無慟哭之賓幸有嗣之可托賴葭莩之懿親某等摳衣最久辜恩最甚今日之奠巳不及哀矣從傷血淚之沾巾祭陳景韶文嗟嗟吾丈命止斯耶半世而亡云胡不嗟吾丈平生真可人也胡為天年不少相假昔在妙齡父兄早亡惸然一身遂克肯堂生涯既饒襟義彌篤指廩高風鄊人所服賔客過門歡笑迎逢賢如北海尊常不空酒柸流行詼諧談謔坐有車公人誰不樂晚年風度比迹東山自謂醉翁不在酒間賤子區區曽獻衷曲𥿄上遺言猶蒙記録嗚呼哀哉皎皎雙珠俊秀有餘人謂君家三卋詩書指人有日振耀門閭公胡不留以待安居嗚呼哀哉春秋方盛自知必死手書後事以貽厥子易簀之際了然可喜古之逹人未必如此賤子不肖辱知最深疇昔登門曲荷開襟拜違經年忽奉訃音臨棺大動涕泣能禁寒食祭始祖文昔我始祖西來自杭避地擇所山林遁光今二百年子孫寖昌善苟不積流何以長鬱蔥佳城爰在此岡乃與夫人髙下異藏祔􅌾纍纍喬木蒼蒼寒食拜掃禮修故常紏合宗族共酹一觴祭始祖母文昔我始祖來居左原夫人相之以有子孫歷載二百墳墓尚存中間偶遺幾忘大恩訪而得之了非妄言乃與始祖髙下異墳兹遇寒食坡荒薦繁庶使百世不忘本根祭孟丙文嗟嗟孟丙吾幼兒也七歲而亡吁可悲也汝生而眉目分明神氣清秀骨有伏犀之竒也聲音琅琅語話了了而世事稍稍能知也吾與朋友講習二兄侍立而汝必隨也吾徒數十人汝類能識其姓第名字退而品藻之於其私也吾謂汝早慧如許他日必未昜量豈意止於斯也吾之所飲恨者玩汝之病救汝之遲也𥘉亦謂汝起止輕健豈數日之間遽至弗支也生於村落所恨苦者無妙藥良醫也致汝無辜由我之罪茹苦抱痛無窮時也當汝之死家禍方稔而仲兄之勢尤危也吾方愴惶驚怖不得盡下殤之禮以􅌾汝繞墳三匝以苦汝情雖鍾而恩巳虧也汝今死巳百日矣汝母方獲視汝之墳而吾方獲祭汝以詞也汝昔在襁褓婆鍾愛汝今祔􅌾于側魂魄必有依也汝父母親戚朝夕哭泣以思汝夜常夢寐以見汝兾汝有再生之期也天地鬼神黨憫汝之橫夭釋我之罪愆使汝復為吾子以慰莫景之思也汝或夤緣未斷魂識有知當隨父母以歸也祭支夫人文某稔聞夫人有勤儉起家之德亨富夀康寧之福昔嘗過其門閭恨無登堂之階邇來夤緣多幸獲預葭莩之未始登門於去年之春然是時夫人之次孫寢疾巳革不敢伸候見之禮逮去年之夏來哭夫人之孫之喪始獲見於稠人之中然時方哀痛雖𣣔奉觴而不可得姑少遲之以俟他日今乃遽聞夫人之凶訃匍匐而來而夫人已蓋棺矣某以通家之故期歲之間足三及門一以問疾二以弔喪竟不獲少伸為夀之願乃以一觴而奠訣人世如此吁可歎哉代祭宋彥才文二首念吾鄉之耆舊所餘才二三人嗟浮世之年齡自古稀七十者况善人相繼而淪沒俾後生亡得以依歸衋爾傷心澘然出涕惟公望傾士論德冠鄉評妙齡接步於青襟白首遊心於黃卷殖千金之産治生不羡於陶朱戲五綵之衣色飬未多於萊子優遊窗几組繪篇章有貟外之遺風恨錦𫀆之不奪繼廣平之餘韻賦梅花而甚工讀方外書有文選學唯以一經而教子不求五斗以折腰尚期羔鴈之招幾在枽榆之晚豈意海漚之遽滅堪嘆朝露之昜晞過眼百年轉頭一夢某居聮枽梓世續葭莩蚤從蘭玉之遊曾快雲天之覩家聲不振愧同北阮之貧人品甚微謬辱東牀之選拜門蘭之未幾俄簮履之遽違徒然肝膽之摧莫遂丘山之報撫棺有􅌤掩𬒮何追聊伸半子之恩薄致一觴之奠嗚呼人生百年兮長短幾何吾鄉故老兮零落無多月落天池兮夢斷南柯丈人一往兮迅若飛梭明朝理玉兮湖山之阿月魄氷魂兮誰共吟哦輀車屆道兮薤露興歌臨棺奠别兮涕泗滂沱代諸生祭周仲翔母文嗚呼孟母不生三遷教墮婦人義方麟踈鳳稀伊昔汝南家聲尚微刀筆是傳詩書罔知夫人登堂潛歔默欷曰我有子非儒曷歸仲子妙齡秀目踈眉喜謂良人兹乃佳兒罄我槖金給爾師資手調㷱膽志在荷衣皎皎明珠長浪益竒業勤藝苑心探聖涯高視雲霄平步可期前日賢關小敵偶遺千里言旋慈顔不怡謂胡弗留再戰秋闈去雖倚門歸𣣔斷機賢哉夫人前烈可幾雅志未酬浮生遽違蓋棺不瞑有識興悲嗚呼哀哉某等忝交蘭玉屢拜賔墀賢非房杜濫對酒巵尚期他日一鶚髙蜚鯨吸賀樽歡動庭闈孰謂一朝人事成非隻雞斗酒泣奠靈帷嗚呼哀哉男子剛腸不妄涕洟今日澘然為賢母揮代諸生祭陳元佐父文嗚呼十載之前吾邑父兄汨于流俗聞見弗明詔厥子弟惟利是營惟刀筆是傳惟儒冠是憎雖有良能莫克自興孰先義方孰始過庭樂善惟公教子以經矯矯家督早蜚俊聲兹千里西征惟公命是承豈私是名實惟親是榮凱奏未旋禍變匆嬰忍哉蒼天慘莫之勝所孤者不啻天地之重所圖者僅比毫髮之輕是詩書教子反貽公之恨而桑弧蓬矢之志足以明孝子之痛懲鳴呼哀哉某等辱蘭玊之與遊獲誨言之婁聽痛斯辰之蓋棺想銜恨而弗瞑奠一觴而永訣故血淚其如傾代祭季夫人近世以來人益天促吾鄉數月頻著弔服老而逝者夀罕及於稀年少者胡為名亦書於鬼録惟今日之弔夫人乃堯舜盛時之哭蓋夫人之夀幾九齡有內外重孫之滿目且富而康庶幾五福此固吾鄉近世之所無而夫人之所獨某母黨之親也惟夫人之最尊而某之不肖也又聮姻於華族施及兒輩葭莩相續三世婚姻恩重義復異慈顔之長在庶夀觴之頻屬胡今日之登堂奠生芻之一束如夫人之一死兮顧無可憾而親戚之心雖𣆀彭猶未足代諸生祭周仲翔父文嗚呼人孰無生生而不淑有愧於生亦孰不死死非正命有愧於死惟靈生為善人死於牗下是生死之間兩無所愧也然靈脫然於習俗之中慨然破黃金之籝諄諄然有意於教子也矯矯令嗣天姿秀偉力學而工文自修而近厚亦一鄉之善士也奈何鼓篋賢關較藝秋闈未遂厥志而靈不能忍死數年以待三釡之養此某等所以為靈興恨於此也代人祭族弟文嗟吾宗之薄祐兮如吾弟其無多方妙齡兮確有志乎琢磨將興家以詩書兮變習俗而丘軻苟歲月之少假兮持此心而匪他庶頭角之成就兮奚蒼穹之足摩云乎命之不淑兮遽不起乎沉疴凋朱顔於鼎盛兮脫緑葉於庭柯驚好夢於須臾兮委青春於逝波嗚呼雙親在堂兮鬢髮皤孤兒孀婦兮奈若何凛霜風於玄朔兮埋爾骨於山阿酹一觴而永訣兮覺老淚之滂沱代祭萬夫人文嗚呼婦人五福世罕有也天卑夫人獨何厚也東平先生以絃誦先吾鄉以莭行高一時賢士大夫爭求見之而夫人實為其婦也扶風府君溫厚儒雅至今鄉里稱為長者而夫人實為其偶也􅑕腹生珠藍田出玉一門四味如唐之穆夫人有子實昌厥後也禁臠竒才東牀佳士喜入門闌如唐之李夫人有女實獲鸞交也履柔順於一身逹孝慈於六親夫人之德固無咎也閥閲冠于鄉閭齒髮逮乎稀年夫人冨夀固兼受也湖山之南佳城鬱蔥夫人之藏當不杇也某忝葭莩之末欽聞懿德亦云久也今夕何夕奉兹窀穸登堂灑涕酹斯酒也代祭何升老文惟公名久聮於仕籍出處可書行素著於鄉評始終無玷門闌鼎盛蘭玉兼榮方期夀杖之迎遽棄板輿之養不遺一老莫贖百身某早緣桑梓之私重結葭莩之好徒深感德未遂承顔况遼阻於江山每濶踈於音問忽聞凶訃俄喪吉人巳嗟七日之非薄致一觴之奠慈容莫覩老淚徒揮代祭宋元明文嗟嗟元明君死已乎然歟否也謂果然耶君風貌堂堂世事了了以幹蠱克家而門庭昌阜何天與之才智而嗇其年夀也謂不然也吾入君之門胡不見其歡然而迎登君之堂胡不聞其夬語之聲七尺之軀乃魄然而在柩也嗚呼君果死矣吾鄉黨親戚中堂堂了了如君者不多有也君之父乃吾之舅吾之母乃君之姑而吾同氣之娣妹又為君之偶也吾與君再世通家遊從最久情好綢繆尚相期以白首也君強健如許而溘先朝露况吾蒲桞之姿又安能保其悠久也吾來撫君之棺弔君之母與吾之妹哀君之諸孤涕無從而奠以一巵之酒也代祭萬叔永文嗟嗟我公德尊一鄉宗族協和門闌阜康六子趍庭一桂先芳豈唯一門鄉閭之光賀客在廬弔客倚墻哀哉吉人命胡不長家君與公情好相忘婚􅊚世修如謝與王一二年來遊宦逺方恨不親臨元伯之喪家書有命遣酹一觴代祭余夫人文惟靈莭著孀居興共薑守義之誓志在宗祀有叔姬歸國之風生涯獨盛於慶門智巧反踰於男子恩尤深於婢獲庇潛及於孤遺於家曰能在婦為哲早歲克勤於負子莫年方慶於抱孫孰知驚悸之間遂致沉痾之甚一疾不救六旬遽終某等忝通孔李之家兼修魯衛之好雅欽婦德夙荷眷私華屋重來未改堂萱之緑玉容不見但聞風樹之悲觴豆薄陳涕泗交隕梅溪先生文集卷第十八
