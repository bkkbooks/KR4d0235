body:
  text: 啓答喻提舉樗備貟槐市濫接英遊載筆璃拗誤膺親擢與史館編摩之選叨經幃講讀之聮才素乏於寸長身曷堪於數聀靜惟僥冒端自吹噓某官一代宗師四方儀表飾吏必以儒者之術冝其有聲育材而得天下之英可謂至樂傳衣鉢者不知幾輩登門闌者皆第一人觀其拔士而得尤知其樂人之為善遂致狂妄亦蒙奬提見千里面目之書寵已華於衮繍記一人言動之實庇方託於帡幪答樊提刑光逺誨諸生於館下濫與英遊聀內史於螭頭誤􅈾親擢既與編摩之選仍叨講讀之聮才素乏於寸長身曷堪於數聀恩踰望外愧溢顔間某官諸儒範模群吏師表擅聲名于蘭省聳風采於柏臺帝嘉共理之良治務惟刑之恤飾吏以儒者之術存心得君子之仁北斗太山學者咸仰殘膏賸馥後人悉沾師友之選極一時詩禮之傳有二子誦髙文於方册未窺夫子之墻論末契於年家端在丈人之行故茲僥冒實自吹噓答溫州莫守伯虛某官天賦材猷家傳政學輟列星之髙選蒞二浙之名邦况先大夫有遺愛于此州而賢刺史復共理于今日變千里歎愁之俗繼萬民安樂之謡凡居蔽芾之隂率𬒳帡幪之賜故茲僥冒端自吹噓答木狀元待閣竊以君子六千人定霸咸期於一戰扶搖九萬里沖天遂冠於群飛真國士之無雙誠後生之可畏大名藉甚輿論翕然狀元氣稟東嘉心潛西洛探潔靜精微之旨工雄深雅健之文蚤蜚泮水之聲巍拾計臺之薦奪魁蘭省賜第楓宸䘖錦標而歸事端同於盧肇成赤壁之捷年正類於周郎振賦海之名家符漲沙之勝地極書生之榮而還故里盡人子之樂而奉雙親水緑蓮紅姑暫遊於侯幕氷清王潤行同集于鳯池蔚為邦國之光奚止鄉閭之慶某韲鹽舊業枽梓陳人濫陪鵉鵠之群親覩鯤鵬之化世當漢武而異人輩出非遇時焉致此乎才非靈運而作佛在先然其年不可及矣科第既以慁子冨貴行將逼人碩不負于君親當相期於逺大答黃狀元洽賢關校藝雅欽江夏之無雙蘭省掄材巍處眉山於第二雋聲藉甚輿論翕然狀元名間綺園才優盧駱翺翔乎教化本原之地沉潛乎疏通知逺之經説若稽古何必三萬言讀武成篇惟耴二三䇿見蕩蕩巍巍之為堯舜知灝灝噩噩之曰啇周倘借玉階必陳三陳之要俯拾地芥豈惟一經之明尚淹卓爾之才僅亞褒然之舉况閩有異人而素先虎榜黃為著姓而屢出龍頭綽有家風蔚為盛事某韲鹽舊業埸屋陳人濫陪鵉鵠之群親覩鵾鵬之化喜太學得人之盛快真才擢第之髙碩不負于明君當相期于逺業答丘狀元崈賢關戰藝筆屢掃於千軍蘭省掄材名遂參於三傑雋聲藉甚士論翕然狀元藴秀江隂蜚英浙右蚤遊天子之學獨抱聖人之經固嘗浚井而得泉奚止屬辝而比事明一王之旨兼耴左氏公羊髙榖梁赤之長觀三䇿之文庶幾朝錯董仲舒公孫弘之對巍折蟾宫之桂首探杏園之花衫鬢方青富貴巳逼答莫守賀冬伏以氣肇黃宫天地之心始見日行北陸君子之道將亨某官治有先大夫之風民樂賢師帥之政茂對一揚之復歡騰千里之謡某待次衡門阻趍賔宇遽拜緘封之賜倍增感愧之懷答溫守袁正言孚襆𬒳殿廬蓋適我碩兮之始懷章里閈正事其賢者之秋曽族賀之未遑遽朋緘之先辱俯懷愧懼仰佩謙沖某官蘭省魁儒芹宫哲匠卓矣聖賢之學粹然道德之容議論同乎古人文章蓋其餘事方權臣用事之日官冷廣文逮聖主當陽之𥘉席前賈誼擢自臺察處于諌垣言人之所甚難行吾之所素藴首破和議力摧姦謀有蓍龜先見之明凛松柏後凋之操君子以謂古遺直天下稱為真諌官十上固爭挺袁安忠正之莭一麾出守得謝公山水之州上方念之公其歸矣某蒙恩去國需次還鄊喜父毋之邦得神明之政汲長孺雅嘗慕盎臭味本同王仲宣兹幸依劉帡幪可托答饒州蔡通判麾出守迹濫厠於九賢同官為僚治實資于半刺禮過於厚緘來以朋共惟某官世襲衣冠家傳詩禮學古然後入政修身乃能治人宜所至之有聲諒無入而不得展龐統騏驥之足二番君山水之邦靡行終更即膺迅擢某誤𬒳宸命濫持郡符雅聞别乘之賢喜見天書之面通家自今日行登元禮之門異才非王孫誤倒蔡雍之屣答彭教授龜年一麾出守分符濫繼於九賢同官為僚問政尤資於半水禮過於厚緘來以朋某官秀稟丹丘名髙太學擢千佛之科第有二難之弟兄學探聖賢而志益勤文髙流輩而進未艾顧此番君之故國實維筮仕之舊遊昔宣彩棒之威今長杏壇之教諸公稱其慱治多士資其範模巳遂終更佇膺召擢某濫𬒳宸命誤懷郡章自慙么麼之資輒拜寵褒之賜及瓜巳久莫諧聮事之歡行李尚留庶有見賢之幸答池州韓守元龍符分鄰壤未登元禮之門書拜朋緘如見荆州之面禮過於厚分何以堪某官生自相門妙有家學業襲簮紳之舊才傳經緯之餘小試銅章茂著循良之績榮持使節深知耴豫之冝咸嗟驥足之久淹姑卑雄藩而共理皂蓋東遊而邦人共喜黃堂坐嘨而郡政自平罔俾文公專美袁潮之政寧容子厚獨稱曄泰之賢靡待終更佇􅈾召擢某才居下下志在休休有慙江左之家風誤辱楚東之名郡撫封不逺碩修接境之歡甲子雖雌敢論同庚之契答新靖州杜守明倫守番君之國顧庸繆以何堪逰鄭公之鄊依仁賢而甚幸禮過於厚緘來以朋共惟某官名重楚東氣鍾杜固習家傳之詩禮冨天賦之材猷自郡章之既懷惟吏事之是憲居邦必聞政稔觀九賢之風學道則愛人優為千里之治預懷杜毋之德想見靖人之心次巳久需來何太莫某科名濫竊符竹誤分自慙么麼之資仰荷吹噓之賜見尺書面目固已知賢登通德門闌行將承教答白待制某官逮事三朝榮聯次對與刑猶在有靖康賢相之風文采可觀本長慶詩豪之裔奉真祠於番水繼髙躅于香山頥飬遐齡鼎來多福况聖君思故國之喬木而先正有克家之象賢行以蒲輪召還荷橐答沈運使樞符竹濫分方託帡幪之庇鱗鴻逺屆遽頒面目之書盛德謙光朋緘過厚共惟某官學傳既濟文繼東陽柏臺飛半豸之聲蘭省應列星之象七閩持憲了無囹圄之冤兩地效官潛贊廟堂之畫方聖主重外臺之寄以大賢居將漕之權洞曉利源錢已流于地上深憂時事虜其見於目中宣室興思蒼生望起某天資不敏吏事尤踈臺評類韓愈之譊譊治考同陽城之下下罪甚多矣部刺史想必能見容行或使之賢大夫恐不得終事答陳總幹損稽山逰宦屢修同舍之歡番水得書如見故人之面禮過於厚緘來以朋某官氣稟劔津名蜚槐市然膏油而讀紙上語耴科第如摘頷底髭弟兄可謂德星丗家不忝忠肅昔宣威于吏隱今贊畫於總司績效有聞冨貴將逼某誤膺宸命濫把郡麾託末契於年家借餘光于幕府顧兾北群空之馬致千里以奚難同江東日暮之雲對一樽而未遂答賀樞蜜伏審光膺帝制榮陟元樞播告之𥘉邇遐胥慶共惟樞密參政白首一節赤心四朝爵齒德俱為可尊直剛人得其所飬昔焉勇退無愧鑑湖之髙今也來歸不異蟠溪之起顧用舍行藏之際實安危治亂之機大臣以道事君春秋責備賢者不出則已必有可觀碩如魏鄭公展盡底藴咸望謝安石大慰蒼生茲輿議所期于公非十朋敢私其祝答趙通判一麾出守至仁仰戴於堯天同官為僚可愛欣逢於趙日禮過于厚緘來以朋某官巍折桂枝榮聯玉葉振振周家之公子惓惓漢室之忠臣為善最樂而得于家傳稽古入官而非以政學姑屈神明之胃暫淹州縣之勞番君得江湖心嘗令兹邑龐統展騏驥足來監此州行起宗英入扶王室某誤恩得郡亡術治民閲三月而政未成思九賢而夢不見喜可知也幸王事之獲聮爭先覩之與邦人而共快答樂清權縣求司法乎寬守法雅聞三語之賢愷悌攝官優布一同之政禮過於厚緘來以朋某官天賦吏材家傳政學于公世有隱德釋之獄無冤民考巳及于書三人咸思于借一蕞爾樂成之小邑久哉令尹之乏人貪有至于賊民懦或聞于畏吏口南金而守明府有類真源律大法而禮人情兹逢卓茂允賴循良之治來綏凋瘵之民覩必爭先聞猶失喜某逺遊江左承乏楚東幸父母之邦得神明之吏故鄊雖逺未聞言偃之絃歌歸興巳濃及見河陽之桃李答荆南李太尉適夔子之邦方將問政識荆州之面何待封侯某官裔出隴西群空兾北稟漢將無雙之氣懷周臣不二之心邁方略于孫吳為國家之英衛受知於上屢持大將之權開府于荆益重長城之寄虜不敢動時方賴公某之任逺邦假塗重鎮觀尺書之面目喜其可知聞萬福之威名見已大晚答歸州周守聲迹相聞同處浙江之左封疆非逺並逰巴蜀之東緘來以朋禮過于厚某官詩書奕世簮紱傳家挺秀氣于三衢馳英聲于列郡展騏驥足嘗佐苗人之邦分銅虎符遙臨楚子之邑化已形于千里治未及于期年更不俟終召其非晚某備貟番水易任夔門將假道以觀風且登堂而問政面目之書巳見喜得其人唇齒之邦是依言歸于好答周運使行或使之難方歌于蜀道喜可知也夢已見于周公詞觀三峽之流書覩千里之面禮過于厚緘來以朋某官姬籙傳芳坤維挺秀文非少而且重厚藝雖多而不吝驕才學俱髙子雲相如之徒也名德兼著君平仲元其人歟藹蜀郡之鄉評最普慈之治績方聖主啚中興之業以大賢居將漕之權弭使節于一川揚仁風于列郡以身化下小攬轡之范滂用義理財鄙流錢之劉晏矧輿議之素屬豈計臺之久淹更不待終召其非晚某備員番水易任夔門將入境以觀風且登堂而問政叱王尊之馭險不憚于登天依韋皋之賢易端同于履地答查運使三峽倒流難敢辭于蜀道一麾出守芘端賴於蘇天荷友義之素敦愧朋緘之誤及禮過於厚情何以堪某官先朝名家今代人傑然膏油而讀𥿄上語取科第如摘頷底髭學兼通於古今才兩備於文武明目張膽陳治亂於天子之前論將談兵贊籌畫於元戎之幕輟握蘭之髙選膺將漕之重權弭使節於一川揚仁風於列郡飛芻挽粟姑心計之暫勞簮筆荷囊諒超遷其非久某備員番水易任夔門首蒙千里之書喜見故人之面叱王尊之馭移孝子為忠臣依韋皋之賢視青天如平地答吳參政一麾出守蕃宣濫處於上遊同官為僚謀議允資於先逹禮過於厚緘來以朋某官場屋舊人江湖名士身荐歷於中外學兼通於古今登科五十年親見先朝之盛摶風九萬里上至列星之躔凡後來待荷簮筆之流皆前日含香握蘭之選孰謂諸候之賔客乃屈四朝之老成更豈待終召其非晚某自番君之國易夔子之邦久違數仍之門墻忽見天書之面目以幕府而待杜老豈同嚴劍南避正堂而舍蓋公願效曺相國易夔子之邦答施州甄守援三峽倒流方嘆川塗之險一麾出守遽蒙箋翰之修德厚而謙恭過於禮某官中山華胄西蜀良家才兼文武之全性稟忠義之實矯命制難陳湯有得於行權投筆立功班超宜侯於定逺既龍韜豹略之屢試姑皂蓋朱幡之暫乘控巴地之上遊守清江之名郡化巳形於千里威且震於四夷更靡待終召其非晚答周運使老向巴人方起杜陵之嘆憂銷王粲幸依劉表之賢使已近於光華禮將勤於吐握某官道師孔孟才配卿雲金門玉堂謂踐揚之已久木牛流馬奚飛挽之尚淹詔將下於蜀天公其歸於魏闕某敬拜宸命行趨計臺愧謝牘之未修辱賀緘之先及同西州之士碩承教於鄉先生與列郡之民咸託芘於部刺史答茶運使渭北江東起日暮春天之嘆烏蠻鳥道同孤城絶塞之逰行或使之喜可知也某官雁塔前輩麟臺故人既臭味之素同亦行藏之不異愛君憂國抗章如出於一心持節分符逰宦相從於萬里某敬拜宸命將趍計臺愧謝牘之未修辱賀緘之未及傾蓋如故久論程孔之交呼酒勸君行講韓張之好答潼川運使何舍人番水期年治亡善狀夔門萬里地竊巨藩揣庸繆以何堪恃髙明而自尉某官學本自得才尤不群道造子思之誠氣飬孟軻之浩傑立角出於永嘉多士之地難進易退於權臣用事之秋翕然稱鄉先生卓爾為天下士分符持憲不辭蜀道之難憂國愛民寧羡錦城之樂某叨預梓里稔聞月評仰齒德爵之俱尊喜風馬牛之相及叱西州之馭移孝子而為忠臣依韋皋之賢視青天其如平地答前四川茶馬續修撰觱國逰夔子稔聞舜友之風地過荆州未識韓侯之靣目仰瞻於數仭遽下拜於雙緘某官虞庠舊人晉國竒士仕途歷三十年之久鵬程搏九萬里之髙牧民如牧羊為治素同於卜式問人不問馬存心無愧於宣尼坎則止而流則乘仕不喜而已不愠求田問舍孰云不高結綬彈冠亦何足慕優遊里巷頥飬年齡然朝庭方思老成况天下咸仰齒德宣室未前賈誼蒲輪必起枚生某涉世最踈蒙恩誤寄方觀風而入境思問政以升堂庭過伯魚竊效陳亢之喜書傳雙鯉益嘆玉川之賢答沈待制調屢上詞章誤得股肱之郡未修竿牘遽觀靣目之書緘來以朋禮過於厚某官望隆苕霅世耀貂蟬八詠逸才真隱侯之華胄一門盛事實故相之難兄嘗分浙右之符尤著閩南之績奉真祠之巳久奚從橐之尚淹行起老成以尉中外某閫分絶塞地易近藩將入境以觀風且登堂而問政歸自夔子國幸風波之巳逃逰于鄭公鄉庶罪戾之可免答劉大諌屢上祠章誤得股肱之郡未修竿牘遂觀面目之書緘來以朋禮失之過某官學貫今古心潛聖賢樂道幾於屢空飬氣本無以直然青黎燭讀異書於蓬萊詠白蘋詩起清風於苕霅當龍飛乾道之始正鳯鳴朝陽之秋官居諌垣色正朝路稱堯舜者無非孟子誰與王言指恭顯者豈無京房孰若公勇直道而去令名益高爭無愧於七人貴奚煩於五馬然臧倉存而魯侯不遇既承璀去則李絳必來益輸畎畝之忠往贊岩廊之治某叨與同舍素蒙異知迹雖隔于江湖心不忘於館閣答凌尚書兩朝重望一代儒宗擢第若摘頷髭巍中甲科之選理身如梳旦髮了無纎垢之汙時可用而則行道無入而不得入則懋立朝之節出則騰治郡之聲退之以薦賢為心天官惟允行儉有知人之鑑吏選尤精方聽履而上星辰遽銜杯而樂賢聖久淹家食想􅏅宸衷佇繇八座之尊拱拜三公之貴其頃以晚進叨居下僚逖矣門墻之違巍然山斗之仰與沈尚書易郡而東誤得股肱之重去天非逺喜瞻喉舌之尊行逐登龍敢先致鯉某官書讀萬卷名登兩科負賈生通逹國體之才有韓子涵泳聖涯之學言無發而不中最髙北闕之書治所至而有聲尤振西州之譽上意每注於安危之際公色不變於榮悴之交人才甚難今日有幾况當寧方興衰而撥亂豈重臣可置散以投間諒興宣室之思即起東山之卧某為學最淺受知實深賢關首與於陶鎔詞掖誤蒙於薦引去門墻其巳久仰山斗而不忘行由或使而身竄於夔喜亦可知而鄉逰于鄭事大夫之賢者竊效古人之居邦就有道而正焉庶幾君子之好學答姚子才荐蒙肯顧寵示長箋豈惟嘆駢四儷六之精抑亦見聞一知十之學方觀韓子送何堅歸道州之文端賴淡臺助言偃為武城之治尚容再見以馭謝私答章教授日邉得郡寄千里之股肱魚腹有書見五年之靣目禮過於厚分非可堪某官挺秀相門蜚聲帝學文法漢而尤古詩擬騷而更工衣冠盛唐室之蕭詩禮傳孔庭之鯉滿門科第繼元佑省闈之風異日功名嗣慶曆名臣之頌學無入而不得辰何來之太遲窮年屹屹膏油業已精於韓吏部諸公衮衮臺省官豈冷於鄭廣文名譽巳崇富貴將逼某燈共庠序年同逺巡懷高山流水之音起日暮春天之嘆逺官夔子國幸巳脫於風波來逰鄭公鄉庶可逃於罪戾答泉州交代周參政千里分符叨繼重臣之後雙緘拜賜輒為盛德之先覩鳯有期續貂為愧共惟某官學術荀杯人才卨夔昔遇上皇聳風采於臺諫晚事聖主贊謀謨於廟堂久均逸於巨藩暫飬高於琳宇如昔者大老之二兼天下逹尊之三盍歸乎來爰立作相某不學亡術見賢思齊將入境以觀風碩登堂而問政竊比曺相一遵蕭何之規真見周公不比宣尼之夢與福州王參政五載三州方幸投間而置散一麾千里又叨宣化而承流顧大邦雖非小子所堪然便道有見先生之喜共惟某官性天小卓材地閎深道扶孔孟而襲其傳文追楊馬而為之配變儒風於兩學最治績於四川榮長諌垣所陳無非大事巍參政柄有告必以嘉猷方蹇蹇以立朝遂營營而去國四海咸兾其復起七閩豈得而獨私盍歸何來如古者之二大老無出其右兼天下之三逹尊碩趣曺裝即膺漢詔某門闌下士學校諸生蚤親模範之工遂玷簮紳之寵兹濫膺於劇郡幸密隸於崇戲欲問為邦竊自比於顔子願言承教終不叛於韓公答趙知宗五年三郡方幸投間十劄十行又叨共理逺辱朋緘之及仰欽謙德之光伏惟某官派出銀潢名髙玉牒術業炎劉之歆向勳謀仙李之江河兼爵齒德之尊有風雅頌之好帝眷尤甚宗盟有光况惓惓忠臣不忘畎畝之念俾振振君子咸陶麟趾之風佇觀昌魯之季孫行作相周之衛武某昔在越絶獲知宗英屢陪觴詠之逰久闊笑談之樂不謂晚塗逰宦重遇平生故人將使泉南復繼蘭亭之盛不令坡老獨稱安定之賢答蔣教授不學亡術繆懷刺史之章同官為僚行詣廣文之舍禮過於厚緘來以朋某官姬籙傳芳莆田挺秀深究群經之旨早聮千佛之名登科蓋巳十八年讀書何止五千卷眷此清源之郡雅為逰宦之鄉昔鳴子賤之琴今主馬融之帳化同魯國諸生咸采於藻芹文振歐陽髙第行登於龍虎官豈容冷詔將𬒳溫某立朝甚愚為政尤拙巳五年而三郡又千里而一麾將入境以觀風且升堂而問道見尺書之靣巳得其人遊半水之宫碩咨以政答興化陸教授五年四郡誤懷假守之章千里尺書快覩同年之靣禮過於厚緘來以朋某官秀挺三山風髙二陸才蓋由於天賦學况得於家傳搏風宜上於天池采藻尚淹於侯泮眷兹莆水實為冠帶之鄉冝得宣公以昌仁誼之學官豈容冷詔行𬒳溫某符竹濫分寶鄰是賴方驅車而假道碩問政以登堂誦十年尊酒之詩辰乎何速見千佛明經之士喜也可知答任運使五年三郡方幸投間一扎十行又叨共理首辱朋緘之貺仰欽謙德之光某官秀挺三山名髙千佛飾吏必以儒術修身本乎誠明色正霜臺風采稔聞于半豸位分卿月禮樂咸資於一夔入則居清要之官出則為光華之使著治績於數路藹歡聲於七閩姑為轉餉之蕭耻作流錢之晏苟非仁義固未嘗陳於王前其在朝廷又孰敢於諸任齒使軺暫屈召節䁀來某涉世最踈辱知素厚千里誤分於符竹二天仰賴於帡幪教化美而風俗夷小諸侯敢不自勉撫字勞而催科拙賢使者必能見容答石察判起宗巍中亞魁榮歸故里大䇿聳傳於多士長箋寵及於陳人事甚盛而獲觀喜欲言而不足某官家傳萬石譽擅七閩志雅在於奪標射果聞於中目詳觀切直之對深得茂明之宜雖䇿勳有蕭一曽次之或殊然公議以王後盧前為未愜清泉𬗋帽遽改觀於溫陵緑水紅蓮聊宦遊於越絶佇自賔幕即登道山某幸兹分符叨與勸駕果遂郊迎之語薄攄簮盍之誠式遄其歸策親之樂孰加此不負所學許國之忠其自今答郭縣尉榮擢巍第言旋故鄉荐蒙都騎之臨重拜雄文之貺老獲觀於盛事喜實倍於常情某官經傮獲麟文冠薦鶚蘭省復居於前列英聲益重於南州暫淹龍虎之美名姑作神仙之隱吏力蓋由於稽古人咸貴於為儒託諸空言科第既已慁子行其所學忠孝可以立身微聖賢其誰與歸於禮樂必從先進碩自今日以觀逺猷答興化何知軍地異楚齊海不分於南北國猶魯衛政竊比於弟兄况為天子守土之臣宜講諸侯睦鄰之好禮過於厚緘來以朋某官挺生相門妙有家學早蜚聲於槐市果巍第於風宸惓惓懷憂國之誠耿耿抱􅍚邪之憤官清而要榮躋列宿之躔氣直以剛力請上方之劍乃反落御史之膽恨不斷侫臣之頭始知學校之有人孰謂書生之不武上嘉蹇諤卒行其言天賞精忠遂魁其子風采聳於天下名節立於筆端盍歸玉筍之班姑養琳宫之浩符分千里方歌來莫之廉詔下九重行作去思之武某聮名堆塔共事賢關既臭味之素同又封疆之不逺相為唇齒之國義莫重焉敬觀面目之書喜可知也賀張尚書伏審力辭從橐榮奉真祠縉紳髙勇決之風當寧惜老成之去不負所學於夫子無愧陸宣公能全大節還故鄉真同趙清獻某受知最厚贊喜尤深方當危疑之秋倍為明哲之賀日探車騎即登門墻賀陳右相廷渙大號相登真儒歡呼萬方聳動列辟某官氣大以直學明而誠入則正色於朝廷出則乃心於王室行藏合聖人之用舍進退為天下之重輕不肯枉尺而直尋惟務獻可而替否章屢上而求去甚力眷愈隆而挽留益堅可謂大臣巳久慰蒼生之望爰立作相冝盡行平日之言績坐底於咸熙喜真成於不寐賀汪尚書應辰光膺帝制榮總天官讀侍金華班髙玉筍共惟慶慰其官書讀萬卷心醉六經養孟軻之直剛得仲尼之忠恕入則居獻納論思之地出則揔方伯連師之權德名重於華夷治行最於閩蜀學以傳道真冝為萬乘之師才可佐王奚止居六官之長孰能熙帝之載當今舍公其誰兹與議之所期非某敢私其祝賀陳左相康伯誕敷明命榮陟首台用賢非以序遷簡帝實由人望某官學傳聖絶心造道微德寬大而能有容氣直剛而不可奪入則以嘉猷而告君出則以斯道而覺民房元齡心不啓權斯能持於衆美蕭相國法若畫一固宜冠於群臣况宰相以鍞撫四夷而丈夫當掃除天下今日之事舍公其誰侵疆未歸人咸望於夫子不仁者逺功實在於皋陶罔俾古人獨專其美賀虞右相尹文廷渙大號朝登碩儒選衆得賢若舜湯命相之日縉紳相賀如文富宣麻之時歡呼萬方聳動列辟某官勇自仁出忠由孝移鯁諤傳世南之風敬義稟坤爻之德入則以嘉猷而告后出則以斯道而覺民拯社稷於艱危靜胡塵於談笑周瑜赤壁之外不見雋功謝安淝水以還未聞相業公獨得於兼備事非止於一書樞府出而全蜀安衮衣歸而敵國懼果膺爰立式慰爾瞻然大臣以道事君而春秋責備賢者碩以天下而自任勿謂吾君之不能魯國侵疆未歸責端在於夫子樂正為人好善喜竊同於孟軻罔俾古人獨專其美與交代胡侍郎執筆螭拗昔類蒹葭之倚分符閩嶠今同粳秕之揚不啚衰暮之孤蹤復有交承之雅契某官心傳絶學天賦剛腸當姦邪誤國之秋奮忠誼敢言之勇朱雲請上方劍欲斷侫臣之頭賈生陳痛哭書碩繫單于之頸去國蓋一萬里投荒踰二十年會上聖之嗣興起孤忠於久廢心惟憂國屢推造膝之誠義不戴天力沮和戎之議卒落落而難合竟栖栖而不容周宣方撥亂以興衰韓子乃投間而置散銜杯里巷晦迹桑榆盍歸乎來萬事之問在伯始無出其右十里之難制一賢赤心素結於睿知白首姑煩於卧治𥘉需漳浦之次遽易溫陵之麾佇俟晉中詎容輔外某輩行相絶官僚偶同聽詩書執禮之言資直諒多聞之益左右共書於言動後先相繼以承宣誦十年尊酒之詩修尺素雙魚之敬來何太莫冝趣曺相國之裝政務惟新奚煩楚令尹之告梅溪先生後集卷第二十三
