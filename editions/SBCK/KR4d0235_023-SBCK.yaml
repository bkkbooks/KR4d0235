body:
  text: 啓荅喻提舉樗俻貟槐市濫接英㳺載筆璃􅉾誤膺親擢與史舘編摩之選叨經幃講讀之聮才素乏於寸長身􅂚堪於数聀静惟僥冐端自吹嘘某官一代宗師四方儀表餙吏必以儒者之術冝其有声育材而得天下之英可謂至楽傳衣鉢者不知幾軰登門闌者皆第一人􅀚其㧞士而得􅀹知其樂人之為善遂􅃱狂妄亦蒙奨提見千里面目之書寵已華於衮繍記一人言動之實庇方託於帡幪荅樊提刑光逺誨諸生於館下濫與英㳺聀内史於螭頭誤􅈾親擢既與編摩之選仍叨講讀之聮才素乏於寸長身􅂚堪於数聀㤙踰望外媿溢顔間某官諸儒範模群吏師表擅聲名扵蘭省􅋍風采於柏䑓帝嘉共理之良治務惟刑之恤飾吏以儒者之術存心得君子之仁北斗太山學者咸仰殘膏䞉馥後人悉沾師友之選極一時詩禮之傳有二子誦髙文於方冊未窺夫子之墻論末契於年家端在丈人之行故茲僥冐實自吹嘘荅温州莫守伯虚某官天賦材猷家傳政學輟列星之髙選蒞二浙之名􅀖况先大夫有遺爱于此州而賢刺史復共理于今日変千里歎愁之俗継萬民安樂之謡凢居蔽芾之隂率􅀍帡幪之賜故茲僥冐端自吹嘘荅木状元待閣􅀼以君子六千人定覇咸期於一􅀾扶摇九萬里冲天遂冠於群飛真囯士之無雙誠後生之可畏大名藉甚輿論翕然状元氣禀東嘉心潜西洛探㓗静精微之旨工雄深雅健之文蚤蜚泮水之聲巍拾計䑓之薦奪魁蘭省賜第楓宸䘖錦標而帰事端同於盧肇成赤壁之捷年正􅁼於周郎振賦海之名家符漲沙之勝地極書生之荣而還故里盡人子之樂而奉双親水緑蓮紅姑暫㳺於侯幕氷清王􅃳行同集于鳯池蔚爲􅀖囯之光奚止郷閭之􅂟某韲塩舊業枽梓陳人濫陪鵉鵠之群親覩鯤鵬之化世當漢武而異人軰出非遇時焉􅃱此乎才非靈運而作佛在先然其年不可及矣科第既以慁子冨貴行将逼人􅂅不􅀒扵君親當相期於逺大荅黄状元洽賢関校藝雅欽江夏之無双蘭省掄材巍䖏眉山於第二雋声藉甚輿論翕然状元名間綺園才􅄖盧駱翺翔乎教化本原之地沉潜乎䟽通知逺之經􅀃若稽古何必三萬言讀武成篇惟耴二三䇿見蕩蕩巍巍之爲尭舜知灝灝噩噩之曰啇周倘借玉階必陳三陣之要俯拾地芥豈惟一經之明尚淹卓爾之才僅亞褒然之舉况閩有異人而素先虎榜黄爲著姓而屡出龍頭綽有家風蔚爲盛事某韲塩舊業􅂣屋陳人濫陪鵉鵠之群親覩鵾鵬之化喜太學得人之盛快真才擢第之髙􅂅不􅀒扵明君當相期扵逺業荅丘状元崈賢関􅀾藝筆屡掃於千軍蘭省掄材名遂叅於三傑雋声藉甚士論翕然状元藴秀江隂蜚英浙右蚤㳺天子之學獨抱聖人之􅀴固嘗浚井而得泉奚止屬辝而比事明一王之旨兼耴左氏公羊髙榖梁赤之長􅀚三䇿之文庶幾晁錯董仲舒公孫弘之對巍折蟾宫之桂首探杏園之花衫鬂方青富貴巳逼荅莫守賀冬伏以氣肇黄宫天地之心始見日行北陸君子之道将亨某官治有先大夫之風民楽賢師帥之政茂對一􅀭之復􅂬騰千里之謡某待次衡門阻趍賔宇􅃍拜緘封之賜倍増感愧之懐荅温守􅀽正言孚襆􅀍殿廬盖適我􅂅􅀆之始懐章里閈正事其賢者之秋曽族賀之未遑􅃍朋緘之先辱俯懐愧惧仰佩謙冲某官蘭省魁儒芹宫哲匠卓矣聖賢之學粹然道德之容議論同乎古人文章盖其餘事方􅁠臣用事之日官冷廣文逮聖主當陽之􅀄席前賈􅁩擢自䑓察䖏于諌垣言人之􅀁甚难行吾之􅀁素藴首破和議力摧奸謀有蓍亀先見之明凛松柏後凋之操君子以謂古遺直天下􅁛為真諌官十上固争挺􅀽安忠正之莭一麾岀守得謝公山水之州上方念之公其帰矣某蒙㤙去囯需次還鄊喜父毋之􅀖得神明之政汲長孺雅甞慕盎臭味本同王仲宣兹幸依劉帡幪可托荅饒州蔡通判麾出守迹濫厠於九賢同官為僚治實資扵半刺礼過於厚緘来以朋共惟某官世襲衣冠家傳詩禮學古然後入政修身乃能治人宜􅀁至之有声諒無入而不得展龐統騏􅂹之足貳番君山水之􅀖靡行終更即膺迅擢某誤􅀍宸命濫持郡符雅聞别乗之賢喜見天書之面通家自今日行登元礼之門異才非王孫誤倒蔡邕之屣荅彭教授亀年一麾出守分符濫継於九賢同官為僚問政尤資於半水礼過於厚緘来以朋某官秀禀丹丘名髙太學擢千佛之科第有二难之弟兄學探聖賢而志益勤文髙流軰而進未艾頋此番君之故囯實維筮仕之舊㳺昔宣彩棒之威今長杏壇之教諸公􅁛其慱治多士資其範模巳遂終更佇膺召擢某濫􅀍宸命誤懐郡章自慙么麽之資輙拜寵褒之賜及􅆶巳乆莫諧聮事之􅂬行李尚留庶有見賢之幸荅池州韓守元龍符分鄰壌未登元禮之門書拜朋緘如見荆州之面礼過於厚分何以堪某官生自相門妙有家學業襲簮紳之舊才傳􅀴緯之餘小試銅章茂著循良之績荣持使節深知耴予之冝咸嗟􅂹足之乆淹姑􅂌雄藩而共理皂盖東㳺而􅀖人共喜黄堂坐嘨而郡政自平罔俾文公專羙􅀽潮之政寕容子厚獨􅁛曄㤗之賢靡待終更佇􅈾召擢某才居下下志在休休有慙江左之家風誤辱楚東之名郡撫封不逺􅂅修接境之􅂬甲子雖雌敢論同庚之契荅新靖州杜守明倫守番君之囯顧庸繆以何堪逰鄭公之鄊依仁賢而甚幸礼過於厚緘来以朋共惟某官名重楚東氣鍾杜固習家傳之詩礼冨天賦之材猷自郡章之既懐惟吏事之是宪居􅀖必聞政稔􅀚九賢之風學道則爱人優為千里之治預懐杜毋之徳想見靖人之心次巳乆需来何太莫某科名濫􅀼符竹誤分自慙么麽之資仰荷吹嘘之賜見尺書面目固已知賢登通徳門闌行将承教荅白待制某官逮事三朝荣䏈次對與刑猶在有靖康賢相之風文采可􅀚本長􅂟詩豪之裔奉真祠於番水継髙躅扵香山頥飬遐齡􅂦来多福况聖君思故囯之喬木而先正有克家之象賢行以蒲輪召還荷橐荅沈運使樞符竹濫分方託帡幪之庇鱗鴻逺届􅃍頒面目之書盛徳謙光朋緘過厚共惟某官學傳既濟文継東陽柏䑓飛半豸之声蘭省應列星之象七閩持憲了無囹圄之􅁈両地効官潜賛庙堂之畫方聖主重外䑓之􅀉以大賢居将􅈇之􅁠洞曉利源錢已流扵地上深􅁨時事虜其見於目中宣室興思蒼生望起某天資不敏吏事尤踈䑓評􅁼韓愈之譊譊治考同陽城之下下罪甚多矣部刺史想必能見容行或使之賢大夫恐不得終事荅陳緫幹損稽山逰宦屢修同舎之􅂬番水得書如見故人之面礼過於厚緘来以朋某官氣禀劔津名蜚槐市然膏油而讀紙上語耴科第如摘頷底髭弟兄可謂徳星丗家不忝忠粛昔宣威扵吏􅀮今賛畫於緫司績效有聞冨貴将逼某誤膺宸命濫把郡麾託末契於年家借餘光扵幕府頋兾北群空之馬􅃱千里以奚难同江東日暮之雲對一樽而未遂荅賀樞􅁡伏審光膺帝制荣陟元樞播告之􅀄迩遐胥􅂟共惟樞宻叅政白首一節赤心四朝爵齒徳俱為可尊直剛人得其所飬昔焉勇退無愧鑑湖之髙今也来帰不異蟠谿之起頋用舎行蔵之際實安危治乱之機大臣以道事君春秋責俻賢者不出則已必有可􅀚􅂅如魏鄭公展盡底藴咸望謝安石大慰蒼生茲輿議􅀁期扵公非十朋敢􅀻其祝荅趙通判一麾出守至仁仰戴於尭天同官為僚可爱欣逢於趙日礼過扵厚緘来以朋某官巍折桂枝荣䏈玉葉振振周家之公子惓惓漢室之忠臣為善最樂而得扵家傳稽古入官而非以政學姑屈神明之胃暫淹州縣之劳番君得江湖心甞令兹邑龐統展騏􅂹足来監此州行起宗英入扶王室某誤㤙得郡亡術治民閱三月而政未成思九賢而夢不見喜可知也幸王事之􅀗聮争先覩之與􅀖人而共快荅樂清􅁠縣求司法乎寛守法雅聞三語之賢愷悌攝官優布一同之政礼過於厚緘来以朋某官天賦吏材家傳政學于公世有隠徳釋之獄無􅁈民考巳及扵書三人咸思扵借一蕞爾樂成之小邑乆㢤令尹之乏人貪有至扵賊民懦或聞扵畏吏口南金而守明府有􅁼真源律大法而礼人情兹逢卓茂􅁢頼循良之治来綏凋瘵之民覩必争先聞猶失喜某逺㳺江左承乏楚東幸父母之􅀖得神明之吏故鄊雖逺未聞言偃之絃􅁔歸興巳濃及見河陽之桃李荅荆南李太尉適夔子之􅀖方将問政識荆州之面何待封侯某官裔出隴西群空兾北禀漢将無双之氣懐周臣不二之心邁方畧扵孫呉爲囯家之英衞受知於上屢持大将之􅁠開府于荆益重長城之􅀉虜不敢動時方頼公某之任逺􅀖假􅂗重鎮􅀚尺書之面目喜其可知聞萬福之威名見已大晚荅帰州周守声迹相聞同䖏浙江之左封疆非逺並逰巴蜀之東緘来以朋礼過扵厚某官詩書奕世簮紱傳家挺秀氣扵三衢馳英声扵列郡展騏􅂹足甞佐苗人之􅀖分銅虎符遥臨楚子之邑化已形扵千里治未及扵期年更不俟終召其非晚某俻貟番水易任夔門将假道以􅀚風且登堂而問政面目之書巳見喜得其人唇齒之􅀖是依言帰于好荅周運使行或使之难方􅁔扵蜀道喜可知也夢已見扵周公詞􅀚三峽之流書覩千里之面礼過扵厚緘来以朋某官􅁎籙傳芳坤維挺秀文非少而且重厚藝雖多而不吝驕才學俱髙子雲相如之徒也名徳兼著君平仲元其人歟藹蜀郡之鄉評最普􅄌之治績方聖主啚中興之業以大賢居􅀅􅈇之􅁠弭使節扵一川揚仁風扵列郡以身化下小􅄃轡之范滂用義理財鄙流錢之劉晏矧輿議之素属豈計臺之乆淹更不待終召其非晚某俻員番水易任夔門􅀅入境以􅀚風且登堂而問政叱王尊之馭險不惮扵登天依􅅊皐之賢易端同扵履地荅查運使三峡倒流难敢辭扵蜀道一麾出守芘端頼於蘇天荷友義之素敦媿朋緘之誤及禮過於厚情何以堪某官先朝名家今代人傑然膏油而讀􅁓上語取科第如摘頷底髭學兼通於古今才两俻於文武明目張膽陳治亂於天子之前論􅀅談兵賛籌畫於元戎之幕輟握蘭之髙選膺􅀅􅈇之重􅁠弭使節於一川􅀭仁風於列郡飛芻輓粟姑心計之暫劳簮筆荷嚢諒超迁其非乆某俻員番水易任夔門首􅀩千里之書喜見故人之面叱王尊之馭移孝子爲忠臣依韋皐之賢視青天如平地荅呉叅政一麾出守蕃宣濫䖏於上㳺同官爲僚謀議􅁢資於先逹禮過於厚緘来以朋某官場屋舊人江湖名士身荐歴於中外學兼通於古今登科五十年親見先朝之盛摶風九萬里上至列星之􅄤凢後来待荷簮筆之流皆前日含香握蘭之選孰謂諸候之賔客乃屈四朝之老成更豈待終召其非晚某自番君之國易夔子之􅀖乆違数仍之門墻忽見天書之面目以幕府而待杜老豈同􅃊劍南避正堂而舎盖公願效曺相國易䕫子之􅀖荅施州甄守援三峡倒流方嘆川塗之險一麾出守􅃍􅀩牋翰之修徳厚而謙㳟過於禮某官中山華胄西蜀良家才兼文武之全性禀忠義之實矯命制難陳湯有得於行􅁠􅄬筆立功班超宜侯於定逺既龍韜豹畧之屢試姑皂盖朱幡之暫乗控巴地之上㳺守清江之名郡化巳形於千里威且震於四夷更靡待終召其非晚荅周運使老向巴人方起杜陵之嘆憂銷王粲幸依劉表之賢使已近於光華禮􅀅勤於吐握某官道師孔孟才配卿雲金門玉堂謂踐􅀭之已乆木牛流馬奚飛輓之尚淹詔􅀅下於蜀天公其帰於魏闕某敬拜宸命行趋計臺媿謝牘之未修辱賀緘之先及同西州之士􅂅承教於鄉先生與列郡之民咸託芘於部刺史荅茶運使渭北江東起日暮春天之嘆烏蛮鳥道同孤城絶塞之逰行或使之喜可知也某官雁塔前軰麟臺故人既臭味之素同亦行蔵之不異愛君憂囯抗章如出於一心持節分符逰宦相􅀙於萬里某敬拜宸命􅀅趍計臺媿謝牘之未修辱賀緘之未及傾盖如故乆論程孔之交呼酒􅂆君行講韓張之好荅潼川運使何舎人番水期年治亡善状夔門萬里地􅀼巨藩揣庸繆以何堪恃髙明而自尉某官學本自得才尤不群道造子思之誠氣飬孟軻之浩傑立角出於永嘉多士之地難進易退於􅁠臣用事之秋翕然稱郷先生卓爾為天下士分符持憲不辭蜀道之難憂國愛民寕羡錦城之樂某叨預梓里稔聞月評仰齒徳爵之俱尊喜風馬牛之相及叱西州之馭移孝子而為忠臣依􅅊皐之賢視青天其如平地荅前四川茶馬續修撰觱國逰夔子稔聞舜友之風地過荆州未識韓侯之靣目仰瞻於数仭􅃍下拜於雙緘某官虞庠舊人晋國竒士仕途歴三十年之乆鵬程􅅮九萬里之髙牧民如牧羊為治素同於卜式問人不問馬存心無媿於宣尼坎則止而流則乗仕不喜而已不愠求田問舎孰云不高結綬弹冠亦何足慕優㳺里巷頥飬年齡然朝庭方思老成况天下咸仰齒徳宣室未前賈􅁩蒲輪必起枚生某渉世最踈􅀩恩誤􅀉方􅀚風而入境思問政以升堂庭過伯魚􅀼效陳亢之喜書傳雙鲤益嘆玉川之賢荅沈待制調屢上詞章誤得股肱之郡未修竿牘􅃍􅀚靣目之書緘来以朋禮過於厚某官望􅂭苕霅世耀貂蝉八詠逸才真􅀮侯之華胄一門盛事實故相之難兄甞分浙右之符尤著閩南之績奉真祠之巳乆奚􅀙橐之尚淹行起老成以尉中外某閫分絶塞地易近藩􅀅入境以􅀚風且登堂而問政帰自䕫子國幸風波之巳逃逰于鄭公鄉庶罪戾之可免荅劉大諌屢上祠章誤得股肱之郡未修竿牘遂􅀚面目之書緘来以朋禮失之過某官學貫今古心潜聖賢樂道㡬於屢空飬氣本無以直然青黎燭讀異書於蓬萊詠白蘋詩起清風於苕霅當龍飛乾道之始正鳯鳴朝陽之秋官居諌垣色正朝路􅁛尭舜者無非孟子誰與王言指㳟􅂋者豈無京房孰若公勇直道而去令名益高争無媿於七人貴奚煩於五馬然􅆇倉存而魯侯不遇旣承璀去則李絳必来益輸畎畆之忠徃賛岩廊之治某叨與同舎素􅀩異知迹雖隔扵江湖心不忘於舘閣荅凌尚書兩朝重望一代儒宗擢第若摘頷髭巍中甲科之選理身如梳旦髪了無纎垢之汙時可用而則行道無入而不得入則懋立朝之節出則騰治郡之聲退之以薦賢為心天官惟􅁢行儉有知人之鑑吏選尤精方聴履而上星辰􅃍衘盃而樂賢聖乆淹家食想􅏅宸􅂨佇繇八座之尊拱拜三公之貴其頃以晚進叨居下僚逖矣門墻之違巍然山斗之仰與沈尚書易郡而東誤得股肱之重去天非逺喜瞻喉舌之尊行逐登龍敢先致鯉某官書讀萬卷名登兩科􅀒賈生通逹囯体之才有韓子􅆂泳聖涯之學言無發而不中最髙北闕之書治􅀁至而有聲尤振西州之譽上意毎注於安危之際公色不変於榮悴之交人才甚難今日有㡬况當宁方興衰而撥亂豈重臣可置散以投閑諒興宣室之思即起東山之卧某為學最淺受知實􅀷賢関首與於陶鎔詞掖誤􅀩於薦引去門墻其巳乆仰山斗而不忘行由或使而身竄於夔喜亦可知而鄉逰扵鄭事大夫之賢者􅀼效古人之居􅀖就有道而正焉庶幾君子之好學荅姚子才荐蒙肯顧寵示長牋豈惟嘆駢四儷六之精抑亦見聞一知十之學方􅀚韓子送何堅歸道州之文端頼澹臺助言偃為武城之治尚容再見以馭謝􅀻荅章教授日邉得郡􅀉千里之股肱魚腹有書見五年之靣目禮過於厚分非可堪某官挺秀相門蜚聲帝學文法漢而尤古詩擬騷而更工衣冠盛唐室之䔥詩禮傳孔庭之鯉滿門科第継元佑省闈之風異日功名嗣􅂟暦名臣之頌學無入而不得辰何来之太遲窮年屹屹膏油業已精於韓吏部諸公衮衮䑓省官豈冷於鄭廣文名譽巳崇富貴􅀅逼某燈共庠序年同逺巡懐高山流水之音起日暮春天之嘆逺官夔子國幸巳脫於風波来逰鄭公鄉庶可逃於罪戾荅泉州交代周叅政千里分符叨継重臣之後雙緘拜賜輙為盛徳之先覩鳯有期續貂為媿共惟某官學術荀盃人才卨夔昔遇上皇􅋍風采於臺諫晚事聖主賛謀謨於廟堂乆均逸於巨藩暫飬高於琳宇如昔者大老之二兼天下逹尊之三盍歸乎来爰立作相某不學亡術見賢思齊将入境以􅀚風􅂅登堂而問政􅀼比曺相一遵䔥何之規真見周公不比宣尼之夣與福州王叅政五載三州方幸􅄬閑而置散一麾千里又叨宣化而承流顧大邦雖非小子所堪然便道有見先生之喜共惟某官性天小卓材地閎􅀷道扶孔孟而襲其傳文追楊馬而爲之配変儒風於両學最治績於四川榮長諌垣所陳無非大事巍參政柄有告必以嘉猷方蹇蹇以立朝遂營營而去國四海咸兾其復起七閩豈得而獨􅀻盍帰何来如古者之二大老無出其右兼天下之三逹尊􅂅趣曺装即膺漢詔某門䦨下士學校諸生蚤親模範之工遂玷簮紳之寵兹濫膺於􅇵郡幸宻􅀠於崇􅃧欲問為􅀖􅀼自比於顔子願言承教終不叛於韓公荅趙知宗五年三郡方幸投閑十劄十行又叨共理逺辱朋緘之及仰欽謙徳之光伏惟某官派出銀潢名髙玉牒術業炎劉之歆向勲謀仙李之江河兼爵齒徳之尊有風雅頌之好帝眷尤甚宗盟有光况惓惓忠臣不忘畎畆之念俾振振君子咸陶麟趾之風佇􅀚昌魯之季孫行作相周之衞武某昔在越絶􅀗知宗英屢陪觴詠之逰乆闊咲談之樂不謂晚塗逰宦重遇平生故人將使泉南復継蘭亭之盛不令坡老獨称安定之賢荅􅃽教授不學亡術繆懐刺史之章同官為僚行詣廣文之舎禮過於厚緘来以朋某官􅁎籙傳芳莆田挺秀􅀷究群􅀴之㫖早聮千佛之名登科盖巳十八年讀書何止五千卷眷此清源之郡雅為逰宦之鄉昔鳴子賤之琴今主馬融之帳化同魯國諸生咸采於藻芹文振歐陽髙第行登於龍虎官豈容冷詔將􅀍温某立朝甚愚為政􅀹拙巳五年而三郡又千里而一麾􅀅入境以􅀚風且升堂而問道見尺書之靣巳得其人㳺半水之宫􅂅咨以政荅興化陸教授五年四郡誤懐假守之章千里尺書快覩同年之靣禮過於厚緘来以朋某官秀挺三山風髙二陸才盖由於天賦學况得於家傳􅅮風宜上於天池采藻尚淹於侯泮眷兹莆水實為冠帯之鄉冝得宣公以昌仁􅁩之學官豈容冷詔行􅀍温某符竹濫分寳鄰是頼方驅車而假道􅂅問政以登堂誦十年尊酒之詩辰乎何速見千佛明􅀴之士喜也可知荅任運使五年三郡方幸􅄬閑一扎十行又叨共理首辱朋緘之貺仰欽謙徳之光某官秀挺三山名髙千佛餙吏必以儒術修身本乎誠明色正霜臺風采稔聞扵半豸位分卿月禮樂咸資於一夔入則居清要之官出則為光華之使著治績於数路藹􅂬聲於七閩姑為轉餉之䔥耻作流錢之晏苟非仁義固未甞陳於王前其在朝廷又孰敢於諸任齒使軺暫屈召節䁀来某渉世最踈辱知素厚千里誤分於符竹二天仰頼於帡幪教化羙而風俗夷小諸侯敢不自勉撫字勞而催科拙賢使者必􅀎見容荅石察判起宗巍中亞魁榮㱕故里大䇿聳傳於多士長牋寵及於陳人事甚盛而􅀗􅀚喜欲言而不足某官家傳萬石譽擅七閩志雅在於奪標射果聞於中目詳􅀚切直之對深得茂明之宜雖䇿勲有䔥一曽次之或殊然公議以王後盧前為未惬清泉􅂵㡌􅃍改􅀚於温陵緑水紅蓮聊宦㳺於越絶佇自賔幕即登道山某幸兹分符叨與􅂆駕果遂郊迎之語薄攄簮盍之誠式遄其㱕筞親之樂孰加此不􅀒所學許國之忠其自今荅郭縣尉榮擢巍第言旋故鄉荐􅀩都􅀐之臨重拜雄文之貺老􅀗􅀚於盛事喜實倍於常情某官經傮􅀗麟文冠薦鶚蘭省復居於前列英聲益重於南州暫淹龍虎之羙名姑作神仙之􅀮吏力盖由於稽古人咸貴於為儒託諸空言科第既已慁子行其所學忠孝可以立身㣲聖賢其誰與帰於禮樂必􅀙先進􅂅自今日以􅀚逺猷荅興化何知軍地異楚齊海不分於南北國猶魯衞政􅀼比於弟兄况為天子守土之臣宜講諸侯睦鄰之好禮過於厚緘来以朋某官挺生相門妙有家學早蜚聲於槐市果巍第於風宸惓惓懐憂囯之誠耿耿抱􅍚邪之憤官清而要榮躋列宿之􅄤氣直以剛力請上方之劍乃反落御史之膽恨不断侫臣之頭始知學校之有人孰謂書生之不武上嘉蹇諤卒行其言天賞精忠遂魁其子風采􅋍於天下名節立於筆端盍帰玉筍之班姑養琳宫之浩符分千里方歌来莫之廉詔下九重行作去思之武某聮名㕍塔共事賢関既臭味之素同又封疆之不逺相為唇齒之國義莫重焉敬􅀚面目之書喜可知也賀張尚書伏審力辭􅀙橐榮奉真祠縉紳髙勇决之風當宁惜老成之去不􅀒所學於夫子無媿陸宣公􅀎全大節還故鄉真同趙清獻某受知最厚賛喜􅀹深方當危疑之秋倍為明哲之賀日探車􅀐即登門墻賀陳右相廷渙大號相登真儒讙呼萬方􅋍動列辟某官氣大以直學明而誠入則正色於朝廷出則乃心於王室行蔵合聖人之用舎進退為天下之重䡖不肯枉尺而直尋惟務獻可而替否章屢上而求去甚力睠愈􅂭而挽留益堅可謂大臣巳乆慰蒼生之望爰立作相冝盡行平日之言績坐底於咸熈喜真成於不􅄰賀汪尚書應辰光膺帝制榮緫天官讀侍金華班髙玉筍共惟􅂟慰其官書讀萬卷心醉六經養孟軻之直剛得仲尼之忠恕入則居獻納論思之地出則揔方伯連師之􅁠徳名重於華夷治行最於閩蜀學以傳道真冝為萬乗之師才可佐王奚止居六官之長孰䏻熈帝之載當今舎公其誰兹與議之所期非某敢􅀻其祝賀陳左相康伯誕敷明命榮陟首台用賢非以序遷簡帝實由人望某官學傳聖絶心造道㣲徳寛大而䏻有容氣直剛而不可奪入則以嘉猷而告君出則以斯道而覺民房元齡心不啓􅁠斯䏻持於衆美䔥相國法若畫一固宜冠於群臣况宰相以鍞撫四夷而丈夫當掃除天下今日之事􅃕公其誰侵疆未帰人咸望於夫子不仁者逺功實在於皐陶罔俾古人獨專其美賀虞右相尹文廷渙大號朝登碩儒選衆得賢􅀂舜湯命相之日縉紳相賀如文富宣麻之時讙呼萬方聳動列辟某官勇自仁出忠由孝移鯁諤傳世南之風敬義禀坤爻之徳入則以嘉猷而告后出則以斯道而覺民拯社稷於艱危靜胡塵於談􅀏周瑜赤壁之外不見雋功謝安淝水以還未聞相業公獨得於兼俻事非止於一書樞府岀而全蜀安衮衣帰而敵國惧果膺爰立式慰爾瞻然大臣以道事君而春秋責俻賢者􅂅以天下而自任勿謂吾君之不􅀎魯國侵􅆠未帰責端在於夫子樂正為人好善喜􅀼同於孟軻罔俾古人獨專其美與交代胡侍郎執筆螭􅉾昔􅀋蒹葭之􅀝分符閩嶠今同穅秕之颺不啚衰暮之孤蹤復有交承之雅契某官心傳絶學天賦剛腸當姦邪誤國之秋奮忠􅁩敢言之勇朱雲請上方劍欲断侫臣之頭賈生陳痛哭書􅂅繋单于之頸去國盖一萬里􅄬荒踰二十年㑹上聖之嗣興起孤忠於乆廢心惟憂囯屢推造􅂰之誠義不戴天力沮和戎之議卒落落而難合竟栖栖而不容周宣方撥乱以興衰韓子乃􅄬閑而置散銜盃里巷晦迹桑榆盍㱕乎来萬事之問在伯始無出其右十里之難制一賢赤心素結於睿知白首姑煩於卧治􅀄需漳浦之次􅃍易温陵之麾佇竢􅇔中詎容􅀘外某輩行相絶官僚偶同聴詩書執禮之言資直諒多聞之益左右共書於言動後先相継以承宣誦十年尊酒之詩修尺素雙魚之敬来何太莫冝趣曺相國之装政務惟新奚煩楚令尹之告梅溪先生後集卷第二十三
