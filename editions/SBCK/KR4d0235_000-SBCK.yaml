body:
  text: 梅溪王先生文集序知人之難堯舜以為病而孔子亦有聴言􅀚行之戒然以予􅀚之此特為小人設耳若皆君子則何難知之有㢤盖天地之間有自然之理凡陽必剛剛必眀明則易知凡隂必柔柔必暗暗則難測故聖人作易遂以陽為君子隂為小人其所以通幽眀之故類萬物之情者雖百世不􅀎易也予嘗􅀼推易説以􅀚天下之人凡其光眀正大疎暢洞逹如青天白日如髙山大川如雷霆之為威而雨露之為澤如龍乕之為猛而麟鳳之為祥磊磊落落無纎芥可疑者必君子也而其依阿淟涊囘互隐伏紏結如蛇蚓頸細如蟣蝨如􅀑蜮狐蠱如盗賊詛祝閃倐狡獪不可方物者必小人也君子小人之極既㝎扵内則其形扵外者言談舉止之微無不發見而况扵事業文章之際尤􅀁謂粲然者彼小人者雖曰難知而亦豈得而􅏉㦲扵是又嘗永之古人以驗其説則扵漢得丞相諸􅁑忠武侯扵唐得工部杜先生尚書顔文忠公侍郎韓文公扵夲朝得故叅知政事范文正公此五君子其􅀁遭不同􅀁立亦異然其心則皆􅀁謂光眀正大踈暢洞逹磊磊落落而不可揜者也其見扵功業文章下至字畫之溦盖可以望之而得其爲人求之今人則扵太子詹事王公􅀛齡其亦庶㡬乎此者矣公妃以諸生對筞庭中一日數萬言被遇太上皇帝親擢以冠爲士遂􅂑其言施行之及佐諸侯入册府事今上皇帝扵初濳又皆以忠言直節有􅀁禆􅀘上亦雅敬信之登極之初即召以爲侍御史納用其說公知上意以必復土彊必雪讎恥爲己任其􅀁言者􅇀非􅁱徳行政任賢討軍之實而扵分别邪正之際􅀹􅃱意焉尋以邊兵先律廷議不咸上䟽自劾除吏部侍郎不拜去為数郡布上㤙恤民隐蚤夜孜孜如饑渇嗜欲之切扵已去之日民思之如父母其䖏閨門居鄉黨則又親親敬故隆信義務敦家人孺子亦藹然有忠厚廉遜之風平居無􅀁嗜好頋喜為詩厚質直懇惻條暢如其為人不為浮靡之文論事􅂑極巳意然其規撫宏骨骼􅄏張出入變化俊偉神速世之盡力扵文字者徃徃反不􅀎及其他片言半簡雖㦯出扵脫口肆筆之餘亦無不以仁義忠孝為歸而皆出扵肺腑之誠然非有􅀁勉强慕傚而為之也盖其􅀁禀扵天者純乎陽徳剛眀之氣是以其心光明正大踈暢洞逹無有隐蔽而見扵事業文章者一皆如此海内有志之士聞其名誦其言􅀚其行而得事心無不歛袵心服至扵小人彊以一時趨向之殊或敢巧爲謗然其極口不過以爲迂闊近名不切時務至其大莭之偉然者則不􅀎有豪髪􅀧汚也然則公扵五君子者迹雖未必皆同而心實似之故自其布衣時嘗和韓詩数十百篇守番及䕫則又􅆘在􅁑杜顔范之遺􅇕皆嘗新其祠宇以􅃱歆慕之意盖亦毎自比焉嗚呼公之必為君子盖不待孔孟尭舜而知之矣予昔官中秘直西省皆得與公為寮辱公知頋甚厚及来守建康則公殁㡬十年而其子聞詩􅆘官府下相與道舊感慨􅒣欷一日出公遺文三十二卷属予敘之予盖三復焉而拊卷太息也公之行事今某官莫俟子齊既状之而故端明殿學士汪公聖錫􅂑以誌其墓矣故予因不復著獨論其心如此別扵篇端以告天下之士使有以識其􅀁謂光眀正大䟽暢洞逹者言言凛凛􅀄未嘗随死而亡也以是勝􅀻起懦而相與師慕其萬一在朝廷則以犯顔納諌為忠仕州縣則以勤事愛民為軄内外交脩不遺餘力使君悳日躋于上民生日遂于下􅀦歩安强隐然真有恢復之􅀔則公雖云亡而其精爽之可畏者為無憾扵九原矣嗚呼其亦可悲也乆聞詩亦好學有立􅀎守其家云余耒守温每扵公睱􅂺涌梅溪王忠文公遺文因之有得於心以為政事之資者多矣公之文集舊有刋本而朱文公代劉共父為序論其心為特詳􅀊久故壞前守何公文淵劉公謙相継掇拾扵蠧腐之餘重為刋扳盛傳扵今而少保黄文簡公淮為序則專論其道也文公之序載扵大全集中惜重刋者遺之余為表而􅃣諸卷端使人知公之文章事業皆夲扵道而道又夲扵心也噫知公之心者莫如文公文公天下萬世人物之衡鑑也則其序可得而遺㢤天順六年冬十月朔旦賜進士出身中憲大夫温州府知府莆田周琰識梅溪先生王忠文公文集序道在天下無物不備無時不然夲之扵民彛達之扵事業昭昭乎不可泯也然而不著之扵文章垂之扵訓典􅂚足以扶丗立教化今而傅後是故古之聖賢立徳立功立言不可偏􅆸也嗣是而􅁇作者世豈無其人歟温郡梅溪先生王公十朋家食時敏扵力學愽䆒經史旁通傅記百家由愽反約擇精守固其扵天理民彛之懿忠孝立身之本體認真切凝然以斯道自任紹興間對筞大廷日盈萬言援經證据切中時病髙宗親擢首選試以民事僉判紹興府自後厯官侍􅀙䑓諌出知饒䕫湖泉四大郡八爲太子􅉟事以龍圖閣學士致仕每爲權要忌嫉而執徳不囬粤在侍􅀙䑓諌時屡上奏䟽其扵君臣父子之大倫􅀦家之權柄賞罰之當否時事之得失臣僚之邪正衆論之是非民情之休戚軍政之利害時㡬之審决虜讎之不可不復􅀦恥之不可不雪剖析詳眀論議鯁直皆􅁕以闡聖道垂丗教惜乎當時不􅀎盡用也其為郡時布上㤙恤民隠導掖撫摩直欲之扵平康之􅏾身在外服而心存朝廷漢唐循吏殆不是過其著為雜文詩歌率皆渾厚雅淳和平坦蕩不離扵道徳仁義􅂵陽朱夫子謂其禀乎天者純乎陽徳剛眀之氣是以其心光眀正大踈暢洞達如青天白日而見扵事業文章者一皆如此􅃀㢤至論也盖其當代之立徳立功立言可謂無媿者矣後之人雖欲無傅其可得乎文集舊嘗鏤板􅀊久䆮癈郡之前大守何公文淵訪扵其家得錄夲若干卷殘缺錯􅅍不可緝理㑹陞除侍郎而去然其心未嘗忘也未㡬前御史劉公謙􅁇守是郡旁求愽訪乃得其刻夲扵黄巖士族蔡玄可家命郡學教授何㶇重加訂正鳩工刋刻用廣其傳􅐌成其事者貳守徐公恕通判劉公寛推官宫公安暨邑􅈗周紀䓁與有力焉扵乎公之心畏天憫世之心也公之道聖賢􅀁傳之道也不􅄑狙扵人事之變遷迫扵氣運之衰微而不得卒􅈬其志徒託空言扵編簡之中其亦可悲也夫披閱是編者因其言以求其心因其心而逹諸用可以致君為堯舜可以躋治扵􅂭平使人皆知吾儒之道有功扵斯丗豈曰小􅀘云乎㢤淮故不揆鄙陋而僣為之序正統五年夏四月望日榮祿大夫少保户部尚書兼武英殿大學士知制誥國史捴裁同郡黄淮書梅溪先生文集緫目廷試䇿并奏議共五卷詩文前集二十卷詩文後集二十九卷附録有宋龍圖閣學士王公墓誌銘聞禮䟦尾一萹梅溪先生廷試䇿并奏議目録第一卷廷試䇿第二卷輪對劄子三首上殿劄子三首應詔陳􅁦事論左右史四事第三卷除侍御史上殿劄子論史浩劄子􅄪論史浩劄子論進取利害劄子論史正志劄子􅄪論史正志劄子論廣海二寇劄子論韓仲通俞良弼劄子論内庭節省劄子論宿州退師劄子論休假劄子論林安宅劄子􅄪論林安宅劄子第四卷論用兵事宜劄子乞審核李􅂋忠等功罪劄子論龍大淵撫諭兩淮劄子自劾劄子􅇪州論馬綱狀􅄪論馬綱狀除知湖州上殿劄子三首除太子詹事上殿劄子三首應詔舉官狀舉張拭自代狀第五卷代越帥王尚書待罪狀又代上郊祀天晴剳子又代上劄子又劄子又代上劄子又代上五劄繳劄代王尚書辟陸宰狀又代上劄子梅溪先生後集目録第一卷賦㑹稽風俗賦并叙民事堂賦并叙蓬萊閣賦并叙第二卷詩丁丑三月二十一日集英殿賜第㳺天竺贈同年贈閻同年閻和詩叙别􅄪用前韻贈梁同年次韻陳大􅁥見贈次韻劉長方司户見贈陳大􅁥用賞梅韻以贈依韻酬之大􅁥復贈詩􅁓尾有留飰語􅄪用韻以謝謝榮帥薿贈御書孝經用陳大􅁥韻陳大􅁥餞别用前詩珠字韻以謝用陳大􅁥韻謝王國録季羔見贈陳郎中公􅀃贈韓子蒼集章季子贈端硯次韻陳大􅁥赴天中節宴謝李侍郎琳贈御書塗中得寳印叔二詩次韻次韻寳印叔題壁二絶萬府君挽詞詠中致政宋承事挽詞張徳惠挽詞宿羅漢三絶㳺大龍湫和前韻㳺靈巖輝老索詩至靈峯􅀉數語題瑞巖題天台國清寺題大慈寺題石橋二絶萬年贈鄊僧貴老過鑑湖民事堂臘月望日出郊探春㳺告成觀謁大禹祠酌菲飲泉遂至龍瑞宫觀禹穴薄暮而還采蕺秦望迎春遇雪元日冐雪赴天慶􅀚朝拜既趍府拜表還舎飲屠蘇酒因思去年元日亦不在家感而有作賀何正言用蔡君謨韻寓小能仁寺即事書懐同莫教授朱縣丞朱司理㳺西園次韻濮十太尉賞梅題夀樂堂用東坡韻贈楊元賔僉判元賔贈紅梅數枝􅇬舎有􅁱竹􅂾竿滿洒可愛龍瑞道士贈蘭呉秀才克家以夀樂蓮洲中千葉梅花為贈酬以詩上丁釋奠俻数獻官書十二韻呈莫子齊教授趙可大察推㑹稽三賢祠詩并序呉先生祠旌忠廟愍孝廟第三卷詩其比縁職事朝拜􅑼宫瞻望松栢愴然悲涕遂成小詩鑑湖行禹廟歌與趙安撫乞䟽獄次韻濮十太尉詠知宗牡丹七絶送僧㳺徑山三月晦日邵憲大受宴僚屬于西園某與焉趙提幹即席賦詩次韻送昌齡弟還鄊兼簡夣齡糶米行送㑹稽林簿日華棄官還鄊戊辰􅀊甞和韓退贈張徹詩􅀉曺夣良至今十年夣良方和以􅀉因贈一絶送趙可大如淛西中秋賞月蓬萊閣呈同官中秋見月方以為喜既而隂蔽意殊不滿東坡云良天佳月即中秋不以日月断也諸君有醵㑹之約復用前韻記夣士人及僧道俱贈巖桂府吏有以老求退者詢其年猶未六十詰其去之由云欲全身避禍耳予善其知機勇退可以媿􅄝進之士夫有感而作􅀚習水勝龍瑞道士贈巖桂九日登蕺山夢齡九日有詩兼懐昌齡次韻贈荘童子送朱丞贈夣齡兼懐昌齡和夣齡十月朔日書懐贈喻叔竒縣尉贈王吉老縣尉十月望日買菊一株頗佳聞詩生日十月十六日欲與夣齡弟及聞詩聞禮同㳺蘭亭仍約喻叔竒偕行㑹天氣不佳喻亦以疾辭出門而止兀坐終日懐抱殊惡和喻叔竒集蘭亭序語四絶和韓退之晩菊贈喻叔竒夜讀書于民事堂意有所感和韓公縣齋讀書韻李資深贈古硯瓦及詩喻叔竒惠川墨載夫人挽詞和趙可大四絶右僧舎雨中右聞子規右不􅄰右朝永祐􅁜送黄機宜㳺四明盧仁及縣丞挽詞贈術者㳺天衣寺次梁尉韻酬陸宰用梁尉韻和喻叔竒㳺天衣四十韻第四卷詩州宅蓬萊閣清白堂清白泉􅀚風堂望月䑓秦望閣望海亭卧龍山種山競秀閣蕺山八松右軍祠堂鵝池硯池題扇橋雷門曲水閣西園望湖亭吴先生祠賀知章祠鑑湖禹廟菲泉禹穴馬太守廟呉越王廟望秦山小㣲山梅梁窆石和昌齡弟見􅀉懐喻叔竒次韻周尭夫贈睡香送陳元佐㳺四明聞禮生日次韻趙􅀚使鴛鴦梅亡友孫子尚藁􅌾㑹稽山大禹寺之側某至官八日出郊訪其墓不􅀗明年春􅀍命祀禹訪而得之又明年春􅂯徃酹酒因植栢十根哭之以詩子尚墓種栢鄭夫人挽詞錢夫人挽詞連月不雨農事失時府帥决獄廪飢徳政動天霈然而雨某吟成律詩一章以賀次韻濮十太尉喜雨叔父寳印師住永嘉妙果院未期年而退弟子徳純住龍翔一日帰省其師亦退居林下緇素挽留之乃遁扵異郡不踰月間師弟子相継退休識者髙之目為僧中二踈其􅀼禄􅀅二考矣有媿二髙僧因書一絶庶幾他日或􅂿其髙躅云􅀉黄簿次韻濮十太尉題禹穴薛師約撫幹召飯于圓通寺主僧㵸茗索詩潘知縣甸弟撫幹畤和詩復用前韻酬冨陽張叔清縣尉周徳貽得子以錢果為貺僕不􅀗為湯餅客賀之以詩喻叔竒迎侍赴桐川榜其堂曰戯綵衣来求詩􅀉題一絶女子生日范文正公祠堂詩并序次韻梁尉秦碑古風府師王公中秋宴客蓬萊閣分茶賞月于清白亭某以幕僚與焉坐上成二絶又和趙仲永撫幹二首􅂯和又用㸔字韻酬趙仲永故叅政李公挽詩三首九日與同官㳺戒珠寺用去年韵􅂋仁皇后挽詞三首胡氏挽詩次韻喻叔竒追感去冬天衣之㳺次韻劉判官大辨見贈趙仲永以御茗宻雲龍薫衣香見贈仍惠小詩次韻仲永􅂯和三絶復和以酬􅀉題周堯夫碧梧軒留别民事堂題双峯資深堂􅀫靈巖贈長老敏行第五卷詩已􅆗臈月七日觧官離越十九日至家明年正月二日􅀍命除祕書省校書􅀰􅁲以八月日行書二十字次韻馮員仲正字湖上有作次韻趙仲永悠然閣次韻皇子建王題明逺樓劉韶羙辭試館職􅂯用前韻贈韶羙次韻韶羙送劉夷叔二詩右悼夷叔右贈韶羙皇子建王生日􅀉新暦日與夣齡昌齡弟送查元章二首祕書省後園􅁱竹可愛胡正字憲有詩次韻魏􅀖式通判挽詞次韻程泰之正字雪中五絶泰之用歐蘇頴中故事􅂯作五絶勉强継韻趙仲永和東坡汝隂雪詩并舉趙徳麟賑濟故事見示遂次其韻次韻洪景盧編修省中紅梅李徳逺簿敢言勇退今之古人也東嘉王某賦詩以髙其行省中黄梅盛開同舎命予賦詩戯成四韻送王嘉叟編修送陳阜卿出守呉興次韻程泰之酴醿送湖正字分韻得来字四月四日祀赤帝子于􅄌雲嶺净名寺祀畢㳺易安齋至江次送黄子升通判還鄊送太學生徐易歸天台章季子教授惠顧渚茶報以宣城筆戯成三絶趙仲永和胡正字竹詩見贈用韻以酬張閣學挽詞寳月師刻于舊題以􅀉因書二絶五月十八日去􅀦明日富陽廟山懐舘中同舎􅀉馮員仲釣䑓嚴州龍門院滿散天申節宿永康縣黄塘店􅀚稼有感永康有嶺名花錦􅀍舟中偶題㳺石門洞林明仲自梅嶼拏舟招丁道濟道揆張思豫及予同飲索詩坐間成六絶七月朔日右贈明仲右懐舊㳺右贈諸公右題宋荘右題西岑第六卷詩次韻昌齡至樂齋讀書寳印叔示詩且索碑刻以南明山六大字為獻紫芝岩隠岳岩仍次韻寳印叔辯上人名贈瑞香花曹夣良自許峯来訪留山間數日賦詩數十章復出四絶見贈次韻先人舊題東山墓亭三絶某辛已秋帰自武林省先壠遂修亭宇濬溪流因思先人舊詩巳随屋壁壊矣尚能記憶遂追和送萬先之赴清湘教官送曹夣良赴桐廬户􅁺十月朔日偶書剪拂花木戯成二絶小小園十月杜䳌花盛開有共蒂双頭之異因以數語記之題月師桂堂十一月二日自金溪訪錢用章干白石覧山川景物之竒以東道之姓為韻同錢用明用章㳺白石巖又書岩上屑玉泉李少和像㳺東際次韻寳印叔􅀚海三絶李鎮夫闢圃築堂効孟氏之飬吾表兄杖屨其間得日渉之趣某来㳺名堂曰雙植因書三絶劉長方自豫章􅀉書称砮焦蠣房之羙恨未知味書一絶以􅀉之寳印叔得小假山以長篇模寫進士欽逢辰和之某次韻并簡欽次韻昌齡西園十詠黄楊莆萄􅁱竹梅桃李杉桂柳菊題如存亭壁劉義夫欲於先隴植蘭􅀉數根義夫許贈丁香蠟梅義夫以趙清獻諌垣集易柳文次其韻鴈山僧景暹求文記本覺殿又六言書不欺室人日有雪竹間種蘭張思豫主簿送丹桂蠟梅余全之贈菊栽十二品并示三十絶走筆二絶酬之二月二日焚黄天色開霽賔㳺並集存殁有光悲痛之餘因成鄙語送陳元佐㳺剡雙桂東籬左原詩三十二首并序東髙山西髙山南髙山北髙山亀山卧虎山梅溪楊谿戯綵巖杜䳌巖碁盤巖撒水巖松蘿巖障巖人靣巖天柱巖幞頭巖宋家尖小鴈蕩左嶺左湖蓴湖南瀑布北瀑布嘶水澗鴈潭三井孝感井白巖庵賈公庵如在亭如存亭小小園納凉贈甥萬膺萬孝傑用韻見􅀉酬之題􅀙姪䘖名荘萬孝全惠小龍團第七卷詩赴召曹夣良贈炭戯成一絶宿學呈同官某去五月罷舘職還鄊塗中以詩􅀉同舎云去國懐明主離群念舊㳺翻今到家夣终夜繞瀛洲令以史職復至道山訪舊或遷或去惟後園􅁱竹乃故人也感嘆良乆因成短篇馮員仲赴闕奏事士君子咸欲其留聞為魏公所辟勢不可奪遂成鄙語兼簡查元章程泰之郎中以詩三絶覔省中梅花因次其韻胡秘􅁥贈詩一絶某依韻奉酬胡秘􅁥酴醿詩其次韻館中三月晦日聞鸎胡􅀖衡有詩用東坡酴醿韻有君側無讒人發口不須婉句某次韻上賜講讀官建茶某以説書與焉以十餅分贈太學同舎芮太愽煇有詩次韻四月􅀙駕詣徳夀宫與諸公㑹食扵和樂樓是日借洪景嚴承㫖馬戯云􅀙駕濫􅀐承㫖馬朝天叨綴舎人班時為起居舎人異日再集胡舎人􅀖衡云不可不成篇也遂於樓中足之用登和樂樓韻酬胡􅀖衡送别兼簡劉韶羙秘􅁥去國重㳺釣䑓過婺女同年王節推夷仲黄教授萬頃鄉人葉主簿子周㑹飲双谿樓㳺仙都㳺洞谿重㳺石門洞􅀉題喻叔竒亦好園種􅂼予素不善棊孫先覺萬大年林大和見訪戯與對壘偶皆勝之因數語大年和棊詩復次前韻大白晝見荆婦夜績術者謂予命犯元辰故毎仕輙已予􅀏曰有是哉戯作問荅語再至雙植堂呈表兄李克明九日􅀉表叔賈司理并引九日不登高與兄弟鄰里就􅁦舎飲菊仙居陳少曽􅀉錦石盃書至乃九日也方與坐客把菊遂用以􅂆酒僕夫浚井得双鯽一鰻未及亨也蔵之􅅺水間予見而放之因作数語得張大猷尚書書云比毎進對屡以侍御為言而􅀖衡舎人言尤数且切云云某為群邪所疾獨見知二公因讀􅀖衡和和樂樓詩復用前韻次韻題寳印叔蘭􅀂堂藤杖予還自武林葺先人􅁦廬凈掃一室晨起焚香讀書於其間興至賦詩客来飲酒啜茶或奕某為戯蔵書数百卷手自暴之有小園時䇿杖以㳺時遇秋旱驅家僮浚井汲水澆花良天佳月與兄弟鄰里把杯同賞過重九方見菊采以泛觴有足樂者覧鏡見蒼顔白髮亦聊自嘆也作小詩十五首掃室焚香讀書賦詩飲酒啜茶奕棊暴書䇿杖汲水澆花賞月采菊覧鏡浚井酬林明仲􅀉書并長篇名季任昌齡欲㳺白石興盡而止予亦思年前之㳺遂次其韻洪丞不􅀒軒周承奉挽詩同年周敏父黄岩趙十朋賢士也有詩云四枚豚犬教知書二頃良田儘有餘魯酒三杯棊一局客来渾不問親踈予亦有東臯二頃两子皆學讀書客至則奕棊飲酒遂用趙君詩意成一絶陳啇英挽詞陳啇霖挽詞萬清之有詩三絶呈司理賈丈并簡某因次其韻再用前韻右呈司理右酬清之右贈犬老司理予未臘而雪豊年兆也大老有詩次韻雪中􅀉梅花與清之大老題夣齡五桂堂􅀉鯉魚與萬大年梁府君挽詩䴡水人子安世登科永嘉盧仲􅁱永年䄂文見訪酬以短句林明仲和詩復用前韻張器光和詩復用前韻􅀉蒲墨與明仲􅀉沈敦謨名希臯瑞安人送謝任之題双瀑癸未守歲張噐先復和詩作五言以􅀉萬孝全贈金華洞石名雪灑遥峯作進退詩次韻元宵鄰里携就􅁦廬張燈辤之不􅀗因成一絶祈雨不應自秋七月不雨至于春二月十九日僅得雨昌昌齡作賀詩予未及和而雨止矣遂次韻以閔之社日喜雨復用前韻家食遇歉有飯不足之憂妻孥相勉以固窮因録其語聞小使胡抗虜不屈上甚嘉之有㫖命右揆撫師仍有和不可成之語皆出睿断宗社之福也昌齡有詩次韻昌齡四月十九日得男請名於予命之曰遲山丹花第八卷七月三日至鄱陽次韻何憲子應喜雨登綺霞亭用喜雨韻追和范文正公鄱陽詩郡齋即事㳺芝山寺登綺霞亭用碧雲軒韻降聖節詣天慶􅀚因謁顔魯公范文正公祠堂用贈御賜名道士韻􅀚文正像用贈傳道士韻移竹植郡齋之東用懐慶􅃋堂韻十月望日同官㑹飯薦福送酒生日示聞詩聞禮木藴之即席和文字韻詩酬以二絶􅀚郡守題名再書一絶項服善知縣和詩酬以三絶并簡林致一教授題薦福寺莫莫堂哭馮員仲陸居士挽詩洪師陳阜卿􅀉筍次韻何子應題不欺室郡齋對雪子應和詩􅂯用前韻祠顔范二公題何子應金華書院啚閏月三白三首又和項服善二首又用時字韻和洪景盧用作四白詩臘盡日又雪洪復日五白詩再和次韻何子應得宣城筆聞捷報用何韻不欺室三字參政張公書也筆力勁健如端人正士􅌂然人望而敬之因成古詩八韻出郊遇雪何子應以蜀中文房四寳分贈洪景盧王嘉叟某與焉因成一絶送翁東叟教授和寳印叔見􅀉用韻􅀉二弟送蔡倅齒落次韻李懐安贈何憲五絶李懐安擁麾八蜀道出鄱江見贈二詩依韻奉酬國娘生日陳阜卿書云聞詩筒甚盛可使流傳江西否戯用竹萌韻以􅀉次何憲韻金華先生有竒石名碧逺携来自蜀陳洪州以詩覔之金華輟所􅄝以贈亦一段竒事也予家雁蕩郡峯錯峙皆几案間物因和二公詩頗起鄊思寓意断章嘉叟宗丞得郡喜成一絶人日雨次何憲韻子應贈蜀中石刻十卷詩以謝之次韻嘉叟讀和韓詩元乆次何憲韻送何憲行部趣其早還種金沙花戯呈景盧郡圃栽花二月翔日同嘉叟藴之訪景盧别墅用郡圃栽花韻即席唱和還舎復用前韻以􅀉景盧嘉叟各和詩五首復用前韻用韻懐何卿嘉叟和詩至七篇有何時五畆成帰計来作鄰翁伴藝麻之句某鄊心方切復用韻第九卷州宅十二詠平政堂玉芝堂慶􅃋堂退思軒九賢堂四賢堂四望亭綺霞亭清香亭百花樓鄱江樓蜀錦亭景盧贈人面竹杖鄊人項服善宰鄱陽有政聲人惜其去用郡圃栽花韻作詩数篇叙别遂和以送之予向年少不自量因讀韓詩輙和数篇未甞敢出以示人盖二十年矣近因嘉叟見之不能自掩且贈以長篇􅀩景盧継和用韻以謝次韻陳阜卿讀洪景盧追玉板詩次韻何憲􅁱途倦㳺懐鄱陽唱和之樂次韻何憲太平道中書事次韻何憲題魯池州通􅀮堂芝山􅂆農二月十五日祈晴十七日雷雨再作喜晴再用前韻􅂾日天氣朝隂暮晴復用前韻哭何子應同官㑹餘鄱江楼送谷簾泉二尊戯成小詩名郡之東門曰永平書一絶主簿程同年和永平門詩再賦四絶因以贈别送春州院獄空贈知録孫聴鄱江樓分韻得月字前端午一日㑹飲鄱江樓十有六人既分韻賦詩又戯成短篇五月二十日閔雨次韻葉樞宻言别洪景盧以郡醸飲客于野䖏園賦詩見􅀉次韻剡􅁓贈嘉叟以詩為謝次韻伏日四望亭分韻得月字次韻趙通判喜雨徐孺子亭張安􅀦舎人以南􅁜鄱陽雨􅊙不同示詩次韻又次韻閔雨次韻安囯讀楚東酬唱集安囯讀酬唱集有平生我亦詩成癖􅁍悔来遲不與編之句今􅁒編後集得佳作􅂾篇為楚東詩社之光復用前韻次韻安囯讀薦福壁間何卿二詩悵然有感五月二十五日餞安囯舎人于薦福洪右史王宗丞来㑹坐間用前韻再用韻送安囯易芝山五老亭名曰五峯安囯書之因成短篇次韻安囯題餘干趙公子飬正堂堂張魏公所名也并為作銘次韻安囯題清音堂郡齋舊有假山暇日命工葺之取石之㠌者繂置山頂汲水筩竹引而激之自頂而下有懸崖飛瀑之状予既以蕭洒名齋因䥴二字于石戯成古風第十卷詩予自饒易􅇪以七月九日行饒人遮道挽􅇔易轎由間道而去提􅀧何徳獻相追不及以詩見􅀉云断橋截鐙亦堪憐始信林間别有天㣲見兵機第一義朱轓暫席廣文氊因次其韻同官酌别途中􅀉何徳憲宿何山孫氏竹軒􅀚張安囯題壁因用其韻望廬山懐番易同官夣􅀚八陣啚讀喻叔竒送行六詩都昌道中望廬山思故鄊過五柳湾宿棲真寺懐番昜士民􅀚淵明􅀞像題翠軒寓棲真四宿時二児寓上庠未知去留又祠命未下頗以為懐望大􅀌山題湖口驛至江州和叔竒見􅀉讀趙果州詩讀王文正公遺事題􅁃樓呈唐守立夫宫太平興囯宫宿東林贈然老白公草堂蓮社題東林聦明泉㳺圓通贈訥老題至樂亭勝書記蜀僧也和予㳺圓通二詩用贈訥老韻酬之次韻唐立夫以日者命状見􅀉趙果州致羊酒走筆戯酬題訥庵題康王􅀚湯泉宿帰宗寺簡寂􅀚㳺開先寺􅀚香爐瀑布諸峯讀李蘇二仙詩知盧阜之勝在是記以十韻㳺萬杉院飛橋三峡橋五老峯玉淵宿棲賢㳺楞伽㳺山南入康谷以不􅀚谷簾泉爲恨南康李守致上尊乃此泉名也戯成一絶石鏡溪廬山紀㳺四十韻帰宗樅老言盧山有對云簡寂􅀚中甜苦笋帰宗寺裏淡鹹韲予因以湯泉石鏡戯成一絶開先僧贈石菖蒲别廬山題天華院中秋宿瀼溪驛瑞昌李宰贈元次山集中秋思鄉用瀼溪韻宿多福院昨日飯金城􅀚今日飯石田驛瑞昌永興道中作􅀫真如寺至興囯軍題懐坡閣贈王景文囯正贈陶永州次韻王景文贈行四絶題謀野堂聞詩聞禮不赴秋試以七月二十五日離大學八月二十六日至興囯軍喜其来也因作是詩途中遇雨􅀫大冶縣東方寺宋武帝廟􅀫武昌縣㳺西山寺遇雨兩􅀫縣驛呉大帝廟望黄州過樊口􅀫華容寺朝離華容莫􅀫孟橋小店陋甚得莫􅈇子􅀩書以八百料舡見借遂可鼓揖而西矣至鄂渚泊報恩寺題一覧亭莫􅈇以􅐜􅃵薦杯第十一卷詩九日懐故鄊登壓雲亭贈趙都統撙九日陪諸公登髙十月觧舟晚泊江口望鄂渚漢陽觧䌫南浦􅀄泝長江江流出鄂渚漢陽兩山之間雲靄横之如一山然過金口市江中有渚名鯉魚甲渚上有蘆花連日遇逆風舟以寸進挽舟者行蘆中成四絶食鰕􅀫通濟口蘆花夜􅀫思湖口繋䌫蘆葦間夜半聞叢中有聲舟人驚起终夕為之不􅄰舟中作漢水􅀫夏郡口九月十五夜􅀫高牙亡娣之􅌾在九月而不得其日十五日讀坡詩至英公燎須事不覺悲涕是日辛酉得非塟日邪詩以寓哀買魚行過八疊有小舟賣鰕是日風便但江岸縈迃疾徐相半過三义泛泛江漢水􅀫網歩時巳入夜猶行舟忽聞犬声知有人家􅀌燈一􅀧盖漁舎也是夕有月不飲過畢家池有姓陳者送香橙八顆云有子在太學名景􅀄有佛舎額曰永固院臨水而門閉有神祠云江南吴王廟必孫氏也晚過沙灘有漁人舉網鯿魚二百餘頭橙橘正正青黄以百錢買橘得十六顆比鄉里小而味酸舟中懐畨昜趙倅公及諸同官用九日登高韻􅀫􅂵㣲二十一日至福田院留建聖節􅀫金雞渡􅀫王家村讀楚東倡酬集􅀉洪景盧王嘉叟􅀉題番昜一江亭早至魯家洑復八太河見石首山舟中記所見二十五日先妣逺忌􅀕于舟中夜􅀫下沙歩有小浦蔵舟于口惧有風也是夜浪忽作声如潮舟為之撼如是者三舟人驚惧􅀄謂有風起視則天籟不號星月皎然篙工云江中畏炮炙鄰舟有煎油者岸圯而浪生曉視之果有圯䖏或云鼋鼍之属因記之天晴風順舟行過石首縣􅀫劉郎洑予自鄂渚登舟近兩旬得順風􅅻二日耳高牙遇風雨留两日既而得順風過八疊江流迃曲疾徐相半二十六日風駚甚方快之謂公安可一日到也明日如故江與風背浪洶涌停舟不行復用前韻再讀楚東集用前韻􅀉景盧嘉叟冦萊公祠􅀫黄壇讀于公堂記􅀉孫録聦伯十月四日􅀫于沙市舟中捲簾怱見新月天色如水鄉思凄然得詩一聮云詩成天作􅁓簾捲月爲鈎連夕燭有花至六日家書来自臨安足成一篇􅀉二弟􅀄九日離荆南用䕫州舡過虎牙至峡州登至喜亭謁歐公祠爾雅䑓楚塞樓離夷陵移舟至水西􅀅遵陸霧甚咫尺不辨舟人失津退􅂾里遇渡舡引而至岸有山在􅀩籠中乃􅀚音䑓也過姜詩村飯土門鋪晚􅀫油榨有山名四靣頗飯桃花鋪􅀫覆盆上大望州鑚天三里􅀫千石聞誦書聲枕上聞皷角過九盤嶺飯周平鋪南北山峯峦皆竒有佛頂峯鯉魚岩羅漢洞􅀃者謂􅀋巫山遇雨為雲霧所蔽不盡見至歸州􅀫報恩寺題屈原廟過稊帰二十四日親帥印于州大拽鋪􅀫巴東縣懐冦忠愍􅀄八巫山界登羅護関雲霧晦􅄀黙禱之因成一絶霧開復成一絶登得勝岡謁武安王関雲長廟有泉一泓俗􅀓謂兵至此無水拔刀刺地泉随而湧廟西有磨刀溪北有晒甲崖過風口望巫峡岩嶂如雁山祥雲峯經行峡烟霞障登燕子坡前有一岩在江之旁如天台赤城名烏飛岩巴東之西近江有夫子洞亦曰聖洞巫山縣有孔子泉􅀃者謂旱而祈則應泉旁之民雖童子皆能書夫子胡爲洞扵此且有泉耶詩以辨之自鄂渚至䕫府途中記所見一百十韻第十二卷詩􅀄到䕫州查􅈇元章生日周􅈇行可和詩復用前韻并簡元章又用行可韻行可再和用其韻以詶又詶元章行可元章再賦二詩依韻以詶前篇寓二後篇寓三元章贈餘甘子用前韻行可骨肉自西州来用門字韵賛喜呉叅議詩用前韻以詶聞馬綱復行舊路聖主之恩諸公奏也元章用前韵喜而和之州縣有戒石飭官吏也某至夔之􅀄詩以自警云出郊送虞叅政因㳺竹亭小飲與者九人立春􅀉劉侍􅀰韶羙正月六日㳺磧呈呈同官買山給水修壘種柳江月亭二絶登真武山上元山中百姓出㳺作三章諭之題諸􅁑武侯祠登詩史堂􅀚少陵􅀞像送参議呉郎中􅇪州祀社稷于州之西五里地不盈畆壇宇庳陋垣墻頽圯非所以崇明祀也買地昜路築屋増壇命同僚董其事不踰月告成二月戊子祀事既畢詩以記之㳺卧龍山呈行可元章聞詩得男名之曰􅇪甘露降于宅堂竹間凡半月三經雨乃止州宅有甘露堂昔周侍郎為郡露降焉易見山堂以名之予無善政惧其為灾記以二絶元章贈蘭卧龍山有武侯新祠再用前韻􅀉書與二叔二弟題卧龍山􅀚音泉呈行可元章元章贈筆戯成一絶再詶元章又荅行可詶行可惠白酒同行可元章報㤙寺行香登佛牙楼望勝已山五月四日與同僚南楼􅀚競渡因成小詩四首明日同行可元章登楼又成五首劉韶羙至巫山􅀉詩因次其韻送元章改􅈇成都次韻元章留别夜與韻羙飲酒瑞白堂秉燭􅀚跳珠分韻得跳字儀鳯得珠字次韻韶羙失舟閔書韶羙帰舟過􅇪留半月語離作惡詩二章以送元章至雲安用送韶羙韻見􅀉次韻以詶静暉楼前有荔子一株木老矣猶未主予去其枯枝今歲遂生一二百顆至六月方熟行可和詩再用前韻行可再和因思前日與韶羙同飲計䑓臨池摘實復用前韻又用韻呈行可元章至萬州湖灘􅀉六言一絶云滿目莫山平逺一池雲錦清酣忽有鍾声林際直疑夣到江南某六月翔日登靜暉楼􅀚江漲望西南碧逺􅂾峯乃前日送别䖏也為之黯然楼前荔子􅀄丹次韻􅀉元章韶羙至雲安􅀉詩二首再用詩字韻以􅀉伏日與同官小飲瑞白堂􅀚跳珠分韻賦詩伏日懐番易同僚餘干翁簿以予去饒之日郡人断橋見留􅀞啚賦詩見􅀉因次其韻贈裴童子行可生日王嘉叟和讀楚東詩復用前韻以􅀉嘉叟和黯字詩再用前韻以􅀉和喻叔竒􅀫大木寺用讀楚東集韻􅀉元章納涼立秋七夕懐番昜齒落用昌黎韻第十三卷詩十八坊詩宣化刑清介福弭莭皇華興儒崇化􅅷遷興龍卧龍慶豊禮賓通津義泉永安折桂知足和風制勝樓中元日得雨夣覺偶成題無􅀮齋􅀉交代張真父舎人􅈇臺賞荷華因誦昌黎太華峯頭玉井蓮句遂用其韻呈行可再用前韻張主管攝郡秭帰贈以三絶蒲萄􅀉趙果州􅀉閻普州八月十二日雨中秋對月用昌黎贈張功曺韻呈同官盤古廟趙果州之子年十四能作大字果州自荆南以詩􅀉予命書之字畫老成異日必名家因贈以詩送如上人州宅雜詠甘露堂萬卷堂瑞白堂詩史堂易治堂細香堂靜暉楼制勝楼穿楊亭無􅀮齋跳珠土洞栢荔竹柑前軰有滿城風雨近重陽句而不成篇九月六日遇雨因為足之招同官分韻又用前句作七絶九日登卧龍山呈同官又一絶送何希深舎人赴召至瞿唐関戯用山名成一絶連日至瞿唐謁白帝祠登越公三峽堂徘徊覧右共成十二絶瞿唐灔澦白帝祠越公堂三峡堂石筍白塩赤甲東屯昭烈廟八陣啚勝已山題無􅀮齋送喻令十月九日雪食柑十日買黄菊二株采菊啚梁彭州歸自道山泝流入峡以二詩見􅀉因次其韻梁彭州與客登卧山送酒二尊閻普州趙果州舟中唱和以巨軸見􅀉詶以二首丙戍冬十月閻惠夫梁子紹得郡還蜀聮舟過􅇪訪予於郡齋修同年之好也因􅀚太上皇帝親擢御札及舘閣題名感歎良父輙成惡詩一章以紀陳迹且志吾儕㑹合之意與二同年􅀚雪于八陳臺果州㑹焉酌酒論文煮惠山泉瀹建谿茶誦少陵江流石不轉之句復用前韻惠夫子紹二同年懐章過夔宗英趙􅀂拙聮舟西上賦詩二首記吾三人㑹合之異次韻仍簡二同年與惠夫􅀂拙小酌郡齋再用聮字韻并􅀉子紹三友室生日􅀚􅀞像杜殿院挽詞㑹同僚于郡齋煮惠山泉亨建谿茶酌瞿唐春同僚和詩復用前韻蠟梅子紹至雲安復和前詩見􅀉酬以二首趙􅀂拙卓爾不群佳公子也痛親不見名堂曰思諸公争賦之不鄙予亦以詩命予謂若拙不止乎思也且能􅂋之作思堂詩題朱鈐幹灝無喧室糟􅈉薦杯第十四卷詩至日􅀉二弟懐二叔連日鵲喜東帰之祥也詩􅀉二弟白雲樓赴周􅈇飯追念行可哭陳阜卿夣人贈范文正公集食筍冦萊公取韋蘇州野渡無人舟自横之句增為十字見于曽南豊所作公傳則知前輩作詩一言一句皆有来歴予用其􅀃為巴東祠記有新進士作詩云語當人意為佳句何與韋􅀰野渡舟用其韻以觧嘲䕫硯聞韶羙侍􅀰易任廣漢臘日與同官小集八陳䑓􅀚武侯新祠梅雪十八日迓虞叅政于城西竹亭去嵗亦以此日送之讀東坡詩除日元日趙果州送黄柑金泉酒四日雪坐間有江梅水僊花因目曰三白右梅花右水仙花右雪人日㳺磧􅂖日立春雙鵲王撫幹􅀩贈蘇黄真蹟酬以建茶予雪詩云不来平地只山巔朱鈐幹和云不能下乞俗人憐志在潔已陳知録云只可在山如去年志在䘏民王撫幹云散作人間大有年志在潤物三子之志雖不同皆可嘉也各用其句作三絶以贈之又以一絶自况右贈鈐幹右贈知録右贈撫幹右自况春雪十四日登真武山秃筆二月􅃋日詣學講堂前杏花正開呈教授泮宫杏花乃閻􅂵㣲為教官時所植復用前韻甘露堂前有杏花一株在􅁱竹之外殊有風味用昌黎韻送王撫幹行甫郡圃無海棠買數根植之哭純老次韻喻叔竒松竹圖􅀉巫山啚與林致一喻叔竒􅇪路十賢屈大夫嚴刺史顔諸􅁑武侯少陵先生陸宣公韋丞相䖏厚白文公柳文公冦萊公唐質肅公續訪得七人宋大夫玉源丞相乾曜李左相適之李丞相吉甫温御史造程伊川黄太史栢架次韻林江州題高逺亭登制勝樓再用前韻送宋山甫知縣六月一日食荔枝拾荔枝核欲種之戯成一首㓜女生日詩史堂荔枝歌周行可挽詞過客談梁彭州之政不容口聞爲虚額所困欲引去子願其少留以福千里􅂺􅀉惡詩食薏苡粥十賢堂栽竹詩史堂荔枝晚熟而佳預約同宫共賞偶成參差摘實分餉因誦廬陵先生詩云人生此事尚難必况欲功名書鼎􅉓復用前韻以歌之伏日與同僚㳺三友亭分韻得炎字制勝樓有元豊間太守王延禧及計臺郡僚過客唱和詩大書於版􅀊乆字漫命筆史再書之記以數語雷聲某二年于䕫􅀼食而巳無徳於民尤無功於學校泮宫諸生相與肖其像而祠之意固厚矣然非所冝得呈蘇教授聞得呉興七夕呈同官别䕫州三絶贈牟童子别同官第十五卷詩七月十七日離䕫州是夜􅀫瞿唐至東屯謁少陵祠東屯溪山之勝似吾家左原登古峯嶺望䕫州古峯驛小飲燕子陵悼巫山趙宰巫峡神女廟昭君村過大拽石門謁清烈廟登獨醒亭黄牛峡黄牛廟蝦䗫碚水石漁翁至善亭又一絶郭道山􅀫􅈅口江陵舟中作查元章自成都走書至江陵并貺蜀牋附子離沙市天色變舟人惧風作少憇公安而行黙檮有應望石首山過三沱塔子山魯家洑􅀫人老湾烏沙鎮避風維舟岳陽之西岸徐師􅆜風作不敢行再留一􅀫用韓昌黎洞庭阻風韻示同行朱仲文張子是望洞庭賈岳州以予阻風致酒肉之贈魚鰕􅀄欲維舟岳陽樓下適風作遂泊南津岳陽樓洞庭湖讀兵陽樓記君山南津淑濟廟過僊亭觧舟遇風暫泊岳陽城下正對君山岳陽城下岸赤色亦呼赤壁君山形如龍南有一小山如􅀛燕公樓道人磯泊􅇓江甲舟遇逆風破