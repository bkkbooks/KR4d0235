  text: 梅溪先生後集卷第十三
  hash: sha256:dc5b5ddd11362a8959457e6974f990540b68e8128b48c2aa6f52f2bdcd671759
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_013-1a}
body:
  text: 詩十八坊詩宣化聖主有美化丁寕戒守臣母令挂墙壁宣以及吾民刑清昔日循良吏獄空无怨声刑清本无術心地要先清介福兹地有神宇人人来薦羞神雖􅀎介福福亦自須求弭莭川峡天下險㡬人持莭過好来平処弭莫起險中波皇華䕫府皇華地乗軺都幾人誰如二使者實恵活斯民海陵查元章少城周行可同爲䕫􅈇措置􅅯折以寛民力蠲一路積􅀒凡十余万緡時它路方進羡余興儒刀笠燒畬俗舟航撇旋鄉五􅀴誰教子儒術破天荒崇化西接卿雲里東連屈宋鄉好風吹峡水盡作魯芹香􅅷迁相與勿言利要令通有无家家香一瓣心慕舜之徒予某過此坊見多焚香者興龍欽宗皇帝母王皇后所生之地寺額曰龍㒷丗仰欽宗聖人知太毋賢千秋龍巳化香火蜀江􅁁卧龍非長陳夀賛无首杜陵詩庙貌并公論如今勝昔時􅂟豊誰道䕫門陋兹坊號􅂟豊守臣􅁨囯􅂅端佀杜陵翁禮賓前山名勝巳䕫子有嘉賓舘闢自予始媿非賢主人通津大江来自蜀衆水共朝東我􅁒扁舟去問津􅀙此通義泉官費接筒竹民蠲沽水錢丁寕後来者莫􅀒義名泉永安分鼎江山在受遺宫闕荒風雲時惨淡疑㑹旧明良折桂月窟何人到向来標傍新如今折桂者不止一坊人知􅁕二踈帰去後林下少休官聖代䕫門裏一枝栖故鵉譚主簿弃官􅀮于是坊和風郡城深僻処車馬罕􅀴過中有人多少人和風自和制勝楼絶塞依天險髙城瞰陳啚公孫曽帝蜀諸􅁑􅁒吞吴尊爼衝千里関山敵万夫人謀兼地利端坐静􅁁隅中元日淂雨秋陽亢流火時雨洗中元既賀苗蘇稿还欣暑滌煩徳知天地大功任􅄦神言􅂅作老農圃一犂耕故園萝斍偶成早秋良夜月朦朧夣斍凉生枕簟中􅂾􅀧過雲簷外雨一声落木隴頭風題无􅀮亝􅀉交代張真父舎人遥自不欺室来居无􅀮亝事君均有犯淂郡两俱佳西蜀去何猛東甌帰末諧清風􅂾竿竹時見故人懁􅈇䑓賞荷花因誦昌􅀺太華峯頭玉井蓮句遂用其韵呈行可天池水落華開蓮綉衣呼賔傾玉舡賞花對酒誦隹句香徹鼻􅀚頭風痊韓公思摘太華實陶令不結東林縁何如君有第一朶池上許我清芬連池心􅀄開一朶􅄪用前韵萝􅋄池塘千頃蓮紅雲楼閣㳺人舡永嘉有萝􅋄池紅雲楼董薫風日作夏供病不湏薬花􅀎痊朅来夔門念鄉囯浄友喜結西臺縁明年華開各南北今日有酒冝㽞連張主管挕郡秭帰贈以三絶魏公名徳㝡芬馨猶子傳家有典刑勉力施行誠與善民謡待向峡中听女須帰処郡如何地狭民貧事不多把酒送行无别語要先抚字後催科政術遥傳京兆張咲談為治定循良諸生相見冝相勉正是風騷屈宋鄉蒲萄水晶馬乳薦新秋青􅂵酸甜孰味􅄖只可堆塩餉韓子不冝醸酒愽凉州􅀉趙果州九江話别已􅀴年三峡相逢豈偶然預掃江頭禮賔舘論文尊酒菊花天􅀉閻普州對䇿天庭老布衣直言中已有危機須知東普勝西掖好買扁舟及早帰八月十二日雨七月之間旱如燬禱而淂之偶然耳八月又旱農无秋同僚􅂆效前日求我方省愆未及禱沛然一雨蘇群槁古人重請􅀿上公何敢頻煩瀆蒼穹但􅂅時􅊙及時雨不獨一州天下普中秋對月用昌􅀺贈張功曺韵呈同官水精為鑑金為波挂空影冩山與河韓詩河韵在前清光此夜十分好有酒有客冝高歌去年今日行役苦浪叟谿􅁁宿逢雨去歳中秋􅀫瑞昌驛凢次山旧􅀮処傳聞蜀道如天髙崖懸壁絶哀猿號波横劍㦸不易上陸有虎豹何由迯江山旧恃白帝險風俗猶帯烏蛮臊驅馳兩月到西塞萝􅄰万里還東皐嗅梅踏雪巴子里路入鬼門欣不死飛飛倦鳥惟思還玉筍豈是麄官班餘生但􅂅閑及酒虚名寕顧觸与蛮良宵佳客十有五雲放月入尊罍間頽然老子㒷不淺韓詩坡句聊追攀君不見天宝雲霓羽衣歌人間楽舞难同科遺音猶在悲凉多舞霓裳隊有酒且飲遑䘏他不飲如此良夜何盤古庙盤古千千古江頭遺像存伏羲猶後軰禮殿尽諸孫不屋昔非陋有祠今未尊東鄰二郎庙巫覡醉朝昏盤古祠止一間廟陋甚無􅀕祀者旁有二郎庙祀者甚衆趙果州之子年十四䏻作大字果州自荆南以詩􅀉予命書之字晝老成異日必名家因贈以詩子政平生宜諒聞故應有子嗣清芬讀書行見破万卷識字豈惟䏻八分年少便冝􅀚上囯詩成真可張吾軍校讎異日居天禄玉葉金枝有子雲送如上人蜀道青天不易登飄然雲水遇鄉僧芒鞋便欲相随去身􅅞麄官愧未䏻十年作别稽山下万里相逢峡水西天下名山㳺已遍好㝷潜澗一枝栖州宅雜詠甘露堂昔日賢大守堂前零露甘我来无善政露下亦何堪萬卷堂書讀万卷破少􅁜􅀚囯􅀄登堂吾有媿頭白腹空虗瑞白堂昔日曽䕫州兹堂見三白為瑞不嫌多年豊㝡冝麥詩史堂誰鐫堂上石光艶少陵章莫作詩人看斯文似于長易治堂旧名整暇風俗无難易治之端在人古䕫􅀹易治風俗本来淳唐李貽孫記夔州風俗云其賦易征其民不偷長吏淂其道莅之􅀂反掌耳細香堂旧名愚堂官舎誰為友青青只此君細香来燕寢奚用炷炉熏静暉楼占淂高明地長聞燕􅆍香江流匹練白竹日万金黄制勝楼形勝㩀天險金湯无以過英雄多失守制勝在人和穿楊亭仁者果何似冝於射也􅀚穿楊不在手心地要湏端无􅀮垒勿謂江湖逺長如天日臨事君何敢􅀮中外一般心跳珠分淂天池水跳成月峡珠一清夔子囯炎瘴自今無土洞穴土誰為洞温凉􅁒自􅀻人間有寒暑坐此豈容知州宅有二土洞一在設斤之比一在静暉楼之下冬可避寒夏冝取凉然乆処其間則䏻発疾非天地之正氣也柏深山䕫子囯古柏静暉楼柯葉今如許相看幾故侯荔誰種楼前荔周天㡬歳星子随心地赤葉到歳寒心竹郡亝誰種竹緑䕃未多濃我􅁒添清閟殷勤護籜龍柑白帝誰云陋黄柑亦自香一株三百顆風味自吾鄉前軰有滿城風雨近重陽句而不成篇九月六日遇雨因為􅁕之招同官分韵滿城風雨近重陽凖擬登高尚渺茫㑹見明朝天氣好不教􅀌􅀒菊花黄又用前句作七絶重陽无数日風雨登臨緩㑹見天氣佳黄花挿湏滿老對黄花莭遥臨白帝城空亝听蕭瑟􅀧􅀧是鄉情江山悲木落身丗嘆飄蓬未㑹登山客先吹堕㡌風巫峡有雄風菊天多細雨知我􅁒登髙先期洗塵土竹葉悲杜􅁜秋雲吟柳惲家鄉㕍蕩遥莭物龍山近􅁅飛季秋管雲暗巫山峯我欲廓氛曀試呼􅀺与重莭近愁隂雨雲披見太陽殷勤呼酒伴爛熳醉秋光九日登卧龍山呈同官老逢佳莭強躋攀㒷遶東籬媿未還与客携壷登縹緲㝷僧對榻卧幽閑白塩照日一峯古烏㡌吹凬双鬂班坐上无非孟嘉軰卧龍山􅁍勝龍山又一絶䕫子山髙峡天闊騷人宅近刚腸悲菊花上頭不易淂酒盞到手何湏辤送何希深舎人赴召十年持莭囯西門万里東帰徳愈尊平叔渊源易論語子雲㳺戯字方言坐令囯体還元氣重見文星照掖垣廊庙諸公倘相問爲言真􅁒老田園至瞿唐関戯用山名成一絶取友要如山勝巳居官冝似地青簾􅁁庭未静尚赤甲鼎鼐􅁒調須白塩連日至瞿唐謁白帝祠登越公三峽堂徘徊覧古共成十二絶瞿唐七日重来白帝城勞生逺宦厭将迎瞿唐莫下今冝下㒷逐漁舟一葉䡖灔澦水漲瞿唐􅀔更危舟人貪進只嫌遟天将此石垂深戒看取形如象馬時白帝城火徳重㒷六合同金行数止一星終鼎分雖媿刘元徳面􅅞肯為安楽公越公堂柱囯楊家二世亡越公遺迹獨緜長不􅀎牢固隋基業枉費精神在一堂三峡堂三峽堂中看倒流沉舟側畔過千舟丗途險更勝三峽多少人懐積羽􅁨石筍白帝祠前石筍三根連灔澦立相參不知此石􅀎言否往事應同老柏談有二柏甚古白塩蜀中塩井知多少功利端䏻与海分尚使此山真可煑商功計利更紛紛赤甲赤甲城連白帝城子陽曽向此屯兵區區板築徒劳耳尚赤由来是漢營東屯少陵别業古東屯一飯遺忠畎畆存我軰月叨官九斗須知粒粒是君恩昭烈廟老臣苦欲争天下嗣子何曽思蜀中古屋数椽猶庙食傷心地近永安宫八陣啚一家天下裂三都忠憤填胷出陣啚千載相知惟白水此心元不為吞呉勝已山􅀻心克盡道方大勝已与㳺名始成物我太深誰氏子郤将已勝易山名有易為已勝者見啚經題无􅀮亝􅉉日照我几竹風清我􅁭官身心処士官舎􅃐山林送喻令捫膝先生有鳯毛三年魚邑試牛刀要令人􅀍絃歌化詎􅈕身辝州縣勞賢令首祠唐質肅詩篇時出楚風騷西帰更勉家傳學雲翼行看九万髙十月九日雪䕫子今年雪􅀄冬已在山峯非是塩白鬂不為詩班寒律三朝後五日立冬雷声八日間二日雷潜催子猷棹乗㒷早知還食柑蕭山陸吉東坡􅀓䕫子黄柑老杜詩楚越相望五千圼西州滋味獨儂知十日買黄菊二㭑十月更十日黄花􅄏滿枝鮮鮮如可飡采采還自疑重陽不堪摘况後一月期既晚何用好兹言聞退之天然傲霜性寕問早与遟不以日月断深杯為花持采菊啚渊明耻折腰慨然詠式㣲閑居愛重九采菊来白衣南山忽在眼倦鳥亦知帰至今東篱花清如首陽􅅔梁彭州帰自道山泝流入峽以二詩見􅀉因次其韵首遇重華闢四門郡符帥閫誤􅀩㤙路􅀴灔澦少陵鬂􅋄萝池塘灵運䰟馬運敢辝論水陸兵儲未暇議營屯故人相見談時事耿耿胷中直氣存壮夫白首兩同年又継錢塘唱和篇十載音書天上㕍一江風雪峽中舡西州賢守淂高適東􅀚人才推孟堅􅂵陌曽陪探花馬姓名深媿在盧前梁彭州與客登卧龍山送酒二尊五馬携壺上卧龍四䕫連􅀐与㳺􅀙山中古柏歳寒色􅀿為清流作意濃天禄帰来楊子雲酒随後乗為論文梁云舟中猶在淅酒雲安麹木瓶双玉聊助詩人作小醺閻普州趙果州舟中唱和以巨軸見􅀉詶以二首聮舟西上沸􅂬声趙壁隋珠照坐明一客詞流三峡水百篇詩壓五言城廣文旧舎欣重掃閻甞為夔府教官阿買竒児况侍行果州二子皆善作字我以禮賓名客舘雲安麹米待君傾灯結寒花鵲有声書傳双鯉眼増明人言盡是靑雲士天遣相逢白帝城冨貴有機端可畏山川非險莫辝行定知蜀道􅀙今易東普南充盖巳傾丙戌冬千月閻恵夫梁子紹得郡還蜀聮舟過䕫訪予於郡亝修同年之好也因􅀚太上皇帝親擢御札及舘閣題名感嘆良乆輒成惡詩一章以紀陳迹且志吾㑪㑹合之異光堯親擢賜巍科穅秕居前有媿多書向蓬山俱􅀧勘皆為校書郎詩􅀙天竺共吟哦有游天竺唱和十年尊酒喜身健五馬人生驚鬂皤予与閻老矣梁方三十九然客鬂巳不及登第時握手䕫門話疇昔君㤙未報􅁒如何与二同年􅀚雪于八陳果州㑹焉酌酒論文煮恵山泉㵸建溪茶誦少􅁜江流石不轉之句復用前韵吾㑪風味雅同科領略江山逸㒷多諸􅁑陳啚上看少􅁜詩句酒中哦恵山活水煎茶白勝巳高峯帯雪皤絶境况逢三五馬定将好句壓隂何恵夫子紹二同年懐章過䕫宗英趙􅀂拙聮舟西上賦詩二首記吾三人㑹合之異次韵仍簡二同年端似唐人㑹合年句追籍徹孟韓聮朱幡俱任専城􅀉白首叨持帥閫􅁠鼎甲豈如天聖榜果州詩歴㪯天聖以來鼎甲之宗盟不减徳麟賢客真不惡主人惡勝巳山名自古􅀓䕫州前山名勝巳晚菊鮮鮮梅蘃新天涯對酒忽三人才高不比丹青相志大聊為州縣臣梁彭州麾把普彭䕫子囯榜同􅉟愈季元賔二公行矣居廊庙放我江湖作逸民与恵夫若拙小酌郡亝􅄪用聮字韵并􅀉子紹子绍已行杯盤􅋄􅋄酌同年更与英英玉葉聨我軰論交真有道異時當囯􅂅无􅁠䇿蒙親擢言尤直御批閻䇿云尽言无􅀮召不留中已足賢果州召對不􅇔天遣西来結詩社郵筒毋惜徃来傳三友堂閻梁二同秊過䕫把酒論文于小書室既别因目之曰三友丁丑同秊友三人忽此逢符分俱握虎簮盍偶成龍抚卷神山逺衘杯瑞雪濃一壷勝太白形影月㳺􅀙生日老遇懸弧旦天涯把一麾誤䝉崧嶽句忍誦蓼莪詩莭物梅經眼年華雪上眉児曺觴夀酒盡是祝帰期􅀚畫像似我豈真我相看還自疑陋非臺閣像高失布􅅊時吟苦眉常皺􅁨多鬂早衰惓惓畎畆志无復畫師知杜殿院挽詞流落杜陵老平生一飯忠大賢冝有後異代果生公文艶神藜烛霜蹄御史騘九原呼不起蕭瑟􅁊㙜親擢逢明主㙜綱振一時觸真同獬廌問不到狐狸姦佞巳落膽江湖甘把麾賢哉郭有道無媿蔡邕碑我昔㳺三舘聞公論立朝端如平日語果不小人饒公每云某饒淂君子不饒小人莭義真齊固年齡不逮喬英魂巳上天楚些詎容招㑹同僚于郡齋煮恵山泉烹建谿茶酌瞿唐春􅃬泉龍焙忽飛来春著瞿唐􅀄潑醅腸似玉川堪七碗㒷如太白謾三杯月團不許无詩淂霜蘂端因有分開王抚幹以晚菊一盆耒頗佳石銚瓦盆吾已具竹林它日定相陪同僚和詩復用前韵掃地焚香待客来煎泉瀹茗漉官醅相公溪近何曽汲􅈅東有相公溪以丁謂淂名水可煎茶白帝城寒正可杯江上詩成風葉落閣中興動雪梅開嘉賔飲散鈴亝静月照虚窓有影陪䗶梅天工著意􅀧酡酥不與江梅闘雪膚露滴蜂房醸崖􅁡日烘龍腦噴金炉万松張盖黄􅀹好三峽蔵春緑不枯東南䗶梅葉落始開峽中地煖花開而葉不落題品倘非坡与谷世人􅀿作小䖝呼宋山甫知縣云大寕監多䗶梅土人不知貴呼為狗蠅花子紹至雲安復和前䪨見􅀉酬以二首細閱皇朝進士科第三人㝡淂賢多滕建道陳了翁張才叔潘子賤諸公是也然皆艰难劳苦而後有立不勞則餓天将任或起而僵帝欲哦舘閣早推仁者勇廟堂終作囯之皤也知有意東山卧其柰蒼生望子何梁臨别指瞿唐関有􅂴出此門之語不比求㳺占一科无施不可患才多手持江海一麾去萝与神仙七字哦客裏有書情愈重别来多病鬂添皤郡亝獨坐歳華莫眼見官梅深憶何趙􅀂拙卓尔不群佳公子也痛親不見名堂曰思諸公争賦之不鄙予亦以詩命予謂􅀂拙不止乎思也且􅀎􅂋之作思堂詩天下人子皆思親思而􅂋之䏻㡬人入堂省親親不見長向􅃵墙見親面身苟不立名不􅀭九原何由發幽光金枝挺挺賢公子風􅀣㒷悲思不已口誦孝􅀴苐一篇立身行道期心傳直諒多聞古三益標凖宗支名籍籍前日召还胡不㽞一麾出守西南州官聀人心所同欲孝子思親恐親辱不獨思親能􅂋親孔門曽子君前身我愧思親未􅀎􅂋詩作思堂涕徒泫題朱鈐幹灝无喧室雅抱渊明尚䖏喧思避喧門雖有車馬趣不異丘園仁者本来静時然􅀿亦言端􅀎重吾幕无復􅅰為煩糟蠏薦杯麴生有理何曽濁公子無腸却㝡佳羅饌寕同冨児飲帶糟聊慰老饕懐梅溪先生後集卷第十三梅溪先生文集卷第十三問䇿問二十八􅀫在天爲經星循環徃來以成四時非􅀂北辰居所一定而不移也然自古志天文者皆以角亢七星為東方之􅀫奎婁七星為西方之􅀫自井至軫􅀫七為南自斗至璧􅀫七為北抑嘗仰觀之四時晨昏迭爲出􅃿行皆自古靡有定方而乃以蒼龍朱鳥咸池元武分宫以四之何耶舉天星以定四時莫如堯典按堯典以定四方盖有可疑者焉在時爲春則方爲東也朱鳥南方列􅀫爾乃紀之春在時爲夏則方爲南也大火東方中星爾乃紀之夏西爲秋其􅀫白虎也乃正仲秋以北方之虚北爲冬其􅀫元武也乃正仲冬以北方之昴􅀅考四時以定列􅀫之方堯之時與方乃爾不同何也吕氏月令載十有二月昏晨之中星可謂詳矣然以仲春之月昏弧中而不舉七星至季春則曰昏七星中仲夏之月昏亢中而不及大火至季夏則曰昏火中記牽牛中於仲秋之昏而不及星虚記東壁中於仲冬之昏而不及星昴其與堯典又差錯不同矣左氏論􅀕祀之時則曰龍見而雩論士功之時則曰龍見而畢務龍見固有常時而雩與畢務之時􅀄不同也左氏皆曰龍見抑又何耶諸君晝觀經傳夜觀星斗其於列星之􅄤次所見之晨昏固巳洞然於胷中矣觀􅁚定方何以驗其爲東西南北耶與夫堯典吕令左傳所載之異同必有成􅀃以一之也問昔禹治洪水随山濬川别天下爲九州其詳見於禹貢後世言地理者咸根本於斯焉然卽其書而考之有不能無疑者梁􅄮二山雍州之地也而扵兾州言之曰旣載壷口治梁及􅄮雍州之山不容記扵兾豈兾方自有所謂梁􅄮者乎不然則九州名山其訛者不止於梁􅄮矣沱􅇓二水名也而於荆梁二州各記之曰沱潜旣道二水不容經歴两州數千里之逺豈两州之地各有所謂沱􅇓者乎不然則九州大川其訛者不止扵沱潜矣其叙山於九州之末自􅋚岍及岐而下則四逾于河自壷口雷首而下則回入于海自􅋚嶓冡而下則曰過九江至于敷淺原天山静物也豈䏻逾河入海過江者耶禹何以驗其然也其叙漢水自嶓冡􅋚􅄥而下既曰南入于江匯澤爲彭蠡矣又曰東爲北江入于海其叙江水自㞴山􅋚江而下旣曰㑹于匯矣又曰東爲中江入于海夫江旣與漢合且匯爲彭蠡矣江豈復于北而漢豈復爲中江耶禹何以驗其然也近世有以地脉論山者取於漢儒之三條有以水味論江者取於唐人之三沴禹之於山川豈亦以脉與味而知之乎漢儒三條唐人三沴亦有可驗否乎願詳考而備論之問昔夫子自衞反魯而六藝之文粲然不幸火于秦踳駁于漢耳口異傳源流遂别言昜者本田何田何之後有施孟梁丘之學並立愽士又别有京費二家今之所宗者王弼也不知弼之學出施孟梁丘歟京氏費氏歟惟而上之果得孔子授商瞿之㫖否歟言詩者有齊魯韓毛四家毛在當時未立于學今之所宗者毛氏不知齊魯韓自何世而㣲歟毛氏自何世而興歟萇之學也果得孔子授子夏之㫖否歟言書者本伏主又有歐陽大小夏侯之學又有孔安國者得古文尚書今所宗者孔氏傳也歐陽夏侯在漢爲最盛不知何所自而㣲歟孔安國之書未行而遇禍不知何代而興歟孔壁所藏伏主口授亦有異同否歟禮之經有二曰周官者周公致太平之興也曰禮記者孔子弟子撰所聞而記之也二經之始出也果何時其始傳也果何人其名家也凢幾軰今爲之章句者皆鄭氏也又豈無授受之自歟春秋之傳有五今所傳者左氏公榖也三家在漢迭爲盛衰孰始盛而後衰歟孰始衰而終盛歟彼杜預何休范寗者爲三家章句亦各有所受歟六經者日用之書也學者口不絶吟乆矣專門之傳授歴代之廢興其有闕而不知者耶夫經傳一也有興于前而廢于後衰于古而盛于今者果何致而然豈興而能乆者傳之當廢而遂絶者傳之非耶抑各繫時之幸不幸耶與昜之十翼詩之五際書之十例禮之三種春秋之五始攷之必有其名究之必有其義願併陳之庻觀諸君之傳問六經皆經也而夫子過庭之訓首及扵詩則詩之爲經學者所宜先也詩有風有雅有頌讀者不能無疑於其間二南皆文王詩也而繋之二公􅆁鄘衞皆衛詩也而分爲三國蟋蟀晉風也而謂之唐七月陳王業也而繁之􅃎􅁰離平王詩也而同於列􅀦此風之不能無疑也南有嘉魚羙太平之君子也而列於小雅鳬鷖亦羙太平之君子也而列扵大雅宣王刺於小雅而大雅則無刺焉厲王刺扵大雅而小雅則無刺焉幽王大小雅俱有刺康王大小雅則無詩此雅之不能無疑也頌者羙盛徳之形容而告於神明者也周有頌冝矣魯僖諸矦耳􅂚冝有頌㢤三百篇皆周詩也商異代之王耳􅂚爲而列扵周之末㢤此頌之不能無疑也學者豈徒習其章句識其鳥獸草木之名而巳耶因疑而究其義斯可與言詩矣至於風之正變者凢幾國大小雅之正變者凢幾篇與夫三頌之或先或後者何義諸君聞詩乆矣必有起予之辯問昔吾夫子討論墳典叙書百篇上自唐堯下迄秦穆其扵去取之際莫不有法焉固異乎左史􅀝相之流徒能誦其文而巳聖人旣􅃿經厄扵秦口授壁傳紛然異􅀃學者開卷莫决所疑夫断書自堯則堯典者固唐書也而謂之虞禹平水􅁟而後作貢則禹貢之作在唐虞之際而謂之夏舉書之詳者莫如左氏如荘八年僖二十四年二十七年襄二十六年所引之書皆大禹皐陶謨之辭也而悉曰夏書釋傳之詳者莫如杜預預以書證左氏所􅁛者固未嘗亡也而多謂之逸書夫以唐爲虞以虞爲夏聖人序書不應如是之踈而左氏授經亦不至如是之誤也而杜預以存爲逸預豈不知書者耶至􅀂武成一篇記武王偃武修文之事也夫子旣有取焉而孟子乃不信之楊雄謂虞夏之書渾渾商書灝灝周書噩噩四代之書固不同也而韓愈乃謂周誥商盤詰屈聲牙雄異商周書而愈同之抑又何耶諸君皆深扵書者也願辯夫子之所以序左丘明之所以􅁛杜預之所以注孟子之不信楊韓之異同者以告問昔夫以洪範九疇􅂌禹至箕子爲武王陳之孔子序之於周書王者治天下之法莫大扵是焉然其書有可疑言有可疑箕子爲武王陳之者又可疑不可以不辯也自􅀄一曰五行至威用六極先儒謂此六十五字皆洛書本文夫天且無言安得有書畫一以告人如是之詳悉耶有謂􅀄一曰之􅁼二十七字禹所加也有謂欽用農用之字洛書本有也又有謂􅀛文止二十字餘皆禹増益次第之也其􅀃紛然不同亦何所考㩀耶或謂河圗洛書本無有也聖人以神道設教耳其􅀃爲如何箕子之言曰鯀湮洪水汨陳其五行帝乃震怒不􅂌洪範九疇自古以来得九疇於天者止一禹耳未聞餘人有得之者使人皆得之而鯀不獨得也可以言帝怒矣鯀與衆人均不得之何以知其為怒而不􅂌耶鯀九載之績弗成殛之於羽山者舜也未聞天震怒之者箕子之爲言無乃失之誕乎或謂帝者堯也堯有洪範九疇乆矣怒鯀而不之􅂌其􅀃又如何至於九疇莫不有用也而五行之用爲最大乃反不言用八政莫不有官以掌之獨三卿舉官餘皆指事五紀獨不言時五福獨不言貴其理又何在耶箕子商臣也其不臣周冝矣而乃爲武王陳洪範洪範大法也不冝言而言其可以為臣子法歟聖人序之曰武王勝商殺受立武庚以箕子歸作洪範二事􅀂不相預而序􅂺及之豈聖人之意罪箕子之不當言耶洪範之書學者所冝盡心也其可疑有如此者􅂅與諸君辯之問昔吾夫子以謹嚴之法而作春秋寓賞罰之權扵一字當時口授弟子而其書未􅂋也後世傳經者三家各有所聞著之簡䇿非特㫖意不同而經文亦異人一而巳曰尹氏卒者公榖也左氏以爲君氏是果男子乎果婦人乎國一而巳曰祀侯来朝者左氏也公榖則以爲紀侯是果姒姓乎果姜姓乎渝平輸平字止半差而其義則反子伯子帛音雖小異而其􅀃則殊曰蒿艾曰鄗者一地也名􅀂何而可稽曰繆曰穆者一君也謚􅀂何而可考此曰衞寳彼曰衞浮則人物異矣此曰伐戎彼曰伐我則華夷異矣以㑹爲及則内外之志異矣以送爲逆則徃來之使異矣北杏曹南之㑹或侯齊宋或人齊宋則尊卑之辭不同矣寗母葵丘之盟或有鄭衞或無鄭衞則増損之數不同矣至􅀂義同而文異則有帥率克尅之􅀋焉豈亦有異義乎名一而音訛則有括結嘉喜之􅀋焉豈亦有異名乎經出扵聖人之手而有二三之不同唐趙氏嘗考其差繆凢二百六十處夫聖人以一字爲褒貶而三傳經文相戾如此一字之異一義之異也一義之害一經之害也􅀅左氏而是信乎而公榖釋經亦辯矣􅀅公榖是信乎而左氏紀事亦詳矣如之何則可今三傳並行于學非􅀂漢唐之尚偏專一而廢二也探討之際並有至當之論以折􅂨之勿云三傳可束之髙閣遂畧而不論問班孟堅作漢書嘗序六藝爲九種然出吾夫子之親筆者惟春秋與孝經學者沉潜六藝之外其於二經􅀹不可不熟究聖人有作之㫖也子亦嘗曰吾志在春秋行在孝經則聖人􅁒爲東周之志固存乎二百四十二年之筆削百行之羙當備見於十八章之中矣今讀二經亦有見吾夫子之志與行否乎考諸行事亦盡合於經否乎二書之成也夫子嘗有春秋属商孝經属參之語矣是二子在孔門中商必有得扵春秋參必有得扵孝經也商與參言行著於當時淵源傳諸後學不知其得扵經者亦有可見否乎果不􅀒聖人所属之意否乎孟子嘗謂春秋成而亂臣賊子懼􅀃者乃謂絶筆之後口授弟子至漢然後其書始出果如其言則當時列國君臣固未之見也何以能懼亂臣賊子耶遷固之徒皆謂孔子爲參作孝經説者又謂􅀴不爲參作盖假參以爲對揚之體爾二說亦莫知其孰是耶諸君兒時讀孝經巳能志其語學習春秋固巳探其奥其於聖人之志行與夫弟子之所學及孟軻遷固諸儒所􅀃之不同必能辯其所以然者問秉史筆者衆矣司馬遷爲之宗自班范而下雖人自爲家其大槩則沿襲史記之舊夫旣述前代之法以成書不必變其名例可也今考諸史乃或不然非特班固有變扵史遷後之作者亦互有損益異同矣曰紀曰表曰書曰世家曰列傳者司馬氏之書也班固因之獨昜書爲志而損其世家范瞱之史猶固也而損其表陳夀之史猶瞱也又損其志至晉書則有紀有志有傳而益其一曰則記南北獨紀傳而隋加志焉唐紀表志傳與班史同五代有紀傳有世家有附緑有考夫記事之義一也而立例之名不同何耶子長毎一卷之未􅁛太史公以断善惡孟堅昜之以賛蔚宗又孟之以論而贊以四言陳夀又昜之以評晋書或稱制或稱史臣又贊以章句與范史同南北曰論隋稱史臣唐書仍班史之體曰賛五代賛如唐而􅃿其名夫断善惡之義一也而名所以断者又各不同何耶遷書曰史記两漢晉隋唐則曰書三國則曰志南北五代則曰史夫歷代皆史也其所以名書者又何不同耶創之扵前者是則變之扵後者非同之扵後者非則異之扵前者是抑創之變之同之異之亦各有其義耶至扵自史遷以迄五季歷數之則十有七畧舉之則有三又其可以不知耶諸君皆飽扵史學者也姑以其淺者告我問中庸一書盖聖學淵源入徳之大要也􅀃者謂孔子之孫子思所作􅀚其微辭奥㫖非聖人之後命世大儒有不能者焉然其間立言措意亦有戾扵吾夫子者證以論語繋辭不得盡合學者疑之語曰中庸之爲徳也其至矣乎聖人以中庸爲至徳非大全君子不能當其名是書載夫子之言有君子之中庸有小人之中庸夫旣巳小人矣尚何中庸之有耶夫子以一貫之道語曽參參告門人曰夫子之道忠恕而巳矣是書乃有忠恕違道不逺之言則是以道與忠恕爲一而忠恕實未可以爲道也與論語又何不同也繋辭曰昜之興也其於中古乎作昜者其有憂患乎盖謂文王也是書載夫子之言曰無憂者其文王乎文王拘羙里而繇昜乃云無憂何也語曰三分天下有其二以服事商周之徳可謂至徳矣是書載夫子之言曰武王周公其逹孝矣乎善継人之志善述人之事文王終身事紂武王周公不待終䘮而伐之而云善継志述事何也語曰夏禮商禮吾能言之􅂎宋不足證也是書乃曰吾學夏禮祀不足證吾學商禮有宋存焉又未知其熟是耶天子傷周室之衰三光五嶽之氣分故春秋書王正月以大一統是書乃曰書同文車同􅁤孔子之時天下􅂚嘗同車書乎弟子記聖人之言行於論語皆稱子如子曰及子以四教之􅁼盖尊師重道之辭未嘗有字聖人者是書亦稱于曰冝矣而又有仲尼曰仲尼祖述堯舜之語焉豈有身為聖人之孫而字其祖者乎􅀼意秦火之後漢儒扵四十九篇中綴拾所存不能無附益之偽不然何以詭異聖人如是也孟子學子思者也七篇之書稱子思多矣獨無一言及其師之書又不知是書果子思作否耶必有以辯其疑者問唐史臣劉知幾著史通内篇稱古之作史者有六家一尚書二春秋三左傳四國語五史記六漢書又謂尚書家出扵太古春秋家出扵三代左傳國語出扵丘明史記漢書出扵遷固知幾最善著論而唐史稱之其所列六家必有考㩀然理有可疑者不得不與之辯書載堯舜三代之事春秋出扵吾夫子之親筆學者尊之以爲經不可誣矣知幾乃同遷固之書而史之可乎左傳國語雖曰二書然同出扵一丘明之手實左氏内外篇也而乃别為二家可乎史記創始扵馬遷而班固雖自爲一家其大法則祖述子長也今乃别為二家之流者是則范瞱陳夀而下又烏得不以名家乎以理論之書春秋經也左氏國語傳也史記漢書史也至扵史家者流持一馬遷爲倡爾見其有一未見其有六也知幾著其始末條例甚詳合經傳而爲史别一姓而二家散史漢而二流則必有􅀃焉又謂尚書四家其體乆廢所可祖述唯左氏及漢書不知後世秉史筆者果法左傳漢書二家之遺乎抑亦兼出扵六家者乎不然則知幾之言必有所不通者願因其􅀃而詳辯之問國莫重扵禮禮莫重扵􅀕􅀕有禮異而名殊者四焉曰天曰宗曰望曰䄍是也岐而分之其數二十有三天宗各六望三而䄍八古人行之固有一定之典後世異同之論起紛然而莫之正禮曰以禋祀祀昊天上帝又曰兆五帝于四郊此六天之説所由起也有以爲上帝與五行精氣之神者有以爲一天與五人帝者有以爲北辰耀􅅎寳與靈威仰赤熛怒含樞紐白招拒汁光紀者異􅀃凢三家􅀅何從而合成周之祀乎書曰肆􅁼于上帝禋于六宗此六宗之􅀃所由起也有曰時曰寒暑曰日曰月曰星曰水旱者有曰星辰司中司命風師􅀨師者有曰天地四時者有曰乹坤六子者有曰六代帝王者有曰三昭三穆者異􅀃凢十餘家􅀅何從而合虞舜之禋乎三望書扵春秋或以為㤗山河海或以爲㤗山淮海或以為分野之星及封內山川則三望之不同亦三家也八䄍見扵郊特牲曰先穡曰司穡曰田畯曰郵表畷曰猫虎曰防曰水􅅠曰昆䖝或以猫虎為二神而昆䖝不與焉則八䄍之不同亦二􅀃也四者之禮先王之所常行四者之􅀃諸儒不勝其異夫􅁒舉先王之禮而行之必先正名而定制茍牽惑於紛紜之論而不能断决其是非雖曰有其舉之莫可廢也不失之誣則失之陋矣如之何其可哉國家郊祀盛典三􅀊一行宗望之􅀕兼修並舉又􅀅因時和􅀊豐修伊耆氏故事勞吾農而休息之甚盛舉也諸君行将筮仕與禮樂之議敢問前代諸儒立異議者誰歟孰當孰否漢之君舉是禮者誰歟孰得孰失必有至當之論以祛群言之惑幸詳著于篇􅀅獻于朝俟有司之擇焉問行帝道而帝行王道而玉行伯道而伯此五帝三王五伯此所以分學者固巳稔聞而熟論之矣漢晁錯於大對之際嘗品藻其君臣其言有曰五帝神聖其臣不及三王臣主俱賢五覇主不及臣抑嘗考其迹而驗錯之言未免何疑也五帝唐虞為盛典謨載其行事為最詳􅀚堯舜禹皐陶稷契之徒相與都俞戒勅扵廟堂之上􅀄不見其主􅄖臣劣之迹錯何以知其不及也三代之君臣可稱非一其間固有主聖臣贒者錯㮣以俱贒目之亦豈通論耶五覇臣主􅀂無甚相逺者以管仲之志小烈卑上可爲威公之佐耳其他又可知謂主不及臣抑又何耶錯以贒良文學裒然爲舉首必有􅀁㩀而言諸君出入經史啇􅃀古今亦必有見其臣主不相及與俱贒處如錯所言敢問風后力牧至元愷之徒不及主者果何臣齊晉宋秦楚之覇不及臣者果何主夏商周之君臣所以俱贒者果何事也幸明以告我母詆錯言爲非而畧之問世之論士者不惟其身之觀亦觀其師友源淵然後可以知其人矣洙泗七十二子不必論其爲人以吾夫子卜之可以知其贒蘇秦張儀二子不必觀其行觀其所學者􅀑谷子爾則知其爲儀秦也雖然執此而論士有大不然者曽參以孝著於孔門得參之學而行之者冝其以孝而施於有政也孰謂䘮母不歸殺妻求􅀅者反出參之門㢤荀卿以中庸之學而爲大儒得卿之學而用之者謂能必行王道也孰謂燔詩書㓕禮樂者反出卿之門㢤老子著五千言明道徳之㫖得其學而行之者冝其清浄自正無爲自化可也孰知後世刑名法理之術至於苛刻少㤙者反出於宗老氏者耶不特此也斯之學用於秦者至慘矣意其學斯者又必甚扵斯也漢河南守與斯同邑固嘗學焉治行乃爲天下第一申韓之術施當時傳後世者至不仁矣意其學之者必有甚於申韓洛陽才子本名申韓乃能陳治安之䇿雖王者之佐亡以加前四子者所學善矣用之反不善後二子者所學不善矣用之反善兹又何也謂不在師友淵源耶洙泗􅂚爲而多賢儀秦􅂚爲而皆詐謂必在師友淵源耶諸子之行事與其所學又何其戾也諸君擇師尚友之日乆矣於師友淵源必能究之􅂅陳數子之所以然者問荀卿論王覇興七之道其言有曰上一而王下一而亡且以法始佐賢民愿俗羙四者齊謂之上一觀湯武之所以興與桀紂之所以亡信乎卿之言不妄也漢髙帝之創業光武之中興唐太宗兼創業守文之功徳是三者亦可謂後世之盛王也考漢唐二史而驗所以興之自不知果出扵上一乎抑亦雜出於上下偏之間乎三君者其孰優而孰劣乎秦隋之世天下統一然二國皆􅃍興而􅃍亡其興也豈出扵上一其亡也又豈盡出扵下一耶謂不出扵此則何興亡之􅃍謂必出乎此抑何上一下一之道始終變昜之異也􅂅併陳漢唐秦隋之迹以佐荀卿之􅀃問昔孟子對齊宣王謂仲尼之徒無道桓文之事董仲舒對江都昜王亦謂仲尼之徒雖五尺童子羞稱五覇果如二先生之言則覇者之事不復道諸聖賢之口也今質論語春秋容有不然語稱威文之譎正又稱九合之功仁管仲而大其賜春秋善召陵之盟進成濮之􅀾至宋襄楚荘秦穆雖不足與二伯之烈皆有以一㮣見取者孰謂無道其事而羞稱之耶豈聖人扵覇者猶有所取而門人弟子乃喜攻而羞道之耶夫子與人何恕而弟子責人何嚴耶不然則二先生之言失矣願與諸君辯之問唐虞以三載考績之法黜陟百官之賢否故時躋極治庻績咸熈漢唐遵遺法而行之其治效亦有可􅀚者洪惟國朝列聖圖治既以進退選舉之權付之宰相吏部又以舉刺按察之職委諸郡守􅁥司逮元祐􅀄先正司馬光以清徳雅望起慰蒼生進賢退姦中外恱服又嘗議立八條俾監司守臣察所部官吏有仁惠公直明敏㢘謹者可舉則舉苛酷狡佞昏懦貪縱者可按則按條目詳宻誠一時之良法然當時事未施行而議已中􅃦邇者宰臣有請上嘉而行之議者咸謂唐虞之㤗和元祐之清明可復見扵今日矣或謂法非不良也行之苟非其人不能無􅁦􅀅有權􅀔請託親故干求而舉非其實者挾情懐怨務快􅀻忿而劾不以公者苟二􅁦之不去則八條􅀅爲文具有不可得而行先朝之良法羙意又從而廢矣伊􅁒革其弊而乆其法必有術焉願講論之􅀅以聞于上問自古用人之方多出乎薦舉然薦舉之患有二焉不可不知也有公於薦舉者可以得人矣或失於知人不明而所舉非賢有明於知人者可以得賢矣或蔽於􅀼位之􅀻而見賢不舉諸􅁑亮之於蜀非不􅁒薦賢也而失之馬謖盖明有所不足臧文仲之於栁下惠非不知其賢也而不與立盖心有所不公夫所頼乎大臣之薦舉者以其公與明而巳二患不去而􅁒得人可慿恭惟主上當宁興歎懲前政之蔽賢乃命邇臣各舉所知起廢滯而應公車者踵相躡也邇者臣僚獻言慮所舉之或濫而賢否混殽以三人同薦爲請議者猶懼其未盡薦舉之方而徒艱進賢之路伊􅁒知人必明如簫何之識韓信而無孔明誤舉之失所舉必公如祁奚之舉善而無文仲蔽賢之􅀻如之何則可問昔吾夫子因魯史而作春秋信以傳信疑以傳疑雖以大聖作經猶不敢以其所傳聞而忽其所親見至於其所不知則缺如也其慎有如此者其後有孟子者出則不然其讀書也則曰盡信書不如無書吾於武成取二三䇿而巳其讀詩也則不信周餘􅀺民靡有子遺之言夫子信而好古如此孟子學孔子者也乃於詩書猶有所不信何耶後世諸儒因孟子之不盡信詩書而好爲異論徃徃於古之信書信史皆不能無疑於其間詩大序世傳爲子夏作乆矣而唐韓子不信之春秋漙為丘明釋經乆矣而啖趙之徒不信之昜繫辭為天子作無疑矣而近代歐陽子不信之至於疑五千言非老子所作有如崔浩疑荅蘇武書非李陵所作有如劉知幾有謂周禮非周公之書家語非孔氏之書文籍去古稍逺而見疑於後世者非一五經且不見信而况其他耶夫孟子之不信詩書也以血流漂杵與夫子遺之言誠有不足信者而後世諸隭所疑經史其亦有所見如孟子否耶抑亦出於穿鑿而好為異論耶豈歴世浸乆簡編漏傳傳聞繆誤實有可疑者耶其所疑亦必有得有失而不可以一槩論耶信其所可信疑其所可疑斯善觀書者也願與諸君辯之而断以髙明之見梅溪先生文集卷第十三
