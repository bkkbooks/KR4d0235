  text: 梅溪先生後集卷第十七
  hash: sha256:c8780824b6b9e518bd87eebb747371be98155f9b8a63882e7c570795945fd737
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_017-1a}
body:
  text: 詩戊子八月二日得泉州五年符竹換三州乞得祠宫欲少休名姓誤蒙君相記泉南千里又分􅁨觧舟九月二十九日觧舟城之南橙橘半青黄時節豈不好胡為辝故郷親朋送我行殷勤餽壷觴我欲與之飲舟去留靡遑僮僕别我帰黯然顔色傷問我何時還田園又成荒我心媿其言老矣身皇皇五載走三州道路險且長婁請方得祠暫帰又懐章挈家入南閩児女不盡将餘生疾病多滿鏡􅂡髯蒼到官郎有乞行将返耕桑過瑞安我家古樂成老未識安固偶把清源麾首問南塘路觧維日已晏入境天欲莫張子自陶山子猷扁舟惠然顧沈君壮年别敦謨相見髪垂素訪舊多不存来􅀚莫知数平原二十人邂逅喜相遇謂我宜少留欲欶不腆具我驅不敢疾曲為一宵住臨江有高閣登覽可以賦瀾同孟子􅀚目作少陵注燈火照魚龍談􅀏驚鷗鷺㗸盃鄊意濃􅀼食君㤙誤晨起酒未醒潮来報催渡贈沈敦謨三十年前硯席同懐人長在夢魂中徒劳州縣知何􅀘高蹈丘園不是窮歴問舊㳺多故􅄦偶餘我軰亦衰翁相逢又􅁍怱怱别無復從容似泮宮􅀚潮閣高臨無地屹山腰今古知􅀚幾度潮水鑑掛空波正滿鯨魚入穴浪還消雷􅀄出地神龍怒銀忽成山海若驕聖世風濤合平静不應泛溢似唐朝訪曹夢良我自䔥􅄘下遥来訪許􅄘川塗何敢惮筆硯乆相從故里行将逺吾人豈易逄何當継韓孟相逐似雲龍鳯凰岩鳯鳥乆不至胡為扵此蔵徳輝如可覽應不恋高崗䔥家渡渡頭問舟子此渡胡名䔥舟子􅀏荅我使君家匪遥豈不聞侍郎名徳重本朝婁爲二千石兩至萬里橋渡旁乃其宅人亡木惟喬隂徳滿鄊閭嘉話傳魚樵江水流有盡姓名磨不消近同池號謝逺􅁼江􅁛姚赧顔謝舟子講聞非一朝恨生晚且賤無繇際清標坡公不識范韓子思之僑敬瞻通徳門魂徃不可招入長溪境老矣倦㳺宦入閩如山川三山疑隔海九嶺􅁼鑚天峽中有鑚天三里種稻到山頂栽松侵日􅁁溪長水無盡前更有清泉贈程天祐秀才程生嗜好與人殊杖屨遥遥訪我廬不􅂿槐花随舉子手持醫囯惠民書宿飯溪驛甑嶼飽曾見飯溪名始聞老懐如子羙到䖏不忘君楽清有甑嶼山門擁千峯翠溪無一􅀧塵松風清入耳山月白随人宿雙岩寺﨑嶇九嶺更双岩遥望閩山未見三来訪神鍾􅀮見䖏翠㣲􅀷鎻古精藍至福唐㑹鄊人丁鎮叔張器先甄雲卿項用中趙知録薛主簿同年孫彦忠草酌試院一同年友七鄊人􅂆酒那容耳不聞尚齒自驚多白髪論文堪咲有紅裙權師呉憲遣官奴耒侑尊詩篇共約題孤嶼㳺宦猶疑在五雲孝忠㑹稽人予昔仕越与彦忠此會此時寕易得明朝風月両州分宿真􅀮寺我亦欲真􅀮區區愧此身山林與城市何䖏􅀮非真飯枕峯門外峯如枕冝眠清净身禅僧自面壁誰是枕峯人飯罷怱怱别劳生可柰何不能留一宿有愧此峯多宿嚢山寺荔子枝中古道場石門有路􅊥懸嚢怱怱不着㳺山屐只辦嵩呼一瓣香㳄日朝散會慶聖節我来萬􅄜正號風壁上􅀚詩憶蔡公惟有秋林舊時月夜􅀷猶照􅆊王宫過蔡端明故居懐章南過蔡公郷駐馬遥瞻数仞墻丹荔株株􅀴品藻喬松葉葉惠清凉四賢詩出人增氣三諌章成囯有光真是濟川三昧手清源㳺戯作虹梁讌七邑宰九重宵旰爱民􅀷令尹冝懐撫字心今日黄堂一盃酒殷勤端為庻民斟送赴省諸先軰囯朝人物盛温陵秋賦􅊯􅊯鹿食苹人倍平原門下士三十八人文聮韓愈㮄中名丹墀何止三千字雲翼行看九萬程勸駕龍鍾老太守籃輿凖擬出郊迎次韻夔漕趙若拙見􅀉去秋移郡近家鄊便殿狂言拜手敭何敢許身為稷契偶因論事及尭湯民雖婁試如馮翊詔未能焚愧益昌乞得祠宫飬衰病夢中依舊坐黄堂夔門邂逅恨怱怱君駕重来我巳東陳迹徒劳長者記若拙書六欲記予去夔後數事清樽那復故人同光華持節花溪上得報若拙移漕成都老病分符佛囯中清源號佛国吾軰棲棲不黔突此生休更問天公知宗生日士豢字恱中天工未放二陽生留得尭階一英􅕴􅂟誕仙源貴公子祥開南極老人星日垂宫線添無盡貌比荘椿㸔更清歳歳華堂祝眉夀笙􅁔声裏雪梅馨哭令人三十年間共苦辛忽然驚断夢中因鍾情正是我軰事皷缶忍同方外人熊膽未酬平昔志午衣猶是向来貧令人不蓄財瞑目之後囊槖萧然閩山滿眼同来路木落風號淚滿巾貢院車水築基諸公懼魚鼈活之别沼塞沼增基大厦成群鮮亦免校人烹洋洋圉圉諸公賜要與吾君廣好生出郊􅂆農六年四郡􅂆農耕自欲帰耕尚未成㳺宦何如在家好一廛從此願為氓守臣􅁨囯願年豐半刺􅀟鳬此念同安得時暘時雨若有生均在㤗和中小麥含花大麥黄一年春事已相将籃輿遍入三精舎撥得公家半日忙一千石俸􅀼南州老病餘生厭宦㳺巳上祠章即帰去一犁烟雨事西疇題靈秀峯禅院小小精藍亦自竒一峯靈秀藴幽姿無縁細听山僧話太守偷閑止片時送九座訥老禅老遥從九座来一言為我洗塵埃飄然又向山中去白首相逢更幾回至樂亭中半月留溪山杖屨飽㝷幽見師忽起廬山夢夢向舊時㳺䖏㳺崔肅之雍自湖至泉遷二親之䘮帰塟詩以送之番水同僚舊遥從霅水来異郷欣覿靣清話洗衘哀予時有哭内之戚葱欎佳城就勤劳孝子回不􅀿淹榷酤中外王湏才夜聞子規痛念亡者夢覺音容杳莫追子規聲裏涕霑衣催㱕無計同㱕去耘後耕前事已非南宫掲榜温陵得人為盛提舶馬寺丞有詩賛喜次韻龍虎鄉􅀖地最靈鯤鵬相継上南溟已聞元凱賔虞囯十六人行見淵騫冠孔庭帝遣伏波持使節天教平海㑹文星鈴齋忽報捷音至一炷清香千佛經諸公廷對甫邇復用前韻清源􅂵㡌發英靈萬斛詞源水注溟遥想㤙􅂁動草色定知喜氣徹天庭名高虎榜唐文傑人半雲䑓漢列星累月笞児幾翁嫗夜􅀷燈火督窮經次韻知宗春隂行人怨雨農􅁨旱永叔元之事可明不歎花前無客飲且欣郊外有農耕知公興巳烟霞重顧我心尤􅀔利輕天意稍佳民事急緫将行楽付宗盟東坡詩云斯人何似似春雨歌舞慶夫恣行旅君看永叔與元之坎軻一生遭謗語次韻知宗㳺北山州北有山幽更幽皇天閣雨爲公㳺登高如入上下竺宴坐疑臨大小湫掃地焚香􅃄􅈁嫋煎泉㵸茗乳花浮􅀚詩起我家山興身在閩南夢在甌悼亡燕􅃦焚香老病身細君相對坐如賓而今一榻維摩室唯與無言法喜親不見音容忽三月無從涕泗巳千行家山凖擬欲帰􅀮堪嘆相随無孟光偕老相期未及期回頭人事巳成非逢春尚擬風光轉過眼忽驚花片飛夤縁偶作子飛侣夢􅄰相随到数州泥上迹留鴻巳去舟中刻在劍难求次韻知宗酴醿萬斛虬珠眩眼明傲春遲􅄍冠園英詩因居士價方重東坡武昌詩為古今絶唱酒顔名臣花遂荣香異竹間吹細細韻如堂上出盈盈酴醿號韻芳姿自可友蘭蕙惜不當時遇獨清酴醿不載于離騷㳺承天寺後園登月䑓贈潜老三􅈳荒蕪未許㝷籃輿来訪小園林因知燕􅆍凝香地不侣禅房花木深月䑓無屋有空壇空䖏􅀚空眼界寛不惹世間塵一􅀧氷輪心鏡両團團送賈岩老还鄊閩江艰險嶺崔嵬不惮衝寒冐雪来留我鈴齋両三月扁舟載得義風回堂上慈親数月違片心遥逐白雲飛傷心盡听秭帰鳥难弟言帰秭不歸岩老聞秭帰遂起帰㒷乃翁賢徳冠吾鄊伯氏声名藹上庠更喜君如里曾子少年孝義已非常送岩老出北門暮春送客北山門厭坐黄堂喜見村麥熟秧青農事急十分帰興在田園客欲東帰出北門又聞聮􅀐過西村慇勤為遣十􅀙事莫惜醉吟袛􅀣園送傳興化自得字安道五馬躬迎八十親甘棠如舊治惟新􅂬傳此日来廉范記得當時借㓂恂江海􅂓淹把麾手廟堂元是薦賢人送君為守泉南守政拙才踈藉寳鄰曺夢良􅀉柑聞詩聞礼軰取以􅀕毋􅂘泣不巳嘉果遥来自故鄉去冬􅀄熟記同嘗爾䘖懐橘無窮恨我亦傳柑念不忘四月八日貢院上梁廣厦􅀄成万柱標脩梁巍跨玉虹腰况逢此日生千佛定引群仙上九霄下筆􅅙声紛􅀾藝出林鸎友競迁喬清源人物􅀙今盛孝子忠臣滿聖朝諸公和詩復用前韻􅁱梁欲舉綵先標声撼春雷鼓百腰谿蟄蛟龍欣得雨去年西溪龍見上梁日得雨桐棲鵉鳯合冲霄桐城清源水接南溟闊􅂵㡌山齊㤗嶽喬學不􅀒人冝自勉前賢勲業著三朝曾魯公相三朝梁眷連年姓誤標両州騷客瘦吟腰月河月滿燕賀厦霅川貢院十一月望日上梁郡有月河在貢院左佛囯佛生虹掛霄多士顔歡􅁔杜老一輪香滿賦張喬此途不止為科第名節崔嵬㸔立朝悼亡傷㦲無復見老矣不成階牢落凝香地同誰話此懐相勉惟清白嚢如四壁空难􅁯将絶語􅂆我莫言窮予一日怱言窮令人日君今勝作書㑹時矣不必言窮予悦其言盖死之前數日也薛士昭主管母夫人加封送酒為夀薛有詩謝次韻以酬伯宣􅂟事公家奕世傳生封錦告出甘泉荣親行有千鍾禄為夀慚無百斛船喜氣在顔窺貴客清風滿枕扇高眠朝廷指日先封薛帰侍萱堂冕有蝉送呉憲知叔出郊聞好語盡道憲車賢郡不留三宿人皆仰二天薦章先白屋公至郡薦三人皆孤寒士貢宇給青錢以百緡助起貢院上正開宣室公帰席㝎前祈雨未應提舶知宗道觀焚香明日遂雨提舶有詩次韻一雨誰之力因公發善心同為上公請小作傳岩霖高􅅒行将實南風日已駸㳙辰祈善利感應亦猶今次韵知宗賀雨雲飛􅀄􅁼愈随郊珠怱跳空室舞蛟但願農多大田稼不愁風捲少陵茅是夕大風才踈政事由来拙天逺精誠未易交三日禱祈􅅻一雨自知無䖏避謳嘲次韵陸倅賀雨􅌖字次川目注雲霓為囯􅁨何心肥馬更䡖裘庻民愁恨旱無雨三日滂沱農有秋且喜上公容我請不辝太白共君浮人言太守無才術端藉士龍監此州夏四月不雨守臣不聀之罪也将有請于神雨忽大作陳賀州有詩賛喜次韵以酬知字体仁不是尋常喜雨詩言存軌物􅁼臧僖賀州詩序斥花土花迎士木人巫呼舞之非貞有物之言也相􅀅帰賀天朝雨定有忠言結如知白楽天以賀雨詩諷諫東坡詩云賀雨詩成諫書郡人方切望雲霓忽見高田水入低正好帰田飽黄犢不湏騎馬听朝鷄賀州賀雨句如何不减䕫州夢得􅁔陳詩序云開竹枝􅁔更有一犁江上曲它年傳誦出金坡政拙年年厭禱祈心香一炷逐雲飛老農問我何良苦薄有田園胡不㱕刺桐抽葉張青盖泉人以刺桐先葉後花為豊年兆􅂵㡌蒙霞麗錦籠俗謂朝霞暮􅀨前日雨作朝果有霞今歳家家定髙􅅒田寕復羡呉儂次韵􅃽教授喜雨雝字元粛我来遥自東甌東賢非朱邑鄊守桐泉方羽成半年為郡治亡状四月不雨心􅁨農水田黽拆秧巳老雲霓望断天穹􅂭少學春秋老欲用區區􅂅請應上公真人不待辦香禱泉有蔡真人祠水旱必專􅂵帽巳有微雲蒙沛然一雨四境足眼見䆉稏青連空皇天爱民恕守罪有始其賜寧無終既令地免晋囯赤亦不水似元時洪廣文先生坐綘帳􅁨囯心與黄堂同揮毫作訟継吉甫開卷穆穆生清風知宗㳺延福有詩見懐次韻以酬向来雲榭􅀝闌干興已遥馳邪外山風伯如嫌俗駕至禅房疑為病夫関鈴馳倦臥眼界寂詩社免陪心境閑蠟屐何時破吾􅂅與君舒嘯翠㣲間提舉延福祈風道中有作次韻雨􅀄欲乞下俄沛風不侍祈来已薰瑞氣遥㸔騰􅂵㡌豐年行見割黄雲大啇航海蹈萬死逺物輸官􅀍八垠頼有舶䑓賢使者端能薄歛体吾君病中食火山荔枝前年䕫州食荔支同僚共賦紅詩妃子名園世􅀁貴不侣詩史堂前竒去冬分符南士半月身行荔支圃三州嘉木皆眼見更閱君謨向来譜臨漳一種名火山品雖云下熟則先􅀙今漸入荔佳境陳江未擘先流涎老病餘生怯嘉果日㗖那能三百顆慇勤為破綘紗囊心火驚添火山火諸公和詩􅂯用前韻屏問􅀚􅀞頥頻支州宅有屏風畫荔支十六種想像風味哦新詩火山太早反遭罵諸公和詩多㡬罵者陳􅂵未􅂋誰􅁛竒氣禀南方君子士不近長安帝王圃安排名字知何人誤與牡丹同入譜泉南老守思故山荔熟我去誰後先但願丁香一株熟添入藥裹痊痰平生夢􅄰南州果瘦腹如蝉消㡬顆明年何䖏飣柸盤鴈蕩山前月流火永嘉七月方食荔支漳州石教授􅀉火山荔支名邦彦炎方摘實走筠籠千顆遥遥􅀉病翁未㗖吾州法石白且嘗鄰郡火山紅搀先趂得楊盧雨珍重来􅀙芹藻宫我欲細論香色味一尊何日廣文同東湖小飲㣲涼散梅潤濃緑敷桐隂送客出東郊駕言事幽尋湖光照我眼荷香清我􅁭平疇入逺望歳有其自今牛眠種巳畢蛤吠苗􅀄􅀷古亭懐二公遥望羅千岑邂逅得良友欣然契予心喬松喜客来風枝出清音手持荷葉柸共對蓮花斟東湖異西湖有詩不妨吟東湖二公亭挿芰荷間緑盖紅粧四靣環若把西湖比西子東湖自合比東山爱松堂炎炎畏日爱濃隂穆穆清風爱好音不獨爱松兼爱竹此君亦有歳寒心松之西有竹食􅆶呈知宗荔子劳民䟽伯㳺蒲萄醸酒愽涼州何人傳得東陵種大勝家封萬户侯題節推納涼軒孔光字徳溥有客㳺蓮幕開軒更傍蓮披􅁭風未賦遞嘨句先䏈境净涼偏乏心清暑自蠲快㢤誰與共廣厦集群仙軒近貢院州宅即事泉南古州宅草木有遺芳鷹􅀲冬猶緑闍提夜更香佛桑朝暮異荔子歳年長惟有松并竹青青似故郷修鷹爪花架有花藤蔓生封植傍州宅状􅁼鷙禽爪葉作翻風翮酸分含􅀏香黄帯簷蔔色架倒吾為扶清凉納朝夕鷹爪花誰把名鷹爪天然状不殊無心事搏擊中有鳥相呼長生草草有長生者無根葉自抽秦皇不知此誤向海山求榕木南囯有喬木老非梁棟材清隂可以覆亦足報栽培安静堂前賢治迹尚堪㝷留得堂名直至今若欲斯民盡安静要湏安静自家心中和堂堂前老木幾經春閱徧泉南舊守臣盡向中和堂上坐中和為治有何人雲榭山生􅂑地榭侵雲土木多應役􅄦神好向危欄髙着眼閭閻無限困窮人二山亭連年行役厭間関踏遍千山見二山欲識泉南山面目群山緫在一亭間清暑堂後復名忠献九夏炎方氣􅉱蒸沉沉廣厦有凉生仁風未慰􅀺民意何忍堂中暑獨清貢院納凉分韻得湖字突兀千間屋清凉五月湖人才此􅂗出暑氣坐中無虎榜唐文傑雄風楚大夫相期㳺廣厦慷慨論唐虞知宗㳺東湖用貢院納凉韻見􅀉次韻奉酧東湖曾一到想像賀家湖花似越女好人如狂客無知宗寄居會稽高吟還老手野􅃐属潜夫帰奏南風曲薫􅀆欲和虞􅂯和宗老呼佳客同􅀚郭外湖融樽常喜滿參酒不言無知宗二子侍行草色懐三􅈳松聲憶五夫越州五夫因秦封五松得名公㳺更何日旌至定招虞比和知宗詩牽扵押韻以招虞為􅃧果蒙見招復用前韻宗英真好事呼客共㳺湖携具臨平逺􅀚山對有無十花逢净友曾端伯十花以荷為净友千頃和雲夫韓詩酬盧雲夫荷花行曲江千頃波秋净得玉又求劍無厭慚似虞㳺湖值雨薛士昭衣巾霑􅊜意氣自􅀂􅃧用前韻薛侯真不俗十日両東湖俊逸詩篇有倉皇雨具無􅂁雖􅊜毅父眉不皺尭夫異夕月離畢㳺冝俻不虞次韻知宗㳺二公亭前日同登二山亭清源入望清更清宗英載酒挾両客破暑共作城東行東湖未到聞人說香有荷華如鄭隰社中未為三笑㳺亭上姑㝷二公跡􅋦盃適意論交情江山照眼增雙明􅂓效韓公文字飲奚用鼎沸笙篁声提舶示􅀚楚東集用張安囯韻因思番陽與唱酬者五人今六年矣陳何二公已物故餘亦離索為之慨然復用元韻憶昔江東㑹衆仙詩筒来徃走山川時陳在豫章何按属郡詩筒常往来造楼㳺戯偶成鳯煉石辛勤同􅀘天堪嘆交㳺隔生死尚餘文字帯芳鮮欲收膏馥增前集舶使新詩自合編五月晦日㑹知宗提舶通判納凉雲榭提舶用仙字韻即席賦詩中寓四字次韻以酬雲榭衘盃半八仙却疑来自蜀山川地如洙泗占髙第人似羲和分昊天單􅀐聮翩成駟馬杯􅅅淡薄從三鮮囯風雅頌寂寥乆太史採詩冝與編知宗提舶即席贈詩用元韻以酬并簡通判子政堂堂漢列仙清標况對馬文淵代川字催詩風送千山雨把酒凉生五月天老子濫分南郡竹貳車行擊故家鮮通判将美觧誤蒙好語相提拂豈有功名上簡編提舶欲移厨過雲榭示詩次韻雨中前日過蘇端又欲移厨就稍寛古榭有風􅂓可共衰顔得酒定須丹謫仙醉後句尤勁東野老来詩更寒継取洛中真率㑹他年要作􅀞啚㸔提舶携具過雲榭知宗出示和章復用韻不湏蠟屐上林端髙䖏登臨眼自寛䆉稏風翻梅裏白稻最早者農家日為梅裏白離支日照鶴頂丹山川滿目如京洛䑓榭侵雲􅁼廣寒賓主徃来俱不逺如棠不比魯侯􅀚老来􅁨患苦無端一􅀏相逢強自寛詩律頻調代音楽壽觴滿引當仙丹二山坐對事非偶二山一名朋山与賤名偶同三徑思帰盟不寒出岫白雲知幾許榭中矯首共遐􅀚知宗即席和端字韻三首提舶退即􅁕之子第三詩􅀴夕方和録呈二家毫秃中山硯滌端社中詩令不容寛难追老杜風騷手徒費昌􅀺􅀧勘丹搜我枯膓􅂡鬂皓吟公佳句齒牙寒自慙淺陋如曺鄫季子􅀚風定不􅀚傳興化送蔡端明集報以温公文因求端明帖迃叟遺文整頓􅀄􅀉君􅂓當報瓊琚南鄰尚有無厭意更覔皇朝第一書東坡謂君謨書為本朝第一陳賀州速客送酒賀州呼客細論文我欲相過與共論正恐俗他真率㑹不如分去聖賢樽簮當濃緑􅀞中盍杯向䡖紅擘䖏翻即席有詩應􅀉我􅃻門来送月黄昏丁惠安贈􅁏蓯蓉康臣字道濟老子當帰興巳濃令君何事􅀉蓯蓉行将卜築前湖去簑笠牽牛作老農往年同泛舟城南有卜築之意梅溪先生後集卷第十七梅溪先生文集卷第十七序送吴教授秉信歸省序四明吴先生名世鉅儒才髙行尊以斯道自任未嘗屈節以阿世青衫不調殆一星終矣頃以朝廷之命主師席扵東嘉教人以正心誠意之學毎以身先之不期年而士子皆有􅀁矝式太守端明李公下車之初知先生之賢延為蓮幕上客先生以儒術飾吏事談􅀏間而􅀖人隂受其賜公卿大夫聞先生之名鶚書交薦衆皆謂先生不日去而羽儀天朝也然先生純孝人也獨念􅄌親在堂􅁂髮垂素􅁣然興歎揖諸生而歸扵是􅀖之士庶至扵縉紳之徒緇黄之流詣府挽之千餘人而先生終不肯留識與不識聞先生之行也莫不歎息以謂賢扵古人逺矣昔季子佩印扵洛陽買臣衣錦扵㑹稽長卿駟馬而入蜀二踈聮轡而出關天下至今傳之以爲榮然是帰也富貴之歸也非先生今日之帰也淵明㝷三􅈳之松菊季膺思千里之􅐜鱸賀老踈狂扵鑑湖李愿徜徉扵盤谷天下稱之以爲髙然是歸也􅀮者之帰也非先生今日之歸也先生之心以爲印綬之荣不若吾綵衣之戯禽魚之樂不􅀂吾羊􅀥之養今日之歸大有功扵風教矣豈直以富貴而跨鄊閭髙尚而傲世俗㦲雖然古人盖有以志亊親者不必朝夕在乎左右也節行􅁱扵身政亊理扵官功徳及扵民聲名聞扵後則其身雖在千里之逺而其心不啻若左右之樂也吾知先生朝而歸暮而復来乎不然必為蒼生而起天下皆受其賜也某海角賤生方􅀗摳衣坐隅執弟子禮而先生行矣瞻戀為如何耶扵是序其事又從而歌之曰帰去来􅀆先生胡為而歸陟彼髙崗白雲􅀌飛先生胡為乎不歸先生歸􅀆何時来小子狂簡不知􅀁裁先生胡為乎不來泮宫峩峩泮水洋洋先生来􅀆芹芳藻香先生去􅀆鸞飛鳯翔南浦老人詩集序紹興壬子秋南浦翁䘮于横陽訃至某哭之悲已而發囊中得其遺藁有詩数十首皆手􅀁親書視之歎曰雖無老成人尚有典刑吾不復見此翁矣此藁其典刑乎某恨生太晩不及識翁壮年時見鄊人言翁昔年豪氣可掬常坐屈軰行直出其上有不可其意􅂺以氣排之尤簡世俗軰視之若無人性嗜酒不治生事晚年偃蹇不遇家貧無資饘粥是累東􅃥西馳有酸寒可憐態前日之氣使然也子不見去時得一醉􅀭眉瞬目髙談雄辯尚有壮年之風某年少狂妄幸得以詩禮與翁接􅀗陪緒餘之論乗間以鄊人語問之翁㣲頷而􅀏予又問昔年製作尚能記否翁曰盡亡矣吾壮年不獨豪扵氣亦豪扵詩今日氣窮詩亦然也予悲其言翁雖老作詩不輟一日常不下数首皆信口成不加鍜錬而有自然氣象然随作随七不復顧惜予旣一二年與之㳺懼其老而死不可復得屢求之一日以藳示予皆近作􅀁藏之􅀊餘而翁死遂出之合平日􅀁記與兒曺􅀁傳録成一集然尚有恨者􅀁得止暮年之一二多窮愁壹欝之氣壮年豪邁語無一字留吁可惜㦲翁姓劉諱光字謙仲本南浦人乆寓居樂清鄊人以其老也呼之曰老刘予命其集曰南浦老人集濳澗嚴闍梨文集序某始總角見祖母賈常道其兄嚴闍梨之為人必継之以欷歔涕泣某㓜而未識之也及稍成童出㳺鄊校見先軰老成多能道其事且称其文翰俱妙不獨冠絶扵其徒徃徃吾儒中亦鮮能及者某時既聞其言而得其為人且私慕之恨乎生之晩不及一見焉迨今又十年餘始􅀗見其詩文嗚呼師真非常人惜乎遯迹扵桑門無賢士大夫與之㳺推􅀭而夸大之遂使其名泯㓕而無聞某見古之􅀮者迯名而名益彰晦身而身益􅂋是無他有賢士大夫推􅀭而夸大之也佛之徒本無求扵世真􅀁謂迯名而晦身者然古之髙僧皆能垂名扵不杇盖其􅀁與㳺盡當世知名之士如晋宋李唐道林道安恵逺恵休文暢皎然之徒其􅀁與㳺則王逸少謝安石習鑿齒謝靈運鮑明逺栁子厚􅅊應物諸公皆一時選議論􅀁加天下以為䡖重遂䏻使幽潜􅀮遁之迹藹然發揮扵當世而垂耀扵無窮以師之聴明髙學卓然􅂈人使得王謝之徒與之㳺假其吹嘘奨㧞之力則聲名振世未必不如古之髙人也師嘗作温州開元天王殿記文詞雄偉膾炙人口有俞清老者一時名士見而嘆服以書来告曰不意今人巾復見古人也然其人譽望非安石逸少諸公比亦不能成師之名師少出逰江湖歴徧山川飛錫帝都振衣嵩洛覧古人之遺迹徘徊扵其間然其志節甚髙未嘗甚屈以求王公大人之知巳其言有曰古之桑門上首與士大夫㳺非求之也道自合焉爾旣而還東嘉􅀮潜澗誅茅結廬扵山林間賦詩鼓琴以自娱顧世莫已知者其詩有􅁒言重嘆無余和之句某一讀而三悲之師之沒今二十三年矣平生製述甚多旋巳遺亡某頃㳺明慶訪師之舊廬而求其遺文師之弟子曰宗要者某之叔父也得其古律詩雜文通数十篇為一卷出以相示某既自五􅀊而知師之名十􅀊而愛慕其為人又歎其不遇知已而沒世無聞今喜見其文如見其人遂丐以帰又自顧晚學小子無聲名势力可以動人䏻重師之文扵世姑叙而藏之以俟知者師名䖏嚴字伯威其詩醇重典實不尚浮靡他文皆如之紹興甲寅仲冬望日序劉方叔待評集序昔人有逺行者将由越而之燕膏車秣馬志在一日而千里也馳十日猶未離乎越囬首南望自以為逺矣俛仰在塗猶在萬里之外扵是益馳前又十日去越而適呉􅂈呉而至楚囬首南望益以為逺而前途猶未能十之一也又􅂈楚而至宋又至乎魏又至乎河洛之間其途始半矣又益馳遂逺而至乎秦又逺至乎趙南望益逺又益比馳遂一日果至乎燕然後觧車休馬徜徉四顧自謂天下之至逺者吾巳盡行之矣今雖􅁒不止而行亦無􅀁之也及問燕之人且謂􅂈燕而此又有逺扵自越而之燕者行者始歎息知天下之逺有窮平生之力終不能至者也昔漢有張騫者㝡善行嘗持使節通西域泛靈槎窮河源此其逺又不止乎自越之燕而巳由是又知天下之逺固有人迹􅀁不及者然能力行而不巳則亦無􅀁不至也予嘗以行者而喻斈者􅀼謂斈之源流甚逺固非一日可至苟能自進不巳積一日之力以至乎千萬日超乎逺大之域矣今之斈者惮其逺而難至也是以中道而畫亦猶行者未越境而囬車望吳楚之郊猶未之見又惡覩古人窮其至逺者乎吾友劉方叔年甚少氣甚銳好斈問而工辭章􅀁謂日進而不巳者吾前年邂逅扵蕭峯之下一見如故遂出詩篇以相示吾固知方叔可喜人也自是毎見之必示予以􅀁作其詞益加扵前予益嘆服今春訪予又示予以待評集其間詩賦小詞無慮百篇體兼古律愈新愈竒至前日又見其集益増新製扵其間比今春􅀁見又加􅂾等予三年間見方叔之進如此日進不巳将何􅀁不至也方叔之集旣名曰待評又命予序之意􅁒待予文而評其當否也予􅁒評方叔昔日之詩耶今日過之逺矣􅁒評今日之詩耶方叔之進将不如此而已予未可評也方叔之詩譬夫行者将不止燕趙之間異日昇崑崙之巔乗髙風而飄􅁭􅅂者予固以此而望乎方叔方叔亦當以此而自志乎姑勉之送表叔賈元範赴省試序某嘗謂古之􅂑士先徳行後之􅂑士尚文藝雖人事若不同科而天理未容􅂉異以徳行􅂑士人事固與天理合以文藝􅂑士人事固與天理違然天理黙行扵人事間世有莫得而知者唐王勃楊烱之徒以文章號以四傑而徳行無􅂑焉裴行儉以見之已不許其逺到且謂士之致逺先器識後文藝四子訖如其言行儉非神也而􅀎料人如許其必以天理卜之乎由是知科舉􅂑士雖專在文藝間然由文藝進者必徳行副之斯可致逺大之地吾鄊先生賈公其文藝徳行蕪長者與早􅀊蜚聲太學名上賢書乆矣天􅁒大其噐而晚成之淹􅆦且二十載􅀮居鹿岩行􅁩卓絶月旦郷評及竹道之語咸謂先生隂徳在人天必相之年今且五十以免舉赴春闈政天相先生時也豈不見其眉間黄氣乎天理巳著見扵此自今而後學者知徳行可􅂑富貴不専尚齪齪文藝矣某旣著為天理􅀃且拭目以待􅁒驗斯言之不妄云送吴翼萬庠赴省試序韓退之作師􅀃言弟子不必不如師師不必賢弟子予􅀄恠其言謂師者人之模範寕有不弟子如耶紹興甲子予闢舘梅溪朋友以予年居其先妄以師席見推執卷而從者四十人常月較其文用三等以品第之其間頴然以才名􅁛者十餘軰齒頰锵锵􅀋能道驚人語予踈繆反資其發藥者居多然後知退之言為不妄是􅀊朝廷修三載故事下詔􅂑士予欣然對鄊人語吾徒其必有人乎旣而有燕巢于堂形如品字識者知其為祥是秋萬子庠中鄊選徐子大亨中國學選吴子翼中同文舘選一時物論咸推梅溪為盛事且二三子尤予平昔㳺􅀭侈大號為上㳺者予用是􅀼知人之名冬十一月同舎展餞禮時徐子居賢関独吴子萬子預焉酒三行予祝之曰昔公孫弘以賢良召轅固生謂之曰公孫子務正學以言無曲學以阿世今二子将戰藝春闈射䇿天庭當不􅀒平日􅀁學公孫不用轅生言以阿合􅂑容雖能襃然為舉首用布衣􅂑封矦君子不貴焉子慎無忽吾言西行見徐子問訊無恙外道予語告之果能如張籍不叛退之否明年之夏緑槐夾道拂面薰風有青衫少年聯􅀐而帰天香滿䄂喜氣津津出眉宇間過我扵梅溪者其三子乎為林彦明千秋榖序濟南林君訪山間謂不孝子王某曰子知今􅀊之大有年乎冨者廪積貧者瓶儲雖吾懸罄室中聚􅂾十指而啼飢耳子盍以盈幅之􅁓為吾之田疇􅂾寸之管為吾之犁鋤冩一二心聲為吾之銍艾吾将穫干故舊之鄊歛于仁義之里稇載而帰庻不虗為樂􅀊人也某聞之惻然因召楮先生管城子而與之謀皆感􅁣動懐遂書此可憐語以告指廪君子淵源堂十二詩序剡溪周君闢家塾于居第之前有堂有軒其􅂾偶有舘有室有池其数竒有齋焉其象数五行通而計之其数象十有二月命客王某名之某采汝南家訓名其堂之中者曰淵源且記之矣其十有一咸采名扵杜詩渊源堂之右廡有堂焉賔主論文之􅀁也名曰細論􅂑重與細論文句由細論堂而北有軒焉頗幽􅃉植岩桂一本以宜之名曰冝桂􅂑宜人獨桂林句由渊源堂而西有軒焉其景物絶瀟洒而人􅁛之名曰藴秀􅂑剡溪藴秀異句由淵源堂而有東舘焉主人䖏予扵其間予之来也修同舍之好名曰同􅁭􅂑時赴鄭老同􅁭期句冝桂軒之内有斎焉書籍粗偱足以自娱名曰富斈􅂑斈業醇儒冨句藴秀軒之内有斎焉吾同舍日摛藻扵其間名曰輝聲􅂑自恠一日聲輝赫句同􅁭舘之側有斎焉虚而曠可以群居名曰集彦􅂑且随群彦集句渊源堂之左廉有斎焉主人擇士以誨蘭玉之少者名曰擢秀􅂑偶然擢秀非難􅂑句入門而左有斎焉常虎之㑹有逺方之士至主人舘焉其来如帰名曰恢義􅂑首唱恢大義句藴秀軒之隅有丈室可坐二人名曰蘭馨􅂑裴李春蘭馨句細論堂之前有方池名曰足鯉實無鯉也盖寓意焉予謂人生聚散無常豈能長論文扵此堂耶異日尺素之傳有望扵雙鯉故􅂑池中足鯉魚句且戒其勿為髙詹事也旣名之矣又賦十二詩詩二十字以淵源堂為首目曰淵源堂十二詩而識之以序記四友堂記家君燕坐乎四友堂某侍側家君曰汝知吾此室之意乎吾言汝書之丈夫之扵世窮逹之道不同而其􅀁樂一也季子之金印買臣之畫錦長卿之駟馬何曽之萬錢古之人得志扵當時者之􅀁樂也靈運之山水淵明之琴酒北山之猿鶴謫仙之影月古之人不遇扵時者之􅀁樂也吾非不􅁒為得志者之􅀁為而慕窮者之􅀁樂也富貴有命不可幸而致甘心貧賤者士之安扵分而樂其生吾之􅀁當行也扵是即􅀁居之宇造方丈之室藏書一笥置酒一壼設榻一張而吾以一身寓乎三者之間故名之曰四友也明窓棐九前經後史整冠肅容端拜聖賢扵千古􅉂目攘臂訶斥姦䛕扵巳死者此吾之友扵書也清者聖濁者賢􅀉咲傲扵一尊之中而逍遥乎無何有之郷者此吾之友扵酒也及乎書疊牕几興䦨尊爼曲肱而髙枕坦腹而独卧訪周公扵恍惚之間與蝴蝶悠􅀭而俱化者此吾之友扵榻也烏巾道服蒼顔白髮頽然乎其間者吾之樂也若夫暁色動而窓牖明夕陽盡而灯烛光者室中之朝暮也和氣襲而書帷温南牕闢而薰風来竹簟設而凉颷生簾幕垂而紅爐然者室中之四時也吾與三友相􅀙乎一室無言而妙意得不想而萬慮息物且不得而我累形亦扵是而我忘也彼有汲汲扵富貴戚戚扵貧賤奔走扵势利之門老死扵􅁨樂之塗者吾不為也語畢某拜而記之緑􅀞軒記岀簫峯西南二十里有山逺引若虹霓之状故俗謂之霓山樂安孫君之居得霓山之勝峯巒竒偉林􅅢静深有泉發扵其下可飲可􅈅扵是枕山而立棟宇因流而蓄池沼結軒嚮明􅀵拾景象軒之外有嘉木数株􅁱竹千挺蓊欝蒼翠婵姢瀟洒播為踈林舒為濃隂舞清風摇蒼烟影明月漏山光之窈窕䕃碧沼之漣漪禽鳥宅其幽􅀛魚息其隂左右青山環合映帶藍黛之色與天連碧四時不凋眼界常青望之宛然如在圖􅀞中盖此軒之佳致也主人與客日飲扵其間寒光入座秀色可掬明瑩柸盤冷襲襟宇䰟清氣爽深柸不能發其醉情舒興逺髙歌不能寫其逸􅀚者在旁疑其壼觴几席皆圖􅀞物中賓主僕􅀙皆圖􅀞中人也有客㳺兹軒嘗陪主人之清尊覧景物之幽竒寓之扵目得之扵心有若不䏻忘者主人曰客為我名之客曰予嘗讀韓退之南山詩有濃緑􅀞新就之句愛其清新峭㧞恨斯景之莫見今此軒之秀庻㡬其髣髴来其語而名之可乎主人曰可客為吾記之客曰軒宇景物之大㮣四時朝暮之氣象生綃一幅可得而􅀞也濃緑之句可采而名也􅀂夫清風一来披雲拂玉天􅄜之竒非􅁝非竹雖神工妙手有莫得而模寫􅀶物辯口亦不􅀎形容也予􅀅何言大井記予始祖五代末自錢塘徙于温州樂清之左原迨今無慮二十房雖吾廬世得先祖始卜之地閱二百年矣家之東南有井焉不知其䟽鑿之始其深􅅻二丈方不踰丈水清而味甘寒于夏而温于冬至􅀊亢旱他井皆告枯兹獨不竭提罌而汲者駢集也大􅀚間吾家築新門遂徙舊門為井亭作林以護之植雙桂于南北两旁名其亭曰投轄皆先人之雅致也宣和辛丑魔冦犯境吾廬数千百椽燎而為埃惟是亭與門幸而独存盖吾家遺迹也是井有三可書當大父之世郷人號吾居為大井頭王家井非甚大而以大得名以其大扵他井也非吾家大之見大扵郷人爾宣和壬寅大父得疾服藥思鯽魚時方盛暑不可遽致先人􅁨見顔色遂垂鈎于井􅀗巨鱗予時年十有一侍立井旁親見之井初無魚先人素不善鈎盖孝感也紹興癸亥予闢家塾于井之南用友􅀊集焉飲灌洗濯率資其利至庚午季夏群臧夜汲以有光告予徃視之果不誣嘗作井光辨以識之矣意謂魚鼈之族鱗甲文理發光于夜􅂉螺胎蚌腹産珠以自照然未可知也必有愽物君子辨之者是井有能大名有孝感之異有光輝之象其可没而不書耶且三者皆予耳聞目見之實非誕語也然是井可目曰大曰孝曰光予独以大名之者先吾祖也作大井記六月二十六日書代笠亭記吾家之西北原有田二頃盖先業也吾季弟昌齡日課農事扵其間有􅀨晹風埃之患盖焉而手疲屩焉而􅁕蠒􅁵面目􅁀肌體身劳而况悪扵是即田之畔因􅂩地夷積石創容􅂰之亭而名以代笠予聞而劳之曰子亦良苦矣然子之志巧扵以物代物而子之心樂扵以劳代劳也子少䝉義方之教将以禄代耕一􅀾賢關争違其願懼事親日短而三釡之不逮也退帰于家躬水菽之養以代之子以二兄日􅀙事乎黄卷不知稼穡之艰難懼田園将蕪百指不能以自活也遂和淵明之詩賦勸農之章躬隴畆之劳以代之朝東臯莫西疇厭春􅀨秋陽上笠下屩之縻手足也遂作亭以代之此子巧扵以物代物樂扵以劳代劳而孝弟之道實寓乎此亭也吾家多难生事蕭然親䘮在殯窀穸之奉未畢正人子痛心之時子扵劳苦盖有不得而辭者矣然子扵耕稼之餘手不廢卷日與竹先生昌齡目硯􅁥曰竹先生毛頴陶泓諸子􅀙㳺扵是亭而深得書林藝圃之趣他日登金門上玉堂則當為天子代言之士移甽畆􅀁樂之道而論之扵廣厦之間則當為代天秩物之事子之以物代物也其智愈大其以劳代劳也又将移孝而忠矣奚止以一亭代笠而巳㦲君弟勉之兄某記􅀚水記梅溪之南有巨溪焉㑹一原之水而東帰者也俗曰前溪時惟孟秋滛潦踰浹平原出水㑹天色少霽吾徒以􅀚水告予與之偕渉流而南漫而平田湍而拍岸其状也如雪飛空如銀沸鎔如熾萬薪而煎九鼎之湯激焉而珠洶焉而雷壮乎㢤其不可以形容也顧謂諸友曰孟子稱􅀚水有術必􅀚其瀾諸友今日之􅀚其有得扵水乎時同行十有二人李大鼎庚謝鵬臯朋周千里震鄭䕖志童侃鄔一唯夏伯虎陳廣予與焉不徃者二人謝與能楊寓庚午七月二十六日記巖松記野人有以岩松至梅溪者異質叢生根􅋦拳石茂焉匪􅀌森焉匪喬栢葉檜身而松氣象焉藏􅂙天覆地之意扵盈握間亦草木之英竒者予頗爱之植以瓦盆置之小成室稽古之暇寓陶先生鄭先生之趣焉是日與同舍飲茗談故事因共􅀚之咸有欲得之色予曰有䏻賞之以言者予不敢吝俄篇章争先而並至皆佳作也予不暇品第之莫知􅀁贈因徙至于㑹趣堂與八齋之衆共之且告之曰諸友講扵斯食于斯㳺息于斯是松也常在眼焉奚必几案間然後為吾物耶雖然是松之意不可不知也岩産質松肖形諸友不几之姿也青青之色凌傲霜雪諸友􅀊寒之心也欝宻輪囷􅀂偃若伸爪距􅁬而鱗鬛生諸友變化之象也今日之􅀚豈曰玩物而巳㦲唐人之詩曰朂君青松心予扵諸友亦云紹興辛未四月晦日記追逺亭記儒與墨其道本相為用故世謂之孔墨然先師孟子独危弗然闢之以為無親何也盖二家皆尚儉儒儉扵其身而厚其親墨氏身親俱儉焉儒治䘮以厚墨治䘮以薄儒謂飬生不足以當大事惟送死可以當大事又謂君子不以天下儉其親而墨氏乃以薄為其道宜其得罪於名教也孟子之學岀扵子思子思之斈出扵曾子而曾子逰孔門以孝称夫子為参作􅀴其末章有曰卜其宅兆而安措之為之宗廟以􅀑饗之春秋􅀕祀以時思之参發明夫子之意而為之言曰慎終追逺民徳帰厚矣伋又廣曽子之意而為之言曰䘮三日而殮三月而􅁙凢附扵身與棺者必誠必信勿之有悔焉耳矣孟子行其􅀁斈扵師者盡棺槨衣衾之羙以􅁙親富踰扵前而􅁙亦踰扵前其闢夷子之言足以為萬世人子之法師友淵源得有􅀁自也吾徒錢生萬中年少而好斈居家以孝謹称其䘮祖母氏也能竭力以佐父其奉窀穸之事得吉地于黄奥之原以為藏室極其工力而不計其費又築亭扵其前以饗之名曰追逺将􅁙来告扵予曰大亊有日亭無文以記之敢請予曰子孝以事親而厚其􅀁逮亊用孟子不儉之訓以治䘮又采曽子追遠之語以名亭将不忘扵春秋之享子之存心如是之厚謂子非流者儒可乎予敢以荒迷蕪陋辞耶扵是千書紹興辛未十月日記淵源堂記先儒孟子有言曰君子深造之以道􅁒其自得之也自得之則居之安居之安則資之深資之深則􅂑之左右逢其源故君子􅁒其自得之也􅀃者因孟子之言而論淵源之學謂本乎自得非師友傳授之可能嗚呼是見孟子之言而不究孟子之不必言也夫􅁒造道扵未得之前而不資諸師友可乎必深造而後􅀎自得非孟子有􅀁不䏻言未有舍師友而自􅀎深造者此又孟子之􅀁不必言也孟子知性為善知道莫大乎仁義發其素藴著為七篇之書盖其自得有如此者然考其師友淵源豈無􅀁自云世之斈者多矣而自得者鮮盖由誤􅀚孟子之書而以不親師友為自得且其父兄之教子弟也固非無師友也然其命之之意殆不過􅁒其傳句讀習文詞以求速化之術爾鮮有及乎道斈之淵源者而望其深造自得可乎剡溪周君某天資好善而樂教子弟嘗命工製先聖十哲坐象及列􅀞七十二子為一堂即家塾而欽奉之又親筆而詔其子孫曰親師友之淵源噫公之為家訓過人一等矣其後諸孫日益長師友日益親淵源日益叩而事業日益脩推其緒餘以事進􅂑有􅀠天子斈登鄊老書擢進士第者凡􅂾人餘皆以學問自立而其進未艾由是剡之斈者推周氏為盛盖本扵公一言之訓而得師友淵源之力焉某與公之孫世修同舍上庠遂􅀗登公之堂而􅀚其遺迹時公化去巳二載矣公長子仁泣謂某曰吾先子手澤在是吾懼不􅀎継志又慮諸子􅀂孫或􅈈而弗遵以深吾罪子幸不吾鄙辱臨茲舘又辱與吾兒㳺幸為我名其堂且記其亊某辭鄙陋不􅀗因采公語以名之并書其大畧俾後人母忘賢祖之遺訓焉紹興􅀕酉四月日記細論堂記淵源堂之右廉有堂焉主人與客日飲文字扵其間紹興癸酉予與其徒数人㳺剡溪客扵主人之舘登是堂而陪芳尊者屡矣主人曰客與我名之予因誦杜少陵憶李謫仙詩云渭北春天􅀣江東日暮雲何時一尊酒重與細論文顧謂主人曰君㳺太斈且十年筆硯之交滿天下然尊酒論文之時少而江東渭北之日多當花間一壺酒独酌無相親之夕把柸邀月而月不􅀎言俯地見影而影不與君語雖有胸中萬卷書将誰與論乎予與君爲八年同舍之舊而不見者巳五年矣况君之􅀁􅁒見者不止扵予而􅀁不得見者盖有不止扵五年之乆者焉人生如白駒過􅂩􅀁謂五年者􅀎有㡬而會合如此之难思之寕不慨然耶君不予鄙而以論文見招者亦五年矣予方奪扵􅁨患而困扵貧賤雖屡勤魚鴈之書而乆違鷄黍之約今乃不惮􅂾百里遠訪君扵雪深興盡之故溪􅀗重上君子堂對酒尊而共灯烛又幸坐中之客無薫蕕之不同相與論文固有不可巳者然予斈淺識陋尤怯扵文字之論他日愽雅君子如李杜軰􅂈君之門而登君之堂君當設醴而與之細論可也予􅁒采杜詩断章而名之曰細論君以爲如何主人曰善遂書之四月日記舫齋記知進而不知退者非特縉紳坐斯患也雖出世之士亦然佛之徒本逃名晦身若無意扵世者然世之善知識其道斈有餘可以淑諸人應縁而出有不􅀎自巳者其間好進之徒怵扵利􅁒徃徃賄以求進老而不休訟而不去者盖紛如也惟昌夀净慧師則不然師少㳺錫異方潜心佛隴志識斈問出人一頭業成而還爲繙林􅀁推服始傳教扵永嘉之開元􅂯傳扵福聖旣而以疾求還故山住夀昌教院凢若千載年愈尊徳愈􅂭道俗愈帰重然即未嘗一日不以退居養老爲懐世縁挽之而莫􅀎自脫也某與師有二十年之舊一日訪師而師巳􅀗遂某退老之志居􅀁謂舫斎者欣然見顔色間指是齋謂某曰予為我記之某曰師昔嘗乗無量大法舫㳺無邉大海中出大誓願力済百億萬大衆矣今兹舫也其形模似矣然而閤焉而不􅀎浮静焉而不􅀎済隘焉而不䏻容師独善其身可也如衆生何師咲曰吾師乗法舫而㳺人以為無量也吾不知其為大今吾耶是舫以居也人以為不􅀎容也吾不知其為小且夫迹有去住而道無去住形有小大而法無小大身之進退迹也舫之大小形也吾出而化億萬衆扵人世間者以無形之舫行無量之法爾退而􅀉老病之身扵故廬者假有形之舫藏無量之法也将使夫聞而化者無貪扵得無嗔扵不得無癡扵必求其􅀁􅁒得又焉有賄而求進老而不休訟而不去也如子之􅀁謂乎然則吾之退也未嘗無教化也兹舫雖小孰謂其非無量無邉法具乎某媿其言退而記之紹興乙亥三月日記梅溪先生文集卷第十七
