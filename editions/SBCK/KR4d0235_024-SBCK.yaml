  text: 梅溪先生後集卷第二十四
  hash: sha256:a8bd920278cd3dc4eca03d7967f76f80ae760ba49c3b2b460335db327be3f563
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_024-1a}
body:
  text: 小簡答吕主簿廷某頓首再拜氣肅晚秋􅀱臨良月伏惟主簿學士百神交相萬福駢臻某仰􅀼芘休重蒙記録謹因囘介少布謝悰不宣某向寓雪溪獲瞻芝宇千里相逢而遂成傾盖一樽屢共而辱與論乆念几席之久違荷故舊之不棄逺頒翰墨仰佩謙勤披味以還感媿兼集某官斯文老匠後進名師不倦學古之心尤髙鑄人之手聲望煒燁平生知識最多人物魁梧他日富貴何患行見公朝之薦鶚寧􅁨小邑之栖鸞􅂅調護扵鼎茵佇翶翔扵㙜閣某比因􅀼苐之還遂適披雲之􅂅特蒙枉顧益見撝謙别離經時行􅀅命嵇吕之駕㑹合有日要湏聮孟韓之詩惟是􅂅言併遅面究某濫被宸恩荐更幕府未修謝牘遽拜賀緘蒙長者之見先媿小人之不敏遂有親依之幸尤深忻忭之誠探禹穴而登稽山􅂅􅀚古諜泛剡溪而訪安道不廢家風與王安撫師心㑹稽地廣民夥號東南大都㑹苐以連歳灾荒今年尤甚孟秋之初大風滛雨􅁇以江濤暴漲飄廬舍害禾稼瀕海之民死徙者稍多兹固仁人君子􅀁宜動心仰惟入境之初首加訪問下車之始撫字為先上以寬聖君東顧之憂下以慰越人引領之望不勝幸甚某備貟幕職目覩其事􅂺敢以聞與趙侍郎令詪拜違台範晦􅃋遽更仰徳之誠不忘鍳􅄰􅀼惟視印之初人事紛冗尺牘修敬不敢􅂺先雖去思之意不减扵越人而後賀之罪巳同扵譚子尚兾貸其不敏某官疏通練達寬厚老成㦄四十年之仕途號二千石之治㝡憲閩帥越異績愈彰方當宁以用度為憂􅂌明公以貨泉之柄中外相賀以為得人昔蕭何轉漕関中以給民食劉晏流錢地上用佐中興久無其人惟公是望輿論攸属某非敢私比者天降之灾害及稼穡越人瘠矣得旨賑濟遂􅀗更生􅀼知公爲上言之活人手叚巳見扵得君之初也公巳去而不忘越越人徳公亦􅀅終身而不忘甘棠勿伐之詠在越而不在燕矣某以書生賛幕懵無􅀁知仰荷包荒不賜譴斥子犯有罪猶自知之婁公見容可謂盛徳尚兾始終垂庇獲免扵戾感戴何窮與王舍人剛中史舘舍人道徳才猷文章議論真一代人傑也爰􅀙大對忤意權臣養浩十年卒不爲附麗計公道既開平歩館閣兹者正位西掖有識相慶昔晁董蜚聲扵對策而不遇明主常楊得體扵制誥而俱非正人夫豈如公兼備衆美至若子産以潤色有功而立鄭宣公以代言振職而興唐相業可嘉起扵辭令天下縉紳􅀁同望扵門下非某區區私祝也伏審代言西掖被命為真自代之章􅂺及寒賤靜惟斯舉本非虚文前軰逹賢引􅀋多在扵此爰􅀙近歳兹道不公不出扵􅀚望則生扵請託故上不以實而求下亦以文而應自非髙明特逹之士以公道為已任孰肎扵􅀚望請託之外而舉人仰惟大賢獨追前軰自顧何人可當公舉奨借過情感媿亡地啓事一封聊申謝臆雖舉扵公朝不當講私謝之禮然待以國士其可以衆人報耶答陳少卿掞某前􅀊􅀼第行朝遂獲出入門下者數月伏蒙顧遇情均父兄私心感􅈭無以借喻况獲珠玉盈篋以歸輝映里閭寵扵得苐親故相見首以公之遇我者吿之無不欽嘆厚徳尚恨未有圖報之􅀁而大斾巳西瞻望門墻不勝依戀李路鈐至越首拜誨緘之賜累幅勤厚如面台顔伏承養浩丘園日有文字詩酒之樂仰見大君子􅀁藴過人朝著山林無入而不自得又蒙欲以􅀁作見示尤荷台眷之篤􅀅始終教誨成就之也果蒙不鄙甚幸甚幸答李丞務蒙示先叅政壙記三復流涕仍需挽章感認不鄙恭惟叅政宏才碩學精忠大節凛然當代少見其比雖晚路為􅁠臣􅀁抑不獲伸其素志然天下公論史官直筆㫁不可誣某軰鄙陋之詞豈􅁕以發􅀭其萬一平生之􅀁以􅋍慕者有不可辭三章謾往惶愧亡地與張㙜法阐㙜法鄊丈茂對新楊檢􅃙㙜憲神相忠嘉台􅀱萬福某日者伏審光膺寵命喜至扵躍念欲即修賀書切謂大賢進用不止扵此日竢殊擢故少遅之非敢自外扵門下也仰惟聖君求治甚切不爲無事吾鄊一二先達􅃱身㙜諌當得言之秋必䏻明目張膽以慰公論某􅀁以遅遅而賀者亦姑有待焉敢乞上體眷隆展盡厎藴以結主知指日大用以福蒼生以副簮紳之望維桑與梓亦被餘榮答温守周侍􅀰綰伏蒙賜以書翰圎緘累幅禮意有加㫖酒生羊爲貺甚寵近代先逹薦紳以名位自居貴不下賤久矣兼逹尊之三且身爲邦伯而禮先扵寒賤後學徳盛而謙世􅀁未有顧某何者可以蒙此邪下拜之餘感懼并集答台守凌侍郎哲伏蒙台慈㠯某假塗赴闕特有寵賜某􅀼聞􅀅有逺行行必以贐雖百鎰在􅀁不辭然可以無取取則傷㢘雖一錢有不宜受獨扵仁者之賜􅂺起小人之貪拜貺以還感媿無地今祗領到州十千省發路之賜謹用囘納與王運使之望某官道徳政事文章􅀴術當扵古人前軰中求之非止可為今日儒宗吏師也朝廷方以全蜀為重故􅂌以外㙜之􅀉恩威五十四郡屹然為國長城以寬主上西顧之憂豈以蕭何䏻轉輸劉晏知取予之事而凂縉紳先生耶越蜀相去萬里不修興居問又復二年惟拳拳斗仰之誠不替朝夕去􅀊邸報中獲觀㙜諫列薦之章士夫識與不識㒺不欽嘆門下士喜如之何清資峻秩不􅁕為先生榮異日特書大書屢書者為可貴爾比至行朝虞郎中出示蜀中小録􅀼知職試文衡獲覩約束知其􅀁得必真才實學相如楊雄三蘇軰一綱盡矣省榜巳掲太學得百餘人可謂盛事皆出先生疇昔作成教導之賜也近年文體屢變學官屢易士子多異論惟推服吾先生至今無異辭入蜀以来声聞益著朝論翕然何大諌諸公稱道尤力召還必在數月間某或未以罪去復有摳衣之幸矣某晚學不才試吏越幕自謂必以瘝曠獲罪誤蒙郡帥王書見知嘗薦僚属四人于朝以某為首然某亦佩服先生之教在越两載不敢以一字逹廟堂諸公臘月七日終更當日挈賤累還鄊欲屏迹山林以安愚拙不謂叨被誤恩有校讎冊府之命退惟僥冐實出先生平日齒牙餘賜苐切媿感榖日離家二月初至行朝供職巳半月賤累猶未来也汪聖錫為少蓬尤厭士論舘中皆一時英雋某厠迹其間葭􅀝群玉媿不自勝先生顧遇素􅌋必有以警策不逮俾終為善􅀋之㱕幸甚某比因廷對尤荷今四川制置王丈見知代言西掖舉以自代自帷疎繆声迹沈下仰蒙特達感􅈭不巳以國士見遇者帷吾先生及舍人丈二人今皆在萬里故某㱕依慕用之誠尤在扵蜀也閻梁二同年試吏两川帥幕閻質直梁俊邁皆蜀中佳士獲趍事大賢必蒙厚遇劉韶美宫教在㑹稽逰􅀙甚欵自謂受知扵先生語必慨然葉樞至越見之大以為竒延譽諸公今亦移行朝供職矣先生行􅀅大用薦賢報國尤􅀁當先閻察推老矣當不待終更而薦之可也輿論􅀁欲非某敢私答曽知郡汪某官人物不群才徳俱邵學術通倫􅀋而無入不得儒雅飾吏事而􅀁至有聲南州之政巳聞北闕之詔􅀅下豈兹小壘可淹大賢輿論􅀁期非某敢私祝也往􅀊某官吏隠樂清主􅉀鄊校某獲執􅀴與諸生之列最蒙不以碌碌餘子遇窺奥境而知􅀁㷌皆我公博約之賜也違去二十年两遭家難屢困􅂣屋声迹沈下逾逺門墻尺書修敬莫克自􅃱扵千里之逺媿媿負負何以自文然景山仰斗之誠初未嘗一日替仰惟髙明宏博必恕其不敏而亮其無他臨􅁓􅋺懼不自巳巳與任安撫古某官全名大節凛然超絶昔人前軰之上乃者持風憲肅朝綱忠言讜論屢批逆鱗奸邪􅃦謀盗名器者為之膽落議者謂雖漢汲黯唐魏鄭公國朝王元之唐子方諸公殆無以過直道不容一麾出守有識之士咸為清朝惜之然聖主圖治方鋭急扵見賢端人正士决不可久外宣室之念正深詔書行落大江之西公其爲蒼生起某叨被誤恩校讎冊府靜帷僥冐實出先逹大賢吹噓奨拔之賜寕不知感苐恨来晚不獲瞻拜合光親承博約以慰平昔慕用之誠然每見同舍郎􅁛頌盛徳㡬不容口柏㙜蓬山至今有光吾道甚幸名教甚幸答趙撫幹伯椿荐拜劄翰之辱如對標􅆀扵几席間喜可知也暑雨未歇伏審蓮幕風髙賛畫有相台􅀱萬福某􅀼禄懐媿每廑記録蝤蛑風味不惟勝無腸公子自可以軰瑶柱江君㑹稽固不易得錢塘又絶無之臨食必起故郷之思興與鱸蓴同但不䏻如張翰之勇决耳逺蒙分貺以養吾老饕媿感俱不少也道山石渠輙納墨本置之悠然閣可與南山同入眼劉子政乃天禄閣中人豈容懐惓惓之忠久屈于外耶與任提舉文薦某官以直道立朝去非其罪物論惜之兹承光奉宸恩榮持使節作外㙜之耳目􅋍風采扵大江之西識者謂聖眷方隆兹實大用之權輿也伏想輶軒屇道而召節巳隆天氣正炎􅁋雨未歇敢祝善保台重某仰視台照􅂺有塵禀某有表􅅩賈如規者宣靖間在太學有聲後困場屋遂俯就恩科其人極有士行為鄊里􅀁推前任建昌尉以清白聞今任興國軍司理秋冬間赴上賈安分自守不求知扵人然某官方以人物為心不敢不以其名聞也又親戚劉鎮者戊辰㮄中乙科其人有學問工詩文通曉吏事見任洪州司法登苐一星餘尚困選調今皆獲趨事大賢深為之喜儻蒙提挈成就甚幸甚幸苟非其人某亦不敢妄舉與王總領之望淛中去蜀如在天上不修興居状又復一年惟是萬里斗仰之誠不替朝夕㡬􅅩至臨安出􅀁賜書欽閱以還感佩謙抑去􅀊聞石命某喜尤不自勝謂即有瞻拜之幸既而改除輿論殊欝盖朝廷以蜀為重姑留大賢然議者謂汲長孺當在朝不當使之在外也近日廟堂設施皆合人心如張右相胡邦行自使凌汪二公爲天官豫章宣城之除無不稱善縉紳日徯先生之㱕便當爲治装計某􅀼食蓬山日虞罪戾兹蒙誤恩備貟佐譔退惟僥冐實先生疇昔奨借之賜苐増感􅈭然某去冬輪對妄論時事初自謂必得罪聖主寬容不惟不怒且畧施行其言既而舘中諸公相繼論列上一一開納但側目者衆迹不自安某與馮圎仲一一同舍皆請外廟堂不肎敷奏葉樞以其事聞上喻宰執俱不容去某以求去得遷力辭不獲今亦不住爲乞外丐祠計萬一果遂􅀁願甚幸甚幸先生知遇有素更乞時賜警策俾終不為小人之㱕以辱門下其為幸也又大矣㡬􅅩被辟益見先生友愛之篤聞問間無不欽歎萬里之行良勞苐恐坐席未暖必随台斾而還也鄭正􅅩教授昔在上庠􅀗預執􅀴之列乆與㡬􅅩㳺今相随入蜀切望周旋閻梁二同年近得書皆荷知遇閻又蒙以四條首薦尤感􅈭也近舘職甚缺貟次苐皆召試矣主上聖徳日加陳丞相有容徳頗􅀵拾人才㙜綱稍振陳應求副端排撃奸邪保全善􅀋尤為士論􅀁㱕乃汪端公薦引之也用劉信􅅩逐劉寳皆近日可喜事其他事體㡬􅅩􅀎言之答王舍人佐别大君子凡三年相去二千里之逺修敬不先下拜誨緘之寵者再矣舍人不以先逹自居而謙徳如此某晚進乃敢㻋怠尚何以自文耶某比備數館職與二三同舍日以時事為憂初欲同上封事未果㑹當輪對遂各以巳見獻某最山野狂妄尤甚上寬大􅀎受盡言不惟不怒且畧施行之但左右前後瞋目切齒者終不相置某自去冬求去劄子凡数十上凡八閱月始遂􅀁請然區區之意止是丐祠廟堂乃委曲如此出自望外闕期近在九月間當復申前請以遂􅀁志不復􅍗仁者之里日俟舍人丈零􅁜報政遄㱕廊廟公道復行清流増氣某巳掛之冠當復弹矣蒙示两􅁓論列時事仰見舍人丈天資忠義過人逺甚不以身外而忘愛君憂國心也三復以還欽嘆不巳某以五月十八日離行朝至途中聞次日有虜使失禮事中外咸懐主辱以死之恥况官穹禄濃者當如何某方屏迹田野雖黜陟不知理亂不聞不復開口及時事然畎畝惓惓之誠猶前日耳况舍人丈受明主之知膺千里之􅀉宜其不􅀎自巳也来書􅀁說荆㐮雷化事此豈細故耶梁丈賢者方居言路不可不以告之與洪檢詳邁比獲識檢詳難兄弟于朝讀雄偉之文聞正大之論知天下士在一門也又辱為檢詳同舍之未荷知良不淺臨行既勤餞送仍寵以詩章㱕槖有光感􅈭無巳違去数月斗仰不忘需次弊郷偶成見闕雖貧居急禄而卧病未􅀎遽行復申祠請實非獲巳儻蒙台念見廟堂諸公曲賜一言俾遂􅀁求不勝至幸與杜殿院起莘伏審光膺宸命榮陟㙜端天子親擢正人中外莫不相慶􅀼聞殿院丈排撃姦邪保全善類饒君子不饒小人果踐平日之語某受知最厚賛喜叵量更兾盡攄素藴益振㙜綱以滿中外之望與呉察院芾伏審光膺宸命榮陟霜㙜朝登正人中外胥慶拜違台範垂三十年雖修敬有稽而仰徳不替比聞召環真成不􅄰之喜然君子未来而小人巳去道出婺女日伺􅀐音竟不瞻際悵望何巳某蒙恩補外需次還鄊方幸息肩官司来􅇂赴任雖貧居急禄而多病未䏻遽行遥望門墻倍増依慕與汪侍郎某入舘之初侍郎丈以先逹儒宗為蓬莱主人遂􅀗朝夕趍隅以聽博約重辱顧遇不後同軰臨行又蒙餞别之寵晚進不才何以得此拜違数月斗仰益厪需次弊鄊偶成見闕貧居急扵得禄便欲犇赱就職縁冒暑得疾未䏻去體素苦痰嗽遇秋復作不免復申前請以劄子託圎仲矣敢望侍郎丈見廟堂一言俾遂區區之􅂅庶得在家醫治少延殘喘不勝感幸與凌侍郎景夏某備数冊府獲識侍郎犬扵朝望儼然之容聞正大之論知朝廷之有人三十年盛名不虚得也謙恭下士真有前軰風某愚不入時獨蒙顧遇臨行又辱寵餞禮意有加晚學不才何以得此扵大君子私心感􅈭不自已已違去数月斗仰弥厪需次還鄊偶成見闕雖貧居急扵得禄而卧病未䏻遽行復申祠請實非獲巳巳懇汪丈為吿廟堂更吿侍郎文曲賜一言俾遂􅀁求幸甚與劉察院度伏審光膺宸命榮陟霜㙜大用有階善􅀋相慶其晚學不才濫㳺冊府獲親炙者㡬二年薰温粹之容稔忠􅌋之論知君子􅀁養過人媿僕軰匹夫之賤每蒙推誠顧遇警策不敏臨行惜別著見顔色既勤飲餞又寵以詩章誦小小林園意自憐之句覺松菊之有光也違去数月夢􅄰不忘自聞新除喜不自已近朝廷去積年巨惡大快輿論天下知㙜諌之有人矣與陳侍郎俊卿光膺宸命榮陟􅀙班朝登正人中外相慶天子欲其居獻納之地天下知其爲大用之階有識君子惜其去風憲之早也某晚進不才素蒙知遇天資狂妄尤荷保全去逺風墻不勝依慕與汪中丞伏以中丞負王佐才為長御史以暴公子之威名而持斧以裴中立之徳望而視師風采􅀁加華夏咸􅋍悍􅀅為之落膽狂虜不敢貫弓一正天下如其仁不有君子其䏻國大夫出利國家安社稷兹其時㢤宰相上佐天子理隂陽孰先公者某受知不淺賛喜為多方苦癢痾之侵復伸祠佚之請望墻墙其愈逺瞻􅂂舃而莫遑想旌斾之巳旋諒紀綱之益振􅀝湏大拜續赱賀緘與趙安撫清卿某晚學不才備数冊府最蒙安撫待制丈顧遇不淺臨行又辱寵贈禮意有加然待制方以清白表率縉紳某不􅀵自䖏扵傷廉之地雖不拜賜而感􅈭未嘗自巳拜違数月仰徳益勤需次弊鄊偶成見闕雖貧居急扵得禄然為多病􅀁困輙復丐祠愈逺門墻不勝依慕與梁司諫某愚不入時獨蒙司諌丈特逹知遇狂妄之迹頼以保全臨行又拜清白之貺拜違数月斗仰不忘􅀼聞司諫危言讜論排撃奸邪天下咸􅁛為真諌官莫不想望風采樂道人之善人之常情也况某受知不淺喜當如何答陳侍郎正同某自丱角學讀書聞先生長者之論知欽慕忠肅公之爲人去春怱怱西邁一物不暇􅀅獨携温公忠肅二􅀞像而行尊尭集雖􅌻閱之每以不見全集爲恨兹辱頒賜副㠯石刻既慗冠下拜遂撥置群書朝夕欽誦真可與日星争輝非照乘珠比也答温守徐侍郎兹聞力請千朝巳遂祠佚方與邦人同結去思未遑趍拜遽奉貶誨仰佩謙冲其嘗嘆近世人才少有全者或吏才長扵治郡而名節無聞或名節著扵立朝而政事多短獨侍郎丈昔持􅀙槖天下稱爲正人出守海邦人咸謂自有郡以来未有賢明太守如侍郎者非某之私言也承台斾取道樂成當探伺戒塗俯伏道左與攀轅之列與温守莫郎中伯虚某官天賦材猷家傳吏事籍甚之譽藹著簮紳聖天子方以外治為憂故輟自握蘭出分符竹踐楊中外無適不宜顧東嘉小郡豈􅁕以屈大賢苐以先大監遺愛著在千里人心􅅴棠且猶愛之况其子耶民望使君之来久矣想不勞而治也然朝廷需才方急􅃌日召環行見卧轍攀轅又如三十載之前舊使君之去也答湖守陳郎中之茂拜違一年又半矣千里仰斗之情常在夢􅄰中也往五月去國行色悤遽不及以書吿違還家許久去郡城稍逺無霅川便又不獲修敬媿媿負負何以自文不謂長者不以其愚不肖逺勞記憶賜以手書盈幅諄諄情辭備見如前目在道山侍几舃承博約時也喜如之何弊鄊去湖雖逺而知郡丈政聲籍籍著人耳目比得莫子齊書言吾丈去􅀊修城今又大忠烈廟皆有碑刻文章政事扵是两全某謂此乃通才餘事其好善嫉惡之性胷中耿耿之竒議論慷慨名節凛然當扵古人中求之可也某雖晚進不才辱顧遇良不淺比見送馮圎仲序復及小人異日遂可託太賢之文牽聮不朽矣圎仲之去可惜然扵出䖏無媿吾徒之幸元章半月之欵想􅁕以破􅂅一好漢如此不容扵時何耶杜起莘盡言而去士論甚休亦一時館閣㳺􅀙盛事也某屏迹山間􅁕迹不到州縣闔門二百􅃌飯雖不􅁕亦頗􅀎忍窮有小小園林􅁕以自適惟畎畞之心惓惓猶前日耳未䏻乘桴􅀙㳺踐送别之語臨􅁓不勝依依與永嘉南溪國朝宗某作别踰年不廢思仰自􅀼苐㱕鄊念欲一見異邑之阻願無由遂秋秒㣲寒伏惟文候萬福近朝廷行兼􅀴最優春秋吾友記問素􅌻扵塲屋尤利来春有􅀘切宜勉力某易任㑹稽旦夕成行他日行李過越切望見訪少凂術士劉孚先談命頗竒中覔字求見幸一過之更望吹嘘俾有􅀁獲亦不廢之恵也㑹合未期望為逺業加受梅溪先生後集卷第二十四
