front:
  text: 梅溪先生後集卷第二十一
  hash: sha256:4a5fb160c177f1f42e2cb39596bb7bd60590e8cfd532c72922130f911e56f491
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_021-1a}
body:
  text: 表状笏記䟽文附饒州到任謝表時遇主恊五百世之昌期共理分符叨二千石之重􅀉試之民事簡在帝心中謝伏念臣奮身諸生􅀠業太斈上皇親䇿擢居多士之先陛下誤知眷出群臣之右方御天之十日􅂌近地之一麾旋䝉召還屡辱賜對魏證之藴㡬展尽賈􅁩之言畧施行曽未閱扵三時巳徧更扵数聀遽從憲府擢貳天官人言遭際之非常臣惧寵荣之過分力辝成命果􅀗俞音荣聮書殿之名假守便藩之郡身􅀗全於進退㤙不替扵􅀄終况此楚東之故􅀖實爲江左之奥壌顔真卿英風如在范仲淹遺爱猶存仁實何人可預茲選兹盖伏遇皇帝陛下法舜受禅体尭宅天廣􅀵衆正而首及滯淹楽聴讜言而不罪狂直遴選朝廷之七疇咨岳牧之臣雖地分内外之殊而心􅌸䡖重之異知臣本出乎白屋謂臣可牧夫細民札命十行􅁨分千里臣敢不仰奉德意刀宣教條雖才非太公不能五月報政然忠猶杜甫未嘗一飰忘君䕫州到任謝表地易夔門難敢辭於蜀道心傾尭日遠􅀹甚於長安祗拜訓詞惟深感涕中謝臣煩由御史岀守番昜任甫及於期年報􅌸聞扵五月慕言言之烈扵顔魯囯斈優優之治扵范仲淹􅅰切戒扵庸人第務近民之易罪或得扵巨室方知為政之难比因有疾而丐祠不謂誤㤙而分閫况魚復素称岩邑在坤維實為要衝茍非文武之長才􅂚副蕃宣之重􅀉豈臣庸繆可称使令兹盖伏遇皇帝陛下徳方日新仁若天覆憫鳥道烏蛮之險有刀耕火種之劳非善治不可以懐柔謂㣲臣或勤扵撫字録其寸效畀以雄藩臣敢不究疾苦扵閭閻布教條扵州郡􅀚武侯八陣居安未免扵􅁨􅁁誦杜甫百篇有志不忘扵爱主除敷文閣待制謝表官自外迁既濫中􅁠之􅀉恩由上出復叨次對之除抗章弗俞拜命増􅅥中謝􅀼念臣才惟摴檪業本韲塩偶逢神聖之作興妄意風雲之際㑹立螭簮筆方近清光冠豸乗􅔕遽違丹闕俯悵忠懷之莫尽仰知天眷之未衰繇列郡而擢居帥垣自集英而超躋華閣易任誤􅀩扵増秩撫躬􅀷愧扵罔功清議靡容牢辝不獲兹盖伏遇皇帝陛下至仁接下大度包荒謂臣如汲長孺之愚言多妄發知臣有蘇世長之短心不敢邪榮􅂌重藩許連從橐臣敢不益堅素守誓竭孤忠共理分符何以副西清之選拾遺􅀘過可能無北闕之書湖州到任謝表逺障承流乏循良之善政近藩改命仰覆載之􅂭􅀻祗服訓詞弥増感涕伏念臣五年去囯両地分符饒俗浩穣有难調之巨室䕫􅆠瘠鹵介􅅸險之烏蛮但思治己以先人豈忍奪民而生事故田里安其不􅅰而獄訟由之稍稀敢曰懐帰實縁多病􅂺控祠庭之請屡干旒扆之􅃊既寛斧􅃏之重誅復􅂌股肱之佳郡瞻清光扵便殿展素藴之忠言謂能䘏民蒙天語之見奨徙以自近佩聖㤙其敢忘豈期衰遲有此遭際兹盖伏遇皇帝陛下至仁兼􅀍大智难名憐臣守志弗欺共理猶知扵惠養憫臣奉躬匪􅈈事君􅂉尽扵勤劳故此異除華扵朽質臣敢不持循憲度効法京師詠靈沼扵真卿深体好生之徳恢儒宫扵安定益陶善教之風泉州到任謝表五年三郡蔑酬天覆之㤙一扎十行又拜春温之詔方奉祠而􅀼禄遽共理以分符􅂭睠不忘孤忠益勵中謝􅀼念臣少不斈古晚方入官論事則意廣而才踈為郡則心劳而政拙惟民是䘏雖誤蒙金口之褒其毁乃来終莫奪簧言之巧松菊方㝷於三徑江湖復把扵一麾非神聖素察其裏豈臣下可得而薦辝避不􅀗顛躋是􅁨况閩為􅀒山帯海遐僻之郷而泉乃冨啇大賈徃来之㑹詎容庸繆可俻使令兹盖伏遇皇帝陛下尭仁宅天舜智察物知臣無剥下益上之罪恕臣有抑強扶弱之偏悟即墨之浮言􅂌清源之善地臣敢不清白奉巳循良牧民冨而可求第守不貪之實老之将至尚懐有犯之忠除敷文閣直斈士謝表任南囯守臣之􅀉治効蔑聞綴西清斈士之班聖㤙誤及牢辝弗􅀗下拜有慙中謝􅀼念臣斈術空踈性􅓵愚惷蚤躬耕飬妄懐干禄之心晚􅀼科名誓竭事君之莭許身自比扵稷契得時况過扵唐虞上皇親擢之於布􅅊陛下又置之扵䑓省徒屡膺扵任使竟莫報於㳙埃去囯八年分符四郡斍年齡之云暮􅃱疾病之交攻薬百試而莫痊祠三乞而不􅁢心劳政拙僅同下考之陽城金賜秩増有愧能名之黄覇揣分冝黜蒙㤙若驚兹盖伏遇皇帝陛下仁覆迩遐賞從忠厚與人不求其備嘉善而矝不能謂臣雖不逹於時冝知臣􅂉稍諳於民事庬㫒侯藩之重超陞庭閣之荣臣敢不仰務分􅁨俯當尽瘁拾遺􅀘過雖良臣之􅂅莫詶宣化承流庻循吏之風可継除太子詹事賜衣帯謝表帰依故里首叨宫尹之除趍對便朝猥􅀍身章之􅃬省循何幸俯僂难勝伏念臣有不移之忠無適用之噐襲布􅅊而自薦綉鞶帨以奚為分三服之珍方曵􅅂而自媿拜九環之重斍委佩之有光夫何衰病之軀仰冐便蕃之寵兹盖伏遇皇帝陛下教子以義方之訓好賢如緇衣之詩借以光華欲其賛翼惟少成若徃但知歛袵之恭而非礼勿言敢後書紳之戒誓殚綿力少荅殊􅀻慰皇后上仙表坤元資万物之生賛成乾道慈毋棄敷天之養痛摧子心仙馭益遐宸裏尤切恭以大行安㳟皇后樛木逮下􅁑覃儉躬嬪外邸以称賢位中宫而配聖数豈有定年胡不長恭惟皇帝陛下道尽人倫治賛隂教諒聖情之攸繫眷懿範以难􅁯功配九人迹可稽扵􅊮管神㳺八極燕永阻扵瑶池然而上奉両宮下臨九有􅂅上寛於悲悼庻無爽扵和寕賀皇太子牋廷􅀭大號位正前星肆赦以重承祧臨軒而俻典礼􅂟延宗社􅂬洽華夷恭惟皇太子殿下挺岐嶷之姿藴寛大之徳佩礼楽詩書之丕訓明君臣父子之大綱孝友行乎宫中仁智聞乎天下睿主義方而能教法不抏於伯禽嗣君嫡長而又賢護奚煩於四皓某官守巴徼神馳帝鄊仰日月山海之攸重喜七鬯粢盛之有守愚裏敢献􅂅日近於正人聖斈益修當愈明於上性慰皇太子表人心所繫方聞出震之音天道难知遽隕前星之耀訃聞率土痛切輿情恭以皇太子殿下挺岐嶷之姿秉温恭之徳喜愠不形於色其心有容仁􅁩以飭其躬有儀可象護不煩於四皓断自出於一人福善难慿降年何促恭惟皇帝陛下爱鍾子聖仁䔍父慈澤雖沛於金雞薬不灵於扁鵲諒旰食宵衣之際㒷問安視膳之思然修短皆繫乎天雖聖賢莫迯扵数昭明有斈冝為梁室之儲子晋巳仙􅂅釋周王之念辝起居舎人状􅀼以起居之聀言動是司君無㪯而不書事有聞而必奏於清光為最近在直筆而􅀹难非得名儒􅂚称妙選臣斈術淺陋性資狂愚上皇䇿之於布衣誤􅀍親擢陛下識之於潜邸首膺召除方居列宿之聮輒貳司成之教紬書史舘進說經筵皆斈者之至荣豈臣愚之敢望蔑有寸效遽叨峻迁必致可畏之言以速不才之咎仰祈睿眷追􅆍異㤙俾愚分之􅀗安庻輿論之惟􅁢所有㤙命未敢祗受謹録奏聞伏候􅃙旨辝免兼侍講臣伏准􅃙旨除臣兼侍講者臣聞命驚震罔知所措􅀼以􅀊輒屡迁者古人之所􅀷戒身兼数聀者通才猶不克堪臣近􅀍召還濫官執秩與史館編摩之選叨露門講說之聮毎拜命而若驚嘗力辝而不􅀗辰未􅂯浹而遽貳左斈􅃋􅅻五易而躐陞右螭惧弗称於一官可更兼於両聀况講讀方執經而入侍而記注常執筆而在旁各有攸司若何可攝将物議之不免謂聖恩之或􅀻敢望睿慈追􅆍成命遴選碩斈講聖人所親作之經庻俾愚臣專天子不自􅀚之史辝免侍御史状亡辝免第二狀亡辝免􅁠吏部侍郎状臣今月十二日伏准省劄奉聖旨除臣􅁠吏部侍郎日下供聀者臣縁今早上殿自劾不合力賛陛下恢復及委任張浚事乞罷臣侍御史之聀仍賜竄謫今来得旨除臣上件聀是求罪而得迁何以塞群議臣不敢供聀􅀁是省劄巳繳納尚書省臣今居家待罪欲乞睿断降出臣自劾之章使中外曉然咸知臣罪速正典刑以為臣子之戒辝免第二状亡辝免除集英殿修撰状亡饒州乞祠状亡辝免知䕫州状亡
