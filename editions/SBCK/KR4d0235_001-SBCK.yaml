  text: 梅溪先生廷試䇿卷第一
  hash: sha256:3c3e0415ab1617f6439f8c2bd7c02d7dd461a8ba4a4493c962b41ef0c297fd0c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_001-1a}
body:
  text: 御試䇿問盖聞監于先王成憲其永無愆遵先王之法而過者未之有也仰惟祖宗以来立經陳紀百度著明細畢舉皆列聖相授之模為萬世不刋之典朕纉紹丕圗恪守洪業凢一號令一施為靡不稽諸故實惟祖宗成法是憲是若然畫一之禁賞刑之具猶昔也而奸弊未盡革賦歛之制經常之度猶昔也而則用未甚􅁉取士之科作成之法猶昔也而人才尚未盛黜陟之典訓迪之方猶昔也而官師或未勵其咎安在豈道雖乆而不渝法有時而或􅁦損益之宜有不可已邪抑推而行之者非其人耶朕欲參稽典􅁽之訓講明推行之要俾祖宗之治復見於今其必有道子大夫學古人官明於治道藴畜以待問乆矣詳著于萹朕􅀅親覧臣對臣聞有家法有天下法人臣以家法為一家之法人君以家法為天下之法人君之與人臣雖名分不同而法有小大之異至於􅀎丗守其法者則皆曰􅁠而巳人臣􅀎執一家之􅁠守一家之法以示其子孫則必世為名家人君􅀎執天下之􅁠守其家法以為天下法貽厥子孫而施諸罔極則必丗為有道之國盖法者治家治天下之大具而權者又持法之要術也今陛下親屈至尊廷集多士訪治道子清問之中首以監于先王成憲恪守祖宗之法為言是則陛下欲守家法以為天下法者固巳得之矣臣􅀗以一介草茅與子大夫之列仰承聖詔其敢不展盡底藴茂明大對以為陛下遵祖宗守成法之獻邪臣之􅀁欲言者無他焉亦曰㰖權而巳嘗謂君者天也天之􅀁以為天者以其聦明剛徤司慶賞刑威之權而不昧也君之􅀁以為君者以其􅀎憲天聦明軆天剛徤司慶賞刑威之權而不下移也天執天之權而為天君執君之權而為君故天與君同称大扵城中而君之名號必以天配以天道而王天下也則謂之天王以天徳而子兆民也則謂之天子居九五正中之位則謂之天位享萬夀無疆之禄則謂之天禄五服五章者謂之天命五刑五用者謂之天討就之如日者謂之天表畏之如神者謂之天威居曰天闕器曰天仗法曰天憲詔曰天語天之大不可以有加君之大亦不可以有加者以其咸􅀎司域中之權而巳矣恭惟陛下藴聦明之徳軆剛徤之資躬親聴断動法祖宗一詔令之下而萬民莫不鼓舞者如天之雷風一徳澤之布而萬民莫不涵泳者如天之雨露開衆正之路社群枉之門而萬民莫不恱服者如天之清明為政日新日日新又日新而萬民莫不拭目以觀者如天之運行而不息巍巍乎蕩蕩乎固不可以有加矣而臣猶以法天􅄃權為言者葢陛下之徳雖不可以有加而臣子之心每以有加亡巳而望陛下此臣􅀁以昧死盡言而不知諱也臣伏讀聖䇿首以監于先王成憲其永無愆遵先王之法而過者未之有為言次及于祖宗立經陳紀列聖相授之道又次以今日奉行而不􅀎無四者之弊為問臣有以見陛下知致治之道在乎守成憲遵祖宗欲革今日之􅁦也臣切謂陛下􅀎􅄃福威之權率自巳出則成憲有不難守祖宗有不難法時􅁦有不難革天下有不難治凢􅀁以䇿臣者皆不足為陛下憂矣不然陛下雖勤勤問之臣雖譊譊誦之無益也臣觀自古善言治之人未嘗不以􅄃權為先自古善致治之君亦未嘗不以􅄃權為先惟辟作福惟辟作威惟辟玉食臣無有作福作威玉食者箕子吿武王之言也天下有道禮樂征伐自天子出至扵無道則自諸侯大夫出者孔子垂戒後世之言也謂慶賞刑威曰君君􅀎制命為義者左氏記時人之言也謂堂陛不可以相陵首􅁕不可以相反者賈􅁩告文帝之言也此臣􅀁謂善言治之人未嘗不以􅄃權為先也三皇官天下者􅄃福威之權以官之也五帝家天下者􅄃福威之權以家之也三王計安天下而歴年長且乆者􅄃福威之權以安之也漢宣帝善法祖宗之君也然其􅀁以􅀎守祖宗之法致中興之業者無他焉以其􅀎革霍光專政之􅁦躬􅄃福威之權而已觀其總核名實信賞必罰齋居决事聴断惟精而神爵五鳯之治號為吏称民安功光祖宗業垂後裔者盖本乎此也光武亦善法祖宗之君也然其􅀁以􅀎守祖宗之法建中興之功者無他焉以其􅀎鍳西京不競之禍躬􅄃福威之權而已觀其總􅄃權綱明慎政軆退功臣而進文吏戢弓矢而散馬牛建武之政號為止戈之武系􅂭我漢同符髙祖者葢本乎此也唐明皇善法祖宗之君也然其􅀁以􅀎守祖宗之法致開元之治者以其􅀎革前朝權戚干政之􅁦躬􅄃福威之權而巳􅀄明皇銳扵求治姚崇設十事以要􅀃之其大㮣則勸其􅄃權也帝自謂􅀎行由是勵精為治責成于下而權歸于上矣憲宗亦善法祖宗之君也然其􅀁以􅀎守祖宗之法致元和之治者以其􅀎懲前日沾沾小人􅀼柄之􅁦躬􅄃福威之權而巳􅀄憲宗銳扵致治杜黄裳懼不得其要勸其操執綱領要得其大者帝嘉納之由是勵精為治紀律設張赫然號中興矣此臣􅀁謂自古善致治之君未嘗不以􅄃權為先也陛下懲前日權臣專政之乆收還福威之柄運獨化扵陶鈞裁萬機於獨㫁天下翕然稱陛下為英主凛凛乎漢宣帝光武唐明皇憲宗之上矣而臣􅀹勸陛下􅄃權者非欲陛下衡石程書如秦皇帝而謂之􅄃權也又非欲陛下􅀓飡聴政如隋文帝而謂之􅄃􅁠也又非欲其強明自任親治細事不任宰相如唐德宗而謂之􅄃􅁠也又非欲其精於吏事以察爲明無復仁恩如唐宣宗而謂之􅄃􅁠也盖欲陛下懲其所既徃戒其所未然操持把握不可一日而少縱之使福威之柄一出於上不至於下移而巳臣切謂陛下欲守祖宗之法莫􅀂躬􅄃福威之􅁠欲􅄃福威之􅁠又莫若行陛下平日之所學五經泛言治道而春秋者人主􅄃􅁠之書也陛下聖學高明緝熈不倦萬機之睱䔍好此書固甞親灑宸翰以書經􅀓刋之琬琰以詔學者矣邇者又命儒學近臣於經筵講讀之是則夫子二百四十二年行事之書固已黙得於聖心之妙至於其間可謂􅄃􅁠之法者臣請爲陛下誦之春秋書王曰天下者所以爲人君法天􅄃􅁠之法有書王不書天者所以爲人君不能法天􅄃􅁠之戒書朝書㑹者欲朝㑹之􅁠必出扵天子也書侵書代者欲征伐之􅁠必出於天子也書僣禮乱樂者欲其收礼樂之􅁠也書僣賞濫罰者欲其收賞罰之􅁠也􅁠在諸侯則譏之如踐土之盟之􅀋是也􅁠在大夫則刺之如鷄澤之盟之􅀋是也先王人而後諸侯者欲􅁠在王人也内中國而外夷狄者欲􅁠在中國也書盗一字者所以戒小人之􅀼􅁠也書閽一字者折以防刑人之弄􅁠也凢一字之褒重於華衮者皆所以􅂆人君􅄃􅁠以作福凢一字之貶重扵斧􅃏者皆􅀁以勸人君􅄃權以作威臣願陛下尊聖人之經行聖人之言以是正天下之名分以是定天下之邪正以是成天下之事業則何患乎不􅀎監先王之憲遵祖宗之法革今日之􅁦邪臣伏讀聖䇿曰仰惟祖宗以来立經陳紀百度著明細大畢舉皆列聖相授之模為萬世不刋之典朕纉紹丕圗恪守洪業凢一號令一施為靡不稽諸故實惟祖宗成法是憲是若臣有以見陛下謙恭仰畏不以聦明自居必欲行祖宗之法以致中興之治也臣以謂陛下欲法祖宗以致治又不可不法春秋以􅄃權臣謹按春秋有變古則機之之書有存古則幸之之書有復古則善之之書經書􅀄獻六羽者譏隠公不􅀎守祖宗之法而輕變先王之樂也書􅀄稅畝者譏宣公不􅀎守祖宗之法而輕變成周之徹也此􅀁謂變古則譏之者也書猶三望者譏僖公不郊而幸其猶三望書猶朝于廟者譏文公不告朔而幸其猶朝于廟此􅀁謂存古則幸之者也㐮公十一年書作三軍者譏其變古也昭公五年書舍中軍者善其復古也此􅀁謂復古則善之者也書曰無作聦明亂􅃇章詩曰不愆不忘率由舊章漢恵帝用曹叅守蕭何之法而海内晏然武王用張湯取髙皇帝之法紛更之而盗賊半天下守祖宗之法者其治如此變祖宗之法者其亂如彼為人主者其可自壊其家法耶我太祖太宗肇造我宋之家法者也真宗仁宗至于列聖守我宋之家法者也先正大臣􅀂范質趙普之徒相與造我宋之家法者也在真宗時有若李沆王旦㓂凖在仁宗時有􅀂王曽李迪杜􅄛韓􅄾范仲淹冨弼之徒相與守我宋之家法者也側聞慶暦中仁宗出御書十三軸凢三十五事其一曰遵祖宗訓二曰奉真考業三曰祖宗艱難不敢有墜四曰真宗愛民孝思感噎故當時君聖臣良持循法度四十二年之間治效卓然者盖本乎此又聞熈寜中先正司馬光扵經筵進講至蕭何曹叅事謂叅不変何法得守成之道且言祖宗之法不可変也異日吕恵卿進講立􅀃以破之謂法有一年一変者正月始和布法􅁚魏是也有五年一変者廵守考制度是也有三十年一変者刑罰世䡖世重是也光隨而折之曰布法􅁚魏布舊法也非変也諸侯有変禮易樂者王廵守則誅之王不自変也刑新囯用䡖典乱囯用重典平囯用中典是謂世䡖世重非変法也􅀚二臣之言亦􅁕以見其人之邪正矣陛下自即位以来固未嘗不遵守祖宗成法比年有出扵一時申請􅁠冝而行者致與成法或相抵梧迩者陛下靣諭群臣謂囯家政事並冝遵守祖宗今又發于淸問以求致治之效臣有以見陛下得持盈守成之道眞仁宗之用心矣然臣復以􅄃􅁠為言者盖春秋譏時王失攬􅁠之道故諸侯遂有變法之􅁦今陛下欲守祖宗之法宜用春秋賞罰之權以御之可也大臣有清凈如曹叅者宜命之持循忠正如司馬光者宜俾之討論變亂如張湯者則誅之異議如吕恵卿者則斥之如是則祖宗良法羙意可以垂萬世而無􅁦矣尚何患乎天下之不治㢤臣伏讀聖䇿曰畫一之法賞刑之具猶者也而姦􅁦未盡革臣有以見陛下欲行祖宗之法在乎明賞刑以革􅁦也臣切謂欲姦􅁦之盡革不可不法春秋以􅄃􅁠盖春秋之法非孔子之法也成周之法也故杜預曰周公之志仲尼􅀙而明之經有書賞者如錫命威公錫命文公錫命成公之􅀋皆􅀁以譏時王之濫賞非周公之賞也有書刑者如殺其大夫放其大夫殺其公子之􅁼皆􅀁以譏時君之濫刑非周公之刑也時王失周公賞刑之法不䏻革當時之姦􅁦故仲尼以筆削之權代之善勸而􅁋懼焉我祖宗制賞刑之法載在有司畫一之章昭然可覩創之者如蕭守之者如曹未嘗有濫賞也而賞必當乎功未嘗有􅁋刑也而刑必當乎罪歴世行之弊無不革者盖以聖祖神宗􅀎􅄃􅁠於上而群臣􅀎奉行扵下故也故司馬光自為諌官及為侍􅀙嘗以人君致治之道三獻之仁宗又獻之英宗又獻之神宗而其二􅀃則在乎信賞必罰也三宗既用其言以致極治矣光以清徳雅望執政于元祐之􅀄躬行其言以革時􅁦進退群臣邪正之甚者十數人天下皆服其賞刑之當一時之弊亦無不革者我三宗真盛徳之君而光亦可謂救時賢相也效者陛下躬親萬機一新時政斥逐姦邪登用􅂄舊禁錮者釋告訐者誅兹賞刑之至公而革弊之甚大者也聖䇿猶以姦弊未革為憂者豈今日朝廷猶有僣賞濫罰如春秋時乎臣不敢不陳其大槩夫人主賞刑之大者莫若進退天下之人才今陛下每進一人必出扵陛下素知其賢親自識擢可也不然則出扵大臣侍􅀙公心薦舉可也不然則采扵輿論而天下固人皆曰賢可也茍不出扵三者而一旦遽進之則議者必曰某人之進也出扵某人隂爲之地也如是則一人之濫進有以損陛下作福之􅁠矣陛下每退一人必出扵陛下灼如其罪震怒而賜譴可也不然則出扵諌官御史公言論列可也不然則得扵僉言而天下國人皆曰有罪可也茍不出扵三者而一旦遽退之則議者必曰某人之退也出扵某人隂有以中之也如是一人之誤退有以損陛下作威之􅁠矣昔舜舉十六相而天下稅其賞之當去四凶人而天下服其罰之公陛下茍􅀎以祖宗制賞刑爲法以虞舜用賞刑爲心執春秋賞刑之􅁠以御之則何患乎姦弊之不革耶若夫有某勞進某秩以爲賞犯某事得某罪以爲罰此特有司之職耳非人主福威之大者臣不復爲陛下言之也臣伏讀聖䇿曰賦歛之制經常之度猶昔也而財用未甚􅁉臣有以見陛下欲行祖宗之法在乎􅁉財用以經􅀖也臣切謂欲財用之有􅁉又不可不法春秋以􅄃權謹按春秋書臧孫辰告糴于齊者譏莊公不莭國用一􅀊不熟而告急于外也書􅀄税畝者譏宣公不莭國用變成周什一之法至扵履畝而税也書作丘甲者譏成公不節國用至扵以丘而出甲也書用田賦者譏哀公不節國用至扵用畝而出軍賦也春秋書吿者不宜吿書􅀄者不宜􅀄書作者不宜作書用者不宜用臣由是知春秋賦税之書為人君節用􅁉財之訓明矣昔孔子對齊景公之問政不曰政在生財而曰政在節財有􅀂對魯哀公之問年饑不告之以生財之術而告之以盍徹臣又知􅁉國之術實在乎節用也側聞太祖皇帝有言曰我以四海之冨官殿悉以金銀為餙力亦可辦但念我為天下守財耳豈可妄用古称以一人治天下不以天下奉一人嗚呼大㢤言乎真可為萬世子孫保國之訓也又聞仁宗聖性􅀹務儉約器用止扵􅃮素衾褥止用黄絁嘉祐間臨軒䇿土出富民之要在節儉以為御題時吕溱賦曰國用既節民財乃豐仁宗恱之擢為第一觀仁宗取士命題之意又真可為萬世子孫保國之訓也又聞熈寜􅀄司馬光王安石同對論及救灾節用事安石曰國用不􅁕者以未得善理財者也光曰善理財者不過頭㑹箕歛以盡民財民窮為盗非國之福安石曰不然善理財者不加賦而上用􅁕光曰天下安有此理天地􅀁生財貨萬物止有此數不在民則在官譬如􅀨澤夏澇則秋旱不加賦而上用􅁕不過設法隂奪民利其害甚扵加賦此乃桑洪羊欺漢武帝之言太史公書之以見武帝不明耳司馬光之名言真可謂節用理財之法聚歛毒民者之深戒也陛下自和戎以来兵革不用二十年矣是宜倉􅅒冨實貫朽粟陳如成康文景時可也而聖䇿乃以財用未􅁉為憂雖臣亦切疑之豈國家用度之際有􅀁未節乎奢侈之風有􅀁未革乎不急之務無名之費尚繁乎今賦入不及祖宗全盛之日而用度不减祖宗全盛之時三年郊祀之禮􅀁不可免者而臣下賞賜之費有可得而省也不得巳之􅀊幣􅀁不可免者而使命徃来之費可得而省也百官之俸􅀁不可免者而冗官可得而省也六軍之養􅀁不可免者而冗兵可得而省也臣􅀁謂用度之際有􅀁未節者如此之􅁼不止乎此也朝廷徃嘗屢有禁銷金之令矣而婦人以銷金為衣服者今猶自若也又嘗有禁鋪翠之令矣而婦人以翠羽為首飾者今猶自若也是豈法令之不可禁乎豈宫中服浣濯之化衣不曵地之風未形扵外乎臣􅀁謂奢侈之風有􅀁未革者盖在乎此也臣又聞之道路謂逺夷外國有以無益之竒玩易我有用之資財者池䑓􅁐囿車􅀐服御有未􅀎無􅀁増益者中貴外戚便嬖使令倡優伶官之徒有未􅀎無非時賞賜者臣􅀁謂不急之務無名之費尚繁者盖在乎此也昔漢文帝躬行節儉以化民而海内至扵富庶臣願陛下攬權于上而革衆弊以文帝及我太祖仁宗恭儉爲法以春秋􅀁書爲戒則何患乎財用之不􅁉乎若夫自同扵聚歛之臣獻生財之術則臣不敢也臣伏讀聖䇿曰取士之科作成之法猶昔也而人才猶未盛臣有以見陛下知致治之道在乎得士而欲人才之盛如祖宗時也臣切謂陛下欲人才之盛宜􅄃育才取士之􅁠臣謹按春秋書作丘甲􅂖梁因論古者有四民而以士民為首范寗釋之曰士者治道藝者也又按經書單伯送王􅁎􅂖梁曰單伯者我之命大夫也范寗釋之曰古者諸侯貢士于夫子大國三人次國二人小國一人又按公羊春秋曰什一行而頌聲作何休因論及成周之時井田校室之制大學小學之法養士取士之􅀃為甚詳又按經赦許止之罪􅂖梁曰子生三月不免水火母之罪也覊貫成童不就師傅父之罪也就師傅學問無方心志不通巳之罪也心志既通而名譽不彰朋友之罪也名譽既彰而有司不舉有司之罪也有司舉之而王者不用王者之過也春秋傷時王失育才取士之權而黙寓其意扵筆削之際公羊􅂖梁范寗何休之徒􅀙而發明之亦可謂有功扵風教矣我祖宗以来取士扵科舉是古者諸侯貢士之法也養士扵太學是古者校庠序之法也又有制科以待非常之士是有取扵漢唐盛世之法也進士科成用詩賦或用經義雖更変不同而未嘗不得人也大學之士或出扵舎選或出扵科舉雖作成不同而亦未嘗不得人也二百年間名臣鉅儒建勲立業背項相望莫不由此􅂗出可謂盛矣陛下往者雖在干戈日不暇給之中而亦未嘗􅆸爼豆之事自􅅯兵以来復興大學以養諸生其取士之科作成之法一遵祖宗之舊恩甚渥也而聖䇿猶以人才未甚盛為憂者臣輙獻􅄃􅁠之􅀃焉今取士之科作成之法雖曰猶昔而人才非昔者由福威之􅁠下移扵前日故也夫法之至公者莫如取士名器之至重者莫如科第徃􅀊權臣子孫門客省闈殿試􅁼皆􅀼巍科而有司以國家名器為媚􅁠臣之具而欲得人可乎朝廷比因外䑓之言例行駮放士論莫不称快臣願陛下常􅄃福威之􅁠以御之嚴詔有司謹取士之公法而無蹈徃年之覆轍可也至􅀁謂作成者盖欲作成其器如鳶飛魚躍􅆂養其平日之剛方而成就其異時之逺大者耳非取其䏻絺章繪句以媒青紫也自􅁠臣以身障天下之言路而庠序之士養䛕成風科舉之文不敢以一言及時務欲士氣之振可乎臣聞嘉祐間仁宗以制科取士時應詔者數人眉山蘇轍之言最為切直考官以上無失徳而轍妄言欲黜之獨司馬光慨然主其事仁宗曰朕以直言求士其可以直言棄之邪擢寘異等此陛下取士之家法也臣願陛下以仁宗為法以前日􅁠臣之事為戒命庠序去謗訕之規科舉革忌諱之禁有司取志讜之論將見賢良方正茂才異等直言極諌之士濟濟而出如仁宗時矣尚何患人才之不盛乎臣伏讀聖䇿曰黜陟之典訓迪之方猶昔也而官師或未勵臣有以見陛下知致治之道在乎得人而欲官師之勵如祖宗時也臣切謂欲官師之勵宜􅄃黜陟賢否之􅁠謹按春秋隠十一年書􅅬侯至威二年别書􅅬子范寗曰前称侯今称子者盡時王􅀁黜隠二年書紀子至威二年則書紀侯范寗曰前称子今称侯者盖時王􅀁進臣切謂春秋時王不􅀎黜陟諸侯是必夫子以賞罰之􅁠因其賢否而黜陟之也又按經書楚曰荆公羊曰者何州名也州不若國國不若氏氏不若人人不若名名不若字字不若子何休釋之曰聖人因周有奪爵之法故備七等之科以進退之臣是以知春秋實夫子黜陟之公法也故爲臣而知春秋者則必爲忠臣盖春秋以責忠臣之至訓迪天下之爲人臣者也爲子而知春秋者則必爲孝子盖春秋以責孝子之至訓廸天下之爲人子者也我國家任官之法上自公卿百執事下至一郡一縣之吏無非以公道黜陟之固無異虞舜三載考績之法也有學以教之於未仕之前有法以禁之於筮仕之後無非以公道訓廸之固無異乎成周訓迪厥官之方也故當時爲官師者冈不勉勵厥聀坐廟堂之上與天子相可否者是宰相之勵其聀也立殿陛之前與天子争是非者是諫官之勵其聀也言及乗輿則天子改容事関廊廟則宰相待罪者是御史之勵其聀也百官勵其聀扵朝守令勵其聀扵郡縣是以祖宗之世内外多任聀之臣故其致治之效逺出漢唐之上今陛下任賢使䏻以建中興之治黜陟之法訓廸之方無非遵祖宗之時而聖䇿乃以官師未勵為憂者臣輙獻􅄃􅁠之􅀃焉今黜陟之法訓廸之方雖曰猶昔而治效非昔者由福威之􅁠下移扵前日故也夫法之至公者莫大乎黜陟而治乱之􅀁繫者莫重乎官師􅇮者内外用事之臣多出乎權門之親戚故舊朋黨文臣或非清流而濫居清要之聀武臣或無軍功而濫居􅀅帥之任賄賂公行其門如市郡縣之吏其濁如泥是皆官曹澄清時可堪一􅀏者至於一言忤意雖無罪而亦斥睚眦之怨雖忠賢而必誅其一時黜陟皆出乎喜怒愛憎之私無復有唐虞考績李唐四善二十七最之法求欲其盡瘁勵聀可乎若夫􅀁謂訓廸者盖􅀅以忠義訓廸之使其忘身徇國而已非欲訓廸其巧進取善造請以事􅁠􅀔也當􅁠門炙手可􅀬之時搢紳相率爲侫之不暇孰有以忠義相訓迪者乎至於今日而官師猶未勵者以其承積習之後而餘弊未革故也陛下必欲官師咸勵厥聀莫若大明黜陟於上而以黜陟之次者付之宰相又其次者付之吏部又其次者付之監司可也昔慶暦中仁宗黜夏竦等用杜韓范富以爲執政以歐陽􅁱余靖王素蔡襄爲諌官皆天下之望魯人石介作聖徳頌以揄􅀭之此陛下黜陟之家法也臣願陛下以仁宗爲法以前日􅁠臣之事爲戒執福威之大柄以爲黜陟之法明忠孝之大節以爲訓廸之方如是則尚何患乎官師之不勵聀如祖宗時乎臣伏讀聖䇿謂姦弊未盡革財用未甚􅁉人才尚未盛官師或未勵其咎安在豈道雖乆而不渝法有時而或弊損益之宜有不可已邪抑推而行之者非其人邪朕欲參稽典䇿之訓講明推行之要俾祖宗致治之效復見於今其必有道臣仰見陛下願治之切思慕祖宗之深欲聿追其盛徳大業者可謂勤且至矣然臣已陳􅄃􅁠之􅀃于前且以春秋爲獻抑嘗聞先儒曽參有言曰尊其􅀁聞則髙明矣行其􅀁知則光大矣春秋之學陛下既巳深得之復􅀎尊其􅀁聞行其所知􅄃福威之􅁠以守祖宗之家法則賞刑當而天下恱矣姦􅁦不患乎不革節儉行而天下化矣財用不患乎不􅁉取士公而賢􅀎出矣人才不患乎不盛黜陟明而邪正分矣官師不患乎不勵祖宗致治之效又何患乎不復見扵今邪若夫􅀁謂道雖乆而不渝法有時而或􅁦損益之宜有不可已者臣按先儒釋春秋有変周之文􅀙周之質之􅀃又有商変夏周変商春秋変周之􅀃臣以謂春秋未嘗変周也特因時而救􅁦耳又嘗聞董仲舒之言曰先王之道必有偏而不起之䖏故政有眊而不行救其偏者􅀁以􅀘其􅁦而巳矣我祖宗之法譬猶大厦􅁦則修之不可更造苟不知遵守而輕務改更臣恐風雨之不芘也損益之宜有不可已者臣願以仲舒􅀘弊之􅀃為獻可乎若夫􅀁謂推而行之有非其人者臣按春秋書乃一字如公子遂如齊至黄乃復之􅁼􅂖梁釋之曰乃者亡乎人之辭也盖言任用不得其人耳又嘗聞荀卿之言曰有治人無治法夏商周之法非不善也苟得其人監于成憲常如􅀓􅀃之言遵先王之法常如孟子之言率由舊章常如詩人之言則夏商周雖至今存可也漢唐之法亦非不善也苟得其人常如曹參之守法宋景之守文魏相李絳之奉行故事則漢唐雖至今存可也祖宗之法非不甚善也苟得其人常如司馬光之徒持守成之論則垂之万世與天地並乆可也陛下既知前日推而行之非其人矣則今日又不可不慎擇焉臣願以荀卿有治人之言為献可􅀂夫叅稽典䇿之訓則有歴朝之􅀦文在焉祖宗之宝訓政要在焉有司之成法在焉朝廷之故事在焉陛下冝詔執政與百執事之人參稽而奉行之可也若夫講明推行之要則無若手􅄃􅁠陛下提綱振領而以万目之繁付之臣下可也陛下終䇿臣曰子大夫學古入官明扵治道藴畜以待問乆矣詳著于篇朕得親覧此陛下導臣使言臣不敢不盡言也臣聞人主􅄏求言之路必􅀅有聴言之實人臣遇得言之秋不可無献言之誠盖求言之路不常􅄏而得言之秋不易遇今陛下開求言之路而臣遇得言之秋陛下有聴言之實臣其可無献言之誠乎臣復有一言以為陛下献者欲陛下正身以為􅄃􅁠之本也按春秋書正者杜預謂欲其体元而居正公羊又有君子大居正之􅀃謂正心以正朝廷正朝廷以正百官正百官以正万民者董仲舒之論正也謂人君􅀁行必正道􅀁發必正言􅀁居必正位􅀁近必正人者劉蕡之論正也臣􅀚自古人君􅀎正身以化下者莫如周文王不􅀎正身以化下者莫如漢武帝文王宅心扵正道之中其勤勞則日􅉴不遑暇食不敢盤于㳺田以庻􅀖万民惟正之供故䏻刑于寡妻至扵兄弟以御于家􅀖見于思齊之詩在位之臣皆節儉正直見于羔羊之詩人倫既正朝廷既治天下純彼其化又見于騶虞之詩文王􅀎自正其身而其下化之如此若夫武帝則不然其􅀁以自治其身與其下應之者皆不正也帝好䛕也故公孫弘曲學以應之帝好刑也故張湯曲法以應之帝好利也故孔僅桒弘羊以剝下益上應之帝好兵也故衛青霍去病以拓􅁟開彊應之帝好夸大也故司馬相如作封禅書以應之帝好神仙也故文成五利之徒以左道應之武帝不􅀎自正其身而其下應之如彼臣􅂅陛下以文王為法以武帝為戒端厥心居以為化本非正勿視非正非聴非正勿言非正勿動其用人也不必問其才不才而先察其正不正是果正人也其進則為治之表其可以其才不足而不與之進乎是果不正人也其進則為乱之機其可以其才有餘而使之進乎其聴言也必􅀚其言之是與非斯可以見其人之邪與正有遜志之言必􅀅察之曰彼何為而投吾之􅀁好㢤是必不正人之言也是言之有害扵我者也其可以其遜吾志而受之邪有􅊇耳之言必􅀅察之曰彼何為而犯吾之􅀁􅁖㢤是必正人之言也是言之有益扵我也其可以其􅊇吾耳而不受邪左右譽言日聞必察之曰是必不正人也是必阿大夫之􅁼也是必善結吾左右以求譽者也退之可矣左右毀言日聞必察之曰是未必非正人也是必即墨大夫之􅁼也是必不善結吾左右以致毀者也進之可矣如是則一念慮無非正心一云為無非正道左右前後侍御僕􅀙冈匪正人殆見四方万里凨行草偃莫不一扵正矣臣􅂅陛下以是為􅄃􅁠之本而又任賢以為􅄃權之􅂇廣覧兼聴以盡􅄃􅁠之羙􅁠在陛下之手則􅀁求無不得􅀁欲皆如意雖社稷之大計天下之大事皆可以不動声色而為之况區區四者之􅁦尚何足以軫淵􅂨之念㢤臣聞主聖臣直惟陛下赦其狂愚不勝幸甚臣昧死臣謹對御批任賢輝經學淹通議論醇正可作第一人梅溪先生廷試䇿􅃃第一梅溪先生後集卷第一賦教授建何横校正㑹稽風俗賦并叙門人周世則昔司馬相如作上林賦設子虚烏有先生亡是公三人相畣难子虚虚言也烏有先生者烏有是事也亡是公者亡是人也故其詞多夸而其事不實如盧橘黄柑之􅁼葢上林所無者猶荘生之寓言也余賦㑹稽雖文采不足以擬相如之萬一然事皆實録故設為子真無妄先生有君畣問之辭子真者誠言也無妄者不虛也有君者有是事也以反相如之􅀃焉有客過越自􅁛子真介于無妄先生䞇見於有君謁入廼膝而前曰聞有君之名雅矣今幸際顔色聆話言僕輙有請君其聽焉君世家于越以風流自命業傅緗素才播歌詠越之山川人物古今風俗載在君腹願聞其略可虖有君廼歛袵肅㝐謝曰唯唯客姑坐焉吾以語爾越於九域分曰􅀭州禹貢淮海惟揚州周禮東南曰揚州山日㑹稽啚經大都督府越州禹貢揚州之域仰瞻天文度當斗牛漢書地理志呉地斗分壄晋書天文志自斗十三度至女七度爲星紀於辰在丑呉越分曰揚州而㑹稽入斗一度白樂天詩云牛斗尺埀象台明地展啚在辰爲丑自夏而矦史記越王句踐其先禹之苗裔夏少康之庻子也封爲㑹稽以奉禹祀啚經封少子無餘於越是爲越侯郡於秦漢秦始皇滅荆置㑹稽郡漢以其地属呉国景帝誅吳王復爲會稽郡覇於春秋春秋哀公十三年於越入呉史記勾踐巳平呉兵横行扵江淮號稱覇王州於隋而使於唐隋大業中改爲越州唐乾元中置浙江東道節度觀察等使公有素而王有鏐隋楊素封越囯公唐末錢鏐平董昌封呉越囯王因種山而中宅啚經種山一名重山即今卧龍山也呉越春秋越王􅌾文種於囯之西山一年伍子胥自海上穿山脇時去種去與之俱游於海今西山低處是也廓蠡成而外州呉越春秋勾踐自呉還范蠡築小城周干一百二十二歩一員三方西北立為龍翼之樓以􅁚天門東南伏漏石竇以象地户陵門四逹以象八風外郭築城而缺西北示服事呉也啚經㑹稽治山隂以来此城即為郡城龍樓翼而屹峙石竇伏而巽流法大門􅀆墜户惟崑崙􅀆是侔呉越春秋范蠡日臣之叢城也其應天矣崑崙之象存焉實東南之大府號實天下之無仇天下本無仇其山則欝欝蒼蒼巖巖嵬嵬磅礴蜿蜒嵂崪崥崹􅀂騫􅀂犇􅀂闔􅀂開或凸或凹或阜或􅎧或断而聮或昻而低虎卧􅀛蹲龍盤鴈􅆦舒為屏障峙為樓䑓崦映江湖明㓕雲霓八山中藏府城之内有八山種山亀山蕺山大珠山鮑郎山彭山白馬山蛾眉山今􅀁存者惟四山耳鮑􅀰彭山白馬蛾眉俱已湮滅僅存其名千里周回彭鮑名存圖經彭山在會稽縣北四里典録云彭祖􅀁隠居之城鮑郎山一名陽堂山在今大能仁寺之前郡囯志云山有鮑郎祠蛾馬迹迷蛾眉山不見於圖經父老云在府橋之東軒亭之西形如蛾眉白馬山在㑹稽縣北五里鉅者南鎮是為㑹稽史記禹㑹諸侯江南計力命日㑹稽㑹稽者㑹稽也皇覧曰㑹稽山本名苗山唐開元十年封四鎮為公故㑹稽山為南鎮永興公洞曰陽明群僊􅀁棲亀山白玉上經曰㑹稽山周回一百二十里名陽明洞天皆仙聖天人都㑹之所石傘如張圖經石􅏛山在㑹稽縣東南十五里玉笥側状如􅏛石帆如􅀭石帆山在㑹稽縣東十五里夏侯曽先地理志云射的山北有石壁高數十丈中央少紆状如張帆又有文石状如鷂人亦謂之石鷂山石簣如藏輿地志云宛委山上有石簣璧立干雲升者累梯而至石鷂如翔石壁匪泥並見石帆注石甕匪擕巨石三在照湖東状如酒甕時人謂之秦皇酒甕香爐自煙㑹稽一峯状如香爐人謂之香爐峯一名覆釡山天柱可梯呉越春秋九山東南天柱號日宛委圖經望泰山一名天柱山韞玉有笥圖經玉笥山在㑹稽縣東南十五里出美玉其形如笥因以為名一名茅峴降僊有䑓皇覧云宛委山上有一巨石吃然如元䑓嘗有神仙降其上號䧏仙䑓苗龍先生於此䑓上昇禹穴窅而叵探史記司馬遷登㑹稽探禹穴唐鄭魴有禹穴碑􅁑巖蜚而自来龍瑞啚經禹穴北有石岩髙丈餘南面側平如削真誥云此石於赤烏二年天降從安悉囯飛来上有索㾗二條名為飛来石晋葛仙公曽築壇煉丹後人名􅁑仙岩煉丹井射堂豊凶之的孔瞱㑹稽記云射的山半有石室廼仙人射堂東峯有射的遥望山壁有白􅀧如射侯士人常以古榖貴賤故語云射的白米斛百射壁元米斛干宛委日月之珪遁甲開山圖云禹開宛委山得赤珪如日碧珪如月長一尺二寸應天上之玉衡輿地志云㑹稽山一名衡山呉越春秋禹聞黄帝藏書于此廼東巡登衡嶺龍瑞啚經注云謂天文盖度中􅁠衡星名非南嶽之衡嶺直海中之蓬萊舊志蓬萊山正偶㑹稽沈紳蓬萊閣詩云三山對峙海中央至􅀂嵊山巋其東啚經嵊山在剡縣東三十四里唐武徳四年置嵊山因山為名今日嵊縣􅂗山屹其西塗山在山隂西北四十五里舊啚經云禹㑹諸侯之所應邵云􅂗山在永興北按永興即蕭山也杜預注左傳云在淮南夀春亦未詳在何􅀁阜至繇蜀蜀阜山在山隂縣北三十五里舊經桉地志云昔自蜀飛来帶見婦二十餘人随山而至善織羙錦自云家在西蜀今忽至此又云勾踐􅀅伐呉置婦女於山上以邀軍士後詆為阜􅀛来自齊亀山在山隂縣東八十歩下有東武里或謂之怪山呉越春秋范蠡築城旣成怪山自生琅玕東武海中山屯一夕自来故名怪山越絶書云勾踐㳺䑓也東南司馬門所以灼􅀛又仰望天氣觀天怪也云逺望似􅀛形或名亀山小梅山廼􅀮吏之窟梅山一名巫山在府城北一十八里梅子真所􅀮之地也其西則有梅市里梅福里紵羅葢西子之閨輿地志云諸曁縣羅山西施鄭且所居有方石云是西施曬紗䖏今名紵羅山五泄争竒於雁蕩掇英集五泄瀑布也在諸曁西四十里有两山夾溪造雲壁立髙二百丈廣數十丈水㵼五莭故曰五泄山多竒峯或比之雁蕩云四明競秀於天台啚經四明山在餘姚縣孫綽天台賦云渉海則有方丈蓬莱登陸則有四明天台五雲中令之故居晋義熈三年中書令王獻之居是山有五色祥雲見安帝詔建雲門寺十峯曇翼之招提法華山在㑹稽縣南四十里晋僧曇翼捿此誦法華經因置寺焉其山十峯其水双澗今天衣寺是也故越為之首􅀆剡為之面􅀆沃洲天姥眉􅀆目􅀆白樂天沃洲山記云東南山水越為首剡為面沃洲天姥為眉目二山今属新昌縣金庭桐柏仙子宅􅀆金庭觀在剡縣東王子晋斈道登仙之所真誥日南岳真人云越有桐柏之金庭飬真之福地申仙之灵嘘也南明嵌崆宝相湧􅀆新昌南明山有宝相寺梁建安王造石佛一軀髙一百尺南岩嵯峨海跡古􅀆南岩在新昌縣西南唐李紳龍官寺碑云南岩海迹髙下猶存陟秦望而望秦􅀆史記秦始皇二十七年上㑹稽􅀕大禹望于南海丘石刻頌啚經秦望山在㑹稽南四十里又有望秦山始皇登山郡臣於此以望秦中登洛思􅀆而思洛􅀆洛思山在蕭山縣東輿志云永興縣有洛思山下人未雋来會稽三年不得反乃登山北顧而嘆因以為名采􅁑食蕺敬弔前王􅀆蕺山在府治東北三里趙璘直碑云蕺􅂼類昔越王所􅄝常採於此遂用名之在晋為王逸少別止尚􅇔故池與祠堂葛山在會稽縣東一十里呉越春秋云勾踐使女纎布以献吳王采葛是山脩竹茂林緬想陳迹􅀆輿地志云山隂縣西有蘭亭王羲之序云此地有崇山峻嶺茂林脩竹又云俛仰之間以為陳迹連山如珠秦皇之􅀁驅􅀆連山在蕭山縣西夏矦曽先志云連山長岡九里西北至定山秦始皇􅁒置石橋渡浙江今尚府石柱數十列于江􅀕世傳始皇軀山塞海擪山如玦亞文之所割􅀆擪烏山在蕭山縣南東方朔神異志云山是亞父割断蕭山南嶺将擪断烏江北幹􅀮􅀆明月在此幹山在蕭山縣北孔灵符地志云許詢家於此山之陽詢詩云蕭條比幹園劉真長嘆曰清風明月恨無元度東山卧􅀆白雲迷東山在上虞縣西北三十里謝安石髙卧之䖏李白億東山詩云白雲他自散少微寂􅀆幽鳥怨少微山在㑹稽五雲門外十里戢方貟外􅀰斉唐墓表云公退居湖山曰少微依山有亭榭獨以書史音樂自適太白空􅀆壄猿啼太白山在剡先地志云峻西六十里與少白山連夏矦曾于天岩崔嵬趙廣信鍊丹登仙之處上有白猿赤貜其水則浩淼泓澄散漫縈迃漲焉而天風焉而波浄焉如練瑩焉如磨溢而爲江潴而爲湖爲沼爲沚爲潢爲汚匯爲陂澤䟽爲溝渠􅐛而田疇淤而泥塗生我稻梁漑我果􅂼集有鳬雁戯有􅀛魚實有菱芡香有芙蕖鶻舟如擊晋安海物異名記越人水􅀾凌波赴敵則有鶻舟名馬檝如驅呉越春秋越人以舡爲車以檝爲馬船龍夭矯橋獸睢盱白樂天詩船頭龍夭矯橋脚獸睢盱堰限江河津通􅈇輸航甌舶閩浮鄞逹呉浪槳風㠶千艘萬艫大武挽繂五丁譟謼榜人奏功千里湏􅁷境絶利慱莫如鑑湖有八百里之回環􅈅九千頃之膏􅃾啚經後漢馬臻字叔荐山陽人爲太守創立鑑湖在㑹稽山隂二界築塘蓄水水髙田丈餘田又髙海丈餘􅀂水少則􅂥湖漑田如水多則開湖洩田中水人海所以無㓙年其塘隄周囬三百十里溉田九千餘頃一􅀃鑑湖八百里盖揔言之錢昭度詩云越囯荷花八百里浮賀􅁥之家唐書賀知章以祕書監請爲道士詔許之以宅爲千秋觀賜鑑湖剡州一曲􅐛允常之都史記少康扁子封於㑹稽後二十餘世至於􅁢常呉越春秋云越之興覇自􅁢常始人在鑑中舟行􅀞啚輿地志南湖縈帶郊廓欵属峯岫白水翠岩互相耿發􅀂鑑􅀂啚王逸少云從山隂上路行如在鑑中斿五月清凉人間􅀁無杜甫詩鑑湖五月凉有菱歌􅀆声峭謝灵運詩菱歌調易急王翰詩不知湖上菱歌女㡬箇春舟在若耶有蓮女􅀆貌都西施采蓮於􅀂邪溪李白有采蓮曲日出􅀆湮銷漁郎􅀆嘯嘑東泛曹江哀彼孝娥曺娥江在㑹稽東四十里蛾上虞人父溺死不得尸娥年十四㳂江慟􅂘晝夜不絶旬有七日遂投江而死西􅀚驚濤弔夫子胥浙江在蕭山縣西十三里史記呉王殺伍子胥取其尸盛以䲭夷革浮之江中呉人憐之爲立祠於江上命曰胥山㮣浦思夫㮣之封㮣浦在諸暨縣北呉闔閭弟之子夫槩所封之地因以爲名翁洲訪偃王之廬翁州属㑹稽郡国志云徐偃王皆居於翁州簞醪􅄬􅃓沼呉國簞醪在㑹稽南三里勾踐􅄬醪醪之所左傳伍子胥曰呉其沼乎扁舟去􅀆變陶朱史記范蠡事越旣滅呉乃乘舟浮海以行終不反止于陶天下称陶朱公鼓樵風􅀆游􅀂邪若邪溪在㑹稽縣東南後漢鄭洪字巨君山隂人孔灵符㑹稽記云射的山南有白鶴山此鶴為仙人取箭鄭洪甞采薪得一遺箭項有人覔洪還之問何所􅁒洪識其神人也曰常患若邪溪載薪為難願朝南風暮北風後果然故溪風至今猶尔呼為鄭公風亦名樵風興䨮棹􅀆㝷􅀮居剡溪一名戴溪晋書云王子猷甞居山隂夜雪􅀄霽四望皓然忽憶戴逵時在剡便夜乘小船詣之經􅀫方至造門不前而反人問其故子猷曰乘㒷而来㒷尽而反何必見戴禊事脩􅀆觴蘭渚蘭渚即蘭亨也羲之序云㑹于山隂之蘭亭修禊事也有清流激湍引為流觴曲水陶泓沐􅀆池戒珠戒珠寺在蕺山本王羲之别業有鵝池硯池題扇橋在馬了溪鑿􅀆禹功畢了溪在剡縣東北源出了山越絶書云禹䟽了溪人方宅土刑塘築􅀆長人誅刑塘在㑹稽縣北越絶記大禹㑹諸矦于塗山執玉帛者万囯防風後至禹万誅之於塘賀循㑹稽記云防風氏其身三丈刑者不及乃築髙塘臨之故曰刑塘酌菲泉􅀆懷古㑹稽山大禹寺有泉名曰菲泉飲清白􅀆自娯卧龍山下州宅之西隅有清白堂清白泉太守范文正公命名有記其物則有魚鹽之饒沈立越州啚序瀕海居人以魚塩為生竹箭之羙尔雅東南之羙者則有㑹稽之竹箭山涵海蓄吂其有㡬貢入王室利周遐迩耕焉㠯火耨焉㠯水漢書地理志云江南地廣火耕水耨民食魚稻南風翼苗翠浪千里耙稏一空玉粒如峙炊粳醸秫既甘且㞓檿枽之竒號為第一呉録太康地記並云諸暨境􅁟諸山第一一檿桒文采如傳棊方正駢次有如􅀞作可為屐韜上品者一兩至數十萬龍精㒩㒩􅄍終滿室蚕書曰蚕為龍精荀卿蚕賦云有物於此㒩㒩􅀆其状屢化如神萬艸千華機軸中出綾紗繒縠䨮積縑匹啚經越貢花紗白編綾䡖交梭綾輕容生榖呉絹􅁲様綾大花緩編大紗花羅木則楓挺千丈名山志云天姥山有楓木千余丈㮤封五夫上虞有地名五夫始皇封松木為五大夫之䖏桐柏合生嵊縣金庭觀道經云上有桐柏合生檫棐異隅輿地志云餘姚有太平山四角各生一種木不雜他木一角純檫一角純粹一角純棐文梓楩柟呉越春秋呉王好起宫室越王使工八山伐木天生神木一雙大二十圍陽為文梓隂為楩抽以献呉王擽柞櫧榆郡囯志若邪溪有櫟木謝客児惠連作詩聮句刻於其上上虞有歴山山下多柏木呉越名祚為歴故曰歴諸暨有櫧山剡有榆木山連理之柯諸暨有木連院因有連理木故得名合抱之株廼斧廼斤㠯輿㠯廬廼有蕭山陸吉東坡黄甘陸吉傳吉􅀮蕭山諸暨三如啚經諸暨出三如謂如錦之桒如拳之栗如􅁝之苧胡柟成林賀􅀲滿區尔雅梅桶任昉􅄒異記中有王氏橘園胡氏梅山賀氏􅆶丘陵家白蓮􅀥實全赤擒腮半朱火榧殻玉櫻桃薦珠鴨脚含黄鷄頭去盧百益七絶之竒尔雅樹木􅀲埤雅梨百損一益楙百益一損􅀮居云山隂蘭亭尢多木􅀲人以為良果酉陽雜爼材有七絶一夀二多隂三無鳥巢四無蠱五霜葉可愛六嘉實七落葉肥火􅀟頭四角之殊越多双頭蓮埤雅去俗言菱芟而不分别惟武陵記云四角三角曰芟两角曰菱蔗有崑崙之號本草注甘蔗有两種赤色名崑崙䉀白色名萩蔗赤蔗岀江東㑹稽梅有官長之呼越有揚梅二種絶佳一日官長梅一日稜梅蔓生則馬乳蘡薁土實則鳬茈慈菰野蔌谿毛園􅂼木菌湘湖之蓴箭里之荀蕭山湘湖出蓴菜㑹稽有羙箭里可薦可羞采擷無尽鱗虫水族海生池飬丁首丙尾皤腹縮項赤鯶文鱧元􅠧黄􅶞以上魚名並載於啚經越所有者余皆􅀋此􅈄人駢集呂鈎以網􅅅金繪玊不数熊掌能言之騖善鳴之鵝陸亀蒙飬能言之鷄王羲之愛善篇之鵞輸芒之􅈉孕珠之蠃文身合氏之子蛤有文故謂之文蛤元微之詩卿味尤珎蛤舎氏子見東坡江瑶柱傳跛足從事之徒元微之詩鼈觧称從事街填巷委與土仝多異獸珎禽屑銅吐綬銅牛山在會稽縣夏矦光曽地志云肯有銅牛見於灵氾橋人遂之奔入此山掘地視之悉銅有也啚經太白山有鳥尾似鷄文来五色口􅄍縁綬長數尺號吐綬鳥猛虎􅀒子蕭山有去虎山本名虎子山有猛虎傷人景徳四年六月晦日虎􅀒一子而渡浙江而去知縣杜守一因改名焉灵烏送􅑹法華山有双烏䲸長則送出之故惟此烏在焉唐萬齊融守碑云双烏所以示北鳯栖鹿化㑹稽有鳯林卿按呉越春秋禹㑹諸矦于稽山因傳囯政鳯凰栖于水百鳥佃於澤華公鳯林詩苗山㑹計啚書曰威鳯曽栖璧玉枝龍瑞啚經􅁑仙翁有桐木􅀮几化爲白鹿三足號爲鹿跡山鶴拾雁耨孔灵符㑹稽記云射的山西南有白鶴爲仙人取箭因號箭羽山上虞有雁田州志云夏禹與諸矦虞樂於此化感鳥獸故其地雁爲民田春拔草根秋除其穗熊羆貍豹猴玃猿􅎜􆄼銜鸕􅄍埤雅􆄼鶄子銜母翅鸕鷀􅄍而生子鸎求鶉鬬鷗浮鷸浴禽經曰鳬善􅃿鷗好浮埤雅鷸翡翠也衒其毛羽日浴登䦨洄淵之間鵶寒鳦痩越多寒鵶秦少游詞寒鵶萬􅀧黄岩叟詞寒鵶如豆俱得其實鳦燕也有二種有胡燕有越燕胡燕肥越燕痩巧婦錐喙埤雅鷦鷯性巧故俗呼巧婦其喙尖利如錐巢至精宻春鋤䨮脰尔雅鷺舂鋤埤雅歩唹淺水好自􅊠昻故曰舂鋤林棲水􅀫脩尾長咮禽經曰陸鳥曰棲水鳥曰􅀫又曰山禽之味多短水禽之味多長山禽之尾多修水禽之尾多促江湖為籠山林為囿㠯牡㠯牝㠯蜚㠯走甲第名園竒葩異香牡丹如洛芍藥如􅀭歐陽公花品序牡丹西出丹州延州東出青州南出越州出洛陽者為天下第一揚州出千葉芍藥木蘭載新呉蛻鎮東軍􅁥軍使院記云大厦之前木蘭特異越城之中称為一絶當前政不􅁤之際怱焉凋零建彭城王之鎮臨也緑葉紫苞載新陽􅃩海榴懷芳州宅舊有海㨨亭唐李紳詩懷芳不作翻風􅃩列蕚猶含汝露妍蘜山黄華啚經菊山在蕭山縣西山多甘菊唐縣令李蕚尉丘丹目之曰菊山蘭亭囯香越絶書蘭亭在山隂越王種蘭処天衣杜䳌天衣寺有杜䳌花最竒毎􅀊盛開􅀚者競集東山薔薇李白詩不到東山乆薔薇㡬度花湖映香䨮越多梅花又餘姚有梅澳湖以梅得名鑑生水芝李白詩荷花鑑裏生鴛梅並蔕越有鴛鴦梅雙頭千葉仙桂丹枝越有丹桂司華騁巧天女效竒桃李漫山􅆇獲眂之藥物之産不知其名白㭉丹參甘蘜黄精呉茰越桃山栀子一名越桃禹糧石英􅌘縣了山出禹餘糧諸暨烏帶山出紫石英薊訓鬻之㠯療疾啚經古廢市在州南輿地志曰昔薊訓賣藥於此市彭祖服之而延齡彭山在㑹稽縣北典録云彭祖􅀮居之城秦皇求之而莫致史記始皇令方士徐市等八海求神藥数􅀊不得葛仙餌之而飛昇􅁑仙翁煉丹飛昇禹穴北有仙岩日鑄䨮芽日鑄山在㑹稽東南五十五里歐冶鑄釰之所覧古集云㑹稽日鑄洪崖双并不在建臘之後卧龍瑞草卧龍山亦産竒茗范文正公清白堂記以建溪日鑄卧龍雲門之茗試之甘液華滋恱人􅁭灵張伯王云卧龍茶冠呉越瀑嶺称仙茶經云餘姚縣茶生瀑布嶺者號仙茗茗山鬬好啚經茗山在蕭山縣西其上多竒茗顧渚争先建溪仝蚤碾塵飛王甌濤翻皓生兩腋之清風興飄飄于蓬島剡藤畨畨􅃹城斑斑越紙出於剡舒元輿有悲古剡藤文啚經越出筆􅃹冰􅃻􅌘水張伯玉詩敲氷呈巧手注云越俗呼敲冰紙為巧手竹翦顧園述異記越中有顧家斑竹製於蒙蔡之手游於羲猷之間友陳元與端紫仝文字於人寰至若龍謢金書龍瑞啚經黄帝藏金簡玉字書於宛安山禹探得之唐開元二年投金龍於禹穴俄有一龍自穴出現於壇上賜號龍瑞宫苔封石刻齊書志云㑹稽剡縣刻石山相傳於名不知文字所在宋昇明本縣名家児襲祖行獵忽見石上有文凢三處苔生其上字不可識刋苔去之有大石文立石文小石文云云或云衛夫人碑墮此中因以為名苗山金玉山海􅀴㑹稽山上多金玉下多珠石邪堇銅錫呉越春秋云歐治子為越王鑄剱破赤堇之山而岀錫涸若邪之溪而出銅黄帝之鑑述異記世傳黄帝鑄鑑于此故名鑑湖神禹之璧紐㒷丁丑禹祠之前有光見人即其處得圭璧歐冶之釰見邪堇銅錫注蔡邕之笛輿地志蔡邕避难於越宿千秋亭仰見榱竹知有竒響因取以為笛遂為宝噐虞翻之牀啚經五官省相傳有虞翻牀翻為吴長沙王所祀特設比牀以表賢客秦皇之石輿地志秦始皇刻石前有方石廣十丈云是始皇座两邉有方石八所云是丞相已下座淳碑斯􅂐漢邯郸淳作曺娥碑蔡邕題日黄絹糿婦外孫韲白叅望山有始皇頌徳碑李斯篆江筆肅墨府治之北有筆飛巷江奄夢筆之所也漢王肅随父在郡東齋夜有女子􅀙地中出與肅語􅀅曉辞别贈墨二貟時肅方注周易多有凝滯旦用此墨覺才思開敏靁鼓銅漏漢書王尊傳母持布鼓扵雷門注云雷門㑹稽城門也有大鼓聲聞洛陽㑹稽黄閣故有銅漏占制甚精王羲之書陸機漏賦鐫刻扵上歴代以為寳梅梁窆石越絶書少康立禹祠扵陵所梁時修庙支一梁木夕有風雨漂一水至乃梅梁也今存窆石在禹陵之前舊經云禹􅁙會稽􅂑此石為窆秦少㳺詩云一代衣冠埋窆石千年風雨鎖梅梁罍金履鐡晋太康中上虞縣扵道􅀚升中獲金罍故縣以金罍名驛郡國志云塗山有石船長一丈云禹所乗来宋元嘉中扵舡側掘得鉄􅂂一双梁􅀄又得青玉印罌銅印玉晋太元年中謝輶為郡守掘郡􅈦枉下深八尺得古銅罌可容数斗封題作越王字文甚分明是今􅀠書餘不可識輶以為范蠡猒勝之術遂埋之今不識䖏玉印見玉注胎艸蹄石啚經獵士陳恵度扵剡山射孕鹿既傷産下一子以舌䑛子身乾而後鹿母乃死思度棄弓矢為僧鹿死之䖏生草號鹿胎草諸暨有馬蹄石傳云始皇東廵馬蹄踐此其跡存焉黄竹神木蕭山黄竹山越絶記云范蠡遺鞭扵此生笋為林竹色皆黄狀如刀割神水見文梓楩柟􅴈流黄漢簟西京雜記㑹稽貢竹簟號流黄簟錞于周樂㑹稽記􅂗山庙中有周時樂噐名錞于活人之艸郡國志云㑹稽横山有草莖赤葉青人死覆之更活止痛之木啚經郡王官廨兩杉梁相􅀓勾踐聴事之舊梁歴代雖逺材質不異俗謗云十年之木􅀎止心痛有削服者多愈柘敷榮而華含戚石氏宗譜新昌石眆墓前有柘木生而内向覆墳如盖然守墓者言毎有登科者則柘有枝持生一枝一人或二三枝則二三人云㑹稽覧古集四明山有双石如筍髙数尺野花叢生其頂杜鵑鳴時爛􅀂霞錦國朝祖宗遏宻皆三年不荣聀方齊唐甞為之賛華鎮詩云鼎湖龍去蒼髯断三載叢花不記春天雨錢而山儲粟剡有禅房寺舊經云齊安南捋軍黄僧成有徳政感天雨錢數億萬遂捨造寺號錢房院梁天監中改禅房寺儲山在㑹稽東南有粟山周䖏風俗記舜時供儲在此皆希世之竒迹盖欲言而不足其人則見扵呉越春秋㑹稽典録圖經墬志歴代東牘大書特書班班滿目孝者悌者忠者義者廉者遜者智者徤者優扵文詞者長扵吏事者擢秀科目之榮者䇿名卿相之貴者殺身㠯成仁者隠居以求志者埋光屠釣之㣲者晦迹佛老之異者虞翻之言有所不􅀎盡朱育之對有所不􅀎既㑹􅾵典錄云孫亮時山隂朱育少好竒字仕郡門下書佐太守濮陽興正旦宴見􅁺吏問昔王景興問士扵虞仲翔而未覩仲翔對也書佐寕識之手育對云云府君稱善予亦焉􅀎􅈁數之哉姑摘其尤之一二前則種蠡計􅒍號賢大夫按吴越春秋越王有八臣四友文種范蠡計硯最顕後則嚴助買臣直承明廬漢書嚴助朱買臣皆㑹稽呉人武帝時俱為持中後皆為㑹稽守孝悌則張萬和之父子唐張萬和諸暨人遭父母䘮兄弟廬墓二十餘年萬和終予亦廬墓韓靈敏之弟昆齊韓灵敏剡人早孤與兄灵珎並有至性母亡無以菅㐫共種􅀲半畒朝暮生遂辦􅁙事鄧斯祁樊自殺以代臯朱育對曰䖏士鄧盧叙弟犯公憲自殺乞代吴寕斯敦山隂祁庚上虞樊正咸代父死罪董黯朱魏報讎而名聞虞翻對曰句章董黯盡心色餋䘮致其哀怨親之辱白日報讐海内名聞又魏朱恭明永興人父為烏傷長陳碩所殺恭明志在報讐未間碩病亡刺殺其子遂奪魏後漢魏少英上虞人兄為鄉人所殺少英報讐訖遂亡命或濕衣以障火丁興㑹稽人家近荒野野火㳂燒興母老病乃温衣覆母以身障火身死母存或泣血以戢焚許伯㑹蕭山人遭母䘮結廬墓側野火􅀅及墳所乃悲號慟哭天忽降雨大則隨滅或銜哀而廬墓山隂鍾􅄐表剡鄭僧保諸暨張萬和蕭山許伯㑹戴㳟皆以廬墓著名或􅀒􅁟以成墳諸暨張孝和申屠氏女蕭山郭世道許伯會並􅀒土成墳或以行而名里剡王知元父䘮哀毀卒高宗改為孝義里諸暨賈思㑹母亡以至孝聞有司奏改其里為孝義里永興郭世道􅀒土成墳􅀽愉表其行􅃙改所里為孝行里或以義而旌門山隂嚴世期好施慕善有司奏榜其門曰義行剡公孫逹居䘮事母名聞郡縣詔表門閭蕭山俞僅一門四代兄弟十五人老㓜八十餘口為郷里所稱􅀚察使孟蕳書干圖經以勵風俗懿矣三女齊書㑹稽陸氏有三女無男祖父母年八九十相継卒三女自营墳􅁙為庵舎墓側賢哉二娥曺娥見曺江注囯史朱娥上虞朱四女也母亡餋于相媪娥十􅀊里中朱顔與媪競持刀􅁒􅄬媪一家驚潰独娥號呼而前擁蔽媪手挽顔刀曰寕殺我母殺媪也媪脫娥死事聞賜其家粟帛其後㑹稽令董偕為娥立像于曺娥庙四時配享䖏子之孝凛然可多節義則黄公居四皓之列虞翻對曰鄞大里黄公㓗巳􅁀秦之世髙祖即祚不能一致惠帝恭遜出則済难魏少英參八雋之儔少英見後漢黨錮傳虞翻曰少英遭此屯蹇忘家憂囯列在八雋為世英彦􅀩難衞主則有若丁潭晋丁潭字世康山隂人薊峻乱成帝􅀩塵於石頭潭随從不離帝側委身授命則有若王脩虞翻曰句章王脩委身授命埀声來世虞喜躬􅀊寒之操晋虞喜字仲寕餘姚人太康中詔曰喜㓗静其操􅀊寒不移孔愉洪止足之謀晋孔愉字敬康山隂人史賛曰愉洪止足之分有㢘遜之風或一門死三世之義虞翻曰决曺掾上虞孟英三世死義或一邑萃三康之㳅山隂孔愉敬康張茂偉康丁潭世康斉唐時人號㑹稽三康至􅀂㮤楊桞朱永寕瞿素婦節峥嶸蹈死不顧朱育對其女則松楊桞朱永寕瞿素或一醮守節䘮身不顧或遭冦刧賊死不􅃜行卓行則鄭洪韓􅀃鍾離意朱雋戴就舉於孝㢘後漢鄭洪韓􅀃鍾離意皆山隂人米雋戴就昔上虞人並舉孝廉虞潭孔奐沈融朱仕明舉於秀茂晋虞潭餘姚人陳孔奐山隂人唐沈融㑹稽人並舉秀才齊朱仕明剡人舉茂才虞􅀉起於對䇿虞􅀉餘姚人弱冠對䇿髙第起家趙瞱㩲於有道後漢趙瞱山隂人舉有道陳子公退侵墬之藩會稽陳􅅝字子公以遜為行與紀伯為鄰伯􅀼囂蕃地自益囂見之不言移一丈以潤紀伯伯斍知患俱乃還所侵之地两邉俱退乃為一路鴻嘉二年太守右扶風周府君刻石旌表號曰義里長簷路鍾離牧拒慙还之稻呉鍾離牧山隂人居永興種稻二十畆臨熟民認之􅀵遂与稻後民慙还牧閉門不受循吏則有還珠孟甞後漢循吏孟甞字伯周上虞人為合甫太守郡無耕稼所資珠璣前政貪殘珠徙交趾甞清㓗無求珠乃還郡致雁虞囯孔瞱記云虞囯餘姚人漢時為日南太守有惠政行部有双雁随軒翔舞及還餘姚雁奔随帰國卒雁栖於墓側後遂成群今餘姚有双雁鄉希銑遺四州之愛唐康希銑㑹稽人為饒海台睦四州刺史顔魯公撰碑今断碑猶存夏香著歴任之績夏香字曼卿蕭山人㑹稽典録云香歴任邑長皆有声績儒學則王充㠯論衡􅂋後漢王充字仲任上虞人著論衡八十五篇沈珣㠯大義稱唐沈珣㑹􅾵人撰九經大義百卷謝況謝承之史學晋謝沉字行思山隂人明練經史撰晋書三十餘卷承字偉平亦山隂人博學治聞撰後書一百餘卷孔僉孔祛之明經梁孔僉山隂人通五經尤明三礼生徒數百人三為五經博士孔子祛亦山隂人講尚書聴者甞数百人着尚書義二十卷賀孝先擅儒宗號晋賀循字孝先山隂人經斈第一為江東儒宗虞伯施剸慱學之名唐虞世南字伯施太宗称西南有五絶其一博斈也文章則孫㒷公掞金声之賦孫綽字㒷公會稽人作天台賦友人曰鄉試擲也當作金声徐季海揮玉堂之䇿徐浩字季海為中書舎詔令誥䇿皆浩為之瞱若春榮則任弈虞翔朱育對曰文牽之士則任弈虞􅃋吝馳文檄瞱􅀂春榮文不加􅀧則四明狂客唐賀知章字貴真永㒷人自號四明狂客醉後属詞動成篇卷文不加點二賀二虞蜚声籍籍唐賀徳仁山隂人與従兄徳基以文辞称人為語口斈行可師賀徳基丈質彬彬賀徳仁虞世南与兄世基俱善属文時人方之二陸呉融十詔成於俄刻唐呉融山隂人昭宗時為翰林斈士中書舎人帝存指授疊十許藁融跪作詔少選成語當意詳􅀮逸則嚴謝秦方述睿充符後漢嚴光字子陵餘姚人晋謝敷㑹稽人月犯少嵗星古者以􅀮七當之俄而敷死唐奏系㑹稽人􅀄􅀮於剡後居泉州南安人号其山為髙士峯方千字雄飛今五雲門外有方千島登波坊有方千池皆􅀮所也唐孔述睿山隂人與兄充符皆􅀮嵩山方術則介􅁚呉範嚴卿夷吾呉介象字元則斈氣術能扵䒢屋上煑物而火不焚吴範字文則明暦数知風氣晋嚴卿善卜筮皆㑹稽人後漢謝夷吾字尭卿山隂人斈風角占候克日卒丹青則孫遇道芬名畫録孫遇僧道芬皆㑹稽人以善畫著名筆札則孔琳徐嶠宋孔琳之山隂人徐嶠之㑹稽人皆善草􅀠書浮屠則道林灵澈晋僧支遁字道林居沃与王謝諸公㳺唐僧灵澈㑹稽湯氐子詩与刘栁善神仙則劉晨阮肇續齊偕記漢永平十五年剡縣有刘晨阮筆入天台山採藥因遇女仙半年還家並無相識驗得七代孫坙太康年失二人所在廼有谿上浣紗之女諸暨有西施流紗石林間舞劒之姝吴越春秋越有処女出於南林越王聘之問以劒㦸之術色白天下杜詩越女天下白氣雄萬夫越女論劒曰聞斯道者一人當百百人當萬王􅁒試之其術即見故勾踐復囯也有六千君子史記越伐吴發教士四万人君子六千人項氏崛起也有八千子弟史記項羽起㑹稽得精兵八千人渡江今山隂有項里乃羽與叔父梁避仇之地覇有江淛横行當代彼二覇之得人尚斗量而車載矧歴世之人材亦足明其大槩建我囯朝尤號多士二百年間不可勝紀大則杜正献之勲徳杜祁公衍字世昌㑹稽人謚曰正献次則孫威敏之功名孫大資􅃆字元規㑹稽人謚曰威敏姚石郎司元祐之直姚給事劬字輝中山隂人无祐中為諌官有直声顧内相號江南之英顧内翰臨字子敦㑹稽人束坡贈詩云君爲江南英靣作河朔偉萬石雲仍匪建則慶新昌石氏爲東南名旌囯朝登第者㡬三十人二陸棠棣如雲與衡陸左丞佃字農師弟傳字岩老俱有才名比􅀳二陸呉先生風髙於賀老呉先生名孜嘉祐治平間名士捨宅爲泮宫今有祠堂存君子以爲賢於賀􅁥一等齊職方迹擬於囦明齊賢良唐字祖之仕至聀方員外郎退居湖山名曰少㣲自爲詩云直當山靣開三徑平截波心種緑楊錢氏世賢科之盛錢内翰昜㑹稽人景徳三年中制科子明逸慶歴二年彦逺慶暦六年並中制科史門継衣錦之榮剡中史氏兄弟相継登科鄉号継錦劉求㠯義門􅂋㑹稽求氏上虞劉氏並号義門杜趙以䖏士稱王荆公有贈越中處士杜醇詩趙䖏士仲淵祥符中􅀍召不赴或覧古以㳅詠故朝奉大夫華君名鎮字安仁甞着㑹稽覧古詩百餘篇或編啚而著名諸葛􅀷字通甫緫集歴代帝王年紀自三皇至于大宋編之爲啚名曰紹運至􅀂聮翩桂籍焜耀簮纓名登史䇿足疊天庭盖甞詢之故老徃徃莫識其名矣故千岩競秀萬壑争㳅者顧長康之言也刘義􅂟世􅀃云顧長康􅀙㑹稽还人問山川之羙顧云千岩競秀万壑争㳅山轉逺轉高水轉深轉清者李浙東之記也唐李遜㳺妙喜寺記越州好山水山轉逺轉高永轉􅀷轉清瑰竒市井佳麗闉闍者白餘杭州詩也白楽天和元稹陽明洞天詩云瑰竒填市井佳麗溢闉闍忠臣係踵孝子連閭者虞功曺之對也虞翻對王府君曰海岳精液善生俊異是以忠臣係踵孝子連閭下及賢女靡不育焉越之山川風物其大略如此子真始驚而疑卒歎而曰壮矣哉盛矣哉山川如斯人物如斯吾未之前聞也然越在春秋僻䖏東夷夫子作經􅵘為於越其人材風俗固未可與齊晉魯衞諸列囯抗衡也今有君所称㡬不㝐口豈昔日逺扵京畿含香未越如王景興之言邪王景興問虞翻曰聞玉出昆山珠生南海逺方異域各生珍宝曽聞士人歎羙貴􅀖旧多英俊徒以逺於京畿含香未越尔功曺雅好傳古寕識其人邪翻對云云抑山川降灵孕秀固自有峕邪抑亦因人作成而致然邪有君曰昔嚴朱二子為漢名卿晝綉故鄉夾道郊迎争􅀚快覩歆􅃩其榮故其俗始尚文學而功名嚴􅂇朱買臣貴􅂋漢朝文辞並發上拜買臣㑹稽太子謂曰冨貴不歸故鄉如衣綉夜行今于何如買臣頓首辞謝晋王右軍為越内史雅㑹蘭亭㳅觴曲水臨池墨妙輝映千祀能使遺文感槩君子故其俗始尚風㳅而多翰墨之士晋王羲之除右􅀅軍㑹稽内史以上巳日与謝安孫綽許詢之㳅㑹于蘭亭㳅觴曲水自為之序其未云後之君子亦􅀅有感扵斯文唐元㣲之一代竒才罷侍玉皇謫居蓬萊賓竇鄰白唱酬徃来繇是鑑湖秦望之竒益聞故其俗至今好䪩詠而多風騷之才唐元稹字徴之罷相為浙東􅀚察使辟竇鞏為副鞏工在詩与之酬和故監湖秦望之竒益傳時号蘭亭絶唱微之川宅詩云我是玉皇香案吏謫居猶得小蓬萊時白楽天守杭常以詩筒往来後白赴闕留贈云􅀙此舟人應省事寂寥无復逓詩筒不獨此数君子也任延張霸以尚賢為治而俗始貴士後漢任延為郡尉㑹嵇称多士延皆聘請高土如董子儀􅃊子陵待以師友之礼郡中賢七大夫争往官焉張覇為守表用䖏士顧奉公孫松等其餘有業行者皆見擢用郡中争厲志節習􅀴者以千数劉􅃂車俊㠯潔已化下而人斯尚清後漢刘寵為太守郡中大化召為􅀅作大匠山隂五六老叟人齎百送寵寵為人選一大受之吴軍俊為太守在公清忠第五倫下令而􅁋祀之風革後漢弟五倫為太守俗多􅁋祀常􅁠牛祭神財産困匱其自食牛肉而不以薦祠者發病且死先為牛鳴前後卲将莫敢禁倫到官移書属縣曉告百姓後遂断絶諸葛恢莅政而陵遟之俗興諸􅁑恢為太守元帝謂曰今之會稽昔之関中政之所先君為言之恢曰今天下䘮乱風俗陵遲冝尊五羙屏四惡進忠實退浮華帝納之以政績弟一増秩至若李唐刺史九十八公首有龐玉􅂋有姚崇圖經十子郡績稱雄唐太守題名記元九十八人揔􅃹龐王為首其最􅂋者姚元之後為開元賢宰相以名見于啚經看十人李大亮竇懐正薛平陸亘揚於陵李遜薛成元稹王式式弟亀囯朝逮今盖百餘政前有文簡後有文正題名所記比唐為盛宋大守題名記始於畢文簡公士安其問􅂋者非一而尤賢者茫文正公承宣得人風俗斯羙盖亦理之然也子真曰是誠有之然皆二千石之事尔未足多也願聞其上者有君曰昔勾踐懲㑹稽之棲也史記越王伐吴吴敗之夫􅎛越王乃以餘兵五千人保棲於㑹稽痛石室之辱也吴越春秋越王入臣呉拘於石室之中越王服犢鼻著樵頭斫到飬馬蓼目水足抱氷握火越王念復吴讐苦身劳心夜以接日目卧則切之以蓼足寒則漬之以水冬常抱氷夏还握火采蕺于山越王為昊王甞惡遂病口臭范蠡乃令左右皆食岑草以乱其􅆨越人至今以為俗岑草蕺也見前注置膽于坐史記勾踐反囯置膽于坐坐卧即仰膽飲食亦甞膽也日汝忘㑹稽之耻邪􅁑婦興歌名曰何苦其詞曰甞膽不苦味若飴令我采􅁑以作絲吴越春秋越王使囯中男女人山采葛作布以献吴王吴王大恱葛婦傷越王用心之􅀂乃作何苦之詩云云二十年間焦心苦志卒㓕強吴㠯䨮前恥越絶之稱􅁠輿於此越絶書聞者曰何謂越絶越者国之氏也絶者絶也謂勾踐時也故其俗至今能慷􅁣㠯復讎􅀮忍㠯成事若是何如子真曰茲百者之事也傳不云虖碎而王駁而霸彼齊威晋文之盛猶不足稱於大君子之門况勾踐虖有君曰昔禹治水之畢與群后計功苗山更名㑹稽卒而􅁙焉祠廟􅁜􅃦于今尚存啚經禹陵在㑹稽山吴越春秋禹到越因病死􅁙焉葦椁桐棺穿壙七尺下無及泉墤高三尺土階三等越絶書少康立祠於禹􅁜所上有遺井賀循地誌云㑹稽山有禹井去禹穴二十五歩謂禹穿鑿故因名之下有菲泉過而飲者莫不發免魚之歎興河洛之思不獨勾踐有其烈史記勾踐有禹之遺烈馬侯嗣其功馬臻創立鑑湖至今其俗勤勞儉嗇實有禹之遺風􅀂是何如子真曰羙哉禹功宜其代舜而有天下也游於是穸於是庙食於是兹所以化􅀍万世之乆也然􅀃者㠯為入聖域而未􅄖其必有大於此者虖有君曰舜生於諸馮孟子以為東夷之人歴世逾逺㳅傳失真太史公㠯為兾州然邪否邪史記舜兾州人兾在河南非東夷也与孟子之􅀃異然越之邑則有上虞餘姚啚經夏禹与諸侯㑹計因相虞樂於此故曰上虞周処風土記云舜後支庻所封舜姓姚故曰餘姚一日謂邑有姚丘即舜母握登感大虹生舜之地山有虞山歴山啚經虞山在餘姚西三十里一云在上虞之東太康地志云舜避丹朱於此歴山在㑹稽東南八十四里旧啚經云昔舜耕之所水有漁浦三憮啚經上虞縣北有漁河是舜漁之処又上虞有地名漁濱虞濱水經媯石入東海江裏有上中下三憮言二女降時媯地高險回曲使者至險􅂺憮然而嘆故曰三憮墬則有姚丘百官風土記舜生於姚丘去上虞四十里有姚丘即姚丘也新記云書平章百姓今上虞有百官里㑹稽記百官者丹朱􅀙舜於此里焉有􅕬上虞有􅕬里舜時供儲在此陶焉有灶上虞有古陶灶言舜所作汲焉有井舜井在上虞西北三十五里又有舜水在縣南二百五十歩祀焉有庙舜庙在上虞縣西三十五里皆其遺迹也意者不生於是則游於是乎舜為人子克諧㠯孝故其俗至今烝烝是俲舜為人臣克盡其道故其俗至今孳孳是蹈舜為人兄怨怒不蔵故其俗至今愛而能㝐舜為人君㠯天下禅故其俗至今廉而􅀎遜若是如何子眞矍然離席而立拱手而對曰於戯噫嘻尽善尽羙雖甚盛徳蔑有加矣昔季礼􅀚樂而止於韶自韶之外不敢􅀚余問風俗亦極於舜自舜之外不復問矣無妄先生粲然失笑於旁曰固則子真之問有君之畣也兹皆古之越非今之越也人死骨杇世変風移山川雖在人物已非前日淳朴変而澆偽前日㢘遜変而争􅴠前日勤儉変而矯怠前日忠孝変而㓙悖尚何執􅁓上陳迹而譊譊其頰舌邪有君曰先生之言是也然風俗不常羙亦不常弊善焉惡馬維人是繋今朝廷駐蹕東南越為鉅藩宻迩尭天盖尺五間帝命重臣来鎮是􅀖入境問俗登堂􅀚風卧龍山有􅀚風堂因舜禹之遺化明吾君之至仁布徳教於黄堂変簿俗而還淳矧何世之無才亦奚有於古今子不見夫銜命虜庭死於王事如陳公張公者虖陳公名過庭張公名字發靖康問爲和議使成死於虜中議礼靖康赴难建炎如華君􅀓君者虖華君名初平靖康􅀄爲太常慱士議礼不屈事見李叅政所作墓志傅君名崧卿建炎間虜犯浙東越守以城䧏公㪯兵赴唯越人頼之是豈異代之人邪又不見夫姚江陳公陳公名槖所臨有声亦克之退身名两榮執政李公李公名光忤意􅁠臣老於淪落世賢其人愍孝蔡子􅂢生可悲同彼旌忠庙食于兹蔡孝子名定父以罪繫獄請代弗許遂自沉于河竟脫父罪事間乎朝立庙号愍孝建炎間越守以城䧏虜班直唐􅄾􅁬甎繋虜慢罵而死庙号旌忠隠吏王君王君名公衮手斬發冢之讐自􅄬于府斬讎著名一門可稱賢父难兄兹固先生目所親覩也安知後之眂今不猶今之眂古虖先生曰有君越人也知越之風俗而已矣昔子虚夸雲夣烏有先生詫齊亡是公折之㠯上林之事今越未足侔齊楚之大尚何足㠯夸之有君曰昔吴子問桞先生㠯晋囯之事而桞㠯晋對今子真問余㠯越囯之俗而余吕越畣亦各因其所問而及之尔余豈瞢然無聞無知於越之外哉今天子披輿墬之圖思祖宗之績求治如不及見賢而太息文徳旣修武事峕閱盖􅀅舞干戚而服逺夷復侵疆而旋京闕余竢其車書仝南北一倣吉甫羙周室賦崧髙歌吉日招魯公命元結磨蒼崖秃鉅筆頌中興紀洪烈邁三五夐前牒亘天地昭日月於是窮章亥之所歩攷神禹之所别覧四海九州之風俗掩两京三都之著述騰萬丈之光芒有皇宋一統之賦出回眡㑹稽盖甄陶中之一物無妄先生自知失言色有餘媿廼與子真逡廵而避有君退而傲於南囱有飄飄凌雲之氣民事堂賦并叙堂名民事志天語也某俻貟越幕􅀊􅀅朞顧惟不才瞢然無􅀘日㠯敗官曠職為憂所幸黄堂主人甚賢同僚皆士君子朝夕講論無非民事之要者因為之賦㠯志其一二云繄越幕有下僚􅀆名所寓曰民事之堂誦天語之丁寕􅀆銜聖恩而不敢忘啖民脂㠯飽妻子􅀆猶雀䑕之偷太倉苟不民事之是思􅀆又􅀅奚逭虖天殃嗟㑹稽之大府􅀆罹荐􅀊之㓙荒􅄓風作於孟秋􅀆雨浸􅁋而異常天吴怒而江濤沸溢􅀆飄廬舎而壞隄防粢盛害而􅀊大侵􅀆民餓踣而流亡射的黒而米斛千􅀆擷蓼花而為粮是􅀊飢民擷蓼花掘草根而食痛瀕海之虽􅃖􅀆塟江魚之腹腸上虞縣渰死者㡬百人予甞告其故於前使君􅀆請敷奏於岩廊顧幕中平日之辨􅀆人廼靳其為狂㑹伯尊之傳召􅀆逹民瘼於九重予殆有􅁼於輦者􅀆亦何恨夫言之不庸洪惟當宁之至仁􅀆視赤子其如傷蠲常賦而救天菑􅀆出内帑之所藏哀東州之無告􅀆惠吾民㠯龔黄左公孝而右孟􅀶􅀆相與恊賛其惟良先撫字而後催科􅀆正今日之所當寛公􅀻之積􅀒􅀆㠯俟虖􅀊之豐穣省訟牒之煩苛􅀆抑蠹政之豪強節無用之浮費􅀆俾斯民之小康兹政事之所急􅀆敢不忠告虖黄堂至􅀂鑑湖利及九千頃􅀆日侵削而就荒􅀊和買無慮十萬縑􅀆曽無一錢之償􅅦酤之利半奪於有力􅀆財賦浸㠯荒凉兼并之弊熾於大族􅀆編氓餒於糟糠兹又越中之巨害􅀆姑略言其大綱若夫民事之在天下􅀆固不足㠯知其詳有一言㠯盡之􅀆曰生之而不傷擇守令􅀆去姦賍慎弗擾􅀆如牧羊兹畎畆之惓惓􅀆願入告于天王蓬萊閣賦并叙越中自古號嘉山水而蓬萊閣實為之冠昔元㣲之作州宅詩世􅁛絶唱近代張公伯玉三章膾炙人口好事者􅀙而和之獨未聞有賦之者某筮任之􅀄辱為蓬萊客廼者中秋之夕與同僚㑹飲于兹閣覧湖山之勝翫月于樽爼間即席賦詩諸公皆和既而念之閣不可㠯常登一詩不足㠯盡意遂􅀙而賦焉王子游㑹稽客蓮慕登卧龍之山躡巨鼇之閣秀閱千岩㳅􅀚萬壑縦逺目於東州暢幽懷於廖閣于時天高氣肅秋色平分簮盍良朋把酒論文俯仰湖山懷古傷今登髙賦詩㠯寫我心周覧城闉鱗鱗万户龍􅄍成珠􅀛伏東武三峯鼎峙列障屏布艸木籠葱煙霏霧􅄍棟宇峥嶸舟車旁仵壮百雉之巍垣鎮六州而開府東望稽山思禹之功喬松欝虖故陵丹青儼於祠宫藏丹書於䰠穴㳅遺畫於無窮南目秦望哀秦之過方鑱石㠯頌徳驕顔色㠯相賀嗟仙藥之不来俄腥風之已播西望夕陽送目蘭亭懷王謝之風㳅感斯文而涕零徒觀夫茂林􅁱竹鎻烟靄而㝠㝠北望滄海􅄅其無涯方吴門之􅀞龍視越囯其如蛇轟雷鼓於一震虚吴囯而成窪訪麗譙之故址第見虖古木之號鵶前瞻鑑湖滿目雲水嘉馬侯之􅊆績慕賀􅁥之高􅁤祠荒􅀆遺迹半湮宅冷􅀆黄冠無㡬徒有漁舟賈楫風樵航葦徃来虖鷗鷺之鄉欵乃虖烟波之􅂨仰瞻高閣翬飛崔嵬俯瞰州宅􅃡懷髙才靣無時之屏障家終日之楼䑓長湖山之價於几席之上惜斯人之安在哉言未畢客有指斯閣而謂予曰子亦知夫閣之所㠯得名者虖盖始於元和才子也㠯玉皇案吏之尊擁旌麾於千里也蓬萊隔弱水三萬里㠯筆刀坐移於是也齊名有白􅀙事有鞏胷中有萬頃之湖真一代之竒􅊆也詩章一出遂能發秦望之精神増鑑湖之風采蘭亭絶唱亘古今而莫擬也子亦讀夫才子之傳否虖姑問訊其􅀙何而来集虖彼而至于此也才子之才固足㠯起吾子数百年之􅋍慕才子之所㠯􅀗侍玉皇者亦吾子之所喜攻而􅀷耻也夫何昔之有予於是引客之手􅀭􅃑而起言契予心諾諾唯唯有是哉斯人也而至於斯也尚忍言之哉俄而鼓角作於人間明月出於林端妙三弄之梅花爛十分之銀盤釂一觴而徑醉有不盡之餘􅂬頃之隂雲忽興􅀧綴青天漸山川之􅀩籠若有妬虖婵姢􅀝危䦨而感槩斍興尽而思旋矣於是相與啜茗於清白之堂潄齒於清白之泉閱唐宋之題名終夕為之􅁣然嗚呼噫嘻死者可作吾與誰帰其無出虖文正范公之賢梅溪先生後集卷第一梅溪先生文集卷第一詩教授建昌何㶇校正甽㽗十首甽㽗有遺士妄懷葵藿心朝夕傾太陽不耐氛􅁾侵肝膽有古劒願言决群隂兹志尚欎欎抱膝成悲吟古道日云邈古意誰復知陽春漠無和流水空含悲郢曲變新調鄭聲入朱􅁝喟然三嘆餘黙與羲皇期讀書不知道言語徒自工求道匪云逺近在義命中吾儒有仲尼道德無比崇傳参十八章入道知其宗後學昧極致徒知授児童孰識孝與弟理與神明通爲臣不知此事上焉能忠仲尼作春秋垂訓千萬年古者父母讎義不共戴天莊同父何在乃與齊侯田魯國無臣子君親義茫然齊紀不並立諸児得稱贒善􅁖不可掩筆削至今傳飛飛古帝魂哀哀􅀉春怨異郷莭物新故國人事變訴亡誰肯怜啼苦血空濺雲安􅂯拜人傷哉不復見彼㣲双鶺􅟀飛飛同一原急難喻兄弟義著周雅篇周公代武王大義今古傳人孰無兄弟急難斯見焉願懷周公心無媿詩人言竹有君子節青青貫四時桃李媚春光千株弄妖姿世眼恱繁􅃩疇能賞幽竒君㸔桃李蹊蹄轂紛争馳君㸔竹林下形影誰相随七賢乆淪􅃿高躅猶可追吾家植千竿風月足自怡豈不競時好聊爲􅀊寒期兀兀窓下士筆畊志良苦黄卷對聖賢慷慨深自許一朝出干禄得失戰匈宇曲意阿有司䛕言狥人主貪榮無百年貽謗有千古丈夫冝自貴清議重刀斧我豈不􅁒仕時命不吾與􅂚不枉尺求權門正旁午非道吾弗由兹心巳先許願言安貧賤順命爲出處儒冠誤身世偃蹇二十年豈不懷明主冨貴乃在天平生學忠孝自致無由前青燈照夜長感激徒自憐觀國朝故事昔在景徳􅀄胡魯犯中原朝廷用萊公决䇿幸澶淵髙瓊雖武夫能發忠義言詠詩退虜􅀐用醜樞相顔銮輿至北城断橋示不還一箭斃撻覽夜半􅁍腥膻至仁不忍殺和好垂百年偉哉澶淵功天子能用賢昔在康定􅀄元􅉴叛西陲朝廷起韓范節制閫外師二公人中龍材畧超等夷匈中百萬對面千里機不比大老子而令虜能欺深期復靈夏重勒燕然碑軍中果興謡西賊心膽􅈥逆節遂称臣􅀾士觧甲㱕社稷安㤗山四海絶瘡痍堂堂寕復有爲作思贒詩昔在元佑􅀄朝廷用老成元􅁖首竄殛賢雋皆彚征簾幃八年政内外咸清明四夷各自守天下幾太平紹聖黨論起宵人壞典刑二蔡唱継述曲學尊金陵忠良􅄬海島黨籍編姓名春秋亦􅀗罪學者專三經心術遂大壞風俗從此傾養成前日禍中原厭羶腥我􅁒著一書善􅁖深􅂆懲姦䛕誅朽骨潜徳發幽馨六賊未足罪禍端首熈寜冨公昔使虜厲色争獻納臣節安敢􅉻君恩以死荅煌煌中國尊忍為豺狼屈堂堂漢使者刚氣不可折斯人嗟巳亡英風復誰接銜命虜庭人偷生真婢妾㶁㶁岸下水㶁㶁岸下水汝流􅁒何之但見日東注寜有還源期尼父川上嘆逝者亦如斯人生百年間擾擾無巳時利名􅃥􅀄心百􅂬無一追待汝後知悔桑榆景堪悲感此盍悟彼毋為浪吁嘻宣和乙巳冬大雪次表叔賈元實䪨天公昨夜屑瓊花三尺深深曉更加桞不待春先起絮梅非因笛自飛華牧羊大窖人何在駐馬藍関路更賖安得晴天開萬里行人愁思渺無涯傷時感懷三萬六千成擲梭􅂬娱常少愁常夛干戈今日猶未定書劒他年知若何淡蕩三秋冷時莭蕭條萬里空山河傷時眼淚滿􅁭血更把少陵詩句哦帝郷五載亂離中億萬蒼生䧟犬戎二聖逺征沙漠北六龍遥渡浙江東斬姦盍請朱雲劒射虜冝貫李廣􅃓借問秦庭誰慟哭草茅無路献􅀌忠駕幸温州次僧宗覺韻聖主南廵駐六飛􅀖人咫尺見天威間関高帝尚鞍馬謹厚漢光猶絳衣北斗城池増王氣東甌山水發清輝佇㸔天仗還京闕無復旄頭彗紫微温城七山成斗形次韻謙仲見􅀉湖山藍黛青湖水琉璃碧我時湖邉游山水正秋色詩翁偶乗興来作湖邉客談鋒两􅀄交意氣已相得詩壇子與盟文㑹公為伯豪詞肆滂沛淡語入幽􅄫心匠巧雕斵物態窮搜覔壮哉五言城卓尓萬仞璧􅀄疑公腸胃百怪所窟宅􅄍氣干雲霄直欲閗霹􅋬妙奪觧牛術奏刀聲砉剨我才寸莛㣲洪鍾詎能擊又如鳴蟋蟀啾然和金石未窺學藩籬敢語詩奥􅄨繆為馬慕韓浪作赤效白奨拔非所䝉猖狂固冝責新篇又拜嘉開緘光􅃩射藏之比明珠長使夜照席惜哉不遇時豈為􅆇倉隔儒冠五十年世路疲行􅃥操矛赴文􅂣􅀾藝輙敢北書劒两無成泥􅂗困蹤跡龍鍾似東野窮愁攪懷臆空吟三百篇髙視古無敵霜風剪林木黄葉滿澤國我思公不見羸馬未能䇿恨無神僊術安得生两翼因召管城頴免冠加拂拭書帛􅀉征鴻心目两俱極送凌知監赴玉環次覺無象䪨晨興趣行装秋色滿離席悲風苦送聲短晷頻移刻蘭舟薄暮發去去轉遐僻極目望官所沉沉煙靄積清有濯纓水白有潄齒石悠然水石間官情􅂓自適朝焉游其南暮焉戯其北王環有南北社彼微山中鳥亦􅀅識公德公無賦帰去田園付人􅃥荅毛唐卿虞卿借昌􅀺集予少不知學古難學古直􅁒學到韓柰何韓實不易學怛覺昼夜心力殚茫然故歩亦巳失有􅁼夀陵學邯鄲雖然予心未肯巳尚􅁒勉強求其端跬歩不休效駑馬千里未至空長嘆羡君兄弟俱早慧家學豈止傳柔温聖經賢傳飫巳乆百家諸子皆蠧殘學文要須學韓子此外衆説徒曼曼韓子皇皇慕仁義力排佛老囬狂瀾三百年来道益貴太山北斗世仰觀我生于今望之逺時時開卷相欣懽豈惟廬陵惜舊本我亦惜此秪自㸔子今􅁒假敢􅒛願子寳之同琅玕辛亥九日侍家君同孫子淵子昭子尚登髙于家之東山時菊花未開坐客皆以為恨至十月望獨歩東籬下見前日青枝巳爛熳矣東坡云凉天佳月即中秋菊花開日乃重陽不以日月断也於是命酒肴呼隣里飲於叢畔云前日重陽日與客同登翫有酒無菊花把盃一長歎良辰苦易失十月今又半緬焉想前逰獨到東籬畔鮮鮮霜中菊滿地金錢粲我思東坡言隣里乃相喚斬新作重九不以日月断人生貴適意世俗豈能絆遇酒郡􅂬樂取醉期爛熳羲和馭白日疾􅇵走丸弹百年能幾何不飲乃痴漢次韻季仲黙見􅀉予少擇交㳺有友四五子仲黙姿不凢好學喜􅀚史􅀉我新詩章我驚欲掩耳昔日心未降而今巳􅑙矣我义事章句滋味一盃水平生况多愚於巳不自揣林間等蝉噪井底作蛙視今焉見君詩吾誠二蟲比豈敢妬且􅀬低頭拜不止思􅁒和其音兀㘴􅂺忘起沉吟竟不成徒覺倦两髀徒今焚筆硯不復坐書几題湖邉莊十里青山䕃碧湖湖邉風物畫难如夕陽茅舎客沽酒明月小橋人釣魚舊卜草莊臨水竹来尋野叟問耕鋤他年待掛衣冠後乗興扁舟取次居湖邉懷劉謙仲湖山如畫水如籃杖􅋰湖邉酒半酣徃事蕭條誰共􅀃舊㳺零落我何堪炎凉世態從他変生死交情秪自諳詩客有䰟招不得秋風依舊滿江南􅀉孫永之名􅀛年沂州人詠歌沂水舞雩風氣壓當時冠與童人似賈生年更少家傳孫綽賦􅀹工􅀌羆傲兀深叢􅂻一鶚軒昻衆鳥中早取功名􅀉衣缽古来相種出山東􅀉毛虞卿名公弼後改名宏字叔度登乙丑第文㑹今年喜重尋葭姿玉質又同林弟兄並秀如君少朋友相知獨我深一别幾勞終夜夢相逢更話百年心長卿賦有凌雲志􅁍􅀏區區蚓竅吟虞卿工賦嘗􅀏予作詩而不事㪯業次䪨虞卿送别喜君直諒更多聞共惜光隂寸與分螢照夜窓􅂊煖席蝉吟秋􅀣又離群尊前忍􅃪陽関曲江上愁㸔日暮雲别後誰䏻尉牢落錦囊長􅅁故人文次䪨劉方叔見􅀉名鎮登戊辰科交情貴乆豈須頻我輩􅀹冝率且真子政有孫誠益友長卿何代乏詩人論文􅀄喜逢知已言志深期共致身箕斗相望正南北頴川何夕聚荀陳􅀉方叔故人一别路漫漫又覺春生到水村魚躍雁飛空注目栁開梅落自消䰟唱酬應有詩千首談􅀏長懷酒一尊正是剛腸九囬䖏子規聲断月黄昏潘岐哥鶴溪先生聚徒于樂清之鹿巖既乆因家焉辛􅆗秋得子名之曰岐哥次􅀊孟春書来語曰吾家岐哥以某年月日生盍以詩贈之某不敢辭先生名翼字雄飛君不見鳯之雛􅂹之子潘家岐哥無乃是鶴溪仙子降英灵雁蕩名山鍾秀羙顔色純明白玉璞精神皎㓗秋江水胷中之氣已吞牛開眼睛光如虎視此児竒絶非常児小子􅀚人盖多矣寕非漢代偷桃朔别是唐家謫仙李愚知先生百不􅁨但患此児名盛耳先生才髙爵未綰頼渠力振家聲起鹿嵓他日築髙門車馬煌煌塞閭里贈余取新小邑那䏻敵大􅀖與君角力固非雙氣驕欲縱偏師􅀾􅀔屈翻求北面降深懼操戈重入室自慚閣筆乆臨窓定知􅁓價從今貴余子詩名滿蜃江次韻昝監務早梅群芳避路放梅開犇走逰人滿砌苔半􅀣溪邉衝雪破一枝頭上􅅁春囬月移瘦影供吟興凮薦幽香襲酒盃剛􅀍西湖都道尽至今詩客句难裁􅀉賈一蓈無柰窮冬易感傷况添離别􅂇凄凉五更月殘頻成夣十里青山㡬㫁腸短棹未乗晨雪去尺書􅂓遣暮鴻将少年勉力親燈火要使家聲継洛陽孫子尚過明慶以詩見招未及往次韵剡溪未起子猷尋空對溪山恨滿􅁭􅀌雁逺来天杳杳故人相望雪深深思君一日成三􅀊􅀉我行書直萬金惆悵今宵一尊酒邀明月伴􅀌斟送子尚如浙西嗟我窮居海之角人物素殊鄒魯俗年雖及冠無交㳺􅀌陋寡聞獨學閉門不出長太息思得其人共磨琢孫子徃從西北来頭角軒軒真一鶚飄飄逸氣凌雲霄凛凛髙談吐鋒鍔文辭翰墨两竒絶世上群児徒碌碌我昔風期一相遇欣然握手論心腹衡茅三度枉車軒書劒連年共燈燭論交自喜得房杜言志端能效來郝長篇短䪨迭賡唱明月清凮共斟酌囊無一錢身不􅁨食止一簞貧自樂有友如君復何憾百不為多一巳足今焉捨我􅀅何之遂使江郷復蕭索南國􅀄寒旅鴈来呉江已冷丹楓落惜君不尽與君别兀坐無言情更􅁖干戈未息行路難胡馬今猶飲河洛京國有家歸未得錢塘此去仍棲託㑹須徒歩謁天子慨然一􅄍胷中畧請纓縳虜壮志士庻使平時語無怍相􅀅煖律破寒梅驛筒逺􅀉無辭數懷子尚滿眼干戈行路難故人千里駐征鞍幾劳終日馳魂夢安得乗風挿羽翰水北山南春􅄫􅄫天涯海角路漫漫欲慿人􅀉新消息手把梅枝仔細看樂清僧寮有過容錢之翰題二絶有傷時之嘆因次其䪨終日傷心淚濺花干戈滿眼恨無涯衣冠南渡如東晉安得車書混一家功名誰復漢嫖姚壮士逢時豈惮劳半夜飛来㸔宝劒此身端許擲鴻毛讀親征詔書二首甲寅季冬讀親征詔書哀痛切骨畎畆愛君情至於此食禄者義當何如匈中展轉不能自巳故作二詩逆虜何時正典刑乆聞諸将擁彊兵中原未雪十年恥聖主自劳千里征楚國群臣誰慟􅂘杜陵野客自吞聲君恩壓頂丘山重命擲鴻未是輕諸􅀅年来巳極荣囬㸔煙閣欠功名八年猶未平淮甸一戰那能復帝京畎畒忠臣自􅁨囯閭閻小子妄談兵慿誰决天河水一洗乾坤萬里清次䪨題曺大夫懷忠閣小閣誰懷畎畆情遥瞻天日眼増明平生􅁨國丹心在一飯思君血淚横豊市功臣真有種并汾壮士素蜚聲區區問舎求田者應􅀍元龍一􅀏䡖聞韓師世忠退保丹陽逺近􅁨惧州縣議結郷兵以備不虞閭巷少年貫弓走馬􅀂有得色感而有作逆虜縦横未剪齊王師退保浙江西羽書日報猶未息戎捷逺来何太稽千里􅀾新􅀑哭滿天隂雨夜烏啼臂弓腰箭誰家子竟日鳴鞭躍馬蹄和劉方叔溪上一絶杖屦徘􅆦駐碧溪遥㸔飛瀑下崔嵬乗槎􅁒訪吹簫客煙草茫茫没舊䑓和方和見贈二絶相對清談味有餘始知勝讀十年書塵􅁭不用頻揮麈自有清風為掃除一舎蕭然學有餘窓間遮眼盡文書巳􅀅事業盟燈火萬事何煩酒破除得陳商霖書山舘無人慰索居喜君交契有終􅀄舟扁方起雪溪興尺素又􅀓魚腹書炊􅁰定尋前日約題詩寕怨故人踈好来相共親燈火可惜青春度莫虚昔與南浦劉謙仲大梁孫子尚游自劉死横陽孫亦有浙西之役交舊零落為之慨然感而有作劉翁泯泯已新􅄦孫子飄飄猶旅人詩酒舊游誰在眼江山囬首自傷神招魂擬同横陽道有夢長飛霅水濵死者不生生者别死生離别两沾巾次韻李刑曹病起書懷中原囬首尚塵飛書劒南來早識機方事髙眠學安石却愁多病似王徽腸枯謾有書千卷腰瘦難勝帶十圍志士未逢聊􅈛耳古人何用泣牛衣又用前韻文園病思亂如飛禪榻逍遥謾息機漸喜珠􅁝封薬褁未容鶴髪上簮徽酒能伐性聊須止碁恐劳神未敢圍惟有詩懐禁不得任他憔瘦不勝衣送曹大夫赴行任􅀁西北連年殺氣髙群盗横行如蝟毛㢘頗李牧不丗出吾皇側席心焦劳汾陽自古多壮士曹侯意氣千人豪年今四十猶偃蹇拊髀長歎淹龍韜慨然揮抉謁行在報國已淬􅆎間刀登壇拜􅀅預􅃌日看君㪯手清風濤梅溪先生文集卷第一附録有宋龍圖閣學士王公墓誌銘公諱十朋字􅀛齡姓王氏温州樂清人曽祖信祖格父輔父以公貴贈左朝散郎母萬氏贈碩人其先自錢塘徙至朝散公始業儒有聲公少頴悟强記覧爲文頃刻数千言事親盡孝其居鄉進止取予必以義後學師尊之既入太學多士皆推敬焉太上皇帝躬􅄃􅁠綱更新政事紹興二十七年䇿進士于廷詔對䇿中有指陳時事鯁亮切直者並寘上列無失忠讜無尚謟䛕稱朕􅂑士之意既而考官以公􅀁對進上臨定其文以爲經學淹通議論純正可苐一及唱名則公也士論翕然稱㥦詔益嚴銷金鋪翠之禁且以交趾􅀁貢翠羽焚於通衢實自公發之授左承事郎僉書建康軍莭度判官聴公事又詔王某係朕親擢第一人欲試以民事尚待逺􅊴可特添差紹興府僉判秩满除秘書省校書郎尋兼建王府小學教授時北虜且畔盟朝廷疑之猶未敢誦言為備公因轉對力陳其不可無備者且曰禦戎之䇿莫急扵用人用人之要莫先於人望今若内若外士夫軍民咸謂有天資忠義才兼文武可為􅀅相者有長於用兵士卒樂為用可為大帥者􅂉寘散地􅂉守逺郡願陛下起而用之可以作士氣􅆍敵謀又言三衙管軍􅂉乆而不代兵柄在手利􅁠財路又皆入其門且其官至三公樞宻􅀁以莭制諸􅀅者乃班其下倒置如此其䏻莭制之乎併諸軍承受皇城邏卒之敝其他指陳率人􅀁難言者三衙之􅀅有言也人皆危之而上特開納焉既而罷諸軍承邏卒亦加職更定樞宻與管軍班次管軍亦引去邉備益嚴舊人相継復用自昔人臣論一事􅂉章十数上􅂉合衆力爭不䏻囬公以一言窹意而事皆次第罷行於是天下仰上之聦明大度虗懐􅀙諌非徒􅄖容之而巳然大臣有不樂者公亦数求去除著作佐郎罷其兼職公以求去得遷力辭不許乆之除大宗正丞仍待次尋得請主管台州崇道􅀚今上即位除知嚴州未赴間召對公奏言太上皇帝非耄􅂄勌勤之時而以天下授之陛下其賢於尭舜逺矣陛下􅀁以仰副太上付托者當何如舜重華恊于帝然八元八凱尭未及舉而舜舉之四㐫堯未及去而舜去之今社稷之大安危生民之大休戚人材之大進退朝􅋝之大刑賞其􅀁當行者冝若舜之􅀁以恊于堯而行之以彰太上知子之明以盡陛下継述之道又言今和戎與戰守之議未决臣謂􅂉􅀾􅂉守當相時進退而和决不可議也又言右相虗位天下拭目􅀚陛下此舉必諸大夫􅀦人皆曰賢然後用之可也不可非其人以失天下望除司封員外郎兼􅀦史院編􅁱官又兼崇政殿􅀃書除􅀦子司業諸生固巳迎服矣而公扵學校事其細微曲折皆參前知􅀁舉措無不當人心者㑹詔百官言事公上䟽以爲百官進退者大臣之職論思獻納者侍􅀙之職正朝廷紀綱者䑓諌之職今居其位者徃徃不舉其職冝有以董正之雖然此特人臣之職也而人主有大職事曰任賢曰納諌曰賞罰其言反覆詳盡切扵時務上覧而嘉之即召公與工部侍郎張闡對便殿􅀙容論天下事甚衆請退復留者再賜坐賜酒又賜御書􅂭興元年四月除起居舎人改兼侍講公與左史同奏史職􅆸壊者其一曰起居注録本進呈非古欲叨進其二曰雖侍立而在殿東南隅未甞聞天下徳音如二府自有時政記其餘臣僚登對欲許令史官侍立其三曰後殿侍立而前殿則否扵義無㩀欲前殿侍立其四曰直前奏事欲不必預牒閤門及候班次皆􅀙之越月除侍御史公素以剛毅正直稱天下至是人皆曰真御史矣公益自任以當世之重大抵以定􅀦論正人心為本而去其害治者不屑屑於細故也江淮都督府出師進􅂑􅀫州虜悉衆来爭我師退守淮都督張公浚上表自刻公奏曰臣自捴角在草􅈋間聞醜虜􅅍華痛心疾首義不戴天臣素不識張浚聞其天姿忠義誓不與賊俱生實敬慕之頃以舘職輪對首言虜情不測乞用浚䓁既而虜果入㓂太上皇帝親遣浚浚知建康府陛下即位因以江淮都督之任委之天下皆以為當臣去冬􅀍召至􅊴前浚進對皆以為恢復大計仰賛聖㫁又乞陛下勿貳以濟大業浚遣二􅀅􅂑靈壁虹縣􅀫州降三大􅀅一月三捷議者皆服陛下任浚為難及王師不利横議蠭起臣甞奏陛下用兵為祖宗靈􅆍而舉為二百年境土而舉為中原弔民伐罪而舉與古帝王好大喜功開邉生事不同投機而進知難而退益當内􅁱政事俟時而動陛下剛明果㫁規模固已素定然異論紛紛不肯置浚今浚既待罪臣其可尚居凨憲之職欲望正臣妄言之罪特加􅇡殛詔以公􅁠吏部侍郎辭不拜乃以集英殿修撰知饒州乾道元年七月移知􅇪州尋除敷文閣待制三年七月移知湖州未㡬得請提舉江州太平興􅀦宫才数月起知泉州進直學士又移知台州公以病力辭且乞致仕乃復提舉太平興􅀦宫七年三月除大子􅉟事詔旨敦􅃐公力疾造朝上特御選徳殿而公足弱不䏻趍詔給扶减拜且賜坐又詔􅁠免朝參又遣使以告及金帯就賜公三上章乞􅆀仕乃詔以龍圖閣學士致仕命下而公薨矣實七月丙子也享年六十上聞嗟悼賻䘏有加令兩淅路轉運司給塟事公積階至左朝奉郎封樂清縣開􅀦男至是贈左散大夫遺戒䘮事毋得用佛老教諸􅀌行之以十有二月丙午塟公于縣之左原白巖碩人賈氏有賢行先公二年卒至是合祔焉男三人聞詩聞禮皆太學生孟丙蚤卒公兩遇郊祀㤙皆奏其弟故二子皆未仕女二人長嫁進士錢萬全次許嫁賈梓孫男女四人公立朝議論岀䖏大莭既如此矣􅀄公以文學先天下人謂其於吏未必數数然也而自為郡佐遇事不苟民有訟乆不决多走諸司乞諉公雖文書填委公一一繙閱不以付吏審核情偽參用經律􅀁與奪人皆厭伏其治郡既以㢘㓗公正率其下間有為不善者則反復告戒誠意䔍至人亦有恥故未甞按吏為文勸導百姓以遷善逺罪之意有争訟則暁以義理多退聴者故鞭朴罕用事至立断其甚不得已乃推鞠亦不淹繋故獄屡空未甞遣官吏至縣而人素信伏事亦舉利有可以予民者予之輸租使自操概而用度有莭財亦足月率兩詣學宫延見諸生􅀙容誨誘且以詢郡政饒乆旱公下車即雨湖乆雨傷稼公八境即霽每罷郡士民涕泣遮擁不容去􅂉借留於部使者既不得則奔走道路􅂉越境不忍别者衆人聞公喪㑹􅂘于􅄏元僧舍又立祠堂以事之近世為政得人心未有如公比者公有梅溪前後集五十卷尚書春秋論語孟子講議皆指授學者未成書也公於文尃尚理致不為浮虚靡麗之詞其論事章䟽意之􅀁至展發傾盡無􅀁囬隠尤條鬯明白盖自漢氏尊用儒術而士􅂉餙詐􅂉阿䛕􅂑容至於守莭死義䏻為􅀦重則未必以儒名者世遂以儒相鄞若公之學問粹然一出於正謹守而力行之義之􅀁在疾趍徑前未甞以利害豪髮顧避更閱夷險特立不囬施於政事左右具冝信乎其有本如是也嗚呼此真􅀁謂儒者耶銘曰漢廷用儒黯獨戅樸淮南憚之謀不敢作謂公孫輩發發振落儒豈不用其效奚若孰知其故䑕腊非璞公之莭義視黯無怍屹然立朝作丗郛郭正色凛凛危言諤諤招之不前麾之不郤猛虎在山衛及藜藿出守四郡治行皆卓問胡爲然非智之鑿聖有謨訓守約施愽惟其躬行粹羙無駁道固如是不由外鑠於彼汲直如玉而􅅣我為銘詩以表儒學人雖云亡尚有榘彠端明殿學士左朝議大夫提舉江州太平興􅀦宫匕饒郡開􅀦侯汪應辰撰承事郎直寳文閣􅁠發遣静江軍府廣南西路兵馬都鈴轄兼主管本路經畧安撫司公事賜􅂵金魚袋張栻書宣教郎新􅁠發遣南康軍事朱熹題盖右先君文集合前後并奏議五十四􅃃紹熈􅩐子聞禮鋟木江􅁜㱕蔵于家痛念先君即丗二十有一年矣不肖􅀌家貧力弱日夜􅈽遺書以泣一旦懼溘先朝露無以贖不孝罪㑹兄聞詩假守浮光以俸餘命聞禮董其役始事于莫春訖工于中秋先君正大之學忠憤之氣愛君憂􅀦之誠仁民愛物之念庻㡬一展􅃃而盡見之職校正迪功郎謝汝􅀎鄊貢進士任炎其間􅊴亡者異時為别集云男宣教郎充荆湖北路營田使司幹辦公事賜緋魚袋聞禮謹書
