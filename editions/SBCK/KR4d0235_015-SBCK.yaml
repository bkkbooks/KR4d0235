body:
  text: 詩七月十七日離䕫州是夜宿瞿唐􅀖人送别亦傷情楊柳隂中涕泣聲我亦憐夔不忍去一宵􅇔宿舊江城至東屯謁少陵祠宦㳺䕫子両經年未到東屯意慊然端為先生舊吟䖏不應容易上詩篇忠不忘君句有神當時無地可容身草堂遺像英靈在又見匙翻雪稲新東屯溪山之勝似吾家左原東屯别是一山川水秀山青似左原我待還家築茅屋作詩招取少陵䰟登古峯嶺望夔州巍登古峯嶺回首望䕫州􅀮約瞻卧龍㣲茫見江流明朝望眼遮江山見無由翻令還鄊夣飛過白鹽頭不知此􅀖人亦念使君不使君無可念空有詩篇􅇔右峯驛小飲老去最惜别同僚情更鍾三杯古峯驛􅄈我别情濃燕子坡燕子㱕期近吾今亦得㱕烏栖一枝穏何必更髙飛坡南隔江有烏飛岩悼巫山趙宰使者追求急君方歸意濃讒言端可畏􅀑物不相容浮世誰無死良醫未易逢我来􅀴舊舘㳅涕覺無􅀙巫峡三峡江流七月平全家東下葉舟􅁿陽臺得得收雲雨放尽峯峦照眼明峡中七月行舟断我丈孤忠盡室行􅀉語後人宜自戒莫因幸免遂輕生正是瞿唐莫下時􅁍􅀅行止問舟師老夫也是歸心急不記前吟灔澦詩神女廟功開神禹言何妄夣惱㐮王事亦非峯下祠荒少人到峡中舟過有烏飛毎舟過有烏自峯飛下舟人擲餅餌與之銜去復来昭君村十二巫峯下明妃生䖏村至今麄醜女灼面亦成痕按啚􅀴昭君村在帰州興山縣而巫山亦有之在十二峯之南神女廟下未知孰是杜少陵詩云若道巫山女麄醜安得此有昭君村劉夣得竹枝詞云昭君村中多女伴永安宫外􅂿青回則在巫山者是過大拽大拽今重過江山記我無雲開列嶂秀石峙一峯孤吏卒送迎異舟車来徃殊徃歳遵陸今以舟行鴻􅇔泥上迹飛去到江湖石門先主為陸遜所敗白此門而脫兵忿雖云敗君臣義有餘石門能脫􅇥風義亦堪書謁清烈廟登獨醒亭我醉亦如衆亭慙登獨醒惟知慕清節首為繪儀形夔府十賢堂以清烈為首黄牛峡白狗黄牛竹節灘竒竒怪怪幾峯峦山川好䖏造化惜不許人間平地㸔黄牛廟我􅀙白帝城舟次黄牛峡黄牛遺廟存石馬􅃗耳缺宛如歐公夣地靈亦竒絶固宜鎮大川千載食常血何人讃巨力曽不紀功烈神乎豈求食挽石駭舟楫事見張天覺賛或云土勝水兹亦强牽合事見廟記白帝􅀅何云吾為究其說神禹昔治水䟽鑿九州别百神各放職僚佐力俱竭功成禹化熊塗山亦為石譬如穆南征化者想非一有化為牛者断崖留遺跡豈亦黄帝餘與牛同一色至今名此峡援溺有隂力􅁋祠自其俗神手本正直爵以保安侯足以章神徳紹興間封保安侯蝦䗫碚水亦日蝦䗫背蝦䗫好居水背水以自濡不知背上味乃與衆水殊品第髙水經煎茶必来須争汲以致逺不憚險且迃我亦走瓶罌一甌㵸雲􅃾所恨太遐僻親朋莫䏻呼巨蛙如有靈􅂚不上天衢以水為雨露助天澤寰區坎視峡中小􅀏渠子陽愚石漁翁釣利釣名者紛紛三峡中何人化爲石又作釣魚翁至喜亭前年泊舟至喜亭舎舟觸霧登山行身到猿啼虎嘨䖏至今䰟夣中宵驚兩年寒暑山裏瘴癘侵凌身不死七月歸舟浮漲江重見兹亭實堪喜世間􅁨喜無定形此喜本􅀙憂得名湏知既濟有未濟勿謂江流今已平又一絶歸客来登至喜亭喜帰兼喜峡江平當時作記文章伯不止文章得羙名郭道山學道無成藝有成青山猶以道為名匆匆不及登山㸔歸看家山白鹿城永嘉城号白鹿有郭公山亦以景純得名宿灌口拂曉出楚塞中流望荆門江随銅柱轉舟遇􅍑牙奔鳥度天闊魚翻秋水渾冝都轉盻過夜宿舊江村南崔乃松滋縣江陵舟中作夢裏身曽到永安孤城絶塞俯驚湍東歸􅀄喜楚天濶西望堪嗟蜀道難艶澦堆􅁁巳陳迹水晶宫裏又麄官帝鄉咫尺家鄉近臣子憂心亦小心查元章自成都走書至江陵并貺蜀牋附子芝蘭道山舊邂逅䕫江邉㑹合止半載别離又經年君猶滯使軺我忽移霅川東歸不及見西望心悠然尺書走徤卒追上江􅁜舡慇懃贈逺意藥百􅁓以千我老苦多病得藥年可延靜思苦口味奚止沉痾痊但非造樓手誤辱文房牋待􅀅君詩文傳寫千萬篇書言作二記付與夔人鐫捍波記修壘濟渇記義泉􅀷慙郡政謬濫託雄文傳君才髙軰流君譽藹民編雅志在活人何心肯㳅錢當宁正念賈諸公咸薦賢定歸玉筍班慷慨旒扆前􅀁陳必尭舜那肯談武宣早趣舎人装行著祖生鞭我冠儻未掛苕溪遲言旋離沙市天色変舟人惧風作少憇公安而行黙禱有應觧任古䕫囯移官白蘋洲三峡雖幸免大江尚堪憂黎明霧四塞篙師請停舟爾禱於公安公安有二聖寺舟人過必禱之吾禱學孔丘愷悌以為治潔㢘以自修神乎苟聴之庶不為神羞湏􅁷日光漏江净烟靄􅀵􅂅如吾祖言千里俱安㳅望石首山江山遥望疑若無隠隠漸露山規摹化工作山首安石不著草木為肌膚吾鄉石首黄金色五年不見􅀷思憶山頭有石名偶同長鋏空弹不堪食巴䕫之山厭太多荆江其柰無山何舟中遥遥望石首一􅀧亦足供吟哦艤舟亦向劉郎洑應是劉􅀰招我宿劉郎如問舊江山永安宫草年年緑是夜宿劉􅀰洑地以劉元徳得名過三沱舟􅀙三峡過三沱柳岸人家轉盻過莫惜慇懃問舟子江􅁁好䖏亦無多塔子山巳過魯家洑猶瞻石首山水随江繚繞山逐岸回環雨泊蘆洲畔舟行晚照間貪看洞庭好不作沌中還魯家洑江頭烟􅀣色如故記得向来舟出時更讀西行舊詩集集中多是沌中詩宿人老湾衮衮長江水悠悠歸去舡片雲南岸雨明月别州天犬為客驚盗蚊令人廢眠江湾號人老驚我鬂皤然是夕大吠疑有盗舟人驚起終夕不􅄰烏沙鎮避風風避烏沙鎮心懐白帝城峡中險巳過江上浪宜平維舟岳陽之西岸徐師􅆜風作不敢行再留一宿用韓昌黎洞庭阻風韻示同行朱仲文張子是月行南箕口簸􅀭不肯休我至洞庭側狂瀾阻行舟東望岳陽城一葦宿可􅄬吾􅁒破巨浪試呼舟子謀舟子􅀏謂我官豈乗浮丘同行一二官好勇豈仲由君子不行險少遲勿煩啾明朝風自定鼓枻無憂愁汗顔答舟子汝語非謬悠書以示同欲速不可求望洞庭端居灔澦両經年不戒瞿唐七月舡得得遥􅀙洞庭過要看湖漲水中天賈岳州以予阻風致酒肉之贈軒皇張樂洞庭旁掀舞魚龍撼岳陽巵酒豚肩使君意知予􅁏味䏻忘魚鰕買得巴陵金鲫魚又逢公子奮長湏夜来江山秋風起報道吴児已鱠鱸􅀄欲維舟岳陽樓下適風作遂泊南津岳陽樓下風波􅁖過客舟行不容泊遥􅀙湖口入南津看尽湖山與城郭楼閣峥嵘照眼明君山當面如蓬瀛雄文誰継范文正妙曲亦無滕子京岳陽樓後樂先憂記飽􅀚兹楼今始得慿欄吐吞五水波濤濶出納三光境界寛黄帝樂聲喧廣宙湘君山影侵晴瀾冮山何獨助張說􅀵拾清上筆端洞庭湖江山好䖏未經眼人道岳陽天下無入筆波瀾自今闊匈中巳有洞庭湖維舟便上岳陽樓風定波瀾萬頃秋聞說洞庭通震澤水應先我到蘋洲讀岳陽樓記先憂後樂范文正此志此言髙孟軻睱日登臨固宜樂其如天下有憂何君山恃險三苗此為國不知諸夏有華勲两階干羽七旬後􅀙此湖山方有君祖龍遷怒色曽頳帝子有􅂕山更青湖水如天冬亦涸此君榮落一般形南津淑濟廟越囯曹娥孝可書惜無同氣與之俱武陵今有賢児女弟似靈均娣女須過仙亭此䖏神仙幾度經老松枯朽穉松青如今想作天仙去不復飛吟過洞庭觧舟遇風暫泊岳陽城下正對君山入湖􅀄訝君山逺無翼可随鷗鷺群繋䌫中流忽相對江湖心亦不忘君岳陽城下岸赤色亦呼赤壁岳陽樓下有赤壁照耀洞庭烟水東鄂渚巴􅁜土多赭周郎何䖏破曹公君山形如龍南有一小山如􅀛洞庭湖山山絶竒大山如龍小如亀弄珠曳尾自㳺戯不肯吹浪如蛟螭岳陽樓前鐡為械古人欲断蛟螭害蛟螭為害甚巴蛇遺冡猶存足為戒七百里湖􅆂太虚春夏漲溢秋冬枯惟有亀龍長自在不知幾見桑田改燕公樓燕公郡事睱詩興滿滄波粉餙開元治江山為􅂇多道人磯江中雙石如弟兄呼得道人為友生秋夜扁舟泊磯下洞庭湖近月華明道人身名兩俱槁道其所道非吾道横江兩石作釣磯不似嚴􅁜䑓上好泊潜江甲属玉沙縣潜江甲口楚天涯芦荻舟中一兩家呼酒敕厨无一味天鵞乱眼似楊花舟遇􅊇風破浪賦詩風撼楚江水雲横鄂渚天支頥看山色破浪出詩篇門掩瀕江舎㠶揚上水舡江神不借便帰㒷自飄然舟中覧鏡来往成何事霜毛滿鬂多洋洋大江水東去欲如何過嘉魚縣有山名鱼嶽舟過嘉魚縣買魚人道無青山不堪煑弹鋏看銅符􅀫通濟口沌水􅀙兹入中蔵寂寞鄊相逢如故旧爲我済帰航百人磯帰􅀙三峽水重見百人磯山色只如旧挽舟人已非南浦江淹送客傷心処万里人􅀙蜀道来栁已三畨見秋色䔥蕭双鬂􅀂何哉南樓江漢西来於此會朝宗東去不湏分銀濤遥帶岷峨雪烟渚高連巫峡雲鸚鵡洲悲狂処士蛟龍池化故将軍登臨長􅂅如今日塵静元規楚不氛觧舟凬猶未息暫止江口狂飊未息浪峥嵘江口停舟不敢行自是吾儕畏行險前頭波浪有舟横泊舟漢口稍稍風波定悠悠舟楫移身雖到漢口家尚在天涯大别思大禹古峯懐古䕫前月是日离䕫州山城有廖廓帰􅀃是吾児聞詩聞礼同朱仲文張子是諸公逰漢陽郡圃言有廖廓䑓東望鄂渚山川城郭尽在目中黄鶴樓雲鎻吕公洞月明黄鶴樓抱関非故卒誰見羽衣㳺七磯江上風波􅁖江中洲渚多回頭三峡逺轉盻七磯過黄州弭棹大江濱江山入眼新地疑真赤壁州是古黄人水隔三分囯武昌在南岸吴故都也風遺兩逐臣王元之蘇東坡雪堂欣覿靣詩思定䏻神㳺東坡十一絶道大才髙丗不容堪嗟尺水困神龍空㳺赤壁英姿發郤向小橋詩思濃出䖏平生慕樂天東坡名自樂天傳文章均得江山助但斍前賢畏後賢忠州東坡以楽天得名少年下筆已如神文到黄州更絶塵我宋人才盛元祐玉堂人是雪堂人丗重元之重竹樓雪堂名更重黄州西山草木􅀹光彩一一曽􅀴杖􅋰㳺江遶山城栁暗村五年詩乱謫仙魂欲尋遺老問前事楚語児童今不存再閏黄州正坐詩詩因迁謫更瑰竒讀公赤壁詞并賦如見周郎破賊時供成詩案脫纍囚天遣公来此地㳺自有胷中雲夢澤更居雲夢澤南州三等䇿成名烜赫萬言書就迹危疑易書論語忘憂患天下三􅀴字􅀃時口誦淵明帰去詞岷峨帰去竟無欺髙安難弟来相訪細􅀃對床風雨時批風抹月五􅀴年唫盡淮南尽䖏天獨與元之韓魏囯神交千古作三賢向来茅屋僅容身今日祠堂髙更新費尽丹青傳不得灵㙜一􅀧與精神至九江陪林守黄中登􅁃樓出示舊詩萬里相望牛馬風兹樓邂逅一尊同􅃄生燕􅆍香炉上黿在賓筵食指中楼之北岸有黿壳州舟入滄波詠蘋白飲陪文字勝裙紅飛黄騰􅂿日􅁁去回首群驚冀北空黄中赴召喻叔竒自番陽来以詩見贈次韻以酬家居雁宕芙蓉側身自瞿塘灔澦回覧尽江山帰路逺舞翻烏鵲故人来舟至富川烏鵲滿樯次日九江与叔竒遇詩吟夔子相思句酒飲番昜未尽盃種斈績文冝舘閣二松那復乆淹􅆦琵琶亭繫舟琵琶秋水深夜静不聞琵琶音往来多少啇婦怨丗無司馬誰沾巾過彭澤萬里帰舟巨浪間只􅀅青眼對青山青山好䖏惟彭澤出岫雲帰倦鳥还馬當山此地水如峡有山名馬當猶疑是灔澦更合戒舟航那刹石一曰那查七月下三巴孤舟近九華魂猶驚灔澦石更見那查池之清溪如杭之西湖某帰自三峡維舟㺯水亭南望齊山翠㣲在眼登譙楼望九華見一峯竒甚呈提㪯李子長知郡趙富文城南風物似西湖萬里帰舟入􅀞圖光㓗貯懐便㺯水翠㣲照眼称提壷浦無時節秋􅀹好池有精神貴可呼最是九華知客意􅀝天遥露一峯孤子長和詩復酬二首往􅀊遥􅀙彭蠡湖常山地閱武侯啚忽乘雪裏子猷棹欣對花間太白壷雁宕􅀉書知有便天台采薬定相呼兩翁異日為鄰舍咲􅀃江山大小􅀌君往東湖我左湖田園帰去亦良圖縦如傅􅀃妙調鼎終羡淵明髙引壷清峭㙜中各陳迹翠㣲亭上偶􅂬呼江東浙右􅀙今後永夜月同千里􅀌冨文和詩復用前韻四上祠章郡得湖真同起廢躄浮圖路􅀴秋浦人如玉洞入齊山天在壷人物宜居囯士選吏民􅂓作使君呼还鄊􅀃與賈君子官比廣昌風更􅀌賈君元範永嘉賢者与冨文同官廣昌毎􅁛其為人子長招逰齊山路􅀴秋浦上崔嵬不負􅀌舟萬里回峯比九華㣲具體山中有石洞疑三竺逺飛来勝窮岩石冷瓏地秀吸江湖浩渺盃先却􅂵㣲期一月菊花未放桂花開富文贈桂花夔有百花無此香䕫州無桂花兩年官舍􅀒秋光使君元是蟾宫客贈我數枝金粟黄泛清溪淸者未必貴貴者或不清胡為貴池内􅁍有清溪名清貴兩俱足造物如有情溪有夷屈風池非趙孟榮三秋冷浸月十里光􅆂城真可㺯茲水更堪濯吾纓天亦知我意故令居水精水精豈吾居龍湫老餘生滿壁昼清溪坐斍名利􅁿子長見示汪樞宻㳺齊山詩因次其韻莫莫休休秪欲閑貴池誤照野人顔好詩如見元樞靣佳境仍逢相囯山山因齊映得名談笑􅀙容禅榻畔翠㣲髣髴夢魂間吾儕相勉崇名節峴首風流庶可攀李塩題䟦用羊祜事富文送鹿肉太尉前軍得活鹿全用来簡七字使君慇懃分我肉定知應是秦失餘苗裔仍為丗人逐使君好客今平原秋浦楼頭羅水陸青州􅀙事嘉屢拜白鹿山人賜新沐社風留客去未得清溪山頭兩􅀴宿頻􅀅口腹溷使君大嚼戯吟詩一幅朱仲文和詩用齊山韻以酬蜀山同我上崔嵬峡水相随共載回秋月迎人霅川去義風吹客浙江来山㳺未尽無窮力酒㒷應嫌有限盃准擬吴中作重九菊花休道不湏開子長和詩并餽飲食再用泛清溪韻秋浦天作秋清溪風更清三宿不忍去山以齊爲名天台李御史傾盖即鍾情憐我峡中帰􅀏談洗枯荣携壷上翠微㪯首望赤城相期老岩壑便欲遺簮纓贈我十首詩字字工且精􅀙今似杜老對酒懐李生何當細論文萬戸侯可􅁿溪口阻風􅀉子長冨文風知主人意吹浪留客舟客子念行役形留心不留囬望月峡月夔州有月峽月坐悲秋浦秋從今懐人夢飛遶清溪楼子長和汪樞齊山詩復用前韻腐儒無用分􅄬閑吴蜀分符秪強顔去訪少踜三峡水来尋太白九華山小舟載酒清溪口徤卒傳詩白浪間風伯相留作吟社􅂅低筆力許追攀池陽阻風留十日舟楫何濡滯秋深風未西五旬從白帝十日尚清溪匈次澤吞楚眼中山見齊主人殊未厭壷榼屢提携子長携具至溪口復用前韻有客双蓬鬂帰從灔澦西符分三竹使地見兩梅溪舟行梅溪予家亦有梅溪舟遇先逢李盃行酒到齊他年石橋路帰去手應携􅀉林黄中時黄中泊舟貴池口予泊清溪口東西相去十里郎星夜照貴池口漸見祥光燭斗牛甘棠遺愛留潯陽尽道前無此太守我亦弭楫清溪灘秋風吹浪髙扵山與君相去􅅻咫尺形影隔絶􅃄波間晨起􅀭帆欲東去風伯江神兩俱怒吾㑪行止端由天天氣未佳􅂓且住望舒山舟阻清溪十日風旅懐秋思渺無窮開編細讀舒王句一􅀧舒山在眼中留復州贈舒王絶句一集舟中􅀚之出清溪帰舟十日阻池陽風伯相留意亦良長喙叅軍􅀄薦熟無腸公子正輸芒齊山􅁍向江南好秋浦􅀹扵社後凉明日觧維苕霅去夢魂猶在水雲鄊舟至梅根子長􅀉詩復用前韻使節淹江左魚符換浙西詩筒猶在道客棹已移溪戒險疑浮峡行徐􅀋去齊壷觴更何日重向翠微携淮山淮山無數不知名山色遥看􅀧􅀧青二百餘年仁草木莫令汚染犬羊腥九華山予過池陽登郡樓望九華僅見一峯舟出清溪始見之然猶滅􅃿於雲霧之間晚泊梅根浦方了了見諸峯也朱仲文謂不可無詩因作九絶九芙蓉自九天来太史南㳺山未開仙境曽􅀴謫仙眼佳名傑句兩崔嵬舟出清溪尚逆風􅀚山􅁍得少􅀙容浮雲不礙天邉眼放出神仙八九峯我在芙蓉山下家四年秋色隔天涯如今漸斍鄊山近巳見芙蓉􅄍九峯江南一嶽占青陽多少神仙此地蔵聞􅀃仙翁搗薬処鳥声依舊克丁當山中有鳥啼声曰克丁當時人呼為􅁑仙翁㨶薬処九華山下化成寺太白書堂髙䖏開想見江山無此境故宜頭白􅂴帰来峯峦列峙神仙境子母相依孝義山莫向山中摘花果惜春啼鳥怒人攀春景人或登有啼鳥曰莫摘花果人或違之万鼓進羣飛厲声而啼郡樓􅀄見一竒峯深恐􅃄霞無路通神毋遥遥􅀅九子総􅀅山色到舟中曽見齊山小九華夢㳺縹緲羽人家灵山面目忽相見舟繫梅根秋日斜曰華曰子數俱九細看峯峦何許多今古画工圖不􅁕冠卿詩柰九華何唐蕭建以詩􅀉費処士冠卿云見􅀃九峯峯下寺曰宫尤在下方開其中幽境客难到請為詩中啚画来冠卿荅以二十韻銅􅁜阻風兩年官絶塞萬里下瞿唐秋浦浪方息銅􅁜風又狂五松人憶白双竹句思黄五松山李太白讀書処有魯直双墨竹詩今亡矣今夜舟中月中秋何䖏光江入銅􅁜縣舟蔵芦葦間郵亭危壓浦佛屋陋依山月出烏􅀅繞風髙雁欲還江山不貧䖏一覧見塵寰山有冨覧亭黄池對月十五日白帝去年月黄池今夜看風􅀅清玉宇雲不礙金盆明鏡飛邉逺霓裳舞䖏寒論文一尊酒欣對舊同官是夕舘予方大圭秀才家月明甚与米仲文張子是王康侯錢正叔同飲宣城道中聞雁蝉噪景如夏鳥鳴山似春數声雲外過却是雁来賓宿新豊驛小驛數椽屋夜深風雨中鄰家有鷄犬不是漢新豊塗中遇雨江流渺渺風吹浪驛路迢迢雨作泥好把金章換簑笠故山深䖏把鋤犁過宛􅁜陪汪樞宻登双溪閣畳嶂樓㳺髙齋望敬亭山誦謝元暉李太白詩用樞公㳺齊山韻天􅀅大任未容閑清峭依然御史顔謝客䏻吟練江句謫仙不厭敬亭山双溪風月壷觴裏畳嶂􅃄霞几案間天下蒼生望公起帰轅行見郡人攀離宣城天色隂晦望群山不見樞公和詩見􅀉復用前韻聖恩猶未許􅄬閑遥訪蘋洲栁與顔羿婦觧􅀅風送月麻姑莫遣雨遮山心㳺􅀌嶼題詩䖏名玷元樞薦墨間汪甞薦九人某與焉旦夕公帰首台鼎髙齋遺躅倘容攀過麻姑山出郭群山四望無故􅀅詩句禱麻姑忽然雲破山開靣天色如春有鳥呼宿紅林驛遇交代王給事路入紅林林未紅相逢俱是白頭翁郵亭灯火一尊酒明日君西我向東廣徳途中􅀚刈稲田父欣相語今年幸有秋深憂水後爛急向雨餘收穂尽穴移䑕畦空童放牛何當速帰去吾亦有西疇祠山秋風吹客過祠山水出平原礙往還呼吸雨􅊙神有力掃除雲霧見天顔桐川三絶遇太學三友帰􅀙三峽過三峯益友三人忽此逢行李稽留三日雨天教我軰得􅀙容驛中阻雨浸􅁋秋雨阻桐川無術那䏻􅀘漏天傳舍終宵不成􅄰􅀧灯重讀舊詩萹文籍遭水文書随我下瞿唐准擬家添萬卷蔵水厄那知在平地從今既済要須防九月一日自道場山如臨安周徳載夏廷茂自菁村乘舟来訪既別􅀉以小詩二十年前舊友生扁州来訪見交情相看容鬂俱非昔記得炉亭􅀏語声待對仙林九日登佛閣時􅀉家道場山思丢年㳺卧龍山遂用舊韻浮家東下路間関地近家鄊尚未還風雨滿城欣巳過星霜入鬂早宜閑去年嘉客同吹㡌今日仙林獨侍班徧挿茱茰憶兄弟更添北望道􅂣山梅溪先生後集卷第十五梅溪先生文集卷第十五䇿問問六經皆經聖人之手其大法􅀹著於始終之際樂亡於秦禮廢於漢姑勿論焉可也詩書昜春秋首未具存其可以不知耶詩三百文王之詩非不多也何以首於関雎頌有三莫先於商莫後於魯也何以終於商頌三皇五帝皆聖人也非無言道之書何以獨取於堯而以之首五覇皆賢君也非無命誓之文何以獨取於秦而以之終三昜所始義各不同周昜何以先乹而異乎連山歸藏之法六十四卦法相受也何以不終於旣濟而終於未濟之時春秋之作在平王世也不始於孝恵二公而始於􅀮豈果以其遜國之賢乎二百四十二載皆編四時以成年也而終於哀十四之春豈果在扵木絶火王乎論語者六藝之唯襟也始於學而終於堯曰其義安在孟子七篇擬聖而作者也始於梁恵終於盡心又豈無􅀃耶夫紬金匱石書之書者良史之才也終於􅀗麟猶有其㫖作凌烟􅀞像之賛者文士之筆也始於河間亦有所法况六經之嚴而語孟之奥乎􅂅與諸君究其所以然勿云議論安敢到而畧之也問自古帝王所以敦厚風俗者必以儉徳為本而毎以身率之禹惡衣服以率夏文王卑服以率周文帝身衣弋綈以率漢是三君皆古之大聖賢均以儉徳先天下為風俗者也禹尚儉而天下以儉應之故夏之世其所尚者皆忠質文王尚儉而天下以儉應之故當時在位者皆有羔羊之徳焉至於文帝尚儉不下禹文王而天下應之者或如如夏周之世故賈􅁩陳政事之書謂帝身衣皂綈而富民墻屋􅀍文繡豈漢民習秦人奢侈餘俗而未昜􅃍革耶不然何上以敦朴示之而下不以敦朴應之也我國家自祖宗以来世以恭儉化下肆我仁宗皇帝在位四十二年而儉徳猶著御寢衾禂至以黄綈為之常服止用縑繒雖累經澣灌而不昜然當時民間猶有以金為飾者於是詔自中宫以下母得衣銷金貼金等服臣庻犯者一切置於法由是天下化之而皇祐嘉祐之間風俗淳羙連于三代之上矣主上皇帝藴仁儉之資清中興之業􅀹謹厥徳惟懐永圗可謂同符仁祖並羙禹文者也邇者近臣獻言謂州縣尚用金翠爲衣服首飾貴賤之分混然無别請加禁止聖訓丁寜命有司以前後詔條申明之徳至渥也議者尚慮逺方富民狃於循習未能􅃍革射利之徒興造販鬻而不知畏又慮州縣奉行之吏不能遵守教條或暫禁輙而縦之無以仰副吾君敦朴之化必􅁒令行而禁止如仁祖之世不使年少書生得以獻太息之書如之何則可問才難乆矣堯舜之時野無遺賢所與治天下者止於五臣周家濟濟多士而用一婦人以足十亂之數不其然乎之歎冝其發於吾夫子也自兹以降治不逮古而人才愈難必責以五臣十亂之儔則千古爲無人就其時而求之冝莫盛於武宣之際班孟堅嘗枚舉其人而賛之以侈一時之盛武帝自公孫丞相至金日暉凢二十有七人宣帝自簫太傅至張敞凢二十有四人亦可謂盛矣然攷固之言猶有可疑者焉其稱武帝人才也則曰漢之得人於茲為盛是以興造功業制度遺文後世莫及至稱宣帝人才也則曰皆有功迹見述於世參其名臣亦其次也固盖以宣帝二十四人可為武帝名臣之次耳今即其人而攷之宣帝之相則有如有聲之丙魏固非公孫洪石慶輩之所可及其􅀅則有忠武如趙營平又非衞霍輩之所可及廷尉則有如于定國治民則有如龔黄又非趙禹張湯酷吏比也校其人才􅀂逺過之而固乃以彼為莫及此為次之何耶夫所謂人才者必其勲業名節之有大過人也彼阿世如公孫酷虐如張湯搉利如桑弘羊皆治世之罪人也而以此為得人又何耶有是君斯有是臣武帝君徳不逮孝宣逺甚固嘗譏武帝改文景恭儉羙宣帝侔徳商周其於人才當亦如之今乃復􅄖彼而劣此又何戾耶固生東都之􅀄去武宣之世為未逺且親為國史必知其人才之始未意其品藻之必當也况是賛􅀹膾炙人口而見録於選今乃可疑如此其必有􅀃以辯之問爾雅者所以通詁訓之指歸叙詩人之興詠釋古今之異言通方俗之殊語多識鳥獸草木之名可以愽物而不惑兹其所以為百代指南歟舊􅀃皆言周公所制又言史佚教其子以爾雅又言孔子教魯哀公學爾雅晋郭璞亦言興於中古盖指周也是則爾雅之出逺矣今閱其書而攷之則非周公之制甚明小雅稱張仲孝友盖宣王時人也而釋訓篇則有張仲孝友之釋衞淇澳之詩曰如切如瑳如琢如磨盖羙武公也而釋訓則有過學自修之釋式㣲之詩為􅀺侯作也而有㣲乎㣲之釋猗嗟名􅀆刺魯荘公詩也而有上為名之釋其釋詁釋言釋訓諸篇大柢皆訓釋詩書之辭悉出周公之後而云周公所制非矣又釋嵗名則曰周曰年釋􅀕名則曰周曰釋周公豈自稱其國號以别夏啇耶又於釋地篇叙十藪之名舉魯晋秦宋楚呉越齊燕凢九國継之曰周有焦護是數國在周公時固未有封者周公又豈自卑宗周以配列國耶以此知爾雅断非周公作也漢人嘗有以是問楊子雲者矣子雲以為孔子門人㳺夏之徒所記以觧釋六藝者也是亦意云爾亦何以驗其出孔氏徒也或云爾雅實周公所制而張仲孝友之􅀋乃後人所足猶春秋絶筆之後弟子續之至孔丘卒之􅀋其􅀃又如何􅂅與諸君辯之問有創業之君有守成之君有中興之君三者之時不同而應之者亦異音房元齡嘗以創業為難魏鄭公嘗以守成而不昜元次山之頌中興也又以宗廟再安為事之至難然則三者皆未可以難易断也請借漢以論之髙帝創業者也而不足於文使生文帝時未必能興聖賢之治文帝守成者也而不足於武使生髙帝時未必能建艱難之業宣帝中興者也然英雄不及髙祖仁厚不如文帝使生二帝時其武功文徳亦必有所不如者西京三君盖亦各以所長而生遇乎時以成其名者歟至於光武雖號中興之君而功兼創業治兼守成意者其文武两全功徳兼備者也然馬伏波對隗􅅝之問乃謂光武不如髙帝我神宗稱漢唐之治亦及文宣而不及光武夫創業守成中興皆難者也而兼之者為􅀹難西京三君各䖏其一而擅其名光武兼三者之長而稱之者或以為不如或有所不及何耶共惟主上以神聖之資濟艱危之運徳邁周宣而俯比光武兼三者之至難而取之以至兼賢於古人逺矣諸生幸生聖時目擊盛事願攷三者之難易與漢四君之􅄖劣以發明我主上之鴻勲盛徳問昔夫子繋易謂何以聚民曰財對子貢問政以足食為三者之首財用者誠有國之急務􅀹急於艱難多事之秋也國家前日無事用度失節常賦之入猶不足以支􅀊費一旦加之以師旅錢榖之問遂至於廟堂調發既繁經費百出官田鬻矣度牒行矣坊名借矣下富民獻􅂇之令殫州郡公庫之噐矣而獨不及民仰見聖徳之至渥也然議者謂財非天雨而􅀑輸之未有不取諸民者雖賦歛不明出於朝廷而科率毎潜行於郡縣勤恤之詔非不丁寕有司迫於辦事所不暇顧况今日虜情叵測和與戰猶未决也和則有嵗幣而坐困吾財戰則興師百萬千里餽糧有不可勝計之費􅀅取之官耶而公帑竭矣􅀅耶之民耶財盡民怨何以爲國古者兵未嘗不用而財未嘗不給耶抑不知生之以何術理之以何人耶伊􅁒上不乏用而下不及民其必有􅀃問少康祀夏配天不失舊物議者以爲􅄖於漢髙帝孝宣信威北夷功光祖宗班固以爲侔徳商宗周宣光武身濟大業中興漢室馬援以爲不如髙帝太宗除亂致治功徳兼􅂭史氏謂比迹湯武庻幾成康其言之常否果如何主上興衰撥亂紹復大業方之前代何如主也􅂅併陳之問戰國之軻况西京之雄隋之通唐之愈皆著書立言羽翼聖道世以大儒稱之議者不以爲過然五君子者果孔氏之徒歟心無異傳道無二致固冝迭相推尊無或操戈相伐可也今攷其書乃或不然况非特不尊軻也且列於十二子而非之雄非特不尊况也且有同門異户之斥通雖以雄爲振古竒人而不許其道愈推尊孟氏醇疵况䧺至河汾則無一言之及然愈嘗自比孟軻矣後世亦不能無異同之論夫道之所在人所共尊道不在焉人所同抑今尊之則命世大才仰之則諸子也尊之則軻雄之間抑之則異户也尊之則聖人之徒抑之則張衡數術之伍也尊之則聖人之脩抑之則􅃿而不􅀃尊之則㤗山北斗抑之則木強人也尊之抑之者其公心歟其􅀻意歟豈好巳同者有相黨之心故􅀻有以尊之歟好巳勝者有相䡖之意故妄有以抑之歟尊之者是則抑之者坐蔽善之罪矣抑之者是則尊之者䧟虚羙之失矣二者必居一於此也􅂅考其實而詳辯之問十八章之經夫子爲弟子曽參作也參以孝名世爲孔門賢弟子雖曰禀自然之至性盖亦出於侍坐之際開宗明義之力焉然參之言行俻見於語孟諸書不知其終身之大節能不􅀒聖人之教而脗合於是經者果何語也夫子嘗自謂行在孝經使曽子果能盡是經之言也則行與夫子同矣然參雖賢未可以擬聖人是於經必有所未盡而行事不能無少戾也夫孝於徳爲至於行爲大參既以孝稱冝無媿於淵騫之列矣乃反不預四科何耶諸君自兒時巳能誦十八章之語其於岀孝入弟之際必不叛是經敢問曽子之孝其有得於經者何語其未盡於經者何事與其不與於四科者果何謂也問君子讀書稽古豈徒對聖賢而巳哉必曰古人可作吾誰與歸心有所慕則􅀅學其爲人而以其身比之也歴觀古人自比於前脩者多矣亦各不同有以不如巳者自比有以勝已者自比自比以不如巳也能自謙矣而有志者卑之自比以勝已也能自強矣而好謙者妄之孔子賢於堯舜而􅀼比老彭有以見聖人謙徳之至也人比曽西以管仲則艴然不恱謙何在焉孟子乃以是取之何耶至諸􅁑武侯自比管樂或羙其徳之謙或陋其志之卑亮果謙乎卑乎君子必有以䖏之也􅀭雄韓愈自比孟子雄愈非軻敵而以軻自期有以見君子自強之志也崔浩自比張子房志亦可嘉矣議者乃不許之何耶至杜子羙以詩人􅀼比稷􅆻人或賞其忠或指其妄甫果忠乎妄乎君子必有以處之也諸君潜心古人之際其必有以自况􅀅比於不如已者歟則懼其志之卑非自強之道􅀅自比於勝巳者歟則懼其言之妄爲謙徳之累必􅁒自謙而不失之卑自強而不失之妄如之何而可􅂅商榷古人之外且各言其志問古之人皆有師自聖人至于士一也雖師未必賢於弟子弟子未必盡如師固可因流䆒源見形知範矣惟孔子之於老􅅨左丘明之於孔子公羊髙榖梁赤之於子夏房杜王魏之於王通世皆以爲師弟子也或謂其不然學者未免乎疑焉謂孔子不師老􅅨也固嘗適周而問禮矣果惟􅅨是師則彼槌提仁義絶㓕禮學夫子乃爲禮樂仁義之主何耶謂丘明不師孔子也固嘗見稱於魯語與聖人同好惡矣果惟孔是師則子不語怪而丘明乃失之誣且傳經多不合於聖人之㫖何耶謂公榖不師子夏也則先儒應劭軰固嘗有是語矣謂果出其門則春秋之成商不能賛一辭二子乃各以經名家何耶謂房杜王魏不師王通也則通著之中􅀃固嘗弟子之矣謂果出其門則數子俱顯於唐反無一語以称師抑又何耶以爲果師果弟子則其學必不相戾而其心必不相忘也以爲非師非弟子則載諸古人之書傳諸學者之口豈盡妄耶諸君尚論古人之日乆矣師自柱下而至河汾弟子自􅀅聖而至正觀諸子必能熟究其源流而素知其然否也幸即其道攷其時推前人之議論以其實告問韓愈栁宗元俱以文鳴于唐世目曰韓栁二人更相推遜雖議者亦莫得而雌雄之然其好惡議論之際顧多不同者韓排釋氏甚嚴其送浮屠序責子厚不以聖人之道告之栁謂釋氏之􅀃與易論語合且譏退之知石而不知韞玉韓謂世無孔子則巳不在弟子列作師􅀃以號召後學栁則以好爲人師爲患有師友箴有荅韋嚴二書且有雪白之喻又有母以韓責我之􅀃韓著􅀗麟觧以麟爲聖人之祥賀白􅀛表以􅀛爲􅀗蔡之驗栁則作正符詆談符瑞者爲􅁋巫瞽史韓碑淮西歸功裴度而不及李愬栁於裴李則各有雅章韓以作史有人禍天刑之可畏栁則移書以辯之韓以人禍元氣爲天所罰栁則著論以非之其指意不同多此􅁼者且退之名在子厚先友記中盖其父兄行且年又長栁冝以兄事之可也然韓毎及栁則字而稱之栁語及韓則斥而名之爾抑又何耶今二文並行於世學者之所取法真文章宗匠也然讀其文切疑二人陽􅀂更譽而隂相矛盾者不可以不辯夫韓栁邪正士君子固能言之至於議論則未可因人而䡖重􅂅與諸君辯其當否問五常之道莫大於仁以夫子之聖猶曰豈敢故於許與之際尤謹焉古之逸民非不多也獨許夷齊爲得仁大臣如伊吕之徒􅀄無一言之賛也獨稱商有三仁門弟子之中如仲由冉求公西赤者皆所不許而獨許顔冉諸侯之大夫如令尹子文陳文子皆所不許而獨許一管仲此八人者雖窮逹死生去就之迹不同而聖人許之以仁􅀄無異辭後世有大儒王通者鳴道河汾間與弟子難疑荅問動以洙泗爲法中􅀃十篇猶孔氏論語也其以仁許前賢及髙弟者亦八人焉曰東平王蒼仁人也曰羊祜陸遜仁人也曰荀氏有二仁曰仁哉樂毅許董常以顔氏之流盖以其三月不違仁也稱薛􅀵仁而不佞盖許其爲冉雍也夫子所稱八人者後世以聖人之言莫得而議之通所稱八人者或未之信然自蒼至􅀵七子皆顯事在信史可考而知董常早世其言論粗見於中􅀃亦可以想見其爲人也是果可當仁者之名否乎通之許與其亦有得有失乎孰可以方夷齊孰可以比三仁孰無媿於顔冉之徳孰能爲管仲之功􅂅併陳之以佐文中之垂教問太史公作史記采古今名臣賢士列而傳者凢七十焉其共列之人必􅆨味之同者如管仲晏子以佐主之迹同孫武呉起以論兵之術同樗里甘茂以智略同范睢蔡澤以其談辯同仲尼弟子學術同也屈原賈生風騷同也萬石張叔謹厚同也凢傳而同之者必其􅁼之相近焉然亦有不冝同而同者使學者不能無惑其爲老子傳也與荘周同冝矣而乃列申不害韓非於其中申韓之術至殘忍􅆭酷也其可與深於道徳者同耶其爲孟子傳也與荀卿同冝矣而乃列鄒衍淳干髠于其間以衍之迃誕髠之滑稽正儒者之罪人也其可與主盟仁義者同耶謂遷不精於選擇則彼之同者何是謂遷不妄於條例則此之同者何乖豈偶得於彼而有失於此耶抑識見不明曽珷玞羙玉之不辯耶不然其不同而同之必有深意乎其間不可不熟究而詳辯也問君子之學必先正其心術而不惑於異端邪􅀃然後聖人之道斯可得而入焉茍惟心術不正而異端邪􅀃從而䧟溺之望其入聖人之道猶航断港絶潢而􅁒求至海不亦難乎昔吾夫子旣􅃿而楊朱墨翟者􅀼仁義之一偏而唱爲我兼愛之􅀃以亂天下幸而有孟子者出辝而闢之楊墨之害息而人心復帰於正孟子􅃿有申韓刑名之學黄老虚無之􅀃簧皷于世其爲害又甚於楊墨而世之儒者徃徃堕於其間而不悟以賈􅁩之美才猶明申韓司馬遷之愽學猶尚黄老况其下者乎當時不惑其􅀃毅然而麾之者一楊䧺氏而已自漢室之東而西方之教流入於中國時君世主尊尚其􅀃遂與孔老並立而王公卿士庻䧟溺滋甚王通隋大儒也猶称其爲聖人白居易唐賢人也猶酷􅄝之晚節用其教以理性况衆人乎當時不惑其􅀃毅然而力排者一韓愈氏而已夫異端邪􅀃之移人也愚者信之可也而智者惑之何耶不肖者信之可也而賢者惑之何耶里巷之人信之可也而縉紳士大夫惑之何耶豈異端之學亦有以過人而其道誠可與堯舜周孔抗衡於世耶豈賈􅁩司馬遷王通白居易之徒明之尚之尊之者是而孟子楊䧺韓愈闢之麾之排之者非耶夫以其􅀃爲真可信也則與吾堯舜周孔之道大不相似以其􅀃爲妄也則世之屈已以尊崇之者又皆吾儒之傑然者焉孟楊韓三君子不世出無有與之辯者􅂅與諸君論之問封建尚矣自五帝三王莫能去矣後世人君易之以郡縣則其國亦從而治亦或因之而亂此皆立國之先務學者不可不察也唐虞列公侯伯子男爲五等相制天子千里諸侯百里而降不及五十里者爲附庸周興封國八百同姓居五十三焉此封建所由興也秦鍳衰周之弊罷侯置守列天下爲三十六郡後世因之不改復増其數此郡縣所由興然以周秦漢唐論之則其國之或強或弱其祚之或短或長皆関乎封建之與郡縣此又不可不辯矣謂封建無益於􅀦耶則周何爲因之而強秦何爲罷之而亡乎謂封建有益扵國耶則漢何爲而有七國之變唐何爲而有諸鎮之乱乎􅁒使罷侯置守而無嬴秦之危封建侯藩而無漢唐之乱果何術而可􅂅詳以告􅀅䟽其􅀃以獻于上問夫樂之作尚矣先王以是正朝廷羙風俗格神物和上下有其舉之莫敢廢也故黄帝之樂曰咸池顓帝之樂曰六莖帝嚳之樂曰六英堯曰大章舜曰大韶禹曰大夏湯護而武武此歴代之樂所由作也而其大備莫盛扵成周故周禮大司徒以六樂防萬民之情則又有所謂大師小師磬師舞師笙師鍾師者大師樂以六律六同大合樂時則有奏黄鍾太簇姑洗㽔賔夷則無射者太師掌律同以合隂陽時則有播八音扵金石􅁝竹匏土革木者是古作樂者必有其官奏之必有其所制之必有其器豈非樂有自然之數而數之所舉又有自然之義乎後世去古旣逺樂制始無一定之論而名數音律刑噐亦莫之考矣學者審古今灼知先王所以作樂之意者敢問咸池六莖六英韶護夏武之名所取者何義周大司徒與大師小師磬師舞師笙師鍾師所掌者何噐黄鍾太簇姑洗㽔賔夷則無射所奏者何所金石􅁝竹匏土革木所應者何事與夫後代因革損益孰得孰失幸明言之問孟堅序六藝為九種列小學一家於其中則知字學之有益於斯文也尚矣古者八嵗入小學學書藝之事故周官保氏掌養國子教之六書漢簫何亦著其法於律令太史試學童而禄其課㝡者唐選舉之法有四而楷法遒羙居其一焉夫書雖一技然教於周試於漢選舉於唐叅六經論語孝經而九之學者其可忽耶爰自科斗書廢􅂐􅀠迭興漢晋以来乃有草楷真行雜體之書去朴歸華舒牋􅀧翰以相誇尚者不知其幾也唐太宗歴評晋人之書而以王逸少爲盡善盡羙先翰林蘇公嘗評唐人之書謂極於顔真卿又論近代之書以蔡君謨爲第一議者謂顔書本出於王而蔡乃法顔而變者然三人者各名家當代而咸造其極使其同時而並駕未知其孰後而孰先諸君稽古之暇㳺心翰墨乆矣其於晋唐宋三子􅀅誰取法耶抑所好不同捨二三子而他有所尚耶又豈得於心畫之妙而不蹈前人之陳迹耶􅂅評古人􅄖劣之外且自論平日之所以張吾軍者果出於自得乎抑亦何所法也幸詳以告梅溪先生文集卷第十五
