body:
  text: 啓及第謝宰相地借玉堦恭上萬言之對名登虎榜濫居千佛之先揣分踰涯撫躬知愧􅀼以奏言試功者尭舜遺意臨軒耴士者祖宗令規一新熈寕之科俻見神廟之志謂三題不足發子大夫平日之藴蓄而群䇿可以陳我囯家時政之闕遺著爲永􅃔以幸多士夫何首當時之選者無切直之論遂使擬進士之對者有阿䛕之譏既波蕩以相承􅆀源流之寖失近代尤甚澆風益滋大臣多忌而動有嫌疑斈者懐憤而莫伸梗㮣物極必変道開始公申􅃊宻之禁而務在令行防壅蔽之害而悉関聖覧求忠讜則丁寕有詔第髙下則寵褒有辝既當靖明不諱之朝冝得瑰􅊆非凢之士如某草茅賤子庠序鮿生由行藝以進升厠英髦而旅試俯慚俗斈䇿無可耴之二三仰惧天威事去欲陳之五六念交淺言深猶􅂉不可非主聖臣賢其能有容龍匪怒其嬰鱗􅀛偶居扵前列上自親擢受知不减於孫洪言畧施行悟意有踰於賈􅁩静惟僥冐抑有夤縁兹盖伏遇僕射相公以道事君無􅀻應物蚤羽儀於法從茂著忠嘉今掌握於化鈞凾圖康濟坡露封章之請益開宸聴之聦奨勵進言得裴宏中之大体深衘譏政戒李吉甫之􅄶心盖將植太平之基豈獨為諸生之賜某敢不益堅儒業恪守官箴勉来事之可為慕古人而有作不􅀒天子惟殚精白之心􅂅為良臣兾奉周旋之誨過此以徃未知􅀁裁張叅政綱某官厚徳鎮浮宏材㧞萃為一時之􅂄彦聳百辟之表儀明以保身揖高風於赤松子任而共政継前列於曲江公欲振起斯文於委靡之餘遂将順其羙於聴納之際陳樞宻誠之某官禀純粹清明之姿冨慱洽宏深之斈茂明大對擢桂林之一枝踐歴要途􅅮鵬程之万里夙􅈾宸眷進握兵􅁠材兼文武而夷夏􅋍􅀚荣冠古今而縉紳景慕惟昔漸陽公之徳化􅀼嘗聞夫子之文章方慚不肖其範模何意克傳其衣鉢楊侍郎椿某官斈極群書文􅄖四傑纚纚議論有眉山先生之流風籍籍声􅁛継関西夫子之遺懿􅁢矣儒林之冠儀乎從橐之班承師槐市而既􅀍作成奏對楓宸而復膺推奨李侍郎琳某官模楷士流羽儀朝著分符便郡循良逺過扵龔黄持橐從班儒雅同称於班馬比膺詔綍親聀文衡革委靡而振士風進忠讜以當上意賀侍郎􅁢中某官為世儒宗握時文柄寘杜牧扵髙第本崔郾之公心號李白為謫仙見季真之雅識為盛代而開公道賛吾君而求直言遂􅃱繆庸首膺選擢劉侍郎才邵某官學校舊人文章大手仁為巳任典刑備著扵老成道與時行徳業兼全其乆大峻班行於筆橐演詰命於絲綸主張斯文提撕後進王侍郎俁某官朝著老成士林碩望蚤􅀍知於宸扆乆更踐扵禁途出鎮侯藩藹黄覇循良之譽入司囯計得劉晏耴予之冝欲振起斯文於委靡之餘故将順其羙於聴納之際陳侍郎康伯某官噐粹珪璋斈深渊海蚤著士林之望亟膺宸眷之知髙玉山恬養之風乆淹琳食復􅂵槖清華之舊超冠天官欲振起斯文於委靡之餘故将順其羙於聴納之際張侍郎某官學海渊深量陂宏大蚤著士林之望乆膺宸眷之知居務論思豈獨得皐陶之理發明仁恕盖能紹廷尉之平欲振起斯文於委靡之餘故将順其羙於聴納之際王舎人綸某官心醉六􅀴名先四傑詞章典雅有漢朝制誥之風衡鑑精明継宣公考校之盛振起吾道主張斯文遂令舉首之荣濫屬宗盟之末趙舎人逵某官挺秀坤維結知天眷䇿名龍首茂騰四海之英声執筆螭頭益厚一人之寵遇振起吾道主張斯文遂令射䇿之䛕聞輒継傳衣之盛事周舎人麟之某官巍擢異科荐更要聀黼黻河漢祠章不减卿雲羽儀天朝人物有如晋宋振起吾道主張斯文遂令蕞爾之才輒玷褒然之舉孫少卿道夫某官挺秀岷峨騰英庠序掞黼黻之文於方冊藹袴􅃭之詠於蕃宣􅃈闥来帰快郎星之先覩曲䑓進擢仰卿月之清輝比掌文衡親承御札哲鑑獨髙於衆目狂言特薦扵匹夫幸出自天㤙帰無地周侍御方崇某官剛毅不囬精忠自守雍容禁近簉鵷鷺而接夔龍排繫姦邪若鷹鹯之逐鳥雀比膺詔綍親聀文衡猥收狂率之言上副聖明之㫖王殿院珪某官受氣剛方立朝挺正位升橫榻益􅀭蹇諤之風望著中䑓克盡紏繩之聀力主張扵公道務振起於斯文遂􅆀妄庸叨􅈾選擢凌司諌哲某官勁特不囬端方自守直言中病有王魏善諫之風奏藁屡焚無管晏􅁀君之失力主張於吾道務振起於斯文遂􅆀繆庸誤膺選擢王郎中剛中某官問斈渊􅀷氣莭洪毅楓宸射䇿名切亜扵龍頭蘭省懐香望獨髙於鵷序惟文柄之有屬体上心之欲求掲以平衡志不囬於馮宿借之褒兖言有耴於劉蕡遂令舉首之荣濫􅀍宗盟之末孟郡王某官噐粹璵璠􅂟傳珪組襲亜聖大才之儒雅光􅂭祐奕世之徳勲政邁龔黄作股肱於藩郡望髙隂馬資肺腑於懿親方詔復蓬莱之逰俄荣拜瀛洲之長有光吾道将振斯文遂令蒐􅃈之流首􅀍甄收之列與紹興趙殿撰令詪假道治封曽快瞻於趙日効官幕府遂託芘於蘇天鳬趍有期雀躍良甚恭惟某官宗盟擢秀桂籍􅀭芬藴無施不可之才著􅀁至有声之績儒雅同於歆向徳名無愧於間平将命外䑓威動南閩之山嶽分符巨鎮謡興東越之袴􅃭矧茲㑹計之􅀖實號蓬莱之地俯臨禹迹仰切尭階為二淛之雄藩緫七州之生齒既近而大有如此非親且賢其孰宜坐收作牧之功克壮維城之􅀔治優方面姑為分陜之召公心在朝廷行作相周之衛武某東嘉白屋太斈鮿生慙無董相之文偶擢平津之第向来披霧識金枝玉葉之標此日望塵與緑水紅蓮之各材自慙於樗檪賜端頼於帡幪尚期囯士之知庻免簡書之責窮禹穴稽山之勝􅀼效馬迁賦鑑湖秦望之竒􅂅陪元稹與邵提刑大受慎水望塵幸識􅂵芝之眉宇稽山庀聀􅂅登元礼之門墻行遂鳬趍預深雀躍恭惟某官道俻徳羙材通噐閎聀更中外而􅀁至有声節著險夷而無入不得方天子重外䑓之􅀉以星郎揔列郡之􅁠斡山海之蔵劉晏明於耴予聴獄訟之㑹不疑多􅀁平反巳􅀚報政之成矧復去天之近文帝受􅁵宣室乆有所思望之雅意本朝寕勞于外如某者簘䑓末裔槐市鯫生慙無董相之文偶擢平津之第紅蓮緑水方期逺䆠於秦淮手板青衫兹幸近逰於禹㑹昔快披雲之􅂅今諧執御之􅀻從政未􅄖何止受東諸矦之約束資身無䇿更當借部使者之吹嘘荅簘山宋知縣敷厠迹縉紳稔服箕裘之譽効官藩府偶同州縣之劳雲披未諧山仰弥甚某官中朝大族當代􅊆人世著才名喜景文之有後業傳清白得廣平之遺風暫淹万里之鵬程􅂓試一􅀖之牛刄下車未乆製錦巳􅄖願勤撫字之心益著循良之治坐見鳴琴之化無媿魯恭行膺襃徳之封有同卓茂荅􅌘縣丞窮居慎水未遂識韓易任稽山行􅀅訪戴某官人材瑰異吏事􅄖長暫淹千里之騰驤来賛一同之教化况剡谿藴秀之地貳令爲难以慱陵種學之賢􅀒丞何有不待報政行􅈾羙除荅上虞陳縣尉損肄業賢関共十載韲塩之苦効官藩府分一時州縣之劳結同舎之金蘭對尺書之面目披雲有自傾盖可期某官種學渊源負才卓犖馳英声於槐市擢荣第於桂林白面紅顔􅂓作神仙之隠吏金章􅂵綬行爲䑓閣貴人輿論所期私心尤祝荅来司戶師韓厠迹縉紳雅欽髙譽効官幕府遂􅀗同僚未遑尺牘之修遽辱朋緘之及某官家声素著吏斈㝡􅄖州縣勞人姑為阮瞻三語之􅁺文武有種行継李唐四子之風靡待政成佇膺詔擢與都提舉絜伏審光􅀍宸㤙榮持使莭輟握蘭之髙選臨製錦之舊逰除目􅀄頒提封交􅂟恭惟某官裔傳臨晋秀挺丹陽早􅀵科第之榮屡更州縣之聀學無入而不得治所至而有聲帝謂儔若予工姑暫劳於作匠官雖上􅀿列宿寕乆困於為郎方清朝重外䑓之􅁠以大賢膺列郡之􅀉后稷居播奏之聀能懋迁於有無劉晏幹山海之蔵宜益知於耴予第恐宸心之念賈佇聞詔墨之召參暫屈使軺即持從橐與安撫王閣學師心伏審光膺宸命荣殿大藩輟喉舌之近司􅂌股肱之重􅀉除音􅀄布輿論交􅂬恭惟某官望重三朝才髙列辟學通今古而無入不得任更中外而􅀁至有声進長天官帝命素優於出納屈臨方面王畿􅁢頼於藩宣矧兹㑹計之邦實號蓬莱之府俯臨禹㑹仰切尭階為二浙之雄都揔七州之生齒既近而大有如此非勲且賢其孰冝坐􅀵作牧之功益著惟良之績越囯之人方􅇤上之委任固非䡖漢庭之位尚虚公之来帰其非晚某俻貟幕府託芘帡幪民事未知窹􅄰敢忘於天語仕途􅀄筮吹嘘端藉於宗工賀趙侍郎令詪伏審光奉宸命荣迁地官親賢見用於朝中外罔不相􅂟某官玉牒歆向朱轓趙張豈惟標凖於宗支固甚練逹於吏事使軺屢駕興南閩十好之謡符竹荐分継劉寵一錢之譽果􅀩親擢巍領貳卿方囯􅅒之未豊在版曺為􅀹急省用斯能足用生財莫􅀂節財􅂅於論思献納之時力陳本末源流之計賛漢文之儉徳革唐室之􅀻蔵無􅀂延齡援􅀴􅁩以惑主冝同李絳不進献以結㤙要令粟腐於太倉罔使錢泄於異境主聖如此公言必從坐􅀵耴予之功行䖏弼諧之任某叨與幕府􅀗依大賢雖賛畫有愧古人然至室必以公事性素傷於愚直事每荷於寛容顧虞翻之榻猶存曲蒙屡下想元礼之門益峻未遂重登輒罄㣲誠遥馳尺牘謝王舎人剛中伏准照牒舉某自代者賛畫東州仰藉宗盟之芘判章西掖誤蒙囯士之知寵過衮褒銘深肺腑􅀼以官居侍從則聀在薦士識挺特逹則心能尽公顧雖自代之虚文必引􅀁知之同􅁼歐陽持橐以噐識而推吕東坡視草以文行而舉黄率由臭味之同遂有齒牙之借不事請託自膺薦􅀭如某者學最空踈文尤荒陋偶中楓宸之第叨為蓮幕之賔民事未知惟恐有􅀒於天子王言是代豈期見舉於公朝望外蒙㤙顔間増愧兹盖伏遇某官學貫經史文成訓謨有江左河汾之風流如嘉祐治平之人物得用捨行蔵之正氣不下於􅁠臣當論思献納之秋舉輒先於寒士遂令庸繆妄辱品題某敢不益勵操修無忘許與求之以文而應之以實端拜贈言勉其不逮而増其不能用酬知巳荅王宫教必中俻貟幕聀雅懐慕藺之誠闡教宫庠行遂識韓之􅂅逺勤緘翰仰佩撝謙某官望重江南群空兾北芹宫得雋實多士之宗儒棣蕚齊名皆一峕之人傑式􅀚介弟之噐識仰見难兄之範模将儀表於天朝姑作成於宗子庻俾神明之裔陶成信厚之風荅周主簿賀正行夏之時􅁢恊三陽之應􅂂端於始光膺百福之来徳荷過謙禮蒙倒置某官望􅂭越絶秀藴剡谿鵬躍天池􅊆矣周郎之年少鵉棲枳􅁄蔚然仇覧之才華某叨預同年􅀗伊巨庇賦椒花之訟獻雖後於元正占茅茹之爻亨必同於他日荅􅄌溪姚知縣應辰昔登蕃榻雅蒙眄睐之􅀻兹宦蠡城首辱緘封之賜俯増銘感仰偑謙冲某官操行㓗修性資深厚克振箕裘之業荐更州縣之劳斯立不􅀒丞吏寕容於摘􅁓子㳺善為宰治何劳於割鷄課最巳聞召擢伊邇某濫塵科第叨與幕僚顧僥倖之為多實奨提之有自報鯉書之太晚負負何言瞻鳬舄之匪遥拳拳不替與徐提刑度伏審光膺宸命荣緫憲綱政巳報於江東䑓復移於浙左快覩除目􅂟溢部封恭惟某官天賦材猷家傳事業蚤登群玉之府上應列星之纒輝棣蕚於一門結棠隂於両郡方外䑓之􅀉為甚重非識治之材其孰冝劉晏理財何止為管簘之亞有功治獄當逺過于張之賢暫屈使軺佇持從橐某漢庭􅀼第越幕俻貟民事未知有􅀒聖天子之明訓仕途􅀄筮尚期部使者之寛容荅㑹稽錢知縣某宫家傳忠孝世襲簮纓治􅀁至而有声才無施而不可矧㑹稽之大邑實呉越之故封先王之遺爱尚存百里之良民易化况舊令尹之治方結於去思聞今大夫之賢益快於先覩靡俟報政佇膺迅除某􅀼第懐慙俻貟亡􅀘幕中賛畫叨為王儉之下僚堂上鳴琴行􅀚單父之羙化謝王安撫伏准照牒舉某應四條㫖揮者楓宸射䇿濫居多士之先蓮幕效官誤玷四條之選感深肺腑愧溢面顔切以囯家廣数路以耴人神聖集衆賢而共理既以進退黜陟之􅁠􅂌之宰相吏部又以按察舉刺之聀委之郡守監司逮元祐之垂簾起大儒而當囯舉直措枉紀綱既正於朝廷激濁揚清除目載頒於郡縣去苛侫貪懦之四害耴仁明㢘直之数長議雖建於當時事始行於今日首膺兹選􅀂难其人如某者素無技能偶􅀼科第賛晝雖乆瞢然民事之未知忤意何多嗟爾人言之可畏㤙未酬於親擢期甫及於終更退而自顧則寸無􅀁長進欲有爲則尺未嘗枉譽誰肯借况無韓子之三書薦下侍求忽拜山公之一字静惟僥冐抑有夤縁兹盖伏遇某官一代宗儒三朝􅂄徳入䖏天官之長出居方伯之尊循良夐邁於龔黄寛厚脗同於婁郝雅意本朝而忠可見嘉猷我后而人不知建文正之祠用清白以規下行温公之議薦賢才而報君遂致繆庸亦膺甄録某敢不益持士檢恪守官箴懐惓惓畎甽之忠勵蹇蹇王臣之節就有道而正已為可用以待時朝㧞一人而莫㧞一人叨與耴尤之列待以囯士而報以囯士敢􅁯知巳之㤙荅諸暨王縣尉萬章地䖏甌閩叨與宗盟之末聀分州縣􅀗同王事之劳首辱朋緘仰欽厚徳某官才髙四傑望重三珠騰槐市之英声擢桂枝之髙選東州筮仕暫宣綵棒之威當宁急賢行應􅂵􅅺之詔某俻員亡􅀘􅀼食懷慙泛緑水而依蓮倦㳺儉幕具扁舟而把釣欣遇梅仙荅邵縣尉謝觧􅀾藝􅈇䑓登名天府巍中有司之選仰欽所業之精縉紳聳􅀚縫掖歆慕某官群空兾北風継召南試混諸生不作衞公之耻材􅄖萬中果騰張鷟之聲冨貴殆将逼人科第何足慁子佇從仙吏徑到蓬山某叨與同僚獲􅀚盛事都􅀐顧我端繇臭味之同長牋拜嘉􅂺講報投之好荅陸觧元謝觧洙得雋文􅂣登名天府巍亞褒然之舉仰欽卓爾之才鄊詳甚休言論無異觧元雲間馳譽筆下有神明䟽通知逺之經工􅂐刻彫蟲之技䖏嚢脫頴何止定平原之從射䇿决科行将擢公孫之第某俻数幕客􅀗􅀚薦書􅀼喜東州之有人預期南省之得士荅髙觧元謝觧㳺翰墨之場俊同子羙登賢能之籍名継牧之有司甚明士論無異觧元家声韓魯經斈羲文手劒登壇作平原定從之客筆􅄡鏖􅀾継澶渊􅁍敵之風鼓勇春闈唾手巍第荅諸􅁑觧元謝觧㳺翰墨場雅􅀒少陵之志登賢能籍兼聮少阮之名鄊評甚休士論無異觧元譽檀文虎風傳臥龍明温柔敦厚之經工􅂐刻彫蟲之技䖏嚢脫頴何止定平原之從射䇿决科行将擢公孫之第荅周主簿賀冬日遵南陸君子之道大亨律應黄鍾天地之心可見肇迎長景荣􅀖短牋某官學不止於决科材已􅄖於為政鵉鳯棲枳􅁄暫淹州縣之劳鵰鶚在秋天行赴功名之㑹顧一陽之􅀄復茂百福以来綏某托芘同年􅀼禄仙里登􅀚䑓而望方執筆以書雲懐剡溪之人欲拏舟而興雪荅孫通判􅀚喬木而思世臣雅欽􅊆望泛紅蓮而㳺幕府叨與下僚第去官之匪遥恨事賢之太晚朋緘下拜謙徳有光某官挺生相門妙有家學興公之才名􅃣世親得其傳叔敖之隂徳在人固冝有後先正亡而象賢在􅁠臣死而公道行冝相継於鳯池寕乆淹於􅂹足佇自别乘荣躋要途某􅀼第懐慙効官無􅀘賛南陽洪農之畫有愧范岑賦監湖秦望之竒􅂅陪元竇除館聀謝宰相右某䝉㤙授前件聀者泛幕府芙蕖之水吏責幸逃登道家蓬莱之山㤙光誤及俯慙䛕學濫與英􅄤􅀼以地號西崑象符東壁両京事實石渠天禄東􅀚皆其名一代人才劉向揚雄班固為之傑逮我有囯尤清此途名兼三舘之崇事異群司之比書蔵延閣冨不减於開元人到瀛洲榮愈加於正􅀚有下筆如神之士無上車不落之流噐業於是乎成公卿多自兹出雖曰文行素著科目最髙必俟大臣之薦論斯用故事而召試力可求而得者則禁其􅀻請書不程而命者盖出於異㤙韓魏王􅁬自甲科猶薦而後召蘇内相擢繇制舉亦試而後除孰謂不才乃叨殊選伏念某性資愚鈍術業空踈避三舎於廣場屡焚筆硯終一星於太學始脫虀塩瞻天顔咫尺之威借玉階方寸之地􅀄乏茂明之對偶膺親擢之榮誦言豈逮於劉蕡試吏僅同於簘傳固甞効太史之探穴然未若中郎之得書期方幸扵及􅆶言旋枽梓坐靡容於暖席遽奉􅁝綸脕迹諸侯之賔􅀚先群玉之府識􅂚堪於是正誚寕免於何如曽三威七穆之未知豈八索九丘之能讀堅其􅀁守而巳佩聖訓而不忘非爾其誰居之拜王言而增媿兹盖伏遇囯史㒒射相公事業稷卨文章訓謨寅亮天地弼予一人端能得宰相之体旁招俊乂列于庻位将以立太平之基好賢毎過於緇衣下士罔遺於白屋况内以囯本未足之為念外以敵情不測之是􅁨陽非衆則􅂚能勝隂文不修則何以濟武神聖以安危注意社稷之䡖重繫公無兢維人大亨以養一舉得垂天之翼兼􅀵耴敗鼓之皮謂昔甞溷於文衡故今復帰於化冶某敢不芸披蠹簡燭照神藜讀黄香未見之書覬聞大道行宣公不􅀒之學願事聖君過此以還未知所措陳右相志存社稷身任股肱宰相以鎮撫四夷莫予敢侮丈夫當掃除天下舎公其誰謂事君莫如以人故在上必引其􅁼王樞宻有仁者之勇以直道而行幾微不見於面顔精神折衝於樽爼忠義有激太山􅅴一擲之䡖議論所加敝帚增千金之重葉樞宻養以剛大動惟直方正色霜䑓甞落李祐之膽决勝籌幄必􅆍淮南之謀謂事君莫如以人故在上必引其類荅梁状元漢延多士䇿董相以天人閩産異才榜歐陽於龍虎雋聲籍甚輿論翕然伏惟状元譽重泉南群空兾北鄊薦屡居於前列士流咸伏其下風繇蘭省以巍登造楓庭而旅試論列歴代則深明治体條陳三弊則咸切時冝有司第其文寘在三人之列天子異其對擢先萬囯之英冨貴行将逼人科第固巳慁子願行􅀁學以報吾君某切與周廬􅀗􅀚大對􅊆晁孫之盛事属灝固之名家第欣首聴於傳臚詎敢妄論於衣鉢都􅀐顧我端繇臭味之同長牋拜嘉輒講報投之好荅許状元克昌欽雅望於月評簮纓世襲冠雄文於䇿士衣鉢家傳輿論翕然雋聲籍甚伏惟状元種學良苦摘詞最工試屡混於諸生不作衞公之恥文四舉於禮部始成韓子之名建茲旅奏於廣廷果能展盡其底藴問當今之務則固悉陳其大体論歴代之治則以為無􅀁容心故事有拘雖屈居於王後大名巳著其誰能與許争行􅀁學以事君踐斯言而正巳佇從仙吏􅈳到蓬山某俻員殿廬欽閲廷對􅀼喜鴻臚之唱首傳太嶽之孫慶熈朝之得人辱都􅀐之顧我銘感謙徳嘉臭水之相同珍蔵盛文之瓊瑶之足報荅丁状元時發廣廷待問􅀼喜朝陽之鳯鳴平地登仙咸羡遼東之鶴化輿論甚羙斯文有光伏惟状元挺秀海陵蜚声天闕文掃科舉之習言懐甽畆之忠以元氣之盛衰喻囯体之治乱論一囯一代一時之政有􅆍明􅆍昌􅃦㣲之風如使生漢文之時諸老其孰先賈􅁩假令居李唐之世有司必不第劉蕡因吾子之敢言見清朝之不諱􅂅攄素藴以事聖君某叨與周廬欽閱大對喜皇朝之得士知天下之有人聴臚唱之傳増縉紳之氣都􅀐顧我譬草木臭味之同長牋拜嘉乏瓊􅅼報􅄬之好荅南劍州王守俻貟冊府誤叨佐譔之榮託庇宗盟重拜朋緘之貺俯慙僥冐仰佩謙冲某太學鯫生東嘉冷族折蟾宫之桂濫厠薦紳泛幕府之蓮􅀗事君子幸迯罪戾荐􅀍寵光燭照神藜與英􅄤之末選書紬金匱專史筆以何堪拜命若驚蒙恩有自某官家傳政學天賦材猷半刺東州􅂓展騏􅂹之足一麾南郡行帰鴛鷺之行不棄故僚曲加厚礼對尺書之面目如見徳容望千里之門墻莫伸謝臆荅温州詹通判尭可􅂬騰梓里共􅁛半刺之賢禄􅀼蓬山􅃍拜朋緘之貺俯懐愧惧仰佩謙冲某官秀挺玉山望隆渤海訓早聞於詩礼業不墜於箕裘先正言居宣政之間凛聞風采賢别乗貳濠温之郡蔚有声名􅀄登戯彩之堂首賛褰帷之治龐士元􅀐􅂹之足庸能乆淹謝康楽山水之州固已改􅀚况聖君懐故囯之喬木而太史有封事之甘棠必起象賢以慰輿論某東嘉冷族西􅀚小官喜父毋之􅀖得神明之吏對尺書之面目如見徳空望千里之門墻莫伸賀臆荅樂清徐令森牛刀􅂯鼓鳬舄遥臨喜子晋之江山得偃王之苗裔首拜朋緘之貺仰知謙徳之光某官天賦吏材家傳政術倦㳺仕路飽諳閩浙之風荐綰銅章盡得温台之地况此樂成之小邑有同臨海之近州吏苟非賢人亦好訟􅁢頼循良之治痛懲貪鄙之餘覩已争先来何太暮某蒙㤙􅀘外需次還郷幸父母之􅀖得神明之吏見書中之面目巳得其人聴堂上之絃􅁔􅂅􅀚其政荅曽知郡汪􅀼第奉常雅資慱約俻貟冊府端藉吹嘘敬􅀚褒借之詞仰佩謙光之徳某官心傳一貫名継三曽學探天人庸止文章之冨才冝䑓閣詎容州縣之淹昔㳺宦於樂成最留心於鄊校經横絳帳躬率諸生遂能於数載之間翕然変百里之俗弦􅁔滿邑化端自於言㳺龍虎成名功實帰於常衮遂令愚繆亦與作成某敢不益勵操修用酬知遇對尺書之面目如際髙標詠雙桂之篇章寕忘盛徳與梁司諫伏審光膺親擢荣陟諫垣方朝廷多事之秋承風俗積弊之後内有群隂之壅蔽外有強敵之慿陵當言者不言而悪人之言巳甞斤立仗之馬今日乃何日而不鍳昔日其可忘覆轍之車兹幸正人進當言路固冝犯顔而首論大事毋用削藳而務為小忠天子以為是諫官以為非言甞聞於前軰君子有所恃小人有所畏人皆望於明公庻幾無媿古者之七人斯能上継先朝之四諫某受知有素賛喜尤深􅂺献狂瞽之言以為蹇諤之􅂇荅賀封贈色􅃤松楸思親不見恩露泉壌拜命増悲媿謝臆之未攄辱賀牋之先及其為感激罔罄敷宣荅樂清洪縣丞蔵詠南囯之甘棠乆思召伯對藍田之鉅竹喜見崔丞朋緘寵貽謙徳加厚某官心傳家學天賦吏材挺挺有祖風翩翩佳公子先尚書承流宣化遺爱猶存賢貳令種學積文􅀒丞何有賛一同之教化継八座之箕裘靡待政成郎膺詔擢某鄊評下士祠禄冗官喜父毋之􅀖得神明之吏視印未乆巳驚鳬鷺之行掃門有期一快鳯星之覩與張侍郎䦨伏審光膺宸命榮貳冬官恃帝幄以横經極儒臣之髙選恭惟某官抱噐逺大禀資直方昔㳺冊府而讀異書首忤􅁠臣而帰故里二十年不調節尤著扵固窮五百歳相逢力盖繇於稽古燕公乃東宫之舊􅇔侯為帝者之師􅂅於論思獻納之時力賛剛明果断之主登衆賢而開治表慰四海之想中興此多士􅀁望於公非小子敢􅀻其貺􅀝湏大拜式慰輿情荅新昌李縣丞結聞諸公交譽􅂅登元礼之門見千里尺書巳識㤗和之面第朋緘之禮太厚􅃱下拜之容有慙仰佩謙謙俯懐栗栗某官元精華胄河洛名家摘光􅃩於唐翰林文固有種探渊源於周天下學豈無傳蚤工五色之詞冝継入塼之譽􅀾則必克恥混試於諸生丞雖􅀒于帥貳令於一邑雅􅀒􅀴綸之業豈淹州縣之劳佇自松􅈦􅈳躋蘭省某方􅀼祠􅅒誤膺郡章退惟僥冐之餘諒自吹嘘之素登㑹稽而觀禹穴雖歳月之不同夢春草而思謝池顧精神之巳接梅溪先生後集卷第二十二
