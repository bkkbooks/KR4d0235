  text: 梅溪先生後集卷第二十
  hash: sha256:e3fa7120a60a32656e4c2e2beb2cb3274044963bd6abd7727ce55d8007993a47
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_020-1a}
body:
  text: 詩李伯時贈英石英石来􅀙並玉堂鈴亝几案􅋍鋒鋩平生性有好山癖䄂得両峯帰故鄊送潜老赴東禅駐􅃬清源十五年月明臺静忽飄然禅心莫為東禅起南北東西搃是禅难弟难兄漢二龔袈裟縫棭各清風渊明巳遂帰田願蓮社行将訪逺公陳提刑挽詞我守桐城公奉祠登堂猶恨識公遲心劳撫字陽司業獄喜平反雋不疑頭白不忘文字楽室清冝作子孫規棣華玉潤皆文傑潜徳幽光發妙詞送陳元龍赴封州教官温陵尊酒偶相逢記得同年舊日容書讀短檠㳺太斈􅀴傳絳帳適臨封清新得句腸生錦瘦硬通神笔吐􅄡莫向炎州嘆官冷行㸔湖海起元龍提舶生日正陽之月慝不作氣候清和滿寥廓階餘嘉瑞十莢蓂墻出新梢半含籜正是生才好時莭化日舒長暑猶薄遥遥華胄馬服君世有功勲上臺閣漢云䑓唐凌烟皆有馬氏象耳孫挺秀生東蜀骨相堂堂人磊落絳帳心潜南郡風銅柱家傳伏波畧􅃱身朝列貳稷官衘命江東訪民瘼雍容敷奏天顔喜小試舶䑓良不悪北風航海南風囬逺物来輸啇賈楽日􅁁知巳皆逹官行矣帰持􅂵荷槖平生徳性不好飲今日夀觴冝滿酌爛柯仙侶年自長不用西山一圓薬得葉飛卿書因􅀉貢院碑大字䧺文照眼明親題一軸􅀉松􅈦千間廣厦能宣力何止區區不􅀒丞貢院之役飛卿与陳節推董之萬桂堂佛囯新開選佛􅂣蟾宫分桂十千章􅀖人種徳家家熟仙籍題名葉葉香地占清光一輪滿門傳盛事五枝芳東堂万万髙攀手莫􅀒君㤙與義方表弟万大年宿郡亝為䑕蚊蚤􅀁苦夜不安􅆍目為三害某􅂺申造物之意諭之以詩萬子㳺清源頗爱風物好胡為官舎中害有蚊䑕蚤嚙衣恣掀翻聒耳倦揮掃跳蟲從何来出􅃿席與藁中夜不安􅆍披衣起呼皂禽䑕磔其尸驅蚊熏以草熾炭烘衾禂蟣虱亦俱薧三害稍稍除髙眠起忘早我時􅃦凝香清夢到穹昊仙官為我言必大有家寳乃翁多隠徳子籍在蓬島天将成就之故以此相惱要令坐逹旦万卷飽探討毋如老外兄不斈首空皓彼蟲􅁼最多生育自洪造尽殺則傷仁兼容幸寛抱萬子䎹我言徃徃咲􅅸倒燔庐相參元失馬福塞老宴安生鴆毒疾患資壽考三害不必除君言近乎道薦新荔支晚年㳺宦到䕫閩四見䡖紅荔子新不似蒲萄桔羊􅀥向来猶及遺慈親大言獨歩郡圃即事有作次韵厭聴桐城雨頻瞻雁蕩雲它鄊見子面好句張吾軍草木心知敬大年毎􅁛賞郡圃花木枽榆景未曛淹留不湏嘆雞鶴偶同群早起老欲􅄬閑尚未成膠膠􅅰􅅰厭餘生方成枕上㳺仙夢忽听窓前喚起声刺桐花􅀄見枝頭万緑濃忽驚火傘欲燒空花先花後年俱熟莫遣時人不爱紅丁謂詩只爱青青不愛紅大年㳺延福寺去歳曽逰九日山忽怱不睱尽躋攀煩君訪我不到䖏好把詩篇載取還提舶贈玉友六言詩次韵以詶重見異鄊佳節又成終日清亝兩歳重午病不飲酒忽捧晋堂双玉引觴澆破愁懐兢渡争飛畫舫賜衣紛集丹墀㪯笔不忘規諌玉堂誰進歐詩歐陽公端午帖子詩云楚囯因讒逐屈原終身無復入君門愿因角黍詢遺俗可鑒前王惑巧言也仁宗日㪯笔不忘規諫真侍􅀙臣覓百葉榴花玉友双瓶不悪錦嚢六字尤清更覓榴花百葉要令老眼增明􅀉陳大諌良翰公居言路望非䡖天下人皆側耳聽方欲携書責陽子忽䎹有䟽論延齡危言巳落奸邪膽正色潜消魍魎形天聴未囬湏力争從兹受責亦芬馨天申節放生夫子釣不綱仁心戒盡物君子逺庖厨孟軻論仁術生魚舎子産獸網祝天乙扵牣文王沼灵徳壽周室唐置放生池天下八十一至今湖州碑輝耀魯公筆我宋仁如天神武而不殺華夏及蛮貊􅆑胎暨化􅊜皆帰好生徳惟恐一物失清源號佛囯此典胡獨缺耽耽舉子場馥馥荷華隰誕節逢千秋􅃬宴遍郡邑何以壽吾君故事修遺逸魚鼈族至微端頼尺水活况兹十畆池中含千里闊郭索行草泥玄夫巢蓮葉長􅂡及衆鱗巨細各儔匹圉圉復洋洋生意俱可必永迯数􅅈􅁨咸􅀍中孚吉中有六六魚聊兹友螾蛭一朝得雲雨龍門変凢質歳早當作霖莫忘池中日送知宗奉祠還越堂堂人物宋宗英来主金枝玉葉盟麟趾化成公族厚棣華詩作争心平金尊對客吟篇逸貝葉談空世味䡖五月仙舟鑑湖去芰荷香裏奏新声緑水芙蕖汎鎮東一觴一詠辱陪公轉頭十載巳陳迹㑹面二山俱秃翁舊􅀮重㝷賀監宅帰㠶遥借若邪風九重側席待宗老願展惓惓劉向忠爱松堂納凉鈴亝苦炎􅀬松竹生晩凉颯然清我襟兀坐興味長我無桑下恋爱此獨不忘願言勿翦伐清隂常滿堂郡亝夜坐聞水車声風伯吹雲不成雨稼穡如焚誰守土鈴亝夜聞水車声遥想田間老農苦汗流氣喘飢眼花厭聞窟中鼉打衙妻兒相劳勿愁嘆多少髙田無水車天二欲警老刺史車声夜入凝香耳四郊苗槁農民悲万壑水乾魚鼈死守臣失聀政事荒誰遣連年坐黄堂自慚不及叚文昌聖世豈有枽洪羊末利花日莫園人献寳珠化成千億小芙蕖使君燕􅆍無沉麝疑此清香自有餘次韵傅教授景仁馬緑荔支玉座竒包未與頒伏波家果忽堆盤冝書蔡譜均称緑不比韓詩止詠丹薦李徒誇碧實脆嚼􅆶未斍水晶寒羡君衫鬂巧相似我坐郡􅈦慚素飡泉州斤事号荔枝厅􅂯次韵両載閩南白盡頒驚㸔異品上杯盤發緘􅀄訝嚢非絳孹实猶疑頰未丹較羙冝同法石白搀先欲占麥秋黄荔支詞云五嶺麦秋寒荔子􅀄丹馬緑比諸荔稍早廣文詩句篇篇好咀嚼令人欲廢飡三次韵荔子新詩屡見頒端同玉局賦金盤坡詞玉座金盤不貢竒包四百年香包盡帯賜􅂁緑孰顆半含仙灶丹西蜀稍多應喜逺瀘戎多緑荔支東嘉可種似冝寒東加無荔支有種而生者疑其不熟乆而自脱乃緑荔支㣲酸好入塩梅􅂦莫作㝷常果飡四次韵蔡譜黄詩乆巳頒不同馬乳堆盆色因不悪故名酒食可成仙何用丹追逐故江相上下比方魁􅂵稍孤寒殷勤百顆分甘意端為詩情合得飡五次韵涪陵妃子謾名園豈似閩南緑一盆㝡喜色同青玉案不妨功並􅂵金丹昼㸔紅􅂵品流俗詩嚼氷霜牙頰寒吟罷閑􅀚右軍帖来禽青李可同飡六次韵年少題詩入否園橫空硬語勝郊盆新吟陳􅂵并江緑深逼蕉黄與荔丹官舎􅂓淹廣文冷雁行髙並玉􅄘寒黄堂病守相将去秋菊落英誰共飡七次韵平生雅意在丘園行矣帰㝷􅀮者盆此日詩盟共君結明年荔子為誰丹欲移仙種栽中土只恐天資不耐寒定向家鄊想風味江瑶斫桂謾加飱得雨復用聞水車韵蛻骨木龍􅁨不雨更喚両牛眠下土農家以架車者為眠牛水從地底飛上田不减在天行雨苦庭中忽見天雨花白衣真人㳺郡衙但願為霖莫為潦免使􅅺䧟羸牛車元旱踰時如魯史一雨已遲淹爾耳農猶滿望苗返魂車亦収声魚免死我持酒戒不敢荒急呼一盃飲松堂不􅁨猖獗有巢昌只恐沈猶朝飲羊呉宗教惠西施舌戯成三􅅸呉王無䖏可招魂惟有西施舌尚存曽共君王醉長夜至今猶得奉芳尊慱物延陵有令孫不因官冷作儒酸珍庖自有西施舌風味堪陪北海尊長記還家屡擊鮮南来帰興日飄然不縁樽爼逢西子始泛江湖范蠡舡貢院食新荔􅀚双蓮因成六言両郡両逢新荔予在夔泉二州皆両食新荔三年三結双蓮貢院池双蓮三年三開酒盞莫辝在手異時同把無縁分韵得両字官舎苦炎􅀬貢闈快虚敞急呼玉友生閑共同僚賞堂成桂植万堤就池分両蓮開花並蔕荔擘珠在掌詩句聽細論塵􅁭發清爽行矣北帰翁山林起遥想雲榭納凉人間正炎􅀬雲榭獨清凉如欲慰􅀺庻諸君冝奉􅀭分韵得冝字榭向雲間築風從天半吹談方以清飽襟更為凉披雄入蘭䑓賦微生殿閣詩􅀝欄􅀚出岫吾去亦誠冝罷官迷懐去矣清源守皤然雪滿顚居官無善政排悶有詩篇朋盍三盃酒公餘一覺眠泉人豈思我我意自思泉岀州宅閏五月二十日官居到䖏郵傳􅀊月驚人電飛惆悵同来徳耀故郷不與同帰寓清源驛両年繆作清源守不到清源洞裏㳺天恐孤予逺来意驛中􅂓許少遲留諸公餞别分韵得人字清源古名郡守土冝擇人胡為不才者両載乘朱輪政拙歳多旱民愁眉日顰頼兹淳厚俗容我老病身乞祠竟不􅁢易郡俄得鄰雅懐上冢願偶有還郷因賓僚共呼酒肴䔩嘉且新展餞選士場語離庚伏辰清風屡吹衣暑雨㣲洒塵􅌐駒沸盈門鸚鵡飛入唇我亦重惜别不辝􅂆酬頻諸君如神魚行􅁬六六鱗斈士倍登瀛郡符同治秦我如倦蜚鳥野性难籠馴舊巢㝷故山一枝老荆榛官居􅁼郵傳誰能乆相親但願各勉力相期作純臣枕上䎹雨声枕上微聞􅀧滴声皇天有意捄蒼坐雖然未作啇家雨巳斍炎方暑氣清聞角声角声巳作送行声更向䔥䔥雨後聴明日出郊聞更逺囬頭忍見二山青復安静堂舊額端明之孫字子強銀鈎鉄畫傳遺芳昔年作郡古平海大筆親書安静堂自從宣和至乹道字與輪奐争光芒一朝忽遭俗眼白毁㓕名姓􅀷埋蔵我来搜訪乆乃獲老兵據為􅆍䖏􅇃滌除五載塵土靣字向堂上増激昻祖為第一孫是似書有家法称莆陽体具万安頗雄壮榜與忠献同翶翔因知文字乃至寳一時之厄庸何傷石鼓文有􅄦神護淮西碑並日月光豈容泯㓕􅁀秦火誰肻檜炙叚文昌書生作郡太迂闊理財聴訟俱非長吾君若問何以治堂復韓蔡祠秦姜今􅅻五日京兆耳眷此陳迹猶未忘但願茲堂日安静名與囯夀俱無疆次蒋元粛韵酒盃三十六人䘖􅂆我殷勤不止三長記白蘋離浙石忍看丹荔别泉南自慚政似陽城拙那得棠如召伯甘見說廣文尤惜别好詩千里送帰驂贈李冝之運幹􅁩謫仙苗裔自非凢家斈端能嗣大參一見便知空兾北三年長嘆滯周南冝之家食甚乆􅅸畦翰墨僕騷可請試言詞􅀝馬堪莫道南来橐無寳一編傳得小雲龕記風閏五月二十六日泉南固多風兹風大為最􅀄驚月有暈忽聽天鳴􅄜蓬蓬從何来烈烈不可柰万竅争怒號三光变􅄀昧掀翻敗墻壁摧折到松檜瓦飄上天半芧捲洒郊外稲吹垂實花果堕未熟蔕山川失故容草木遭厄㑹飛同鷁過宋悲異児􅁔沛孰云楚䑓雄未􅁴周郊大雖然不終朝無乃巳􅀍害嗟予垂素髪濫此張皁盖方􅁨西疇禾未問南海貝時蕃舶将囬以風為􅁨心如韓值􅄓卜効蘇命蔡焚香叩穹吴防患問􅂄艾稍稍雲色定徐徐雨声霈漸停箕簸􅀭㑹見氣交泰居民理破屋老守戒征斾五絃􅁔舜琴一絲詠嚴瀬去矣不待􅆶帰欤及鱸鱠蔡端明祠堂公昔自禁從􅂯来臨此邦河梁一何壮筆力独能扛政績留南紀祠堂枕大江山川與人物今古両無双别傅教授景仁鼻祖調􅅅佐有啇耳孫家業踵前芳万言書有塩梅味千首詩開錦綉腸絳帳詎容淹乆次制科端欲待非常帰囊剰有君佳句更􅀗珠璣四十章贈陳教授正仲讜益友平生􅀁愿親南来深喜得斯人渊源師杜真知体正仲贈予詩云渊源師老杜体制陋西崑而正仲詩殊有杜体人物如平豈乆貧絳帳可能淹教育掖垣便合掌􅁝綸臨行贈我五百字楚壁陏珠未足珍挽令人糟糠情味飽相諳我事耕耘爾力蚕誤走迷途半天下忽驚魂夢断泉南二年旅櫬悲無柰千里途車涕不堪預卜黄華晚秋節佳城帰祔白岩庵贈陳体仁我来守清源徳星識二陳大陳如金玉一室清無塵厭世不肯留至今里称仁儒先賀州守才氣超等倫胷中包古今筆下真有神唾手取甲科齒髪方青春声名滿天下文字驚縉紳劳人暫州縣平歩當要津蹉跎忽至今此志猶未伸真人奉香火䔥寺含悲辛講席延諸生黄卷訶古人異端斥佛老吾道鳴孟荀􅂓籍束脩礼少資嚢橐貧我忝二千石二年牧斯民不能􅂇玉川恥與韓公均贈我詩與文字字皆可珍寵褒恨太過感激难具論願公少自爱行矣當􅃱身門下有髙第庙堂手􅀴綸房魏方得君詎肻忘河汾贈林尉􅃱約紅顔白靣神仙吏好斈苦吟真我徒政事文章有家法它年呼作小龍啚臨行至貢院􅀚桂贈􅃱約竊禄清源愧不才貢闈臨去尚徘􅆦青青万本新移桂尽是梅仙手爲栽宿寂光院青山環繞如盤谷中有清幽佛子家人昔共来今不見数行老淚􅊜􅃄霞陳徳溥以百韵詩送别因贈一􅅸蓮幕㳺從一二年送行越境継前賢陳季常陳後山皆越境送東坡筆頭皆有珠千顆端以少陵􅇪府篇越境送别者七人蒋元肅黄少度鹿伯可趙元序陳徳溥葉飛卿林致約少酌驛舎同僚送我楓庭驛共酌臨分酒一杯我念泉人仍惜别此身雖去首頻回别蒋元粛符竹南来識廣文􅀴横講席見渊源凌雲詞賦勝三賦醫囯忠言壓万言元肅甞作二賦十議陳迹互将文字記交情更向别離論君方騰蹋吾衰矣名節相期百世存題莆田林氏双闕唐室遥遥孝義門屹然双闕至今存當時泣尽思親血化作㤙波遺子孫過頭陁九嶺宿天玉楼林二招提因成三􅅸凌晨飽飰渡秦溪飯溪一名秦樓要上青山九級梯不使甌閩隔人世頭陁力與五丁齊千里帰塗險更長眼中深喜見天王從今漸入平安境舊路艰辛未敢忘我如倦鳥欲栖林喜見禅僧棲䖏􅀷家在梅花小溪上一枝􅂓慰北帰心宿五􅄘院万法由来揔是空五􅄘名在本無􅄘我来遥作廬山想􅀮約夕陽開䖏遲饒州芝山有五峯亭望見庐山峯也范文正公詩云五老夕陽開贈亮首坐雪頂厖眉八十餘五峯􅀷䖏結精廬閲人老眼能青白贈我嚴公一軸書王成之太慱􅀉詩病中未能和謾書二十字以詶老病欲納禄君㤙許奉祠已為三􅈳計誤辱廣文詩司理叔文和過万橋詩復用前韵少年一夕九起嗟家貧親老無生涯河東先生獨青眼慨然許我修通家三十年間同轉首王謝依然作甥舅時人咸􅀏孺子貧杜老惟蒙丈人厚罷官閩嶠􅀄帰来登堂又荷傾金罍詩誦白圭感前事情鍾我軰䘖餘哀定向清朝力求退呼賓剰設􅃊冬鱠從公杖屨鹿岩前明月清風趙歐㑹挽令人知汝莫如我傷心不尽談忍貧猶好施見得可曽貪水陸同艰險糟糠共苦甘和鳴三十載一夣断閩南之子有賢􅅩鯫生誤受知㤙蒙夫子妻事􅁼白圭詩黄巷悲吟夜青灯照績時竟孤偕􅀮願徒切悼亡思我欲誌諸墓有言何敢􅀻如賔最相敬無妬似知詩孝合從姑塟賢冝舉郡悲明朝是重九忍㸔菊花枝梅溪草堂新闢缺少花木効少陵故事覓之以詩小小園中十八香主人㳺宦遂荒凉名園草木多竒品分我餘根種草堂閑中那得買花錢孤􅀒桃紅李白天拈出向来花䟽目招邀春色上詩篇夣齡弟生日十一月二十二日周正猶餘八莢蓂昴星下應一陽生貌和冬嶺松俱秀神與梅花溪共清定享百齡如衞武預開三􅈳斈渊明弟兄此去皆華髪無惜更相薦夀觥可公禅老住泉之九日山二十年矣予臨罷官求去甚力復為後政􅀁留􅀉詩詶以一􅅸泉山好䖏􅁛延福白髪禅僧去復囬且與晋松為􅀮侣莫同英石便飛来可以英石見􅀉号飛来峯黄伯厚得蒲墨折而為三以書来易戯成二􅅸不謂一子墨忽成三客卿君家好兄弟􅂦立並馳名好去文房寳堅剛冝自持吾家蔵有尽黄子翫無時姚宰行可和詩索墨詶以元韵武城民事暇著述似虞卿手握陳玄軰磨成不朽名人生㡬丸墨老病厭操持好與賢明宰研磨共救時松筆我有文房寳莫如毛頴清来從丹桂窟封以五夫城軰行惟􅊮管宗盟是墨卿湘東謾三品無此􅀊寒名題净名院二􅅸净名􅁍見老維磨謂長老顔公道眼相㸔語不多我待衣冠掛神武杖藜来此老岩阿谷中有月露蛾眉水織珠簾更􅅸竒滿目峯峦􅀚未盡有僧携紙覓題詩梅溪先生後集卷第二十梅溪先生文集卷第二十行状東平萬府君行状君諱世延字叔永世為温之樂清人曽大父惟􅁥大父周父鴻皆晦徳不仕君㓜警悟敏記誦􅀄屬文思捷而佳為師友所竒年十四而􅀌奉母謹甚䖏家事􅀂成人舎法中游郡庠業修行􅅚蔚為善士宣和間邑大夫興鄉校以鄉先生鄭君􅀖彦主之鄭學術淵粹為時名儒從之㳺者以百数君一日謁同志㑹其課諸生戯即其題渉筆而就鄭見之撫几歎曰之人詞藻如是一第唾手取尔然君以兄弟終觧志顓甘旨訖不事進取抱才不試鄉人惜之性寛慱與物無忤􅀹善宗族毎先其急難遇長㓜慈愛均壹無纎芥嫌􅂩族衆多間有違言君周旋其間開釋以理衆皆媿服恊比如􅀄由是闔族内外咸欽而愛之􅁛為長者善治生蓄而􅀎散親故有不振者毎綱紀其家其弟子有羙質困不能自業給飲食師資費以教之䖏女貧無以歸躬為擇配匳而遣者凢数人居之左右細民寠族資衣食埋􅌾者數十家緇素叩門随所謁而􅀗者叵計􅀊凶廪飢毎為冨室倡敕具以舘賔席無虚日也篤於教子嘗葺屋数楹諸書其間厚禮以致名師訓督􅀧竄之劳率分其半長子庚最羙才始冠㳺太學君勉之以詩曰莫放山虧簣終教井及泉庚益自勵果􅄖中攷選連預薦書屢為多士先聲譽籍籍用上舎免省登進士科次子庠亦以妙齡預鄉貢萬氏以絃誦先里閈歴四世儒冠益盛業賢􅀜舉進士者數人登科第自庚始樂清自舎法罷閱二十年無舉於鄉者里巷靳之邑人復取鄉貢自庠始先是􅁥察御史睢陽李君藹扈駕南巡聞君有鄉譽訪其居名其軒曰必大且賦詩極言之至是二子俱有成人以為榮咸謂君種徳樂教之報且嘉李之先知君夙有喘疾晚歳弥劇瀕死語不亂巍坐正色而卒實紹興甲戌十月二十有三日也年五十有八鄉里聞訃無不傷嗟􅀄娶孫氏先君二十四年而卒継室以趙氏子六人庚左迪功郎䖏州縉雲尉次曰庠曰􅘙曰廓曰庻曰唐孫男三女二庚與庠既以儒學名家餘皆服義方其進未量鄉人以君有隂徳且多男子比之燕山竇氏恨其不足於夀不􅀗盡見云君仁而好施志於濟衆者未艾也嘗割膏􅃾三十畒儲其入以濟親戚之貧者死之歳語諸子曰吾爲是恨未廣自是而後冝資其人􅀊一易之庻㡬悉周且枚舉其所當與者家之西距大江實爲要津勢湍而惡渉者病之君叔祖東平先生始傾家資跨江爲橋濟人於險垂六十年徃来蒙其利俄一夕燼于火東平子主簿君􅁒新之未遂而卒君毅然以橋爲任然事艱􅃥鉅既捐巳資以半其費又經营其餘於鄉黨間以佐之橋成有日矣而君卧病彌嵗屬纊語不及他顧謂諸子吾以橋累􅀂䓁矣諸子涕泣請継志頷而􅉂君雖早厭􅂣屋未嘗廢書毎開卷意有􅀁㑹必標識以謹不忘所為詩文雖不多皆平淡造理峻㓗可愛􅀹屬意於簡翰雖貽子弟不率然作也卒之又明年諸􅀌卜以春正月十有九日􅌾于岐山之隂泣血相謂曰吾父以善人君子􅁛于鄉其􅇓徳有足書者将乞銘于薦紳先生以永厥垂冝得之其詳者状而授之庻乎其不誣以屬某某萬出也毎登門辱顧為厚且與庚同舎上庠又􅀗與諸子游盖知其詳而不誣者雖蕪陋其何敢辭謹状張府君行伏君諱端弼字廷直姓張氏温之樂清人曽祖迪祖孜父瑀世蓄潜徳不慕禄仕君資俊邁好學問慷慨喜議論敦尚氣節偉然男子也舎法行肄業泮宫月書􅀊攷累成優校以行藝職學事領䄂諸生曄曄有聲侵㝷於仕􅂗矣㑹更科學子觧散君歎曰仕與飬不􅀎兩全浩然懐帰奉偏親以孝聞􅀄先業夫廣重以兵火業寖㣲君通材經畫有條未㡬生事大振冨甲鄉邑然雅重義槩耻為俗子冨務周旋宗族親舊有以窘告濟之無难色邑學再建與出財力居多仍率先割膏􅃾以養士毎􅀊之春發廪以賑窮民質貸踰年不􅂑其息有􅀒責者多折劵不復問性楽善里人有登第者喜如已得閔其貧毎資給之雖萬金不吝也好賔客坐席常滿極飲不倦杯行徤語􅀏年雖及而銳氣不衰所居地為邑之属鎮間有不逞曹聚讙譟君凢諭以理有不肅者張目掀髯厲声叱之咸股栗畏避威不以􅀔人􅀹难之喜教子姪命師友必以賢荅以殊禮闢廬舎規模宏壯或謂君有令名何室之羙曰吾非以自奉也為他日子孫容車馬㑹食客之地爾其心期如此飬髙閭閈足不及州縣未嘗以姓名干典謁汙訟牒士論韙之聞有巧造請捷犇走無日不數於公門者心鄙薄之常舉為後生戒晚景益曠逹不以財利經心見為善者喜見顔間譽而勉之以親志好佛二弟俱從空門學為飯萬僧開義井以侑善云疇昔少有疾預知死期一夕牡丹冬開人以為祥君謂花非其時對之悵然賦詩見意旣而感疾朋舊問之談􅀏如平時俄盥手正衣冠偃卧而逝實紹興二十四年十二月五日也享年六十有六子二人攄挺皆業儒女三人長歸進士宋翰餘未嫁君挾􅀁􅀒氣盖一時俛首田園非其志也毎觸事感槩興懐學有經術􅀹䆳於易少以事進取既蓄而不施行所學於家䖏利害得䘮之際􅁉如也識者謂其詣㡬深之理好商榷文史工詩童語逸意新有作者風君於鄉黨為前軰某􅀄稔其名未之識也一日過桞川遇焉不以後進見鄙欣然命舟同泛而歸既登堂􅀗奉文字飲於顧遇不薄矣君􅃿之明年諸􅀌卜以十二月十一日塟于里之桂峯祖􅉷之側長子攄以書来告曰子於吾先君有一日之雅宜狀其行吾将乞銘於立言君子以蔵諸幽以垂諸不朽其謝非人至于三不􅀗命遂采諸鄉評編而次之謹狀賈府君行狀公諱如訥字元辯其先福州長溪人五世祖徙温之樂清曽祖皓祖靖父奭皆有􅇓德不仕公温雅愷悌持重寡言為児時嶷􅀂成人十二􅀊而􅀌事後母至孝撫育弟娣恩意均壹毋病涕泣嘗藥及卒執䘮如禮伯母錢性嚴子姪有過必痛绳之公善承順未嘗忤意在諸子中最以謹厚称􅀄伯父奕以絃誦先里閈從兄弟愚如晦俱美才有声庠序間公􅀹􅄝學毎謂弟如石如規曰吾二兄才名如許􅀂等可不自勉耶以身率之故二弟皆力學能自立如規既冠學益進公勉其游太學且躬任其家事厚資給之務成其志及舉進士捷音至時兄如晦同戰藝公意其俱中喜甚既而聞其不利鬰欝不樂賀者方集公郤之曰吾兄親老方籍此以尉其意今見黜何賀我為人服其不􅀻如規今尉建昌軍廣昌縣以德譽取重縉紳公之教也公善治家井井有法不務兼并而生産日肥性仁慈􅀹睦宗族見貧者心憫之常發廪以濟毎言彼吾宗也吾忍獨温飽也有􅀹窘者四族人以膏􅃾三十畒賑之仍給榖暨牛資其播殖又百畆飲僧徒之徃来者及分恵里人之窶者凢割田二項餘而金榖之惠叵計謁丐踵門必周䘏之至觧衣以贈其敦宗好施盖天性也鄉人燕其宗耻以貧賤者與公曰是豈两姓耶毎家宴合踈近長㓜貧冨均禮舅氏家不振悉力瞻之􅀊時登其門省事如父母去必感泣舅卒厚禮以􅌾公素友愛兄弟異居非其志當析財命宗人區䖏未嘗顧視務推遜以化媮俗季感其德復義聚至今樂教于弟屢延致名儒厚其禮終始周旋之喜賔客舘無虛日雅不好飲遇賔醉則為之極􅂬敦尚禮法遇人無厚薄必盡恭泛愛鄉黨至所交必擇長者寡􅄝欲不好殺喜與釋子游談無生之理務忘身世不幸嬰痼疾仁而不夀享年纔四十有二以建炎三年五月九日卒遺言有􅀻􅀒者悉棄之逺近聞訃無不涕泣娶同邑陳氏䖏士景芳之女姿婉淑奉姑以孝謹称始奩具頗厚公喜周急而夫人不吝故公得以􅀻田活其宗數百指隂德在人為多盖夫人之􅂇云後公六年而卒年四十有九男一人曰循以業進士克守家訓與季父同居㡬三十年服勞不憚鄉里難之女一人歸表姪王某孫二人公與夫人䘮乆在殯弟縣尉君嘗言吾兄嫂事吾毋盡孝吾當擇地改􅌾吾母以兄嫂祔焉屢以卜後得邑之左原其崗維􅁻躬治墳塋以奉窀夕絽興癸酉秋循似泣謂某曰吾將以冬十一月十有七日合塟吾父母􅁒丐銘大手筆以發其幽光子盍狀之某不侫􅀗以通家于自㓜登公門荷知遇不淺及公殁又辱爲子壻知􅀮徳爲詳嘗訪遺事於故老咸曰公仁者也今無是人矣某遂撰次所聞俟賢而有文者書之謹狀周府君行狀公諱瑜字公寳先世姑蘇人也髙祖避五代亂徙居于剡曽祖荀祖惟父過皆不仕公爲人純厚質直介然􅀎自立以孝友聞于郷治家有法遇長㓜以禮閨門之内肅如也宣和中魔冦犯邑人倉遽犇匿公獨擁親柩噭號声徹閭里冐兵刃扶護以畢窀穸朝夕悲涕不忍去墓側兇徒相戒曰無驚周孝子賊平卒無恙公喜儒學嘗闢家塾數十楹延四方名士以淑諸孫又製夫子暨十哲坐象􅀞七十二子於一堂俾崇奉之大書其側曰爾其親師友之淵源就功名之烜赫浃日必設具以集之親䆒其能否有勵業者喜見顔間面加􅅄諭兾其成就稍怠墯則諄諄戒敕俾之自勉由是咸自力于學紹興庚申秋孫汝士預薦書乙丑􅀊世修肄籍大學丁邜秋汝士汝能世則聮名郷薦明年汝士登進士弟鄉人荣之公喜周急視飢渇者如巳毎盛夏分命皂􅀠當徃来之衝烹泉以救暍窮冬集境内飢民施以金榖遇􅀊歉發廪賑貸命諸子悉寛逋􅀒剡之南有鉅溪實為要津行者病渉公首創浮梁以濟其子􅁇之至今蒙其利􅀄先君􅄝佛公嗣志弥篤凌晨焚香端坐披閱蔵經歷四十寒暑手録因縁幾百卷毎以所得語諸子借示􅂆戒剡有名刹遭兵冦燔毀兼餘公割巳貲一新其棟宇時􅀻第猶未築家人以為言公曰兹邑人植福之所渠可後耶僧徒德之祠公于佛舎旁欽事以報公又闢别舘飯貧士及緇黄之流滋乆不厭其樂善好施出於至誠􅀄不求人知而称道者不容口其見重於人如此公狀貌魁偉見者以為異人自中年鰥居不􅂯娶屏􅄝慾務飬精神平生未嘗服藥旣老顔如嬰児視聴不衰好事者争􅁒求見以叩飬生之術晚苦足疾諸于和藥以進公郤之曰死生命也何以藥為児女涕泣以請恝然弗顧㑹孫壻髙世絪以赴調告違公曰吾某月日行矣至期沐浴易衣而坐神色如平時謂諸子曰吾即行􅀂軰冝自勉言畢奄然而逝實紹興二十一年十一月十有六日也享年八十有八公薄於世利􅀄以勤儉自守不廣貲産自諸子既壯悉以家事付之積數年冨甲一邑公視之恬然不以經意晚景門䦨益盛身夀康寕毎􅀊旦暨誕辰讌坐髙堂子孫詵詵環列戯綵甥壻無慮數十人争先為夀剡中以周氏為慶門言五福者以公為備公娶里人孫氏先公三十二年卒男三人長仁承節郎次侁承信郎婺州永康縣􅁥酒稅後公一年卒季億先公七年卒女四人長適同邑呉宗次適劉陞次適房先厚次適過諤其夫皆早死諸女孀居終不改志男孫九人世光汝賢汝士左從政郎汝弼早卒世修汝􅀎世則汝礪世南皆業儒女孫六人長適同邑進士盛卞次適泰州助教過焌次適成忠郎通州支塩髙世絪次適進士商汝霖次適右廸功郎徐與䕫次􅃴右修職郎潭州醴􅁜縣尉姚寔曽男孫十有二人曰之元之純之文之綱之彦之茂之竒之翰之才之望之邵之羙曽女孫十有二人長􅃴進士史之才次􅃴左迪功郎明州慈溪縣主簿陳嘉善餘尚㓜某無似􅀗與公之孫世修同舎上庠道岀剡溪嘗登公堂􅀗承謦欬之餘他日􅂯至而公逝矣癸酉秋公長子仁移書謂某曰吾将以十二月十八日塟吾父于邑之方山郷馬鞍山之原祔先夫人之隴也子辱與吾児㳺之其平生之詳願狀其行吾将乞銘於士大夫以蔵諸幽某辭鄙陋不􅀗謹撰次所聞如右謹状潜澗嚴闍梨塔銘師諱䖏嚴字伯威姓賈氏温州樂清人也父靖居郷以長者称毋萬方娠一夕夣黒龍自天躍而下俄化為道人入其家及産師有異相㓜警悟不凢經史過目輙成誦舅東平先生規邑之名儒也試以對随口應荅大竒之少長忽不茹葷毋強之卒不從一日游精舎歸白其毋曰児􅂼食居俗非所冝願出家學佛惟夫人割愛遂往里之明慶院禮僧知性為師既落髮受具游歴郡刹􅀄學律未幾習天台教􅀚􅁣然歎曰吾􅀖僻在海隅見聞不廣遂之錢塘依南屏臻公聽天台大部明法華諸經時學者尚編録務相詰難師􅃪法罷端然黙坐同軰問之發明師􅀃了無遺誤因謂之曰文字分别馳騁法相吾不䏻為遂逺游禪林訪先軰老宿叩擊玄旨師志節髙學識超邁杖錫所至道眼相契為多㑹有以座首命之者師曰吾宅心名利外兾逍遥自適詎􅀎為人􅃥耶於是西游帝都􅀚伊洛南周旋江淮間凢名山水叢林巨刹靡不至時道潜思聦二僧與東坡居士游聲名籍甚咸與師善數以篇章徃来師􅀶學詩文􅀹典重且工書有晋宋法或􅂆以所作謁縉紳求知已師咲曰古之桑門上首與士大夫㳺非求之也道自合焉爾故終身不以一字干謁識者髙之元祐間還永嘉寓净光大雲開元諸寺其徒翕然歸之扣門請益者屨相躡也師訓以本業外復以詩書子史􅋚之凢經指授者咸見頭角時開元建護國天王殿命師作記文辭雄偉太守范公見之称歎良乆命刻石行于世元符􅀄歸故山誅茅結廬循除蓄流自號潜澗賦詩鼓琴以自娱有古人林下風師有辭辨長於講釋郷里巨室􅁒屈師講經莫䏻致因具法筵集廣衆預設巍座俟師至與衆迫之師匆遽就席闡楊奥旨縁飾以文音􅄍鴻亮聦者驚恱明慶自創業㡬七百年無文蹟可攷師首為撰記并書之時􅁛二絶郡守張公平聞其名以禮致之躬受楞嚴大義􅀄以僧正命師又命主禅席皆力辭之毎詣府手提一笠未嘗肩輿人以師為府座所厚因屬以事師正色峻拒府政有不便於民者委曲以告守改容􅃪之瑞安令吕公勤自號湖海道人邂逅師喜甚與俱還邑築庵於􅈦治後園命師居之為留三宿而去邑令丁公湛毎訪師談道終日忘返晚景絶人事惟精修净業喜諷誦楞嚴圓覺維摩光明法華等經精熟如流静夜􅀌坐焚香暗誦琅琅之聲出于林表嘗手書法華光明二經以報母德又書華嚴經八十卷首末不􅈈字法益工弟子宗要游學姑蘇俄以書督其歸未㡬師得疾遽終政和壬辰正月二十日也享年五十四僧臘三十九至三月闍維得舎利數百顆明瑩如珠明年九月植塔於故廬之後以遺骨并舎利􅌾焉師於佛學無不通曉􅀹􅀷於禪而接物以教故以闍梨著名平生製述甚多藁随毀失圓寂後弟子􅀵拾遺文編成二卷人有得其片紙皆寳蔵之其文翰見重於人如此弟子宗要師號寳印傳天台教住永嘉之妙果克世其業法孫德純亦傳法于郡之龍翔某大毋氏師之同母娣也寳印師盖某之叔父師殁之􅀊而某始生自児時稔聞德名恨不迨見今四十餘載矣始􅀗以叔父之命銘師之塔不敢以鄙陋辭銘曰師之道儒律禪教咸臻其要師之技歌詩文翰咸極其致師之節公卿大夫不屈而謁師之訓子傳教􅀚孫傳心印師之廬左琴右書山髙澗迃師之塔明珠遺骨千古不滅梅溪先生文集卷第二十
