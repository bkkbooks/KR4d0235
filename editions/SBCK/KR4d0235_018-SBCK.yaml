  text: 梅溪先生後集卷第十八
  hash: sha256:394ed8a855720569d0bdcdab2c6bcf3ba500c181f990daa42a64d7394c87ef2d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_018-1a}
body:
  text: 詩修戒石曩在䕫府修戒石作柏梁体今郡庭戒石痺陋葺而新之貢院㑹同官以䕫府前四句分韻得尔字君以民脂膏禄爾大夫士脂膏飽其腹曾不念赤子貪􅁀以自誅誅求不知恥指呼有鷹犬嗜慾肆蛇豕但言民至愚孰謂天在邇昭然甚可畏殃必反乎爾聖訓十有六簡􅃊具天理大字刻山骨朝夕臨坐起一念苟或違方寸寕不媿清源庭中石整頓自今始何敢警同僚兢兢惟勑巳知宗送玉友酒鈴齋晝􅃦夢􅀄醒忽見雙􆁬眼欲驚誰送瓮頭新玉友人言天上老宗英林􅈇世傳贈莆中荔子名状元紅分送陸倅陸有詩次韻林名孝澤譜中不見見屏中州宅荔支屏風中有此名蔡譜無之正與花王雅目同牡丹亦有此名别駕破荒吟好句少􅁜詩裏擘䡖紅提舶送荔支借用前韻舶䑓丹荔新秋熟風味如人自不同名字未安真缺典從今呼作馬家紅舊已有名馬家绿者州治有忠献堂以韓魏公始生得名廢扵俗吏更以清暑今復之相出相州生此州巍巍勲業宋伊周後人莫要䡖更改别有堂名勝此不六月二十五日㑹同官于貢院用前一􅅸分韻得相字天作元聖配東坡􅀕公文天生元聖必作之配公非淺夫相荆公詩骨相知非浅丈夫乗風来帝旁捧日到天上兵戎在呼吸端委見力量三朝社禝臣勲業誰軰行堂堂囯伊周勃軰安敢望慶暦聖徳詩可属大事重厚如勃清源始生地風土至今王釋氏從何得抱送真不妄事具行状好事榜其堂嘉名無以尚何人􅂺更改有識為悽愴端同聖削迹又􅁼元覆醤思賢舊􅀚復聞風懦夫壮堂上生輝光如公名始唱公唱名時日有五色姦骨死猶寒如公昔為将􅀞象出貂蝉疑公尚亡恙平生蓼莪心眷此應不忘嗟予生太晚不識天人状版啚猶未復晝錦無由訪維揚金繫腰歎息為誰放一麾忽南来遺迹增慕嚮當扵異夢䖏祠堂為公創公生時毋有異夢新第先帰者五人燕子黄堂故事也酒半啜茶于忠献堂持盃以􅂆即席贈詩四海英才入網羅清源龍虎姓名多􅀴魁蘭省得人傑䇿射楓庭􅀵甲科奎宿呈祥前未見緯星還舎首相過一盃忠献堂中酒名節相期要不磨冩真自題顔蒼髪白少精神傳得泉南老病身莫著金章著蓑笠丹青冩出更湏真士昭贈寸金魚子三印子魚猶未食寸金魚子􅂺先嘗郷人得得分鄊味轉使鄊心念故郷贈第二人石察判起宗䇿冠諸儒巳奏聞不妨居次避平津坐看万石門闌大居万石坊轉覺朋山氣象新黄卷更窮稽古力青雲莫􅀒致君身試􅀚忠献堂中像亦是當時第二人荔支七􅅸陳紫端明品第首推陳花裏姚黄是等倫郡圃一株􅁛小􅂵故家風味自宜珍興化所送及郡圃所生者皆小紫也江緑枝頭已熟疑非熟蔡譜江家緑荔支真與泉南人物􅁛果中猶作亞魁推泉州自龍虎榜以耒多出第二人江緑在譜中為第二皺玉莆中皺玉價傾城品第吾何敢妄評只􅂲此非真皺玉果然是玉亦虚名大将軍荔支名字大紛紛􅀁見多應不逮聞别有深紅覇群品郡人呼作大将軍郡圃荔支以大将軍為冠玉堂紅天教尤物産閩中名字深竒日不同顧我素􅁛田舎子如何敢㗖玉堂紅奪先紅林囯正虙見贈因以詶之林嘗魁別頭閩中荔子說莆中闕下竒包又不同正向鈐齋想風味奪先人送奪先紅七夕紅宅堂荔子無名字自我呼為七夕紅記得去冬􅀄到日家人指􅀣語衰翁貢院垂成雙蓮呈瑞因成鄙語勉士子大厦垂垂就嘉蓮得得開双双戴千物両両應三台泉南双蓮凢三開矣􅂬意重重合香風比比来人人冝自勉舉舉有廷魁梁魁登第沣宫有双蓮之瑞陳賀州賦双蓮詩不言祥瑞次韻以酬紅蕖明鏡兩鮮鮮中有双頭更頴然天産人才兼産物公祥和氣不祥蓮耻談子厚表中瑞肯詠章安橋畔篇何日相呼登㤗華来華食實藕如舩楊公濟水嘉双蓮橋詩云昨日采蓮者双双橋畔新舊花今不見喜見似花人楊集號章安郡圃有荔支名白􅁡者孰最晚戯成一絶紛紛􅉕采百花帰􅁡在枝頭竟不知造物要令甜在後時人莫訝孰何遲送王提幹渷昔年王儉容今共阿戎㳺嘗薬子當去請祠予欲休過從都幾日離别况逢秋帰上双親夀􅂗中莫逗留􅀚貢院􅀞春景圖梁棟翬飛氣象新􅀞工妙思亦通神要令寒士皆春色四景之中獨􅀞春韓魏公生于泉南州宅故未有祠扵典為闕郡圃有庵名大􅀮即之以祠八月戊子率同僚祀之天開我宋太平基􅂵府真人下應期河􅃋魁梧出真相泉南葱欝産竒兒夢符蚌腹生珠夜事應台􅄤捧日時􅂵㡌清源發光采郡園􅀷䖏立新祠陳提刑永仲以清名室志先徳也詩以羙之名孝則龐公嘗有言我獨遺以清賢者扵子孫􅀁遺良不䡖頴川老龍公落落前朝英帝命作南伯清徳如廣平宸翰一字褒不啻華兖荣是以自賢孫持節蜚英声結蘆桐城隅室以清爲名仰不􅁰厥祖俯能規後生我来聚星地喜見此老成公清不自言藹然著郷評時焉訪其室鄙吝不敢萌如覿任棠水似濯滄浪纓􅂅移清室風于以清寰瀛樸鄊釣􅀮圖蒋元叔名所居之地日林鄊􅀞啚見示爲作是詩君不見少陵先生詩有說淳朴之䖏山川别廣文示我朴鄊啚山水髙長景竒􅅸嚴坂疑爲子􅁜􅀮昆溪想自崑崙决漁人欵乃山水間抱璞含淳釣清㓗九仙高舉留遺躅三􅈳名家岀人傑早将朴直取巍科行展朴忠立竒節鳴琴百里邑既以朴化民横􅀴泮水宫又以朴誨人他年致君尭舜上坐使風俗俱還淳功成名遂却帰去漁釣重尋舊􅀮淪廣文􅀏我言公朴甚我朴聞公家左原四面擁山岳迴􅀮如愚溪窈􅀷若盤谷人皆朴其貌公又朴其學君子以爲古先進扵礼楽公郷真朴鄊胡爲不自覺􅂅公著􅀮眼帰尋舊盤旋酌酒梅溪上把釣蓴湖􅁁更􅀞左原山水圖與此朴鄊圖並傳天下大朴散巳乆二鄊猶在羲皇前八月十五日貢院落成賔僚咸集斥世俗之楽不用飲文字也把盃邀月誦香滿一輪中句即席賦詩以勉多士揚輝秋月懸青天今夕何夕光更圎瓊為楼䑓玉為宇廣寒境界移清泉月斧雲斤天上手萬間突兀摩星斗白頭郡守呼衆賔共飲落成文字酒龍虎群仙上界還手移桂種栽泉山千枝万枝香不断人人有分行當攀姮娥慇勤􅀉消息科第要從勤苦得丹桂在君書卷中不湏遥向蟾宫覔送薛士昭相逢一咲慰衰遲問政論交両不疑直諒多聞三益友清新俊逸百篇詩􅆶猶未及去何速橘已成懐喜可知一薛居州非易得危言行見造朝時記得祥符識面時回頭二十二年非羡君學似川方至顧我身如鳥倦飛老境天教重㑹合異郷心最惜分違雁山親舊如相問征雁帰時我亦帰爱松堂前有緑竹一叢可爱旁有鷹爪花頗碍眼移去之􅈧前栽植不冝繁松竹相依妙意存不許閑花放鷹􅀲要看高節迸龍孫提舶送菊酒有詩次韻入日鈴齋午睡夢魂驚僮僕􅂬呼洗破觥酒是爛柯山下法詩如藍水坐間成謾同陶令浮黄菊也勝蘇仙嗅落英蓬鬂䔥踈對佳節因公撩起故鄊情九日登雲榭九日無悰􅂴出関強登雲榭望泉山傷心不忍㸔茱菊蓬鬂䔥踈淚􅀧班十日同知宗提舶㳺九日山延福寺十日同㳺九日山山中好䖏畧躋攀桑田改変松猶在車馬徃来心自閑昨日風應吹􅂵㡌今朝菊已帯衰顔登臨􅁛愜南来意好逐飛飛倦鳥還御書閣黄龍溪上祥雲覆􅂵㡌山頭瑞氣蒙俗眼驚傳佛光現不知宸翰在山中思古堂孤嶼㳺人思謝公天台禅客亦思豐囯淸有思豐堂黄花境界誰思古堂在􅃄霞縹緲中善利王廟有徳扵民廟貌崇我来端為謝年豊曰暘曰雨皆神力不止南風與北風晋時松孤山陳伯巳物化九日晋松猶後生欲問東南両朝事風枝瀟洒侣談清秦君亭山中髙􅀮欲逃名不謂名随􅀮䖏成鑿石一泓詩􅂾首也曾攻破五言城姜相峯相囯忠如宋廣平危言流落晋江城天資自直無心賣何事青山亦得名明皇謂宋璟徳宗謂姜相皆有賣直􅂑名之語無名木一木蒼然老更竒肻将名與世人知我来不具知名眼深愧平生不學詩姜秦峯舊在延福寺中後易之立前守生祠而迁其像扵西山石佛之下前守乃改忠献堂額者郡矦不識囯元勲釋子那知姜與秦􅀮士有靈應撫掌相公死亦不容身陳公祠名偁字君舉九年地主百年祠民自元豊結去思善政在人冝有後堂堂忠粛見公兒蔡端明詩賢矦去乆迹猶遺乞雨詩竒字更竒世俗妄論公政猛爱民心有彼蒼知石佛卧草埋雲不記秋忽然成佛坐岩幽紛紛香火来求福不悟前時是石頭聚秀閣清源山逺水流長九日溪山更異常髙閣摩雲聚秀氣禅僧秀氣聚中蔵提舶送岩桂晋堂岩桂晚秋芳濃緑枝頭萬粟黄堂上主人分贈我要令燕􅆍有天香􅀉南安鹿宰何字伯竒予比至延福訪姜祠則迁于他所問姜相墓則曰不知也以語南安宰鹿君越数日南安見訪云祠巳復舊墓亦得之且修治矣惟秦君亭未葺蔡端明詩将與壁俱圯而不知護因􅀉南安春秋重復古二賢還舊祠直道不終廢髙風冝見思古墓出荆榛孤亭起頺􅈥更将碧紗籠覆護端明詩貢院圖節推陳徳溥董貢院之後既成畫啚見示因作是詩陳君少年登甲科紅蓮首泛清源波清源貢宇髙嵳峩同僚宣力陳君多鞭朴不施成不日首夏上梁秋半畢一􅀧靈䑓輪奐飛十幅生綃􅀞圖出蒼蒼嘉木森千株新堤歩歩穿芙蕖移下蟾宫古丹桂種桂飛来海上真蓬壷他年君来作地主記得親曾視斤斧雁過山中􅀉我書要知多少新龍虎去年去年今日别吾家我鬂蒼然爾未華日佀去年人不見鬂毛白盡眼添花不求人一名如意牙為指爪木為身撓痒工夫佀有神老病不䏻親把握不求人又却求人興化簿葉思文吾鄊老先生也比㳂檄見訪既别􅀉詩二十八韻次韻以酬莫年初仕􅂗暇日但書䇿儒生餘氣習筆端事揮斥政學両踈繆篇章稍沉溺楚東㑹詩豪酬唱奏金石逢􅂣争出竒遇險或遭厄忽泝三峽流遥􅀴数州驛廬山看末足巫峯過尤惜西郊祠卧龍東屯弔詩伯飛飛猶倦鳥秋風送帰翮同行得嘉友鏖􅀾交􅄡鏑弛檐白蘋洲天日去咫尺忠􅁩懐魯公覇業悲頃籍湖州設􅈦舊祠項羽奉詔還故鄊齒落肌瘦􅇤涕泗拜松楸荒蕪翦荆棘心期樂田里誓不綰銅墨橐雖無陸金帰幸全趙璧陛下忽誤㤙泉南又分職入閩如入蜀枯腸復􅁳索腰縁病减圍髪為悲添白風仰秦君髙節慕姜相直悪語誰流傳同僚誤刋刻吾鄊老先生吏事以儒餙新篇似庭燎逺􅀉箴我癖把酒欲細論何時再㳂檄陽春七十首老􅃩萬丈射招邀屈原魂􅀵召子厚魄驚開老病眼喜見墨妙蹟􅂅公倡斯文用夏变蛮貊近世作詩文者多溺扵異端之斈正頼郷先生痛革其弊送陸通判劇郡元非老手便庻民安我貳車賢二年不肻足到邑千里寕容吏索錢坐变池塘成貢宇平分風月上吟篇弟兄不减雲間陸拭目看君日九迁我十年前㳺㑹稽堂名民事寓招提去㝷神禹蔵書穴帰泝子猷乗興溪萬壑千岩形夢􅄰十峯双澗記留題鑑湖倘許知章乞首訪故人尊共携􅀚郡守題名春秋羙悪不嫌同老子韓非一傳中壁上題名二百軰卓然名世両三公龍眼絶品䡖紅掃地無紛紛萬木以龍呼實如益智本非藥未比荔支真是奴金橘黄柑緑桔未分珍􅃈碎登盤􅂺献新正可呼為木奴子不知誰是鑄金人清源夫人趙氏挽詞全節忠臣配崇寕宰相家哀能变囯俗貴不御鈆華學佛窮三昧然松教五車遺芳載􅊮管名夀両俱遐我􅀼清源禄欽聞孟母慈符分三子舎桂櫂両孫枝方戯黄堂綵俄豐􅂵㡌碑神州嗟未復長抱望夫悲食薑辣皺人眉性最良薬中功效不㝷常吾儕自是生無智夫子何曾食徹薑食芋我與􅆶􅂼味最冝南来喜見大蹲鴟帰與傳耴東坡法糝玉爲􅅅且療飢夢二叔二叔年皆八十餘經年不見乆無書江山不隔還鄊夢昨夜迢迢到佛廬懐胡侍郎􅀖衡今世汲長孺廬陵胡侍郎孤忠一封事千載両剛腸晚節逢明主丹心契上蒼群兒巧相中直道亦何傷悼汪舎人飬源撲被周廬日夤縁識􅊆人庚辰同考殿試節因辝辟著志向得言伸伯仲同持橐声名壓縉紳人仁􅀖囯瘁可贖百其身悼張舎人安囯天上張才子少年􅀚囯光髙名一枝桂遺爱六州棠出世􅅻成佛修文遽作郎長沙屈賈􅁩宣室竟凄凉黄花温陵地雖温十月􅀄黄花天然傲霜性炎威莫能加不趂重陽摘自爱晚節嘉宦㳺胡不帰三徑荒吾家飛蚊九月不粛霜十月猶飛蚊不知従何来乗昏動成群觜利巧能嘬􅁼多非熏青蠅與白鳥自古常紛紛夫子泉君不見水經品第天下水康王谷中泉第一但知耴水不􅂑人品第未容無得夫又不見武昌山中清冷淵名因人重逢蘇仙至今人呼作菩薩淪入異教非吾泉刺桐城中泮宫裏大成殿下新泉水不湏更以品第論混混源流自夫子諸生㳺泳芹藻間日飲一瓢心慕顔聦明不􅂾逺公社庐山蓮社有聦明泉清白大勝卧龍山越州卧龍山下有清白泉范文正公名聖毓尼丘家闕里泉脉胡為今在是周流天下皆羙泉浚井得之泉更羙我来酌泉仍叩頭遐想洙泗三千㳺世間何䖏有此水此州無愧名泉州立髙桂坊書生未折桂短檠事然膏一朝桂入手不記燈窓劳回視􅁓上語弃置等弃髦曲學如公孫髙第何足褒温陵號多士􅊯􅊯食苹蒿臚唱十年間魁亜出二豪向来此坊中一門五夢刀月中仙子帰天香滿藍􅂁大對壓􅏯董同登盡劉曺嘉名換扁榜鉄畫新揮毫我欲成其羙逺大期伊皐桂髙固可喜更㸔名莭髙洛陽橋北望中原万里遥南来喜見洛陽橋人行跨海金鼇背亭壓橫空玉虹腰功不自成因砥柱中流有岩石患冝預俻有風潮紹㒷戊午嘗為􅄓風􅁀雨所壊蔡公力量真剛者遺爱勝扵鄭囯僑移庖貢院知宗即席賦詩次韵預讀嘉賔小雅章銀􅂁行見鷺成行彬彬周室士升俊濟濟禹庭言拜昌落筆詞源俱倒水何人觜距獨專場退之詩子府專場夸觜距清源欲志新人物定有英才副􅀁望知宗贈金桔報以香橙桔以金為重橙因香見竒拜嘉欣孰早報貺愧来遲好䖏君湏記良天我正思魏野詩云南應思桔抽天􅂓修徃来好更誦木􅀲詩梅溪先生後集卷第十八梅溪先生文集卷之十八青詞還醮荷洪造之無私㣲生有托痛雙親之不見遺願猶存徳思報扵難忱情尤深扵罔極􅂺殫悃愊仰叩髙明􅀼念臣昔在先臣時爲大觀當年齡之及壮念嗣續之未生䖍發精􅇆哀投大道諾列􅀫真官之醮繪九天仙使之容誠果逹扵杳􅄀應㡬同扵影嚮躬生三子目見諸孫嗟聖恩之未酧俄人亊之已变先人􅍕棄母氏継亡由㣲臣罪逆之深致先致因循之乆凡􅀊星之屡易猶心􅂅之未償兹集羽流欽修醮式薄奉蘋蘩之薦􅂓伸􅉘􅆩之誠仰祈上帝之是臨俯兾衆真之咸集釋亡者九泉之累􅂅遂超昇宥臣門百指之愆永資覆育代道士薦師稽顙投誠仰黷髙明之聴刳肝􅄋血俯陳哀痛之詞恭慿三界之妙香上徹九霄之仙路庻通悃愊曲賜憫憐伏念臣湏以先師􅃍捐浮世莫救巳亡之命徒懐罔極之恩嗟日月之不居痛神魂之何在追念平生之岀䖏恐貽造物之譴誅雖占籍為羽流尚宅身為塵網粗植膏􅃾之業妄為金榖之謀􅀉口腹扵羶葷有傷物命留情性扵麯蘖致䘮天真不􅀎辟榖扵山林况復結廬扵田里稔茲祸釁夭爾年齡焉非一念之知不堕三塗之苦臣忝承道業夙荷􅄌恩無伸報謝之門薄示薦羞之意䖍遵科式爰㪯醮章仰祈大道之􅄌悲曲宥幽魂之罪戾借冷風而滌濯洒甘露以清凉聴大法而入宝珠歌洞章而朝金闕雖形骸杇腐生前無羽化之功庻神識逍遥死後遂仙逰之樂代道士薦母非天何戴乆資覆育之恩無母烏生􅂚報劬劳之徳仰黷盖髙之聴俯陳罔極之恩儻賜憫憐庻通悃愊伏念臣頃縁母氏偶遇厄年百藥不靈莫救沉痾之虐九霄雖逺不違疾痛之呼􅂺懐請儔之私果􅀗更生之賜尚擬親年之永稍稽心諾之償屢易寒暑兼懐喜懼日月逝矣嗟桑隂之不留人夀㡬何恨河清之難俟未遂蘋蘩之報俄興風􅀣之悲罪逆􅀁延噭號何及爰自重泉之隔􅃍驚百日之臨媿殘喘之尚存痛神魂之何在恭命羽士䖍修醮科用酧昔日之鴻恩載􅂇兹晨之哀薦兾資道䕃薄報母􅄌仰祈上帝之哀矝曲宥幽魂之罪戾渡仙橋而瞻玉像永脫九幽聴大法而入宝珠遐超三界代萬叔夏孫先覺二首居髙聴邇不遺疾痛之呼施厚報䡖薄致苾芬之薦􅂺殫哀悃仰叩大鈞庻慿三界之妙香上逹九霄之雲路􅀼念臣頃以糟糠之偶適罹拆副之灾裂肺肝㡬痛受蝮蛇之禍誤形夢􅄰竟非㷱虺之祥亊不止扵驚姜罪深􅁨扵訟酈頼噭號之有應信蒼昊之非遥遂扵困踣之餘􅂺沐保全之賜雖􅆊音數誦􅁈未息扵三生而大道垂休經靡劳扵八􅀃顧蒙恩之有日思報本之無門恭致羽流䖍修醮式奉蘋蘩之至㓗献蝼蟻之㣲誠仰祈上帝之是臨俯兾百神之咸集恩施幽􅀮敢期七祖之飛昇福及賤㣲永庇百年之伉儷大道難名孰識盈虚之有㣲臣有感黙垂覆宥之仁􅂺殫悃愊之私仰黷髙明之聴伏念人生以得男為喜孝子以無後為􅁨嗟冷族之不蕃痛私門之薄祐伯氏早亡而竟無嗣續㣲臣不肖而独守宗祧爰從合姓而来深􅀒傳家之念瓦巳三弄􅀌􅅻一懸方居襁褓之中屡致􅁨危之患曽伸懇禱曲荷保全敢忘禳謝之佟少答生成之賜恭慿羽士式㪯醮科用陳蝼蟻之誠肅奉蘋蘩之薦􅁢頼洪鈎之庇永延孺子之年頭角有成箕裘不遂坐消餘釁母煩命百藥之名克嗣先盟尚兾有二雖之慶代周元授非蘋蘩蕰藻之至㓗雖君子不􅀎薦神儻齋戒沐浴之或修而惡人而可祀帝遥望九霄之雲路恭焚三界之妙香願伸悃愊之私仰報穹􅂭之徳伏念臣某有生匪宜爲徳最凉善不積以致殃動􅂺成扵得咎世人􅁒殺隂幸其灾造物見憐屢赦其罪頃縁闔族咸遇厄年属􅁟木之頻興惧隂陽之有犯妄懷請禱果􅃱蒙休逮蒲栁之旣衰斍門䦨之多釁殘生薄祐存遭横逆之􅁨孀女来帰復染沉痾之虐㡬縲絏之不兑分溝壑之是填訴衰痛扵查㣲荷恩私扵影響念呼天扵前日􅂾至于三思反本扵此時心宜克一恭延羽士䖍㪯醮章寓礼意扵庻羞逹精誠扵有昊百神咸集列􅀫来臨居髙之聴甚明臣旣蒙恩扵疇昔祸滛之理不昧臣當改􅂈扵将来代萬叔永疾痛倦辱則呼天幸延殘喘齋戒沐浴以祀帝用酧大殫􅂺恩悃愊之私仰黷高明之聴伏念臣比縁暮景頻遇厄年病侵犬馬之軀殃及箕箒之妾雖肘後之方屡閱而竈中之藥不靈蒲栁非堅􅁨風霜之莫保糟糠至賤惧溝壑之是填窮故懐反本之心病斯有請禱之亊自伸丹悃果荷洪休命咸􅀗扵更生喜旋臻扵勿藥不特脫􅀒薪之慮又将舒就木之期顧茲感戴之誠敢怠苾芬之報恭臨仙宇光啓道塲仰期上帝之是臨俯兾百神之咸集俾萬灵之䝉福􅂅七祖之超生赦臣無窮之罪愆寛臣有限日月洪惟有昊頋常居髙而聴之卑庻使餘生尚可耕前而耘後又代黄詞肖茲形質旣蒙持載之恩禱尔神祗又荷生全之賜敢伸愚悃恭叩地靈伏念臣蒲栁之姿易凋桒榆之景多患頃與糟糠之偶咸罹屯蹇之灾深疑􅀗戾扵幽明将恐併命扵朝夕心妄懐扵請禱躰咸脫扵沉痾顧茲蝼蟻之誠敢忘􅉘􅆩之報壠耕而登􅁰稷澗采以奉蘋蘩倘䝉后帝以見歆庻俾百神之不􅄍頭童齒豁尚貪湏􅁷之生山髙水長难報􅀶厚之德代劉仁叟痛則呼天意不忘扵反本病斯請禱情盖迫扵爲親􅂺殫悃愊之私仰黷髙明之􅃪切念臣某兹者伏縁父某齒當遟暮躰卧沉疴屡費醫巫未去韓公之瘧徒劳祝史莫禳齊景之痁職雖勤扵問安効未􅀵扵嘗藥深惧枽榆之暮􅃍凋蒲栁之姿静念厥愆孰貽伊慼豈私門之多釁故隂譴之莫迯或因丘壠之营有戾隂陽之理塹山谷而下傷地脉冐刑禁而上犯天星積邪氣以奸和􅃱衰年之在疚臣忝居子職忍視父􅁨退思請命扵百神孰若祈衰扵上帝恭慿羽士䖍醮設科少伸蝼蟻之誠薄致蘋蘩之薦仰祈洪造黙覆湛恩赦臣門巳徃之愆賜臣父更生之命居髙聴迩誠倘逹扵彼蒼祸散殃消喜佇㸔扵勿藥䟽文雙蓮潭請水䟽旱魃為虐千里起望雲之心精誠􅀁加匹夫有動天之道􅂺殫哀悃仰叩靈潭切以􅀊丁六甲之窮夏有四旬之旱嘉榖垂成而一旦俱槁蒼生失望而寸心􅁒焦􅇮憑三寳之威神逺詣雙蓮之靈宅求一勺扵渊潭之内謁百神扵廟貌之間雖旬浹之已踰曽禱祈之莫應甘雨彌閣亢陽益驕豈斯民積釁之􅀁招抑上帝至誠而難感人無為命惟填壑之是􅁨龍亦何心乃在渊而弗救志未伸扵一請理必至扵􅂯求伏􅂅走雷霆扵俄頃之間興雲霧扵呼吸之際亟下霈然之澤坐消太甚之灾霖此槁苗尚有勃興之望救茲黔首免為轉死之徒倘副㣲誠敢忘大賜明慶教院請講䟽釋迦􅀃法祗􅀣一朝地闢天開智者起教扵台山乃千古風清月白自鶴林之􅓦㓕暨佛壠之凄凉孰知斍路之帰罔識真心之在有資上徳為發㣲言共惟某人大講師脫迹儒門潜心釋典躬服名師之訓屡􅀙哲匠之㳺大明止觀之淵源深悟法門之㫖趣緇林駐錫􅋍頭角扵東靈法座横􅀴振聲名扵西掖乆握元珠而自照􅂅施甘露以旁霑况潜澗之道塲實慧光之古刹念乆虗扵蓮席思大振扵潮音光我家風還他作者翕尔群情咸快如披雲霧以􅀚天咄㢤小子何知可咲蚍蜉之撼􅀣因道心之無争見􅄌徳之有容幸副衆縁一佛事惠政橋施水䟽人惟惠政之懐度橋者有如帰市道多暍死之患得水者勝如捄焚創􅂩地之􅂾椽汲甘泉之萬斛有資好亊共結善因分金溪不涸之流為樂邑無窮之施利霑居室奚煩鑿井而得泉澤及路人不必望梅而止渇舘頭甃官路䟽樂邑江山素號東南之勝舘頭驛道實為来徃之衝積水潦以傷隄􅃱官私之病渉􅁒捄泥塗之辱􅂺興畚鍤之工有資槖金以伐山骨共植無窮之利寕計不貲之財将使濘不䧟車遂無六十里之患庻㡬㟁弗為谷何止三千年之長小小園覓花䟽伏以名利區區何足為樂園林小小聊以自娱彭澤之徑方開草堂之芲殊少廣求異品遍扣名園􅂺効栁州因談咲而為故事無忘宣子􅂅封植以比甘棠淵源堂上牌文伏以黨有庠而家有塾幸逢教化之興伏其几而升其堂敢􅀒淵源之斈况剡溪藴秀之地有汝南家訓之存詵詵子弟之趋庭亹亹父兄之樂教堂軒並建齋室宏開集群彦以論文舘同􅁭而恢義富而䏻教亊實可書遂廣采扵篇章用一新其標榜伏􅂅上牌以後益湏富學竚㸔輝聲襲謝客之風流猗蘭擢秀種竇家之隂徳丹桂聯芳凡属㳺􅀙共増􅂬􅂟􅀕文􅀕孫子尚文昭皜開封人紹興乙丑卒于㑹稽年三十二嗟嗟子尚君亡矣夫千里風傳真乎偽乎謂果然耶君氣如長虹貌如明珠才如錦綉語如瓊琚躰有四乳之竒目無􅂯閱之書意造物者不偶然而生之必将冨貴其形軀豈青春之方壮不霑一命而云殂謂果不然耶郷人西還訃音不虗謂君􅀄諧和鳯之鳴日更晦朔之餘死扵鵬吿賈生之月而地扵勾踐之故都嗚呼悲乎吾平生道義之故人果為異郷之新􅄦乎自䎹訃􅀆十日晝痛哭而夜欷歔豈無友朋知心巳無白雪陽春歌誰和子流水髙山弹誰聴予君帰不留孰為我徒長記與君􅀙容聮席扵金谿之日涕泣分􅃑扵白沙之􅀄付悲􅂬聚散扵一夢閱十年如過􅂩之駒我匏繋扵簫臺君萍飄扵太湖􅄅天涯與海角歎影􅃗而形􅀌前年仲春書傳鯉魚謂将􅀙伯氏扵天白必命駕而㝷吾念君不􅀒扵一諾固甞辨鷄􅁰而掃吾廬望車音􅀆杳杳欝吾懐􅀆不舒豈千里之期不可審而行止有非人􅀁䏻為者歟吾亦謂二人齒髪未衰而後㑹必有豈知一别而死生殊途天乎痛㢤天乎痛㢤某罪逆殘生縗絰未除不􅀗效巨卿之執紼訪元伯之輀車􅂟招提明君甞寓居意神魂之或在奠一束之生芻􅀕姑丈季公佐鳴呼吾郷老成日就凋零尚餘㡬翁踈若晨星􅂾􅀧光芒旋斍㣲㓕天不慦遺公又􅍕忽􅂄年舊徳孰在郷評紛紛後生無復典刑嗚呼哀㢤仁者宜夀公夀未足六十四而公在化為促善人有後公後必興佩詩服書蘭玉滿庭人皆謂公德如燕竇五桂未芳公弗及候我独謂公死目可瞑含咲九原少遟子荣人􅂉謂公死有遺恨仲婦且帰公弗及見我謂不然仲子最賢必全孝道以終三年嗚呼哀㢤昔我先姑獲配君子云胡不淑壮年而死我􅀙稚髮出入公門誨我撫我如姑尚存公今旣亡我寕不涕前人風味傷㢤孰継念公永帰無復還期公神在天思莫見之公魄在棺愛莫起之奠以永訣疇堪此悲族人􅀕十四伯母文嗟吾宗之薄祐􅀆綿七葉而未昌保先業而不墜􅀆猶不滿乎數房念伯父之在昔􅀆􅀎勤儉以自将􅀗夫人以内􅂇􅀆措生涯扵小康家克成而莫享􅀆痛嗣續之早亡化門户而為異姓􅀆咎徃慮之匪良􅄦求食而卒餒􅀆嘆後祀之凄凉幸􅀌女之僅存􅀆帰躰魄扵故崗羅棺前而設拜􅀆酸子姪之腑腸悼吾宗之不幸􅀆抱無窮之痛傷又代女壻嗚呼生女不生男古人不幸而發此􅁨愁無聊之語也何吾先丈人之積善有夫人為之配而亦罹此苦也先王制禮大宗無後必継之以小宗之子也何後世之甘心㓕絶而莫知乎此也㪯千金之産而卑之異姓此猶未足訛也忍使祖宗求食而餒同乎若敖之􅄦也夫人腹生五女某幸娶其季也平昔登門曲荷恩私念啚報之無地也矧使折其囊槖􅂑其膏􅃾以為巳利也今焉曲盡送終之礼而不敢辞亦固其義也擗踴哭泣哀而送之者乃二􅀌女與吾僚壻也靈輿前邁道路感傷不見孝子􅄌孫為夫人二涕也􅀕毛叔度主簿文嗟嗟叔度誰謂子乎死也哀哀蒼天禍何至乎至也以子之聰明俊邁軒昻磊落固宜􅃱逺大而躋􅂋仕也豈青春方盛一分官况􅃍爲新􅄦也昔顔囬生不遇時而短命賈生䖏非其地而傷生王楊盧駱之徒器識不足以逺到死固其理也子有回之善而時非東周有􅁩之才而地非長沙有王楊盧駱之文而器識過之柰何年亦不多乎顔賈而命僅同乎四子也而今而後吾知造物者之無情有才者之無命富貴夀夭多不在此而在彼也昔吾年未冠而子方志學黄卷同彼短檠共照相期以古人相待以囯士也童子彫䖝我拙子工子果凌雲我終不􅀎継風騷之靡也亊業麟經我踈子明子果得泉我終不􅀎探謹嚴之㫖也招仙賦詩瀑水聯句子歌陽春我必和之以巴詞之鄙也我愚我􅄶動多忤物子慧而寛容􅀎我失我甞自目曰狂而命子以逹子不以有餘者自多我常懐不及之媿也賢関行藝蘭省聲名子先着鞭我猶未䏻攀逸􅁤也邇年以来出䖏稍異我因贏粮子棲枳􅁄偶家難之各丁幸残生之未㓕方期握手以更弔誰謂訃音之驚耳也子有親䘮在殯慈母在堂兒糿而􅀌婦少而孀意子目不及瞑而􅋦恨無巳也􅎴子讀古人之書逹死生之理窮逹夀夭等一夢耳假令彭􅅨其年伊呂其位大都不過􅂾十寒暑亦無此身矣子固宜安其不幸􅀙先大夫扵萬里也又代周元授嗚呼悲夫子胡為乎而止扵斯也人孰不為子悲莫甚乎老人之私也我昔識子扵年少期子之不凡知子之貴不疑也巳有息女年猶未笄命執子之箕帚奉子㓇盥之匜也子方蜚妙譽扵賢関馳大名扵省闈人争貪扵擇臠子不慕扵牽􅁝也一諾千金断然不移子之風􅁩非古人其誰為吾鄉不振頼子以光輝吾門薄祐頼于以扶持也婦翁女壻義同半子而我扵子情實倍之去也􅀊仲春赴官丹丘吾甞遣吾兒以随也􅀲期未半坐席未煖􅃍罹家艰而零丁以帰也人皆謂子年方少壮志方逺大佇俟祥琴千里􅁬飛也豈期一疾􅍕然長逝而莫追也子病之革念􅁒見予而予不知也及扣門而子巳絶心懐不見之恨涕有無􅀙之揮也予髮種種予􅁂星星死􅁅其心槁木其形今又失子生亦胡為也吾當忍死畢子後亊勉吾女以共姜之節勿奪其志庻無恨扵柏舟之詩也子之􅀌始三􅀊俟其免水火脫襁褓教之育之㑹有成人時也亦有天地􅄦神臨在上質在旁吾言不欺也􅀕潘先生文紈袴不餓儒冠誤身吁嗟先生乃尔邅迍何􅀒扵心何罪扵人何命之不淑何天之不仁何才之豊而命之嗇何氣之壮而志之湮先生之文也浩乎如韓愈之無涯先生之才也飄然如謫仙之不群弄翰染墨也季義山之險恠絺章繪句也廋開府之清新蕭瑟乎東野之寒􅓦寞乎原憲之貧欝欝乎鄭廣文之坎軻栖栖乎杜陵老之酸􅉝北窓萬言曽不直一柸之水豈非命壓人頭盖不許其伸也耶二十餘年淹徊海濱孰斈道而不先生是師孰擇善而不先生是隣主盟吾郷之綘帳作成吾黨之斯文紛紛後生頭角璘珣夫豈自賢非教􅂚因施厚報􅁿痛何可陳投老西行俻甞險勤小􅀾􅂺衂大期遽臻戯侮有揶􅮈之􅄦除禳無欝壘之神酒柸多握手之交盖棺無慟哭之賓幸有嗣之可托頼葭莩之懿親某等摳衣㝡乆辜恩㝡甚今日之奠巳不及哀矣􅀙傷血淚之沾巾􅀕陳景韶文嗟嗟吾丈命止斯耶半世而亡云胡不嗟吾丈平生真可人也胡為天年不少相假昔在妙齡父兄早亡惸然一身遂克肯堂生涯旣饒􅁭義彌篤指􅅒高風鄊人􅀁服賔客過門􅂬咲迎逢賢如北海尊常不空酒柸流行詼諧談謔坐有車公人誰不樂晚年風度比迹東山自謂醉翁不在酒間賤子區區曽献􅇆曲􅁓上遺言猶䝉記録嗚呼哀㢤皎皎雙珠俊秀有餘人謂君家三卋詩書指人有日振耀門閭公胡不留以待安居嗚呼哀㢤春秋方盛自知必死手書後亊以貽厥子易簀之際了然可喜古之逹人未必如此賤子不肖辱知㝡深疇昔登門曲荷開􅁭拜違經年忽奉訃音臨棺大動涕泣􅀎禁寒食􅀕始祖文昔我始祖西来自杭避地擇􅀁山林遯光今二百年子孫寖昌善苟不積流何以長欝葱佳城爰在此崗乃與夫人髙下異藏祔􅌾纍纍喬木蒼蒼寒食拜掃礼修故常紏合宗族共酹一觴􅀕始祖母文昔我始祖来居左原夫人相之以有子孫歴載二百墳墓尚存中間偶遺㡬忘大恩訪而得之了非妄言乃與始祖髙下異墳兹遇寒食坡荒薦繁庻使百世不忘本根􅀕孟丙文嗟嗟孟丙吾㓜児也七􅀊而亡吁可悲也汝生而眉目分明神氣清秀骨有伏犀之竒也声音琅琅語話了了而世事稍稍䏻知也吾與朋友講習二兄侍立而汝必随也吾徒数十人汝􅁼􅀎識其姓第名字退而品藻之於其􅀻也吾謂汝早慧如許他日必未昜量豈意止於斯也吾之所飲恨者翫汝之病救汝之遲也􅀄亦謂汝起止䡖徤豈数日之間遽至弗支也生於村落所恨苦者無妙藥良醫也致汝無辜由我之罪茹苦抱痛無窮時也當汝之死家禍方稔而仲兄之勢􅀹危也吾方愴惶驚怖不得盡下殤之禮以􅌾汝遶墳三匝以苦汝情雖鍾而㤙巳􅃜也汝今死巳百日矣汝母方􅀗視汝之墳而吾方􅀗􅀕汝以詞也汝昔在襁褓婆鍾愛汝今祔􅌾于側魂魄必有依也汝父母親戚朝夕􅂘泣以思汝夜常夣􅄰以見汝兾汝有􅄪生之期也天地􅄦神黨憫汝之横夭釋我之罪愆使汝復為吾子以慰莫景之思也汝或夤縁未断魂識有知當随父母以歸也􅀕支夫人文某稔聞夫人有勤儉起家之德亨富夀康寕之福昔嘗過其門閭恨無登堂之階邇来夤縁多幸􅀗預葭莩之未始登門於去年之春然是時夫人之次孫寢疾巳革不敢伸候見之禮逮去年之夏来哭夫人之孫之䘮始􅀗見於稠人之中然時方哀痛雖􅁒奉觴而不可得姑少遲之以俟他日今乃遽聞夫人之㐫訃匍匐而来而夫人已盖棺矣某以通家之故期􅀊之間足三及門一以問疾二以弔䘮竟不􅀗少伸為夀之願乃以一觴而奠訣人世如此吁可歎哉代􅀕宋彦才文二首念吾鄉之􅂄舊所餘􅅻二三人嗟浮世之年齡自古稀七十者况善人相継而淪􅃿俾後生亡得以依帰衋尔傷心澘然出涕惟公望傾士論徳冠鄉評妙齡接歩於青衿白首㳺心於黄卷殖千金之産治生不羡於陶朱戯五綵之衣色飬未多於萊子優㳺窓几組繪篇章有貟外之遺風恨錦􅂁之不奪継廣平之餘韻賦梅花而甚工讀方外書有文選學唯以一􅀴而教子不求五斗以折腰尚期羔鴈之招㡬在枽榆之晚豈意海漚之遽㓕堪嘆朝露之昜晞過眼百年轉頭一夣某居聮枽梓世續葭莩蚤從蘭玉之㳺曾快雲天之覩家声不振媿同北阮之貧人品甚㣲謬辱東牀之選拜門蘭之未㡬俄簮履之遽違徒然肝膽之摧莫遂丘山之報撫棺有􅌤掩􅃑何追聊伸半子之㤙薄􅆀一觴之奠嗚呼人生百年􅀆長短㡬何吾鄉故老􅀆零落無多月落天池􅀆夢断南柯丈人一徃􅀆迅若飛梭明朝理玉􅀆湖山之阿月魄氷魂􅀆誰共吟哦輀車届道􅀆薤露興歌臨棺奠别􅀆涕泗滂沱代諸生􅀕周仲翔母文嗚呼孟母不生三遷教􅈥婦人義方麟踈鳳稀伊昔汝南家声尚㣲刀筆是􅀓詩書罔知夫人登堂潜歔黙欷曰我有子非儒􅂚帰仲子妙齡秀目踈眉喜謂良人兹迺佳児罄我槖金給尔師資手調㷱膽志在荷衣皎皎明珠長浪益竒業勤藝􅁐心探聖涯高視雲霄平歩可期前日賢関小敵偶遺千里言旋慈顔不怡謂胡弗留再􅀾秋闈去雖􅀝門帰􅁒断機賢哉夫人前烈可㡬雅志未酬浮生遽違盖棺不􅉂有識興悲嗚呼哀㦲某等忝交蘭玉屢拜賔墀賢非房杜濫對酒巵尚期他日一鶚髙蜚鯨吸賀樽􅂬動庭闈孰謂一朝人事成非􅃗鷄斗酒泣奠靈帷嗚呼哀㢤男子剛膓不妄涕洟今日澘然為賢母揮代諸生􅀕陳元佐父文嗚呼十載之前吾邑父兄汨于流俗聞見弗明詔厥子弟惟利是营惟刀筆是傳惟儒冠是憎雖有良􅀎莫克自興孰先義方孰始過庭樂善惟公教子以經矯矯家督早蜚俊声兹千里西征惟公命是承豈􅀻是名寔惟親是荣凱奏未旋禍变怱嬰忍哉蒼天􅃤莫之勝所􅀌者不啻天地之重所圖者僅比毫髮之􅁿是詩書教子反貽公之恨而桑弧􅅾矢之志足以明孝子之痛懲鳴呼哀哉某等辱蘭玊之與㳺􅀗誨言之婁􅃪痛斯辰之盖棺想銜恨而弗􅉂奠一觴而永訣故血淚其如傾代􅀕季夫人近世以来人益天促吾鄉数月頻着弔服老而逝者夀罕及於稀年少者胡為名亦書於􅀑録惟今日之弔夫人乃堯舜盛時之􅂘盖夫人之夀㡬九齡有内外重孫之滿目且富而康庻㡬五福此固吾郷近世之所無而夫人之所獨某母黨之親也惟夫人之最尊而某之不肖也又聮姻於華族施及児輩葭莩相續三世婚姻㤙重義復異慈顔之長在庻夀觴之頻属胡今日之登堂奠生芻之一束如夫人之一死􅀆頋無可憾而親戚之心雖􅅨彭猶未足代諸生􅀕周仲翔父文嗚呼人孰無生生而不淑有媿於生亦孰不死死非正命有媿於死惟靈生為善人死於牗下是生死之間两無所媿也然靈脱然於習俗之中慨然破黄金之籝諄諄然有意於教子也矯矯令嗣天姿秀偉力學而工文自修而近厚亦一鄉之善士也柰何鼓篋賢関較藝秋闈未遂厥志而靈不􅀎忍死数年以待三釡之養此某等所以為靈興恨於此也代人􅀕族弟文嗟吾宗之薄祐􅀆如吾弟其無多方妙齡􅀆確有志乎􅅣磨将興家以詩書􅀆變習俗而丘軻苟􅀊月之少假􅀆持此心而匪他庶頭角之成就􅀆奚蒼穹之足摩云乎命之不淑􅀆遽不起乎沉疴凋朱顔於鼎盛􅀆脫緑葉於庭柯驚好夣於湏􅁷􅀆委青春於逝波嗚呼雙親在堂􅀆鬂髮皤􅀌児孀婦􅀆柰若何凛霜風於玄􅃋􅀆埋尔骨於山阿酹一觴而永訣􅀆覺老淚之滂沱代􅀕萬夫人文嗚呼婦人五福世罕有也天􅂌夫人獨何厚也東平先生以絃誦先吾郷以莭行高一時贒士大夫争求見之而夫人實為其婦也扶風府君温厚儒雅至今郷里称爲長者而夫人實爲其偶也􅑕腹生珠藍田出玉一門四味如唐之穆夫人有子實昌厥後也禁臠竒才東牀佳士喜入門䦨如唐之李夫人有女實獲鸞交也履柔順於一身逹孝慈於六親夫人之德固無咎也閥閱冠于鄉閭齒髮逮乎稀年夫人冨夀固兼受也湖山之南佳城欝葱夫人之蔵當不杇也某忝葭莩之末欽聞懿德亦云乆也今夕何夕奉兹窀穸登堂灑涕酹斯酒也代􅀕何升老文惟公名乆聮於仕籍出䖏可書行素著於鄉評始終無玷門䦨鼎盛蘭玉兼荣方期夀杖之迎遽棄板輿之養不遺一老莫贖百身某早縁桑梓之􅀻重結葭莩之好徒深感德未遂承顔况遼阻於江山毎濶踈於音問忽聞凶訃俄䘮􅁻人巳嗟七日之非薄致一觴之奠慈容莫覩老淚徒揮代􅀕宋元明文嗟嗟元明君死已乎然歟否也謂果然耶君風貌堂堂世事了了以幹蠱克家而門庭昌阜何天與之才智而嗇其年夀也謂不然也吾入君之門胡不見其歡然而迎登君之堂胡不聞其夬語之聲七尺之軀乃魄然而在柩也嗚呼君果死矣吾鄉黨親戚中堂堂了了如君者不多有也君之父乃吾之舅吾之母乃君之姑而吾同氣之娣妹又為君之偶也吾與君􅂯世通家㳺從最乆情好綢繆尚相期以白首也君強徤如許而溘先朝露况吾蒲桞之姿又安䏻保其悠乆也吾来撫君之棺弔君之母與吾之妹哀君之諸􅀌涕無􅀙而奠以一巵之酒也代􅀕萬叔永文嗟嗟我公德尊一鄉宗族恊和門䦨阜康六子趍庭一桂先芳豈唯一門鄉閭之光賀客在廬弔客􅀝墻哀哉􅁻人命胡不長家君與公情好相忘婚􅊚世修如謝與王一二年来游宦逺方恨不親臨元伯之䘮家書有命遣酹一觴代􅀕余夫人文惟靈莭著孀居興共姜守義之誓志在宗祀有叔􅁎帰國之風生涯獨盛於慶門智巧反踰於男子㤙􅀹深於婢􅀗庇潜及於􅀌遺於家曰䏻在婦為哲早􅀊克勤於􅀒子莫年方慶於抱孫孰知驚悸之間遂致沉痾之甚一疾不救六旬遽終某等忝通孔李之家兼脩魯衞之好雅欽婦徳夙荷眷􅀻華屋重来未改堂萱之緑玉容不見但聞風樹之悲觴豆薄陳涕泗交隕梅溪先生文集卷第十八
