body:
  text: 除侍御史上殿劄子臣聞聖人之徳無以加孝天子之孝莫大乎光祖宗而安社稷因前王盈成之業而守之者孝也周之成康漢之文景是也承前丗衰微之緒而興之者孝也啇之髙宗周之宣王是也􅀦有耻而雪之者孝也漢宣帝臣單于以雪髙帝平城之耻唐太宗俘頡利以雪髙祖􅁛臣之耻是也先君有讎而復之孝也夏小康㓕澆以復后相之讎漢光武誅王莾以復劉氏中絶之讎是也歴代帝王雖守成中興雪耻復讎之迹不同其功光祖宗孝安社稷則一而已我藝祖皇帝應天受命肇造大業親平僣偽一統萬方聖子神孫継継承承可謂盛矣不􅄑運厄陽九醜􅅍華靖康之禍有不忍言者􅀦讎丗耻自古無之記曰君父之讎不共戴天春秋譏不討賊以謂􅀦無臣子齊㐮復九丗之讎仲尼賢之椘以六千里之􅀦事讎荀卿罪之賢聖立言垂訓責後丗之為君臣為子孫者可謂至矣恭惟太上皇帝躬尭舜至聖之徳有禹文知子之明断自宸􅂨以社稷付之陛下聖意端有在焉陛下天資英武慨然以興復為念􅀼聞每對群臣論天下事則曰當如創業時又曰當以馬上治之又曰某事當俟恢復後為之臣比因宣召語及祖宗􅁜􅆍聖容惻然曰四十年矣臣仰知陛下之心真夏少康啇髙宗周宣王漢光武之心也柰何在位之臣不知忠孝大莭不􅀎仰副聖心之萬一復欲蹈昔日奸臣之覆轍屈已以和仇讎之犬羊指祖宗中原之境􅁟爲虜人之土謂不當取指祖宗中原之人民爲虜之人民謂不當納又􅂑秦隴巳復之故地無故而棄之以資冦讎以絶生靈歸附之望聞有􅀃進取者則群嘲而聚咲之大臣唱之於上小臣和之扵下并爲一談牢不可破自非陛下剛明果断不惑群議則社稷大計其誰與謀有君無臣真可以長太息也臣􅂅陛下推誠盡孝終始如一言動之間不忘社稷食息之頃必念祖宗側身修行上以承天意興衰撥乱下以慰民心任賢勿貳去邪勿疑以革前日圖任之失有善必賞有􅁖必罰以振冷日紀綱之􅁦仍下詔音戒􅅚有位無小無大咸懐忠良去和附之私心賛國家之大計陛下既率之以孝群臣咸應之以忠如是則可以動天地通神明慰祖宗在天之靈無􅀒太上皇付托之意矣中原何患乎不復中興何待乎以日月兾耶論史浩劄子臣聞人臣之罪莫大於懐奸誤􅀦植黨盗􅁠忌言蔽賢欺君訕上有一於此罪不容誅衆􅁖備焉其何可赦臣謹按尚書右僕射史浩人品凡下天姿險奸昔為士人以􅅦酤犯罪身㡬不免及試吏州縣奸賍狼藉􅁖声播聞浩䏻以謟侫取容致身朝列夤縁遭際事陛下于潘藩龍飛在天躐居政府浩不知盡臣子之大莭報非常之㤙機巧百端得罪公議臣請條其罪􅁖之著者有八焉徃􅀊太上皇帝聞欽宗之計痛切宸􅂨下詔親征思雪􅀦耻知陛下春秋􅂦盛智勇天錫断然以社稷付之深望陛下之大有爲也浩爲心腹之臣不䏻以忠自效乃於義不共戴天之日首進􅆍兵之言專主和議以沮大計盖欲踵秦檜之態爲固寵之身謀此懐奸之大罪一也太上皇憤􅊇亮之渝盟悟和戎之失䇿以疆􅂣之事付爪牙之臣大􅀅吴璘䓁􅁬身血􅀾復秦隴故土屯兵固守俟時􅄬機縦未􅀎長駈以㝎中原亦可以牽制虜人南牧之患浩既主和懼吴璘進取隂使其黨鼓扇浮議妄謂虜與西夏恊力攻璘遥􅀙中制令不退者斬遂取十三州之地而盡棄之􅀅士䘮氣中原離心誤彼生靈盡遭魚肉不獨棄地是乃棄民不獨棄民是乃棄信皆由浩欲售一已之私而不頋國家之大計此誤國之大罪二也浩􅂂歴既淺徳望素䡖驟居要􅂗天下􅀼咲於是取國家名器為一巳私㤙躁進之徒翕然合為一黨門䦨可以炙手士論為之沸騰至有嫡子嫡孫之號親姪過房之􅁛有號宻傅心印者有號正法眼蔵名者名居宗􅂀布在朝列者紛如也昔王叔文􅀼柄有八司馬之黨李逢􅁻用事有八關十六子之徒浩得時遇主如此乃欲效叔文逢􅁻之為人此植黨之大罪三也浩自參朝政即盗大􅁠視宰相若無人待同僚為不物人皆畏其㐫㷔莫敢誰何官爵科第䡖以與人進退百官悉自巳出自為右揆益歸其奸方欲排擊􅀁憎駈除異巳㑹其腹心内潰黨與相攻陛下察其奸邪知其朋比収㰖􅁠柄出自宸􅂨不然朝􅋝之禍可既耶此盗􅁠之大罪四也陛下嗣位之􅀄首下求言之詔忠臣義士上封言事者非一浩抑讜直之言不使上達有侫巳者則以免觧啖之春闈省試知舉三人上躰聖心策門時事浩疑其斥巳遂令黨人林安宅追捕雕匠勒令毀板三知舉嘗面奏其事有㫖令刋行安宅憸人也知有浩而不知有陛下不遵聖㫖而惟浩是􅀙卒不許刋陛下取士之始而浩首禁程文何以彰清朝不諱耶此忌言之大罪五也太上皇用天下人望起舊相張浚知建康陛下因付以江淮重任擢為樞府委任之專不啻若憲宗之待裴度浩與浚氷炭不同且惧其成功凡有奏請必多端沮之􅀄遣史正志徃建康欲沮浚進取之計及其既還遂酬以郎官又因詔百官言事遂令正志䓁宻加詆毀指為許靖房琯有識為之不平此蔽賢之大罪六也浩凡與同列奏事未嘗不留身退則妄􅁛聖㫖以誑之浩嘗有辤免參政劄子未嘗􅁛祖宗及太上皇之徳退則増加数語以報行浩之欺君大率􅁼此昔王欽若爲相每奏事必䄂数奏但出其一餘則詐􅁛巳得聖㫖馬知莭嘗面折其奸浩挾欽若之奸以罔衆朝廷無知莭之直者以折之此欺君之大罪七也陛下即位之􅀄以大學生經太上皇教養之乆並與免觧浩乃爲巳恩務在籠絡巳而聞諸生議巳遂深疾之復加沮抑嘗於稠人中言大學有風波臣對以子産不毀鄊校浩曰某固無他但上怒之爾浩近赴景靈宫行香道由貢院㑹太學補試士子填壅鄧王回車避之聞者欽嘆浩乃作威以逞爲士子􅀁嘲既而語人曰上怒補試喧嘩欲令不考某以誤其逺来救之浩善則􅁛巳過則稱君皆此􅁼也此訕上之大罪八也浩無宰相才而居具瞻之位遇堯舜主而懐共鯀之凶陛下方當任賢使䏻圖囬大業如使浩軰乆在廟堂其可以望中興之治耶臣􅂅陛下正其罪􅁖竄之逺方以快天下之心以爲群臣之戒􅄪論史浩劄子臣聞人主之職莫大乎任賢去邪任賢去邪莫先乎信賞必罰任賢而不知賞與不任去邪而不䏻罰與不去同古之帝王䏻任賢去邪者莫如舜舉八元八愷而相之􅂑四凶而流之可謂􅀎賞罰矣未聞以十二牧之任而䖏四凶于外也臣昨日面對論列尚書左僕射史浩之罪乞加竄殛陛下謂今日已罷之臣知陛下􅀎去邪勿疑可謂無媿於舜矣及宣麻于庭乃以􅀚文殿大學士知紹府輿論咸以為疑謂陛下雖䏻去邪而未􅀎如舜之正名定罪也人臣得時遇主未有如浩不忠於主亦未有如浩浩不忠之罪不可以一二数臣姑論其大而著者有八巳見前章效秦檜而主和議可謂懐奸棄徳順而資冦讎可謂誤􅀦名在宗沠者不止八司馬可謂植黨􅀼天下之柄不止如王叔文可謂盗􅁠陛下導人使諌而浩鉗人之口可謂忌言陛下委任忠臣而浩百端譛毀可謂蔽賢留身奏事妄稱聖㫖可謂欺君善則自􅁛過則歸主可謂訕上八罪有一且不容誅浩備有之其何可赦縱不投之四裔以禦魑魅其可以巨藩大我而賞奸耶臣恐天下未必咸服如虞舜時也况紹興宻邇王都最為大府浩昔嘗為屬吏奸賍著聞亦何面目見其吏民耶臣願陛下出臣前章正其罪􅁖榹取名罷差遣竄之三危之地與天下共棄之庻使大功不專於舜也論進取利害劄子臣共惟陛下以英武之資􅁬剛明之断不惑群議任用忠謀遣二􅀅臣出征淮甸首平靈壁敗虜􅀅蕭􅄾而降之又平虹縣降蒲察徒穆大周仁歸附者以萬計又敗虜人于􅀫而得其州可謂日百里以闢􅀦月三捷以奏功矣􅄬機而進􅀔如破竹恢復有期神人交慶正勇者效力智者献謀時也况臣誤􅂪親擢為耳目之官可無愚者一得之慮以禆廟謨雄断之萬一乎臣􅀼謂工者仁義之兵為弔伐而舉况中原本吾􅁟地人民本吾赤子正冝諭之以恩信先之以招納不得巳而􅀾伐随之臣慮諸􅀅或不知此臨陣之際未必無過有殺傷捷􅀗之後又未必無秋毫之犯恐傷陛下好生之徳失中原来蘇之望欲乞陛下宻詔張浚深戒敕之昔李晟平長安李愬入蔡􅀦朝曺彬平金􅁜皆得王師弔伐之意冝諭諸􅀅以此為法庻㡬冨貴可以及子孫功名可以垂竹帛也又三虜􅀅既降冝速加封爵以􅂆来者昔沛公入関留圍宛城陳恢􅀃以莫若約降封其守因使止守諸城未下者必聞聲争開門而待之沛公􅀙其言南陽守齮降封爲啇侯封陳恢千戸引兵西無不下者今中原列城爲虜守者聞皆有離心非不􅁒降但未知吾􅀁以待之者如何耳􅀍聞蕭􅄾蒲察之徒降而受賞亦何憚而不来不然則其心愈疑而其守愈堅矣今日之事正冝若沛公用陳恢策則可以不􅀾而屈人兵也臣又聞汪澈􅀍召巳至中􅂗未知誰挕其任臣謂冝今張浚并莭制荆㐮庻得令出于一輕重不偏􅀅士恊心逺近同躰緩急可以相聞勝􅀒可以相援况荆㐮􅀅士素懐浚㤙徳皇甫倜之徒尤服浚威名右使浚兼制之則人必樂於用命矣又璘退師保蜀陛下亦以進􅂑事詔芝且明諭以日退保由建議者之失不惜為悔過語以慰􅀅士及三路人心令璘􅀚時度􅀔以圖進􅂑如􅁗隴可復得冝即進兵以相椅角以牽制虜人南牧之患如是則虜􅂾䖏受敵救覆亡之不暇縦未得其頭顱必将逺􅇡沙漠矣此数者皆今日之所甚急臣􅂅陛下與一二大臣速議如臣言可採乞賜施行今正是天以機㑹授陛下時不可失也論史正志劄子臣聞奸人多謀􅀎􅀚時而為進退當􅁠臣植黨則必附合以求進以􅀼羙官及朝廷清明則又用奸計而苟免以􅏉天憲熈寍􅀄王安石為執政用小人吕恵卿之謀變祖宗法度逐朝廷正人天下莫不切齒及元豊未司馬光為相恵卿自知罪大為正論所不容遂丐祠于外兾脫典刑時􅂫轍為諌官遂首論其􅁖安置建州天下抉之由是見祖宗時為䑓諌者排擊奸邪未甞因其求去而容其􅄑免也臣謹按吏部郎官史正志操心傾險賦性奸邪自為士人時常出入貴人之門専事交結乃􅀄登科遂欲求為秦熺之壻託平曰素所交結者賂熺乳媪使之譽巳秦氏聞而薄之遂不見納既而干求時相而得監倉善􅀚時以求進聞樞宻葉義問欲議進􅂑遂􅀼呉若江淮表裏論而增損之自號恢復要覧以􅄬義問遂繇筦庫而得宻院編􅁱為士論所􅅓及史浩執政欲主和議正志復變前􅀃以􅄬浩浩喜其侫已遂遣之建康以為􅀃客欲以口舌沮進􅂑大計嘗談兵於張浚之前為浚所不禮正志乃妄撰語錄設為巳與浚荅問辨難之語帰以侫浩浩大喜之除為戸部郎官浩與正志姪同而族異拜浩而父事之在浩之門㝡為用事故士論有親姪之嘲正志既不見禮於浚遂極口詆之嘗應詔上書比浚為許靖房琯聞陛下召浚惧其不利於浩唱為浮議以沮其来時人比之張又新今陛下之浩之奸断然罷之知浚之忠破群議而任之正志自知朋比䜛慝得罪於清議遂力求去朝􅋝乃以福建運判與之正志􅀎用奸以自免大􅁼恵卿求去於元豈之未臣濫職風憲苟不論而擊之寜不自媿於蘇轍乎欲乞陛下特發英断明正志䜛慝朋比之罪以正典刑縱未䏻行兩􅀚之誅亦當薄示三危之􅇡庻使元祐清明之政復見於今日天下􅄑甚􅄪論史正志劄子臣昨嘗論列吏部郎官史正志朋比䜛慝自知罪大欲􅏉典刑力求外補朝廷以運判與之是用外䑓重任以賞奸也欲乞睿断正其罪而􅇡殛之至今未見施行臣深所未諭臣聞唐王叔文以沾沾小人􅀼天下柄號召時有名之士欲僥倖而躁進者並以郎官清要之職䖏之相與結為死黨至譽叔文為伊周管􅁑憲宗監􅀦之始首逐叔文而殺之其徒皆終身􅇡殛號八司馬元和之治比迹正􅀚淮西功業冠出李唐盖繇憲宗必於用罰於去邪也臣􅀼謂前􅈗相史浩之􅁖不减王叔文其黨與之盛不止八司馬雖非天下竒才至扵撓莭以附匪人懐奸以害公議則一而巳如正志者在浩黨中尤為親宻出入門䦨蹤跡詭祕人皆呼之曰継拜公又榜之曰親姪遂自樞属驟迁戸部郎又遷天官郎使浩不去則正志必躐䖏侍􅀙矣正志去冬歸自建康不獨揺撼張浚尤媒孽李􅂋忠之短必欲朝􅋝罷浚而誅李􅂋忠以沮恢復大計非陛下保全而委任之則忠臣良􅀅身首且不可保豈復有今日淮甸之捷耶今􅀦家方欲恢復中原所賴以􅈭􅂆者賞罰而巳前日二將奏功賞不踰時輿論咸以為當䜛慝之人亦冝薄正其罪今不獨􅏉司冦之刑而又以外䑓耳目之􅀉䖏之何以尉天下之公議乎郎曺運判至么麽也而臣喋喋言之者非以其玷列􅀫汙外䑓而巳而朝廷之刑賞公議之是非寔擊焉伏乞陛下出臣兩章断然逐之以示去邪勿疑亦足以懲一而􅂆百也論廣海二冦劄子臣聞王者􅀅欲治外必先安其内不有小忍則不䏻成大謀臣􅀼見陛下剛断不惑神武維􅀭命􅀅出師平㝎淮甸曽未踰月捷音屡聞盖􅀅復祖宗之境􅁟復㑹諸矦於東都可謂得宣王外壌之道有光武大敵之勇矣然臣愚計以謂治外必先安内欲小忍以成大謀者今欲外攘夷狄而境内有廣冦海賊嘯呼為患猶未勦除外未寜而内有􅁨不無上貽聖慮者臣􅀼聞朝廷議遣鄂渚之師進誅廣冦想蕩滌固有期矣然臣相時度冝恐未可􅃍進嶺外當盛夏乃瘴癘大作之秋北人衝之未有不病者尤非行師之利臣以謂不如頓兵於桂林以為聲􅀔而下詔赦其罪􅁖許其􅄬降或不受命斯可以必殺無赦矣海冦出沒無常尤為瀕海州縣之患聞樞府嘗遣人招安之亦有受招之意臣謂二冦皆可開其自新之路庻得境内稍平可專意外攘臣􅀁謂治外必先安内少忍以成大謀者此也臣又聞二冦之作皆縁監司郡守不得其人所致既未䏻弭之於未萌之前又不䏻誅之扵巳覺之後養成其􅅍以􅆀猖獗隠匿不聞遂致滋蔓為監司郡守者其可不懲之乎欲乞陛下宣諭􅈗相稍正典刑仍别擇賢才以為外䑓共理之􅀉以分陛下宵旰之􅁨不勝􅄑甚論韓仲通俞良弼劄子臣聞古之為民師帥者䏻以徳化人則人耻於為盗􅀎以威服人則人不敢為盗䏻以智畧屈人則可以除一時之盗三者俱無焉則何以為民師帥共理天下乎臣􅀼見廣賊海冦乆未撲㓕上勞聖慮者盖繇帥守不得其人既不􅀎使之懐徳畏威又無智畧以勦除之也朝廷不詰其􅆀乱之由懲其不聀之罪又􅀙而迁爲大藩因而乆任亦可謂失刑矣臣切見知明州韓仲通不􅀎防禦海寇􅆀昌囯㝎海諸縣皆被其毒而海道爲之不通􅀄有捕􅆀海寇者仲通從而縱之遂􅆀其徒益熾昌囯令嘗献謀於郡仲通忽而不听四明人莫不切齒朝廷既不罷黜之又除知紹興府仲通不􅀎治一郡其可以典大藩帥一路乎知静江府俞良弼不􅀎弭雷化之盗遂􅆀蔓延而二廣爲之騷然運使鄧酢用䖍吉茶商以禽凌鉄良弼忌酢併與茶啇䓁皆不奏功􅆀茶商憤然嘯呼而起醜黨数千人䧟沒州縣殺戮官軍守臣有死者其势方熾朝廷不􅀎正良弼之罪乃因而乆任之安􅀎使䑕􅀼狗偷軰即時殄㓕乎仲通刻薄小人昔為秦檜鷹犬其􅁖俻見於白蕳臣不復論之議者猶謂其有麗才可以任使及治四明最無善状専用公帑交結奥援海盗猖獗略無計畫其才亦可見矣良弼雖無仲通之􅁖然聞其老繆不事事况二廣去朝廷為㝡逺斯民所恃以為命者惟師帥之臣尓良弼為大帥而盗賊充斥如此何以安逺人乎臣欲乞􅐶断罷仲通紹興之除奪良弼静江之帥别擇有用之才以代之􅀅見海廣二寇不誅而自㓕矣論内庭節省劄子臣聞生財莫若莭財省用斯䏻足用今陛下方圖恢復而板曺以財用不足為言常賦既不䏻供􅀁須民財又不可􅃍而􅂑惟有痛加莭省可以薄􅂇軍興然莭省一事尤在聖躬親率昔漢文帝身衣弋綈以􅆀冨庻唐憲宗躬服浣濯以致中興藝祖皇帝幕用青布而僣偽以平仁宗皇帝􅀍用黄絁而凨俗歸厚此乃前代帝王之盛徳我宋祖宗之家法尤不可不遵也陛下比從諌臣之請裁减外廷官吏度一月􅀁省亦不下十萬緡以􅀊計之不無少補又切見内侍都知李綽具到宫掖用度之数有云此項全支者有云减半支者有云住支者内庭莭約如此亦可以風化天下矣然臣愚區區猶望陛下躬率之者益欲陛下於乗輿服御玉食之間有可更加莭損者親出御批斥賜外府以􅂇軍須以為中外莭省之訓如内侍所具之数除徳夀宫不可减損外亦有全支而或可减半者亦有巳减半而更可以分数减者陛下既躬率之為下者亦何敢不􅀙耶俟邉事稍寜自當復舊今日􅁠冝行之正聖訓􅀁謂今日當如創業時也臣不勝拳拳之至論􅀫州退帥劄子臣聞􅀫州之師全軍退守􅀚時識變深淂進退之機然而異議小人與聖意素不合者往往􅄑灾樂禍倡為浮議以動揺大計以離間陛下素所委任之臣使其􅀃果行殆非宗社之福昔唐憲宗伐蔡􅀾数不利群臣争請罷兵錢徽蕭俛之徒言尤􅃀苦㑹髙霞寓􅀾却􅈗相揣帝厭兵欲赦賊以探上㫖帝曰一勝一􅀒兵家常􅀔若師常利則古何惮用兵耶今但論帥臣勇怯兵强弱措置如何渠可一敗便沮成計乎扵是左右不䏻容其間断然用一裴度卒䏻成平蔡之功臣􅂅陛下以剛大為心毋以小􅗮自沮察小人之意勿為浮議􅀁揺敦遣中使慰勞􅀅士且令觧甲休息養銳俟時大臣如裴度者益加委任以固其心勿使異議如錢徽蕭俛之徒得以肆其䜛間况陛下今日之師為祖宗􅁜􅆍而舉為徽宗欽宗復讎而舉為二百年境土而舉與古之帝王好大喜功開邉生事者万万不同陛下隠之扵心俯仰無怍小人異議亦何足恤㢤􅄬機而進知難而退側身􅁱行任賢使􅀎政事益加􅁱軍旅益加治財用益加蓄以待天時人事之至可也顧在陛下断之如何耳論休假劄子臣􅀼以今日邉事未靖正君臣相與有為日不暇給時也􅀼見朝􅋝尚循平時故事假故稍多有妨機務臣欲乞陛下未明坐朝日晏而退至放假故之日冝常御便殿不拘早晚引見􅈗執侍􅀙䑓諌群臣賜以􅀙容訪問時務事有可採即時施行仍􅃙朝廷不可似常時作假宰執日入朝堂百僚各任其職庻㡬事務不廢共致中興不勝􅄑甚論林安宅劄子臣聞口道先生語行如市人名曰盗儒此聖人之􅀁必誅王法之􅀁不赦也臣謹按前知臨安府林安宅者其盗儒之雄乎􅀄令越之新昌納官妓為妾則以濫聞及倅漳州盗郡􅀅之􅁠貪墨自恣則以賍聞及作廣漕起羅織之獄誣䧟善良則以酷虐聞謟事鄊人朱倬倬令何􅄎薦之而得浙􅈇倬雖小人然扵安宅有􅆑翼之㤙及䑓官張震欲論倬安宅乃手䟽倬之􅀮􅁖数十事以示震倬之罪人皆可得而言也而安宅納之其與吕布事董卓而殺董卓何以異乎安宅出入史浩龍大淵之門其在都司也進則見浩退則見大淵天府之除不由正道物議咸鄙薄之有􅀙何䖏来之語浩與大淵結為死黨及二人反目浩託安宅和之安宅既欲效勤於浩又欲獻侫扵大淵遂造其室為奴顔婢􅂰之態士夫􅀓以為􅀏陛下比扵經筵嘗語臣曰近䑓諌論龍大淵事朕不私之已罷其職矣臣言陛下屈巳􅀙諌以天下為公不私潜邱之臣社稷之福也陛下称不私者至于􅂯三今安宅乃自託扵大淵之門以盗威福陛下且不私大淵其肯私其門下士乎安宅自知罪􅁖為清議􅀁不容乃詐病以求致仕朝廷既以宫􅀚與之矣又用計以復留臣近甞面奏其奸陛下即諭宰相令丐祠而去矣今又必欲朝辞兾僥倖復留之計動用奸謀以要君父不顧㢘耻不知進退真小人之雄者也或謂安宅之才可以治劇然自知臨安以来􅀄不見其所長事無大小皆委於吏獄訟繁㒷而不􅀎决盗􅀼公行而不􅀎治議者謂不逮前政逺甚是豈可居弹壓之任乎陛下断然罷之可謂􅀎去􅁖矣為安宅者固宜皇惧朝聞命而夕即塗也乃復徘􅆦不去不知何所恃而􅂑爾􅁘臣欲乞断自宸􅂨正安宅之罪而􅇡逐之以為不知㢘耻者之戒貼黄臣與安宅素無睚眦比因安宅奉史浩意㫖毀省試䇿題及程文之版臣以公議責之即非􅀻怨安宅聞陛下用臣爲御史即欲求去盖用奸計以鉗臣口臣前曰面奏其奸即䝉陛下罷而去之臣已不論列今聞安宅復求朝辞物議沸騰咸謂安宅􅀝恃奥援不顧公議故臣不得不論之􅂅出臣章示至公於天下再論林安宅劄子臣誤􅀩親擢濫司風憲比甞面奏前知臨安府林安宅奸邪交結䓁事陛下即諭宰相令安宅罷聀丐祠而去臣仰窺聖意既俯听臣言得􅀙諌如流之羙又欲保全安宅使不繇弹劾而罷爲安宅者固宜聞命即行又復乞朝辤兾奸計得施欲求􅄪用臣昨條列其罪謂即賜施行今乃聞有㫖令安宅内殿引見臣不勝皇惧之至切聞仁宗之時任用䑓諌言及乗輿則天子改容事關廟廊則􅈗相待罪臣今論一小人而不䏻使其知畏尚何面目居風憲之地耶安宅前日聞陛下用臣為䑓官即詐為風疾以求致仕既巳得祠命下復止罔上要君尤足以見其奸詐今冝即去而復乞朝辤未有班次而􅃍得内引是前日之奸計復行也臣切見近日執政䑓諌以疾求去者皆放朝辤安宅何人而得此􅂭眷異禮耶欲乞陛下深察安宅奸邪交結之罪亟賜􅇡逐以尉公議梅溪先生奏議卷第三梅溪先生後集卷第三詩某比縁職事朝拜􅑼宫瞻望松柏愴然悲涕遂成小詩崇􅀚升平主神游在九霄稽山嗟􅁙禹寰海痛思尭天上仙宫别人問寳祚遥微臣望松柏魂思黯然銷鑑湖行蒼蒼凉凉紅日生葱葱􅓹􅓹佳氣横鑑湖春色三百里桃花水漲扁舟行花間啼鳥傳春意声落行舟驚夣􅄰胡牀兀坐心境清轉斍胡山有風味鑑中風物㡬經春身在鑑中思古人禹迹茫茫千載後䟽鑿功帰馬太守太守湖成坐􅄦責後代風流属狂客狂客不長家鑑湖惟有漁人至今得日暮東風吹棹回花枝照眼入蓬萊回首湖山何處是欵乃声中􅀞啚裏禹廟歌君不見逢英雄吞四海血祀初期千萬載稽山水像棄長江􅊇泝波濤􅄦無餒鳥喙辛勤十九年平吴覇越世称賢故囯無人念遺烈山間庙貌何凄然馬守開湖利源逈􅀊沃黄雲九千頃年来遺迹半湮蕪庙鎻湖邉􅂐烟冷吴越囯王三節還尽􅀅錦綉褁江山自􅀙王氣熄牛斗庙比昭王屋一間廼知流光由徳厚祀典誰􅀎如夏后九年洪水滔天流下民昏墊尭心憂帝惧萬囯生魚頭錫禹洪範㝎九州功成執玉朝冕旒奔走訟獄帰歌謳南廵㑹稽覲諸侯書蔵䰠穴千丈幽蟬脫塵寰不肯留千古灵庙依松楸吾皇盛徳與禹侔菲食卑宫惡衣裘思禹舊績祀事脩小臣效聀躬薦羞仰瞻黻冕懷逺猷退惜分隂慙惰偷嗟乎越山髙􅀆可夷而丘鑑湖深􅀆可埋而疇惟有禹貢声名長不杇告成世祀無時休道􅀚名告成與趙安撫乞䟽嶽小麥青青大麥熟秧老􅁒移蚕􅁒簇皇天弥旬作􅁋雨害及農桒一何酷麥枯秧腐蚕不􅁝無食無衣豈能育使君今世賢方伯政過龔黄同舜牧僦金蠲放官與􅀻喜氣􅂆声傾比屋仁風已慰􅀺庶心誠感蒼穹理宜速胡為烝泄尚如許隂沴干陽埋日轂豈惟􅅺濘困牛車更恐魚龍上平陸閭閻競昼指日蛮香火遥祈上天竺傷和無乃有􅁈民蠧政尚疑多大族使君有術開青天按劾奸賍䟽滯獄次韵濮十太尉詠知宗牡丹七絶憶昔洛陽花盛日品第况逢歐六一姚黄一品價無双更有左花千葉宻月陂春色滿花枝囯色天香照雪肌當日栽陪恐無地如今誰保舊園池開元徃事感傷中遺種猶餘一㩎紅借問通宵配妃子何如及早念姚崇春色遥興洛陽念風俗􅂓於記中驗今日苧羅山下魂猶向人間􅄍妖艶地近尭天饒雨露花王窈窕多風度書生不辦買花錢空觧揺毫為花賦香苞初拆暁霞凝甲第名園冠紹興玉葉金枝老詩伯更􅀅好語為褒称造化無􅀻處處芳家山想見亦春蔵無端􅀼禄身為客􅀌􅀒吾廬十八香送僧游徑山潜澗家風不蕪􅃿禅講詵詵尽瓜􅁑如今更有竒兒孫雲水飄然継衣鉢徑山禅伯僧中龍向来名節真無双我昔題詩已推許两度相逢不曽語子今此行真得師掃除妄想叩深機我待衣冠掛林下遟子帰来話瀟洒三月晦日邵憲大受宴僚屬于西園某與焉趙提幹濬即席賦詩次韵送春開宴種山西翠幄重重眼界迷一叚清和人共物十分幽勝地臨溪鴛鴻曲水閣中集嬰燕落花枝上啼賢榻獲陪文字飲不嫌蹤跡間雲泥送昌齡弟還鄉兼簡夣齡束書千里赴王畿􅀾藝賢関事偶違鑑水天高鴻雁集左原山逺鶺鴒啼夜牀風雨客情惡春草池塘詩思飛勉力還家對燈火待看双桂擢秋闈時二弟赴補偶遺昌齡还鄉夣齡留赴糶米行詔書發凛周飢荒使君减價糶黄梁奉行上意固已良小人用心胡不藏㪷米大半雜以糠横索民錢名貼量怨語嗷嗷盈道傍我慙寸禄偷太倉見之不言咎誰當言之人指為䡖狂作詩􅂓語同舎郎送㑹稽林簿日華棄官還鄉望秦秦望山蒼蒼未秋先作帰意濃三山􅀷處孟園好林簿家有孟園松菊恨君帰不早拂衣高舉追㝠鴻不􅀅詩别乖崖翁年来處士徑尤捷羙秩清資等閑躐君獨高歌慕􅀮侖林下何曽見一人芋魁豆飯吾亦有􅀷媿折腰貪五斗戊辰􅀊甞和韓退之贈張徹詩􅀉曺夣良至今十年夣良方和以􅀉因贈一絶􅁒識交情乆逺期十年方和和韓詩他時更踐詩中語偕隠谿山不可遟某舊詩云有溪山昔隠風雨無獨听送趙可大如淛西幕府游􅀙盛一時之人􅁭宇更瑰竒西風莫作魲蓴恋越國江山日要詩中秋賞月蓬萊閣呈同官中秋翫月小蓬萊風送婵姢入座来樽爼論文清有味湖山照眼净無埃雲生脚底蛟龍卧影落人間鼓角催時方見月鼓角声動把酒問天兼問月何時此夜更銜盃中秋見月方以為喜既而隂蔽意殊不滿東坡云良天佳月即中秋不以日月断也諸君有醵㑹之約復用前韵中秋翫月小蓬萊雲掩清光不放来頗斍􅁭懷増梗㮣􅁒凭欄檻掃氛埃清宵忍放嘉賓散明日還驚俗務催底用區區校時節良天佳月即傾杯記夣九月初四夜夣待先人游家之南􅀚田園闢徑於杉林之間昌齡弟亦侍其側指杉徑云此異日帰去来之路也􅁴而思之杉徑者三徑也淵明之事先君黙啓之矣書以記之夜夣随先君梅溪䇿􅀺杖杉徑早開闢帰休預標榜魂思驚暁醒精神發秋爽披衣照􅀌灯洒涕書惚怳士人僧道俱贈岩桂岩桂来三家清標共秋風聮芳近禹穴擢秀疑蟾宫膽瓶金粟妍鼻􅀚天香通無心妄區别妙契􅀅無同府吏有以老求退者詢其年猶未六十詰其去之由云􅁒全身避禍耳予善其知機勇退可以媿􅄝進之士夫有感而作升高蝜蝂墮粘璧蝸牛枯措紳鴆梁肉是亦蝸蝜徒抽身箠楚中勇退媿此胥衣冠與刀筆未可分賢愚􅀚習水勝漢武英雄思拓邉昆明習􅀾遺風傳吾皇仁心異武帝思患姑為預防計尓曺生長行伍間操舟習水便冝閑異日􅂢軀宜報囯勿效水烏為盗賊世之善水勝者多為盗􅀼目日水者烏龍瑞道士贈岩桂岩桂遥􅀙禹穴来天香全似月宫栽金風凄峭飄龍腦想見吾廬爛熳開九日登蕺山九日同登古蕺山眼明天濶興清閑杯傳但斍􅂬無尽㡌落俄驚鬂已斑鄉思遥馳三徑裏秋声近在八松間茱茰未許陪朝士頼有清流数徃還夣齡九日有詩兼懷昌齡次韵長記去年今日好門外秋香噴沉腦弟兄隣里同登髙把菊行觴楽非少山殽海錯鄉味佳銀瓶索酒不用賖醉中不記脫巾卧明日頭上猶黄花今年豈不􅁒行楽􅀼禄東州官事束那堪送酒無白衣旋糶黄梁買枽落同如與子俱休休誰能長抱離鄉憂移書問訊恵連弟三徑許我帰来不余前此有帰㒷昌齡以為不可数以書来相勉故及之贈荘童子名大成福州人日誦千言七􅀊兒方員動静早􅀎知還家更讀韓公序噐業他年必大竒送朱丞一片秋懷似亂雲不堪行客話離群紅蓮緑水尚留我鉅竹老槐􅀷憶君千里􅀙今遥共月一樽何日更論文好􅀅平昔家傳學勉力登朝立世勲朱故丞相之子贈夣齡兼懷昌齡我縁􅀼禄寓東州子亦相􅀙千里游鐡硯功名壮心在短檠燈火夜窓幽治書朝錯宜登第射䇿公孫定取侯他日三人老兄弟結廬相共保松楸和夣齡十月朔日書懷􅀊事􅃍如許玄㝠威􅁒伸地炉猶未火客坐况無茵日短驚瞻􅄧天寒怯報寅予每以五更趍府而性尤佉寒尤怜對牀弟尚與短檠親贈喻叔竒縣尉叔竒攝職㑹稽公事之暇必訪僕於民事堂終夕論文欣然相得輙成小詩見意同舎同年友天資逈不群詩文侵晋宋兄弟􅁼機雲梅市訪仙侣蘭亭懷右軍叔竒甞集蘭亭亭作詩五絶公餘時過我無酒亦論文贈王吉老縣尉王吉老眇然一書生也􅀎手斬凶人以報母讎申􅁈請罪自􅄬于府識與不識莫不壮之東嘉王某作詩以紀其事好事君子必継有發􅀭之者臣子大節孝與忠父母仇讎天不同賢哉㑹稽王孝子感槩有古烈士風松楸一夕盗破冢親􅀗䑕輩聞之公有司守法貸其命孝子銜恨無終窮誰謂書生膽如許貌若尫羸中甚武手斬凶人提髑髏請死申􅁈詣公府君不見齊㐮内行世所羞春秋賢之縁復讐又不見子胥鞭屍報父怨太史為之作佳􅀓君今枕戈志已伸更湏移孝為忠臣他年當作􅀓介子誓斬楼蘭雪囯耻十月望日買菊一株頗佳秋去菊方好天寒花自香􅀷懷傲霜意那肯媚重陽菊晚不害好固宜登我堂書生自頭白奚用泣馨香聞詩生日十月􅁲六日良天逢十月嘉節過三元汝父初生子聞詩吾長子也吾親喜抱孫長成今若許氣習有餘温雁序自相友麟經可與言志宜存逺大學必􅊥淵源伹務勤修徳年齡不用論十月十六日􅁒與夣齡弟及聞詩聞禮同游蘭亭仍約喻叔竒偕行㑹天氣不佳喻亦以疾辞出門而止兀坐終日懷抱殊惡我􅁒游蘭亭天氣殊不佳同行感微恙杖屨不可偕出門興遽䦨兹游竟未諧遺文閱永和􅂓用慰此懷和喻叔竒集蘭亭序語四絶我自扁舟入越初蘭亭巳向夣中如崇山峻嶺至今阻唱和詩成無處書前日具筆硯治詩牌竟不成徃群賢少長畢經過曲水流觴憶永和一代風流已陳迹世殊事異感傷多晤言一室許誰親相過無非我軰人放浪形骸嗟老矣仰􅀚宇宙尚艱辛茂林􅁱竹未成徃游目騁懷􅂓自欣暢叙幽情有齊契一觴一詠細論文和韓退之晚菊贈喻叔竒嘉菊何太晚十月􅅻黄花既晚好何益三嗅良可嗟開日乃佳節芳樽對年家今夕苟不飲如此黄花何夜讀書于民事堂意有所感和韓公縣齋讀書韵䆠游寓幕府幽懷属山林兀坐窓几間黙求聖賢心沉潜偶㑹意嘆息常弥􅁭丗塗豈能騖古道􅂓自斟䰠穴思􅁒探丹書未容㝷青銅毎自照白髪已見侵事業浩無窮筋力媿不任丈夫固有志寕在官與金李資深贈古瓦硯及詩世貴銅雀硯常患偽乱真千金買渇雀虚名何足􅈿李生心好古身困道不貧得此佳陶泓製由萬道人慇懃持贈我噐古詩清新置之窓几間日與毛頴親未􅀎草太元姑用注􅀗麟羅文及端􅂵貴幸無比倫屈尔居蓬窓與我同艰辛研磨媚􅁠貴揮染劳精神兹我所不敢銘以書諸紳喻叔竒恵川墨子墨客卿来自蜀綉川家蔵尤不惡明窓研磨出珠玉客卿於君徳良渥嗟予經年客蓮幕交絶方兄澁嚢槖文房諸子亦蕭索同年於予契非簿特遣卿来􅂇予學不才拜賜心愧怍客卿之意殊不樂陶泓毛頴登䑓閣陳玄待詔同著作卿􅀙予游失所託惟清惟静惟寂寞但有詩篇日酬酢戴夫人挽詞同年姚筠教授母勤儉肥家福亦肥晚年門户更光輝滿庭蘭玉俱藍䄂照眼雲仍尽綵衣方外客携因果去月中人折桂枝帰回頭徃事夣幻影丹旐五雲原上飛和趙可大四絶僧居岑寂異官居索句搜腸撚断􅂡那更雨中思底事夣魂帰到種山隅右僧舎雨中杜宇声中春􅁒帰少陵老淚不禁揮與君共􅀍浮蝸誤不似淵明早見機右聞子規唾手科名尚少年無窮事業更居前辛勤不􅄰思經意􅁍􅀏邉韶好晝眠右不􅄰萬壑千岩擁越岡朝陵追念舊天王自嗟無路攀弓劒尚忍興言及虎狼右朝永祐陵送黄機宜游四明名子魯游宦東州識老成坐間談􅀏欲風生人如元祐氣尤直詩不江西語自清雪棹非縁㝷旧隠夜牀端欲對難兄行聞太史奏星聚四皓聮珠臨四明黄兄弟四人皆皓首号所居曰橘隠堂盧仁及縣丞挽辞妙齡才譽冠東嘉百􅀾功成暮景斜人在盧前有慙色禮􅀙戴後獨名家藍田羙績誰䏻記綘帳竒兒最可夸鄉里搢紳官業冷因公淪落倍興嗟贈術者枉道貴何益正塗窮亦榮誰辭談義命試問小君平游天依寺拂暁藍輿出蠡城稽山照眼鑑湖明千岩􅀷處十峯好萬壑流中双澗清香靄嘘成普賢像風松吹作法華声灵烏不肯来城郭長伴高僧避寵榮次梁尉韵探春連􅀐入山城更喜梅仙亦㑹盟梁後至文字偶同吾軰飲聖賢滿為使君傾安撫尚書以僚属游山送酒六十樽諸公自山中回晚集于教授厅為文字飲詩逢好境天然好山為清流分外清瀟洒宗之最年少我慙叨預八仙名梁最年少酬陸宰用梁尉韵􅀵拾湖山付管城士衡獨歩張文盟湧泉詩思逼人徢屑玉􅀏談終席傾天色亦縁吾軰好路人能道長官清要令巧匠鐫山骨記取同行八士名和喻叔竒游天依四十韵稽山高八雲鑑湖濶浮空禹秦有餘迹晋宋多鉅公我来􅀊及周夣􅄰懷清風兹欣天氣佳扶桒欲曈曨駕言天衣游盍簮盡鴛鴻經夕戒行李如期集仙宫早㑹于天長􅀚聮􅀐岀城南行行指秦峯千岩競􅄍秀眼界清無窮招提在何許十里松隂濃林端忽鍾磬與客為先容群簮擁花界双佩鳴寒空試􅀅比天台大畧如思豊天台囯淸山水秀絶有思豊堂尤可􅀚覧首讀邑浩碑妙理開昏􅀩細􅀚元白詩丘壑羅胸中蕭璧尚堪靣寺有靣璧二大字梁薪㡬經烘寺有梁時薪火見李公埀詩兹宫現有相禅客談無同朝陽㝡嶄絶白雲抺其胷朝陽峯㝡竒杜䳌天下無至今映山紅鷄僧始開山道業聞清􅇆思㪯照不起高價傾江東袈裟縷黄金宫女自針工昭明親抱送禮意何太恭白馬忽渡江䑓城䘮英雄囯破遺衣在丹青落塵容寺舊有梁昭明太子􅀞像我軰皆書生意氣飄如虹䗶屐共㝷幽寕求香火功載酒懷賀老招隠思戴顒賦詩效吹䑓一飯敢不忠况我賢使君徳宇尤踈通楚醴餉百榼白衣走山中嗟余何為者天資媿倥侗謬與酒中仙偶同蕺山松蕺山有八松同年妙詞章况有山水供古詩如古琴山髙水溶溶背嚢小奚奴捧硯長􅂡僮叔竒題名勝游與佳作二羙今具逢品題徧群英波瀾及孤蹤掬水弄華句比擬何凢庸掬水月在手弄花香滿衣乃于良史游天衣寺詩也兹㑹如蘭亭同行􅀋荀龍盛事在詩史奚用呼􅀞工梅溪先生後集卷第三梅溪先生文集卷第三詩送元範赴省清峭霜天振羽翰共觀一鶚氣軒軒願􅀅柱腹書千卷盡作􅁨時䇿萬言請繫單于同太傳不阿人主異公孫龍頭素是君家物又見傳呼賈状元囯朝賈黯賈安宅皆狀元送劉政孫蚤􅀊聲蜚􅃕法中漕䑓前日始􅀵功辛勤半世虀塩學慷慨平生畎畆忠作佛肯居靈運後登仙更與阮郎同瓊林宴罷游天禄太一然藜定照公送劉全之綵衣堂上別慈顔匹馬楊鞭指帝関千里清風生腋下十分黄氣滿眉間手探春信尋梅去袖帶天香折桂還定向蓬莱燕仙侣為言子晋在江山前詩送三鄊文行雖各獻芹然非所以勉子大夫茂明大對之意更為古詩一章逆胡殘喘仍跳梁中興事業猶渺茫當今取士異平日非為故事開科􅂣廟堂方諱口打賊翻抵正論為猖狂紛又兒軰茍冨貴妄引申伯深阿王公孫老儒亦曲學不敢正色言堯湯徒令天下慷􅁣士肝膽一劒生光芒前年胡公以言逐言今已驗官未復近日􅈳山縁賦詩裏頭衣白投荒服忠良自此多結舌道路相看徒以目誰􅀎言事如靖康陳東巳死歐陽戮囯家飬士㤙至渥干戈不廢菁莪育諸公報囯當如何莫把剛腸慕粱􅁏丈夫一第何足道幸勿以此存懐抱賈生當獻太息流涕痛􅂘書更施三表五餌請爲屬囯繫單于大劉小劉展盡畎畝惓又忠洪恭石顯軰視之當與奴僕同詠桞東君扵此最鍾情粧􅀧村村入􅀞屏向我無言眉自展與人非故眼猶青縈牽别恨􅁝千尺断送春光絮一亭葉底黄鸝音更好隔溪烟雨醉時聴次韻潘先生寒食有感花媚韶光桞弄煙簫聲處處賣餳天誰知子厚懐桑梓北望長號又一年無頼楊花趂暖風旅中節物與愁逢一聲杜宇啼春怨知在花梢第幾重人間寒食幾經年甲子誰􅀎記後先且盡一杯藍尾酒莫􅀅身事惱生前悼僧徳芬身着方􅂁十一年緇林頭角稍軒軒參禪早悟前三㫖學道思歸不二門花落絮飛浮世盡風清月白片心存異時我作髙僧傳為記嚴公有此孫芬乃宝印弟子嚴闍梨法孫也妙齡蕭灑脫塵籠髙揖禪林話苦空萬水千山新道眼一瓶二缽舊家風圓鏡肇論􅀎知趣筆法詩章稍自工圎澤精魂定何所想隨流水到天童悼禅法師閣中髙隠􅀊華深􅀛鶴精神老不侵寳劒妙傳驅􅀑術靈丹長有濟人心彌明石䁀方聮句洪景袈裟􅃍掩衾借問青牛何處去九天雲路杳難尋毛虞卿見過故人訪吾廬况是清和節髙槐緑成隂芳草碧未歇携手山間行清興浩然發呼童具鷄􅁰濁酒醅初潑貧居媿荒凉野蔌草羅列盤實飣梅豆􅂼餐薦薇蕨主禮雖甚㣲客色未嘗觖醉翁山水意不爲壼觴設蠏眼煎新汲雀舌烹春擷澆君文字腸掉我清談舌人生㑹面難􅀊月易飄忽君姑為我留怱怱莫言别讀孫子尚舊所􅀉書故人之書不易得片􅁓隻字皆可惜􅀵拾永為巾笥藏縱得千金不􅂅易開緘展轉時一讀又未􅀎終淚横臆之人門地盛衣冠萬里家居帝王宅干戈繚繞飄吾鄉傾盖論交似疇昔我年􅀄冠君猶少握手游從沗聮璧金溪風月供醉吟君唱我酬常即席君詩句句清且新髙壓曹劉倒元白我才短淺何足論彊伴寜容小生敵追風駿足横海鱗暫困鹽車與汙澤掉頭一去不可尋南北茫茫烟水隔往年雁字時復􅀓近日詩筒杳難覔眼中不見故人面􅁓上空懐故人迹人生㑹合䏻幾回一别八年同瞬息我去無由君不来尊酒相逢更何夕宋彦才挽詞徳著吾鄊月旦評丘園蕭散傲虗名􅂁雖不奪詩􅀹好秋不曽悲賦自清早掛儒冠知有命晚憑貝葉悟無生人間月落天池後定向維摩頂上行宋孺人挽詞劉方叔継母晚􅀊歸来奉伯鸞力􅀅勤儉濟艱難鹿車共挽甘從鮑㷱膽親調􅁒慕韓鏡裏玉容猶未老夢中銀漏忽驚殘通家賤子非房杜長記登門酒盡􅂬先君子去世五十日孤某入四友室覩平生遺迹哀號痛􅂘絶而復蘇旣而書四十字以􅀉罔極之思先子神何在人亡迹尚存業餘經史案趣􅀉聖賢尊榻冷寕欹枕堂虗巳盖棺晨昏徒泣血無路報深恩李府君挽詞利􅂗名路兩﨑􅋂甘向田園事陸沉一頃膏􅃾生計足四時香火佛縁深築門東海于公意教子燕山竇老心䘖涕為公銘􅀮徳不縁䛕墓􅁒黄金陳景公挽詞冠玉堂堂骨相竒起家消息露􅆱􅀛齒牙不妄千金諾度量難窺萬頃陂車轍過門多長者箕裘傳業有佳児西園新卜松楸地記得公顔向此怡公園有怡顔亭今塟其上先子於公分頗深晚年出處恨商參雖脩北海通家好未遂香山㑹老心盡道􅁻人俱未艾誰知凶訃􅃍相尋三年落盡思親涙今日登門又滿􅁭次韻萬喬年李唐英二絶七賢林下共忘機更有新詩爲發揮竹葉一尊添逸興董風吹散臉紅㣲黌舎炎炎畏月長竹亭取次納新凉文章風月湏兼羙莫使時人恨海棠送章生端武麟經絶筆今幾年學者異􅀃何紛然操矛入室務相伐誰􅀎浚井得羙泉梅溪野人獨好古遺經獨抱期心傳從予講論有趙陸得趣往往忘蹄筌章生妙齡固可畏聖經賢傳思窮研贏糧逺来􅀂有意席未及暖俄言還豈厭先生紙上語奥境不見徒􅅏連春秋明日遂東矣情鍾我輩徒拳拳送羅生少陸羅生黄山来􅀙我梅溪㳺齒髪㝡年少學問􅀎自修短檠照深夜細字書蝇頭大業心􅁒潜遺編力旁搜新文有佳趣日進殊未休吾愧河汾翁子學常與􅀵行􅀅拭老眼万里看驊騮一葉下庭皐大火當西流遥望河陽雲俄登李膺舟交朋重惜别挽䄂終不􅅏吾腸百錬剛亦作繭緒抽籍也不吾叛尋盟定髙秋送茹生履燈火勤勞覺瘦生望雲心断涕從横賢関春信無多日手折梅花贈子行乙丑冬罷㑹呈諸友繆意開家塾㣲才愧斗筲雖迯有􅀂叱寕免孝先朝尚頼知心友􅀎全耐乆交殷勤惜别意終日在梅梢江上遇夙二絶薄暮登舟海􅄓生短蓬欹側浪峥嶸江神正好憐行客莫待他時却世情弭棹乾門乾音干海上山名浪未平同舟太半巳山行自慙不是婁師徳免葬江魚頼友生宿黄巖妙智院問訊開山始于今二百年徑幽㣲見竹社廢尚遺蓮􅀚頌思元老㳺庵憶舊禅怱怱一宿客未盡滌塵縁院有内照庵趙清獻作頌軒名滌慮過黄巖三日離家客悠然覺路長梅花十里眼竹葉一杯腸詩思貪佳境眉頭憶故鄊江山看未足囬首隔滄浪宿慶善寺剛􅀍篙工誤遲留一日装川􅂗隔浩􅄅燈火亂昏黄呼僕回行李尋僧宿上方山前十里雪夜入夣魂香過天台目逆神仙路丹成未暇躋雪深封佛壠雲暗鎻桃溪流水無還有亂山髙復低􅁒尋劉阮洞歸路恐成迷過新昌杖屨登關嶺山行無住時客情渾在眼郷思苦関眉石現金僊像谿蟠阮肇祠越山都幾􅀧􅀵拾上新詩􅀚石佛土木􅂗金巧逼真緫隨浮幻化埃塵何人着意鐫山骨長現金剛不壊身戴溪亭髙士逃名隠此溪凭欄遐想獨徘徊不知吾祖乗舟後得得誰從雪裏来曹娥廟慟􅂘無尋處􅄬江竟得屍風髙烈女傳名重外孫碑荒草􅃿􅀌冡洪濤舂古祠懐沙爲誰死翻媿是男児宿驛奥未是他郷客思家已断䰟明朝春色好宿䖏近花村大芙蓉小芙蓉題靈峰三絶家在梅溪水竹間穿雲蠟􅄚可曽閑雁山新入春游眼却􅀏平生未見山洞中大士半千身住世端􅀎了世因應􅀏玉簫峰下客馬蹄長踐利名塵三宿靈􅈐不為禪茶甌隨分結僧縁明朝杖屨丹丘去􅅁得烟霞過海船出鷹山三宿山中始出山出山心尚在山間浮名奪我林泉趣不及髙僧一味閑關嶺遇雪路近剡溪春雪深此行有媿子猷尋毆馳千里争蝸角􅀌􅀒扁舟自在心過鑑湖誰把青銅鑄鑑湖湖光冷浸越王都東風二月西游客買得扁舟入畫圖春水如天浪未生扁舟真在鑑中行漁人不問君王覔占得湖光亦自榮月夜獨酌月色撩人不忍眠杖頭獨掛百青錢一杯竹葉那􅀎醉澆起鄊心更黯然太學􅀉夣齡昌齡弟東望家山幾断䰟白雲飛盡路漫漫湏知太學虀塩味不似親闈菽水歡事業未應􅀌鐡硯弟兄猶喜盡儒冠行飛直待秋風便好作排空鷹字看丁邜秋赴鹿鳴宴次太守趙殿撰韻食苹開燕副招求夢草詩成寵士流要得異才聮虎榜亦容下客盗狐裘早脩慧業欽靈運妄賛元經媿子㳺刺史􅀏談風滿席定應吹拂到瀛洲赴省治装有感記得離家桞未黄歸来三徑菊花香一年强半身為客席未遑安又趣装􅄪過鷹山三絶大龍湫龍大那容在此湫銀河得得為飛流好乗風雨昻頭角直到天池最上頭天柱峯女蝸石爛􅀂為脩四海咸懐􅂎囯憂誰識山中真柱石擎天功業勝伊周天聦洞重華疑到此山中鑿石䟽岩逹四聦端為草茅憂世士不教無路獻􅀌忠思歸窓外西風竹數竿秋聲終夜趣歸鞍吾廬此去八百里歸到家時天未寒别太學同舍二年客賢関傾盖皆故人况我同舎郎何異手足親虀塩共牢落燈火同悲辛坐覺􅀊月忘所頼朋友仁西風起天末淅􅄋吹江蘋思歸適􅀁􅂅惜别還霑巾祖席歌驪駒别腸轉車輪離索􅂲􅀌陋重来約新春戊辰閏八月歸臨安􅀚舊題脩竹黄楊丁香慨然有感復書三絶于後吾家風物冨檀欒最愛青青耐􅀊寒千里歸来面蒼玉不煩時復報平安同日種松今合抱後来栽桞已參天􅀏看軒外黄楊􅀣我亦如君厄閠年蕙蘭憔悴菊萎秋葉底蔵春巳數頭詩客不知花韻别却言空結雨中愁梅溪先生文集卷第三
