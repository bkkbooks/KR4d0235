body:
  text: 記妙果院蔵記紹興戊寅春潜澗寳印師傳天台教于永嘉妙果院未幾有尼文賛来施寳蔵直萬金緇素咸恱潜澗師走介致書于越命某記之某甞聞吾儒中有二大善知識曰東坡居士曰王荆公俱以文章名世然其道不同終身不相恱及東坡記聖相蔵荆公深嘆服之盖二公俱深於佛故䏻賞音作者之手識者之眼不可相掩也如此某書生也扵佛學素否通曉其􅀅何􅀃以發􅀭之然於潜澗為猶子義不可辞抑甞聞佛之為教矣其􅀃􅁖貪而喜施與吾儒同然其徒多好人之施而不䏻自施失佛之意逺甚今是尼也富扵財積而䏻散生平植福之施動以千緡計又罄衣缽以製是蔵百寳粧嚴極其工巧卒不自有而帰之妙果可謂善施得佛之遺意矣然施易爾不妄施難是蔵之成也求之者多咸莫之施妙果不求而蔵自来可謂䏻具眼矣兹爲可書偈曰壮㢤古東嘉妙果宅其西老宿山中来應縁傳妙法有尼號員凈香火廬松楸衣缽抽萬金造次大寳蔵􅀴文浩卷軸一一刺血書用報父母恩普及一切衆神光屡發現遍地生金星至誠感幽􅄀􅀚者咸賛嘆忽發喜捨心願帰諸妙果法師慧業就宝蔵来證明􅀁施以其人是䏻具道眼圎淨施宝蔵道心益員凈况施扵妙果因果冝無窮妙果得宝蔵道場日益振大作諸佛事廣結諸因縁須弥一轉間功徳無邉量轉轉無巳時功徳亦如是夢庵記夢者誠之􅀁形也髙宗形扵得賢仲尼形扵見聖荘周形扵化蝶楊雄形扵􅄍鳯范式形扵􅁙友夢之小大雖不同其為誠之􅀁形則一也仙居陳君勉卿執親䘮如禮以孝称于鄊初求佳城未􅀗􅆍食弗遑一夕夢侍其親逰于睦溪之原指其䖏以語之明日訪焉果得其地􅁲人吉之遂畢窀穸因築庵以守以夢名之志其􅀁以得也某辱與君之弟文卿㳺上庠為同舍生又與君之子三省逰于剡三省以夢庵之事語子且求文以記予謂􅀚人之術不必驗之行事因其誠之􅀁形亦􅁕知其大畧髙宗可以知其賢孔子可以知其聖荘周可以知其逹楊雄可以知其文范式可以知其義陳君之夢可謂知其孝矣彼有夢屍得官蔵􅁾得財心之􅀁念者果何事夢之􅀁見者果何物耶與陳君之夢固有間矣雁蕩山夀聖白岩院記諾矩羅居震亘東南山名雁岩最為造物􅀁惜祕扵萬萬古而􅂋扵本朝山中絶境皆廬扵佛子開闢􅀴营必其徒之有道力者驅龍蛇虎豹魑魅魍魎而有之􅁠輿數椽侵㝷萬柱如全了之庵扵芙蓉今為䏻仁行亮谷于安禅今為灵岩文吉庵于碧霄今為灵峯是也山之内外招提無慮二十餘􅀁問其􅀴始與廢而復興無非有道力者焉山之東有嶺曰謝公丗傳灵運好逰山而不知有雁蕩䗶屣窮幽至此而返去嶺而北若干里有山曰白岩水曰仙谿去岩而北若干里有王子晉仙橋子晋遺蹟在吾州者三一在永嘉二在樂清兹其一也夀聖院在白岩之下峰􅋍而竒水清而駃松竹蓊然而深盖諾矩羅駐錫王子晋飛仙謝康樂登臨嘯咏之􅀁宜幽人逸士迯名晦身􅁱真斈道者徜徉乎其間也院創于唐㑹昌四年至明年廢又明年復興􅀄曰仙溪白岩院至大宋治平四年十月始賜夀聖額宣和三年燎于魔㓂院僧元象憫之草創殿閣塑像貌以奉香火􅀊乆寖壊僧子親慨然曰兹山吾祖潘氏􅀁捨殿與像吾師􅀁建也其可坐眠而􅈥之耶扵是紏同志募衆縁出力以成就之宝殿巍然輪奐翬飛􅀚者咸㑹􅂬喜讃嘆工未畢㑹傳教于邑之七宝双峯二院其徒文表住是山遂卒其事而道場為之一新嗚呼君子親者真可謂具道力有功扵其教者矣雁蕩山本覺院殿記有僧景暹来自雁蕩䄂前傳法䏻仁宣公今傳法灵岩行公書求余文記本覺院殿余延之坐飯之贈以詩辞不䏻記暹曰宣公年踰九十有名行緇林推重為老禅今退居是山􅁕以重吾徒行公蜀人傳心印扵名師與賢士大夫㳺且䏻詩甞受知扵君某以二禅師之命故来􅂅勿辞余善其言遂諾之院舊名延唐而不知其開山之始甞廢于㑹昌至乾寕二年復興増額曰乾寕延唐我宋有天下元年改賜今名院在雁山之東隅住以甲乙祥符延禧間僧友忠南逰五羊得天竺國貝葉梵書以帰至今猶存釋家旧殿建扵元豊􅀄􅀊乆垂壊日者以山門不振咎其基之不吉暹出􅂅力募財鳩工垂二十年以紹興戊寅秋九月易地而迁之棟宇鼎新金碧照輝用力孔艱迄乃有成可嘉也巳詞曰雁蕩之陽延唐道場毁于㑹昌起廢乾寕我宋龍興本覺是名先民不作金仙斯斍㠯斍後斍山中老禅出世應縁亦斍之先咨尔釋子潜心宗㫖不斍不巳忠得貝書暹興殿廬亦斍之徒殿廬既周勿怠薰修同國戚休唐祚既迁我宋是延億萬斯年天香亭記剡中佳山水為東南州之眉目汝南周君堯夫得爽塏于剡山之陽挟双谿之勝而家其上廣厦耽耽在剡爲甲有岩桂數百根皆古木也蒼然成林森然而隂洞前而深闢􅈳通幽而亭乎其中主人日與客㳺焉如入宜人之林而夏不知暑如登飛来之峯而香飄自天如􅀐蟾蜍㳺兎宫而下視人間世真剡中之絶景也予丙子冬過剡把酒是亭時尭夫􅀅􅀾藝南宫予因目之曰天香明年春果擢巍苐與予爲同年友堯夫命予記之而未暇逮今七載毎移書必及之乃爲之言曰學者方未第志在乎得耳得則喜失則非故以登科爲化龍爲折桂春風得意看花走馬晝錦還鄊世俗相歆􅃩曰仙子天上帰也是特布衣之士詫一第以爲天香耳若夫學士大夫􅀁謂香者則不然以不負居聀以不欺事君以清白正直立身姓名不汙干進之書足跡不至􅁠貴之門進退以道窮逹知命節貫􅀊寒而流芳後丗斯可謂之香矣唐宋璟以芬香勉張􅀃漢李固以糞土視胡廣趙戒名乎名乎科苐爵禄云乎㢤堯夫筮仕有䏻声且挺挺好議論時事逺大未易量予方以名節相期必不􅀒􅀁以名亭者矣堯夫又䏻樂教難弟諸子皆力學行見棣蕚聨芳芝蘭並秀濟濟詵詵天香滿門不止燕山之竇而巳然科第之香孰知名節之香堯夫又當躬行以率之顔范祠堂記聖賢有不同時而生得同時而祀者勾龍棄同祀扵壇為社稷之佐周公孔子同祀扵學為先聖先師顔子孟子同配食扵文宣王之廟功同道同時不必同也唐顔文忠公國朝范文正公時異道同者欤忠孝之性仁􅁩之學文武兼資之才正色立朝見危致命毅然不可奪之大節特書大書于史如出一身使其易地范必能􅂢軀死難如嚴霜烈日可畏而仰顔必䏻破西賊之膽威而臣之為慶暦頌中􅇪卨也又皆以直道不容出守于饒遺愛在民至今饒人語太守之賢者必以二公為首􅀊時祀之不絶􅂭興甲申秋七月某􅀄至郡訪二公之像或卑居乎老氏之官或雜䖏乎九賢之堂廟貌不􅁛祀事弗䖍扵典為缺郡圃有堂名慶朔文正􅀁建也遂即堂以祀堂之右有宇而虚命工葺之塑二像合為一祠以時之先後而左右焉書二傳于壁後十一月丙寅帥同僚祀之􅁔曰宋唐相望三百年堂堂顔范两鉅賢文武忠孝名節全胡雛哮噬方無前二十四郡惟平原首唱大義扶危顛朝廷草昧官鷹鸇膽落邪侫驚梟鳶􅀑質下拜心矍然殞身賊手命乃天一門忠義有二難􅇒烟閣上兄常山英烈言言光簡編銀鈎鉄畫餘剛堅􅆀君堯舜書萬言樂後天下憂則先立朝蹇蹇心惓惓邪者我仇屡左迁夏童􅅰邉躬􅐤鞬談􅀏為囯臣腥羶閣開天章䇿治安誰吾與者杜富韓風采􅏢􅏢四諫官徂徕頌配崧髙篇山髙水長大名傳吴頭楚尾番江邉甘棠遺愛清芬聨如秋桂菊春蘭荃像而祠之敢不䖍􅁰稷蘋蘩羞豆􅇼一杯薄薦清湾泉公乎為神為飛仙假令而在當執鞭凢百君子宜勉􅏧思賢閣記番陽􅈦事之東偏有堂曰平政堂之北有閣曰芝秀郡以芝名者四􅈦之後堂曰玉芝驛與門曰灵芝及是閣是也皆因芝山以名然亦繁且􅃨矣堂丗傳文正范公􅀁名雖百世不可易是閣名與堂􅀋冝易之閣北瞰郡圃春有百卉有㳺人鳥有幽声夏有濃緑有清風蝉嘒嘒有新声秋有踈林冝夕陽冝月冬有茂松冝雪中􅀚冝風雨中聴然皆不􅁕以名有九賢堂四賢堂在焉園林乃其遺躅也花卉皆其甘棠也茂松雪月乃其髙風餘韵也噪而静鳴而幽乃其吟咏中景物也登其間思人遂名之曰思賢予不才至郡且朞矣日坐平政堂􅉵精神扵案牘間不䏻使吏之不吾欺惧政之不平而有媿扵斯堂也則登是閣而寓目焉思賢也訟理政平庶民安扵田里而亡嘆息愁恨之心是􅀅何術以致之此予之􅀁以思亦後人之􅀁冝思也語曰見賢思齊焉羣賢不復見矣悠悠我思扵是乎書乾道元年夏五月二十八日東嘉王某記瀟洒齋記思賢閣之下有齋方丈餘北鄉前有􅂩地僅一畒畳石百拳鑿沼一泓有喬木數株藤蔓絡之蒼然而古雜以桃李橘柚衆芳之植濃隂幽香清逼燕􅆍東望砌㙜西接玉芝北臨郡圃隔以垣墻幽然有山林氣象宜琴宜棊宜飲酒賦詩簿書獄訟止扵平政堂齋中不知也采文正范公郡齋即事詩名之曰瀟洒公􅀄爲睦州有瀟洒桐庐郡十詩郡人甞以瀟洒名亭矣及爲是州又有齋中瀟洒過禅師句詩言志公􅀁至以瀟洒見扵詩章則胷中之瀟洒可知也讀郡齋詩至半雨黄華一江明月之句則知公之瀟洒扵一斎矣讀桐庐十詩至史君無一事心共白雲空則知公之瀟洒扵一郡矣讀區别妍􅎀削平禍乱之賦及先天下之憂而憂後天下之樂而樂之記與萬言書則其正色立朝之風采杖􅃏分閫之威名􅀴丗佐王之大畧是皆推胷中瀟洒之藴而見之扵為天下國家之大者也讀嚴􅁜祠堂記至先生之風山髙水長又知公與子􅁜雖出䖏之迹不同易地則皆然山髙水長非特子􅁜之瀟洒亦公之瀟洒也噫㣲斯人吾誰與帰是以名斎乾道元年六月􅃋日東嘉王某記䕫州新修諸􅁑武侯祠堂記益與􅇪皆祠諸􅁑丞相並見扵杜少􅁜詩錦官城外栢森森者益也卧龍無首對江濆者䕫也􅇪坟永安縣據三峡上流水有瞿塘灔澦山有赤甲白塩形􅀔險天下丞相昔與先主屯兵講武控扼吴魏􅀴营中原之􅀁有八陣圖永安宫卧龍山遺迹在焉祀而廟食冝矣然祠在州之南隅地非爽塏巷無喬木堂廡􅋻陋丹青黝剥祀事弗嚴無異乎虫蛇穿􅀞壁時僅免無首而巳吁可歎也前帥紫㣲舍人張公震甞立新祠扵卧龍命緇徒奉之而城中之祠未暇修豈留以有待耶乾道改元某􅀍命自番昜􅇪時方乃祠力甚俄一夕夢􅀚八陣豈丞相精誠黙有以告之十有一月至郡首謁祠下誄之以文曰丞相忠武蜀之伊吕髙卧南陽悲吟梁甫草庐之中三顧先主􅀅漢是興非刘􅂚與君臣魚水蛟龍雲雨才十曺丕志少寰宇假令母死師一􅂯舉吴魏可吞禮樂宜許寕使英雄墮淚今古􅀅畧非長庸史之語因命工葺之廟貌一新闢路植木榜其坊曰卧龍明年二月辛邜告成帥同僚祀之嗚呼公之生也䏻使其君委國託􅀌而不疑其􅃿也䏻使洶湧江流不轉千載之石然遺像缺落未甞一出禍福以驚動之益􅁕以見其聦明正直不􅂋其灵扵土木偶以求人之敬畏殆非柳之羅池比也今􅇪之二祠相継鼎新郡人四時香火牲牢酒醴之奉有加而不怠盛徳百丗之祀益章可以一洗江濆異代之恥無愧乎錦官城矣扵是乎書七月二十七日永嘉王某記㓂忠愍公巴東祠記詩言志非謂其必出於作者之手而後見其志也後之人有取於古詩一章一句而賦詠之亦足以見焉國朝太平興國中㓂萊公為巴東令有野水無人渡􅀌舟盡日横之句識者知其必大用然世知誦公詩而不知是詩本出於韋應物公取其七字析而増之應物雖􅀎道是語而官止郡刺史不見於施設殆不過為詩人之詩而巳及公取而用之則果䏻舟楫巨川是豈後人因其巳試之効而為是附㑹之􅀃耶盖公雅存濟世之心與舟横野渡之意合正猶鄭七子之徒取風人之意而賦之言發諸口而肺肝之隠洞然可見志之善惡身之吉㐫禍福皆不逃趙孟之所料也公為是邑時年方踰冠有愛在民世呼為㓂巴東其後致身宰相踐其所言景徳澶淵之功尤為雋偉方契丹入冦中外洶洶當時苟􅀙建議之臣幸蜀江􅀯則胡馬不止於飲河洛而三光五岳之氣必分公獨毅然决親征之策鑾輿一動醜虜自斃社稷安於泰山天下混一者二百年較其功烈與􅀓岩之人任舟楫之􅀉中興有商未可得而䡖重然性素剛直不與物浮沉晚節為奸邪所擠流落􅀯荒以死天下至今哀之某頃過公安問枯竹再生處有祠在焉因賦詩吊之過巴東舊治訪其祠則巳廢矣惟秋風亭尚存則又賦詩有不似公安之嘆尉王寕孫永嘉人也因命其建祠塑像寕孫即亭祠之既成以其圗来令毛君恕集公詩百餘篇并刻予詩以􅀉予平生欣慕公之為人每嘆靖康間復有如公者岀則南北豈至於分裂耶公之事固予所樂書尚奚俟乎再三之請然巴東故祠廢而復興殘編㫁藳散而復集江山増氣如公更生雖發端扵予而卒成就之者令與尉也皆不可以不書乾道二年八月朔永嘉王某記唐質肅公祠記于始聞夷陵巴東之名意其為邑必壮自適皆蕞尔邑巴東陋尤甚問其名之所以著曰昔㓂萊公歐陽文忠公甞令二邑地重以人非山川城郭人物之異于他􅀖也予因謁其祠訪其遺躅嘆息而去至􅇪一日登郡之東城城下臨奉節縣治問令喻君思然曰昔宰是邑亦有如㓂歐二公者乎令以唐質肅公對予曰是皇祐中為御史獨立敢言甞䟽論貴戚廷擊宰相以貶天下稱為真御史不敢斥其名而曰唐子方者乎熈寕中有言王臨川不可大用及叅大政奮然與争是非于天子前而氣不為之屈至不勝其忿而死天下至今稱為正人者乎吾夫子歎未見剛者唐公非剛者歟名節凛然固無媿乎忠愍决澶淵之䇿文忠移司諫之書也其令是邑有殊績異政故相張公天覺甞筆之于墓碑矣邑故有令如此而無祠非缺典欤令聞之慨然不謀于僚不􅃥于民即􅈦事之東隅易亭為祠求􅀞像扵江􅁜得之扵故家丹青一新儼然如生􅀚者莫不起敬如見其冠豸觸邪正色立廟時也且丐予記其事予謂質肅公之髙名大節固巳特書大書于國史何以記為然是邑頼公而重有不可不書者令蜀人捫膝先生子也有家學治邑有䏻声􅀚其􅀁慕可以知其人矣乾道二年六月永嘉王某記䕫州新迁諸􅁑武侯祠堂記武侯故祠在州之南門沿城而西三十六歩無断碑遺刻以考其􅀊月之始見于啚􅀴者畧焉在隋唐時治白帝史于少􅁜詩曰西郊諸􅁑庙者其地于兹乎某蒞事之􅀄謁焉裵􅆦四顧敬想風烈嘆庙宇之弗称他事未遑也首葺而新之且書其事于石矣然地卑巷隘混以民居汙渠糞壌混乎其間臭朽之􅀁蒸蝸螾之􅀁家非􅀁以妥灵而崇祀也門之東去祠一百八十五歩城有㙜下臨八陣啚登㙜而望則常山之蛇四頭八尾之􅀔宛其在目北直郡倉倉故永安宫也據爽塏状如屏宫之北有水曰清瀼瀉出乎兩山之間東入干江又東過灔澦入于峡峡口有山卓然立乎群峯之外者白塩也可謂江山之勝矣侯昔􅀴營天下扵平沙之上輸忠尽誠受遺立􅀌扵是官之中江流洶而石如故宫闕廢而地猶存陵谷雖変而精誠不亡宜扵兩者之間祠之亦侯之志也遂與同僚謀而迁焉地􅀄為節度推官宅徙于他􅀁因其址築而髙之用其材斵而新之為堂五㨕廡萬椽南門于㙜又門于西通往来之道像仍其舊新厥丹青冕服用侯又塑関張像翼于左右以諸作者詩文次之乾道三年四月壬午告成詩以祀之詞曰白塩峙天􅀆灔澦屹江風雲􅃤淡􅀆翶翔卧龍龍千秋􅀆何之新庙貌􅀆江之湄前八陣􅀆後故官龍􅀆龍􅀆神其中望昭烈􅀆隔清瀼遺庙存􅀆交精神扵惚恍駕虚空􅀆雲為馭臣東朝􅀆主兩顧魚得水而相忘􅀆事無古今儼関張扵左右􅀆一龍二虎祠有新故􅀆侯無重􅁿舍其故而新是􅁲苟邦人之情祠合于啚􅀆自令始祀事不絶􅀆有如此水興化軍林氏重修旌表門閭記乾道五年春三月直秘閣新福建路轉運副使林公孝澤自莆陽移書于清源守永嘉王某曰孝澤八世祖攅有至性唐正元間居母䘮哀毀甚自延甓以􅁙庐于墓有白烏甘露之祥時則有歐陽四門􅉟黄䖏士璞述之以文徳宗詔立闕旌間先世大其門以侈之嘉祐紹㒷間因敝而修時則有紫㣲吕公夏卿今丞相陳公實為之記逮今二星餘不治且圮孝澤大惧哀瘁不克震耀其先而無以為子孫訓太守鍾離公松賢而樂善不持請慨然出公帑二十萬葺而新之因其舊而稍加焉莆陽故清源属邑也孝澤之子㮤猶子虙皆君門下士幸為我記之某辞蕪陋未􅀗既而虙来請益堅属病未果夏六月又走書以督之某曰孝子之事傳于史文于二三大手筆矣奚俟乎鄙文􅀂夫孝感之異天報之厚守臣風化之敦與公之􅂋􅀭爾祖者則宜有歌詩以發􅀭之詩曰大㢤孝為百行先通乎神明光普天聖􅀴千有八百年亦以應感形諸萹李唐中葉正元年有林孝子家莆田䘮親五日食不咽手開坎室土自肩􅁙庐其傍護隧埏恨不殞身赴重泉天聴匪髙應昭然瑞氣非雲亦非􅃄異香馥郁非蘭荃飴宻匪甘珠匪圎腸中不晞明且堅灵鳥皓質来翩翩耳驚目嘆􅀚肩駢使者来廉迹其阡露随哭声洒雲邉詔旌門閭繇賦觸名書史冊光厥傳年垂四百家声緜雲来滿門業青編世登桂籍香名聮人葉有孫壽而賢移以事君忠孝全黄堂主人職承宣鼎新双闕光厥前宋唐四傑雄文鐫奚止照耀莆山川要令四海皆參騫孰非人子冝勉旃泉州新修北樓記温􅁜之有北樓猶武昌之有南樓也慺閣㙜榭之在天下以南北名者多矣而二樓之名獨著得非因人而重邪南樓以􅁃公重北樓以歐陽四門重然􅁃有汚人之塵君子恥道之不若歐陽氏以一代文傑聮名韓李諸公真足以重兹樓也予乾道四年冬十月至郡越數日䇿杖州宅之北有屋􅀅壓邪衆木以支之詢之乃北樓也􅅥焉不敢睨矧敢登有碑塵如積漫不可讀乃四門􅀁作之記歎息乆之郡舍老而弊冝修者非一椽然莫急扵兹樓也苐視事之始方問民疾苦土木之􅃥非敢先郡多􅄓風日惟傾覆是惧明年春二月建貢院秋八月落成得餘材始命工葺之冬十有一月丁卯董􅃥者以訖工告與同僚三四軰登而四顧山川城郭之冨尽在目中亦一州之壮􅀚也既相與賦詩又為之詞曰閩南有州北墉有樓席侯肇謀發揮以文樓乃有聞歐陽四門載建載修克紹逺猷鄭吕二侯政和間鄭南建紹㒷間吕用中重修歳月浸乆楹腐桷杇伊予来守偶􅀊之豊時定之中迺鳩爾工材即其餘費節其虚踰月如􅀄泉山之状桐城之壮可登以望身焉南極心焉拱北守臣憂國匪遨匪逰風􅀚瘼求守臣登樓民淳俗樸菑害不作登焉斯樂風俗惰媮閭閻恨愁登焉則憂居而官理登時民喜登斯無愧讀禮堂記為士者来甞不讀書然知真讂書者觧䏻讀而不䏻行是猶鳯鳴而鷙翰雖胷中有萬卷身為行秘書謂之不􅀎讀可也子路曰何必讀書然後為斈由也孔門髙苐號為有聞豈以書為不􅁕讀耶必時人有䏻讀而不䏻行者與不讀同盖有激而云然由之言非􅀁以為訓故夫子疾之書之難讀者莫如䘮􅁙之礼非難讀也不素讀也為人子者親方在堂諱聞不祥之言児時入小斈從句讀之師誦十八章之􅀴至䘮親章則或置而不授少長讀礼記凢䘮􅁙之萹則掩卷而不忍讀一旦遭荒迷之变瞢然不知有直情徑行者矣豈復知品節斯斯之謂邪聖人著之礼􅀴以詔人子曰未􅁙讀䘮礼既葬讀􅀕礼非徒讀之正欲使之尊􅀁聞行􅀁知賢智者不至扵過愚不肖勉強而跂及焉莆田􅃽君元肅好古而䏻文扵書無􅀁不讀喜親之享年而榮其生封也名堂曰藴仁鄊黨歆􅃩之其執親之䘮也又名堂曰讀礼養生䘮死無憾可謂知真讀書矣昔吾夫子語門弟子曰生事之以礼死􅁙之以礼􅀕之以礼子思習聞家斈以礼􅁙親四方扵是乎觀焉􅅬文公問礼扵孟子行三年之䘮扵􅀾國礼廢之時而弔者大恱礼之不可已也如此元肅扵礼既飽讀而躬行之又以是而教斈者南方多士其有立扵礼乎然礼雜出扵諸儒之手未必皆合聖人制作之意元肅既講習討論之冝削其不合者使礼記為全􅀴斯有功扵名教矣豈止誦讀云乎㢤乾道六年三月永嘉王某記廣州重建學記聖人之道合内外􅀄無華夷迩遐之間不幸無時與位道不得而行必待後丗右文之主儒斈名世之臣以主盟吾道樂育人才為巳任然後斯文有傳與王化並遐吾夫子以天縱􅀅聖生扵晚周之魯木鐸之教止行乎洙泗三千之徒􅀁過之化僅及扵歴聘七十二國爾甞慨然欲居九夷淺人不知其志詆以為陋嗚呼使夫子居之何異坐杏壇之上化魋結為冠裳变鴂舌為絃􅁔濟濟洋洋是亦鄒魯也何陋之有炎漢李唐之君尚文崇儒文翁常衮以儒為郡咸䏻㒷斈官登諸生授以詩書丕变蜀閩同風洙泗惟南粤去王都為最逺至仁如唐虞有􅀁不䏻柔漢晋隋唐間雖號為一統然徳薄化淺声教不䏻暨朔南岳牧名臣雖清白如吴􅀮之剛正如宋廣平咸著治績而庠序之事闕焉是冝裒衣愽帯射䇿决科之士不䏻與閩蜀侔盛也宋㒷混一海宇臣妾僣偽南海四世之㓸面縛闕下赦而不誅变汗染之俗為礼義之地慶暦間詔天下立斈番禺僅䏻修夫子廟以應故事至皇祐間始建斈于郡之東南隅熈寕􅀄徙扵西紹聖􅀄守臣章楶改創新斈然規模未宏不足以容多士與雄大之府弗称乾道三年詔前右正言龔公茂良自憲㙜為方伯下車之􅀄務先風化明年春上丁􅇚奠于先聖先師顧瞻祠宇痺陋楹桷頺圯繪像不如礼豆􅇼簠簋無餘地可陳廊廡迫隘至不容折旋講肄之􅀁去殿庭不咫尺升者病之喟然謂諸生曰治孰有急扵此乎扵是始議改造即番山之址以為堂閣御書扵其上東西十一筳南北九之庭之下什伯其􅀄増闢兩廡倍其舊六齋對峙前繪從祀像置番禺南海二縣斈于後惟大成殿仍舊規而加葺之藻飾煥然侈扵他􅀁門以櫺星繚以周垣大江横其前恊泮水之制費出激賞公庫撙節之數憲􅈇舶三司􅂇以羡緡歛不民及􅀴始扵夏四月訖工扵日南至行􅇚菜鄊飲礼以落之明年公召還道温􅁜謂守臣王某曰公為我記其畧某與公甞同事史舘稔之其為人貌和氣平盖一謹厚者耳及為天子言事官正色立朝排姦憸甚力視棄官爵如脫弊屣至今朝野語正人必􅁛公出典大藩又䏻行其􅀁斈不鄙夷遐方僻壌之民廣儒宫以教之可謂儒者矣郡愽士日與諸生登忠恕堂明一貫之道講論齊家治國平天下之要扵正心誠意間移孝為忠盡臣子之大節上不負天子下不負賢師帥􅀁以教化作成者異日􅀭王庭立名節姓名光史冊如張曲江姜日南余㐮公者不一而足又豈止讀􅁓上語工文詞􅂑科苐抗衡上國而巳㢤扵是乎書公字實之㒷化人今為江西帥云乾道七年正月敷文閣直斈士左朝奉郎提㪯江州太平興國宫王某記梅溪先生後集卷第二十六
