front:
  text: 梅溪先生後集卷第七
  hash: sha256:68ce60e5eb65f9e6c01209a94f79579fe6bedadcdc1ff2fd60546f4885ff8af4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_007-1a}
body:
  text: 詩赴召壬午六月十一日上受禪二十一日有旨除臣某知嚴州九月二十一日召赴行在聖主龍飛􅅻十日㣲臣得郡古嚴陵詔書又趣帰天闕􅂅竭孤忠賛中興曹夣良贈炭戯成一絶予時為郎夢良為嚴州司户烏龍書至送烏薪郎舎嚴冬覺有春未睱吞為啞口漢旦須煖作直身入宿學呈同官時為司業宿學􅀻試不聴梧桐雨回頭已六年虀塩諳舊味燈火結前縁進學思韓愈同􅁭有鄭䖍諸生不待􅂆忠孝素惓惓某去五月罷館職還鄉塗中以詩􅀉同舎云去國懐明主離群念舊㳺翻令到家夣中夜繞瀛洲今以史職復至道山訪舊或遷或去惟後園􅁱竹乃故人也感嘆良乆因成短篇蓬萊隔弱水三年兩来㳺群仙各何之翩然蛻神洲園中舊籜龍勁節含清幽手摘歳寒葉恍惚乗帰舟馮員仲赴闕奏事士君子咸􅁒其􅇔聞為魏公所辟􅀔不可奪遂成鄙語兼簡查元章名徳重夷夏皇朝两魏公平淮巳得愈論􅀅更資馮報主男児志知恩囯志風書収良馬去兾北遂群空予甞以書􅀉馮云聞元章為覯公所知裴度幕中得韓退之賊不足乎矣元章時為機宜員冲為江西運判召来奏事程泰之郎中以詩三絶覔省中梅花因次其韻長記蓬山舊賞梅芳樽一􅀏共君開重㳺未見梅花靣應誤君詩得得来詩似西湖䖏士詩十篇三絶闘清竒更􅀅正味森嚴句壓倒屋􅉉斜八枝程未篇云花中結子酸連骨正味森􅃊衆苦之待得和􅅅渠自㑹如今莫􅃹人眉竹亭不到㡬經時来徃逢梅似退之遥想吾廬溪上好十分鄊思又関眉胡秘監贈詩一絶司業口占絶句竒甚銓􅂺用韻和呈効呉躰南山舊􅀃王隠者北斗今㸔韓退之不湏覔句花照眼行見調􅅅酸着枝棊依韻奉酬平生恨未識剛者今日豈期親見之􅁒把江梅比孤潔江梅無此􅀊寒枝時胡丈同館中諸公見訪因􅇔小酌予舉和程泰之梅詩壓到屋􅉉斜入枝句胡頗称賞和枝字韻以贈胡秘監酴醾詩銓携具賞石渠酴醾用坡韻呈同舎酴醿獨殿春得路未為晚露葉張翠繖月蘃明玉􅎻洗粧雨亦妍暗麝風更逺唐時真宰相勁氣凌諌􅁐危言工切劘壁立萬仭瓛帝為釀此花以賞碩􅀞婉清芬濯千古天河豈湏晚不妨便醉死聞香定魂返唐憲宗以李直言賜酴醿酒未若此集真酴醾也某次韻秘監携具道山集群仙賞酴醿和東坡詩真雅㑹也某偶以􅀻試鎻宿不與遂次其韻紅􅂵紛爭先酴醿分甘晚誰栽群玉府童童翠張􅎻華共芬芸香韻随官逸逺舘中酴醿在著廷之後著作􅀰号逸逺官奚用燃青蔾端䏻照書􅁐先生海上帰平歩到蓬巘招邀飲醇酎剛腸出清婉遥思呉宫魂故作楚辞挽勿爲花所􅇔興盡要知返館中三月晦日聞鶯胡􅀖衡有詩用東坡酴醿韻有居側無䜛人發口不湏婉句某次韻乆傷伐木廢毎嘆吾生晚黄鳥􅀙何来喬林緑埀􅎻忽作相呼声朋来無近逺髙翥凌雲烟斜飛集池􅁐中有幽谷次遲遲下遥巘群音巧相和出語獨不婉啞啞如老烏聞者弓欲挽知心有杜䳌􅂆爾故園返上賜講讀官建茶某以􅀃書與馬以十餅分贈太學同舎苪太愽煇有詩次韵天表􅀄容咫尺親雲龍重拜太官􅈿賜􅀙明主恩􅀹渥分及清流事更新搜卷要湏甞七椀乗風便合到三神諸公異日估君貺􅂅􅀉江湖老散人四月􅀙駕詣徳夀宮與諸公㑹食于和樂樓是日借洪景嚴承㫖馬戯云􅀙駕濫􅀐承㫖馬朝天叨綴舎人班時為起居舎人異日􅄪集胡舎人􅀖衡云不可不成篇也遂扵楼中足之殿􅉾經幄侍清閒學術空踈媿在顔􅀙駕濫􅀐承㫖馬朝天叨綴舎人班登樓雖喜民和樂論事还驚世險艰聖主英姿同藝祖諸君何苦恋湖山時議欲乞移蹕建康侍􅀙諸公有異論者故云周登和樂楼韻酬胡􅀖衡送别兼簡劉韶羙秘監未訪鄱陽范與顔顔魯公范文正公俱守番陽雁山􅀷䖏且􅄬閒􅂵泥長記曽同召丹陛何繇更對班我媿未行平日志公應不創昔時艰筆端䏻制人生死兼有劉郎在道山予與􅀖衡詔羙甞同為編修官予既入臺即罷史聀而二公如故去囯大月十九日去囯常憂國还家未有家先人􅁦庐為風雨所壊君恩報無所含媿出京華重㳺釣䑓三年兩泝釣灘濤来徃何曽􅀘一毫聖主雅恢光武量㣲臣當遂子陵高弭棹祠堂下一天星斗明客星㝷不見影浸釣灘清過婺女同年王節推夷仲黄教授万頃鄉人華主簿子周㑹飲双溪楼年時甞泛婺溪舟未上清風八詠樓天為故人償夙􅂅辛已五月至婺溪夷仲諸同年有登樓之約忽聞欽宗諱遂止水知吾軰喜清流沈郎不為吟詩瘦王粲長懷去國憂明日山川共人逺鄉情年契两悠悠㳺仙都皇都帰客過仙都厭看西湖㸔鼎湖洞接龍泓片雲近有龍泓洞山分雁蕩一峯􅀌有石柱壁立如雁蕩天柱峯香清天上碧菙落音好林間青鳥呼天遣林泉尉吾軰不容身世老迷塗㳺洞谿舊名􅁖溪因段成式改名好溪有唐太守李君卿十詩有亭名思賢段公不到溪豈好李守已亡詩更竒偶向思賢亭上坐愛溪兼愛昔人詩重㳺石門洞石洞幾時闢石門長不扃貪㸔一派水三載兩回經誰把銀河水直􅀙天半傾好流人世去一洗四維清􅀉題喻叔竒亦好園喻子有園堪飬親栽花種竹清且新堂中戯罷即䇿杖叔竒有母家有戯采堂在家有此何憂貧弟兄既好園亦好叔竒與兄伯夀同登科大勝吾家園小小兩園松竹懐主人他日歸来各須早種􅂼癸未孟秋帰自武林小小園荒蕪之甚遂課僮僕畦以植􅂼近得㣲雨頗有生意潜澗老叔分葱虀数十本及菜子一二種今冬百指可以無饉矣書十五韻歸来日弹鋏食無肉與魚􅁍􅀅種花地町畦毓嘉􅂼驕陽毎抱甕時雨親荷鉏青青有生意令我顔色舒寕憂饉與飢亦有瓶中儲前身老闍梨或云予前身􅃊闍梨也因以戯云􅂼氣端未除文字亦宿業復生魚蠧書蠧書仍食􅂼苦淡味有餘况茲清凈根分来自僧居端䏻納湏弥聊爾秀郊墟洗我腥羶腸退之詩云声名暫羶薌非止為魚肉也􅁭宇生清虚豈惟陶淵明吾亦愛吾廬荒園渉成趣枯藤當安輿困枕案頭卷飢著盤中菹孔門陳蔡色借問何如予予素不善棊孫先覺萬大年林大和見訪戯與對壘偶皆勝之因作数語予手不善談臨局氣先怯偶逢孫萬林三􅀾􅂺三捷都縁敵不勍非以臺威脅孺子濫成名凱奏意殊愜三君皆壯士小挫未肯厭予今務持勝堅壁不容刧予昔在舘中毎與同舎郎陳阜卿手談既而陳迁䑓察一日相予棊諸公戯云陳今有臺威公必敗予偶勝之陳􅀏曰公果不畏臺威邪大年和棊詩復次前韻君棊如龍且􅀄􅀏韓信怯我棊似公瑾赤壁真横捷但知貪旁角不覺攻背脇主人本無競勝􅀒兩俱愜嘉賔儻再集鏖􅀾定誰厭新篇􅀹逼人我軰徒劫劫太白晝見太白昼見乆矣予是日始親見之八月二十六日煌煌太白生東方追逐殘月生光芒太陽中天不肯蔵過午一􅀧猶㣲茫太史占之此何祥咸憂兵起人流亡金行用事多灾傷六月十五日大風水七月朔日又作八月二十一夜地震自秋七月不雨浙西飛煌蔽天大風地震水旱蝗有一于此冝預防雜然並見何以當臣言天意未可量滔天赤地興堯湯偃禾㧞木悟成王宋景一言國乃昌災異不作憂楚荘吾皇修徳應彼蒼去讒逺侫任忠良推誠納諌正紀綱内修政事仍外攘誓雪國耻還封疆強虜當弱吾當強天文志太白與日争明強囯弱弱囯強天戒為福非為殃􅂅勿徒以虚文禳荆婦夜績凉飊堕黄葉促織催女工􅁂􅁝不堪織細君哀我窮青燈績􅀷夜績成寒素風􅂅為􅀮者衣徳耀随梁鴻術者謂子命犯元辰故毎仕􅂺已予􅀏曰有是哉戯作問荅語問君胡為八臺省問君胡為官􅂺冷宣尼猶且畏元辰羊䑕龍猪作君梗退之宿直斗牛箕声名謗毁常相随死生竆逹端有命予知之矣當安之再至雙植堂呈表兄李克明此日一樽酒再㳺双植堂湖山浮野色草木帯秋光東道徳已孰西風花更香相㸔俱老矣㑹合意尤長九日􅀉表􅅩賈司理并引某昔􅀙潘先生學九日登鹿迹岩甞賦詩呈諸長者時年十七今閱三紀矣當時和者賈太孺潘先生劉謙仲覺闍梨皆一時詩人也某猶􅀎記其畧􅂾老人化去乆矣思之􅁣然司理丈鹿岩賢主人也佳節必盛集某恨不􅀗奉樽爼􅂺成古詩十韻以記舊事并以􅀩泉酒鳯團荼為夀憶昔􅀙師學絃誦年與賈生相伯仲某詩與諸賈昆季㳺皆年少也九日登髙鹿岩脊感物題詩筆􅀄㺯舊㳺回首半零落三十六年真一夣當時唱和三四老尚有殘篇可吟諷今年節物身在家行樂山間謾随衆弟兄􅂆我登高山身似駑駘不容鞚兄弟鄰里􅁒同登髙某以時多㐫荒灾異反賊軀多病止之河東先生今靖節有酒寕須白衣送朋尊聊献菲􅀩泉近日􅀩泉酒下佳趣有菲泉最下品酒也可以菲􅀩泉名之賜茗仍分小團鳯願公一飲夀千齡三物年年敢馳貢九日不登高與兄弟鄰里就􅁦舎飲菊中秋對明月中秋亦就家賞月九日逢黄花節物豈不好而况身在家樽酒醵鄰里盤飡飣魚鰕何必登高山清􅂬自無涯仙居陳少曽􅀉錦石杯書至乃九日也方與坐客把菊遂用以􅂆酒九日登臨有雁来書傳坐上手親開呼児滿酌黄花酒為子深傾錦石杯僕夫浚井得双鯽一鰻未及烹也蔵之泥水間予見而放之因作数語三秋不雨泉脉枯僕夫浚井欣得魚刀砧已具未及殺我偶見之魚􅄪活親􅄬不敢使校人圉圉洋洋生意新莫嫌井小思滄海尺水相忘聊自在得張大猷尚書書云比毎進對屢以待御為言而􅀖衡舎人言尤数切云云某為郡邪所疾獨見知二公因讀􅀖衡和和樂楼詩復用前韻一月霜臺屡犯顔未回天聴巳身間愛君憂國寸心赤感物傷時双鬂班文舉才踈意徒廣子雲思苦語尤艰尚書左史雖知我超海應难挟太山次韻題寳印􅅩蘭􅀂堂何䖏名蘭􅀂依山結草堂花枝法雨潤心地佛灯光浮世􅅝塵隔空門􅀊月長林間有啼鳥聴法亦来翔藤杖頭角槎牙萬歳藤徧身節目更稜稜山僧贈我非無意要我清閑亦似僧予還自武林葺先人􅁦廬凈掃一室晨起焚香讀書於其間興至賦詩客来飲酒啜茶或奕棊為戯蔵書数百卷手自暴之有小園時䇿枤以㳺時遇秋旱驅家僮浚井汲水澆花良天佳月與兄弟鄰里把酒盃同賞過重九方見菊以泛觴有足樂者毎覧鏡見蒼顔白髪亦聊自歎也作小詩十五首掃室洒掃學者事陳蕃胡不然要令天下净端自室中先焚香掃地眼塵淨焚香心境清案頭時一炷邪慮不應生讀書八政慚無學還家更讀書翻同小児軰相共惜居諸賦詩秋興最难遣詩懐如亂雲雖無小陵筆一飯不忘君飲酒我意豈在酒銜盃聊樂天客来同一醉客去獨髙眠啜茶濫與金華講賜沾龍鳯團􅁍歸林下飲更媿是麄官奕棊光景老尤惜忍銷枰奕間娯賓欠􅁝竹一局􅀾清閑暴書秋日更可畏所宜惟􅁀書反身還自􅀏均是蠧書魚䇿杖園小日思渉山高時􅁒登老来疲脚力興至䇿枯藤汲水浚井得鰻放之明日水漲靣清僕夫云鰻􅀎穿石眼通泉脉故戯汲之山中乆不雨汲水欲何􅀙一夜井泉逹靈鰻􅂲是龍澆花花木正憔悴秋陽那更驕驅童綆深井聊􅂇化工澆賞月還舎八十日三逢明月圓停盃試一問歸去定何年采菊既晚開何益采之聊泛觴書生自頭白奚用泣馨香覧鏡可正冝頻覧無塵亦自磨少陵今老矣功業欲如何浚井旱乆井垂涸汲多泉更渾浚教泥净盡何患不逢原酬林明仲􅀉書并長篇名季任江頭一别九十日路隔烟波望􅁒迷風送雁群来雁蕩書􅀙梅嶼到梅谿羡君筆力䏻豪徤贈我詩篇過品題謝客江山富􅀚覧城南何日手重携昌齡欲㳺白石興盡而止予亦思前年之㳺遂次其韻前年蠟屐逺尋幽洞府曽經一宿􅇔詩句親題碧雲裏夣魂時到白岩頭風生見􅀃欲飛去興尽何如且罷休他日相呼老兄弟飄然杖屨共翶㳺洪丞不􅀒軒坐此軒無媿問君何以䏻所行皆是學不􅀒豈惟丞鳬鶩文書靜槐松詩思凝􅀶陵徒種績踐履亦何曽周丞奉挽詩同年周敏卿父平生義方教真是起家媒有子􅂅已足無心官自来興随鳩杖逸情為雁行哀想見長塘水凄凉遶夜臺黄岩趙十朋賢士也有詩云四枚豚犬教知書二頃良田侭有餘魯酒三盃棊一局客来渾不問親踈予亦有東臯二頃兩子皆學讀書客至則奕棊飲酒遂用趙君詩意成一絶薄有田園種斗升两児傳授讀書灯客来一局三盃酒王十朋如趙十朋陳商英挽詞貴似金張當石崇紛紛老死利名中退居不見香山老肥遁誰知秀野翁啇英号秀野翁溪上園因種花闢牀頭金為好賓空潸然痛念公兄弟二十年前筆硯同陳商霖挽詞疇昔㳺􅀙分不䡖十年鄉校讀書燈徳星㑹聚三兄弟詩社追随八友朋昔在招仙館有八叟之号啇霖号可叟去國悲凉老王粲还鄉牢落失陳登誦君生死炎凉句斜日寒天涕滿膺商霖甞有詩云生死交情誰念旧炎凉丗態競迎新萬清之有詩三絶呈司理賈犬并簡某因次其韻燈花端為故人然留客殷勤為撃鮮更覺門䦨増喜氣氷清玉潤两俱賢清之司理婿也世路塵埃逐日生鹿岩高卧自風清吾皇有詔求遺逸行見臨雍拜老更甘言恥効􅁡翁翁逆耳空餘甽畒忠願子他年似房杜好􅀅一語記文中再用前韻論文尊酒意􅂬然蠟炬高燒夜色鮮得壻端同􅁠相國傳經更似老􅅊賢右呈司理僚壻欣逢舊友生人如王謝氣尤清十年前巳心相許細㸔新詩貌愈更右酬清之士論鄕評重乃翁賢如狐突教児忠治安䇿就君冝献宣室開時夜正中右贈大老司理予未臘而雪豊年兆也大老有詩次韻明年禾黍定千鍾瑞雪搀先舞曉風更願平淮捷書至西平禽賊献司空主人開燕倒金鍾坐客俱吟柳絮風應念人間有貧者爐星撥尽酒瓶空雪中􅀉梅花與清之大老天花除惱臘前雪香蘂報春溪上梅分贈鹿岩龍宄友異時俱是百花魁題夣齡五桂堂我昔曽栽㑹趣堂子今封植更芬芳勝它福峙三珠􅀣賽却東嘉五馬坊永嘉王氏双桂正在五馬坊靖節柳青寕耐乆大夫松老恨無香何如移得蟾宫種不媿靈椿竇十郎􅀉鯉魚與萬大年江楓揺落江梅破江上詩人有佳句欲於龍穴覔明珠試遣鯉魚傳尺素梁府君挽詩麗水人子安世登科两郡三鄉頼保全乃翁劍學不虚傳黄巢詎敢臣周朴趙勝那䏻爵魯連仁里化成儒氣象心田種得佛因縁竒児自是青雲士行見榮光燭九泉永嘉盧仲􅁱永年䄂文見訪酬以短句地僻原名左天寒􅀊欲徂遥遥屈佳客得得訪􅇓夫一第且慁子八篇真起予有論八篇蜚聲叅四傑誰復敢前盧林明仲和詩復用前韻婁􅀾夷吾卒覇齊􅁄棲鵉凰暫沉迷探春想見登梅嶼乗興何訪泛雪溪楼上清􅂬庾公興橋間壮志馬卿題四􅂣筆力媒身䇿平歩青雲豈待携張噐先和詩復用前韻心欲齊賢媿未齊逺􅀩佳句警昏迷音如鼓瑟鏗清廟味似煎茶闘建溪憂囯非同長卿病感時端􅀋少陵題二松豈是淹賢地鳬鶩文書謾抱携􅀉蒲墨與明仲四友共文房蒲君最異常研磨發文采好去奉仇香􅀉沈敦謨名希臯瑞安人二十年前舊友生緘封逺􅀉見交情舊㳺回首多零落大噐如君合晚成送謝任之七歳吾􅀙乃祖㳺童􅀩深媿未䏻求堪嗟四十五年事昔未褁頭今白頭梅溪闢舘子来㳺回首如今二十秋端似韓張互傳授要令編剗紹箕裘去年還家巳半年盍簮尊酒􅂾留連嵗竆送别溪頭路手把梅花思黯然題雙瀑女媧石爛幾經修天漏猶餘兩派流離合無心元不爭朝宗得路􅁍相􅄬干雲寳劒真同氣出蕩神龍不異湫雁蕩有大小二龍湫何用築門防俗駕林泉自是少人㳺双瀑亭壊乆矣洪丞命工起廢氣象一新且欲築門以防俗駕故及之癸未守歳嵗冝鄉里守杯共弟兄銜明日人相問行年五十三張噐先復和詩作五言以􅀉短棹别􅀌嶼故山歸左原遥煩雁足字重到雀羅門􅀊月􅄈新老文章憶舊論見詩如見靣氣象有餘温萬孝全贈金華洞石名雪洒遥峯作進退詩次韻天闢金華一洞竒洞中石是化羊遺渾疑雪向閩山落更訝峯􅀙天竺飛谿上又􅄈乗棹興案頭如照讀書時故人重我膏盲疾田不荒蕪應亦帰元宵鄰里携具就􅁦廬張燈辞之不􅀗因成一絶凶年猶幸在家鄉鄰里相過具豆觴我軰忍􅀅燈照眼㳺人多是火燒腸祈雨不應歉􅀊還鄉益困竆瓶無儲粟酒尊空醉經且學文中子閔雨難祈應上公自秋七月不雨至于春二月十九日僅得雨昌齡作賀詩予未及和而雨止矣遂次韻以閔之水旱年年費請求仰勤湯禱與尭疇何時三十六雨足當宁免懐雲漢憂一杯未吸甕頭春初欲率飲賀雨以晴遂止三疊聊􅁔雨裛塵不用遽興風伯訟洪羊真是可烹社日喜雨復用前韻社日􅉉間不断流淵明欣􅁒事西疇􅂅言一飽均􅀺庶瓶粟無儲不用憂欲放乾坤萬里春要湏先洗􅁃公塵朝紳賀雨詩多少誰是詩中諷諌人家食遇歉有飯不足之憂妻拏相勉以固窮因録其語淵明事高尚瓶中缺儲粟魯公凛名節乞米給饘粥廣文富才名官冷飯不足少陵老風騷橡栗拾山谷嗟予何爲者處世真碌碌謀生一何拙甔石無儲蓄三年两去囯嚢槖罄水陸還家索租苗不了臘與伏前秋遭􅄓風摧折数間屋今年丁大侵破甑塵可掬絶糧痩百指告糴走群僕鄉鄰苟不捄定恐填溝瀆家蔵千卷書父子忍飢讀一字不堪煑何以充我腹細君􅀏謂我子命難食肉去􅀊官䑓省僥倖食君禄有口不三緘月奏知㡬牘聖主倘不容寕免逺竄逐帰来固已幸冨貴非爾福東皐二頃田得雨尚可榖子耕我當耘固窮待秋熟聞小使胡昉抗虜不屈上甚嘉之有旨命右揆撫師仍有和不可成之語皆出睿断宗社之福也昌齡有詩次韵用儒端可復侵疆活囯何勞別取方文帝要湏親御馬子卿寕患逺看羊撫師暫屈黄扉老論􅀅寕咨白首郎行見車書混天下豈容南北分三光昌齡四月十九日得男請名於予命之曰遟端似中山夣得詩海中仙果子生遟况當首夏清和後更遇千秋啓建時是日啓建天中莭祝爾願同彭祖夀命名􅂓効小蘇児蘇黄門子由子名曰遟其後最盛吾家種徳已数世庭户合生蘭與芝山丹花四月相􅀅莫山丹開始都真心本来赤正色自然朱百合晚仍俗石榴繁更麄誰􅀅僊􅍳藥花裏着工夫梅溪先生後集卷第七梅溪先生文集卷第七詩林下十二子詩并序梅溪野人既見黜扵春官齒髮老矣悟虛名之可厭知林泉之􅁕樂也家之東南隅有井焉泉清而味甘井畔有脩竹数百挺闢小徑以通幽有梅数根欹卧乎竹間兩桂蒼然夾井而植因蒔蘭于竹林之下植昌陽于井旁以増野趣予與賔友杖屦徜徉賦詩飲酒弈碁于其間頗足自􅆘遂命曰林下七子且字竹曰子脩井曰子深梅曰子先桂曰子蒼蘭曰子芳昌陽曰子仙梅溪野人為之主故自字曰子野仍賦七詩以寓意牡丹芍藥花中之冨貴者桃李艶而繁凢紅艶之属俱非林下客也皆不取予既醉而卧夣有五人来謁自稱黄公丁公栁先生三徑居士三槐公子予延之坐黄公乃前曰聞主人有林下之㳺與六子為友褒之以名字寵之以詩章亦一時之雅致也某雖不才然封植于君家乆矣獨不與兹選何耶予曰予非敢忘公也然所􅂑者皆井竹間諸友公所居差逺予與客㳺林下而公不在眼故不與焉爾黄公艴然曰主人欲隔籬墻分尔汝耶予媿其言許以嘉客䖏之丁公踵進曰主人昔有幽居三詠某與黄公竹生與焉今竹生首與林下選黄公亦辱千金之諾矣主人苟未忘壁上語願以某䖏坐客之末可乎言未畢栁先生三人俱進皆有請焉予悉頷之既覺而思此必吾家黄楊丁香槐栁菊也予不可食夣中言遂字黄楊曰子嘉丁香曰子素栁曰子春槐曰子夏菊曰子秀復賦五詩以贈之通前凢十二子焉時甲戌孟夏也竹子脩萬木蕭踈怯􅀊寒子脩相見喜平安世間寕有揚州鶴休訝平生肉食難井子􅀷度量泓泓井子􅀷客来車轄總䏻沉定湏再築新亭覆不􅀒先君好事心先人昔嘗以亭覆井日曰投轄梅子先竹外溪頭手自栽群芳推讓子先開好将正味調金􅂦莫似櫻桃太不才桂子蒼學仙深愧似呉􅀰頼有吾廬两子蒼疑是廣寒宫􅂻種一秋三度送天香蘭子芳國香入鼻忽􅀭揚知是光風泛子芳林下自全幽静操縦無人採亦何傷昌陽子仙天上星􅀰字子仙結根拳石傍清泉豨苓方入毉師手誰識仙姿觧引年黄子嘉保緑軒前黄子嘉非松非栢亦非花故應喚作思人樹数十年前閱我家丁子素雨底含愁雪裏芳琉璃葉映小何􅀰世人競重熏籠錦子素何曽怯瑞香栁子春夾道青青栁子春自􅀙栽植㡬畨新如今巳作參天樹應􅀏衰遲老主人槐子夏方苦炎炎畏日長欣蒙子夏恵清凉三槐雅是王家物為榜新亭擬舊堂菊子秀子秀霜中色更嘉金錢粲粲滿庭堦淵明異日開三徑端仗兹花尉老懐王子野埸屋虚名且罷休帰来􅂓效晋人㳺林間諸子總非俗肯與野人為友不昌齡闢團植花索詩扵老者戯作数語兼簡夣齡東園小小花木稀西園廓廓規模竒西園主人但置酒東園老人甘賦詩朝㳺西園飲千斛莫向東園吟百幅更約南園好事人酒盞詩篇日相續西園新闢昌齡索詩予以其未開尊也戯作数語既飲復用前韻阿連好事由来稀開軒闢圃幽更竒峯峦羅列冨遐覧氣象􅀵拾㱕新詩百挺琅玕花数斛宛似輞川圖一幅朝莫過從有弟兄長􅂅歌聲無㫁續予與二弟連日賦詩飲酒詩成命二子書之亦居家之一樂也復用前韻不愁地闢車馬稀自喜兄弟俱好竒阿連舉觴􅂆我酒阿買研墨書翁詩長泛鄭生舡百斛日賦鄴侯三四幅何用身封萬户侯但􅂅青箱有人續昌齡和詩以不得志扵賢関有欲退隠之語復用前韻勉其􅆂養俟時未可真作休休計也出門休艱知巳稀開卷􅄃取前人竒西園松菊􅂓􅀏傲未可遽賦休休詩􅆂養胸􅁭容萬斛仰視青天􅁓盈幅行看冨貴来逼人江左家聲子當續昌齡頻開尊再用前韻人生常患如意稀利名擾擾何足竒誰䏻如我恵連弟有園有酒兼䏻詩種秫西疇都㡬斛時見小童馳片幅風軒洒掃又相呼適有嘉魚饋羊續用前韻題東園吾園小小逰人稀吾腹便便空自竒徑草青青可煎飲雨竹㳙㳙堪賦詩鮮鮮菊滿東籬斛掦􅀭蘭入騷人幅牡丹芍藥紫􅅔梅四時花卉開相續賈元識和詩酬以前韻河東丈人年及稀精神矍鑠心瑰竒新来移居向山谷一尊時得同論詩酒量汪汪可勝斛醉後揮毫動盈幅新詩䟽越似朱弦不才何用煎膠續次韻昌齡西園即事世態蝇營巳厭驅小園􅀄闢稱幽居杯􅀷轉􅁴利名薄心静更冝花木踈窓几吟餘山色好軒齋夢覺日華舒尤憐不棄東園老時復相􅀙辨魯魚東園小閤丹粉一新昌齡有詩次韻小園小閤無竒新但喜有酒堪娱賔西疇種秫可自醸不用勤買抛青春月明星稀烏擇木吾愛吾廬堪寓目湏知主父五􅂦珎不似王猷数竿竹丈夫未遇當安貧帯經且作鋤園人詩酒過從老兄弟一􅀏可破雙眉顰見説西園相継闢好将因果同栽植子孫清白世相傳莫同阮氏分南北夣齡得男老者喜甚湯餅㑹中出詩以賀梅溪佳氣夜葱葱果得竒兒應夣熊湯餅􅀏歡良不淺桑弧時節稍相同予以十月二十八日生猶子以二十九日生喜􅀅老眼看猶子首出新詩賀乃翁從此吾門如謝傳芝蘭玉樹滿庭中予有書閣僅容􅂰東有􅂩地􅀄甚荒蕪偶扵暇日理成小園徑以通之杖藜日渉扵其間㡬欲成趣然花木䔥踈不足播之吟詠謾賦十一小詩以記園中之僅有者時甲戌仲冬也小小園預作休休計先開小小園杖藜成日渉得趣與心論便便閤一閤僅容􅂰閉門塵慮捐讀書心巳􅂴髙卧腹便便青青徑小徑循園闢青青草色都主人猶未仕時得理荒蕪娟娟林遶舎種脩竹清風長滿筵天姿本来净不雨亦姢姢揚揚畹九畹何人種光風泛國香林間今㡬許鼻觀日揚揚鮮鮮砌吾圃豈不冨黄金無数錢誰云何用好霜裏白鮮鮮牡丹人道此花貴豈冝顔巷栽春風情不世紅􅂵一般開芍藥十花稱近客千葉重維揚世上無姚魏還他霸衆芳早梅北陸寒未半南枝春巳囬方扵雪中種便向雪中開雙竹本是一根出相期同化龍慎毋䡖剪伐雲路定相􅀙紫微花俗名滿堂紅盛夏緑􅃒眼兹花紅滿堂自慚終日對豈是紫㣲􅀰梅花次賈元識韻南枝昨夜暖先囬壓盡群芳獨自開仙客風中飄素袂玉妃月下試新裁未憑驛使殷勤寄首辱新詩特地来明日雪晴湏共賞為花􅂸􅁍飲千杯􅀊暮雨雪連作稍阻㑹集賈元識有詩次韻自􅀙春色上􅀌根􅁋雨經時歩不前愛日未􅀎供宿􅃳愁雲依舊蔽青天溪山咫尺成千里棋酒因循又一年今夕藍輿定相過尊前行樂興無邉萬府君挽詞字徳昭予􅀙舅也東平隠君子當以古人㸔孝􅁍豺群易恩全雁序難人如心畫正度勝酒腸寛粲粲三株樹門䦨已壮觀老成嗟不見里巷尚䏻談衣觧因周急簮還務激貪蹶蹄心不愠折翼淚常含􅉂目應無恨聲名與佛叅吾母昔迯難携孥依舅舡態多朝暮警恩獨始終全濫與髙門出尤蒙長者憐未􅀎成宅相徒有淚如泉林府君挽詞我昔逰庠序寅縁識令孫雅知苗裔逺更喜典刑存俗子猶遷善偷兒最感㤙佳城明日閉堕淚滿江村表兄璐挺二道以山茶一根見贈植于便便閤前毎黒甜餘開窓寓目茗椀不捧精神自清因成小詩一枕春眠到日斜夣囬喜對小山茶道人贈我􅀊寒種不是尋常兒女花又覔􅃿利花􅃿利名嘉花亦嘉逺􅀙佛􅀦到中華老来耻逐蠅頭利故向椫房覔此花二道人以抺利及東山蘭為贈再成一章西域名花􅆟􅀌㓗東山芳友更清幽逺煩文室維摩詰分韻小園王子猷入鼻頓除浮利盡同心端與國香侔􅀙今日講通家好詩徃花来卒未休林利見佛經名義木䆒或云􅃿者無也謂聞北花香者令人寛悟而好利之心􅃿故前作􅃿利此作抹利姑两存之覔海棠夀昌文郁師植海棠二根于所居舫齋之旁子偶以社日訪之啜茶既罷開窓賞花時􅃄雨􅀄霽竒葩正芳嫣然在軒檻中殊有佳韻越五日作詩􅀉之且欲覔一根種于小園中朝夕觀賞庻無忘髙人雅致時紹興乙亥好事髙人重海棠兩株分植舫齋旁恰當燕子来時放更向禅房􅀷䖏芳道眼想應憐不俗痴人何苦恨無香梅溪野􅅱曽經眼欲覔一根栽草堂郁師贈海棠酬以前韻珎重髙人贈海棠殷勤封植弊廬旁固冝花裏稱名友已向園中壓衆芳萬樹總含兒女態一根獨帯佛爐香杜􅁜應恨未曽識空向成都結草堂札上人許贈山丹花且云此花三月盡開俟蘂成移去至上巳日以詩索之人間花木眼曽經未識兹花状與名丹􅁍青山暮春色續他紅樹堕時英梅溪野老栽成癖蓮社髙人諾不䡖小小園林緑􅀅暗早移芳蘂看敷榮表弟津上人有瑞香抹利戯覔之瑞香早入江南夣抹利来􅀙毘舍園乆與道人同寂寞不如来薦孔融尊覔季仲􅁠碧桃紅雨紛紛空自繁碧雲一朶勝桃源君家獨有神仙種分我閙花􅀷䖏根覔季仲逹酴醿名園羽盖謾童童不似青虬出甕中好事主人仍好施定移韻友乞小翁和寳印叔送春二絶潜澗園林幽更竒送春㱕去有新詩風光流轉身長徤又見明年花滿枝青春不覺去堂堂把酒誰分此日光偶讀髙人送春句味囬齒頰有餘香族兄文通贈山茶野性無端喜種花吾兄得得贈山茶鶯声老後移雖晚四月始栽鶴頂丹時看始嘉雨葉鱗鱗成小盖春枝艶艶首群葩自慚欲報無瓊􅅼来徃同看本一家兄弟隣里日講率㑹因書一絶且戒其早納租稅也屏跡山林頗自安里閭率㑹有餘􅂬但湏及早輸租税不用低顔見長官萬府君挽詞字叔永庚子登科前革風流乆之人尚典刑􅈽才雖汩􅃿種徳自芬馨餋浩眠龍穴流光屬鯉庭郷評燕竇所欠獨年齡太學称多士竒兒占上㳺賢書連得雋舍選復居優善教由􅀌突興家出萬脩板與㳺未遂風樹巳蕭颷屈指吾鄉黨如公今㡬何門猶畢萬大男􅁼陸終多壮志埋蒿里幽光發薤歌河梁嗟未就遺恨滿滄波張廷直挽詞意氣軒軒盖一時牀頭周易造􅀷㡬芹芳泮水聲蜚早花滿河陽迹到稀方外客携因果去道旁人汲義泉㱕栁川池舘規模壮一夕花妖世巳非梅溪先生文集卷第七
