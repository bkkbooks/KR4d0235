front:
  text: 梅溪先生後集卷第十九
  hash: sha256:3baecaec9207e7ccc7d567136c70195c94c7ba49417d0418d6cdcf9f7a343dda
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_019-1a}
body:
  text: 詩乞祠不􅁢三十韻微臣守清源一歳三乞祠俞音竟未拜感荷聖主慈臣家素賤貧仰禄救啼飢區區六年間手把四郡麾道途厭奔走嚢橐無餘貲清源乃佳郡風俗不待移民淳簡獄訟士盛敦書詩地逺可蔵拙䘵厚􅁕自資今歳又豊登千里人熈熈臣豈不願仕求閑欲奚為自憐蝼蟻生福薄命最竒入境身即病到官日呼醫痰毎上攻旋暈􅀔甚危藥試何止百灼艾無全肌臂疼如子羙齒落如退之脚患桞州腫髪垂孟郊􅁝飲食日减少跬歩湏扶持殘喘雖尚延定非乆逺期况臣糟糠妻盖棺将及朞旅櫬猶未還兒女晝夜悲臣今官滿考臣去有二冝孰謂九重逺天高而听卑吾君不之告肝膽将誰披廟堂二三公誤辱平日知今不憐向隅㤙復何時施願扵黼扆前敷奏迫切詞天日臨在上臣言非敢欺觧官食祠禄曲遂臣之􅀻幽明俱受賜感極涕泗垂溝壑倘未填報囯猶有時次韵陳賀州題姜秦二公祠姜丞相姓名端合上麒麟當世那知相是真遺冢尚餘封馬鬛孤忠曾記犯龍鱗三巴流落知音士謂陸宣公九日追陪避世人精爽不迷祠宇復􅌂然唐室舊冠巾秦􅀮君去剡㳺閩避世喧清風寥邈典刑存峯前鳥宿無名􅀣祠下僧􅃻有月門髙尚端如上九蠱含章更􅀋六三坤偏師勝後詩無敵正要公来與共論耒詩云安得斯人与共論薛士昭􅀉新柑分贈知宗提舶知宗有詩次韵書後誰題字鄊人逺􅀉柑薦新思起孝知味戒生貪羅帕分猶未金門献正堪命名􅂓别偽温柑号真柑在果獨称甘它果非無甘者惟柑子以甘得名言最甘也白雲􅀄盈􅀣黄金忽滿籃霜天欣始孰茅舎飽相諳客重開湏請児癡食更婪桞詩吟不厭謝賦讀常躭若􅁡萍难比如拳栗有慙公家安定法想見日酣酣知宗柑詩用韵頗險予既和之復取􅀁未用之韵續賦一首三十韵書閱楊州貢功􅀚禹化覃香苞分橘柚秋色動江潭李徳裕桔賦動江潭之秋色破暑花凝雪凌寒葉染藍金衣爱子照唐宰相賀甘子表云緑蔕含􅃄金衣爛日珠實碧波􅆂栁子厚詩何人摘实見垂未上諸侯計曽聞四浩談顔􅂬陸績毋業世李衡男送客愈吟桂韓退之送桂州嚴大夫詩云家自種黄甘記時坡詠儋東坡在儋耳詩一年好景君湏記正是橙黄桔緑時洞庭夸浙右温郡冠江南節物清霜重家山緑􅎞含青黄出籬落朱緑耀林嵐栁子厚詩宻林耀朱緑坡詩竹籬茅舎出青黄昔貢千金顆遥馳万里函宣政間温州貢甘每顆有一二千新冝薦􅆍廟香可供瞿曇䕫子那能比羅浮未許叅予往在䕫府食黄甘味頗佳然不及温甘逺甚去冬至泉州始食罗浮甘又逺下及夔子何人傳黄陸端􅁼列非􅆅在品寕為四季直方第果實名甘子第四􅀩恩或賜三李徳􅁉賦序上賜宰臣等朱桔各三枚鄊情􅀉􅀄孰旅况憶幽棎嘉拜親開合珍蔵净洗甔甔瓦噐也新甘貯以瓦器則乆而不爛行将觧印綬帰種當田蚕根向横陽覔温甘以平陽縣泥山為最泥尋斥鹵檐種甘冝醎地荒蕪耘􅈳草封植伴溪相不用千頭冨聊資一餉湛茅亝闢杜甫仙井汲蘇躭神仙蘇躭鑿井種桔佳境妙飡蔗閑庭勝蒔苷苷甘草也医家謂之囯老桞子厚詩蒔薬閑庭延囯老㕍行三峽荔奴視四明蚶欲継花為譜歐公作牡丹譜應同桞駐驂歐公桺詩攀条莫惜駐征驂禦偷篱著􅁄愁凍􅈅添泔泔米汁也鄊人冬月用以灌甘掩映青雲葉光華碧玉篸醸成浮甕蟻蒸辟蠧書蟫甘桔花蒸以為香可辟衣書之蠧護蔕期存乳甘欲􅃱逺必以蠟􅂗其帶􅇔皮欲去痰皮能下氣醫家用以治痰恨無親可遺松慘白岩庵林主簿明仲挽詞齒徳尊郷黨匈中有古今箕裘傳藴藻􅆇否判崔林呼佛知仁政名軒見道心扁舟欲訪戴仙去不容尋一箭双鵰手青衫已白頭硯幾磨鉄盡官止及􅀲休漏断鄞江夢風含曲水愁以上巳日亡鈞天記白玉塵世冷西楼假舘城西日清談屡􅀗陪江湖倦㳺宦文字阻衘盃方嘆鵉栖􅁄俄驚鳯去䑓公与孺人相継而化雪梅開舊嶼無復􅀉詩来擬賦江南􅀉梅花詩蔚宗居壠首陸凱在江南手折梅花􅀉人逢驛使堪吴都㝷半􅄍楚岸摘新含雪裏開􅅻一楼頭弄未三情􅀷殊折桞意重勝題柑溪上千株玉帰歟待自􅊥十月二十日買菊一株頗佳置于郡齋松竹之間目為歳寒三友三百青錢一株菊移置窓前伴松竹鮮鮮正色傲霜性不逐重陽上醽醁誰云既晚何用好端似高人事幽獨南来何以慰凄凉有此歳寒三友足重修北楼十一月望日與郡僚同登因書十二䪨我昔未作南諸侯雄丈嘗閲龍虎歐泉山風物得大畧夢􅄰先巳登兹楼到官正要訪遺迹忽見破屋城牆陬欲修不敢遽土木經歳此志方能酬貢闈之餘材可辦農事之隙工乃鳩月逢建子飛破鏡酒呼􅀙事来青州怱怱未暇衆賔集草草且與同僚㳺山川城郭壮㢤郡清源􅂵㡌明双眸却驚雲榭在地底坐見日轂經簷頭西山端可柱頰視南海未用乗桴浮東瞻帰路興元亮北望魏闕心子牟揮毫欲續仲宣賦假日􅂓以銷吾􅁨諸公和詩復用前韻欹眠听詩韓喜矦鋒难與争劔鑄歐鈐齋淺陋無䖏著掛在縹緲之飛楼兹楼乆欠詩酒味天遣我軰来遐陬塵埃􅂓用文字洗瓦䃯遂􅀗瓊瑶酬賔朋未賞合開燕老病欲登冝杖鳩清風酌别記霅水胡州有清風楼制勝領客思䕫州夔州有制勝楼一江明月楚東醉饒州有番陽楼楚東閣范文正公詩云一江明月夜帰遲全家終日蓬莱逰會稽有蓬莱閣予為幕客嘗挈家以㳺元微之詩云全家終日在樓䑓南来不謂有此境四顧亦足窮吾眸朝㸔日出閩海嶠夜望斗揷泉山頭端如虢郡風月送退之虢州北楼詩不比巴岳乾坤浮登臨懐古甫白適賦詠聮珠産鞏牟􅀻心􅀼慕范文正後天下樂先其􅁨􅂘萬先之太學時名重吾鄊徳譽崇才華盍天禄官聀止儒宫相囯方知愈諸公兢薦雄天涯忽聞訃老淚洒西風胡􅀖衡以集英殿修撰知漳州正人起廢有識相賀詩以志喜左右同時両舎人􅂭㒷􅀄某与􅀖衡同立螭莫年得郡偶為隣泉山乆著癡頑老漳浦新除正冝人􅀬撰可能酬壮莭炎州􅂓復屈朱輪拾遺􅀘過湏公軰汲黯行帰侍􅂵宸馮貟仲復元官與􅃱仕㤙澤謗􅃩乆自熄果然天聴囘孤忠昭聖代遺恨釋泉䑓伏節同元帥符离師潰貟仲与張魏公父子在旴昭不肯去相約以死知音有上台貟仲与今左相同在魏公幕中員仲􅀍謗左相力為辨之三軍氣應壮一洗向時哀貟仲以論列罷三軍嘆息有流涕者次韻提舶見招江梅􅀄破一陽天詩句清新欲閗妍呼我同来飲文字定扶衰病到尊前令人生日􅂘以小詩二十七日生日今重見細君嗟不回竟孤偕老願忍㸔舊時梅去歳一盃酒遽然生死分児孫為夀地慟􅂘不堪聞知宗生日二十九日昔年㳺越􅅸首識南枝梅一麾守清源再見梅英開顔色宛如故風霜不能摧玉質長仙葩芳姿醖詩才其侣乃蟠桃其根出蓬莱花開三十年壽薦三千盃喻􅅩竒采坡詩一聮云今誰主文字公合把旌旄為韵作十詩見􅀉某惧不敢和酬以四十韻斯文韓歐蘇千載三大老蘇門六君子如籍湜郊島大匠具明眼一一􅀴選孜豊曰文乎㦲盖深扵斯道諸公既九原氣象日衰槁山不見㤗華水但識行潦詞人巧駢灑義理失探討書生蔽時文習義未易藻著述豈無人紛紛謾華藻有如分裂時僣偽各城堡同年廣文君􅀁作非小好高吟薄風雅古學窮渾灝讀史正豕亥􅀚詩辨形夭千篇氷玉清萬字波瀾浩心慕大手筆􅀁恨生不早鄊令門及韓不􅁼端可保賞識遇歐坡當爲篋中寳声名終不掩光􅃩姑自葆嗟我最不才兀兀首空皓半生槐􅂿黄晚景盖張早出守娄及􅆶還家僅嘗稲去六月还家九月赴泉山田園荒渊明江梅客張鎬塵埃未能脕􅁨患苦相惱愁儧卧蚕眉相者謂予仍如卧蚕主多愁苦痛徹伏犀腦近苦頭疼何當帰故山巳書下下考鍾筆况乆閣盧經徒獨抱古文如金城偏師詎容擣小詩時自遣句法未知造廣文賢関舊声氣同􅊜燥食共朝韲辛案對夜萤薧䇿杖㳺西湖尋梅揷晴昊番有九十日呼酒羅脯枣潯陽三年别心若風中纛書来問安温仍効世俗禱手冩十新詩價重百磲碯情意何勤勤許與太草草那能把旌旄但可供洒掃胡為以西子囯色沉嫫媪前言盖戯耳細讀􅀏􅅸倒􅁍将􅀉来詩録附雅戯藁叔竒甞作雅戯集題徐􅃱政菊坡啚名夀仁字子由南方有高士仁義偃王裔家山闢幽坡手取香草蓻秋至有黄華采采滿衣􅃑客来酒盈尊詩出語驚世無心學渊明偶與渊明契静者年自長頽齡不湏制髙懐恥獨樂地逺人罕詣丹青冩佳境有目皆可睨吾家鮮鮮􅈳荒蕪屢􅀴歳儒冠誤此身掛之公得計次韵呉明可見􅀉閩楚相望天一涯思公不見見公詩遥知人在凝香䖏正是梅逢馹使時􅂵㡌清源㳺巳倦落霞孤鶩㸔無期它年杖屦天台去采薬㝷􅊝薦夀巵沈敦謨和詩見􅀉復用元韵天使吾儕復會同􅀏談声落酒筵中語離江北秋正秒回首閩南􅀊又窮春草池邊来好句木奴皮裏􅀮仙翁􅀉謨敦甘相将再上􅀚潮閣我巳三章乞道宮曺夢良教授􅀉柑一百顆報以乾荔支戯成二􅅸故人書自許峯来領得黄柑手自開未滿洞庭三百顆更㸔馹使一枝梅􅅸品知君尚未嘗三山絳帳喜相将冷官豈是淹賢地尤物􅂓􅀚十八娘懐夢齡昌齡弟乆别思吾弟它郷歳又除日吟棠棣句目断雁行書老去情尤悪懐帰語似虚祠章巳三上試為掃茅廬臘月二十八日與知宗提舉分歳郡中啜茶于北楼賞梅于忠献堂知宗即席有詩次韵并簡提舶老病踰年卧晋江躭詩性癖未能䧏园林牢落梅􅀴眼歳月峥嵘酒滿缸堂上焚香敬勲徳楼頭回首念家鄊黄甘未拜蕭嵩賜鄊味分珍謾一双時得温甘各分二顆曾潮州到郡未幾首修韓文公廟次建貢闈可謂知化本矣某因讀韓公别趙子詩用韵以􅀉韓公學孔子不陋九夷居詆佛譏君王道大忠有餘南迁八千里文墨以自娯至今潮陽人比屋皆詩書蓬茨得趙子如􅀗滄海珠臨行贈以言恨不與之俱徳云昌􅀺公聖人之徒與比周孔孟軻不道迂相如韓公不可見趙子今亦無潮人敬爱公百世祀不渝英姿入山骨凛凛蒼眉􅂡彼㢤逢吉鏄金章裹猿狙使君藝且賢所至政續殊下車首風教廟修庭草除又聞新􅁄闈輪奐帰􅀞啚継坡當有作大筆文辝驅惡詩􅂅勿刻人方咲其愚潮州書云欲刋某和韓詩送柯教授赴官四明士論郷評搃見欽古猶难得况于今恥干一介将行李慨為孤甥罄橐金晋水生徒懐絳帳賢関故舊仰同襟冷官豈是淹徊地未到鄞江有召音教授赴官不以一事千州郡一借一兵罄嚢槖􅀉崔粛之懐州别駕生賢丁盤谷先生有外甥暫屈才能居筦庫㑹看騰蹋継家声燭花郡舎擁炉坐燭開連夜花主人無喜事應是報还家次韵表􅅩賈元範見􅀉二首華表飛来鶴姓丁鹿岩依舊故山青正縁松菊留仙􅀮㒷囯司理聞至不赴肻為􅃓車到郡􅈦王叅政守永嘉招之不来徳者能言書有力仁人自夀薬非灵公平日不服藥壽考康寕坐看世事公應􅀏落水楊花万􅀧萍記得公帰自汴京暸然目為小生青行能􅃱逺由推轂到即成渠荷建瓴松柏歳寒知節操芝蘭室迩化芬馨白圭三復成陳迹感徳傷懐涕泗零某受知扵公妻以兄文今有悼亡之戚故去人日喜晴元日至人日幸無隂晦詩因思董勛問􅁍異少陵詩遥想水披凍坐㸔梅滿枝明朝如得雨正與谷相冝元宵貢院張燈㑹客知宗即席賦詩次韵欲送群英入帝郷預燒燈燭趣仙装銀花􅀄合万枝火金榜巳含千佛光出海灵鼇駕蓬島逐人明月㪚天香笙􅁔􅂦沸吟篇出元白扵詩媿未昌是夕無即席和者故云送丁惠安某假守温陵􅀗􅀚七邑之政治行可称者三四人然未有岀惠安之􅀂者以􅃊明為治而濟以㢘平以撫字為心催科不􅅰而辦每至郡必講論民間利病田落海而稅不除官鬻塩而民受害凢此􅁼郡皆行之民無訟牒犴獄屡空是冝邑人懐徳繪像而祠之也扵其行也詩以送之把麾平海看操刀惟我鄊人治最髙但見武城人易使不同梁竦聀徒劳民懐其爱祠生立吏必如公責始逃聞說朝廷考􅆇否僉言卓茂徳冝褒知宗示提舶贈新茶詩某未及和偶建守送到小春分四餅因次其韵建安分送建溪春驚起松堂午夢人盧老書中􅅻見靣范公碾畔忽飛塵十篇北􅁐詩無敵両腋凊風思有神日鑄卧龍非不羙賢如張禹想非真坡詩其間絶吴非不佳張禹縱賢非骨鯁謂茶草也知宗贈驢肉以膰肉酬之不駿扵乗合見享韓文不駿扵乗謂馿也鈐亝指動荷分􅅅區區膰肉非相報正恐公為孔子行次韵贈新筍􅀱屇中和日漸長籜龍忽到爱松堂便驚詩句含􅂼味更斍庖厨有細香未斈坡公參玉板且同韓子賦篔簹荀来茶徃非為礼端為詩情故得甞曽潮州萬頃増闢貢院以元夕落成􅀉詩次韵韓公来自九重天􅂯見潮陽吏部賢万頃甞為天官郎唾手渠渠蜚夏屋揮毫混混冩源泉丹霄有月逢三五聖世生才恊半千太守落成應有語立朝名節看儒先謂王尚書元亀題並玉堂同年李伯時教授居泉之北門需次家食奉親有堂前對朋山名曰並玉索詩爲賦十韵仙李門闌秀氣鍾二山朋盍玉爲容晋人瀟洒坐連壁杜老風流吟両峯崑府烟霞浮几席藍田丘壑藴心胷俯容列岫葭相􅀝遥許它山石可攻光徹郡城翔白鷺白鷺城影揺江水照黄龍黄龍江價髙难把連城易官冷􅂓将一榖供疑是璣衡臨䖏落端如日月合時逢主賔對靣成三友伯仲摩雲拱九重李有难弟堂靣北山雁蕩浪跨鵉有侣雁蕩山有双鵉峯􅁃楼徒詫劍相從庐山有双劍峯庾樓對之綵衣戯罷看山色不似慈顔喜氣濃出郊􅂆農飯􅂼于法石僧舎時方閔雨有無麥之􅁨因成八􅅸清源太守鬂如蓬未遂帰農又􅂆農農事正興天不雨誰能喚起老黄龍郡城之西有黄龍江二麥青黄雨失時老農相顧但嗟吹使君徒用虚文􅂆稼穡艰难未必知我昔躬耕隴畒間也知農事最艰难才踈政拙心劳甚無􅀘扵民合掛冠賣刀買犢慕龔遂重􅂖務農思魯僖僚友共懐􅁨囯􅂅守臣非皺聀田眉丘濬詩皺却眉頭􅁨旱涝一心只在聀田中無術能銷旱魃灾吁嗟求雨只空回鯫生豈是為霖手明日真人出洞来晋江請蔡真人万歳名山両度来精庐瀟洒􅅸塵埃禅師妙得兵家䇿杖屦飄然去不囬謂長老勤師荔子今亡法石白法石白見君謨譜今無之江山長带佛頭青老僧能說陳王事遺冢猶傳女子灵陳王女塟法石僧云時出灵響一􅈳通幽亭靣墻鳥啼林静木蒼蒼碍人眼界冝斤斧放出山光接海光食筍蕨葉飛卿見贈作􅅅甚羙因成是詩犢角児拳共作􅅅大勝五􅂦八珍亨要湏帰陟南山采更看新移小竹生先人嘗作蕨詩有陟彼南山采句􅃊伯威詩云新移小竹巳生筍皆家鄉故事悼陳提刑耆舊嗟零落南来識太丘有年兼有徳無怨亦無求公爲監司郡守未甞按史居鄉不以事于州郡漬室遺風在新橋雅志酬誰知灯火散身世隔明幽元夕貢院張灯公爲上客後十日而折聞胡􅀖衡改知泉州復用前韵上念温陵爲擇人知公名節世無隣犯顔合在論思地起廢􅂓爲岳牧臣繆政居前誚穅秕剛腸别乆轉車輪天教我軰簮重盍只恐留中拱帝宸次韵何興化徳􅀭閔雨熒惑照南紀千里生塵埃守臣失其聀閔雨腸空摧奔走佞佛老吁嗟禱風雷爍石􅀔愈熾望霓心可哀民情有愁恨天意那能囬緬懐端明公豈薄徳與才乞雨問山神胡為亦遲徊鄰􅀖賢使君道妙蔵灵臺不待雨催詩却以詩篇催佇聴鴈糟􅇃遥期衘賀盃政理隂陽和誠加金石開餘波必及我飄洒桐城隈両郡桐青青年豊􅅒崔嵬普天望作霖公盍帰乎来喜雨􅂯用前韵南囯乆無雨渇心欲生埃麥既枯且死木亦黄而摧方春雲巳火未夏蚊成雷刺使固有罪斯民自冝哀真人及大士乆出應思囬閉陽縱諸隂愧無董生才林鳩厭呼喚石燕徒低􅆦有日上扶桑無雲起陽䑓方修九渊祀􅀄九日欲􅀕龍遽聞尺木催想驚阿香夢疑噀栾巴盃夜中簷溜響枕上愁顔開願徧普天下不止泉山隈莫作􅂦湖浪因風下崔嵬明朝賀雨詩定自莆中来唐人賦仙都詩黄帝旌幢去不囬片雲孤石独崔嵬有時風擊􅂦湖浪散作晴天雨点来次韵龔實之正言見􅀉堂堂人物冠清流不减當年宋廣州持節分符􅂓尔耳直尋枉尺断還不􅀄開宣室漢思賈欲復侵􅆠魯召丘整頓乾坤趂頭黒早湏帰伴赤松逰諫坡烏府迹相望眼底何曽識六郎去囯雅欽龔勝節得州欣近鄭公鄊尺書逺荷鴻傳至好句惟􅁨電取将未見􅂵芝人已􅀃天庭喜氣十分黄出郊迓客至石塔院憇劉公亭􅀚石筍橋東望郡城南瞻􅂵㡌即事有作春日西郊外江亭眼界嘉青桐映楼閣􅂵㡌􅃿烟霞雨過牛耕野潮回鷺立沙河梁阻携手空起逝川嗟用喜雨韻呈龔實之請雨徧群望􅅰􅅰衝塵埃際天麥浪空刺水秧針摧已近尺五天未動滿盈雷地欲赤晋囯年将饑魯哀􅀉牋叩天門好音清夜回似傳上帝意頗亦憐不才披衣起視月在畢方徘􅆦忽䎹䔥蕭声髙洒熈熈䑓郡圃旧有熈熈䑓見清原志或云即雲榭也雲陣溌墨暗電光摇幟倠灯前落簷花欣衘少陵盃緑波滿四澤花桞村材開知有一尺霖来從傅岩隈徽庙書啇霖一尺四字賜張無尽正吉到郡之夕雷雨大作不作天寳詞淋零悲馬嵬定有元和詩中䘖諌書来石筍橋清源郡城之西有渡名石筍溪與江㑹險而􅀷渉者病之􅀄浮為梁屢修屢壞議更以石費重而後艰時提刑陳慨然為之倡弟賀州叶其謀今樞宻梁公力助之􅀴始扵紹興庚辰訖工扵乾道巳丑提刑屢約予􅀚未果明年春三月辛酉迓客出郊過而壮之因記以詩刺桐為城石為筍万壑西来流不盡黄龍窟宅占上㳺呼吸風濤􅀔湍􅂃怒潮拍岸鳴霹􅆮􅁋潦㴞天没畦畛行人欲渡無翼飛魚腹蛟涎吁可閔二三大士為時出目覩狂瀾心不忍小試閑居濟川手逺水孤舟㓂忠愍亦有山僧􅂅力􅀷僧文繪等董其役觧使􅀖人指倉囷五丁挽石投浩渺万指硺山登嶾嶙辛勤填海效精衞突兀横空飛海蜃趾千千尺鮫人室護以両旁獅子楯南通百粤比三呉檐􅀒輿肩走騋牝論功不减啇舟楫遺利冝書漢平凖莫将風月比楊州二十四橋真蠢蠢我時出郊春雨後鷺􅀧沙汀颺鷹凖江亭矯首獨遐􅀚有客南来盃共引是日邊实之少亭欲詠河梁擬蘇李頗􅁼鑑湖逢稹江山不逢賢太守䄂手沉吟斍才窘况無鉄筆擬端明徒使時人􅀏蚯蚓綉衣屡約吾来逰未遂堪嗟徳星隕鄊来甞以記屬我固避牢辝慙不敏傳聞江欲飛棟􅀄異論紛紛互矛盾世無剛者橋豈成名與萬安同不泯林黄中少卿出守吴興芮囯噐司業以詩送之有今日桐城王刺史異時遺爱在吾州句用韻􅀉二公出䖏平時正且嚴猶扵􅆶李謹疑嫌両溪水照新明月郡有明月楼六客堂逢舊􅂵髯孫莘老羙湏髯甞守吴興東坡寄以詩云好在紫帽翁黄中亦美髯故云安定化應孚斈校謝公思巳結閭閻湖山清逺使君好想見􅀖人慰􅀁瞻賢関今日陽司業家在白蘋溪上州笔下波瀾含震澤胷中意氣属清流弁山疊拜南金贈泉嶺逺蒙明月􅄬老矣惟公獨青眼一言褒借勝封矦題􅃽元粛藴仁堂人孰無文毋圖報良亦难忽興風􅀣悲莫尽菽水􅂬君􅅅不易嘗而况荣以官向来蒋令君堂乃宰徳化時作􅂟具顔方丹手折東堂桂口詠南陔蘭生封拜君命􅃧彩慈顔温教之由義方藴之在仁端仁熟椿亦老親荣心始安堂在人事非思親誠益殚巳足廣文飯方弹貢公冠願移前日孝要作忠臣㸔梅溪先生後集卷第十九梅溪先生文集卷第十九雜著井光辨予家之東南有井覆以屋其水清而甘冬温而夏寒雖大旱水僅盈尺而泉脉不枯井方不及丈然比他井為差巨當先祖之世鄉人目吾居為大井頭王家則是井也固見大於鄉人矣予闢家塾于井之南紹興庚午季夏之夕僕夫汲而歸以井有光告予徃視之􅀮􅀮熒熒如燈如萤如光芒之星不知其果何物也意者魚鱉之族其鱗甲文理晦于晝而粲于夜耶或螺蚌之腹産明珠以自照耶其在物理或之有也惑者好語怪匪妖之則祥之矣予故以物理辨之二十五夜㑹趣堂書四友録語曰君子以文㑹友予文㑹梅溪有友四人焉皆佳士也然各有少疵羅文性堅剛而貪墨毛頴工文詞動如人意而不耐乆楮先生為人㓗白而䡖薄子墨客鄉有漸磨之功而好變白為黒也四友與予文㑹乆矣予常取其䏻而不議其疵数年間客上庠陪俊㳺果頼四友之力然予老矣四友方進未休他日竹帛間慎毋相忘子當掩予疵如予今日之不廢子也庚午六月丙寅書讀婁師徳傳婁師德教弟耐事弟曰人有唾面㓗之乃巳師德曰未也㓗之是違其怒正使自乾耳予嘗詠史作師徳詩云忤意由来勿校難誰䏻唾面自令乾直湏事過心平後方服婁公度量寛予性􅄶急常􅁒書婁公傳于座古効古人佩韋之戒偶閥書遂録其事昆弟朋友間有坐予失者冝書紳焉則事雖大於唾面心自然清凉矣題卓吾貧好作文苦於無書可閱好冩字苦於無紙可書遂於貧中撰出一術以卓為紙以肺腑為書净几無塵日書數百字吾之無尽蔵紙也心之精㣲日出数百言吾之無盡蔵書也從予㳺者有童子数人劳之以研墨之職授之以所書之言日從吾為無盡藏㳺也顧謂童子曰吾老矣無尽者有時無盡汝􅀎記吾言使不如几上字而㓕􅃿否乎童子曰唯庚午季夏二十八日書論文􅀃有客與王子論文謂王子曰子以今文况昔文亦加進否乎子應之曰新文之進予則不知也但毎閱舊文背必汗焉耳客曰見舊文而汗背進莫驗於斯也使天假子之言将不一進而巳他日見今之文汗又浹背矣子不見君家名勃者乎􅅬王閣序最膾炙人口落霞與􅀌鶩齊飛秋水共長天一色之句當時以為神殊不知此乃少年麄豪之氣俳優之雄者以勃之天資英秀不使早死其文之進殆未可量他日見所謂神句者寕不汗背耶韓退之文章之古者後世莫德而疵之然感二鳥賦乃少年所作學識未逮故有二鳥不如之歎李漢序其文為篇什之首非深知退之者也予善其􅀃遂退而記之讀蘇文唐宋文章未可優劣唐之韓桞宋之歐蘇使四子並駕而争馳未知孰後而孰先必有􅀎辨之者不學文則巳學文而不韓桞歐蘇是􅀚誦讀雖博著述雖多未有不陋者也韓歐之文粹然一出於正桞與蘇好竒而失之駁至論其文之工才之羙是冝韓公􅁒推遜于厚歐陽子欲避路放子瞻出一頭地也紹興庚午七月上澣日讀東坡大全集於㑹趣堂因題于早雜􅀃爲善易􅀎不言難過人所不免文之則小人也孟子言仁者如射以其發而不中不怨勝巳也孔子曰君子無所争必也射乎射有勝􅀒争之端也君子獨􅀎以揖遜終之遂至於無争冝怨而不怨當争而不争此孟子謂之仁而孔子謂之君子也彼有無争而争自起無怨而怨自生真小人之不仁者㦲名之所在人所必争而同忌也􅀎避人之所争樂人之所同忌斯可謂之君子掩惡揚善朋友之道語曰尺有所短寸有所長予所短多矣然於交友中常道其善不道其惡是亦寸中之長者昔姜渭叟䏻言之姜死矣無知我者渭叟􅀒逸才豪氣者也而不修細行惡有所不掩亦朋友之罪姜之念予盖有所激云人有毀已已亦毀之何其不長者也予雖未嘗􅀭交友之惡然性􅄶躁不耐事聞人毁巳則氣形肝鬲往往亦斥其過於稠人廣衆中言既出口悔心遂生然駟不及舌矣因思韓安囯對媿其武侯之言自知其非長者遂書以為戒靈烏􅀃烏之為禽性靈而意忠每預知吉凶而啞啞以告小人聞其鳴則唾罵之烏不以唾罵而廢嗚可調忠矣范文正公謂人有言􅀆是然人無言􅀆是然者也君子聞烏鳴則恐懼修省潜銷禍患於未萌人遂以烏鳴為無驗忽之為不靈也殊不知烏能警於未然之前君子能戒之於未形之際是烏之忠計既行而智名不可得而聞矣告之不戒而㓙著於形迹則烏之鳴驗是呉之子胥也告之䏻戒而禍銷於兆朕則烏之智􅀮是漢之張子房也烏之告豈有二哉所聴有不同耳書院之東隅有烏連曰群噪􅀂有所告者此君子􅂲懼脩省時也作靈烏􅀃夜虹見紹興庚午七月十六夜山月􅀄吐有長虹見于西厥光白踰時而㓕人以爲白虹異之予謂是虹之異在時不在色虹見于晝盖影日而盛色冝青紅或白則爲異其見于夜也影月而成白乃其宜耳然虹多現于朝莫間在乎欲雨􅁒晹之際未有影月而現子夜者兹其所以爲異與姑志之以俟􅀎言災異者辨待士說有言邑大夫不待士者予曰子何從知之曰有訟于庭者箠楚之辱及焉予曰此士之不自待非大夫不待士也爲士者服詩書精業􅂂聖賢之是師臭味之與㳺謹門户時租税忍焉以省訟慎焉以逺禍俾足迹不及於公門而官吏稀識其面目雖使柳下惠之弟為邑大夫焉􅀎辱儒冠而䧟之虎口耶彼冠焉而士行焉而市旁午里巷而惡少與曹争競非分而獄訟以興朝投刺以識面莫求判以欺愚雖使周成王之叔父為邑大夫詎可望其施吐握之禮耶大夫非􅀎重士也士實自重非􅀎䡖士也士實自䡖顧其自待者如何邑大夫何責焉既以荅告者遂書為吾黨之戒雜􅀃孟子曰生我所欲義重於生舍生而取義可也嗚呼人之􅀁甚畏者死也義之所生死有不足畏者惟不畏死之人可以成天下之大義立天下之大莭享天下之大名名與謗常相随因名􅀗謗因謗􅀗名雖韓退之猶是也原毀曰事修而謗興德髙而毀来非因名􅀗謗歟進學觧曰動而得謗名亦随之非因謗􅀗名歟有名而有謗不􅀂無謗而無名古之哲士必避名非避名也乃避謗也君子小人不難見即其報施之間而􅀚之則肺腑之􅀮洞然不可逃矣陳平受賞則不忘魏無知白敏中得志而擠李徳􅁉君子小人之用心其厚薄如此賈􅁩過秦論班固公孫洪賛韓退之進學觧真文中之傑也予少時誦之至熟今為昏忘所奪心能記之口不能道聦明不及於前時冝古人之興歎也賈􅁩賦過相如楊子雲不知也桞子厚平淮西雅過韓退之子厚自䏻知之子厚之文温雅過班固退之之文雄徤過司馬子長歐陽公得退之之純粹而乏子厚之竒東坡馳聘過諸公簡嚴不及也唐宋之文可法者四法古於韓法竒於栁法純粹於歐陽法汗漫於東坡餘文可以博􅀚而無事乎取法也讀進學觧韓退之進學觧盖楊子雲觧嘲班孟堅賔戯之流也然文詞雄偉過班楊逺矣予無退之文章學識而一二事與之合公不見信於人􅀻不見􅂇於友與冬暖而児號寒年豐而妻啼飢是也自志學之始喜誦是文太山北斗仰亦劳矣二十年間跋前疐後無其職而有其窮毎􅁒效顰作文以送之又無怪怪竒竒之筆也紹興庚午七月二十二日書三不􅀎戒不善文者冝秘不善書者冝楷不善言者冝省予不善文而不􅀎秘不善書而不􅀎楷不善言而不能省此其所以􅀗誚之多者歟今焉知過而􅀎通戒之矣然有時乎不􅀎秘不􅀎楷不能省者文􅀎秘於䆫几著述之􅀻而不能秘於􅂣屋進取之公書能楷於優㳺學習之時而不􅀎楷於匆匆應荅之頃言􅀎省於心平無事之日而不䏻省於氣形肝鬲之際烏􅀎使文無媿於不秘書無媿於不楷言無媿於不省書歐陽公贈王介甫詩翰林風月三千首吏部文章二百年老去自憐心尚在後来誰與子争先此歐公贈介甫詩也介甫不肯為退之故荅歐公詩云他日略曽窺孟子終身何敢望韓公由今日􅀚之介甫之所成就與退之孰􅄖孰劣必有能辨之者予謂歐公此詩可移贈東坡贈者不失言當者無媿色大舜善與人同􅀃大舜善與人同非與人同為善也盖􅀎與人同而不立異耳古之獨行之士皆好立異而不與人同如申徒狄之介於陵仲子之㢘尾生之信屈原之清皆􅀎為人所不能為然非可傳可継之法君子不取焉彼以立異為有過於人而不知適所以自小也舜取諸人以為善盡事親之理以為孝由孝悌之道以為仁義是皆人之所可為者舜亦從而為之人之􅀁不可為舜亦不為之矣此所謂善與人同然舜善與人同而衆人卒不􅀎自同乎舜者何耶舜其即同乎人者而行之不息此所以為大聖人衆人一作焉一息焉甚者一􅁀而十寒焉􅀄與舜同而卒與舜異非舜之不同乎人人自不同之耳子貢贖人而不受金是子貢之不與人同也魯人獵較孔子亦獵較是孔子善與人同也賢人好與人異而聖人常與人同舜孔子爲大聖人者非由乎異而大者同焉而巳矣故曰大舜有大焉又曰大㢤孔子語曰晏平仲善與人交孟子曰大舜善與人同善者􅀎也語意正相􅁼論語三􅀃孔門弟子有顔囬者聖人許之以仁者也有有若者其見道似聖人者也有曽參者悟聖人一貫之道者也於是作三月不違仁􅀃以賢顔子作有􅀂似聖人􅀃以辨其似聖人者非貌作以貫之􅀃以辨其所以告門人之意上智性仁其次修仁其次假仁性之者無心於為仁而所為無非仁者得之於不思不勉之間而從容於顛沛造次之際猶水之不嘘而自寒火之不呵而自􅀬也寒也􅀬也仁也非水火與聖人之性也哉嘘而寒呵而􅀬修而仁則出乎人者矣惟賢者􅀎修之於終身之乆其至也與性之者同衆人假之於日月之暫及其乆也則真偽之情見矣顔囬雖孔門之髙弟然於仁也非性之者也克巳復礼而為之也孔門弟子孰不􅁒為仁也哉然假之於日月之暫而不能好之於終身之乆聖人觀人亦必乆而試之使偽為者不能欺於倉卒不俻慮之間而真修者亦足以發明於倉卒不備慮之際三月乆矣天時變矣而囬心不違是終不變矣嗚呼囬三月之仁是近而一日之仁也逺而終身之仁也囬豈偽為而暫假者哉豈嘘呵於頃刻之間也哉􅀃者謂顔子三月不違仁賢於日月至焉者耳未能以之終身也作三月不違仁􅀃以辨顔子論語何以子有子耶桞宗元固辨之矣雖然未知有子也孟子􅁛孔子旣􅃿弟子子夏子游子張以有􅀂似聖人􅁒以事孔子事之所謂似聖人者盖必有子之學識於群弟子中有一日之長其見道有似吾夫子焉如孟施舎似曽子北宫黝似子夏之似也世儒以謂貌似孔子其􅀃陋矣且有子之似夫子而曽子有不逮焉者曾子嘗以䘮欲速貧死􅁒速杇爲夫子之言而有子不然之曽子質諸子㳺子游曰甚哉有子之言似夫子也子游之徒知有子似夫子素矣所謂似者必有如辨曾子之言之􅀋豈以貌似之故虚􅁒師事之耶雖然直似之耳􅁒以事孔子事之則不可故曽子不許之而有子未嘗居師之位也􅀃者謂不能荅弟子之問遂見叱而退盖好事者爲之辭以誣有子耳然世皆之顔子之後有曽子而不知有子者亦回參之亞匹也序論語者知之故首記夫子之言次記有子之言又次記曽子之言未必言之次第如是也其必寓拍尊之意焉以謂夫子既􅃿之後其道可尊其人可子其言可法者莫先乎有子曽子也或曰子以有子為囬參亞匹夫子􅂚不以好學􅁛之如􅁛顔子又􅂚不以一貫之􅀃告之如告曽子且不與四科之列何耶曰夫子何特不􅁛有子亦􅂚嘗有一言以􅁛曽子也何特不以一貫告有子亦􅂚嘗以是告顔子也􅁛之告之當時有未必盡記後世有未必盡知者焉有子曽子在孔門年皆最少其不預四科之列者未必從夫子於陳蔡故也曽子之後有孟子故曾子之道益尊有子之後無門人故有子之道不顯然孟子嘗􅁛其智足以知聖人又記其似聖人與群弟子􅁒以孔子之事事之子游􅁛之於戴經弟子尊之於論語亦足以發明有子之謂人矣而學者未之知也作有􅀂似聖人之􅀃以辨有子闕書冨家翁逸事後萬序明之手録雜文一卷其首篇乃馮當可所記冨家翁逸事也冨家翁兄甲者未必知書􅀚其䖏昆弟之間雖知書者所不􅀎爲進之孔門其閔子之徒歟馮記其事而逸其姓第曰兄甲而巳他日史官作宋孝友傳書其事而闕其人當與齊魯大儒同發楊子雲之歎也予忝知書且爲人兄有媿於不知書之甲多矣然心實慕之願學焉吾家他日或無乙之婦庶幾遂其所慕之心未可知也顧謂萬于曰汝東平先生嫡長孫且其家世業儒非冨家翁比豈不􅀎爲甲所爲耶子爲人子弟固非以是責子也然旣録其事必有意於為甲者甲不難學少損好利之習則人皆甲矣予之書是命表弟余壁全之研墨因以其事語之二子從予游皆妙齡而秀者其家皆知書過於冨家翁者予故以是勉之紹興庚午季夏二十五日不孝子王某書記蛙予有鞋布體而麻質其弊甚十趾不􅀎以自蔵有蛙乗罅而入蟄于鞋頰間予不知也㑹昬暮如厠而蛙忽鳴俯而視地無所見旣行而又鳴予始疑之既就几席而坐足毎動則閤閤然有聲以指摸之有蠢而動者予愕然未􅀎物色其􅀋呼童子燈之脫鞋而㣲露一爪乃蛙也命童子出之躍而去東郭先生衣弊􅂂穿貧甚矣然未聞有蛙乗罅而蟄者以是知予之貧又過東郭一等然鞋非可蟄之所蛙託身誤矣使其不􅀎自鳴㡬死于足間予去􅀊嘗和韓退之荅桞桞州食蝦䗫詩以戒同舎果能止殺是蛙也豈以予不殘其􅀋故􅁬身而来託将以脫虫虵吞噉之禍於一時耶予亦幸而不踐之不然㡬乎避禍而得禍也感而至蟄而免自鳴以求全蛙亦有知矣勿以其蠢焉而愚之人􅀎持無害人之心而物以其􅀋至􅀎持無害人之心人其有不至者耶時紹興庚午孟秋七月十四夜書記人􅀃前生事予少時有鄉僧毎見予必謂曰此郎嚴伯威後身也予不曉所謂既而訪諸叔父寳印大師叔父曰嚴闍梨字伯威汝祖母賈之兄吾之舅氏且法門之師也愽學工詩文戒行修􅅚有聲江淛間為士俗所推重汝父母萱以無子為憂禱求甚力至正和壬辰之正月吾師卒汝祖一夕夣吾師至其家手集衆花結成一大毬字汝祖而遺之曰孝祖君家求此乆矣吾是以来怱不見是月汝母有娠至十月而汝生吾師眉濃黒而垂目深而神藏児時能誦千言喜作詩人以汝眉目及趣好􅀋之且符所夣又謂吾師死之月而汝受胎也故云予㓜從學鹿巖人有指予眉垂目藏而靳之者表丈賈元逹曰此子眉目􅀋吾伯嚴闍梨他日能文未可知也然嚴闍梨智慧名徳卓卓如許縱未脫輪回當復生人間世爲大善知識胡爲於㓕度之後鍾成迂愚魯鈍之性現此窮薄困苦相耶予嘗冩字作文詒寳印叔父叔父曰人言汝吾師也文僅似之字乃尔不同耶嚴闍梨尤工筆札予最不善書故也紹興庚午七月二十日因作文冩字兩俱不佳媿而曰嚴闍梨汝前生食􅂼何多智今生食肉何許愚也用記之梅溪先生文集卷第十九
