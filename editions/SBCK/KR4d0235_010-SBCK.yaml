主一啓金縢即悟公宣王北伐南征萬國臣中興周室頼賢人崧髙千古英靈在何獨當時降甫申幽王文武基圖木易量可憐中葉壊幽王神龍流沬生尤物赫赫宗周一􅀏亡秦始皇鯨吞六國帝人寰遣使遥㝷海上山仙藥未来身巳死鑾輿空載鮑魚還二世始皇一怒逐扶蘇天欲亡秦果在胡翻􅀍四方黔首􅀏不分鹿馬是誰愚漢髙帝百􅀾功成漢業新咸陽置酒問群臣區區髙起王陵軰豈識龍顔善用人仗劍﨑嶇起沛豊祗􅀅嫚罵馭英雄雖然䏻用三人傑巳失啇山四老翁文帝文帝興王自代来百金不費亦仁㢤後人不務師恭儉萬户干門㡬露䑓武帝武帝英雄􅀋始皇甘心黷武國㡬亡晚年頼有知人術觧把嬰児付霍光宣帝道雜覇王非羙事治先刑法少仁恩盖楊韓趙猶誅死誰謂當時獄不􅁈元帝徳化欲遵周􅁤轍刑名思革漢規模更生踈斥䔥生戮元帝何曽善用儒光武大命由来自有真子輿徒號漢家親湏知炎祚中興主元是南陽謹厚人欝欝葱葱瑞氣浮南陽兵起再興劉􅀅軍大敵非常勇文叔平生本好柔明帝萬乗臨雍事老更橋門億萬㑹諸生永平大子真儒雅只恨容人度未宏章帝民苦䌓苛厭永平科除慘獄慰群情不窮竇憲欺君罪翻􅀍寛柔壊典刑魏武帝董吕裘劉電掃空阿瞞獨歩騁姦雄豈知􅁠備皆人傑未肯全􅀅鼎付公呉大帝㧞刀斫案氣如虹獨􅀝周即立雋功一􅀾果摧曹孟徳不妨髙枕覇江東蜀先主曹公姦黠世無雙元徳雄才肯見容誰把荆公資覇業一朝雲雨起蛟龍晋宣帝四朝天子􅀉安危寡婦􅀌児豈忍欺見􅀃五湖扛鼎日又勝三馬食槽時晋武帝早􅀊膺圖帝業光睌年何事政多荒筭来不用平呉好畢竟呉平速晋亡元帝金陵王氣為誰鍾五馬南浮一化龍四海民心共晋思江東何事却􅀙容宋武帝宋武英雄世莫加長驅千里定中華衆機不據金湯險自剖乹坤作両家齊太祖天厭金刀水徳終一時人望屬䔥公能論魏武周文亊獨有區區謝侍中梁武帝不法先王治用儒捨身傾國事浮屠堪嗟餓病䑓城日曽得空王救死無簡文帝青􅁝白馬渡江来宫殿酣酣盡委􅁅不觧開門納挑捧空悲明鏡不安䑓陳武帝一旦􅁠臣外召君巳知天帝欲興陳江准􅀂道無神物誰報齊兵至夀春後主臨春閣上醉流霞狎客酣歌興未涯江左半無陳日月君臣猶聴後庭花魏道武火舉南征破弱燕拓開中土奠山川功成􅀂更䏻修徳自可延年度厄年北齊神武浮圖入海天已魏鸚鵡興謡運啓齊鄴下兵興黄螘死營中星隕衆驢嘶齊後主峩冠食禄鷄開府揺尾承恩大郡君􅀅士焉􅀎死征􅀾盍驅爾軰赴三軍周文帝傳檄東征賀六渾親迎天子入長安剰栽沙􅁐千株栁長使齊軍破膽寒隋文帝孽后邪臣造釁端房陵幽閉􅈽深􅁈一朝变起宫闈内方信當時用婦言煬帝汴水東流岸栁春龍舟南下錦㠶新鳥聲􅂆酒梅花􅀏咲殺隋亡亦似陳唐太宗仁義誰云不可行文皇親見治功成徳􅃔可惜身先死豈信人間有太平髙宗正􅀚基圖極盛􅂭誰􅀅神噐付昏童倒持利柄歸房闥仙李枝柯一剪空明皇天寳君臣玩太平梨園弟子奏新聲貴妃一􅀏天顔喜不覺胡塵暗兩京粛宗張后宫中巧弄􅁠上皇西内老誰憐杜陵獨念君臣義長向雲安拜杜䳌徳宗虜箭侵陵御幄時君臣相顧不勝悲难平猶自推天命盧􅂎奻邪竟不知憲宗叛將連頭就典刑元和功業九成晩年誤信妖人術禍自丹砂藥裏生文宗輦路青青春草多凭髙無語涕滂沱禁中夜召詞臣語受制家奴可柰何梁太祖天下人心共惡梁祇應無柰虎狼彊可隣千尺黄河水投盡清流始㓕唐唐荘宗十年征戰不知勞三矢功成意氣豪自咤身為李天下焉知禍起郭門髙晋髙祖玉帛和蕃辱巳深那堪割地侈戎心關南一䧟腥膻後遺患寥寥直至仐漢高祖石氏君臣盡播遷晋陽兵起據中原早知只有三年漢何似􅂢軀報晋㤙周太祖岀鎮雄藩勢已危擁兵乗釁襲京師誰知一代生靈主元是雕青郭崔兒周世宗髙平决􅀾破劉旻北􅂑三関速􅀂神大業未成天命改殿前􅀧撿是真人許由肥遁箕山不可㝷髙名不朽到于今尚留昔日洗耳水為洗世人爭兢心后稷洪水横流四海飢教民稼穡務三時後王欲識艱難業讀取豳風匕月詩伊尹窮居樂道自躬耕那肯要君用割烹湯后不加三聘禮未應改志爲蒼生箕子諌君不聴念君深􅀍髪徉狂自鼓琴千古共傳箕子操一時難悟狡童心比干諌君不聴盍亡身豈􅃘求生却害仁不向天庭剖心死安知心異世間人伯夷避紂窮居北海濵㱕来端爲有仁人武王不聴車前諌餓死西山志亦伸太伯太伯髙風不可追鴈行接羽共南蜚莫言断髪便無用猶有􅍮蠻慕義歸太公隠迹蟠溪七十餘釣灘清淺鬢䔥踈滿懐韜畧為香餌只釣文王不釣魚周公明堂攝政朝群后四海流言孺子疑何亊召公猶不􅀃丹心惟有􅀑神知召公䑕牙雀角豈䏻欺召伯聦明聴不疑南國政成公巳去甘棠長結後人思齊威公諸侯九合霸圖成晋宋江黄盡㑹盟惟有召陵功最直包茅不貢故来征晋文公逆旅栖栖十九年五蛇夾􅀒遂升天却慙不及齊威正卿相由無管仲賢宋㐮公小國爭盟禍莫迯託名仁義直徒勞殺人􅀕􅀑寜非􅃘猶自臨戎惜二毛秦穆公秦穆平生善用兵孟明三敗始功成後人不識兵家勢異議紛從勝􅀒生楚荘王周衰夷狄最跳梁楚入春秋勢更強䏻用一言存㓕國賢㦲猶有一荘王魯隠公唐堯授舜由天命太伯奔呉避聖人魯隠効顰端可􅀏遜威不正自巳身威公菟裘有意身􅀅老社圃無端釁巳萌篡魯由来因羽父過齊争柰遇彭生荘公先君出㑹不生還魯弱無由可報􅁈禰廟豈冝姜氏見荘同何忍與讎婚閏公慶父衰姜産禍芽齗齗魯道可勝嗟武闈難起無人救季子来㱕未足嘉僖公僖公􅀎継伯禽凮盛徳揄楊魯頌中惟有春秋用王法不䡖一字曲褒公文公年時無閏月那成嵗廟有先君豈上賢魯國􅀙来秉周禮文公何事獨無天宣公東門無道敢欺天過市哀姜語可憐和氣致祥乖致異如公自合大無年成公周室􅀌危若旅人諸侯誰復肯来臣成公不朝是天子假道京師㑹伐秦㐮公侯伯誰修二霸公大夫專政自㐮公堂堂魯國車千乗翻在三家掌握中昭公昭公失國寓乾侯方伯無人肯見􅁨如晋􅃴齊徒􅂑辱祗縁不用子家謀定公春秋􅆠􅂣事紛然齊魯干戈㡬載連􅀂使真儒長見用来㱕何止汶陽田哀公諸侯失政倍臣僣中國無君左袵專欲問哀公後来亊春秋書止􅀗麟年鄭荘公天地深恩詎可忌􅄰生忠孝両俱巳身􅀙何出翻囚毋國是誰封敢射王齊㐮王諸児惟薄可曽修敝笱詩包両國羞何事春秋九諱惡祗縁􅀎報祖宗讎齊項公敵國行人詎可䡖等閑戯笑禍胎成胥閭竟日知何語囬首齊郊巳􅀍兵鄧祁侯舅甥柸酒結綢繆豈􅃘隂懐盗賊謀不聴三臣言亦是未湏深罪鄧祁侯晋獻公齒􅄠衰殘志慮昏讒興婦口可心寒不知尤物䏻為禍却為驪􅁎􅆍食安楚靈王章華䑓就國􅀍繇徴㑹諸侠意氣驕楚衆巳離猶不悟近臣徒為頌祁招楚懐王懐王誤與虎狼親身死咸陽一旅人見􅀃國人懐舊徳楚雖三户亦巳秦呉王夫差西施未必觧巳呉祗為讒臣害覇圖早使夫差誅宰嚭不應麋鹿到姑蘇越王勾踐機㑹由来貴速投姑蘇事與㑹稽侔謀臣不早麾兵進嘗膽徒勞二十秋頴考叔衣冠肉食謾紛紛誰觧柸􅅅感悟君頴谷封人雖賤士却䏻純孝至今聞石碏人情誰􅃘棄天倫公獨䏻􅀅義滅親何惜一時誅賊子不妨千古作純臣孔父春秋死難止三人皆欲求仁未得仁莭義可書惟孔父勝如仇牧勝如荀仇牧春秋死難止三人皆欲求仁未得仁仇牧􅂢軀為君父不如孔氏勝如荀荀息春秋死難止三人皆欲求仁未得仁荀息􅂢軀為􅀻暱也勝賊子與姦臣􅀕仲庻子雖賢寕奪嫡人臣惟聖可行權區區􅀕仲何為者賣國容身豈足賢管仲小莭區區豈足羞功名未􅂋分纍囚平生自有真知巳寕患威公怨射鈎大夫種狩罷呉郊鳥兎空果烹獵犬廢良弓大夫自為知㡬晚豈是陶朱計不忠范蠡乆與君王共苦辛功成身退肯逡巡五湖渺渺烟波闊誰是扁舟第二人李廣李廣才名漢世稀孝文猶自未深知輟飱長歎無頗牧翻惜􅀅軍不遇時隴右英豪真有種􅀅軍才氣更無雙功髙不得封侯賞祗為當時殺巳降婁師徳忤意由来勿校難誰􅀎唾面自令乹直湏事過心平後方服婁公度量寛狄仁傑武火方炎李欲􅁅忠良何力可􅀎囬斗南人有擎天手為向虞淵取日来徐有功獄興羅織䧟忠良公亦㡬遭虎口傷蹈死救人人免死論功何止漢于張梅溪先生文集卷第十
