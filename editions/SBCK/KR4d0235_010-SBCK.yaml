body:
  text: 詩予自饒易䕫以七月九日行饒人遮道挽㽞易轎由間道而去提􅀧何徳献相追不及以詩見􅀉云断橋截鐙亦堪憐始信林間别有天㣲見兵機第一義朱􅙲暫席廣文氊因次其韵誤辱番昜士庶憐閉門不許出朝天門名間行雖乏相如璧淂句全勝子敬氊同官酌别無徳於民愧冦恂断橋留我荷番人同僚送别四十里滿酌不辞三􅂾巡途中􅀉何徳献邂逅江湖兩白頭公方東駕我西㳺韓張呼酒情雖重孔李通家好未修􅂟􅃋詩高魏提􅀧秋香賦愧范饒州驛筒􅀙此相来往别後何妨却倡詶范文正公守饒時魏郎中蕪作提􅀧二公甚相淂文正改知潤州魏作􅂟􅃋堂栽花詩􅀉之文公嘗爲魏作秋香亭賦􅀫何山孫氏竹軒􅀚張安囯題壁因用其韵往来真箇及􅀲期去来皆七月見竹還思種竹時郡亝種竹今日賦詩􅄈舊集明朝不是楚東詩望庐山懐番昜同官五峯亭上同登日遥望庐山在杳􅁳今日庐山真滿眼回頭却望五峯亭萝􅀚八陣圖是夜􅀫章田易任䕫子囯身猶在重湖萝䰟􅂺先往臨江􅀚陣圖竒才盖三囯壮志吞兩都惜哉功不遂英雄為欷歔胡為恍惚間㣲茫見規模清時耻談兵武侯其戯予讀喻叔竒送行六詩番昜同事九十日尊酒相呼恨不多送别六詩詩似杜絶勝劉子竹枝歌都昌道中望庐山思故鄉肩輿終日在山間忽見庐山憶㕍山我亦無心入蓮社􅂅随征㕍及秋還過五柳湾出守江湖日念還又扶衰病入巴山不􅀎早作帰田計愧過渊明五柳湾􅀫栖真寺林間古刹號栖真髙躅難㝷晋宋人我正迷途倦奔走何繇来向此栖身懐番昜士民来去番昜各有因却疑行止亦由人此心可鍳惟天日公論難欺有士民􅀚渊􅀞像䔥洒風姿太絶塵寓形宇内任天真絃歌只用八十日便作田園帰去人題翠軒渊明舊􅀮名棲真中有栖真閑道人庐山咫尺脚不到開軒種竹清且新我到山中越三􅀫似與道人縁分熟皇恩􅀂許帰故鄉拭眼重来看修竹寓栖真四􅀫時二児寓上庠未知去㽞又祠命未下頗以爲懐白帝知何䖏黄山且少㽞地名上黄山心慙陶静莭政愧范饒州桒下越三􅀫江邉将半秋家書及祠命何日觧吾􅁨望大􅀌山湖口羅家渡中流見大􅀌山丗俗以􅀌爲姑以澎浪為彭郎遂有小姑嫁彭郎之語東坡戯見于詩番昜有童子渡渡頭有小山如冡丗傳為九女冢見于啚經其事甚怪盖亦丗俗流傳之訛遂以二渡所見戯成一詩番昜古渡㽞遺冡湖口烟鬟露淡粧九女何由􅀙童子兩姑那􅈕嫁彭郎題湖口驛芦花洲渚江人􅀖我来把酒臨西牎五祖六祖山照眼清流濁流水同江􅀌山大小各嶄絶鍾石上下相㫪撞千㠶出沒烟雨裏何如鷗鷺飛双双至江州遥與齊侯㑹江人故囯存夷吾嗟不見北望是中原和叔竒見􅀉荔子黄甘豈不香二物夔州所岀路經九折歎王陽羡君松竹吟哦䖏橘在懐中母在堂讀趙果州詩名不拙時爲江州添倅眉宇胷襟兩不塵唾成珠玉更清新惜哉不使蘇仙見題品寕先趙徳麟讀王文正遺事太平宰相王文正盛徳真冝有子孫舊囯今餘㡬喬木三槐隂滿宋乹坤題􅁃楼呈唐守立夫遥望香炉氣欲烟坐􅀚湓浦浪㫪天山川滿目古今迹雲水千㠶名利舡万􅀧白鷗家浩􅄅一声赤壁酹婵姢唐命妓歌赤壁詞詩篇細讀張耘叟􅀝遍䦨干思黯然􅀫太平興囯宫此来端不為行春未至宫七里有地名行春亭欲向庐山訪􅀮淪聖主如容食祠禄􅂅為主管太平人九天使者號真王聖治峯前古道􅂣五百年間聖君出太平治効過明皇自開元至今盖五百年􅀫東林贈然老儒服方􅂁兩秃翁兩家元是一家風帰田我欲效元亮结社師真如逺公㕍蕩此生看未􅁕虎溪一􅀏偶然同清凮明月処処共寕間江西与浙東白公草堂庐阜双林寺炉峯㡬瓣香日烘烟嫋􅂵敬為白公堂蓮社渊明修静不談禅孔老門中各自賢送别虎溪三􅀏後白蓮流水兩淒然題東林聦明泉逺公白蓮社旁有聦明泉飲此誰聦明社中十八賢堯舜不曽飲聦明本諸天我軰雖飲之聦明不加前為爱此水清一酌滌塵縁却恐愚此水愚名自今傳㳺圓通夹徑森森􅉱老松烟霞深処忽聞鍾虎溪水隔侯溪水馬耳峯聮石耳峯遺像人猶思後主李後主功徳院有祠堂開山僧不畏先鋒僧言曺先鋒翰下江州至圓通主僧跌坐不惧明朝杖屦山南去噴沬飛流看玉龍贈訥老路入侯溪无故侯􅆊王祠宇占清幽語言文字真吾病喜共維摩大士㳺題至楽亭双閣壮緇林一亭餘古屋庭垂祖師栢風動禅房竹山禽語畫寂岩花吐秋馥此樂本来無行人慕幽獨石散山形在旧有假山石巳散失有三巨石猶存池乾水意存㳺心山水外至楽不容言勝書記蜀僧也和予㳺玄通一詩用贈訥老韵酬未向䕫門訪武侯禅房杖屦謾通幽題詩况有詩僧和深喜庐山淂勝㳺次韵唐立夫以日者命状見􅀉天下名山欲徧看未􅀎高卧愧陳摶山人誤􅀃潜夫命只慕冥鴻不慕官唐詩云試把流年子細看休将蠖屈比鵬摶渠家大有回天力不爲區區作好官趙果州􅆀羊酒走筆戯詶十日庐山㳺􅂼腸作雷鳴對食有長鋏論文無麹生清浄似齋戒遟留欲修行翩翩佳公子憐我厭􅀺􅅅魚酒致逺意詩篇慰西征薑新㣲帶糟鮓羙香流􅎆今宵羊踏園䰟萝定湏驚回首白蓮社姑作陶渊明題訥菴圎通訥老以訥名菴題是菴者多用禅語予以儒􅀃證之休論摩詰与文殊試把菴名扣大儒君子於言端欲訥賢人終日只如愚楽山自昔称仁者利口由来惡嗇夫聴法双峯空􅋍耳老禅惟要一言無石耳馬耳圓通二高峯也題康王􅀚趣在烟霞丗味䡖天将庐阜尉西征且湏細看康王谷未用遥㝷白帝城星子地分天上􅀫谷簾泉占酒中名凌雲仙客知多少肯向風波丗路行有􅇒雲峯湯泉占淂乹坤造化炉地中沸出巧工夫泉猶自作炎凉態休􅀃衆生垢有无􅀫帰宗寺好山无数不知名路入禅林氣更清岩石有時開鏡面石鏡溪流入夜作鵉声鵉溪臨池墨客餘風韵寺本王右軍宅有墨池存拭眼高僧避􅃂榮安淂清風生兩腋􅂵霄峰頂望寰瀛簡􅄫􅀚陸修静道場縈迃草徑少人行忽有黄冠洞口迎自咲荒蕪陶静莭更㝷簡􅓦陸先生朝真惟有壇前石流水猶餘絃上声欲听全雞上金闕􅂵霄峰際白雲横陸先生善鼔琴􅀚有朝真石金雞􅂵霄皆山名㳺開先寺􅀚香炉瀑布諸峯讀李蘇二仙詩知庐阜之勝在是記以十韵庐山何䖏好勝地有開先瀑水潄寒玉潄玉亭香炉生􅂵烟香炉峯􅂵霄長近日􅂵霄峯黄石不知年黄石岩㕍蕩灵湫合有兩瀑布鄷城宝劍連双劍峯􅀛行似朝斗行亀峯鶴唳欲冲天鳴鶴峯馬尾只自洗馬尾泉牛頭奚用穿牛頭岩雄詞惟大白妙句更蘇仙寺占星流䖏星子縣橋飛月出邉碑方閱華蔵山谷作開先華蔵院記萝巳到栖賢明日㳺三峡帰心定决然予易任䕫子方力丐祠聞三峽之名愈起帰心㳺万杉院誰栽沙􅁐千株栁争佀庐山万本杉如欲歳寒長不改更栽松栢滿幽岩庐山三百六十所長有神光照万杉借問山中有何宝仁宗飛白字非凡一水遥分瀑布餘万杉深処散明珠不知散却珠多少􅀎買人間冨貴無散珠亭飛橋讀東坡漱玉亭詩至月出飛橋東句想像佳境有跳入清冷中之興予至開先新橋適成因書一絶蘇仙詩裏見飛橋欲看虹霓踏玉腰我到山中虹始見􅀭輝有月印青霄三峽橋三峽橋邉杖屨㳺此身疑巳到䕫州題詩欲比真三峽深媿詞源不倒流灔澦瞿塘在眼前便􅀿􅀙此上青天秋風脫葉随流下疑是十帆出峽舡五老峯􅄬老山林㒷已濃庐山欣与老人逢定湏容我来同老五老峯邉更有峰玉淵誰决銀河落半天飛流濺沬五峯前山中􅋄木皆光澗知有含輝玉在渊􅀫栖賢瀑水声中夜不眠星河影動半秋天誰云灔澦瞿唐逺只在洋瀾左蠡邉師子吼成方外法師子山石人叅淂定中禅石人峯住山五老知今古借問曽栖㡬箇賢㳺楞伽渉水穿雲一徑迃朱砂峯下訪僧居鳥鳴蝉噪更幽䖏中有人蔵万卷書李公擇蔵書之所老僧元不服朱砂境静心􅁅夀自遐庐阜招提三百所只餘折桂与楞伽有僧年八十一言庐山諸刹惟楞伽折桂不遭焚毁蔵書閣在已无書山色依然滿舊居㽞淂婦人三墨竹金鍾声裏尚扶踈鍾楼有李夫人墨竹公擇女兄山谷母也㳺南山入康谷以不􅀚谷簾泉為恨南康李守致上尊乃此泉名也戯成一絶不飲谷簾山下水徒􅀚瀑布下長川使君破我㳺山恨酒􅀉人間第一泉石鏡溪山中有鏡石為㙜雲霧深蔵木肯開别有一溪清佀鏡不湏人為拂塵埃庐山紀㳺四十韵我性好山水思向庐山庐五老招我㳺有約芝山􅀄茲行適所􅂅孰曰非天与入眼􅁃公楼興巳先籃輿雲開聖治峯石扣仙人居太平㒷国宫有聖治峯刘仙石香炉望烟靄净社􅀚芙蕖虎溪聊自咲天池歩冝紓天池㝡高不及㳺半月圓通􅇔幽亭楽有餘寺有至楽亭趣如六一翁境佀山環滁侯溪煑月泉石耳供岩􅂼峯以生石耳淂名破戒戯鱼酒踏園萝羊猪賢関淂家音二児時在太斈一日淂两書天恩拜新除抗章復辞免前辞䕫州今辞穴對行色仍躊躇遂作南山㳺首過荆林虚凌雲入康谷臨流清可漁􅁒飲第一水山深􅁕趑趄湯泉本何来忽􅀙龍口嘘鵉溪㝷故家帰宗寺本王右軍宅墨沼波猶瀦石鏡不可見懸崖照誰梳㝷真到簡􅄫入􅀚驚丘墟􅃡懐黄与陸何処飄霞􅅂簡寂􅀚乃陸修静道􅂣有黄石公岩觀今荒廃眼明見飛瀑澗壑鳴瓊琚何落句思李練飛詩陋儒新橋跨虹霓出月明蟾蜍兩州劳五馬同日傳双鱼至開先淂唐江州李南康書神光照万杉飛白􅇔天書遥瞻星子城青山􅀧㫪鉏我行未及西三峡知何如登橋閱天險􅁬地轟雷車壮哉五丁力鑿此千尺渠群峯列􅂄老深渊蓄璠玙五老諸峯及三峽玉渊並在栖賢古刹依朱砂穿林駭猿狙楞伽在朱砂峯下自栖賢子路穿荆􅁄而行万卷巳空閣三竹猶扶踈肩輿􅁕繭卒傳詩手疲胥佳境尚无窮雅興良巳攄身隨禽往還興逐雲卷舒重㝷訥菴老細論無言予節物变炎凉遟􅇔費居諸在路何悠悠帰萝頻蘧蘧秋風㕍還蕩緘封􅀉鄉閭帰宗樅老言庐山有對云簡寂􅀚中甜苦笋帰宗寺裏淡鹹韲予因以湯泉石鏡戯成一絶叅禅淂味鹹韲淡學道忘􅁨苦笋甜石鏡与時為􅂋晦湯泉渉丗有凉炎開先僧贈石菖蒲結根拳石伴􅀌僧對我還同道眼青莫遣塵埃侵九節㑹須重作玉衡星别庐山山北山南巳徧㳺又移行李向西州身如孟子論行止心愧渊明任去􅇔峯頂今宵􅀿好月人間明日是中秋天池一塔遥相送深喜浮雲為我収題天華院㳺徧庐山寺兹山亦自佳数宵縁石耳一飯為天華中秋􅀫瀼溪驛瑞昌縣半月㳺庐阜中秋􅀫瀼溪祠㝷元子􅀮元次山旧􅀮􅀣認赤烏栖吴赤烏所見之地坐待雲開月行愁雨作泥番人􅀿話我身在九江西浪士旧㳺処旅人今兩宵赤烏曽紀瑞銀杏敢興妖驛故簿斤有銀否木甚古􅀎為妖伐之遂息照眼水名瀼回頭山憶堯番昜有堯山男児四方志寕惮蜀天遥瑞昌李宰贈元次山集蒼然山色冷然声次山之文讀可驚令君贈我有深意􅁒以漫浪更吾名我雖有官真漫耳誰遣䕫門称刺史門卷欣逢子元子尤爱清泠瀼溪水中秋思鄉用瀼溪韵今夜中秋月還􅀿滿故溪遥知千里共深羡一枝栖歳月飄如萝年時醉佀􅅺可憐佳節裏兄弟各東西􅀫多福院古刹名多福􅀄来􅀫上方蜂窠懸敗壁燕壘滿空梁蝙蝠沸盈室塵埃堆滿床香燒数炷柏移下小僧房昨日飯金城􅀚今日飯石田驛城縦是金非􅂅淂田雖有石尚堪耕欲随秋㕍蕩中去却向杜䳌啼処行瑞昌永興道中作瑞昌属江州永㒷属興国蜀道青天手未摩肩輿􅀙此上危坡過瑞昌縣数里有亭子嶺頗高自番昜三山方有嶺永城朝過路方永永城驛名在兩邑之界多福夜眠僧不多岡畔􅅺深愁欲雨渡頭舟小喜無波黄岡橋為