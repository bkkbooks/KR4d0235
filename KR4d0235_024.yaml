body:
  text: 小簡答吕主簿廷某頓首再拜氣肅晚秋候臨良月伏惟主簿學士百神交相萬福駢臻某仰竊芘休重蒙記録謹因回介少布謝悰不宣某向寓雪溪獲瞻芝宇千里相逢而遂成傾蓋一樽屢共而辱與論久念几席之久違荷故舊之不棄逺頒翰墨仰佩謙勤披味以還感愧兼集某官斯文老匠後進名師不倦學古之心尤髙鑄人之手聲望煒燁平生知識最多人物魁梧他日富貴何患行見公朝之薦鶚寧憂小邑之栖鸞碩調護于鼎茵佇翶翔于臺閣某比因竊苐之還遂適披雲之碩特蒙枉顧益見撝謙别離經時行將命嵇吕之駕會合有日要須聮孟韓之詩惟是碩言併遲面究某濫被宸恩荐更幕府未修謝牘遽拜賀緘蒙長者之見先愧小人之不敏遂有親依之幸尤深欣忭之誠探禹穴而登稽山碩觀古諜泛剡溪而訪安道不廢家風與王安撫師心會稽地廣民夥號東南大都會苐以連歲災荒今年尤甚孟秋之初大風淫雨繼以江濤暴漲飄廬舍害禾稼瀕海之民死徙者稍多兹固仁人君子所宜動心仰惟入境之初首加訪問下車之始撫字為先上以寬聖君東顧之憂下以慰越人引領之望不勝幸甚某備貟幕職目覩其事輒敢以聞與趙侍郎令詪拜違台範晦朔遽更仰德之誠不忘鑒寐竊惟視印之初人事紛冗尺牘修敬不敢輒先雖去思之意不減于越人而後賀之罪巳同于談子尚兾貸其不敏某官疏通練達寬厚老成𩔶四十年之仕途號二千石之治最憲閩帥越異績愈彰方當寧以用度為憂卑明公以貨泉之柄中外相賀以為得人昔蕭何轉漕關中以給民食劉晏流錢地上用佐中興久無其人惟公是望輿論攸屬某非敢私比者天降之災害及稼穡越人瘠矣得旨賑濟遂獲更生竊知公為上言之活人手假巳見于得君之初也公巳去而不忘越越人德公亦將終身而不忘甘棠勿伐之詠在越而不在燕矣某以書生贊幕懵無所知仰荷包荒不賜譴斥子犯有罪猶自知之婁公見容可謂盛德尚兾始終垂庇獲免于戾感戴何窮與王舍人剛中史館舍人道德才猷文章議論真一代人傑也爰從大對忤意權臣養浩十年卒不為附麗計公道既開平步館閣兹者正位西掖有識相慶昔朝董蜚聲于對策而不遇明主常楊得體于制誥而俱非正人夫豈如公兼備衆美至若子産以潤色有功而立鄭宣公以代言振職而興唐相業可嘉起于辭令天下縉紳所同望于門下非某區區私祝也伏審代言西掖被命為真自代之章輒及寒賤靜惟斯舉本非虛文前輩逹賢引類多在于此爰從近歲兹道不公不出于觀望則生于請託故上不以實而求下亦以文而應自非髙明特逹之士以公道為已任孰肯于觀望請託之外而舉人仰惟大賢獨追前輩自顧何人可當公舉奬借過情感愧亡地啓事一封聊申謝臆雖舉于公朝不當講私謝之禮然待以國士其可以衆人報耶答陳少卿掞某前歲竊第行朝遂獲出入門下者數月伏蒙顧遇情均父兄私心感激無以借喻况獲珠玉盈篋以歸輝映里閭寵于得苐親故相見首以公之遇我者告之無不欽嘆厚德尚恨未有圖報之所而大斾巳西瞻望門墻不勝依戀李路鈐至越首拜誨緘之賜纍幅勤厚如面台顔伏承養浩丘園日有文字詩酒之樂仰見大君子所藴過人朝著山林無入而不自得又蒙欲以所作見示尤荷台眷之篤將始終教誨成就之也果蒙不鄙甚幸甚幸答李丞務蒙示先參政壙記三復流涕仍需挽章感認不鄙恭惟參政宏才碩學精忠大節凛然當代少見其比雖晚路為權臣所抑不獲伸其素志然天下公論史官直筆斷不可誣某輩鄙陋之詞豈足以發揚其萬一平生之所以聳慕者有不可辭三章謾往惶愧亡地與張臺法闡臺法鄊丈茂對新楊檢敕臺憲神相忠嘉台候萬福某日者伏審光膺寵命喜至于躍念欲即修賀書切謂大賢進用不止于此日俟殊擢故少遲之非敢自外于門下也仰惟聖君求治甚切不為無事吾鄊一二先達致身臺諌當得言之秋必能明目張膽以慰公論某所以遲遲而賀者亦姑有待焉敢乞上體眷隆展盡砥藴以結主知指日大用以福蒼生以副簮紳之望維桑與梓亦被餘榮答溫守周侍郎綰伏蒙賜以書翰圎緘纍幅禮意有加旨酒生羊為貺甚寵近代先逹薦紳以名位自居貴不下賤久矣兼逹尊之三且身為邦伯而禮先于寒賤後學德盛而謙世所未有顧某何者可以蒙此邪下拜之餘感懼并集答台守凌侍郎哲伏蒙台慈以某假塗赴闕特有寵賜某竊聞將有逺行行必以贐雖百鎰在所不辭然可以無取取則傷廉雖一錢有不宜受獨于仁者之賜輒起小人之貪拜貺以還感愧無地今祗領到州十千省發路之賜謹用回納與王運使之望某官道德政事文章經術當于古人前輩中求之非止可為今日儒宗吏師也朝廷方以全蜀為重故卑以外臺之寄恩威五十四郡屹然為國長城以寬主上西顧之憂豈以蕭何能轉輸劉晏知取豫之事而凂縉紳先生耶越蜀相去萬里不修興居問又復二年惟拳拳斗仰之誠不替朝夕去歲邸報中獲觀臺諫列薦之章士夫識與不識罔不欽嘆門下士喜如之何清資峻秩不足為先生榮異日特書大書屢書者為可貴爾比至行朝虞郎中出示蜀中小録竊知職試文衡獲覩約束知其所得必真才實學相如楊雄三蘇輩一綱盡矣省榜巳揭太學得百餘人可謂盛事皆出先生疇昔作成教導之賜也近年文體屢變學官屢易士子多異論惟推服吾先生至今無異辭入蜀以來聲聞益著朝論翕然何大諌諸公稱道尤力召還必在數月間某或未以罪去復有摳衣之幸矣某晚學不才試吏越幕自謂必以瘝曠獲罪誤蒙郡帥王書見知嘗薦僚屬四人于朝以某為首然某亦佩服先生之教在越兩載不敢以一字逹廟堂諸公臘月七日終更當日挈賤纍還鄊欲屏迹山林以安愚拙不謂叨被誤恩有校讎册府之命退惟僥冒實出先生平日齒牙餘賜苐切愧感榖日離家二月初至行朝供職巳半月賤纍猶未來也汪聖錫為少蓬尤厭士論館中皆一時英雋某厠迹其間葭倚群玉愧不自勝先生顧遇素􅌋必有以警策不逮俾終為善類之歸幸甚某比因廷對尤荷今四川制置王丈見知代言西掖舉以自代自帷疏繆聲迹沈下仰蒙特達感激不巳以國士見遇者帷吾先生及舍人丈二人今皆在萬里故某歸依慕用之誠尤在于蜀也閻梁二同年試吏兩川帥幕閻質直梁俊邁皆蜀中佳士獲趍事大賢必蒙厚遇劉韶美宫教在會稽逰從甚欵自謂受知于先生語必慨然葉樞至越見之大以為竒延譽諸公今亦移行朝供職矣先生行將大用薦賢報國尤所當先閻察推老矣當不待終更而薦之可也輿論所欲非某敢私答曽知郡汪某官人物不群才德俱邵學術通倫類而無入不得儒雅飾吏事而所至有聲南州之政巳聞北闕之詔將下豈兹小壘可淹大賢輿論所期非某敢私祝也往歲某官吏隱樂清主􅉀鄊校某獲執經與諸生之列最蒙不以碌碌餘子遇窺奧境而知所㷌皆我公博約之賜也違去二十年兩遭家難屢困埸屋聲迹沈下逾逺門墻尺書修敬莫克自致于千里之逺愧愧負負何以自文然景山仰斗之誠初未嘗一日替仰惟髙明宏博必恕其不敏而亮其無他臨𥿄悚懼不自巳巳與任安撫古某官全名大節凛然超絶昔人前輩之上乃者持風憲肅朝綱忠言讜論屢批逆鱗姦邪寢謀盜名器者為之膽落議者謂雖漢汲黯唐魏鄭公國朝王元之唐子方諸公殆無以過直道不容一麾出守有識之士咸為清朝惜之然聖主圖治方鋭急于見賢端人正士決不可久外宣室之念正深詔書行落大江之西公其為蒼生起某叨被誤恩校讎册府靜帷僥冒實出先逹大賢吹噓奬拔之賜寧不知感苐恨來晚不獲瞻拜合光親承博約以慰平昔慕用之誠然每見同舍郎稱頌盛德幾不容口柏臺蓬山至今有光吾道甚幸名教甚幸答趙撫幹伯椿荐拜劄翰之辱如對標致于几席間喜可知也暑雨未歇伏審蓮幕風髙贊畫有相台候萬福某竊祿懷愧每廑記録蝤蛑風味不惟勝無腸公子自可以輩瑶柱江君會稽固不易得錢塘又絶無之臨食必起故鄉之思興與鱸蓴同但不能如張翰之勇決耳逺蒙分貺以養吾老叨愧感俱不少也道山石渠輒納墨本置之悠然閣可與南山同入眼劉子政乃天祿閣中人豈容懷惓惓之忠久屈于外耶與任提舉文薦某官以直道立朝去非其罪物論惜之兹承光奉宸恩榮持使節作外臺之耳目聳風采于大江之西識者謂聖眷方隆兹實大用之權輿也伏想輶軒屇道而召節巳隆天氣正炎淫雨未歇敢祝善保台重某仰視台照輒有塵稟某有表叔賈如規者宣靖間在太學有聲後困場屋遂俯就恩科其人極有士行為鄊里所推前任建昌尉以清白聞今任興國軍司理秋冬間赴上賈安分自守不求知于人然某官方以人物為心不敢不以其名聞也又親戚劉鎮者戊辰榜中乙科其人有學問工詩文通曉吏事見任洪州司法登苐一星餘尚困選調今皆獲趨事大賢深為之喜儻蒙提挈成就甚幸甚幸苟非其人某亦不敢妄舉與王總領之望浙中去蜀如在天上不修興居狀又復一年惟是萬里斗仰之誠不替朝夕幾叔至臨安出所賜書欽閲以還感佩謙抑去歲聞石命某喜尤不自勝謂即有瞻拜之幸既而改除輿論殊鬱蓋朝廷以蜀為重姑留大賢然議者謂汲長孺當在朝不當使之在外也近日廟堂設施皆合人心如張右相胡邦行自使凌汪二公為天官豫章宣城之除無不稱善縉紳日徯先生之歸便當為治裝計某竊食蓬山日虞罪戾兹蒙誤恩備貟佐撰退惟僥冒實先生疇昔奬借之賜苐增感激然某去冬輪對妄論時事初自謂必得罪聖主寬容不惟不怒且略施行其言既而館中諸公相繼論列上一一開納但側目者衆迹不自安某與馮圎仲一一同舍皆請外廟堂不肯敷奏葉樞以其事聞上喻宰執俱不容去某以求去得遷力辭不獲今亦不住為乞外丐祠計萬一果遂所願甚幸甚幸先生知遇有素更乞時賜警策俾終不為小人之歸以辱門下其為幸也又大矣幾叔被辟益見先生友愛之篤聞問間無不欽歎萬里之行良勞苐恐坐席未暖必隨台斾而還也鄭正叔教授昔在上庠獲預執經之列久與幾叔遊今相隨入蜀切望周旋閻梁二同年近得書皆荷知遇閻又蒙以四條首薦尤感激也近館職甚缺貟次苐皆召試矣主上聖德日加陳丞相有容德頗收拾人才臺綱稍振陳應求副端排擊姦邪保全善類尤為士論所歸乃汪端公薦引之也用劉信叔逐劉寶皆近日可喜事其他事體幾叔能言之答王舍人佐别大君子凡三年相去二千里之逺修敬不先下拜誨緘之寵者再矣舍人不以先逹自居而謙德如此某晚進乃敢㻋怠尚何以自文耶某比備數館職與二三同舍日以時事為憂初欲同上封事未果會當輪對遂各以巳見獻某最山野狂妄尤甚上寬大能受盡言不惟不怒且略施行之但左右前後瞋目切齒者終不相置某自去冬求去劄子凡數十上凡八閲月始遂所請然區區之意止是丐祠廟堂乃委曲如此出自望外闕期近在九月間當復申前請以遂所志不復詣仁者之里日俟舍人丈零陵報政遄歸廊廟公道復行清流增氣某巳挂之冠當復彈矣蒙示兩𥿄論列時事仰見舍人丈天資忠義過人逺甚不以身外而忘愛君憂國心也三復以還欽嘆不巳某以五月十八日離行朝至途中聞次日有虜使失禮事中外咸懷主辱以死之恥况官穹祿濃者當如何某方屏迹田野雖黜陟不知理亂不聞不復開口及時事然畎畝惓惓之誠猶前日耳况舍人丈受明主之知膺千里之寄宜其不能自巳也來書所説荆襄雷化事此豈細故耶梁丈賢者方居言路不可不以告之與洪檢詳邁比獲識檢詳難兄弟于朝讀雄偉之文聞正大之論知天下士在一門也又辱為檢詳同舍之未荷知良不淺臨行既勤餞送仍寵以詩章歸槖有光感激無巳違去數月斗仰不忘需次弊鄉偶成見闕雖貧居急祿而卧病未能遽行復申祠請實非獲巳儻蒙台念見廟堂諸公曲賜一言俾遂所求不勝至幸與杜殿院起莘伏審光膺宸命榮陟臺端天子親擢正人中外莫不相慶竊聞殿院丈排擊姦邪保全善類饒君子不饒小人果踐平日之語某受知最厚贊喜叵量更兾盡攄素藴益振臺綱以滿中外之望與吳察院芾伏審光膺宸命榮陟霜臺朝登正人中外胥慶拜違台範垂三十年雖修敬有稽而仰德不替比聞召環真成不寐之喜然君子未來而小人巳去道出婺女日伺騎音竟不瞻際悵望何巳某蒙恩補外需次還鄊方幸息肩官司來督赴任雖貧居急祿而多病未能遽行遙望門墻倍增依慕與汪侍郎某入館之初侍郎丈以先逹儒宗為蓬萊主人遂獲朝夕趍隅以聽博約重辱顧遇不後同輩臨行又蒙餞别之寵晚進不才何以得此拜違數月斗仰益厪需次弊鄊偶成見闕貧居急于得祿便欲奔赱就職緣冒暑得疾未能去體素苦痰嗽遇秋復作不免復申前請以劄子託圎仲矣敢望侍郎丈見廟堂一言俾遂區區之碩庶得在家醫治少延殘喘不勝感幸與凌侍郎景夏某備數册府獲識侍郎犬于朝望儼然之容聞正大之論知朝廷之有人三十年盛名不虛得也謙恭下士真有前輩風某愚不入時獨蒙顧遇臨行又辱寵餞禮意有加晚學不才何以得此于大君子私心感激不自已已違去數月斗仰彌厪需次還鄊偶成見闕雖貧居急于得祿而卧病未能遽行復申祠請實非獲巳巳懇汪丈為告廟堂更告侍郎文曲賜一言俾遂所求幸甚與劉察院度伏審光膺宸命榮陟霜臺大用有階善類相慶其晚學不才濫遊册府獲親炙者幾二年薰溫粹之容稔忠􅌋之論知君子所養過人愧僕輩匹夫之賤每蒙推誠顧遇警策不敏臨行惜別著見顔色既勤飲餞又寵以詩章誦小小林園意自憐之句覺松菊之有光也違去數月夢寐不忘自聞新除喜不自已近朝廷去積年巨惡大快輿論天下知臺諌之有人矣與陳侍郎俊卿光膺宸命榮陟從班朝登正人中外相慶天子欲其居獻納之地天下知其為大用之階有識君子惜其去風憲之早也某晚進不才素蒙知遇天資狂妄尤荷保全去逺風墻不勝依慕與汪中丞伏以中丞負王佐才為長御史以暴公子之威名而持斧以裴中立之德望而視師風采所加華夏咸聳悍將為之落膽狂虜不敢貫弓一正天下如其仁不有君子其能國大夫出利國家安社稷兹其時哉宰相上佐天子理隂陽孰先公者某受知不淺贊喜為多方苦癢痾之侵復伸祠佚之請望墻墻其愈逺瞻履舄而莫遑想旌斾之巳旋諒紀綱之益振倚須大拜續赱賀緘與趙安撫清卿某晚學不才備數册府最蒙安撫待制丈顧遇不淺臨行又辱寵贈禮意有加然待制方以清白表率縉紳某不收自處于傷廉之地雖不拜賜而感激未嘗自巳拜違數月仰德益勤需次弊鄊偶成見闕雖貧居急于得祿然為多病所困輒復丐祠愈逺門墻不勝依慕與梁司諫某愚不入時獨蒙司諌丈特逹知遇狂妄之迹賴以保全臨行又拜清白之貺拜違數月斗仰不忘竊聞司諫危言讜論排擊姦邪天下咸稱為真諌官莫不想望風采樂道人之善人之常情也况某受知不淺喜當如何答陳侍郎正同某自丱角學讀書聞先生長者之論知欽慕忠肅公之為人去春匆匆西邁一物不暇將獨携溫公忠肅二畫像而行尊堯集雖􅌻閲之每以不見全集為恨兹辱頒賜副以石刻既慗冠下拜遂撥置群書朝夕欽誦真可與日星爭輝非照乘珠比也答溫守徐侍郎兹聞力請千朝巳遂祠佚方與邦人同結去思未遑趍拜遽奉貶誨仰佩謙沖其嘗嘆近世人才少有全者或吏才長于治郡而名節無聞或名節著于立朝而政事多短獨侍郎丈昔持從槖天下稱為正人出守海邦人咸謂自有郡以來未有賢明太守如侍郎者非某之私言也承台斾取道樂成當探伺戒塗俯伏道左與攀轅之列與溫守莫郎中伯虛某官天賦材猷家傳吏事籍甚之譽藹著簮紳聖天子方以外治為憂故輟自握蘭出分符竹踐楊中外無適不宜顧東嘉小郡豈足以屈大賢苐以先大監遺愛著在千里人心井棠且猶愛之况其子耶民望使君之來久矣想不勞而治也然朝廷需才方急指日召環行見卧轍攀轅又如三十載之前舊使君之去也答湖守陳郎中之茂拜違一年又半矣千里仰斗之情常在夢寐中也往五月去國行色匆遽不及以書告違還家許久去郡城稍逺無霅川便又不獲修敬愧愧負負何以自文不謂長者不以其愚不肖逺勞記憶賜以手書盈幅諄諄情辭備見如前目在道山侍几舄承博約時也喜如之何弊鄊去湖雖逺而知郡丈政聲籍籍著人耳目比得莫子齊書言吾丈去歲修城今又大忠烈廟皆有碑刻文章政事于是兩全某謂此乃通才餘事其好善嫉惡之性胸中耿耿之竒議論慷慨名節凛然當于古人中求之可也某雖晚進不才辱顧遇良不淺比見送馮圎仲序復及小人異日遂可託太賢之文牽聮不朽矣圎仲之去可惜然于出處無愧吾徒之幸元章半月之欵想足以破碩一好漢如此不容于時何耶杜起莘盡言而去士論甚休亦一時館閣遊從盛事也某屏迹山間足迹不到州縣闔門二百指飯雖不足亦頗能忍窮有小小園林足以自適惟畎畞之心惓惓猶前日耳未能乘桴從遊踐送别之語臨𥿄不勝依依與永嘉南溪國朝宗某作别踰年不廢思仰自竊苐歸鄊念欲一見異邑之阻願無由遂秋秒微寒伏惟文候萬福近朝廷行兼經最優春秋吾友記問素􅌻于場屋尤利來春有輔切宜勉力某易任會稽旦夕成行他日行李過越切望見訪少凂術士劉孚先談命頗竒中覔字求見幸一過之更望吹噓俾有所獲亦不廢之惠也會合未期望為逺業加受梅溪先生後集卷第二十四
