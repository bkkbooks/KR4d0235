  text: 梅溪先生後集卷第七
  hash: sha256:68ce60e5eb65f9e6c01209a94f79579fe6bedadcdc1ff2fd60546f4885ff8af4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_007-1a}
body:
  text: 詩赴召壬午六月十一日上受禪二十一日有旨除臣某知嚴州九月二十一日召赴行在聖主龍飛才十日微臣得郡古嚴陵詔書又趣歸天闕碩竭孤忠贊中興曹夢良贈炭戲成一絶豫時為郎夢良為嚴州司户烏龍書至送烏薪郎舍嚴冬覺有春未睱吞為啞口漢旦須暖作直身入宿學呈同官時為司業宿學私試不聽梧桐雨回頭已六年虀鹽諳舊味燈火結前緣進學思韓愈同襟有鄭虔諸生不待勸忠孝素惓惓某去五月罷館職還鄉塗中以詩寄同舍云去國懷明主離群念舊遊翻令到家夢中夜繞瀛洲今以史職復至道山訪舊或遷或去惟後園修竹乃故人也感嘆良久因成短篇蓬萊隔弱水三年兩來遊群仙各何之翩然蛻神洲園中舊籜龍徑節含清幽手摘歲寒葉恍惚乘歸舟馮員仲赴闕奏事士君子咸𣣔其晉聞為魏公所辟勢不可奪遂成鄙語兼簡查元章名德重夷夏皇朝兩魏公平淮巳得愈論將更資馮報主男兒志知恩國志風書收良馬去兾北遂群空豫嘗以書寄馮云聞元章為覯公所知裴度幕中得韓退之賊不足乎矣元章時為機宜員沖為江西運判召來奏事程泰之郎中以詩三絶覔省中梅花因次其韻長記蓬山舊賞梅芳樽一笑共君開重遊未見梅花靣應誤君詩得得來詩似西湖處士詩十篇三絶鬪清竒更將正味森嚴句壓倒屋􅉉斜八枝程未篇云花中結子酸連骨正味森嚴衆苦之待得和羔渠自會如今莫𬋩人眉竹亭不到幾經時來往逢梅似退之遙想吾廬溪上好十分鄊思又關眉胡祕監贈詩一絶司業口占絶句竒甚銓輒用韻和呈效吳躰南山舊説王隱者北斗今看韓退之不須覔句花照眼行見調羔酸著枝棊依韻奉酬平生恨未識剛者今日豈期親見之𣣔把江梅比孤潔江梅無此歲寒枝時胡丈同館中諸公見訪因晉小酌豫舉和程泰之梅詩壓到屋􅉉斜入枝句胡頗稱賞和枝字韻以贈胡祕監酴醾詩銓携具賞石渠酴醾用坡韻呈同舍酴醿獨殿春得路未為晚露葉張翠繖月蘃明玉􅎻洗粧雨亦妍暗麝風更逺唐時真宰相徑氣凌諌苑危言工切劘壁立萬仭瓛帝為釀此花以賞碩畫婉清芬濯千古天河豈須晚不妨便醉死聞香定魂返唐憲宗以李直言賜酴醿酒未若此集真酴醾也某次韻祕監携具道山集群仙賞酴醿和東坡詩真雅會也某偶以私試鎖宿不與遂次其韻紅𬗋紛爭先酴醿分甘晚誰栽群玉府童童翠張􅎻華共芬藝香韻隨官逸逺館中酴醿在著廷之後著作郎號逸逺官奚用燃青藜端能照書苑先生海上歸平步到蓬巘招邀飲醇酎剛腸出清婉遙思吳宫魂故作楚辭挽勿為花所晉興盡要知返館中三月晦日聞鶯胡邦衡有詩用東坡酴醿韻有居側無讒人發口不須婉句某次韻久傷伐木廢每嘆吾生晚黃鳥從何來喬林緑埀􅎻忽作相呼聲朋來無近逺髙翥凌雲煙斜飛集池苑中有幽谷次遲遲下遙巘群音巧相和出語獨不婉啞啞如老烏聞者弓欲挽知心有杜鵑勸爾故園返上賜講讀官建茶某以説書與馬以十餅分贈太學同舍苪太博輝有詩次韻天表𥘉容咫尺親雲龍重拜太官珍賜從明主恩尤渥分及清流事更新搜卷要須嘗七碗乘風便合到三神諸公異日估君貺碩寄江湖老散人四月從駕詣德夀宮與諸公會食于和樂樓是日借洪景嚴承旨馬戲云從駕濫騎承旨馬朝天叨綴舍人班時為起居舍人異日再集胡舍人邦衡云不可不成篇也遂于樓中足之殿拗經幄侍清間學術空踈愧在顔從駕濫騎承旨馬朝天叨綴舍人班登樓雖喜民和樂論事還驚世險艱聖主英姿同藝祖諸君何苦戀湖山時議欲乞移蹕建康侍從諸公有異論者故云周登和樂樓韻酬胡邦衡送别兼簡劉韶美祕監未訪鄱陽范與顔顔魯公范文正公俱守番陽雁山深處且投間𬗋泥長記曽同召丹陛何繇更對班我愧未行平日志公應不創昔時艱筆端能制人生死兼有劉郎在道山豫與邦衡詔美嘗同為編修官豫既入臺即罷史聀而二公如故去國大月十九日去國常憂國還家未有家先人弊廬為風雨所壞君恩報無所含愧出京華重遊釣臺三年兩泝釣灘濤來往何曽輔一毫聖主雅恢光武量微臣當遂子陵高弭棹祠堂下一天星斗明客星尋不見影浸釣灘清過婺女同年王節推夷仲黃教授万頃鄉人華主簿子周會飲雙溪樓年時嘗泛婺溪舟未上清風八詠樓天為故人償夙碩辛已五月至婺溪夷仲諸同年有登樓之約忽聞欽宗諱遂止水知吾輩喜清流沈郎不為吟詩瘦王粲長懷去國憂明日山川共人逺鄉情年契兩悠悠遊仙都皇都歸客過仙都厭看西湖看鼎湖洞接龍泓片雲近有龍泓洞山分雁蕩一峯孤有石柱壁立如雁蕩天柱峯香清天上碧菙落音好林間青鳥呼天遣林泉尉吾輩不容身世老迷塗遊洞溪舊名惡溪因段成式改名好溪有唐太守李君卿十詩有亭名思賢段公不到溪豈好李守已亡詩更竒偶向思賢亭上坐愛溪兼愛昔人詩重遊石門洞石洞幾時闢石門長不扃貪看一派水三載兩回經誰把銀河水直從天半傾好流人世去一洗四維清寄題喻叔竒亦好園喻子有園堪飬親栽花種竹清且新堂中戲罷即䇿杖叔竒有母家有戲采堂在家有此何憂貧弟兄既好園亦好叔竒與兄伯夀同登科大勝吾家園小小兩園松竹懷主人他日歸來各須早種𬞞癸未孟秋歸自武林小小園荒蕪之甚遂課僮僕畦以植𬞞近得微雨頗有生意潛澗老叔分蔥虀數十本及菜子一二種今冬百指可以無饉矣書十五韻歸來日彈鋏食無肉與魚却將種花地町畦育嘉𬞞驕陽每抱甕時雨親荷鉏青青有生意令我顔色舒寧憂饉與飢亦有瓶中儲前身老闍梨或云豫前身嚴闍梨也因以戲云𬞞氣端未除文字亦宿業復生魚蠧書蠧書仍食𬞞苦淡味有餘况茲清淨根分來自僧居端能納須彌聊爾秀郊墟洗我腥羶腸退之詩云聲名暫羶薌非止為魚肉也襟宇生清虛豈惟陶淵明吾亦愛吾廬荒園涉成趣枯藤當安輿困枕案頭卷飢著盤中菹孔門陳蔡色借問何如豫豫素不善棊孫先覺萬大年林大和見訪戲與對壘偶皆勝之因作數語豫手不善談臨局氣先怯偶逢孫萬林三戰輒三捷都緣敵不勍非以臺威脅孺子濫成名凱奏意殊愜三君皆壯士小挫未肯厭豫今務持勝堅壁不容劫豫昔在館中每與同舍郎陳阜卿手談既而陳遷臺察一日相豫棊諸公戲云陳今有臺威公必敗豫偶勝之陳笑曰公果不畏臺威邪大年和棊詩復次前韻君棊如龍且𥘉笑韓信怯我棊似公瑾赤壁真橫捷但知貪旁角不覺攻背脅主人本無競勝負兩俱愜嘉賔儻再集鏖戰定誰厭新篇尤逼人我輩徒劫劫太白晝見太白晝見久矣豫是日始親見之八月二十六日煌煌太白生東方追逐殘月生光芒太陽中天不肯藏過午一點猶微茫太史占之此何祥咸憂兵起人流亡金行用事多災傷六月十五日大風水七月朔日又作八月二十一夜地震自秋七月不雨浙西飛煌蔽天大風地震水旱蝗有一于此冝預防雜然並見何以當臣言天意未可量滔天赤地興堯湯偃禾拔木悟成王宋景一言國乃昌災異不作憂楚莊吾皇修德應彼蒼去讒逺侫任忠良推誠納諌正紀綱內修政事仍外攘誓雪國耻還封疆強虜當弱吾當強天文志太白與日爭明強國弱弱國強天戒為福非為殃碩勿徒以虛文禳荆婦夜績涼飊墮黃葉促織催女工鬢絲不堪織細君哀我窮青燈績深夜績成寒素風碩為隱者衣德耀隨梁鴻術者謂子命犯元辰故每仕輒已豫笑曰有是哉戲作問答語問君胡為八臺省問君胡為官輒冷宣尼猶且畏元辰羊鼠龍豬作君梗退之宿直斗牛箕聲名謗毁常相隨死生窮逹端有命豫知之矣當安之再至雙植堂呈表兄李克明此日一樽酒再遊雙植堂湖山浮野色草木帶秋光東道德已孰西風花更香相看俱老矣會合意尤長九日寄表叔賈司理并引某昔從潘先生學九日登鹿迹岩嘗賦詩呈諸長者時年十七今閲三紀矣當時和者賈太孺潘先生劉謙仲覺闍梨皆一時詩人也某猶能記其略𢾗老人化去久矣思之慨然司理丈鹿岩賢主人也佳節必盛集某恨不獲奉樽爼輒成古詩十韻以記舊事并以蒙泉酒鳯團荼為夀憶昔從師學絃誦年與賈生相伯仲某詩與諸賈昆季遊皆年少也九日登髙鹿岩脊感物題詩筆𥘉㺯舊遊回首半零落三十六年真一夢當時唱和三四老尚有殘篇可吟諷今年節物身在家行樂山間謾隨衆弟兄勸我登高山身似駑駘不容鞚兄弟鄰里𣣔同登髙某以時多凶荒災異反賊軀多病止之河東先生今靖節有酒寧須白衣送朋尊聊獻菲蒙泉近日蒙泉酒下佳趣有菲泉最下品酒也可以菲蒙泉名之賜茗仍分小團鳯願公一飲夀千齡三物年年敢馳貢九日不登高與兄弟鄰里就弊舍飲菊中秋對明月中秋亦就家賞月九日逢黃花節物豈不好而况身在家樽酒醵鄰里盤餐飣魚蝦何必登高山清歡自無涯仙居陳少曽寄錦石杯書至乃九日也方與坐客把菊遂用以勸酒九日登臨有雁來書傳坐上手親開呼兒滿酌黃花酒為子深傾錦石杯僕夫浚井得雙鯽一鰻未及烹也藏之泥水間豫見而放之因作數語三秋不雨泉脈枯僕夫浚井欣得魚刀砧已具未及殺我偶見之魚再活親投不敢使校人圉圉洋洋生意新莫嫌井小思滄海尺水相忘聊自在得張大猷尚書書云比每進對屢以待御為言而邦衡舍人言尤數切云云某為郡邪所疾獨見知二公因讀邦衡和和樂樓詩復用前韻一月霜臺屢犯顔未回天聽巳身間愛君憂國寸心赤感物傷時雙鬢班文舉才踈意徒廣子雲思苦語尤艱尚書左史雖知我超海應難挾太山次韻題寶印叔蘭若堂何處名蘭若依山結草堂花枝法雨潤心地佛燈光浮世囂塵隔空門歲月長林間有啼鳥聽法亦來翔藤杖頭角槎牙萬歲藤遍身節目更稜稜山僧贈我非無意要我清間亦似僧豫還自武林葺先人弊廬淨掃一室晨起焚香讀書於其間興至賦詩客來飲酒啜茶或奕棊為戲藏書數百卷手自暴之有小園時䇿枤以遊時遇秋旱驅家僮浚井汲水澆花良天佳月與兄弟鄰里把酒杯同賞過重九方見菊以泛觴有足樂者每覽鏡見蒼顔白髮亦聊自歎也作小詩十五首掃室灑掃學者事陳蕃胡不然要令天下淨端自室中先焚香掃地眼塵淨焚香心境清案頭時一炷邪慮不應生讀書八政慚無學還家更讀書翻同小兒輩相共惜居諸賦詩秋興最難遣詩懷如亂雲雖無小陵筆一飯不忘君飲酒我意豈在酒銜杯聊樂天客來同一醉客去獨髙眠啜茶濫與金華講賜沾龍鳯團却歸林下飲更愧是粗官奕棊光景老尤惜忍銷枰奕間娛賓欠絲竹一局戰清間暴書秋日更可畏所宜惟暴書反身還自笑均是蠧書魚䇿杖園小日思涉山高時𣣔登老來疲腳力興至䇿枯藤汲水浚井得鰻放之明日水漲靣清僕夫云鰻能穿石眼通泉脈故戲汲之山中久不雨汲水欲何從一夜井泉逹靈鰻恐是龍澆花花木正憔悴秋陽那更驕驅童綆深井聊助化工澆賞月還舍八十日三逢明月圓停杯試一問歸去定何年采菊既晚開何益采之聊泛觴書生自頭白奚用泣馨香覽鏡可正冝頻覽無塵亦自磨少陵今老矣功業欲如何浚井旱久井垂涸汲多泉更渾浚教泥淨盡何患不逢原酬林明仲寄書并長篇名季任江頭一别九十日路隔煙波望𣣔迷風送雁群來雁蕩書從梅嶼到梅溪羡君筆力能豪健贈我詩篇過品題謝客江山富觀覽城南何日手重携昌齡欲遊白石興盡而止豫亦思前年之遊遂次其韻前年蠟屐逺尋幽洞府曽經一宿晉詩句親題碧雲裏夢魂時到白岩頭風生見説欲飛去興盡何如且罷休他日相呼老兄弟飄然杖屨共翶遊洪丞不負軒坐此軒無愧問君何以能所行皆是學不負豈惟丞鳬鶩文書靜槐松詩思凝博陵徒種績踐履亦何曽周丞奉挽詩同年周敏卿父平生義方教真是起家媒有子碩已足無心官自來興隨鳩杖逸情為雁行哀想見長塘水凄涼繞夜臺黃岩趙十朋賢士也有詩云四枚豚犬教知書二頃良田侭有餘魯酒三杯棊一局客來渾不問親踈豫亦有東臯二頃兩子皆學讀書客至則奕棊飲酒遂用趙君詩意成一絶薄有田園種斗升兩兒傳授讀書燈客來一局三杯酒王十朋如趙十朋陳商英挽詞貴似金張當石崇紛紛老死利名中退居不見香山老肥遁誰知秀野翁啇英號秀野翁溪上園因種花闢牀頭金為好賓空潸然痛念公兄弟二十年前筆硯同陳商霖挽詞疇昔遊從分不輕十年鄉校讀書燈德星會聚三兄弟詩社追隨八友朋昔在招仙館有八叟之號啇霖號可叟去國悲涼老王粲還鄉牢落失陳登誦君生死炎涼句斜日寒天涕滿膺商霖嘗有詩云生死交情誰念舊炎涼丗態競迎新萬清之有詩三絶呈司理賈犬并簡某因次其韻燈花端為故人然留客殷勤為擊鮮更覺門闌增喜氣氷清玉潤兩俱賢清之司理壻也世路塵埃逐日生鹿岩高卧自風清吾皇有詔求遺逸行見臨雍拜老更甘言恥效蜜翁翁逆耳空餘甽畒忠願子他年似房杜好將一語記文中再用前韻論文尊酒意歡然蠟炬高燒夜色鮮得壻端同權相國傳經更似老韋賢右呈司理僚壻欣逢舊友生人如王謝氣尤清十年前巳心相許細看新詩貌愈更右酬清之士論鄉評重乃翁賢如狐突教兒忠治安䇿就君冝獻宣室開時夜正中右贈大老司理豫未臘而雪豐年兆也大老有詩次韻明年禾黍定千鍾瑞雪攙先舞曉風更願平淮捷書至西平禽賊獻司空主人開燕倒金鍾坐客俱吟柳絮風應念人間有貧者爐星撥盡酒瓶空雪中寄梅花與清之大老天花除惱臘前雪香蘂報春溪上梅分贈鹿岩龍宄友異時俱是百花魁題夢齡五桂堂我昔曽栽會趣堂子今封植更芬芳勝它福峙三珠樹賽却東嘉五馬坊永嘉王氏雙桂正在五馬坊靖節柳青寧耐久大夫松老恨無香何如移得蟾宫種不愧靈椿竇十郎寄鯉魚與萬大年江楓搖落江梅破江上詩人有佳句欲於龍穴覔明珠試遣鯉魚傳尺素梁府君挽詩麗水人子安世登科兩郡三鄉賴保全乃翁劍學不虛傳黃巢詎敢臣周朴趙勝那能爵魯連仁里化成儒氣象心田種得佛因緣竒兒自是青雲士行見榮光燭九泉永嘉盧仲修永年袖文見訪酬以短句地僻原名左天寒歲欲徂遙遙屈佳客得得訪潛夫一第且慁子八篇真起豫有論八篇蜚聲參四傑誰復敢前盧林明仲和詩復用前韻婁戰夷吾卒霸齊棘棲鵉凰暫沉迷探春想見登梅嶼乘興何訪泛雪溪樓上清歡庾公興橋間壯志馬卿題四埸筆力媒身䇿平步青雲豈待携張器先和詩復用前韻心欲齊賢愧未齊逺蒙佳句警昏迷音如鼓瑟鏗清廟味似煎茶鬪建溪憂國非同長卿病感時端類少陵題二松豈是淹賢地鳬鶩文書謾抱携寄蒲墨與明仲四友共文房蒲君最異常研磨發文采好去奉仇香寄沈敦謨名希臯瑞安人二十年前舊友生緘封逺寄見交情舊遊回首多零落大器如君合晚成送謝任之七歲吾從乃祖遊童蒙深愧未能求堪嗟四十五年事昔未褁頭今白頭梅溪闢館子來遊回首如今二十秋端似韓張互傳授要令編剗紹箕裘去年還家巳半年盍簮尊酒𢾗留連嵗窮送别溪頭路手把梅花思黯然題雙瀑女媧石爛幾經修天漏猶餘兩派流離合無心元不爭朝宗得路却相投干雲寶劒真同氣出蕩神龍不異湫雁蕩有大小二龍湫何用築門防俗駕林泉自是少人遊雙瀑亭壞久矣洪丞命工起廢氣象一新且欲築門以防俗駕故及之癸未守歲嵗冝鄉里守杯共弟兄銜明日人相問行年五十三張器先復和詩作五言以寄短棹别孤嶼故山歸左原遙煩雁足字重到雀羅門歲月添新老文章憶舊論見詩如見靣氣象有餘溫萬孝全贈金華洞石名雪灑遙峯作進退詩次韻天闢金華一洞竒洞中石是化羊遺渾疑雪向閩山落更訝峯從天竺飛溪上又添乘棹興案頭如照讀書時故人重我膏盲疾田不荒蕪應亦歸元宵鄰里携具就弊廬張燈辭之不獲因成一絶凶年猶幸在家鄉鄰里相過具豆觴我輩忍將燈照眼遊人多是火燒腸祈雨不應歉歲還鄉益困窮瓶無儲粟酒尊空醉經且學文中子閔雨難祈應上公自秋七月不雨至于春二月十九日僅得雨昌齡作賀詩豫未及和而雨止矣遂次韻以閔之水旱年年費請求仰勤湯禱與堯疇何時三十六雨足當寧免懷雲漢憂一杯未吸甕頭春初欲率飲賀雨以晴遂止三疊聊歌雨裛塵不用遽興風伯訟洪羊真是可烹社日喜雨復用前韻社日􅉉間不斷流淵明欣𣣔事西疇碩言一飽均黎庶瓶粟無儲不用憂欲放乾坤萬里春要須先洗庾公塵朝紳賀雨詩多少誰是詩中諷諌人家食遇歉有飯不足之憂妻拏相勉以固窮因録其語淵明事高尚瓶中缺儲粟魯公凛名節乞米給饘粥廣文富才名官冷飯不足少陵老風騷橡栗拾山谷嗟豫何為者處世真碌碌謀生一何拙甔石無儲蓄三年兩去國囊槖罄水陸還家索租苗不了臘與伏前秋遭颶風摧折數間屋今年丁大侵破甑塵可掬絶糧瘦百指告糴走群僕鄉鄰苟不救定恐填溝瀆家藏千卷書父子忍飢讀一字不堪煮何以充我腹細君笑謂我子命難食肉去歲官臺省僥幸食君祿有口不三緘月奏知幾牘聖主倘不容寧免逺竄逐歸來固已幸冨貴非爾福東皋二頃田得雨尚可榖子耕我當耘固窮待秋熟聞小使胡昉抗虜不屈上甚嘉之有旨命右揆撫師仍有和不可成之語皆出睿斷宗社之福也昌齡有詩次韻用儒端可復侵疆活國何勞別取方文帝要須親御馬子卿寧患逺看羊撫師暫屈黃扉老論將寧咨白首郎行見車書混天下豈容南北分三光昌齡四月十九日得男請名於豫命之曰遲端似中山夢得詩海中仙果子生遲况當首夏清和後更遇千秋啓建時是日啓建天中莭祝爾願同彭祖夀命名聊效小蘇兒蘇黃門子由子名曰遲其後最盛吾家種德已數世庭户合生蘭與芝山丹花四月相將莫山丹開始都真心本來赤正色自然朱百合晚仍俗石榴繁更粗誰將仙竈藥花裏著工夫梅溪先生後集卷第七梅溪先生文集卷第七詩林下十二子詩并序梅溪野人既見黜于春官齒髮老矣悟虛名之可厭知林泉之足樂也家之東南隅有井焉泉清而味甘井畔有修竹數百挺闢小徑以通幽有梅數根欹卧乎竹間兩桂蒼然夾井而植因蒔蘭于竹林之下植昌陽于井旁以增野趣豫與賔友杖屨徜徉賦詩飲酒奕碁于其間頗足自適遂命曰林下七子且字竹曰子修井曰子深梅曰子先桂曰子蒼蘭曰子芳昌陽曰子仙梅溪野人為之主故自字曰子野仍賦七詩以寓意牡丹芍藥花中之冨貴者桃李艷而繁凡紅艷之屬俱非林下客也皆不取豫既醉而卧夢有五人來謁自稱黃公丁公栁先生三徑居士三槐公子豫延之坐黃公乃前曰聞主人有林下之遊與六子為友褒之以名字寵之以詩章亦一時之雅致也某雖不才然封植于君家久矣獨不與兹選何耶豫曰豫非敢忘公也然所取者皆井竹間諸友公所居差逺豫與客遊林下而公不在眼故不與焉爾黃公艴然曰主人欲隔籬墻分爾汝耶豫愧其言許以嘉客處之丁公踵進曰主人昔有幽居三詠某與黃公竹生與焉今竹生首與林下選黃公亦辱千金之諾矣主人苟未忘壁上語願以某處坐客之末可乎言未畢栁先生三人俱進皆有請焉豫悉頷之既覺而思此必吾家黃楊丁香槐栁菊也豫不可食夢中言遂字黃楊曰子嘉丁香曰子素栁曰子春槐曰子夏菊曰子秀復賦五詩以贈之通前凡十二子焉時甲戌孟夏也竹子修萬木蕭踈怯歲寒子修相見喜平安世間寧有揚州鶴休訝平生肉食難井子深度量泓泓井子深客來車轄總能沉定須再築新亭覆不負先君好事心先人昔嘗以亭覆井日曰投轄梅子先竹外溪頭手自栽群芳推讓子先開好將正味調金鼎莫似櫻桃太不才桂子蒼學仙深愧似吳郎賴有吾廬兩子蒼疑是廣寒宫裡種一秋三度送天香蘭子芳國香入鼻忽揚揚知是光風泛子芳林下自全幽靜操縱無人採亦何傷昌陽子仙天上星郎字子仙結根拳石傍清泉豨苓方入醫師手誰識仙姿解引年黃子嘉保緑軒前黃子嘉非松非柏亦非花故應喚作思人樹數十年前閲我家丁子素雨底含愁雪裏芳琉璃葉映小何郎世人競重熏籠錦子素何曽怯瑞香栁子春夾道青青栁子春自從栽植幾畨新如今巳作參天樹應笑衰遲老主人槐子夏方苦炎炎畏日長欣蒙子夏惠清涼三槐雅是王家物為榜新亭擬舊堂菊子秀子秀霜中色更嘉金錢粲粲滿庭階淵明異日開三徑端仗兹花尉老懷王子野埸屋虛名且罷休歸來聊效晉人遊林間諸子總非俗肯與野人為友不昌齡闢團植花索詩于老者戲作數語兼簡夢齡東園小小花木稀西園廓廓規模竒西園主人但置酒東園老人甘賦詩朝遊西園飲千斛莫向東園吟百幅更約南園好事人酒盞詩篇日相續西園新闢昌齡索詩豫以其未開尊也戲作數語既飲復用前韻阿連好事由來稀開軒闢圃幽更竒峯巒羅列冨遐覽氣象收拾歸新詩百挺琅玕花數斛宛似輞川圖一幅朝莫過從有弟兄長碩歌聲無斷續豫與二弟連日賦詩飲酒詩成命二子書之亦居家之一樂也復用前韻不愁地闢車馬稀自喜兄弟俱好竒阿連舉觴勸我酒阿買研墨書翁詩長泛鄭生船百斛日賦鄴侯三四幅何用身封萬户侯但碩青箱有人續昌齡和詩以不得志于賢關有欲退隱之語復用前韻勉其涵養俟時未可真作休休計也出門休艱知巳稀開卷攬取前人竒西園松菊聊笑傲未可遽賦休休詩涵養胸襟容萬斛仰視青天𥿄盈幅行看冨貴來逼人江左家聲子當續昌齡頻開尊再用前韻人生常患如意稀利名擾擾何足竒誰能如我惠連弟有園有酒兼能詩種秫西疇都幾斛時見小童馳片幅風軒灑掃又相呼適有嘉魚饋羊續用前韻題東園吾園小小逰人稀吾腹便便空自竒徑草青青可煎飲雨竹涓涓堪賦詩鮮鮮菊滿東籬斛掦揚蘭入騷人幅牡丹芍藥紫薇梅四時花卉開相續賈元識和詩酬以前韻河東丈人年及稀精神矍鑠心瑰竒新來移居向山谷一尊時得同論詩酒量汪汪可勝斛醉後揮毫動盈幅新詩疏越似朱弦不才何用煎膠續次韻昌齡西園即事世態蠅營巳厭驅小園𥘉闢稱幽居杯深轉覺利名薄心靜更冝花木踈窗几吟餘山色好軒齋夢覺日華舒尤憐不棄東園老時復相從辨魯魚東園小閣丹粉一新昌齡有詩次韻小園小閣無竒新但喜有酒堪娛賔西疇種秫可自釀不用勤買拋青春月明星稀烏擇木吾愛吾廬堪寓目須知主父五鼎珍不似王猷數竿竹丈夫未遇當安貧帶經且作鋤園人詩酒過從老兄弟一笑可破雙眉顰見説西園相繼闢好將因果同栽植子孫清白世相傳莫同阮氏分南北夢齡得男老者喜甚湯餅會中出詩以賀梅溪佳氣夜蔥蔥果得竒兒應夢熊湯餅笑歡良不淺桑弧時節稍相同豫以十月二十八日生猶子以二十九日生喜將老眼看猶子首出新詩賀乃翁從此吾門如謝傳芝蘭玉樹滿庭中豫有書閣僅容膝東有隙地𥘉甚荒蕪偶于暇日理成小園徑以通之杖藜日涉于其間幾欲成趣然花木蕭踈不足播之吟詠謾賦十一小詩以記園中之僅有者時甲戌仲冬也小小園預作休休計先開小小園杖藜成日涉得趣與心論便便閣一閣僅容膝閉門塵慮捐讀書心巳懶髙卧腹便便青青徑小徑循園闢青青草色都主人猶未仕時得理荒蕪娟娟林繞舍種修竹清風長滿筵天姿本來淨不雨亦姢姢揚揚畹九畹何人種光風泛國香林間今幾許鼻觀日揚揚鮮鮮砌吾圃豈不冨黃金無數錢誰云何用好霜裏白鮮鮮牡丹人道此花貴豈冝顔巷栽春風情不世紅𬗋一般開芍藥十花稱近客千葉重維揚世上無姚魏還他霸衆芳早梅北陸寒未半南枝春巳回方于雪中種便向雪中開雙竹本是一根出相期同化龍慎毋輕剪伐雲路定相從紫微花俗名滿堂紅盛夏緑遮眼兹花紅滿堂自慚終日對豈是紫微郎梅花次賈元識韻南枝昨夜暖先回壓盡群芳獨自開仙客風中飄素袂玉妃月下試新裁未憑驛使殷勤寄首辱新詩特地來明日雪晴須共賞為花拚却飲千杯歲暮雨雪連作稍阻會集賈元識有詩次韻自從春色上孤根淫雨經時步不前愛日未能供宿潤愁雲依舊蔽青天溪山咫尺成千里棋酒因循又一年今夕藍輿定相過尊前行樂興無邉萬府君挽詞字德昭豫從舅也東平隱君子當以古人看孝却豺群易恩全雁序難人如心畫正度勝酒腸寬粲粲三株樹門闌已壯觀老成嗟不見里巷尚能談衣解因周急簮還務激貪蹶蹄心不愠折翼淚常含瞑目應無恨聲名與佛參吾母昔逃難携孥依舅船態多朝暮警恩獨始終全濫與髙門出尤蒙長者憐未能成宅相徒有淚如泉林府君挽詞我昔逰庠序寅緣識令孫雅知苗裔逺更喜典刑存俗子猶遷善偷兒最感恩佳城明日閉墮淚滿江村表兄璐挺二道以山茶一根見贈植于便便閣前每黑甜餘開窗寓目茗碗不捧精神自清因成小詩一枕春眠到日斜夢回喜對小山茶道人贈我歲寒種不是尋常兒女花又覔沒利花沒利名嘉花亦嘉逺從佛國到中華老來耻逐蠅頭利故向椫房覔此花二道人以抹利及東山蘭為贈再成一章西域名花最孤潔東山芳友更清幽逺煩文室維摩詰分韻小園王子猷入鼻頓除浮利盡同心端與國香侔從今日講通家好詩往花來卒未休林利見佛經名義木究或云沒者無也謂聞北花香者令人寬悟而好利之心沒故前作沒利此作抹利姑兩存之覔海棠夀昌文郁師植海棠二根于所居舫齋之旁子偶以社日訪之啜茶既罷開窗賞花時煙雨𥘉霽竒葩正芳嫣然在軒檻中殊有佳韻越五日作詩寄之且欲覔一根種于小園中朝夕觀賞庶無忘髙人雅致時紹興乙亥好事髙人重海棠兩株分植舫齋旁恰當燕子來時放更向禪房深處芳道眼想應憐不俗癡人何苦恨無香梅溪野叟曽經眼欲覔一根栽草堂郁師贈海棠酬以前韻珍重髙人贈海棠殷勤封植弊廬旁固冝花裏稱名友已向園中壓衆芳萬樹總含兒女態一根獨帶佛爐香杜陵應恨未曽識空向成都結草堂札上人許贈山丹花且云此花三月盡開俟蘂成移去至上巳日以詩索之人間花木眼曽經未識兹花狀與名丹却青山暮春色續他紅樹墮時英梅溪野老栽成癖蓮社髙人諾不輕小小園林緑將暗早移芳蘂看敷榮表弟津上人有瑞香抹利戲覔之瑞香早入江南夢抹利來從毗舍園久與道人同寂寞不如來薦孔融尊覔季仲權碧桃紅雨紛紛空自繁碧雲一朵勝桃源君家獨有神仙種分我閙花深處根覔季仲逹酴醿名園羽蓋謾童童不似青虬出甕中好事主人仍好施定移韻友乞小翁和寶印叔送春二絶潛澗園林幽更竒送春歸去有新詩風光流轉身長健又見明年花滿枝青春不覺去堂堂把酒誰分此日光偶讀髙人送春句味回齒頰有餘香族兄文通贈山茶野性無端喜種花吾兄得得贈山茶鶯聲老後移雖晚四月始栽鶴頂丹時看始嘉雨葉鱗鱗成小蓋春枝艷艷首群葩自慚欲報無瓊玖來往同看本一家兄弟鄰里日講率會因書一絶且戒其早納租稅也屏迹山林頗自安里閭率會有餘歡但須及早輸租稅不用低顔見長官萬府君挽詞字叔永庚子登科前革風流久之人尚典刑抱才雖汩沒種德自芬馨餋浩眠龍穴流光屬鯉庭鄉評燕竇所欠獨年齡太學稱多士竒兒占上遊賢書連得雋舍選復居優善教由孤突興家出萬修板與遊未遂風樹巳蕭颷屈指吾鄉黨如公今幾何門猶畢萬大男類陸終多壯志埋蒿里幽光發薤歌河梁嗟未就遺恨滿滄波張廷直挽詞意氣軒軒蓋一時牀頭周易造深幾芹芳泮水聲蜚早花滿河陽迹到稀方外客携因果去道旁人汲義泉歸栁川池館規模壯一夕花妖世巳非梅溪先生文集卷第七
