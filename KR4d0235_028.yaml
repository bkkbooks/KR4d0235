body:
  text: 祝文饒州謁顔范祠文二公名節百世所師俱臨是邦遺愛猶在死者可作非公孰㱕某濫竊郡符獲瞻祠像大山北斗心實慕之視事之初敢不躬告顔范新祠成奉安祝文番陽九賢咸有善政文忠之忠文正之正九賢之中扵斯為盛祠宇一新丹青輝映凛然如生尚餘剛劲以激忠義以警邪佞福我邦人不禱而應不水不旱無兵無病血食萬年孰敢不敬祀事之初神乎其聽䕫州謁文宣王廟文惟夫子之道一以貫亦奚間乎迩遐不陋九夷而𣣔居行乎蠻貃如一家今坤維文物之富人才之盛有洙泗風而無媿扵諸華苟非聖教之㫄逹豈一文翁䏻化之耶某一介書生蒙恩帥巴媿無果逹藝之才可以從政而亦粗知富庶教之何加若夫事賢友仁與學道而愛人也固不敢不勉所𣣔與諸生共勉者曰忠曰孝曰思無邪謁昭烈廟文嗚呼東都之季盗窺神器分鼎者三帝乃劉氏有髙皇度有光武氣有王佐臣無中原地以區區蜀抗大國二天厭漢徳壯圖弗遂功雖少貶四海㱕義永安故官遺迹可記君臣有廟英雄堕淚歲月浸逺棟宇莫治某来守是邦過而興喟一新廟貌薄薦殽胾㫄觀八陣細讀三志我雖有酒不祀曺魏謁武侯廟文丞相忠武蜀之伊吕髙卧南陽悲吟梁甫草廬之中三顧先主将漢是興非劉曷與君臣魚水蛟龍雲雨才十曹丕志小寰宇假令無死師一再舉呉魏可吞禮樂可許寧使英雄墮淚今古将畧非長庸史之語某受命天子来帥兹土夢觀八陣果至䕫府廟貌僅存風流可覩㫄有関張一龍二虎安得斯人以消外侮謁杜工部祠文風雅頌息嗣之者誰後代風騷先生主之讀書萬卷盖欲有為明光三賦烜赫一時致君堯舜卒不克施此志蕭條乃昌其詩天𣣔其鳴窮之使悲復生太白如塤應箎流落劒南􅍏聲益馳莫年製作莫多如䕫詩史有堂遺像有祠光豔照人膏馥滿碑歌蜀道難誦杜䳌詞忠不忘君先生是思修武侯廟奉安祝文八陣圖之北永安宫之南侯有祠焉盖昔與先主控扼呉魏經營中原之地死而廟食宜矣然面貌不稱非所以崇明祀也某至官之初首謁祠下命工葺之㮄其坊曰卧龍擇日之吉帥同僚祀之不敢不告諸廟祈雨文兹者七月不雨禱祈未應神廟食于此其可坐視而不救乎油然雲沛然雨在神呼吸問也宜速効職母作神羞諸廟謝雨文兹因不雨是用禱于神祇且責其坐視不救而戒其速宜効職果不踰時沛然下雨神亦可謂靈矣有徳必報其何敢忘湖州謁文宣廟文夫子之道至大而神顔猶苦之犇軼絶塵設教以中善誘循循化被萬世遐邇惟均湖學之盛東南鮮倫風似鄒魯民同蜀閩某受命天子来為守臣方以政學焉䏻牧民聞諸夫子學道愛人益以無倦敢不諄諄若夫惟孝為政勿欺事君願與諸生同書諸紳謁顔魯公祠文嗚呼百世魯公嚴霜烈日彼何人斯鬼面藍色公之所至人懐其徳清風凛然尚餘銕畫某昔守番昜今来霅川皆公舊治有象貌存視事之初敢不躬謁豈無他祠敬慕名節祭安定先生文慶曆皇祐有三巨儒太山徂徕盛不及湖眷言此邦如泗與洙弟子詵詵三千之徒中庸有傳皇極以敷法行太學化廣寰區諸老先生萬事問胡富矣道徳賢㢤範模國朝之治効在詩書先生之功不在都俞祠宇于泮松楸在吴歲時上冡冠帯必趨某受命天子来分郡符官既有守恨莫䏻俱恭命同僚往奠一壼嗟嗟先生今也則亡泉州謁文宣王廟文某以諸生入仕學實未優逹不如賜藝不如求可使治賦又不如由屢綰郡章了無一善泉南鉅藩誤膺帝選學道愛人願如言偃益以無倦不敢不勉若夫美化易俗則在泮宫言采芹藻竊效僖公願與諸生名教是崇庶使無訟有君子風韓魏公祠奉安祝文嗚呼岳瀆之竒實生聖賢崧髙甫申尼丘文宣或生他邦必嘉山川李居江東蜀生謫仙我宋名世之士三而皆生于異郡焉温公家陜右而生于光文忠家江西而生于緜人知忠獻公之為相人也而不知其乃生于泉蜿蟺朋山奫淪清源氣如洛陽公得其全有異人兮知其祥有吉夢兮開其先香名一呼瑞日在天勛業三朝髙視無前社稷之臣無以加伊周之美㒺敢專然公所至之邦皆有祠異獨始生之地而闕然景徳逮今百五十年泉人思公亦非不䖍采其謚以名堂慕其風而𣣔傳飲清泉兮有懐薦一掬兮無緣州宅之東雲榭之邊喬木一林古屋数椽即焉以祠繚之以垣龍章鳯姿彌貂戴蟬人皆曰我魏公也莫不喜歎而駢肩然公勛勒鼎彛名光簡編食配清朝貌法凌煙亦奚用乎州郡之祀盖聊以慰邦人之惓惓諸廟祈雨文前日不雨有請于神三日而應繄神之仁今又不雨其誰之咎灾不自作罪在郡守守固有罪斯民何辜曰雨而雨在神吸呼山川出雲沛為膏澤不作神羞吏亦逃責韓魏公祠祈雨文惟公生為我宋之元勛死為𬗋府之真人育于泉南必念斯民泉人愛公祠象一新願以嘉祐治平之霖雨沛然一洗千里旱暵之塵韓魏公祠謝雨文連月不雨靡神不宗禱而不應有請于公不数日間膏澤遂通龍神社鬼孰敢争功願終其恵時和歲豊永俾邦人廟貌是崇諸廟謝雨文旱魃為虐且誰之尤守臣失職惟神是求乆而莫應牟麥不收得之桑榆有事西疇播厥百穀庶㡬有秋繄神之徳何敢不酬雨尚未足民猶有憂願終其恵母作神羞諸寺謝雨文佛有因而佛有緣非誠莫之感動星好風而星好雨當春乃䏻發生守臣􅣟凉薄而致灾大覺以慈悲而垂憫俯徇群情之禱沛為千里之霖小麥青而大麥黄雖云不救低田流而髙田水其必有秋巳大慰雲霓之心何敢忘香火之報謝蔡真人文師帥非賢㡬三時而不雨真仙是禱亘千里以為霖勞法駕之久臨慰群情之䖍禱無徳不報孰云香火之無功式遄其㱕益覺煙霞之有耀辭文宣王廟文某以天子命来守是邦維朔暨望敬瞻睿容考将再書治無可紀有負吾君亦負夫子兹又承命易郡丹丘道無南北何莫不由居敬之簡學道之愛雖曰不敏其何敢怠代者将至行矣有期靡神不吿况我聖師耽耽儒宫濟濟冠屨采藻而㳺酌泉而去辭韓魏公祠文某来守是邦㡬二年矣而畧無治効惟復公之堂立公之祠庶㡬小補扵風教兹者易郡丹丘祠有日矣敢不請違于像貌願以公之事君公之治民者是則是效且使泉人登其堂拜其像莫不起忠起孝辭諸廟文某来守是邦㡬二年矣而治無述焉宜神之所不福也然千里之内無盗賊干戈疾疫之菑者豈非神之賜耶今易命丹丘行有日矣不敢告祈雨疏旱不自作端繇郡政之荒民亦何辜仰兾天心之閔月属流火時逢亢陽百穀不得其生群黎無以為命咸切望霓之志輙殫請禱之誠閉諸陽而縦諸隂媿乏董生之術油然雲而沛然雨願興宋國之苗謝雨疏旱魃為虐千里起望霓之心精誠所加匹夫有動天之道兹因七月之不雨仰祈三日之為霖遂扵俄尔之間忽下沛然之澤一洗煩暑勃興槁苗天自天而人自人理若難感暘曰暘而雨曰雨恩何可忘祭文祭六姑文嗟我先子同氣六人殘月孤星僅存者三白髮蒼顔姑為㝡尊不見祖考典刑常存念姑平生無憾可言為婦而順為母而仁享年而徳享富而安㛰姻早畢男女具全夀㡬八齡目見重孫姑扵五福亦庶㡬焉某䓁闔門百指辱姑厚恩既䘮怙恃惟姑是親疇昔登堂歡笑滿顔撫我䘏我如父母存姑今云亡我将疇依惟姑是思亦父母是思嗚呼哀㢤祭八姊文哀哀父母有子六人姊㝡居長孝愛慈仁鞠育同氣甘旨䨥親以奉窀穸以畢㛰姻姊力為多曷報恩勤嗚呼哀㢤于㱕慶門奉姑與姒宜其室家亦既有子男遽早世女継而死淚落巳盡哭猶未止病在膏肓竟成不起嗚呼哀㢤某䓁早䘮怙恃惟姊是依姊今云亡曷勝其悲姊有良人後事可属二女有㱕半子可托鍾愛㓜児如出其腹儻免水火祭祀有續地下從姑姊宜瞑目惟我同胞恩深義篤一觴奠訣血淚同沃又代聞詩聞詩天属爲姪門䦨爲壻蒙恩最深再以女妻登門之始夫人在疚藥物獲嘗顔色婁候尚期痊復歲月承顔云胡不幸緣淺福慳百日之間来往數四遽驚疾革倉遑来視口不䏻語手猶撫摩遺言不聞衘恨實多夫人扵女最所鍾愛善視以報斯言不昧祭張魏公文惟公學造誠明才全文武忠孝根扵天性節操貫乎歲寒社稷之功最髙親曽取日君父之讐未復誓不共天二十年見斥權臣五百歲重逢聖主夷狄服汾陽威徳児童知司馬姓名意者天必相之嗟乎命何止此方渡江而撃楫遽樂聖以衘杯宣室興思蒼生望起雖曰閉門絶粒不忘憂國愛君中山功未及成䜛謗之書盈篋武侯死有遺恨英雄之淚滿襟一老不遺百身莫贖某濫比假守驚聞訃音忍觀絶筆之銘媿阻臨棺之奠嗟吾道之窮已甚非斯人之慟而誰重祭張魏公文嗚呼蠻夷猾夏以和得志食肉者鄙力主和議萬口和附争言五利曰國之福何惜土地甘心事讐不恥稱謂附和者用沮和者棄和猶未成邊巳撤備既棄唐鄧又棄海泗淮北生靈㡬無噍類國既日蹙兵亦尋至公之勛徳公之忠義公之人望群嘲聚詈公欲恢復指為生事公𣣔禦戎靳為児戯公𣣔養兵詆為妄費公𣣔進賢目為朋比公得人心公有異意巧言如簧吁其可畏天眷雖隆不容在位汾陽兵柄奪于䜛惎度無顯公豈獨前智怒疽范増間赱樂毅公存虜惧公死虜肆虜方陸梁國若斿贅上心焦勞當食而喟彼蒼者天胡不愸遺九原不作蒼生曷慰遥望衡山滂然墮淚祭魯公文士之䖏世患不逢時及其進用得君者誰逢時得君可究設施堂堂魯公國之元龜民之父母世之宗師㦄事四朝始終無虧光相二帝盡忠不欺休休有容涯涘莫窺盛徳大節人皆仰之胡馬飲江聞者四馳公獨屹然䖏以靜謐以身許國奚顧家室一鏃不施邊烽自息宗社以寧繄誰之力堯舜授受乾旋坤闢同列異議公獨忠赤功成而退㒺有徳色赤松與逰脫遺覊􅎗疆事未寜羽書方急上心焦勞起公于疾人望翕然如用君實折衝千里再安王室公𣣔有為百未一遂彼蒼者天胡不愸遺變生俄頃仆于奏事震驚中外邦國殄瘁嗚呼哀㢤某晚進不才誤辱公知官守有拘莫覩靈輀致奠遣僚寫心以詞為天下慟豈曰其私祭何提刑文惟公學継横渠心傳無盡詞有根柢行有畦畛蜀道卿雲関中曽閔文章滿家卷軸連軫四朝耆舊多士標凖不染腥羶寧避鷹隼流落九疑從蝦蛭螾太上攬權材收𣏌􅙪公起自南玉岀于韞使節屢馳大藩頻尹所臨有聲未究所藴元老登朝首加薦引對揚宣王上嘉忠藎誰乎沮之不班玉筍祥刑江左庶玉惟允我濫把麾情親迹近愛君憂國語必同憤擬學史魚諫諍而殞詩壇獲陪雕琢肝腎公将風騷我嚴韅靷波瀾何濶声律殊謹筆陣縦横詞鋒捷敏鉅鐘微撞邊幅慚窘韓拜孟郊龐怯孫臏有瑕必指忠吿無隠鋟板以傳託公不泯軺車行部䟽獄發囷王命有嚴何敢不黽送以短篇勸以良醖詩簡往来如白與稹脩途倦逰㱕約尤緊忽断書問風傳疾疢訃音遽至道路驚愍聚散如夢榮枯同菌失此老成痛何䏻忍奠不撫棺有涕徒隕祭戴履道文嗚呼繄我與君生于温江同郡異邑邂逅無從我守番陽君丞外邑聮事朞年莫克㑹集君之文行著在鄊評及其居官益有美聲鄊人仕饒不過三四不見君子心焉孔瘁惟是面目見于尺書亦有詩篇不鄙寄予四月之暮聞君在疚倉皇遣醫竟莫之救人孰無死君尤可悲九十之親誰侍以㱕松楸故鄊道路悠逺㱕君之䘮何敢不勉我有官守往弔莫遑遣奠一觴潸然涕滂祭賈府君文嗚呼吾鄊之賈實為慶門玉樹芝蘭多賢弟昆鄊校賢關藹然有聞曉月晨星于今㡬存公之為人重厚寡言有長者風薄俗可敦天􅌋其報富夀两全亦既有子亦既抱孫㛰嫁巳畢放懷丘園胡不百年遽㱕九原某爰自㓜學荷公􅌋恩公色素嚴爲我而温妻以兄子遂成世㛰逺宦䕫門聞訃莫奔馳萬里書奠以一樽祭馮少卿文嗟嗟貟仲何至扵斯天乎命乎尚忍言之抱濟世之才而以才見忌懷許國之忠而以忠見疑誠足以泣三軍之衆而不弭浮言之謗節不變扵臨天難之際而不免扵鬼物之欺初爲賈生之逐卒抱屈原之悲嗟嗟貟仲何至扵斯天乎命乎尚忍言之庚辰道山才盛一時我我㳺其間辱君厚知義均弟兄間言莫移憂時論事肝膽同披聖徳有容雷霆霽威奏藁具存驗若蓍亀我既去國君車亦馳三年之間暫合復離君佐戎幕身㦄艱危我官柏㙜自劾而㱕聞君之罷有識嗟咨䜛鋒方熾公論誰持我赴番昜君書逺貽手墨未乾人事遽非驚聞訃音哭之以詩君䘮還普我来守䕫官守有拘往弔無期遣問窀穸寫心以詞西首一慟非君而誰祭周運使文惟公而蜀之英秀發自㓜擢桂禮闈蜚聲文囿學有根蔕行無瑕㻈施了有政名實相副製錦分符覇遂恭茂帝念巴蜀民貧俗陋命公持節往安而富暨尔同僚講明利疚歲丁飢饉廪發粮糗羡餘不獻偃折是究民逋十萬悉蠲其舊預備凶荒廣糴以救舟車日通商賈咸湊錢雖不流徳亦云􅌋馬運病民協力敷奏撫事興歎憂國成痩亦有知巳行将結綬亦既踐揚宜在左右天胡不仁遽奪其壽嗚呼哀㢤某遥自東南一麾来守非仁是依曷免罪咎日陪談笑屢飲醇酎有唱斯和無疑不叩蓮方共賞菊約同嗅公忽微恙我頻来候藥物甚良變故何驟堂登繡衣溘焉在柩死生常理如夜與晝公心了然寕校先後惟賢可惜𣣔見難又奠以一觴老淚盈袖嗚呼哀㢤祭杜殿院文光堯神聖髙邁千古任賢納諌同符神祖紹興辛已親擢得杜曰卿忠直不畏強禦朕擇御史賢莫如汝往肅官邪以消外侮公如麟鳳莫類是與公如獬廌邪佞是去如唐子方孤忠自許如趙銕面風髙憲府孰将而貪掊尅軍旅孰戚而横攘敓編戸孰醫而幸官髙貲鉅孰託宫市敢通北賈孰爲樞臣将命是拒孰爲民賊孰爲社䑕皆罪之尤擢髮莫數汙我白簡宜即刀斧言無不行中外鼓舞曰真御史曰堯舜主言責既塞力求外補五馬来㱕壯㢤出䖏恵歛一州治㝡西土至今邦人咸曰杜母某往逰道山辱聮歩武友得直諒誨聞規矩公遷柏㙜我返衡宇尺書千里屢寄鱗羽如覿面目遥馳肺腑不見君子五隔寒暑甌蜀相望㑹合無所國亡直臣山失猛虎豈惟吾徒天下悽楚我来守䕫棺未遑拊諸孤赱書大事将舉佳城匪遥執紼伊祖遣莫一觴老淚如雨祭令人文嗚呼子㱕我家今三十年逮事舅姑既孝且賢我有弟妹未畢姻㜕子䏻慨然奩具悉捐我事筆硯半生迍邅晚粗有成子之助焉婦人妬忌往往皆然子䏻有容尤人所難婦人扵財見則垂涎子獨不貪槖無金鈿為姒育女喜兒讓官㛰嫁粗畢不以財論每言仕宦清白為先俸祿之外勿取一錢身為命婦績絍是專勤儉之風鄊閭所傳我仕于朝頻年外迁同渉險難萬里言旋方還故鄊忽又得泉到官月餘老病相纏深為尔憂廢食與眠孰謂一朝舍我而先變生倉卒哀㢤上天死生常理我固曉然痛不䏻忘子實可憐長子愛女不在眼前去無一語抱恨銜冤我今抗章乞骸㱕田以尔䘮還祔姑之阡子可無憾瞑目九原祭張器先文秀自妙發徳由少成唾手鄊薦蜚英月評蕭洒宗之風流長卿壯遊上庠益馳令名選壓萬中賦髙二京覃思稽古下帷授經史學最長詩律尤精暮景侵㝷一苐始登宜在館閣盍揚王庭天乎命乎卒于一丞嗚呼哀㢤我守泉南君官福清恵然肎来不寒前􅉀賔主俱病相視而驚醫藥是急酒杯莫傾猶有笑談以話交情别未踰月两蒙寄聲報牘方遣訃音忽聆嗚呼哀㢤四海之内孰非弟兄君有同僚後事是營暑雖孔熾䘮不可停我有官守往弔莫䏻赱􅉠遣奠声吞涕零祭萬先之文嗟嗟先之􅌋徳美才命止扵斯天乎痛㢤必大之門詵詵蘭玉子方妙齡巳見頭角声蜚槐市蔚為上㳺韲䀋十年一第始收逺官清湘師儒是職南方多士惟子是式紛紛軰行彈冠帝鄊子獨恬然不干廟堂得掾南昌需次家食胡為一疾遂至扵革上相知已諸公薦賢命在匪伊胡不少延慈親在堂壯婦在室兒女滿前百事未畢子可無憾有鴒在原後事可託如身之存散落人間光豔遺跡集而傳之敢任其責故鄊語别曽未踰年子死我病两俱可憐凶訃南来孰不歎惜遣奠一觴老淚遥滴祭王尚書文惟公天賦􅌋徳時稱吉人學為君子之儒性得仁者之靜藴婺溪之秀氣蚤折桂枝大京兆之家声榮持荷槖以詞臣而為岳牧嘗聽履而上星辰身居八座而徳愈謙光治著六州而人懐恵愛奉真祠之香火養暮景之年齡民所具瞻行起三朝之舊天下愸遺遽驚一老之亡某昔以鯫生叨依蓮幕雖蔑賛黄堂之畫然最蒙青眼之知假道東㱕方飲楚元之醴酒分符南牧忽聞杜尹之訃音邦家興殄瘁之憂主上失注想之待赱書千里致奠一觴難忘在耳之言徒隕衘恩之涕祭潮州王尚書文惟公性禀南方君子之强簸弄明月于潮之陽妙齡射策遇太上皇擢為亞魁名震四方權臣用事明哲自将潜心稽古得聖行蔵扵易春秋尤其所長帝初攬權思用忠良貳我成均儒林有光說書崇政屢上封章帝嘉其直人指曰狂出守東嘉奉祠故鄊主上龍飛召自南荒以長諌垣以肅周行正色立朝諤諤以昌筆端凛然不赦豺狼言如蓍亀去有芬香公雖在外上念不忘入司喉舌行登廟堂彼何人斯敢為臧倉如毀日月扵明曷傷身雖可屈腸不减剛㱕老于家天相夀康名徳益尊如曲江張如余襄公如日南姜盍㱕乎来弼諧賛襄天不愸遺哀㢤遽亡某以諸生受知上庠竊苐来㱕禮遇異常公居誎省我濫㙜綱人呼二龜亦曰两王䑕豈虎偶葭依玉㫄把麾泉南稍近門墻敬雖獲修見則靡遑忽聞訃音痛摧肺腸譬彼大厦壊其棟梁如體無骨四支曷疆為國惜賢潸然涕滂祭曹夢良文嗚呼我與夢良三紀論交義則弟兄堅如漆膠君方妙齡卓然自立才雋氣豪人莫䏻及書生事業有短有長君如巧匠䏻圎䏻方李詩謝賦賈論眺䇿声蜚廣場筆掃勍敵少從明師學有淵源推以教人典刑具存散爲篇章戯成駢儷一言之出髙睨前軰隷業太學君居我先同登科名若相待然作掾嚴陵赫然有譽需次閩泮行将美赴我嘗以君名聞廟朝拭目以觀聳壑昻霄胡爲一疾遽然不起命壓人頭乃止扵此嗚呼前年之冬我赴泉南以書見招至于再三訪君許峯禮盛觴豆送我坡南珠玉滿䄂滿擬㱕来重登慶門孰知訃音中途遽聞孺人孀居㛰嫁未畢族大義髙必䏻周䘏状君文行撫君孤遺我或未死其何敢辭追念交㳺零落可痛我老君死云胡不慟梅溪先生後集卷苐二十八
