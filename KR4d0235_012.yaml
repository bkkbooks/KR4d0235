  text: 梅溪先生後集卷第十二
  hash: sha256:fbc512a7cb7dc578d25f95e40106c6d20fe5cc97233a00b3acc47254aa920326
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_012-1a}
body:
  text: 詩𥘉到夔州某甲申七月至饒州以表謝上云雖才非太公不能五月報政然忠猶杜甫未嘗一飯忘君既而與諸公唱和有夔字韻詩果有易夔之命人以為讖方力丐祠蘿觀八陳啚乙酉十一月朔至夔水落沙露宛然在目所歷山川皆少陵詩中景物也因成一絶用楚東韻分甘易守不勞麾夢巳先豫到古夔讖語端符楚東韻忠懷雅合杜陵詩查漕元章生日十一月望日氣壓群隂首占陽生賢時莭自非常十分天上月輪滿一線人間日影長攬轡威名崖雪凛和羹消息嶺梅香要知三峽無窮水便是詞源與夀觴周漕行可和詩復用前韻并簡元章重聞鳴鳯瑞岐陽不比清齋老太常帝里别離頭併白夔門邂逅日𥘉長詩篇照眼騰光艷蘭友傾心藹國香天遣西來端有意要令我輩共壷觴又用行可韻二公海內姓名聞我亦追隨到蜀門龍卧廬中嘆諸葛蛙居坎底陋公孫雨聽巫峽蘿時滴花看杜鵑啼處痕酬唱又成夔府集論文欣對少陵尊行可再和用其韻以酬孤陋書生寬見聞西來端𣣔掃儒門懷人久作周公蘿訪道欣聞孔子孫周首篇語及中庸書為愛民成再奏傳臺再奏馬綱事淚因憂國有雙痕休論身丗無窮事但碩常陪北海尊又酬元章叱馭西來愧子陽舊交重見白眉常傷心鬼録人何短懷馮貟仲回首蓬山話更長夔府並遊容倚玉計臺高選輟含香我非逸少君如謝聊繼蘭亭曲水觴行可元章再賦二詩依韻以酬前篇寓二後篇寓三不學金仙李伯陽來從雄愈論天常亳鋒落紙一臺妙詩艷驚人万丈長會見鵾鵬俱變化稔聞蘭菊各芬香盍簮聮席論文酒却笑囦明獨引觴朋淂西南直諒聞同行冝入仲尼門交成一體慕龍友政在諸家嗤魯孫雪唱紛紜臘天瑞詞源洶涌峽江痕二公如月如太白我亦影隨同一尊元章贈餘甘子用前韻草稟南方地近陽不隨凡果當家常端因坡句聲名重正類梅詩氣韻長東坡橄欖詩云待得餘甘回齒頰已輸崖蜜十分甜歐公讀梅聖俞詩云譬如食橄欖真味久愈在回頰已輸崖蜜味返魂終共雪芽香與茶最相宜故人知我詩腸苦更贈蒲萄為薦觴行可骨肉自西州來用門字韻贊喜連夕西臺笑語聞綵衣人戲繡衣門定知情話同元亮不用詩篇寄抱孫果見燈花將喜事寧愁江竹染啼痕世傳婦人詩云君看江上千竿竹不是男兒淚染班登堂濫作韓公客白首相逢十載尊吳參議和詩用前韻以酬名景偲巴陵人万傾波瀾瑩嶽陽氣鍾人物亦非常為郎堪嘆馮唐老治郡未施黃霸長吳吏事右髙比攝万州有聲詩吐錦腸多麗髙蓮幕有清香穆生醴酒周璆榻不是區區為聞馬綱復行舊路聖主之恩諸公奏也元章用前韻喜而和之此三篇原缺無考利博仁言亟奏聞恩光万里燭夔門綱船巳免人鮓甕棧道不應愁鶻孫鶻孫愁村落煙餘煙火息斧斤䀶坐看巴蜀回生意放我歡呼到酒尊州縣有戒石飭官吏某至夔之𥘉詩以自警云爾俸爾祿民膏脂下民易虐天難欺聖訓昭昭日月垂刻石于庭勵官師臣庭堅字尤瓌竒光堯宸翰增光輝坤維門戶州名夔庭前戒石筆畫微茫觀者疑太歲在酉嘉平時吉日丁亥刑命工舉石少髙之一新欄檻嚴護持銀鈎照眼光陸離天威只尺顔不違虐民之事焉可為勿謂蒼蒼不吾知與爾同僚共孜孜出郊送虞參政因遊竹亭小飲與者九人送客出西郊天氣為我佳穿林看修竹偶與群賢偕邂逅適我碩三杯寫幽懷向來濤與戎此樂何繇諧立春巫峽逢生日夔州見立春行年五十五羞作戴花人寄劉侍即韶美流落天涯老病身歸心一點逐新春故人少借論思口放我山林作散人正月六日遊磧呈行可元章踏磧逢為馬臨流想卧龍江山供指顧尊俎奉從容峽水淺還漲巫雲淡復濃天教我輩合莫惜罄金鍾呈同官樽前記淂少陵詩好向江頭盡醉歸此日風光真可惜古來樂事巧相違細看八陳啚猶在欲問三分迹巳非惟有年年古夔國竹枝聲裏日暉暉買山夔山皆童子買山植木以庇之懼芻牧之不禁作詩以告後人書生為郡亦迂哉剩買童山買木栽但遣牛羊勿錢履它年定出棟梁材給水夔以竹筒引水見于杜詩以義泉名門則知昔之為州者不榷水而取錢也豫始至聞公庫歲收賣木乎千余緡鈐轄司亦如之豫以水給民俱后人廢之故作是詩接筒引水下山陬端為夔民解百憂長使義泉名不斷莫教人費一錢求修壘夔成頗惡豫修之雖雉枼一新然士城易壞兵有守城者勿它役隨壞而輔則成常固矣莫將􅊇旅視居官直作吾家活計看墻壁時時為修葺安知勞苦是平安種柳東至夔唐西過社亶凡十余里種柳二千根後人或不斬伐則垂條聳幹當如柳子厚詩但愧無惠化傳耳瀼水東西十里餘新栽楊柳二千株會看聳餘參天去能似甘棠勿翦無江月亭二絶長江何處水明月幾州天月與江無約相逢是偶然江山今古幾英雄割據并吞捴是空惟有江流不轉石千秋長在月明中登真武山籃輿曉上小琳宮夔子江山指顧中道士手栽山上柏身猶未老幹凌空上元山中百姓出遊作三章諭之鄰里相呼入郡城巴歌楚舞沸歡聲三宵遊罷同歸去勉力耕桑事父兄三日嬉遊喜遇晴還家又見麥青青伹須及早輸租稅莫要勾呼到訟庭好去耕耘隴上田但能勤苦有豐年家家飽暖身康健更向明年看月圓題諸葛武侯祠八陳啚旁丞相祠風雲慘淡會當時功成豈止三分漢才大非惟十倍丕渭上忽傳司馬走蜀中長起卧龍思我來再拜瞻遺像淚滿襟如老杜詩登詩史堂觀少陵畫像万丈光芒筆有神兩眉猶帶舊酸辛殘杯不復隨肥馬賸馥端能丐後人夔子江頭吟處景杜鵑聲裏拜時身敬瞻遺像觀詩史一酹雲安麴米春送參議吳郎中扁舟西泝蜀江長邂逅論交淂老蒼幕客可能淹杜甫郎官誰復識馮唐梅花開日方聮事柳絮飛時遽趣裝我過洞庭應有日定須來掃蓋公堂夔州祀社稷于州之西五里地不盈畝壇宇􅋻陋垣墻頺圯非所以崇明祀也買地易路築屋增壇命同僚董其事不踰月告成二月戊子祀事既畢詩以記之天下通祀惟社稷次則曰雨曰雷風胸龍興棄配土穀是皆于民有大功古夔子國今會府其於明祀可不崇西郊壇宇何太陋我忝守土責在躬廣而新之繄誰力蓮幕花縣謀僉同築垣旁近丹荔圃闢路下壓黃冠宫地有松柏兼可植時和黍稌行將豐夔門社稷宋社稷碩與天地同無窮遊卧龍山呈行可元章我輩逢山眼即青卧龍頂上喜同登啚留沙磧懷諸葛詩誦江濆憶少陵巫峽雲飛天一握瞿唐魚化浪三層俗謂瞿唐峽為龍門藍輿又向人間去回首林泉愧老僧聞詩淂男名之曰夔夔乙酉十二月十九日生詩以二月二十四日作巫邑𥘉傳鯉是日巫山送雙鯉吾家遂淂夔遙來如馬地却應蘿熊詩聞詩在番昜日蘿熊入書院官沗二千石孫看第一枝欣同君子抱祝汝似吾兒甘露降于宅堂竹間凡半月三經雨乃止州宅有甘露堂昔周侍郎為郡露降焉易見山堂以名之豫無善政懼其為災記以二絶湛湛下修竹味如飴蜜甘人言此為瑞無德可能堪竹間甘露日瀼瀼飴蜜珠璣帶細香天閔夔民歲飢饉雨暘時若乃嘉祥元章贈蘭英英道山友贈我深林芳入室與俱化同心如此香紉之可為佩不采庸何傷三復韓子操援琴鼓揚揚卧龍山有武侯新祠再用前韻山藏古寺柏青青地重端因蜀相登沙上不聞江轉石人間幾見谷為陵龍蛇樹影搖千尺玉雪花枝吐万層堪嘆屮廬誰復顧凄然香火却依僧寄書與二叔二弟八十髙年林下老四千餘里蘿中家雲安雙鯉隨春水為我傳書到永嘉左原端是脊令原誰遣分飛到蜀門况是清明寒食候杜鵑聲裏斷離魂題卧龍山觀音泉呈行可元章去歲遊廬山社中觀白蓮不飲逺公酒聊酌聰明泉肩輿過武昌乘興西山巔岩乳飲菩薩詩篇誦蘇仙武昌西山有菩薩泉東坡名之夔州苦無井癭俗殊可憐竹筒喉不乾可浣不可煎日汲卧龍水屢賴簷夫肩所取都幾斛深慙未投錢前日招提遊入耳聲涓涓泓澄可照膽中木皆光妍却疑南陽人蟠蟄清冷淵慘淡會風雲滂沱霖普天源如少陵詞清入光芒篇餘波漲瞿唐洶涌吞百川何人著水經漏此不及編道人出新茗林間手新研共以夷齊心來結觀音緣至今清夜蘿猶到幽亭邊交遊况離索回首成悽然元章移節西州何時鹿􅊯􅊯重訪山中禪僧言前日吾㑪將至山中鹿鳴元章贈筆戲成一絶東臺使者妙詩文贈我中書四十君我不善書慚拜賜中書今日遇將軍再酬元章一尊方喜細論文春屮題詩又送君手握管言不盡詩壇誰復將中軍又答行可道造精微更有文絳侯應愧不如君試將武事論詩筆句法嚴於細柳軍酬行可惠白酒渴懷思欲吸長江聞説西臺釀滿缸一斗青州白從事忽隨詩句到蓬窗同行可元章報恩寺行香登佛牙樓望勝已山籃輿拂曉出東關鍾磬聲聞杳靄間心欲報恩頻入院人逢勝已更觀山竹香細細禪房靜江水渾渾野渡間𣣔問漁人國興廢黃鸝隔葉語綿蠻五月四日與同僚南樓觀競渡因成小詩四首明日同行可元章登樓又成五首蜀江險處是夔州灔澦堆邊看競舟為報番昜相識道去年人在此登樓去五月四日會僚友于番江樓酒中分韻淂月字云明年何處更登樓遙望番昜江上月臺前八陳巳陳迹水底三閭何處招手把菖蒲對佳節興來呼酒勸同僚番昜夔子兩端午去歲人如今歲人兩年皆十六人直是吳頭來蜀尾子規聲裏弔靈均榴花照眼對佳客荷葉傳杯懷故鄉想見明年話夔子又如今歲念番昜黍遇今朝盡生角艾從何處忽為神荷香十里一鈎月定有扁舟歸去人舟人鼓楫呼何在聲似湘沅江上聲更聽劉郎竹枝曲不論南北㧾傷情細葛含凬羅疊雪近臣𥘉拜賜衣時碩因角黍詢遺俗學士寧無六一詞競渡本來緣救溺陵波𥘉不為爭標今人不解古人意淂勝歸來笑語囂綵舟兩兩鼓鼕鼕勝已山隂瀼水東父老相逢話良苦兒郎多在馬船中劉韶美至巫山寄詩因次其韻終日思歸未有涯蘿魂無夜不還家莫雲春樹憶太白流水高山逢伯牙卷軸隨身雖有厄韶美至狼尾灘失舟壞書籍風流得罪可無譁劉以收書致煩言相逢莫便匆匆去弭棹夔門過食瓜送元章改漕成都取友四十載普天半交遊蒹葭群玉間莫盛登瀛洲元章真國士未見心已投雅抱畎畝志共懷天下憂館閣育人材孰云專校讎慷慨論丗事不見范尹歐疆埸况如許寧不憂宗周精忠屹肝膽苦語驚冕旒君去最勇決我行尚遲晉𥘉别擬十載相逢忽三秋龍飛起元老江淮握貔貅禮羅淂竒才戎幕資良籌人事苦好違壯懷莫能酬去持夔州節遙泛瞿唐舟我亦來自番兹行豈人謀八陳觀壯啚三峽窺倒流訪君義勝堂顧我制勝樓如馬謁白帝卧龍尋武侯江亭覽月色園花賞春柔果分餘味甘蘭贈深林幽詩篇浩卷軸墨妙輝山丘氣薄文艷杜詞卑竹枝劉吏事容拙踈交情荷綢繆綸言下北闕繡衣使西州流錢豈君事易地曽何優胡不班玉笋入告嘉謀猷巴子國最貧瘡痍民未瘳君去誰撫摩欲借嗟無由我已上祠章歸歟老田疇遲君還日邊寄書到東甌次韻元章晉别送客成都去回舟白帝邉月應遙共對夔復有誰憐我只懷歸計君冝了丗緣相期翼吾道餘事讀楞圎夜與韶美飲酒瑞白堂秉燭觀跳珠分韻淂跳字五月峽中天氣歊竹筒引水那能澆江濆龍老卧未起崖石不枯珠自跳草草杯盤對君酌燈前疑是簷花落毫端寫出万斛珠共向炎天作氷雹妃子名園荔子丹絳囊𥘉摘堆金盤細擘輕紅唱君曲咀嚼水晶牙頰寒老翁真箇如年少激水成珠堪一笑劉侯自有胸中珠不止照人兼自照儀鳳淂珠字别來世故朝昏殊相與言之汗模糊兩翁淂酒促坐席感深念極氣欲蘇籜龍亦解作水供紬繹尋丈如渴烏衣巾生秋背毛豎金石相應環佩趍江山豪壯旁尊爼醉中頻貫纍纍珠此時一事復挂口為樂未竟成喑嗚夔州憂民困湯火潤澤有志無坦途眼前焦熬十万户欠伸戲笑皆霑濡自操量鼓入官廩不輸一錢分水符讀書功力無表畔久矣俗吏輕吾儒州民輸租淂自操概量免城中水錢以巳奉輔公帑比入境淂之民謡者次韻韶美失舟閔書醫師籠參术良將枕戈矢儒生嗜砥物書卷挂口齒劉侯西南來歲月十首尾閉門閲古今過眼分亥豕異書照神藜竒字哭妖鬼許身如蠧魚文字共生死風流反淂罪去國果誰耻仙舟載祕閣便腹貯名理江神亦丗情逐客多不喜厄同焚書秦惡類滅邢燬沾濡遍箱篋痛惜到骨髓我𥘉聞為驚終夜成坐起淂君詩細讀罪巳不罪水碩言坐嘯餘書著子劉子韶美歸舟過夔晉半月語離作惡詩二章以送五載三詩送我歸古夔今作送君詩相如遊處符分竹諸葛陳旁舟解維秉燭莫辭頻把酒揮毫未免各憂時可憐灔澦雙蓬鬢會合無多又别離弱羽年來正倦飛夔門邂逅故人歸人生一笑難開口丗事多端合掩扉况是桑榆俱晚景何曾冨貴已危機明朝悵望仙舟逺百尺髙樓上靜暉州宅有靜暉樓此篇用詔美送元章韻元章至雲安用送韶美韻見寄次韻以酬社燕秋鴻不共飛却因送别更懷歸一壺獨酌人何處千里相思月滿扉煙雨已催豫把釣功名行看子投機雲安雙鯉傳書至詩句清含山水暉靜暉樓前有荔子一株木老矣猶未生豫去其枯枝今歲遂生一二百顆至六月方熟木老生遲六月丹夔涪荔支皆五月間熟明珠百顆照朱顔因渠凬味思瑶柱東坡以荔支比江瑶柱撩我鄉心念玉環玉環妃子名也吾邑有玉環鄉路逺應難三日寄荔枝過一日則香色味俱變閩中荔支三日到永嘉樓髙更上一層攀君謨譜內丁香種宜在江陳品第間味甘而核小正如閩中丁香荔子行可和詩再用前韻肌膚氷雪鶴頭丹三峽相逢一破顔人折髙枝如折桂鳥銜餘顆似銜環香傳樂譜名尤重曲名荔支香紅入詩家句莫攀老杜有輕紅擘荔枝句來歲熟時先寄我夢魂應到白雲間計臺有白云樓行可再和因思前日與韶美同飲計臺臨池摘實復用前韻星火燒空一夜丹來禽青李覺無顔少陵池館三人賞丗傳計臺乃少陵舊它今有祠堂白帝江山四面環生晚免教妃子汙食餘應許黑衣攀閩娘十八誰標榜未必風流似此間坡詩亦及黑衣郎謂猿猴也又用韻呈行可神仙乞與返魂丹枯木能成處子顔雅樂聲中逢魏絳重圍解後見齊環九齡賦妙那能繼三峽詩高未易攀兒輩莫言酬倡晚吾鄉食實在秋間夜來和詩兒女輩云荔支巳過乃方作詩何也鄉里七月方食閩荔元章至萬州湖灘寄六言一絶云滿目莫山平逺一池雲錦清酣忽有鍾聲林際直疑蘿到江南某六月朔日登靜暉樓觀江漲望西南碧逺數峯乃前日送别處也為之黯然樓前荔子𥘉丹次韻寄元章遙碧峯尖如削輕紅荔臉𥘉酣水漲江天渺渺故人一葉西南韶美至雲安寄詩二首再用詩字韻以寄劉郎𥘉自日邊歸入峽殷勤寄我詩大小承天思越絶往在會稽韶美居大承天寺某居小承天今號能仁後先去國會坤維分題應記跳珠夜送别還思入竹時千里遙遙共明月此心無合亦無離伏日與同官小飲瑞白堂觀跳珠分韻賦詩瑞白堂虛氷雪凝散為珠玉洗炎蒸詼諧未效東方朔賦詠聊追杜少陵伏日懷番昜同僚去歲番昜四望亭題分十二志同登眼中忽見天邊月不謂天邊是固陵餘干翁簿以豫去饒之日郡人斷橋見晉畫圖賦詩見寄因次其韻我慕鄭子真躬耕老岩谷不慕蘇季子腰金詫宗族失腳落塵網回頭念幽獨向來鴛鷺行進退慚碌碌把麾番君國飲水清灣曲緬懷九賢人痛閔千里俗奉揚乏仁風黎庶因炎燠疇能政有成敢望諾無宿厚顔叨祿廩汗背擁旌纛命下忽夔門諸公孰推轂水陸三千里湖重嶺仍復至喜謁文忠秭歸懷李矗番人憐老守去類楚臣逐出門橋巳斷擁道頞爭蹙𥘉無龔黃政濫繼秦侯躅仇香舊同僚别寄兩竿牘賦詩仍畫啚開卷宛在目清音滿干越餘韻到巴蜀我有二頃田荒蕪堆山腹碩畫歸去來芒鞋事耕育贈裴童子文公有序規童子將聖猶言畏後生好把五車書盡讀五車讀了要須行行可生日六月十四日千載岐周鸑鷲聞果生英傑嗣姬文鯤鵬變化正六月蟾兔光輝將十分肯把威名爭烈日只將道眼視浮雲祝公夀共詩書久一瓣心香巳敬焚王嘉叟和讀楚東詩復用前韻以寄照眼􅌐珠光陸離莆田太守寄新詩死生貴賤交情見惟有吾宗不徇時嘉叟和黯字詩再用前韻以寄金谷冨季倫丑坐貴思黯人間幾泉石豪奪在軒檻燕賀厦𥘉成花飛春忽減破甑任生塵只有萊蕪范和喻叔竒宿大木寺木記餘千大風觀楚國雄吾詩晉大才君句壓雄風番水連天碧潘花滿縣紅叔竒攝邑安仁論文一尊酒何日故人同用讀楚東集韻寄元章誰遣吾㑪合又離江山深憶共題詩君舟西上吾東矣尊酒論文更幾時納涼簾捲見山近窗開竹香香訟庭公事少靜坐納微涼立秋莭物催吾老天涯見立秋涼微金尚伏暑熾火𥘉流家遠思嘗稻年衰怯載楸夔人立秋並簮秋葉歸耕期已近河漢望牽牛七夕去年佳莭吳頭見今久秋聲峽內聞桂魄漸看成半璧銀河猶自掩微雲晒書空有便便腹乞巧𥘉無怪怪文為向天邊牛女道夫耕婦織莫辭勤懷畨昜一别番昜歲及期夔門又見食瓜時自慚政拙無遺愛安得民心有去思同官有録民謡見寄者齒落用昌黎韻我來饒與夔三載墮兩齒懸知季非永早悟仕當已要須未落時猛效二踈止胡為一再落不巳良可耻慨然懷古人未有長不死因思季方少輩行多勝巳顔紅齒牢潔往往同逝水吾衰况如許寧復老彭比覽鏡視顔色今昨不相似行年五十五萬事可休矣功名與富貴磨滅何足紀但願早還鄉俯育三百指婚嫁畢兒女松楸依怙恃弟兄飲真率故舊忘汝一兩齒牙任搖脫肉食吾不視有身久為患無齒實堪喜始憂笑韓公可惜陋子美未必傷我心兹言聞栁子梅溪先生後集第十二梅溪先生文集卷第十二論禹論堯舜禹皆聖人也惟其傳賢傳子之不同而後世不能無異論也自孟子之前人皆以為禹德衰故不傳于賢而傳于子萬章以是發問孟子辨其不然曰天與賢則與賢天與子則與子然後學者以傳賢與子一本于天而無有以議禹也至韓子作禹對而其説又不然曰堯舜之傳賢也欲天下之得所也禹之傳子也憂後世爭之之亂也堯舜之利民也大禹之慮民也深且謂孟子求其説而不得又從而為之辭近世善議論者莫如蘇子蘇子之言曰今夫人之愛其子是天下之通義也有得焉而思與其子孫人情之所皆然也堯舜之傳賢是不得已而禹之傳子蓋聖人之不喜異也自萬章之問至蘇子之辨其説有四然而聖人至公之心卒未明焉以為德衰而傳子者是以迹論聖人其説也固陋矣而孟子歸之於天下亦未免乎不通也堯之傳舜舜之傳禹之傳子其大計固巳定于生前不待身死之後始聽天命人心之自歸也謂舜禹避朱均而益避啓者其説蓋亦不經矣韓子以為憂後世蘇子以為不為異韓子之言也近正蘇子之言也近人情然皆未得夫聖人之心者蓋聖人以天下為公器其視賢于子一也賢可傳而傳不以傳賢為踈而害天下之公器子可傳而傳不以傳子為私而有慊于心也昔吾夫子以大道而傳之學者夫以人情論之夫子豈不𣣔私其子哉然而過庭之訓止于詩禮陳亢始以異聞為問卒以君子逺其子為喜亢以私心量聖人而其問與喜皆不然也夫子嘗謂才不才亦各言其子者人之情也至于所欲傳道之心視回與鯉一也堅髙之妙在回而詩禮之外無以告鯉者豈親門人而逺其子哉使回如鯉鯉如回則詩禮之訓在彼而堅髙之妙在此矣道與天下皆公器所以傳道與天下者不以賢與子而二其心然後為大聖人堯舜禹之傳天下如吾夫子之傳道堯舜非逺其子禹非親之也民之所安吾從而與之不知傳賢之為遜天下傳子之為世吾家尚何不得已與懼夫為異也哉若夫憂後世爭之之亂而以之傳子者固可以為天下後世法矣原其所以傳之之心出于以天下為公而視賢與子為一無有不得巳與懼夫為異之事亦非有憂之慮之之心而委曲為之計也愛其子而私有與之者人之情憂後世而為之計者君子之法不以親踈內外二其心者聖人至公大同之道知此三者之説然後知堯舜禹之不二其心而傳賢與子一也武王論事有出于千載之逺而傳聞之不同吾將奚所考信邪愚曰聖人之言可信而時人親見之言亦可信也千載之事必存之于書是書出于聖人則可信不出于聖人則可疑吾非信書而信聖人聖人之言如此吾是以知其如此也千載之事當時必有親見之者親見之言可信傳聞之言可疑吾惟親見之是信而缺傳聞之疑可也彼有聖人之言與時人親見之言兩不同焉則吾將誰信亦曰槩之以理而巳矣書載武王伐啇之事與時人親見之言不同學者疑之異論興焉此固冝槩之以理者秦誓曰惟十有一年武王伐商是十有一年者果誰之年邪上不繫之文王是必武王十有一年也武王果即位十有一年而後伐商邪史記載夷齊扣馬之諌曰父死不􅌾奚及干戈可謂孝乎武王必不歷十有一年之久而不葬其父也書出於夫子之所序萬世之所取信而夷齊又武王同時之人亦不可以不信二者俱可信而其説不同則學者不得不疑而異論不得不興也漢儒之説曰文王之時虞芮二國質成于周諸侯並附以為文王受命之年文王自受命九年而卒故武王曰惟九年大統人集是也武王終三年之喪然後廣文王之聲卒其伐功故并文王受命之年而數之稱十有一也嗚呼果如是説則是文王受命稱王於商紂在位之時孔子何以稱其三分天下有其二以服事商乎是求十有一年之説不通而誣文王於不臣之地也近世大儒歐陽子作秦誓論斷然惟書之是信而破漢儒之説曰十有一年者武王即位之十有一年耳復何疑哉歐陽子之言甚辨而近正然不信遷史載伯夷之諌非春秋所謂以信傳信者愚切謂書之所載者是遷史所記亦不虛十有一年者非武王即位十有一年周家受命之十有一年也或曰子方繆漢儒之誣文王何為復取受命之説乎曰文王非受命于天受命於商也文王自美里之囚還而紂以弓矢斧鉞賜之使得專征伐自是而後文王始居方伯連師之職五侯九伯得以征之于是有遏密伐莒戡黎之事自受專征之命至九年而卒然則文王受命者是受商命以專征伐非受天命以自王也武王嗣位二年繼文王征伐而觀政于商秦誓之作在周家專征十有一年之日武王未有天下之𥘉不曰惟武王十有一年而曰惟十有一年武王伐商則其旨可見矣是則書與史記之年皆可信而漢儒之論歐陽子之所疑者皆可得而決也或曰子信聖人之書與時人之言而孟子不信武成非邪曰孟子非誠不信書也以不信而救弊也武王雖以至仁代不仁然兩兵之交寧無血刃者乎血流漂杵雖記事者未免文勝質而不可謂之盡無也當戰國之時有爭地爭城之戰盈城盈野之殺好兵之主與夫貪功樂禍之臣蓋有以牧野之戰藉口者矣故孟子以不信而救之也春秋之法信以傳信者也疑以傳疑者也不敢以其所傳聞忽其所親見是亦教天下之信也况秦誓信書馬遷信史理有足信者乎愚故曰聖人之書與時人親見之言皆可信而二説不同者槩之以理而巳性論學者之患在於好言性性非學者之所不當言其患在於不知性而好為雷同之論也今天下雷同之論在乎孟子性善之説而以上中下三品者為才也一二師儒唱之學者從而和之唱之者主孟子和之者雷同也實非有所見而言焉性非可以無見而輕言之者必待吾心有所見焉而後言之則吾之所言者是吾之所見也吾之所見者未必是又從質之而聖人之言吾心之所見與聖人之所言者有所合焉庶乎言之或當也夫子之言性者不可得而聞也其昭然著于論語者有一言焉曰性相近也習相逺也繼之以唯上智與下愚不移夫子之言雖不詳吾可以吾心而求夫子之言也夫子性近習逺之言蓋論天下之常性也而上智下愚不可以常性論也夫天之生上智也不數其生下愚也亦然惟所謂中人者紛紛皆是也故夫子舉中人而論常性斯有相近之説焉又懼學者執是而槩論天下之性復為上智下愚之説以别之夫子之論性固巳昭昭矣烏在其他求也夫上智之人天命之𥘉固巳上智矣雖瞽鯀不能移上智而愚下愚之人天命之𥘉固巳下愚矣雖堯舜不能移下愚而智惟不智不愚者是為中人而非善非惡者是為相近方其生也無君子小人之别及其習也有君子小人之歸其猶水也方其同一源之𥘉可謂近矣及其派而二之則有東西南北之相逺也此聖人所以因性而立教者為天下常人設耳若無上智下愚之性其猶水火乎水之在土也其性有自然之寒雖善呵者不能奪而使之熟火之在木也其性有自然之熱雖善噓者不能奪而使之寒水火不能奪寒熱之性智愚其可移上下之品乎今之説者謂堯桀同是性也嗟乎其不知性也是蓋出于孟軻性善之論軻非不知性也軻之論性將以設教而巳非為性立一定之論也至若荀况以性為惡楊雄以性為善惡混亦所以設教且救弊焉耳皆非為性立一定之論也軻曰性善是誘天下使其為善之是歸况曰性惡是懼天下使其惟惡之務去雄曰善惡混是開兩端而使之自擇也其説雖不同其所以設教則一也况雄又以救弊焉者軻以善誘之而不從况出乎軻之後不得不以惡懼之况以惡懼之而不畏雄出况之後不得不開兩端而使之自擇亦猶伊尹伯夷栁下惠制行之不同皆所以救弊也為性立一定之論者惟吾夫子與韓愈氏愈著原性篇有上中下三品之説此最合吾夫子所謂相近與夫上下不移者世乃謂愈之所論者才也非性也至謂夫子所謂上智下愚者而亦謂之才焉夫性之與才同出乎天有上中下之性者必有上中下之才性為之主才為之用也上智之性善矣發而為善則非性是才為之也下愚之性惡矣發而為惡則非性是亦才為之也上智下愚之性有自然之善惡其所以為善惡則才也是性主之而才應之耳烏有性無上中下而才獨有之耶天之所以命堯舜與吾夫子者必不惟桀跖之同學者冝以心求之慎無襲乎雷同之論而雜乎佛老之説則夫子之言性可得而聞而韓愈之所論者果性也非才也禘祫論諸儒禘祫之説何其紛紛不同也鄭康成謂祫大禘小王肅謂祫小禘大此小大之説不同也王鄭小大之説方淆亂未決劉歆賈逵之徒則又謂一祭二名禮無差降此一祭二祭之説又從而不同也鄭氏謂天子祭圓丘謂之禘宗廟大饗亦謂之禘王氏謂天子諸侯皆禘於宗廟非祭天之祭此祭天祭宗廟之説不同也詩閟宫傳云諸侯夏禘則不祫秋祫則不嘗漢光武詔問禘祫之説於張純純謂禘以夏四月祫以冬十月此夏禘冬祫之説不同也漢魏故事五年之間通計其數一禘一祫是出於公羊五年再大祭之説唐開元間太廟禘祫各自數年是又用禮緯三年一祫五年一禘之説此又年數之不同也鄭康成髙堂生則先三而後二徐邈則先二而後三此又先後之不同也自漢迄唐禘祫之議講之屢矣牽于繁文異説終莫得而一之善乎歐陽子之言曰事有出于久逺而傳于二説則奚從曰從其一之可信者然則安知可信而從之曰從其人而信之可也衆人之説如彼君子之説如此則捨衆人而從君子君子之説如彼聖人之説如此則舍君子而從聖人然則欲一禘祫之説當折衷於聖人之言可也春秋詩禮論語皆聖人之言也釋春秋詩禮論語者皆諸儒之言也春秋書禘者二而不言祫惟文二年八月丁卯大事于太廟躋僖公公羊榖梁釋之曰大事者祫也春秋有禘無祫以大事為祫者公榖也詩周訟商訟言禘者二而不言祫惟元鳥祀髙宗毛氏傳曰祀當為祫詩有禘無祫以祀為祫者毛氏也周禮太宗伯之職以肆獻祼享先王鄭氏曰宗廟之祭有六享肆獻祼饋食在四時之上則是祫也禘也周禮無禘祫之説以肆獻祼饋食為禘祫者鄭氏也論語記禘自既灌而往與或問禘之説孔安國釋之曰禘祫之禮為序昭穆論語言禘而不言拾并言禘祫者孔安國也惟禮記王制曽子問大傳有禘祫之説而亦未嘗言其禮之大小與年數之先後冬夏之異時至于祭法則言禘交祖宗而不言祫仲尼燕居與祭統篇則言郊社禘嘗而不言祫王制祭義諸篇舉四時祭名皆曰夏禘而不言冬祫以春秋詩禮論語之言如此釋春秋詩禮論語者其言如彼學者當舍訓釋而從經可也從經則古者有禘無祫非無祫也祫者禘中之一事不可與禘俱謂之大祭也古者大禘之時群廟之主皆陳於太祖未毁廟之主皆升合養于太祖因禘而合食故謂之祫是禘者總名祫者一事亦猶薦生薦熟之時則謂之薦灌酒求神之時謂之祼薦也祼也祫也皆大禘中一事不可以是三者均謂之祭名也後世因禮記諸篇有禘祫事遂以祫與禘俱謂之大祭殊不知禮記之所謂祫者是乃禘中之一事也又見公羊以大事為祫遂以祫為大於禘殊不知公羊之説出于禮緯而春秋無是言也春秋所謂大事者即禘爾不曰禘而曰大事者禘所以審昭穆僖公逆祀昭穆亂矣聖人是以變禘之文而曰大事大是事也公羊求其説而不得遂援禮緯以釋經此所以啓後世之紛紛也或曰如是則劉賈一祭二名之説得乎愚謂劉賈之説僅矣而未盡也彼謂二祭一名者謂本無二禮也則一祭之説為僅得而不知禘者禘其祖之所自出祫者因禘而合食焉禘總名祫一事則二名之説為未盡或曰如是則廢三年之祫而用五年之禘必五年而一大祭乎愚曰廢祫之名而一之於禘可也五年而再大祭則公羊之説不可廢也鄭康成先三後二徐邈先二後三與夫秋祫冬祫紛紛不決之爭舉可置也或曰三年祫五年禘自漢至今而用是説可廢之乎愚曰春秋詩禮論語非聖人之書則漢儒之説禮緯之言不可廢春秋詩禮論語果聖人之書也吾從聖人而廢異説胡為而不可邪君子能為可用論知所以為巳知所以為人又知所謂有天斯可謂有道君子矣夫何故君子之學求於為巳而巳𥘉無心于求用也學既足乎巳用自藏于中可以安人可以安百姓無所施而不可用者君子因其可用之資遇其當可用之時著其能為用之效至若人之不我用也君子必歸之于天而有所不顧恤焉苟以吾學可為巳用可以為人不察時之可否人之用舍必𣣔求試其所用幸而用則喜不幸而不用則懟甚者至于自貶以求用是徒知為巳為人而巳而不知有天也烏可謂誠君子哉荀卿曰君子能為可用繼之以不能使人必用巳真確論歟君子之道有三其未逹也修其所為用其既逹也行其所當用不幸而不遇則處其所不用修其所為用則能盡已行其所當用則能盡人處其所不用則能盡天故君子自幼學之𥘉必修其能用之實謂將事君也必先學所以事父謂將治國也必先學所以治家謂將明德于天下也必先學夫正心而誠意在我之學既巳盡矣推其素藴可以有為于常世矣使不我用則已用則決不負所學焉以之效智于二官則其用優于一官以之䇿名於一國則其用優于一國以之坐廟堂而權衡天下則其用優於天下是由能修其可用於未用之日故能行其所用于當用之時也如此至若在我雖可用奈何人之不用我君子必將斂其可用之器於一巳而未嘗汲汲以求售于人韞櫝而藏待價而沽居昜以俟姑盡其在天而巳又豈遺佚而怨厄窮而憫栖栖焉為不得志之人哉故善學君子者不止學其可用必學其可用而不得用學其可用徒能取利逹而巳而人皆可學學其可用而不得用斯能處困窮而為聖人樂天之事也孔門弟子如賜之逹如由之果如求之藝皆能學其可用者故夫子許之以從政而不許其為不可則止之大臣若夫可以有用可以處不用唯顔子一人而巳故許之以用舍行藏之理又許之以唯我與爾有是夫回也生不遇時不獲著其有用之迹因其不用亦見其能處不用之賢矣嗚呼自生民以來孰有如孔孟之能為可用者乎又孰有如孔孟之不得用者乎又孰有如孔孟之能處不用者乎孔子嘗自謂用我則為東周孟子亦嘗自謂捨我其誰孔孟之言非自誇以求用也蓋言其實可用者至於歷聘天下卒老干行也又未嘗不歸之於天故當陳蔡之厄子路有吾未仁未智之言以疑夫子子貢亦有不容盍少貶之言以勸夫子夫子以良農能稼而不能穡良工能巧而不能順君子能修身而不為容之理以喻之孟子遭臧倉之沮隔而不得見魯侯不歸怨於臧倉而曰行止非人所能為也天也若孔孟者真可謂能盡天矣彼屈原者何人哉一不見用於楚而離騷之怨興矣原以清死而後世哀之使原果見用亦未必能有為於楚蓋其為器固巳小矣荀卿亦逃讒於楚者也以宗王之學至於廢死蘭陵亦可謂不遇矣卿不作離騷怨懟之辭而有不耻不用之語嗚呼卿賢巳哉上舍試䇿三道第一道昔先正司馬光論歷代君臣事迹始周烈而訖五季貫穿馳騁上下千載間書成於元豐中神宗皇帝嘉之錫名資治通鑑親灑宸翰以製其序且取前代之君以自况其言有曰漢之文宣唐之太宗所謂禹吾無間然者議者謂神宗聖德具見於十九年事業之間巍然炳然可髙揖堯舜于千載之上而乃俯比二三君何耶愚曰不然自古聖人德盛則待人必恕實有餘則取名必廉孔子以天縱之聖生民以來未之有而乃自比於老彭自同於丘明自以為不如顔淵可謂待人恕而德愈盛取名廉而實益有餘矣然則神宗之有取於文宣太宗是亦孔子恕以待人廉以取名之意也知吾夫子與神宗待人取名之意則知今日主上之有取於光武亦仲尼之意歟神祖之意歟夫光武之為君雖未可比隆三代盛王較之漢七制唐三宗之中實為最優以春秋之法責之固未逃議論之域待之以忠恕之道固冝取所長而掩所短也請論光武之為人而侍與髙帝太宗陳之以發明聖志之萬一若夫主上盛德大業自與堯舜三代同符非敢以光武比也夫七制之功莫大於髙帝三宗之功莫大於太宗以光武而擬二君則其功有若不及者嗚呼孰知其不及是乃所以過之耶髙祖太宗惟功之是慕而光武則以為不足慕故髙祖太宗以功顯而光武以德稱髙祖誅暴秦滅強項以三尺劍而造帝業可謂有不世之功矣然關中既定馬上之事可勿論也而好戰之心老猶不衰至親伐胸奴而困于平城之圍髙帝徒知干戈之可以立功而不知文德之可以來逺當平城之圍足見百萬之衆不如虞階干戚之舞矣是冝異日在廷之臣欲斬樊噲之論兵也太宗取孤隋攘群盜以幾冠之年而定四方亦可謂有不世之功矣然唐室既造晉陽之甲亦可解也好大之心不能自足至親定四夷而困於遼水之役太宗徒知古人有攘却之事而不知聖人有兼愛內外之心當遼水之厄則知萬里親征不如漢文玉帛之聘矣是冝前日諌諍之臣見武德之舞而不之顧也光武起于軍旅非不知兵勇于大敵非不知戰明明廟謨紏紏雄斷非不足以務逺略雲臺之將上應列宿非不足以立邉功舉全漢之衆又非不足以橫行四夷之中以快一日之志也而退然若一怯者口不談兵于恢復之後何耶蓋事有屈于名而當于實者惟盛德者能之夫興師百萬拓地千里功若可喜也盛德之主則謂彼民亦吾民何忍草芟獸獮之耶吾寧收愛人之實德不必求名于闢國也太師奏凱將士受賞君臣固可相賀也盛德之主則思有褁糧千里巷哭飲泣之人是孰貽其禍耶吾寧使吾民之不傷不忍求戰功而生得色也得不毛之地以夸封疆之廣孰若保吾土之當于實哉臣無用之人以為民孰若全吾生齒之當于實哉髙祖太宗皆棄實德以慕虛名光武獨能屈于名而當於實故以藝文之講而代干戈以道義之論而代鞍馬以文雅之吏而代征伐之臣閉玉關謝西域卑辝厚幣以禮胸奴之使而抵掌撫劍之臣皆不得逞志于當時其治天下一出于柔道朝夕從事于詩書爼豆之間而不知疲此所以賢于髙祖太宗一等歟雖然光武之所以優于漢唐之君者以其能偃兵也其不能比隆于三代之君者用人之際未可人意爾光武以吏事而責三公以謡言而昜守宰此最其失之大者三公之職所以論道經邦非可以吏事責之湯不責伊尹以吏事而望之以一德格天髙宗不責傅説以吏事而望之以朝夕納誨成王不以吏事責周公而望之以師保萬民光武不與三公坐論邦國之大躰而以吏事進退之非商周之所以待三公者冝其治效不及於古也守令之職所寄非輕當以三載考績之法黜陟之非可以謡言而驗其賢否鄭子産古之遺愛名在循吏中方其相鄭之𥘉民興𣣔殺之謡使人君遽從而昜之則僑之聲名風采不復著於列國矣以吾夫子之宰中都曽未聞有誦德之謡使時君必以謡言取人則造為緋衣小兒之語以沮賢者多矣光武失於此是冝東都循吏反西京之不及也且光武之失又不止如是三公固不可以吏事責而光武之失尤在於未能擇三公守令固不可以謡言昜而光武之失又在於親擇守令夫三公之職非大儒不足以當光武乃以此處侯君房輩未聞其有卓卓過人者是冝嚴子陵問其癡而致語於使者以譏之雖起一卓茂於縣令及居廟堂亦無所建明其名固亦減於治密時矣則知論道之任非可以輕處人也守令之寄雖重然非天子所冝親擇者天子擇宰相宰相擇部刺史刺史擇守令此人主簡要之術也光武乃以身任部刺史之職冝其擇之不精而以謡言進退之使光武精意於一相亦何患天下無賢守宰也嗚呼至治之君不世出漢唐之可稱者止于十數君而光武尤為盛德猶不免有任人之失是冝以忠恕之道處之而勿至於責人無巳可也恭惟主上以仁聖之資撫中興之運誕敷文德仰合有虞歸馬放牛同符周武𥘉非有慕于光武而襲其陳迹也比因庭䇿多士特以光武發于清問草茅之士莫知聖志之所在愚獨妄意其處巳處人之際合吾夫子神宗之用心而明䇿下詢謂今日禮文經義問或酌光武之儀以出處或矯光武之失以示訓其迹蓋有不同者愚切謂景至而禋祀元正而會朝建延閣以崇文闢成均而論秀此皆取法三伐非酌光武之儀而行之也寫六經于琬琰為學者式異端説禁止勿用以矯尊七經之讖復春秋立三傳以矯罷黜左氏榖梁之失愚謂此皆默契孔孟之用心亦非有意於矯光武而為之也然用柔道以致平光武之所巳為者而吾君固巳優為之任一德以圗治吾君之所優為者而光武負不能之愧矣雖然愚復有説以獻夫恕以待人廉以取名乃人主之盛德而人臣之職則當以責難為恭孟子謂不以仁義告王則斥以不欽之罪唐文宗嘗問群臣可况以何主鄭覃以文宣對為李石所斥且以堯舜勉之夫文宗雖儒雅主然任人致治之際有不足稱者李石乃期之以堯舜使不以文宣自安况吾君盛德實足以為堯舜耶愚願執事當侍清問之際日陳堯舜之道以廣吾君稽古之志彼光武駁淺姑取其二三䇿可也第二道舉國皆儒則儒者之名不聞為吏皆循則吏之名不聞為士皆純德野無遺賢則獨行逸民之名不聞為子皆孝為臣皆忠則忠臣孝子之名不聞愚嘗讀渾渾之書而得九官十二牧之為人讀灝之之書而得伊尹伊陟傳説之為人讀噩噩之書而得周公間夭之徒之為人彼皆大儒也當時不稱其為儒彼皆能致循良之治也當時不目之曰循吏彼皆為忠為孝也當時不指之曰某為忠臣某為孝子下至於鄉黨庠序之間不聞其有獨行山林草野之間不聞其有逸民自魯國之人以儒稱則儒道衰於周矣自鄭相子産楚相孫叔敖以循吏聞則吏治始衰於列國矣自伯夷栁下惠以獨行著則天下之士始有尚偏之弊矣自長沮桀溺之徒以逸民而長往則韜光鏟采於漁樵之間者多逸民矣自子胥以忠稱於吳曽參以孝稱於魯則忠臣孝子稀踈寥絶如參辰之相望矣嗚呼士以一行得名於時彼亦何等時耶西漢之有儒林有循吏非西漢之美事蓋自髙祖見儒服而慢罵而懦氣不振申韓之術行於世而吏治多出於刑名班固作西京一書表儒林循吏而出之所以傷漢之儒與吏也東漢之有獨行逸民非東漢之美事蓋自矯激之俗興士始流為崖異斬絶之行自廉耻之風喪時始貴髙舉逺蹈之人范曄作東都一書表獨行逸民而出之亦傷士之少純全時之多獨善也李唐之有孝友有忠義非李唐美事蓋自髙祖變節於晉陽而唐無忠義之風文皇行虧於閨門之內而唐無孝友之俗東史筆者表孝友忠義而出之蓋傷當時忠孝之難能而僅有為足貴也夫天下皆有則所有者不勝書天下皆無則僅有者斯可書且西漢有商山之四皓非無逸民也有矯世之楊王孫非無獨行也而班固不立逸民獨行傳者蓋以當時之士廉退者尚多無貴乎逸民行之全純者猶衆無取乎獨行其不以是立傳蓋不𣣔使當時有逸民獨行之名也東漢有江革申屠蟠之類非不甚孝有李固杜喬之徒非不甚忠而范曄不立忠義孝友傳者蓋以當時俗多孝友則孝友不可悉書人多忠義則忠義殆不一傳二傳之不立蓋不𣣔使當時有孝友忠義之名也若無居儒林者二十有三人經術淵源者孔安國為之最安國得聖人家傳之學非淵源乎在循吏者六人政治忠厚者蜀文翁為之伯文翁興學校以化民非忠厚乎以獨行顯者二十有四愚切有取於范式式以信義行於朋友時人知其可以託死是固本諸賢聖而不為矯激也以隱逸稱者十有七愚切有取於嚴陵陵髙尚其志卒不為光武屈議者謂其得聖人之淸是故樂在山林而不盜聲名也言言之烈史臣之所以贊顔假蒸蒸之善栁宗元之所以銘李興然真卿秀實行非一端而不列於忠義愚獨於忠義三十七人之中深喜全節之張巡李興割股肉以進其親非名教之所愚獨於孝友十人之中深喜義門之中李知本若夫四百年之漢三百年之唐洪儒碩學將相名臣皆由此途出不列於數者之目非為不足列也正以其全德備行不可列于一端以小之耳且西京儒者莫知楊雄氏詎可列雄于儒林乎東都循吏莫如卓魯二子詎可列卓魯於循吏乎李唐忠孝莫如狄仁傑詎可列仁傑於孝友忠義乎推此則知以一行而得名者不如不列於是科之為美史臣去取端有旨哉雖然班史之去取固善矣張湯杜周以殘忍深刻著名者也而不列於酷吏則何以衰慘刻之風范史之去取固善矣蔡琰失節于胡行非不醜也乃以其文采之故而傳諸列女則何以勵天下之婦節唐史之去取固善矣裴延齡姦佞之雄者也而不列於姦臣則又非春秋斧鉞之誅矣嗚呼自古名士多史才少班范諸子皆有良史之才而去取猶未盡當潛德之幽馨未必盡發巳死之姦諛未必盡誅此韓退之所以有人禍天刑之畏也第三道佩玉之禮尚矣在戴經則記其義於玉藻在周官則謹其藏于玉府在詩則詳詠於國風在論語則略見於鄉黨其他雜出於諸家之説者不可以屢舉玉藻記佩玉之義為最詳其大意則謂古之君子必佩玉在車則聞鸞和之聲行則鳴佩玉是以非僻之心無自而入又謂君子無故玉不去身故以玉比德焉此愚所謂記其義於玉藻者此也天官玉府掌王之金玉共王之服玉珠玉夫玉在先王之時特命官以掌之者非以充玩好之具為非常之寶蓋以君子不可一日不佩玉府之職不可一日不謹此愚所謂謂謹其職於玉府者此也詩於終南山戒襄公之篇因其能取周地始為諸侯受顯服而大夫美之曰佩玉鏘鏘蓋勉其修德以稱是玉也於大東刺亂之一篇而其辝曰鞙鞙佩璲不以其長蓋譏其居官職而非其才之所長徒有佩玉之美有女同歸之詩則曰將敷將翔佩玉瓊琚女曰雞鳴之詩則曰雜佩以報之以贈之以問之其刺惠公之詩則有觿韘之語是皆因佩而示美諷之意愚故曰詳詠於詩之國風者此也論語鄉黨一篇備記聖人出入起居飲食言語衣服之禮其言有及於玉者曰去喪無所不佩則知吾聖人之身未嘗一日去玉以苟燕息之安此愚所謂略見於鄉黨者此也韓詩外傳曰佩玉上有蔥衡下有雙璜牙蠙珠以納其間白虎通曰修道無窮則佩環能本道德則佩琨能決嫌疑則佩玦其略見於鄭氏之釋其詳見於孔頴逹之疏其遺制見於王粲之法此愚所謂雜出於諸家之説不可屢舉者也雖然佩玉謹於先王之時而廢於衰周之世後世學者雖讀禮讀詩讀論語諸家之書而目不習見其制耳不聞其聲終莫能考究其法而妄以臆見議之此紛紛之論所由而起也請因明問而論之玉左右各五而宫羽祉角之分在焉左佩雙衡者其音宫雙璜者其音羽右佩雙行者其音祉雙璜者其音角此宫角祉羽之分也夫樂備五音而佩獨不用商者蓋玉所以比德而商於五方則為西五行則為金於五常則為義而以剛果肅殺為事是可以為威而不可以為德此玉於五音之中所以獨去商也記曰古之君子必佩玉趍以采齊行以肆夏夫采齊者路門之樂節肆夏者登堂之樂節樂師以備王儀大馭以備五車是天子享元侯之禮而記乃以此為君子鳴玉之節何耶蓋經之所謂君子者乃指有位君子而鄭氏釋之謂君子者士以上其説誤矣此所以啓後世之疑也古者有德佩有事佩康成謂在君所則去德佩設事佩則知燕居德佩之外兼設事佩矣事佩子所以事父母使二佩不廢則金燧木燧大觹小觹不幾於贅乎愚切謂記言子事父母止及事佩而不言德佩則德佩必不兼設於事親之時又古者先設事佩後設德佩以事成而下德成而上故也二佩之設自有先後之序二者有一於此則不至於贅矣事佩不特君子有也婦人亦有之內則婦見舅姑左用亦五右用亦五是也德佩不特君子有也婦人亦有之詩曰佩玉之儺佩玉瓊琚是也考之內則與詩人之辭而君子婦人之玉無異則珩璜之制燧觹之施意其必同矣嗚呼佩玉之設所以尚德也然在君子佩之則為冝在小人佩之則為辱昔孔子為魯司冦而不設德佩事佩示巳無德事也夫佩在夫子可謂冝其德矣而以無位不設當時鳴玉而趍者得不愧於夫子乎得不辱斯佩乎詩人譏惠公無成人之德有成人之服故曰童子佩觹童子佩韘然則無德而佩者年雖成人行實童子也後之君子能於佩玉之際而思所以佩之之意設德佩則知所必修德設事佩則知所以立事如古人謹弦韋之戒則玉與身俱榮矣梅溪先生文集卷第十二
