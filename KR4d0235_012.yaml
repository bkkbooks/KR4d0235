  text: 梅溪先生後集卷第十二
  hash: sha256:fbc512a7cb7dc578d25f95e40106c6d20fe5cc97233a00b3acc47254aa920326
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_012-1a}
body:
  text: 詩𥘉到䕫州某甲申七月至饒州以表謝上云雖才非太公不能五月報政然忠猶杜甫未甞一飯忘君既而與諸公唱和有䕫字韵詩果有易䕫之命人以為䜟方力丐祠萝觀八陣啚乙酉十一月朔至䕫水落沙露宛然在目所歴山川皆少陵詩中景物也因成一絶用楚東韵分甘易守不勞麾夣巳先予到古䕫䜟語端符楚東韵忠懐雅合杜陵詩查漕元章生日十一月望日氣壓群隂首占陽生賢時莭自非常十分天上月輪滿一線人間日影長攬轡威名崖雪凛和羹消息嶺梅香要知三峡无窮水便是詞源与夀觴周漕行可和詩復用前韵并簡元章重聞鳴鳯瑞岐陽不比清齋老太常帝里别离頭併白䕫門邂逅日𥘉長詩篇照眼騰光艶蘭友傾心藹囯香天遣西来端有意要令我軰共壷觴又用行可韵二公海内姓名聞我亦追随到蜀門龍卧庐中嘆諸葛蛙居坎底陋公孫雨听巫峽萝時滴花看杜䳌啼処痕詶唱又成䕫府集論文欣對少陵尊行可再和用其韵以詶孤陋書生寛見聞西来端𣣔掃儒門懐人乆作周公萝訪道欣聞孔子孫周首篇語及中庸書爲爱民成再奏傳㙜再奏馬綱事淚因憂囯有双痕休論身丗无窮事但碩常陪北海尊又詶元章叱馭西来媿子陽舊交重見白眉常傷心鬼録人何短懐馮貟仲回首蓬山話更長䕫府並㳺容倚玉計䑓高選輟含香我非逸少君如謝聊継蘭亭曲水觴行可元章再賦二詩依韵以詶前篇寓二後篇寓三不學金仙李伯陽来從雄愈論天常亳鋒落紙一㙜妙詩艶驚人万丈長㑹見鵾鵬俱变化稔聞蘭菊各芬香盍簮聮席論文酒却咲囦明獨引觴朋淂西南直諒聞同行冝入仲尼門交成一体慕龍友政在諸家嗤魯孫雪唱紛纭臈天瑞詞源洶涌峡江痕二公如月如太白我亦影随同一尊元章贈餘甘子用前韵艸禀南方地近陽不随凡果當家常端因坡句声名重正類梅詩氣韵長東坡橄欖詩云待得餘甘回齒頰已輸崖蜜十分甜歐公讀梅聖俞詩云譬如食橄欖真味乆愈在回頰已輸崖蜜味返魂終共雪芽香与茶㝡相宜故人知我詩腸苦更贈蒲萄為薦觴行可骨肉自西州来用門字韵賛喜連夕西㙜咲語聞綵衣人戯綉衣門定知情話同元亮不用詩篇寄抱孫果見灯花将喜事寕愁江竹染啼痕世傳婦人詩云君看江上千竿竹不是男兒淚染班登堂濫作韓公客白首相逢十載尊呉叅議和詩用前韵以詶名景偲巴陵人万傾波瀾瑩岳陽氣鍾人物亦非常為郎堪嘆馮唐老治郡未施黄覇長呉吏事右髙比攝万州有声詩吐錦腸多麗髙蓮幕有清香穆生醴酒周璆榻不是區區為聞馬綱復行舊路聖主之恩諸公奏也元章用前韵喜而和之此三篇原缺無攷利愽仁言亟奏聞恩光万里烛䕫門綱舡巳免人鮓甕棧道不應愁鶻孫鶻孫愁村落烟餘烟火息斧斤㾗坐看巴蜀回生意放我歡呼到酒尊州縣有戒石飭官吏某至䕫之𥘉詩以自警云爾俸爾禄民膏脂下民易虐天難欺聖訓昭昭日月垂刻石于庭励官師臣庭堅字尤瓌竒光堯宸翰増光輝坤維門戸州名䕫庭前戒石筆畫微茫觀者疑太歳在酉嘉平時吉日丁亥刑命工㪯石少髙之一新欄檻嚴護持銀鈎照眼光陸離天威只尺顔不違虐民之事焉可為勿謂蒼蒼不吾知与爾同僚共孜孜出郊送虞叅政因㳺竹亭小飲與者九人送客出西郊天氣為我佳穿林看修竹偶与群賢偕邂逅適我碩三杯冩幽懐向来濤与戎此楽何繇諧立春巫峽逢生日䕫州見立春行年五十五羞作戴花人寄刘侍即韶羙流落天涯老病身帰心一點逐新春故人少借論思口放我山林作散人正月六日㳺磧呈行可元章踏磧逢為馬臨流想卧龍江山供指顧尊俎奉從容峡水淺還漲巫雲淡復濃天教我軰合莫惜罄金鍾呈同官樽前記淂少陵詩好向江頭尽醉帰此日風光真可惜古来楽事巧相違細看八陣啚猶在欲問三分迹巳非惟有年年古䕫囯竹枝声裏日暉暉買山䕫山皆童子買山植木以庇之惧芻牧之不禁作詩以告後人書生為郡亦迂哉剰買童山買木栽但遣牛羊勿錢履它年定出棟梁材給水䕫以竹筩引水見于杜詩以義泉名門則知昔之為州者不榷水而取錢也予始至聞公庫歳收賣木乎千余緡鈐轄司亦如之予以水給民俱后人廢之故作是詩接筒引水下山陬端為䕫民觧百憂長使義泉名不断莫教人費一錢求修壘夔成頗惡予修之雖雉枼一新然士城易壞兵有守城者勿它役随壊而𥙷則成常固矣莫将􅊇旅視居官直作吾家活計看墻壁時時為修葺安知劳苦是平安種柳東至夔唐西過社亶凡十余里種桺二千根後人或不斬伐則垂條聳榦當如桺子厚詩但愧无惠化傳耳瀼水東西十里餘新栽楊桺二千株㑹看聳餘参天去䏻佀甘棠勿翦無江月亭二絶長江何処水明月㡬州天月与江無約相逢是偶然江山今古㡬英雄割拠并吞捴是空惟有江流不轉石千秋長在月明中登真武山籃輿曉上小琳宮䕫子江山指顧中道士手栽山上柏身猶未老榦凌空上元山中百姓出㳺作三章諭之鄰里相呼入郡城巴歌楚舞沸歡声三宵㳺罷同帰去勉力耕桑事父兄三日嬉㳺喜遇晴还家又見麥青青伹須及早輸租稅莫要勾呼到訟庭好去耕耘隴上田但能勤苦有豊年家家飽煖身康健更向明年看月圓題諸葛武侯祠八陣啚旁丞相祠風雲惨淡㑹當時功成豈止三分漢才大非惟十倍丕渭上忽傳司馬走蜀中長起卧龍思我来再拜瞻遺像淚滿襟如老杜詩登詩史堂觀少陵畫像万丈光芒筆有神兩眉猶帶旧酸辛殘杯不復随肥馬賸馥端能丐後人䕫子江頭吟処景杜䳌声裏拜時身敬瞻遺像觀詩史一酹雲安麹米春送参議吴郎中扁舟西泝蜀江長邂逅論交淂老蒼幕客可䏻淹杜甫郎官誰復識馮唐梅花開日方聮事桺絮飛時遽趣装我過洞庭應有日定湏来掃盖公堂䕫州祀社稷于州之西五里地不盈畆壇宇􅋻陋垣墻頺圯非所以崇明祀也買地易路築屋増壇命同僚董其事不踰月告成二月戊子祀事既畢詩以記之天下通祀惟社稷次則曰雨曰雷風匈龍興弃配土糓是皆扵民有大功古䕫子囯今㑹府其於明祀可不崇西郊壇宇何太陋我忝守土責在躬廣而新之繄誰力蓮幕花縣謀僉同築垣旁近丹荔圃闢路下壓黄冠宫地有松柏兼可植時和黍稌行将豊䕫門社稷宋社稷碩与天地同无窮㳺卧龍山呈行可元章我軰逢山眼即青卧龍頂上喜同登啚留沙磧懐諸葛詩誦江濆憶少陵巫峽雲飛天一握瞿唐魚化浪三層俗謂瞿唐峡為龍門藍輿又向人間去回首林泉媿老僧聞詩淂男名之曰䕫夔乙酉十二月十九日生詩以二月二十四日作巫邑𥘉傳鯉是日巫山送双鯉吾家遂淂䕫遥来如馬地却應萝熊詩聞詩在番昜日萝熊入書院官沗二千石孫看第一枝欣同君子抱祝汝佀吾児甘露降于宅堂竹間凡半月三經雨乃止州宅有甘露堂昔周侍郎為郡露降焉易見山堂以名之予無善政惧其為灾記以二絶湛湛下脩竹味如飴蜜甘人言此為瑞无徳可能堪竹間甘露日瀼瀼飴蜜珠璣帶細香天閔䕫民歳飢饉雨暘時若乃嘉祥元章贈蘭英英道山友贈我深林芳入室与俱化同心如此香紉之可為佩不采庸何傷三復韓子操援琴鼓揚揚卧龍山有武侯新祠再用前韵山蔵古寺柏青青地重端因蜀相登沙上不聞江轉石人間幾見谷為陵龍蛇樹影揺千尺玉雪花枝吐万層堪嘆屮庐誰復顧凄然香火却依僧寄書与二叔二弟八十髙年林下老四千餘里萝中家雲安双鯉随春水為我傳書到永嘉左原端是脊令原誰遣分飛到蜀門况是清明寒食候杜䳌声裏断離䰟題卧龍山觀音泉呈行可元章去歲㳺庐山社中觀白蓮不飲逺公酒聊酌聦明泉肩輿過武昌乗㒷西山巔岩乳飲菩薩詩篇誦蘇仙武昌西山有菩薩泉東坡名之䕫州苦无井癭俗殊可憐竹筩喉不乾可浣不可煎日汲卧龍水屢頼檐夫肩所取都㡬斛深慙未投錢前日招提㳺入耳声㳙㳙泓澄可照膽中木皆光妍却疑南陽人蟠蟄清冷淵慘淡㑹風雲滂沱霖普天源如少陵詞清入光芒篇餘波漲瞿唐洶涌吞百川何人著水經漏此不及編道人出新茗林間手新研共以夷齊心来結觀音縁至今清夜萝猶到幽亭邊交㳺况離索回首成悽然元章移節西州何時鹿􅊯􅊯重訪山中禅僧言前日吾㑪将至山中鹿鳴元章贈筆戯成一絶東䑓使者妙詩文贈我中書四十君我不善書慚拜賜中書今日遇将軍再酬元章一尊方喜細論文春屮題詩又送君手握管言不盡詩壇誰復将中軍又荅行可道造精㣲更有文絳侯應媿不如君試将武事論詩筆句法嚴於細桺軍詶行可恵白酒渇懐思欲吸長江聞說西䑓醸滿缸一斗青州白從事忽隨詩句到蓬窓同行可元章報恩寺行香登佛牙楼望勝已山籃輿拂曉出東関鍾磬声聞杳靄間心欲報恩頻入院人逢勝已更觀山竹香细細禅房静江水渾渾野渡閑𣣔問漁人囯㒷廢黄鸝隔葉語緜蛮五月四日與同僚南楼觀競渡因成小詩四首明日同行可元章登楼又成五首蜀江險䖏是䕫州灔澦堆邊看競舟為報番昜相識道去年人在此登楼去五月四日㑹僚友于番江楼酒中分韵淂月字云明年何処更登楼遥望番昜江上月㙜前八陣巳陳迹水底三閭何処招手把菖蒲對佳節興来呼酒勸同僚番昜䕫子兩端午去歳人如今歳人兩年皆十六人直是吳頭来蜀尾子規声裏弔灵均榴花照眼對佳客荷葉傳杯懐故鄉想見明年話䕫子又如今歳念番昜黍遇今朝尽生角艾從何処忽為神荷香十里一鈎月定有扁舟帰去人舟人鼓楫呼何在声似湘沅江上声更听刘郎竹枝曲不論南北㧾傷情细葛含凬羅疊雪近臣𥘉拜賜衣時碩因角黍詢遺俗學士寕无六一詞競渡本来縁救溺陵波𥘉不為争標今人不觧古人意淂勝帰来咲語囂綵舟兩兩鼓鼕鼕勝已山隂瀼水東父老相逢話良苦児郎多在馬舡中劉韶羙至巫山寄詩因次其韵终日思帰未有涯萝魂无夜不還家莫雲春樹憶太白流水高山逢伯牙卷軸随身雖有厄韶美至狼尾灘失舟壞書籍風流得罪可無譁刘以收書致煩言相逢莫便怱怱去弭棹䕫門過食瓜送元章改漕成都取友四十載普天半交㳺蒹葭群玉間莫盛登瀛洲元章真囯士未見心已投雅抱畎畆志共懐天下憂舘閣育人材孰云專校讎慷慨論丗事不見范尹歐疆埸况如許寕不憂宗周精忠屹肝膽苦語驚冕旒君去㝡勇决我行尚遟晋𥘉别擬十載相逢忽三秋龍飛起元老江淮握貔貅禮羅淂竒才戎幕資良籌人事苦好違壮懐莫能酬去持䕫州節遥泛瞿唐舟我亦来自番兹行豈人謀八陣觀壮啚三峡窺倒流訪君義勝堂顧我制勝楼如馬謁白帝卧龍㝷武侯江亭覧月色園花賞春柔果分餘味甘蘭贈深林幽詩篇浩卷軸墨妙輝山丘氣薄文艶杜詞卑竹枝刘吏事容拙踈交情荷綢繆綸言下北闕綉衣使西州流錢豈君事易地曽何優胡不班玉笋入告嘉謀猷巴子囯㝡貧瘡痍民未瘳君去誰抚摩欲借嗟无由我已上祠章帰欤老田疇遟君還日邊寄書到東甌次韵元章晋别送客成都去回舟白帝邉月應遥共對䕫復有誰憐我只懐帰計君冝了丗縁相期翼吾道餘事讀楞圎夜與韶美飲酒瑞白堂秉燭觀跳珠分韵淂跳字五月峽中天氣歊竹筩引水那能澆江濆龍老卧未起崖石不枯珠自跳草草杯盤對君酌灯前疑是簷花落毫端冩出万斛珠共向炎天作氷雹妃子名園荔子丹絳嚢𥘉摘堆金盤細擘輕紅唱君曲咀嚼水晶牙頰寒老翁真箇如年少激水成珠堪一咲刘侯自有胷中珠不止照人兼自照儀鳳淂珠字别来世故朝昏殊相与言之汗模糊兩翁淂酒促坐席感深念極氣欲蘇籜龍亦觧作水供紬繹㝷丈如渇烏衣巾生秋背毛豎金石相應環佩趍江山豪壮旁尊爼醉中頻貫纍纍珠此時一事復掛口為楽未竟成喑嗚䕫州憂民困湯火潤澤有志无坦途眼前焦熬十万户欠伸戯咲皆霑濡自操量皷入官廩不輸一錢分水符讀書功力无表畔乆矣俗吏輕吾儒州民輸租淂自操㮣量免城中水錢以巳奉𥙷公帑比入境淂之民謡者次韵韶美失舟閔書醫師籠參术良将枕戈矢儒生嗜厎物書卷掛口齒刘侯西南来歳月十首尾閉門閱古今過眼分亥豕異書照神藜竒字哭妖鬼許身如蠧魚文字共生死風流反淂罪去囯果誰耻仙舟載祕閣便腹貯名理江神亦丗情逐客多不喜厄同焚書秦悪類㓕邢燬沾濡徧箱篋痛惜到骨髓我𥘉聞為驚終夜成坐起淂君詩細讀罪巳不罪水碩言㘴嘯餘書著子刘子韶羙帰舟過䕫晋半月語離作悪詩二章以送五載三詩送我帰古䕫今作送君詩相如㳺処符分竹諸葛陳旁舟觧維秉烛莫辞頻把酒揮毫未免各憂時可憐灔澦双蓬鬂㑹合无多又别離弱羽年来正倦飛䕫門邂逅故人帰人生一咲難開口丗事多端合掩扉况是桑榆俱晚景何曾冨貴已危機明朝悵望仙舟逺百尺髙楼上静暉州宅有静暉楼此篇用詔羙送元章韵元章至雲安用送韶羙韵見寄次韵以詶社燕秋鴻不共飛却因送别更懐帰一壺獨酌人何処千里相思月滿扉烟雨已催予把釣功名行看子投機雲安双鯉傳書至詩句清含山水暉静暉楼前有荔子一株木老矣猶未生予去其枯枝今歳遂生一二百顆至六月方熟木老生遟六月丹夔涪荔支皆五月間熟明珠百顆照朱顔因渠凬味思瑶柱東坡以荔支比江瑶柱撩我鄉心念玉環玉環妃子名也吾邑有玉環鄉路逺應难三日寄荔枝過一日則香色味俱変閩中荔支三日到永嘉楼髙更上一層攀君謨譜内丁香種宜在江陳品第間味甘而核小正如閩中丁香荔子行可和詩再用前韵肌膚氷雪鶴頭丹三峽相逢一破顔人折髙枝如折桂鳥衘餘顆似衘環香傳楽譜名尤重曲名荔支香紅入詩家句莫攀老杜有輕紅擘荔枝句来歳熟時先寄我夣䰟應到白雲間計䑓有白云楼行可再和因思前日与韶美同飲計㙜臨池摘實復用前韵星火燒空一夜丹来禽青李斍无顔少陵池舘三人賞丗傳計䑓乃少陵旧它今有祠堂白帝江山四面環生晚免教妃子汙食餘應許黒衣攀閩娘十八誰標榜未必風流佀此間坡詩亦及黒衣郎謂猿猴也又用韵呈行可神仙乞与返䰟丹枯木䏻成䖏子顔雅楽声中逢魏絳重圍觧後見齊環九齡賦妙那能継三峡詩高未易攀児軰莫言詶倡晚吾鄉食實在秋間夜来和詩児女軰云荔支巳過乃方作詩何也鄉里七月方食閩荔元章至萬州湖灘寄六言一絶云滿目莫山平逺一池雲錦清酣忽有鍾声林際直疑萝到江南某六月朔日登静暉楼觀江漲望西南碧逺数峯乃前日送别処也爲之黯然楼前荔子𥘉丹次韵寄元章遥碧峯尖如削䡖紅荔臉𥘉酣水漲江天渺渺故人一葉西南韶羙至雲安寄詩二首再用詩字韻以寄刘郎𥘉自日邊帰入峡殷勤寄我詩大小承天思越絶往在會稽韶美居大承天寺某居小承天今号能仁後先去囯㑹坤維分題應記跳珠夜送别還思入竹時千里遥遥共明月此心无合亦无離伏日与同官小飲瑞白堂觀跳珠分韵賦詩瑞白堂虚氷雪凝散為珠玉洗炎蒸詼諧未效東方朔賦詠聊追杜少陵伏日懐番昜同僚去歳番昜四望亭題分十二志同登眼中忽見天邊月不謂天邊是固陵餘干翁簿以予去饒之日郡人断橋見晋畫圖賦詩見寄因次其韵我慕鄭子真躬耕老岩谷不慕蘇季子腰金詫宗族失脚落塵網回頭念幽獨向来鴛鷺行進退慚碌碌把麾番君囯飲水清湾曲緬懐九賢人痛閔千里俗奉揚乏仁風黎庶因炎燠疇䏻政有成敢望諾无宿厚顔叨禄廩汗背擁旌纛命下忽夔門諸公孰推轂水陸三千里湖重嶺仍複至喜謁文忠秭帰懐李矗番人憐老守去類楚臣逐出門橋巳断擁道頞争蹙𥘉无龔黄政濫継秦侯躅仇香旧同僚别寄兩竿牘賦詩仍畫啚開卷宛在目清音滿干越餘韵到巴蜀我有二頃田荒蕪㕍山腹碩畫帰去来芒鞋事耕育贈裴童子文公有序規童子将聖猶言畏後生好把五車書盡讀五車讀了要須行行可生日六月十四日千載岐周鸑鷲聞果生英傑嗣姬文鯤鵬变化正六月蟾兎光輝将十分肯把威名争烈日只将道眼視浮雲祝公夀共詩書乆一瓣心香巳敬焚王嘉叟和讀楚東詩復用前韵以寄照眼􅌐珠光陸离莆田太守寄新詩死生貴賤交情見惟有吾宗不徇時嘉叟和黯字詩再用前韵以寄金谷冨季倫丑坐貴思黯人間㡬泉石豪奪在軒檻燕賀厦𥘉成花飛春忽减破甑任生塵只有莱蕪范和喻叔竒宿大木寺木記餘千大風觀楚囯雄吾詩晋大才君句壓雄風番水連天碧潘花滿縣紅叔竒攝邑安仁論文一尊酒何日故人同用讀楚東集韵寄元章誰遣吾㑪合又离江山深憶共題詩君舟西上吾東矣尊酒論文更㡬時納凉簾捲見山近窓𨳩竹香香訟庭公事少静坐納㣲凉立秋莭物催吾老天涯見立秋凉㣲金尚伏暑熾火𥘉流家遠思嘗稲年衰怯載楸䕫人立秋並簮秋葉歸耕期已近河漢望牽牛七夕去年佳莭呉頭見今久秋声峡内聞桂魄漸看成半璧銀河猶自掩㣲雲晒書空有便便腹乞巧𥘉无怪怪文為向天邊牛女道夫耕婦織莫辞勤懐畨昜一别番昜歲及朞䕫門又見食瓜時自慚政拙無遺愛安得民心有去思同官有録民謡見寄者齒落用昌黎韻我来饒與夔三載堕兩齒懸知季非永早悟仕當已要須未落時猛効二踈止胡為一再落不巳良可耻慨然懐古人未有長不死因思季方少輩行多勝巳顔紅齒牢㓗徃徃同逝水吾衰况如許寕復老彭比覧鏡視顔色今昨不相似行年五十五萬事可休矣功名與富貴磨㓕何足紀但願早還鄉俯育三百指婚嫁畢兒女松楸依怙恃弟兄飲真率故舊忘汝一兩齒牙任摇脫肉食吾不視有身乆為患無齒實堪喜始憂咲韓公可惜陋子羙未必傷我心兹言聞栁子梅溪先生後集第十二梅溪先生文集卷第十二論禹論堯舜禹皆聖人也惟其傳賢傳子之不同而後世不能無異論也自孟子之前人皆以爲禹徳衰故不傳扵賢而傳扵子萬章以是發問孟子辯其不然曰天與賢則與賢天與子則與子然後學者以傳賢與子一本扵天而無有以議禹也至韓子作禹對而其說又不然曰堯舜之傳賢也欲天下之得所也禹之傳子也憂後世争之之亂也堯舜之利民也大禹之慮民也深且謂孟子求其說而不得又從而為之辭近世善議論者莫如蘇子蘇子之言曰今夫人之愛其子是天下之通義也有得焉而思與其子孫人情之所皆然也堯舜之傳賢是不得已而禹之傳子盖聖人之不喜異也自萬章之問至蘇子之辯其說有四然而聖人至公之心卒未明焉以爲徳衰而傳子者是以迹論聖人其說也固陋矣而孟子歸之於天下亦未免乎不通也堯之傳舜舜之傳禹之傳子其大計固巳定扵生前不待身死之後始聽天命人心之自歸也謂舜禹避朱均而益避啓者其說盖亦不經矣韓子以爲憂後世蘇子以為不為異韓子之言也近正蘇子之言也近人情然皆未得夫聖人之心者盖聖人以天下為公噐其視賢扵子一也賢可傳而傳不以傳賢為踈而害天下之公噐子可傳而傳不以傳子為私而有慊扵心也昔吾夫子以大道而傳之學者夫以人情論之夫子豈不𣣔私其子哉然而過庭之訓止扵詩禮陳亢始以異聞為問卒以君子逺其子爲喜亢以私心量聖人而其問與喜皆不然也夫子嘗謂才不才亦各言其子者人之情也至扵所欲傳道之心視回與鯉一也堅髙之妙在回而詩禮之外無以吿鯉者豈親門人而逺其子哉使回如鯉鯉如回則詩禮之訓在彼而堅髙之妙在此矣道與天下皆公噐所以傳道與天下者不以賢與子而二其心然後為大聖人堯舜禹之傳天下如吾夫子之傳道堯舜非逺其子禹非親之也民之所安吾從而與之不知傳賢之為遜天下傳子之為世吾家尚何不得已與懼夫為異也哉若夫憂後世争之之亂而以之傳子者固可以為天下後世法矣原其所以傳之之心出扵以天下為公而視賢與子為一無有不得巳與懼夫為異之事亦非有憂之慮之之心而委曲為之計也愛其子而私有與之者人之情憂後世而為之計者君子之法不以親踈内外二其心者聖人至公大同之道知此三者之說然後知堯舜禹之不二其心而傳賢與子一也武王論事有出扵千載之逺而傳聞之不同吾将奚所考信邪愚曰聖人之言可信而時人親見之言亦可信也千載之事必存之扵書是書出扵聖人則可信不出扵聖人則可疑吾非信書而信聖人聖人之言如此吾是以知其如此也千載之事當時必有親見之者親見之言可信傳聞之言可疑吾惟親見之是信而缺傳聞之疑可也彼有聖人之言與時人親見之言兩不同焉則吾将誰信亦曰槩之以理而巳矣書載武王伐啇之事與時人親見之言不同學者疑之異論興焉此固冝槩之以理者秦誓曰惟十有一年武王伐商是十有一年者果誰之年邪上不繋之文王是必武王十有一年也武王果即位十有一年而後伐商邪史記載夷齊扣馬之諌曰父死不􅌾奚及干戈可謂孝乎武王必不歴十有一年之乆而不塟其父也書出於夫子之所序萬世之所取信而夷齊又武王同時之人亦不可以不信二者俱可信而其說不同則學者不得不疑而異論不得不興也漢儒之說曰文王之時虞芮二國質成于周諸侯並附以爲文王受命之年文王自受命九年而卒故武王曰惟九年大統人集是也武王終三年之䘮然後廣文王之聲卒其伐功故并文王受命之年而數之稱十有一也嗚呼果如是說則是文王受命稱王於商紂在位之時孔子何以稱其三分天下有其二以服事商乎是求十有一年之說不通而誣文王於不臣之地也近世大儒歐陽子作秦誓論断然惟書之是信而破漢儒之說曰十有一年者武王即位之十有一年耳復何疑哉歐陽子之言甚辯而近正然不信遷史載伯夷之諌非春秋所謂以信傳信者愚切謂書之所載者是遷史所記亦不虚十有一年者非武王即位十有一年周家受命之十有一年也或曰子方繆漢儒之誣文王何為復取受命之說乎曰文王非受命扵天受命於商也文王自羙里之囚還而紂以弓矢斧鉞賜之使得專征伐自是而後文王始居方伯連師之職五侯九伯得以征之扵是有遏宻伐莒戡黎之事自受專征之命至九年而卒然則文王受命者是受商命以專征伐非受天命以自王也武王嗣位二年繼文王征伐而觀政于商秦誓之作在周家專征十有一年之日武王未有天下之𥘉不曰惟武王十有一年而曰惟十有一年武王伐商則其㫖可見矣是則書與史記之年皆可信而漢儒之論歐陽子之所疑者皆可得而决也或曰子信聖人之書與時人之言而孟子不信武成非邪曰孟子非誠不信書也以不信而救弊也武王雖以至仁代不仁然兩兵之交寕無血刃者乎血流漂杵雖記事者未免文勝質而不可謂之盡無也當戰國之時有争地争城之戰盈城盈野之殺好兵之主與夫貪功樂禍之臣盖有以牧野之戰藉口者矣故孟子以不信而救之也春秋之法信以傳信者也疑以傳疑者也不敢以其所傳聞忽其所親見是亦教天下之信也况秦誓信書馬遷信史理有足信者乎愚故曰聖人之書與時人親見之言皆可信而二說不同者槩之以理而巳性論學者之患在於好言性性非學者之所不當言其患在於不知性而好為雷同之論也今天下雷同之論在乎孟子性善之說而以上中下三品者為才也一二師儒唱之學者從而和之唱之者主孟子和之者雷同也實非有所見而言焉性非可以無見而䡖言之者必待吾心有所見焉而後言之則吾之所言者是吾之所見也吾之所見者未必是又從質之而聖人之言吾心之所見與聖人之所言者有所合焉庻乎言之或當也夫子之言性者不可得而聞也其昭然著扵論語者有一言焉曰性相近也習相逺也繼之以唯上智與下愚不移夫子之言雖不詳吾可以吾心而求夫子之言也夫子性近習逺之言盖論天下之常性也而上智下愚不可以常性論也夫天之生上智也不數其生下愚也亦然惟所謂中人者紛紛皆是也故夫子舉中人而論常性斯有相近之說焉又懼學者執是而槩論天下之性復為上智下愚之說以别之夫子之論性固巳昭昭矣烏在其他求也夫上智之人天命之𥘉固巳上智矣雖瞽鯀不能移上智而愚下愚之人天命之𥘉固巳下愚矣雖堯舜不能移下愚而智惟不智不愚者是爲中人而非善非惡者是為相近方其生也無君子小人之别及其習也有君子小人之歸其猶水也方其同一源之𥘉可謂近矣及其派而二之則有東西南北之相逺也此聖人所以因性而立教者為天下常人設耳若無上智下愚之性其猶水火乎水之在土也其性有自然之寒雖善呵者不能奪而使之熟火之在木也其性有自然之熱雖善嘘者不能奪而使之寒水火不能奪寒熱之性智愚其可移上下之品乎今之說者謂堯桀同是性也嗟乎其不知性也是盖出扵孟軻性善之論軻非不知性也軻之論性将以設教而巳非為性立一定之論也至若荀况以性爲惡楊雄以性爲善惡混亦所以設教且救弊焉耳皆非為性立一定之論也軻曰性善是誘天下使其為善之是歸况曰性悪是懼天下使其惟悪之務去雄曰善悪混是開两端而使之自擇也其說雖不同其所以設教則一也况雄又以救弊焉者軻以善誘之而不從况出乎軻之後不得不以悪懼之况以惡懼之而不畏雄出况之後不得不開两端而使之自擇亦猶伊尹伯夷栁下恵制行之不同皆所以救弊也為性立一定之論者惟吾夫子與韓愈氏愈著原性篇有上中下三品之說此最合吾夫子所謂相近與夫上下不移者世乃謂愈之所論者才也非性也至謂夫子所謂上智下愚者而亦謂之才焉夫性之與才同出乎天有上中下之性者必有上中下之才性為之主才為之用也上智之性善矣發而為善則非性是才為之也下愚之性惡矣發而為惡則非性是亦才為之也上智下愚之性有自然之善惡其所以為善惡則才也是性主之而才應之耳烏有性無上中下而才獨有之耶天之所以命堯舜與吾夫子者必不惟桀跖之同學者冝以心求之慎無襲乎雷同之論而雜乎佛老之說則夫子之言性可得而聞而韓愈之所論者果性也非才也禘祫論諸儒禘祫之說何其紛紛不同也鄭康成謂祫大禘小王肅謂祫小禘大此小大之說不同也王鄭小大之說方淆亂未决劉歆賈逵之徒則又謂一祭二名禮無差降此一祭二祭之說又從而不同也鄭氏謂天子祭圓丘謂之禘宗廟大饗亦謂之禘王氏謂天子諸侯皆禘於宗廟非祭天之祭此祭天祭宗廟之說不同也詩閟宫傳云諸侯夏禘則不祫秋祫則不嘗漢光武詔問禘祫之說於張純純謂禘以夏四月祫以冬十月此夏禘冬祫之說不同也漢魏故事五年之間通計其數一禘一祫是出於公羊五年再大祭之說唐開元間太廟禘祫各自數年是又用禮緯三年一祫五年一禘之說此又年數之不同也鄭康成髙堂生則先三而後二徐邈則先二而後三此又先後之不同也自漢迄唐禘祫之議講之屢矣牽扵繁文異說終莫得而一之善乎歐陽子之言曰事有出扵乆逺而傳扵二說則奚從曰從其一之可信者然則安知可信而從之曰從其人而信之可也衆人之說如彼君子之說如此則捨衆人而從君子君子之說如彼聖人之說如此則舎君子而從聖人然則欲一禘祫之說當折衷於聖人之言可也春秋詩禮論語皆聖人之言也釋春秋詩禮論語者皆諸儒之言也春秋書禘者二而不言祫惟文二年八月丁夘大事于太廟躋僖公公羊榖梁釋之曰大事者祫也春秋有禘無祫以大事為祫者公榖也詩周訟商訟言禘者二而不言祫惟元鳥祀髙宗毛氏傳曰祀當為祫詩有禘無祫以祀為祫者毛氏也周禮太宗伯之職以肆獻祼享先王鄭氏曰宗廟之祭有六享肆獻祼饋食在四時之上則是祫也禘也周禮無禘祫之說以肆獻祼饋食為禘祫者鄭氏也論語記禘自旣灌而徃與或問禘之說孔安國釋之曰禘祫之禮為序昭穆論語言禘而不言拾并言禘祫者孔安國也惟禮記王制曽子問大傳有禘祫之說而亦未嘗言其禮之大小與年數之先後冬夏之異時至扵祭法則言禘交祖宗而不言祫仲尼燕居與祭統篇則言郊社禘嘗而不言祫王制祭義諸篇舉四時祭名皆曰夏禘而不言冬祫以春秋詩禮論語之言如此釋春秋詩禮論語者其言如彼學者當舍訓釋而從經可也從經則古者有禘無祫非無祫也祫者禘中之一事不可與禘俱謂之大祭也古者大禘之時群廟之主皆陳於太祖未毁廟之主皆升合養扵太祖因禘而合食故謂之祫是禘者總名祫者一事亦猶薦生薦熟之時則謂之薦灌酒求神之時謂之祼薦也祼也祫也皆大禘中一事不可以是三者均謂之祭名也後世因禮記諸篇有禘祫事遂以祫與禘俱謂之大祭殊不知禮記之所謂祫者是乃禘中之一事也又見公羊以大事為祫遂以祫為大於禘殊不知公羊之說出扵禮緯而春秋無是言也春秋所謂大事者即禘爾不曰禘而曰大事者禘所以審昭穆僖公逆祀昭穆乱矣聖人是以變禘之文而曰大事大是事也公羊求其說而不得遂援禮緯以釋經此所以啓後世之紛紛也或曰如是則劉賈一祭二名之說得乎愚謂劉賈之說僅矣而未盡也彼謂二祭一名者謂本無二禮也則一祭之說為僅得而不知禘者禘其祖之所自出祫者因禘而合食焉禘總名祫一事則二名之說為未盡或曰如是則廢三年之祫而用五年之禘必五年而一大祭乎愚曰廢祫之名而一之於禘可也五年而再大祭則公羊之說不可廢也鄭康成先三後二徐邈先二後三與夫秋祫冬祫紛紛不决之争舉可置也或曰三年祫五年禘自漢至今而用是說可廢之乎愚曰春秋詩禮論語非聖人之書則漢儒之說禮緯之言不可廢春秋詩禮論語果聖人之書也吾從聖人而廢異說胡為而不可邪君子能為可用論知所以為巳知所以為人又知所謂有天斯可謂有道君子矣夫何故君子之學求於為巳而巳𥘉無心扵求用也學旣足乎巳用自蔵扵中可以安人可以安百姓無所施而不可用者君子因其可用之資遇其當可用之時著其能為用之效至若人之不我用也君子必歸之扵天而有所不顧䘏焉苟以吾學可為巳用可以為人不察時之可否人之用舎必𣣔求試其所用幸而用則喜不幸而不用則懟甚者至扵自貶以求用是徒知為巳為人而巳而不知有天也烏可謂誠君子㢤荀卿曰君子能為可用継之以不能使人必用巳真確論歟君子之道有三其未逹也脩其所為用其旣逹也行其所當用不幸而不遇則䖏其所不用脩其所為用則能盡已行其所當用則能盡人處其所不用則能盡天故君子自㓜學之𥘉必修其能用之實謂将事君也必先學所以事父謂将治國也必先學所以治家謂将明徳扵天下也必先學夫正心而誠意在我之學旣巳盡矣推其素藴可以有為扵常世矣使不我用則已用則决不負所學焉以之效智扵二官則其用優扵一官以之䇿名於一國則其用優扵一國以之坐廟堂而權衡天下則其用優於天下是由能修其可用於未用之日故能行其所用扵當用之時也如此至若在我雖可用柰何人之不用我君子必将歛其可用之噐於一巳而未嘗汲汲以求售扵人韞櫝而蔵待價而沽居昜以俟姑盡其在天而巳又豈遺佚而怨阨窮而憫栖栖焉為不得志之人哉故善學君子者不止學其可用必學其可用而不得用學其可用徒能取利逹而巳而人皆可學學其可用而不得用斯能䖏困窮而爲聖人樂天之事也孔門弟子如賜之逹如由之果如求之藝皆能學其可用者故夫子許之以從政而不許其爲不可則止之大臣若夫可以有用可以䖏不用唯顔子一人而巳故許之以用舍行蔵之理又許之以唯我與爾有是夫回也生不遇時不獲著其有用之迹因其不用亦見其能處不用之賢矣嗚呼自生民以来孰有如孔孟之能為可用者乎又孰有如孔孟之不得用者乎又孰有如孔孟之䏻處不用者乎孔子嘗自謂用我則為東周孟子亦嘗自謂捨我其誰孔孟之言非自誇以求用也盖言其實可用者至於歴聘天下卒老干行也又未嘗不歸之於天故當陳蔡之阨子路有吾未仁未智之言以疑夫子子貢亦有不容盍少貶之言以勸夫子夫子以良農能稼而不能穡良工能巧而不能順君子能脩身而不為容之理以喻之孟子遭臧倉之沮隔而不得見魯侯不歸怨於臧倉而曰行止非人所能為也天也若孔孟者真可謂能盡天矣彼屈原者何人㢤一不見用於楚而離騷之怨興矣原以清死而後世哀之使原果見用亦未必能有為於楚盖其為噐固巳小矣荀卿亦迯䜛於楚者也以宗王之學至於廢死蘭陵亦可謂不遇矣卿不作離騷怨懟之辭而有不耻不用之語嗚呼卿賢巳哉上舎試䇿三道第一道昔先正司馬光論歴代君臣事迹始周烈而訖五季貫穿馳騁上下千載間書成於元豐中神宗皇帝嘉之錫名資治通鑑親灑宸翰以製其序且取前代之君以自况其言有曰漢之文宣唐之太宗所謂禹吾無間然者議者謂神宗聖徳具見於十九年事業之間巍然炳然可髙揖堯舜扵千載之上而乃俯比二三君何耶愚曰不然自古聖人徳盛則待人必恕實有餘則取名必㢘孔子以天縦之聖生民以来未之有而乃自比於老彭自同於丘明自以為不如顔淵可謂待人恕而徳愈盛取名廉而實益有餘矣然則神宗之有取於文宣太宗是亦孔子恕以待人㢘以取名之意也知吾夫子與神宗待人取名之意則知今日主上之有取於光武亦仲尼之意歟神祖之意歟夫光武之為君雖未可比隆三代盛王較之漢七制唐三宗之中寔為最優以春秋之法責之固未迯議論之域待之以忠恕之道固冝取所長而掩所短也請論光武之為人而侍與髙帝太宗陳之以發明聖志之萬一若夫主上盛徳大業自與堯舜三代同符非敢以光武比也夫七制之功莫大於髙帝三宗之功莫大於太宗以光武而擬二君則其功有若不及者嗚呼孰知其不及是乃所以過之耶髙祖太宗惟功之是慕而光武則以為不足慕故髙祖太宗以功顯而光武以徳稱髙祖誅暴秦㓕強項以三尺劍而造帝業可謂有不世之功矣然関中旣定馬上之事可勿論也而好戦之心老猶不衰至親伐匈奴而困扵平城之圍髙帝徒知干戈之可以立功而不知文徳之可以来逺當平城之圍足見百萬之衆不如虞階干戚之舞矣是冝異日在廷之臣欲斬樊噲之論兵也太宗取孤隋攘群盗以幾冠之年而定四方亦可謂有不世之功矣然唐室旣造晉陽之甲亦可觧也好大之心不能自足至親定四夷而困於遼水之役太宗徒知古人有攘却之事而不知聖人有兼愛内外之心當遼水之厄則知萬里親征不如漢文玉帛之聘矣是冝前日諌諍之臣見武徳之舞而不之顧也光武起扵軍旅非不知兵勇扵大敵非不知戦明明廟謨紏紏雄断非不足以務逺畧雲䑓之将上應列宿非不足以立邉功舉全漢之衆又非不足以横行四夷之中以快一日之志也而退然若一怯者口不談兵扵恢復之後何耶盖事有屈扵名而當扵實者惟盛徳者能之夫興師百萬拓地千里功若可喜也盛徳之主則謂彼民亦吾民何忍草芟獸獮之耶吾寕收愛人之實徳不必求名扵闢國也太師奏凱将士受賞君臣固可相賀也盛徳之主則思有褁糧千里巷哭飲泣之人是孰貽其禍耶吾寕使吾民之不傷不忍求戰功而生得色也得不毛之地以夸封疆之廣孰若保吾土之當扵實㢤臣無用之人以為民孰若全吾生齒之當扵實㢤髙祖太宗皆棄實徳以慕虚名光武獨能屈扵名而當於實故以藝文之講而代干戈以道義之論而代鞍馬以文雅之吏而代征伐之臣閉玉關謝西域卑辝厚幣以禮匈奴之使而抵掌撫劍之臣皆不得逞志扵當時其治天下一出扵柔道朝夕從事扵詩書爼豆之間而不知疲此所以賢扵髙祖太宗一等歟雖然光武之所以優扵漢唐之君者以其能偃兵也其不能比隆扵三代之君者用人之際未可人意爾光武以吏事而責三公以謡言而昜守宰此最其失之大者三公之職所以論道經邦非可以吏事責之湯不責伊尹以吏事而望之以一徳格天髙宗不責傅說以吏事而望之以朝夕納誨成王不以吏事責周公而望之以師保萬民光武不與三公坐論邦國之大躰而以吏事進退之非商周之所以待三公者冝其治效不及於古也守令之職所寄非䡖當以三載考績之法黜陟之非可以謡言而驗其賢否鄭子産古之遺愛名在循吏中方其相鄭之𥘉民興𣣔殺之謡使人君遽從而昜之則僑之聲名風采不復著於列國矣以吾夫子之宰中都曽未聞有誦徳之謡使時君必以謡言取人則造爲緋衣小兒之語以沮賢者多矣光武失於此是冝東都循吏反西京之不及也且光武之失又不止如是三公固不可以吏事責而光武之失尤在於未能擇三公守令固不可以謡言昜而光武之失又在於親擇守令夫三公之職非大儒不足以當光武乃以此䖏侯君房輩未聞其有卓卓過人者是冝嚴子陵問其癡而致語於使者以譏之雖起一卓茂於縣令及居廟堂亦無所建明其名固亦减於治宻時矣則知論道之任非可以輕處人也守令之寄雖重然非天子所冝親擇者天子擇宰相宰相擇部刺史刺史擇守令此人主簡要之術也光武乃以身任部刺史之軄冝其擇之不精而以謡言進退之使光武精意於一相亦何患天下無賢守宰也嗚呼至治之君不世出漢唐之可稱者止扵十數君而光武尤為盛徳猶不免有任人之失是冝以忠恕之道處之而勿至於責人無巳可也恭惟主上以仁聖之資撫中興之運誕敷文徳仰合有虞歸馬放牛同符周武𥘉非有慕扵光武而襲其陳迹也比因庭䇿多士特以光武發于清問草茅之士莫知聖志之所在愚獨妄意其處巳處人之際合吾夫子神宗之用心而明䇿下詢謂今日禮文經義問或酌光武之儀以出處或矯光武之失以示訓其迹盖有不同者愚切謂景至而禋祀元正而㑹朝建延閣以崇文闢成均而論秀此皆取法三伐非酌光武之儀而行之也寫六經于琬琰為學者式異端說禁止勿用以矯尊七經之䜟復春秋立三傳以矯罷黜左氏榖梁之失愚謂此皆黙契孔孟之用心亦非有意於矯光武而爲之也然用柔道以致平光武之所巳爲者而吾君固巳優為之任一徳以圗治吾君之所優爲者而光武負不能之愧矣雖然愚復有說以獻夫恕以待人廉以取名乃人主之盛徳而人臣之職則當以責難爲恭孟子謂不以仁義告王則斥以不欽之罪唐文宗嘗問群臣可况以何主鄭覃以文宣對爲李石所斥且以堯舜勉之夫文宗雖儒雅主然任人致治之際有不足稱者李石乃期之以堯舜使不以文宣自安况吾君盛徳實足以爲堯舜耶愚願執事當侍清問之際日陳堯舜之道以廣吾君稽古之志彼光武駁淺姑取其二三䇿可也第二道舉國皆儒則儒者之名不聞爲吏皆循則吏之名不聞爲士皆純徳野無遺賢則獨行逸民之名不聞爲子皆孝爲臣皆忠則忠臣孝子之名不聞愚嘗讀渾渾之書而得九官十二牧之爲人讀灝之之書而得伊尹伊陟傳說之爲人讀噩噩之書而得周公閑夭之徒之爲人彼皆大儒也當時不称其爲儒彼皆能致循良之治也當時不目之曰循吏彼皆爲忠爲孝也當時不指之曰某爲忠臣某爲孝子下至於鄉黨庠序之間不聞其有獨行山林草野之間不聞其有逸民自魯國之人以儒称則儒道衰於周矣自鄭相子産楚相孫叔敖以循吏聞則吏治始衰於列國矣自伯夷栁下恵以獨行著則天下之士始有尚偏之弊矣自長沮桀溺之徒以逸民而長徃則韜光鏟采於漁樵之間者多逸民矣自子胥以忠称於呉曽參以孝称於魯則忠臣孝子稀踈寥絶如參辰之相望矣嗚呼士以一行得名於時彼亦何等時耶西漢之有儒林有循吏非西漢之羙事盖自髙祖見儒服而慢罵而懦氣不振申韓之術行於世而吏治多出於刑名班固作西京一書表儒林循吏而出之所以傷漢之儒與吏也東漢之有獨行逸民非東漢之羙事盖自矯激之俗興士始流為崖異斬絶之行自㢘耻之風䘮時始貴髙舉逺蹈之人范曄作東都一書表獨行逸民而出之亦傷士之少純全時之多獨善也李唐之有孝友有忠義非李唐羙事盖自髙祖變節於晉陽而唐無忠義之風文皇行虧於閨門之内而唐無孝友之俗東史筆者表孝友忠義而出之盖傷當時忠孝之難能而僅有為足貴也夫天下皆有則所有者不勝書天下皆無則僅有者斯可書且西漢有商山之四皓非無逸民也有矯世之楊王孫非無獨行也而班固不立逸民獨行傳者盖以當時之士廉退者尚多無貴乎逸民行之全純者猶衆無取乎獨行其不以是立傳盖不𣣔使當時有逸民獨行之名也東漢有江革申屠蟠之類非不甚孝有李固杜喬之徒非不甚忠而范曄不立忠義孝友傳者盖以當時俗多孝友則孝友不可悉書人多忠義則忠義殆不一傳二傳之不立盖不𣣔使當時有孝友忠義之名也若無居儒林者二十有三人經術淵源者孔安國爲之最安國得聖人家傳之學非淵源乎在循吏者六人政治忠厚者蜀文翁爲之伯文翁興學校以化民非忠厚乎以獨行顯者二十有四愚切有取於范式式以信義行於朋友時人知其可以託死是固本諸賢聖而不爲矯激也以隱逸稱者十有七愚切有取於嚴陵陵髙尚其志卒不為光武屈議者謂其得聖人之淸是故樂在山林而不盗聲名也言言之烈史臣之所以賛顔叚蒸蒸之善栁宗元之所以銘李興然真卿秀實行非一端而不列於忠義愚獨於忠義三十七人之中深喜全節之張巡李興割股肉以進其親非名教之所愚獨於孝友十人之中深喜義門之中李知本若夫四百年之漢三百年之唐洪儒碩學将相名臣皆由此途出不列於數者之目非爲不足列也正以其全徳備行不可列扵一端以小之耳且西京儒者莫知楊雄氏詎可列雄扵儒林乎東都循吏莫如卓魯二子詎可列卓魯於循吏乎李唐忠孝莫如狄仁傑詎可列仁傑於孝友忠義乎推此則知以一行而得名者不如不列於是科之為羙史臣去取端有㫖㢤雖然班史之去取固善矣張湯杜周以殘忍深刻著名者也而不列於酷吏則何以衰慘刻之風范史之去取固善矣蔡琰失節扵胡行非不醜也乃以其文采之故而傳諸列女則何以勵天下之婦節唐史之去取固善矣裴延齡姦佞之雄者也而不列於姦臣則又非春秋斧鉞之誅矣嗚呼自古名士多史才少班范諸子皆有良史之才而去取猶未盡當潛徳之幽馨未必盡發巳死之姦䛕未必盡誅此韓退之所以有人禍天刑之畏也第三道佩玉之禮尚矣在戴經則記其義於玉藻在周官則謹其藏扵玉府在詩則詳詠於國風在論語則略見於鄉黨其他雜出於諸家之說者不可以屢舉玉藻記佩玉之義爲最詳其大意則謂古之君子必佩玉在車則聞鸞和之聲行則鳴佩玉是以非僻之心無自而入又謂君子無故玉不去身故以玉比徳焉此愚所謂記其義於玉藻者此也天官玉府掌王之金玉共王之服玉珠玉夫玉在先王之時特命官以掌之者非以充玩好之具爲非常之寳盖以君子不可一日不佩玉府之職不可一日不謹此愚所謂謂謹其職於玉府者此也詩於終南山戒㐮公之篇因其能取周地始爲諸侯受顯服而大夫羙之曰佩玉鏘鏘盖勉其修徳以稱是玉也於大東刺亂之一篇而其辝曰鞙鞙佩璲不以其長盖譏其居官職而非其才之所長徒有佩玉之羙有女同歸之詩則曰将敷将翔佩玉瓊琚女曰雞鳴之詩則曰雜佩以報之以贈之以問之其刺恵公之詩則有觿韘之語是皆因佩而示羙諷之意愚故曰詳詠於詩之國風者此也論語鄕黨一篇備記聖人出入起居飲食言語衣服之禮其言有及於玉者曰去䘮無所不佩則知吾聖人之身未嘗一日去玉以苟燕息之安此愚所謂略見於鄉黨者此也韓詩外傳曰佩玉上有葱衡下有雙璜牙蠙珠以納其間白虎通曰修道無窮則佩環能本道徳則佩琨能决嫌疑則佩玦其略見於鄭氏之釋其詳見於孔頴逹之䟽其遺制見於王粲之法此愚所謂雜出於諸家之說不可屢舉者也雖然佩玉謹於先王之時而廢於衰周之世後世學者雖讀禮讀詩讀論語諸家之書而目不習見其制耳不聞其聲終莫能考䆒其法而妄以臆見議之此紛紛之論所由而起也請因明問而論之玉左右各五而宫羽祉角之分在焉左佩雙衡者其音宫雙璜者其音羽右佩雙行者其音祉雙璜者其音角此宫角祉羽之分也夫樂備五音而佩獨不用商者盖玉所以比徳而商於五方則為西五行則為金於五常則為義而以剛果肅殺為事是可以為威而不可以為徳此玉於五音之中所以獨去商也記曰古之君子必佩玉趍以采齊行以肆夏夫采齊者路門之樂節肆夏者登堂之樂節樂師以備王儀大馭以備五車是天子享元侯之禮而記乃以此為君子鳴玉之節何耶盖經之所謂君子者乃指有位君子而鄭氏釋之謂君子者士以上其說誤矣此所以啓後世之疑也古者有徳佩有事佩康成謂在君所則去徳佩設事佩則知燕居徳佩之外兼設事佩矣事佩子所以事父母使二佩不廢則金燧木燧大觹小觹不幾於贅乎愚切謂記言子事父母止及事佩而不言徳佩則徳佩必不兼設於事親之時又古者先設事佩後設徳佩以事成而下徳成而上故也二佩之設自有先後之序二者有一於此則不至於贅矣事佩不特君子有也婦人亦有之内則婦見舅姑左用亦五右用亦五是也徳佩不特君子有也婦人亦有之詩曰佩玉之儺佩玉瓊琚是也考之内則與詩人之辭而君子婦人之玉無異則珩璜之制燧觹之施意其必同矣嗚呼佩玉之設所以尚徳也然在君子佩之則爲冝在小人佩之則爲辱昔孔子爲魯司冦而不設徳佩事佩示巳無徳事也夫佩在夫子可謂冝其徳矣而以無位不設當時鳴玉而趍者得不愧於夫子乎得不辱斯佩乎詩人譏恵公無成人之徳有成人之服故曰童子佩觹童子佩韘然則無徳而佩者年雖成人行實童子也後之君子能於佩玉之際而思所以佩之之意設徳佩則知所必修徳設事佩則知所以立事如古人謹弦韋之戒則玉與身俱榮矣梅溪先生文集卷第十二
