  text: 梅溪先生後集卷第十三
  hash: sha256:dc5b5ddd11362a8959457e6974f990540b68e8128b48c2aa6f52f2bdcd671759
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_013-1a}
body:
  text: 詩十八坊詩宣化聖主有美化丁寧戒守臣母令挂墻壁宣以及吾民刑清昔日循良吏獄空無怨聲刑清本無術心地要先清介福兹地有神宇人人來薦羞神雖能介福福亦自須求弭莭川峽天下險幾人持莭過好來平處弭莫起險中波皇華夔府皇華地乘軺都幾人誰如二使者實惠活斯民海陵查元章少城周行可同為夔漕措置偃折以寬民力蠲一路積負凡十余万緡時它路方進羡余興儒刀笠燒畬俗舟航撇旋鄉五經誰教子儒術破天荒崇化西接卿雲里東連屈宋鄉好風吹峽水盡作魯芹香𢡟遷相與勿言利要令通有無家家香一瓣心慕舜之徒豫某過此坊見多焚香者興龍欽宗皇帝母王皇后所生之地寺額曰龍興丗仰欽宗聖人知太毋賢千秋龍巳化香火蜀江邊卧龍非長陳夀贊無首杜陵詩廟貌并公論如今勝昔時慶豐誰道夔門陋兹坊號慶豐守臣憂國碩端似杜陵翁禮賓前山名勝巳夔子有嘉賓館闢自豫始愧非賢主人通津大江來自蜀衆水共朝東我𣣔扁舟去問津從此通義泉官費接筒竹民蠲沽水錢丁寧後來者莫負義名泉永安分鼎江山在受遺宫闕荒風雲時慘淡疑會舊明良折桂月窟何人到向來標傍新如今折桂者不止一坊人知足二踈歸去後林下少休官聖代夔門裏一枝栖故鵉談主簿棄官隱于是坊和風郡城深僻處車馬罕經過中有人多少人和風自和制勝樓絶塞依天險髙城瞰陳啚公孫曽帝蜀諸葛𣣔吞吳尊爼衝千里關山敵万夫人謀兼地利端坐靜邊隅中元日淂雨秋陽亢流火時雨洗中元既賀苗蘇稿還欣暑滌煩德知天地大功任鬼神言碩作老農圃一犂耕故園蘿覺偶成早秋良夜月朦朧夢覺涼生枕簟中𢾗點過雲簷外雨一聲落木隴頭風題無隱亝寄交代張真父舍人遙自不欺室來居無隱亝事君均有犯淂郡兩俱佳西蜀去何猛東甌歸末諧清風𢾗竿竹時見故人悁漕臺賞荷花因誦昌黎太華峯頭玉井蓮句遂用其韻呈行可天池水落華開蓮繡衣呼賔傾玉船賞花對酒誦隹句香徹鼻觀頭風痊韓公思摘太華實陶令不結東林緣何如君有第一朵池上許我清芬連池心𥘉開一朵再用前韻蘿􅋄池塘千頃蓮紅雲樓閣遊人船永嘉有蘿􅋄池紅雲樓董薰風日作夏供病不須藥花能痊朅來夔門念鄉國淨友喜結西臺緣明年華開各南北今日有酒冝留連張主管挕郡秭歸贈以三絶魏公名德最芬馨猶子傳家有典刑勉力施行誠與善民謡待向峽中聽女須歸處郡如何地狹民貧事不多把酒送行無别語要先撫字後催科政術遙傳京兆張笑談為治定循良諸生相見冝相勉正是風騷屈宋鄉蒲萄水晶馬乳薦新秋青𬗋酸甜孰味優只可堆鹽餉韓子不冝釀酒博涼州寄趙果州九江話别已經年三峽相逢豈偶然預掃江頭禮賔館論文尊酒菊花天寄閻普州對䇿天庭老布衣直言中已有危機須知東普勝西掖好買扁舟及早歸八月十二日雨七月之間旱如燬禱而淂之偶然耳八月又旱農無秋同僚勸效前日求我方省愆未及禱沛然一雨蘇群稿古人重請應上公何敢頻煩瀆蒼穹但碩時暘及時雨不獨一州天下普中秋對月用昌黎贈張功曺韻呈同官水精為鑑金為波挂空影寫山與河韓詩河韻在前清光此夜十分好有酒有客冝高歌去年今日行役苦浪叟溪邊宿逢雨去歲中秋宿瑞昌驛凡次山舊隱處傳聞蜀道如天髙崖懸壁絶哀猿號波橫劍戟不易上陸有虎豹何由逃江山舊恃白帝險風俗猶帶烏蠻臊驅馳兩月到西塞蘿寐万里還東皋嗅梅踏雪巴子里路入鬼門欣不死飛飛倦鳥惟思還玉筍豈是粗官班餘生但碩間及酒虛名寧顧觸與蠻良宵佳客十有五雲放月入尊罍間頽然老子興不淺韓詩坡句聊追攀君不見天寶雲霓羽衣歌人間樂舞難同科遺音猶在悲涼多舞霓裳隊有酒且飲遑恤他不飲如此良夜何盤古廟盤古千千古江頭遺像存伏羲猶後輩禮殿盡諸孫不屋昔非陋有祠今未尊東鄰二郎廟巫覡醉朝昏盤古祠止一間廟陋甚無祭祀者旁有二郎廟祀者甚衆趙果州之子年十四能作大字果州自荆南以詩寄豫命書之字晝老成異日必名家因贈以詩子政平生宜諒聞故應有子嗣清芬讀書行見破万卷識字豈惟能八分年少便冝觀上國詩成真可張吾軍校讎異日居天祿玉葉金枝有子雲送如上人蜀道青天不易登飄然雲水遇鄉僧芒鞋便欲相隨去身縛粗官愧未能十年作别稽山下万里相逢峽水西天下名山遊已遍好尋潛澗一枝栖州宅雜詠甘露堂昔日賢大守堂前零露甘我來無善政露下亦何堪萬卷堂書讀万卷破少陵觀國𥘉登堂吾有愧頭白腹空虗瑞白堂昔日曽夔州兹堂見三白為瑞不嫌多年豐最冝麥詩史堂誰鐫堂上石光艷少陵章莫作詩人看斯文似于長易治堂舊名整暇風俗無難易治之端在人古夔尤易治風俗本來淳唐李貽孫記夔州風俗云其賦易征其民不偷長吏淂其道蒞之若反掌耳細香堂舊名愚堂官舍誰為友青青只此君細香來燕寢奚用炷爐熏靜暉樓占淂高明地長聞燕寢香江流匹練白竹日万金黃制勝樓形勝據天險金湯無以過英雄多失守制勝在人和穿楊亭仁者果何似冝於射也觀穿楊不在手心地要須端無隱壘勿謂江湖逺長如天日臨事君何敢隱中外一般心跳珠分淂天池水跳成月峽珠一清夔子國炎瘴自今無土洞穴土誰為洞溫涼𣣔自私人間有寒暑坐此豈容知州宅有二土洞一在設斤之比一在靜暉樓之下冬可避寒夏冝取涼然久處其間則能發疾非天地之正氣也柏深山夔子國古柏靜暉樓柯葉今如許相看幾故侯荔誰種樓前荔周天幾歲星子隨心地赤葉到歲寒心竹郡亝誰種竹緑蔭未多濃我𣣔添清閟殷勤護籜龍柑白帝誰云陋黃柑亦自香一株三百顆風味自吾鄉前輩有滿城風雨近重陽句而不成篇九月六日遇雨因為足之招同官分韻滿城風雨近重陽凖擬登高尚渺茫會見明朝天氣好不教孤負菊花黃又用前句作七絶重陽無數日風雨登臨緩會見天氣佳黃花插須滿老對黃花莭遙臨白帝城空亝聽蕭瑟點點是鄉情江山悲木落身丗嘆飄蓬未會登山客先吹墮帽風巫峽有雄風菊天多細雨知我𣣔登髙先期洗塵土竹葉悲杜陵秋雲吟柳惲家鄉堆蕩遙莭物龍山近灰飛季秋管雲暗巫山峯我欲廓氛曀試呼黎與重莭近愁隂雨雲披見太陽殷勤呼酒伴爛熳醉秋光九日登卧龍山呈同官老逢佳莭強躋攀興繞東籬愧未還與客携壷登縹眇尋僧對榻卧幽間白鹽照日一峯古烏帽吹凬雙鬢班坐上無非孟嘉輩卧龍山却勝龍山又一絶夔子山髙峽天闊騷人宅近剛腸悲菊花上頭不易淂酒盞到手何須辭送何希深舍人赴召十年持莭國西門万里東歸德愈尊平叔淵源易論語子雲遊戲字方言坐令國體還元氣重見文星照掖垣廊廟諸公倘相問為言真𣣔老田園至瞿唐關戲用山名成一絶取友要如山勝巳居官冝似地青簾邊庭未靜尚赤甲鼎鼐𣣔調須白鹽連日至瞿唐謁白帝祠登越公三峽堂徘徊覽古共成十二絶瞿唐七日重來白帝城勞生逺宦厭將迎瞿唐莫下今冝下興逐漁舟一葉輕灔澦水漲瞿唐勢更危舟人貪進只嫌遲天將此石垂深戒看取形如象馬時白帝城火德重興六合同金行數止一星終鼎分雖愧劉元德面縛肯為安樂公越公堂柱國楊家二世亡越公遺迹獨綿長不能牢固隋基業枉費精神在一堂三峽堂三峽堂中看倒流沉舟側畔過千舟丗途險更勝三峽多少人懷積羽憂石筍白帝祠前石筍三根連灔澦立相參不知此石能言否往事應同老柏談有二柏甚古白鹽蜀中鹽井知多少功利端能與海分尚使此山真可煮商功計利更紛紛赤甲赤甲城連白帝城子陽曽向此屯兵區區板築徒勞耳尚赤由來是漢營東屯少陵别業古東屯一飯遺忠畎畝存我輩月叨官九斗須知粒粒是君恩昭烈廟老臣苦欲爭天下嗣子何曽思蜀中古屋數椽猶廟食傷心地近永安宫八陳啚一家天下裂三都忠憤填胸出陳啚千載相知惟白水此心元不為吞吳勝已山私心克盡道方大勝已與遊名始成物我太深誰氏子郤將已勝易山名有易為已勝者見啚經題無隱亝􅉉日照我几竹風清我襟官身心處士官舍趣山林送喻令捫膝先生有鳯毛三年魚邑試牛刀要令人𬒳絃歌化詎肯身辝州縣勞賢令首祠唐質肅詩篇時出楚風騷西歸更勉家傳學雲翼行看九万髙十月九日雪夔子今年雪𥘉冬已在山峯非是鹽白鬢不為詩班寒律三朝後五日立冬雷聲八日間二日雷潛催子猷棹乘興早知還食柑蕭山陸吉東坡傳夔子黃柑老杜詩楚越相望五千圼西州滋味獨儂知十日買黃菊二㭑十月更十日黃花開滿枝鮮鮮如可餐采采還自疑重陽不堪摘况後一月期既晚何用好兹言聞退之天然傲霜性寧問早與遲不以日月斷深杯為花持采菊啚淵明耻折腰慨然詠式微間居愛重九采菊來白衣南山忽在眼倦鳥亦知歸至今東籬花清如首陽薇梁彭州歸自道山泝流入峽以二詩見寄因次其韻首遇重華闢四門郡符帥閫誤蒙恩路經灔澦少陵鬢􅋄蘿池塘靈運魂馬運敢辝論水陸兵儲未暇議營屯故人相見談時事耿耿胸中直氣存壯夫白首兩同年又繼錢塘唱和篇十載音書天上堆一江風雪峽中船西州賢守淂高適東觀人才推孟堅𬗋陌曽陪探花馬姓名深愧在盧前梁彭州與客登卧龍山送酒二尊五馬携壺上卧龍四夔連騎與遊從山中古柏歲寒色應為清流作意濃天祿歸來楊子雲酒隨後乘為論文梁云舟中猶在淅酒雲安麴木瓶雙玉聊助詩人作小醺閻普州趙果州舟中唱和以巨軸見寄酬以二首聮舟西上沸歡聲趙壁隋珠照坐明一客詞流三峽水百篇詩壓五言城廣文舊舍欣重掃閻嘗為夔府教官阿買竒兒况侍行果州二子皆善作字我以禮賓名客館雲安麴米待君傾燈結寒花鵲有聲書傳雙鯉眼增明人言盡是靑雲士天遣相逢白帝城冨貴有機端可畏山川非險莫辝行定知蜀道從今易東普南充蓋巳傾丙戌冬千月閻惠夫梁子紹得郡還蜀聮舟過夔訪豫於郡亝修同年之好也因觀太上皇帝親擢御札及館閣題名感嘆良久輒成惡詩一章以紀陳迹且志吾㑪會合之異光堯親擢賜巍科粳秕居前有愧多書向蓬山俱點勘皆為校書郎詩從天竺共吟哦有遊天竺唱和十年尊酒喜身健五馬人生驚鬢皤豫與閻老矣梁方三十九然客鬢巳不及登第時握手夔門話疇昔君恩未報𣣔如何與二同年觀雪于八陳果州會焉酌酒論文煮惠山泉瀹建溪茶誦少陵江流石不轉之句復用前韻吾㑪風味雅同科領略江山逸興多諸葛陳啚上看少陵詩句酒中哦惠山活水煎茶白勝巳高峯帶雪皤絶境况逢三五馬定將好句壓隂何惠夫子紹二同年懷章過夔宗英趙若拙聮舟西上賦詩二首記吾三人會合之異次韻仍簡二同年端似唐人會合年句追籍徹孟韓聮朱幡俱任専城寄白首叨持帥閫權鼎甲豈如天聖榜果州詩歷舉天聖以來鼎甲之宗盟不減德麟賢客真不惡主人惡勝巳山名自古傳夔州前山名勝巳晚菊鮮鮮梅蘃新天涯對酒忽三人才高不比丹青相志大聊為州縣臣梁彭州麾把普彭夔子國榜同詹愈季元賔二公行矣居廊廟放我江湖作逸民與惠夫若拙小酌郡亝再用聮字韻并寄子紹子紹已行杯盤􅋄􅋄酌同年更與英英玉葉聨我輩論交真有道異時當國碩無權䇿蒙親擢言尤直御批閻䇿云盡言無隱召不留中已足賢果州召對不晉天遣西來結詩社郵筒毋惜往來傳三友堂閻梁二同年過夔把酒論文于小書室既别因目之曰三友丁丑同年友三人忽此逢符分俱握虎簮盍偶成龍撫卷神山逺銜杯瑞雪濃一壷勝太白形影月遊從生日老遇懸弧旦天涯把一麾誤蒙嵩嶽句忍誦蓼莪詩莭物梅經眼年華雪上眉兒曺觴夀酒盡是祝歸期觀畫像似我豈真我相看還自疑陋非臺閣像高失布韋時吟苦眉常皺憂多鬢早衰惓惓畎畝志無復畫師知杜殿院挽詞流落杜陵老平生一飯忠大賢冝有後異代果生公文艷神藜燭霜蹄御史驄九原呼不起蕭瑟桓臺親擢逢明主臺綱振一時觸真同獬豸問不到狐狸姦佞巳落膽江湖甘把麾賢哉郭有道無愧蔡雍碑我昔遊三館聞公論立朝端如平日語果不小人饒公每云某饒淂君子不饒小人莭義真齊固年齡不逮喬英魂巳上天楚些詎容招會同僚于郡齋煮惠山泉烹建溪茶酌瞿唐春錫泉龍焙忽飛來春著瞿唐𥘉潑醅腸似玉川堪七碗興如太白謾三杯月團不許無詩淂霜蘂端因有分開王撫幹以晚菊一盆耒頗佳石銚瓦盆吾已具竹林它日定相陪同僚和詩復用前韻掃地焚香待客來煎泉瀹茗漉官醅相公溪近何曽汲灌東有相公溪以丁謂淂名水可煎茶白帝城寒正可杯江上詩成風葉落閣中興動雪梅開嘉賔飲散鈴亝靜月照虛窗有影陪蠟梅天工著意點酡酥不與江梅鬪雪膚露滴蜂房釀崖蜜日烘龍腦噴金爐万松張蓋黃尤好三峽藏春緑不枯東南蠟梅葉落始開峽中地暖花開而葉不落題品倘非坡與谷世人應作小蟲呼宋山甫知縣云大寧監多蠟梅土人不知貴呼為狗蠅花子紹至雲安復和前䪨見寄酬以二首細閲皇朝進士科第三人最淂賢多滕建道陳了翁張才叔潘子賤諸公是也然皆艱難勞苦而後有立不勞則餓天將任或起而僵帝欲哦館閣早推仁者勇廟堂終作國之皤也知有意東山卧其奈蒼生望子何梁臨别指瞿唐關有懶出此門之語不比求遊占一科無施不可患才多手持江海一麾去蘿與神仙七字哦客裏有書情愈重别來多病鬢添皤郡亝獨坐歲華莫眼見官梅深憶何趙若拙卓爾不群佳公子也痛親不見名堂曰思諸公爭賦之不鄙豫亦以詩命豫謂若拙不止乎思也且能顯之作思堂詩天下人子皆思親思而顯之能幾人入堂省親親不見長向羹墻見親面身苟不立名不揚九原何由發幽光金枝挺挺賢公子風樹興悲思不已口誦孝經苐一篇立身行道期心傳直諒多聞古三益標凖宗支名籍籍前日召還胡不留一麾出守西南州官聀人心所同欲孝子思親恐親辱不獨思親能顯親孔門曽子君前身我愧思親未能顯詩作思堂涕徒泫題朱鈐幹灝無喧室雅抱淵明尚處喧思避喧門雖有車馬趣不異丘園仁者本來靜時然應亦言端能重吾幕無復優為煩糟蟹薦杯麴生有理何曽濁公子無腸却最佳羅饌寧同冨兒飲帶糟聊慰老叨懷梅溪先生後集卷第十三梅溪先生文集卷第十三問䇿問二十八宿在天為經星循環往來以成四時非若北辰居所一定而不移也然自古志天文者皆以角亢七星為東方之宿奎婁七星為西方之宿自井至軫宿七為南自斗至璧宿七為北抑嘗仰觀之四時晨昏迭為出沒行皆自古靡有定方而乃以蒼龍朱鳥咸池元武分宫以四之何耶舉天星以定四時莫如堯典按堯典以定四方蓋有可疑者焉在時為春則方為東也朱鳥南方列宿爾乃紀之春在時為夏則方為南也大火東方中星爾乃紀之夏西為秋其宿白虎也乃正仲秋以北方之虛北為冬其宿元武也乃正仲冬以北方之昴將考四時以定列宿之方堯之時與方乃爾不同何也吕氏月令載十有二月昏晨之中星可謂詳矣然以仲春之月昏弧中而不舉七星至季春則曰昏七星中仲夏之月昏亢中而不及大火至季夏則曰昏火中記牽牛中於仲秋之昏而不及星虛記東壁中於仲冬之昏而不及星昴其與堯典又差錯不同矣左氏論祭祀之時則曰龍見而雩論士功之時則曰龍見而畢務龍見固有常時而雩與畢務之時𥘉不同也左氏皆曰龍見抑又何耶諸君晝觀經傳夜觀星斗其於列星之躔次所見之晨昏固巳洞然於胸中矣觀象定方何以驗其為東西南北耶與夫堯典吕令左傳所載之異同必有成説以一之也問昔禹治洪水隨山濬川别天下為九州其詳見於禹貢後世言地理者咸根本於斯焉然即其書而考之有不能無疑者梁𡵨二山雍州之地也而于兾州言之曰既載壷口治梁及𡵨雍州之山不容記于兾豈兾方自有所謂梁𡵨者乎不然則九州名山其訛者不止於梁𡵨矣沱潛二水名也而於荆梁二州各記之曰沱潛既道二水不容經歷兩州數千里之逺豈兩州之地各有所謂沱潛者乎不然則九州大川其訛者不止于沱潛矣其敘山於九州之末自導岍及岐而下則四逾于河自壷口雷首而下則回入于海自導嶓冡而下則曰過九江至于敷淺原天山靜物也豈能逾河入海過江者耶禹何以驗其然也其敘漢水自嶓冡導𪷟而下既曰南入于江匯澤為彭蠡矣又曰東為北江入于海其敘江水自㞴山導江而下既曰會于匯矣又曰東為中江入于海夫江既與漢合且匯為彭蠡矣江豈復于北而漢豈復為中江耶禹何以驗其然也近世有以地脈論山者取於漢儒之三條有以水味論江者取於唐人之三沴禹之於山川豈亦以脈與味而知之乎漢儒三條唐人三沴亦有可驗否乎願詳考而備論之問昔夫子自衛反魯而六藝之文粲然不幸火于秦踳駁于漢耳口異傳源流遂别言昜者本田何田何之後有施孟梁丘之學並立博士又别有京費二家今之所宗者王弼也不知弼之學出施孟梁丘歟京氏費氏歟惟而上之果得孔子授商瞿之旨否歟言詩者有齊魯韓毛四家毛在當時未立于學今之所宗者毛氏不知齊魯韓自何世而微歟毛氏自何世而興歟萇之學也果得孔子授子夏之旨否歟言書者本伏主又有歐陽大小夏侯之學又有孔安國者得古文尚書今所宗者孔氏傳也歐陽夏侯在漢為最盛不知何所自而微歟孔安國之書未行而遇禍不知何代而興歟孔壁所藏伏主口授亦有異同否歟禮之經有二曰周官者周公致太平之興也曰禮記者孔子弟子撰所聞而記之也二經之始出也果何時其始傳也果何人其名家也凡幾輩今為之章句者皆鄭氏也又豈無授受之自歟春秋之傳有五今所傳者左氏公榖也三家在漢迭為盛衰孰始盛而後衰歟孰始衰而終盛歟彼杜預何休范寧者為三家章句亦各有所受歟六經者日用之書也學者口不絶吟久矣專門之傳授歷代之廢興其有闕而不知者耶夫經傳一也有興于前而廢于後衰于古而盛于今者果何致而然豈興而能久者傳之當廢而遂絶者傳之非耶抑各繫時之幸不幸耶與昜之十翼詩之五際書之十例禮之三種春秋之五始考之必有其名究之必有其義願併陳之庶觀諸君之傳問六經皆經也而夫子過庭之訓首及于詩則詩之為經學者所宜先也詩有風有雅有頌讀者不能無疑於其間二南皆文王詩也而繫之二公弼鄘衛皆衛詩也而分為三國蟋蟀晉風也而謂之唐七月陳王業也而繁之豳黍離平王詩也而同於列國此風之不能無疑也南有嘉魚美太平之君子也而列於小雅鳬鷖亦美太平之君子也而列于大雅宣王刺於小雅而大雅則無刺焉厲王刺于大雅而小雅則無刺焉幽王大小雅俱有刺康王大小雅則無詩此雅之不能無疑也頌者美盛德之形容而告於神明者也周有頌冝矣魯僖諸矦耳曷冝有頌哉三百篇皆周詩也商異代之王耳曷為而列于周之末哉此頌之不能無疑也學者豈徒習其章句識其鳥獸草木之名而巳耶因疑而究其義斯可與言詩矣至於風之正變者凡幾國大小雅之正變者凡幾篇與夫三頌之或先或後者何義諸君聞詩久矣必有起豫之辨問昔吾夫子討論墳典敘書百篇上自唐堯下迄秦穆其于去取之際莫不有法焉固異乎左史倚相之流徒能誦其文而巳聖人既沒經厄于秦口授壁傳紛然異説學者開卷莫決所疑夫斷書自堯則堯典者固唐書也而謂之虞禹平水土而後作貢則禹貢之作在唐虞之際而謂之夏舉書之詳者莫如左氏如莊八年僖二十四年二十七年襄二十六年所引之書皆大禹皋陶謨之辭也而悉曰夏書釋傳之詳者莫如杜預預以書證左氏所稱者固未嘗亡也而多謂之逸書夫以唐為虞以虞為夏聖人序書不應如是之踈而左氏授經亦不至如是之誤也而杜預以存為逸預豈不知書者耶至若武成一篇記武王偃武修文之事也夫子既有取焉而孟子乃不信之楊雄謂虞夏之書渾渾商書灝灝周書噩噩四代之書固不同也而韓愈乃謂周誥商盤詰屈聲牙雄異商周書而愈同之抑又何耶諸君皆深于書者也願辨夫子之所以序左丘明之所以稱杜預之所以注孟子之不信楊韓之異同者以告問昔夫以洪範九疇卑禹至箕子為武王陳之孔子序之於周書王者治天下之法莫大于是焉然其書有可疑言有可疑箕子為武王陳之者又可疑不可以不辨也自𥘉一曰五行至威用六極先儒謂此六十五字皆洛書本文夫天且無言安得有書畫一以告人如是之詳悉耶有謂𥘉一曰之類二十七字禹所加也有謂欽用農用之字洛書本有也又有謂龜文止二十字餘皆禹增益次第之也其説紛然不同亦何所考據耶或謂河圗洛書本無有也聖人以神道設教耳其説為如何箕子之言曰鯀湮洪水汨陳其五行帝乃震怒不卑洪範九疇自古以來得九疇於天者止一禹耳未聞餘人有得之者使人皆得之而鯀不獨得也可以言帝怒矣鯀與衆人均不得之何以知其為怒而不卑耶鯀九載之績弗成殛之於羽山者舜也未聞天震怒之者箕子之為言無乃失之誕乎或謂帝者堯也堯有洪範九疇久矣怒鯀而不之卑其説又如何至於九疇莫不有用也而五行之用為最大乃反不言用八政莫不有官以掌之獨三卿舉官餘皆指事五紀獨不言時五福獨不言貴其理又何在耶箕子商臣也其不臣周冝矣而乃為武王陳洪範洪範大法也不冝言而言其可以為臣子法歟聖人序之曰武王勝商殺受立武庚以箕子歸作洪範二事若不相預而序輒及之豈聖人之意罪箕子之不當言耶洪範之書學者所冝盡心也其可疑有如此者碩與諸君辨之問昔吾夫子以謹嚴之法而作春秋寓賞罰之權于一字當時口授弟子而其書未顯也後世傳經者三家各有所聞著之簡䇿非特旨意不同而經文亦異人一而巳曰尹氏卒者公榖也左氏以為君氏是果男子乎果婦人乎國一而巳曰祀侯來朝者左氏也公榖則以為紀侯是果姒姓乎果薑姓乎渝平輸平字止半差而其義則反子伯子帛音雖小異而其説則殊曰蒿艾曰鄗者一地也名若何而可稽曰繆曰穆者一君也諡若何而可考此曰衛寶彼曰衛浮則人物異矣此曰伐戎彼曰伐我則華夷異矣以會為及則內外之志異矣以送為逆則往來之使異矣北杏曹南之會或侯齊宋或人齊宋則尊卑之辭不同矣寧母葵丘之盟或有鄭衛或無鄭衛則增損之數不同矣至若義同而文異則有帥率克尅之類焉豈亦有異義乎名一而音訛則有括結嘉喜之類焉豈亦有異名乎經出于聖人之手而有二三之不同唐趙氏嘗考其差繆凡二百六十處夫聖人以一字為褒貶而三傳經文相戾如此一字之異一義之異也一義之害一經之害也將左氏而是信乎而公榖釋經亦辨矣將公榖是信乎而左氏紀事亦詳矣如之何則可今三傳並行于學非若漢唐之尚偏專一而廢二也探討之際並有至當之論以折衷之勿云三傳可束之髙閣遂略而不論問班孟堅作漢書嘗序六藝為九種然出吾夫子之親筆者惟春秋與孝經學者沉潛六藝之外其於二經尤不可不熟究聖人有作之旨也子亦嘗曰吾志在春秋行在孝經則聖人𣣔為東周之志固存乎二百四十二年之筆削百行之美當備見於十八章之中矣今讀二經亦有見吾夫子之志與行否乎考諸行事亦盡合於經否乎二書之成也夫子嘗有春秋屬商孝經屬參之語矣是二子在孔門中商必有得于春秋參必有得于孝經也商與參言行著於當時淵源傳諸後學不知其得于經者亦有可見否乎果不負聖人所屬之意否乎孟子嘗謂春秋成而亂臣賊子懼説者乃謂絶筆之後口授弟子至漢然後其書始出果如其言則當時列國君臣固未之見也何以能懼亂臣賊子耶遷固之徒皆謂孔子為參作孝經説者又謂經不為參作蓋假參以為對揚之體爾二説亦莫知其孰是耶諸君兒時讀孝經巳能志其語學習春秋固巳探其奧其於聖人之志行與夫弟子之所學及孟軻遷固諸儒所説之不同必能辨其所以然者問秉史筆者衆矣司馬遷為之宗自班范而下雖人自為家其大槩則沿襲史記之舊夫既述前代之法以成書不必變其名例可也今考諸史乃或不然非特班固有變于史遷後之作者亦互有損益異同矣曰紀曰表曰書曰世家曰列傳者司馬氏之書也班固因之獨昜書為志而損其世家范瞱之史猶固也而損其表陳夀之史猶瞱也又損其志至晉書則有紀有志有傳而益其一曰則記南北獨紀傳而隋加志焉唐紀表志傳與班史同五代有紀傳有世家有附緑有考夫記事之義一也而立例之名不同何耶子長每一卷之未稱太史公以斷善惡孟堅昜之以贊蔚宗又孟之以論而贊以四言陳夀又昜之以評晉書或稱制或稱史臣又贊以章句與范史同南北曰論隋稱史臣唐書仍班史之體曰贊五代贊如唐而沒其名夫斷善惡之義一也而名所以斷者又各不同何耶遷書曰史記兩漢晉隋唐則曰書三國則曰志南北五代則曰史夫歷代皆史也其所以名書者又何不同耶創之于前者是則變之于後者非同之于後者非則異之于前者是抑創之變之同之異之亦各有其義耶至于自史遷以迄五季歷數之則十有七略舉之則有三又其可以不知耶諸君皆飽于史學者也姑以其淺者告我問中庸一書蓋聖學淵源入德之大要也説者謂孔子之孫子思所作觀其微辭奧旨非聖人之後命世大儒有不能者焉然其間立言措意亦有戾于吾夫子者證以論語繫辭不得盡合學者疑之語曰中庸之為德也其至矣乎聖人以中庸為至德非大全君子不能當其名是書載夫子之言有君子之中庸有小人之中庸夫既巳小人矣尚何中庸之有耶夫子以一貫之道語曽參參告門人曰夫子之道忠恕而巳矣是書乃有忠恕違道不逺之言則是以道與忠恕為一而忠恕實未可以為道也與論語又何不同也繫辭曰昜之興也其於中古乎作昜者其有憂患乎蓋謂文王也是書載夫子之言曰無憂者其文王乎文王拘美里而繇昜乃云無憂何也語曰三分天下有其二以服事商周之德可謂至德矣是書載夫子之言曰武王周公其逹孝矣乎善繼人之志善述人之事文王終身事紂武王周公不待終喪而伐之而云善繼志述事何也語曰夏禮商禮吾能言之𣏌宋不足證也是書乃曰吾學夏禮祀不足證吾學商禮有宋存焉又未知其熟是耶天子傷周室之衰三光五嶽之氣分故春秋書王正月以大一統是書乃曰書同文車同軌孔子之時天下曷嘗同車書乎弟子記聖人之言行於論語皆稱子如子曰及子以四教之類蓋尊師重道之辭未嘗有字聖人者是書亦稱于曰冝矣而又有仲尼曰仲尼祖述堯舜之語焉豈有身為聖人之孫而字其祖者乎竊意秦火之後漢儒于四十九篇中綴拾所存不能無附益之偽不然何以詭異聖人如是也孟子學子思者也七篇之書稱子思多矣獨無一言及其師之書又不知是書果子思作否耶必有以辨其疑者問唐史臣劉知幾著史通內篇稱古之作史者有六家一尚書二春秋三左傳四國語五史記六漢書又謂尚書家出于太古春秋家出于三代左傳國語出于丘明史記漢書出于遷固知幾最善著論而唐史稱之其所列六家必有考據然理有可疑者不得不與之辨書載堯舜三代之事春秋出于吾夫子之親筆學者尊之以為經不可誣矣知幾乃同遷固之書而史之可乎左傳國語雖曰二書然同出于一丘明之手實左氏內外篇也而乃别為二家可乎史記創始于馬遷而班固雖自為一家其大法則祖述子長也今乃别為二家之流者是則范瞱陳夀而下又烏得不以名家乎以理論之書春秋經也左氏國語傳也史記漢書史也至于史家者流持一馬遷為倡爾見其有一未見其有六也知幾著其始末條例甚詳合經傳而為史别一姓而二家散史漢而二流則必有説焉又謂尚書四家其體久廢所可祖述唯左氏及漢書不知後世秉史筆者果法左傳漢書二家之遺乎抑亦兼出于六家者乎不然則知幾之言必有所不通者願因其説而詳辨之問國莫重于禮禮莫重于祭祭有禮異而名殊者四焉曰天曰宗曰望曰䄍是也岐而分之其數二十有三天宗各六望三而䄍八古人行之固有一定之典後世異同之論起紛然而莫之正禮曰以禋祀祀昊天上帝又曰兆五帝于四郊此六天之説所由起也有以為上帝與五行精氣之神者有以為一天與五人帝者有以為北辰耀魄寶與靈威仰赤熛怒含樞紐白招拒汁光紀者異説凡三家將何從而合成周之祀乎書曰肆類于上帝禋于六宗此六宗之説所由起也有曰時曰寒暑曰日曰月曰星曰水旱者有曰星辰司中司命風師雨師者有曰天地四時者有曰乾坤六子者有曰六代帝王者有曰三昭三穆者異説凡十餘家將何從而合虞舜之禋乎三望書于春秋或以為泰山河海或以為泰山淮海或以為分野之星及封內山川則三望之不同亦三家也八䄍見于郊特牲曰先穡曰司穡曰田畯曰郵表畷曰貓虎曰防曰水鄘曰昆蟲或以貓虎為二神而昆蟲不與焉則八䄍之不同亦二説也四者之禮先王之所常行四者之説諸儒不勝其異夫𣣔舉先王之禮而行之必先正名而定制茍牽惑於紛紜之論而不能斷決其是非雖曰有其舉之莫可廢也不失之誣則失之陋矣如之何其可哉國家郊祀盛典三歲一行宗望之祭兼修並舉又將因時和歲豐修伊耆氏故事勞吾農而休息之甚盛舉也諸君行將筮仕與禮樂之議敢問前代諸儒立異議者誰歟孰當孰否漢之君舉是禮者誰歟孰得孰失必有至當之論以祛群言之惑幸詳著于篇將獻于朝俟有司之擇焉問行帝道而帝行王道而玉行伯道而伯此五帝三王五伯此所以分學者固巳稔聞而熟論之矣漢朝錯於大對之際嘗品藻其君臣其言有曰五帝神聖其臣不及三王臣主俱賢五霸主不及臣抑嘗考其迹而驗錯之言未免何疑也五帝唐虞為盛典謨載其行事為最詳觀堯舜禹皋陶稷契之徒相與都俞戒敕于廟堂之上𥘉不見其主優臣劣之迹錯何以知其不及也三代之君臣可稱非一其間固有主聖臣賢者錯概以俱賢目之亦豈通論耶五霸臣主若無甚相逺者以管仲之志小烈卑上可為威公之佐耳其他又可知謂主不及臣抑又何耶錯以賢良文學裒然為舉首必有所據而言諸君出入經史啇確古今亦必有見其臣主不相及與俱賢處如錯所言敢問風后力牧至元愷之徒不及主者果何臣齊晉宋秦楚之霸不及臣者果何主夏商周之君臣所以俱賢者果何事也幸明以告我母詆錯言為非而略之問世之論士者不惟其身之觀亦觀其師友源淵然後可以知其人矣洙泗七十二子不必論其為人以吾夫子卜之可以知其賢蘇秦張儀二子不必觀其行觀其所學者鬼谷子爾則知其為儀秦也雖然執此而論士有大不然者曽參以孝著於孔門得參之學而行之者冝其以孝而施於有政也孰謂喪母不歸殺妻求將者反出參之門哉荀卿以中庸之學而為大儒得卿之學而用之者謂能必行王道也孰謂燔詩書滅禮樂者反出卿之門哉老子著五千言明道德之旨得其學而行之者冝其清淨自正無為自化可也孰知後世刑名法理之術至於苛刻少恩者反出於宗老氏者耶不特此也斯之學用於秦者至慘矣意其學斯者又必甚于斯也漢河南守與斯同邑固嘗學焉治行乃為天下第一申韓之術施當時傳後世者至不仁矣意其學之者必有甚於申韓洛陽才子本名申韓乃能陳治安之䇿雖王者之佐亡以加前四子者所學善矣用之反不善後二子者所學不善矣用之反善兹又何也謂不在師友淵源耶洙泗曷為而多賢儀秦曷為而皆詐謂必在師友淵源耶諸子之行事與其所學又何其戾也諸君擇師尚友之日久矣於師友淵源必能究之碩陳數子之所以然者問荀卿論王霸興七之道其言有曰上一而王下一而亡且以法始佐賢民願俗美四者齊謂之上一觀湯武之所以興與桀紂之所以亡信乎卿之言不妄也漢髙帝之創業光武之中興唐太宗兼創業守文之功德是三者亦可謂後世之盛王也考漢唐二史而驗所以興之自不知果出于上一乎抑亦雜出於上下偏之間乎三君者其孰優而孰劣乎秦隋之世天下統一然二國皆遽興而遽亡其興也豈出于上一其亡也又豈盡出于下一耶謂不出于此則何興亡之遽謂必出乎此抑何上一下一之道始終變昜之異也碩併陳漢唐秦隋之迹以佐荀卿之説問昔孟子對齊宣王謂仲尼之徒無道桓文之事董仲舒對江都昜王亦謂仲尼之徒雖五尺童子羞稱五霸果如二先生之言則霸者之事不復道諸聖賢之口也今質論語春秋容有不然語稱威文之譎正又稱九合之功仁管仲而大其賜春秋善召陵之盟進成濮之戰至宋襄楚莊秦穆雖不足與二伯之烈皆有以一概見取者孰謂無道其事而羞稱之耶豈聖人于霸者猶有所取而門人弟子乃喜攻而羞道之耶夫子與人何恕而弟子責人何嚴耶不然則二先生之言失矣願與諸君辨之問唐虞以三載考績之法黜陟百官之賢否故時躋極治庶績咸熙漢唐遵遺法而行之其治效亦有可觀者洪惟國朝列聖圖治既以進退選舉之權付之宰相吏部又以舉刺按察之職委諸郡守監司逮元祐𥘉先正司馬光以清德雅望起慰蒼生進賢退姦中外恱服又嘗議立八條俾監司守臣察所部官吏有仁惠公直明敏廉謹者可舉則舉苛酷狡佞昏懦貪縱者可按則按條目詳密誠一時之良法然當時事未施行而議已中寢邇者宰臣有請上嘉而行之議者咸謂唐虞之泰和元祐之清明可復見于今日矣或謂法非不良也行之苟非其人不能無弊將有權勢請託親故干求而舉非其實者挾情懷怨務快私忿而劾不以公者苟二弊之不去則八條將為文具有不可得而行先朝之良法美意又從而廢矣伊𣣔革其弊而久其法必有術焉願講論之將以聞于上問自古用人之方多出乎薦舉然薦舉之患有二焉不可不知也有公於薦舉者可以得人矣或失於知人不明而所舉非賢有明於知人者可以得賢矣或蔽於竊位之私而見賢不舉諸葛亮之於蜀非不𣣔薦賢也而失之馬謖蓋明有所不足臧文仲之於栁下惠非不知其賢也而不與立蓋心有所不公夫所賴乎大臣之薦舉者以其公與明而巳二患不去而𣣔得人可慿恭惟主上當寧興歎懲前政之蔽賢乃命邇臣各舉所知起廢滯而應公車者踵相躡也邇者臣僚獻言慮所舉之或濫而賢否混殽以三人同薦為請議者猶懼其未盡薦舉之方而徒艱進賢之路伊𣣔知人必明如簫何之識韓信而無孔明誤舉之失所舉必公如祁奚之舉善而無文仲蔽賢之私如之何則可問昔吾夫子因魯史而作春秋信以傳信疑以傳疑雖以大聖作經猶不敢以其所傳聞而忽其所親見至於其所不知則缺如也其慎有如此者其後有孟子者出則不然其讀書也則曰盡信書不如無書吾於武成取二三䇿而巳其讀詩也則不信周餘黎民靡有子遺之言夫子信而好古如此孟子學孔子者也乃於詩書猶有所不信何耶後世諸儒因孟子之不盡信詩書而好為異論往往於古之信書信史皆不能無疑於其間詩大序世傳為子夏作久矣而唐韓子不信之春秋漙為丘明釋經久矣而啖趙之徒不信之昜繫辭為天子作無疑矣而近代歐陽子不信之至於疑五千言非老子所作有如崔浩疑答蘇武書非李陵所作有如劉知幾有謂周禮非周公之書家語非孔氏之書文籍去古稍逺而見疑於後世者非一五經且不見信而况其他耶夫孟子之不信詩書也以血流漂杵與夫子遺之言誠有不足信者而後世諸隭所疑經史其亦有所見如孟子否耶抑亦出於穿鑿而好為異論耶豈歷世浸久簡編漏傳傳聞繆誤實有可疑者耶其所疑亦必有得有失而不可以一槩論耶信其所可信疑其所可疑斯善觀書者也願與諸君辨之而斷以髙明之見梅溪先生文集卷第十三
