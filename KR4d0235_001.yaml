  text: 梅溪先生廷試䇿卷第一
  hash: sha256:3c3e0415ab1617f6439f8c2bd7c02d7dd461a8ba4a4493c962b41ef0c297fd0c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_001-1a}
body:
  text: 御試䇿問蓋聞監于先王成憲其永無愆遵先王之法而過者未之有也仰惟祖宗以來立經陳紀百度著明細畢舉皆列聖相授之模為萬世不刋之典朕纘紹丕圗恪守洪業凡一號令一施為靡不稽諸故實惟祖宗成法是憲是若然畫一之禁賞刑之具猶昔也而姦弊未盡革賦斂之制經常之度猶昔也而則用未甚𥙿取士之科作成之法猶昔也而人才尚未盛黜陟之典訓迪之方猶昔也而官師或未勵其咎安在豈道雖久而不渝法有時而或弊損益之宜有不可已邪抑推而行之者非其人耶朕欲參稽典册之訓講明推行之要俾祖宗之治復見於今其必有道子大夫學古人官明於治道藴畜以待問久矣詳著于萹朕將親覽臣對臣聞有家法有天下法人臣以家法為一家之法人君以家法為天下之法人君之與人臣雖名分不同而法有小大之異至於能丗守其法者則皆曰權而巳人臣能執一家之權守一家之法以示其子孫則必世為名家人君能執天下之權守其家法以為天下法貽厥子孫而施諸罔極則必丗為有道之國蓋法者治家治天下之大具而權者又持法之要術也今陛下親屈至尊廷集多士訪治道子清問之中首以監于先王成憲恪守祖宗之法為言是則陛下欲守家法以為天下法者固巳得之矣臣獲以一介草茅與子大夫之列仰承聖詔其敢不展盡底藴茂明大對以為陛下遵祖宗守成法之獻邪臣之所欲言者無他焉亦曰欖權而巳嘗謂君者天也天之所以為天者以其聰明剛健司慶賞刑威之權而不昧也君之所以為君者以其能憲天聰明體天剛健司慶賞刑威之權而不下移也天執天之權而為天君執君之權而為君故天與君同稱大于城中而君之名號必以天配以天道而王天下也則謂之天王以天德而子兆民也則謂之天子居九五正中之位則謂之天位享萬夀無疆之祿則謂之天祿五服五章者謂之天命五刑五用者謂之天討就之如日者謂之天表畏之如神者謂之天威居曰天闕器曰天仗法曰天憲詔曰天語天之大不可以有加君之大亦不可以有加者以其咸能司域中之權而巳矣恭惟陛下藴聰明之德體剛健之資躬親聽斷動法祖宗一詔令之下而萬民莫不鼓舞者如天之雷風一德澤之布而萬民莫不涵泳者如天之雨露開衆正之路社群枉之門而萬民莫不恱服者如天之清明為政日新日日新又日新而萬民莫不拭目以觀者如天之運行而不息巍巍乎蕩蕩乎固不可以有加矣而臣猶以法天攬權為言者蓋陛下之德雖不可以有加而臣子之心每以有加亡巳而望陛下此臣所以昧死盡言而不知諱也臣伏讀聖䇿首以監于先王成憲其永無愆遵先王之法而過者未之有為言次及于祖宗立經陳紀列聖相授之道又次以今日奉行而不能無四者之弊為問臣有以見陛下知致治之道在乎守成憲遵祖宗欲革今日之弊也臣切謂陛下能攬福威之權率自巳出則成憲有不難守祖宗有不難法時弊有不難革天下有不難治凡所以䇿臣者皆不足為陛下憂矣不然陛下雖勤勤問之臣雖譊譊誦之無益也臣觀自古善言治之人未嘗不以攬權為先自古善致治之君亦未嘗不以攬權為先惟辟作福惟辟作威惟辟玉食臣無有作福作威玉食者箕子告武王之言也天下有道禮樂征伐自天子出至于無道則自諸侯大夫出者孔子垂戒後世之言也謂慶賞刑威曰君君能制命為義者左氏記時人之言也謂堂陛不可以相陵首足不可以相反者賈誼告文帝之言也此臣所謂善言治之人未嘗不以攬權為先也三皇官天下者攬福威之權以官之也五帝家天下者攬福威之權以家之也三王計安天下而歷年長且久者攬福威之權以安之也漢宣帝善法祖宗之君也然其所以能守祖宗之法致中興之業者無他焉以其能革霍光專政之弊躬攬福威之權而已觀其總核名實信賞必罰齋居決事聽斷惟精而神爵五鳯之治號為吏稱民安功光祖宗業垂後裔者蓋本乎此也光武亦善法祖宗之君也然其所以能守祖宗之法建中興之功者無他焉以其能鑒西京不競之禍躬攬福威之權而已觀其總攬權綱明慎政體退功臣而進文吏戢弓矢而散馬牛建武之政號為止戈之武系隆我漢同符髙祖者蓋本乎此也唐明皇善法祖宗之君也然其所以能守祖宗之法致開元之治者以其能革前朝權戚干政之弊躬攬福威之權而巳𥘉明皇鋭于求治姚崇設十事以要説之其大概則勸其攬權也帝自謂能行由是勵精為治責成于下而權歸于上矣憲宗亦善法祖宗之君也然其所以能守祖宗之法致元和之治者以其能懲前日沾沾小人竊柄之弊躬攬福威之權而巳𥘉憲宗鋭于致治杜黃裳懼不得其要勸其操執綱領要得其大者帝嘉納之由是勵精為治紀律設張赫然號中興矣此臣所謂自古善致治之君未嘗不以攬權為先也陛下懲前日權臣專政之久收還福威之柄運獨化于陶鈞裁萬機於獨斷天下翕然稱陛下為英主凛凛乎漢宣帝光武唐明皇憲宗之上矣而臣尤勸陛下攬權者非欲陛下衡石程書如秦皇帝而謂之攬權也又非欲陛下傳餐聽政如隋文帝而謂之攬權也又非欲其強明自任親治細事不任宰相如唐德宗而謂之攬權也又非欲其精於吏事以察為明無復仁恩如唐宣宗而謂之攬權也蓋欲陛下懲其所既往戒其所未然操持把握不可一日而少縱之使福威之柄一出於上不至於下移而巳臣切謂陛下欲守祖宗之法莫若躬攬福威之權欲攬福威之權又莫若行陛下平日之所學五經泛言治道而春秋者人主攬權之書也陛下聖學高明緝熙不倦萬機之睱篤好此書固嘗親灑宸翰以書經傳刋之琬琰以詔學者矣邇者又命儒學近臣於經筵講讀之是則夫子二百四十二年行事之書固已默得於聖心之妙至於其間可謂攬權之法者臣請為陛下誦之春秋書王曰天下者所以為人君法天攬權之法有書王不書天者所以為人君不能法天攬權之戒書朝書會者欲朝會之權必出于天子也書侵書代者欲征伐之權必出於天子也書僣禮亂樂者欲其收禮樂之權也書僣賞濫罰者欲其收賞罰之權也權在諸侯則譏之如踐土之盟之類是也權在大夫則刺之如雞澤之盟之類是也先王人而後諸侯者欲權在王人也內中國而外夷狄者欲權在中國也書盜一字者所以戒小人之竊權也書閽一字者折以防刑人之弄權也凡一字之褒重於華衮者皆所以勸人君攬權以作福凡一字之貶重于斧鉞者皆所以勸人君攬權以作威臣願陛下尊聖人之經行聖人之言以是正天下之名分以是定天下之邪正以是成天下之事業則何患乎不能監先王之憲遵祖宗之法革今日之弊邪臣伏讀聖䇿曰仰惟祖宗以來立經陳紀百度著明細大畢舉皆列聖相授之模為萬世不刋之典朕纘紹丕圗恪守洪業凡一號令一施為靡不稽諸故實惟祖宗成法是憲是若臣有以見陛下謙恭仰畏不以聰明自居必欲行祖宗之法以致中興之治也臣以謂陛下欲法祖宗以致治又不可不法春秋以攬權臣謹按春秋有變古則機之之書有存古則幸之之書有復古則善之之書經書𥘉獻六羽者譏隱公不能守祖宗之法而輕變先王之樂也書𥘉稅畝者譏宣公不能守祖宗之法而輕變成周之徹也此所謂變古則譏之者也書猶三望者譏僖公不郊而幸其猶三望書猶朝于廟者譏文公不告朔而幸其猶朝于廟此所謂存古則幸之者也襄公十一年書作三軍者譏其變古也昭公五年書舍中軍者善其復古也此所謂復古則善之者也書曰無作聰明亂舊章詩曰不愆不忘率由舊章漢惠帝用曹參守蕭何之法而海內晏然武王用張湯取髙皇帝之法紛更之而盜賊半天下守祖宗之法者其治如此變祖宗之法者其亂如彼為人主者其可自壞其家法耶我太祖太宗肇造我宋之家法者也真宗仁宗至于列聖守我宋之家法者也先正大臣若范質趙普之徒相與造我宋之家法者也在真宗時有若李沆王旦寇凖在仁宗時有若王曽李迪杜衍韓琦范仲淹冨弼之徒相與守我宋之家法者也側聞慶曆中仁宗出御書十三軸凡三十五事其一曰遵祖宗訓二曰奉真考業三曰祖宗艱難不敢有墜四曰真宗愛民孝思感噎故當時君聖臣良持循法度四十二年之間治效卓然者蓋本乎此又聞熙寧中先正司馬光于經筵進講至蕭何曹參事謂參不變何法得守成之道且言祖宗之法不可變也異日吕惠卿進講立説以破之謂法有一年一變者正月始和布法象魏是也有五年一變者巡守考制度是也有三十年一變者刑罰世輕世重是也光隨而折之曰布法象魏布舊法也非變也諸侯有變禮易樂者王巡守則誅之王不自變也刑新國用輕典亂國用重典平國用中典是謂世輕世重非變法也觀二臣之言亦足以見其人之邪正矣陛下自即位以來固未嘗不遵守祖宗成法比年有出于一時申請權冝而行者致與成法或相抵梧邇者陛下靣諭群臣謂國家政事並冝遵守祖宗今又發于淸問以求致治之效臣有以見陛下得持盈守成之道真仁宗之用心矣然臣復以攬權為言者蓋春秋譏時王失攬權之道故諸侯遂有變法之弊今陛下欲守祖宗之法宜用春秋賞罰之權以御之可也大臣有清淨如曹參者宜命之持循忠正如司馬光者宜俾之討論變亂如張湯者則誅之異議如吕惠卿者則斥之如是則祖宗良法美意可以垂萬世而無弊矣尚何患乎天下之不治哉臣伏讀聖䇿曰畫一之法賞刑之具猶者也而姦弊未盡革臣有以見陛下欲行祖宗之法在乎明賞刑以革弊也臣切謂欲姦弊之盡革不可不法春秋以攬權蓋春秋之法非孔子之法也成周之法也故杜預曰周公之志仲尼從而明之經有書賞者如錫命威公錫命文公錫命成公之類皆所以譏時王之濫賞非周公之賞也有書刑者如殺其大夫放其大夫殺其公子之類皆所以譏時君之濫刑非周公之刑也時王失周公賞刑之法不能革當時之姦弊故仲尼以筆削之權代之善勸而淫懼焉我祖宗制賞刑之法載在有司畫一之章昭然可覩創之者如蕭守之者如曹未嘗有濫賞也而賞必當乎功未嘗有淫刑也而刑必當乎罪歷世行之弊無不革者蓋以聖祖神宗能攬權於上而群臣能奉行于下故也故司馬光自為諌官及為侍從嘗以人君致治之道三獻之仁宗又獻之英宗又獻之神宗而其二説則在乎信賞必罰也三宗既用其言以致極治矣光以清德雅望執政于元祐之𥘉躬行其言以革時弊進退群臣邪正之甚者十數人天下皆服其賞刑之當一時之弊亦無不革者我三宗真盛德之君而光亦可謂救時賢相也效者陛下躬親萬機一新時政斥逐姦邪登用耆舊禁錮者釋告訐者誅兹賞刑之至公而革弊之甚大者也聖䇿猶以姦弊未革為憂者豈今日朝廷猶有僣賞濫罰如春秋時乎臣不敢不陳其大槩夫人主賞刑之大者莫若進退天下之人才今陛下每進一人必出于陛下素知其賢親自識擢可也不然則出于大臣侍從公心薦舉可也不然則采于輿論而天下固人皆曰賢可也茍不出于三者而一旦遽進之則議者必曰某人之進也出于某人隂為之地也如是則一人之濫進有以損陛下作福之權矣陛下每退一人必出于陛下灼如其罪震怒而賜譴可也不然則出于諌官御史公言論列可也不然則得于僉言而天下國人皆曰有罪可也茍不出于三者而一旦遽退之則議者必曰某人之退也出于某人隂有以中之也如是一人之誤退有以損陛下作威之權矣昔舜舉十六相而天下稅其賞之當去四凶人而天下服其罰之公陛下茍能以祖宗制賞刑為法以虞舜用賞刑為心執春秋賞刑之權以御之則何患乎姦弊之不革耶若夫有某勞進某秩以為賞犯某事得某罪以為罰此特有司之職耳非人主福威之大者臣不復為陛下言之也臣伏讀聖䇿曰賦斂之制經常之度猶昔也而財用未甚𥙿臣有以見陛下欲行祖宗之法在乎𥙿財用以經邦也臣切謂欲財用之有𥙿又不可不法春秋以攬權謹按春秋書臧孫辰告糴于齊者譏莊公不莭國用一歲不熟而告急于外也書𥘉稅畝者譏宣公不莭國用變成周什一之法至于履畝而稅也書作丘甲者譏成公不節國用至于以丘而出甲也書用田賦者譏哀公不節國用至于用畝而出軍賦也春秋書告者不宜告書𥘉者不宜𥘉書作者不宜作書用者不宜用臣由是知春秋賦稅之書為人君節用𥙿財之訓明矣昔孔子對齊景公之問政不曰政在生財而曰政在節財有若對魯哀公之問年飢不告之以生財之術而告之以盍徹臣又知𥙿國之術實在乎節用也側聞太祖皇帝有言曰我以四海之冨官殿悉以金銀為飾力亦可辦但念我為天下守財耳豈可妄用古稱以一人治天下不以天下奉一人嗚呼大哉言乎真可為萬世子孫保國之訓也又聞仁宗聖性尤務儉約器用止于􅃮素衾褥止用黃絁嘉祐間臨軒䇿土出富民之要在節儉以為御題時吕溱賦曰國用既節民財乃豐仁宗恱之擢為第一觀仁宗取士命題之意又真可為萬世子孫保國之訓也又聞熙寧𥘉司馬光王安石同對論及救災節用事安石曰國用不足者以未得善理財者也光曰善理財者不過頭會箕斂以盡民財民窮為盜非國之福安石曰不然善理財者不加賦而上用足光曰天下安有此理天地所生財貨萬物止有此數不在民則在官譬如雨澤夏潦則秋旱不加賦而上用足不過設法隂奪民利其害甚于加賦此乃桑洪羊欺漢武帝之言太史公書之以見武帝不明耳司馬光之名言真可謂節用理財之法聚斂毒民者之深戒也陛下自和戎以來兵革不用二十年矣是宜倉廩冨實貫朽粟陳如成康文景時可也而聖䇿乃以財用未𥙿為憂雖臣亦切疑之豈國家用度之際有所未節乎奢侈之風有所未革乎不急之務無名之費尚繁乎今賦入不及祖宗全盛之日而用度不減祖宗全盛之時三年郊祀之禮所不可免者而臣下賞賜之費有可得而省也不得巳之歲幣所不可免者而使命往來之費可得而省也百官之俸所不可免者而冗官可得而省也六軍之養所不可免者而冗兵可得而省也臣所謂用度之際有所未節者如此之類不止乎此也朝廷往嘗屢有禁銷金之令矣而婦人以銷金為衣服者今猶自若也又嘗有禁鋪翠之令矣而婦人以翠羽為首飾者今猶自若也是豈法令之不可禁乎豈宫中服浣濯之化衣不曵地之風未形于外乎臣所謂奢侈之風有所未革者蓋在乎此也臣又聞之道路謂逺夷外國有以無益之竒玩易我有用之資財者池臺苑囿車騎服御有未能無所增益者中貴外戚便嬖使令倡優伶官之徒有未能無非時賞賜者臣所謂不急之務無名之費尚繁者蓋在乎此也昔漢文帝躬行節儉以化民而海內至于富庶臣願陛下攬權于上而革衆弊以文帝及我太祖仁宗恭儉為法以春秋所書為戒則何患乎財用之不𥙿乎若夫自同于聚斂之臣獻生財之術則臣不敢也臣伏讀聖䇿曰取士之科作成之法猶昔也而人才猶未盛臣有以見陛下知致治之道在乎得士而欲人才之盛如祖宗時也臣切謂陛下欲人才之盛宜攬育才取士之權臣謹按春秋書作丘甲穀梁因論古者有四民而以士民為首范寧釋之曰士者治道藝者也又按經書單伯送王姬穀梁曰單伯者我之命大夫也范寧釋之曰古者諸侯貢士于夫子大國三人次國二人小國一人又按公羊春秋曰什一行而頌聲作何休因論及成周之時井田校室之制大學小學之法養士取士之説為甚詳又按經赦許止之罪穀梁曰子生三月不免水火母之罪也羈貫成童不就師傅父之罪也就師傅學問無方心志不通巳之罪也心志既通而名譽不彰朋友之罪也名譽既彰而有司不舉有司之罪也有司舉之而王者不用王者之過也春秋傷時王失育才取士之權而默寓其意于筆削之際公羊穀梁范寧何休之徒從而發明之亦可謂有功于風教矣我祖宗以來取士于科舉是古者諸侯貢士之法也養士于太學是古者校庠序之法也又有制科以待非常之士是有取于漢唐盛世之法也進士科成用詩賦或用經義雖更變不同而未嘗不得人也大學之士或出于舍選或出于科舉雖作成不同而亦未嘗不得人也二百年間名臣巨儒建勳立業背項相望莫不由此塗出可謂盛矣陛下往者雖在干戈日不暇給之中而亦未嘗廢爼豆之事自偃兵以來復興大學以養諸生其取士之科作成之法一遵祖宗之舊恩甚渥也而聖䇿猶以人才未甚盛為憂者臣輒獻攬權之説焉今取士之科作成之法雖曰猶昔而人才非昔者由福威之權下移于前日故也夫法之至公者莫如取士名器之至重者莫如科第往歲權臣子孫門客省闈殿試類皆竊巍科而有司以國家名器為媚權臣之具而欲得人可乎朝廷比因外臺之言例行駮放士論莫不稱快臣願陛下常攬福威之權以御之嚴詔有司謹取士之公法而無蹈往年之覆轍可也至所謂作成者蓋欲作成其器如鳶飛魚躍涵養其平日之剛方而成就其異時之逺大者耳非取其能絺章繪句以媒青紫也自權臣以身障天下之言路而庠序之士養諛成風科舉之文不敢以一言及時務欲士氣之振可乎臣聞嘉祐間仁宗以制科取士時應詔者數人眉山蘇轍之言最為切直考官以上無失德而轍妄言欲黜之獨司馬光慨然主其事仁宗曰朕以直言求士其可以直言棄之邪擢置異等此陛下取士之家法也臣願陛下以仁宗為法以前日權臣之事為戒命庠序去謗訕之規科舉革忌諱之禁有司取志讜之論將見賢良方正茂才異等直言極諌之士濟濟而出如仁宗時矣尚何患人才之不盛乎臣伏讀聖䇿曰黜陟之典訓迪之方猶昔也而官師或未勵臣有以見陛下知致治之道在乎得人而欲官師之勵如祖宗時也臣切謂欲官師之勵宜攬黜陟賢否之權謹按春秋隱十一年書滕侯至威二年别書滕子范寧曰前稱侯今稱子者盡時王所黜隱二年書紀子至威二年則書紀侯范寧曰前稱子今稱侯者蓋時王所進臣切謂春秋時王不能黜陟諸侯是必夫子以賞罰之權因其賢否而黜陟之也又按經書楚曰荆公羊曰者何州名也州不若國國不若氏氏不若人人不若名名不若字字不若子何休釋之曰聖人因周有奪爵之法故備七等之科以進退之臣是以知春秋實夫子黜陟之公法也故為臣而知春秋者則必為忠臣蓋春秋以責忠臣之至訓迪天下之為人臣者也為子而知春秋者則必為孝子蓋春秋以責孝子之至訓迪天下之為人子者也我國家任官之法上自公卿百執事下至一郡一縣之吏無非以公道黜陟之固無異虞舜三載考績之法也有學以教之於未仕之前有法以禁之於筮仕之後無非以公道訓迪之固無異乎成周訓迪厥官之方也故當時為官師者岡不勉勵厥聀坐廟堂之上與天子相可否者是宰相之勵其聀也立殿陛之前與天子爭是非者是諫官之勵其聀也言及乘輿則天子改容事關廊廟則宰相待罪者是御史之勵其聀也百官勵其聀于朝守令勵其聀于郡縣是以祖宗之世內外多任聀之臣故其致治之效逺出漢唐之上今陛下任賢使能以建中興之治黜陟之法訓迪之方無非遵祖宗之時而聖䇿乃以官師未勵為憂者臣輒獻攬權之説焉今黜陟之法訓迪之方雖曰猶昔而治效非昔者由福威之權下移于前日故也夫法之至公者莫大乎黜陟而治亂之所繫者莫重乎官師曩者內外用事之臣多出乎權門之親戚故舊朋黨文臣或非清流而濫居清要之聀武臣或無軍功而濫居將帥之任賄賂公行其門如市郡縣之吏其濁如泥是皆官曹澄清時可堪一笑者至於一言忤意雖無罪而亦斥睚眥之怨雖忠賢而必誅其一時黜陟皆出乎喜怒愛憎之私無復有唐虞考績李唐四善二十七最之法求欲其盡瘁勵聀可乎若夫所謂訓迪者蓋將以忠義訓迪之使其忘身徇國而已非欲訓迪其巧進取善造請以事權勢也當權門炙手可熱之時搢紳相率為侫之不暇孰有以忠義相訓迪者乎至於今日而官師猶未勵者以其承積習之後而餘弊未革故也陛下必欲官師咸勵厥聀莫若大明黜陟於上而以黜陟之次者付之宰相又其次者付之吏部又其次者付之監司可也昔慶曆中仁宗黜夏竦等用杜韓范富以為執政以歐陽修余靖王素蔡襄為諌官皆天下之望魯人石介作聖德頌以揄揚之此陛下黜陟之家法也臣願陛下以仁宗為法以前日權臣之事為戒執福威之大柄以為黜陟之法明忠孝之大節以為訓迪之方如是則尚何患乎官師之不勵聀如祖宗時乎臣伏讀聖䇿謂姦弊未盡革財用未甚𥙿人才尚未盛官師或未勵其咎安在豈道雖久而不渝法有時而或弊損益之宜有不可已邪抑推而行之者非其人邪朕欲參稽典䇿之訓講明推行之要俾祖宗致治之效復見於今其必有道臣仰見陛下願治之切思慕祖宗之深欲聿追其盛德大業者可謂勤且至矣然臣已陳攬權之説于前且以春秋為獻抑嘗聞先儒曽參有言曰尊其所聞則髙明矣行其所知則光大矣春秋之學陛下既巳深得之復能尊其所聞行其所知攬福威之權以守祖宗之家法則賞刑當而天下恱矣姦弊不患乎不革節儉行而天下化矣財用不患乎不𥙿取士公而賢能出矣人才不患乎不盛黜陟明而邪正分矣官師不患乎不勵祖宗致治之效又何患乎不復見于今邪若夫所謂道雖久而不渝法有時而或弊損益之宜有不可已者臣按先儒釋春秋有變周之文從周之質之説又有商變夏周變商春秋變周之説臣以謂春秋未嘗變周也特因時而救弊耳又嘗聞董仲舒之言曰先王之道必有偏而不起之處故政有眊而不行救其偏者所以輔其弊而巳矣我祖宗之法譬猶大厦弊則修之不可更造苟不知遵守而輕務改更臣恐風雨之不芘也損益之宜有不可已者臣願以仲舒輔弊之説為獻可乎若夫所謂推而行之有非其人者臣按春秋書乃一字如公子遂如齊至黃乃復之類穀梁釋之曰乃者亡乎人之辭也蓋言任用不得其人耳又嘗聞荀卿之言曰有治人無治法夏商周之法非不善也苟得其人監于成憲常如傳説之言遵先王之法常如孟子之言率由舊章常如詩人之言則夏商周雖至今存可也漢唐之法亦非不善也苟得其人常如曹參之守法宋景之守文魏相李絳之奉行故事則漢唐雖至今存可也祖宗之法非不甚善也苟得其人常如司馬光之徒持守成之論則垂之万世與天地並久可也陛下既知前日推而行之非其人矣則今日又不可不慎擇焉臣願以荀卿有治人之言為獻可若夫參稽典䇿之訓則有歷朝之國文在焉祖宗之寶訓政要在焉有司之成法在焉朝廷之故事在焉陛下冝詔執政與百執事之人參稽而奉行之可也若夫講明推行之要則無若手攬權陛下提綱振領而以万目之繁付之臣下可也陛下終䇿臣曰子大夫學古入官明于治道藴畜以待問久矣詳著于篇朕得親覽此陛下導臣使言臣不敢不盡言也臣聞人主開求言之路必將有聽言之實人臣遇得言之秋不可無獻言之誠蓋求言之路不常開而得言之秋不易遇今陛下開求言之路而臣遇得言之秋陛下有聽言之實臣其可無獻言之誠乎臣復有一言以為陛下獻者欲陛下正身以為攬權之本也按春秋書正者杜預謂欲其體元而居正公羊又有君子大居正之説謂正心以正朝廷正朝廷以正百官正百官以正万民者董仲舒之論正也謂人君所行必正道所發必正言所居必正位所近必正人者劉蕡之論正也臣觀自古人君能正身以化下者莫如周文王不能正身以化下者莫如漢武帝文王宅心于正道之中其勤勞則日􅉴不遑暇食不敢盤于遊田以庶邦万民惟正之供故能刑于寡妻至于兄弟以御于家邦見于思齊之詩在位之臣皆節儉正直見于羔羊之詩人倫既正朝廷既治天下純彼其化又見于騶虞之詩文王能自正其身而其下化之如此若夫武帝則不然其所以自治其身與其下應之者皆不正也帝好諛也故公孫弘曲學以應之帝好刑也故張湯曲法以應之帝好利也故孔僅桑弘羊以剝下益上應之帝好兵也故衛青霍去病以拓土開強應之帝好夸大也故司馬相如作封禪書以應之帝好神仙也故文成五利之徒以左道應之武帝不能自正其身而其下應之如彼臣碩陛下以文王為法以武帝為戒端厥心居以為化本非正勿視非正非聽非正勿言非正勿動其用人也不必問其才不才而先察其正不正是果正人也其進則為治之表其可以其才不足而不與之進乎是果不正人也其進則為亂之機其可以其才有餘而使之進乎其聽言也必觀其言之是與非斯可以見其人之邪與正有遜志之言必將察之曰彼何為而投吾之所好哉是必不正人之言也是言之有害于我者也其可以其遜吾志而受之邪有􅊇耳之言必將察之曰彼何為而犯吾之所惡哉是必正人之言也是言之有益于我也其可以其􅊇吾耳而不受邪左右譽言日聞必察之曰是必不正人也是必阿大夫之類也是必善結吾左右以求譽者也退之可矣左右毀言日聞必察之曰是未必非正人也是必即墨大夫之類也是必不善結吾左右以致毀者也進之可矣如是則一念慮無非正心一云為無非正道左右前後侍御僕從岡匪正人殆見四方万里凨行草偃莫不一于正矣臣碩陛下以是為攬權之本而又任賢以為攬權之助廣覽兼聽以盡攬權之美權在陛下之手則所求無不得所欲皆如意雖社稷之大計天下之大事皆可以不動聲色而為之况區區四者之弊尚何足以軫淵衷之念哉臣聞主聖臣直惟陛下赦其狂愚不勝幸甚臣昧死臣謹對御批任賢輝經學淹通議論醇正可作第一人梅溪先生廷試䇿卷第一梅溪先生後集卷第一賦教授建何橫校正會稽風俗賦并敘門人周世則昔司馬相如作上林賦設子虛烏有先生亡是公三人相畣難子虛虛言也烏有先生者烏有是事也亡是公者亡是人也故其詞多夸而其事不實如盧橘黃柑之類蓋上林所無者猶莊生之寓言也余賦會稽雖文采不足以擬相如之萬一然事皆實録故設為子真無妄先生有君畣問之辭子真者誠言也無妄者不虛也有君者有是事也以反相如之説焉有客過越自稱子真介于無妄先生贄見於有君謁入乃膝而前曰聞有君之名雅矣今幸際顔色聆話言僕輒有請君其聽焉君世家于越以風流自命業傅緗素才播歌詠越之山川人物古今風俗載在君腹願聞其略可呼有君乃斂袵肅容謝曰唯唯客姑坐焉吾以語爾越於九域分曰揚州禹貢淮海惟揚州周禮東南曰揚州山日會稽啚經大都督府越州禹貢揚州之域仰瞻天文度當斗牛漢書地理志吳地斗分壄晉書天文志自斗十三度至女七度為星紀於辰在丑吳越分曰揚州而會稽入斗一度白樂天詩云牛斗尺埀象台明地展啚在辰為丑自夏而矦史記越王句踐其先禹之苗裔夏少康之庶子也封為會稽以奉禹祀啚經封少子無餘於越是為越侯郡於秦漢秦始皇滅荆置會稽郡漢以其地屬吳國景帝誅吳王復為會稽郡霸於春秋春秋哀公十三年於越入吳史記勾踐巳平吳兵橫行于江淮號稱霸王州於隋而使於唐隋大業中改為越州唐乾元中置浙江東道節度觀察等使公有素而王有鏐隋楊素封越國公唐末錢鏐平董昌封吳越國王因種山而中宅啚經種山一名重山即今卧龍山也吳越春秋越王􅌾文種於國之西山一年伍子胥自海上穿山脅時去種去與之俱遊於海今西山低處是也廓蠡成而外州吳越春秋勾踐自吳還范蠡築小城周干一百二十二步一員三方西北立為龍翼之樓以象天門東南伏漏石竇以象地户陵門四逹以象八風外郭築城而缺西北示服事吳也啚經會稽治山隂以來此城即為郡城龍樓翼而屹峙石竇伏而巽流法大門兮墜户惟崑崙兮是侔吳越春秋范蠡日臣之叢城也其應天矣崑崙之象存焉實東南之大府號實天下之無仇天下本無仇其山則鬱鬱蒼蒼巖巖嵬嵬磅礴蜿蜒嵂崒崥崹若騫若奔若闔若開或凸或凹或阜或􅎧或斷而聮或昻而低虎卧龜蹲龍盤鴈徊舒為屏障峙為樓臺崦映江湖明滅雲霓八山中藏府城之內有八山種山龜山蕺山大珠山鮑郎山彭山白馬山蛾眉山今所存者惟四山耳鮑郎彭山白馬蛾眉俱已湮滅僅存其名千里周回彭鮑名存圖經彭山在會稽縣北四里典録云彭祖所隱居之城鮑郎山一名陽堂山在今大能仁寺之前郡國志云山有鮑郎祠蛾馬迹迷蛾眉山不見於圖經父老云在府橋之東軒亭之西形如蛾眉白馬山在會稽縣北五里巨者南鎮是為會稽史記禹會諸侯江南計力命日會稽會稽者會稽也皇覽曰會稽山本名苗山唐開元十年封四鎮為公故會稽山為南鎮永興公洞曰陽明群仙所棲龜山白玉上經曰會稽山周回一百二十里名陽明洞天皆仙聖天人都會之所石傘如張圖經石􅏛山在會稽縣東南十五里玉笥側狀如􅏛石帆如揚石帆山在會稽縣東十五里夏侯曽先地理志云射的山北有石壁高數十丈中央少紆狀如張帆又有文石狀如鷂人亦謂之石鷂山石簣如藏輿地志云宛委山上有石簣璧立干雲升者纍梯而至石鷂如翔石壁匪泥並見石帆注石甕匪擕巨石三在照湖東狀如酒甕時人謂之秦皇酒甕香爐自煙會稽一峯狀如香爐人謂之香爐峯一名覆釡山天柱可梯吳越春秋九山東南天柱號日宛委圖經望泰山一名天柱山韞玉有笥圖經玉笥山在會稽縣東南十五里出美玉其形如笥因以為名一名茅峴降仙有臺皇覽云宛委山上有一巨石吃然如元臺嘗有神仙降其上號降仙臺苗龍先生於此臺上升禹穴窅而叵探史記司馬遷登會稽探禹穴唐鄭魴有禹穴碑葛巖蜚而自來龍瑞啚經禹穴北有石岩髙丈餘南面側平如削真誥云此石於赤烏二年天降從安悉國飛來上有索䀶二條名為飛來石晉葛仙公曽築壇煉丹後人名葛仙岩煉丹井射堂豐凶之的孔瞱會稽記云射的山半有石室乃仙人射堂東峯有射的遙望山壁有白點如射侯士人常以古榖貴賤故語云射的白米斛百射壁元米斛干宛委日月之圭遁甲開山圖云禹開宛委山得赤圭如日碧圭如月長一尺二寸應天上之玉衡輿地志云會稽山一名衡山吳越春秋禹聞黃帝藏書于此乃東巡登衡嶺龍瑞啚經注云謂天文蓋度中權衡星名非南嶽之衡嶺直海中之蓬萊舊志蓬萊山正偶會稽沈紳蓬萊閣詩云三山對峙海中央至若嵊山巋其東啚經嵊山在剡縣東三十四里唐武德四年置嵊山因山為名今日嵊縣塗山屹其西塗山在山隂西北四十五里舊啚經云禹會諸侯之所應邵云塗山在永興北按永興即蕭山也杜預注左傳云在淮南夀春亦未詳在何所阜至繇蜀蜀阜山在山隂縣北三十五里舊經桉地志云昔自蜀飛來帶見婦二十餘人隨山而至善織美錦自云家在西蜀今忽至此又云勾踐將伐吳置婦女於山上以邀軍士後詆為阜龜來自齊龜山在山隂縣東八十步下有東武里或謂之怪山吳越春秋范蠡築城既成怪山自生琅玕東武海中山屯一夕自來故名怪山越絶書云勾踐遊臺也東南司馬門所以灼龜又仰望天氣觀天怪也云逺望似龜形或名龜山小梅山乃隱吏之窟梅山一名巫山在府城北一十八里梅子真所隱之地也其西則有梅市里梅福里紵羅蓋西子之閨輿地志云諸暨縣羅山西施鄭且所居有方石云是西施曬紗處今名紵羅山五泄爭竒於雁蕩掇英集五泄瀑布也在諸暨西四十里有兩山夾溪造雲壁立髙二百丈廣數十丈水㵼五莭故曰五泄山多竒峯或比之雁蕩云四明競秀於天台啚經四明山在餘姚縣孫綽天台賦云涉海則有方丈蓬萊登陸則有四明天台五雲中令之故居晉義熙三年中書令王獻之居是山有五色祥雲見安帝詔建雲門寺十峯曇翼之招提法華山在會稽縣南四十里晉僧曇翼捿此誦法華經因置寺焉其山十峯其水雙澗今天衣寺是也故越為之首兮剡為之面兮沃洲天姥眉兮目兮白樂天沃洲山記云東南山水越為首剡為面沃洲天姥為眉目二山今屬新昌縣金庭桐柏仙子宅兮金庭觀在剡縣東王子晉學道登仙之所真誥日南嶽真人云越有桐柏之金庭飬真之福地申仙之靈噓也南明嵌崆寶相湧兮新昌南明山有寶相寺梁建安王造石佛一軀髙一百尺南岩嵯峨海迹古兮南岩在新昌縣西南唐李紳龍官寺碑云南岩海迹髙下猶存陟秦望而望秦兮史記秦始皇二十七年上會稽祭大禹望于南海丘石刻頌啚經秦望山在會稽南四十里又有望秦山始皇登山郡臣於此以望秦中登洛思兮而思洛兮洛思山在蕭山縣東輿志云永興縣有洛思山下人未雋來會稽三年不得反乃登山北顧而嘆因以為名采葛食蕺敬弔前王兮蕺山在府治東北三里趙璘直碑云蕺𬞞類昔越王所嗜常採於此遂用名之在晉為王逸少別止尚晉故池與祠堂葛山在會稽縣東一十里吳越春秋云勾踐使女纎布以獻吳王采葛是山修竹茂林緬想陳迹兮輿地志云山隂縣西有蘭亭王羲之序云此地有崇山峻嶺茂林修竹又云俯仰之間以為陳迹連山如珠秦皇之所驅兮連山在蕭山縣西夏矦曽先志云連山長岡九里西北至定山秦始皇𣣔置石橋渡浙江今尚府石柱數十列于江祭世傳始皇軀山塞海擪山如玦亞文之所割兮擪烏山在蕭山縣南東方朔神異志云山是亞父割斷蕭山南嶺將擪斷烏江北幹隱兮明月在此幹山在蕭山縣北孔靈符地志云許詢家於此山之陽詢詩云蕭條比幹園劉真長嘆曰清風明月恨無元度東山卧兮白雲迷東山在上虞縣西北三十里謝安石髙卧之處李白億東山詩云白雲他自散少微寂兮幽鳥怨少微山在會稽五雲門外十里戢方貟外郎齊唐墓表云公退居湖山曰少微依山有亭榭獨以書史音樂自適太白空兮壄猿啼太白山在剡先地志云峻西六十里與少白山連夏矦曾于天岩崔嵬趙廣信鍊丹登仙之處上有白猿赤貜其水則浩渺泓澄散漫縈迃漲焉而天風焉而波淨焉如練瑩焉如磨溢而為江潴而為湖為沼為沚為潢為汚匯為陂澤疏為溝渠􅐛而田疇淤而泥塗生我稻梁溉我果𬞞集有鳬雁戲有龜魚實有菱芡香有芙蕖鶻舟如擊晉安海物異名記越人水戰凌波赴敵則有鶻舟名馬楫如驅吳越春秋越人以船為車以楫為馬船龍夭矯橋獸睢盱白樂天詩船頭龍夭矯橋腳獸睢盱堰限江河津通漕輸航甌舶閩浮鄞逹吳浪槳風帆千艘萬艫大武挽繂五丁譟呼榜人奏功千里須臾境絶利慱莫如鑑湖有八百里之回環灌九千頃之膏腴啚經後漢馬臻字叔荐山陽人為太守創立鑑湖在會稽山隂二界築塘蓄水水髙田丈餘田又髙海丈餘若水少則泄湖溉田如水多則開湖泄田中水人海所以無凶年其塘隄周回三百十里溉田九千餘頃一説鑑湖八百里蓋揔言之錢昭度詩云越國荷花八百里浮賀監之家唐書賀知章以祕書監請為道士詔許之以宅為千秋觀賜鑑湖剡州一曲􅐛允常之都史記少康扁子封於會稽後二十餘世至於允常吳越春秋云越之興霸自允常始人在鑑中舟行畫啚輿地志南湖縈帶郊廓欵屬峯岫白水翠岩互相耿發若鑑若啚王逸少云從山隂上路行如在鑑中斿五月清涼人間所無杜甫詩鑑湖五月涼有菱歌兮聲峭謝靈運詩菱歌調易急王翰詩不知湖上菱歌女幾箇春舟在若耶有蓮女兮貌都西施采蓮於若邪溪李白有采蓮曲日出兮湮銷漁郎兮嘯呼東泛曹江哀彼孝娥曺娥江在會稽東四十里蛾上虞人父溺死不得尸娥年十四沿江慟哭晝夜不絶旬有七日遂投江而死西觀驚濤弔夫子胥浙江在蕭山縣西十三里史記吳王殺伍子胥取其尸盛以鴟夷革浮之江中吳人憐之為立祠於江上命曰胥山概浦思夫概之封概浦在諸暨縣北吳闔閭弟之子夫槩所封之地因以為名翁洲訪偃王之廬翁州屬會稽郡國志云徐偃王皆居於翁州簞醪投弓沼吳國簞醪在會稽南三里勾踐投醪醪之所左傳伍子胥曰吳其沼乎扁舟去兮變陶朱史記范蠡事越既滅吳乃乘舟浮海以行終不反止于陶天下稱陶朱公鼓樵風兮遊若邪若邪溪在會稽縣東南後漢鄭洪字巨君山隂人孔靈符會稽記云射的山南有白鶴山此鶴為仙人取箭鄭洪嘗采薪得一遺箭項有人覔洪還之問何所𣣔洪識其神人也曰常患若邪溪載薪為難願朝南風暮北風後果然故溪風至今猶爾呼為鄭公風亦名樵風興雪棹兮尋隱居剡溪一名戴溪晉書云王子猷嘗居山隂夜雪𥘉霽四望皓然忽憶戴逵時在剡便夜乘小船詣之經宿方至造門不前而反人問其故子猷曰乘興而來興盡而反何必見戴禊事修兮觴蘭渚蘭渚即蘭亨也羲之序云會于山隂之蘭亭修禊事也有清流激湍引為流觴曲水陶泓沐兮池戒珠戒珠寺在蕺山本王羲之别業有鵝池硯池題扇橋在馬了溪鑿兮禹功畢了溪在剡縣東北源出了山越絶書云禹疏了溪人方宅土刑塘築兮長人誅刑塘在會稽縣北越絶記大禹會諸矦于塗山執玉帛者万國防風後至禹万誅之於塘賀循會稽記云防風氏其身三丈刑者不及乃築髙塘臨之故曰刑塘酌菲泉兮懷古會稽山大禹寺有泉名曰菲泉飲清白兮自娛卧龍山下州宅之西隅有清白堂清白泉太守范文正公命名有記其物則有魚鹽之饒沈立越州啚序瀕海居人以魚鹽為生竹箭之美爾雅東南之美者則有會稽之竹箭山涵海蓄吂其有幾貢入王室利周遐邇耕焉以火耨焉以水漢書地理志云江南地廣火耕水耨民食魚稻南風翼苗翠浪千里耙稏一空玉粒如峙炊粳釀秫既甘且㞓檿枽之竒號為第一吳録太康地記並云諸暨境土諸山第一一檿桑文采如傳棊方正駢次有如畫作可為屐韜上品者一兩至數十萬龍精㒩㒩吐終滿室蠶書曰蠶為龍精荀卿蠶賦云有物於此㒩㒩兮其狀屢化如神萬草千華機軸中出綾紗繒縠雪積縑匹啚經越貢花紗白編綾輕交梭綾輕容生榖吳絹卜樣綾大花緩編大紗花羅木則楓挺千丈名山志云天姥山有楓木千余丈㮤封五夫上虞有地名五夫始皇封松木為五大夫之處桐柏合生嵊縣金庭觀道經云上有桐柏合生檫棐異隅輿地志云餘姚有太平山四角各生一種木不雜他木一角純檫一角純粹一角純棐文梓楩柟吳越春秋吳王好起宫室越王使工八山伐木天生神木一雙大二十圍陽為文梓隂為楩抽以獻吳王擽柞櫧榆郡國志若邪溪有櫟木謝客兒惠連作詩聮句刻於其上上虞有歷山山下多柏木吳越名祚為歷故曰歷諸暨有櫧山剡有榆木山連理之柯諸暨有木連院因有連理木故得名合抱之株乃斧乃斤以輿以廬乃有蕭山陸吉東坡黃甘陸吉傳吉隱蕭山諸暨三如啚經諸暨出三如謂如錦之桑如拳之栗如絲之苧胡柟成林賀瓜滿區爾雅梅桶任昉𫐠異記中有王氏橘園胡氏梅山賀氏瓜丘陵家白蓮棗實全赤擒腮半朱火棐殼玉櫻桃薦珠鴨腳含黃雞頭去盧百益七絶之竒爾雅樹木瓜埤雅梨百損一益楙百益一損隱居云山隂蘭亭尢多木瓜人以為良果酉陽雜爼材有七絶一夀二多隂三無鳥巢四無蠱五霜葉可愛六嘉實七落葉肥火雙頭四角之殊越多雙頭蓮埤雅去俗言菱芟而不分别惟武陵記云四角三角曰芟兩角曰菱蔗有崑崙之號本草注甘蔗有兩種赤色名崑崙䉀白色名萩蔗赤蔗出江東會稽梅有官長之呼越有揚梅二種絶佳一日官長梅一日稜梅蔓生則馬乳櫻薁土實則鳬茈慈菰野蔌溪毛園𬞞木菌湘湖之蓴箭里之荀蕭山湘湖出蓴菜會稽有美箭里可薦可羞采擷無盡鱗蟲水族海生池飬丁首丙尾皤腹縮項赤鯶文鱧元􅠧黃􅶞以上魚名並載於啚經越所有者余皆類此漁人駢集呂鈎以網羔金繪玊不數熊掌能言之騖善鳴之鵝陸龜蒙飬能言之雞王羲之愛善篇之鵝輸芒之蟹孕珠之螺文身合氏之子蛤有文故謂之文蛤元微之詩卿味尤珍蛤舍氏子見東坡江瑶柱傳跛足從事之徒元微之詩鱉解稱從事街填巷委與土同多異獸珍禽屑銅吐綬銅牛山在會稽縣夏矦光曽地志云肯有銅牛見於靈泛橋人遂之奔入此山掘地視之悉銅有也啚經太白山有鳥尾似雞文來五色口吐緣綬長數尺號吐綬鳥猛虎負子蕭山有去虎山本名虎子山有猛虎傷人景德四年六月晦日虎負一子而渡浙江而去知縣杜守一因改名焉靈烏送􅑹法華山有雙烏䲸長則送出之故惟此烏在焉唐萬齊融守碑云雙烏所以示北鳯栖鹿化會稽有鳯林卿按吳越春秋禹會諸矦于稽山因傳國政鳯凰栖于水百鳥佃於澤華公鳯林詩苗山會計啚書曰威鳯曽栖璧玉枝龍瑞啚經葛仙翁有桐木隱几化為白鹿三足號為鹿迹山鶴拾雁耨孔靈符會稽記云射的山西南有白鶴為仙人取箭因號箭羽山上虞有雁田州志云夏禹與諸矦虞樂於此化感鳥獸故其地雁為民田春拔草根秋除其穗熊羆貍豹猴玃猿狖􆄼銜鸕吐埤雅􆄼鶄子銜母翅鸕鷀吐而生子鶯求鶉鬬鷗浮鷸浴禽經曰鳬善沒鷗好浮埤雅鷸翡翠也衒其毛羽日浴登闌洄淵之間鴉寒鳦瘦越多寒鴉秦少遊詞寒鴉萬點黃岩叟詞寒鴉如豆俱得其實鳦燕也有二種有胡燕有越燕胡燕肥越燕瘦巧婦錐喙埤雅鷦鷯性巧故俗呼巧婦其喙尖利如錐巢至精密春鋤雪脰爾雅鷺舂鋤埤雅步唹淺水好自低昻故曰舂鋤林棲水宿修尾長咮禽經曰陸鳥曰棲水鳥曰宿又曰山禽之味多短水禽之味多長山禽之尾多修水禽之尾多促江湖為籠山林為囿以牡以牝以蜚以走甲第名園竒葩異香牡丹如洛芍藥如揚歐陽公花品序牡丹西出丹州延州東出青州南出越州出洛陽者為天下第一揚州出千葉芍藥木蘭載新吳蛻鎮東軍監軍使院記云大厦之前木蘭特異越城之中稱為一絶當前政不軌之際匆焉凋零建彭城王之鎮臨也緑葉紫苞載新陽豔海榴懷芳州宅舊有海抽亭唐李紳詩懷芳不作翻風豔列蕚猶含汝露妍蘜山黃華啚經菊山在蕭山縣西山多甘菊唐縣令李蕚尉丘丹目之曰菊山蘭亭國香越絶書蘭亭在山隂越王種蘭處天衣杜鵑天衣寺有杜鵑花最竒每歲盛開觀者競集東山薔薇李白詩不到東山久薔薇幾度花湖映香雪越多梅花又餘姚有梅澳湖以梅得名鑑生水芝李白詩荷花鑑裏生鴛梅並蒂越有鴛鴦梅雙頭千葉仙桂丹枝越有丹桂司華騁巧天女效竒桃李漫山臧獲眂之藥物之産不知其名白㭉丹參甘蘜黃精吳茰越桃山梔子一名越桃禹糧石英􅌘縣了山出禹餘糧諸暨烏帶山出紫石英薊訓鬻之以療疾啚經古廢市在州南輿地志曰昔薊訓賣藥於此市彭祖服之而延齡彭山在會稽縣北典録云彭祖隱居之城秦皇求之而莫致史記始皇令方士徐市等八海求神藥數歲不得葛仙餌之而飛升葛仙翁煉丹飛升禹穴北有仙岩日鑄雪芽日鑄山在會稽東南五十五里歐冶鑄釰之所覽古集云會稽日鑄洪崖雙并不在建臘之後卧龍瑞草卧龍山亦産竒茗范文正公清白堂記以建溪日鑄卧龍雲門之茗試之甘液華滋恱人襟靈張伯王云卧龍茶冠吳越瀑嶺稱仙茶經云餘姚縣茶生瀑布嶺者號仙茗茗山鬬好啚經茗山在蕭山縣西其上多竒茗顧渚爭先建溪同蚤碾塵飛王甌濤翻皓生兩腋之清風興飄飄于蓬島剡藤畨畨𬋩城斑斑越紙出於剡舒元輿有悲古剡藤文啚經越出筆𬋩冰𫾣􅌘水張伯玉詩敲氷呈巧手注云越俗呼敲冰紙為巧手竹翦顧園述異記越中有顧家斑竹製於蒙蔡之手遊於羲猷之間友陳元與端紫同文字於人寰至若龍謢金書龍瑞啚經黃帝藏金簡玉字書於宛安山禹探得之唐開元二年投金龍於禹穴俄有一龍自穴出現於壇上賜號龍瑞宫苔封石刻齊書志云會稽剡縣刻石山相傳於名不知文字所在宋升明本縣名家兒襲祖行獵忽見石上有文凡三處苔生其上字不可識刋苔去之有大石文立石文小石文云云或云衛夫人碑墮此中因以為名苗山金玉山海經會稽山上多金玉下多珠石邪堇銅錫吳越春秋云歐治子為越王鑄剱破赤堇之山而出錫涸若邪之溪而出銅黃帝之鑑述異記世傳黃帝鑄鑑于此故名鑑湖神禹之璧紐興丁丑禹祠之前有光見人即其處得圭璧歐冶之釰見邪堇銅錫注蔡雍之笛輿地志蔡雍避難於越宿千秋亭仰見榱竹知有竒響因取以為笛遂為寶器虞翻之牀啚經五官省相傳有虞翻牀翻為吳長沙王所祀特設比牀以表賢客秦皇之石輿地志秦始皇刻石前有方石廣十丈云是始皇座兩邉有方石八所云是丞相已下座淳碑斯篆漢邯鄲淳作曺娥碑蔡雍題日黃絹糿婦外孫韲白參望山有始皇頌德碑李斯篆江筆肅墨府治之北有筆飛巷江奄夢筆之所也漢王肅隨父在郡東齋夜有女子從地中出與肅語將曉辭别贈墨二貟時肅方注周易多有凝滯旦用此墨覺才思開敏靁鼓銅漏漢書王尊傳母持布鼓于雷門注云雷門會稽城門也有大鼓聲聞洛陽會稽黃閣故有銅漏占制甚精王羲之書陸機漏賦鐫刻于上歷代以為寶梅梁窆石越絶書少康立禹祠于陵所梁時修廟支一梁木夕有風雨漂一水至乃梅梁也今存窆石在禹陵之前舊經云禹葬會稽取此石為窆秦少遊詩云一代衣冠埋窆石千年風雨鎖梅梁罍金履鐡晉太康中上虞縣于道觀升中獲金罍故縣以金罍名驛郡國志云塗山有石船長一丈云禹所乘來宋元嘉中于船側掘得鐵履一雙梁𥘉又得青玉印罌銅印玉晉太元年中謝輶為郡守掘郡􅈦枉下深八尺得古銅罌可容數斗封題作越王字文甚分明是今隸書餘不可識輶以為范蠡猒勝之術遂埋之今不識處玉印見玉注胎草蹄石啚經獵士陳惠度于剡山射孕鹿既傷産下一子以舌舐子身乾而後鹿母乃死思度棄弓矢為僧鹿死之處生草號鹿胎草諸暨有馬蹄石傳云始皇東巡馬蹄踐此其迹存焉黃竹神木蕭山黃竹山越絶記云范蠡遺鞭于此生笋為林竹色皆黃狀如刀割神水見文梓楩柟􅴈流黃漢簟西京雜記會稽貢竹簟號流黃簟錞于周樂會稽記塗山廟中有周時樂器名錞于活人之草郡國志云會稽橫山有草莖赤葉青人死覆之更活止痛之木啚經郡王官廨兩杉梁相傳勾踐聽事之舊梁歷代雖逺材質不異俗謗云十年之木能止心痛有削服者多愈柘敷榮而華含戚石氏宗譜新昌石眆墓前有柘木生而內向覆墳如蓋然守墓者言每有登科者則柘有枝持生一枝一人或二三枝則二三人云會稽覽古集四明山有雙石如筍髙數尺野花叢生其頂杜鵑鳴時爛若霞錦國朝祖宗遏密皆三年不榮聀方齊唐嘗為之贊華鎮詩云鼎湖龍去蒼髯斷三載叢花不記春天雨錢而山儲粟剡有禪房寺舊經云齊安南捋軍黃僧成有德政感天雨錢數億萬遂捨造寺號錢房院梁天監中改禪房寺儲山在會稽東南有粟山周處風俗記舜時供儲在此皆希世之竒迹蓋欲言而不足其人則見于吳越春秋會稽典録圖經墬志歷代東牘大書特書班班滿目孝者悌者忠者義者廉者遜者智者健者優于文詞者長于吏事者擢秀科目之榮者䇿名卿相之貴者殺身以成仁者隱居以求志者埋光屠釣之微者晦迹佛老之異者虞翻之言有所不能盡朱育之對有所不能既會􅾵典録云孫亮時山隂朱育少好竒字仕郡門下書佐太守濮陽興正旦宴見掾吏問昔王景興問士于虞仲翔而未覩仲翔對也書佐寧識之手育對云云府君稱善豫亦焉能縷數之哉姑摘其尤之一二前則種蠡計􅒍號賢大夫按吳越春秋越王有八臣四友文種范蠡計硯最顯後則嚴助買臣直承明廬漢書嚴助朱買臣皆會稽吳人武帝時俱為持中後皆為會稽守孝悌則張萬和之父子唐張萬和諸暨人遭父母喪兄弟廬墓二十餘年萬和終豫亦廬墓韓靈敏之弟昆齊韓靈敏剡人早孤與兄靈珍並有至性母亡無以菅凶共種瓜半畒朝暮生遂辦葬事鄧斯祁樊自殺以代臯朱育對曰處士鄧盧敘弟犯公憲自殺乞代吳寧斯敦山隂祁庚上虞樊正咸代父死罪董黯朱魏報讎而名聞虞翻對曰句章董黯盡心色餋喪致其哀怨親之辱白日報讐海內名聞又魏朱恭明永興人父為烏傷長陳碩所殺恭明志在報讐未間碩病亡刺殺其子遂奪魏後漢魏少英上虞人兄為鄉人所殺少英報讐訖遂亡命或濕衣以障火丁興會稽人家近荒野野火沿燒興母老病乃溫衣覆母以身障火身死母存或泣血以戢焚許伯會蕭山人遭母喪結廬墓側野火將及墳所乃悲號慟哭天忽降雨大則隨滅或銜哀而廬墓山隂鍾離表剡鄭僧保諸暨張萬和蕭山許伯會戴恭皆以廬墓著名或負土以成墳諸暨張孝和申屠氏女蕭山郭世道許伯會並負土成墳或以行而名里剡王知元父喪哀毀卒高宗改為孝義里諸暨賈思會母亡以至孝聞有司奏改其里為孝義里永興郭世道負土成墳袁愈表其行敕改所里為孝行里或以義而旌門山隂嚴世期好施慕善有司奏榜其門曰義行剡公孫逹居喪事母名聞郡縣詔表門閭蕭山俞僅一門四代兄弟十五人老幼八十餘口為鄉里所稱觀察使孟蕳書干圖經以勵風俗懿矣三女齊書會稽陸氏有三女無男祖父母年八九十相繼卒三女自營墳葬為庵舍墓側賢哉二娥曺娥見曺江注國史朱娥上虞朱四女也母亡餋于相媪娥十歲里中朱顔與媪競持刀𣣔投媪一家驚潰獨娥號呼而前擁蔽媪手挽顔刀曰寧殺我母殺媪也媪脫娥死事聞賜其家粟帛其後會稽令董偕為娥立像于曺娥廟四時配享處子之孝凛然可多節義則黃公居四皓之列虞翻對曰鄞大里黃公潔巳暴秦之世髙祖即祚不能一致惠帝恭遜出則濟難魏少英參八雋之儔少英見後漢黨錮傳虞翻曰少英遭此屯蹇忘家憂國列在八雋為世英彥蒙難衛主則有若丁潭晉丁潭字世康山隂人薊峻亂成帝蒙塵於石頭潭隨從不離帝側委身授命則有若王修虞翻曰句章王修委身授命埀聲來世虞喜躬歲寒之操晉虞喜字仲寧餘姚人太康中詔曰喜潔靜其操歲寒不移孔愈洪止足之謀晉孔愈字敬康山隂人史贊曰愈洪止足之分有廉遜之風或一門死三世之義虞翻曰決曺掾上虞孟英三世死義或一邑萃三康之㳅山隂孔愈敬康張茂偉康丁潭世康齊唐時人號會稽三康至若㮤楊桞朱永寧瞿素婦節峥嶸蹈死不顧朱育對其女則松楊桞朱永寧瞿素或一醮守節喪身不顧或遭冦劫賊死不虧行卓行則鄭洪韓説鍾離意朱雋戴就舉於孝廉後漢鄭洪韓説鍾離意皆山隂人米雋戴就昔上虞人並舉孝廉虞潭孔奐沈融朱仕明舉於秀茂晉虞潭餘姚人陳孔奐山隂人唐沈融會稽人並舉秀才齊朱仕明剡人舉茂才虞寄起於對䇿虞寄餘姚人弱冠對䇿髙第起家趙瞱㩲於有道後漢趙瞱山隂人舉有道陳子公退侵墬之藩會稽陳囂字子公以遜為行與紀伯為鄰伯竊囂蕃地自益囂見之不言移一丈以潤紀伯伯覺知患俱乃還所侵之地兩邉俱退乃為一路鴻嘉二年太守右扶風周府君刻石旌表號曰義里長簷路鍾離牧拒慙還之稻吳鍾離牧山隂人居永興種稻二十畝臨熟民認之收遂與稻後民慙還牧閉門不受循吏則有還珠孟嘗後漢循吏孟嘗字伯周上虞人為合甫太守郡無耕稼所資珠璣前政貪殘珠徙交趾嘗清潔無求珠乃還郡致雁虞國孔瞱記云虞國餘姚人漢時為日南太守有惠政行部有雙雁隨軒翔舞及還餘姚雁奔隨歸國卒雁栖於墓側後遂成群今餘姚有雙雁鄉希銑遺四州之愛唐康希銑會稽人為饒海台睦四州刺史顔魯公撰碑今斷碑猶存夏香著歷任之績夏香字曼卿蕭山人會稽典録云香歷任邑長皆有聲績儒學則王充以論衡顯後漢王充字仲任上虞人著論衡八十五篇沈珣以大義稱唐沈珣會􅾵人撰九經大義百卷謝況謝承之史學晉謝沉字行思山隂人明練經史撰晉書三十餘卷承字偉平亦山隂人博學治聞撰後書一百餘卷孔僉孔祛之明經梁孔僉山隂人通五經尤明三禮生徒數百人三為五經博士孔子祛亦山隂人講尚書聽者嘗數百人著尚書義二十卷賀孝先擅儒宗號晉賀循字孝先山隂人經學第一為江東儒宗虞伯施剸慱學之名唐虞世南字伯施太宗稱西南有五絶其一博學也文章則孫興公掞金聲之賦孫綽字興公會稽人作天台賦友人曰鄉試擲也當作金聲徐季海揮玉堂之䇿徐浩字季海為中書舍詔令誥䇿皆浩為之瞱若春榮則任奕虞翔朱育對曰文牽之士則任奕虞朔吝馳文檄瞱若春榮文不加點則四明狂客唐賀知章字貴真永興人自號四明狂客醉後屬詞動成篇卷文不加點二賀二虞蜚聲籍籍唐賀德仁山隂人與從兄德基以文辭稱人為語口學行可師賀德基丈質彬彬賀德仁虞世南與兄世基俱善屬文時人方之二陸吳融十詔成於俄刻唐吳融山隂人昭宗時為翰林學士中書舍人帝存指授疊十許藁融跪作詔少選成語當意詳隱逸則嚴謝秦方述睿充符後漢嚴光字子陵餘姚人晉謝敷會稽人月犯少嵗星古者以隱七當之俄而敷死唐奏系會稽人𥘉隱於剡後居泉州南安人號其山為髙士峯方千字雄飛今五雲門外有方千島登波坊有方千池皆隱所也唐孔述睿山隂人與兄充符皆隱嵩山方術則介象吳範嚴卿夷吾吳介象字元則學氣術能于䒢屋上煮物而火不焚吳範字文則明曆數知風氣晉嚴卿善卜筮皆會稽人後漢謝夷吾字堯卿山隂人學風角占候克日卒丹青則孫遇道芬名畫録孫遇僧道芬皆會稽人以善畫著名筆札則孔琳徐嶠宋孔琳之山隂人徐嶠之會稽人皆善草隸書浮屠則道林靈徹晉僧支遁字道林居沃與王謝諸公遊唐僧靈徹會稽湯氐子詩與劉栁善神仙則劉晨阮肇續齊偕記漢永平十五年剡縣有劉晨阮筆入天台山採藥因遇女仙半年還家並無相識驗得七代孫坙太康年失二人所在乃有溪上浣紗之女諸暨有西施流紗石林間舞劒之姝吳越春秋越有處女出於南林越王聘之問以劒戟之術色白天下杜詩越女天下白氣雄萬夫越女論劒曰聞斯道者一人當百百人當萬王𣣔試之其術即見故勾踐復國也有六千君子史記越伐吳發教士四万人君子六千人項氏崛起也有八千子弟史記項羽起會稽得精兵八千人渡江今山隂有項里乃羽與叔父梁避仇之地霸有江浙橫行當代彼二霸之得人尚斗量而車載矧歷世之人材亦足明其大槩建我國朝尤號多士二百年間不可勝紀大則杜正獻之勳德杜祁公衍字世昌會稽人諡曰正獻次則孫威敏之功名孫大資沔字元規會稽人諡曰威敏姚石郎司元祐之直姚給事劬字輝中山隂人無祐中為諌官有直聲顧內相號江南之英顧內翰臨字子敦會稽人束坡贈詩云君為江南英靣作河朔偉萬石雲仍匪建則慶新昌石氏為東南名旌國朝登第者幾三十人二陸棠棣如雲與衡陸左丞佃字農師弟傳字岩老俱有才名比晉二陸吳先生風髙於賀老吳先生名孜嘉祐治平間名士捨宅為泮宫今有祠堂存君子以為賢於賀監一等齊職方迹擬於囦明齊賢良唐字祖之仕至聀方員外郎退居湖山名曰少微自為詩云直當山靣開三徑平截波心種緑楊錢氏世賢科之盛錢內翰昜會稽人景德三年中制科子明逸慶歷二年彥逺慶曆六年並中制科史門繼衣錦之榮剡中史氏兄弟相繼登科鄉號繼錦劉求以義門顯會稽求氏上虞劉氏並號義門杜趙以處士稱王荆公有贈越中處士杜醇詩趙處士仲淵祥符中𬒳召不赴或覽古以㳅詠故朝奉大夫華君名鎮字安仁嘗著會稽覽古詩百餘篇或編啚而著名諸葛深字通甫總集歷代帝王年紀自三皇至于大宋編之為啚名曰紹運至若聮翩桂籍焜耀簮纓名登史䇿足疊天庭蓋嘗詢之故老往往莫識其名矣故千岩競秀萬壑爭㳅者顧長康之言也劉義慶世説云顧長康從會稽還人問山川之美顧云千岩競秀万壑爭㳅山轉逺轉高水轉深轉清者李浙東之記也唐李遜遊妙喜寺記越州好山水山轉逺轉高永轉深轉清瑰竒市井佳麗闉闍者白餘杭州詩也白樂天和元稹陽明洞天詩云瑰竒填市井佳麗溢闉闍忠臣係踵孝子連閭者虞功曺之對也虞翻對王府君曰海嶽精液善生俊異是以忠臣係踵孝子連閭下及賢女靡不育焉越之山川風物其大略如此子真始驚而疑卒歎而曰壯矣哉盛矣哉山川如斯人物如斯吾未之前聞也然越在春秋僻處東夷夫子作經􅵘為於越其人材風俗固未可與齊晉魯衛諸列國抗衡也今有君所稱幾不容口豈昔日逺于京畿含香未越如王景興之言邪王景興問虞翻曰聞玉出昆山珠生南海逺方異域各生珍寶曽聞士人歎美貴邦舊多英俊徒以逺於京畿含香未越爾功曺雅好傳古寧識其人邪翻對云云抑山川降靈孕秀固自有峕邪抑亦因人作成而致然邪有君曰昔嚴朱二子為漢名卿晝繡故鄉夾道郊迎爭觀快覩歆豔其榮故其俗始尚文學而功名嚴助朱買臣貴顯漢朝文辭並發上拜買臣會稽太子謂曰冨貴不歸故鄉如衣繡夜行今于何如買臣頓首辭謝晉王右軍為越內史雅會蘭亭㳅觴曲水臨池墨妙輝映千祀能使遺文感槩君子故其俗始尚風㳅而多翰墨之士晉王羲之除右將軍會稽內史以上巳日與謝安孫綽許詢之㳅會于蘭亭㳅觴曲水自為之序其未云後之君子亦將有感于斯文唐元微之一代竒才罷侍玉皇謫居蓬萊賓竇鄰白唱酬往來繇是鑑湖秦望之竒益聞故其俗至今好吟詠而多風騷之才唐元稹字徴之罷相為浙東觀察使辟竇鞏為副鞏工在詩與之酬和故監湖秦望之竒益傳時號蘭亭絶唱微之川宅詩云我是玉皇香案吏謫居猶得小蓬萊時白樂天守杭常以詩筒往來後白赴闕留贈云從此舟人應省事寂寥無復遞詩筒不獨此數君子也任延張霸以尚賢為治而俗始貴士後漢任延為郡尉會嵇稱多士延皆聘請高土如董子儀嚴子陵待以師友之禮郡中賢七大夫爭往官焉張霸為守表用處士顧奉公孫松等其餘有業行者皆見擢用郡中爭厲志節習經者以千數劉寵車俊以潔已化下而人斯尚清後漢劉寵為太守郡中大化召為將作大匠山隂五六老叟人齎百送寵寵為人選一大受之吳軍俊為太守在公清忠第五倫下令而淫祀之風革後漢弟五倫為太守俗多淫祀常權牛祭神財産困匱其自食牛肉而不以薦祠者發病且死先為牛鳴前後卲將莫敢禁倫到官移書屬縣曉告百姓後遂斷絶諸葛恢蒞政而陵遲之俗興諸葛恢為太守元帝謂曰今之會稽昔之關中政之所先君為言之恢曰今天下喪亂風俗陵遲冝尊五美屏四惡進忠實退浮華帝納之以政績弟一增秩至若李唐刺史九十八公首有龐玉顯有姚崇圖經十子郡績稱雄唐太守題名記元九十八人揔𬋩龐王為首其最顯者姚元之後為開元賢宰相以名見于啚經看十人李大亮竇懷正薛平陸亘揚於陵李遜薛成元稹王式式弟龜國朝逮今蓋百餘政前有文簡後有文正題名所記比唐為盛宋大守題名記始於畢文簡公士安其問顯者非一而尤賢者茫文正公承宣得人風俗斯美蓋亦理之然也子真曰是誠有之然皆二千石之事爾未足多也願聞其上者有君曰昔勾踐懲會稽之棲也史記越王伐吳吳敗之夫椒越王乃以餘兵五千人保棲於會稽痛石室之辱也吳越春秋越王入臣吳拘於石室之中越王服犢鼻著樵頭斫到飬馬蓼目水足抱氷握火越王念復吳讐苦身勞心夜以接日目卧則切之以蓼足寒則漬之以水冬常抱氷夏還握火采蕺于山越王為昊王嘗惡遂病口臭范蠡乃令左右皆食岑草以亂其臭越人至今以為俗岑草蕺也見前注置膽于坐史記勾踐反國置膽于坐坐卧即仰膽飲食亦嘗膽也日汝忘會稽之耻邪葛婦興歌名曰何苦其詞曰嘗膽不苦味若飴令我采葛以作絲吳越春秋越王使國中男女人山采葛作布以獻吳王吳王大恱葛婦傷越王用心之若乃作何苦之詩云云二十年間焦心苦志卒滅強吳以雪前恥越絶之稱權輿於此越絶書聞者曰何謂越絶越者國之氏也絶者絶也謂勾踐時也故其俗至今能慷慨以復讎隱忍以成事若是何如子真曰茲百者之事也傳不云呼碎而王駁而霸彼齊威晉文之盛猶不足稱於大君子之門况勾踐呼有君曰昔禹治水之畢與群后計功苗山更名會稽卒而葬焉祠廟陵寢于今尚存啚經禹陵在會稽山吳越春秋禹到越因病死葬焉葦椁桐棺穿壙七尺下無及泉隤高三尺土階三等越絶書少康立祠於禹陵所上有遺井賀循地志云會稽山有禹井去禹穴二十五步謂禹穿鑿故因名之下有菲泉過而飲者莫不發免魚之歎興河洛之思不獨勾踐有其烈史記勾踐有禹之遺烈馬侯嗣其功馬臻創立鑑湖至今其俗勤勞儉嗇實有禹之遺風若是何如子真曰美哉禹功宜其代舜而有天下也遊於是穸於是廟食於是兹所以化𬒳万世之久也然説者以為入聖域而未優其必有大於此者呼有君曰舜生於諸馮孟子以為東夷之人歷世逾逺㳅傳失真太史公以為兾州然邪否邪史記舜兾州人兾在河南非東夷也與孟子之説異然越之邑則有上虞餘姚啚經夏禹與諸侯會計因相虞樂於此故曰上虞周處風土記云舜後支庶所封舜姓姚故曰餘姚一日謂邑有姚丘即舜母握登感大虹生舜之地山有虞山歷山啚經虞山在餘姚西三十里一云在上虞之東太康地志云舜避丹朱於此歷山在會稽東南八十四里舊啚經云昔舜耕之所水有漁浦三憮啚經上虞縣北有漁河是舜漁之處又上虞有地名漁濱虞濱水經媯石入東海江裏有上中下三憮言二女降時媯地高險回曲使者至險輒憮然而嘆故曰三憮墬則有姚丘百官風土記舜生於姚丘去上虞四十里有姚丘即姚丘也新記云書平章百姓今上虞有百官里會稽記百官者丹朱從舜於此里焉有桌日人人上虞有桌日人人里舜時供儲在此陶焉有灶上虞有古陶灶言舜所作汲焉有井舜井在上虞西北三十五里又有舜水在縣南二百五十步祀焉有廟舜廟在上虞縣西三十五里皆其遺迹也意者不生於是則遊於是乎舜為人子克諧以孝故其俗至今蒸蒸是俲舜為人臣克盡其道故其俗至今孳孳是蹈舜為人兄怨怒不藏故其俗至今愛而能容舜為人君以天下禪故其俗至今廉而能遜若是如何子真矍然離席而立拱手而對曰於戲噫嘻盡善盡美雖甚盛德蔑有加矣昔季禮觀樂而止於韶自韶之外不敢觀余問風俗亦極於舜自舜之外不復問矣無妄先生粲然失笑於旁曰固則子真之問有君之畣也兹皆古之越非今之越也人死骨杇世變風移山川雖在人物已非前日淳朴變而澆偽前日廉遜變而爭􅴠前日勤儉變而矯怠前日忠孝變而凶悖尚何執𥿄上陳迹而譊譊其頰舌邪有君曰先生之言是也然風俗不常美亦不常弊善焉惡馬維人是繫今朝廷駐蹕東南越為巨藩密邇堯天蓋尺五間帝命重臣來鎮是邦入境問俗登堂觀風卧龍山有觀風堂因舜禹之遺化明吾君之至仁布德教於黃堂變簿俗而還淳矧何世之無才亦奚有於古今子不見夫銜命虜庭死於王事如陳公張公者呼陳公名過庭張公名字發靖康問為和議使成死於虜中議禮靖康赴難建炎如華君傳君者呼華君名初平靖康𥘉為太常慱士議禮不屈事見李參政所作墓志傅君名嵩卿建炎間虜犯浙東越守以城降公舉兵赴唯越人賴之是豈異代之人邪又不見夫姚江陳公陳公名槖所臨有聲亦克之退身名兩榮執政李公李公名光忤意權臣老於淪落世賢其人愍孝蔡子捐生可悲同彼旌忠廟食于兹蔡孝子名定父以罪繫獄請代弗許遂自沉于河竟脫父罪事間乎朝立廟號愍孝建炎間越守以城降虜班直唐琦奮甎繫虜慢罵而死廟號旌忠隱吏王君王君名公衮手斬發冢之讐自投于府斬讎著名一門可稱賢父難兄兹固先生目所親覩也安知後之眂今不猶今之眂古呼先生曰有君越人也知越之風俗而已矣昔子虛夸雲夢烏有先生詫齊亡是公折之以上林之事今越未足侔齊楚之大尚何足以夸之有君曰昔吳子問桞先生以晉國之事而桞以晉對今子真問余以越國之俗而余吕越畣亦各因其所問而及之爾余豈瞢然無聞無知於越之外哉今天子披輿墬之圖思祖宗之績求治如不及見賢而太息文德既修武事峕閲蓋將舞干戚而服逺夷復侵疆而旋京闕余俟其車書同南北一倣吉甫美周室賦嵩髙歌吉日招魯公命元結磨蒼崖秃巨筆頌中興紀洪烈邁三五敻前牒亘天地昭日月於是窮章亥之所步考神禹之所别覽四海九州之風俗掩兩京三都之著述騰萬丈之光芒有皇宋一統之賦出回視會稽蓋甄陶中之一物無妄先生自知失言色有餘愧乃與子真逡巡而避有君退而傲於南囱有飄飄凌雲之氣民事堂賦并敘堂名民事志天語也某備貟越幕歲將期顧惟不才瞢然無輔日以敗官曠職為憂所幸黃堂主人甚賢同僚皆士君子朝夕講論無非民事之要者因為之賦以志其一二云繄越幕有下僚兮名所寓曰民事之堂誦天語之丁寧兮銜聖恩而不敢忘啖民脂以飽妻子兮猶雀鼠之偷太倉苟不民事之是思兮又將奚逭呼天殃嗟會稽之大府兮罹荐歲之凶荒颶風作於孟秋兮雨浸淫而異常天吳怒而江濤沸溢兮飄廬舍而壞隄防粢盛害而歲大侵兮民餓踣而流亡射的黑而米斛千兮擷蓼花而為糧是歲飢民擷蓼花掘草根而食痛瀕海之雖蚩兮葬江魚之腹腸上虞縣淹死者幾百人豫嘗告其故於前使君兮請敷奏於岩廊顧幕中平日之辨兮人乃靳其為狂會伯尊之傳召兮逹民瘼於九重豫殆有類於輦者兮亦何恨夫言之不庸洪惟當寧之至仁兮視赤子其如傷蠲常賦而救天災兮出內帑之所藏哀東州之無告兮惠吾民以龔黃左公孝而右孟博兮相與協贊其惟良先撫字而後催科兮正今日之所當寬公私之積負兮以俟呼歲之豐穰省訟牒之煩苛兮抑蠹政之豪強節無用之浮費兮俾斯民之小康兹政事之所急兮敢不忠告呼黃堂至若鑑湖利及九千頃兮日侵削而就荒歲和買無慮十萬縑兮曽無一錢之償榷酤之利半奪於有力兮財賦浸以荒涼兼并之弊熾於大族兮編氓餒於糟粳兹又越中之巨害兮姑略言其大綱若夫民事之在天下兮固不足以知其詳有一言以盡之兮曰生之而不傷擇守令兮去姦贓慎弗擾兮如牧羊兹畎畝之惓惓兮願入告于天王蓬萊閣賦并敘越中自古號嘉山水而蓬萊閣實為之冠昔元微之作州宅詩世稱絶唱近代張公伯玉三章膾炙人口好事者從而和之獨未聞有賦之者某筮任之𥘉辱為蓬萊客乃者中秋之夕與同僚會飲于兹閣覽湖山之勝玩月于樽爼間即席賦詩諸公皆和既而念之閣不可以常登一詩不足以盡意遂從而賦焉王子遊會稽客蓮慕登卧龍之山躡巨鼇之閣秀閲千岩㳅觀萬壑縱逺目於東州暢幽懷於廖閣于時天高氣肅秋色平分簮盍良朋把酒論文俯仰湖山懷古傷今登髙賦詩以寫我心周覽城闉鱗鱗万户龍吐成珠龜伏東武三峯鼎峙列障屏布草木籠蔥煙霏霧吐棟宇峥嶸舟車旁仵壯百雉之巍垣鎮六州而開府東望稽山思禹之功喬松鬱呼故陵丹青儼於祠宫藏丹書於神穴㳅遺畫於無窮南目秦望哀秦之過方鑱石以頌德驕顔色以相賀嗟仙藥之不來俄腥風之已播西望夕陽送目蘭亭懷王謝之風㳅感斯文而涕零徒觀夫茂林修竹鎖煙靄而冥冥北望滄海渺其無涯方吳門之畫龍視越國其如蛇轟雷鼓於一震虛吳國而成窪訪麗譙之故址第見呼古木之號鴉前瞻鑑湖滿目雲水嘉馬侯之偉績慕賀監之高軌祠荒兮遺迹半湮宅冷兮黃冠無幾徒有漁舟賈楫風樵航葦往來呼鷗鷺之鄉欵乃呼煙波之衷仰瞻高閣翬飛崔嵬俯瞰州宅𬗟懷髙才靣無時之屏障家終日之樓臺長湖山之價於几席之上惜斯人之安在哉言未畢客有指斯閣而謂豫曰子亦知夫閣之所以得名者呼蓋始於元和才子也以玉皇案吏之尊擁旌麾於千里也蓬萊隔弱水三萬里以筆刀坐移於是也齊名有白從事有鞏胸中有萬頃之湖真一代之竒偉也詩章一出遂能發秦望之精神增鑑湖之風采蘭亭絶唱亘古今而莫擬也子亦讀夫才子之傳否呼姑問訊其從何而來集呼彼而至于此也才子之才固足以起吾子數百年之聳慕才子之所以獲侍玉皇者亦吾子之所喜攻而深耻也夫何昔之有豫於是引客之手揚𬒮而起言契豫心諾諾唯唯有是哉斯人也而至於斯也尚忍言之哉俄而鼓角作於人間明月出於林端妙三弄之梅花爛十分之銀盤釂一觴而徑醉有不盡之餘歡頃之隂雲忽興點綴青天漸山川之蒙籠若有妬呼嬋姢倚危闌而感槩覺興盡而思旋矣於是相與啜茗於清白之堂潄齒於清白之泉閲唐宋之題名終夕為之慨然嗚呼噫嘻死者可作吾與誰歸其無出呼文正范公之賢梅溪先生後集卷第一梅溪先生文集卷第一詩教授建昌何㶇校正甽畝十首甽畝有遺士妄懷葵藿心朝夕傾太陽不耐氛穢侵肝膽有古劒願言決群隂兹志尚欎欎抱膝成悲吟古道日云邈古意誰復知陽春漠無和流水空含悲郢曲變新調鄭聲入朱絲喟然三嘆餘默與羲皇期讀書不知道言語徒自工求道匪云逺近在義命中吾儒有仲尼道德無比崇傳參十八章入道知其宗後學昧極致徒知授兒童孰識孝與弟理與神明通為臣不知此事上焉能忠仲尼作春秋垂訓千萬年古者父母讎義不共戴天莊同父何在乃與齊侯田魯國無臣子君親義茫然齊紀不並立諸兒得稱賢善惡不可掩筆削至今傳飛飛古帝魂哀哀寄春怨異鄉莭物新故國人事變訴亡誰肯憐啼苦血空濺雲安再拜人傷哉不復見彼微雙鶺􅟀飛飛同一原急難喻兄弟義著周雅篇周公代武王大義今古傳人孰無兄弟急難斯見焉願懷周公心無愧詩人言竹有君子節青青貫四時桃李媚春光千株弄妖姿世眼恱繁豔疇能賞幽竒君看桃李蹊蹄轂紛爭馳君看竹林下形影誰相隨七賢久淪沒高躅猶可追吾家植千竿風月足自怡豈不競時好聊為歲寒期兀兀窗下士筆耕志良苦黃卷對聖賢慷慨深自許一朝出干祿得失戰胸宇曲意阿有司諛言徇人主貪榮無百年貽謗有千古丈夫冝自貴清議重刀斧我豈不𣣔仕時命不吾與曷不枉尺求權門正旁午非道吾弗由兹心巳先許願言安貧賤順命為出處儒冠誤身世偃蹇二十年豈不懷明主冨貴乃在天平生學忠孝自致無由前青燈照夜長感激徒自憐觀國朝故事昔在景德𥘉胡魯犯中原朝廷用萊公決䇿幸澶淵髙瓊雖武夫能發忠義言詠詩退虜騎用醜樞相顔鑾輿至北城斷橋示不還一箭斃撻覽夜半却腥膻至仁不忍殺和好垂百年偉哉澶淵功天子能用賢昔在康定𥘉元􅉴叛西陲朝廷起韓范節制閫外師二公人中龍材略超等夷胸中百萬對面千里機不比大老子而令虜能欺深期復靈夏重勒燕然碑軍中果興謡西賊心膽墮逆節遂稱臣戰士解甲歸社稷安泰山四海絶瘡痍堂堂寧復有為作思賢詩昔在元佑𥘉朝廷用老成元惡首竄殛賢雋皆彚征簾幃八年政內外咸清明四夷各自守天下幾太平紹聖黨論起宵人壞典刑二蔡唱繼述曲學尊金陵忠良投海島黨籍編姓名春秋亦獲罪學者專三經心術遂大壞風俗從此傾養成前日禍中原厭羶腥我𣣔著一書善惡深勸懲姦諛誅朽骨潛德發幽馨六賊未足罪禍端首熙寧冨公昔使虜厲色爭獻納臣節安敢虧君恩以死答煌煌中國尊忍為豺狼屈堂堂漢使者剛氣不可折斯人嗟巳亡英風復誰接銜命虜庭人偷生真婢妾㶁㶁岸下水㶁㶁岸下水汝流𣣔何之但見日東注寧有還源期尼父川上嘆逝者亦如斯人生百年間擾擾無巳時利名役𥘉心百歡無一追待汝後知悔桑榆景堪悲感此盍悟彼毋為浪吁嘻宣和乙巳冬大雪次表叔賈元實䪨天公昨夜屑瓊花三尺深深曉更加桞不待春先起絮梅非因笛自飛華牧羊大窖人何在駐馬藍關路更賖安得晴天開萬里行人愁思渺無涯傷時感懷三萬六千成擲梭歡娛常少愁常夛干戈今日猶未定書劒他年知若何淡蕩三秋冷時莭蕭條萬里空山河傷時眼淚滿襟血更把少陵詩句哦帝鄉五載亂離中億萬蒼生陷犬戎二聖逺征沙漠北六龍遙渡浙江東斬姦盍請朱雲劒射虜冝貫李廣弓借問秦庭誰慟哭草茅無路獻孤忠駕幸溫州次僧宗覺韻聖主南巡駐六飛邦人咫尺見天威間關高帝尚鞍馬謹厚漢光猶絳衣北斗城池增王氣東甌山水發清輝佇看天仗還京闕無復旄頭彗紫微溫城七山成斗形次韻謙仲見寄湖山藍黛青湖水琉璃碧我時湖邉遊山水正秋色詩翁偶乘興來作湖邉客談鋒兩𥘉交意氣已相得詩壇子與盟文會公為伯豪詞肆滂沛淡語入幽寂心匠巧雕斫物態窮搜覔壯哉五言城卓尓萬仞璧𥘉疑公腸胃百怪所窟宅吐氣干雲霄直欲閗霹靂妙奪解牛術奏刀聲砉剨我才寸莛微洪鍾詎能擊又如鳴蟋蟀啾然和金石未窺學藩籬敢語詩奧賾繆為馬慕韓浪作赤效白奬拔非所蒙猖狂固冝責新篇又拜嘉開緘光豔射藏之比明珠長使夜照席惜哉不遇時豈為臧倉隔儒冠五十年世路疲行役操矛赴文埸戰藝輒敢北書劒兩無成泥塗困蹤迹龍鍾似東野窮愁攪懷臆空吟三百篇髙視古無敵霜風剪林木黃葉滿澤國我思公不見羸馬未能䇿恨無神仙術安得生兩翼因召管城頴免冠加拂拭書帛寄征鴻心目兩俱極送凌知監赴玉環次覺無象䪨晨興趣行裝秋色滿離席悲風苦送聲短晷頻移刻蘭舟薄暮發去去轉遐僻極目望官所沉沉煙靄積清有濯纓水白有潄齒石悠然水石間官情聊自適朝焉遊其南暮焉戲其北王環有南北社彼微山中鳥亦將識公德公無賦歸去田園付人役答毛唐卿虞卿借昌黎集豫少不知學古難學古直𣣔學到韓奈何韓實不易學怛覺晝夜心力殫茫然故步亦巳失有類夀陵學邯鄲雖然豫心未肯巳尚𣣔勉強求其端跬步不休效駑馬千里未至空長嘆羡君兄弟俱早慧家學豈止傳柔溫聖經賢傳飫巳久百家諸子皆蠧殘學文要須學韓子此外衆説徒曼曼韓子皇皇慕仁義力排佛老回狂瀾三百年來道益貴太山北斗世仰觀我生于今望之逺時時開卷相欣歡豈惟廬陵惜舊本我亦惜此秪自看子今𣣔假敢􅒛願子寶之同琅玕辛亥九日侍家君同孫子淵子昭子尚登髙于家之東山時菊花未開坐客皆以為恨至十月望獨步東籬下見前日青枝巳爛熳矣東坡云涼天佳月即中秋菊花開日乃重陽不以日月斷也於是命酒肴呼鄰里飲於叢畔云前日重陽日與客同登玩有酒無菊花把杯一長歎良辰苦易失十月今又半緬焉想前逰獨到東籬畔鮮鮮霜中菊滿地金錢粲我思東坡言鄰里乃相喚斬新作重九不以日月斷人生貴適意世俗豈能絆遇酒郡歡樂取醉期爛熳羲和馭白日疾劇走丸彈百年能幾何不飲乃癡漢次韻季仲默見寄豫少擇交遊有友四五子仲默姿不凡好學喜觀史寄我新詩章我驚欲掩耳昔日心未降而今巳􅑙矣我義事章句滋味一杯水平生况多愚於巳不自揣林間等蟬噪井底作蛙視今焉見君詩吾誠二蟲比豈敢妬且熱低頭拜不止思𣣔和其音兀坐輒忘起沉吟竟不成徒覺倦兩髀徒今焚筆硯不復坐書几題湖邉莊十里青山蔭碧湖湖邉風物畫難如夕陽茅舍客沽酒明月小橋人釣魚舊卜草莊臨水竹來尋野叟問耕鋤他年待挂衣冠後乘興扁舟取次居湖邉懷劉謙仲湖山如畫水如籃杖屨湖邉酒半酣往事蕭條誰共説舊遊零落我何堪炎涼世態從他變生死交情秪自諳詩客有魂招不得秋風依舊滿江南寄孫永之名龜年沂州人詠歌沂水舞雩風氣壓當時冠與童人似賈生年更少家傳孫綽賦尤工孤羆傲兀深叢裡一鶚軒昻衆鳥中早取功名寄衣鉢古來相種出山東寄毛虞卿名公弼後改名宏字叔度登乙丑第文會今年喜重尋葭姿玉質又同林弟兄並秀如君少朋友相知獨我深一别幾勞終夜夢相逢更話百年心長卿賦有凌雲志却笑區區蚓竅吟虞卿工賦嘗笑豫作詩而不事舉業次䪨虞卿送别喜君直諒更多聞共惜光隂寸與分螢照夜窗才暖席蟬吟秋樹又離群尊前忍聽陽關曲江上愁看日暮雲别後誰能尉牢落錦囊長帶故人文次䪨劉方叔見寄名鎮登戊辰科交情貴久豈須頻我輩尤冝率且真子政有孫誠益友長卿何代乏詩人論文𥘉喜逢知已言志深期共致身箕斗相望正南北頴川何夕聚荀陳寄方叔故人一别路漫漫又覺春生到水村魚躍雁飛空注目栁開梅落自消魂唱酬應有詩千首談笑長懷酒一尊正是剛腸九回處子規聲斷月黃昏潘岐哥鶴溪先生聚徒于樂清之鹿巖既久因家焉辛卯秋得子名之曰岐哥次歲孟春書來語曰吾家岐哥以某年月日生盍以詩贈之某不敢辭先生名翼字雄飛君不見鳯之雛驥之子潘家岐哥無乃是鶴溪仙子降英靈雁蕩名山鍾秀美顔色純明白玉璞精神皎潔秋江水胸中之氣已吞牛開眼睛光如虎視此兒竒絶非常兒小子觀人蓋多矣寧非漢代偷桃朔别是唐家謫仙李愚知先生百不憂但患此兒名盛耳先生才髙爵未綰賴渠力振家聲起鹿嵓他日築髙門車馬煌煌塞閭里贈余取新小邑那能敵大邦與君角力固非雙氣驕欲縱偏師戰勢屈翻求北面降深懼操戈重入室自慚閣筆久臨窗定知𥿄價從今貴余子詩名滿蜃江次韻咱監務早梅群芳避路放梅開奔走逰人滿砌苔半樹溪邉衝雪破一枝頭上帶春回月移瘦影供吟興凮薦幽香襲酒杯剛𬒳西湖都道盡至今詩客句難裁寄賈一蓈無奈窮冬易感傷况添離别助凄涼五更月殘頻成夢十里青山幾斷腸短棹未乘晨雪去尺書聊遣暮鴻將少年勉力親燈火要使家聲繼洛陽孫子尚過明慶以詩見招未及往次韻剡溪未起子猷尋空對溪山恨滿襟孤雁逺來天杳杳故人相望雪深深思君一日成三歲寄我行書直萬金惆悵今宵一尊酒邀明月伴孤斟送子尚如浙西嗟我窮居海之角人物素殊鄒魯俗年雖及冠無交遊孤陋寡聞獨學閉門不出長太息思得其人共磨琢孫子往從西北來頭角軒軒真一鶚飄飄逸氣凌雲霄凛凛髙談吐鋒鍔文辭翰墨兩竒絶世上群兒徒碌碌我昔風期一相遇欣然握手論心腹衡茅三度枉車軒書劒連年共燈燭論交自喜得房杜言志端能效來郝長篇短䪨迭賡唱明月清凮共斟酌囊無一錢身不憂食止一簞貧自樂有友如君復何憾百不為多一巳足今焉捨我將何之遂使江鄉復蕭索南國𥘉寒旅鴈來吳江已冷丹楓落惜君不盡與君别兀坐無言情更惡干戈未息行路難胡馬今猶飲河洛京國有家歸未得錢塘此去仍棲託會須徒步謁天子慨然一吐胸中略請纓縳虜壯志士庶使平時語無怍相將暖律破寒梅驛筒逺寄無辭數懷子尚滿眼干戈行路難故人千里駐征鞍幾勞終日馳魂夢安得乘風插羽翰水北山南春寂寂天涯海角路漫漫欲慿人寄新消息手把梅枝仔細看樂清僧寮有過容錢之翰題二絶有傷時之嘆因次其䪨終日傷心淚濺花干戈滿眼恨無涯衣冠南渡如東晉安得車書混一家功名誰復漢嫖姚壯士逢時豈憚勞半夜飛來看寶劒此身端許擲鴻毛讀親征詔書二首甲寅季冬讀親征詔書哀痛切骨畎畝愛君情至於此食祿者義當何如胸中展轉不能自巳故作二詩逆虜何時正典刑久聞諸將擁強兵中原未雪十年恥聖主自勞千里征楚國群臣誰慟哭杜陵野客自吞聲君恩壓頂丘山重命擲鴻未是輕諸將年來巳極榮回看煙閣欠功名八年猶未平淮甸一戰那能復帝京畎畒忠臣自憂國閭閻小子妄談兵慿誰決天河水一洗乾坤萬里清次䪨題曺大夫懷忠閣小閣誰懷畎畝情遙瞻天日眼增明平生憂國丹心在一飯思君血淚橫豐市功臣真有種并汾壯士素蜚聲區區問舍求田者應𬒳元龍一笑輕聞韓師世忠退保丹陽逺近憂懼州縣議結鄉兵以備不虞閭巷少年貫弓走馬若有得色感而有作逆虜縱橫未剪齊王師退保浙江西羽書日報猶未息戎捷逺來何太稽千里戰新鬼哭滿天隂雨夜烏啼臂弓腰箭誰家子竟日鳴鞭躍馬蹄和劉方叔溪上一絶杖屨徘徊駐碧溪遙看飛瀑下崔嵬乘槎𣣔訪吹簫客煙草茫茫沒舊臺和方和見贈二絶相對清談味有餘始知勝讀十年書塵襟不用頻揮麈自有清風為掃除一舍蕭然學有餘窗間遮眼盡文書巳將事業盟燈火萬事何煩酒破除得陳商霖書山館無人慰索居喜君交契有終𥘉舟扁方起雪溪興尺素又傳魚腹書炊黍定尋前日約題詩寧怨故人踈好來相共親燈火可惜青春度莫虛昔與南浦劉謙仲大梁孫子尚遊自劉死橫陽孫亦有浙西之役交舊零落為之慨然感而有作劉翁泯泯已新鬼孫子飄飄猶旅人詩酒舊遊誰在眼江山回首自傷神招魂擬同橫陽道有夢長飛霅水濵死者不生生者别死生離别兩沾巾次韻李刑曹病起書懷中原回首尚塵飛書劒南來早識機方事髙眠學安石却愁多病似王徽腸枯謾有書千卷腰瘦難勝帶十圍志士未逢聊爾耳古人何用泣牛衣又用前韻文園病思亂如飛禪榻逍遙謾息機漸喜珠絲封藥褁未容鶴髮上簮徽酒能伐性聊須止碁恐勞神未敢圍惟有詩懷禁不得任他憔瘦不勝衣送曹大夫赴行任所西北連年殺氣髙群盜橫行如蝟毛廉頗李牧不丗出吾皇側席心焦勞汾陽自古多壯士曹侯意氣千人豪年今四十猶偃蹇拊髀長歎淹龍韜慨然揮抉謁行在報國已淬腰間刀登壇拜將預指日看君舉手清風濤梅溪先生文集卷第一附録有宋龍圖閣學士王公墓志銘公諱十朋字龜齡姓王氏溫州樂清人曽祖信祖格父輔父以公貴贈左朝散郎母萬氏贈碩人其先自錢塘徙至朝散公始業儒有聲公少頴悟強記覽為文頃刻數千言事親盡孝其居鄉進止取豫必以義後學師尊之既入太學多士皆推敬焉太上皇帝躬攬權綱更新政事紹興二十七年䇿進士于廷詔對䇿中有指陳時事鯁亮切直者並置上列無失忠讜無尚諂諛稱朕取士之意既而考官以公所對進上臨定其文以為經學淹通議論純正可苐一及唱名則公也士論翕然稱愜詔益嚴銷金鋪翠之禁且以交趾所貢翠羽焚於通衢實自公發之授左承事郎僉書建康軍莭度判官聽公事又詔王某係朕親擢第一人欲試以民事尚待逺闕可特添差紹興府僉判秩滿除祕書省校書郎尋兼建王府小學教授時北虜且畔盟朝廷疑之猶未敢誦言為備公因轉對力陳其不可無備者且曰禦戎之䇿莫急于用人用人之要莫先於人望今若內若外士夫軍民咸謂有天資忠義才兼文武可為將相者有長於用兵士卒樂為用可為大帥者或置散地或守逺郡願陛下起而用之可以作士氣寢敵謀又言三衙管軍或久而不代兵柄在手利權財路又皆入其門且其官至三公樞密所以莭制諸將者乃班其下倒置如此其能莭制之乎併諸軍承受皇城邏卒之敝其他指陳率人所難言者三衙之將有言也人皆危之而上特開納焉既而罷諸軍承邏卒亦加職更定樞密與管軍班次管軍亦引去邉備益嚴舊人相繼復用自昔人臣論一事或章十數上或合衆力爭不能回公以一言窹意而事皆次第罷行於是天下仰上之聰明大度虗懷從諌非徒優容之而巳然大臣有不樂者公亦數求去除著作佐郎罷其兼職公以求去得遷力辭不許久之除大宗正丞仍待次尋得請主管台州崇道觀今上即位除知嚴州未赴間召對公奏言太上皇帝非耄耆倦勤之時而以天下授之陛下其賢於堯舜逺矣陛下所以仰副太上付托者當何如舜重華協于帝然八元八凱堯未及舉而舜舉之四凶堯未及去而舜去之今社稷之大安危生民之大休戚人材之大進退朝廷之大刑賞其所當行者冝若舜之所以協于堯而行之以彰太上知子之明以盡陛下繼述之道又言今和戎與戰守之議未決臣謂或戰或守當相時進退而和決不可議也又言右相虗位天下拭目觀陛下此舉必諸大夫國人皆曰賢然後用之可也不可非其人以失天下望除司封員外郎兼國史院編修官又兼崇政殿説書除國子司業諸生固巳迎服矣而公于學校事其細微曲折皆參前知所舉措無不當人心者會詔百官言事公上疏以為百官進退者大臣之職論思獻納者侍從之職正朝廷紀綱者臺諌之職今居其位者往往不舉其職冝有以董正之雖然此特人臣之職也而人主有大職事曰任賢曰納諌曰賞罰其言反覆詳盡切于時務上覽而嘉之即召公與工部侍郎張闡對便殿從容論天下事甚衆請退復留者再賜坐賜酒又賜御書隆興元年四月除起居舍人改兼侍講公與左史同奏史職廢壞者其一曰起居注録本進呈非古欲叨進其二曰雖侍立而在殿東南隅未嘗聞天下德音如二府自有時政記其餘臣僚登對欲許令史官侍立其三曰後殿侍立而前殿則否于義無據欲前殿侍立其四曰直前奏事欲不必預牒閣門及候班次皆從之越月除侍御史公素以剛毅正直稱天下至是人皆曰真御史矣公益自任以當世之重大抵以定國論正人心為本而去其害治者不屑屑於細故也江淮都督府出師進取宿州虜悉衆來爭我師退守淮都督張公浚上表自刻公奏曰臣自捴角在草苑間聞醜虜亂華痛心疾首義不戴天臣素不識張浚聞其天姿忠義誓不與賊俱生實敬慕之頃以館職輪對首言虜情不測乞用浚等既而虜果入寇太上皇帝親遣浚浚知建康府陛下即位因以江淮都督之任委之天下皆以為當臣去冬𬒳召至闕前浚進對皆以為恢復大計仰贊聖斷又乞陛下勿二以濟大業浚遣二將取靈壁虹縣宿州降三大將一月三捷議者皆服陛下任浚為難及王師不利橫議蜂起臣嘗奏陛下用兵為祖宗靈寢而舉為二百年境土而舉為中原弔民伐罪而舉與古帝王好大喜功開邉生事不同投機而進知難而退益當內修政事俟時而動陛下剛明果斷規模固已素定然異論紛紛不肯置浚今浚既待罪臣其可尚居凨憲之職欲望正臣妄言之罪特加竄殛詔以公權吏部侍郎辭不拜乃以集英殿修撰知饒州乾道元年七月移知夔州尋除敷文閣待制三年七月移知湖州未幾得請提舉江州太平興國宫才數月起知泉州進直學士又移知台州公以病力辭且乞致仕乃復提舉太平興國宫七年三月除大子詹事詔旨敦趣公力疾造朝上特御選德殿而公足弱不能趍詔給扶減拜且賜坐又詔權免朝參又遣使以告及金帶就賜公三上章乞致仕乃詔以龍圖閣學士致仕命下而公薨矣實七月丙子也享年六十上聞嗟悼賻恤有加令兩淅路轉運司給葬事公積階至左朝奉郎封樂清縣開國男至是贈左散大夫遺戒喪事毋得用佛老教諸孤行之以十有二月丙午葬公于縣之左原白巖碩人賈氏有賢行先公二年卒至是合祔焉男三人聞詩聞禮皆太學生孟丙蚤卒公兩遇郊祀恩皆奏其弟故二子皆未仕女二人長嫁進士錢萬全次許嫁賈梓孫男女四人公立朝議論出處大莭既如此矣𥘉公以文學先天下人謂其於吏未必數數然也而自為郡佐遇事不苟民有訟久不決多走諸司乞諉公雖文書填委公一一翻閲不以付吏審核情偽參用經律所與奪人皆厭伏其治郡既以廉潔公正率其下間有為不善者則反復告戒誠意篤至人亦有恥故未嘗按吏為文勸導百姓以遷善逺罪之意有爭訟則曉以義理多退聽者故鞭朴罕用事至立斷其甚不得已乃推鞠亦不淹繫故獄屢空未嘗遣官吏至縣而人素信伏事亦舉利有可以豫民者豫之輸租使自操概而用度有莭財亦足月率兩詣學宫延見諸生從容誨誘且以詢郡政饒久旱公下車即雨湖久雨傷稼公八境即霽每罷郡士民涕泣遮擁不容去或借留於部使者既不得則奔走道路或越境不忍别者衆人聞公喪會哭于開元僧舍又立祠堂以事之近世為政得人心未有如公比者公有梅溪前後集五十卷尚書春秋論語孟子講議皆指授學者未成書也公於文敷尚理致不為浮虛靡麗之詞其論事章疏意之所至展發傾盡無所回隱尤條鬯明白蓋自漢氏尊用儒術而士或飾詐或阿諛取容至於守莭死義能為國重則未必以儒名者世遂以儒相鄞若公之學問粹然一出於正謹守而力行之義之所在疾趍徑前未嘗以利害豪髮顧避更閲夷險特立不回施於政事左右具冝信乎其有本如是也嗚呼此真所謂儒者耶銘曰漢廷用儒黯獨戅朴淮南憚之謀不敢作謂公孫輩發發振落儒豈不用其效奚若孰知其故鼠臘非璞公之莭義視黯無怍屹然立朝作丗郛郭正色凛凛危言諤諤招之不前麾之不郤猛虎在山衛及藜藿出守四郡治行皆卓問胡為然非智之鑿聖有謨訓守約施博惟其躬行粹美無駁道固如是不由外鑠於彼汲直如玉而琢我為銘詩以表儒學人雖云亡尚有矩彠端明殿學士左朝議大夫提舉江州太平興國宫匕饒郡開國侯汪應辰撰承事郎直寶文閣權發遣靜江軍府廣南西路兵馬都鈴轄兼主管本路經略安撫司公事賜𬗋金魚袋張栻書宣教郎新權發遣南康軍事朱熹題蓋右先君文集合前後并奏議五十四卷紹熙􅩐子聞禮鋟木江陵歸藏于家痛念先君即丗二十有一年矣不肖孤家貧力弱日夜抱遺書以泣一旦懼溘先朝露無以贖不孝罪會兄聞詩假守浮光以俸餘命聞禮董其役始事于莫春訖工于中秋先君正大之學忠憤之氣愛君憂國之誠仁民愛物之念庶幾一展卷而盡見之職校正迪功郎謝汝能鄊貢進士任炎其間闕亡者異時為别集云男宣教郎充荆湖北路營田使司幹辦公事賜緋魚袋聞禮謹書
