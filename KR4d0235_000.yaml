十朋賢士也有詩云四枚豚犬教知書二頃良田儘有餘魯酒三杯棊一局客来渾不問親踈予亦有東臯二頃两子皆學讀書客至則奕棊飲酒遂用趙君詩意成一絶陳啇英挽詞陳啇霖挽詞萬清之有詩三絶呈司理賈丈并簡某因次其韻再用前韻右呈司理右酬清之右贈犬老司理予未臘而雪豊年兆也大老有詩次韻雪中寄梅花與清之大老題夣齡五桂堂寄鯉魚與萬大年梁府君挽詩䴡水人子安世登科永嘉盧仲脩永年䄂文見訪酬以短句林明仲和詩復用前韻張器光和詩復用前韻寄蒲墨與明仲寄沈敦謨名希臯瑞安人送謝任之題双瀑癸未守歲張噐先復和詩作五言以寄萬孝全贈金華洞石名雪灑遥峯作進退詩次韻元宵鄰里携就弊廬張燈辤之不獲因成一絶祈雨不應自秋七月不雨至于春二月十九日僅得雨昌昌齡作賀詩予未及和而雨止矣遂次韻以閔之社日喜雨復用前韻家食遇歉有飯不足之憂妻孥相勉以固窮因録其語聞小使胡抗虜不屈上甚嘉之有㫖命右揆撫師仍有和不可成之語皆出睿断宗社之福也昌齡有詩次韻昌齡四月十九日得男請名於予命之曰遲山丹花第八卷七月三日至鄱陽次韻何憲子應喜雨登綺霞亭用喜雨韻追和范文正公鄱陽詩郡齋即事㳺芝山寺登綺霞亭用碧雲軒韻降聖節詣天慶觀因謁顔魯公范文正公祠堂用贈御賜名道士韻觀文正像用贈傳道士韻移竹植郡齋之東用懐慶朔堂韻十月望日同官㑹飯薦福送酒生日示聞詩聞禮木藴之即席和文字韻詩酬以二絶觀郡守題名再書一絶項服善知縣和詩酬以三絶并簡林致一教授題薦福寺莫莫堂哭馮員仲陸居士挽詩洪師陳阜卿寄筍次韻何子應題不欺室郡齋對雪子應和詩再用前韻祠顔范二公題何子應金華書院啚閏月三白三首又和項服善二首又用時字韻和洪景盧用作四白詩臘盡日又雪洪復日五白詩再和次韻何子應得宣城筆聞捷報用何韻不欺室三字參政張公書也筆力勁健如端人正士􅌂然人望而敬之因成古詩八韻出郊遇雪何子應以蜀中文房四寳分贈洪景盧王嘉叟某與焉因成一絶送翁東叟教授和寳印叔見寄用韻寄二弟送蔡倅齒落次韻李懐安贈何憲五絶李懐安擁麾八蜀道出鄱江見贈二詩依韻奉酬國娘生日陳阜卿書云聞詩筒甚盛可使流傳江西否戯用竹萌韻以寄次何憲韻金華先生有竒石名碧逺携来自蜀陳洪州以詩覔之金華輟所嗜以贈亦一段竒事也予家雁蕩郡峯錯峙皆几案間物因和二公詩頗起鄊思寓意断章嘉叟宗丞得郡喜成一絶人日雨次何憲韻子應贈蜀中石刻十卷詩以謝之次韻嘉叟讀和韓詩元乆次何憲韻送何憲行部趣其早還種金沙花戯呈景盧郡圃栽花二月翔日同嘉叟藴之訪景盧别墅用郡圃栽花韻即席唱和還舎復用前韻以寄景盧嘉叟各和詩五首復用前韻用韻懐何卿嘉叟和詩至七篇有何時五畆成帰計来作鄰翁伴藝麻之句某鄊心方切復用韻第九卷州宅十二詠平政堂玉芝堂慶朔堂退思軒九賢堂四賢堂四望亭綺霞亭清香亭百花樓鄱江樓蜀錦亭景盧贈人面竹杖鄊人項服善宰鄱陽有政聲人惜其去用郡圃栽花韻作詩数篇叙别遂和以送之予向年少不自量因讀韓詩輙和数篇未甞敢出以示人盖二十年矣近因嘉叟見之不能自掩且贈以長篇蒙景盧継和用韻以謝次韻陳阜卿讀洪景盧追玉板詩次韻何憲脩途倦㳺懐鄱陽唱和之樂次韻何憲太平道中書事次韻何憲題魯池州通隱堂芝山勸農二月十五日祈晴十七日雷雨再作喜晴再用前韻𢾗日天氣朝隂暮晴復用前韻哭何子應同官㑹餘鄱江楼送谷簾泉二尊戯成小詩名郡之東門曰永平書一絶主簿程同年和永平門詩再賦四絶因以贈别送春州院獄空贈知録孫聴鄱江樓分韻得月字前端午一日㑹飲鄱江樓十有六人既分韻賦詩又戯成短篇五月二十日閔雨次韻葉樞宻言别洪景盧以郡醸飲客于野䖏園賦詩見寄次韻剡𥿄贈嘉叟以詩為謝次韻伏日四望亭分韻得月字次韻趙通判喜雨徐孺子亭張安國舎人以南陵鄱陽雨暘不同示詩次韻又次韻閔雨次韻安囯讀楚東酬唱集安囯讀酬唱集有平生我亦詩成癖却悔来遲不與編之句今𣣔編後集得佳作𢾗篇為楚東詩社之光復用前韻次韻安囯讀薦福壁間何卿二詩悵然有感五月二十五日餞安囯舎人于薦福洪右史王宗丞来㑹坐間用前韻再用韻送安囯易芝山五老亭名曰五峯安囯書之因成短篇次韻安囯題餘干趙公子飬正堂堂張魏公所名也并為作銘次韻安囯題清音堂郡齋舊有假山暇日命工葺之取石之㠌者繂置山頂汲水筩竹引而激之自頂而下有懸崖飛瀑之状予既以蕭洒名齋因䥴二字于石戯成古風第十卷詩予自饒易䕫以七月九日行饒人遮道挽晋易轎由間道而去提點何徳獻相追不及以詩見寄云断橋截鐙亦堪憐始信林間别有天㣲見兵機第一義朱轓暫席廣文氊因次其韻同官酌别途中寄何徳憲宿何山孫氏竹軒觀張安囯題壁因用其韻望廬山懐番易同官夣觀八陣啚讀喻叔竒送行六詩都昌道中望廬山思故鄊過五柳湾宿棲真寺懐番昜士民觀淵明畫像題翠軒寓棲真四宿時二児寓上庠未知去留又祠命未下頗以為懐望大孤山題湖口驛至江州和叔竒見寄讀趙果州詩讀王文正公遺事題庾樓呈唐守立夫宫太平興囯宫宿東林贈然老白公草堂蓮社題東林聦明泉㳺圓通贈訥老題至樂亭勝書記蜀僧也和予㳺圓通二詩用贈訥老韻酬之次韻唐立夫以日者命状見寄趙果州致羊酒走筆戯酬題訥庵題康王觀湯泉宿帰宗寺簡寂觀㳺開先寺觀香爐瀑布諸峯讀李蘇二仙詩知盧阜之勝在是記以十韻㳺萬杉院飛橋三峡橋五老峯玉淵宿棲賢㳺楞伽㳺山南入康谷以不觀谷簾泉爲恨南康李守致上尊乃此泉名也戯成一絶石鏡溪廬山紀㳺四十韻帰宗樅老言盧山有對云簡寂觀中甜苦笋帰宗寺裏淡鹹韲予因以湯泉石鏡戯成一絶開先僧贈石菖蒲别廬山題天華院中秋宿瀼溪驛瑞昌李宰贈元次山集中秋思鄉用瀼溪韻宿多福院昨日飯金城觀今日飯石田驛瑞昌永興道中作宿真如寺至興囯軍題懐坡閣贈王景文囯正贈陶永州次韻王景文贈行四絶題謀野堂聞詩聞禮不赴秋試以七月二十五日離大學八月二十六日至興囯軍喜其来也因作是詩途中遇雨宿大冶縣東方寺宋武帝廟宿武昌縣㳺西山寺遇雨兩宿縣驛呉大帝廟望黄州過樊口宿華容寺朝離華容莫宿孟橋小店陋甚得莫漕子蒙書以八百料舡見借遂可鼓揖而西矣至鄂渚泊報恩寺題一覧亭莫漕以􅐜羹薦杯第十一卷詩九日懐故鄊登壓雲亭贈趙都統撙九日陪諸公登髙十月觧舟晚泊江口望鄂渚漢陽觧䌫南浦𥘉泝長江江流出鄂渚漢陽兩山之間雲靄横之如一山然過金口市江中有渚名鯉魚甲渚上有蘆花連日遇逆風舟以寸進挽舟者行蘆中成四絶食鰕宿通濟口蘆花夜宿思湖口繋䌫蘆葦間夜半聞叢中有聲舟人驚起终夕為之不寐舟中作漢水宿夏郡口九月十五夜宿高牙亡娣之􅌾在九月而不得其日十五日讀坡詩至英公燎須事不覺悲涕是日辛酉得非塟日邪詩以寓哀買魚行過八疊有小舟賣鰕是日風便但江岸縈迃疾徐相半過三义泛泛江漢水宿網歩時巳入夜猶行舟忽聞犬声知有人家孤燈一點盖漁舎也是夕有月不飲過畢家池有姓陳者送香橙八顆云有子在太學名景𥘉有佛舎額曰永固院臨水而門閉有神祠云江南吴王廟必孫氏也晚過沙灘有漁人舉網鯿魚二百餘頭橙橘正正青黄以百錢買橘得十六顆比鄉里小而味酸舟中懐畨昜趙倅公及諸同官用九日登高韻宿𬗋㣲二十一日至福田院留建聖節宿金雞渡宿王家村讀楚東倡酬集寄洪景盧王嘉叟寄題番昜一江亭早至魯家洑復八太河見石首山舟中記所見二十五日先妣逺忌祭于舟中夜宿下沙歩有小浦蔵舟于口惧有風也是夜浪忽作声如潮舟為之撼如是者三舟人驚惧𥘉謂有風起視則天籟不號星月皎然篙工云江中畏炮炙鄰舟有煎油者岸圯而浪生曉視之果有圯䖏或云鼋鼍之属因記之天晴風順舟行過石首縣宿劉郎洑予自鄂渚登舟近兩旬得順風纔二日耳高牙遇風雨留两日既而得順風過八疊江流迃曲疾徐相半二十六日風駚甚方快之謂公安可一日到也明日如故江與風背浪洶涌停舟不行復用前韻再讀楚東集用前韻寄景盧嘉叟冦萊公祠宿黄壇讀于公堂記寄孫録聦伯十月四日宿于沙市舟中捲簾怱見新月天色如水鄉思凄然得詩一聮云詩成天作𥿄簾捲月爲鈎連夕燭有花至六日家書来自臨安足成一篇寄二弟𥘉九日離荆南用䕫州舡過虎牙至峡州登至喜亭謁歐公祠爾雅䑓楚塞樓離夷陵移舟至水西将遵陸霧甚咫尺不辨舟人失津退𢾗里遇渡舡引而至岸有山在蒙籠中乃觀音䑓也過姜詩村飯土門鋪晚宿油榨有山名四靣頗飯桃花鋪宿覆盆上大望州鑚天三里宿千石聞誦書聲枕上聞皷角過九盤嶺飯周平鋪南北山峯峦皆竒有佛頂峯鯉魚岩羅漢洞說者謂類巫山遇雨為雲霧所蔽不盡見至歸州宿報恩寺題屈原廟過稊帰二十四日親帥印于州大拽鋪宿巴東縣懐冦忠愍𥘉八巫山界登羅護関雲霧晦冥黙禱之因成一絶霧開復成一絶登得勝岡謁武安王関雲長廟有泉一泓俗傳謂兵至此無水拔刀刺地泉随而湧廟西有磨刀溪北有晒甲崖過風口望巫峡岩嶂如雁山祥雲峯經行峡烟霞障登燕子坡前有一岩在江之旁如天台赤城名烏飛岩巴東之西近江有夫子洞亦曰聖洞巫山縣有孔子泉說者謂旱而祈則應泉旁之民雖童子皆能書夫子胡爲洞扵此且有泉耶詩以辨之自鄂渚至䕫府途中記所見一百十韻第十二卷詩𥘉到䕫州查漕元章生日周漕行可和詩復用前韻并簡元章又用行可韻行可再和用其韻以詶又詶元章行可元章再賦二詩依韻以詶前篇寓二後篇寓三元章贈餘甘子用前韻行可骨肉自西州来用門字韵賛喜呉叅議詩用前韻以詶聞馬綱復行舊路聖主之恩諸公奏也元章用前韵喜而和之州縣有戒石飭官吏也某至夔之𥘉詩以自警云出郊送虞叅政因㳺竹亭小飲與者九人立春寄劉侍郎韶羙正月六日㳺磧呈呈同官買山給水修壘種柳江月亭二絶登真武山上元山中百姓出㳺作三章諭之題諸葛武侯祠登詩史堂觀少陵畫像送参議呉郎中䕫州祀社稷于州之西五里地不盈畆壇宇庳陋垣墻頽圯非所以崇明祀也買地昜路築屋増壇命同僚董其事不踰月告成二月戊子祀事既畢詩以記之㳺卧龍山呈行可元章聞詩得男名之曰䕫甘露降于宅堂竹間凡半月三經雨乃止州宅有甘露堂昔周侍郎為郡露降焉易見山堂以名之予無善政惧其為灾記以二絶元章贈蘭卧龍山有武侯新祠再用前韻寄書與二叔二弟題卧龍山觀音泉呈行可元章元章贈筆戯成一絶再詶元章又荅行可詶行可惠白酒同行可元章報㤙寺行香登佛牙楼望勝已山五月四日與同僚南楼觀競渡因成小詩四首明日同行可元章登楼又成五首劉韶羙至巫山寄詩因次其韻送元章改漕成都次韻元章留别夜與韻羙飲酒瑞白堂秉燭觀跳珠分韻得跳字儀鳯得珠字次韻韶羙失舟閔書韶羙帰舟過䕫留半月語離作惡詩二章以送元章至雲安用送韶羙韻見寄次韻以詶静暉楼前有荔子一株木老矣猶未主予去其枯枝今歲遂生一二百顆至六月方熟行可和詩再用前韻行可再和因思前日與韶羙同飲計䑓臨池摘實復用前韻又用韻呈行可元章至萬州湖灘寄六言一絶云滿目