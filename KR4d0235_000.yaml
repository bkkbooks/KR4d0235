芹然非所以勉子大夫茂明大對之意更爲古詩二章以献詠桞次韻潘先生寒食有感悼僧德芬悼單法師毛虞卿見過讀孫子尚舊所寄書宋彦才挽詞宋孺人挽詞先君子去世五十日孤某八四友室覩平生遺迹哀號痛哭絶而復蘇既而書四十字以寄罔極之思李府君挽詞陳景功挽詞次䪨萬喬年李唐英二絶送章生端武送羅生少陸送茹生履乙丑冬罷㑹呈諸友江上遇風宿黄岩妙智院過黄岩宿慶善寺過天台過新昌觀石佛戴溪亭曺娥廟宿驛奥題靈峰三絶出雁山関嶺遇雪過鑑湖月夜獨酌太學寄夢齡昌齡弟丁邜秋赴鹿鳴燕次太守趙殿撰䪨赴省治装有感再過雁山三絶大龍湫天桂峯天聦洞思帰别太學同舎戊辰閏八月帰自臨安觀舊題脩竹黄楊丁香花慨然有感復書三絶第四卷詩次䪨寳印叔止庵三絶翁府君挽詞十月十九日雷二十一日雪次䪨表叔余叔成示児表叔陳景韶挽詞詠述師葡萄十一月七日至東山省墳因思先子昔年題壁有水光山色兩依依之句舊屋已壊墨跡不晋山水依然感慨不巳因成一絶寄萬大年萬季梁和詩留别再用前䪨将過萬橋用前䪨寄大年先之種蘭有感再用前䪨三月晦日與同舎送春於梅溪因誦賈閬仙詩云三月更當三十日風光别我苦吟身共君今夜不湏睡未到曉鍾猶是春時有二十八人遂用齒序分䪨爲麥祈實次䪨萬先之讀荘子己巳梅溪同舎三十其九人者㳺從之舊也酌别之夕獨五人在焉謝子與能猶在予舘而四人者且去矣遂各以其姓賦詩送之周仲翔李大鼎許輝先謝鵬别宋孝先送黄岩三友又各贈一絶余如晦鄭遜志施良臣别余諧别余壁别周濬後七夕二夜同夣齡宿湖邉庒次夜余宿湖南夣齡猶在别業再和前䪨寄之宿靈山院登姚奥嶺望山有感與萬先之登丹芳嶺路人有手持桂花者戯覔之慨然見贈且言𣣔施此花乆矣又言花名秋香一名十里香遂與先之分之記以一絶題石梁過雁山次先之過雁山韵張施二生自黄岩拏舟送别于台城贈㠯二絶過仙人渡過百歩嶺関嶺旅邸觀林同季野去秋題壁望天台赤城山感而有作柘溪道傍有班竹百餘挺蕭洒可爱與先之賞翫移時因念郷間無是種約異日移其根予戯誦君㸔江上千竿竹不是男児淚點班之句遂發一咲既而作数語觧異世婦人之嘲且志不必移根也代婦人荅題劉阮祠用過僊人渡韻至剡溪寄夣齡昌齡剡溪舟中有感前中秋一日舟過山隂晚稲方熟因動郷思呈先之夜泊蕭山酒醒夣覺月色滿船感而有作十月二十八日母氏劬劳之日也哀痛中書二十八字次韵昌齡㳺白石二詩東際道岩再和東際道巖贈萬序過萬橋哭潘先生夏伯虎贈雙鯉貧家連歲蠶荒今年尤甚妻拏有號寒之患每𣣔㠯酒自寛酒悪竟不能酔拙於生事殊可笑也表弟萬大年家蚕熟酒醇有足樂者因思舊詩有剰栽枽柘教妻蚕句遂和以寄之大年和詩再用䪨李楰和詩復用前䪨用前䪨寄周光宗送李楰第五卷詩壬申中秋交朋觧散不期而㑹者鄭生遜志夏生伯虎因小飲翫月二子各以詩贈依䪨酬之書小成室哭孟丙家僮捨栗因念亡児作數語以冩鍾情之悲林知常惠白酒六尊仍示酒法作十䪨謝之九日飲酒㑹趣者十九人老者與焉既醒念不可以無詩用贈林知常䪨示諸友陳元佐和詩贈以前䪨周仲翔和詩贈以前䪨陳獻可宋孝先萬孝傑夏伯虎和詩復用前䪨九日把酒者十九人和詩者数人而巳今巳後期不復追索許以来年九日還用前䪨發一咲宋孝先示讀自寛集復用前䪨用前䪨述懷并簡諸友鄭遜志胡叔成謝鵬劉敦信萬廓鄔一唯和詩酬以前䪨九日㑹飲予為唱首自和凢數篇皆因事叙情爾未作重九詩也今再和一篇每句用事而不見姓名未聮外餘皆略存對偶必有能和之者九日寄昌齡萬叔永誕日在孟秋乃以重九開燕俟佳莭也予不獲預穪觴之列作詩㠯和賀九月十二夜獨歩梅溪翫月人迹悄然秋色滿眼微風不動岩桂自香𥘉不劳思偶得四句盖心境中静時語也歸小成室對短燈檠索𥿄書之前日寓邑偶值乍寒陳劉二生濟我以衣童生濟我以衾既别為二詩以贈萬先之生两男作洗児歌賀之黄府君挽詞予自乙丑冬如臨安赴𥙷逮今凢五徃矣是行也痛慈親之不見傷㓜児之蚤死登途泫然因成是詩𥘉擬過鴈山既而取道烏石寄夣齡昌齡過白溪過盤山宿旅邸登皇華亭宿浮橋與鄭敏時登樓把酒書二絶途中見早梅乙丑冬西湖觀南明石像作詩一絶至壬申十月四日復徃觀焉和前詩并書于佛閣西征第六卷詩癸酉三月二十五日至剡溪旅舎觀曺梦良題壁有撩我思家第一篇之句僕離家半月亦未嘗作詩因次其䪨剡之市人以崇本東嶽爲名設盗跖以戯先聖所不忍觀因書一絶周德逺植瑞香於窓前戯成一絶逰明心院逰圓超院登挾溪亭次盧君天驥䪨寄夣齡昌齡弟髙和叔生日天子始絺淵源堂十二詩淵源堂細論堂冝桂軒藴秀軒同襟舘冨學齋輝聲齋集彦齋擢秀齋恢義齋蘭馨室足鯉池書院雜詠牡丹芍薬巖桂江梅酴醿紅梅海棠瑞香菊花蠟梅榴花薝蔔千葉黄梅千葉紅桃千葉白桃佛見笑荷花蓼花萱草班竹燕竹西河栁葡萄芭蕉石菖蒲慎火草盤中新荷假山盤池書架鶴鵞花鴨鸂鶒剡溪雜詠剡溪了溪挟溪亭龍宫碑戴顒墓阮仙翁宅戴溪亭偃公泉書院掛額展筵雅㑹也戯集諸堂軒齋名作詩别周德逺諸友宿石佛白若遇水以小舟從石門渡势危甚書數語示圖南文卿時八月二日也孟甲生日孟甲孟乙好蓄古錢因示以詩周光宗贈蠣房報以溪蓴劉府君挽詞賈府君挽詞陳夫人挽詞納凉偶成悼演述二僧黄楊第七卷詩林下十二子竹子脩井子深梅子先桂子蒼蘭子芳昌陽子仙黄子嘉丁子素桞子春槐子夏菊子秀王子野昌齡闢圃植花索詩於老者戯作數語兼簡夣齡西園新闢昌齡索詩予以其未開尊也戱作数語既飲復用前䪨予與二弟連日賦詩飲酒詩成命二子書之亦居家之一樂也復用前韻昌齡和詩以不得志於賢關有𣣔退隠之語復用前韻勉其涵養俟時未可真作休休計也昌齡頻開尊再用前韻用前韻題東園賈元識和詩酬以前韻次韻昌齡西園即事東園小閤丹粉一新昌齡有詩次韻夢齡得男老者喜甚湯餅㑹中出詩以賀予有書閤僅容膝東有隙地𥘉甚荒蕪暇日理成小園徑以通之杖藜日渉其間幾𣣔成趣然花木蕭踈不足播之吟詠謾賦十一小詩以記園中之僅有者時甲戌仲冬也小小園便便閤青青徑姢姢林揚揚畹鮮鮮砌牡丹芍藥早梅雙竹紫薇花梅花次賈元識韻歲莫雨雪連作稍阻㑹集賈元識有詩次韻萬府君挽詞林府君挽詞表兄璐珽二道人以山茶一根見贈植于便便閤前每黒甜餘開窓寓目茗椀不捧精神自清因成小詩又覔茉莉花二道人以茉莉花及東山蘭為贈再成一章覔海棠郁師贈海棠酬以前韻札上人許贈山丹且云此花三月盡開俟蘂成移去至上巳日以詩索之表弟津上人有瑞香茉莉戯覔之覔季仲權碧桃覔季仲逹酴醿和寳印叔送春二絶族兄文通贈山茶兄弟鄰里日講率㑹因書一絶且戒其早納租税也萬府君挽詞張廷直挽詞第八卷詩左原紀異法燈俊上人惠杜䳌花法燈聞上人和杜䳌詩酬以前韻孫先覺母夫人正月四日生時年八十明慶懴院上方地爽而幽盖精藍之勝也予因㑹友託迹其間一日探嚢中得石刻詩一本乃王詹叔國博題台人秀野堂也摹冩景物頗類於此因置之壁間意有感觸遂借其䪨懴院種蘭次寳印叔韻次濟上人韻元鳥至陳希仲贈山茶酴醿次賈元節韵覔海松贈僧希月浴佛無雨喜雨用前韵雨止復用前韵孟夏十有一日時雨𥘉霽晨登髙閣極目四望烟銷日出氣象一新復用前韻用前䪨勉諸友頴師贈榧栽月上人以拳石植海松蒔昌陽於四際蒼姿秀色鍾清氣于几案間以為梅溪野人之贈兼惠詩章因與唱酬凢四首書懷懴院種紅蕉用寳印叔䪨題佛閣三絶題郭路㽵率飲亭二十絶横山連氏妻方奉姑甚謹姑死刻木像事之越十年不怠郡守張公子韶下車命諸邑訪孝義予𬒳牒至其家獲觀木像感嘆不已因書四十字時紹興丙子七月十四日也登姚奥嶺望家山有感題驛奥張店思周光宗度鴈山度謝公嶺臘日與守約同舎賞梅西湖同舎再約賞梅用前䪨前日探梅李元翁以疾不徃和詩有王華野人多病恼獨守寒爐煨竽魁之句復用前䪨約同賞送王司業元龜守永嘉春日逰西湖第九卷和韓詩和秋懷十一首和符讀書城南示孟甲孟乙和醉贈張秘書寄萬大年先之申之和縣齋有懷和桃源圖和永真行和短燈檠歌寄劉長方和苦寒和南食和聽頴師琴和憶昨行示夣齡和燕河南府秀才送周光宗和荅張徹寄曺夣良巳巳元日讀送楊郎中賀正詩因和其韻人日過霓山随行有昌藜集因讀城南登髙詩遂次韻留别孫先覺和李花和荅栁栁州食蝦蟇第十卷詠史詩伏犧神農黄帝唐堯夏禹啓少康桀成湯髙宗紂周文王武王成王宣王幽王秦始皇二世漢髙帝文帝武帝宣帝元帝光武明帝章帝魏武帝呉大帝蜀先主晋宣帝晋武帝晋元帝宋武帝齊太祖梁武帝簡文帝陳武帝後主魏道武北齊神武齊後主周文帝隋文帝煬帝唐太宗髙宗明皇肅宗徳宗憲宗文宗梁太祖唐荘宗晋髙祖漢髙祖周太祖世宗許由后稷伊尹箕子比干伯夷太伯太公周公召公齊威公晋文公宋㐮公秦穆公楚荘王魯隠公威公莊公閔公僖公文公宣公成公㐮公昭公定公哀公鄭荘公齊㐮公齊頃公鄧祁侯晋獻公楚靈王楚懷王吴王夫差越正勾踐頴考叔石碏孔父仇牧荀息祭仲管仲大夫種范蠡李廣婁師德狄仁傑徐有功第十一卷賦雙瀑賦至樂齋賦歸去来賦梅溪題名賦銘止庵銘甕庵㑹趣堂燈銘止堂銘情話室銘書几銘厨銘書銘筆銘墨銘𥿄銘硯銘硯匣銘筆池銘簡板銘粘板銘界枋銘界筆銘詩筒銘書筒銘鏡銘燈銘香爐銘印斗銘扇銘肩輿銘昌蒲盂銘國朝名臣賛冦莱公韓魏公范文政公冨鄭公杜祁公甌陽文忠公文潞公趙清獻公司馬温公蘇東坡蘇頴濵陳了翁第十二卷論禹論武王論性論禘祫論君子能為可用論上舎試䇿三道第十三卷䇿問十九道第十四卷䇿問十九道第十五卷䇿問十八道第十六卷書上太守李端明書啓代曽尉上陳安撫代曽尉荅交代代謝同文舘觧代謝卿觧陞補上舎謝宰相謝王太博昌齡弟送定葉氏昌齡弟請期聞詩定孫氏回錢氏送定代送定七首萬章楊李劉賈季孫賈宋李季錢曹代回送定四首周毛陳鄭黄徐陳謝第十七卷序送吴教授秉信帰省序南浦老人詩集序潜澗嚴闍梨文集序劉方叔待評集序送表叔賈元範赴省試序送呉翼萬庠赴省試序爲林彦明千秋榖序淵源堂十二詩序記四友室記緑畫軒記大井記代笠亭記觀水記巖松記追逺亭記淵源堂記細論堂記舫齋記第十八卷有詞賽還醮願代道士薦師代道士薦母代萬叔夏二首代周元授代萬叔永又代黄詞代劉仁叟䟽文雙蓮潭請水䟽明慶教院請講䟽恵政橋施水坊䟽館頭甃官路䟽小小園覔花䟽淵源堂上牌文祭文祭孫子尚祭姑丈季公佐族人祭十四伯母又代女壻祭毛叔度主簿又代周元授祭潘先生祭陳景韶寒食祭始祖祭始祖母祭孟丙祭支夫人代祭宋彦才二首代諸生祭周仲翔母代諸生祭陳元佐父代祭季夫人代諸生祭周仲翔父代人祭族弟代祭萬夫人代祭何升老代祭宋元明代祭萬叔永代祭余夫人第十九卷雜著井光辨四友録讀婁師德傳題卓論文説讀蘇文雜說靈烏說夜虹見待士說雜說讀進學觧三不能戒書歐陽公贈王介甫詩大舜善與人同論語三説書冨家翁逸事後記蛙記人説前生事第