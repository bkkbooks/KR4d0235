body:
  text: 梅溪王先生文集序知人之難堯舜以為病而孔子亦有聽言觀行之戒然以豫觀之此特為小人設耳若皆君子則何難知之有哉蓋天地之間有自然之理凡陽必剛剛必眀明則易知凡隂必柔柔必暗暗則難測故聖人作易遂以陽為君子隂為小人其所以通幽眀之故類萬物之情者雖百世不能易也豫嘗竊推易説以觀天下之人凡其光眀正大疏暢洞逹如青天白日如髙山大川如雷霆之為威而雨露之為澤如龍乕之為猛而麟鳳之為祥磊磊落落無纎芥可疑者必君子也而其依阿淟涊回互隱伏紏結如蛇蚓頸細如蟣蝨如鬼蜮狐蠱如盜賊詛祝閃倐狡獪不可方物者必小人也君子小人之極既㝎于內則其形于外者言談舉止之微無不發見而况于事業文章之際尤所謂粲然者彼小人者雖曰難知而亦豈得而逃哉于是又嘗永之古人以驗其説則于漢得丞相諸葛忠武侯于唐得工部杜先生尚書顔文忠公侍郎韓文公于夲朝得故參知政事范文正公此五君子其所遭不同所立亦異然其心則皆所謂光眀正大踈暢洞逹磊磊落落而不可掩者也其見于功業文章下至字畫之溦蓋可以望之而得其為人求之今人則于太子詹事王公龜齡其亦庶幾乎此者矣公妃以諸生對策庭中一日數萬言被遇太上皇帝親擢以冠為士遂取其言施行之及佐諸侯入册府事今上皇帝于初濳又皆以忠言直節有所禆輔上亦雅敬信之登極之初即召以為侍御史納用其説公知上意以必復土強必雪讎恥為己任其所言者草非修德行政任賢討軍之實而于分别邪正之際尤致意焉尋以邊兵先律廷議不咸上疏自劾除吏部侍郎不拜去為數郡布上恩恤民隱蚤夜孜孜如飢渴嗜欲之切于已去之日民思之如父母其處閨門居鄉黨則又親親敬故隆信義務敦家人孺子亦藹然有忠厚廉遜之風平居無所嗜好顧喜為詩厚質直懇惻條暢如其為人不為浮靡之文論事取極巳意然其規撫宏骨骼開張出入變化俊偉神速世之盡力于文字者往往反不能及其他片言半簡雖或出于脫口肆筆之餘亦無不以仁義忠孝為歸而皆出于肺腑之誠然非有所勉強慕效而為之也蓋其所稟于天者純乎陽德剛眀之氣是以其心光明正大踈暢洞逹無有隱蔽而見于事業文章者一皆如此海內有志之士聞其名誦其言觀其行而得事心無不斂袵心服至于小人強以一時趨向之殊或敢巧為謗然其極口不過以為迂闊近名不切時務至其大莭之偉然者則不能有豪髮點汚也然則公于五君子者迹雖未必皆同而心實似之故自其布衣時嘗和韓詩數十百篇守番及夔則又適在葛杜顔范之遺墟皆嘗新其祠宇以致歆慕之意蓋亦每自比焉嗚呼公之必為君子蓋不待孔孟堯舜而知之矣豫昔官中祕直西省皆得與公為寮辱公知顧甚厚及來守建康則公殁幾十年而其子聞詩適官府下相與道舊感慨􅒣欷一日出公遺文三十二卷屬豫敘之豫蓋三復焉而拊卷太息也公之行事今某官莫俟子齊既狀之而故端明殿學士汪公聖錫取以志其墓矣故豫因不復著獨論其心如此別于篇端以告天下之士使有以識其所謂光眀正大疏暢洞逹者言言凛凛𥘉未嘗隨死而亡也以是勝私起懦而相與師慕其萬一在朝廷則以犯顔納諌為忠仕州縣則以勤事愛民為職內外交修不遺餘力使君德日躋于上民生日遂于下國步安強隱然真有恢復之勢則公雖云亡而其精爽之可畏者為無憾于九原矣嗚呼其亦可悲也久聞詩亦好學有立能守其家云余耒守溫每于公睱輒涌梅溪王忠文公遺文因之有得於心以為政事之資者多矣公之文集舊有刋本而朱文公代劉共父為序論其心為特詳歲久故壞前守何公文淵劉公謙相繼掇拾于蠧腐之餘重為刋扳盛傳于今而少保黃文簡公淮為序則專論其道也文公之序載于大全集中惜重刋者遺之余為表而冠諸卷端使人知公之文章事業皆夲于道而道又夲于心也噫知公之心者莫如文公文公天下萬世人物之衡鑑也則其序可得而遺哉天順六年冬十月朔旦賜進士出身中憲大夫溫州府知府莆田周琰識梅溪先生王忠文公文集序道在天下無物不備無時不然夲之于民彛達之于事業昭昭乎不可泯也然而不著之于文章垂之于訓典曷足以扶丗立教化今而傅後是故古之聖賢立德立功立言不可偏廢也嗣是而繼作者世豈無其人歟溫郡梅溪先生王公十朋家食時敏于力學博究經史旁通傅記百家由博反約擇精守固其于天理民彛之懿忠孝立身之本體認真切凝然以斯道自任紹興間對策大廷日盈萬言援經證據切中時病髙宗親擢首選試以民事僉判紹興府自後厯官侍從臺諌出知饒夔湖泉四大郡八為太子詹事以龍圖閣學士致仕每為權要忌嫉而執德不回粵在侍從臺諌時屢上奏疏其于君臣父子之大倫國家之權柄賞罰之當否時事之得失臣僚之邪正衆論之是非民情之休戚軍政之利害時幾之審決虜讎之不可不復國恥之不可不雪剖析詳眀論議鯁直皆足以闡聖道垂丗教惜乎當時不能盡用也其為郡時布上恩恤民隱導掖撫摩直欲之于平康之域身在外服而心存朝廷漢唐循吏殆不是過其著為雜文詩歌率皆渾厚雅淳和平坦蕩不離于道德仁義𬗋陽朱夫子謂其稟乎天者純乎陽德剛眀之氣是以其心光眀正大踈暢洞達如青天白日而見于事業文章者一皆如此確哉至論也蓋其當代之立德立功立言可謂無愧者矣後之人雖欲無傅其可得乎文集舊嘗鏤板歲久䆮廢郡之前大守何公文淵訪于其家得録夲若干卷殘缺錯亂不可緝理會升除侍郎而去然其心未嘗忘也未幾前御史劉公謙繼守是郡旁求博訪乃得其刻夲于黃巖士族蔡玄可家命郡學教授何㶇重加訂正鳩工刋刻用廣其傳􅐌成其事者二守徐公恕通判劉公寬推官宫公安暨邑宰周紀等與有力焉于乎公之心畏天憫世之心也公之道聖賢所傳之道也不幸狙于人事之變遷迫于氣運之衰微而不得卒􅈬其志徒託空言于編簡之中其亦可悲也夫披閲是編者因其言以求其心因其心而逹諸用可以致君為堯舜可以躋治于隆平使人皆知吾儒之道有功于斯丗豈曰小輔云乎哉淮故不揆鄙陋而僣為之序正統五年夏四月望日榮祿大夫少保户部尚書兼武英殿大學士知制誥國史捴裁同郡黃淮書梅溪先生文集總目廷試䇿并奏議共五卷詩文前集二十卷詩文後集二十九卷附録有宋龍圖閣學士王公墓志銘聞禮跋尾一萹梅溪先生廷試䇿并奏議目録第一卷廷試䇿第二卷輪對劄子三首上殿劄子三首應詔陳弊事論左右史四事第三卷除侍御史上殿劄子論史浩劄子再論史浩劄子論進取利害劄子論史正志劄子再論史正志劄子論廣海二寇劄子論韓仲通俞良弼劄子論內庭節省劄子論宿州退師劄子論休假劄子論林安宅劄子再論林安宅劄子第四卷論用兵事宜劄子乞審核李顯忠等功罪劄子論龍大淵撫諭兩淮劄子自劾劄子夔州論馬綱狀再論馬綱狀除知湖州上殿劄子三首除太子詹事上殿劄子三首應詔舉官狀舉張拭自代狀第五卷代越帥王尚書待罪狀又代上郊祀天晴札子又代上劄子又劄子又代上劄子又代上五劄繳劄代王尚書辟陸宰狀又代上劄子梅溪先生後集目録第一卷賦會稽風俗賦并敘民事堂賦并敘蓬萊閣賦并敘第二卷詩丁丑三月二十一日集英殿賜第遊天竺贈同年贈閻同年閻和詩敘别再用前韻贈梁同年次韻陳大監見贈次韻劉長方司户見贈陳大監用賞梅韻以贈依韻酬之大監復贈詩𥿄尾有留飰語再用韻以謝謝榮帥薿贈御書孝經用陳大監韻陳大監餞别用前詩珠字韻以謝用陳大監韻謝王國録季羔見贈陳郎中公説贈韓子蒼集章季子贈端硯次韻陳大監赴天中節宴謝李侍郎琳贈御書塗中得寶印叔二詩次韻次韻寶印叔題壁二絶萬府君挽詞詠中致政宋承事挽詞張德惠挽詞宿羅漢三絶遊大龍湫和前韻遊靈巖輝老索詩至靈峯寄數語題瑞巖題天台國清寺題大慈寺題石橋二絶萬年贈鄊僧貴老過鑑湖民事堂臘月望日出郊探春遊告成觀謁大禹祠酌菲飲泉遂至龍瑞宫觀禹穴薄暮而還采蕺秦望迎春遇雪元日冒雪赴天慶觀朝拜既趍府拜表還舍飲屠蘇酒因思去年元日亦不在家感而有作賀何正言用蔡君謨韻寓小能仁寺即事書懷同莫教授朱縣丞朱司理遊西園次韻濮十太尉賞梅題夀樂堂用東坡韻贈楊元賔僉判元賔贈紅梅數枝𪠘舍有修竹𢾗竿滿灑可愛龍瑞道士贈蘭吳秀才克家以夀樂蓮洲中千葉梅花為贈酬以詩上丁釋奠備數獻官書十二韻呈莫子齊教授趙可大察推會稽三賢祠詩并序吳先生祠旌忠廟愍孝廟第三卷詩其比緣職事朝拜􅑼宫瞻望松柏愴然悲涕遂成小詩鑑湖行禹廟歌與趙安撫乞疏獄次韻濮十太尉詠知宗牡丹七絶送僧遊徑山三月晦日邵憲大受宴僚屬于西園某與焉趙提幹即席賦詩次韻送昌齡弟還鄊兼簡夢齡糶米行送會稽林簿日華棄官還鄊戊辰歲嘗和韓退贈張徹詩寄曺夢良至今十年夢良方和以寄因贈一絶送趙可大如浙西中秋賞月蓬萊閣呈同官中秋見月方以為喜既而隂蔽意殊不滿東坡云良天佳月即中秋不以日月斷也諸君有醵會之約復用前韻記夢士人及僧道俱贈巖桂府吏有以老求退者詢其年猶未六十詰其去之由云欲全身避禍耳豫善其知機勇退可以愧嗜進之士夫有感而作觀習水勝龍瑞道士贈巖桂九日登蕺山夢齡九日有詩兼懷昌齡次韻贈莊童子送朱丞贈夢齡兼懷昌齡和夢齡十月朔日書懷贈喻叔竒縣尉贈王吉老縣尉十月望日買菊一株頗佳聞詩生日十月十六日欲與夢齡弟及聞詩聞禮同遊蘭亭仍約喻叔竒偕行會天氣不佳喻亦以疾辭出門而止兀坐終日懷抱殊惡和喻叔竒集蘭亭序語四絶和韓退之晚菊贈喻叔竒夜讀書于民事堂意有所感和韓公縣齋讀書韻李資深贈古硯瓦及詩喻叔竒惠川墨載夫人挽詞和趙可大四絶右僧舍雨中右聞子規右不寐右朝永祐陵送黃機宜遊四明盧仁及縣丞挽詞贈術者遊天衣寺次梁尉韻酬陸宰用梁尉韻和喻叔竒遊天衣四十韻第四卷詩州宅蓬萊閣清白堂清白泉觀風堂望月臺秦望閣望海亭卧龍山種山競秀閣蕺山八松右軍祠堂鵝池硯池題扇橋雷門曲水閣西園望湖亭吳先生祠賀知章祠鑑湖禹廟菲泉禹穴馬太守廟吳越王廟望秦山小微山梅梁窆石和昌齡弟見寄懷喻叔竒次韻周堯夫贈睡香送陳元佐遊四明聞禮生日次韻趙觀使鴛鴦梅亡友孫子尚藁􅌾會稽山大禹寺之側某至官八日出郊訪其墓不獲明年春𬒳命祀禹訪而得之又明年春再往酹酒因植柏十根哭之以詩子尚墓種柏鄭夫人挽詞錢夫人挽詞連月不雨農事失時府帥決獄廪飢德政動天霈然而雨某吟成律詩一章以賀次韻濮十太尉喜雨叔父寶印師住永嘉妙果院未期年而退弟子德純住龍翔一日歸省其師亦退居林下緇素挽留之乃遁于異郡不踰月間師弟子相繼退休識者髙之目為僧中二踈其竊祿將二考矣有愧二髙僧因書一絶庶幾他日或踏其髙躅云寄黃簿次韻濮十太尉題禹穴薛師約撫幹召飯于圓通寺主僧瀹茗索詩潘知縣甸弟撫幹畤和詩復用前韻酬冨陽張叔清縣尉周德貽得子以錢果為貺僕不獲為湯餅客賀之以詩喻叔竒迎侍赴桐川榜其堂曰戲綵衣來求詩寄題一絶女子生日范文正公祠堂詩并序次韻梁尉秦碑古風府師王公中秋宴客蓬萊閣分茶賞月于清白亭某以幕僚與焉坐上成二絶又和趙仲永撫幹二首再和又用看字韻酬