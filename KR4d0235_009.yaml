body:
  text: 州宅十二詠平政堂愷悌周君子循良漢守臣如今坐堂上端是政平人玉芝堂范文正公名不是因三秀名堂意自深要居森㦸地母忘采芝心慶朔堂范文正公建昔日栽花者官移花未開舊花今豈在猶說范公栽退思軒㑹淂名軒意公餘坐片時退思何及矣未退早湏思九賢堂猶起才難歎同時九乱臣鄱陽千載守賢豈許多人四賢堂誰品鄱陽守四人賢不知如何堯舜世能使野无遺四望亭有澤冝觀水无􅉉不見山鄱君千里囯俯仰一亭間綺霞亭孤䳱同飛処澄江共賦詩晚来亭上看真是謝公詩清香亭髙架添風韻芳醪共姓名蘇州凝燕寢疑是此香清百花樓昔日風流守公餘種百花春風不檢點紅𬗋落誰家多失鄱江樓郭外山横閣閣山江邉水照樓麄官无暇日何以淂消憂蜀錦亭蜀錦海棠也郡人謂范文正公所植亭今廃亭廢名猶在春来花自芳猶餘蜀中錦爱惜比甘棠景盧贈人面竹杖奔走方嗟力不任淂公一杖直千金竹能有面如人面人亦虚心似竹心渡水只愁龍欲化入山應與鳯聮吟翰林虞部相酬贈同舎交情復見今退之赤藤杖歌云歸来捧贈同舎子予与洪亦舘中同舎也鄉人項服善宰鄱陽有政声人惜其去用郡圃栽花韻作詩數篇叙别遂和以送之七歲名師世胄賖雲孫行實副文華仁心馴及魯恭雉和氣種成潘岳花清白見知鄱水月高明相照楚天霞送君撩我思鄉意遥想吾庐日長麻鄱江同事半年賖直諒何人佀去華吏報圜扉多鞠草民歌枯木再生花邑人有枯木再生春之謡暫㽞䔥寺行逢雨剰作新詩語帯霞褒徳自應侯卓茂清朝知巳况如麻江東回首莫雲賖寒食令人感歲華皎皎丹心惟望日是日祈晴星星短髪不簮花書傳何処山名㕍寄家書酒憶吾鄉水似霞楽清有赤水之名鄉人喜造紅酒故舊相逢如問我爲言多病服天麻公真有徳如元令我媿無才似李華話别芝堂傾竹葉送行鄱水漲桃花眼看三匝烏逢月心羡齊飛䳱趂霞它日相期訪刘阮分桃采薬飲胡麻予向年少不自量因讀韓詩輒和數篇未甞敢出以示人盖二十年矣近因嘉叟見之不䏻自掩且贈以長篇蒙景盧継和用韻以謝少小思尚竒薫風琴𣣔和規模与時背埸屋屢摧挫大道窺五原高論讀二過神㳺京城南南山詩思渺䒱水左竹看金影碎菊擷霜風破論文摩巨刃薦士躬疆笴䔥蘭發秋懐木㕍吟齒墮飛飛双鳥鳴不數鸝兩箇幽幽十琴操可僕䔵䑓些光餘万丈長照我一牀卧未終三百篇正坐短檠課韓古律詩共三百餘篇𥘉妄意𣣔盡和之以方作㪯業遂止不敢示友朋懼遭泥滓唾文章吉太守臭味夙相荷索我舊詩案贈以千金貨郡亝哦好句艶艶月照坐端如陳琳檄快讀痊轗軻濫把江湖麾謬声慚日播祈寒兼苦雨怨嗟吾豈柰竊效衡山禱是日祈晴因思鑑湖貨時已乞祠翵鷃各逍遥溟蓬无巨麽次韻陳阜卿讀洪景盧追和玉板詩風采􅏢􅏢御史官旌麾所至庶民安渭川千畆填匈臆散作毫端風雨寒前世書魚化宰官肺腸元与竹相安侯生韓子相詶贈詩句驚人䰟膽寒次韻何憲脩途倦㳺懐鄱陽唱和之楽馬上詩成驛使馳社中猶恨使来遟不堪冀北群空後况是江東日莫時春半鸎猶懶呼喚雨多鳩亦厭分離論文尊酒何時共公說帰期我去期次韻何憲太平道中書事明刑清詔使行部近清明况有太平象想亡愁嘆声問民知疾苦按郡戒将迎更向金陵看六朝餘故城次韵何憲題魯池州通隱堂朝市隱誠好山林通更嘉出非專為米去亦不期瓜下恵何妨介東方未用夸東方朔朝隱者也退之作方朔遺事詩挟㤙更矜夸池州知此道无媿仲連家芝山勸農出門非爲采靈芝端爲農時不可違我欲勸農農勸我田園薄有早須歸二月十五日祈晴十七日雷雨再作清香一瓣乞晴回凖擬陽光万里開凬伯未吹雲陣破雷公又喚雨声来𥙷天石爛疇䏻錬䧟濘車深不易推誰坐黄堂称太守深慙无術捄天灾喜晴再用前韵天閔斯民意巳回群隂不掃自應開扶桒曉日曈曈出玉宇清風習習来水緑渔翁声欵乃月明詩客手𫾣推秧針刺水麥揺浪定有豊年无後灾數日天氣朝隂莫晴復用前䪨忍飢面目類顔回僅淂青天半日開且碩催詩无雨至只冝送月有凬来出㳺偶似文昌霽侍滿當為桀溺摧退之和張十一憶作行云君當先行我待滿沮溺相繼窮年㩁曰雨曰暘皆帝力麥苗无害免書灾哭何子應籍甚何夫子文章擅羙名金華傳語宝鄱水主詩盟心印横渠學相門无盡甥人間一萝覺卿月堕㙜城骯􅗣冝三出飄零到九疑忠􅈾黄屋眷音遇𬗋岩知公以張魏公薦𬒳召共理符頻綰明刑莭屢持青天万里蜀无復話帰期公作皇華使予乗郡守轓江湖吳芮囯襟抱杜陵尊翰墨頻揮染詩文細討論新編栞未就楚些巳招䰟何以正月二月二十二日行部方議開椘東詶唱集途中三同官㑹飲鄱江樓送谷簾泉二尊戯成小詩聞說樓中㑹八仙郡齋分送谷簾泉好将投向鄱江水共作長鯨吸百川名郡之東門曰永平書一絶鄱水新門號永平永平何止一鄱城碩言廣此平天下黎庶長無愁嘆声主簿程同年和永平門詩再賦四絶因以贈别迃儒政事只平平濫守鄱陽十里城頼有同年更同事公餘時作苦吟声髙唱猶嫌二謝平偏師䏻破五言城番人口誦新門記巳作雷門振大声才知端如杜下平異時何止任專城三年俛首栖榛棘行作冲霄鵉鳯声春盡湖如鏡面平扁舟送别古畨城相将我亦為行客征㕍来時好寄声送春楊花榆莢滿天飛九十風光别我時鳬䳱成行报公事簿書中作送春詩州院獄空贈知録孫聴把麾承乏楚邦東獄及期年始報空顧我自慚無徳政同僚深喜有于公鄱江樓分韵得月字尊酒相逢人二八年少壮夫子白髪明年何䖏更登楼遥望鄱陽江上月前端午一日㑹飲鄱江楼十有六人既分韵賦詩又戯成短篇佳莭江樓上同僚共把杯人如舜才子名半漢雲䑓詩占城南首音㕘古磬枚冝添兩學士相約訪蓬莱韓退之将城南詩十六首漢犍為郡淂古磬十六枚五月二十日閔雨仲夏百榖長中沐群龍分俗謂是日分龍此邦淂何龍行天莫辝勤碩於呼吸間山川走風雲亟下霈然澤捄我心如焚次韵葉樞宻言别㳅落江湖歳月侵九重側席念公深漢庭寛大頒綸綍楚閣清和襆枕衾公寓居楚東閣大壑巨魚欣復縦虚舟積羽可䏻沉乾坤整頓須元老芝嶺柯山未許㝷公前欲居芝山今暫居柯山洪景盧以郡醸飲客于野䖏園賦詩見寄次韵老境厭吏事帰心遶丘園日月忽有夏炎蒸变春温芝堂孰新醸誰共論文尊緬懐蓬山舊情好素所敦殷勤十從事往掃東坡軒深杯滑琉璃不比田家盆醉吟到高䖏舞月成清歡我獨坐空齋静對忘憂萱萱多憂未忘香清思猶昏懐君不成寐兩䖏一声猿剡紙贈嘉叟以詩爲謝次韵仁義知君學子輿豈惟詞賦似相如剡溪百幅𫾣氷紙換淂臨池小草書伏日四望亭分韵淂月字伏日何䖏㳺危亭隂清樾十客同我登詩興浩然發四􅉉山在眼奚用更柱笏小飲未成醺天邉見新月次韵趙通判喜雨政拙時時費禱求心憂赤子餓填溝一声霹靂中宵雨洗出江湖万里秋徐孺子亭一室不暇掃心期掃天下一榻不妄設所待必賢者南州傑出士林泉事瀟洒閉門謝弓招道合不吾舎誰云性少通得一不為寡豫章豈私交端欲重宗社漢廷无此賢忍使遺在野交章薦天闕聘礼俻車馬髙人竟不屈清風凛華夏寄声郭有道一木難支厦肯同樊䖏士声名秖虚假鷄酒弔知音韜光老松檟倘令居孔門行蔵似回也江西今仲舉吏事飾儒雅神交千載友丹青妙摹寫作亭古東湖鱗鱗万椽瓦序嗤滕閣王詞偪長沙賈佳客從公㳺湖光瑩尊斚孺子真可師丗途何土苴行矣浙東西鉏犂各帰把張安囯舍人以南陵鄱陽雨暘不同示詩次韵春水平原天可拍夏日如焚天可拆哀哉農民亦良苦厭見常暘与常雨去秋鄱陽偶中熟巨室猶言廪无谷万畆家輸𢾗千斛路旁安淂黔敖粥吾君罪已同禹湯思起傳岩調雨暘暫勤千騎作南伯要使炎嶠无餘殃又次韵閔雨長夏蚊蠅倦驅拍忽淂緘封手親拆新詩首及民疾苦更閔鄱陽境无雨鄱陽假守仁不熟作郡端如種焦谷匈中賸有愁千斛闔門百指顔公粥𬗋㣲好善嗤洪湯公孫洪張湯皆薦賢好善然其人不足取也眉間和氣如時暘行帰廊庙賛化育善人冝賞淫人殃次韵安囯讀楚東酬唱集麾把江湖遇列仙𢋫酬篇什滿鄱川竇家兄弟聮珠日庐阜峯峦夕照天鄱陽芝山有五老亭西望庐阜晩晴則見范文正公詩試凭高閣望五老夕陽開三郡美名俱赫赫陳洪州洪吉州王㒷化一㙜遺墨尚鮮鮮何憲𬗋㣲妙語題詩後光艶真能照簡編安囯讀詶倡集有平生我亦詩成癖却悔来遟不與編之句今𣣔編後集淂佳作𢾗篇爲楚東詩社之光復用前韵六逸中无李謫仙前集恨不淂公詩爲大詩筒忽淂舊臨川舎人前治臨川乃鄰郡也枝芳又類燕山桂何卿往矣今集又淂五人馬立欣瞻刺史天五人二帥三守公似虞臣冝作牧我慙䑕技濫烹鮮新詩不减顔公詠貴若山王㝎不編次韵安囯讀薦福壁間卿二詩悵然有感金華遽作鬼中仙嘆息真同子在川何遜詩猶在東閣杜陵家不上青天何卿毎有帰蜀之念既死其子以其䘮帰􅌾于吴忠随奏䟽㽞丹闕字落禅房照碧鮮客過楚東吟楚些唱詶新集定須編五月二十五日餞安囯舎人于薦福洪右史王宗丞来㑹坐間用前韵尊酒相逢半八仙鬂絲我類社樊川江東渭北四方客張淮西洪江東王河北某浙東楚尾吳頭五月天蓮社濫陪陶令飲兵厨聊擊陸生鮮待将紅薬翻堦句别作番陽一集編張欲尽和楚東唱詶詩故云再用韵送安囯辟榖㽞侯早淂仙慶鍾苗裔福如川少年為佛魁千佛今日生天作二天西掖代言詞俊逸東湖題壁墨澄鮮題名此行定有詩千首莫惜因風寄𢾗編易芝山五老亭名曰五峯安囯書之因成短篇三秀呈祥䖏危亭壓衆坡眼驚庐阜近峯類夏雲多喬嶽神咸㑹蒼穹頂共摩𬗋㣲新鉄畫輝映楚江波次韵安囯題餘干趙公子飬正堂堂張魏公所名也并為作銘去歳西来路偶同去六月予赴番昜魏公罷相来餘干邂逅于止饒水南僧寺一言不肯話飄蓬公所言皆囯之大事銘成飬正首示我公以七月朔日至餘干某訪公於趙公子舎公以病不及見出堂銘藁見示室坐不欺深念公大盗欲纏遥拱北群言交乱卒居東可怜未戦身先死貫日精忠化白虹次韵安囯題清音堂堂上清音楽奏仙洲如孤屿媚中川餘干遥服三苗囯陸羽高飛百越天有陸羽煑泉亭時湖廣冦賊未平故借用舞干意風過琵琶声不断水来雲錦色長鮮㽞題重遇張公子又入詩中第一編唐張祐詩在于越題詠中為首篇郡齋舊有假山暇日命工葺之取石之嵌者繂置山頂汲水筩竹引而激之自頂而下有懸崖飛瀑之状予既以䔥洒名齋因鐫二字于石戯成古風山從何来石無根水從何来山無源忽然幻出如自然群峯崒嵂声潺湲石工貌愚性機巧兩手頃刻成陶甄坐移野景到城郭觧使平地生林泉香炉瀑布名天下㕍蕩龍湫更瀟洒名山不見典刑存得趣何須論真假君不見晋公元勲兼盛徳緑野堂前羅澗石又不見行行正直韓退之汲井埋盆成小池二公匈中有佳致澗石盆池聊自戯世間万事皆戯耳何止兹山與兹水梅溪先生後集卷第九梅溪先生文集卷第九和韓詩和秋懐十一首丁卯季冬赴省試臨安至明年莫春側翅東帰既至㑹稽復還太學時方首夏草木敷榮良苗懐新㳺目原隰與物助欣至閏八月告帰復㝷故道雲水巳空園林𥘉落悽然感觸不能自已是月十有七日言息其廬定省之暇親戚鄊里日相過從有詩酒之樂恝然無復得失之在懐也清夜兀坐短檠自照誦韓退之秋懐詩十有一章欣若有晤因追其韻太山北斗我實慕之白雪陽春和以巴詞云孟夏㳺㑹稽禾稼方薿薿南凮翼新苗生意殊未巳重来覺非乆相去百日耳黄雲萬頃空蘋末凉凮起園林亦摇落觸目成疑似人生過隙駒何足恃胡為朱顔向迷塗奔走不停軌得失無榮辱歸来實堪喜草木無利名時来自榮晬人生異草木百念起心地困窮斯感傷利逹或驕恣一朝同物化榮辱两何異有酒且行樂不必富與貴直道疾伊優壮懐增靡曼海上豕方牧夜中牛屢飯半生營一名偃蹇未如碩青銅忽自照白髮巳堪歎斥鷃適蓬蒿大鵬搏九萬物情貴得所奚用求自獻冨貴似可喜貧賤亦何怨秋雨浸成潦秋霜漸為凌老樹喑寒蝉腥盤集痴蝇天涯有歸客面目吁可增吟餘自捫腹肝膽空稜稜臨淵不善漁籬頭掛寒􅊻数椽茅屋下養此百不能秋懐蟲共悲秋夜鶴同警輝輝玉䋲低耿耿銀漢永靜思鳬舄喬遐慕螭蟠猛途逺慵著鞭井深艱下綆鳥倦當知還馬失亦云幸窮通委天命塵慮可深屏客路厭繁暑㱕懐愜新景枕冷夣自清夜明窓更冏聊棲明月枝勝逐西風梗支床甘自息伏櫪倦思騁惟有問目心拳拳慕囬請窓几生新凉燈火照𥘉暗省巳有昨非探懐無宿憾古書恣掀翻古意薄窺瞰心将逰寂寞語復攻苦淡實歉名忌浮才踈得懲濫守志懼不堅入道恐成暫性栁戒牋賊心猿思繫䌫有友頻琢磨無官自校勘澹然學埸雄不恨儲無甔賢関藹多士頭角争軒軒中有倦㳺客虚名厭馳犇學為忠與孝思踐陽城言髙秋賦㱕去戯舞庭闈前東園㧊栗熟採摘供盤飡兄弟各賦詩集作棣蕚編甲乙二孺子日誦言半千學語三歲時笑味生甜酸欣然動我懐長夜不成眠歸来有此樂亦可終殘年吾廬有脩竹滴翠凝不乾天風一吹拂終夜鳴琅玕黄楊亦嘉樹一甕何團團日暮飛禽帰啾然欲求安嗟予欲何為屡渉呉江瀾一名竟未就舉弹空飛九對竹賞佳樹聊繫子征鞍啇颷起何䖏古樹生秋声粛粛夜氣寂悠悠月華明兀兀念前古孜孜殚寸誠黙黙守孤陋兢兢防滿盈興至役詩匠愁来驅酒兵自適布衣願未覺青衫榮長鬚與赤脚亦足供使令鮮鮮霜中菊誰云晩不好開日即重陽雖晚亦同蚤對景便湏醉浮生苦難保胡為楚大夫不飲致枯槁何如醉鄊人雖醉亦有道和符讀書城南示孟甲孟乙性無有不善兹言聞子輿學所以脩性楊雄著之書𣣔知人之生靈䑓湛然虚習善𥙿乃身習惡䘮厥𥘉下恵與盗跖不生两門閭所趍一不同相去霄壌如是以吾夫子詩禮教伯魚當時非義方聖門亦蕭踈我似杜陵翁有児最憐渠徒愛不知教懼如驢與猪詎望登丹霄折桂騎蟾蜍粗令有聞見免為甕中蛆丱角入小學首誦仲尼居要知先孝弟餘力㦲乎歟我家素孤寒金玉苦無儲舊業止青箱辛勤二星餘遺尓以清白爾曺冝念且性情乃良田學問為耘鋤勿患逺難致跬歩馳蹇驢勿憂年不逢六經有新畬勿随犇競流伺候人庭除勿學田舍児黄金買冠𥚑在我能自脩不患無聲譽我乆困筆硯退思老山墟拭眼看爾曺庶使愁腸舒詩篇和韓公座右宜書諸青春㝡堪惜勉矣無躊躇和醉贈張秘書寄萬大年先之申之戊辰十一月十一日過萬橋是夕㑹飲先之家同䘖柸者四人大年先之申之及予也促席而坐頗有清歡醉中誦昌黎先生贈張秘書詩人皆勸我酒我若耳不聞今日到君家呼酒持勸君之句既别遂和韓韻贈三君子良友不易得清談苦難聞前夕知何夕我来訪諸君共對燈燭光芳尊細論文通家忝孔李促席聮機雲柸盤畧荷禮氣味同清芬一盞洗窮愁三柸話離群春舟㑹稽别孟夏别大年于㑹稽秋𬒮錢塘兮七月先之帰八月中之帰顧我與三友新當敗孤軍飄零各南北對酒無複醺客况飽牢落時光負氤氲聚散實堪恨榮枯何足云歸来巳三月俗状日紛紛幸此同一笑盤飱飣腥葷蠔山薦巨房龜脚烹脩裙良辰屬嚴冬敗􅌚無蝇蚊痛飲竟長夜髙歌和南薫雖非韓孟張所飲亦典墳何時脫埸屋南畆同耕耘晝為雞豚社夜䇿詩酒勲此言冝早踐勿待粲榆曛和縣齋有懐四十韻予所居之乗偏有室甚陋目曰陋齋客過而病之曰子陋矣㢤予曰居九夷而不陋者夫子也予不敢學居陋巷而能樂者顔囬也竊有慕焉楊子雲曰晞顔之人亦顔之徒孰謂兹室之陋而不足以寄吾樂耶何病之有既而讀韓公縣齋有懐遂和其韻目曰陋齋書懐讀書窺古今掩卷成叱咤唐虞昔垂衣禹稷起躬稼人材各超絶王業迭興謝典謨光日月雅頌藹蘭麝孟軻論易地顔囬堪並駕窮逹雖殊途聖賢實同價避就鄊隣鬬泣笑䟽戚謝甘心惟飲瓢没齒不談霸斯人嗟巳亡未俗遂多詐禄從枉道求氣為權門下争為邑犬吠翻取獵師罵幽人思隠盤髙士欲耕灞予生苦多難安跡殊未暇冬行皸两足夜坐痺雙髂黄卷徒自勞青雲未䏻跨借勢乏王公成名無㒒射大學厭虀鹽親闈踈膾䏑眷眷日懐歸區區毎求假飛同鷁過宋閑若馬歸華陋巷懐哲人短檠燒午夜對床有兄弟通家足姻婭談笑開芳尊塵勞釋征靶篇章日盈嚢卷秩時抽架詠歌同舞雩歎息殊觀蜡有田聊代禄無謫不祈赦未為雄草玄謾學愈苴鏬嘨傲窮朝矄絃歌逹冬夏頭角姑目蔵齒牙誰肯借眠從弟子嘲醉不金吾怕心知得失妄眼見炎凉乍造物豈吾苦交情勿渠訝馬来未為福火盡安足藉孝弟儻自脩長㓜必能化力耕西疇禾剰種東皐柘㫖甘奉盤飱温清飾䑓榭斗粟鍳漢謡一㸑共崔舍仰効慈烏哺俯笑寒鴟嚇但令尊不空莫厭客頻迓凬篁觀掩冉山禽聴嬌姹困窮乃吾幸此禍不湏嫁和桃源圖世有啚畫桃源者皆以為僊也故退之桃源啚詩詆其說為妄及觀陶渊明所作桃花源誌乃謂先世避秦至此則知漁人所遇乃其子孫非始入山者能長生不死與劉阮天台之事異焉東坡和陶詩嘗序而辨之矣故予按陶誌以和韓詩聊証世俗之謬云嬴秦斬新開混茫傲睨前古無虞唐詩書為灰儒鬼哭李斯秉筆中書堂長城丁壮無還者送徒更住驪山下避世髙人何所之出門永與家鄊辭入山惟恐不深速豈是得巳巢扵斯来時六合為秦室未省今為何歲日吏不到門租不輸子長丁添更何䘏春入山中桃自花招邀隠侣傾流霞男耕女織自婚嫁派别支分都㡬家誰泛漁舟迷䖏所山開洞闢聞人語乍相驚問卒相歡設酒烹鷄講賓主可憐秦事巳茫然帝業𥘉期萬萬年猶道祖龍長在世豈知異姓早三傳鄰里慇懃争餉饋人情與世無相異未信壺中别有天却訝身游興夣寐山花亂眼鳥哀鳴数日留連喜復驚更從洞口㝷郷路逢人欲話疑非情異日扁舟欲重顧水昡山迷紅日暮後来啚畫了非真作誌淵明乃晋人和永貞行予自少喜讀柳文而不忍觀其傳惜其名齊韓愈而黨䧟叔文也退之與栁善及作順宗實錄未嘗假借公議之不可屈也如此戊辰仲冬二十有二夜讀韓詩永貞行至予嘗同僚情可勝之句則知退之雖惡伾文亦未䏻忘情扵劉栁軰也予既追和其韻遂扵入司馬中獨詳及栁盖惜其人而深責之耳君不見天為元和開號令先遣憸人竊朝柄奉天難平閑虎貔弈客待詔来京師口中班班談治道正觀開元何足為黨與紛紛自標置逺借伊周供佞媚里塵附大皆羙官怨脩睚眦曽不難梯媒爵位由貨賂斥遂朝士因柸盤珣瑜卧第郢佑黙誰為唐室囬狂瀾朝攘利權未為怪莫奪兵柄可歎尤仙李蟠根未當艾十葉神噐那容干禁中大義知誰主東宫受禅同三祖越児涕泣呉児悲從此豺狼不生羽剛明天子位初登翦除元惡流凶朋八州司馬才可稱莭巳掃地誰復矝子厚年少躁飛騰身䧟醜黨罹熏蒸著文擬騷愁思凝欲自辨白終莫曽王孫尸蟲託罵僧色豈不媿明窓燈所記先友時良肱忍使栁氏家聲崩吁嗟匪人何足慿士勿妄進當戦兢退之鯁直憤不勝詩篇史茟两可徴永貞覆轍冝痛懲和短燈檠歌寄劉長方戊辰仲冬二十有三夜坐六行堂對短燈檠誦昌黎詩三復興嘆既而思友人劉長方昔作燈銘有空洞其腹直方其形窒焉斯通晦焉斯明之句良有味也㒒自念與劉君㳺二十載矣平日偃蹇之迹大畧相似去秋同與上庠薦劉遂登乙科僕拜賜而還困躓如舊遂和韓公短檠歌以寄之我與君㳺最乆長短檠夜夜分清光𥘉從鄊校共牢落晚入太學同凄凉眼看児軰盡騰踏尚磨鉄硯穿蔾牀君今巳作青雲客萬言曽射天庭䇿藍𫀆㱕拜七十翁夀酒十分傾太白嗟予偃蹇只如前日髙空作盧仝眠樂事巳輸君自恣銀燭髙燒環翡翠直形空腹舊時燈牆角未應容易棄和苦寒羲和錯冬令寒燠常相兼在人為不常時焉作貪廉玄冥當用事如忌還如謙宜寒噤不嘘群萌誤抽尖既燠俄吹冷夜寐黒不甜水行失其理厥疾不可砭前日當孟冬雷聲震銅蟾三日輒大雪飛花眩觀覘逮此始踰月娄变寒與炎晨起坐東牕陽光快恩霑霜畦秀𬞞苗欣焉自腰鎌頃刻變凛冽枯藤怯提拈齒牙戦霜凮縮舌疑銜箝架抽紛掀翻誰能正牙籖酒柸覺無力瓶罄勞頻添貂裘尚不煖况無或衣縑兀坐擁黄紬脰作寒龜潜氣血粟肌體涕涶水鬚髯紅爐熾薪炭旋覺寒星殱靜思天壌間萬類何繁纎路傍泣凍餒海角愁廢淹羽毛有不庇腥血有不燖豈堪當此時可以吾身占慇懃語妻子汝復勿多怨嫌破𬒳尚禁絮漏茅可添苫人生苟知足處此意亦恬但願王化行東西俱𬒳漸堯天日舒長有目皆可瞻寒生在陋巷甘心事虀鹽何湏傍人門炙手随姦憸耽耽王侯宅笙歌下珠簾寒暑止温凉焉知有窮簷否泰迭徃来禍福相依黏勿用倚彼玉自分安吾蒹飽腹日三飯蔽形衣一䄡祁寒勿怨咨庶用懲無厭和南食萬先之送巨蠣百房大破饞願正炰啜間記憶前日作東平客飫啖兹味先之舉退之南食詩蠔相黏為山千百各自生之句僕方追和韓詩遂用其韻以謝海錯千萬族惟蠔不能行潮来腹自飽亦足遂厥生翻笑魚蠏蝦晨夜何營營凬味與江􅠪可以次第名薦身炮炙間殻破材始呈北客昔南食一見生怪驚故人居海濱群鮮厭庖烹酷愛此味真不假薑桂橙遥憐山間友混迹黎與騂𬞞腸久不飽肌骨尫且獰巨房餉饞腹一笑百念平豈爲飲食欲實見親舊情誰知虀鹽餘盤湌味常并故鄊實堪戀未用圖西行和聴㯋師琴黄巖施生挟書来梅溪從吾弟夣齡㳺以裏糧餘資易琴一張講習之暇時一弄焉季冬之朔燈火𥘉夜凬靜籟息明星燦然坐南窓之下爲予撫之予素不曉音律妄意古人琴中之趣欣若有得聴終遂㱕陋齋誦退之聴穎師琴詩掩卷慨然予旣嘉施生雅尚遂和其韻以贈七絃自相語唱予仍和汝千指忽凄凉騷人悲戰埸大絃温和小清越惠凬夷韻參悠揚琴瑟鳴寒泉儀儀舞鸞凰山髙水逺聽愈淡花奴羯鼓聲方彊施生幽雅士不好笙與篁千金買焦尾悠然坐黎牀顧我非知音感激涕自滂三聴輒三嘆羲皇在我虀鹽腸和憶昨行示夣齡夣齡弟近感㣲恙情緒常若不佳予懼其壹鬰傷和也因誦退之和張十一憶昨行云無妄之災勿藥喜一善自足禳千災頭䡖目朗肌骨徤古劍新斸塵磨埃殃消禍散百福併從此直到耆與鮐之句以慰其懐既以又和以贈之憶昔昨少年氣鋭心未灰平明出門薄暮廻觧衣換酒期必醉亂花壓面欹條放年華荏苒今半世觸事徃徃生悲哀歡娱無復少年味勉強談咲陪尊罍飲纔過量輒成疾秋霜入鬢剛腸摧子年少我氣鼎盛琅玕夜誦聲如雷匈中平時足藴藉頥神養素成嬰孩松姿栢質異蒲栁堅剛不怕霜霰漼凌雲变化未可料豈比嵲屼凬中桅胡為欝欝乃如許與我老者同虺隤豈縁心事未如願一念遂覺憂愁来還驚世態多險阻忤意未免生嫌猜壮懐千里力未致齟齬翻類三足能傷和伐性致坎軻两眉蹙恨慿誰開吾聞君子貴知命數者扵我何有㢤又聞古人亦迍蹇在易固有無妄災閉門靜坐養時晦拂拭心鏡捐塵埃他年定作仁者夀齒背㑹見同鯢鮐聖賢遺訓載子腹此事寜不知所裁否徃㤗来固有日坦塗利轂寜湏摧和燕河南府秀才送周光宗友人周光宗将叅告太學某誦退之燕河南府秀才詩末章云隂凬攪短日冷雨澁不晴勉㢤戒徒馭家國遲子榮以祝其行既又和以送之取古人賦詩取㫁章之意云爾吾皇尚柔理北客来輸平投戈講文藝虞庠萃群英藹藹六年間人物如西京菁莪各成材龍虎巍標名東嘉號多士半作鴻都生昭然藻鑑中不負事業精先進日通顯天衢作雷轟後生益可畏行藝方蜚聲賢㢤汝南丈頭角令人驚撑腸飽文史欲振三年鳴偃蹇未如志造物殊無情歸来務遵養絶意蝸角争髙堂有慈親祿養湏大烹壮懐不䏻已千里提短檠掉頭脫塵鞅舉翼摩太清賤子沗交末平生荷推誠𬗟懐去年春駕言共西征悠悠舊時路君今獨先行江梅弄春色愛日烘新晴勿惮行役苦㑹見㱕来榮和荅張轍寄曺夣良某與夣良㳺十有五載矣栖遲偃蹇之迹𥘉不相異也兹復同舍上庠交契愈篤曹秋賦暫蹶予春闈退飛别已朞面猶未㑹追念疇昔泮宫之樂鄊校之㳺鼓雪棹扵金溪振凬葛扵清逺門之外不無慨然因誦退之荅張徹首章辱贈不知報我歌爾其聆首叙始識面次言後分形遂和其韻以寄之且速其肯来也戊辰季冬十六日故舊别云久話言猶未聆嵗暮念愈劇宵長夣形頻憶昔始傾盖相㸔俱妙齡參乎方越席鯉也纔趨庭樂泮共采藻泛江同食萍玄深探羲畫狂妄窺麟經端能辨箕荄未省分雷霆卷帙發晨架膏油燃夜櫺冨君才八斗我字識一字䡖縑苦窘幅髙屋欽建瓴低頭願為愈割席終慙寜結㳺指寥廓約泛航清泠驥足騁天駿鼇頭緡海腥塗逺困塵鞅棹逥閣寒汀壮懐誓白水憤氣干青雲冥孤嶼散形影雙溪隔滄𬈑耿耿月遥共悠悠門獨扃論文憶李白對酒懐劉伶鄊校鼓沂瑟頌章賡魯駉濯暑振凬𬒮破寒操雪舲勝㳺倣栗里雅㑹脩蘭亭瓶罄沽甕蟻燭殘照嚢螢猖狂却大雅酩酊還獨醒槐市忽飛詔英才先振翎短檠慷慨長劍磨晶熒歌舊耻雪赤壁竒功收井陘髙價壓群玉新文麗繁星鄊閭借光豔庠序資儀刑随群𫀆暫白唾手衫當青殘生適孤苦舉足方伶俜文房泣遺澤座右悲先銘犬馬不填􅊤鳬鷖卒同涇射縞服疆箭揰鍾施寸筳惟求免埸屋詎望揚王庭師旋約奏凱案就期脫囹勢屈戦徒力命竒不文靈秋翼困燕省春苗害蟊螟日念返桑梓願言和鸞鈴溪山有偕影隠風雨無獨聽懸崖踏蒼翠怪石穿瓏玲豹閑眠霧窟鳥倦棲雲屏世情自翻覆交態長芳馨歲時覺荏苒咫尺如飄零盈虧婁瞻桂開落頻觀􅕴欲去廢負米念来方祝蛉何時摻子手一笑空吾瓶注目杳雲雁緘書附原鴒鄙吝佇滌胃鈍頑資發鉶得得戒徒馭遲遲趨闕廷猶勝炙手軰奔走趍公􅈦巳巳元日讀送楊郎中賀正詩因和其韻鷄日五更鷄咿喔銀缸明㓕燒餘脂家家呼牛逐耗鬼牛歸誰家鬼何之皇都朝㑹我無與西疇春亊行及期弟兄成行拜親老猶勝去年身未歸人日過電山隨行有昌黎集因讀城南登髙詩遂次韵留别孫先覺臘去梅巳稀陽浮栁𥘉弄北斗新轉稍東風漸消凍為人莭固佳顧我身無用命駕訪親交肩輿勞僕従門䦨念乆别燈燭忻此共興来酒自斟歡至歌頻送提壼勸銜盃播榖催除葑農耕方迫㱕行樂未能縦人生苦離别俗状嗟倥偬春風桃李花把盞何時重和李花梅溪書院有李数株土寒花瘦㳺人不之賞因讀退之詩平旦入西園梨花数株若矝夸中有一株李顔色慘慘以含嗟惻然有感遂和其韵春風入園林萬卉以艶争相夸胡爲此仙李顔色憔悴堪咨嗟稜稜痩樹数點雪半醒半睡風欹斜枯枝膚剥少生意况有疥癬相孽芽不如兎葵及燕麦妍媚春色摇纎葩下自成蹊直虚語誰肎顧盻留香車顧我􅑮春少行樂老眼日有文書遮自憐衰颯巳如許那更對此愁人花皇都二月桃李盛朱輪翠盖方紛拏東君世情亦太甚十分春在侯門花試吟怨句問蒼昊一種春工何損加白華秉燭光照夜此樹不屬孤寒家造化無言意潜告我愛萬物初無差物情禀受苦自異奚有厚薄施萌芽勸君勿爲花致怨怨居易俟命思無邪和荅栁栁州食蝦蟇蝦蟇水蟲也不為人害與螟蝗之類不同然周官蟈氏掌出去鼃黽以灰洒之則死說者謂蟈與耿黽尤怒鳴聒人耳故去之予竊謂此非周公之用心必後世傳習之訛而附益其說也退之記其亊扵詩未免乎勸矣巳巳仲夏群居梅溪諸友頗嗜此味丐者争捕而致之予懼其殺物滋多和韓詩以戒蟲魚千萬族一一異状貌飛潛同一性巨細何必校彼微水中鼃四足傴而皰自從科蚪𥘉生育在泥淖好鳴乃其性非故欲喧閙蟈氏職洒灰恐非聖人教吾聞人間世生死同夣覺殺物傷吾仁忍聴聲熚爆况我儒衣冠絃誦生鄊校彼亦呼子曰有意欲吾効諺云住近孔堂蝦蟇呼子曰故以為戯人虫各好生奚用苦相撓退之惮食蛇得得釋籠罩子厚放鷓鴣仁心亦稍稍胡為扵此蟲未盡忘嗜樂薦祠用梟穽誅虎豹古人豈妄殺去害除不孝願留兹鼓吹駐我寒溪櫂梅溪先生文集卷第九
