body:
  text: 州宅十二詠平政堂愷悌周君子循良漢守臣如今坐堂上端是政平人玉芝堂范文正公名不是因三秀名堂意自深要居森戟地母忘采芝心慶朔堂范文正公建昔日栽花者官移花未開舊花今豈在猶説范公栽退思軒會淂名軒意公餘坐片時退思何及矣未退早須思九賢堂猶起才難歎同時九亂臣鄱陽千載守賢豈許多人四賢堂誰品鄱陽守四人賢不知如何堯舜世能使野無遺四望亭有澤冝觀水無􅉉不見山鄱君千里國俯仰一亭間綺霞亭孤鶩同飛處澄江共賦詩晚來亭上看真是謝公詩清香亭髙架添風韻芳醪共姓名蘇州凝燕寢疑是此香清百花樓昔日風流守公餘種百花春風不檢點紅𬗋落誰家多失鄱江樓郭外山橫閣閣山江邉水照樓粗官無暇日何以淂消憂蜀錦亭蜀錦海棠也郡人謂范文正公所植亭今廢亭廢名猶在春來花自芳猶餘蜀中錦愛惜比甘棠景盧贈人面竹杖奔走方嗟力不任淂公一杖直千金竹能有面如人面人亦虛心似竹心渡水只愁龍欲化入山應與鳯聮吟翰林虞部相酬贈同舍交情復見今退之赤藤杖歌云歸來捧贈同舍子豫與洪亦館中同舍也鄉人項服善宰鄱陽有政聲人惜其去用郡圃栽花韻作詩數篇敘别遂和以送之七歲名師世胄賖雲孫行實副文華仁心馴及魯恭雉和氣種成潘嶽花清白見知鄱水月高明相照楚天霞送君撩我思鄉意遙想吾廬日長麻鄱江同事半年賖直諒何人似去華吏報圜扉多鞠草民歌枯木再生花邑人有枯木再生春之謡暫留蕭寺行逢雨剩作新詩語帶霞褒德自應侯卓茂清朝知巳况如麻江東回首莫雲賖寒食令人感歲華皎皎丹心惟望日是日祈晴星星短髮不簮花書傳何處山名堆寄家書酒憶吾鄉水似霞樂清有赤水之名鄉人喜造紅酒故舊相逢如問我為言多病服天麻公真有德如元令我愧無才似李華話别芝堂傾竹葉送行鄱水漲桃花眼看三匝烏逢月心羡齊飛鶩趂霞它日相期訪劉阮分桃采藥飲胡麻豫向年少不自量因讀韓詩輒和數篇未嘗敢出以示人蓋二十年矣近因嘉叟見之不能自掩且贈以長篇蒙景盧繼和用韻以謝少小思尚竒薰風琴𣣔和規模與時背埸屋屢摧挫大道窺五原高論讀二過神遊京城南南山詩思渺蒸水左竹看金影碎菊擷霜風破論文摩巨刃薦士躬疆笴蕭蘭發秋懷木堆吟齒墮飛飛雙鳥鳴不數鸝兩箇幽幽十琴操可僕葌臺些光餘万丈長照我一牀卧未終三百篇正坐短檠課韓古律詩共三百餘篇𥘉妄意𣣔盡和之以方作舉業遂止不敢示友朋懼遭泥滓唾文章吉太守臭味夙相荷索我舊詩案贈以千金貨郡亝哦好句艷艷月照坐端如陳琳檄快讀痊轗軻濫把江湖麾謬聲慚日播祈寒兼苦雨怨嗟吾豈奈竊效衡山禱是日祈晴因思鑑湖貨時已乞祠翵鷃各逍遙溟蓬無巨麼次韻陳阜卿讀洪景盧追和玉板詩風采􅏢􅏢御史官旌麾所至庶民安渭川千畝填胸臆散作毫端風雨寒前世書魚化宰官肺腸元與竹相安侯生韓子相酬贈詩句驚人魂膽寒次韻何憲修途倦遊懷鄱陽唱和之樂馬上詩成驛使馳社中猶恨使來遲不堪冀北群空後况是江東日莫時春半鶯猶懶呼喚雨多鳩亦厭分離論文尊酒何時共公説歸期我去期次韻何憲太平道中書事明刑清詔使行部近清明况有太平象想亡愁嘆聲問民知疾苦按郡戒將迎更向金陵看六朝餘故城次韻何憲題魯池州通隱堂朝市隱誠好山林通更嘉出非專為米去亦不期瓜下惠何妨介東方未用夸東方朔朝隱者也退之作方朔遺事詩挾恩更矜夸池州知此道無愧仲連家芝山勸農出門非為采靈芝端為農時不可違我欲勸農農勸我田園薄有早須歸二月十五日祈晴十七日雷雨再作清香一瓣乞晴回凖擬陽光万里開凬伯未吹雲陳破雷公又喚雨聲來輔天石爛疇能錬陷濘車深不易推誰坐黃堂稱太守深慙無術救天災喜晴再用前韻天閔斯民意巳回群隂不掃自應開扶桑曉日曈曈出玉宇清風習習來水緑漁翁聲欵乃月明詩客手𫾣推秧針刺水麥搖浪定有豐年無後災數日天氣朝隂莫晴復用前䪨忍飢面目類顔回僅淂青天半日開且碩催詩無雨至只冝送月有凬來出遊偶似文昌霽侍滿當為桀溺摧退之和張十一憶作行云君當先行我待滿沮溺相繼窮年榷曰雨曰暘皆帝力麥苗無害免書災哭何子應籍甚何夫子文章擅美名金華傳語寶鄱水主詩盟心印橫渠學相門無盡甥人間一蘿覺卿月墮臺城骯􅗣冝三出飄零到九疑忠􅈾黃屋眷音遇𬗋岩知公以張魏公薦𬒳召共理符頻綰明刑莭屢持青天万里蜀無復話歸期公作皇華使豫乘郡守轓江湖吳芮國襟抱杜陵尊翰墨頻揮染詩文細討論新編刊未就楚些巳招魂何以正月二月二十二日行部方議開椘東酬唱集途中三同官會飲鄱江樓送谷簾泉二尊戲成小詩聞説樓中會八仙郡齋分送谷簾泉好將投向鄱江水共作長鯨吸百川名郡之東門曰永平書一絶鄱水新門號永平永平何止一鄱城碩言廣此平天下黎庶長無愁嘆聲主簿程同年和永平門詩再賦四絶因以贈别迃儒政事只平平濫守鄱陽十里城賴有同年更同事公餘時作苦吟聲髙唱猶嫌二謝平偏師能破五言城番人口誦新門記巳作雷門振大聲才知端如杜下平異時何止任專城三年俯首栖榛棘行作沖霄鵉鳯聲春盡湖如鏡面平扁舟送别古畨城相將我亦為行客征堆來時好寄聲送春楊花榆莢滿天飛九十風光别我時鳬鶩成行報公事簿書中作送春詩州院獄空贈知録孫聽把麾承乏楚邦東獄及期年始報空顧我自慚無德政同僚深喜有于公鄱江樓分韻得月字尊酒相逢人二八年少壯夫子白髮明年何處更登樓遙望鄱陽江上月前端午一日會飲鄱江樓十有六人既分韻賦詩又戲成短篇佳莭江樓上同僚共把杯人如舜才子名半漢雲臺詩占城南首音參古磬枚冝添兩學士相約訪蓬萊韓退之將城南詩十六首漢犍為郡淂古磬十六枚五月二十日閔雨仲夏百榖長中沐群龍分俗謂是日分龍此邦淂何龍行天莫辝勤碩於呼吸間山川走風雲亟下霈然澤救我心如焚次韻葉樞密言别㳅落江湖歲月侵九重側席念公深漢庭寬大頒綸綍楚閣清和襆枕衾公寓居楚東閣大壑巨魚欣復縱虛舟積羽可能沉乾坤整頓須元老芝嶺柯山未許尋公前欲居芝山今暫居柯山洪景盧以郡釀飲客于野處園賦詩見寄次韻老境厭吏事歸心繞丘園日月忽有夏炎蒸變春溫芝堂孰新釀誰共論文尊緬懷蓬山舊情好素所敦殷勤十從事往掃東坡軒深杯滑琉璃不比田家盆醉吟到高處舞月成清歡我獨坐空齋靜對忘憂萱萱多憂未忘香清思猶昏懷君不成寐兩處一聲猿剡紙贈嘉叟以詩為謝次韻仁義知君學子輿豈惟詞賦似相如剡溪百幅𫾣氷紙換淂臨池小草書伏日四望亭分韻淂月字伏日何處遊危亭隂清樾十客同我登詩興浩然發四􅉉山在眼奚用更柱笏小飲未成醺天邉見新月次韻趙通判喜雨政拙時時費禱求心憂赤子餓填溝一聲霹靂中宵雨洗出江湖万里秋徐孺子亭一室不暇掃心期掃天下一榻不妄設所待必賢者南州傑出士林泉事瀟灑閉門謝弓招道合不吾舍誰云性少通得一不為寡豫章豈私交端欲重宗社漢廷無此賢忍使遺在野交章薦天闕聘禮備車馬髙人竟不屈清風凛華夏寄聲郭有道一木難支厦肯同樊處士聲名秖虛假雞酒弔知音韜光老松檟倘令居孔門行藏似回也江西今仲舉吏事飾儒雅神交千載友丹青妙摹寫作亭古東湖鱗鱗万椽瓦序嗤滕閣王詞逼長沙賈佳客從公遊湖光瑩尊斚孺子真可師丗途何土苴行矣浙東西鉏犂各歸把張安國舍人以南陵鄱陽雨暘不同示詩次韻春水平原天可拍夏日如焚天可拆哀哉農民亦良苦厭見常暘與常雨去秋鄱陽偶中熟巨室猶言廪無谷万畝家輸𢾗千斛路旁安淂黔敖粥吾君罪已同禹湯思起傳岩調雨暘暫勤千騎作南伯要使炎嶠無餘殃又次韻閔雨長夏蚊蠅倦驅拍忽淂緘封手親拆新詩首及民疾苦更閔鄱陽境無雨鄱陽假守仁不熟作郡端如種焦谷胸中賸有愁千斛闔門百指顔公粥𬗋微好善嗤洪湯公孫洪張湯皆薦賢好善然其人不足取也眉間和氣如時暘行歸廊廟贊化育善人冝賞淫人殃次韻安國讀楚東酬唱集麾把江湖遇列仙𢋫酬篇什滿鄱川竇家兄弟聮珠日廬阜峯巒夕照天鄱陽芝山有五老亭西望廬阜晚晴則見范文正公詩試憑高閣望五老夕陽開三郡美名俱赫赫陳洪州洪吉州王興化一臺遺墨尚鮮鮮何憲𬗋微妙語題詩後光艷真能照簡編安國讀酬倡集有平生我亦詩成癖却悔來遲不與編之句今𣣔編後集淂佳作𢾗篇為楚東詩社之光復用前韻六逸中無李謫仙前集恨不淂公詩為大詩筒忽淂舊臨川舍人前治臨川乃鄰郡也枝芳又類燕山桂何卿往矣今集又淂五人馬立欣瞻刺史天五人二帥三守公似虞臣冝作牧我慙鼠技濫烹鮮新詩不減顔公詠貴若山王㝎不編次韻安國讀薦福壁間卿二詩悵然有感金華遽作鬼中仙嘆息真同子在川何遜詩猶在東閣杜陵家不上青天何卿每有歸蜀之念既死其子以其喪歸􅌾于吳忠隨奏疏留丹闕字落禪房照碧鮮客過楚東吟楚些唱酬新集定須編五月二十五日餞安國舍人于薦福洪右史王宗丞來會坐間用前韻尊酒相逢半八仙鬢絲我類社樊川江東渭北四方客張淮西洪江東王河北某浙東楚尾吳頭五月天蓮社濫陪陶令飲兵厨聊擊陸生鮮待將紅藥翻階句别作番陽一集編張欲盡和楚東唱酬詩故云再用韻送安國辟榖留侯早淂仙慶鍾苗裔福如川少年為佛魁千佛今日生天作二天西掖代言詞俊逸東湖題壁墨澄鮮題名此行定有詩千首莫惜因風寄𢾗編易芝山五老亭名曰五峯安國書之因成短篇三秀呈祥處危亭壓衆坡眼驚廬阜近峯類夏雲多喬嶽神咸會蒼穹頂共摩𬗋微新鐵畫輝映楚江波次韻安國題餘干趙公子飬正堂堂張魏公所名也并為作銘去歲西來路偶同去六月豫赴番昜魏公罷相來餘干邂逅于止饒水南僧寺一言不肯話飄蓬公所言皆國之大事銘成飬正首示我公以七月朔日至餘干某訪公於趙公子舍公以病不及見出堂銘藁見示室坐不欺深念公大盜欲纏遙拱北群言交亂卒居東可憐未戰身先死貫日精忠化白虹次韻安國題清音堂堂上清音樂奏仙洲如孤嶼媚中川餘干遙服三苗國陸羽高飛百越天有陸羽煮泉亭時湖廣冦賊未平故借用舞干意風過琵琶聲不斷水來雲錦色長鮮留題重遇張公子又入詩中第一編唐張祐詩在于越題詠中為首篇郡齋舊有假山暇日命工葺之取石之嵌者繂置山頂汲水筒竹引而激之自頂而下有懸崖飛瀑之狀豫既以蕭灑名齋因鐫二字于石戲成古風山從何來石無根水從何來山無源忽然幻出如自然群峯崒嵂聲潺湲石工貌愚性機巧兩手頃刻成陶甄坐移野景到城郭解使平地生林泉香爐瀑布名天下堆蕩龍湫更瀟灑名山不見典刑存得趣何須論真假君不見晉公元勳兼盛德緑野堂前羅澗石又不見行行正直韓退之汲井埋盆成小池二公胸中有佳致澗石盆池聊自戲世間万事皆戲耳何止兹山與兹水梅溪先生後集卷第九梅溪先生文集卷第九和韓詩和秋懷十一首丁卯季冬赴省試臨安至明年莫春側翅東歸既至會稽復還太學時方首夏草木敷榮良苗懷新遊目原隰與物助欣至閏八月告歸復尋故道雲水巳空園林𥘉落悽然感觸不能自已是月十有七日言息其廬定省之暇親戚鄊里日相過從有詩酒之樂恝然無復得失之在懷也清夜兀坐短檠自照誦韓退之秋懷詩十有一章欣若有晤因追其韻太山北斗我實慕之白雪陽春和以巴詞云孟夏遊會稽禾稼方薿薿南凮翼新苗生意殊未巳重來覺非久相去百日耳黃雲萬頃空蘋末涼凮起園林亦搖落觸目成疑似人生過隙駒何足恃胡為朱顔向迷塗奔走不停軌得失無榮辱歸來實堪喜草木無利名時來自榮晬人生異草木百念起心地困窮斯感傷利逹或驕恣一朝同物化榮辱兩何異有酒且行樂不必富與貴直道疾伊優壯懷增靡曼海上豕方牧夜中牛屢飯半生營一名偃蹇未如碩青銅忽自照白髮巳堪歎斥鷃適蓬蒿大鵬搏九萬物情貴得所奚用求自獻冨貴似可喜貧賤亦何怨秋雨浸成潦秋霜漸為凌老樹喑寒蟬腥盤集癡蠅天涯有歸客面目吁可增吟餘自捫腹肝膽空稜稜臨淵不善漁籬頭挂寒􅊻數椽茅屋下養此百不能秋懷蟲共悲秋夜鶴同警輝輝玉繩低耿耿銀漢永靜思鳬舄喬遐慕螭蟠猛途逺慵著鞭井深艱下綆鳥倦當知還馬失亦云幸窮通委天命塵慮可深屏客路厭繁暑歸懷愜新景枕冷夢自清夜明窗更冏聊棲明月枝勝逐西風梗支床甘自息伏櫪倦思騁惟有問目心拳拳慕回請窗几生新涼燈火照𥘉暗省巳有昨非探懷無宿憾古書恣掀翻古意薄窺瞰心將逰寂寞語復攻苦淡實歉名忌浮才踈得懲濫守志懼不堅入道恐成暫性栁戒箋賊心猿思繫纜有友頻琢磨無官自校勘淡然學埸雄不恨儲無甔賢關藹多士頭角爭軒軒中有倦遊客虛名厭馳奔學為忠與孝思踐陽城言髙秋賦歸去戲舞庭闈前東園㧊栗熟採摘供盤餐兄弟各賦詩集作棣蕚編甲乙二孺子日誦言半千學語三歲時笑味生甜酸欣然動我懷長夜不成眠歸來有此樂亦可終殘年吾廬有修竹滴翠凝不乾天風一吹拂終夜鳴琅玕黃楊亦嘉樹一甕何團團日暮飛禽歸啾然欲求安嗟豫欲何為屢涉吳江瀾一名竟未就舉彈空飛九對竹賞佳樹聊繫子征鞍啇颷起何處古樹生秋聲肅肅夜氣寂悠悠月華明兀兀念前古孜孜殫寸誠默默守孤陋兢兢防滿盈興至役詩匠愁來驅酒兵自適布衣願未覺青衫榮長鬚與赤腳亦足供使令鮮鮮霜中菊誰云晚不好開日即重陽雖晚亦同蚤對景便須醉浮生苦難保胡為楚大夫不飲致枯稿何如醉鄊人雖醉亦有道和符讀書城南示孟甲孟乙性無有不善兹言聞子輿學所以修性楊雄著之書𣣔知人之生靈臺湛然虛習善𥙿乃身習惡喪厥𥘉下惠與盜跖不生兩門閭所趍一不同相去霄壤如是以吾夫子詩禮教伯魚當時非義方聖門亦蕭踈我似杜陵翁有兒最憐渠徒愛不知教懼如驢與豬詎望登丹霄折桂騎蟾蜍粗令有聞見免為甕中蛆丱角入小學首誦仲尼居要知先孝弟餘力哉乎歟我家素孤寒金玉苦無儲舊業止青箱辛勤二星餘遺尓以清白爾曺冝念且性情乃良田學問為耘鋤勿患逺難致跬步馳蹇驢勿憂年不逢六經有新畬勿隨奔競流伺候人庭除勿學田舍兒黃金買冠𥚑在我能自修不患無聲譽我久困筆硯退思老山墟拭眼看爾曺庶使愁腸舒詩篇和韓公座右宜書諸青春最堪惜勉矣無躊躇和醉贈張祕書寄萬大年先之申之戊辰十一月十一日過萬橋是夕會飲先之家同䘖柸者四人大年先之申之及豫也促席而坐頗有清歡醉中誦昌黎先生贈張祕書詩人皆勸我酒我若耳不聞今日到君家呼酒持勸君之句既别遂和韓韻贈三君子良友不易得清談苦難聞前夕知何夕我來訪諸君共對燈燭光芳尊細論文通家忝孔李促席聮機雲柸盤略荷禮氣味同清芬一盞洗窮愁三柸話離群春舟會稽别孟夏别大年于會稽秋𬒮錢塘兮七月先之歸八月中之歸顧我與三友新當敗孤軍飄零各南北對酒無復醺客况飽牢落時光負氤氲聚散實堪恨榮枯何足云歸來巳三月俗狀日紛紛幸此同一笑盤飱飣腥葷蠔山薦巨房龜腳烹修裙良辰屬嚴冬敗􅌚無蠅蚊痛飲竟長夜髙歌和南薰雖非韓孟張所飲亦典墳何時脫埸屋南畝同耕耘晝為雞豚社夜䇿詩酒勳此言冝早踐勿待粲榆曛和縣齋有懷四十韻豫所居之乘偏有室甚陋目曰陋齋客過而病之曰子陋矣哉豫曰居九夷而不陋者夫子也豫不敢學居陋巷而能樂者顔回也竊有慕焉楊子雲曰晞顔之人亦顔之徒孰謂兹室之陋而不足以寄吾樂耶何病之有既而讀韓公縣齋有懷遂和其韻目曰陋齋書懷讀書窺古今掩卷成叱吒唐虞昔垂衣禹稷起躬稼人材各超絶王業迭興謝典謨光日月雅頌藹蘭麝孟軻論易地顔回堪並駕窮逹雖殊途聖賢實同價避就鄊鄰鬬泣笑疏戚謝甘心惟飲瓢沒齒不談霸斯人嗟巳亡未俗遂多詐祿從枉道求氣為權門下爭為邑犬吠翻取獵師罵幽人思隱盤髙士欲耕灞豫生苦多難安迹殊未暇冬行皸兩足夜坐痺雙髂黃卷徒自勞青雲未能跨借勢乏王公成名無㒒射大學厭虀鹽親闈踈膾炙眷眷日懷歸區區每求假飛同鷁過宋間若馬歸華陋巷懷哲人短檠燒午夜對床有兄弟通家足姻婭談笑開芳尊塵勞釋征靶篇章日盈囊卷秩時抽架詠歌同舞雩歎息殊觀蠟有田聊代祿無謫不祈赦未為雄草玄謾學愈苴鏬嘨傲窮朝矄絃歌逹冬夏頭角姑目藏齒牙誰肯借眠從弟子嘲醉不金吾怕心知得失妄眼見炎涼乍造物豈吾苦交情勿渠訝馬來未為福火盡安足藉孝弟儻自修長幼必能化力耕西疇禾剩種東皋柘旨甘奉盤飱溫清飾臺榭斗粟鑒漢謡一㸑共崔舍仰效慈烏哺俯笑寒鴟嚇但令尊不空莫厭客頻迓凬篁觀掩冉山禽聽嬌姹困窮乃吾幸此禍不須嫁和桃源圖世有啚畫桃源者皆以為仙也故退之桃源啚詩詆其説為妄及觀陶淵明所作桃花源志乃謂先世避秦至此則知漁人所遇乃其子孫非始入山者能長生不死與劉阮天台之事異焉東坡和陶詩嘗序而辨之矣故豫按陶志以和韓詩聊證世俗之謬云嬴秦斬新開混茫傲睨前古無虞唐詩書為灰儒鬼哭李斯秉筆中書堂長城丁壯無還者送徒更住驪山下避世髙人何所之出門永與家鄊辭入山惟恐不深速豈是得巳巢于斯來時六合為秦室未省今為何歲日吏不到門租不輸子長丁添更何恤春入山中桃自花招邀隱侣傾流霞男耕女織自婚嫁派别支分都幾家誰泛漁舟迷處所山開洞闢聞人語乍相驚問卒相歡設酒烹雞講賓主可憐秦事巳茫然帝業𥘉期萬萬年猶道祖龍長在世豈知異姓早三傳鄰里殷勤爭餉饋人情與世無相異未信壺中别有天却訝身遊興夢寐山花亂眼鳥哀鳴數日留連喜復驚更從洞口尋鄉路逢人欲話疑非情異日扁舟欲重顧水昡山迷紅日暮後來啚畫了非真作志淵明乃晉人和永貞行豫自少喜讀柳文而不忍觀其傳惜其名齊韓愈而黨陷叔文也退之與栁善及作順宗實録未嘗假借公議之不可屈也如此戊辰仲冬二十有二夜讀韓詩永貞行至豫嘗同僚情可勝之句則知退之雖惡伾文亦未能忘情于劉栁輩也豫既追和其韻遂于入司馬中獨詳及栁蓋惜其人而深責之耳君不見天為元和開號令先遣憸人竊朝柄奉天難平間虎貔奕客待詔來京師口中班班談治道正觀開元何足為黨與紛紛自標置逺借伊周供佞媚里塵附大皆美官怨修睚眥曽不難梯媒爵位由貨賂斥遂朝士因柸盤珣瑜卧第郢佑默誰為唐室回狂瀾朝攘利權未為怪莫奪兵柄可歎尤仙李蟠根未當艾十葉神器那容干禁中大義知誰主東宫受禪同三祖越兒涕泣吳兒悲從此豺狼不生羽剛明天子位初登翦除元惡流凶朋八州司馬才可稱莭巳掃地誰復矝子厚年少躁飛騰身陷醜黨罹熏蒸著文擬騷愁思凝欲自辨白終莫曽王孫尸蟲託罵僧色豈不愧明窗燈所記先友時良肱忍使栁氏家聲崩吁嗟匪人何足慿士勿妄進當戰兢退之鯁直憤不勝詩篇史茟兩可徴永貞覆轍冝痛懲和短燈檠歌寄劉長方戊辰仲冬二十有三夜坐六行堂對短燈檠誦昌黎詩三復興嘆既而思友人劉長方昔作燈銘有空洞其腹直方其形窒焉斯通晦焉斯明之句良有味也㒒自念與劉君遊二十載矣平日偃蹇之迹大略相似去秋同與上庠薦劉遂登乙科僕拜賜而還困躓如舊遂和韓公短檠歌以寄之我與君遊最久長短檠夜夜分清光𥘉從鄊校共牢落晚入太學同凄涼眼看兒輩盡騰踏尚磨鐵硯穿藜牀君今巳作青雲客萬言曽射天庭䇿藍𫀆歸拜七十翁夀酒十分傾太白嗟豫偃蹇只如前日髙空作盧同眠樂事巳輸君自恣銀燭髙燒環翡翠直形空腹舊時燈牆角未應容易棄和苦寒羲和錯冬令寒燠常相兼在人為不常時焉作貪廉玄冥當用事如忌還如謙宜寒噤不噓群萌誤抽尖既燠俄吹冷夜寐黑不甜水行失其理厥疾不可砭前日當孟冬雷聲震銅蟾三日輒大雪飛花眩觀覘逮此始踰月婁變寒與炎晨起坐東窗陽光快恩霑霜畦秀𬞞苗欣焉自腰鎌頃刻變凛冽枯藤怯提拈齒牙戰霜凮縮舌疑銜箝架抽紛掀翻誰能正牙籖酒柸覺無力瓶罄勞頻添貂裘尚不暖况無或衣縑兀坐擁黃紬脰作寒龜潛氣血粟肌體涕唾水鬚髯紅爐熾薪炭旋覺寒星殱靜思天壤間萬類何繁纎路傍泣凍餒海角愁廢淹羽毛有不庇腥血有不燖豈堪當此時可以吾身占殷勤語妻子汝復勿多怨嫌破𬒳尚禁絮漏茅可添苫人生苟知足處此意亦恬但願王化行東西俱𬒳漸堯天日舒長有目皆可瞻寒生在陋巷甘心事虀鹽何須傍人門炙手隨姦憸耽耽王侯宅笙歌下珠簾寒暑止溫涼焉知有窮簷否泰迭往來禍福相依黏勿用倚彼玉自分安吾蒹飽腹日三飯蔽形衣一襜祁寒勿怨咨庶用懲無厭和南食萬先之送巨蠣百房大破饞願正炮啜間記憶前日作東平客飫啖兹味先之舉退之南食詩蠔相黏為山千百各自生之句僕方追和韓詩遂用其韻以謝海錯千萬族惟蠔不能行潮來腹自飽亦足遂厥生翻笑魚蟹蝦晨夜何營營凬味與江􅠪可以次第名薦身炮炙間殼破材始呈北客昔南食一見生怪驚故人居海濱群鮮厭庖烹酷愛此味真不假薑桂橙遙憐山間友混迹黎與騂𬞞腸久不飽肌骨尫且獰巨房餉饞腹一笑百念平豈為飲食欲實見親舊情誰知虀鹽餘盤餐味常并故鄊實堪戀未用圖西行和聽㯋師琴黃巖施生挾書來梅溪從吾弟夢齡遊以裏糧餘資易琴一張講習之暇時一弄焉季冬之朔燈火𥘉夜凬靜籟息明星燦然坐南窗之下為豫撫之豫素不曉音律妄意古人琴中之趣欣若有得聽終遂歸陋齋誦退之聽穎師琴詩掩卷慨然豫既嘉施生雅尚遂和其韻以贈七絃自相語唱豫仍和汝千指忽凄涼騷人悲戰埸大絃溫和小清越惠凬夷韻參悠揚琴瑟鳴寒泉儀儀舞鸞凰山髙水逺聽愈淡花奴羯鼓聲方強施生幽雅士不好笙與篁千金買焦尾悠然坐黎牀顧我非知音感激涕自滂三聽輒三嘆羲皇在我虀鹽腸和憶昨行示夢齡夢齡弟近感微恙情緒常若不佳豫懼其一鬱傷和也因誦退之和張十一憶昨行云無妄之災勿藥喜一善自足禳千災頭輕目朗肌骨健古劍新斸塵磨埃殃消禍散百福併從此直到耆與鮐之句以慰其懷既以又和以贈之憶昔昨少年氣鋭心未灰平明出門薄暮回解衣換酒期必醉亂花壓面欹條放年華荏苒今半世觸事往往生悲哀歡娛無復少年味勉強談笑陪尊罍飲才過量輒成疾秋霜入鬢剛腸摧子年少我氣鼎盛琅玕夜誦聲如雷胸中平時足藴藉頥神養素成嬰孩松姿柏質異蒲栁堅剛不怕霜霰漼凌雲變化未可料豈比嵲屼凬中桅胡為鬱鬱乃如許與我老者同虺隤豈緣心事未如願一念遂覺憂愁來還驚世態多險阻忤意未免生嫌猜壯懷千里力未致齟齬翻類三足能傷和伐性致坎軻兩眉蹙恨慿誰開吾聞君子貴知命數者于我何有哉又聞古人亦迍蹇在易固有無妄災閉門靜坐養時晦拂拭心鏡捐塵埃他年定作仁者夀齒背會見同鯢鮐聖賢遺訓載子腹此事寧不知所裁否往泰來固有日坦塗利轂寧須摧和燕河南府秀才送周光宗友人周光宗將參告太學某誦退之燕河南府秀才詩末章云隂凬攪短日冷雨澀不晴勉哉戒徒馭家國遲子榮以祝其行既又和以送之取古人賦詩取斷章之意云爾吾皇尚柔理北客來輸平投戈講文藝虞庠萃群英藹藹六年間人物如西京菁莪各成材龍虎巍標名東嘉號多士半作鴻都生昭然藻鑑中不負事業精先進日通顯天衢作雷轟後生益可畏行藝方蜚聲賢哉汝南丈頭角令人驚撑腸飽文史欲振三年鳴偃蹇未如志造物殊無情歸來務遵養絶意蝸角爭髙堂有慈親祿養須大烹壯懷不能已千里提短檠掉頭脫塵鞅舉翼摩太清賤子沗交末平生荷推誠𬗟懷去年春駕言共西征悠悠舊時路君今獨先行江梅弄春色愛日烘新晴勿憚行役苦會見歸來榮和答張轍寄曺夢良某與夢良遊十有五載矣栖遲偃蹇之迹𥘉不相異也兹復同舍上庠交契愈篤曹秋賦暫蹶豫春闈退飛别已期面猶未會追念疇昔泮宫之樂鄊校之遊鼓雪棹于金溪振凬葛于清逺門之外不無慨然因誦退之答張徹首章辱贈不知報我歌爾其聆首敘始識面次言後分形遂和其韻以寄之且速其肯來也戊辰季冬十六日故舊别云久話言猶未聆嵗暮念愈劇宵長夢形頻憶昔始傾蓋相看俱妙齡參乎方越席鯉也才趨庭樂泮共采藻泛江同食萍玄深探羲畫狂妄窺麟經端能辨箕荄未省分雷霆卷帙發晨架膏油燃夜櫺冨君才八斗我字識一字輕縑苦窘幅髙屋欽建瓴低頭願為愈割席終慙寧結遊指寥廓約泛航清泠驥足騁天駿鼇頭緡海腥塗逺困塵鞅棹回閣寒汀壯懷誓白水憤氣干青雲冥孤嶼散形影雙溪隔滄𬈑耿耿月遙共悠悠門獨扃論文憶李白對酒懷劉伶鄊校鼓沂瑟頌章賡魯駉濯暑振凬𬒮破寒操雪舲勝遊倣栗里雅會修蘭亭瓶罄沽甕蟻燭殘照囊螢猖狂却大雅酩酊還獨醒槐市忽飛詔英才先振翎短檠慷慨長劍磨晶熒歌舊耻雪赤壁竒功收井陘髙價壓群玉新文麗繁星鄊閭借光豔庠序資儀刑隨群𫀆暫白唾手衫當青殘生適孤苦舉足方伶俜文房泣遺澤座右悲先銘犬馬不填􅊤鳬鷖卒同涇射縞服疆箭揰鍾施寸筳惟求免埸屋詎望揚王庭師旋約奏凱案就期脫囹勢屈戰徒力命竒不文靈秋翼困燕省春苗害蟊螟日念返桑梓願言和鸞鈴溪山有偕影隱風雨無獨聽懸崖踏蒼翠怪石穿瓏玲豹間眠霧窟鳥倦棲雲屏世情自翻覆交態長芳馨歲時覺荏苒咫尺如飄零盈虧婁瞻桂開落頻觀􅕴欲去廢負米念來方祝蛉何時摻子手一笑空吾瓶注目杳雲雁緘書附原鴒鄙吝佇滌胃鈍頑資發鉶得得戒徒馭遲遲趨闕廷猶勝炙手輩奔走趍公􅈦巳巳元日讀送楊郎中賀正詩因和其韻雞日五更雞咿喔銀缸明滅燒餘脂家家呼牛逐耗鬼牛歸誰家鬼何之皇都朝會我無與西疇春事行及期弟兄成行拜親老猶勝去年身未歸人日過電山隨行有昌黎集因讀城南登髙詩遂次韻留别孫先覺臘去梅巳稀陽浮栁𥘉弄北斗新轉稍東風漸消凍為人莭固佳顧我身無用命駕訪親交肩輿勞僕從門闌念久别燈燭欣此共興來酒自斟歡至歌頻送提壼勸銜杯播榖催除葑農耕方迫歸行樂未能縱人生苦離别俗狀嗟倥偬春風桃李花把盞何時重和李花梅溪書院有李數株土寒花瘦遊人不之賞因讀退之詩平旦入西園梨花數株若矝夸中有一株李顔色慘慘以含嗟惻然有感遂和其韻春風入園林萬卉以艷爭相夸胡為此仙李顔色憔悴堪咨嗟稜稜瘦樹數點雪半醒半睡風欹斜枯枝膚剝少生意况有疥癬相孽芽不如兔葵及燕麥妍媚春色搖纎葩下自成蹊直虛語誰肯顧盻留香車顧我􅑮春少行樂老眼日有文書遮自憐衰颯巳如許那更對此愁人花皇都二月桃李盛朱輪翠蓋方紛拏東君世情亦太甚十分春在侯門花試吟怨句問蒼昊一種春工何損加白華秉燭光照夜此樹不屬孤寒家造化無言意潛告我愛萬物初無差物情稟受苦自異奚有厚薄施萌芽勸君勿為花致怨怨居易俟命思無邪和答栁栁州食蝦蟇蝦蟇水蟲也不為人害與螟蝗之類不同然周官蟈氏掌出去蛙黽以灰灑之則死説者謂蟈與耿黽尤怒鳴聒人耳故去之豫竊謂此非周公之用心必後世傳習之訛而附益其説也退之記其事于詩未免乎勸矣巳巳仲夏群居梅溪諸友頗嗜此味丐者爭捕而致之豫懼其殺物滋多和韓詩以戒蟲魚千萬族一一異狀貌飛潛同一性巨細何必校彼微水中蛙四足傴而皰自從科蚪𥘉生育在泥淖好鳴乃其性非故欲喧閙蟈氏職灑灰恐非聖人教吾聞人間世生死同夢覺殺物傷吾仁忍聽聲熚爆况我儒衣冠絃誦生鄊校彼亦呼子曰有意欲吾效諺云住近孔堂蝦蟇呼子曰故以為戲人蟲各好生奚用苦相撓退之憚食蛇得得釋籠罩子厚放鷓鴣仁心亦稍稍胡為于此蟲未盡忘嗜樂薦祠用梟穽誅虎豹古人豈妄殺去害除不孝願留兹鼓吹駐我寒溪棹梅溪先生文集卷第九
