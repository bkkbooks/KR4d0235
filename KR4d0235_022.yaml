  text: 梅溪先生後集卷第二十二
  hash: sha256:34fe5c95708c7a10a148ae9ba6edb30de451019f392cafb9bdfe89d5910537fe
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_022-1a}
body:
  text: 啓及第謝宰相地借玉階恭上萬言之對名登虎榜濫居千佛之先揣分踰涯撫躬知愧竊以奏言試功者堯舜遺意臨軒耴士者祖宗令規一新熙寧之科備見神廟之志謂三題不足發子大夫平日之藴蓄而群䇿可以陳我國家時政之闕遺著為永彛以幸多士夫何首當時之選者無切直之論遂使擬進士之對者有阿諛之譏既波蕩以相承致源流之寖失近代尤甚澆風益滋大臣多忌而動有嫌疑學者懷憤而莫伸梗概物極必變道開始公申嚴密之禁而務在令行防壅蔽之害而悉關聖覽求忠讜則丁寧有詔第髙下則寵褒有辝既當靖明不諱之朝冝得瑰偉非凡之士如某草茅賤子庠序鮿生由行藝以進升厠英髦而旅試俯慚俗學䇿無可耴之二三仰懼天威事去欲陳之五六念交淺言深猶或不可非主聖臣賢其能有容龍匪怒其嬰鱗龜偶居于前列上自親擢受知不減於孫洪言略施行悟意有踰於賈誼靜惟僥冒抑有夤緣兹蓋伏遇僕射相公以道事君無私應物蚤羽儀於法從茂著忠嘉今掌握於化鈞函圖康濟坡露封章之請益開宸聽之聰奬勵進言得裴宏中之大體深銜譏政戒李吉甫之𥚹心蓋將植太平之基豈獨為諸生之賜某敢不益堅儒業恪守官針勉來事之可為慕古人而有作不負天子惟殫精白之心碩為良臣兾奉周旋之誨過此以往未知所裁張參政綱某官厚德鎮浮宏材拔萃為一時之耆彥聳百辟之表儀明以保身揖高風於赤松子任而共政繼前列於曲江公欲振起斯文於委靡之餘遂將順其美於聽納之際陳樞密誠之某官稟純粹清明之姿冨慱洽宏深之學茂明大對擢桂林之一枝踐歷要途搏鵬程之万里夙􅈾宸眷進握兵權材兼文武而夷夏聳觀榮冠古今而縉紳景慕惟昔漸陽公之德化竊嘗聞夫子之文章方慚不肖其範模何意克傳其衣鉢楊侍郎椿某官學極群書文優四傑纚纚議論有眉山先生之流風籍籍聲稱繼關西夫子之遺懿允矣儒林之冠儀乎從橐之班承師槐市而既𬒳作成奏對楓宸而復膺推奬李侍郎琳某官模楷士流羽儀朝著分符便郡循良逺過于龔黃持橐從班儒雅同稱於班馬比膺詔綍親聀文衡革委靡而振士風進忠讜以當上意賀侍郎允中某官為世儒宗握時文柄置杜牧于髙第本崔郾之公心號李白為謫仙見季真之雅識為盛代而開公道贊吾君而求直言遂致繆庸首膺選擢劉侍郎才邵某官學校舊人文章大手仁為巳任典刑備著于老成道與時行德業兼全其久大峻班行於筆橐演詰命於絲綸主張斯文提撕後進王侍郎俁某官朝著老成士林碩望蚤𬒳知於宸扆久更踐于禁途出鎮侯藩藹黃霸循良之譽入司國計得劉晏耴豫之冝欲振起斯文於委靡之餘故將順其美於聽納之際陳侍郎康伯某官器粹圭璋學深淵海蚤著士林之望亟膺宸眷之知髙玉山恬養之風久淹琳食復𬗋槖清華之舊超冠天官欲振起斯文於委靡之餘故將順其美於聽納之際張侍郎某官學海淵深量陂宏大蚤著士林之望久膺宸眷之知居務論思豈獨得皋陶之理發明仁恕蓋能紹廷尉之平欲振起斯文於委靡之餘故將順其美於聽納之際王舍人綸某官心醉六經名先四傑詞章典雅有漢朝制誥之風衡鑑精明繼宣公考校之盛振起吾道主張斯文遂令舉首之榮濫屬宗盟之末趙舍人逵某官挺秀坤維結知天眷䇿名龍首茂騰四海之英聲執筆螭頭益厚一人之寵遇振起吾道主張斯文遂令射䇿之諛聞輒繼傳衣之盛事周舍人麟之某官巍擢異科荐更要聀黼黻河漢祠章不減卿雲羽儀天朝人物有如晉宋振起吾道主張斯文遂令蕞爾之才輒玷褒然之舉孫少卿道夫某官挺秀岷峨騰英庠序掞黼黻之文於方册藹袴𥜗之詠於蕃宣瑣闥來歸快郎星之先覩曲臺進擢仰卿月之清輝比掌文衡親承御札哲鑑獨髙於衆目狂言特薦于匹夫幸出自天恩歸無地周侍御方崇某官剛毅不回精忠自守雍容禁近簉鵷鷺而接夔龍排繫姦邪若鷹鸇之逐鳥雀比膺詔綍親聀文衡猥收狂率之言上副聖明之旨王殿院圭某官受氣剛方立朝挺正位升橫榻益揚蹇諤之風望著中臺克盡紏繩之聀力主張于公道務振起於斯文遂致妄庸叨􅈾選擢凌司諌哲某官徑特不回端方自守直言中病有王魏善諫之風奏藁屢焚無管晏暴君之失力主張於吾道務振起於斯文遂致繆庸誤膺選擢王郎中剛中某官問學淵深氣莭洪毅楓宸射䇿名切亜于龍頭蘭省懷香望獨髙於鵷序惟文柄之有屬體上心之欲求揭以平衡志不回於馮宿借之褒兖言有耴於劉蕡遂令舉首之榮濫𬒳宗盟之末孟郡王某官器粹璵璠慶傳圭組襲亜聖大才之儒雅光隆祐奕世之德勳政邁龔黃作股肱於藩郡望髙隂馬資肺腑於懿親方詔復蓬萊之逰俄榮拜瀛洲之長有光吾道將振斯文遂令搜瑣之流首𬒳甄收之列與紹興趙殿撰令詪假道治封曽快瞻於趙日效官幕府遂託芘於蘇天鳬趍有期雀躍良甚恭惟某官宗盟擢秀桂籍揚芬藴無施不可之才著所至有聲之績儒雅同於歆向德名無愧於間平將命外臺威動南閩之山嶽分符巨鎮謡興東越之袴𥜗矧茲會計之邦實號蓬萊之地俯臨禹迹仰切堯階為二浙之雄藩總七州之生齒既近而大有如此非親且賢其孰宜坐收作牧之功克壯維城之勢治優方面姑為分陜之召公心在朝廷行作相周之衛武某東嘉白屋太學鮿生慙無董相之文偶擢平津之第向來披霧識金枝玉葉之標此日望塵與緑水紅蓮之各材自慙於樗檪賜端賴於帡幪尚期國士之知庶免簡書之責窮禹穴稽山之勝竊效馬遷賦鑑湖秦望之竒碩陪元稹與邵提刑大受慎水望塵幸識𬗋芝之眉宇稽山庀聀碩登元禮之門墻行遂鳬趍預深雀躍恭惟某官道備德美材通器閎聀更中外而所至有聲節著險夷而無入不得方天子重外臺之寄以星郎揔列郡之權斡山海之藏劉晏明於耴豫聽獄訟之會不疑多所平反巳觀報政之成矧復去天之近文帝受釐宣室久有所思望之雅意本朝寧勞于外如某者簘臺末裔槐市鯫生慙無董相之文偶擢平津之第紅蓮緑水方期逺宦於秦淮手板青衫兹幸近逰於禹會昔快披雲之碩今諧執御之私從政未優何止受東諸矦之約束資身無䇿更當借部使者之吹噓答簘山宋知縣敷厠迹縉紳稔服箕裘之譽效官藩府偶同州縣之勞雲披未諧山仰彌甚某官中朝大族當代偉人世著才名喜景文之有後業傳清白得廣平之遺風暫淹万里之鵬程聊試一邦之牛刃下車未久製錦巳優願勤撫字之心益著循良之治坐見鳴琴之化無愧魯恭行膺褒德之封有同卓茂答􅌘縣丞窮居慎水未遂識韓易任稽山行將訪戴某官人材瑰異吏事優長暫淹千里之騰驤來贊一同之教化况剡溪藴秀之地二令為難以慱陵種學之賢負丞何有不待報政行􅈾美除答上虞陳縣尉損肄業賢關共十載韲鹽之苦效官藩府分一時州縣之勞結同舍之金蘭對尺書之面目披雲有自傾蓋可期某官種學淵源負才卓犖馳英聲於槐市擢榮第於桂林白面紅顔聊作神仙之隱吏金章𬗋綬行為臺閣貴人輿論所期私心尤祝答來司戶師韓厠迹縉紳雅欽髙譽效官幕府遂獲同僚未遑尺牘之修遽辱朋緘之及某官家聲素著吏學最優州縣勞人姑為阮瞻三語之掾文武有種行繼李唐四子之風靡待政成佇膺詔擢與都提舉潔伏審光𬒳宸恩榮持使莭輟握蘭之髙選臨製錦之舊逰除目𥘉頒提封交慶恭惟某官裔傳臨晉秀挺丹陽早收科第之榮屢更州縣之聀學無入而不得治所至而有聲帝謂儔若豫工姑暫勞於作匠官雖上應列宿寧久困於為郎方清朝重外臺之權以大賢膺列郡之寄后稷居播奏之聀能懋遷於有無劉晏幹山海之藏宜益知於耴豫第恐宸心之念賈佇聞詔墨之召參暫屈使軺即持從橐與安撫王閣學師心伏審光膺宸命榮殿大藩輟喉舌之近司卑股肱之重寄除音𥘉布輿論交歡恭惟某官望重三朝才髙列辟學通今古而無入不得任更中外而所至有聲進長天官帝命素優於出納屈臨方面王畿允賴於藩宣矧兹會計之邦實號蓬萊之府俯臨禹會仰切堯階為二浙之雄都揔七州之生齒既近而大有如此非勳且賢其孰冝坐收作牧之功益著惟良之績越國之人方瘠上之委任固非輕漢庭之位尚虛公之來歸其非晚某備貟幕府託芘帡幪民事未知窹寐敢忘於天語仕途𥘉筮吹噓端藉於宗工賀趙侍郎令詪伏審光奉宸命榮遷地官親賢見用於朝中外罔不相慶某官玉牒歆向朱轓趙張豈惟標凖於宗支固甚練逹於吏事使軺屢駕興南閩十好之謡符竹荐分繼劉寵一錢之譽果蒙親擢巍領二卿方國廩之未豐在版曺為尤急省用斯能足用生財莫若節財碩於論思獻納之時力陳本末源流之計贊漢文之儉德革唐室之私藏無若延齡援經誼以惑主冝同李絳不進獻以結恩要令粟腐於太倉罔使錢泄於異境主聖如此公言必從坐收耴豫之功行處弼諧之任某叨與幕府獲依大賢雖贊畫有愧古人然至室必以公事性素傷於愚直事每荷於寬容顧虞翻之榻猶存曲蒙屢下想元禮之門益峻未遂重登輒罄微誠遙馳尺牘謝王舍人剛中伏準照牒舉某自代者贊畫東州仰藉宗盟之芘判章西掖誤蒙國士之知寵過衮褒銘深肺腑竊以官居侍從則聀在薦士識挺特逹則心能盡公顧雖自代之虛文必引所知之同類歐陽持橐以器識而推吕東坡視草以文行而舉黃率由臭味之同遂有齒牙之借不事請託自膺薦揚如某者學最空踈文尤荒陋偶中楓宸之第叨為蓮幕之賔民事未知惟恐有負於天子王言是代豈期見舉於公朝望外蒙恩顔間增愧兹蓋伏遇某官學貫經史文成訓謨有江左河汾之風流如嘉祐治平之人物得用捨行藏之正氣不下於權臣當論思獻納之秋舉輒先於寒士遂令庸繆妄辱品題某敢不益勵操修無忘許與求之以文而應之以實端拜贈言勉其不逮而增其不能用酬知巳答王宫教必中備貟幕聀雅懷慕藺之誠闡教宫庠行遂識韓之碩逺勤緘翰仰佩撝謙某官望重江南群空兾北芹宫得雋實多士之宗儒棣蕚齊名皆一峕之人傑式觀介弟之器識仰見難兄之範模將儀表於天朝姑作成於宗子庶俾神明之裔陶成信厚之風答周主簿賀正行夏之時允協三陽之應履端於始光膺百福之來德荷過謙禮蒙倒置某官望隆越絶秀藴剡溪鵬躍天池偉矣周郎之年少鵉棲枳棘蔚然仇覽之才華某叨預同年獲伊巨庇賦椒花之訟獻雖後於元正占茅茹之爻亨必同於他日答慈溪姚知縣應辰昔登蕃榻雅蒙眄睞之私兹宦蠡城首辱緘封之賜俯增銘感仰偑謙沖某官操行潔修性資深厚克振箕裘之業荐更州縣之勞斯立不負丞吏寧容於摘𥿄子遊善為宰治何勞於割雞課最巳聞召擢伊邇某濫塵科第叨與幕僚顧僥幸之為多實奬提之有自報鯉書之太晚負負何言瞻鳬舄之匪遙拳拳不替與徐提刑度伏審光膺宸命榮總憲綱政巳報於江東臺復移於浙左快覩除目慶溢部封恭惟某官天賦材猷家傳事業蚤登群玉之府上應列星之纒輝棣蕚於一門結棠隂於兩郡方外臺之寄為甚重非識治之材其孰冝劉晏理財何止為管簘之亞有功治獄當逺過于張之賢暫屈使軺佇持從橐某漢庭竊第越幕備貟民事未知有負聖天子之明訓仕途𥘉筮尚期部使者之寬容答會稽錢知縣某宫家傳忠孝世襲簮纓治所至而有聲才無施而不可矧會稽之大邑實吳越之故封先王之遺愛尚存百里之良民易化况舊令尹之治方結於去思聞今大夫之賢益快於先覩靡俟報政佇膺迅除某竊第懷慙備貟亡輔幕中贊畫叨為王儉之下僚堂上鳴琴行觀單父之美化謝王安撫伏準照牒舉某應四條旨揮者楓宸射䇿濫居多士之先蓮幕效官誤玷四條之選感深肺腑愧溢面顔切以國家廣數路以耴人神聖集衆賢而共理既以進退黜陟之權卑之宰相吏部又以按察舉刺之聀委之郡守監司逮元祐之垂簾起大儒而當國舉直措枉紀綱既正於朝廷激濁揚清除目載頒於郡縣去苛侫貪懦之四害耴仁明廉直之數長議雖建於當時事始行於今日首膺兹選若難其人如某者素無技能偶竊科第贊晝雖久瞢然民事之未知忤意何多嗟爾人言之可畏恩未酬於親擢期甫及於終更退而自顧則寸無所長進欲有為則尺未嘗枉譽誰肯借况無韓子之三書薦下侍求忽拜山公之一字靜惟僥冒抑有夤緣兹蓋伏遇某官一代宗儒三朝耆德入處天官之長出居方伯之尊循良敻邁於龔黃寬厚吻同於婁郝雅意本朝而忠可見嘉猷我后而人不知建文正之祠用清白以規下行溫公之議薦賢才而報君遂致繆庸亦膺甄録某敢不益持士檢恪守官針懷惓惓畎甽之忠勵蹇蹇王臣之節就有道而正已為可用以待時朝拔一人而莫拔一人叨與耴尤之列待以國士而報以國士敢忘知巳之恩答諸暨王縣尉萬章地處甌閩叨與宗盟之末聀分州縣獲同王事之勞首辱朋緘仰欽厚德某官才髙四傑望重三珠騰槐市之英聲擢桂枝之髙選東州筮仕暫宣綵棒之威當寧急賢行應𬗋泥之詔某備員亡輔竊食懷慙泛緑水而依蓮倦遊儉幕具扁舟而把釣欣遇梅仙答邵縣尉謝解戰藝漕臺登名天府巍中有司之選仰欽所業之精縉紳聳觀縫掖歆慕某官群空兾北風繼召南試混諸生不作衛公之耻材優萬中果騰張鷟之聲冨貴殆將逼人科第何足慁子佇從仙吏徑到蓬山某叨與同僚獲觀盛事都騎顧我端繇臭味之同長箋拜嘉輒講報投之好答陸解元謝解洙得雋文埸登名天府巍亞褒然之舉仰欽卓爾之才鄊詳甚休言論無異解元雲間馳譽筆下有神明疏通知逺之經工篆刻雕蟲之技處囊脫頴何止定平原之從射䇿決科行將擢公孫之第某備數幕客獲觀薦書竊喜東州之有人預期南省之得士答髙解元謝解遊翰墨之場俊同子美登賢能之籍名繼牧之有司甚明士論無異解元家聲韓魯經學羲文手劒登壇作平原定從之客筆鋒鏖戰繼澶淵却敵之風鼓勇春闈唾手巍第答諸葛解元謝解遊翰墨場雅負少陵之志登賢能籍兼聮少阮之名鄊評甚休士論無異解元譽檀文虎風傳臥龍明溫柔敦厚之經工篆刻雕蟲之技處囊脫頴何止定平原之從射䇿決科行將擢公孫之第答周主簿賀冬日遵南陸君子之道大亨律應黃鍾天地之心可見肇迎長景榮邦短箋某官學不止於決科材已優於為政鵉鳯棲枳棘暫淹州縣之勞雕鶚在秋天行赴功名之會顧一陽之𥘉復茂百福以來綏某托芘同年竊祿仙里登觀臺而望方執筆以書雲懷剡溪之人欲拏舟而興雪答孫通判觀喬木而思世臣雅欽偉望泛紅蓮而遊幕府叨與下僚第去官之匪遙恨事賢之太晚朋緘下拜謙德有光某官挺生相門妙有家學興公之才名冠世親得其傳叔敖之隂德在人固冝有後先正亡而象賢在權臣死而公道行冝相繼於鳯池寧久淹於驥足佇自别乘榮躋要途某竊第懷慙效官無輔贊南陽洪農之畫有愧范岑賦監湖秦望之竒碩陪元竇除館聀謝宰相右某蒙恩授前件聀者泛幕府芙蕖之水吏責幸逃登道家蓬萊之山恩光誤及俯慙諛學濫與英躔竊以地號西崑象符東壁兩京事實石渠天祿東觀皆其名一代人才劉向揚雄班固為之傑逮我有國尤清此途名兼三館之崇事異群司之比書藏延閣冨不減於開元人到瀛洲榮愈加於正觀有下筆如神之士無上車不落之流器業於是乎成公卿多自兹出雖曰文行素著科目最髙必俟大臣之薦論斯用故事而召試力可求而得者則禁其私請書不程而命者蓋出於異恩韓魏王奮自甲科猶薦而後召蘇內相擢繇制舉亦試而後除孰謂不才乃叨殊選伏念某性資愚鈍術業空踈避三舍於廣場屢焚筆硯終一星於太學始脫虀鹽瞻天顔咫尺之威借玉階方寸之地𥘉乏茂明之對偶膺親擢之榮誦言豈逮於劉蕡試吏僅同於簘傳固嘗效太史之探穴然未若中郎之得書期方幸于及瓜言旋枽梓坐靡容於暖席遽奉絲綸脕迹諸侯之賔觀先群玉之府識曷堪於是正誚寧免於何如曽三威七穆之未知豈八索九丘之能讀堅其所守而巳佩聖訓而不忘非爾其誰居之拜王言而增愧兹蓋伏遇國史㒒射相公事業稷卨文章訓謨寅亮天地弼豫一人端能得宰相之體旁招俊乂列于庶位將以立太平之基好賢每過於緇衣下士罔遺於白屋况內以國本未足之為念外以敵情不測之是憂陽非衆則曷能勝隂文不修則何以濟武神聖以安危注意社稷之輕重繫公無兢維人大亨以養一舉得垂天之翼兼收耴敗鼓之皮謂昔嘗溷於文衡故今復歸於化冶某敢不藝披蠹簡燭照神藜讀黃香未見之書覬聞大道行宣公不負之學願事聖君過此以還未知所措陳右相志存社稷身任股肱宰相以鎮撫四夷莫豫敢侮丈夫當掃除天下舍公其誰謂事君莫如以人故在上必引其類王樞密有仁者之勇以直道而行幾微不見於面顔精神折衝於樽爼忠義有激太山井一擲之輕議論所加敝帚增千金之重葉樞密養以剛大動惟直方正色霜臺嘗落李祐之膽決勝籌幄必寢淮南之謀謂事君莫如以人故在上必引其類答梁狀元漢延多士䇿董相以天人閩産異才榜歐陽於龍虎雋聲籍甚輿論翕然伏惟狀元譽重泉南群空兾北鄊薦屢居於前列士流咸伏其下風繇蘭省以巍登造楓庭而旅試論列歷代則深明治體條陳三弊則咸切時冝有司第其文置在三人之列天子異其對擢先萬國之英冨貴行將逼人科第固巳慁子願行所學以報吾君某切與周廬獲觀大對偉朝孫之盛事屬灝固之名家第欣首聽於傳臚詎敢妄論於衣鉢都騎顧我端繇臭味之同長箋拜嘉輒講報投之好答許狀元克昌欽雅望於月評簮纓世襲冠雄文於䇿士衣鉢家傳輿論翕然雋聲籍甚伏惟狀元種學良苦摘詞最工試屢混於諸生不作衛公之恥文四舉於禮部始成韓子之名建茲旅奏於廣廷果能展盡其底藴問當今之務則固悉陳其大體論歷代之治則以為無所容心故事有拘雖屈居於王後大名巳著其誰能與許爭行所學以事君踐斯言而正巳佇從仙吏徑到蓬山某備員殿廬欽閲廷對竊喜鴻臚之唱首傳太嶽之孫慶熙朝之得人辱都騎之顧我銘感謙德嘉臭水之相同珍藏盛文之瓊瑶之足報答丁狀元時發廣廷待問竊喜朝陽之鳯鳴平地登仙咸羡遼東之鶴化輿論甚美斯文有光伏惟狀元挺秀海陵蜚聲天闕文掃科舉之習言懷甽畝之忠以元氣之盛衰喻國體之治亂論一國一代一時之政有寢明寢昌寢微之風如使生漢文之時諸老其孰先賈誼假令居李唐之世有司必不第劉蕡因吾子之敢言見清朝之不諱碩攄素藴以事聖君某叨與周廬欽閲大對喜皇朝之得士知天下之有人聽臚唱之傳增縉紳之氣都騎顧我譬草木臭味之同長箋拜嘉乏瓊玖報投之好答南劍州王守備貟册府誤叨佐撰之榮託庇宗盟重拜朋緘之貺俯慙僥冒仰佩謙沖某太學鯫生東嘉冷族折蟾宫之桂濫厠薦紳泛幕府之蓮獲事君子幸逃罪戾荐𬒳寵光燭照神藜與英躔之末選書紬金匱專史筆以何堪拜命若驚蒙恩有自某官家傳政學天賦材猷半刺東州聊展騏驥之足一麾南郡行歸鴛鷺之行不棄故僚曲加厚禮對尺書之面目如見德容望千里之門墻莫伸謝臆答溫州詹通判堯可歡騰梓里共稱半刺之賢祿竊蓬山遽拜朋緘之貺俯懷愧懼仰佩謙沖某官秀挺玉山望隆渤海訓早聞於詩禮業不墜於箕裘先正言居宣政之間凛聞風采賢别乘二濠溫之郡蔚有聲名𥘉登戲彩之堂首贊褰帷之治龐士元騎驥之足庸能久淹謝康樂山水之州固已改觀况聖君懷故國之喬木而太史有封事之甘棠必起象賢以慰輿論某東嘉冷族西觀小官喜父毋之邦得神明之吏對尺書之面目如見德空望千里之門墻莫伸賀臆答樂清徐令森牛刀再鼓鳬舄遙臨喜子晉之江山得偃王之苗裔首拜朋緘之貺仰知謙德之光某官天賦吏材家傳政術倦遊仕路飽諳閩浙之風荐綰銅章盡得溫台之地况此樂成之小邑有同臨海之近州吏苟非賢人亦好訟允賴循良之治痛懲貪鄙之餘覩已爭先來何太暮某蒙恩輔外需次還鄉幸父母之邦得神明之吏見書中之面目巳得其人聽堂上之絃歌碩觀其政答曽知郡汪竊第奉常雅資慱約備貟册府端藉吹噓敬觀褒借之詞仰佩謙光之德某官心傳一貫名繼三曽學探天人庸止文章之冨才冝臺閣詎容州縣之淹昔遊宦於樂成最留心於鄊校經橫絳帳躬率諸生遂能於數載之間翕然變百里之俗弦歌滿邑化端自於言遊龍虎成名功實歸於常衮遂令愚繆亦與作成某敢不益勵操修用酬知遇對尺書之面目如際髙標詠雙桂之篇章寧忘盛德與梁司諫伏審光膺親擢榮陟諫垣方朝廷多事之秋承風俗積弊之後內有群隂之壅蔽外有強敵之慿陵當言者不言而惡人之言巳嘗斤立仗之馬今日乃何日而不鑒昔日其可忘覆轍之車兹幸正人進當言路固冝犯顔而首論大事毋用削藳而務為小忠天子以為是諫官以為非言嘗聞於前輩君子有所恃小人有所畏人皆望於明公庶幾無愧古者之七人斯能上繼先朝之四諫某受知有素贊喜尤深輒獻狂瞽之言以為蹇諤之助答賀封贈色慘松楸思親不見恩露泉壤拜命增悲愧謝臆之未攄辱賀箋之先及其為感激罔罄敷宣答樂清洪縣丞藏詠南國之甘棠久思召伯對藍田之巨竹喜見崔丞朋緘寵貽謙德加厚某官心傳家學天賦吏材挺挺有祖風翩翩佳公子先尚書承流宣化遺愛猶存賢二令種學積文負丞何有贊一同之教化繼八座之箕裘靡待政成郎膺詔擢某鄊評下士祠祿冗官喜父毋之邦得神明之吏視印未久巳驚鳬鷺之行掃門有期一快鳯星之覩與張侍郎闌伏審光膺宸命榮二冬官恃帝幄以橫經極儒臣之髙選恭惟某官抱器逺大稟資直方昔遊册府而讀異書首忤權臣而歸故里二十年不調節尤著于固窮五百歲相逢力蓋繇於稽古燕公乃東宫之舊晉侯為帝者之師碩於論思獻納之時力贊剛明果斷之主登衆賢而開治表慰四海之想中興此多士所望於公非小子敢私其貺倚須大拜式慰輿情答新昌李縣丞結聞諸公交譽碩登元禮之門見千里尺書巳識泰和之面第朋緘之禮太厚致下拜之容有慙仰佩謙謙俯懷栗栗某官元精華胄河洛名家摘光豔於唐翰林文固有種探淵源於周天下學豈無傳蚤工五色之詞冝繼入磚之譽戰則必克恥混試於諸生丞雖負于帥二令於一邑雅負經綸之業豈淹州縣之勞佇自松􅈦徑躋蘭省某方竊祠廩誤膺郡章退惟僥冒之餘諒自吹噓之素登會稽而觀禹穴雖歲月之不同夢春草而思謝池顧精神之巳接梅溪先生後集卷第二十二
