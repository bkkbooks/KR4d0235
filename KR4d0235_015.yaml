body:
  text: 詩七月十七日離夔州是夜宿瞿唐邦人送别亦傷情楊柳隂中涕泣聲我亦憐夔不忍去一宵晉宿舊江城至東屯謁少陵祠宦遊夔子兩經年未到東屯意慊然端為先生舊吟處不應容易上詩篇忠不忘君句有神當時無地可容身草堂遺像英靈在又見匙翻雪稻新東屯溪山之勝似吾家左原東屯别是一山川水秀山青似左原我待還家築茅屋作詩招取少陵魂登古峯嶺望夔州巍登古峯嶺回首望夔州隱約瞻卧龍微茫見江流明朝望眼遮江山見無由翻令還鄊夢飛過白鹽頭不知此邦人亦念使君不使君無可念空有詩篇晉右峯驛小飲老去最惜别同僚情更鍾三杯古峯驛添我别情濃燕子坡燕子歸期近吾今亦得歸烏栖一枝穩何必更髙飛坡南隔江有烏飛岩悼巫山趙宰使者追求急君方歸意濃讒言端可畏鬼物不相容浮世誰無死良醫未易逢我來經舊館㳅涕覺無從巫峽三峽江流七月平全家東下葉舟輕陽臺得得收雲雨放盡峯巒照眼明峽中七月行舟斷我丈孤忠盡室行寄語後人宜自戒莫因幸免遂輕生正是瞿唐莫下時却將行止問舟師老夫也是歸心急不記前吟灔澦詩神女廟功開神禹言何妄夢惱襄王事亦非峯下祠荒少人到峽中舟過有烏飛每舟過有烏自峯飛下舟人擲餅餌與之銜去復來昭君村十二巫峯下明妃生處村至今粗醜女灼面亦成痕按啚經昭君村在歸州興山縣而巫山亦有之在十二峯之南神女廟下未知孰是杜少陵詩云若道巫山女粗醜安得此有昭君村劉夢得竹枝詞云昭君村中多女伴永安宫外踏青回則在巫山者是過大拽大拽今重過江山記我無雲開列嶂秀石峙一峯孤吏卒送迎異舟車來往殊往歲遵陸今以舟行鴻晉泥上迹飛去到江湖石門先主為陸遜所敗白此門而脫兵忿雖云敗君臣義有餘石門能脫急風義亦堪書謁清烈廟登獨醒亭我醉亦如衆亭慙登獨醒惟知慕清節首為繪儀形夔府十賢堂以清烈為首黃牛峽白狗黃牛竹節灘竒竒怪怪幾峯巒山川好處造化惜不許人間平地看黃牛廟我從白帝城舟次黃牛峽黃牛遺廟存石馬隻耳缺宛如歐公夢地靈亦竒絶固宜鎮大川千載食常血何人讃巨力曽不紀功烈神乎豈求食挽石駭舟楫事見張天覺贊或云土勝水兹亦強牽合事見廟記白帝將何云吾為究其説神禹昔治水疏鑿九州别百神各放職僚佐力俱竭功成禹化熊塗山亦為石譬如穆南征化者想非一有化為牛者斷崖留遺迹豈亦黃帝餘與牛同一色至今名此峽援溺有隂力淫祠自其俗神手本正直爵以保安侯足以章神德紹興間封保安侯蝦蟆碚水亦日蝦蟆背蝦蟆好居水背水以自濡不知背上味乃與衆水殊品第髙水經煎茶必來須爭汲以致逺不憚險且迃我亦走瓶罌一甌瀹雲腴所恨太遐僻親朋莫能呼巨蛙如有靈曷不上天衢以水為雨露助天澤寰區坎視峽中小笑渠子陽愚石漁翁釣利釣名者紛紛三峽中何人化為石又作釣魚翁至喜亭前年泊舟至喜亭舍舟觸霧登山行身到猿啼虎嘨處至今魂夢中宵驚兩年寒暑山裏瘴癘侵凌身不死七月歸舟浮漲江重見兹亭實堪喜世間憂喜無定形此喜本從憂得名須知既濟有未濟勿謂江流今已平又一絶歸客來登至喜亭喜歸兼喜峽江平當時作記文章伯不止文章得美名郭道山學道無成藝有成青山猶以道為名匆匆不及登山看歸看家山白鹿城永嘉城號白鹿有郭公山亦以景純得名宿灌口拂曉出楚塞中流望荆門江隨銅柱轉舟遇􅍑牙奔鳥度天闊魚翻秋水渾冝都轉盻過夜宿舊江村南崔乃松滋縣江陵舟中作夢裏身曽到永安孤城絶塞俯驚湍東歸𥘉喜楚天濶西望堪嗟蜀道難艷澦堆邊巳陳迹水晶宫裏又粗官帝鄉咫尺家鄉近臣子憂心亦小心查元章自成都走書至江陵并貺蜀箋附子芝蘭道山舊邂逅夔江邉會合止半載别離又經年君猶滯使軺我忽移霅川東歸不及見西望心悠然尺書走健卒追上江陵船殷勤贈逺意藥百𥿄以千我老苦多病得藥年可延靜思苦口味奚止沉痾痊但非造樓手誤辱文房箋待將君詩文傳寫千萬篇書言作二記付與夔人鐫捍波記修壘濟渴記義泉深慙郡政謬濫託雄文傳君才髙輩流君譽藹民編雅志在活人何心肯㳅錢當寧正念賈諸公咸薦賢定歸玉筍班慷慨旒扆前所陳必堯舜那肯談武宣早趣舍人裝行著祖生鞭我冠儻未挂苕溪遲言旋離沙市天色變舟人懼風作少憩公安而行默禱有應解任古夔國移官白蘋洲三峽雖幸免大江尚堪憂黎明霧四塞篙師請停舟爾禱於公安公安有二聖寺舟人過必禱之吾禱學孔丘愷悌以為治潔廉以自修神乎苟聽之庶不為神羞須臾日光漏江淨煙靄收碩如吾祖言千里俱安㳅望石首山江山遙望疑若無隱隱漸露山規摹化工作山首安石不著草木為肌膚吾鄉石首黃金色五年不見深思憶山頭有石名偶同長鋏空彈不堪食巴夔之山厭太多荆江其奈無山何舟中遙遙望石首一點亦足供吟哦艤舟亦向劉郎洑應是劉郎招我宿劉郎如問舊江山永安宫草年年緑是夜宿劉郎洑地以劉元德得名過三沱舟從三峽過三沱柳岸人家轉盻過莫惜殷勤問舟子江邊好處亦無多塔子山巳過魯家洑猶瞻石首山水隨江繚繞山逐岸回環雨泊蘆洲畔舟行晚照間貪看洞庭好不作沌中還魯家洑江頭煙樹色如故記得向來舟出時更讀西行舊詩集集中多是沌中詩宿人老灣衮衮長江水悠悠歸去船片雲南岸雨明月别州天犬為客驚盜蚊令人廢眠江灣號人老驚我鬢皤然是夕大吠疑有盜舟人驚起終夕不寐烏沙鎮避風風避烏沙鎮心懷白帝城峽中險巳過江上浪宜平維舟嶽陽之西岸徐師汊風作不敢行再留一宿用韓昌黎洞庭阻風韻示同行朱仲文張子是月行南箕口簸揚不肯休我至洞庭側狂瀾阻行舟東望嶽陽城一葦宿可投吾𣣔破巨浪試呼舟子謀舟子笑謂我官豈乘浮丘同行一二官好勇豈仲由君子不行險少遲勿煩啾明朝風自定鼓枻無憂愁汗顔答舟子汝語非謬悠書以示同欲速不可求望洞庭端居灔澦兩經年不戒瞿唐七月船得得遙從洞庭過要看湖漲水中天賈嶽州以豫阻風致酒肉之贈軒皇張樂洞庭旁掀舞魚龍撼嶽陽巵酒豚肩使君意知豫肉味能忘魚蝦買得巴陵金鯽魚又逢公子奮長須夜來江山秋風起報道吳兒已鱠鱸𥘉欲維舟嶽陽樓下適風作遂泊南津嶽陽樓下風波惡過客舟行不容泊遙從湖口入南津看盡湖山與城郭樓閣峥嶸照眼明君山當面如蓬瀛雄文誰繼范文正妙曲亦無滕子京嶽陽樓後樂先憂記飽觀兹樓今始得慿欄吐吞五水波濤濶出納三光境界寬黃帝樂聲喧廣宙湘君山影侵晴瀾冮山何獨助張説收拾清上筆端洞庭湖江山好處未經眼人道嶽陽天下無入筆波瀾自今闊胸中巳有洞庭湖維舟便上嶽陽樓風定波瀾萬頃秋聞説洞庭通震澤水應先我到蘋洲讀嶽陽樓記先憂後樂范文正此志此言髙孟軻睱日登臨固宜樂其如天下有憂何君山恃險三苗此為國不知諸夏有華勳兩階干羽七旬後從此湖山方有君祖龍遷怒色曽頳帝子有靈山更青湖水如天冬亦涸此君榮落一般形南津淑濟廟越國曹娥孝可書惜無同氣與之俱武陵今有賢兒女弟似靈均娣女須過仙亭此處神仙幾度經老松枯朽稚松青如今想作天仙去不復飛吟過洞庭解舟遇風暫泊嶽陽城下正對君山入湖𥘉訝君山逺無翼可隨鷗鷺群繫纜中流忽相對江湖心亦不忘君嶽陽城下岸赤色亦呼赤壁嶽陽樓下有赤壁照耀洞庭煙水東鄂渚巴陵土多赭周郎何處破曹公君山形如龍南有一小山如龜洞庭湖山山絶竒大山如龍小如龜弄珠曳尾自遊戲不肯吹浪如蛟螭嶽陽樓前鐡為械古人欲斷蛟螭害蛟螭為害甚巴蛇遺冡猶存足為戒七百里湖涵太虛春夏漲溢秋冬枯惟有龜龍長自在不知幾見桑田改燕公樓燕公郡事睱詩興滿滄波粉飾開元治江山為助多道人磯江中雙石如弟兄呼得道人為友生秋夜扁舟泊磯下洞庭湖近月華明道人身名兩俱稿道其所道非吾道橫江兩石作釣磯不似嚴陵臺上好泊潛江甲屬玉沙縣潛江甲口楚天涯蘆荻舟中一兩家呼酒敕厨無一味天鵝亂眼似楊花舟遇􅊇風破浪賦詩風撼楚江水雲橫鄂渚天支頥看山色破浪出詩篇門掩瀕江舍帆揚上水船江神不借便歸興自飄然舟中覽鏡來往成何事霜毛滿鬢多洋洋大江水東去欲如何過嘉魚縣有山名魚嶽舟過嘉魚縣買魚人道無青山不堪煮彈鋏看銅符宿通濟口沌水從兹入中藏寂寞鄊相逢如故舊為我濟歸航百人磯歸從三峽水重見百人磯山色只如舊挽舟人已非南浦江淹送客傷心處万里人從蜀道來栁已三畨見秋色蕭蕭雙鬢若何哉南樓江漢西來於此會朝宗東去不須分銀濤遙帶岷峨雪煙渚高連巫峽雲鸚鵡洲悲狂處士蛟龍池化故將軍登臨長碩如今日塵靜元規楚不氛解舟凬猶未息暫止江口狂飊未息浪峥嶸江口停舟不敢行自是吾儕畏行險前頭波浪有舟橫泊舟漢口稍稍風波定悠悠舟楫移身雖到漢口家尚在天涯大别思大禹古峯懷古夔前月是日離夔州山城有廖廓歸説是吾兒聞詩聞禮同朱仲文張子是諸公逰漢陽郡圃言有廖廓臺東望鄂渚山川城郭盡在目中黃鶴樓雲鎖吕公洞月明黃鶴樓抱關非故卒誰見羽衣遊七磯江上風波惡江中洲渚多回頭三峽逺轉盻七磯過黃州弭棹大江濱江山入眼新地疑真赤壁州是古黃人水隔三分國武昌在南岸吳故都也風遺兩逐臣王元之蘇東坡雪堂欣覿靣詩思定能神遊東坡十一絶道大才髙丗不容堪嗟尺水困神龍空遊赤壁英姿發郤向小橋詩思濃出處平生慕樂天東坡名自樂天傳文章均得江山助但覺前賢畏後賢忠州東坡以樂天得名少年下筆已如神文到黃州更絶塵我宋人才盛元祐玉堂人是雪堂人丗重元之重竹樓雪堂名更重黃州西山草木尤光彩一一曽經杖屨遊江繞山城栁暗村五年詩亂謫仙魂欲尋遺老問前事楚語兒童今不存再閏黃州正坐詩詩因遷謫更瑰竒讀公赤壁詞并賦如見周郎破賊時供成詩案脫纍囚天遣公來此地遊自有胸中雲夢澤更居雲夢澤南州三等䇿成名烜赫萬言書就迹危疑易書論語忘憂患天下三經字説時口誦淵明歸去詞岷峨歸去竟無欺髙安難弟來相訪細説對床風雨時批風抹月五經年吟盡淮南盡處天獨與元之韓魏國神交千古作三賢向來茅屋僅容身今日祠堂髙更新費盡丹青傳不得靈臺一點與精神至九江陪林守黃中登庾樓出示舊詩萬里相望牛馬風兹樓邂逅一尊同煙生燕寢香爐上黿在賓筵食指中樓之北岸有黿壳州舟入滄波詠蘋白飲陪文字勝裙紅飛黃騰踏日邊去回首群驚冀北空黃中赴召喻叔竒自番陽來以詩見贈次韻以酬家居雁宕芙蓉側身自瞿塘灔澦回覽盡江山歸路逺舞翻烏鵲故人來舟至富川烏鵲滿檣次日九江與叔竒遇詩吟夔子相思句酒飲番昜未盡杯種學績文冝館閣二松那復久淹徊琵琶亭繫舟琵琶秋水深夜靜不聞琵琶音往來多少啇婦怨丗無司馬誰沾巾過彭澤萬里歸舟巨浪間只將青眼對青山青山好處惟彭澤出岫雲歸倦鳥還馬當山此地水如峽有山名馬當猶疑是灔澦更合戒舟航那剎石一曰那查七月下三巴孤舟近九華魂猶驚灔澦石更見那查池之清溪如杭之西湖某歸自三峽維舟㺯水亭南望齊山翠微在眼登譙樓望九華見一峯竒甚呈提舉李子長知郡趙富文城南風物似西湖萬里歸舟入畫圖光潔貯懷便㺯水翠微照眼稱提壷浦無時節秋尤好池有精神貴可呼最是九華知客意倚天遙露一峯孤子長和詩復酬二首往歲遙從彭蠡湖常山地閲武侯啚忽乘雪裏子猷棹欣對花間太白壷雁宕寄書知有便天台采藥定相呼兩翁異日為鄰舍笑説江山大小孤君往東湖我左湖田園歸去亦良圖縱如傅説妙調鼎終羡淵明髙引壷清峭臺中各陳迹翠微亭上偶歡呼江東浙右從今後永夜月同千里孤冨文和詩復用前韻四上祠章郡得湖真同起廢躄浮圖路經秋浦人如玉洞入齊山天在壷人物宜居國士選吏民聊作使君呼還鄊説與賈君子官比廣昌風更孤賈君元範永嘉賢者與冨文同官廣昌每稱其為人子長招逰齊山路經秋浦上崔嵬不負孤舟萬里回峯比九華微具體山中有石洞疑三竺逺飛來勝窮岩石冷瓏地秀吸江湖浩渺杯先却𬗋微期一月菊花未放桂花開富文贈桂花夔有百花無此香夔州無桂花兩年官舍負秋光使君元是蟾宫客贈我數枝金粟黃泛清溪淸者未必貴貴者或不清胡為貴池內却有清溪名清貴兩俱足造物如有情溪有夷屈風池非趙孟榮三秋冷浸月十里光涵城真可㺯茲水更堪濯吾纓天亦知我意故令居水精水精豈吾居龍湫老餘生滿壁晝清溪坐覺名利輕子長見示汪樞密遊齊山詩因次其韻莫莫休休秪欲間貴池誤照野人顔好詩如見元樞靣佳境仍逢相國山山因齊映得名談笑從容禪榻畔翠微髣佛夢魂間吾儕相勉崇名節峴首風流庶可攀李鹽題跋用羊祜事富文送鹿肉太尉前軍得活鹿全用來簡七字使君殷勤分我肉定知應是秦失餘苗裔仍為丗人逐使君好客今平原秋浦樓頭羅水陸青州從事嘉屢拜白鹿山人賜新沐社風留客去未得清溪山頭兩經宿頻將口腹溷使君大嚼戲吟詩一幅朱仲文和詩用齊山韻以酬蜀山同我上崔嵬峽水相隨共載回秋月迎人霅川去義風吹客浙江來山遊未盡無窮力酒興應嫌有限杯準擬吳中作重九菊花休道不須開子長和詩并餽飲食再用泛清溪韻秋浦天作秋清溪風更清三宿不忍去山以齊為名天台李御史傾蓋即鍾情憐我峽中歸笑談洗枯榮携壷上翠微舉首望赤城相期老岩壑便欲遺簮纓贈我十首詩字字工且精從今似杜老對酒懷李生何當細論文萬戶侯可輕溪口阻風寄子長冨文風知主人意吹浪留客舟客子念行役形留心不留回望月峽月夔州有月峽月坐悲秋浦秋從今懷人夢飛繞清溪樓子長和汪樞齊山詩復用前韻腐儒無用分投間吳蜀分符秪強顔去訪少踜三峽水來尋太白九華山小舟載酒清溪口健卒傳詩白浪間風伯相留作吟社碩低筆力許追攀池陽阻風留十日舟楫何濡滯秋深風未西五旬從白帝十日尚清溪胸次澤吞楚眼中山見齊主人殊未厭壷榼屢提携子長携具至溪口復用前韻有客雙蓬鬢歸從灔澦西符分三竹使地見兩梅溪舟行梅溪豫家亦有梅溪舟遇先逢李杯行酒到齊他年石橋路歸去手應携寄林黃中時黃中泊舟貴池口豫泊清溪口東西相去十里郎星夜照貴池口漸見祥光燭斗牛甘棠遺愛留潯陽盡道前無此太守我亦弭楫清溪灘秋風吹浪髙于山與君相去才咫尺形影隔絶煙波間晨起揚帆欲東去風伯江神兩俱怒吾㑪行止端由天天氣未佳聊且住望舒山舟阻清溪十日風旅懷秋思渺無窮開編細讀舒王句一點舒山在眼中留復州贈舒王絶句一集舟中觀之出清溪歸舟十日阻池陽風伯相留意亦良長喙參軍𥘉薦熟無腸公子正輸芒齊山却向江南好秋浦尤于社後涼明日解維苕霅去夢魂猶在水雲鄊舟至梅根子長寄詩復用前韻使節淹江左魚符換浙西詩筒猶在道客棹已移溪戒險疑浮峽行徐類去齊壷觴更何日重向翠微携淮山淮山無數不知名山色遙看點點青二百餘年仁草木莫令汚染犬羊腥九華山豫過池陽登郡樓望九華僅見一峯舟出清溪始見之然猶滅沒於雲霧之間晚泊梅根浦方了了見諸峯也朱仲文謂不可無詩因作九絶九芙蓉自九天來太史南遊山未開仙境曽經謫仙眼佳名傑句兩崔嵬舟出清溪尚逆風觀山却得少從容浮雲不礙天邉眼放出神仙八九峯我在芙蓉山下家四年秋色隔天涯如今漸覺鄊山近巳見芙蓉吐九峯江南一嶽占青陽多少神仙此地藏聞説仙翁搗藥處鳥聲依舊克丁當山中有鳥啼聲曰克丁當時人呼為葛仙翁㨶藥處九華山下化成寺太白書堂髙處開想見江山無此境故宜頭白懶歸來峯巒列峙神仙境子母相依孝義山莫向山中摘花果惜春啼鳥怒人攀春景人或登有啼鳥曰莫摘花果人或違之万鼓進羣飛厲聲而啼郡樓𥘉見一竒峯深恐煙霞無路通神毋遙遙將九子總將山色到舟中曽見齊山小九華夢遊縹眇羽人家靈山面目忽相見舟繫梅根秋日斜曰華曰子數俱九細看峯巒何許多今古畫工圖不足冠卿詩奈九華何唐蕭建以詩寄費處士冠卿云見説九峯峯下寺曰宫尤在下方開其中幽境客難到請為詩中啚畫來冠卿答以二十韻銅陵阻風兩年官絶塞萬里下瞿唐秋浦浪方息銅陵風又狂五松人憶白雙竹句思黃五松山李太白讀書處有魯直雙墨竹詩今亡矣今夜舟中月中秋何處光江入銅陵縣舟藏蘆葦間郵亭危壓浦佛屋陋依山月出烏將繞風髙雁欲還江山不貧處一覽見塵寰山有冨覽亭黃池對月十五日白帝去年月黃池今夜看風將清玉宇雲不礙金盆明鏡飛邉逺霓裳舞處寒論文一尊酒欣對舊同官是夕館豫方大圭秀才家月明甚與米仲文張子是王康侯錢正叔同飲宣城道中聞雁蟬噪景如夏鳥鳴山似春數聲雲外過却是雁來賓宿新豐驛小驛數椽屋夜深風雨中鄰家有雞犬不是漢新豐塗中遇雨江流渺渺風吹浪驛路迢迢雨作泥好把金章換簑笠故山深處把鋤犁過宛陵陪汪樞密登雙溪閣疊嶂樓遊髙齋望敬亭山誦謝元暉李太白詩用樞公遊齊山韻天將大任未容間清峭依然御史顔謝客能吟練江句謫仙不厭敬亭山雙溪風月壷觴裏疊嶂煙霞几案間天下蒼生望公起歸轅行見郡人攀離宣城天色隂晦望群山不見樞公和詩見寄復用前韻聖恩猶未許投間遙訪蘋洲栁與顔羿婦解將風送月麻姑莫遣雨遮山心遊孤嶼題詩處名玷元樞薦墨間汪嘗薦九人某與焉旦夕公歸首台鼎髙齋遺躅倘容攀過麻姑山出郭群山四望無故將詩句禱麻姑忽然雲破山開靣天色如春有鳥呼宿紅林驛遇交代王給事路入紅林林未紅相逢俱是白頭翁郵亭燈火一尊酒明日君西我向東廣德途中觀刈稻田父欣相語今年幸有秋深憂水後爛急向雨餘收穗盡穴移鼠畦空童放牛何當速歸去吾亦有西疇祠山秋風吹客過祠山水出平原礙往還呼吸雨暘神有力掃除雲霧見天顔桐川三絶遇太學三友歸從三峽過三峯益友三人忽此逢行李稽留三日雨天教我輩得從容驛中阻雨浸淫秋雨阻桐川無術那能輔漏天傳舍終宵不成寐點燈重讀舊詩萹文籍遭水文書隨我下瞿唐準擬家添萬卷藏水厄那知在平地從今既濟要須防九月一日自道場山如臨安周德載夏廷茂自菁村乘舟來訪既別寄以小詩二十年前舊友生扁州來訪見交情相看容鬢俱非昔記得爐亭笑語聲待對仙林九日登佛閣時寄家道場山思丢年遊卧龍山遂用舊韻浮家東下路間關地近家鄊尚未還風雨滿城欣巳過星霜入鬢早宜間去年嘉客同吹帽今日仙林獨侍班遍插茱茰憶兄弟更添北望道埸山梅溪先生後集卷第十五梅溪先生文集卷第十五䇿問問六經皆經聖人之手其大法尤著於始終之際樂亡於秦禮廢於漢姑勿論焉可也詩書昜春秋首未具存其可以不知耶詩三百文王之詩非不多也何以首於關雎頌有三莫先於商莫後於魯也何以終於商頌三皇五帝皆聖人也非無言道之書何以獨取於堯而以之首五霸皆賢君也非無命誓之文何以獨取於秦而以之終三昜所始義各不同周昜何以先乾而異乎連山歸藏之法六十四卦法相受也何以不終於既濟而終於未濟之時春秋之作在平王世也不始於孝惠二公而始於隱豈果以其遜國之賢乎二百四十二載皆編四時以成年也而終於哀十四之春豈果在于木絶火王乎論語者六藝之唯襟也始於學而終於堯曰其義安在孟子七篇擬聖而作者也始於梁惠終於盡心又豈無説耶夫紬金匱石書之書者良史之才也終於獲麟猶有其旨作凌煙畫像之贊者文士之筆也始於河間亦有所法况六經之嚴而語孟之奧乎碩與諸君究其所以然勿云議論安敢到而略之也問自古帝王所以敦厚風俗者必以儉德為本而每以身率之禹惡衣服以率夏文王卑服以率周文帝身衣弋綈以率漢是三君皆古之大聖賢均以儉德先天下為風俗者也禹尚儉而天下以儉應之故夏之世其所尚者皆忠質文王尚儉而天下以儉應之故當時在位者皆有羔羊之德焉至於文帝尚儉不下禹文王而天下應之者或如如夏周之世故賈誼陳政事之書謂帝身衣皂綈而富民墻屋𬒳文繡豈漢民習秦人奢侈餘俗而未昜遽革耶不然何上以敦朴示之而下不以敦朴應之也我國家自祖宗以來世以恭儉化下肆我仁宗皇帝在位四十二年而儉德猶著御寢衾禱至以黃綈為之常服止用縑繒雖纍經浣灌而不昜然當時民間猶有以金為飾者於是詔自中宫以下母得衣銷金貼金等服臣庶犯者一切置於法由是天下化之而皇祐嘉祐之間風俗淳美連于三代之上矣主上皇帝藴仁儉之資清中興之業尤謹厥德惟懷永圗可謂同符仁祖並美禹文者也邇者近臣獻言謂州縣尚用金翠為衣服首飾貴賤之分混然無别請加禁止聖訓丁寧命有司以前後詔條申明之德至渥也議者尚慮逺方富民狃於循習未能遽革射利之徒興造販鬻而不知畏又慮州縣奉行之吏不能遵守教條或暫禁輒而縱之無以仰副吾君敦朴之化必𣣔令行而禁止如仁祖之世不使年少書生得以獻太息之書如之何則可問才難久矣堯舜之時野無遺賢所與治天下者止於五臣周家濟濟多士而用一婦人以足十亂之數不其然乎之歎冝其發於吾夫子也自兹以降治不逮古而人才愈難必責以五臣十亂之儔則千古為無人就其時而求之冝莫盛於武宣之際班孟堅嘗枚舉其人而贊之以侈一時之盛武帝自公孫丞相至金日暉凡二十有七人宣帝自簫太傅至張敞凡二十有四人亦可謂盛矣然考固之言猶有可疑者焉其稱武帝人才也則曰漢之得人於茲為盛是以興造功業制度遺文後世莫及至稱宣帝人才也則曰皆有功迹見述於世參其名臣亦其次也固蓋以宣帝二十四人可為武帝名臣之次耳今即其人而考之宣帝之相則有如有聲之丙魏固非公孫洪石慶輩之所可及其將則有忠武如趙營平又非衛霍輩之所可及廷尉則有如于定國治民則有如龔黃又非趙禹張湯酷吏比也校其人才若逺過之而固乃以彼為莫及此為次之何耶夫所謂人才者必其勳業名節之有大過人也彼阿世如公孫酷虐如張湯榷利如桑弘羊皆治世之罪人也而以此為得人又何耶有是君斯有是臣武帝君德不逮孝宣逺甚固嘗譏武帝改文景恭儉美宣帝侔德商周其於人才當亦如之今乃復優彼而劣此又何戾耶固生東都之𥘉去武宣之世為未逺且親為國史必知其人才之始未意其品藻之必當也况是贊尤膾炙人口而見録於選今乃可疑如此其必有説以辨之問爾雅者所以通詁訓之指歸敘詩人之興詠釋古今之異言通方俗之殊語多識鳥獸草木之名可以博物而不惑兹其所以為百代指南歟舊説皆言周公所制又言史佚教其子以爾雅又言孔子教魯哀公學爾雅晉郭璞亦言興於中古蓋指周也是則爾雅之出逺矣今閲其書而考之則非周公之制甚明小雅稱張仲孝友蓋宣王時人也而釋訓篇則有張仲孝友之釋衛淇澳之詩曰如切如瑳如琢如磨蓋美武公也而釋訓則有過學自修之釋式微之詩為黎侯作也而有微乎微之釋猗嗟名兮刺魯莊公詩也而有上為名之釋其釋詁釋言釋訓諸篇大柢皆訓釋詩書之辭悉出周公之後而云周公所制非矣又釋嵗名則曰周曰年釋祭名則曰周曰釋周公豈自稱其國號以别夏啇耶又於釋地篇敘十藪之名舉魯晉秦宋楚吳越齊燕凡九國繼之曰周有焦護是數國在周公時固未有封者周公又豈自卑宗周以配列國耶以此知爾雅斷非周公作也漢人嘗有以是問楊子雲者矣子雲以為孔子門人遊夏之徒所記以解釋六藝者也是亦意云爾亦何以驗其出孔氏徒也或云爾雅實周公所制而張仲孝友之類乃後人所足猶春秋絶筆之後弟子續之至孔丘卒之類其説又如何碩與諸君辨之問有創業之君有守成之君有中興之君三者之時不同而應之者亦異音房元齡嘗以創業為難魏鄭公嘗以守成而不昜元次山之頌中興也又以宗廟再安為事之至難然則三者皆未可以難易斷也請借漢以論之髙帝創業者也而不足於文使生文帝時未必能興聖賢之治文帝守成者也而不足於武使生髙帝時未必能建艱難之業宣帝中興者也然英雄不及髙祖仁厚不如文帝使生二帝時其武功文德亦必有所不如者西京三君蓋亦各以所長而生遇乎時以成其名者歟至於光武雖號中興之君而功兼創業治兼守成意者其文武兩全功德兼備者也然馬伏波對隗囂之問乃謂光武不如髙帝我神宗稱漢唐之治亦及文宣而不及光武夫創業守成中興皆難者也而兼之者為尤難西京三君各處其一而擅其名光武兼三者之長而稱之者或以為不如或有所不及何耶共惟主上以神聖之資濟艱危之運德邁周宣而俯比光武兼三者之至難而取之以至兼賢於古人逺矣諸生幸生聖時目擊盛事願考三者之難易與漢四君之優劣以發明我主上之鴻勳盛德問昔夫子繫易謂何以聚民曰財對子貢問政以足食為三者之首財用者誠有國之急務尤急於艱難多事之秋也國家前日無事用度失節常賦之入猶不足以支歲費一旦加之以師旅錢榖之問遂至於廟堂調發既繁經費百出官田鬻矣度牒行矣坊名借矣下富民獻助之令殫州郡公庫之器矣而獨不及民仰見聖德之至渥也然議者謂財非天雨而鬼輸之未有不取諸民者雖賦斂不明出於朝廷而科率每潛行於郡縣勤恤之詔非不丁寧有司迫於辦事所不暇顧况今日虜情叵測和與戰猶未決也和則有嵗幣而坐困吾財戰則興師百萬千里餽糧有不可勝計之費將取之官耶而公帑竭矣將耶之民耶財盡民怨何以為國古者兵未嘗不用而財未嘗不給耶抑不知生之以何術理之以何人耶伊𣣔上不乏用而下不及民其必有説問少康祀夏配天不失舊物議者以為優於漢髙帝孝宣信威北夷功光祖宗班固以為侔德商宗周宣光武身濟大業中興漢室馬援以為不如髙帝太宗除亂致治功德兼隆史氏謂比迹湯武庶幾成康其言之常否果如何主上興衰撥亂紹復大業方之前代何如主也碩併陳之問戰國之軻况西京之雄隋之通唐之愈皆著書立言羽翼聖道世以大儒稱之議者不以為過然五君子者果孔氏之徒歟心無異傳道無二致固冝迭相推尊無或操戈相伐可也今考其書乃或不然况非特不尊軻也且列於十二子而非之雄非特不尊况也且有同門異户之斥通雖以雄為振古竒人而不許其道愈推尊孟氏醇疵况雄至河汾則無一言之及然愈嘗自比孟軻矣後世亦不能無異同之論夫道之所在人所共尊道不在焉人所同抑今尊之則命世大才仰之則諸子也尊之則軻雄之間抑之則異户也尊之則聖人之徒抑之則張衡數術之伍也尊之則聖人之修抑之則沒而不説尊之則泰山北斗抑之則木強人也尊之抑之者其公心歟其私意歟豈好巳同者有相黨之心故私有以尊之歟好巳勝者有相輕之意故妄有以抑之歟尊之者是則抑之者坐蔽善之罪矣抑之者是則尊之者陷虛美之失矣二者必居一於此也碩考其實而詳辨之問十八章之經夫子為弟子曽參作也參以孝名世為孔門賢弟子雖曰稟自然之至性蓋亦出於侍坐之際開宗明義之力焉然參之言行備見於語孟諸書不知其終身之大節能不負聖人之教而吻合於是經者果何語也夫子嘗自謂行在孝經使曽子果能盡是經之言也則行與夫子同矣然參雖賢未可以擬聖人是於經必有所未盡而行事不能無少戾也夫孝於德為至於行為大參既以孝稱冝無愧於淵騫之列矣乃反不預四科何耶諸君自兒時巳能誦十八章之語其於出孝入弟之際必不叛是經敢問曽子之孝其有得於經者何語其未盡於經者何事與其不與於四科者果何謂也問君子讀書稽古豈徒對聖賢而巳哉必曰古人可作吾誰與歸心有所慕則將學其為人而以其身比之也歷觀古人自比於前修者多矣亦各不同有以不如巳者自比有以勝已者自比自比以不如巳也能自謙矣而有志者卑之自比以勝已也能自強矣而好謙者妄之孔子賢於堯舜而竊比老彭有以見聖人謙德之至也人比曽西以管仲則艴然不恱謙何在焉孟子乃以是取之何耶至諸葛武侯自比管樂或美其德之謙或陋其志之卑亮果謙乎卑乎君子必有以處之也揚雄韓愈自比孟子雄愈非軻敵而以軻自期有以見君子自強之志也崔浩自比張子房志亦可嘉矣議者乃不許之何耶至杜子美以詩人竊比稷契人或賞其忠或指其妄甫果忠乎妄乎君子必有以處之也諸君潛心古人之際其必有以自况將比於不如已者歟則懼其志之卑非自強之道將自比於勝巳者歟則懼其言之妄為謙德之纍必𣣔自謙而不失之卑自強而不失之妄如之何而可碩商榷古人之外且各言其志問古之人皆有師自聖人至于士一也雖師未必賢於弟子弟子未必盡如師固可因流究源見形知範矣惟孔子之於老𣆀左丘明之於孔子公羊髙榖梁赤之於子夏房杜王魏之於王通世皆以為師弟子也或謂其不然學者未免乎疑焉謂孔子不師老𣆀也固嘗適周而問禮矣果惟𣆀是師則彼槌提仁義絶滅禮學夫子乃為禮樂仁義之主何耶謂丘明不師孔子也固嘗見稱於魯語與聖人同好惡矣果惟孔是師則子不語怪而丘明乃失之誣且傳經多不合於聖人之旨何耶謂公榖不師子夏也則先儒應劭輩固嘗有是語矣謂果出其門則春秋之成商不能贊一辭二子乃各以經名家何耶謂房杜王魏不師王通也則通著之中説固嘗弟子之矣謂果出其門則數子俱顯於唐反無一語以稱師抑又何耶以為果師果弟子則其學必不相戾而其心必不相忘也以為非師非弟子則載諸古人之書傳諸學者之口豈盡妄耶諸君尚論古人之日久矣師自柱下而至河汾弟子自將聖而至正觀諸子必能熟究其源流而素知其然否也幸即其道考其時推前人之議論以其實告問韓愈栁宗元俱以文鳴于唐世目曰韓栁二人更相推遜雖議者亦莫得而雌雄之然其好惡議論之際顧多不同者韓排釋氏甚嚴其送浮屠序責子厚不以聖人之道告之栁謂釋氏之説與易論語合且譏退之知石而不知韞玉韓謂世無孔子則巳不在弟子列作師説以號召後學栁則以好為人師為患有師友針有答韋嚴二書且有雪白之喻又有母以韓責我之説韓著獲麟解以麟為聖人之祥賀白龜表以龜為獲蔡之驗栁則作正符詆談符瑞者為淫巫瞽史韓碑淮西歸功裴度而不及李訴栁於裴李則各有雅章韓以作史有人禍天刑之可畏栁則移書以辨之韓以人禍元氣為天所罰栁則著論以非之其指意不同多此類者且退之名在子厚先友記中蓋其父兄行且年又長栁冝以兄事之可也然韓每及栁則字而稱之栁語及韓則斥而名之爾抑又何耶今二文並行於世學者之所取法真文章宗匠也然讀其文切疑二人陽若更譽而隂相矛盾者不可以不辨夫韓栁邪正士君子固能言之至於議論則未可因人而輕重碩與諸君辨其當否問五常之道莫大於仁以夫子之聖猶曰豈敢故於許與之際尤謹焉古之逸民非不多也獨許夷齊為得仁大臣如伊吕之徒𥘉無一言之贊也獨稱商有三仁門弟子之中如仲由冉求公西赤者皆所不許而獨許顔冉諸侯之大夫如令尹子文陳文子皆所不許而獨許一管仲此八人者雖窮逹死生去就之迹不同而聖人許之以仁𥘉無異辭後世有大儒王通者鳴道河汾間與弟子難疑答問動以洙泗為法中説十篇猶孔氏論語也其以仁許前賢及髙弟者亦八人焉曰東平王蒼仁人也曰羊祜陸遜仁人也曰荀氏有二仁曰仁哉樂毅許董常以顔氏之流蓋以其三月不違仁也稱薛收仁而不佞蓋許其為冉雍也夫子所稱八人者後世以聖人之言莫得而議之通所稱八人者或未之信然自蒼至收七子皆顯事在信史可考而知董常早世其言論粗見於中説亦可以想見其為人也是果可當仁者之名否乎通之許與其亦有得有失乎孰可以方夷齊孰可以比三仁孰無愧於顔冉之德孰能為管仲之功碩併陳之以佐文中之垂教問太史公作史記采古今名臣賢士列而傳者凡七十焉其共列之人必臭味之同者如管仲晏子以佐主之迹同孫武吳起以論兵之術同樗里甘茂以智略同范睢蔡澤以其談辨同仲尼弟子學術同也屈原賈生風騷同也萬石張叔謹厚同也凡傳而同之者必其類之相近焉然亦有不冝同而同者使學者不能無惑其為老子傳也與莊周同冝矣而乃列申不害韓非於其中申韓之術至殘忍慘酷也其可與深於道德者同耶其為孟子傳也與荀卿同冝矣而乃列鄒衍淳干髠于其間以衍之迃誕髠之滑稽正儒者之罪人也其可與主盟仁義者同耶謂遷不精於選擇則彼之同者何是謂遷不妄於條例則此之同者何乖豈偶得於彼而有失於此耶抑識見不明曽碔玞美玉之不辨耶不然其不同而同之必有深意乎其間不可不熟究而詳辨也問君子之學必先正其心術而不惑於異端邪説然後聖人之道斯可得而入焉茍惟心術不正而異端邪説從而陷溺之望其入聖人之道猶航斷港絶潢而𣣔求至海不亦難乎昔吾夫子既沒而楊朱墨翟者竊仁義之一偏而唱為我兼愛之説以亂天下幸而有孟子者出辝而闢之楊墨之害息而人心復歸於正孟子沒有申韓刑名之學黃老虛無之説簧鼓于世其為害又甚於楊墨而世之儒者往往墮於其間而不悟以賈誼之美才猶明申韓司馬遷之博學猶尚黃老况其下者乎當時不惑其説毅然而麾之者一楊雄氏而已自漢室之東而西方之教流入於中國時君世主尊尚其説遂與孔老並立而王公卿士庶陷溺滋甚王通隋大儒也猶稱其為聖人白居易唐賢人也猶酷嗜之晚節用其教以理性况衆人乎當時不惑其説毅然而力排者一韓愈氏而已夫異端邪説之移人也愚者信之可也而智者惑之何耶不肖者信之可也而賢者惑之何耶里巷之人信之可也而縉紳士大夫惑之何耶豈異端之學亦有以過人而其道誠可與堯舜周孔抗衡於世耶豈賈誼司馬遷王通白居易之徒明之尚之尊之者是而孟子楊雄韓愈闢之麾之排之者非耶夫以其説為真可信也則與吾堯舜周孔之道大不相似以其説為妄也則世之屈已以尊崇之者又皆吾儒之傑然者焉孟楊韓三君子不世出無有與之辨者碩與諸君論之問封建尚矣自五帝三王莫能去矣後世人君易之以郡縣則其國亦從而治亦或因之而亂此皆立國之先務學者不可不察也唐虞列公侯伯子男為五等相制天子千里諸侯百里而降不及五十里者為附庸周興封國八百同姓居五十三焉此封建所由興也秦鑒衰周之弊罷侯置守列天下為三十六郡後世因之不改復增其數此郡縣所由興然以周秦漢唐論之則其國之或強或弱其祚之或短或長皆關乎封建之與郡縣此又不可不辨矣謂封建無益於國耶則周何為因之而強秦何為罷之而亡乎謂封建有益于國耶則漢何為而有七國之變唐何為而有諸鎮之亂乎𣣔使罷侯置守而無嬴秦之危封建侯藩而無漢唐之亂果何術而可碩詳以告將疏其説以獻于上問夫樂之作尚矣先王以是正朝廷美風俗格神物和上下有其舉之莫敢廢也故黃帝之樂曰咸池顓帝之樂曰六莖帝嚳之樂曰六英堯曰大章舜曰大韶禹曰大夏湯護而武武此歷代之樂所由作也而其大備莫盛于成周故周禮大司徒以六樂防萬民之情則又有所謂大師小師磬師舞師笙師鍾師者大師樂以六律六同大合樂時則有奏黃鍾太簇姑洗㽔賔夷則無射者太師掌律同以合隂陽時則有播八音于金石絲竹匏土革木者是古作樂者必有其官奏之必有其所制之必有其器豈非樂有自然之數而數之所舉又有自然之義乎後世去古既逺樂制始無一定之論而名數音律刑器亦莫之考矣學者審古今灼知先王所以作樂之意者敢問咸池六莖六英韶護夏武之名所取者何義周大司徒與大師小師磬師舞師笙師鍾師所掌者何器黃鍾太簇姑洗㽔賔夷則無射所奏者何所金石絲竹匏土革木所應者何事與夫後代因革損益孰得孰失幸明言之問孟堅序六藝為九種列小學一家於其中則知字學之有益於斯文也尚矣古者八嵗入小學學書藝之事故周官保氏掌養國子教之六書漢簫何亦著其法於律令太史試學童而祿其課最者唐選舉之法有四而楷法遒美居其一焉夫書雖一技然教於周試於漢選舉於唐參六經論語孝經而九之學者其可忽耶爰自科斗書廢篆隸迭興漢晉以來乃有草楷真行雜體之書去朴歸華舒箋點翰以相誇尚者不知其幾也唐太宗歷評晉人之書而以王逸少為盡善盡美先翰林蘇公嘗評唐人之書謂極於顔真卿又論近代之書以蔡君謨為第一議者謂顔書本出於王而蔡乃法顔而變者然三人者各名家當代而咸造其極使其同時而並駕未知其孰後而孰先諸君稽古之暇遊心翰墨久矣其於晉唐宋三子將誰取法耶抑所好不同捨二三子而他有所尚耶又豈得於心畫之妙而不蹈前人之陳迹耶碩評古人優劣之外且自論平日之所以張吾軍者果出於自得乎抑亦何所法也幸詳以告梅溪先生文集卷第十五
