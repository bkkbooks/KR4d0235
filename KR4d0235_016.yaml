  text: 梅溪先生後集卷第十六
  hash: sha256:cdfb96ccf84471bcdba0fca0f87838df9ae58fccb37561dfb33086e377b42b28
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_016-1a}
body:
  text: 詩九月十三日離仙林重日脩門鬂已華君恩猶未許還家水魚聲動惟行李蠟炬向人空自花過東林地入東林眼界竒神仙遺跡在榴皮湖山如舊無東老酒為嘉賓釀者誰郡中乆雨入境而霽積雨喜𥘉霽湖山清更嘉船船漁晒網岸岸稻烘芽水漲魚蝦樂年㓙道路嗟人言新太守頭白似苕花六客堂水晶宫中刺史宅月堂遊六客中有一客爲主人萬卷詩書李公擇元揮玉堂手令舉聲蜚制科策五勸使君古遺直三郎官老詞伯眉山有客何等人退之少陵李太白直道髙才時不容天遣数子爲遊從呉興清絶山水國五百年過人中龍徤峭銀鈎逼顔魯點化湖山出竒語髙壓白蘋洲上詩更肯區區談小杜端如竹溪逢謫仙並逰逸士名俱傳飄飄乘風鼓長翮兩兩照坐成台躔苕霅交流卞山碧一代名賢已陳迹我後百年登此堂咀嚼姓名牙頰香坐上何曽欠佳客蘇仙一去難再得送朱仲文運幹還蜀分閫濫曾㳺蜀口得朋深喜遇坤爻澹䑓至室必公事平仲與人能乆交一葉共乘䕫到霅四方相逐愈随郊姓名已在諸公齒引類行㸔似㧞茅君帰應過無喧室我夢遥馳無隱齋帯得江山在詩卷種成楊栁繫離懐定先春到䕫門裏莫遣音踈霅水涯故舊相逢倘相問為言老欲乞殘骸讀喻叔竒逰廬山詩前年我亦到廬山杖屨烟霞縹緲間萬里東帰如倦鳥不知飛過只知還路經溢浦嘆怱怱不及從君訪遠公怱見廬山真靣目在君二十一時中十月晦日㑹凌季文沈徳和二尚書劉汝一大諫于六客堂夢寐思賢願與齊一麾來守淛江西星躔舊識尚書履凌為吏侍時某為司封郎玉府曾親太一藜劉為校書郎某忝同舎天遣門生依坐主某補戴公試觧試皆沈王文心随峽水汪苕溪邦人異日談遺事名姓應同六客題沈書和詩再用韻先生名與卞山齊賤子来帰自瀼西自媿蒹葭難倚玉暫教松柏俯同藜萬言讜論驚天闕八詠髙才壓婺溪栁惲蘇仙舊吟䖏願陪杖屨徧留題凌書和詩復用韻人物堂堂大國齊難窺賜履地東西心才遇日即傾藿身或在山誰采藜隱徳猶能及枯骨尚書嘗率衆􅌾枯骨安車行見起蟠溪後生何幸依先逹誤辱山公一字題劉汝一和詩復用韻魯酒三盃却到齊詩壇老将勝山西氣餘殿上欲折檻清見胸中不糝藜聊復亡機對禅榻未應采藥赴桃溪吾儕㑹合真天意清絶湖山盡共題十一月十目㑹于六客堂者十人宋子飛徐致雲章茂卿鄧叔厚登俞仲明許子齊沈虞卿鄭夀叔酒三行予詩六客髙風不可追吾儕生恨百年遲星光月滿舊㳺䖏簮盍􅕴開盈数時訪古巳仙圖上鶴得朋今遇昜中龜吾夫子道欲墜地不是四科誰與持坡詞月滿苕溪照夜堂五星一老光芒某方欲夫子廟廷貢院頼諸公表率故末章汝一和十客詩語及貢院復用前韻洙四家風尚可追未應吾道便陵遲要令士有歡顔地如見公為舉首時汝一發薦于旧貢院山遶苕溪翻振鷺水通震澤錫神龜眼中突兀行将見大厦端由衆木持晦日㑹于六客堂者十二人湖山清絶多佳士暇日壷觴得共携堂上合成前後客詩中分得建除題不容閏位叅卿月坐覺巫山在霅溪麟閣功名属公軰老夫惟願把鋤黎次韻張叔清見寄名湜太學年時識一䕫婺溪摻别越三朞閩中大府子為掾峽内孤城予把麾去隔関山共明月帰逢魚鴈寄新詩苕溪昨夜梅花發目對清標有所思次韻林明仲見寄憶昔相逄未白頭别來歳月迅如流自從江左分符去長念城南載酒逰君似老松姿耐雪我猶弱桞葉經秋梅溪梅嶼不相逺帰去定乘㝷戴舟貢院上梁清絶湖山映白蘋翬飛梁棟眼中新雪花先作曉来瑞桂魄正圓天上輪夫子廟還元氣象水晶宫發舊精神書生戦藝真餘事移孝為忠要致身諸公和詩再用韻并簡沈虞卿教授来采汀洲桞惲蘋要觀草色賜𫀆新士由徳行首科第木就方圓在梓輪山峙浮圖聳千物水迎仙子上三神耽耽廣厦荣帰日應話林泉老病身寄䕫州張君玉撫幹名珖天上張公子同僚半載餘令人思灔澦有客泛芙蕖一自離䕫子頻蒙寄鯉魚江山元不逺面目在来書送張光大咸赴長沙簿同舎張公子長沙逺宦㳺讀書真有用謀道了無憂賦鵩休悲賈棲鵉暫屈仇薦章行引類文帥是鼇頭送柑姚子才梓少年懐橘獻慈親今見黄柑淚滿巾同舎故人堂有毋可能羅帕不分珍過孺人挽詞周南夫教授毋扁舟昔訪戴逵居早識竒兒骨相殊不是剡溪能藴秀秖應蚌腹觧生珠家從機断知爲學身自鷄鳴起奉姑儒術登科有猶子大書遺懿照亀趺過從有夏孕遺芳作配于周婦徳良目不泛觀惟具葉舍無他物有天香魚軒欲動喜家近烏冡忽帰驚夜長年右来希子孫足人生如此尚何傷重刋戒石銘戒石重刋照眼明良辰又遇臘嘉平夔州以臘日修成石黄堂坐䖏天威近一點欺心事莫萌浸滛秋潦壊垂成忍聴閭閻愁歎聲撫字催科劳更拙欲迯吏責負斯銘謁顔魯公祠卞山苕溪髙且清魯公祠堂貌如生言言千古英雄在吉吉一點仙丹成姦臣必欲置之死天下不敢呼其名當時節義誰可並常山太守公難兄懐忠堂霜嚴日烈與時乖前後姦邪屡見排苕霅祠堂境清絶孤忠千古有人懐放生池畏死貪生物我同仁心要在擴而充江湖魚鱉知多少盡在恩波浩渺中次韻翁東叟知縣見寄并簡戴俊仲濫把江東蜀口麾中原入望涕頻揮毎嗟風俗媿東晋晋不與仇讐通那得功名如合淝賢士憂時尚家食聖君求治正宵衣腐儒老矣身多病日日言帰猶未帰年時我忝楚東守邂逅君從湖北来携手篇章擬蘇李論交風義薄陳雷棲遲百里淹賢甚奔走三州覺老催如見高人戴安道為言吾意最憐才送師教授教授師同年自眉山赴闕其西帰也訪某於霅川把酒六客堂賦詩論文所得為多索詩贈行以姓為韻同年四百二十六尊酒相逢得我師方喜書来自天目去冬過安吉首寄書忽驚人去向哦眉嚢開蜀錦留佳句棹拂汀蘋索悪詩莫道冷官無一物扁舟遥載義風帰借韻朱仲文客死九江教授許以䘮帰蜀用貢院韻寄當塗呉給事明可某蒙和貢院二詩三復欽歎因思給事昔尉樂凊某誤辱知遇縣學落成嘗賦詩百韻以獻回首三紀慨然于懐復用前韻鄉校當年與薦蘋蕭䑓氣象自公新老成猶滯甘泉槖晚進叨乘刺史輪陸凱寄梅情愈重謝公夢草句尤神何時更作龍門客共話樽前見在身王夷仲校書挽詞同姓同年友吾心乆巳降賔王誤第四江夏本無雙刺不投東閣吟惟坐北窓胷中藴經濟可惜未施邦明月雙溪地三年両度逄君登群玉府我到白塩峯方喜書傳鯉俄驚劔化龍公與孺人相継去守符嗟未觧執紼恨無從仲冬釋奠于學同諸公登稽古閣觀弁山望太湖閱壁上題名誦范文正公呉興先生冨道徳詵詵弟子皆賢才之句吴興學校􅒑模壮安定先生道徳崇苕霅溪同洙泗水汀洲蘋有藻芹風山知尊道猶端弁湖欲依光攷近宫壁上題名觀尚友諸儒事業聖賢中次韻錢郎中䂊六客堂碧瀾堂二絶六客高風乆已無花間誰對謫仙壷星躔一夕光芒動如有仙舟入畫圖一樽相對眼俱明細話同僚舊日情漢世郎官亦華髪恨無詩句以君清錢再賦二詩復用前韻銭云家無置錐之地寓居僧舎有為題米䟽者老来官况兩俱無惟有詩情寄酒壺記取碧瀾堂上語衣冠早掛亦良圖無田種秫似淵明却說歸耕似不情食粥魯公冝乞米不妨千載有餘凊送柴常之赴汀州教官有客神珠玉訪予雲水鄉虞庠同舎友虎榜甲科郎送别汀蘋白之官芹藻香南溟九萬里拭目看翶翔送朱舜卿赴汀州司户家塾㳺從乆賢関聲譽馳𥘉官三語掾餘事九章辭子正强而仕予嗟乆矣衰愿言行所學滿慰素相期二月望日欲劳農于弁山㑹風雨作遂岀南門因登峴山觀窪尊訪五花亭遺跡晚霽㳺何山觀讀書堂薄萬而還卞山龍欲阻吾行􅏜雨盲風不肯晴但得出郊脩故事此中亦可勸深耕天遣吾来此劳農要令遺躅訪顔公雖無二十四賔客詩酒略追前軰風乆欲帰耕竟未帰又吟苕霅勸農詩流錢腐粟慚無術稼穡艰难或稍知劳農峴山乗興㳺何山同行宋子飛沈虞卿霍從周范文質去秋㳺道埸俯瞰何山路林泉雖在眼未暇飛杖屨塵埃汨城市遥望隔烟霧春光忽巳半播榖催農務欲作卞山行偶逄風伯怒肩輿出城南乘興訪幽趣山蔵佛屋深迹躡陳朝故老松不記年脩竹莫知数鳥鳴說法池花落在禅䖏書空何公堂木拱安定墓青山㸔未足回首日已暮小溪何䖏是帰誦蘇仙句寄沈虞卿寒夕上安定家先生宋儒宗風義起人聳何山如孔林世俗豈知重廣文領諸生寒夕親上冡我獨不得行為義慙無勇登清風楼呈通判宋子飛苕霅水㑹䖏楼高風快哉洲中白蘋動天半故人耒穆入周臣頌雄勝楚客䑓飄飄玉川子乗興上蓬莱時某得祠子飛攝郡事酌别是樓子飛亦将羙觧故断章及之郡僚展餞席上賦詩五年三郡厭驅馳聖主隆㤙許奉祠孤與衆山重對酒孟浩然永嘉詩云衆山瑶對酒孤共題詩清風明月欠吟詩清風明月貳樓名某至郡困扵吏事賦詩無幾心劳撫字政尤拙田不荒蕪去亦冝錢别同僚三十二雲䑓功業滿相期父老父老自何䖏同来送使君手中一爐香敬為使君焚使君無善政父老何慇勤同辞荅使君去秋稼如雲滛雨害垂成一年計徒勤使君体上意租苗放三分父子免流離歡然事耕耘年㓙米不貴夜静犬不聞顰眉荅父老正縁此紛紛黄堂非坐䖏帰歟老桑枌至徳清懐送别諸公舟泝餘不平声水回頭憶兩溪川長太湖隔天逺卞峯迷左顧龜何在縣有左顧亭孔愉放亀䖏南飛烏欲棲從今到家夣却到淛江西金仙院金仙何䖏不曽㳺小小精藍亦自幽有客倦㳺帰欲速可能一宿為山留宿妙庭觀董雙成故宅小小琳宫氣象清雲軿遐想董雙成靈丹煉就覆金鼎見坡詩仙鶴帰来聞玉笙有玉笙庵香風堂兩絶老坡吟䖏境千秋太白曲中名塵埃奔走東帰客寄臥一庵听雨声宿冨春舟中苦雨冷朱夏小舟眠冨春餘生今可樂帰作太平人是日得勑提舉太平興囯宫泊桐廬分水港何䖏繋帰舟桐廬舊日㳺港從分水出亭瞰合江流合江亭疊嶂雲披絮遥天月吐鈎紛紛釣魚者無復見羊裘小瀑布在釣䑓之東前對方弯有岩花頗幽竒釣瀬雲山外岩花瀑布邊却疑方䖏士詩思湧成泉釣䑓三絶聖主中興急用人小臣無術賛經綸功名分付雲䑓士碩學先生事隱淪竊食三州媿不才扁舟又過子陵䑓心知敬慕先生節乞得祠宫帰去来山水高長子陵節桐廬䔥洒范公詩又吟䖏士清新句蟬拽殘聲過别枝呉明可自當塗以詩見寄因次其韻五年三郡厭間関心逐東帰見鴈山力上祠章期得請果回天意可投閑踈慵似我冝帰去名徳如公合召还珎重詩来二千里義風高韻両难攀夢到江南詠采蘋眼中時事一畨新在官未㡬髪就種某到霅川鬚髮盡白語别又成腸轉輪老境衣冠冝掛壁祠宫香火謾頥神呉公治行今第一也問君王欲乞身端午日陪桞嚴州登千峯榭即䔥洒亭偶上千峯榭遥思八陣䑓去年重午日僚友共􅋦杯偶上千峯榭因思小范公桐廬䔥洒䖏盡在十詩中偶上千峯榭遥思六客堂前時賦詩䖏烟水路茫茫偶上千峯榭當時恨不来使君留過客髙䖏酌金罍宿安流亭弭棹宿溪亭全家夢寐驚明朝速觧䌫莫待濁流平過老䑕岐去年灘下黄牛峽今日舟逄老䑕岐莫恃岩崖起波浪可無天定水平時風水雨俱逆舟行何太稽安心出三峽破膽上雙溪予至蘭溪買扇題帰去来字吏忽報有潘淵明相訪戯書二十字扇題帰去来客遇潘淵明舉扇謝佳客帰耕吾已成泝婺溪同年雍尭佐周尭夫同王與道尚書子姪拏舟来迓路入雙溪暑氣清故人短棹遠相迎隔船認我疑非我白髪當時尚未生婺女廣文官舎舊有五桞䔥侍郎徳起為教官時取以名堂歳月浸乆桞既剪伐名亦更矣周尭夫欲復其舊詩以賛之何人栽五桞雅目自蕭公要使廣文舎長存彭澤風名因賢者復趣與昔人同留取先生傳他年囯史中梅溪先生後集卷第十六梅溪先生文集卷第十六書上太守李端明某嘗讀前史竊知李氏為天下甲門世生大贒角立傑出皆天人也自昔周柱下史先天地而生指木為姓愽古知今而道徳為吾聖人之師東都太尉禀元精之氣正色在列殺身成仁而節義為人臣之冠唐翰林應長庚之夣世號謪仙人立馬萬言而文章為天下之法孰謂其非天人耶其間又有以聲名自髙而天下有𬒳其收接者如登龍門隱居求志而天下望其出仕者如覩景星至若出秉旄鉞如臨淮之元勲入總台衡如衞公之風采者皆卓然爲一代之名臣中興之賢佐其風流餘韻足以起萬世之聳慕某故曰李氏天下之甲門而數公者真天人也迨我國朝二百年間宗工鉅儒背項相望而李氏之門最號得人有若文靖公在咸平景徳間公忠直亮深慮逺識嘗戒王文正公與北虜和親之議断然有先見之明天下至今稱爲賢相有若文定公在天禧乾興間慷慨立朝義形於色嘗伸救寇萊公之禍以手板擊姦邪天下至今目爲正人有若𬗋薇舎人在熈寕間居代言之任力持風裁雖貶黜而氣不撓與蘇宋齊名天下至今有三舍人之號有若大丞相在政和間危言讜論聳動四方及重華受禅之際垂紳正笏不動聲氣而大議决天下至今頼爲社稷臣而蒼生猶冀其復起有若尚書公當靖康之難得主辱臣死之義力抗腥膻碎首裂額而憤罵不絶英烈言言與赫日秋霜争嚴艱難以来一人而已天下至今稱爲烈丈夫而知與不知莫不爲之流涕仰惟明公以英偉之才剛方之氣挺生華裔爲當世羽儀𬒳遇三朝終始一節廼者上方興衰撥亂任賢使能日不暇給起明公於均逸中付以喉舌之任公卿大夫相與賀於朝韋帶布衣相與賀於下咸謂明公體道徳如柱下史尚節義如漢太尉工文章如唐翰林立天子前披陳利害論列可否在廷竦慄明公之諌諍固不在諌議勃之後也屢典名藩皆著聲績姦贓望風觧綬而去明公之威聲固不在河南尹之下也至如臨淮衞公之勲烈文靖文定之事業皆明公之所優爲者詩人誦召虎曰惟其有之是以似之然則明公豈非所謂天人者耶然朝廷方視明公之出處以爲安危之繋天下方視明公之進退以爲治亂之分夷狄問明公之安否而爲之叛服姦邪伺明公之行藏而爲之喜懼輿議皆謂明公匪朝伊夕正台鼎之司慰蒼生之望中興之功指日可期今廼力辭柄任出牧侯藩雖一方得卧治之賢而天下欝具瞻之望竊料明公固難乆屈於此也某蓬蓽一賤生爾自緫角聞先生長者稱頌明公盛徳偉望殆非一日第恨生居遐陬自䖏卑賤邈無進見之階今幸明公父母吾桑梓之邦適符夙昔景慕企仰之誠比者千騎入境道由僻邑而某遂得與田夫野老犇走争先瞻望於車塵馬足間巳足少償素碩矣然獲未進拜黄堂親承罄咳之餘少窺大人君子之髙致不日明公入秉洪鈞則某於此時當抱無窮之恨矣是以不介於人不謀於龜朝齋而裁書莫沐而修刺曳裾麾㦸兾一瞻芝宇退當誇大自謂今日得見天人也啓代曽尉上陳安撫太山北斗十年懐景仰之勤白日青天一旦快淸明之覩實自寅縁之幸靡由媒介之先行遂鳬趍預深雀躍恭惟某官學師孔孟才亞卿雲風流號當世無雙聲望居縉紳第一光玉玉㓗文章騰萬丈之輝鳳翥龍蟠翰墨掃千軍之敵早收巍第榮歴顯途赤心備竭於三朝白首克全於一節荐更中外並著恩威将命外䑓茂荆潭之治績分符重鎮藹呉越之休聲何所至之有聞盖無施而不可咸望有爲於今日自期無媿於古人方馳赫赫之聲俄起營營之謗唐室頼宣公之議克濟艱難漢庭忌賈誼之才遽罹譴責輿議咸稱其屈士流尤爲不平稍息人言卒回天聴脫風濤於異域㝷松菊於故園職姑領於真祠官未還於舊物優㳺里巷頥養年齡門多長者之車座有賢人之榻量包海嶽撓不濁而澄不清節貫冰霜窮益堅而老益壮然當宁方興衰而撥亂豈舊臣可置散以投閑矧鼎席之尚虚想宸襟之素注必起渭濵之大老式慰海隅之蒼生宰相以鎮撫四夷况我有種丈夫當掃除天下非公其誰無憚趣裝行膺賜召如某者箕裘冷族蓬蓽寒生思不墜於家聲謾力勤於學業始由經術而獲選終用詞章而决科名再上於賢書計始偕於吏部備員海邑雅懐慕藺之誠昜尉僊邦遂有依劉之幸自慚樗散實頼帡幪𣣔脩吾道以致君盍就大人而正巳去先聖之旣逺非通儒其孰歸點也何如方起舞雩之詠參乎不敏預懐避席之慙仰祈先逹之見知庻俾後生之有頼望塵伊邇頌徳尤勤執贄賔庭行當盡門弟子之禮投緘記室先展事賢大夫之誠代曽尉荅交代備員小邑考未一書承命大賢任俄两易仰歎髙風之难継俯驚瑣質之何堪敢單驅馳第從鞭䇿共惟其官家傳忠義天賦材猷門地素髙早聮姻於卿相仕塗𥘉筮聊隱迹於江山宣北部之餘威継南昌之雅韻精神不動曹務自清朱􅙲皂盖乃賢主人黄門紫樞有真知已雖曲從於引避寕又致於淹徊固冝綰爵於天朝何至易官於海嶠舍鶴溪之舊治㝷鴈蕩之勝游白面紅顔姑作神仙之隱金章𬗋綬竚期䑓閣之榮士論素期輿情共祝如某者箕裘冷族筆硯寒生二十年勞苦而末第始塵數百里﨑嶇而小官𥘉效去何速也期不待於及瓜行或使之坐寕容於煖席猶喜不才之質獲承旣治之餘自西徂東而何敢憚勞以此易彼則固巳多幸方圖趍拜遽辱緘封究觀禮意之勤益佩㤙私之厚仰攀懿躅顧續貂之媿雖多遐想髙標而覩鳳之心巳快代謝同文舘觧束書千里不嘗太學之虀塩戰藝三塲偶綴同文之龍虎齒髮類賈生之少姓名居杜牧之先揣分何堪撫心知媿竊以學者幸朝廷之偃武吾皇𣣔天下之同書思祖宗名舘之因廣華夏得人之路收拾賢関之遺士網羅聖代之棄才爲選㝡艱薦名無幾方歎蓬瀛之難到豈知樗檪之兼收如某者海角鲰生蓽門賤士業乏箕裘之素家無詩禮之傳七嵗知書頼有擇鄰之慈母三冬務學屢求觧觧之賢師技專習於雕蟲志必期於中鵠偶遇詔音之下復更科舉之條雖章句宿儒亦習凌雲之賦縦風騷大手必通拾芥之經驚䑕技之已窮取麟書而謾習欲慕武崔之馳辯不容㳺夏之措辭益加記誦之功稍悟謹嚴之㫖董仲舒潜心大業粗明一王玉川子獨抱遺經欲束三傳辤親梓里鼓篋帝都深期厠迹於何蕃庻獲授經於韓愈操矛入室對多士而氣驕血指汗顔望成均而膽落戦之罪也心實耻之雖出門無嚙臂之盟然題柱有還鄕之誓抱玉效卞和之泣焚舟起明視之慙一鼔作而再鼓衰人疑必敗小敵怯而大敵勇天使其成不煩三獻之勞輙幸一名之預㤙踰望外喜溢顔間伏遇某官炎漢相門括蒼多族馳所至有聲之譽藴無施不可之才出為五馬之貴侯来継三賢之髙躅夣草起謝公之興吹笙㝷子晋之㳺民歌愷悌之風士𬒳作成之賜遂致青衿之小子稍知黄卷之古人仰荷陶鎔偶膺薦擢某官不勉修事業早赴功名收一第於少年慰雙親於未老報天子恢儒之徳酬使君在泮之㤙嗅梅蘂於江頭早知春信折桂枝於月窟行帶天香代謝鄕觧棘闈戦藝英髦多闕里之徒貢籍標名寒賤綴卜商之列濫中披沙之選深懐負刺之慙竊以朝廷當投戈講藝之秋聖主起側席求賢之念專尚詩書之技不求鞍馬之功羽干服蠻貊之邦爼豆壓腥膻之氣賢関新闢洋洋乎東漢之風鄕飲盛行易易也成周之化旣廣育才之路載更取士之科風騷如屈宋者不廢明經儒雅若寛洪者亦兼用賦得凛凛大竒之士有多多益辯之才無一不長所施皆可斯足副有司之舉庻能為盛世之光如某者白屋寒生青衿小子夙𬒳父兄之訓獲從師友之㳺期頭角之稍踈望箕裘之必大欣遇聖旦在賈生未冠之年欲充國賔無杜甫如神之筆識陋井中之小文窺管內之班謾同孔鯉之趍庭屢作曽參之避席坐閱三嵗未通一經周誥啇盤方苦聲牙之難讀李詩謝賦尤慙篆刻之未工偶逢科詔之頒妄起賢書之應深慮畫圖之類狗何期誤墨之成蠅况東嘉號多士之躔而樂成居濵海之邑由舎法之一罷更科塲之七開寂無中選之錢咸作退飛之鷁士氣若死灰之冷江鄉類窮谷之寒人指儒冠恣成戯劇路逢鬼物剛𬒳捓􅮈誰知拜賜之孤軍俄有定從之下客三千人大敵之勇曽何敢當二十年敗北之羞粗能一雪望不及此得之若驚茲盖伏遇某官黼黻斯文權衡吾道一舉而得垂天之翼兼收而取敗皷之皮遂俾繆庸亦膺選擢某敢不勉修操履益叩淵源探皇極之猷為造中庸之門户舒牋點翰尚期一第之可收聳􅊤昻霄庻及雙親之未老上酬聖造下荅己知陞𥙷上舍謝宰相業肄賢関濫預千人之列名叨舎選媿居群俟之先嗟小人得福以非常痛私門鍾釁之何亟有稽伸謝徒切銜㤙竊以興庠序於不遑暇給之秋見聖賢相與致太平之業惟有道主能散馬牛而包干戈非大仁人孰明爼豆而闢軍旅洪惟上聖篤任真儒不求矢石之功專務衣裳之化矢其文徳雖灝灝爾噩噩爾之書無以加烝我時髦豈濟濟乎洋洋乎之世所能及自槐之之載建紛銀袍而遝来仰追唐虞之盛時祖述熈豐之故事謂科舉取士於一時也非所以造士而舍法作人於平日也斯足以得人必将試之以積累之勤故可期之以逺大之地非得行藝两全之羙曷副君相旁求之誠選旣至艱得冝無濫如某者受才猥瑣賦命窮竒齒才及壮而遽失所天仕豈𣣔干而盖縁有母輒施䑕技妄習麟經徒專記問之工莫識謹嚴之㫖不束髙閣兼取左丘明公羊髙榖梁赤之長未得羙泉姑爲啖先生趙夫予陸文通之鑿辤親故里鼓篋上庠幸厠迹於裒衣獲執經於絳帳半世僅一名之得壮心早衰匹夫獲千金之資大禍俄及未副倚門之望遽羅枕塊之憂三釡之志旣孤五鼎之心何有念孝子為親而求禄自傷無禄以及親思忠臣致主以忘身或可以身而事主退惟疇昔之僥冐實由在上之作成茲盖伏遇某官命世大才迪民先覺躬阿衡惟一之徳爲成湯自得之師靖康之節人所難紹興之政古未有旣以其身致中興之烈又将與國貽有永之謀廣闢成均兼收士類傳吾道於孟軻之後率天下為仲尼之徒二尺短檠猶念儒生之日萬間廣厦俱懽多士之顔遂致繆庸亦蒙教育某敢不益脩操履力探淵源入大匠之凖繩資哲人之鼔鑄儻離塲屋粗有進身之階仰戴陶鈞莫知報徳之所謝王大博佐某官挺天賦之才冨家傳之學短檠三載俯軰諸生丹墀萬言巍冠多士榮䖏師儒之任蔚爲庠序之光應列宿於星纏閱異書於芸省旣作鵾鵬之化尤憐燕雀之卑顧叨冐之曷因由吹嘘之有素某敢不勉精術業益勵猷爲磨鈆鈍以爲銛䇿蹇駑而睎驥雖塲屋未脫乆甘太學之虀塩儻心印可傳碩受宗盟之衣鉢昌齡弟送定葉氏家聲不振有同陳族之貧婚禮再修輒慕齊邦之大自非特逹肯遂懇求荷臭味之相忘喜葭莩之有託某以季弟某年曽有室事俄至於断絃伏承令妹徳㝡冝家志方艱於擇臠用憑媒灼妄議姻㜕荷寵命之不渝諒夙縁之非淺適契三星之候敢怠良時薄修五两之儀式将㣲意昌齡請期早沐㤙私旣遂求婚之懇再殫愚悃預聞授室之期月惟建丑之良日擇生明之次恭遣季弟躬造髙閎碩諧二姓之婚幸賜千金之諾聞詩定孫氏求婚於世姻之門夙縁非淺歸女於通家之子舊好愈敦幸無齊鄭之嫌竊比潘楊之睦約旣前定言終不渝伏承令女乃吾家之甥想不嫌舅氏之薄某男某辱東牀之選固稔知姑女之賢况庚甲之相同亦門䦨之甚偶兒時聚戯不殊同隊之魚吉卜恊從是謂和鳴之鳳有幣不腆别牋以聞囬錢氏送定早同筆硯雅敦伐木之風晚結葭莩再講通家之好雖媿崔盧之大族庻幾王謝之世姻伏承令嗣名著賢関何止通一經之學某女㓜傳姆訓僅能誦七誡之篇姑待年於父母之家願執帚於君子之室代送定萬張通家有子偶同太學之虀塩臭味為媒濫折僊源之桃李念夤縁之不淺荷翦拂之非凢旣䝉阮目之青寕媿齊邦之大伏承令姪女儒門孕秀女教傳芳想七誡之素脩諒五長之並有作配冝求於禁臠于飛寕顧於蓽門而某男某身尚白丁業惟黄卷賢異南容之不廢質同子晳之非夫妄求詠絮之才偶中牽終之選幸逢張負之賞識寕患乆貧庻幾畢萬之家風從茲必大楊李門䦨素冷生華有類於枯楊臭味本同託庇幸逢於僊李良媿鄭齊之非偶豈同夷虜之論財輙恃夤縁敢通媒介伏承令女內閑姆訓外婉婉容冝歸髙節之伯鸞肯配非夫之子晳而某弟某年雖踰冠學僅知名未能去三惑之非何以稱五長之羙仰固荷於不鄙退甚慚於匪宜旣遂碩懐之私敢伸言定之禮謹憑媒氏専叩髙閎劉賈託庇仁人之里爲幸巳多通婚大姓之門受㤙非淺喜踰望外媿溢顔間伏承令女年少甚都盖女中之賈誼而某男某天姿不慧非昔日之劉郎况三復之未能豈五長之敢稱偶預東牀之選誤䝉青眼之知吉日載涓允恊鳳凰之兆繁文盡去薄修羔鴈之儀季孫族降䑓輿有媿魯孫之後家傳簮笏雅欽楚相之風曽墻仞之莫窺豈婚姻之敢議偶因執斧遂獲牽絲某以弟某壮室偶睽勢難終於鰥䖏伏以令妹冝家素著禮尤謹於孀居絲蘿幸遂於仰攀琴瑟式諧於再御門乏陳平之車轍誤辱重知家無温嶠之鏡䑓曷将厚意旣奉千金之諾薄修五两之儀賈宋俯念寒門𣣔婚姻之早畢仰攀富族豈財利之是論受恩非凢懐媿不少某男某天姿不慧無洛陽年少之羙才令女華胄甚遥有廷芬諸子之餘習茲因瓜葛之舊碩結葭莩之私諾旣奉於千金幣敢陳扵五两錢曹女則以子娶之雅嘗有約大雖非吾偶也夫亦何嫌况弟兄之約殆三紀于兹而婚姻之謀非一夕之故端爲知巳曷嘗論財伏承令女誦七誡之章素有大家之風味而某男某叨十才之裔媿無先世之名聲選濫預扵牽絲禮輙伸扵納幣如魚同隊念两家生子之𥘉為鳳和鳴恊五世其昌之盛李季桑梓相望仰于門之素大葭莩再結荷阮目之常青雖云臭味之同亦自夤縁之幸伏承令女婉容玉潔懿徳蘭馨非求三復之南容莫稱五長之衞女某男某年丁幾冠才愧非夫方同孔鯉之趍庭遽效梁鴻之求偶質無甚秀濫爲范寗之生表不素竒媿作甘公之壻非自通家之舊豈諧擇臠之歡諾旣奉於千金媒敢通扵一介鳳飛鸞合媯姜之雅好難忘鴈徃魚来劉范之世婚不絶代囬送定周毛陳平之羙非乆貧早觀竒相義方之娶爲知巳益見髙風仰欽蚌腹之生珠俯媿葭姿之倚玉䝉㤙有自揣分何堪㐲承令嗣主簿巍奪錦標時競貪於擇臠而某女子貧修布素人或耻於采葑一言不變於前盟輿論咸嘉其髙誼辱鴈贄之良乆報鯉書而太遲曲頼厚知不誅苛禮私間素冷偶逢鳴鳯之吉占老眼濫青遂得乗龍之佳壻陳鄭鮑知慕忍敢懷請妻之私媯不如姜遂免辤婚之議兹通家之巳乆冝同氣之相求㐲蒙令嗣出自豪門素號千金之子而某女子生子敝族豈知七誡之書誤䝉合姓之求恐負宜家之責辱鴈贄之来乆媿鯉書之報遲不娶大邦公子胥善自為媒之羙願為佳耦吾宗無祠以能育之憂黃張俯慙冷族雖非叔度之清流仰援髙門誤辱偃王之華胄諒夤縁之有自荷娉問之多儀㐲承令噐早逹義方習詩禮其有自而某女子未閑姆訓奉箕帚以何堪過蒙葑菲之求重辱蘋蘩之託况鳯占之恊吉其何敢辤旣鴈幣之拜嘉永以為好陳謝門地素微濫出有媯之後裔婚姻非耦誤攀康樂之名家揣分何堪拊心知幸伏承令姪義方素習固嘗聞禮以聞詩而某女子姆訓未閑第可為絺而為綌荷菲葑之不棄獲其帛之恩親旣辱華緘仍䝉重幣其為感佩罔罄敷陳梅溪先生文集卷第十六
