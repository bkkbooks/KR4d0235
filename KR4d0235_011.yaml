body:
  text: 詩九日懷故鄉天涯行客倍傷悲鄂渚登高帽欲吹遙想弟兄行處樂幾人同把菊花枝登壓雲亭贈趙都統撙早將忠義立殊勳鄂渚登臨氣壓雲異日雲臺觀畫像要須壓盡漢將軍九日倍諸公登高鄂渚逢重九登高客魂黯白翁泛壺觴青山滿欄檻詩隨眼界添酒逐年華減回頭望楚東半雨花思范范文正公番昜詩半雨黃花秋賞早去年此日在番昜故思之鄂渚少黃花有白菊十日解舟晚泊江口望鄂渚漢陽繫纜長江口斜陽照兩州山遙瞻大别渚逺認南樓漁艇家煙浦江神廟柳州江頭有神祠在叢栁間文通送别處春恨可如秋江文通別賦送君南浦傷如之何南浦在鄂渚文南文通以春送客而豫以秋為客悲又可知解纜南浦𥘉泝長江江流出鄂渚漢陽兩山之間雲靄橫之如一山然解纜長江口回頭思黯然封疆一川隔煙靄兩州連水鳥飛沿渚江豚躍傍船好風知幾葦送我上青天過金口市江中有渚名鯉魚甲渚上有蘆花連日遇逆風舟以寸進挽舟者行蘆中成四絶江山滿眼似相迎一閧人煙問地名舟過巳經金口市水流應到石頭城鯉魚甲露江中渚蘆荻花浮渚上霜檣影落江疑是釣巨鱗驚躍鷺飛忙長江十里渺連空􅊇水那堪更􅊇風定是江神憐逺去欲吹船轉浙江東江神不借一帆風急水難收寸進功歆枕高眠真有愧挽舟人在荻花中食蝦江上秋風起魲蓴正憶家舟行良不惡日啖小魚蝦宿通濟口千里長江險舟行蘿亦驚轉磯憂浪急入沌喜波平秋老天猶燠宵長月自明洋洋通淂水何日濟歸程蘆花悲秋已過黃花節照眼渾疑白帝城更類吾家子猷棹飄然乘興雪中行蘆花兩岸風蕭瑟渺渺煙波浸秋日鷗鷺家深不見人小舟忽自花中出夜宿思湖口繫纜蘆葦間夜半聞叢中有聲舟人驚起終夕為之不寐老境殘秋路入􅍮眼中何物不關情蘆花間蓼紅依白江水歸湖濁帶清狐兔叢深應自賀魚龍穴淺巳相驚扁舟夜宿無人境展轉無眠到五更舟中作竟日舟行無一家無邉眼界只蘆花花中知有堆多少為我傳書到永嘉漢水方城以為城漢水以為池橫行江漢間楚子滅諸姬問鼎輕周室爭盟會淮夷子孫世有國地大先王時封疆六千里俯首為秦雌虎狼不可親前後幾見欺始墮張儀計卒至王翦師西風吹黃蘆疑是騷人悲宿夏郡口夜宿古夏口時維季秋半江湖猶未落煙水渺元岸左公昔屯兵仲謀方斫案助成赤壁勝坐使老賊竄壯志寧下人借地聊取亂蛟龍淂雲雨鼎足王蜀漢英雄不復見江水空汗漫兀月十五夜九月十五夜前年居故鄉雞黍修故事兄弟自范張豈知今年秋扁舟葭葦傍三日無人煙雨細風悲涼澆愁一杯酒苦語生悲腸宿高牙牢落楚天涯夔門路尚賖落帆驚宿鷺弭榜傍栖鴉有鴉千百群集于柳風伯聲喧枕漁人水浸家江神阻行色非是戀高牙兩宿亡姊之􅌾在九月而不淂其日十五日讀坡詩至英公燎須事不覺悲涕是日辛酉淂非葬日邪詩以寓哀先人六兒女姊長孝且慈德淑命不淑哀哉止於斯莫年失愛子哭泣鬢成絲年才五十七一病不可醫姊死我在傍姊􅌾吾不知𥘉聞卜九月不淂日與時丐祠既不遂臨穴竟無期日月為我昏風雨為我悲宦遊何所淂抱恨渺無涯尚餘英公須未作子厚碑某𣣔作墓志不遂便當回堆蕩那忍過秭歸秭歸縣在歸州有屈原故宅原既𬒳流放匆然暫歸原有賢姊曰女須亦歸喻令自寬離騷所謂女須之嬋媛兮是也袁嵩以為姊歸之名始于此買魚行九月既望舟遇風不敢行魚肉果𬞞之味俱無糧亦幾絶日莫聞歡譟聲有小舟破浪而來賈紅鹽魚及鮓舟人爭買之豫亦買以薦杯因作買魚行示聞詩聞禮風伯一怒聲如雷排空濁浪山崔嵬江湖千里人影絶一葉小舟何處來蘆荻花中有漁者蓑笠為衣楫為馬止將煙水作生涯紅麴鹽魚荷裏鮓舟人爭買不論錢我亦聊將薦杯􅕌烹庖入坐氣微鯹飣餖登盤色如赭但能淂趣酒杯中也勝彈鋏人門下君不見仲尼魚餒則不食陳蔡面猶含菜色又不見退之𣣔飽東海鯨馬知家有啼飢聲我居江鄉厭海味今日魚蝦八珍貴朱門日興費万錢未必一生常適意爾曺異日宦西東一飯安淂如今同寄鮓不須勞孟宗但碩清白傳家風我將歸結雞豚社不用擊鮮如陸賈但碩年豐魚米賤欣然醉飽同天下過八疊有小舟賣蝦是日風便但江岸縈迂疾徐相半舟經八疊疾還徐帆便風高水自迂要與麴生談妙理試呼漁父買長須過三義在玉沙縣界派别從金口江行過玉沙風灣迃八疊煙渚會三義桞老餘春色尊空負月華端如退之語江逺共蒹葭泛泛江漢水鄂渚上荆州泛泛江漢水縈迃知幾曲蕭瑟非一葦鄉心秋色中旅思詩篇裏雲安在何處落日天邉是宿網步時巳入夜猶行舟忽聞犬聲知有人家孤燈一點蓋漁舍也是夕有月不飲網步知何處維舟日巳昏孤燈耿漁舍一犬吠江村問境欣名復在復州界歸心幾到溫遙天有明月惜不照金尊過畢家池有姓陳者送香橙八顆云有子在太學名景𥘉有佛舍額曰永固院臨水而門閉有神祠云江南吳王廟必孫氏也甕間吏部姓名池僧舍人家傍水涯黍熟稻香俱可飯橙黃橘緑最冝詩江上人知我姓名枝頭手自摘香橙一盤來致殷勤意儂有兒為太學生江東英傑舊孫郎遺烈于今尚未忘猶有神祠枕流水一間茅屋似昭王晚過沙灘有漁舉網淂鯿魚二百餘頭橙桔正青黃以百錢買桔淂十六顆比鄉里小差而味酸漁人生計占沙洲一網鯿魚二百頭魚未到家人買盡明朝一網更盈舟地近荆州見木奴青黃照眼兩三株百錢買淂霜前顆味帶儒酸似老夫晚來諸卒競歡呼糴得香粳一斗餘拾荻為薪煮江水就船沽酒喫鯿魚舟中懷番易趙倅公懋及諸同官用九日登高韻君如别駕寵我愧淮陽黯番水偶同僚江樓屢慿檻感秋悲思多惜别剛腸減夔門嘨與諾安淂對岑范宿𬗋微在監利縣界高桞何人舍孤燈此夜舟遙從白帝去少為𬗋微晉二十一日至福田院晉建聖莭魏闕回頭逺夔門去路長万年天子夀一瓣福田香小院藏修竹柴門傍曲江繫舟楊柳岸詩句落僧窗宿金雞渡曉起雞未鳴晚宿雞鳴渡雞鳴又還起扁舟觸煙霧不作田文奔不效劉琨舞孜孜慕舜徒去去官夔府宿王家村舟行湖北路千里家在浙東天一涯宿處問名同住處梅花不見見蘆花扁舟何日到夔州巳泛荆湖半月船誤喜地名同故里欲尋鄰舍竟茫然王家又向此名村只欠青山似左原滿眼黃茅仍白葦荒蕪疑是我田園讀楚東倡酬集寄洪景廬王嘉叟預恐吾儕有别離急忙刋淂倡酬詩江東渭北何曽隔開卷無非見面時寄題番昜一江亭一江明月夜歸遲蕭灑亝中小范詩亭自我名猶未賞蘿遊江靜月明時早至魯家洑復入大江見石首山入由通濟口出自魯家洑半月良巳勞大江離又復濛濛煙雨中兩岸漁人屋遙山瞻石首鄉味思海族吾鄉石首魚秋冬間最多魚中上品也舟中記所見不向三苗境上過嶽州乃三苗故都此身端怯洞庭波浪翁未免敖牙戲漁父時為欵乃歌蟲喜年豐頻搗米鳥憂沙漲自淘河搗米淘河蟲鳥名可無好處如鄉里橘緑橙黃恨不多二十五日先妣逺忌祭于舟中有遺嗟無毋舟中遇忌辰魚𬞞當血食橙桔薦時新家比去年逺囊如舊日貧白岩山下冡歸掃擬新春夜宿下沙步有小浦藏舟于口懼有風也是夜浪忽作聲如潮舟為之撼如是者三舟人驚懼𥘉謂有風起視則天籟不號星月皎然篙工云江中畏炮炙鄰舟有煎油者岸圯而浪生曉視之果有圯處或云黿鼉之屬因記之疑向錢塘宿潮頭夜半聲油煎江岸圯舟撼蘿魂驚浪自黿鼉吐風蘆葦生江神不遷怒頃刻為吾平天晴凬順舟行過石首縣宿劉郎洑殘月照荆江晨曦浴暘谷雲收瘦山腰風順飽帆腹微茫見石首俄頃過吾目方兹驚洶湧何敢求迅速快意固可喜遲鈍或為福風乎亦難矣去順來者讟江神豈丗情吾亦不私祝豫自鄂渚登舟近兩旬淂順風才二日耳高牙遇凮雨晉兩日既而淂順風過八疊江流迃曲疾徐相半二十六日風駛甚方快之謂公安可一日到也明山如故江與風背浪洶涌停舟不行復用前韻我𣣔效元子漫浪居退谷不效楚大夫醒清葬魚腹前非戀高牙今豈嗜湖目泊舟藕池兩旬非不遲一日靡容速直為退之規韓詩此事正好為吾規寧覬塞翁福未易論乘除不須生怨讟江水照吾心冝將正辭祝舟人多焚紙錢豫笑日江神有贓邪再讀楚束集用前韻寄景盧嘉叟二子聰明曠與離一尊容我與論詩待將後集從前刻直到番昜送别時寇萊公祠公安油水江頭寇相祠凛然如坐廟堂時精忠一點不負國枯竹知公人不知宿黃壇江口維舟問地名黯然撩我故鄉情平時尚怯黃壇嶺誰遣遙臨白帝城家之南有黃壇讀于公堂記寄孫録聰伯于公治獄多隂德溫靖居朝止肉刑番水同僚溫靖後于公堂記有芬馨十月四日宿干沙市舟中惓簾忽見新月天色如水鄉思凄然淂詩一聮云詩成天作𥿄簾捲月為鈎連夕燭有花至六日家書來自臨安足成一篇寄二弟今夕果何夕章華臺畔舟詩成天作𥿄簾捲月為鈎蠟炬知何喜鄉心未免憂家書隨堆足兩月到荆州𥘉九日離南用夔州船扁舟經月泝江流又向江陵換蜀舟腸斷一聲離岸櫓不堪回首仲宣樓過虎牙天遣西來亦大竒眼中渾是少陵詩虎牙銅柱為我好却勝先生出峽時至峽州登至喜亭謁歐公祠曽於慶朔親祠范又向夷陵敬拜歐昔日四賢今見兩慨然遐想舊風流爾雅臺隱迹江山郭景純邵南有郭道山乃景純學道處學兼儒伎術通神蟲魚草木歸箋注何害其為磊落人楚塞樓黃魯直名楚國封疆六千里荆門岩巒十二背去峽州四十里有荆門山峯巒連延號荆門十二背南標銅柱北虎牙杜詩虎牙銅柱皆傾側荆門銅柱在南與虎牙相對天險城邊古西塞州南有天險城江山如故名尚存形勢雖強國何在水流三峽無古今月照孤城幾興廢吳蜀英雄空戰爭屈宋風騷謾悲慨但碩時清塞不塵樓上芳尊日相對離夷陵移舟至水西將遵陸霧甚咫尺不辨舟人失津退數里遇渡船引而至岸有山在蒙籠中乃觀音臺也過薑詩村飯士門鋪晚宿油榨有山名四面頗佳至喜亭前曉霧迷櫓聲離岸眩東西疑遊神女行雲峽忽到薑詩躍鯉溪午飯釋亭同蓐食夜眠村店類雞栖眼中四面青山好從此登天路不低飯桃花鋪宿覆盆路入桃花桃未花碧溪流水兩三家何年路接人間丗定是漁人歸去誇身在藍輿不自安更勞牽挽上天門山中亦有人問月今夜應須照覆盆肩輿登髙山以繩牽挽危甚上大望州鑽天三身到猿啼百尺頭百尺坡更言前有鶻孫愁試於大望山頭望望見人間是峽州豆子山前火墨溪迢迢一嶺與天齊肉身安淂鑽天手肝膽崔嵬自作梯宿千石聞誦書聲一嶺鑽天到此平夜眠聽淂誦書聲莫言此地名千石万石它年或可名枕上聞鼓角五更枕上蘿還醒𥘉聽夔州鼓角聲悲壯端如少陵語它時送我更多情過九盤嶺水不經三峽山猶過九盤𢾗家修竹裏堪入畫圖看飯周平鋪南北山峯巒皆竒有佛頂峯鯉魚岩羅漢洞又曰仙居洞説者謂類巫山遇雨為雲霧所蔽不盡見未見巫山十二峯人言山與此山同定知神女藏深處正在朝雲莫雨中至歸州宿報恩寺終夜江聲枕上喧子規未呌已銷魂身乘篳路思熊繹詞誦離騷弔屈原城邑舊為夔子國民人多是楚王孫誤恩分閫方啚報宿豦那堪是報恩題屈原廟自古皆有死先生死忠清故宅秭歸江前山㷱繹城眷言懷此都不比異姓卿六經變離騷日月爭光明過秭歸晚日寒天過秭歸江山點點上愁眉况經宋玉悲秋處不獨秋悲冬亦悲宋玉宅今為秭歸縣治二十四日視帥印于歸大拽鋪大拽名何壯孤峯勢更巍拜恩羅吏卒列炬照煙霏分閫來魚復懷鄉過秭歸石門觀峽水東注疾如飛宿巴東縣懷寇忠愍製錦工夫早不同至今人道冦巴東澶淵一假竒功業可在孤舟野水中堂前雙柏今何在渡口孤舟依舊橫不似公安插竹處凛然容貌尚如生比過公安謁萊公祠蓋枯竹再生處也巴東祠廢可謂缺典因成二絶以示邑官𥘉入巫山界登羅護關雲霧晦冥默禱之因成一絶西來水陸備艱辛秖為君恩不為身為向巫山神女道莫將雲霧惱行人霧開復成一絶關登羅護飯郵亭雲霧迷人晝晦冥神女有靈呼即應廓然山色為吾青登得勝岡謁武安王關雲長廟有泉一泓俗傳謂兵至此無水拔刀刺地泉隨而湧廟西有磨刀溪北有晒甲崖淂勝名岡蜀虎臣氣吞吳魏尖防身磨刀晒甲遺蹤在英魄猶能敵万人過風口望巫峽岩嶂如堆山祥雲峯經行峽煙霞障十二巫山鎖白雲岩如堆蕩列江濱誰名雁蕩經行峽定是經行峽裏人登燕子坡前有一岩在江之旁如天台赤城名烏飛岩坡名燕子燕思歸岩號烏飛烏倦飛雲本無心聊出岫風緣有口故吹衣風口行雲皆巫山地名巴東之西近江有夫子洞亦曰聖洞巫山縣有孔子泉説者謂旱而祈則應泉旁之民雖童子皆能書夫子胡為洞於此且有泉耶詩以辨之夫子道不行嘗欲居九夷乘桴浮于海從者其為誰歷聘嘗之荆豈亦遊坤維有洞巴峽間人言幽更竒雲深不可見奧處那容窺聖人肯巢仙兹名良可疑吾道其非耶聊將友鹿麋巫山亦有泉可飲仍可祈泉旁都幾家聰慧多竒兒父兄儻知教聖門皆可歸我來不及飲清興隨泉飛寧比盜與貪聞名使人嗤禹穴會稽隂堯山番江湄流傳雖失真未敢以為非魯人輕東家秦人燔書詩兹俗聖夫子吾何敢夷之自鄂渚至夔府途中記所見一百十韻流火郡離饒悠悠驛路迢黃華舟解鄂渺渺大江遙七月九日離番昜九月十日自鄂者易舟肩弛番人簷是日遣送還人回身隨楚客橈東甌鄉蘿逺南浦别魂銷不過漢陽壘猶勞郡守軺逺山看八字古國避三苗别水由通濟羇帆渡沉漻方隨鷗浩蕩俄值雨飄颻夾岸華疑雪㫪天浪似潮枝栖並烏鵲苕宿伴䳡鷯旅思慿詩遣愁腸賴酒澆無魚不彈鋏忘味若聞韶孺子滄浪曲漁人欵乃謡逃虛音可喜淂雋語同囂秋老江經夏湖平境過宵夜鳴疑有虎昏吠喜聞獢遺俗懷吳主荒祠類楚昭巨鱗烹縮項白粲糴長腰茅舍桔𥘉熟江村楓未凋栁枝猶楚楚竹淚尚思姚雨後禾收晚霜前麥見蕎風清玉沙界月吐𬗋微宵一瓣香聞佛千齡夀祝堯沱潛終共道江漢訖同朝渡口聽雞唱洲邊記鷺翹地名思故里詩句憶同僚塔子瞻山色天門認斗杓航便河廣葦風順若邪樵石首欣相問劉郎似見招雙帆方快意五兩忽狂飊誰弄黃昏笛如聞赤壁簘孤煙為藕市一葉是漁舠江水澄泥煮蘆薪帶􅊜燒蘿回驚枕撼曉起覺風調𬞞擷才盈握魚䐹莫計艘橫波沉密網巨浪脫高跳紅想鄉醪滑黃看野菊嬌左公城穴兔油口樹喑蜩水是蛟龍地桑餘羽葆條竹由忠愍插木自洞庭漂大士精藍壯將軍畫像驍江空無戰艦水落有乘橇促織蟲知備淘河鳥受徭風高鳴過堆天闊戾飛雕雲蘿封疆逺荆衡氣象遼建都曽王楚為郡自平蕭息壤那容盜章臺可戒驕韓詩誇府大漢史志民僄燕集堂開𣏌笙歌樂舞逍樓登一日暇賦就百憂消落帽觀成阻遊山興謾飄書隨鱗出峽詩附翼還鄡離岸忽鳴櫓滿艘仍豎幖栖窗回蜥蝪撲面集蠨蛸沙市人家逺方城草色葽食梨蘇胅渴啜茗愈頭痟覆屋曽非瓦名村浪有窰枝江縣羅國鳬舄揚王喬百里環洲渚千家在葦苕津卿誰復禦松邑已非僑漢景餘清爽臨江尚廟祧轉灘驚見石挽繂眩飛艻澎湃聲如擊玲瓏狀似雕松楸悲相冡香火靜僧寮轉盻冝都過橫雲楚塞嶠虎牙端欲噬銅柱為誰標月向夷陵看杯思太白邀文忠遺徑莭精采凛生綃岩白形如鷂魚黃狀類䖺邦人祀神禹郭璞當臯陶舟退風飛鷁生浮旅泛薸鯉溪穿犖確牛峽隔岧嶤孝起薑村感音傳進足趫山家收芋栗土物貢薑椒澗水何曽歇桃花未肯夭覆盆鳴鹿友絶壁聚狐妖野媪頭纒白行人背負鐐回看一州峽下視衆山么障日峯銜豆鑽天石礙轎道逢懷刺禰卧聽誦書鼂𬒳冷公孫布裘寒季子貂猶堪耐氷雪未暇憶炎歊倦上九盤嶺重觀三峽橋好峯名佛頂欲畫少僧繇照黑紛持火愁荒猛擊刀流虹瞻魏闕瑞白慶清朝國夀綿箕翼皇啚奕誦釗歡聲形戴白環視舞垂髫避涉憂如馬觀形怯類貓眼經峽險心過秭歸焦㷱繹山城古靈均廟貌憔隨梗斷鄉思為梅撩境始臨夔府魂頻蘿象簫輕生甘叱馭受物戒揚鑣帥閫分誠濫州麾把更僥拜恩羅吏卒列炬散鳶鶚野渡水清淺孤舟人寂寥影防沙有􅈮音駭晝聞梟聖洞雲深鎖天池浪不搖林梢鳴烈烈峯頂灑瀌瀌快覩天披霧愁聽夜滴蕉陽臺開愛日隂氣廓玄枵六六盤𥘉過三三界已超生朝念弧矢旅食分簞瓢遐想賦風王敬瞻行雨瑶過關寧有鬼及郭免逢魈訪古尋詩史觀風入郡譙路難端可畏形後尚奚勞行也知誰使官乎我亦聊欲賡劉與杜辭鄙甚芻蕘梅溪先生後集卷第十一梅溪先生文集卷第十一賦雙瀑賦王子遊簫峯之下訪鼻祖於仙籍駐杖屨於金溪觀雙瀑之千尺于時驟雨𥘉歇飄風迅擊飛泉洶湧怒流湍激噴煙霧於蒼嵐吼龍於大澤澤百川震而澎湃萬類紛其辟昜疑若傾崖轉壑變丘谷而為陵又類萬馬千兵奏鼓鼙而赴敵久之狂潦微殺巨流順適靈源復尋於故道雙沠交馳於絶脊勢偶殊而卒合路雖分而稍迫王筯垂兮拂輕寒長紳拖兮蘸深碧疑若鯨鯢鬬怒兮力未決而方酣干鏌爭鋒兮光交騰而互射嗟天匠之施巧兮作勝事於泉石顧一沠之罕有兮豈雙流之昜得不見夫銀河落於半天兮破廬阜之山色梅雨飛於石門兮敞芝田之靈迹潭千丈於石橋兮渺仙几之路隔龍雨湫於雁蕩兮分大小而異宅彼獨溜而孤飛兮猶擅名於今昔况並峙而爭流兮作人間之連璧吾𣣔窮千里之源兮問化工之始闢思漢使之不復見兮悵靈槎之難覔獨終日而登臨兮寄吾懷於幽寂興雖盡而忘歸兮猶待乎風清而月白於是目瞬飛流之末耳洗寒潭之側思往事之微茫仰遺風而嘆息竈中煙冷難尋入竹之人峯頂臺荒不見吹簫之客賦罷乃歌而歸曰雙瀑之水從何來靈源千尺髙崔嵬飛流噴沫飄瓊瑰空山落日鳴春雷有客來逰獨徘徊枕流嗽石興悠哉塵襟濯罷飄然回風清月白空簫臺至樂齋賦并引豫讀歐陽詩有至哉天下樂終日在書案之句因採其語以名齋又從而賦之豫與客坐于書齋之內客仰而顧俯而笑曰子知天下之樂乎散于事物之萬端會于窮逹之兩途然皆有窮焉吾言而子聽諸髙車駟馬腰金曵組前者呵後者衛士之得志于當時者之樂也然有時而厭焉前日朝廷之士扁舟去而煙浪深也枕流嗽石吟風嘯月採于山緍于泉土之無永于世者之樂也然有時而改焉前日山林之士蕙帳空而猿鶴驚也豫曰子之言皆外物之樂也樂故有窮烏知天下有所謂無窮之至樂哉一簞食一瓢飲顔回之樂也宅一區田一㕓楊雄之樂也是固無心于軒冕亦不放志于山林得乎內而樂乎道也吾今遊心于一齋之內適意乎黃卷之中師顔回友楊雄逰于斯息于斯天下之至樂也又烏得而能窮歸去來賦歸去來兮終日思歸今巳歸嗟連歲之行役兮誤甘旨之屢違身雖處于異鄉兮念長在于庭闈陟髙岡而東望兮悵白雲之孤飛食虀鹽而無味兮悟蝸角之真非泛季卿之竹䈎兮詠晨光之熹微辰未浹而到家兮指青燈而扣扉粲慈顔一笑兮兮紛稚子之牽衣雖吾歸之不若人兮不能衣錦而乘肥吾將以此而昜彼兮學何蕃其庶幾梅溪題名賦并引吾徒宋孝先李大鼎作梅溪庚午多士賦敘一堂八齋六十人名字而鋪陳條列三百六十字之中中言簡意盡有足觀者陳元佐萬孝傑童侃又作梅溪多士賦通前後八年間凡一百二十人而併列之文工而事益詳豫于是採二賦之餘意變聲律而古之先美後規效古人勸諷之旨非敢以文戲也目曰梅溪題名賦余闢館于梅溪兮嵗甫及乎夢齡余弟夀朋字夢齡書館之闢今八年矣故借夢九齡以喻意自淵獻而逮乎敦斨兮頃十朋而今百朋某余名百朋豫季弟昌齡名豫癸亥秋闢館聚徒遊從者十人至庚午歲通數之凡一百二十二人齋敞八而堂虛一兮咸與賢而與能謝與賢簡之與能任之余宗旦而罔有一德兮余宗旦仲阜賈稱一德敢不希仲舒之明經陳元佐希仲幸諸友能祖説之遜志兮張祖説文孺鄭遜志時敏又恪希顔回之服膺陳恪叔恭林次淵希顔乃有汾晉五士羅士能少陸謝士竒文美士龍漢臣連士表少華季士宏宏老昔晉文公五士故曰汾晉五士漢唐群英張次房漢英孫元齡唐英李杞亦字唐英鄭國七子張仲逺子猷周孝友子施孝顯字揚孝思子則濬子深王淳張載並字厚春秋秋鄭七子賦詩涼州三明劉玄德明夫萬序明之余如晦明叟後漢有涼州三明器成三足之鼎李大鼎鎮夫郜鼎叔鎮萬鼎鎮逺才冝九佐之卿萬澄清卿童偉俊卿侃文卿宋孝先舜卿林湯臣啇卿陳朝揆正卿施良臣名卿陳光朝臺卿林叔舉虞卿有一瑞兮沖逺之鶚賈修一瑞劉鶚沖逺有千里兮圗南之鵬周千里百駒謝鵬啚南莫不端武升堂蔡端武威仲敦詩趍庭劉詩溫夫如璧之瑩余璧全之如芷之馨玉芷茂之如㮤之茂葉㮤茂正如椿之靈萬椿楊椿並字大年如楩楠之美萬楩永年楠億年揚楠元幹如松梓之青萬松喬年休梓材叔森乎如鉞之可畏劉載通逹轟乎如震之可驚周震景束皎乎如海嶠之吐明月蔣嶠景山耿乎如長庚之輝衆星李庚少白昻昻乎如季梁之梗概萬孝傑季梁陳昻仲昂孜孜乎衛伯玉之老成潘孜元善劉闕伯玉可居天任而澤逺趙公倚天任揚寓澤逺可為王佐而揚庭王佐才仲陳獻可揚庭可起傅巖之築劉傳岩叟可同舜佐之登謝臯羽舜佐憲一夔而樂作連憲民式周次鳳一夔炳伯虎而文興賈炳作德夏伯虎用之肇輝先之德業陳肇德遠許輝先光甫諧興祖之家聲余諧孝仲姚紹宗興祖汝文兮冝月選而季詮何鐸汝文季詮仲言汝弼兮必類進而方升陳舜咨汝弼方升中髙逖矣乎王逖正矣有來二客業彼管城橫陽許武子龍泉管叔竒來客梅溪以篆字題名名列甲乙字篆丙丁丙子謂篆字也見爾雅如翼斯飛吳翼季南如璘斯熒王璘德夫燦銀鈎與玉筯􅌂壁上之題名吾徒之秀乃有詞賦兮少雲之作朱少雲吉作太原之老乃變聲律兮祖舜之賡陳少虞祖舜于是闡大猷而溥告之曰李大猷定夫孫溥德廣林溥叔廣學必剖藩籬而克已終克巳兼夫道必舍蹊徑而中行將中行謙仲先之以孝忱之意萬庚先之曾來會課亦與題名朱孝忱伯恂申之以敦信之誠萬庠中之劉信信叟禮𣣔安上兮必先自治林安上世仁𣣔及逺兮慎母自矜林取仁及逺湛萬頃以窺憲黃萬頃伯厚葉頃澄叟妙一唯之悟曽塢一唯仁叟祖伊尹畎畝之樂許祖伊次尹振仲尼文教之鳴陳之紀振仲玩蒙亨之爻象李蒙亨彥通俟泰來而彚征萬康泰之勿務世華而起文通之附夏伯文世華劉文通叔逹唐陸淳諡文通先生栁子厚嘗𣣔掃其門然陸亦附王叔文者勿求必逹而貪季孫之榮張必逹邦彥劉祖漢季孫窮則隱居吳隱若靖翁逹斯大亨徐大亨顯仲凡百君子母渝此盟止庵銘叔父寶印講師築止庵以居姪某銘曰學者求道如客在途不有所止將安歸乎大學之道在于知止意正心誠乃悟斯理孔門髙第回也獨賢未見其止夫子惜焉庵中道人由儒入佛進於有為止于無物𣣔知止處是亦難言非內非外亦非中間道人失笑汝言亦綺道本無進亦何有止道無進止庵無成壞孰知此庵中含法界甕庵銘豫目黃楊為甕庵因銘之曰圑圑甕庵自天生植匪陶匪鎔匪塗匪飾百幹輪囷匠非斧斤萬葉敷披覆以琉璃天牖玲瓏透日含風我非原憲物異名同濃隂酒緑春色杯深我非畢卓意自酣沉孰云此庵人不可住我以意遊形骸曷預孰云此庵飛禽所巢此意彼形了不相殽孰云此庵風燥雨濕我意潛住風雨莫及以形住庵如繭裏蠶茍得其趣何所不堪此庵此意聊復爾耳孰非吾廬亦何必此會趣堂燈銘長檠髙燃不照青編短檠自對不照同輩孰若此燈巍標一堂與爾多士同分厥光無囊爾螢無燭爾雪清夜紅紗滿堂明月凡我同志勉思六經趣與心會無孤此燈止堂情話室銘南浦陳臺卿取大學之義以名堂採陶淵明之賦以名室命梅溪王某銘之銘曰金玉滿堂不以名堂彼外物兮非可常大學之道在于知止子以銘堂端有旨止匪易知匪難知反求諸身非逺而正子心兮誠子意定應不離方寸地右止堂情之所鍾正在我輩况于親戚又情之最親戚之話苟不情將烏乎用其情獨不見夫陳子之入是室兮無話不情非情不話顔津津兮常自快願子擴親戚之情意均此話于踈外則四海之內皆兄弟其為恱也尤大右情話室書几銘是惟王子之几至哉之樂在乎是厨銘是惟王子之厨中藏吾書吾腹不如書銘是惟王子之書惟其不勤是以空虗筆銘是惟王子之筆爾心有盡時吾用無窮日墨銘是惟王子之墨于以稼穡客卿之德𥿄銘是惟王子之𥿄吾不善書慁爾多矣硯銘是惟王子之硯出入廣埸兮經百戰硯匣銘啓焉斯磨蓋焉斯藏匣爾陶泓器吾文房筆池銘直方其形兮泓其中滌毛頴兮爾之功簡板銘斫之平如漆之明如札之盈如潔之瑩如母枯剡藤惟爾之書粘板銘千里面目曰書簡函而封之斯致逺代卓受垢而不辭者是惟粘板界方銘心正筆正亦惟爾有以相其正界筆銘中書君老而秃棄之則可惜取其心之猶可用以小管城為之宅吾𣣔寫盡天下書賴爾為之畫䇿詩筒銘我腹空虗兮好斐然而成章爾腹空洞兮冝為吾之錦囊書筒銘交遊解散兮書不可巳爾為魚鴈兮通面目于千里鏡銘是惟王子之鏡勿病乎面目可憎而取乎衣冠可正燈銘是惟王子之燈燒膏繼晷惟汝能香爐銘匪金匪玉銅姿瓦質以爾馨德在吾蘭室印斗銘器髹而光斗形而方孰鐫賤名于是乎藏扇銘無仁風兮可揚惟篋中兮是藏肩輿銘我僕既餐我輿斯肩我將何之必故必親豈無公門經歲弗入豈無權門足未嘗及肅爾徒御慎吾往還惟分之安肩輿斯安菖蒲盂銘叔父寶印講師之贈也銘以記之伊巧匠兮斫山骨刳其中兮方其質擎湖嵌兮隱蘭若根王衡兮灌天一從何來兮叔贈姪真情流兮冝在吾室國朝名臣贊寇萊公嗚呼菜公相我真宗契丹南牧朝野洶洶群臣勸帝幸蜀江東微公決䇿天下其戎百年無兵繄誰之功韓魏公巍巍韓公文武兼資相我三宗身任安危周勃定䇿霍光受遺古社稷臣公實有之非我仁祖其孰能知范文正公堂堂范公人中之龍正色立朝姦邪不容材兼文武躬履仁義出捋入相十才一試真王佐才用之未至冨鄭公巖巖冨公仁者之勇危言折虜神色不恕公在使車虜不敢動公在相位四夷稽顙出入三朝為國輕重杜祁公維正獻公相我仁宗公在相位私謁不容苞苴不通非道不從封還內降與權幸抗公忠直亮清白宰相歐陽文忠公賢哉文忠直道大節知進知退既明且哲陸贄議論韓愈文章李杜歌詩公無不長當世大儒邦家之光文潞公太師潞公勳髙業隆四朝元老福祿始終元祐之𥘉太后臨極起公于洛平章軍國夷狄來朝服公之德趙清獻公於維清獻典天之憲人呼鐡面彂姦紏慝以正王國古之遺直吳蜀父老語之流涕公之治民古之遺愛司馬溫公宋二百年名臣輩出孰為第一咸曰君實田夫野老識其遺風至今猶語司馬相公以手加額涕泗亡從蘇東坡東坡文章百世之師群邪所仇斂不及施萬里南遷而氣不衰我讀公文慕其所為碩為執鞭恨不同時蘇頴濱賢哉子由賢哉子由忠言嘉謀聳動冕旒橫身政府不避怨仇棣蕚聮芳皆第一流才不逮兄器識俱優陳了翁賢哉瑩中賢哉瑩中鶚立兩朝凛乎清風二蔡嘯凶飾姦為忠黨與雷同牢不可攻公獨仇之折其姦鋒孤立不容身以譴終公乎不忘名等岱嵩梅溪先生文集卷第十一
