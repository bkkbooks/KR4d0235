body:
  text: 詩九日懐故鄉天涯行客倍傷悲鄂渚登高㡌欲吹遥想弟兄行処楽㡬人同把菊花枝登壓雲亭贈趙都統撙早将忠義立殊勲鄂渚登臨氣壓雲異日雲㙜觀畫像要湏壓盡漢将軍九日倍諸公登高鄂渚逢重九登高客䰟黯白翁泛壺觴青山滿欄檻詩随眼界添酒逐年華减回頭望楚東半雨花思范范文正公番昜詩半雨黄花秋賞早去年此日在番昜故思之鄂渚少黄花有白菊十日觧舟晚泊江口望鄂渚漢陽繋䌫長江口斜陽照兩州山遥瞻大别渚逺認南楼渔艇家烟浦江神庙柳州江頭有神祠在叢栁間文通送别処春恨可如秋江文通別賦送君南浦傷如之何南浦在鄂渚文南文通以春送客而予以秋爲客悲又可知觧䌫南浦𥘉泝長江江流出鄂渚漢陽兩山之間雲靄横之如一山然觧䌫長江口回頭思黯然封疆一川隔烟靄兩州連水鳥飛㳂渚江豚躍傍舡好風知㡬葦送我上青天過金口市江中有渚名鯉魚甲渚上有芦花連日遇逆風舟以寸進挽舟者行芦中成四絶江山滿眼似相迎一閧人烟問地名舟過巳經金口市水流應到石頭城鯉魚甲露江中渚芦荻花浮渚上霜檣影落江疑是釣巨鱗驚躍鷺飛忙長江十里渺連空􅊇水那堪更􅊇風定是江神憐逺去欲吹舡轉浙江東江神不借一㠶風急水難収寸進功歆枕高眠真有媿挽舟人在荻花中食蝦江上秋風起魲蓴正憶家舟行良不惡日啖小魚蝦宿通濟口千里長江險舟行萝亦驚轉磯憂浪急入沌喜波平秋老天猶燠宵長月自明洋洋通淂水何日済帰程芦花悲秋已過黄花節照眼渾疑白帝城更類吾家子猷棹飄然乗㒷雪中行芦花兩岸風䔥瑟渺渺烟波浸秋日鷗鷺家深不見人小舟忽自花中出夜宿思湖口繋䌫芦葦間夜半聞叢中有声舟人驚起终夕為之不寐老境殘秋路入􅍮眼中何物不関情芦花間蓼紅依白江水帰湖濁帶清狐兎叢深應自賀鱼龍穴淺巳相驚扁舟夜宿无人境展轉无眠到五更舟中作竟日舟行无一家无邉眼界只芦花花中知有㕍多少為我傳書到永嘉漢水方城以為城漢水以為池横行江漢間楚子㓕諸姬問鼎輕周室争盟㑹淮夷子孫世有囯地大先王時封疆六千里俛首為秦雌虎狼不可親前後幾見欺始堕張儀計卒至王翦師西風吹黄芦疑是騷人悲宿夏郡口夜宿古夏口時維季秋半江湖猶未落烟水渺元岸左公昔屯兵仲謀方斫案助成赤壁勝坐使老賊竄壮志寕下人借地聊取乱蛟龍淂雲雨鼎足王蜀漢英雄不復見江水空汗漫兀月十五夜九月十五夜前年居故鄉雞黍修故事兄弟自范張豈知今年秋扁舟葭葦傍三日无人烟雨細風悲凉澆愁一杯酒苦語生悲腸宿高牙牢落楚天涯䕫門路尚賖落㠶驚宿鷺弭榜傍栖鴉有鴉千百群集于柳風伯声喧枕渔人水浸家江神阻行色非是恋高牙兩宿亡姊之􅌾在九月而不淂其日十五日讀坡詩至英公燎須事不斍悲涕是日辛酉淂非塟日邪詩以寓哀先人六児女姊長孝且慈徳㳤命不㳤哀哉止於斯莫年失爱子哭泣鬂成絲年纔五十七一病不可醫姊死我在傍姊􅌾吾不知𥘉聞卜九月不淂日与時丐祠既不遂臨穴竟无期日月為我昏風雨為我悲宦㳺何所淂抱恨渺无涯尚餘英公須未作子厚碑某𣣔作墓志不遂便當回㕍蕩那忍過秭帰秭帰縣在帰州有屈原故宅原既𬒳流放怱然暫帰原有賢姊曰女須亦帰喻令自寛离騒所謂女湏之婵媛兮是也袁崧以為姊帰之名始扵此買魚行九月既望舟遇風不敢行魚肉果𬞞之味俱无粮亦㡬絶日莫聞讙譟声有小舟破浪而来賈紅塩魚及鮓舟人争買之予亦買以薦杯因作買魚行示聞詩聞禮風伯一怒声如雷排空濁浪山崔嵬江湖千里人影絶一葉小舟何処来芦荻花中有渔者蓑笠為衣楫為馬止将烟水作生涯紅麹塩魚荷裏鮓舟人争買不論錢我亦聊将薦杯􅕌烹庖入坐氣㣲鯹飣餖登盤色如赭但䏻淂趣酒杯中也勝弹鋏人門下君不見仲尼魚餒則不食陳蔡面猶含菜色又不見退之𣣔飽東海鯨馬知家有啼飢声我居江鄉厭海味今日魚蝦八珎貴朱門日㒷費万錢未必一生常適意尔曺異日宦西東一飯安淂如今同寄鮓不湏劳孟宗但碩清白傳家風我将帰結雞豚社不用擊鲜如陸賈但碩年豊魚米賤欣然醉飽同天下過八疊有小舟賣蝦是日風便但江岸萦迂疾徐相半舟經八疊疾还徐㠶便風高水自迂要与麹生談妙理試呼渔父買長須過三义在玉沙縣界派别從金口江行過玉沙風湾迃八疊烟渚㑹三义桞老餘春色尊空負月華端如退之語江逺共蒹葭泛泛江漢水鄂渚上荆州泛泛江漢水縈迃知幾曲䔥瑟非一葦鄉心秋色中旅思詩篇裏雲安在何処落日天邉是宿網歩時巳入夜猶行舟忽聞犬声知有人家孤灯一點盖渔舎也是夕有月不飲網歩知何処維舟日巳昬孤灯耿渔舎一犬吠江村問境欣名復在復州界帰心㡬到温遥天有明月惜不照金尊過畢家池有姓陳者送香橙八顆云有子在太斈名景𥘉有佛舎額曰永固院臨水而門閉有神祠云江南吳王廟必孫氏也甕間吏部姓名池僧舎人家傍水涯黍熟稲香俱可飯橙黄橘緑㝡冝詩江上人知我姓名枝頭手自摘香橙一盤来致殷勤意儂有児為太斈生江東英傑旧孫郎遺烈于今尚未忘猶有神祠枕流水一間茅屋佀昭王晚過沙灘有渔㪯網淂鯿魚二百餘頭橙桔正青黄以百錢買桔淂十六顆比鄉里小差而味酸渔人生計占沙洲一網鯿鱼二百頭魚未到家人買盡明朝一網更盈舟地近荆州見木奴青黄照眼两三株百錢買淂霜前顆味帶儒酸似老夫晚来諸卒競歡呼籴得香粳一斗餘拾荻為薪煮江水就舡沽酒喫鳊鱼舟中懐番易趙倅公懋及諸同官用九日登高韵君如别駕寵我媿淮陽黯番水偶同僚江楼屡慿檻感秋悲思多惜别剛腸减䕫門嘨与諾安淂對岑范宿𬗋㣲在監利縣界高桞何人舍孤灯此夜舟遥從白帝去少為𬗋㣲晋二十一日至福田院晋建聖莭魏闕回頭逺䕫門去路長万年天子夀一瓣福田香小院蔵脩竹柴門傍曲江繋舟楊柳岸詩句落僧窻宿金雞渡曉起雞未鳴晚宿雞鳴渡雞鳴又還起扁舟觸烟霧不作田文奔不効刘琨舞孜孜慕舜徒去去官䕫府宿王家村舟行湖北路千里家在浙東天一涯宿処問名同住処梅花不見見芦花扁舟何日到䕫州巳泛荆湖半月舡誤喜地名同故里欲㝷鄰舎竟茫然王家又向此名村只欠青山佀左原滿眼黄茅仍白葦荒蕪疑是我田園讀楚東倡詶集寄洪景庐王嘉叟預恐吾儕有别离急忙刋淂倡詶詩江東渭北何曽隔開卷无非見面時寄題番昜一江亭一江明月夜帰遟蕭洒亝中小范詩亭自我名猶未賞萝㳺江静月明時早至魯家洑復入大江見石首山入由通済口出自魯家洑半月良巳劳大江离又復濛濛烟雨中兩岸渔人屋遥山瞻石首鄉味思海族吾鄉石首魚秋冬間㝡多鱼中上品也舟中記所見不向三苗境上過岳州乃三苗故都此身端怯洞庭波浪翁未免敖牙戯渔父時爲欵乃歌䖝喜年豊頻擣米鳥憂沙漲自淘河擣米淘河䖝鳥名可无好処如鄉里橘緑橙黄恨不多二十五日先妣逺忌祭于舟中有遺嗟無毋舟中遇忌辰鱼𬞞當血食橙桔薦時新家比去年逺嚢如旧日貧白岩山下冡帰掃擬新春夜宿下沙歩有小浦蔵舟于口惧有風也是夜浪忽作声如潮舟爲之撼如是者三舟人驚惧𥘉謂有風起視則天籟不號星月皎然篙工云江中畏炮炙鄰舟有煎油者岸圯而浪生曉視之果有圯処或云黿鼉之属因記之疑向錢塘宿潮頭夜半声油煎江岸圯舟撼萝魂驚浪自鼋鼍吐風芦葦生江神不遷怒頃刻為吾平天晴凬順舟行過石首縣宿刘郎洑殘月照荆江晨㬢浴暘谷雲收瘦山腰風順飽㠶腹㣲茫見石首俄頃過吾目方兹驚洶湧何敢求迅速快意固可喜遟鈍或為福風乎亦难矣去順来者讟江神豈丗情吾亦不私祝予自鄂渚登舟近兩旬淂順風纔二日耳高牙遇凮雨晋兩日既而淂順風過八疊江流迃曲疾徐相半二十六日風駛甚方快之謂公安可一日到也明山如故江與風背浪洶涌停舟不行復用前韵我𣣔効元子漫浪居退谷不效楚大夫醒清葬魚腹前非恋高牙今豈嗜湖目泊舟藕池兩旬非不遟一日靡容速直為退之規韓詩此事正好為吾規寕覬塞翁福未易論乗除不須生怨讟江水照吾心冝将正辞祝舟人多焚纸錢予笑日江神有賍邪再讀楚束集用前韵寄景盧嘉叟二子聦明曠與離一尊容我与論詩待将後集從前刻直到番昜送别時㓂莱公祠公安油水江頭㓂相祠凛然如坐廟堂時精忠一點不負囯枯竹知公人不知宿黄壇江口維舟問地名黯然撩我故鄉情平時尚怯黄壇嶺誰遣遥臨白帝城家之南有黄壇讀于公堂記寄孫録聦伯于公治獄多隂徳温靖居朝止肉刑番水同僚温靖後于公堂記有芬馨十月四日宿干沙市舟中惓簾忽見新月天色如水郷思凄然淂詩一聮云詩成天作𥿄簾捲月為鈎連夕燭有花至六日家書来自臨安足成一篇寄二弟今夕果何夕章華䑓畔舟詩成天作𥿄簾捲月為鈎蠟炬知何喜鄉心未免憂家書随㕍足兩月到荆州𥘉九日離南用䕫州舡扁舟經月泝江流又向江陵換蜀舟腸断一声离岸橹不堪回首仲宣楼過虎牙天遣西来亦大竒眼中渾是少陵詩虎牙銅柱為我好却勝先生出峽時至峽州登至喜亭謁歐公祠曽於慶朔親祠范又向夷陵敬拜歐昔日四賢今見兩慨然遐想旧風流爾雅䑓隱迹江山郭景純邵南有郭道山乃景純斈道䖏學兼儒伎術通神䖝魚草木帰箋注何害其為磊落人楚塞楼黄魯直名楚囯封疆六千里荆門岩峦十二背去峡州四十里有荆門山峯峦連延号荆門十二背南標銅柱北虎牙杜詩虎牙銅柱皆傾側荆門銅柱在南与虎牙相對天險城邊古西塞州南有天險城江山如故名尚存形勢雖強囯何在水流三峽无古今月照孤城㡬㒷廢呉蜀英雄空戦争屈宋風騷謾悲慨但碩時清塞不塵楼上芳尊日相對离夷陵移舟至水西将遵陸霧甚咫尺不辨舟人失津退数里遇渡舡引而至岸有山在蒙籠中乃觀音㙜也過姜詩村飯士門鋪晚宿油榨有山名四面頗佳至喜亭前曉霧迷橹声离岸眩東西疑㳺神女行雲峡忽到姜詩躍鯉溪午飯釋亭同蓐食夜眠村店類雞栖眼中四面青山好從此登天路不低飯桃花鋪宿覆盆路入桃花桃未花碧溪流水兩三家何年路接人間丗定是漁人帰去誇身在藍輿不自安更勞牽挽上天門山中亦有人問月今夜應湏照覆盆肩輿登髙山以䋲牽挽危甚上大望州鑚天三身到猿啼百尺頭百尺坡更言前有鶻孫愁試於大望山頭望望見人間是峽州豆子山前火墨溪迢迢一嶺与天齊肉身安淂鑚天手肝膽崔嵬自作梯宿千石聞誦書声一嶺鑚天到此平夜眠聴淂誦書声莫言此地名千石万石它年或可名枕上聞鼓角五更枕上萝還醒𥘉听䕫州鼓角声悲壮端如少陵語它時送我更多情過九盤嶺水不經三峽山猶過九盤𢾗家修竹裏堪入畫圖看飯周平鋪南北山峯峦皆竒有佛頂峯鯉魚岩羅漢洞又曰仙居洞說者謂類巫山遇雨為雲霧所蔽不盡見未見巫山十二峯人言山与此山同定知神女蔵深䖏正在朝雲莫雨中至帰州宿報恩寺終夜江声枕上喧子規未呌已銷魂身乗篳路思熊繹詞誦離騷弔屈原城邑舊爲夔子囯民人多是楚王孫誤恩分閫方啚報宿豦那堪是報㤙題屈原廟自古皆有死先生死忠清故宅秭帰江前山㷱繹城眷言懐此都不比異姓卿六經变離騷日月争光明過秭帰晩日寒天過秭帰江山點點上愁眉况經宋玉悲秋䖏不獨秋悲冬亦悲宋玉宅今為秭帰縣治二十四日視帥印于帰大拽鋪大拽名何壮孤峯勢更巍拜㤙羅吏卒列炬照烟霏分閫来魚復懐鄉過秭帰石門觀峡水東注疾如飛宿巴東縣懐㓂忠愍製錦工夫早不同至今人道冦巴東澶渊一叚竒功業可在孤舟野水中堂前双栢今何在渡口孤舟依舊横不似公安揷竹䖏凛然容貌尚如生比過公安謁莱公祠盖枯竹再生処也巴東祠廃可謂缺典因成二絶以示邑官𥘉入巫山界登羅護関雲霧晦㝠黙禱之因成一絶西来水陸俻艱辛秖為君恩不為身為向巫山神女道莫将雲霧惱行人霧開復成一絶関登羅護飯郵亭雲霧迷人晝晦冥神女有灵呼即應廓然山色為吾青登得勝崗謁武安王関雲長庙有泉一泓俗傳謂兵至此无水㧞刀刺地泉随而湧庙西有磨刀溪北有晒甲崖淂勝名崗蜀虎臣氣吞吴魏尖防身磨刀晒甲遺蹤在英魄猶䏻敵万人過風口望巫峽岩嶂如㕍山祥雲峯經行峡烟霞障十二巫山鎻白雲岩如㕍蕩列江濱誰名雁蕩經行峡定是經行峽裏人登燕子坡前有一岩在江之旁如天台赤城名烏飛岩坡名燕子燕思帰岩號烏飛烏倦飛雲本无心聊出岫風縁有口故吹衣風口行雲皆巫山地名巴東之西近江有夫子洞亦曰聖洞巫山縣有孔子泉說者謂旱而祈則應泉旁之民雖童子皆能書夫子胡為洞於此且有泉耶詩以辨之夫子道不行甞欲居九夷乗桴浮扵海從者其為誰歴聘甞之荆豈亦㳺坤維有洞巴峽間人言幽更竒雲深不可見奥処那容窺聖人肯巢仙兹名良可疑吾道其非耶聊将友鹿麋巫山亦有泉可飲仍可祈泉旁都㡬家聦慧多竒児父兄儻知教聖門皆可帰我来不及飲清興随泉飛寕比盗与貪聞名使人嗤禹穴㑹稽隂堯山番江湄流傳雖失真未敢以爲非魯人䡖東家秦人燔書詩兹俗聖夫子吾何敢夷之自鄂渚至䕫府途中記所見一百十韻流火郡離饒悠悠驛路迢黄華舟觧鄂渺渺大江遥七月九日离番昜九月十日自鄂者易舟肩弛番人檐是日遣送还人回身隨楚客橈東甌鄉萝逺南浦别䰟銷不過漢陽壘猶勞郡守軺逺山看八字古囯避三苗别水由通済羇㠶渡沉漻方随鷗浩蕩俄值雨飄颻夾岸華疑雪㫪天浪佀潮枝栖並烏鵲苕宿伴䳡鷯旅思慿詩遣愁腸頼酒澆无魚不弹鋏忘味若聞韶孺子滄浪曲渔人欵乃謡逃虚音可喜淂雋語同囂秋老江經夏湖平境過宵夜鳴疑有虎昏吠喜聞獢遺俗懐吳主荒祠類楚昭巨鱗烹縮項白粲籴長腰茅舎桔𥘉熟江村楓未凋栁枝猶楚楚竹淚尚思姚雨後禾收晚霜前麥見蕎風清玉沙界月吐𬗋㣲宵一瓣香聞佛千齡夀祝堯沱潜終共道江漢訖同朝渡口聽雞唱洲邊記鷺翹地名思故里詩句憶同僚塔子瞻山色天門認斗杓航便河廣葦風順若邪樵石首欣相問刘郎似見招双㠶方快意五兩忽狂飊誰弄黄昏笛如聞赤壁簘孤烟為藕市一葉是漁舠江水澄泥煮芦薪帶􅊜燒萝回驚枕撼曉起斍風調𬞞擷纔盈握魚䐹莫計艘横波沉宻網巨浪脫高跳紅想鄉醪滑黄看野菊嬌左公城穴兎油口樹喑蜩水是蛟龍地桒餘羽葆條竹由忠愍揷木自洞庭漂大士精藍壮将軍畫像驍江空無戦艦水落有乗橇促織䖝知俻淘河鳥受徭風高鳴過㕍天闊戾飛鵰雲萝封疆逺荆衡氣象遼建都曽王楚為郡自平䔥息壌那容盗章䑓可戒驕韓詩誇府大漢史志民僄燕集堂開𣏌笙歌楽舞逍楼登一日暇賦就百憂消落㡌觀成阻㳺山㒷謾飄書隨鱗出峽詩附翼還鄡离岸忽鳴橹滿艘仍豎幖栖窓回蜥蝪撲面集蠨蛸沙市人家逺方城草色葽食梨蘇䏲渇啜茗愈頭痟覆屋曽非瓦名村浪有窰枝江縣羅囯鳬舄颺王喬百里環洲渚千家在葦苕津卿誰復禦松邑已非僑漢景餘清爽臨江尚庙祧轉灘驚見石挽繂眩飛艻澎湃声如擊玲瓏状佀雕松楸悲相冡香火静僧寮轉盻冝都過横雲楚塞㠐虎牙端欲噬銅柱為誰標月向夷陵看杯思太白邀文忠遺勁莭精采凛生綃岩白形如鷂魚黄狀類䖺邦人祀神禹郭璞當臯陶舟退風飛鷁生浮旅泛薸鯉溪穿犖确牛峽隔岧嶤孝起姜村感音傳進足趫山家收芋栗土物貢薑椒澗水何曽歇桃花未肯夭覆盆鳴鹿友絶壁聚狐妖野媪頭纒白行人背負鐐回看一州峽下視衆山么障日峯衘豆鑚天石碍轎道逢懐刺禰卧听誦書鼂𬒳冷公孫布裘寒季子貂猶堪耐氷雪未暇憶炎歊倦上九盤嶺重觀三峽橋好峯名佛頂欲畫少僧繇照黒紛持火愁荒猛撃刀流虹瞻魏闕瑞白慶清朝囯夀緜箕翼皇啚奕誦釗歡声形戴白環視舞垂髫避渉憂如馬觀形怯類猫眼經峽險心過秭帰焦㷱繹山城古灵均廟貌憔随梗断鄉思為梅撩境始臨䕫府魂頻萝象箾輕生甘叱馭受物戒揚鑣帥閫分誠濫州麾把更僥拜㤙羅吏卒列炬散鳶鶚野渡水清淺孤舟人寂寥影防沙有􅈮音駭晝聞梟聖洞雲深鎻天池浪不揺林梢鳴烈烈峯頂洒瀌瀌快覩天披霧愁聴夜滴蕉陽䑓開愛日隂氣廓玄枵六六盤𥘉過三三界已超生朝念弧矢旅食分簞瓢遐想賦風王敬瞻行雨瑶過関寕有鬼及郭免逢魈訪古㝷詩史觀風入郡譙路難端可畏形後尚奚勞行也知誰使官乎我亦聊欲賡刘与杜辞鄙甚蒭蕘梅溪先生後集卷第十一梅溪先生文集卷第十一賦雙瀑賦王子㳺簫峯之下訪鼻祖於仙籍駐杖屨於金溪觀雙瀑之千尺于時驟雨𥘉歇飄風迅擊飛泉洶湧怒流湍激噴烟霧於蒼嵐吼龍於大澤澤百川震而澎湃萬類紛其辟昜疑若傾崖轉壑變丘谷而爲陵又類萬馬千兵奏皷鼙而赴敵乆之狂潦㣲殺巨流順適靈源復㝷於故道雙沠交馳於絶脊勢偶殊而卒合路雖分而稍迫王筯垂兮拂輕寒長紳拖兮蘸深碧疑若鯨鯢鬬怒兮力未决而方酣干鏌争鋒兮光交騰而互射嗟天匠之施巧兮作勝事於泉石顧一沠之罕有兮豈雙流之昜得不見夫銀河落於半天兮破廬阜之山色梅雨飛於石門兮敞芝田之靈蹟潭千丈於石橋兮渺仙几之路隔龍雨湫於雁蕩兮分大小而異宅彼獨溜而孤飛兮猶擅名於今昔况並峙而争流兮作人間之連璧吾𣣔窮千里之源兮問化工之始闢思漢使之不復見兮悵靈槎之難覔獨終日而登臨兮寄吾懐於幽寂興雖盡而忘歸兮猶待乎風清而月白於是目瞬飛流之末耳洗寒潭之側思徃事之㣲茫仰遺風而嘆息竈中烟冷難㝷入竹之人峯頂䑓荒不見吹簫之客賦罷乃歌而歸曰雙瀑之水從何来靈源千尺髙崔嵬飛流噴沬飄瓊瑰空山落日鳴春雷有客来逰獨徘徊枕流嗽石興悠哉塵襟濯罷飄然回風清月白空簫䑓至樂齋賦并引予讀歐陽詩有至㢤天下樂終日在書案之句因採其語以名齋又從而賦之予與客坐扵書齋之内客仰而顧俯而笑曰子知天下之樂乎散扵事物之萬端㑹扵窮逹之两途然皆有窮焉吾言而子聴諸髙車駟馬腰金曵組前者呵後者衞士之得志扵當時者之樂也然有時而厭焉前日朝廷之士扁舟去而煙浪深也枕流嗽石吟風嘯月採扵山緍扵泉土之無永扵世者之樂也然有時而改焉前日山林之士蕙帳空而猿鶴驚也予曰子之言皆外物之樂也樂故有窮烏知天下有所謂無窮之至樂哉一簞食一瓢飲顔回之樂也宅一區田一㕓楊雄之樂也是固無心扵軒冕亦不放志扵山林得乎内而樂乎道也吾今㳺心扵一齋之内適意乎黄卷之中師顔回友楊雄逰扵斯息扵斯天下之至樂也又烏得而能窮帰去来賦帰去来兮終日思帰今巳帰嗟連歲之行役兮誤甘㫖之屢違身雖䖏扵異鄕兮念長在扵庭闈陟髙崗而東望兮悵白雲之孤飛食虀塩而無味兮悟蝸角之真非泛季卿之竹䈎兮詠晨光之熹㣲辰未浹而到家兮指青燈而扣扉粲慈顔一笑兮兮紛稚子之牽衣雖吾歸之不若人兮不能衣錦而乗肥吾将以此而昜彼兮學何蕃其庻幾梅溪題名賦并引吾徒宋孝先李大鼎作梅溪庚午多士賦叙一堂八齋六十人名字而鋪陳條列三百六十字之中中言簡意盡有足觀者陳元佐萬孝傑童侃又作梅溪多士賦通前後八年間凢一百二十人而併列之文工而事益詳予扵是採二賦之餘意變聲律而古之先羙後規效古人勸諷之㫖非敢以文戯也目曰梅溪題名賦余闢舘于梅溪兮嵗甫及乎夢齡余弟夀朋字夣齡書舘之闢今八年矣故借夣九齡以喻意自淵獻而逮乎敦斨兮頃十朋而今百朋某余名百朋予季弟昌齡名予癸亥秋闢舘聚徒㳺從者十人至庚午歲通数之凢一百二十二人齋敞八而堂虚一兮咸與賢而與能謝與賢簡之與能任之余宗旦而罔有一徳兮余宗旦仲阜賈稱一徳敢不希仲舒之明經陳元佐希仲幸諸友能祖說之遜志兮張祖說文孺鄭遜志時敏又恪希顔回之服膺陳恪叔恭林次淵希顔乃有汾晉五士羅士䏻少陸謝士竒文羙士龍漢臣連士表少華季士宏宏老昔晋文公五士故曰汾晋五士漢唐群英張次房漢英孫元齡唐英李杞亦字唐英鄭國七子張仲逺子猷周孝友子施孝顯字揚孝思子則濬子深王淳張載並字厚春秋秋鄭七子賦詩凉州三明劉玄徳明夫萬序明之余如晦明叟後漢有凉州三明噐成三足之鼎李大鼎鎮夫郜鼎叔鎮萬鼎鎮逺才冝九佐之卿萬澄清卿童偉俊卿侃文卿宋孝先舜卿林湯臣啇卿陳朝揆正卿施良臣名卿陳光朝䑓卿林叔舉虞卿有一瑞兮冲逺之鶚賈脩一瑞劉鶚冲逺有千里兮圗南之鵬周千里百駒謝鵬啚南莫不端武升堂蔡端武威仲敦詩趍庭劉詩温夫如璧之瑩余璧全之如芷之馨玉芷茂之如㮤之茂葉㮤茂正如椿之靈萬椿楊椿並字大年如楩楠之羙萬楩永年楠億年揚楠元幹如松梓之青萬松喬年休梓材叔森乎如鉞之可畏劉載通逹轟乎如震之可驚周震景束皎乎如海嶠之吐明月蒋嶠景山耿乎如長庚之輝衆星李庚少白昻昻乎如季梁之梗㮣萬孝傑季梁陳昻仲昂孜孜乎衞伯玉之老成潘孜元善劉闕伯玉可居天任而澤逺趙公倚天任揚寓澤逺可爲王佐而揚庭王佐才仲陳献可揚庭可起傅巖之築劉傳岩叟可同舜佐之登謝臯羽舜佐憲一䕫而樂作連憲民式周次鳳一䕫炳伯虎而文興賈炳作徳夏伯虎用之肇輝先之徳業陳肇徳遠許輝先光甫諧興祖之家聲余諧孝仲姚紹宗興祖汝文兮冝月選而季詮何鐸汝文季詮仲言汝弼兮必類進而方升陳舜咨汝弼方升中髙逖矣乎王逖正矣有来二客業彼管城横陽許武子龍泉管叔竒来客梅溪以篆字題名名列甲乙字篆丙丁丙子謂篆字也見爾雅如翼斯飛呉翼季南如璘斯熒王璘徳夫燦銀鈎與玉筯􅌂壁上之題名吾徒之秀乃有詞賦兮少雲之作朱少雲吉作太原之老乃變聲律兮祖舜之賡陳少虞祖舜扵是闡大猷而溥告之曰李大猷定夫孫溥徳廣林溥叔廣學必剖藩籬而克已終克巳兼夫道必舍蹊徑而中行将中行謙仲先之以孝忱之意萬庚先之曾来會課亦與題名朱孝忱伯恂申之以敦信之誠萬庠中之劉信信叟禮𣣔安上兮必先自治林安上世仁𣣔及逺兮慎母自矜林取仁及逺湛萬頃以窺憲黄萬頃伯厚葉頃澄叟妙一唯之悟曽鄔一唯仁叟祖伊尹畎畝之樂許祖伊次尹振仲尼文教之鳴陳之紀振仲玩蒙亨之爻象李蒙亨彦通俟泰来而彚征萬康泰之勿務世華而起文通之附夏伯文世華劉文通叔逹唐陸淳謚文通先生栁子厚嘗𣣔掃其門然陸亦附王叔文者勿求必逹而貪季孫之榮張必逹邦彦劉祖漢季孫窮則隱居呉隱若靖翁逹斯大亨徐大亨顯仲凢百君子母渝此盟止庵銘叔父寳印講師築止庵以居姪某銘曰學者求道如客在途不有所止将安歸乎大學之道在扵知止意正心誠乃悟斯理孔門髙第回也獨賢未見其止夫子惜焉庵中道人由儒入佛進於有爲止扵無物𣣔知止䖏是亦難言非内非外亦非中間道人失笑汝言亦綺道本無進亦何有止道無進止庵無成壊孰知此庵中含法界甕庵銘予目黄楊爲甕庵因銘之曰圑圑甕庵自天生植匪陶匪鎔匪塗匪飾百榦輪囷匠非斧斤萬葉敷披覆以瑠璃天牖玲瓏透日含風我非原憲物異名同濃隂酒綠春色盃深我非畢卓意自酣沉孰云此庵人不可住我以意㳺形骸曷預孰云此庵飛禽所巢此意彼形了不相殽孰云此庵風燥雨濕我意潜住風雨莫及以形住庵如蠒裏蠶茍得其趣何所不堪此庵此意聊復爾耳孰非吾廬亦何必此㑹趣堂燈銘長檠髙燃不照青編短檠自對不照同軰孰若此燈巍標一堂與爾多士同分厥光無囊爾螢無燭爾雪清夜紅紗滿堂明月凢我同志勉思六經趣與心㑹無孤此燈止堂情話室銘南浦陳䑓卿取大學之義以名堂採陶淵明之賦以名室命梅溪王某銘之銘曰金玉滿堂不以名堂彼外物兮非可常大學之道在扵知止子以銘堂端有㫖止匪易知匪難知反求諸身非逺而正子心兮誠子意定應不離方寸地右止堂情之所鍾正在我軰况扵親戚又情之最親戚之話苟不情将烏乎用其情獨不見夫陳子之入是室兮無話不情非情不話顔津津兮常自快願子擴親戚之情意均此話扵踈外則四海之内皆兄弟其爲恱也尤大右情話室書几銘是惟王子之几至哉之樂在乎是厨銘是惟王子之厨中蔵吾書吾腹不如書銘是惟王子之書惟其不勤是以空虗筆銘是惟王子之筆爾心有盡時吾用無窮日墨銘是惟王子之墨于以稼穡客卿之徳𥿄銘是惟王子之𥿄吾不善書慁爾多矣硯銘是惟王子之硯出入廣埸兮經百戦硯匣銘啓焉斯磨盖焉斯蔵匣爾陶泓噐吾文房筆池銘直方其形兮泓其中滌毛頴兮爾之功簡板銘斵之平如漆之明如札之盈如㓗之瑩如母枯剡藤惟爾之書粘板銘千里面目曰書簡函而封之斯致逺代卓受垢而不辭者是惟粘板界方銘心正筆正亦惟爾有以相其正界筆銘中書君老而秃棄之則可惜取其心之猶可用以小管城爲之宅吾𣣔寫盡天下書頼爾爲之畫䇿詩筒銘我腹空虗兮好斐然而成章爾腹空洞兮冝爲吾之錦嚢書筒銘交㳺觧散兮書不可巳爾爲魚鴈兮通面目扵千里鏡銘是惟王子之鏡勿病乎面目可憎而取乎衣冠可正燈銘是惟王子之燈燒膏繼晷惟汝能香爐銘匪金匪玉銅姿瓦質以爾馨徳在吾蘭室印斗銘噐髹而光斗形而方孰鐫賤名扵是乎蔵扇銘無仁風兮可揚惟篋中兮是蔵肩輿銘我僕旣飡我輿斯肩我将何之必故必親豈無公門經歲弗入豈無權門足未嘗及肅爾徒御慎吾徃還惟分之安肩輿斯安菖蒲盂銘叔父寳印講師之贈也銘以記之伊巧匠兮斵山骨刳其中兮方其質擎湖嵌兮隱蘭若根王衡兮灌天一從何来兮叔贈姪真情流兮冝在吾室國朝名臣賛寇莱公嗚呼菜公相我真宗契丹南牧朝野洶洶群臣勸帝幸蜀江東㣲公决䇿天下其戎百年無兵繄誰之功韓魏公巍巍韓公文武兼資相我三宗身任安危周勃定䇿霍光受遺古社稷臣公實有之非我仁祖其孰能知范文正公堂堂范公人中之龍正色立朝姦邪不容材兼文武躬履仁義出捋入相十纔一試真王佐才用之未至冨鄭公巖巖冨公仁者之勇危言折虜神色不恕公在使車虜不敢動公在相位四夷稽顙出入三朝爲國䡖重杜祁公維正獻公相我仁宗公在相位私謁不容苞苴不通非道不從封還内降與權倖抗公忠直亮清白宰相歐陽文忠公賢㢤文忠直道大節知進知退旣明且哲陸贄議論韓愈文章李杜歌詩公無不長當世大儒邦家之光文潞公太師潞公勲髙業隆四朝元老福禄始終元祐之𥘉太后臨極起公扵洛平章軍國夷狄来朝服公之徳趙清獻公於維清獻典天之憲人呼鐡面彂姦紏慝以正王國古之遺直呉蜀父老語之流涕公之治民古之遺愛司馬温公宋二百年名臣軰岀孰為第一咸曰君實田夫野老識其遺風至今猶語司馬相公以手加額涕泗亡從蘇東坡東坡文章百世之師群邪所仇歛不及施萬里南遷而氣不衰我讀公文慕其所為碩為執鞭恨不同時蘇頴濱賢哉子由賢㢤子由忠言嘉謀聳動冕旒横身政府不避怨仇棣蕚聮芳皆第一流才不逮兄噐識俱優陳了翁賢㢤瑩中賢㢤瑩中鶚立兩朝凛乎清風二蔡嘯㐫飾姦為忠黨與雷同牢不可攻公獨仇之折其姦鋒孤立不容身以譴終公乎不忘名等岱崧梅溪先生文集卷第十一
