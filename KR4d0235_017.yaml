  text: 梅溪先生後集卷第十七
  hash: sha256:c8780824b6b9e518bd87eebb747371be98155f9b8a63882e7c570795945fd737
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0235_SBCK_017-1a}
body:
  text: 詩戊子八月二日得泉州五年符竹換三州乞得祠宫欲少休名姓誤蒙君相記泉南千里又分憂解舟九月二十九日解舟城之南橙橘半青黃時節豈不好胡為辝故鄉親朋送我行殷勤餽壷觴我欲與之飲舟去留靡遑僮僕别我歸黯然顔色傷問我何時還田園又成荒我心愧其言老矣身皇皇五載走三州道路險且長婁請方得祠暫歸又懷章挈家入南閩兒女不盡將餘生疾病多滿鏡鬚髯蒼到官郎有乞行將返耕桑過瑞安我家古樂成老未識安固偶把清源麾首問南塘路解維日已晏入境天欲莫張子自陶山子猷扁舟惠然顧沈君壯年别敦謨相見髮垂素訪舊多不存來觀莫知數平原二十人邂逅喜相遇謂我宜少留欲欶不腆具我驅不敢疾曲為一宵住臨江有高閣登覽可以賦瀾同孟子觀目作少陵注燈火照魚龍談笑驚鷗鷺㗸杯鄊意濃竊食君恩誤晨起酒未醒潮來報催渡贈沈敦謨三十年前硯席同懷人長在夢魂中徒勞州縣知何輔高蹈丘園不是窮歷問舊遊多故鬼偶餘我輩亦衰翁相逢又却匆匆别無復從容似泮宮觀潮閣高臨無地屹山腰今古知觀幾度潮水鑑挂空波正滿鯨魚入穴浪還消雷𥘉出地神龍怒銀忽成山海若驕聖世風濤合平靜不應泛溢似唐朝訪曹夢良我自蕭峯下遙來訪許峯川塗何敢憚筆硯久相從故里行將逺吾人豈易逄何當繼韓孟相逐似雲龍鳯凰岩鳯鳥久不至胡為于此藏德輝如可覽應不戀高岡蕭家渡渡頭問舟子此渡胡名蕭舟子笑答我使君家匪遙豈不聞侍郎名德重本朝婁為二千石兩至萬里橋渡旁乃其宅人亡木惟喬隂德滿鄊閭嘉話傳魚樵江水流有盡姓名磨不消近同池號謝逺類江稱姚赧顔謝舟子講聞非一朝恨生晚且賤無繇際清標坡公不識范韓子思之僑敬瞻通德門魂往不可招入長溪境老矣倦遊宦入閩如山川三山疑隔海九嶺類鑽天峽中有鑽天三里種稻到山頂栽松侵日邊溪長水無盡前更有清泉贈程天祐秀才程生嗜好與人殊杖屨遙遙訪我廬不踏槐花隨舉子手持醫國惠民書宿飯溪驛甑嶼飽曾見飯溪名始聞老懷如子美到處不忘君樂清有甑嶼山門擁千峯翠溪無一點塵松風清入耳山月白隨人宿雙岩寺﨑嶇九嶺更雙岩遙望閩山未見三來訪神鍾隱見處翠微深鎖古精藍至福唐會鄊人丁鎮叔張器先甄雲卿項用中趙知録薛主簿同年孫彥忠草酌試院一同年友七鄊人勸酒那容耳不聞尚齒自驚多白髮論文堪笑有紅裙權師吳憲遣官奴耒侑尊詩篇共約題孤嶼遊宦猶疑在五雲孝忠會稽人豫昔仕越與彥忠此會此時寧易得明朝風月兩州分宿真隱寺我亦欲真隱區區愧此身山林與城市何處隱非真飯枕峯門外峯如枕冝眠清淨身禪僧自面壁誰是枕峯人飯罷匆匆别勞生可奈何不能留一宿有愧此峯多宿囊山寺荔子枝中古道場石門有路探懸囊匆匆不著遊山屐只辦嵩呼一瓣香涎日朝散會慶聖節我來萬籟正號風壁上觀詩憶蔡公惟有秋林舊時月夜深猶照𣑽王宫過蔡端明故居懷章南過蔡公鄉駐馬遙瞻數仞墻丹荔株株經品藻喬松葉葉惠清涼四賢詩出人增氣三諌章成國有光真是濟川三昧手清源遊戲作虹梁宴七邑宰九重宵旰愛民深令尹冝懷撫字心今日黃堂一杯酒殷勤端為庶民斟送赴省諸先輩國朝人物盛溫陵秋賦􅊯􅊯鹿食蘋人倍平原門下士三十八人文聮韓愈榜中名丹墀何止三千字雲翼行看九萬程勸駕龍鍾老太守籃輿凖擬出郊迎次韻夔漕趙若拙見寄去秋移郡近家鄊便殿狂言拜手揚何敢許身為稷契偶因論事及堯湯民雖婁試如馮翊詔未能焚愧益昌乞得祠宫飬衰病夢中依舊坐黃堂夔門邂逅恨匆匆君駕重來我巳東陳迹徒勞長者記若拙書六欲記豫去夔後數事清樽那復故人同光華持節花溪上得報若拙移漕成都老病分符佛國中清源號佛國吾輩棲棲不黔突此生休更問天公知宗生日士豢字恱中天工未放二陽生留得堯階一英􅕴慶誕仙源貴公子祥開南極老人星日垂宫線添無盡貌比莊椿看更清歲歲華堂祝眉夀笙歌聲裏雪梅馨哭令人三十年間共苦辛忽然驚斷夢中因鍾情正是我輩事鼓缶忍同方外人熊膽未酬平昔志午衣猶是向來貧令人不蓄財瞑目之後囊槖蕭然閩山滿眼同來路木落風號淚滿巾貢院車水築基諸公懼魚鱉活之别沼塞沼增基大厦成群鮮亦免校人烹洋洋圉圉諸公賜要與吾君廣好生出郊勸農六年四郡勸農耕自欲歸耕尚未成遊宦何如在家好一廛從此願為氓守臣憂國願年豐半刺雙鳬此念同安得時暘時雨若有生均在泰和中小麥含花大麥黃一年春事已相將籃輿遍入三精舍撥得公家半日忙一千石俸竊南州老病餘生厭宦遊巳上祠章即歸去一犁煙雨事西疇題靈秀峯禪院小小精藍亦自竒一峯靈秀藴幽姿無緣細聽山僧話太守偷間止片時送九座訥老禪老遙從九座來一言為我洗塵埃飄然又向山中去白首相逢更幾回至樂亭中半月留溪山杖屨飽尋幽見師忽起廬山夢夢向舊時遊處遊崔肅之雍自湖至泉遷二親之喪歸葬詩以送之番水同僚舊遙從霅水來異鄉欣覿靣清話洗銜哀豫時有哭內之戚蔥欎佳城就勤勞孝子回不應淹榷酤中外王須才夜聞子規痛念亡者夢覺音容杳莫追子規聲裏涕霑衣催歸無計同歸去耘後耕前事已非南宫揭榜溫陵得人為盛提舶馬寺丞有詩贊喜次韻龍虎鄉邦地最靈鯤鵬相繼上南溟已聞元凱賔虞國十六人行見淵騫冠孔庭帝遣伏波持使節天教平海會文星鈴齋忽報捷音至一炷清香千佛經諸公廷對甫邇復用前韻清源𬗋帽發英靈萬斛詞源水注溟遙想恩𫀆動草色定知喜氣徹天庭名高虎榜唐文傑人半雲臺漢列星纍月笞兒幾翁嫗夜深燈火督窮經次韻知宗春隂行人怨雨農憂旱永叔元之事可明不歎花前無客飲且欣郊外有農耕知公興巳煙霞重顧我心尤勢利輕天意稍佳民事急總將行樂付宗盟東坡詩云斯人何似似春雨歌舞慶夫恣行旅君看永叔與元之坎軻一生遭謗語次韻知宗遊北山州北有山幽更幽皇天閣雨為公遊登高如入上下竺宴坐疑臨大小湫掃地焚香煙縷嫋煎泉瀹茗乳花浮觀詩起我家山興身在閩南夢在甌悼亡燕寢焚香老病身細君相對坐如賓而今一榻維摩室唯與無言法喜親不見音容忽三月無從涕泗巳千行家山凖擬欲歸隱堪嘆相隨無孟光偕老相期未及期回頭人事巳成非逢春尚擬風光轉過眼忽驚花片飛夤緣偶作子飛侣夢寐相隨到數州泥上迹留鴻巳去舟中刻在劍難求次韻知宗酴醿萬斛虬珠眩眼明傲春遲吐冠園英詩因居士價方重東坡武昌詩為古今絶唱酒顔名臣花遂榮香異竹間吹細細韻如堂上出盈盈酴醿號韻芳姿自可友蘭蕙惜不當時遇獨清酴醿不載于離騷遊承天寺後園登月臺贈潛老三徑荒蕪未許尋籃輿來訪小園林因知燕寢凝香地不侣禪房花木深月臺無屋有空壇空處觀空眼界寬不惹世間塵一點氷輪心鏡兩團團送賈岩老還鄊閩江艱險嶺崔嵬不憚衝寒冒雪來留我鈴齋兩三月扁舟載得義風回堂上慈親數月違片心遙逐白雲飛傷心盡聽秭歸鳥難弟言歸秭不歸岩老聞秭歸遂起歸興乃翁賢德冠吾鄊伯氏聲名藹上庠更喜君如里曾子少年孝義已非常送岩老出北門暮春送客北山門厭坐黃堂喜見村麥熟秧青農事急十分歸興在田園客欲東歸出北門又聞聮騎過西村殷勤為遣十從事莫惜醉吟袛樹園送傳興化自得字安道五馬躬迎八十親甘棠如舊治惟新歡傳此日來廉范記得當時借寇恂江海聊淹把麾手廟堂元是薦賢人送君為守泉南守政拙才踈藉寶鄰曺夢良寄柑聞詩聞禮輩取以祭毋哭泣不巳嘉果遙來自故鄉去冬𥘉熟記同嘗爾䘖懷橘無窮恨我亦傳柑念不忘四月八日貢院上梁廣厦𥘉成万柱標修梁巍跨玉虹腰况逢此日生千佛定引群仙上九霄下筆蠶聲紛戰藝出林鶯友競遷喬清源人物從今盛孝子忠臣滿聖朝諸公和詩復用前韻修梁欲舉綵先標聲撼春雷鼓百腰溪蟄蛟龍欣得雨去年西溪龍見上梁日得雨桐棲鵉鳯合沖霄桐城清源水接南溟闊𬗋帽山齊泰嶽喬學不負人冝自勉前賢勳業著三朝曾魯公相三朝梁眷連年姓誤標兩州騷客瘦吟腰月河月滿燕賀厦霅川貢院十一月望日上梁郡有月河在貢院左佛國佛生虹挂霄多士顔歡歌杜老一輪香滿賦張喬此途不止為科第名節崔嵬看立朝悼亡傷哉無復見老矣不成階牢落凝香地同誰話此懷相勉惟清白囊如四壁空難忘將絶語勸我莫言窮豫一日匆言窮令人日君今勝作書會時矣不必言窮豫悅其言蓋死之前數日也薛士昭主管母夫人加封送酒為夀薛有詩謝次韻以酬伯宣慶事公家奕世傳生封錦告出甘泉榮親行有千鍾祿為夀慚無百斛船喜氣在顔窺貴客清風滿枕扇高眠朝廷指日先封薛歸侍萱堂冕有蟬送吳憲知叔出郊聞好語盡道憲車賢郡不留三宿人皆仰二天薦章先白屋公至郡薦三人皆孤寒士貢宇給青錢以百緡助起貢院上正開宣室公歸席㝎前祈雨未應提舶知宗道觀焚香明日遂雨提舶有詩次韻一雨誰之力因公發善心同為上公請小作傳岩霖高廩行將實南風日已駸涓辰祈善利感應亦猶今次韻知宗賀雨雲飛𥘉類愈隨郊珠匆跳空室舞蛟但願農多大田稼不愁風捲少陵茅是夕大風才踈政事由來拙天逺精誠未易交三日禱祈才一雨自知無處避謳嘲次韻陸倅賀雨􅌖字次川目注雲霓為國憂何心肥馬更輕裘庶民愁恨旱無雨三日滂沱農有秋且喜上公容我請不辝太白共君浮人言太守無才術端藉士龍監此州夏四月不雨守臣不聀之罪也將有請于神雨忽大作陳賀州有詩贊喜次韻以酬知字體仁不是尋常喜雨詩言存軌物類臧僖賀州詩序斥花土花迎士木人巫呼舞之非貞有物之言也相將歸賀天朝雨定有忠言結如知白樂天以賀雨詩諷諫東坡詩云賀雨詩成諫書郡人方切望雲霓忽見高田水入低正好歸田飽黃犢不須騎馬聽朝雞賀州賀雨句如何不減夔州夢得歌陳詩序云開竹枝歌更有一犁江上曲它年傳誦出金坡政拙年年厭禱祈心香一炷逐雲飛老農問我何良苦薄有田園胡不歸刺桐抽葉張青蓋泉人以刺桐先葉後花為豐年兆𬗋帽蒙霞麗錦籠俗謂朝霞暮雨前日雨作朝果有霞今歲家家定髙廩田寧復羡吳儂次韻蔣教授喜雨雍字元肅我來遙自東甌東賢非朱邑鄊守桐泉方羽成半年為郡治亡狀四月不雨心憂農水田黽拆秧巳老雲霓望斷天穹隆少學春秋老欲用區區碩請應上公真人不待辦香禱泉有蔡真人祠水旱必專𬗋帽巳有微雲蒙沛然一雨四境足眼見䆉稏青連空皇天愛民恕守罪有始其賜寧無終既令地免晉國赤亦不水似元時洪廣文先生坐綘帳憂國心與黃堂同揮毫作訟繼吉甫開卷穆穆生清風知宗遊延福有詩見懷次韻以酬向來雲榭倚闌干興已遙馳邪外山風伯如嫌俗駕至禪房疑為病夫關鈴馳倦臥眼界寂詩社免陪心境間蠟屐何時破吾碩與君舒嘯翠微間提舉延福祈風道中有作次韻雨𥘉欲乞下俄沛風不侍祈來已薰瑞氣遙看騰𬗋帽豐年行見割黃雲大啇航海蹈萬死逺物輸官𬒳八垠賴有舶臺賢使者端能薄斂體吾君病中食火山荔枝前年夔州食荔支同僚共賦紅詩妃子名園世所貴不侣詩史堂前竒去冬分符南士半月身行荔支圃三州嘉木皆眼見更閲君謨向來譜臨漳一種名火山品雖云下熟則先從今漸入荔佳境陳江未擘先流涎老病餘生怯嘉果日啖那能三百顆殷勤為破綘紗囊心火驚添火山火諸公和詩再用前韻屏問觀畫頥頻支州宅有屏風畫荔支十六種想像風味哦新詩火山太早反遭罵諸公和詩多幾罵者陳𬗋未顯誰稱竒氣稟南方君子士不近長安帝王圃安排名字知何人誤與牡丹同入譜泉南老守思故山荔熟我去誰後先但願丁香一株熟添入藥裹痊痰平生夢寐南州果瘦腹如蟬消幾顆明年何處飣柸盤鴈蕩山前月流火永嘉七月方食荔支漳州石教授寄火山荔支名邦彥炎方摘實走筠籠千顆遙遙寄病翁未啖吾州法石白且嘗鄰郡火山紅攙先趂得楊盧雨珍重來從芹藻宫我欲細論香色味一尊何日廣文同東湖小飲微涼散梅潤濃緑敷桐隂送客出東郊駕言事幽尋湖光照我眼荷香清我襟平疇入逺望歲有其自今牛眠種巳畢蛤吠苗𥘉深古亭懷二公遙望羅千岑邂逅得良友欣然契豫心喬松喜客來風枝出清音手持荷葉柸共對蓮花斟東湖異西湖有詩不妨吟東湖二公亭插芰荷間緑蓋紅粧四靣環若把西湖比西子東湖自合比東山愛松堂炎炎畏日愛濃隂穆穆清風愛好音不獨愛松兼愛竹此君亦有歲寒心松之西有竹食瓜呈知宗荔子勞民疏伯遊蒲萄釀酒博涼州何人傳得東陵種大勝家封萬户侯題節推納涼軒孔光字德溥有客遊蓮幕開軒更傍蓮披襟風未賦遞嘨句先聯境淨涼偏乏心清暑自蠲快哉誰與共廣厦集群仙軒近貢院州宅即事泉南古州宅草木有遺芳鷹瓜冬猶緑闍提夜更香佛桑朝暮異荔子歲年長惟有松并竹青青似故鄉修鷹爪花架有花藤蔓生封植傍州宅狀類鷙禽爪葉作翻風翮酸分含笑香黃帶簷蔔色架倒吾為扶清涼納朝夕鷹爪花誰把名鷹爪天然狀不殊無心事搏擊中有鳥相呼長生草草有長生者無根葉自抽秦皇不知此誤向海山求榕木南國有喬木老非梁棟材清隂可以覆亦足報栽培安靜堂前賢治迹尚堪尋留得堂名直至今若欲斯民盡安靜要須安靜自家心中和堂堂前老木幾經春閲遍泉南舊守臣盡向中和堂上坐中和為治有何人雲榭山生取地榭侵雲土木多應役鬼神好向危欄髙著眼閭閻無限困窮人二山亭連年行役厭間關踏遍千山見二山欲識泉南山面目群山總在一亭間清暑堂後復名忠獻九夏炎方氣鬱蒸沉沉廣厦有涼生仁風未慰黎民意何忍堂中暑獨清貢院納涼分韻得湖字突兀千間屋清涼五月湖人才此塗出暑氣坐中無虎榜唐文傑雄風楚大夫相期遊廣厦慷慨論唐虞知宗遊東湖用貢院納涼韻見寄次韻奉酬東湖曾一到想像賀家湖花似越女好人如狂客無知宗寄居會稽高吟還老手野趣屬潛夫歸奏南風曲薰兮欲和虞再和宗老呼佳客同觀郭外湖融樽常喜滿參酒不言無知宗二子侍行草色懷三徑松聲憶五夫越州五夫因秦封五松得名公遊更何日旌至定招虞比和知宗詩牽于押韻以招虞為戲果蒙見招復用前韻宗英真好事呼客共遊湖携具臨平逺觀山對有無十花逢淨友曾端伯十花以荷為淨友千頃和雲夫韓詩酬盧雲夫荷花行曲江千頃波秋淨得玉又求劍無厭慚似虞遊湖值雨薛士昭衣巾霑􅊜意氣自若戲用前韻薛侯真不俗十日兩東湖俊逸詩篇有倉皇雨具無𫀆雖􅊜毅父眉不皺堯夫異夕月離畢遊冝備不虞次韻知宗遊二公亭前日同登二山亭清源入望清更清宗英載酒挾兩客破暑共作城東行東湖未到聞人説香有荷華如鄭隰社中未為三笑遊亭上姑尋二公迹􅋦杯適意論交情江山照眼增雙明聊效韓公文字飲奚用鼎沸笙篁聲提舶示觀楚東集用張安國韻因思番陽與唱酬者五人今六年矣陳何二公已物故餘亦離索為之慨然復用元韻憶昔江東會衆仙詩筒來往走山川時陳在豫章何按屬郡詩筒常往來造樓遊戲偶成鳯煉石辛勤同輔天堪嘆交遊隔生死尚餘文字帶芳鮮欲收膏馥增前集舶使新詩自合編五月晦日會知宗提舶通判納涼雲榭提舶用仙字韻即席賦詩中寓四字次韻以酬雲榭銜杯半八仙却疑來自蜀山川地如洙泗占髙第人似羲和分昊天單騎聮翩成駟馬杯羔淡薄從三鮮國風雅頌寂寥久太史採詩冝與編知宗提舶即席贈詩用元韻以酬并簡通判子政堂堂漢列仙清標况對馬文淵代川字催詩風送千山雨把酒涼生五月天老子濫分南郡竹二車行擊故家鮮通判將美解誤蒙好語相提拂豈有功名上簡編提舶欲移厨過雲榭示詩次韻雨中前日過蘇端又欲移厨就稍寬古榭有風聊可共衰顔得酒定須丹謫仙醉後句尤徑東野老來詩更寒繼取洛中真率會他年要作畫啚看提舶携具過雲榭知宗出示和章復用韻不須蠟屐上林端髙處登臨眼自寬䆉稏風翻梅裏白稻最早者農家日為梅裏白離支日照鶴頂丹山川滿目如京洛臺榭侵雲類廣寒賓主往來俱不逺如棠不比魯侯觀老來憂患苦無端一笑相逢強自寬詩律頻調代音樂壽觴滿引當仙丹二山坐對事非偶二山一名朋山與賤名偶同三徑思歸盟不寒出岫白雲知幾許榭中矯首共遐觀知宗即席和端字韻三首提舶退即足之子第三詩經夕方和録呈二家毫秃中山硯滌端社中詩令不容寬難追老杜風騷手徒費昌黎點勘丹搜我枯腸鬚鬢皓吟公佳句齒牙寒自慙淺陋如曺鄫季子觀風定不觀傳興化送蔡端明集報以溫公文因求端明帖迃叟遺文整頓𥘉寄君聊當報瓊琚南鄰尚有無厭意更覔皇朝第一書東坡謂君謨書為本朝第一陳賀州速客送酒賀州呼客細論文我欲相過與共論正恐俗他真率會不如分去聖賢樽簮當濃緑畫中盍杯向輕紅擘處翻即席有詩應寄我𫾣門來送月黃昏丁惠安贈肉蓯蓉康臣字道濟老子當歸興巳濃令君何事寄蓯蓉行將卜築前湖去簑笠牽牛作老農往年同泛舟城南有卜築之意梅溪先生後集卷第十七梅溪先生文集卷第十七序送吳教授秉信歸省序四明吳先生名世巨儒才髙行尊以斯道自任未嘗屈節以阿世青衫不調殆一星終矣頃以朝廷之命主師席于東嘉教人以正心誠意之學每以身先之不期年而士子皆有所矝式太守端明李公下車之初知先生之賢延為蓮幕上客先生以儒術飾吏事談笑間而邦人隂受其賜公卿大夫聞先生之名鶚書交薦衆皆謂先生不日去而羽儀天朝也然先生純孝人也獨念慈親在堂鬢髮垂素慨然興歎揖諸生而歸于是邦之士庶至于縉紳之徒緇黃之流詣府挽之千餘人而先生終不肯留識與不識聞先生之行也莫不歎息以謂賢于古人逺矣昔季子佩印于洛陽買臣衣錦于會稽長卿駟馬而入蜀二踈聮轡而出關天下至今傳之以為榮然是歸也富貴之歸也非先生今日之歸也淵明尋三徑之松菊季膺思千里之􅐜鱸賀老踈狂于鑑湖李願徜徉于盤谷天下稱之以為髙然是歸也隱者之歸也非先生今日之歸也先生之心以為印綬之榮不若吾綵衣之戲禽魚之樂不若吾羊棗之養今日之歸大有功于風教矣豈直以富貴而跨鄊閭髙尚而傲世俗哉雖然古人蓋有以志事親者不必朝夕在乎左右也節行修于身政事理于官功德及于民聲名聞于後則其身雖在千里之逺而其心不啻若左右之樂也吾知先生朝而歸暮而復來乎不然必為蒼生而起天下皆受其賜也某海角賤生方獲摳衣坐隅執弟子禮而先生行矣瞻戀為如何耶于是序其事又從而歌之曰歸去來兮先生胡為而歸陟彼髙岡白雲孤飛先生胡為乎不歸先生歸兮何時來小子狂簡不知所裁先生胡為乎不來泮宫峩峩泮水洋洋先生來兮芹芳藻香先生去兮鸞飛鳯翔南浦老人詩集序紹興壬子秋南浦翁喪于橫陽訃至某哭之悲已而發囊中得其遺藁有詩數十首皆手所親書視之歎曰雖無老成人尚有典刑吾不復見此翁矣此藁其典刑乎某恨生太晚不及識翁壯年時見鄊人言翁昔年豪氣可掬常坐屈輩行直出其上有不可其意輒以氣排之尤簡世俗輩視之若無人性嗜酒不治生事晚年偃蹇不遇家貧無資饘粥是纍東役西馳有酸寒可憐態前日之氣使然也子不見去時得一醉揚眉瞬目髙談雄辨尚有壯年之風某年少狂妄幸得以詩禮與翁接獲陪緒餘之論乘間以鄊人語問之翁微頷而笑豫又問昔年製作尚能記否翁曰盡亡矣吾壯年不獨豪于氣亦豪于詩今日氣窮詩亦然也豫悲其言翁雖老作詩不輟一日常不下數首皆信口成不加煆錬而有自然氣象然隨作隨七不復顧惜豫既一二年與之遊懼其老而死不可復得屢求之一日以藳示豫皆近作所藏之歲餘而翁死遂出之合平日所記與兒曺所傳録成一集然尚有恨者所得止暮年之一二多窮愁一鬱之氣壯年豪邁語無一字留吁可惜哉翁姓劉諱光字謙仲本南浦人久寓居樂清鄊人以其老也呼之曰老劉豫命其集曰南浦老人集濳澗嚴闍梨文集序某始總角見祖母賈常道其兄嚴闍梨之為人必繼之以欷歔涕泣某幼而未識之也及稍成童出遊鄊校見先輩老成多能道其事且稱其文翰俱妙不獨冠絶于其徒往往吾儒中亦鮮能及者某時既聞其言而得其為人且私慕之恨乎生之晚不及一見焉逮今又十年餘始獲見其詩文嗚呼師真非常人惜乎遁迹于桑門無賢士大夫與之遊推揚而夸大之遂使其名泯滅而無聞某見古之隱者逃名而名益彰晦身而身益顯是無他有賢士大夫推揚而夸大之也佛之徒本無求于世真所謂逃名而晦身者然古之髙僧皆能垂名于不杇蓋其所與遊盡當世知名之士如晉宋李唐道林道安惠逺惠休文暢皎然之徒其所與遊則王逸少謝安石習鑿齒謝靈運鮑明逺栁子厚韋應物諸公皆一時選議論所加天下以為輕重遂能使幽潛隱遁之迹藹然發揮于當世而垂耀于無窮以師之聽明髙學卓然過人使得王謝之徒與之遊假其吹噓奬拔之力則聲名振世未必不如古之髙人也師嘗作溫州開元天王殿記文詞雄偉膾炙人口有俞清老者一時名士見而嘆服以書來告曰不意今人巾復見古人也然其人譽望非安石逸少諸公比亦不能成師之名師少出逰江湖歷遍山川飛錫帝都振衣嵩洛覽古人之遺迹徘徊于其間然其志節甚髙未嘗甚屈以求王公大人之知巳其言有曰古之桑門上首與士大夫遊非求之也道自合焉爾既而還東嘉隱潛澗誅茅結廬于山林間賦詩鼓琴以自娛顧世莫已知者其詩有𣣔言重嘆無余和之句某一讀而三悲之師之沒今二十三年矣平生製述甚多旋巳遺亡某頃遊明慶訪師之舊廬而求其遺文師之弟子曰宗要者某之叔父也得其古律詩雜文通數十篇為一卷出以相示某既自五歲而知師之名十歲而愛慕其為人又歎其不遇知已而沒世無聞今喜見其文如見其人遂丐以歸又自顧晚學小子無聲名勢力可以動人能重師之文于世姑敘而藏之以俟知者師名處嚴字伯威其詩醇重典實不尚浮靡他文皆如之紹興甲寅仲冬望日序劉方叔待評集序昔人有逺行者將由越而之燕膏車秣馬志在一日而千里也馳十日猶未離乎越回首南望自以為逺矣俯仰在塗猶在萬里之外于是益馳前又十日去越而適吳過吳而至楚回首南望益以為逺而前途猶未能十之一也又過楚而至宋又至乎魏又至乎河洛之間其途始半矣又益馳遂逺而至乎秦又逺至乎趙南望益逺又益比馳遂一日果至乎燕然後解車休馬徜徉四顧自謂天下之至逺者吾巳盡行之矣今雖𣣔不止而行亦無所之也及問燕之人且謂過燕而此又有逺于自越而之燕者行者始歎息知天下之逺有窮平生之力終不能至者也昔漢有張騫者最善行嘗持使節通西域泛靈槎窮河源此其逺又不止乎自越之燕而巳由是又知天下之逺固有人迹所不及者然能力行而不巳則亦無所不至也豫嘗以行者而喻學者竊謂學之源流甚逺固非一日可至苟能自進不巳積一日之力以至乎千萬日超乎逺大之域矣今之學者憚其逺而難至也是以中道而畫亦猶行者未越境而回車望吳楚之郊猶未之見又惡覩古人窮其至逺者乎吾友劉方叔年甚少氣甚鋭好學問而工辭章所謂日進而不巳者吾前年邂逅于蕭峯之下一見如故遂出詩篇以相示吾固知方叔可喜人也自是每見之必示豫以所作其詞益加于前豫益嘆服今春訪豫又示豫以待評集其間詩賦小詞無慮百篇體兼古律愈新愈竒至前日又見其集益增新製于其間比今春所見又加𢾗等豫三年間見方叔之進如此日進不巳將何所不至也方叔之集既名曰待評又命豫序之意𣣔待豫文而評其當否也豫𣣔評方叔昔日之詩耶今日過之逺矣𣣔評今日之詩耶方叔之進將不如此而已豫未可評也方叔之詩譬夫行者將不止燕趙之間異日升崑崙之巔乘髙風而飄襟𥚑者豫固以此而望乎方叔方叔亦當以此而自志乎姑勉之送表叔賈元範赴省試序某嘗謂古之取士先德行後之取士尚文藝雖人事若不同科而天理未容或異以德行取士人事固與天理合以文藝取士人事固與天理違然天理默行于人事間世有莫得而知者唐王勃楊炯之徒以文章號以四傑而德行無取焉裴行儉以見之已不許其逺到且謂士之致逺先器識後文藝四子訖如其言行儉非神也而能料人如許其必以天理卜之乎由是知科舉取士雖專在文藝間然由文藝進者必德行副之斯可致逺大之地吾鄊先生賈公其文藝德行蕪長者與早歲蜚聲太學名上賢書久矣天𣣔大其器而晚成之淹徊且二十載隱居鹿岩行誼卓絶月旦鄉評及竹道之語咸謂先生隂德在人天必相之年今且五十以免舉赴春闈政天相先生時也豈不見其眉間黃氣乎天理巳著見于此自今而後學者知德行可取富貴不専尚齪齪文藝矣某既著為天理説且拭目以待𣣔驗斯言之不妄云送吳翼萬庠赴省試序韓退之作師説言弟子不必不如師師不必賢弟子豫𥘉怪其言謂師者人之模範寧有不弟子如耶紹興甲子豫闢館梅溪朋友以豫年居其先妄以師席見推執卷而從者四十人常月較其文用三等以品第之其間頴然以才名稱者十餘輩齒頰鏘鏘類能道驚人語豫踈繆反資其發藥者居多然後知退之言為不妄是歲朝廷修三載故事下詔取士豫欣然對鄊人語吾徒其必有人乎既而有燕巢于堂形如品字識者知其為祥是秋萬子庠中鄊選徐子大亨中國學選吳子翼中同文館選一時物論咸推梅溪為盛事且二三子尤豫平昔遊揚侈大號為上遊者豫用是竊知人之名冬十一月同舍展餞禮時徐子居賢關獨吳子萬子預焉酒三行豫祝之曰昔公孫弘以賢良召轅固生謂之曰公孫子務正學以言無曲學以阿世今二子將戰藝春闈射䇿天庭當不負平日所學公孫不用轅生言以阿合取容雖能褒然為舉首用布衣取封矦君子不貴焉子慎無忽吾言西行見徐子問訊無恙外道豫語告之果能如張籍不叛退之否明年之夏緑槐夾道拂面薰風有青衫少年聯騎而歸天香滿袖喜氣津津出眉宇間過我于梅溪者其三子乎為林彥明千秋榖序濟南林君訪山間謂不孝子王某曰子知今歲之大有年乎冨者廪積貧者瓶儲雖吾懸罄室中聚𢾗十指而啼飢耳子盍以盈幅之𥿄為吾之田疇𢾗寸之管為吾之犁鋤寫一二心聲為吾之銍艾吾將穫干故舊之鄊斂于仁義之里稇載而歸庶不虗為樂歲人也某聞之惻然因召楮先生管城子而與之謀皆感慨動懷遂書此可憐語以告指廪君子淵源堂十二詩序剡溪周君闢家孰于居第之前有堂有軒其𢾗偶有館有室有池其數竒有齋焉其象數五行通而計之其數象十有二月命客王某名之某采汝南家訓名其堂之中者曰淵源且記之矣其十有一咸采名于杜詩淵源堂之右廡有堂焉賔主論文之所也名曰細論取重與細論文句由細論堂而北有軒焉頗幽邃植岩桂一本以宜之名曰冝桂取宜人獨桂林句由淵源堂而西有軒焉其景物絶瀟灑而人稱之名曰藴秀取剡溪藴秀異句由淵源堂而有東館焉主人處豫于其間豫之來也修同舍之好名曰同襟取時赴鄭老同襟期句冝桂軒之內有齊焉書籍粗偱足以自娛名曰富學取學業醇儒冨句藴秀軒之內有齊焉吾同舍日摛藻于其間名曰輝聲取自怪一日聲輝赫句同襟館之側有齊焉虛而曠可以群居名曰集彥取且隨群彥集句淵源堂之左廉有齊焉主人擇士以誨蘭玉之少者名曰擢秀取偶然擢秀非難取句入門而左有齊焉常虎之會有逺方之士至主人館焉其來如歸名曰恢義取首唱恢大義句藴秀軒之隅有丈室可坐二人名曰蘭馨取裴李春蘭馨句細論堂之前有方池名曰足鯉實無鯉也蓋寓意焉豫謂人生聚散無常豈能長論文于此堂耶異日尺素之傳有望于雙鯉故取池中足鯉魚句且戒其勿為髙詹事也既名之矣又賦十二詩詩二十字以淵源堂為首目曰淵源堂十二詩而識之以序記四友堂記家君燕坐乎四友堂某侍側家君曰汝知吾此室之意乎吾言汝書之丈夫之于世窮逹之道不同而其所樂一也季子之金印買臣之畫錦長卿之駟馬何曽之萬錢古之人得志于當時者之所樂也靈運之山水淵明之琴酒北山之猿鶴謫仙之影月古之人不遇于時者之所樂也吾非不𣣔為得志者之所為而慕窮者之所樂也富貴有命不可幸而致甘心貧賤者士之安于分而樂其生吾之所當行也于是即所居之宇造方丈之室藏書一笥置酒一壼設榻一張而吾以一身寓乎三者之間故名之曰四友也明窗棐九前經後史整冠肅容端拜聖賢于千古瞑目攘臂訶斥姦諛于巳死者此吾之友于書也清者聖濁者賢寄笑傲于一尊之中而逍遙乎無何有之鄉者此吾之友于酒也及乎書疊窗几興闌尊爼曲肱而髙枕坦腹而獨卧訪周公于恍惚之間與蝴蝶悠揚而俱化者此吾之友于榻也烏巾道服蒼顔白髮頽然乎其間者吾之樂也若夫曉色動而窗牖明夕陽盡而燈燭光者室中之朝暮也和氣襲而書帷溫南窗闢而薰風來竹簟設而涼颷生簾幕垂而紅爐然者室中之四時也吾與三友相從乎一室無言而妙意得不想而萬慮息物且不得而我纍形亦于是而我忘也彼有汲汲于富貴戚戚于貧賤奔走于勢利之門老死于憂樂之塗者吾不為也語畢某拜而記之緑畫軒記出簫峯西南二十里有山逺引若虹霓之狀故俗謂之霓山樂安孫君之居得霓山之勝峯巒竒偉林麓靜深有泉發于其下可飲可灌于是枕山而立棟宇因流而蓄池沼結軒嚮明收拾景象軒之外有嘉木數株修竹千挺蓊鬱蒼翠嬋姢瀟灑播為踈林舒為濃隂舞清風搖蒼煙影明月漏山光之窈窕蔭碧沼之漣漪禽鳥宅其幽龜魚息其隂左右青山環合映帶藍黛之色與天連碧四時不凋眼界常青望之宛然如在圖畫中蓋此軒之佳致也主人與客日飲于其間寒光入座秀色可掬明瑩柸盤冷襲襟宇魂清氣爽深柸不能發其醉情舒興逺髙歌不能寫其逸觀者在旁疑其壼觴几席皆圖畫物中賓主僕從皆圖畫中人也有客遊兹軒嘗陪主人之清尊覽景物之幽竒寓之于目得之于心有若不能忘者主人曰客為我名之客曰豫嘗讀韓退之南山詩有濃緑畫新就之句愛其清新峭拔恨斯景之莫見今此軒之秀庶幾其髣佛來其語而名之可乎主人曰可客為吾記之客曰軒宇景物之大概四時朝暮之氣象生綃一幅可得而畫也濃緑之句可采而名也若夫清風一來披雲拂玉天籟之竒非絲非竹雖神工妙手有莫得而模寫博物辨口亦不能形容也豫將何言大井記豫始祖五代末自錢塘徙于溫州樂清之左原逮今無慮二十房雖吾廬世得先祖始卜之地閲二百年矣家之東南有井焉不知其疏鑿之始其深才二丈方不踰丈水清而味甘寒于夏而溫于冬至歲亢旱他井皆告枯兹獨不竭提罌而汲者駢集也大觀間吾家築新門遂徙舊門為井亭作林以護之植雙桂于南北兩旁名其亭曰投轄皆先人之雅致也宣和辛丑魔冦犯境吾廬數千百椽燎而為埃惟是亭與門幸而獨存蓋吾家遺迹也是井有三可書當大父之世鄉人號吾居為大井頭王家井非甚大而以大得名以其大于他井也非吾家大之見大于鄉人爾宣和壬寅大父得疾服藥思鯽魚時方盛暑不可遽致先人憂見顔色遂垂鈎于井獲巨鱗豫時年十有一侍立井旁親見之井初無魚先人素不善鈎蓋孝感也紹興癸亥豫闢家孰于井之南用友歲集焉飲灌洗濯率資其利至庚午季夏群臧夜汲以有光告豫往視之果不誣嘗作井光辨以識之矣意謂魚鱉之族鱗甲文理發光于夜或螺胎蚌腹産珠以自照然未可知也必有博物君子辨之者是井有能大名有孝感之異有光輝之象其可沒而不書耶且三者皆豫耳聞目見之實非誕語也然是井可目曰大曰孝曰光豫獨以大名之者先吾祖也作大井記六月二十六日書代笠亭記吾家之西北原有田二頃蓋先業也吾季弟昌齡日課農事于其間有雨晹風埃之患蓋焉而手疲屩焉而足繭釐面目暴肌體身勞而况惡于是即田之畔因隙地夷積石創容膝之亭而名以代笠豫聞而勞之曰子亦良苦矣然子之志巧于以物代物而子之心樂于以勞代勞也子少蒙義方之教將以祿代耕一戰賢關爭違其願懼事親日短而三釡之不逮也退歸于家躬水菽之養以代之子以二兄日從事乎黃卷不知稼穡之艱難懼田園將蕪百指不能以自活也遂和淵明之詩賦勸農之章躬隴畝之勞以代之朝東臯莫西疇厭春雨秋陽上笠下屩之縻手足也遂作亭以代之此子巧于以物代物樂于以勞代勞而孝弟之道實寓乎此亭也吾家多難生事蕭然親喪在殯窀穸之奉未畢正人子痛心之時子于勞苦蓋有不得而辭者矣然子于耕稼之餘手不廢卷日與竹先生昌齡目硯監曰竹先生毛頴陶泓諸子從遊于是亭而深得書林藝圃之趣他日登金門上玉堂則當為天子代言之士移甽畝所樂之道而論之于廣厦之間則當為代天秩物之事子之以物代物也其智愈大其以勞代勞也又將移孝而忠矣奚止以一亭代笠而巳哉君弟勉之兄某記觀水記梅溪之南有巨溪焉會一原之水而東歸者也俗曰前溪時惟孟秋淫潦踰浹平原出水會天色少霽吾徒以觀水告豫與之偕涉流而南漫而平田湍而拍岸其狀也如雪飛空如銀沸鎔如熾萬薪而煎九鼎之湯激焉而珠洶焉而雷壯乎哉其不可以形容也顧謂諸友曰孟子稱觀水有術必觀其瀾諸友今日之觀其有得于水乎時同行十有二人李大鼎庚謝鵬臯朋周千里震鄭蓀志童侃塢一唯夏伯虎陳廣豫與焉不往者二人謝與能楊寓庚午七月二十六日記巖松記野人有以岩松至梅溪者異質叢生根􅋦拳石茂焉匪孤森焉匪喬柏葉檜身而松氣象焉藏參天覆地之意于盈握間亦草木之英竒者豫頗愛之植以瓦盆置之小成室稽古之暇寓陶先生鄭先生之趣焉是日與同舍飲茗談故事因共觀之咸有欲得之色豫曰有能賞之以言者豫不敢吝俄篇章爭先而並至皆佳作也豫不暇品第之莫知所贈因徙至于會趣堂與八齋之衆共之且告之曰諸友講于斯食于斯遊息于斯是松也常在眼焉奚必几案間然後為吾物耶雖然是松之意不可不知也岩産質松肖形諸友不几之姿也青青之色凌傲霜雪諸友歲寒之心也鬱密輪囷若偃若伸爪距奮而鱗鬛生諸友變化之象也今日之觀豈曰玩物而巳哉唐人之詩曰朂君青松心豫于諸友亦云紹興辛未四月晦日記追逺亭記儒與墨其道本相為用故世謂之孔墨然先師孟子獨危弗然闢之以為無親何也蓋二家皆尚儉儒儉于其身而厚其親墨氏身親俱儉焉儒治喪以厚墨治喪以薄儒謂飬生不足以當大事惟送死可以當大事又謂君子不以天下儉其親而墨氏乃以薄為其道宜其得罪於名教也孟子之學出于子思子思之學出于曾子而曾子逰孔門以孝稱夫子為參作經其末章有曰卜其宅兆而安措之為之宗廟以鬼饗之春秋祭祀以時思之參發明夫子之意而為之言曰慎終追逺民德歸厚矣伋又廣曽子之意而為之言曰喪三日而殮三月而葬凡附于身與棺者必誠必信勿之有悔焉耳矣孟子行其所學于師者盡棺槨衣衾之美以葬親富踰于前而葬亦踰于前其闢夷子之言足以為萬世人子之法師友淵源得有所自也吾徒錢生萬中年少而好學居家以孝謹稱其喪祖母氏也能竭力以佐父其奉窀穸之事得吉地于黃奧之原以為藏室極其工力而不計其費又築亭于其前以饗之名曰追逺將葬來告于豫曰大事有日亭無文以記之敢請豫曰子孝以事親而厚其所逮事用孟子不儉之訓以治喪又采曽子追遠之語以名亭將不忘于春秋之享子之存心如是之厚謂子非流者儒可乎豫敢以荒迷蕪陋辭耶于是千書紹興辛未十月日記淵源堂記先儒孟子有言曰君子深造之以道𣣔其自得之也自得之則居之安居之安則資之深資之深則取之左右逢其源故君子𣣔其自得之也説者因孟子之言而論淵源之學謂本乎自得非師友傳授之可能嗚呼是見孟子之言而不究孟子之不必言也夫𣣔造道于未得之前而不資諸師友可乎必深造而後能自得非孟子有所不能言未有舍師友而自能深造者此又孟子之所不必言也孟子知性為善知道莫大乎仁義發其素藴著為七篇之書蓋其自得有如此者然考其師友淵源豈無所自云世之學者多矣而自得者鮮蓋由誤觀孟子之書而以不親師友為自得且其父兄之教子弟也固非無師友也然其命之之意殆不過𣣔其傳句讀習文詞以求速化之術爾鮮有及乎道學之淵源者而望其深造自得可乎剡溪周君某天資好善而樂教子弟嘗命工製先聖十哲坐象及列畫七十二子為一堂即家孰而欽奉之又親筆而詔其子孫曰親師友之淵源噫公之為家訓過人一等矣其後諸孫日益長師友日益親淵源日益叩而事業日益修推其緒餘以事進取有隸天子學登鄊老書擢進士第者凡𢾗人餘皆以學問自立而其進未艾由是剡之學者推周氏為盛蓋本于公一言之訓而得師友淵源之力焉某與公之孫世修同舍上庠遂獲登公之堂而觀其遺迹時公化去巳二載矣公長子仁泣謂某曰吾先子手澤在是吾懼不能繼志又慮諸子若孫或懈而弗遵以深吾罪子幸不吾鄙辱臨茲館又辱與吾兒遊幸為我名其堂且記其事某辭鄙陋不獲因采公語以名之并書其大略俾後人母忘賢祖之遺訓焉紹興祭酉四月日記細論堂記淵源堂之右廉有堂焉主人與客日飲文字于其間紹興癸酉豫與其徒數人遊剡溪客于主人之館登是堂而陪芳尊者屢矣主人曰客與我名之豫因誦杜少陵憶李謫仙詩云渭北春天樹江東日暮雲何時一尊酒重與細論文顧謂主人曰君遊太學且十年筆硯之交滿天下然尊酒論文之時少而江東渭北之日多當花間一壺酒獨酌無相親之夕把柸邀月而月不能言俯地見影而影不與君語雖有胸中萬卷書將誰與論乎豫與君為八年同舍之舊而不見者巳五年矣况君之所𣣔見者不止于豫而所不得見者蓋有不止于五年之久者焉人生如白駒過隙所謂五年者能有幾而會合如此之難思之寧不慨然耶君不豫鄙而以論文見招者亦五年矣豫方奪于憂患而困于貧賤雖屢勤魚鴈之書而久違雞黍之約今乃不憚𢾗百里遠訪君于雪深興盡之故溪獲重上君子堂對酒尊而共燈燭又幸坐中之客無薰蕕之不同相與論文固有不可巳者然豫學淺識陋尤怯于文字之論他日博雅君子如李杜輩過君之門而登君之堂君當設醴而與之細論可也豫𣣔采杜詩斷章而名之曰細論君以為如何主人曰善遂書之四月日記舫齋記知進而不知退者非特縉紳坐斯患也雖出世之士亦然佛之徒本逃名晦身若無意于世者然世之善知識其道學有餘可以淑諸人應緣而出有不能自巳者其間好進之徒怵于利𣣔往往賄以求進老而不休訟而不去者蓋紛如也惟昌夀淨慧師則不然師少遊錫異方潛心佛隴志識學問出人一頭業成而還為翻林所推服始傳教于永嘉之開元再傳于福聖既而以疾求還故山住夀昌教院凡若千載年愈尊德愈隆道俗愈歸重然即未嘗一日不以退居養老為懷世緣挽之而莫能自脫也某與師有二十年之舊一日訪師而師巳獲遂某退老之志居所謂舫齊者欣然見顔色間指是齋謂某曰豫為我記之某曰師昔嘗乘無量大法舫遊無邉大海中出大誓願力濟百億萬大衆矣今兹舫也其形模似矣然而閣焉而不能浮靜焉而不能濟隘焉而不能容師獨善其身可也如衆生何師笑曰吾師乘法舫而遊人以為無量也吾不知其為大今吾耶是舫以居也人以為不能容也吾不知其為小且夫迹有去住而道無去住形有小大而法無小大身之進退迹也舫之大小形也吾出而化億萬衆于人世間者以無形之舫行無量之法爾退而寄老病之身于故廬者假有形之舫藏無量之法也將使夫聞而化者無貪于得無嗔于不得無癡于必求其所𣣔得又焉有賄而求進老而不休訟而不去也如子之所謂乎然則吾之退也未嘗無教化也兹舫雖小孰謂其非無量無邉法具乎某愧其言退而記之紹興乙亥三月日記梅溪先生文集卷第十七
