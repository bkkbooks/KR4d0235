body:
  text: 記妙果院藏記紹興戊寅春潛澗寶印師傳天台教于永嘉妙果院未幾有尼文贊來施寶藏直萬金緇素咸恱潛澗師走介致書于越命某記之某嘗聞吾儒中有二大善知識曰東坡居士曰王荆公俱以文章名世然其道不同終身不相恱及東坡記聖相藏荆公深嘆服之蓋二公俱深於佛故能賞音作者之手識者之眼不可相掩也如此某書生也于佛學素否通曉其將何説以發揚之然於潛澗為猶子義不可辭抑嘗聞佛之為教矣其説惡貪而喜施與吾儒同然其徒多好人之施而不能自施失佛之意逺甚今是尼也富于財積而能散生平植福之施動以千緡計又罄衣鉢以製是藏百寶粧嚴極其工巧卒不自有而歸之妙果可謂善施得佛之遺意矣然施易爾不妄施難是藏之成也求之者多咸莫之施妙果不求而藏自來可謂能具眼矣兹為可書偈曰壯哉古東嘉妙果宅其西老宿山中來應緣傳妙法有尼號員淨香火廬松楸衣鉢抽萬金造次大寶藏經文浩卷軸一一刺血書用報父母恩普及一切衆神光屢發現遍地生金星至誠感幽冥觀者咸贊嘆忽發喜捨心願歸諸妙果法師慧業就寶藏來證明所施以其人是能具道眼圎淨施寶藏道心益員淨况施于妙果因果冝無窮妙果得寶藏道場日益振大作諸佛事廣結諸因緣須彌一轉間功德無邉量轉轉無巳時功德亦如是夢庵記夢者誠之所形也髙宗形于得賢仲尼形于見聖莊周形于化蝶楊雄形于吐鳯范式形于葬友夢之小大雖不同其為誠之所形則一也仙居陳君勉卿執親喪如禮以孝稱于鄊初求佳城未獲寢食弗遑一夕夢侍其親逰于睦溪之原指其處以語之明日訪焉果得其地卜人吉之遂畢窀穸因築庵以守以夢名之志其所以得也某辱與君之弟文卿遊上庠為同舍生又與君之子三省逰于剡三省以夢庵之事語子且求文以記豫謂觀人之術不必驗之行事因其誠之所形亦足知其大略髙宗可以知其賢孔子可以知其聖莊周可以知其逹楊雄可以知其文范式可以知其義陳君之夢可謂知其孝矣彼有夢尸得官藏穢得財心之所念者果何事夢之所見者果何物耶與陳君之夢固有間矣雁蕩山夀聖白岩院記諾矩羅居震亘東南山名雁岩最為造物所惜祕于萬萬古而顯于本朝山中絶境皆廬于佛子開闢經營必其徒之有道力者驅龍蛇虎豹魑魅魍魎而有之權輿數椽侵尋萬柱如全了之庵于芙蓉今為能仁行亮谷于安禪今為靈岩文吉庵于碧霄今為靈峯是也山之內外招提無慮二十餘所問其經始與廢而復興無非有道力者焉山之東有嶺曰謝公丗傳靈運好逰山而不知有雁蕩蠟屣窮幽至此而返去嶺而北若干里有山曰白岩水曰仙溪去岩而北若干里有王子晉仙橋子晉遺迹在吾州者三一在永嘉二在樂清兹其一也夀聖院在白岩之下峰聳而竒水清而駃松竹蓊然而深蓋諾矩羅駐錫王子晉飛仙謝康樂登臨嘯咏之所宜幽人逸士逃名晦身修真學道者徜徉乎其間也院創于唐會昌四年至明年廢又明年復興𥘉曰仙溪白岩院至大宋治平四年十月始賜夀聖額宣和三年燎于魔寇院僧元象憫之草創殿閣塑像貌以奉香火歲久寖壞僧子親慨然曰兹山吾祖潘氏所捨殿與像吾師所建也其可坐眠而墮之耶于是紏同志募衆緣出力以成就之寶殿巍然輪奐翬飛觀者咸會歡喜讃嘆工未畢會傳教于邑之七寶雙峯二院其徒文表住是山遂卒其事而道場為之一新嗚呼君子親者真可謂具道力有功于其教者矣雁蕩山本覺院殿記有僧景暹來自雁蕩袖前傳法能仁宣公今傳法靈岩行公書求余文記本覺院殿余延之坐飯之贈以詩辭不能記暹曰宣公年踰九十有名行緇林推重為老禪今退居是山足以重吾徒行公蜀人傳心印于名師與賢士大夫遊且能詩嘗受知于君某以二禪師之命故來碩勿辭余善其言遂諾之院舊名延唐而不知其開山之始嘗廢于會昌至乾寧二年復興增額曰乾寧延唐我宋有天下元年改賜今名院在雁山之東隅住以甲乙祥符延禧間僧友忠南逰五羊得天竺國貝葉梵書以歸至今猶存釋家舊殿建于元豐𥘉歲久垂壞日者以山門不振咎其基之不吉暹出碩力募財鳩工垂二十年以紹興戊寅秋九月易地而遷之棟宇鼎新金碧照輝用力孔艱迄乃有成可嘉也巳詞曰雁蕩之陽延唐道場毁于會昌起廢乾寧我宋龍興本覺是名先民不作金仙斯覺以覺後覺山中老禪出世應緣亦覺之先咨爾釋子潛心宗旨不覺不巳忠得貝書暹興殿廬亦覺之徒殿廬既周勿怠薰修同國戚休唐祚既遷我宋是延億萬斯年天香亭記剡中佳山水為東南州之眉目汝南周君堯夫得爽塏于剡山之陽挾雙溪之勝而家其上廣厦耽耽在剡為甲有岩桂數百根皆古木也蒼然成林森然而隂洞前而深闢徑通幽而亭乎其中主人日與客遊焉如入宜人之林而夏不知暑如登飛來之峯而香飄自天如騎蟾蜍遊兔宫而下視人間世真剡中之絶景也豫丙子冬過剡把酒是亭時堯夫將戰藝南宫豫因目之曰天香明年春果擢巍苐與豫為同年友堯夫命豫記之而未暇逮今七載每移書必及之乃為之言曰學者方未第志在乎得耳得則喜失則非故以登科為化龍為折桂春風得意看花走馬晝錦還鄊世俗相歆豔曰仙子天上歸也是特布衣之士詫一第以為天香耳若夫學士大夫所謂香者則不然以不負居聀以不欺事君以清白正直立身姓名不汙干進之書足迹不至權貴之門進退以道窮逹知命節貫歲寒而流芳後丗斯可謂之香矣唐宋璟以芬香勉張説漢李固以糞土視胡廣趙戒名乎名乎科苐爵祿云乎哉堯夫筮仕有能聲且挺挺好議論時事逺大未易量豫方以名節相期必不負所以名亭者矣堯夫又能樂教難弟諸子皆力學行見棣蕚聨芳芝蘭並秀濟濟詵詵天香滿門不止燕山之竇而巳然科第之香孰知名節之香堯夫又當躬行以率之顔范祠堂記聖賢有不同時而生得同時而祀者勾龍棄同祀于壇為社稷之佐周公孔子同祀于學為先聖先師顔子孟子同配食于文宣王之廟功同道同時不必同也唐顔文忠公國朝范文正公時異道同者歟忠孝之性仁誼之學文武兼資之才正色立朝見危致命毅然不可奪之大節特書大書于史如出一身使其易地范必能捐軀死難如嚴霜烈日可畏而仰顔必能破西賊之膽威而臣之為慶曆頌中夔卨也又皆以直道不容出守于饒遺愛在民至今饒人語太守之賢者必以二公為首歲時祀之不絶隆興甲申秋七月某𥘉至郡訪二公之像或卑居乎老氏之官或雜處乎九賢之堂廟貌不稱祀事弗虔于典為缺郡圃有堂名慶朔文正所建也遂即堂以祀堂之右有宇而虛命工葺之塑二像合為一祠以時之先後而左右焉書二傳于壁後十一月丙寅帥同僚祀之歌曰宋唐相望三百年堂堂顔范兩巨賢文武忠孝名節全胡雛哮噬方無前二十四郡惟平原首唱大義扶危顛朝廷草昧官鷹鸇膽落邪侫驚梟鳶鬼質下拜心矍然殞身賊手命乃天一門忠義有二難凌煙閣上兄常山英烈言言光簡編銀鈎鐵畫餘剛堅致君堯舜書萬言樂後天下憂則先立朝蹇蹇心惓惓邪者我仇屢左遷夏童優邉躬􅐤鞬談笑為國臣腥羶閣開天章䇿治安誰吾與者杜富韓風采􅏢􅏢四諫官徂徠頌配嵩髙篇山髙水長大名傳吳頭楚尾番江邉甘棠遺愛清芬聨如秋桂菊春蘭荃像而祠之敢不虔黍稷蘋蘩羞豆籩一杯薄薦清灣泉公乎為神為飛仙假令而在當執鞭凡百君子宜勉􅏧思賢閣記番陽􅈦事之東偏有堂曰平政堂之北有閣曰芝秀郡以芝名者四􅈦之後堂曰玉芝驛與門曰靈芝及是閣是也皆因芝山以名然亦繁且復矣堂丗傳文正范公所名雖百世不可易是閣名與堂類冝易之閣北瞰郡圃春有百卉有遊人鳥有幽聲夏有濃緑有清風蟬嘒嘒有新聲秋有踈林冝夕陽冝月冬有茂松冝雪中觀冝風雨中聽然皆不足以名有九賢堂四賢堂在焉園林乃其遺躅也花卉皆其甘棠也茂松雪月乃其髙風餘韻也噪而靜鳴而幽乃其吟咏中景物也登其間思人遂名之曰思賢豫不才至郡且期矣日坐平政堂􅉵精神于案牘間不能使吏之不吾欺懼政之不平而有愧于斯堂也則登是閣而寓目焉思賢也訟理政平庶民安于田里而亡嘆息愁恨之心是將何術以致之此豫之所以思亦後人之所冝思也語曰見賢思齊焉羣賢不復見矣悠悠我思于是乎書乾道元年夏五月二十八日東嘉王某記瀟灑齋記思賢閣之下有齋方丈餘北鄉前有隙地僅一畒疊石百拳鑿沼一泓有喬木數株藤蔓絡之蒼然而古雜以桃李橘柚衆芳之植濃隂幽香清逼燕寢東望砌臺西接玉芝北臨郡圃隔以垣墻幽然有山林氣象宜琴宜棊宜飲酒賦詩簿書獄訟止于平政堂齋中不知也采文正范公郡齋即事詩名之曰瀟灑公𥘉為睦州有瀟灑桐廬郡十詩郡人嘗以瀟灑名亭矣及為是州又有齋中瀟灑過禪師句詩言志公所至以瀟灑見于詩章則胸中之瀟灑可知也讀郡齋詩至半雨黃華一江明月之句則知公之瀟灑于一齊矣讀桐廬十詩至史君無一事心共白雲空則知公之瀟灑于一郡矣讀區别妍媸削平禍亂之賦及先天下之憂而憂後天下之樂而樂之記與萬言書則其正色立朝之風采杖鉞分閫之威名經丗佐王之大略是皆推胸中瀟灑之藴而見之于為天下國家之大者也讀嚴陵祠堂記至先生之風山髙水長又知公與子陵雖出處之迹不同易地則皆然山髙水長非特子陵之瀟灑亦公之瀟灑也噫微斯人吾誰與歸是以名齊乾道元年六月朔日東嘉王某記夔州新修諸葛武侯祠堂記益與夔皆祠諸葛丞相並見于杜少陵詩錦官城外柏森森者益也卧龍無首對江濆者夔也夔墳永安縣據三峽上流水有瞿塘灔澦山有赤甲白鹽形勢險天下丞相昔與先主屯兵講武控扼吳魏經營中原之所有八陳圖永安宫卧龍山遺迹在焉祀而廟食冝矣然祠在州之南隅地非爽塏巷無喬木堂廡􅋻陋丹青黝剝祀事弗嚴無異乎蟲蛇穿畫壁時僅免無首而巳吁可歎也前帥紫微舍人張公震嘗立新祠于卧龍命緇徒奉之而城中之祠未暇修豈留以有待耶乾道改元某𬒳命自番昜夔時方乃祠力甚俄一夕夢觀八陳豈丞相精誠默有以告之十有一月至郡首謁祠下誄之以文曰丞相忠武蜀之伊吕髙卧南陽悲吟梁甫草廬之中三顧先主將漢是興非劉曷與君臣魚水蛟龍雲雨才十曺丕志少寰宇假令母死師一再舉吳魏可吞禮樂宜許寧使英雄墮淚今古將略非長庸史之語因命工葺之廟貌一新闢路植木榜其坊曰卧龍明年二月辛邜告成帥同僚祀之嗚呼公之生也能使其君委國託孤而不疑其沒也能使洶湧江流不轉千載之石然遺像缺落未嘗一出禍福以驚動之益足以見其聰明正直不顯其靈于土木偶以求人之敬畏殆非柳之羅池比也今夔之二祠相繼鼎新郡人四時香火牲牢酒醴之奉有加而不怠盛德百丗之祀益章可以一洗江濆異代之恥無愧乎錦官城矣于是乎書七月二十七日永嘉王某記寇忠愍公巴東祠記詩言志非謂其必出於作者之手而後見其志也後之人有取於古詩一章一句而賦詠之亦足以見焉國朝太平興國中寇萊公為巴東令有野水無人渡孤舟盡日橫之句識者知其必大用然世知誦公詩而不知是詩本出於韋應物公取其七字析而增之應物雖能道是語而官止郡刺史不見於施設殆不過為詩人之詩而巳及公取而用之則果能舟楫巨川是豈後人因其巳試之效而為是附會之説耶蓋公雅存濟世之心與舟橫野渡之意合正猶鄭七子之徒取風人之意而賦之言發諸口而肺肝之隱洞然可見志之善惡身之吉凶禍福皆不逃趙孟之所料也公為是邑時年方踰冠有愛在民世呼為寇巴東其後致身宰相踐其所言景德澶淵之功尤為雋偉方契丹入冦中外洶洶當時苟從建議之臣幸蜀江南則胡馬不止於飲河洛而三光五嶽之氣必分公獨毅然決親征之策鑾輿一動醜虜自斃社稷安於泰山天下混一者二百年較其功烈與傳岩之人任舟楫之寄中興有商未可得而輕重然性素剛直不與物浮沉晚節為姦邪所擠流落南荒以死天下至今哀之某頃過公安問枯竹再生處有祠在焉因賦詩吊之過巴東舊治訪其祠則巳廢矣惟秋風亭尚存則又賦詩有不似公安之嘆尉王寧孫永嘉人也因命其建祠塑像寧孫即亭祠之既成以其圗來令毛君恕集公詩百餘篇并刻豫詩以寄豫平生欣慕公之為人每嘆靖康間復有如公者出則南北豈至於分裂耶公之事固豫所樂書尚奚俟乎再三之請然巴東故祠廢而復興殘編斷藳散而復集江山增氣如公更生雖發端于豫而卒成就之者令與尉也皆不可以不書乾道二年八月朔永嘉王某記唐質肅公祠記于始聞夷陵巴東之名意其為邑必壯自適皆蕞爾邑巴東陋尤甚問其名之所以著曰昔寇萊公歐陽文忠公嘗令二邑地重以人非山川城郭人物之異于他邦也豫因謁其祠訪其遺躅嘆息而去至夔一日登郡之東城城下臨奉節縣治問令喻君思然曰昔宰是邑亦有如寇歐二公者乎令以唐質肅公對豫曰是皇祐中為御史獨立敢言嘗疏論貴戚廷擊宰相以貶天下稱為真御史不敢斥其名而曰唐子方者乎熙寧中有言王臨川不可大用及參大政奮然與爭是非于天子前而氣不為之屈至不勝其忿而死天下至今稱為正人者乎吾夫子歎未見剛者唐公非剛者歟名節凛然固無愧乎忠愍決澶淵之䇿文忠移司諫之書也其令是邑有殊績異政故相張公天覺嘗筆之于墓碑矣邑故有令如此而無祠非缺典歟令聞之慨然不謀于僚不役于民即􅈦事之東隅易亭為祠求畫像于江陵得之于故家丹青一新儼然如生觀者莫不起敬如見其冠豸觸邪正色立廟時也且丐豫記其事豫謂質肅公之髙名大節固巳特書大書于國史何以記為然是邑賴公而重有不可不書者令蜀人捫膝先生子也有家學治邑有能聲觀其所慕可以知其人矣乾道二年六月永嘉王某記夔州新遷諸葛武侯祠堂記武侯故祠在州之南門沿城而西三十六步無斷碑遺刻以考其歲月之始見于啚經者略焉在隋唐時治白帝史于少陵詩曰西郊諸葛廟者其地于兹乎某蒞事之𥘉謁焉裴徊四顧敬想風烈嘆廟宇之弗稱他事未遑也首葺而新之且書其事于石矣然地卑巷隘混以民居汙渠糞壤混乎其間臭朽之所蒸蝸蚓之所家非所以妥靈而崇祀也門之東去祠一百八十五步城有臺下臨八陳啚登臺而望則常山之蛇四頭八尾之勢宛其在目北直郡倉倉故永安宫也據爽塏狀如屏宫之北有水曰清瀼瀉出乎兩山之間東入干江又東過灔澦入于峽峽口有山卓然立乎群峯之外者白鹽也可謂江山之勝矣侯昔經營天下于平沙之上輸忠盡誠受遺立孤于是官之中江流洶而石如故宫闕廢而地猶存陵谷雖變而精誠不亡宜于兩者之間祠之亦侯之志也遂與同僚謀而遷焉地𥘉為節度推官宅徙于他所因其址築而髙之用其材斫而新之為堂五㨕廡萬椽南門于臺又門于西通往來之道像仍其舊新厥丹青冕服用侯又塑關張像翼于左右以諸作者詩文次之乾道三年四月壬午告成詩以祀之詞曰白鹽峙天兮灔澦屹江風雲慘淡兮翶翔卧龍龍千秋兮何之新廟貌兮江之湄前八陳兮後故官龍兮龍兮神其中望昭烈兮隔清瀼遺廟存兮交精神于惚恍駕虛空兮雲為馭臣東朝兮主兩顧魚得水而相忘兮事無古今儼關張于左右兮一龍二虎祠有新故兮侯無重輕舍其故而新是卜苟邦人之情祠合于啚兮自令始祀事不絶兮有如此水興化軍林氏重修旌表門閭記乾道五年春三月直祕閣新福建路轉運副使林公孝澤自莆陽移書于清源守永嘉王某曰孝澤八世祖攢有至性唐正元間居母喪哀毀甚自延甓以葬廬于墓有白烏甘露之祥時則有歐陽四門詹黃處士璞述之以文德宗詔立闕旌間先世大其門以侈之嘉祐紹興間因敝而修時則有紫微吕公夏卿今丞相陳公實為之記逮今二星餘不治且圮孝澤大懼哀瘁不克震耀其先而無以為子孫訓太守鍾離公松賢而樂善不持請慨然出公帑二十萬葺而新之因其舊而稍加焉莆陽故清源屬邑也孝澤之子㮤猶子虙皆君門下士幸為我記之某辭蕪陋未獲既而虙來請益堅屬病未果夏六月又走書以督之某曰孝子之事傳于史文于二三大手筆矣奚俟乎鄙文若夫孝感之異天報之厚守臣風化之敦與公之顯揚爾祖者則宜有歌詩以發揚之詩曰大哉孝為百行先通乎神明光普天聖經千有八百年亦以應感形諸萹李唐中葉正元年有林孝子家莆田喪親五日食不咽手開坎室土自肩葬廬其傍護隧埏恨不殞身赴重泉天聽匪髙應昭然瑞氣非雲亦非煙異香馥郁非蘭荃飴密匪甘珠匪圎腸中不晞明且堅靈鳥皓質來翩翩耳驚目嘆觀肩駢使者來廉迹其阡露隨哭聲灑雲邉詔旌門閭繇賦觸名書史册光厥傳年垂四百家聲綿雲來滿門業青編世登桂籍香名聮人葉有孫壽而賢移以事君忠孝全黃堂主人職承宣鼎新雙闕光厥前宋唐四傑雄文鐫奚止照耀莆山川要令四海皆參騫孰非人子冝勉旃泉州新修北樓記溫陵之有北樓猶武昌之有南樓也慺閣臺榭之在天下以南北名者多矣而二樓之名獨著得非因人而重邪南樓以庾公重北樓以歐陽四門重然庾有汚人之塵君子恥道之不若歐陽氏以一代文傑聮名韓李諸公真足以重兹樓也豫乾道四年冬十月至郡越數日䇿杖州宅之北有屋將壓邪衆木以支之詢之乃北樓也惕焉不敢睨矧敢登有碑塵如積漫不可讀乃四門所作之記歎息久之郡舍老而弊冝修者非一椽然莫急于兹樓也苐視事之始方問民疾苦土木之役非敢先郡多颶風日惟傾覆是懼明年春二月建貢院秋八月落成得餘材始命工葺之冬十有一月丁卯董役者以訖工告與同僚三四輩登而四顧山川城郭之冨盡在目中亦一州之壯觀也既相與賦詩又為之詞曰閩南有州北墉有樓席侯肇謀發揮以文樓乃有聞歐陽四門載建載修克紹逺猷鄭吕二侯政和間鄭南建紹興間吕用中重修歲月浸久楹腐桷杇伊豫來守偶歲之豐時定之中乃鳩爾工材即其餘費節其虛踰月如𥘉泉山之狀桐城之壯可登以望身焉南極心焉拱北守臣憂國匪遨匪逰風觀瘼求守臣登樓民淳俗朴災害不作登焉斯樂風俗惰偷閭閻恨愁登焉則憂居而官理登時民喜登斯無愧讀禮堂記為士者來嘗不讀書然知真讂書者解能讀而不能行是猶鳯鳴而鷙翰雖胸中有萬卷身為行祕書謂之不能讀可也子路曰何必讀書然後為學由也孔門髙苐號為有聞豈以書為不足讀耶必時人有能讀而不能行者與不讀同蓋有激而云然由之言非所以為訓故夫子疾之書之難讀者莫如喪葬之禮非難讀也不素讀也為人子者親方在堂諱聞不祥之言兒時入小學從句讀之師誦十八章之經至喪親章則或置而不授少長讀禮記凡喪葬之萹則掩卷而不忍讀一旦遭荒迷之變瞢然不知有直情徑行者矣豈復知品節斯斯之謂邪聖人著之禮經以詔人子曰未葬讀喪禮既葬讀祭禮非徒讀之正欲使之尊所聞行所知賢智者不至于過愚不肖勉強而跂及焉莆田蔣君元肅好古而能文于書無所不讀喜親之享年而榮其生封也名堂曰藴仁鄊黨歆豔之其執親之喪也又名堂曰讀禮養生喪死無憾可謂知真讀書矣昔吾夫子語門弟子曰生事之以禮死葬之以禮祭之以禮子思習聞家學以禮葬親四方于是乎觀焉滕文公問禮于孟子行三年之喪于戰國禮廢之時而弔者大恱禮之不可已也如此元肅于禮既飽讀而躬行之又以是而教學者南方多士其有立于禮乎然禮雜出于諸儒之手未必皆合聖人制作之意元肅既講習討論之冝削其不合者使禮記為全經斯有功于名教矣豈止誦讀云乎哉乾道六年三月永嘉王某記廣州重建學記聖人之道合內外𥘉無華夷邇遐之間不幸無時與位道不得而行必待後丗右文之主儒學名世之臣以主盟吾道樂育人才為巳任然後斯文有傳與王化並遐吾夫子以天縱將聖生于晚周之魯木鐸之教止行乎洙泗三千之徒所過之化僅及于歷聘七十二國爾嘗慨然欲居九夷淺人不知其志詆以為陋嗚呼使夫子居之何異坐杏壇之上化魋結為冠裳變鴂舌為絃歌濟濟洋洋是亦鄒魯也何陋之有炎漢李唐之君尚文崇儒文翁常衮以儒為郡咸能興學官登諸生授以詩書丕變蜀閩同風洙泗惟南粵去王都為最逺至仁如唐虞有所不能柔漢晉隋唐間雖號為一統然德薄化淺聲教不能暨朔南嶽牧名臣雖清白如吳隱之剛正如宋廣平咸著治績而庠序之事闕焉是冝裒衣博帶射䇿決科之士不能與閩蜀侔盛也宋興混一海宇臣妾僣偽南海四世之斫面縛闕下赦而不誅變汗染之俗為禮義之地慶曆間詔天下立學番禺僅能修夫子廟以應故事至皇祐間始建學于郡之東南隅熙寧𥘉徙于西紹聖𥘉守臣章楶改創新學然規模未宏不足以容多士與雄大之府弗稱乾道三年詔前右正言龔公茂良自憲臺為方伯下車之𥘉務先風化明年春上丁釋奠于先聖先師顧瞻祠宇痺陋楹桷頺圯繪像不如禮豆籩簠簋無餘地可陳廊廡迫隘至不容折旋講肄之所去殿庭不咫尺升者病之喟然謂諸生曰治孰有急于此乎于是始議改造即番山之址以為堂閣御書于其上東西十一筳南北九之庭之下什伯其𥘉增闢兩廡倍其舊六齋對峙前繪從祀像置番禺南海二縣學于後惟大成殿仍舊規而加葺之藻飾煥然侈于他所門以櫺星繚以周垣大江橫其前協泮水之制費出激賞公庫撙節之數憲漕舶三司助以羡緡斂不民及經始于夏四月訖工于日南至行釋菜鄊飲禮以落之明年公召還道溫陵謂守臣王某曰公為我記其略某與公嘗同事史館稔之其為人貌和氣平蓋一謹厚者耳及為天子言事官正色立朝排姦憸甚力視棄官爵如脫弊屣至今朝野語正人必稱公出典大藩又能行其所學不鄙夷遐方僻壤之民廣儒宫以教之可謂儒者矣郡博士日與諸生登忠恕堂明一貫之道講論齊家治國平天下之要于正心誠意間移孝為忠盡臣子之大節上不負天子下不負賢師帥所以教化作成者異日揚王庭立名節姓名光史册如張曲江薑日南余襄公者不一而足又豈止讀𥿄上語工文詞取科苐抗衡上國而巳哉于是乎書公字實之興化人今為江西帥云乾道七年正月敷文閣直學士左朝奉郎提舉江州太平興國宫王某記梅溪先生後集卷第二十六
