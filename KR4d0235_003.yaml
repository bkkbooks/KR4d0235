body:
  text: 除侍御史上殿劄子臣聞聖人之德無以加孝天子之孝莫大乎光祖宗而安社稷因前王盈成之業而守之者孝也周之成康漢之文景是也承前丗衰微之緒而興之者孝也啇之髙宗周之宣王是也國有耻而雪之者孝也漢宣帝臣單于以雪髙帝平城之耻唐太宗俘頡利以雪髙祖稱臣之耻是也先君有讎而復之孝也夏小康滅澆以復后相之讎漢光武誅王莾以復劉氏中絶之讎是也歷代帝王雖守成中興雪耻復讎之迹不同其功光祖宗孝安社稷則一而已我藝祖皇帝應天受命肇造大業親平僣偽一統萬方聖子神孫繼繼承承可謂盛矣不幸運厄陽九醜亂華靖康之禍有不忍言者國讎丗耻自古無之記曰君父之讎不共戴天春秋譏不討賊以謂國無臣子齊襄復九丗之讎仲尼賢之椘以六千里之國事讎荀卿罪之賢聖立言垂訓責後丗之為君臣為子孫者可謂至矣恭惟太上皇帝躬堯舜至聖之德有禹文知子之明斷自宸衷以社稷付之陛下聖意端有在焉陛下天資英武慨然以興復為念竊聞每對群臣論天下事則曰當如創業時又曰當以馬上治之又曰某事當俟恢復後為之臣比因宣召語及祖宗陵寢聖容惻然曰四十年矣臣仰知陛下之心真夏少康啇髙宗周宣王漢光武之心也奈何在位之臣不知忠孝大莭不能仰副聖心之萬一復欲蹈昔日姦臣之覆轍屈已以和仇讎之犬羊指祖宗中原之境土為虜人之土謂不當取指祖宗中原之人民為虜之人民謂不當納又取秦隴巳復之故地無故而棄之以資冦讎以絶生靈歸附之望聞有説進取者則群嘲而聚笑之大臣唱之於上小臣和之于下并為一談牢不可破自非陛下剛明果斷不惑群議則社稷大計其誰與謀有君無臣真可以長太息也臣碩陛下推誠盡孝終始如一言動之間不忘社稷食息之頃必念祖宗側身修行上以承天意興衰撥亂下以慰民心任賢勿二去邪勿疑以革前日圖任之失有善必賞有惡必罰以振冷日紀綱之弊仍下詔音戒飾有位無小無大咸懷忠良去和附之私心贊國家之大計陛下既率之以孝群臣咸應之以忠如是則可以動天地通神明慰祖宗在天之靈無負太上皇付托之意矣中原何患乎不復中興何待乎以日月兾耶論史浩劄子臣聞人臣之罪莫大於懷姦誤國植黨盜權忌言蔽賢欺君訕上有一於此罪不容誅衆惡備焉其何可赦臣謹按尚書右僕射史浩人品凡下天姿險姦昔為士人以榷酤犯罪身幾不免及試吏州縣姦贓狼藉惡聲播聞浩能以諂侫取容致身朝列夤緣遭際事陛下于潘藩龍飛在天躐居政府浩不知盡臣子之大莭報非常之恩機巧百端得罪公議臣請條其罪惡之著者有八焉往歲太上皇帝聞欽宗之計痛切宸衷下詔親征思雪國耻知陛下春秋鼎盛智勇天錫斷然以社稷付之深望陛下之大有為也浩為心腹之臣不能以忠自效乃於義不共戴天之日首進寢兵之言專主和議以沮大計蓋欲踵秦檜之態為固寵之身謀此懷姦之大罪一也太上皇憤􅊇亮之渝盟悟和戎之失䇿以疆埸之事付爪牙之臣大將吳璘等奮身血戰復秦隴故土屯兵固守俟時投機縱未能長驅以㝎中原亦可以牽制虜人南牧之患浩既主和懼吳璘進取隂使其黨鼓扇浮議妄謂虜與西夏協力攻璘遙從中制令不退者斬遂取十三州之地而盡棄之將士喪氣中原離心誤彼生靈盡遭魚肉不獨棄地是乃棄民不獨棄民是乃棄信皆由浩欲售一已之私而不顧國家之大計此誤國之大罪二也浩履歷既淺德望素輕驟居要塗天下竊笑於是取國家名器為一巳私恩躁進之徒翕然合為一黨門闌可以炙手士論為之沸騰至有嫡子嫡孫之號親姪過房之稱有號密傅心印者有號正法眼藏名者名居宗派布在朝列者紛如也昔王叔文竊柄有八司馬之黨李逢吉用事有八關十六子之徒浩得時遇主如此乃欲效叔文逢吉之為人此植黨之大罪三也浩自參朝政即盜大權視宰相若無人待同僚為不物人皆畏其凶焰莫敢誰何官爵科第輕以與人進退百官悉自巳出自為右揆益歸其姦方欲排擊所憎驅除異巳會其腹心內潰黨與相攻陛下察其姦邪知其朋比收欖權柄出自宸衷不然朝廷之禍可既耶此盜權之大罪四也陛下嗣位之𥘉首下求言之詔忠臣義士上封言事者非一浩抑讜直之言不使上達有侫巳者則以免解啖之春闈省試知舉三人上躰聖心策門時事浩疑其斥巳遂令黨人林安宅追捕雕匠勒令毀板三知舉嘗面奏其事有旨令刋行安宅憸人也知有浩而不知有陛下不遵聖旨而惟浩是從卒不許刋陛下取士之始而浩首禁程文何以彰清朝不諱耶此忌言之大罪五也太上皇用天下人望起舊相張浚知建康陛下因付以江淮重任擢為樞府委任之專不啻若憲宗之待裴度浩與浚氷炭不同且懼其成功凡有奏請必多端沮之𥘉遣史正志往建康欲沮浚進取之計及其既還遂酬以郎官又因詔百官言事遂令正志等密加詆毀指為許靖房琯有識為之不平此蔽賢之大罪六也浩凡與同列奏事未嘗不留身退則妄稱聖旨以誑之浩嘗有辭免參政劄子未嘗稱祖宗及太上皇之德退則增加數語以報行浩之欺君大率類此昔王欽若為相每奏事必袖數奏但出其一餘則詐稱巳得聖旨馬知莭嘗面折其姦浩挾欽若之姦以罔衆朝廷無知莭之直者以折之此欺君之大罪七也陛下即位之𥘉以大學生經太上皇教養之久並與免解浩乃為巳恩務在籠絡巳而聞諸生議巳遂深疾之復加沮抑嘗於稠人中言大學有風波臣對以子産不毀鄊校浩曰某固無他但上怒之爾浩近赴景靈宫行香道由貢院會太學補試士子填壅鄧王回車避之聞者欽嘆浩乃作威以逞為士子所嘲既而語人曰上怒補試喧譁欲令不考某以誤其逺來救之浩善則稱巳過則稱君皆此類也此訕上之大罪八也浩無宰相才而居具瞻之位遇堯舜主而懷共鯀之凶陛下方當任賢使能圖回大業如使浩輩久在廟堂其可以望中興之治耶臣碩陛下正其罪惡竄之逺方以快天下之心以為群臣之戒再論史浩劄子臣聞人主之職莫大乎任賢去邪任賢去邪莫先乎信賞必罰任賢而不知賞與不任去邪而不能罰與不去同古之帝王能任賢去邪者莫如舜舉八元八愷而相之取四凶而流之可謂能賞罰矣未聞以十二牧之任而處四凶于外也臣昨日面對論列尚書左僕射史浩之罪乞加竄殛陛下謂今日已罷之臣知陛下能去邪勿疑可謂無愧於舜矣及宣麻于庭乃以觀文殿大學士知紹府輿論咸以為疑謂陛下雖能去邪而未能如舜之正名定罪也人臣得時遇主未有如浩不忠於主亦未有如浩浩不忠之罪不可以一二數臣姑論其大而著者有八巳見前章效秦檜而主和議可謂懷姦棄德順而資冦讎可謂誤國名在宗沠者不止八司馬可謂植黨竊天下之柄不止如王叔文可謂盜權陛下導人使諌而浩鉗人之口可謂忌言陛下委任忠臣而浩百端譛毀可謂蔽賢留身奏事妄稱聖旨可謂欺君善則自稱過則歸主可謂訕上八罪有一且不容誅浩備有之其何可赦縱不投之四裔以禦魑魅其可以巨藩大我而賞姦耶臣恐天下未必咸服如虞舜時也况紹興密邇王都最為大府浩昔嘗為屬吏姦贓著聞亦何面目見其吏民耶臣願陛下出臣前章正其罪惡榹取名罷差遣竄之三危之地與天下共棄之庶使大功不專於舜也論進取利害劄子臣共惟陛下以英武之資奮剛明之斷不惑群議任用忠謀遣二將臣出征淮甸首平靈壁敗虜將蕭琦而降之又平虹縣降蒲察徒穆大周仁歸附者以萬計又敗虜人于宿而得其州可謂日百里以闢國月三捷以奏功矣投機而進勢如破竹恢復有期神人交慶正勇者效力智者獻謀時也况臣誤蒙親擢為耳目之官可無愚者一得之慮以禆廟謨雄斷之萬一乎臣竊謂工者仁義之兵為弔伐而舉况中原本吾土地人民本吾赤子正冝諭之以恩信先之以招納不得巳而戰伐隨之臣慮諸將或不知此臨陳之際未必無過有殺傷捷獲之後又未必無秋毫之犯恐傷陛下好生之德失中原來蘇之望欲乞陛下密詔張浚深戒敕之昔李晟平長安李訴入蔡國朝曺彬平金陵皆得王師弔伐之意冝諭諸將以此為法庶幾冨貴可以及子孫功名可以垂竹帛也又三虜將既降冝速加封爵以勸來者昔沛公入關留圍宛城陳恢説以莫若約降封其守因使止守諸城未下者必聞聲爭開門而待之沛公從其言南陽守齮降封為啇侯封陳恢千戶引兵西無不下者今中原列城為虜守者聞皆有離心非不𣣔降但未知吾所以待之者如何耳𬒳聞蕭琦蒲察之徒降而受賞亦何憚而不來不然則其心愈疑而其守愈堅矣今日之事正冝若沛公用陳恢策則可以不戰而屈人兵也臣又聞汪徹𬒳召巳至中塗未知誰挕其任臣謂冝今張浚并莭制荆襄庶得令出于一輕重不偏將士協心逺近同躰緩急可以相聞勝負可以相援况荆襄將士素懷浚恩德皇甫倜之徒尤服浚威名右使浚兼制之則人必樂於用命矣又璘退師保蜀陛下亦以進取事詔芝且明諭以日退保由建議者之失不惜為悔過語以慰將士及三路人心令璘觀時度勢以圖進取如秦隴可復得冝即進兵以相椅角以牽制虜人南牧之患如是則虜𢾗處受敵救覆亡之不暇縱未得其頭顱必將逺竄沙漠矣此數者皆今日之所甚急臣碩陛下與一二大臣速議如臣言可採乞賜施行今正是天以機會授陛下時不可失也論史正志劄子臣聞姦人多謀能觀時而為進退當權臣植黨則必附合以求進以竊美官及朝廷清明則又用姦計而苟免以逃天憲熙寧𥘉王安石為執政用小人吕惠卿之謀變祖宗法度逐朝廷正人天下莫不切齒及元豐未司馬光為相惠卿自知罪大為正論所不容遂丐祠于外兾脫典刑時蘇轍為諌官遂首論其惡安置建州天下抉之由是見祖宗時為臺諌者排擊姦邪未嘗因其求去而容其幸免也臣謹按吏部郎官史正志操心傾險賦性姦邪自為士人時常出入貴人之門専事交結乃𥘉登科遂欲求為秦熺之壻託平曰素所交結者賂熺乳媪使之譽巳秦氏聞而薄之遂不見納既而干求時相而得監倉善觀時以求進聞樞密葉義問欲議進取遂竊吳若江淮表裏論而增損之自號恢復要覽以投義問遂繇管庫而得密院編修為士論所嗤及史浩執政欲主和議正志復變前説以投浩浩喜其侫已遂遣之建康以為説客欲以口舌沮進取大計嘗談兵於張浚之前為浚所不禮正志乃妄撰語録設為巳與浚答問辨難之語歸以侫浩浩大喜之除為戶部郎官浩與正志姪同而族異拜浩而父事之在浩之門最為用事故士論有親姪之嘲正志既不見禮於浚遂極口詆之嘗應詔上書比浚為許靖房琯聞陛下召浚懼其不利於浩唱為浮議以沮其來時人比之張又新今陛下之浩之姦斷然罷之知浚之忠破群議而任之正志自知朋比讒慝得罪於清議遂力求去朝廷乃以福建運判與之正志能用姦以自免大類惠卿求去於元豈之未臣濫職風憲苟不論而擊之寧不自愧於蘇轍乎欲乞陛下特發英斷明正志讒慝朋比之罪以正典刑縱未能行兩觀之誅亦當薄示三危之竄庶使元祐清明之政復見於今日天下幸甚再論史正志劄子臣昨嘗論列吏部郎官史正志朋比讒慝自知罪大欲逃典刑力求外補朝廷以運判與之是用外臺重任以賞姦也欲乞睿斷正其罪而竄殛之至今未見施行臣深所未諭臣聞唐王叔文以沾沾小人竊天下柄號召時有名之士欲僥幸而躁進者並以郎官清要之職處之相與結為死黨至譽叔文為伊周管葛憲宗監國之始首逐叔文而殺之其徒皆終身竄殛號八司馬元和之治比迹正觀淮西功業冠出李唐蓋繇憲宗必於用罰於去邪也臣竊謂前宰相史浩之惡不減王叔文其黨與之盛不止八司馬雖非天下竒才至于撓莭以附匪人懷姦以害公議則一而巳如正志者在浩黨中尤為親密出入門闌蹤迹詭祕人皆呼之曰繼拜公又榜之曰親姪遂自樞屬驟遷戶部郎又遷天官郎使浩不去則正志必躐處侍從矣正志去冬歸自建康不獨搖撼張浚尤媒孽李顯忠之短必欲朝廷罷浚而誅李顯忠以沮恢復大計非陛下保全而委任之則忠臣良將身首且不可保豈復有今日淮甸之捷耶今國家方欲恢復中原所賴以激勸者賞罰而巳前日二將奏功賞不踰時輿論咸以為當讒慝之人亦冝薄正其罪今不獨逃司冦之刑而又以外臺耳目之寄處之何以尉天下之公議乎郎曺運判至么麼也而臣喋喋言之者非以其玷列宿汙外臺而巳而朝廷之刑賞公議之是非實擊焉伏乞陛下出臣兩章斷然逐之以示去邪勿疑亦足以懲一而勸百也論廣海二冦劄子臣聞王者將欲治外必先安其內不有小忍則不能成大謀臣竊見陛下剛斷不惑神武維揚命將出師平㝎淮甸曽未踰月捷音屢聞蓋將復祖宗之境土復會諸矦於東都可謂得宣王外壤之道有光武大敵之勇矣然臣愚計以謂治外必先安內欲小忍以成大謀者今欲外攘夷狄而境內有廣冦海賊嘯呼為患猶未勦除外未寧而內有憂不無上貽聖慮者臣竊聞朝廷議遣鄂渚之師進誅廣冦想蕩滌固有期矣然臣相時度冝恐未可遽進嶺外當盛夏乃瘴癘大作之秋北人衝之未有不病者尤非行師之利臣以謂不如頓兵於桂林以為聲勢而下詔赦其罪惡許其投降或不受命斯可以必殺無赦矣海冦出沒無常尤為瀕海州縣之患聞樞府嘗遣人招安之亦有受招之意臣謂二冦皆可開其自新之路庶得境內稍平可專意外攘臣所謂治外必先安內少忍以成大謀者此也臣又聞二冦之作皆緣監司郡守不得其人所致既未能弭之於未萌之前又不能誅之于巳覺之後養成其亂以致猖獗隱匿不聞遂致滋蔓為監司郡守者其可不懲之乎欲乞陛下宣諭宰相稍正典刑仍别擇賢才以為外臺共理之寄以分陛下宵旰之憂不勝幸甚論韓仲通俞良弼劄子臣聞古之為民師帥者能以德化人則人耻於為盜能以威服人則人不敢為盜能以智略屈人則可以除一時之盜三者俱無焉則何以為民師帥共理天下乎臣竊見廣賊海冦久未撲滅上勞聖慮者蓋繇帥守不得其人既不能使之懷德畏威又無智略以勦除之也朝廷不詰其致亂之由懲其不聀之罪又從而遷為大藩因而久任亦可謂失刑矣臣切見知明州韓仲通不能防禦海寇致昌國㝎海諸縣皆被其毒而海道為之不通𥘉有捕致海寇者仲通從而縱之遂致其徒益熾昌國令嘗獻謀於郡仲通忽而不聽四明人莫不切齒朝廷既不罷黜之又除知紹興府仲通不能治一郡其可以典大藩帥一路乎知靜江府俞良弼不能弭雷化之盜遂致蔓延而二廣為之騷然運使鄧酢用虔吉茶商以禽凌鐵良弼忌酢併與茶啇等皆不奏功致茶商憤然嘯呼而起醜黨數千人陷沒州縣殺戮官軍守臣有死者其勢方熾朝廷不能正良弼之罪乃因而久任之安能使鼠竊狗偷輩即時殄滅乎仲通刻薄小人昔為秦檜鷹犬其惡備見於白蕳臣不復論之議者猶謂其有麗才可以任使及治四明最無善狀専用公帑交結奧援海盜猖獗略無計畫其才亦可見矣良弼雖無仲通之惡然聞其老繆不事事况二廣去朝廷為最逺斯民所恃以為命者惟師帥之臣尓良弼為大帥而盜賊充斥如此何以安逺人乎臣欲乞􅐶斷罷仲通紹興之除奪良弼靜江之帥别擇有用之才以代之將見海廣二寇不誅而自滅矣論內庭節省劄子臣聞生財莫若莭財省用斯能足用今陛下方圖恢復而板曺以財用不足為言常賦既不能供所須民財又不可遽而取惟有痛加莭省可以薄助軍興然莭省一事尤在聖躬親率昔漢文帝身衣弋綈以致冨庶唐憲宗躬服浣濯以致中興藝祖皇帝幕用青布而僣偽以平仁宗皇帝𬒳用黃絁而凨俗歸厚此乃前代帝王之盛德我宋祖宗之家法尤不可不遵也陛下比從諌臣之請裁減外廷官吏度一月所省亦不下十萬緡以歲計之不無少補又切見內侍都知李綽具到宫掖用度之數有云此項全支者有云減半支者有云住支者內庭莭約如此亦可以風化天下矣然臣愚區區猶望陛下躬率之者益欲陛下於乘輿服御玉食之間有可更加莭損者親出御批斥賜外府以助軍須以為中外莭省之訓如內侍所具之數除德夀宫不可減損外亦有全支而或可減半者亦有巳減半而更可以分數減者陛下既躬率之為下者亦何敢不從耶俟邉事稍寧自當復舊今日權冝行之正聖訓所謂今日當如創業時也臣不勝拳拳之至論宿州退帥劄子臣聞宿州之師全軍退守觀時識變深淂進退之機然而異議小人與聖意素不合者往往幸災樂禍倡為浮議以動搖大計以離間陛下素所委任之臣使其説果行殆非宗社之福昔唐憲宗伐蔡戰數不利群臣爭請罷兵錢徽蕭俯之徒言尤確苦會髙霞寓戰却宰相揣帝厭兵欲赦賊以探上旨帝曰一勝一負兵家常勢若師常利則古何憚用兵耶今但論帥臣勇怯兵強弱措置如何渠可一敗便沮成計乎于是左右不能容其間斷然用一裴度卒能成平蔡之功臣碩陛下以剛大為心毋以小􅗮自沮察小人之意勿為浮議所搖敦遣中使慰勞將士且令解甲休息養鋭俟時大臣如裴度者益加委任以固其心勿使異議如錢徽蕭俯之徒得以肆其讒間况陛下今日之師為祖宗陵寢而舉為徽宗欽宗復讎而舉為二百年境土而舉與古之帝王好大喜功開邉生事者万万不同陛下隱之于心俯仰無怍小人異議亦何足恤哉投機而進知難而退側身修行任賢使能政事益加修軍旅益加治財用益加蓄以待天時人事之至可也顧在陛下斷之如何耳論休假劄子臣竊以今日邉事未靖正君臣相與有為日不暇給時也竊見朝廷尚循平時故事假故稍多有妨機務臣欲乞陛下未明坐朝日晏而退至放假故之日冝常御便殿不拘早晚引見宰執侍從臺諌群臣賜以從容訪問時務事有可採即時施行仍敕朝廷不可似常時作假宰執日入朝堂百僚各任其職庶幾事務不廢共致中興不勝幸甚論林安宅劄子臣聞口道先生語行如市人名曰盜儒此聖人之所必誅王法之所不赦也臣謹按前知臨安府林安宅者其盜儒之雄乎𥘉令越之新昌納官妓為妾則以濫聞及倅漳州盜郡將之權貪墨自恣則以贓聞及作廣漕起羅織之獄誣陷善良則以酷虐聞諂事鄊人朱倬倬令何溥薦之而得浙漕倬雖小人然于安宅有卵翼之恩及臺官張震欲論倬安宅乃手疏倬之隱惡數十事以示震倬之罪人皆可得而言也而安宅納之其與吕布事董卓而殺董卓何以異乎安宅出入史浩龍大淵之門其在都司也進則見浩退則見大淵天府之除不由正道物議咸鄙薄之有從何處來之語浩與大淵結為死黨及二人反目浩託安宅和之安宅既欲效勤於浩又欲獻侫于大淵遂造其室為奴顔婢膝之態士夫傳以為笑陛下比于經筵嘗語臣曰近臺諌論龍大淵事朕不私之已罷其職矣臣言陛下屈巳從諌以天下為公不私潛邱之臣社稷之福也陛下稱不私者至于再三今安宅乃自託于大淵之門以盜威福陛下且不私大淵其肯私其門下士乎安宅自知罪惡為清議所不容乃詐病以求致仕朝廷既以宫觀與之矣又用計以復留臣近嘗面奏其姦陛下即諭宰相令丐祠而去矣今又必欲朝辭兾僥幸復留之計動用姦謀以要君父不顧廉耻不知進退真小人之雄者也或謂安宅之才可以治劇然自知臨安以來𥘉不見其所長事無大小皆委於吏獄訟繁興而不能決盜竊公行而不能治議者謂不逮前政逺甚是豈可居彈壓之任乎陛下斷然罷之可謂能去惡矣為安宅者固宜皇懼朝聞命而夕即塗也乃復徘徊不去不知何所恃而取爾耶臣欲乞斷自宸衷正安宅之罪而竄逐之以為不知廉耻者之戒貼黃臣與安宅素無睚眥比因安宅奉史浩意旨毀省試䇿題及程文之版臣以公議責之即非私怨安宅聞陛下用臣為御史即欲求去蓋用姦計以鉗臣口臣前曰面奏其姦即蒙陛下罷而去之臣已不論列今聞安宅復求朝辭物議沸騰咸謂安宅倚恃奧援不顧公議故臣不得不論之碩出臣章示至公於天下再論林安宅劄子臣誤蒙親擢濫司風憲比嘗面奏前知臨安府林安宅姦邪交結等事陛下即諭宰相令安宅罷聀丐祠而去臣仰窺聖意既俯聽臣言得從諌如流之美又欲保全安宅使不繇彈劾而罷為安宅者固宜聞命即行又復乞朝辭兾姦計得施欲求再用臣昨條列其罪謂即賜施行今乃聞有旨令安宅內殿引見臣不勝皇懼之至切聞仁宗之時任用臺諌言及乘輿則天子改容事關廟廊則宰相待罪臣今論一小人而不能使其知畏尚何面目居風憲之地耶安宅前日聞陛下用臣為臺官即詐為風疾以求致仕既巳得祠命下復止罔上要君尤足以見其姦詐今冝即去而復乞朝辭未有班次而遽得內引是前日之姦計復行也臣切見近日執政臺諌以疾求去者皆放朝辭安宅何人而得此隆眷異禮耶欲乞陛下深察安宅姦邪交結之罪亟賜竄逐以尉公議梅溪先生奏議卷第三梅溪先生後集卷第三詩某比緣職事朝拜􅑼宫瞻望松柏愴然悲涕遂成小詩崇觀升平主神遊在九霄稽山嗟葬禹寰海痛思堯天上仙宫别人問寶祚遙微臣望松柏魂思黯然銷鑑湖行蒼蒼涼涼紅日生蔥蔥􅓹􅓹佳氣橫鑑湖春色三百里桃花水漲扁舟行花間啼鳥傳春意聲落行舟驚夢寐胡牀兀坐心境清轉覺胡山有風味鑑中風物幾經春身在鑑中思古人禹迹茫茫千載後疏鑿功歸馬太守太守湖成坐鬼責後代風流屬狂客狂客不長家鑑湖惟有漁人至今得日暮東風吹棹回花枝照眼入蓬萊回首湖山何處是欵乃聲中畫啚裏禹廟歌君不見逢英雄吞四海血祀初期千萬載稽山水像棄長江􅊇泝波濤鬼無餒鳥喙辛勤十九年平吳霸越世稱賢故國無人念遺烈山間廟貌何凄然馬守開湖利源逈歲沃黃雲九千頃年來遺迹半湮蕪廟鎖湖邉篆煙冷吳越國王三節還盡將錦繡褁江山自從王氣熄牛斗廟比昭王屋一間乃知流光由德厚祀典誰能如夏后九年洪水滔天流下民昏墊堯心憂帝懼萬國生魚頭錫禹洪範㝎九州功成執玉朝冕旒奔走訟獄歸歌謳南巡會稽覲諸侯書藏神穴千丈幽蟬脫塵寰不肯留千古靈廟依松楸吾皇盛德與禹侔菲食卑宫惡衣裘思禹舊績祀事修小臣效聀躬薦羞仰瞻黻冕懷逺猷退惜分隂慙惰偷嗟乎越山髙兮可夷而丘鑑湖深兮可埋而疇惟有禹貢聲名長不杇告成世祀無時休道觀名告成與趙安撫乞疏嶽小麥青青大麥熟秧老𣣔移蠶𣣔簇皇天彌旬作淫雨害及農桑一何酷麥枯秧腐蠶不絲無食無衣豈能育使君今世賢方伯政過龔黃同舜牧僦金蠲放官與私喜氣勸聲傾比屋仁風已慰黎庶心誠感蒼穹理宜速胡為蒸泄尚如許隂沴干陽埋日轂豈惟泥濘困牛車更恐魚龍上平陸閭閻競晝指日蠻香火遙祈上天竺傷和無乃有冤民蠧政尚疑多大族使君有術開青天按劾姦贓疏滯獄次韻濮十太尉詠知宗牡丹七絶憶昔洛陽花盛日品第况逢歐六一姚黃一品價無雙更有左花千葉密月陂春色滿花枝國色天香照雪肌當日栽陪恐無地如今誰保舊園池開元往事感傷中遺種猶餘一擫紅借問通宵配妃子何如及早念姚崇春色遙興洛陽念風俗聊於記中驗今日苧羅山下魂猶向人間吐妖艷地近堯天饒雨露花王窈窕多風度書生不辦買花錢空解搖毫為花賦香苞初拆曉霞凝甲第名園冠紹興玉葉金枝老詩伯更將好語為褒稱造化無私處處芳家山想見亦春藏無端竊祿身為客孤負吾廬十八香送僧遊徑山潛澗家風不蕪沒禪講詵詵盡瓜葛如今更有竒兒孫雲水飄然繼衣鉢徑山禪伯僧中龍向來名節真無雙我昔題詩已推許兩度相逢不曽語子今此行真得師掃除妄想叩深機我待衣冠挂林下遲子歸來話瀟灑三月晦日邵憲大受宴僚屬于西園某與焉趙提幹濬即席賦詩次韻送春開宴種山西翠幄重重眼界迷一假清和人共物十分幽勝地臨溪鴛鴻曲水閣中集嬰燕落花枝上啼賢榻獲陪文字飲不嫌蹤迹間雲泥送昌齡弟還鄉兼簡夢齡束書千里赴王畿戰藝賢關事偶違鑑水天高鴻雁集左原山逺鶺鴒啼夜牀風雨客情惡春草池塘詩思飛勉力還家對燈火待看雙桂擢秋闈時二弟赴補偶遺昌齡還鄉夢齡留赴糶米行詔書發凛周飢荒使君減價糶黃梁奉行上意固已良小人用心胡不藏斗米大半雜以粳橫索民錢名貼量怨語嗷嗷盈道傍我慙寸祿偷太倉見之不言咎誰當言之人指為輕狂作詩聊語同舍郎送會稽林簿日華棄官還鄉望秦秦望山蒼蒼未秋先作歸意濃三山深處孟園好林簿家有孟園松菊恨君歸不早拂衣高舉追冥鴻不將詩别乖崖翁年來處士徑尤捷美秩清資等間躐君獨高歌慕隱侖林下何曽見一人芋魁豆飯吾亦有深愧折腰貪五斗戊辰歲嘗和韓退之贈張徹詩寄曺夢良至今十年夢良方和以寄因贈一絶𣣔識交情久逺期十年方和和韓詩他時更踐詩中語偕隱溪山不可遲某舊詩云有溪山昔隱風雨無獨聽送趙可大如浙西幕府遊從盛一時之人襟宇更瑰竒西風莫作魲蓴戀越國江山日要詩中秋賞月蓬萊閣呈同官中秋玩月小蓬萊風送嬋姢入座來樽爼論文清有味湖山照眼淨無埃雲生腳底蛟龍卧影落人間鼓角催時方見月鼓角聲動把酒問天兼問月何時此夜更銜杯中秋見月方以為喜既而隂蔽意殊不滿東坡云良天佳月即中秋不以日月斷也諸君有醵會之約復用前韻中秋玩月小蓬萊雲掩清光不放來頗覺襟懷增梗概𣣔憑欄檻掃氛埃清宵忍放嘉賓散明日還驚俗務催底用區區校時節良天佳月即傾杯記夢九月初四夜夢待先人遊家之南觀田園闢徑於杉林之間昌齡弟亦侍其側指杉徑云此異日歸去來之路也覺而思之杉徑者三徑也淵明之事先君默啓之矣書以記之夜夢隨先君梅溪䇿黎杖杉徑早開闢歸休預標榜魂思驚曉醒精神發秋爽披衣照孤燈灑涕書惚恍士人僧道俱贈岩桂岩桂來三家清標共秋風聮芳近禹穴擢秀疑蟾宫膽瓶金粟妍鼻觀天香通無心妄區别妙契將無同府吏有以老求退者詢其年猶未六十詰其去之由云𣣔全身避禍耳豫善其知機勇退可以愧嗜進之士夫有感而作升高蝜蝂墮粘璧蝸牛枯措紳鴆梁肉是亦蝸蝜徒抽身箠楚中勇退愧此胥衣冠與刀筆未可分賢愚觀習水勝漢武英雄思拓邉昆明習戰遺風傳吾皇仁心異武帝思患姑為預防計尓曺生長行伍間操舟習水便冝間異日捐軀宜報國勿效水烏為盜賊世之善水勝者多為盜竊目日水者烏龍瑞道士贈岩桂岩桂遙從禹穴來天香全似月宫栽金風凄峭飄龍腦想見吾廬爛熳開九日登蕺山九日同登古蕺山眼明天濶興清間杯傳但覺歡無盡帽落俄驚鬢已斑鄉思遙馳三徑裏秋聲近在八松間茱茰未許陪朝士賴有清流數往還夢齡九日有詩兼懷昌齡次韻長記去年今日好門外秋香噴沉腦弟兄鄰里同登髙把菊行觴樂非少山殽海錯鄉味佳銀瓶索酒不用賖醉中不記脫巾卧明日頭上猶黃花今年豈不𣣔行樂竊祿東州官事束那堪送酒無白衣旋糶黃梁買枽落同如與子俱休休誰能長抱離鄉憂移書問訊惠連弟三徑許我歸來不余前此有歸興昌齡以為不可數以書來相勉故及之贈莊童子名大成福州人日誦千言七歲兒方員動靜早能知還家更讀韓公序器業他年必大竒送朱丞一片秋懷似亂雲不堪行客話離群紅蓮緑水尚留我巨竹老槐深憶君千里從今遙共月一樽何日更論文好將平昔家傳學勉力登朝立世勳朱故丞相之子贈夢齡兼懷昌齡我緣竊祿寓東州子亦相從千里遊鐡硯功名壯心在短檠燈火夜窗幽治書朝錯宜登第射䇿公孫定取侯他日三人老兄弟結廬相共保松楸和夢齡十月朔日書懷歲事遽如許玄冥威𣣔伸地爐猶未火客坐况無茵日短驚瞻昴天寒怯報寅豫每以五更趍府而性尤佉寒尤憐對牀弟尚與短檠親贈喻叔竒縣尉叔竒攝職會稽公事之暇必訪僕於民事堂終夕論文欣然相得輒成小詩見意同舍同年友天資逈不群詩文侵晉宋兄弟類機雲梅市訪仙侣蘭亭懷右軍叔竒嘗集蘭亭亭作詩五絶公餘時過我無酒亦論文贈王吉老縣尉王吉老眇然一書生也能手斬凶人以報母讎申冤請罪自投于府識與不識莫不壯之東嘉王某作詩以紀其事好事君子必繼有發揚之者臣子大節孝與忠父母仇讎天不同賢哉會稽王孝子感槩有古烈士風松楸一夕盜破冢親獲鼠輩聞之公有司守法貸其命孝子銜恨無終窮誰謂書生膽如許貌若尫羸中甚武手斬凶人提髑髏請死申冤詣公府君不見齊襄內行世所羞春秋賢之緣復讐又不見子胥鞭尸報父怨太史為之作佳傳君今枕戈志已伸更須移孝為忠臣他年當作傳介子誓斬樓蘭雪國耻十月望日買菊一株頗佳秋去菊方好天寒花自香深懷傲霜意那肯媚重陽菊晚不害好固宜登我堂書生自頭白奚用泣馨香聞詩生日十月卜六日良天逢十月嘉節過三元汝父初生子聞詩吾長子也吾親喜抱孫長成今若許氣習有餘溫雁序自相友麟經可與言志宜存逺大學必探淵源伹務勤修德年齡不用論十月十六日𣣔與夢齡弟及聞詩聞禮同遊蘭亭仍約喻叔竒偕行會天氣不佳喻亦以疾辭出門而止兀坐終日懷抱殊惡我𣣔遊蘭亭天氣殊不佳同行感微恙杖屨不可偕出門興遽闌兹遊竟未諧遺文閲永和聊用慰此懷和喻叔竒集蘭亭序語四絶我自扁舟入越初蘭亭巳向夢中如崇山峻嶺至今阻唱和詩成無處書前日具筆硯治詩牌竟不成往群賢少長畢經過曲水流觴憶永和一代風流已陳迹世殊事異感傷多晤言一室許誰親相過無非我輩人放浪形骸嗟老矣仰觀宇宙尚艱辛茂林修竹未成往遊目騁懷聊自欣暢敘幽情有齊契一觴一詠細論文和韓退之晚菊贈喻叔竒嘉菊何太晚十月才黃花既晚好何益三嗅良可嗟開日乃佳節芳樽對年家今夕苟不飲如此黃花何夜讀書于民事堂意有所感和韓公縣齋讀書韻宦遊寓幕府幽懷屬山林兀坐窗几間默求聖賢心沉潛偶會意嘆息常彌襟丗塗豈能騖古道聊自斟神穴思𣣔探丹書未容尋青銅每自照白髮已見侵事業浩無窮筋力愧不任丈夫固有志寧在官與金李資深贈古瓦硯及詩世貴銅雀硯常患偽亂真千金買渴雀虛名何足珍李生心好古身困道不貧得此佳陶泓製由萬道人殷勤持贈我器古詩清新置之窗几間日與毛頴親未能草太元姑用注獲麟羅文及端𬗋貴幸無比倫屈爾居蓬窗與我同艱辛研磨媚權貴揮染勞精神兹我所不敢銘以書諸紳喻叔竒惠川墨子墨客卿來自蜀繡川家藏尤不惡明窗研磨出珠玉客卿於君德良渥嗟豫經年客蓮幕交絶方兄澀囊槖文房諸子亦蕭索同年於豫契非簿特遣卿來助豫學不才拜賜心愧怍客卿之意殊不樂陶泓毛頴登臺閣陳玄待詔同著作卿從豫遊失所託惟清惟靜惟寂寞但有詩篇日酬酢戴夫人挽詞同年姚筠教授母勤儉肥家福亦肥晚年門户更光輝滿庭蘭玉俱藍袖照眼雲仍盡綵衣方外客携因果去月中人折桂枝歸回頭往事夢幻影丹旐五雲原上飛和趙可大四絶僧居岑寂異官居索句搜腸撚斷鬚那更雨中思底事夢魂歸到種山隅右僧舍雨中杜宇聲中春𣣔歸少陵老淚不禁揮與君共𬒳浮蝸誤不似淵明早見機右聞子規唾手科名尚少年無窮事業更居前辛勤不寐思經意却笑邉韶好晝眠右不寐萬壑千岩擁越岡朝陵追念舊天王自嗟無路攀弓劒尚忍興言及虎狼右朝永祐陵送黃機宜遊四明名子魯遊宦東州識老成坐間談笑欲風生人如元祐氣尤直詩不江西語自清雪棹非緣尋舊隱夜牀端欲對難兄行聞太史奏星聚四皓聮珠臨四明黃兄弟四人皆皓首號所居曰橘隱堂盧仁及縣丞挽辭妙齡才譽冠東嘉百戰功成暮景斜人在盧前有慙色禮從戴後獨名家藍田美績誰能記綘帳竒兒最可夸鄉里搢紳官業冷因公淪落倍興嗟贈術者枉道貴何益正塗窮亦榮誰辭談義命試問小君平遊天依寺拂曉藍輿出蠡城稽山照眼鑑湖明千岩深處十峯好萬壑流中雙澗清香靄噓成普賢像風松吹作法華聲靈烏不肯來城郭長伴高僧避寵榮次梁尉韻探春連騎入山城更喜梅仙亦會盟梁後至文字偶同吾輩飲聖賢滿為使君傾安撫尚書以僚屬遊山送酒六十樽諸公自山中回晚集于教授廳為文字飲詩逢好境天然好山為清流分外清瀟灑宗之最年少我慙叨預八仙名梁最年少酬陸宰用梁尉韻收拾湖山付管城士衡獨步張文盟湧泉詩思逼人徢屑玉笑談終席傾天色亦緣吾輩好路人能道長官清要令巧匠鐫山骨記取同行八士名和喻叔竒遊天依四十韻稽山高八雲鑑湖濶浮空禹秦有餘迹晉宋多巨公我來歲及周夢寐懷清風兹欣天氣佳扶桑欲曈曨駕言天衣遊盍簮盡鴛鴻經夕戒行李如期集仙宫早會于天長觀聮騎出城南行行指秦峯千岩競吐秀眼界清無窮招提在何許十里松隂濃林端忽鍾磬與客為先容群簮擁花界雙佩鳴寒空試將比天台大略如思豐天台國淸山水秀絶有思豐堂尤可觀覽首讀邑浩碑妙理開昏蒙細觀元白詩丘壑羅胸中蕭璧尚堪靣寺有靣璧二大字梁薪幾經烘寺有梁時薪火見李公埀詩兹宫現有相禪客談無同朝陽最嶄絶白雲抹其胸朝陽峯最竒杜鵑天下無至今映山紅雞僧始開山道業聞清衷思舉照不起高價傾江東袈裟縷黃金宫女自針工昭明親抱送禮意何太恭白馬忽渡江臺城喪英雄國破遺衣在丹青落塵容寺舊有梁昭明太子畫像我輩皆書生意氣飄如虹蠟屐共尋幽寧求香火功載酒懷賀老招隱思戴顒賦詩效吹臺一飯敢不忠况我賢使君德宇尤踈通楚醴餉百榼白衣走山中嗟余何為者天資愧倥侗謬與酒中仙偶同蕺山松蕺山有八松同年妙詞章况有山水供古詩如古琴山髙水溶溶背囊小奚奴捧硯長鬚僮叔竒題名勝遊與佳作二美今具逢品題遍群英波瀾及孤蹤掬水弄華句比擬何凡庸掬水月在手弄花香滿衣乃于良史遊天衣寺詩也兹會如蘭亭同行類荀龍盛事在詩史奚用呼畫工梅溪先生後集卷第三梅溪先生文集卷第三詩送元範赴省清峭霜天振羽翰共觀一鶚氣軒軒願將柱腹書千卷盡作憂時䇿萬言請繫單于同太傳不阿人主異公孫龍頭素是君家物又見傳呼賈狀元國朝賈黯賈安宅皆狀元送劉政孫蚤歲聲蜚舍法中漕臺前日始收功辛勤半世虀鹽學慷慨平生畎畝忠作佛肯居靈運後登仙更與阮郎同瓊林宴罷遊天祿太一然藜定照公送劉全之綵衣堂上別慈顔匹馬楊鞭指帝關千里清風生腋下十分黃氣滿眉間手探春信尋梅去袖帶天香折桂還定向蓬萊燕仙侣為言子晉在江山前詩送三鄊文行雖各獻芹然非所以勉子大夫茂明大對之意更為古詩一章逆胡殘喘仍跳梁中興事業猶渺茫當今取士異平日非為故事開科埸廟堂方諱口打賊翻抵正論為猖狂紛又兒輩茍冨貴妄引申伯深阿王公孫老儒亦曲學不敢正色言堯湯徒令天下慷慨士肝膽一劒生光芒前年胡公以言逐言今已驗官未復近日徑山緣賦詩裏頭衣白投荒服忠良自此多結舌道路相看徒以目誰能言事如靖康陳東巳死歐陽戮國家飬士恩至渥干戈不廢菁莪育諸公報國當如何莫把剛腸慕粱肉丈夫一第何足道幸勿以此存懷抱賈生當獻太息流涕痛哭書更施三表五餌請為屬國繫單于大劉小劉展盡畎畝惓又忠洪恭石顯輩視之當與奴僕同詠桞東君于此最鍾情粧點村村入畫屏向我無言眉自展與人非故眼猶青縈牽别恨絲千尺斷送春光絮一亭葉底黃鸝音更好隔溪煙雨醉時聽次韻潘先生寒食有感花媚韶光桞弄煙簫聲處處賣餳天誰知子厚懷桑梓北望長號又一年無賴楊花趂暖風旅中節物與愁逢一聲杜宇啼春怨知在花梢第幾重人間寒食幾經年甲子誰能記後先且盡一杯藍尾酒莫將身事惱生前悼僧德芬身著方𫀆十一年緇林頭角稍軒軒參禪早悟前三旨學道思歸不二門花落絮飛浮世盡風清月白片心存異時我作髙僧傳為記嚴公有此孫芬乃寶印弟子嚴闍梨法孫也妙齡蕭灑脫塵籠髙揖禪林話苦空萬水千山新道眼一瓶二鉢舊家風圓鏡肇論能知趣筆法詩章稍自工圎澤精魂定何所想隨流水到天童悼禪法師閣中髙隱歲華深龜鶴精神老不侵寶劒妙傳驅鬼術靈丹長有濟人心彌明石䁀方聮句洪景袈裟遽掩衾借問青牛何處去九天雲路杳難尋毛虞卿見過故人訪吾廬况是清和節髙槐緑成隂芳草碧未歇携手山間行清興浩然發呼童具雞黍濁酒醅初潑貧居愧荒涼野蔌草羅列盤實飣梅豆𬞞餐薦薇蕨主禮雖甚微客色未嘗觖醉翁山水意不為壼觴設蟹眼煎新汲雀舌烹春擷澆君文字腸掉我清談舌人生會面難歲月易飄忽君姑為我留匆匆莫言别讀孫子尚舊所寄書故人之書不易得片𥿄隻字皆可惜收拾永為巾笥藏縱得千金不碩易開緘展轉時一讀又未能終淚橫臆之人門地盛衣冠萬里家居帝王宅干戈繚繞飄吾鄉傾蓋論交似疇昔我年𥘉冠君猶少握手遊從沗聮璧金溪風月供醉吟君唱我酬常即席君詩句句清且新髙壓曹劉倒元白我才短淺何足論強伴寧容小生敵追風駿足橫海鱗暫困鹽車與汙澤掉頭一去不可尋南北茫茫煙水隔往年雁字時復傳近日詩筒杳難覔眼中不見故人面𥿄上空懷故人迹人生會合能幾回一别八年同瞬息我去無由君不來尊酒相逢更何夕宋彥才挽詞德著吾鄊月旦評丘園蕭散傲虗名𫀆雖不奪詩尤好秋不曽悲賦自清早挂儒冠知有命晚憑貝葉悟無生人間月落天池後定向維摩頂上行宋孺人挽詞劉方叔繼母晚歲歸來奉伯鸞力將勤儉濟艱難鹿車共挽甘從鮑㷱膽親調𣣔慕韓鏡裏玉容猶未老夢中銀漏忽驚殘通家賤子非房杜長記登門酒盡歡先君子去世五十日孤某入四友室覩平生遺迹哀號痛哭絶而復蘇既而書四十字以寄罔極之思先子神何在人亡迹尚存業餘經史案趣寄聖賢尊榻冷寧欹枕堂虗巳蓋棺晨昏徒泣血無路報深恩李府君挽詞利塗名路兩﨑􅋂甘向田園事陸沉一頃膏腴生計足四時香火佛緣深築門東海于公意教子燕山竇老心䘖涕為公銘隱德不緣諛墓𣣔黃金陳景公挽詞冠玉堂堂骨相竒起家消息露蓍龜齒牙不妄千金諾度量難窺萬頃陂車轍過門多長者箕裘傳業有佳兒西園新卜松楸地記得公顔向此怡公園有怡顔亭今葬其上先子於公分頗深晚年出處恨商參雖修北海通家好未遂香山會老心盡道吉人俱未艾誰知凶訃遽相尋三年落盡思親淚今日登門又滿襟次韻萬喬年李唐英二絶七賢林下共忘機更有新詩為發揮竹葉一尊添逸興董風吹散臉紅微黌舍炎炎畏月長竹亭取次納新涼文章風月須兼美莫使時人恨海棠送章生端武麟經絶筆今幾年學者異説何紛然操矛入室務相伐誰能浚井得美泉梅溪野人獨好古遺經獨抱期心傳從豫講論有趙陸得趣往往忘蹄筌章生妙齡固可畏聖經賢傳思窮研贏糧逺來若有意席未及暖俄言還豈厭先生紙上語奧境不見徒留連春秋明日遂東矣情鍾我輩徒拳拳送羅生少陸羅生黃山來從我梅溪遊齒髮最年少學問能自修短檠照深夜細字書蠅頭大業心𣣔潛遺編力旁搜新文有佳趣日進殊未休吾愧河汾翁子學常與收行將拭老眼万里看驊騮一葉下庭皋大火當西流遙望河陽雲俄登李膺舟交朋重惜别挽袖終不留吾腸百錬剛亦作繭緒抽籍也不吾叛尋盟定髙秋送茹生履燈火勤勞覺瘦生望雲心斷涕從橫賢關春信無多日手折梅花贈子行乙丑冬罷會呈諸友繆意開家孰微才愧斗筲雖逃有若叱寧免孝先朝尚賴知心友能全耐久交殷勤惜别意終日在梅梢江上遇夙二絶薄暮登舟海颶生短蓬欹側浪峥嶸江神正好憐行客莫待他時却世情弭棹乾門乾音干海上山名浪未平同舟太半巳山行自慙不是婁師德免葬江魚賴友生宿黃巖妙智院問訊開山始于今二百年徑幽微見竹社廢尚遺蓮觀頌思元老遊庵憶舊禪匆匆一宿客未盡滌塵緣院有內照庵趙清獻作頌軒名滌慮過黃巖三日離家客悠然覺路長梅花十里眼竹葉一杯腸詩思貪佳境眉頭憶故鄊江山看未足回首隔滄浪宿慶善寺剛𬒳篙工誤遲留一日裝川塗隔浩渺燈火亂昏黃呼僕回行李尋僧宿上方山前十里雪夜入夢魂香過天台目逆神仙路丹成未暇躋雪深封佛壠雲暗鎖桃溪流水無還有亂山髙復低𣣔尋劉阮洞歸路恐成迷過新昌杖屨登關嶺山行無住時客情渾在眼鄉思苦關眉石現金仙像溪蟠阮肇祠越山都幾點收拾上新詩觀石佛土木塗金巧逼真總隨浮幻化埃塵何人著意鐫山骨長現金剛不壞身戴溪亭髙士逃名隱此溪憑欄遐想獨徘徊不知吾祖乘舟後得得誰從雪裏來曹娥廟慟哭無尋處投江竟得尸風髙烈女傳名重外孫碑荒草沒孤冡洪濤舂古祠懷沙為誰死翻愧是男兒宿驛奧未是他鄉客思家已斷魂明朝春色好宿處近花村大芙蓉小芙蓉題靈峰三絶家在梅溪水竹間穿雲蠟屐可曽間雁山新入春遊眼却笑平生未見山洞中大士半千身住世端能了世因應笑玉簫峰下客馬蹄長踐利名塵三宿靈峰不為禪茶甌隨分結僧緣明朝杖屨丹丘去帶得煙霞過海船出鷹山三宿山中始出山出山心尚在山間浮名奪我林泉趣不及髙僧一味間關嶺遇雪路近剡溪春雪深此行有愧子猷尋毆馳千里爭蝸角孤負扁舟自在心過鑑湖誰把青銅鑄鑑湖湖光冷浸越王都東風二月西遊客買得扁舟入畫圖春水如天浪未生扁舟真在鑑中行漁人不問君王覔占得湖光亦自榮月夜獨酌月色撩人不忍眠杖頭獨挂百青錢一杯竹葉那能醉澆起鄊心更黯然太學寄夢齡昌齡弟東望家山幾斷魂白雲飛盡路漫漫須知太學虀鹽味不似親闈菽水歡事業未應孤鐡硯弟兄猶喜盡儒冠行飛直待秋風便好作排空鷹字看丁邜秋赴鹿鳴宴次太守趙殿撰韻食蘋開燕副招求夢草詩成寵士流要得異才聮虎榜亦容下客盜狐裘早修慧業欽靈運妄贊元經愧子遊刺史笑談風滿席定應吹拂到瀛洲赴省治裝有感記得離家桞未黃歸來三徑菊花香一年強半身為客席未遑安又趣裝再過鷹山三絶大龍湫龍大那容在此湫銀河得得為飛流好乘風雨昻頭角直到天池最上頭天柱峯女蝸石爛若為修四海咸懷𣏌國憂誰識山中真柱石擎天功業勝伊周天聰洞重華疑到此山中鑿石疏岩逹四聰端為草茅憂世士不教無路獻孤忠思歸窗外西風竹數竿秋聲終夜趣歸鞍吾廬此去八百里歸到家時天未寒别太學同舍二年客賢關傾蓋皆故人况我同舍郎何異手足親虀鹽共牢落燈火同悲辛坐覺歲月忘所賴朋友仁西風起天末淅瀝吹江蘋思歸適所碩惜别還霑巾祖席歌驪駒别腸轉車輪離索恐孤陋重來約新春戊辰閏八月歸臨安觀舊題修竹黃楊丁香慨然有感復書三絶于後吾家風物冨檀欒最愛青青耐歲寒千里歸來面蒼玉不煩時復報平安同日種松今合抱後來栽桞已參天笑看軒外黃楊樹我亦如君厄閠年蕙蘭憔悴菊萎秋葉底藏春巳數頭詩客不知花韻别却言空結雨中愁梅溪先生文集卷第三
